          setup: ["G1 DEBARRED at default clock 2026-08-01 for 1 year (ends 2027-08-01); WD1 PUBLISHED; J9 DRAFT referencing WD1"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
