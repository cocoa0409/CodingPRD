      - name: non_positive_interval_and_future_completion_date_return_invalid_date_range
        claim_type: error_triggerable
        grounds:
          - validations[priority=31]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: |
          The rule covers two distinct surfaces with one error_id. An assignment whose
          effective_to EQUALS its effective_from is rejected 422 ERR_INVALID_DATE_RANGE
          (strictly-after, so a zero-length interval is invalid even though it is not
          inverted), and a CE credit whose completion_date 2026-09-01 is after the clock
          instant 2026-08-01 is rejected with the same error; widening the interval by one day
          and back-dating the completion both succeed.
        test_recipe:
          setup:
            - "Originator 2200001 and one ACTIVE CompensationPlan at 105 bps (one permissible
               variable at weight 100, approved by officer-1)."
            - "One CE course CE-ETH-2 (ETHICS, 2 hours, approved everywhere)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /ce-courses"
              payload: { course_code: "CE-ETH-2", credit_hours: 2, category: "ETHICS" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { course_id: $.data.id }
            - call: "POST /compensation-plans"
              payload: { plan_name: "Retail Base 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Reg Z review complete." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v: $.data.version }
          trigger:
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", expected_originator_version: "${orig_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err1: $.data.error_id }
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${course_id}", completion_date: "2026-09-01T00:00:00Z", reporting_period_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err2: $.data.error_id }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-02T00:00:00Z", expected_originator_version: "${orig_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { plan_ok: $.data.compensation_plan_id }
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${course_id}", completion_date: "2026-08-01T00:00:00Z", reporting_period_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { cs: $.data.credit_status, cd: $.data.completion_date }
          assert:
            - "HTTP status is 422 on the zero-length assignment interval"
            - "${err1} == ERR_INVALID_DATE_RANGE"
            - "HTTP status is 422 on the future completion_date"
            - "${err2} == ERR_INVALID_DATE_RANGE"
            - "HTTP status is 200 on the one-day interval and ${plan_ok} == ${plan_id}"
            - "HTTP status is 201 on the credit completed at exactly the clock instant,
               ${cs} == APPLIED and ${cd} == 2026-08-01T00:00:00Z"

      - name: concession_one_cent_over_the_two_percent_cap_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=34]
          - errors[ERR_CONCESSION_EXCEEDS_CAP]
          - calculations.pricing_exception_net_impact
        distinguishing_aspect: |
          The cap is floor(locked_amount_cents * 2 / 100) = floor(20000000 * 2 / 100) = 400000
          and the comparison is "must not exceed": 400001 returns 422
          ERR_CONCESSION_EXCEEDS_CAP while exactly 400000 is accepted. The cap keys on
          locked_amount_cents, not on requested_amount_cents.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE sponsored CA licence and one loan LOCKED at
               20000000 cents (requested_amount_cents was also 20000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
