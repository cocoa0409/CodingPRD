          trigger:
            - call: "POST /membership/members/${ms2}/deployment-orders"
              payload: { orders_number: "ORD-601", theater: "EUCOM", start_date: "2026-12-01", end_date: "2027-03-01", scra_eligible: false, expected_member_version: "${ms2_v2}" }
              as: VerificationOfficer
