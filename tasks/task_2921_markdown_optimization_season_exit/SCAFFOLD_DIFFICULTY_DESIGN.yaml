          assert:
            - "DispositionOrder.${disp1_id}.status == CANCELLED, a terminal state, and approved_by_user_id remains ctl-1"
            - "DispositionOrder.${disp1_id}.projected_recovery_cents == 60000 and settled_units == 0 and settled_recovery_cents == 0"
            - "Item.${item_a_id}.units_committed_disposition == 0 immediately after the cancel, and on_hand_units == 343 (cancel never moves inventory)"
            - "Item.${item_a_id}.units_disposed_total == 0, markdown_state == FULL_PRICE and lifecycle_stage == CLEARANCE (R1 does not fire because nothing was disposed)"
            - "The second trigger call returns HTTP 201, proving all 343 units were freed: DispositionOrder.${disp2_id}.units == 343 with projected_recovery_cents == 102900"
            - "Item.${item_a_id}.units_committed_disposition == 343 after the re-allocation, so item_available_units is 0"
            - "GET /disposition-orders?item_id=${item_a_id} returns total_count == 2"
