      trigger:
      - 'POST /registrations {"qualifier_id": "${qa_id}", "registration_kind": "GUEST", "guest_of_registration_id":
        "${ra_id}", "arrival_date": "2026-11-08T00:00:00Z", "departure_date": "2026-11-13T00:00:00Z",
        "rooms": 1, "expected_program_version": <current>} as TravelDesk td-01 — Ana''s first guest.'
      - The same call again — Ana's second guest.
      - The same call shape for "${qc_id}" with guest_of_registration_id "${rc_id}" — Cara's first guest
        on a zero-allowance tier.
      - The same call shape for "${qb_id}" with guest_of_registration_id "${ra_id}" — Ben linked to Ana's
        winner row.
      - The same call shape for "${qa_id}" with guest_of_registration_id omitted entirely.
      - The same call shape for "${qa_id}" with guest_of_registration_id pointing at the GUEST row created
        by the first probe.
      - 'POST /registrations for "${qb_id}" with "registration_kind": "WINNER" and "guest_of_registration_id":
        "${ra_id}".'
      assert:
      - 'Ana''s first guest returns 201 with registration_kind "GUEST", qualifier_id ${qa_id}, guest_of_registration_id
        ${ra_id}, attendance_status "INVITED" and rooms 1: PLATINUM''s guest_allowance 1 permits exactly
        one.'
      - Ana's second guest is rejected with ERR_GUEST_ALLOWANCE_EXCEEDED and HTTP 422 — the count of non-CANCELLED
        GUEST registrations would become 2 against an allowance of 1.
      - Cara's first guest is rejected with ERR_GUEST_ALLOWANCE_EXCEEDED and HTTP 422 from an identically
        shaped request, because her assigned BRONZE tier has guest_allowance 0. A hard-coded "one guest
        per winner" implementation passes the Ana probes and fails here.
      - 'Ben linked to Ana''s winner row is rejected with ERR_GUEST_LINK_INVALID and HTTP 422: the target
        must be a WINNER registration OF THE SAME qualifier_id.'
      - The GUEST row with no guest_of_registration_id is rejected with ERR_GUEST_LINK_INVALID and HTTP
        422 — the link is mandatory for guests, and this is not reported as a plain schema error because
        the field is optional in the endpoint's input list.
      - 'The GUEST row pointing at another GUEST row is rejected with ERR_GUEST_LINK_INVALID and HTTP
        422: the self-reference must terminate at a WINNER, so guest chains are impossible.'
      - The WINNER row carrying a guest_of_registration_id is rejected with ERR_GUEST_LINK_INVALID and
        HTTP 422 — the rule constrains both kinds, requiring the link to be absent or null on winners.
      - 'GET /registrations?program_id=${p_id} returns total_count 3 at the end (two WINNER rows and one
        GUEST row): none of the six rejected requests persisted anything.'
  - name: cascading_validation_on_activity_signup
    claim_type: cascading_validation
    grounds:
    - §1.4 priority 16 ERR_ACTIVITY_WAIVER_REQUIRED
    - §1.4 priority 24 ERR_ACTIVITY_TIME_CONFLICT
    - §0.5 priority_pair_validation_conflict
    distinguishing_aspect: |
      The cascading-validation pattern needs a check whose result depends on another check having
      run first. On POST /activity-signups the HIGH-risk waiver gate at priority 16 must be
      settled before the buffered agenda-overlap scan at priority 24, because the overlap scan
      walks the participant's existing signups and would otherwise report a conflict for a
      participant who is not eligible to hold any signup at all. That exact ordering pair is
      already designed in §1.8.
    excluded_because:
      difficulty_instance: activity_waiver_safety_check_precedes_transfer_buffer_temporal_check
      rationale: |
        That §1.8 instance submits one signup violating both rules and asserts ERR_ACTIVITY_WAIVER_REQUIRED, then signs the waiver and re-submits to surface ERR_ACTIVITY_TIME_CONFLICT from the same request, which is precisely the "B runs before A"
        demonstration this claim type asks for.
