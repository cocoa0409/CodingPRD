        - call: GET /sourcing/proposals
          payload: {rfp_id: '${rfp1_id}', venue_id: '${v1_id}'}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {p1_id: '$.data[0].id'}
        - call: POST /sourcing/proposals/${p1_id}/submit
          payload: {room_rate_usd: 249.0, rate_type: NET, commission_pct: 0.1, room_nights_offered: 600, comp_room_ratio: 45, resort_fee_usd_per_night: 18.0, service_charge_pct: 0.24, tax_pct: 0.156, av_estimate_usd: 22000.0, fnb_minimum_usd: 115000.0, concession_credit_usd: 25000.0, attrition_allowance_pct: 0.2, cancellation_schedule: [{days_before_arrival_min: 181, fee_pct: 0.25}, {days_before_arrival_min: 91, fee_pct: 0.5}, {days_before_arrival_min: 31, fee_pct: 0.75}, {days_before_arrival_min: 0, fee_pct: 1.0}], force_majeure_scope: STANDARD, rebooking_credit_pct: 0.6}
          as: VenueRep
          as_user_id: ${v1_id}
        - call: POST /sourcing/rfps/${rfp1_id}/close
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
