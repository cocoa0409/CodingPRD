      - name: result_post_requires_event_live_not_scheduled
        grounds:
          - state_machines.Event.LIVE_to_SETTLED
          - entities.Event.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Different entity pair Event-result→Event-status: POST /events/{id}/result
          requires Event.status==LIVE; posting a result while the event is still
          SCHEDULED returns ERR_INVALID_STATE — the result transition depends on
