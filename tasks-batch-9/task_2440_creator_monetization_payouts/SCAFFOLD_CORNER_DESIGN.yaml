      - name: creator_cannot_rate_content_or_decide_its_own_appeal
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[Creator].description"
          - "roles[PolicyReviewer].exclusive_operations"
        distinguishing_aspect: "The creator may open an appeal on its own item but is 403 on rate, start-review and decide, so contesting a decision and making one are separated even inside the creator's own subtree."
        test_recipe:
          setup: ["One creator whose content item was rated RED by pr_rate_1, leaving it DEMONETIZED, with one SUBMITTED appeal filed by the creator."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr}", title: "Launch Vlog", published_at: "2026-08-01T00:00:00Z" }
              as: Creator
              as_user_id: "${cr}"
              captures: { ci: "$.data.id" }
            - call: "POST /monetization/content-items/${ci}/rate"
              payload: { suitability_rating: "RED", rating_source: "MANUAL" }
              as: PolicyReviewer
              as_user_id: "pr_rate_1"
            - call: "POST /monetization/appeals"
              payload: { content_item_id: "${ci}", requested_rating: "GREEN", statement_text: "The footage is licensed and I hold the invoice." }
              as: Creator
              as_user_id: "${cr}"
              captures: { ap: "$.data.id" }
          trigger:
            - call: "POST /monetization/content-items/${ci}/rate"
              payload: { suitability_rating: "GREEN", rating_source: "MANUAL" }
              as: Creator
              as_user_id: "${cr}"
