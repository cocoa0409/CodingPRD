# =============================================================================
# PRD Benchmark Scaffold — Pet Food Manufacturing & AAFCO Labeling
# Co-manufacturer system: formula & nutrient adequacy basis, supplier approval,
# lot-coded production, guaranteed-analysis verification, feeding-trial vs
# formulation substantiation, state registration & label review, complaint /
# adverse-event intake with recall trigger, private-label co-manufacturing.
# =============================================================================

scenario: |
  Pet Food Manufacturing & AAFCO Labeling (pet food co-manufacturer): formula &
  nutrient adequacy statement basis, ingredient sourcing & supplier approval,
  batch production & lot coding, guaranteed analysis testing vs label, feeding
  trial vs formulation substantiation, state registration & label review,
  complaint/adverse-event intake & recall trigger, co-manufacturing for private
  label

domain_name: "pet-food-aafco-labeling"
api_prefix: "/petfood"

# ---------------------------------------------------------------------------
# Step 0: Complexity profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response envelope (FIXED)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table (15 entities)
# ---------------------------------------------------------------------------
entities:
  - name: BrandOwner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the private-label brand owner", constraints: "non-empty, max 200 chars" }
      - { name: fein, type: string, source: input, description: "Federal employer identification number", constraints: "9-digit string, unique across all BrandOwner rows" }
      - { name: contact_email, type: string, source: input, description: "Primary regulatory contact email" }
      - { name: status, type: enum, source: system, description: "Lifecycle state of the brand-owner account", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: open_recall_count, type: integer, source: computed, description: "Count of RecallAction rows linked to this brand's formulas whose status is not CLOSED", default: 0 }
      - { name: complaint_score, type: number, source: computed, description: "Rolling weighted complaint score computed by complaint_risk_score; drives registration holds", default: 0 }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_name, type: string, source: input, description: "Trading name of the ingredient supplier", constraints: "non-empty, max 200 chars" }
      - { name: fsma_facility_id, type: string, source: input, description: "FDA food-facility registration number", constraints: "unique across Supplier rows" }
      - { name: country_code, type: string, source: input, description: "ISO-3166 alpha-2 country of the supplying facility" }
      - { name: approval_state, type: enum, source: system, description: "Qualification state of the supplier", default: PROVISIONAL, constraints: "PROVISIONAL | APPROVED | SUSPENDED | DISQUALIFIED" }
      - { name: risk_tier, type: enum, source: input, description: "Inherent risk tier assigned by QA", constraints: "LOW | MEDIUM | HIGH" }
      - { name: approved_ingredient_count, type: integer, source: computed, description: "Count of SupplierIngredientApproval rows in APPROVED state for this supplier", default: 0 }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: aafco_name, type: string, source: input, description: "Official AAFCO-defined ingredient name as it must appear on label", constraints: "unique across Ingredient rows" }
      - { name: ingredient_code, type: string, source: input, description: "Internal 8-char ingredient code", constraints: "unique, uppercase alnum" }
      - { name: nutrient_matrix, type: object, source: input, description: "Typical nutrient contribution per kg as-fed: keys are AAFCO nutrient codes (e.g. CRUDE_PROTEIN, CRUDE_FAT, CRUDE_FIBER, MOISTURE, CALCIUM, PHOSPHORUS) mapped to numeric fraction or kcal/kg", constraints: "fractions in [0,1], moisture mandatory" }
      - { name: allergen_class, type: enum, source: input, description: "Dominant allergen class for change-control flagging", constraints: "NONE | POULTRY | BEEF | FISH | DAIRY | GRAIN | OTHER" }
      - { name: requires_coa, type: boolean, source: input, description: "Whether every receiving lot must carry a certificate of analysis", default: true }
      - { name: status, type: enum, source: system, description: "Lifecycle state of the ingredient master", default: ACTIVE, constraints: "ACTIVE | RETIRED" }

  - name: SupplierIngredientApproval
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplying facility under review" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; the ingredient this approval covers" }
      - { name: approval_state, type: enum, source: system, description: "Qualification state of this supplier+ingredient pairing", default: PENDING_REVIEW, constraints: "PENDING_REVIEW | APPROVED | REJECTED | REVOKED" }
      - { name: coa_document_ref, type: string, source: input, description: "Reference to certificate-of-analysis document presented for review", constraints: "required when Ingredient.requires_coa is true" }
      - { name: review_notes, type: string, source: input, description: "QA reviewer free-text notes", default: "" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the QAApprover who made the latest decision; used for segregation-of-duties checks" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of the latest APPROVED/REJECTED/REVOKED decision" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: brand_owner_id, type: string, source: input, description: "FK -> BrandOwner.id; private-label brand this formula is manufactured for" }
      - { name: formula_code, type: string, source: input, description: "Brand-scoped formula code", constraints: "unique within (brand_owner_id)" }
      - { name: product_name, type: string, source: input, description: "Marketing product name printed on label" }
      - { name: species, type: enum, source: input, description: "Target species", constraints: "DOG | CAT" }
      - { name: life_stage, type: enum, source: input, description: "AAFCO life-stage claim", constraints: "GROWTH | ADULT_MAINTENANCE | ALL_LIFE_STAGES | GESTATION_LACTATION" }
      - { name: adequacy_basis, type: enum, source: input, description: "Substantiation pathway for the nutritional adequacy statement", constraints: "FORMULATION | FEEDING_TRIAL" }
      - { name: status, type: enum, source: system, description: "Formula lifecycle state", default: DRAFT, constraints: "DRAFT | NUTRIENT_REVIEW | SUBSTANTIATED | LOCKED | SUPERSEDED | WITHDRAWN" }
      - { name: revision_number, type: integer, source: system, description: "Monotonic revision counter; starts at 1, incremented on every REVISE loop", default: 1 }
      - { name: parent_formula_id, type: string, source: input, description: "FK -> Formula.id; optional self-reference — set when this row is a revision of an earlier formula", default: null }
      - { name: substantiation_locked_version, type: integer, source: system, description: "Version of the linked substantiation object (NutrientProfile or FeedingTrialProtocol) pinned at SUBSTANTIATED time", default: null }
      - { name: total_batch_count, type: integer, source: computed, description: "Count of ProductionBatch rows for this formula", default: 0 }
      - { name: open_recall_flag, type: boolean, source: computed, description: "True iff any RecallAction linked to this formula is not CLOSED", default: false }

  - name: FormulaIngredient
    parent: Formula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; the parent formula" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; the included ingredient" }
      - { name: inclusion_pct, type: number, source: input, description: "Inclusion rate as percentage of total batch mass", constraints: "0 < inclusion_pct <= 100; sum over a formula must equal 100.00 +/- 0.01" }
      - { name: processing_note, type: string, source: input, description: "Free-text processing instruction", default: "" }

  - name: NutrientProfile
    parent: Formula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; the formula this profile quantifies" }
      - { name: profile_basis, type: enum, source: input, description: "How the profile numbers were obtained", constraints: "FORMULATION_CALC | LAB_ANALYSIS" }
      - { name: crude_protein_min_pct, type: number, source: input, description: "Guaranteed minimum crude protein percent as-fed" }
      - { name: crude_fat_min_pct, type: number, source: input, description: "Guaranteed minimum crude fat percent as-fed" }
      - { name: crude_fiber_max_pct, type: number, source: input, description: "Guaranteed maximum crude fiber percent as-fed" }
      - { name: moisture_max_pct, type: number, source: input, description: "Guaranteed maximum moisture percent as-fed" }
      - { name: calcium_min_pct, type: number, source: input, description: "Guaranteed minimum calcium percent as-fed", default: 0 }
      - { name: phosphorus_min_pct, type: number, source: input, description: "Guaranteed minimum phosphorus percent as-fed", default: 0 }
      - { name: metabolizable_energy_kcal_per_kg, type: number, source: computed, description: "ME computed by me_calculation from the nutrient matrix (modified Atwater)" }
      - { name: aafco_compliance, type: enum, source: computed, description: "Computed verdict of this profile against the AAFCO nutrient profile for the parent formula's species+life_stage", default: PENDING, constraints: "PENDING | COMPLIANT | DEFICIENT" }

  - name: FeedingTrialProtocol
    parent: Formula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; formula under trial (adequacy_basis must be FEEDING_TRIAL)" }
      - { name: protocol_code, type: string, source: input, description: "AAFCO protocol identifier", constraints: "unique across FeedingTrialProtocol rows" }
      - { name: animal_count, type: integer, source: input, description: "Number of animals enrolled", constraints: ">= 8 for adult maintenance protocols" }
      - { name: duration_days, type: integer, source: input, description: "Planned trial duration in days", constraints: ">= 26 for adult maintenance" }
      - { name: status, type: enum, source: system, description: "Trial lifecycle state", default: PLANNED, constraints: "PLANNED | ENROLLING | RUNNING | ANALYSIS | PASSED | FAILED | ABORTED" }
      - { name: enrolled_count, type: integer, source: system, description: "Animals actually enrolled; incremented by enrollment events", default: 0 }
      - { name: completed_count, type: integer, source: system, description: "Animals completing without disqualifying event", default: 0 }
      - { name: completion_ratio, type: number, source: computed, description: "completed_count / animal_count, 4 decimal places" }

  - name: ProductionBatch
    parent: Formula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; formula being manufactured (must be LOCKED)" }
      - { name: planned_kg, type: number, source: input, description: "Planned batch mass in kilograms", constraints: "> 0" }
      - { name: actual_kg, type: number, source: system, description: "Actual mass recorded at run completion", default: 0 }
      - { name: line_id, type: string, source: input, description: "Production line identifier" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned production start timestamp (UTC)" }
      - { name: status, type: enum, source: system, description: "Batch lifecycle state", default: SCHEDULED, constraints: "SCHEDULED | RELEASED_FOR_PRODUCTION | IN_PROCESS | ON_HOLD | COMPLETED | REJECTED | RECALLED" }
      - { name: yield_variance_pct, type: number, source: computed, description: "(actual_kg - planned_kg) / planned_kg * 100, 2 decimal places; drives hold when |variance| > threshold" }
      - { name: expected_formula_version, type: integer, source: input, description: "OCC field — Formula.version the client last observed; guards batch creation against stale formula view" }

  - name: BatchLotCode
    parent: ProductionBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; the batch this lot was cut from" }
      - { name: lot_code, type: string, source: system, description: "Server-minted lot code: YYYYMMDD-line_id-seq; seq assigned per (production date, line) in created_at order" }
      - { name: packaged_units, type: integer, source: input, description: "Retail units packaged under this lot", constraints: ">= 0" }
      - { name: best_by_date, type: datetime, source: input, description: "Best-by date printed on packaging; must be after production date" }
      - { name: status, type: enum, source: system, description: "Lot lifecycle state", default: ACTIVE, constraints: "ACTIVE | QUARANTINED | RELEASED | RECALLED" }

  - name: LabSample
    parent: ProductionBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch under test" }
      - { name: sample_type, type: enum, source: input, description: "Sampling plan position", constraints: "FIRST | MIDDLE | LAST | COMPOSITE" }
      - { name: measured_protein_pct, type: number, source: input, description: "Lab-measured crude protein, as-fed percent" }
      - { name: measured_fat_pct, type: number, source: input, description: "Lab-measured crude fat, as-fed percent" }
      - { name: measured_fiber_pct, type: number, source: input, description: "Lab-measured crude fiber, as-fed percent" }
      - { name: measured_moisture_pct, type: number, source: input, description: "Lab-measured moisture, as-fed percent" }
      - { name: verdict, type: enum, source: computed, description: "Per-sample verdict from ga_verdict_calculation", default: PENDING, constraints: "PENDING | WITHIN_LABEL | LABEL_VIOLATION" }

  - name: GuaranteedAnalysisReport
    parent: ProductionBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch this GA report aggregates" }
      - { name: composite_protein_pct, type: number, source: computed, description: "Composite protein across included samples per ga_composite_calculation" }
      - { name: composite_fat_pct, type: number, source: computed, description: "Composite fat across included samples" }
      - { name: composite_fiber_pct, type: number, source: computed, description: "Composite fiber across included samples" }
      - { name: composite_moisture_pct, type: number, source: computed, description: "Composite moisture across included samples" }
      - { name: label_compliance, type: enum, source: computed, description: "Overall label-compliance verdict", default: PENDING, constraints: "PENDING | COMPLIANT | MISBRANDED" }
      - { name: deviation_index, type: number, source: computed, description: "Weighted deviation magnitude computed by ga_deviation_index; feeds complaint_risk_score" }

  - name: StateRegistration
    parent: Formula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; the product being registered (must be SUBSTANTIATED or LOCKED)" }
      - { name: state_code, type: string, source: input, description: "US state postal code of registration jurisdiction", constraints: "2 uppercase letters; unique within (formula_id)" }
      - { name: label_revision_ref, type: integer, source: input, description: "Formula.revision_number of the label submitted for review" }
      - { name: status, type: enum, source: system, description: "Registration lifecycle state", default: SUBMITTED, constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | EXPIRED | REVOKED" }
      - { name: fee_cents, type: integer, source: computed, description: "Registration fee computed by registration_fee_schedule for state_code and tonnage tier" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of submission" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of latest decision" }

  - name: ComplaintCase
    parent: null
    common_fields: true
    fields:
      - { name: brand_owner_id, type: string, source: input, description: "FK -> BrandOwner.id; brand owning the complained product" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; formula implicated" }
      - { name: batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch implicated (nullable when unknown)", default: null }
      - { name: severity, type: enum, source: input, description: "Reporter-assessed severity", constraints: "MINOR | SERIOUS | LIFE_THREATENING | DEATH" }
      - { name: category, type: enum, source: input, description: "Complaint category", constraints: "PALATABILITY | FOREIGN_MATERIAL | ILLNESS | LABEL_DEFECT | PACKAGING" }
      - { name: status, type: enum, source: system, description: "Complaint intake lifecycle", default: INTAKE, constraints: "INTAKE | TRIAGED | INVESTIGATING | RESOLVED | ESCALATED_RECALL | CLOSED_NO_ACTION" }
      - { name: triage_score, type: number, source: computed, description: "Risk score from complaint_risk_score; threshold-crossing triggers auto-escalation" }
      - { name: adverse_event_flag, type: boolean, source: input, description: "True when the complaint alleges an adverse health event", default: false }

  - name: RecallAction
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; recalled formula" }
      - { name: scope_batch_ids, type: array, source: input, description: "Explicit list of ProductionBatch ids in scope; empty array means all non-terminal batches of the formula" }
      - { name: recall_class, type: enum, source: input, description: "FDA recall classification", constraints: "CLASS_I | CLASS_II | CLASS_III" }
      - { name: reason, type: string, source: input, description: "Public reason statement" }
      - { name: status, type: enum, source: system, description: "Recall lifecycle state", default: INITIATED, constraints: "INITIATED | EFFECTIVENESS_CHECK | COMPLETED | CLOSED | TERMINATED" }
      - { name: affected_lot_count, type: integer, source: computed, description: "Number of BatchLotCode rows moved to RECALLED by this action", default: 0 }
      - { name: effectiveness_pct, type: number, source: system, description: "Effectiveness-check recovery percentage recorded during EFFECTIVENESS_CHECK", default: 0 }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table (6 machines, compound + cyclic + branching + parallel)
# ---------------------------------------------------------------------------
state_machines:
  - entity: Formula
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: NUTRIENT_REVIEW
        trigger: "POST /petfood/formulas/{id}/submit-nutrient-review"
        actor: FormulationScientist
        preconditions:
          - "At least one FormulaIngredient row exists for the formula"
          - "Sum of FormulaIngredient.inclusion_pct equals 100.00 +/- 0.01"
          - "Every referenced Ingredient.status == ACTIVE"
        side_effects:
          - "Recompute NutrientProfile.metabolizable_energy_kcal_per_kg via me_calculation when a NutrientProfile exists"
          - "Increments Formula.version by 1"
      - from: NUTRIENT_REVIEW
        to: DRAFT
        trigger: "POST /petfood/formulas/{id}/request-revision"
        actor: QAApprover
        preconditions: []
        side_effects:
          - "Increments Formula.revision_number by 1"
          - "Increments Formula.version by 1"
      - from: NUTRIENT_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /petfood/formulas/{id}/substantiate"
        actor: QAApprover
        preconditions:
          - "If Formula.adequacy_basis == FORMULATION: a NutrientProfile for the formula exists and its aafco_compliance == COMPLIANT"
          - "If Formula.adequacy_basis == FEEDING_TRIAL: a FeedingTrialProtocol for the formula exists with status == PASSED"
          - "For every FormulaIngredient row: there exists a SupplierIngredientApproval in APPROVED state covering (some supplier, that ingredient)"
        side_effects:
          - "Sets Formula.substantiation_locked_version to the version of the linked substantiation object (version-pinning on approval)"
          - "Increments Formula.version by 1"
      - from: SUBSTANTIATED
        to: LOCKED
        trigger: "POST /petfood/formulas/{id}/lock"
        actor: QAApprover
        preconditions:
          - "Formula.open_recall_flag == false"
        side_effects:
          - "Increments Formula.version by 1"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "POST /petfood/formulas (creating a revision formula whose parent_formula_id references this LOCKED formula)"
        actor: FormulationScientist
        side_effects:
          - "Cascades: every StateRegistration for this formula in SUBMITTED or UNDER_REVIEW moves to REVOKED"
          - "Cascades: every ProductionBatch for this formula in SCHEDULED or RELEASED_FOR_PRODUCTION moves to REJECTED"
          - "Increments Formula.version by 1"
      - from: LOCKED
        to: WITHDRAWN
        trigger: "POST /petfood/formulas/{id}/withdraw"
        actor: QAApprover
        preconditions:
          - "Every ProductionBatch for this formula is in a terminal state (COMPLETED, REJECTED, or RECALLED)"
        side_effects:
          - "Cascades: every StateRegistration for this formula in APPROVED moves to REVOKED"
          - "Increments Formula.version by 1"

  - entity: SupplierIngredientApproval
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /petfood/supplier-ingredient-approvals/{id}/approve"
        actor: QAApprover
        preconditions:
          - "Supplier.approval_state == APPROVED"
          - "Ingredient.status == ACTIVE"
          - "decided_by of this row (if previously decided) differs from the acting user only when state == PENDING_REVIEW (no-op guard)"
        side_effects:
          - "Sets decided_by to acting X-User-ID and decided_at to now"
          - "Recomputes Supplier.approved_ingredient_count"
          - "Increments SupplierIngredientApproval.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /petfood/supplier-ingredient-approvals/{id}/reject"
        actor: QAApprover
        preconditions:
          - "Acting X-User-ID != the X-User-ID that created this approval request (segregation of duties: requester may not decide)"
        side_effects:
          - "Sets decided_by and decided_at"
          - "Increments SupplierIngredientApproval.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /petfood/supplier-ingredient-approvals/{id}/revoke"
        actor: QAApprover
        preconditions: []
        side_effects:
          - "Sets decided_by and decided_at"
          - "Recomputes Supplier.approved_ingredient_count"
          - "Cascade: for every Formula in NUTRIENT_REVIEW that includes this ingredient and now lacks any APPROVED supplier pairing for it, auto-transition that Formula back to DRAFT and increment its revision_number and version"
          - "Increments SupplierIngredientApproval.version by 1"

  - entity: FeedingTrialProtocol
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, ABORTED]
    transitions:
      - from: PLANNED
        to: ENROLLING
        trigger: "POST /petfood/feeding-trial-protocols/{id}/open-enrollment"
        actor: TrialCoordinator
        preconditions:
          - "Formula.adequacy_basis == FEEDING_TRIAL"
          - "Formula.status in {DRAFT, NUTRIENT_REVIEW}"
        side_effects: ["Increments FeedingTrialProtocol.version by 1"]
      - from: ENROLLING
        to: RUNNING
        trigger: "POST /petfood/feeding-trial-protocols/{id}/start-trial"
        actor: TrialCoordinator
        preconditions:
          - "enrolled_count >= animal_count (full enrollment reached)"
        side_effects: ["Increments FeedingTrialProtocol.version by 1"]
      - from: RUNNING
        to: ANALYSIS
        trigger: "POST /petfood/feeding-trial-protocols/{id}/complete-observation"
        actor: TrialCoordinator
        preconditions: []
        side_effects: ["Recomputes completion_ratio", "Increments FeedingTrialProtocol.version by 1"]
      - from: ANALYSIS
        to: PASSED
        trigger: "POST /petfood/feeding-trial-protocols/{id}/record-verdict"
        actor: QAApprover
        preconditions:
          - "completion_ratio >= 0.75"
        side_effects: ["Increments FeedingTrialProtocol.version by 1"]
      - from: ANALYSIS
        to: FAILED
        trigger: "POST /petfood/feeding-trial-protocols/{id}/record-verdict"
        actor: QAApprover
        preconditions:
          - "completion_ratio < 0.75"
        side_effects: ["Increments FeedingTrialProtocol.version by 1"]
      - from: RUNNING
        to: ABORTED
        trigger: "POST /petfood/feeding-trial-protocols/{id}/abort"
        actor: QAApprover
        preconditions: []
        side_effects: ["Increments FeedingTrialProtocol.version by 1"]

  - entity: ProductionBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, REJECTED, RECALLED]
    transitions:
      - from: SCHEDULED
        to: RELEASED_FOR_PRODUCTION
        trigger: "POST /petfood/production-batches/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "Formula.status == LOCKED"
          - "For every FormulaIngredient of the formula: at least one SupplierIngredientApproval APPROVED pairing exists whose Supplier.approval_state == APPROVED"
          - "No other ProductionBatch for the same line_id overlaps the window [scheduled_start, scheduled_start + planned run of 8 hours] with status in {RELEASED_FOR_PRODUCTION, IN_PROCESS} (interval-overlap gate)"
        side_effects: ["Increments ProductionBatch.version by 1"]
      - from: RELEASED_FOR_PRODUCTION
        to: IN_PROCESS
        trigger: "POST /petfood/production-batches/{id}/start-run"
        actor: LineOperator
        preconditions: []
        side_effects: ["Increments ProductionBatch.version by 1"]
      - from: IN_PROCESS
        to: ON_HOLD
        trigger: "POST /petfood/production-batches/{id}/hold"
        actor: QualityAnalyst
        preconditions: []
        side_effects: ["Increments ProductionBatch.version by 1"]
      - from: ON_HOLD
        to: IN_PROCESS
        trigger: "POST /petfood/production-batches/{id}/resume"
        actor: QualityAnalyst
        preconditions: []
        side_effects: ["Increments ProductionBatch.version by 1"]
      - from: IN_PROCESS
        to: COMPLETED
        trigger: "POST /petfood/production-batches/{id}/complete"
        actor: LineOperator
        preconditions:
          - "actual_kg recorded in payload, > 0"
          - "computed |yield_variance_pct| <= 5.00 OR acting role escalates via QualityAnalyst override (override flag in payload)"
        side_effects:
          - "Sets actual_kg; computes yield_variance_pct"
          - "Increments Formula.total_batch_count"
          - "Auto-creates one BatchLotCode row when payload requests initial lot (lot_fields present)"
          - "Increments ProductionBatch.version by 1"
      - from: ON_HOLD
        to: REJECTED
        trigger: "POST /petfood/production-batches/{id}/reject"
        actor: QualityAnalyst
        preconditions: []
        side_effects:
          - "Cascades: every BatchLotCode of this batch in ACTIVE moves to QUARANTINED"
          - "Increments ProductionBatch.version by 1"

  - entity: StateRegistration
    initial_state: SUBMITTED
    terminal_states: [APPROVED, EXPIRED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /petfood/state-registrations/{id}/accept-for-review"
        actor: StateRegulator
        preconditions:
          - "Formula.status in {SUBSTANTIATED, LOCKED}"
          - "Formula.open_recall_flag == false"
        side_effects: ["Increments StateRegistration.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /petfood/state-registrations/{id}/approve"
        actor: StateRegulator
        preconditions:
          - "label_revision_ref == Formula.revision_number (label under review must still be current)"
          - "BrandOwner.complaint_score < REGISTRATION_HOLD_THRESHOLD (70.0)"
        side_effects: ["Sets decided_at", "Increments StateRegistration.version by 1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /petfood/state-registrations/{id}/reject"
        actor: StateRegulator
        preconditions: []
        side_effects: ["Sets decided_at", "Increments StateRegistration.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /petfood/state-registrations/{id}/resubmit"
        actor: RegulatoryAffairs
        preconditions:
          - "Formula.status in {SUBSTANTIATED, LOCKED}"
        side_effects:
          - "Recomputes fee_cents via registration_fee_schedule"
          - "Increments StateRegistration.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event: logical clock reaches the state-specific expiry date (annual expiry — triggered by POST /petfood/_clock/set_current_utc advancing past expiry)"
        actor: system
        preconditions: []
        side_effects: ["Increments StateRegistration.version by 1"]

  - entity: ComplaintCase
    initial_state: INTAKE
    terminal_states: [RESOLVED, ESCALATED_RECALL, CLOSED_NO_ACTION]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /petfood/complaint-cases/{id}/triage"
        actor: QualityAnalyst
        preconditions: []
        side_effects:
          - "Computes triage_score via complaint_risk_score"
          - "Recomputes BrandOwner.complaint_score"
          - "If triage_score >= ESCALATION_THRESHOLD (60.0), auto-transition to ESCALATED_RECALL instead (branching fork)"
          - "Increments ComplaintCase.version by 1"
      - from: TRIAGED
        to: INVESTIGATING
        trigger: "POST /petfood/complaint-cases/{id}/open-investigation"
        actor: QualityAnalyst
        preconditions: []
        side_effects: ["Increments ComplaintCase.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /petfood/complaint-cases/{id}/resolve"
        actor: QualityAnalyst
        preconditions: []
        side_effects:
          - "Recomputes BrandOwner.complaint_score (case closed with no recall — decay applies)"
          - "Increments ComplaintCase.version by 1"
      - from: INVESTIGATING
        to: ESCALATED_RECALL
        trigger: "POST /petfood/complaint-cases/{id}/escalate"
        actor: QAApprover
        preconditions: []
        side_effects: ["Increments ComplaintCase.version by 1"]
      - from: TRIAGED
        to: CLOSED_NO_ACTION
        trigger: "POST /petfood/complaint-cases/{id}/close-no-action"
        actor: QualityAnalyst
        preconditions:
          - "adverse_event_flag == false"
        side_effects: ["Increments ComplaintCase.version by 1"]

  - entity: RecallAction
    initial_state: INITIATED
    terminal_states: [COMPLETED, CLOSED, TERMINATED]
    transitions:
      - from: INITIATED
        to: EFFECTIVENESS_CHECK
        trigger: "POST /petfood/recall-actions/{id}/begin-effectiveness-check"
        actor: QAApprover
        preconditions:
          - "affected_lot_count > 0 (lot cascade must have executed)"
        side_effects: ["Increments RecallAction.version by 1"]
      - from: EFFECTIVENESS_CHECK
        to: COMPLETED
        trigger: "POST /petfood/recall-actions/{id}/record-effectiveness"
        actor: QAApprover
        preconditions:
          - "effectiveness_pct recorded in payload, 0 <= pct <= 100"
        side_effects: ["Increments RecallAction.version by 1"]
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /petfood/recall-actions/{id}/close"
        actor: QAApprover
        preconditions: []
        side_effects:
          - "Recomputes Formula.open_recall_flag (false when no other open RecallAction)"
          - "Recomputes BrandOwner.open_recall_count"
          - "Increments RecallAction.version by 1"
      - from: INITIATED
        to: TERMINATED
        trigger: "POST /petfood/recall-actions/{id}/terminate"
        actor: QAApprover
        preconditions: []
        side_effects:
          - "Compensates the recall cascade: every BatchLotCode moved to RECALLED by this action returns to QUARANTINED, and every ProductionBatch moved to RECALLED by this action returns to ON_HOLD"
          - "Recomputes Formula.open_recall_flag and BrandOwner.open_recall_count"
          - "Increments RecallAction.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: batch-create-stale-formula
    parent_entity: Formula
    write_endpoint: "POST /petfood/formulas/{formula_id}/production-batches"
    occ_field: "expected_formula_version"
    description: |
      Creating a ProductionBatch against a Formula whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just substantiated/locked/revised the formula
      and the current writer's view of the formula is therefore stale.
    error_id: ERR_STALE_FORMULA_VERSION
    http_status: 412
  - rule_id: registration-decision-stale-formula
    parent_entity: Formula
    write_endpoint: "POST /petfood/state-registrations/{id}/approve"
    occ_field: "expected_formula_version"
    description: |
      Approving a StateRegistration while carrying a stale Formula version is
      rejected: the regulator's label approval was issued against a formula
      revision that has since changed, so the approval would pin the wrong
      substantiation baseline.
    error_id: ERR_STALE_FORMULA_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table (8 calculations)
# ---------------------------------------------------------------------------
calculations:
  - name: me_calculation
    trigger: "When a NutrientProfile is created/updated for a FORMULATION-basis formula, and on Formula submit-nutrient-review when a profile already exists"
    algorithm: weighted_scoring
    formula: |
      # Modified Atwater, per AAFCO. Uses nutrient GE values.
      # protein_pct etc. are as-fed percentages from the NutrientProfile.
      ge_kcal_per_100g = protein_pct * 5.7 + fat_pct * 9.4 + carb_pct * 4.1
      # where carb_pct = 100 - protein - fat - fiber - moisture - ash (ash assumed constant)
      pct_digestibility = 87.8 - 0.88 * fiber_pct * (100.0 / max(100.0 - moisture_pct, 1.0))
      me_kcal_per_kg = ge_kcal_per_100g * (pct_digestibility / 100.0) * 10.0
    input_set: "NutrientProfile fields of the parent formula; fiber/moisture must be present"
    constants:
      ASH_PCT_ASSUMED: 7.0
      PROTEIN_GE: 5.7
      FAT_GE: 9.4
      CARB_GE: 4.1
      DIGEST_BASE: 87.8
      DIGEST_FIBER_COEF: 0.88
    precision: "1 decimal place, round_half_up"
    variants:
      - name: formulation_estimate
        when: "NutrientProfile.profile_basis == FORMULATION_CALC — nutrient values come from the theoretical ingredient matrix rollup"
        difference: "carb_pct derived from formulation targets; digestibility uses full fiber coefficient"
      - name: lab_verified
        when: "NutrientProfile.profile_basis == LAB_ANALYSIS — nutrient values come from measured lab composites"
        difference: "carb_pct derived from measured composites; digestibility uses a halved fiber coefficient (0.44) reflecting measured energy density — produces a different ME for identical macro inputs"

  - name: aafco_profile_check
    trigger: "On NutrientProfile create/update and on Formula substantiation when adequacy_basis == FORMULATION"
    algorithm: threshold
    formula: |
      # Compare each nutrient against the AAFCO minimum (or maximum) for the
      # formula's species + life_stage, on an energy-normalized basis when
      # ME > 4000 kcal/kg: min_required_effective = min_required * (ME / 4000).
      # Verdict COMPLIANT only if every nutrient satisfies its bound.
      for nutrient in [protein, fat, calcium, phosphorus]:  # minimums
          floor = AAFCO_MIN[species][life_stage][nutrient]
          if ME > 4000: floor = floor * (ME / 4000.0)
          require(profile[nutrient] >= floor)
      for nutrient in [fiber, moisture]:  # label maximums are not AAFCO gates
          pass
    input_set: "NutrientProfile + Formula.species + Formula.life_stage + computed ME"
    constants:
      AAFCO_MIN_DOG_ADULT: { protein: 18.0, fat: 5.5, calcium: 0.6, phosphorus: 0.5 }
      AAFCO_MIN_DOG_GROWTH: { protein: 22.5, fat: 8.5, calcium: 1.0, phosphorus: 0.8 }
      AAFCO_MIN_CAT_ADULT: { protein: 26.0, fat: 9.0, calcium: 0.6, phosphorus: 0.5 }
      AAFCO_MIN_CAT_GROWTH: { protein: 30.0, fat: 9.0, calcium: 1.0, phosphorus: 0.8 }
      ME_NORMALIZATION_REF: 4000
    precision: "comparisons at 2 decimal places, round_half_up before compare"
    variants:
      - name: as_fed_basis
        when: "Formula declares calorie content statement from formulation estimate"
        difference: "Normalization uses formulation_estimate ME"
      - name: lab_basis
        when: "Formula declares calorie content statement from lab-verified ME"
        difference: "Normalization uses lab_verified ME — the floor moves, so identical nutrient percentages can flip the verdict"

  - name: ga_composite_calculation
    trigger: "On GuaranteedAnalysisReport generation for a batch (POST /petfood/production-batches/{id}/ga-reports)"
    algorithm: aggregation
    formula: |
      # Composite = mass-weighted average across included samples.
      # Included samples: LabSample rows whose verdict != PENDING, ordered by
      # sample_type position FIRST=0, MIDDLE=1, LAST=2, COMPOSITE=3; ties on
      # identical sample_type broken by created_at ASC.
      # Per-sample weight: FIRST=1, MIDDLE=1, LAST=1, COMPOSITE=1.25.
      # Rounding order PINNED: round each weighted contribution to 3 decimals
      # first, then sum, then divide by the unrounded sum of weights, then
      # round the composite to 2 decimals round_half_up. The pin is
      # load-bearing: samples 38.236 / 22.379 / 22.345 (COMPOSITE) yield
      # 27.24 under the pinned order but 27.25 when unrounded contributions
      # are summed first.
      for s in included_samples:
          contribution[s] = round3(s.measured * weight[s.sample_type])
      composite = round2(sum(contribution) / sum(weights))
    input_set: "LabSample rows for the batch with verdict in {WITHIN_LABEL, LABEL_VIOLATION}; PENDING samples excluded; measured values may carry up to 3 decimals"
    constants:
      WEIGHT_COMPOSITE: 1.25
      WEIGHT_SPOT: 1
    precision: "3 decimals per contribution, 2 decimals final, round_half_up"
    variants:
      - name: spot_only
        when: "No COMPOSITE sample exists"
        difference: "Plain mean of spot samples (all weights 1)"
      - name: composite_weighted
        when: "A COMPOSITE sample exists"
        difference: "COMPOSITE carries 1.25x weight — different composite result for identical spot readings"

  - name: ga_deviation_index
    trigger: "Immediately after ga_composite_calculation on the same report"
    algorithm: weighted_scoring
    formula: |
      # Deviation magnitude against the label guarantees of the parent formula's
      # NutrientProfile (label values, not AAFCO floors).
      # min-nutrients: deficit = max(0, label_min - composite)
      # max-nutrients: excess  = max(0, composite - label_max)
      # deviation_index = 3*protein_deficit + 2*fat_deficit + 1.5*fiber_excess + 1*moisture_excess
      # label_compliance = MISBRANDED iff deviation_index > 0 else COMPLIANT
    input_set: "GuaranteedAnalysisReport composites + NutrientProfile label guarantees of the batch's formula"
    constants:
      W_PROTEIN: 3.0
      W_FAT: 2.0
      W_FIBER: 1.5
      W_MOISTURE: 1.0
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: yield_variance_calculation
    trigger: "On ProductionBatch complete"
    algorithm: threshold
    formula: |
      yield_variance_pct = round2((actual_kg - planned_kg) / planned_kg * 100.0)
      # Hold rule: |yield_variance_pct| > 5.00 requires QualityAnalyst override;
      # exactly 5.00 does NOT require override (boundary: strict >).
    input_set: "ProductionBatch actual_kg, planned_kg"
    constants:
      YIELD_HOLD_THRESHOLD_PCT: 5.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: overrun
        when: "actual_kg > planned_kg"
        difference: "Positive variance; overruns feed a separate waste log but the same threshold"
      - name: underrun
        when: "actual_kg < planned_kg"
        difference: "Negative variance; identical threshold test on absolute value"

  - name: registration_fee_schedule
    trigger: "On StateRegistration create and on resubmit"
    algorithm: tiered_pricing
    formula: |
      # Annual registration fee per state, tiered by the brand's prior-year
      # tonnage in that state (declared on the request as tonnage_tier).
      # Tier boundaries are INCLUSIVE at the lower bound:
      #   T1: < 5 tons       -> base_fee
      #   T2: >= 5, < 50     -> base_fee * 1.5
      #   T3: >= 50          -> base_fee * 2.0
      # base_fee differs per state_code via STATE_BASE_FEE_CENTS table;
      # states missing from the table use DEFAULT_BASE_FEE_CENTS.
      # Computed fee is integer cents; multiplication result rounded half_up.
    input_set: "StateRegistration.state_code + request tonnage_tier"
    constants:
      DEFAULT_BASE_FEE_CENTS: 5000
      STATE_BASE_FEE_CENTS: { CA: 7500, TX: 6000, NY: 8000 }
      T2_MULTIPLIER: 1.5
      T3_MULTIPLIER: 2.0
      T2_MIN_TONS: 5
      T3_MIN_TONS: 50
    precision: "integer cents, round_half_up"
    variants: []

  - name: complaint_risk_score
    trigger: "On ComplaintCase triage and on ComplaintCase resolve (brand rollup)"
    algorithm: weighted_scoring
    formula: |
      # Case triage score (provisional at intake, final at triage):
      #   severity_weight: MINOR=5, SERIOUS=20, LIFE_THREATENING=45, DEATH=60
      #   category_weight: PALATABILITY=2, PACKAGING=3, LABEL_DEFECT=8,
      #                    FOREIGN_MATERIAL=12, ILLNESS=15
      #   adverse_event_flag: +10 when true
      #   triage_score = severity_weight + category_weight + flag_bonus
      #     (provisional variant omits flag_bonus until flag confirmed at triage)
      # Brand rollup (BrandOwner.complaint_score):
      #   weighted mean of triage_score over this brand's ComplaintCase rows in
      #   {TRIAGED, INVESTIGATING} from the trailing 90-day window ending at the
      #   logical clock; half-weight for cases in TRIAGED; resolved/closed rows
      #   contribute a decayed 25% of their final score for 30 days after close.
    input_set: "ComplaintCase fields; brand rollup filters on status and logical-clock window"
    constants:
      SEV_W: { MINOR: 5, SERIOUS: 20, LIFE_THREATENING: 45, DEATH: 60 }
      CAT_W: { PALATABILITY: 2, PACKAGING: 3, LABEL_DEFECT: 8, FOREIGN_MATERIAL: 12, ILLNESS: 15 }
      AE_BONUS: 10
      ESCALATION_THRESHOLD: 60.0
      REGISTRATION_HOLD_THRESHOLD: 70.0
      ROLLUP_WINDOW_DAYS: 90
      DECAYED_SHARE: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Computed at intake before the adverse_event_flag is confirmed"
        difference: "flag_bonus omitted — identical severity+category yields a lower provisional score than the final score"
      - name: final
        when: "Computed at triage after flag confirmation"
        difference: "flag_bonus included when adverse_event_flag == true"

  - name: lot_code_sequencer
    trigger: "On BatchLotCode creation"
    algorithm: chronological
    formula: |
      # lot_code = YYYYMMDD-{line_id}-{seq:03d}
      # seq is the 1-based position among all BatchLotCode rows created for the
      # same (production_date, line_id), ordered by created_at ASC. Created-at
      # ties are impossible under the logical clock's millisecond resolution.
    input_set: "BatchLotCode rows sharing production_date (from parent batch scheduled_start date, UTC) and line_id"
    constants: {}
    precision: "seq is an integer zero-padded to 3 digits"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; 16 rules)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is authorized for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id and every FK-valued body field resolves to an existing row, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: the QAApprover deciding a SupplierIngredientApproval must not be the user who submitted the approval request"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /petfood/supplier-ingredient-approvals/{id}/approve", "POST /petfood/supplier-ingredient-approvals/{id}/reject"]
  - priority: 6
    category: business_safety
    check: "Supplier.approval_state == APPROVED before any of its ingredient pairings may be approved"
    error_id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 422
    applies_to: ["POST /petfood/supplier-ingredient-approvals/{id}/approve"]
  - priority: 7
    category: business_safety
    check: "Formula.open_recall_flag == false for lock, state-registration acceptance, and batch release"
    error_id: ERR_OPEN_RECALL
    http_status: 422
    applies_to: ["POST /petfood/formulas/{id}/lock", "POST /petfood/state-registrations/{id}/accept-for-review", "POST /petfood/production-batches/{id}/release"]
  - priority: 8
    category: business_referential
    check: "Every FormulaIngredient.ingredient_id has Ingredient.status == ACTIVE at submit-nutrient-review and at batch release"
    error_id: ERR_INGREDIENT_INACTIVE
    http_status: 422
    applies_to: ["POST /petfood/formulas/{id}/submit-nutrient-review", "POST /petfood/production-batches/{id}/release"]
  - priority: 9
    category: business_referential
    check: "Every ingredient in the formula has at least one APPROVED SupplierIngredientApproval (substantiation), and one whose Supplier is APPROVED (batch release)"
    error_id: ERR_UNAPPROVED_INGREDIENT_SOURCE
    http_status: 422
    applies_to: ["POST /petfood/formulas/{id}/substantiate", "POST /petfood/production-batches/{id}/release"]
  - priority: 10
    category: business_constraint
    check: "Sum of FormulaIngredient.inclusion_pct equals 100.00 +/- 0.01 before submit-nutrient-review"
    error_id: ERR_INCLUSION_SUM_INVALID
    http_status: 422
    applies_to: ["POST /petfood/formulas/{id}/submit-nutrient-review"]
  - priority: 11
    category: business_constraint
    check: "adequacy-basis gate: FORMULATION requires COMPLIANT NutrientProfile; FEEDING_TRIAL requires PASSED protocol"
    error_id: ERR_SUBSTANTIATION_UNMET
    http_status: 422
    applies_to: ["POST /petfood/formulas/{id}/substantiate"]
  - priority: 12
    category: business_temporal
    check: "Line-schedule overlap: [scheduled_start, scheduled_start+8h) must not intersect any other batch on the same line_id in {RELEASED_FOR_PRODUCTION, IN_PROCESS}; half-open interval — back-to-back batches touching at the boundary are allowed"
    error_id: ERR_LINE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: ["POST /petfood/production-batches/{id}/release"]
  - priority: 13
    category: business_temporal
    check: "BatchLotCode.best_by_date strictly after the production date; best_by equal to production date is rejected"
    error_id: ERR_BEST_BY_INVALID
    http_status: 422
    applies_to: ["POST /petfood/production-batches/{id}/lots"]
  - priority: 14
    category: business_fiscal
    check: "StateRegistration approve requires label_revision_ref == Formula.revision_number and BrandOwner.complaint_score < 70.0"
    error_id: ERR_LABEL_REVISION_STALE
    http_status: 422
    applies_to: ["POST /petfood/state-registrations/{id}/approve"]
  - priority: 15
    category: business_fiscal
    check: "ProductionBatch complete with |yield_variance_pct| > 5.00 requires QualityAnalyst override flag; boundary 5.00 passes without override"
    error_id: ERR_YIELD_VARIANCE_HOLD
    http_status: 422
    applies_to: ["POST /petfood/production-batches/{id}/complete"]
  - priority: 16
    category: business_constraint
    check: "Uniqueness: BrandOwner.fein, Ingredient.aafco_name, Supplier.fsma_facility_id, FeedingTrialProtocol.protocol_code, (Formula.formula_code within brand), (StateRegistration.state_code within formula)"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: ["POST /petfood/brand-owners", "POST /petfood/ingredients", "POST /petfood/suppliers", "POST /petfood/formulas/{id}/feeding-trial-protocols", "POST /petfood/brand-owners/{id}/formulas", "POST /petfood/formulas/{id}/state-registrations"]

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (32 endpoints)
# ---------------------------------------------------------------------------
endpoints:
  # --- clock / test-driving ---
  - method: POST
    path: "/petfood/_clock/set_current_utc"
    description: "Sets the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall time. Advancing past a registration expiry triggers the APPROVED->EXPIRED system transition."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Triggers StateRegistration expiry sweep"]

  # --- BrandOwner ---
  - method: POST
    path: "/petfood/brand-owners"
    description: "Register a private-label brand owner"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, fein, contact_email]
    output: BrandOwner
    side_effects: []
  - method: GET
    path: "/petfood/brand-owners/{id}"
    description: "Fetch one brand owner"
    roles: [PlatformAdmin, RegulatoryAffairs, QualityAnalyst, QAApprover, FormulationScientist]
    code: 200
    input: []
    output: BrandOwner
    side_effects: []
  - method: GET
    path: "/petfood/brand-owners"
    description: "List brand owners with pagination"
    roles: [PlatformAdmin, RegulatoryAffairs, QualityAnalyst, QAApprover, FormulationScientist]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BrandOwner[]
    side_effects: []
  - method: GET
    path: "/petfood/brand-owners/{id}/complaint-cases"
    description: "List complaint cases for a brand (FK reverse reachability)"
    roles: [PlatformAdmin, QualityAnalyst, QAApprover]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ComplaintCase[]
    side_effects: []

  # --- Supplier ---
