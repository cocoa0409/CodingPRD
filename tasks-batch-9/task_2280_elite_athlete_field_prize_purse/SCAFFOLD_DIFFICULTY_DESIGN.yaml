  # ===========================================================================
  # RULE 6 — boundary_precision_check (3 instances; different metrics AND
  #          different endpoints)
  # ===========================================================================

  - rule_id: boundary_precision_check
    instances:
      - name: boundary_qualifying_standard_inclusive_and_window_edge_on_offer
        grounds:
          - calculations.qualifying_eligibility
          - entities.DivisionStandard.fields.max_qualifying_seconds
          - entities.DivisionStandard.fields.window_months
          - errors.ERR_QUALIFYING_STANDARD_NOT_MET
        distinguishing_aspect: >-
          Metric: qualifying seconds and the qualifying window, checked on POST
          /invitations/{id}/offer. The standard is inclusive (verified_seconds <=
          max_qualifying_seconds), so 8100 against a standard of 8100 must pass while 8101 fails by one
          second, and the 24-month window is measured from race_date so 2024-11-01 is inside and
          2024-10-31 is outside by one day. Falsifiable in one sentence: an implementation using a
          strict < comparison rejects the exactly-on-standard athlete, and one using performance_seconds
          instead of verified_seconds accepts an athlete whose claimed 8000 was corrected to 8101 by the
          technical official.
        test_recipe:
          setup: >-
            Edition FIELD_OPEN with race_date 2026-11-01 and an ELITE MALE standard of
            max_qualifying_seconds = 8100 and the default window_months = 24 (so the earliest admissible
            performance_date is 2026-11-01 minus 24 months = 2024-11-01). Four athletes with VERIFIED
            performances: exactly 8100 inside the window; 8101 inside the window; 8000 dated exactly on
            the window edge 2024-11-01; and 8000 dated 2024-10-31, one day stale. Athlete B's record was
            submitted claiming 8000 but the official verified it at 8101, so performance_seconds and
            verified_seconds disagree.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload:
                name: "Standard Boundary Marathon"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 9000000
                total_purse_cents: 3000000
                bonus_pool_cap_cents: 0
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 30 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
