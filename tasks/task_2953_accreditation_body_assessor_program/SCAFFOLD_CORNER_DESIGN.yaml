          payload: {}
          as: AssessmentManager
        assert: ['the confirm response itself returns HTTP 200 with TeamAssignment.${ta_lead}.status == CONFIRMED and confirmed_on == 2026-08-10', 'the immediately following read of the cycle shows status TEAM_ASSIGNED and version == ${app_v1} + 1 with no intervening write', the immediately following read of the organization shows status UNDER_ASSESSMENT, 'GET /accreditation/team-assignments?application_id=${app_id}&status=CONFIRMED already returns total_count == 1', 'nothing is deferred: no field of the three entities changes again on a second identical pair of reads']
    - name: the_four_hop_effectiveness_cascade_is_atomic_within_one_request
      claim_type: immediate
      grounds: [complexity_profile.consistency_model.immediate, state_machines.Nonconformity.RESPONSE_ACCEPTED_to_CLOSED]
      excluded_because: {difficulty_instance: transitive_cascade / effectiveness_pass_closes_finding_then_ledger_then_decision_then_risk, rationale: 'That §1.8 instance asserts every hop of the deepest cascade in the system from the single verify-effectiveness response and its immediate follow-up reads, which is exactly the immediate-consistency claim for that chain, so a separate instance would restate it.'}
