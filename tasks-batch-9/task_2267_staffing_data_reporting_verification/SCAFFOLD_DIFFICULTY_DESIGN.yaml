  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_gated_on_facility_posture_from_open_discrepancy_case
        grounds:
          - validations[priority 33 ERR_FACILITY_UNDER_HOLD]
          - state_machines.Facility.REPORTING_OPEN_to_AUDIT_HOLD
          - calculations.facility_posture_derivation
          - endpoints[POST /submissions/{id}/submit]
        distinguishing_aspect: |
          Entity pair is QuarterlySubmission depending on Facility: the submission is perfectly
          VALIDATED with zero fatal findings, yet submit is refused purely because a DiscrepancyCase
          on a different aggregate pushed Facility.posture to AUDIT_HOLD; dismissing the case
          restores REPORTING_OPEN and the same submit call then succeeds.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, a VALIDATED submission with one payroll-supported 8.00-hour RN shift and one RECONCILED census day, zero fatal findings"
            - "A StateAuditor has opened a CENSUS_MISMATCH DiscrepancyCase naming no measure, which drives Facility.posture to AUDIT_HOLD"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - *c_pr_0401
            - *c_entry_0401
            - *c_census_0401
            - *c_reconcile_c1
            - *c_verify_e1
            - *c_validate
            - call: "POST /discrepancy-cases"
              payload: { facility_id: "${fac}", submission_id: "${sub}", trigger_reason: "CENSUS_MISMATCH", detail: "Reported census for 2026-04-01 conflicts with the state register." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
              captures: { case: $.data.id }
          trigger:
            - call: "POST /submissions/${sub}/submit"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - call: "POST /discrepancy-cases/${case}/request-info"
              payload: { request_note: "Send the state register extract for 2026-04-01." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
            - call: "POST /discrepancy-cases/${case}/respond"
              payload: { response_note: "Register extract attached; our count of 5 is correct." }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - call: "POST /discrepancy-cases/${case}/dismiss"
              payload: { resolution_note: "Facility count confirmed against the register." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
            - call: "POST /submissions/${sub}/submit"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
          assert:
            - "the first submit returns 409 with error_id ERR_FACILITY_UNDER_HOLD while Facility.${fac}.posture == AUDIT_HOLD and open_case_count == 1"
            - "QuarterlySubmission.${sub}.status is still VALIDATED after the refused submit, with open_fatal_finding_count == 0"
            - "after the dismiss, DiscrepancyCase.${case}.status == DISMISSED, Facility.${fac}.posture == REPORTING_OPEN, open_case_count == 0, substantiated_case_count == 0"
            - "the second submit returns 200 and QuarterlySubmission.${sub}.status == SUBMITTED with attested_by_worker_id == ${w_admin}"

      - name: appeal_creation_gated_on_measure_publication_status
        grounds:
          - validations[priority 24 ERR_MEASURE_NOT_PUBLISHED]
          - state_machines.StaffingMeasure.PROVISIONAL_to_PUBLISHED
          - endpoints[POST /rating-appeals]
        distinguishing_aspect: |
          A different entity pair from the submission/facility gate: RatingAppeal depends on
          StaffingMeasure.publication_status. The identical appeal payload is refused while the
          measure is PROVISIONAL and accepted once it is PUBLISHED, and only publication creates
          the appeal_deadline the window check later relies on.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, an ACCEPTED submission with one payroll-supported and SUPPORTED 8.00-hour RN shift and one RECONCILED census day"
            - "A freshly computed StaffingMeasure in publication_status PROVISIONAL, audit_status NOT_AUDITED, with published_at and appeal_deadline still null"
            - "Logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - *c_pr_0401
            - *c_entry_0401
            - *c_census_0401
            - *c_reconcile_c1
            - *c_verify_e1
            - *c_validate
            - *c_submit
            - *c_accept
            - call: "POST /staffing-measures"
              payload: { submission_id: "${sub}" }
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { meas: $.data.id, mver: $.data.version }
          trigger:
            - call: "POST /rating-appeals"
              payload: { staffing_measure_id: "${meas}", grounds: "MEASURE_CALCULATION_ERROR", narrative: "The weekend downgrade was applied to a period with no weekend census.", expected_measure_version: "${mver}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - call: "POST /staffing-measures/${meas}/publish"
              payload: {}
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { mver2: $.data.version }
            - call: "POST /rating-appeals"
              payload: { staffing_measure_id: "${meas}", grounds: "MEASURE_CALCULATION_ERROR", narrative: "The weekend downgrade was applied to a period with no weekend census.", expected_measure_version: "${mver2}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
              captures: { appeal: $.data.id }
          assert:
            - "the first POST /rating-appeals returns 409 with error_id ERR_MEASURE_NOT_PUBLISHED and creates no RatingAppeal"
            - "StaffingMeasure.${meas}.has_open_appeal == false and appeal_deadline == null before the publish"
            - "after the publish, StaffingMeasure.${meas}.publication_status == PUBLISHED, published_at == 2026-08-01T00:00:00Z, appeal_deadline == 2026-08-31T00:00:00Z"
            - "the second POST /rating-appeals returns 201 with RatingAppeal.${appeal}.status == SUBMITTED"
            - "StaffingMeasure.${meas}.has_open_appeal == true and Facility.${fac}.latest_staffing_rating equals StaffingMeasure.${meas}.staffing_rating"

  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_shift_overlap_half_open_allows_adjacency
        grounds:
          - validations[priority 39 ERR_SHIFT_OVERLAP]
          - endpoints[POST /hour-entries]
          - entities.HourEntry.fields.shift_start
        distinguishing_aspect: |
          Resource is a Worker and the interval semantics are half-open [shift_start, shift_end):
          a shift that starts exactly when the previous one ends is accepted, and only a one-minute
          backward move into the earlier shift is rejected.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission"
            - "Worker Riley Nurse already has an ACTIVE 07:00-15:00 RN shift on 2026-04-01"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "15:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e2: $.data.id, sv3: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "14:59", shift_end: "16:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv3}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the 15:00-19:00 entry is created with 201 because the interval is half-open, giving HourEntry.${e2}.raw_hours == 4.00"
            - "the 14:59-16:00 attempt returns 422 with error_id ERR_SHIFT_OVERLAP"
            - "QuarterlySubmission.${sub}.total_raw_hours == 12.00 and total_direct_care_hours == 12.00 after both trigger calls"
            - "GET /hour-entries with submission_id ${sub} returns exactly 2 entries"
            - "Worker.${w_rn}.reported_hours_total == 12.00"

      - name: reporting_period_overlap_closed_inclusive_rejects_shared_boundary
        grounds:
          - validations[priority 40 ERR_PERIOD_OVERLAP]
          - endpoints[POST /reporting-periods]
          - entities.ReportingPeriod.fields.end_date
        distinguishing_aspect: |
          A different resource entity (ReportingPeriod, scoped by state_code) with the opposite
          interval semantics: the date range is closed-inclusive on both ends, so a new period that
          merely shares the 2026-04-30 boundary day is rejected, whereas the half-open shift rule on
          Worker accepts exactly that kind of touching endpoint.
        test_recipe:
          setup:
            - "The TX 2026Q2 reporting period already covers 2026-04-01 through 2026-04-30 inclusive"
          setup_api_calls:
            - *c_fac
            - *c_per
          trigger:
            - call: "POST /reporting-periods"
              payload: { period_code: "2026Q3", state_code: "TX", start_date: "2026-04-30", end_date: "2026-07-31", submission_deadline: "2026-11-14T23:59:59Z", correction_window_end: "2027-03-31T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /reporting-periods"
              payload: { period_code: "2026Q3", state_code: "TX", start_date: "2026-05-01", end_date: "2026-07-31", submission_deadline: "2026-11-14T23:59:59Z", correction_window_end: "2027-03-31T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { per2: $.data.id }
          assert:
            - "the 2026-04-30 start returns 422 with error_id ERR_PERIOD_OVERLAP because both ranges include 2026-04-30"
            - "the 2026-05-01 start returns 201 and ReportingPeriod.${per2}.status == OPEN"
            - "GET /reporting-periods with state_code TX returns exactly 2 periods"
            - "ReportingPeriod.${per}.end_date == 2026-04-30 is unchanged by the rejected attempt"

  - rule_id: compensating_invariant
    instances:
      - name: hours_conservation_across_allocation_replacements
        grounds:
          - calculations.hour_entry_classification
          - calculations.submission_hour_census_rollup
          - endpoints[PUT /hour-entries/{id}/allocations]
        distinguishing_aspect: |
          Conserved quantity is hours: raw_hours must always equal
          direct_care_hours + excluded_hours on the entry, and the submission rollup must always
          equal the sum over ACTIVE entries. Replacing the allocation set is the compensating
          operation; it moves hours between the direct and excluded buckets without ever changing
          the conserved raw total.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission"
            - "One 7.50-hour shift on 2026-04-01 split 45.00 / 27.50 / 27.50 across RN, RN_ADMIN, and ADMIN, giving direct 4.62 and excluded 2.88"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "14:30", allocations: [{ job_category_id: "${jc_rn}", percent: 45.00 }, { job_category_id: "${jc_split}", percent: 27.50 }, { job_category_id: "${jc_admin}", percent: 27.50 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
          trigger:
            - call: "PUT /hour-entries/${e1}/allocations"
              payload: { allocations: [{ job_category_id: "${jc_admin}", percent: 100.00 }], expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { sv3: $.data.submission_version }
            - call: "PUT /hour-entries/${e1}/allocations"
              payload: { allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv3}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "after the first replacement: HourEntry.${e1}.direct_care_hours == 0.00, excluded_hours == 7.50, rn_hours == 0.00, allocation_revision == 1"
            - "after the second replacement: HourEntry.${e1}.direct_care_hours == 7.50, excluded_hours == 0.00, rn_hours == 7.50, allocation_revision == 2"
            - "HourEntry.${e1}.raw_hours == 7.50 at every step, and raw_hours == direct_care_hours + excluded_hours holds after each call"
            - "QuarterlySubmission.${sub}.total_raw_hours == 7.50 at every step, with total_direct_care_hours / total_excluded_hours moving 4.62/2.88 -> 0.00/7.50 -> 7.50/0.00"
            - "Worker.${w_rn}.reported_hours_total == 7.50 at every step"
            - "QuarterlySubmission.${sub}.version increased by exactly 2 across the two replacements"

      - name: surcharge_cents_conservation_reopen_then_appeal_waiver
        grounds:
          - calculations.amendment_surcharge
          - calculations.facility_posture_derivation
          - state_machines.RatingAppeal.SUBMITTED_to_GRANTED
          - endpoints[POST /rating-appeals/{id}/grant]
        distinguishing_aspect: |
          A different conserved quantity from the hours invariant: money. Facility
          outstanding_surcharge_cents must always equal the sum over non-VOID submissions of
          (amendment_surcharge_cents - waived_surcharge_cents). The reopen is the forward operation
          that adds 28000 cents and the appeal grant is the compensating operation that waives
          exactly that amount, returning the balance to 0 with no drift.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period with submission_deadline 2026-08-14T23:59:59Z"
            - "An ACCEPTED submission with one payroll-supported and SUPPORTED 8.00-hour RN shift and one RECONCILED census day, amendment_index 0, amendment_surcharge_cents 0, waived_surcharge_cents 0"
            - "A PUBLISHED StaffingMeasure for that submission and a SUBMITTED RatingAppeal filed at the default clock, inside the 2026-08-31T00:00:00Z appeal deadline"
            - "The clock then repositioned to 2026-08-20T12:00:00Z, which is 6 whole late days past the deadline"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - *c_pr_0401
            - *c_entry_0401
            - *c_census_0401
            - *c_reconcile_c1
            - *c_verify_e1
            - *c_validate
            - *c_submit
            - *c_accept
            - call: "POST /staffing-measures"
              payload: { submission_id: "${sub}" }
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { meas: $.data.id }
            - call: "POST /staffing-measures/${meas}/publish"
              payload: {}
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { mver: $.data.version }
            - call: "POST /rating-appeals"
              payload: { staffing_measure_id: "${meas}", grounds: "DATA_ENTRY_ERROR", narrative: "Two RN shifts were keyed against the wrong reporting period.", expected_measure_version: "${mver}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
              captures: { appeal: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /submissions/${sub}/reopen"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /rating-appeals/${appeal}/grant"
              payload: { decision_note: "Keying error confirmed; measure suppressed and amendment fee waived." }
              as: AppealsReviewer
              as_user_id: "reviewer-01"
          assert:
            - "after the reopen: QuarterlySubmission.${sub}.amendment_index == 1, amendment_surcharge_cents == 28000, waived_surcharge_cents == 0, status == DRAFT"
            - "after the reopen: Facility.${fac}.outstanding_surcharge_cents == 28000"
            - "after the grant: RatingAppeal.${appeal}.status == GRANTED and surcharge_waived_cents == 28000"
            - "after the grant: QuarterlySubmission.${sub}.amendment_surcharge_cents == 28000 and waived_surcharge_cents == 28000, so the net is 0"
            - "after the grant: Facility.${fac}.outstanding_surcharge_cents == 0, exactly restoring the pre-reopen balance"
            - "after the grant: StaffingMeasure.${meas}.publication_status == SUPPRESSED, has_open_appeal == false, and Facility.${fac}.latest_staffing_rating == null"
