# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Task 2644 — Paratransit Eligibility Assessment (transit agency accessibility office)
#
# Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml, walking the nine sections of
# references/claim-extraction-guide.md row by row. Depth corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear here as `excluded_because:` stubs.
# Every logical clock starts at the mandatory default 2026-08-01T00:00:00Z unless a call moves it.
# Opaque staff user ids used throughout: eval-1, eval-2, spec-1, spec-2, rev-1, rev-2, co-1, co-2, tt-1.

scaffold_corner_design:
  - section: entities
    instances:
      - name: applicant_create_returns_every_declared_field_at_version_one
        claim_type: creation
        grounds:
          - entities.Applicant
          - endpoints.POST_/applicants
          - response_envelope.success
        distinguishing_aspect: "A brand-new Applicant carries version 1, all nineteen declared fields, and every computed mirror at its zero value (status NONE, category null, all conduct counters 0) — not null and not absent."
        test_recipe:
          setup:
            - "empty database; logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Aurelia Vance", date_of_birth: "1957-04-11", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER", primary_language: "en", home_agency_name: "Metro Transit" }
              as: IntakeClerk
              captures: { rider_id: $.data.id, rider_v: $.data.version }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.full_name == \"Aurelia Vance\", data.residence_zone == \"IN_SERVICE_AREA\", data.mobility_aid == \"WALKER\", data.primary_language == \"en\""
            - "data.version == 1, data.created_at == \"2026-08-01T00:00:00.000Z\" and data.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "data.current_eligibility_status == \"NONE\", data.eligibility_category == null, data.active_determination_id == null, data.service_status == \"ACTIVE\""
            - "data.no_show_points_event_basis == 0, data.no_show_points_report_basis == 0, data.chargeable_miss_count_90d == 0, data.scheduled_trip_count_90d == 0, data.no_show_ratio_pct == 0.0"
            - "data.prior_upheld_suspension_count == 0, data.suspension_days_ledger_total == 0, data.fixed_route_competency_confirmed == false, data.continued_service_during_appeal == false"

      - name: applicant_get_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/applicants/{id}
          - entities.Applicant
        distinguishing_aspect: "A read is a pure read: GET returns the same id, created_at and version as the create response and does not bump version or updated_at."
        test_recipe:
          setup:
            - "one Applicant created at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Bram Odell", date_of_birth: "1944-02-29", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: IntakeClerk
              captures: { read_v: $.data.version, read_updated: $.data.updated_at }
          assert:
            - "HTTP 200 with data.id == ${rider_id} and data.full_name == \"Bram Odell\""
            - "data.version == 1 (a read never mutates)"
            - "data.created_at == \"2026-08-01T00:00:00.000Z\" and data.updated_at == \"2026-08-01T00:00:00.000Z\" even though the clock moved to 2026-08-02"

      - name: applications_list_returns_pagination_envelope_with_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit/offset/total_count/has_more are all present and consistent: with three DRAFT applications and limit 2 the first page carries two rows and has_more true, the second page one row and has_more false, and total_count stays 3 on both pages."
        test_recipe:
          setup:
            - "three distinct Applicants each owning exactly one DRAFT Application (one open application per rider)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Rider One", date_of_birth: "1950-01-02", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { r1: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Rider Two", date_of_birth: "1951-03-04", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { r2: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Rider Three", date_of_birth: "1952-05-06", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER" }
              as: IntakeClerk
              captures: { r3: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${r1}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 120, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { a1: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${r2}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: true, max_walk_distance_meters: 300, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { a2: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${r3}", application_type: "NEW", functional_answers: { can_board_bus_steps: true, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 500, uses_mobility_aid_outdoors: false, has_cognitive_impairment: true } }
              as: IntakeClerk
              captures: { a3: $.data.id }
          trigger:
            - call: "GET /applications"
              payload: { limit: 2, offset: 0 }
              as: IntakeClerk
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /applications"
              payload: { limit: 2, offset: 2 }
              as: IntakeClerk
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /applications"
              payload: { applicant_id: "${r2}" }
              as: IntakeClerk
              captures: { filtered_first: "$.data[0].id" }
          assert:
            - "page 1: HTTP 200, response_type == \"array\", limit == 2, offset == 0, total_count == 3, has_more == true and exactly 2 rows"
            - "page 2: limit == 2, offset == 2, total_count == 3, has_more == false and exactly 1 row"
            - "the filtered read returns total_count == 1, has_more == false, limit == 10 (the declared default) and data[0].id == ${a2}"
            - "every returned Application has status == \"DRAFT\", days_pending_statutory == 0, completeness_established_at == null and determination_due_date == null"

      - name: applicant_get_with_unknown_uuid_returns_applicant_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/applicants/{id}
          - errors.ERR_APPLICANT_NOT_FOUND
        distinguishing_aspect: "An id-shaped UUID that was never minted yields the entity-specific 404 ERR_APPLICANT_NOT_FOUND, not a generic 404 and not an empty 200 body."
        test_recipe:
          setup:
            - "empty database except one unrelated Applicant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Unrelated Rider", date_of_birth: "1960-06-06", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { other_id: $.data.id }
          trigger:
            - call: "GET /applicants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeClerk
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_APPLICANT_NOT_FOUND\""
            - "data.message is a non-empty string"
            - "GET /applicants/${other_id} still returns HTTP 200 (the miss did not disturb stored rows)"

      - name: application_create_missing_functional_answers_is_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Application.fields.functional_answers
          - validations.priority_20.ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "functional_answers has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST; supplying only four of the five required keys is the same 400, and neither call creates a row."
        test_recipe:
          setup:
            - "one Applicant with no Application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Clea Mendes", date_of_birth: "1969-07-19", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW" }
              as: IntakeClerk
              captures: { missing_err: $.data.error_id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 200, uses_mobility_aid_outdoors: true } }
              as: IntakeClerk
              captures: { partial_err: $.data.error_id }
          assert:
            - "the omitted-field call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "the four-of-five-keys call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" (functional_answers is complete only with all five keys non-null)"
            - "GET /applications?applicant_id=${rider_id} returns total_count == 0"

      - name: vehicle_create_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Vehicle
          - endpoints.POST_/vehicles
        distinguishing_aspect: "wheelchair_positions, ambulatory_seats and status are optional inputs: omitted, the row is born with 0 positions, 0 seats and status IN_SERVICE, and both open-reservation counters at 0."
        test_recipe:
          setup:
            - "empty vehicle fleet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { vehicle_number: "V-9100" }
              as: AccessibilityOfficeAdmin
              captures: { veh_id: $.data.id, veh_status: $.data.status }
          assert:
            - "HTTP 201 with data.vehicle_number == \"V-9100\" and data.status == \"IN_SERVICE\""
            - "data.wheelchair_positions == 0 and data.ambulatory_seats == 0"
            - "data.open_wheelchair_reservations == 0 and data.open_ambulatory_reservations == 0"
            - "data.version == 1"

      - name: trip_event_points_assessed_is_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.TripEvent.fields.points_assessed
          - entities.TripEvent.fields.recorded_at
          - calculations.no_show_points_balance
        distinguishing_aspect: "points_assessed and recorded_at have source computed: a client that submits points_assessed 99 and recorded_at 1999-01-01 still gets 1 point for a LATE_CANCEL and recorded_at at the logical clock."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one Applicant with no TripEvents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Dov Halperin", date_of_birth: "1972-09-09", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-30", event_type: "LATE_CANCEL", points_assessed: 99, recorded_at: "1999-01-01T00:00:00Z", excused: true }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { ev_id: $.data.id, pts: $.data.points_assessed }
          assert:
            - "HTTP 201 with data.points_assessed == 1 (LATE_CANCEL), NOT 99"
            - "data.recorded_at == \"2026-08-01T00:00:00.000Z\", NOT \"1999-01-01T00:00:00.000Z\""
            - "data.excused == false (the client-supplied true is ignored; only POST /trip-events/{id}/excuse sets it)"
            - "Applicant.${rider_id}.no_show_points_event_basis == 1 and scheduled_trip_count_90d == 1"

      - name: applicant_system_fields_are_server_minted_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Applicant
          - complexity_profile.consistency_model
        distinguishing_aspect: "id, created_at, updated_at and version are system fields: a create that supplies all four gets a server-minted UUID with no type prefix, created_at at the logical clock and version 1."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Esme Radcliffe", date_of_birth: "1948-12-24", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE", id: "applicant-supplied-id", created_at: "1990-01-01T00:00:00Z", version: 77 }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          assert:
            - "HTTP 201 and data.id != \"applicant-supplied-id\" (server-minted UUID, no type prefix)"
            - "data.created_at == \"2026-08-01T00:00:00.000Z\" and data.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "data.version == 1, NOT 77"
            - "GET /applicants/applicant-supplied-id returns HTTP 404 with data.error_id == \"ERR_APPLICANT_NOT_FOUND\""

      - name: applicant_unknown_residence_zone_enum_value_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Applicant.fields.residence_zone
          - validations.priority_20.ERR_INVALID_REQUEST
        distinguishing_aspect: "residence_zone is a closed enum (IN_SERVICE_AREA | OUT_OF_SERVICE_AREA); any other token is a 400 and no row is created, so the very next create with a legal value is the first Applicant in the database."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Faisal Rahman", date_of_birth: "1965-05-05", residence_zone: "SUBURBAN_FRINGE", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { enum_err: $.data.error_id }
            - call: "POST /applicants"
              payload: { full_name: "Faisal Rahman", date_of_birth: "1965-05-05", residence_zone: "OUT_OF_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { ok_id: $.data.id }
          assert:
            - "the bad-enum call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "the legal call returns HTTP 201 with data.residence_zone == \"OUT_OF_SERVICE_AREA\" and version == 1"

      - name: assessment_slot_with_ends_at_before_starts_at_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.AssessmentSlot.fields.starts_at
          - entities.AssessmentSlot.fields.ends_at
          - validations.priority_20.ERR_INVALID_REQUEST
        distinguishing_aspect: "The interval range check (starts_at strictly before ends_at) is a 400 request-shape error at priority 20, so it pre-empts the priority-58 evaluator conflict and the priority-63 past-slot rule even when those also fail."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; no AssessmentSlots"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T11:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { range_err: $.data.error_id }
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-07-20T09:00:00Z", ends_at: "2026-07-20T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { past_err: $.data.error_id }
          assert:
            - "the inverted-interval call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "the past-slot call returns HTTP 422 with data.error_id == \"ERR_SLOT_IN_PAST\" (starts_at must be strictly after the logical clock)"
            - "GET /assessment-slots/${range_err} is never attempted — no slot row exists after either call"

      - name: assessment_create_with_unknown_slot_id_returns_slot_not_found
        claim_type: parent_relationships
        grounds:
          - entities.FunctionalAssessment.fields.slot_id
          - validations.priority_10.existence
          - errors.ERR_SLOT_NOT_FOUND
        distinguishing_aspect: "The slot_id foreign key is resolved at priority 10, before the priority-59 capacity check and the priority-41 accessibility check, so an unknown slot is a 404 ERR_SLOT_NOT_FOUND rather than any 4xx business error."
        test_recipe:
          setup:
            - "one Applicant whose Application is ASSESSMENT_REQUIRED (verification ACCEPTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Gita Naraine", date_of_birth: "1959-08-08", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 200, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. K Oyelaran", provider_type: "PHYSICIAN", provider_license_number: "MD-90001" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["arthritis"], attests_permanent: true }
              as: IntakeClerk
              captures: { appn_state: $.data.status }
          trigger:
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "00000000-0000-4000-8000-0000000000aa", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { slot_nf: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SLOT_NOT_FOUND\""
            - "Application.${appn_id}.status == \"ASSESSMENT_REQUIRED\" (unchanged — the failed create fires no transition)"
            - "GET /assessments?application_id=${appn_id} returns total_count == 0"

      - name: booking_create_with_unknown_vehicle_id_returns_vehicle_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.TransportationBooking.fields.vehicle_id
          - errors.ERR_VEHICLE_NOT_FOUND
        distinguishing_aspect: "The topology is flat, so cross-reference integrity is enforced per foreign key on the request body: a valid assessment_id paired with an unknown vehicle_id resolves to ERR_VEHICLE_NOT_FOUND specifically, and the reverse-reachability read GET /transportation-bookings?assessment_id= still returns an empty page."
        test_recipe:
          setup:
            - "one Applicant with a SCHEDULED FunctionalAssessment on a 2026-08-05T09:00:00Z slot; no Vehicle in the fleet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Hana Ito", date_of_birth: "1962-11-11", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 220, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. L Kimura", provider_type: "PHYSICIAN", provider_license_number: "MD-90002" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["cardiac limitation"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "00000000-0000-4000-8000-0000000000bb", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { veh_nf: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_VEHICLE_NOT_FOUND\""
