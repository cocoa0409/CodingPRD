          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ARTERIAL segment 2000.00 ft x 60.00 ft (area 13333.33 SY) whose 60 ft width drives the raw width factor to 1.36, above the 1.25 clamp."
            - "Its accepted observation measures PCI 30.0 — condition_band POOR, which selects RECONSTRUCTION and applies the 1.05 condition penalty."
            - "Survey sealed so candidate generation is legal."
          setup_api_calls:
