              captures: { dup_pol_err: $.data.error_id }
            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eqp/mandatory-offers/${off_2}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { late_err: $.data.error_id }
            - call: "POST /eqp/mandatory-offers/${off_2}/expire"
              payload: {}
              as: ProgramAdmin
