            - call: "POST /grandstand/show-bookings/${bk_a7}/contingency-actions"
              payload: { expected_show_booking_version: "${bkv_a7}", action_type: "POSTPONE", reason_code: "SEVERE_WEATHER", refund_policy: "RAIN_CHECK", replacement_show_date: "2026-08-26" }
              as: FairOperationsDirector
            - call: "GET /grandstand/show-bookings"
              payload: { postponed_from_booking_id: "${bk_a7}" }
              as: FairOperationsDirector
          assert:
            - "The POSTPONE with no replacement date returns HTTP 422 with ${err_g1} == ERR_REPLACEMENT_DATE_INVALID: presence is part of the same rule, not a generic ERR_INVALID_REQUEST."
            - "The POSTPONE whose replacement equals show_date 2026-08-22 returns HTTP 422 with ${err_g2} == ERR_REPLACEMENT_DATE_INVALID: the comparison is strictly after, so equality is a violation."
            - "The POSTPONE onto 2026-08-21 returns HTTP 422 with ${err_g3} == ERR_REPLACEMENT_DATE_INVALID: earlier than the current date is a violation even though 2026-08-21 is inside the fair run."
            - "The CANCEL carrying replacement_show_date 2026-08-26 returns HTTP 422 with ${err_g4} == ERR_REPLACEMENT_DATE_INVALID: the field is prohibited on CANCEL, not merely ignored."
            - "The POSTPONE onto 2026-08-26 returns HTTP 201 and the follow-up list returns total_count == 1, so exactly one replacement booking was ever minted."
            - "All four refusals reused the same expected_show_booking_version ${bkv_a7} and none of them was rejected as stale: a refused action never bumps ShowBooking.version."

      - name: announce_preconditions_fire_in_priority_order_31_then_44
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ADVANCE_HAS_OPEN_ITEMS
          - errors.ERR_ADVANCE_NOT_COMPLETE
          - errors.ERR_NO_TICKET_SCALES
          - validations.priority_32
          - validations.priority_31
          - validations.priority_44
        distinguishing_aspect: |
          Three separate 409/422 codes guard the announce gate and they surface in
          priority order: while a REQUESTED rider line remains, complete is refused with
          ERR_ADVANCE_HAS_OPEN_ITEMS and announce is refused with ERR_ADVANCE_NOT_COMPLETE
          (priority 31) even though the booking also has zero ticket scales; only once the
          advance is complete does the same announce fall through to
          ERR_NO_TICKET_SCALES (priority 44).
        test_recipe:
          setup:
            - "Canonical chain to an accepted offer, so a ProductionAdvance exists in ADVANCE_PENDING carrying its seed STAGING rider line in status REQUESTED."
            - "One extra HOSPITALITY rider line is added and also left REQUESTED, so two open lines exist and the first complete attempt has two reasons to fail."
            - "No TicketScale rows are created before the announce probes: the booking is deliberately left with an empty price structure so priorities 31 and 44 are both live at the same moment."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
