        distinguishing_aspect: "The POST /tickets response already carries the computed revenue_allocations (sum equal to purchase_price_cents) in the same request — immediate consistency."
        test_recipe:
          setup: ["Clock 2026-03-01. Agencies A[1],B[2],C[3]. FareProduct SINGLE (1->3 base 1000 peak 300) ZONE_COUNT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /agencies"
              payload: { code: "A", zones_served: [1] }
              as: FareAdmin
            - call: "POST /agencies"
              payload: { code: "B", zones_served: [2] }
              as: FareAdmin
            - call: "POST /agencies"
              payload: { code: "C", zones_served: [3] }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "im@x.com", full_name: "Im", date_of_birth: "1990-01-01" }
