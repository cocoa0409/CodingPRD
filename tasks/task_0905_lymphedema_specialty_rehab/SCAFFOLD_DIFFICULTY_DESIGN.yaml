        distinguishing_aspect: "On POST /sessions a request that violates BOTH a referential rule (session.authorization_id != plan.authorization_id -> ERR_AUTH_PLAN_MISMATCH, priority 7) and a temporal rule (start outside that auth's window -> ERR_SESSION_OUTSIDE_AUTH_WINDOW, priority 8) returns the referential error: business_referential (7) beats business_temporal (8)."
