          - entities.Lift.fields.mechanical_status
          - entities.Lift.fields.inspection_valid_until
        distinguishing_aspect: |
          A different entity from the session cycle, and non-linear for a different reason: Lift carries TWO
          parallel state dimensions driven by the SAME endpoint. One inspection FAIL moves mechanical_status
          INSPECTION_PASSED -> INSPECTION_FAILED and service_status OPEN -> MECH_HOLD; the following PASS
          moves mechanical_status back to INSPECTION_PASSED but service_status only as far as STANDBY, never
          back to OPEN. So the pair does not return to its starting combination, the dimensions must be
          tracked separately, and the served terrain area stays in PATROL_HOLD because the PATROL_HOLD -> OPEN
          re-gate requires the serving lift to be OPEN - a gate the PASS itself cannot satisfy.
