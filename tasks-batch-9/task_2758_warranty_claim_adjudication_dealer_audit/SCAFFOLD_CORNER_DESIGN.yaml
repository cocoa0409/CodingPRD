        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 10]
        distinguishing_aspect: |
          Both headers are load-bearing: omitting X-User-Role and omitting X-User-ID each produce the same 401
          ERR_UNAUTHENTICATED, and so does a role string outside the seven declared in §1.7 - an unknown role is
          not a 403.
        test_recipe:
          setup:
            - "WORLD-BRAKE without a claim, so dealer D1 exists and is readable."
            - "No authentication headers are sent on the first call; the second omits only X-User-ID; the third sends the unrecognised role string DealerSalesManager."
