          assert:
            - "the station=SANDWICH read returns total_count == 2 with has_more == false"
            - "${s1_seq} == 1"
            - "${s1_lead} == 0"
            - "${s2_seq} == 2"
            - "${s2_lead} == 180"
            - "the station=BEVERAGE read returns total_count == 2 with has_more == false"
            - "${b1_lead} == 0"
            - "${b2_lead} == 45"
            - "${b2_prom} == 2026-08-01T11:01:30Z"
