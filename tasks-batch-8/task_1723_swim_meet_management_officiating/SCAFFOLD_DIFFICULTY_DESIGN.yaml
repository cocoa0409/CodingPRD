          - state_machines.SwimEvent.SEEDED_to_IN_PROGRESS
          - errors[ERR_ENTRY_NOT_SCRATCHABLE]
        distinguishing_aspect: |
          Entity pair EventEntry x SwimEvent: the same scratch call succeeds while the entry's
          event is SEEDED and is rejected with ERR_ENTRY_NOT_SCRATCHABLE once that event flips
          to IN_PROGRESS — the entry's valid transitions are gated by a different entity's state
