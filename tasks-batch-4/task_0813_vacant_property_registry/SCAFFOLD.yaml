scenario: "Vacant & Abandoned Property Registry: lender/owner registration, maintenance-standard & inspection, code violation & fine/lien, foreclosure-status tracking, nuisance abatement & cost recovery, receivership referral, demolition list, reporting"
domain_name: "vacant-abandoned-property-registry"
api_prefix: "/registry"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by explicit foreign keys (registrant_id, property_id,
  # violation_id, source_fine_id). Property is the hub but children reference it
  # by FK rather than nesting in URL paths — no strict ownership tree.
  state_machine_shape: parallel
  # Property carries two independent state axes (registration_status x
  # foreclosure_status). Violation is cyclic; Fine is branching-with-revert.
  relationship_patterns:
    - one_to_many          # Property -> Inspection/Violation/Fine/Lien/AbatementOrder/LedgerEntry
    - cross_aggregate      # Fine -> Violation -> Inspection; Lien -> Fine
  role_model: peer_roles
  # Registrant owns property-side actions, CodeOfficer owns enforcement,
  # ProgramAdmin owns legal/program actions. Non-overlapping exclusive ops.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Registrant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the responsible owner or lender"
      - name: party_type
        type: enum
        source: input
        description: "Whether this registrant is the property OWNER or the foreclosing LENDER"
        constraints: "one of {LENDER, OWNER}"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: contact_phone
        type: string
        source: input
        description: "Contact phone number"
      - name: mailing_address
        type: string
        source: input
        description: "Mailing address for statutory notices"
      - name: license_number
        type: string
        source: input
        description: "State lender license number; required when party_type == LENDER, must be omitted/null when OWNER"
        default: null
        constraints: "required if party_type == LENDER"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: registrant_id
        type: string
        source: input
        description: "FK -> Registrant.id; the owner or lender responsible for this property"
      - name: parcel_id
        type: string
        source: input
        description: "County assessor parcel number"
        constraints: "unique across all Property rows"
      - name: street_address
        type: string
        source: input
        description: "Street address of the vacant/abandoned property"
      - name: occupancy_status
        type: enum
        source: input
        description: "Field-observed occupancy classification"
        constraints: "one of {VACANT, ABANDONED}"
      - name: registration_type
        type: enum
        source: input
        description: "Registration filed as LENDER or OWNER; must equal the registrant's party_type"
        constraints: "one of {LENDER, OWNER}"
      - name: registration_status
        type: enum
        source: system
        description: "Registration lifecycle axis (independent of foreclosure_status)"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, DEMOLISHED}"
      - name: foreclosure_status
        type: enum
        source: system
        description: "Foreclosure-tracking axis, advanced/redeemed independently of registration_status"
        default: NONE
        constraints: "one of {NONE, NOTICE_OF_DEFAULT, LIS_PENDENS, AUCTION_SCHEDULED, REO}"
      - name: registration_fee_cents
        type: integer
        source: computed
        description: "Registration fee (see calculations.registration_fee); charged to the ledger at creation"
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock instant the property was registered (basis for vacancy duration)"
      - name: registration_expires_at
        type: datetime
        source: system
        description: "registered_at + 365 days; extended by 365 days on each renewal"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Derived field: signed sum of all LedgerEntry.amount_cents for this property (see calculations.property_outstanding_balance); recomputed on every ledger insert"
      - name: lien_balance_cents
        type: integer
        source: computed
        description: "Derived field: sum of principal_cents over this property's RECORDED liens (see calculations.property_lien_balance)"
      - name: open_violation_count
        type: integer
        source: computed
        description: "Derived field: count of this property's Violations whose status is in {OPEN, ESCALATED}"

  - name: MaintenanceStandard
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Short code for the standard, e.g. SEC-01"
        constraints: "unique across all MaintenanceStandard rows"
      - name: category
        type: enum
        source: input
        description: "Maintenance category"
        constraints: "one of {SECURING, LANDSCAPING, STRUCTURAL, SANITATION, POOL_SAFETY}"
      - name: description
        type: string
        source: input
        description: "Human-readable standard text"
      - name: severity_weight
        type: integer
        source: input
        description: "Severity contribution used in condition scoring and demolition priority"
        constraints: "integer in [1,10]"
      - name: cure_period_days
        type: integer
        source: input
        description: "Days a cited violation of this standard has to be cured before it may be escalated"
        constraints: "integer >= 1"
      - name: base_fine_cents
        type: integer
        source: input
        description: "Base fine amount assessed for a violation of this standard"
        constraints: "integer >= 0"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being inspected"
      - name: inspector_badge
        type: string
        source: input
        description: "Opaque badge identifier of the assigned inspector (not a persisted entity); used for double-booking detection"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the scheduled inspection window (inclusive)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the scheduled inspection window (exclusive); must be strictly after scheduled_start"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED}"
      - name: result
        type: enum
        source: system
        description: "Outcome recorded at completion"
        default: null
        constraints: "one of {PASS, FAIL} once COMPLETED, else null"
      - name: failed_standard_codes
        type: array
        source: input
        description: "MaintenanceStandard.code values that failed; supplied at completion, must be empty when result == PASS"
        default: []
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant completion was recorded"
        default: null

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; property where the violation was cited"
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the failed inspection that produced this violation"
      - name: standard_code
        type: string
        source: system
        description: "Code of the violated standard (matches MaintenanceStandard.code); not an id reference"
      - name: severity_weight
        type: integer
        source: system
        description: "Severity copied from the referenced MaintenanceStandard at citation time"
      - name: status
        type: enum
        source: system
        description: "Violation lifecycle (cyclic: CURED may reopen to OPEN on re-inspection failure)"
        default: OPEN
        constraints: "one of {OPEN, CURED, ESCALATED, FINED, VOIDED}"
      - name: cited_at
        type: datetime
        source: system
        description: "Logical-clock instant the violation was cited"
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "cited_at + MaintenanceStandard.cure_period_days; escalation is blocked before this instant"
      - name: cured_at
        type: datetime
        source: system
        description: "Instant the violation was marked cured"
        default: null

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: system
        description: "FK -> Violation.id; the violation being fined"
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; denormalized owner property for ledger and reporting"
      - name: base_amount_cents
        type: integer
        source: system
        description: "Base fine copied from MaintenanceStandard.base_fine_cents at assessment"
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical-clock instant the fine was assessed (accrual epoch)"
      - name: daily_penalty_cents
        type: integer
        source: system
        description: "Per-day escalation penalty (constant DAILY_PENALTY_CENTS captured at assessment)"
        default: 500
      - name: accrued_amount_cents
        type: integer
        source: computed
        description: "PROVISIONAL live accrual to the current clock (see calculations.fine_accrual variant provisional)"
      - name: finalized_amount_cents
        type: integer
        source: system
        description: "Amount frozen at settlement (PAID/LIENED) using accrual to the settlement instant"
        default: null
      - name: status
        type: enum
        source: system
        description: "Fine lifecycle (branching with revert: DISPUTED can revert to ASSESSED)"
        default: ASSESSED
        constraints: "one of {ASSESSED, DISPUTED, PAID, WAIVED, LIENED}"
      - name: dispute_reason
        type: string
        source: input
        description: "Reason supplied when the fine is disputed"
        default: null
      - name: disputed_at
        type: datetime
        source: system
        description: "Instant the fine was disputed"
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Instant the fine was paid"
        default: null

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; the property encumbered by the lien"
      - name: source_fine_id
        type: string
        source: system
        description: "FK -> Fine.id; the fine that was converted into this lien"
      - name: principal_cents
        type: integer
        source: system
        description: "Lien principal = source fine finalized_amount_cents at recording; contributes to Property.lien_balance_cents while RECORDED"
      - name: interest_rate_bps
        type: integer
        source: system
        description: "Annual interest rate in basis points (constant LIEN_INTEREST_BPS)"
        default: 1000
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the lien was recorded (interest epoch)"
      - name: payoff_amount_cents
        type: integer
        source: computed
        description: "Principal plus accrued interest to the current clock, round-per-day-then-sum (see calculations.lien_payoff variant accrued)"
      - name: payoff_quoted_cents
        type: integer
        source: computed
        description: "Informational payoff estimate, sum-then-round (see calculations.lien_payoff variant quoted); diverges from payoff_amount_cents by the accumulated per-day rounding remainder"
      - name: status
        type: enum
        source: system
        description: "Lien lifecycle (branching)"
        default: RECORDED
        constraints: "one of {RECORDED, SATISFIED, FORECLOSED}"
      - name: satisfied_at
        type: datetime
        source: system
        description: "Instant the lien was satisfied or foreclosed"
        default: null

  - name: AbatementOrder
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property subject to nuisance abatement"
      - name: ordered_at
        type: datetime
        source: system
        description: "Logical-clock instant the abatement was ordered"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the on-site abatement work window (inclusive)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the on-site abatement work window (inclusive); must be strictly after scheduled_start"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: "Estimated abatement cost"
        constraints: "integer >= 0"
      - name: actual_cost_cents
        type: integer
        source: system
        description: "Actual abatement cost recorded at completion"
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Administrative surcharge computed at completion (see calculations.cost_recovery_charge)"
        default: null
      - name: recovered_amount_cents
        type: integer
        source: computed
        description: "Total cost recovery posted to the ledger at completion (see calculations.cost_recovery_charge)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Abatement lifecycle"
        default: ORDERED
        constraints: "one of {ORDERED, COMPLETED}"

  - name: ReceivershipReferral
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property referred for receivership"
      - name: referred_at
        type: datetime
        source: system
        description: "Logical-clock instant of referral"
      - name: ground
        type: enum
        source: input
        description: "Statutory ground for referral"
        constraints: "one of {CHRONIC_NUISANCE, STRUCTURAL_HAZARD, TAX_DELINQUENCY}"
      - name: receiver_name
        type: string
        source: input
        description: "Proposed receiver"
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle (branching fork)"
        default: REFERRED
        constraints: "one of {REFERRED, ACCEPTED, DENIED}"
      - name: decided_at
        type: datetime
        source: system
        description: "Instant the referral was decided"
        default: null

  - name: DemolitionListing
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property placed on the demolition list"
      - name: listed_at
        type: datetime
        source: system
        description: "Logical-clock instant the property was listed"
      - name: priority_score
        type: number
        source: computed
        description: "Weighted demolition priority computed at listing (see calculations.demolition_priority_score)"
      - name: status
        type: enum
        source: system
        description: "Demolition-list lifecycle"
        default: LISTED
        constraints: "one of {LISTED, SCHEDULED, DEMOLISHED, REMOVED}"
      - name: demolition_date
        type: datetime
        source: input
        description: "Scheduled demolition date, supplied when the listing is scheduled"
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; property whose ledger this entry belongs to"
      - name: entry_type
        type: enum
        source: system
        description: "Kind of ledger movement"
        constraints: "one of {REGISTRATION_FEE, FINE_ASSESSED, FINE_ACCRUAL, FINE_PAYMENT, FINE_WAIVED, FINE_LIENED, ABATEMENT_RECOVERY}"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount; positive increases outstanding_balance, negative decreases it"
      - name: source_type
        type: enum
        source: system
        description: "Originating entity kind for audit (polymorphic reference, not an id FK)"
        constraints: "one of {PROPERTY, FINE, LIEN, ABATEMENT_ORDER}"
      - name: source_id
        type: string
        source: system
        description: "Id of the originating entity (polymorphic; resolves against source_type, not a single-entity FK)"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant the movement was posted"
      - name: memo
        type: string
        source: system
        description: "Human-readable description of the movement"

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  # --- Property axis A: registration_status (cyclic ACTIVE<->SUSPENDED) ---
  - entity: Property
    dimension: registration_status
    initial_state: ACTIVE
    terminal_states: [DEMOLISHED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: LedgerEntry insert pushes outstanding_balance_cents >= SUSPEND_THRESHOLD_CENTS (100000)"
        actor: system
        preconditions:
          - "registration_status == ACTIVE"
          - "outstanding_balance_cents >= 100000 after the triggering ledger insert"
        side_effects:
          - "set registration_status = SUSPENDED"
          - "refresh updated_at; increment version by 1"
        note: "Auto-suspension; boundary is >= (exactly 100000 suspends)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: LedgerEntry insert drops outstanding_balance_cents < SUSPEND_THRESHOLD_CENTS (100000)"
        actor: system
        preconditions:
          - "registration_status == SUSPENDED"
          - "outstanding_balance_cents < 100000 after the triggering ledger insert"
        side_effects:
          - "set registration_status = ACTIVE"
          - "refresh updated_at; increment version by 1"
        note: "Auto-reinstatement completes the ACTIVE<->SUSPENDED cycle."
      - from: ACTIVE
        to: DEMOLISHED
        trigger: "POST /registry/properties/{id}/demolish"
        actor: ProgramAdmin
        preconditions:
          - "registration_status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "set registration_status = DEMOLISHED"
          - "CASCADE (hop 1, caused by DEMOLISHED): every Violation of this property in {OPEN, ESCALATED, FINED} transitions to VOIDED"
          - "CASCADE (hop 2, caused by a violation becoming VOIDED): every Fine whose violation was just VOIDED and whose status in {ASSESSED, DISPUTED} transitions to WAIVED, posting a FINE_WAIVED LedgerEntry of -base_amount_cents and recomputing outstanding_balance_cents"
          - "CASCADE: every DemolitionListing of this property in {LISTED, SCHEDULED} transitions to DEMOLISHED"
          - "refresh updated_at; increment version by 1"
      - from: SUSPENDED
        to: DEMOLISHED
        trigger: "POST /registry/properties/{id}/demolish"
        actor: ProgramAdmin
        preconditions:
          - "registration_status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "set registration_status = DEMOLISHED"
          - "CASCADE identical to the ACTIVE->DEMOLISHED transition"
          - "refresh updated_at; increment version by 1"

  # --- Property axis B: foreclosure_status (linear advance + redeem cycle) ---
  - entity: Property
    dimension: foreclosure_status
    initial_state: NONE
    terminal_states: [REO]
    transitions:
      - from: NONE
        to: NOTICE_OF_DEFAULT
        trigger: "POST /registry/properties/{id}/foreclosure {action: ADVANCE}"
        actor: Registrant
        preconditions:
          - "foreclosure_status == NONE"
          - "registration_status != DEMOLISHED"
        side_effects:
          - "advance foreclosure_status to NOTICE_OF_DEFAULT"
          - "refresh updated_at; increment version by 1"
      - from: NOTICE_OF_DEFAULT
        to: LIS_PENDENS
        trigger: "POST /registry/properties/{id}/foreclosure {action: ADVANCE}"
        actor: Registrant
        preconditions:
          - "foreclosure_status == NOTICE_OF_DEFAULT"
          - "registration_status != DEMOLISHED"
        side_effects:
          - "advance foreclosure_status to LIS_PENDENS"
          - "refresh updated_at; increment version by 1"
      - from: LIS_PENDENS
        to: AUCTION_SCHEDULED
        trigger: "POST /registry/properties/{id}/foreclosure {action: ADVANCE}"
        actor: Registrant
        preconditions:
          - "foreclosure_status == LIS_PENDENS"
          - "registration_status != DEMOLISHED"
        side_effects:
          - "advance foreclosure_status to AUCTION_SCHEDULED"
          - "refresh updated_at; increment version by 1"
      - from: AUCTION_SCHEDULED
        to: REO
        trigger: "POST /registry/properties/{id}/foreclosure {action: ADVANCE}"
        actor: Registrant
        preconditions:
          - "foreclosure_status == AUCTION_SCHEDULED"
          - "registration_status != DEMOLISHED"
        side_effects:
          - "advance foreclosure_status to REO (terminal for this axis)"
          - "refresh updated_at; increment version by 1"
      - from: NOTICE_OF_DEFAULT
        to: NONE
        trigger: "POST /registry/properties/{id}/foreclosure {action: REDEEM}"
        actor: Registrant
        preconditions:
          - "foreclosure_status in {NOTICE_OF_DEFAULT, LIS_PENDENS, AUCTION_SCHEDULED}"
        side_effects:
          - "reset foreclosure_status to NONE (redemption cycle)"
          - "refresh updated_at; increment version by 1"
        note: "REDEEM from LIS_PENDENS or AUCTION_SCHEDULED behaves identically; REO cannot be redeemed."

  - entity: Violation
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /registry/violations/{id}/transition {action: CURE}"
        actor: CodeOfficer
        preconditions:
          - "status == OPEN"
        side_effects:
          - "set status = CURED; set cured_at = clock"
          - "refresh updated_at; increment version by 1"
      - from: ESCALATED
        to: CURED
        trigger: "POST /registry/violations/{id}/transition {action: CURE}"
        actor: CodeOfficer
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "set status = CURED; set cured_at = clock (late cure)"
          - "refresh updated_at; increment version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /registry/violations/{id}/transition {action: ESCALATE}"
        actor: CodeOfficer
        preconditions:
          - "status == OPEN"
          - "clock >= cure_deadline_at"
        side_effects:
          - "set status = ESCALATED"
          - "refresh updated_at; increment version by 1"
      - from: CURED
        to: OPEN
        trigger: "system: POST /registry/inspections/{id}/complete with result FAIL re-cites the same standard_code on a property whose prior violation of that code is CURED"
        actor: system
        preconditions:
          - "status == CURED"
          - "a new failing inspection lists this violation's standard_code"
        side_effects:
          - "reopen: set status = OPEN; clear cured_at; reset cited_at = clock and recompute cure_deadline_at"
          - "refresh updated_at; increment version by 1"
        note: "Cyclic reopen edge (CURED -> OPEN)."
      - from: ESCALATED
        to: FINED
        trigger: "POST /registry/violations/{id}/fines"
        actor: CodeOfficer
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "set status = FINED"
          - "create Fine (status ASSESSED) and post FINE_ASSESSED LedgerEntry (see Fine machine)"
          - "refresh updated_at; increment version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "system: POST /registry/properties/{id}/demolish cascade"
        actor: system
        preconditions:
          - "status in {OPEN, ESCALATED}"
        side_effects:
          - "set status = VOIDED"
          - "refresh updated_at; increment version by 1"
      - from: ESCALATED
        to: VOIDED
        trigger: "system: POST /registry/properties/{id}/demolish cascade"
        actor: system
        preconditions:
          - "status in {OPEN, ESCALATED, FINED}"
        side_effects:
          - "set status = VOIDED"
          - "refresh updated_at; increment version by 1"
      - from: FINED
        to: VOIDED
        trigger: "system: POST /registry/properties/{id}/demolish cascade"
        actor: system
        preconditions:
          - "status in {OPEN, ESCALATED, FINED}"
        side_effects:
          - "set status = VOIDED (its Fine, if ASSESSED/DISPUTED, is WAIVED as cascade hop 2)"
          - "refresh updated_at; increment version by 1"

  - entity: Fine
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED, LIENED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /registry/fines/{id}/transition {action: PAY}"
        actor: Registrant
        preconditions:
          - "status == ASSESSED"
        side_effects:
          - "freeze finalized_amount_cents = fine_accrual(finalized) to clock; set paid_at = clock"
          - "post FINE_ACCRUAL LedgerEntry of +(finalized_amount_cents - base_amount_cents)"
          - "post FINE_PAYMENT LedgerEntry of -finalized_amount_cents"
          - "set status = PAID"
          - "recompute Property.outstanding_balance_cents"
          - "refresh updated_at; increment version by 1"
        note: "Net ledger contribution of this fine returns to 0 (see calculations invariant fine_ledger_conservation)."
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /registry/fines/{id}/transition {action: DISPUTE}"
        actor: Registrant
        preconditions:
          - "status == ASSESSED"
        side_effects:
          - "set status = DISPUTED; set disputed_at = clock; store dispute_reason"
          - "refresh updated_at; increment version by 1"
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /registry/fines/{id}/resolve-dispute {decision: DENY}"
        actor: ProgramAdmin
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "revert status = ASSESSED (dispute denied; accrual epoch unchanged)"
          - "refresh updated_at; increment version by 1"
        note: "Branch-with-revert edge (DISPUTED -> ASSESSED)."
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /registry/fines/{id}/resolve-dispute {decision: WAIVE}"
        actor: ProgramAdmin
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "set status = WAIVED"
          - "post FINE_WAIVED LedgerEntry of -base_amount_cents"
          - "recompute Property.outstanding_balance_cents"
          - "refresh updated_at; increment version by 1"
      - from: ASSESSED
        to: LIENED
        trigger: "POST /registry/fines/{id}/record-lien"
        actor: ProgramAdmin
        preconditions:
          - "status == ASSESSED"
          - "fine_accrual(finalized) to clock >= MIN_LIEN_CENTS (25000)"
        side_effects:
          - "freeze finalized_amount_cents = fine_accrual(finalized) to clock"
          - "post FINE_ACCRUAL LedgerEntry of +(finalized_amount_cents - base_amount_cents)"
          - "post FINE_LIENED LedgerEntry of -finalized_amount_cents"
          - "CASCADE: create Lien (status RECORDED, principal_cents = finalized_amount_cents), increasing Property.lien_balance_cents by principal_cents"
          - "set status = LIENED; recompute Property.outstanding_balance_cents"
          - "refresh updated_at; increment version by 1"

  - entity: Lien
    initial_state: RECORDED
    terminal_states: [SATISFIED, FORECLOSED]
    transitions:
      - from: RECORDED
        to: SATISFIED
        trigger: "POST /registry/liens/{id}/pay"
        actor: Registrant
        preconditions:
          - "status == RECORDED"
        side_effects:
          - "set status = SATISFIED; set satisfied_at = clock"
          - "principal leaves the RECORDED pool, decreasing Property.lien_balance_cents by principal_cents"
          - "refresh updated_at; increment version by 1"
        note: "Compensates record-lien on the lien_balance conserved quantity (see calculations invariant lien_principal_conservation)."
      - from: RECORDED
        to: FORECLOSED
        trigger: "POST /registry/liens/{id}/foreclose"
        actor: ProgramAdmin
        preconditions:
          - "status == RECORDED"
          - "Property.foreclosure_status == REO"
        side_effects:
          - "set status = FORECLOSED; set satisfied_at = clock"
          - "principal leaves the RECORDED pool, decreasing Property.lien_balance_cents by principal_cents"
          - "refresh updated_at; increment version by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /registry/inspections/{id}/complete"
        actor: CodeOfficer
        preconditions:
          - "status == SCHEDULED"
          - "if result == PASS then failed_standard_codes is empty; if result == FAIL then failed_standard_codes is non-empty and every code is a declared MaintenanceStandard.code"
        side_effects:
          - "set status = COMPLETED; set result; set performed_at = clock"
          - "recompute Property condition inputs"
          - "CASCADE (result FAIL): for each failed code create a Violation (status OPEN) or reopen a CURED violation of the same code (see Violation CURED->OPEN)"
          - "refresh updated_at; increment version by 1"

  - entity: AbatementOrder
    initial_state: ORDERED
    terminal_states: [COMPLETED]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /registry/abatement-orders/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "status == ORDERED"
          - "actual_cost_cents supplied and >= 0"
        side_effects:
          - "set status = COMPLETED; store actual_cost_cents"
          - "compute admin_fee_cents and recovered_amount_cents (see calculations.cost_recovery_charge)"
          - "post ABATEMENT_RECOVERY LedgerEntry of +recovered_amount_cents"
          - "recompute Property.outstanding_balance_cents"
          - "refresh updated_at; increment version by 1"

  - entity: ReceivershipReferral
    initial_state: REFERRED
    terminal_states: [ACCEPTED, DENIED]
    transitions:
      - from: REFERRED
        to: ACCEPTED
        trigger: "POST /registry/receivership-referrals/{id}/decide {decision: ACCEPT}"
        actor: ProgramAdmin
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "set status = ACCEPTED; set decided_at = clock"
          - "refresh updated_at; increment version by 1"
      - from: REFERRED
        to: DENIED
        trigger: "POST /registry/receivership-referrals/{id}/decide {decision: DENY}"
        actor: ProgramAdmin
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "set status = DENIED; set decided_at = clock"
          - "refresh updated_at; increment version by 1"

  - entity: DemolitionListing
    initial_state: LISTED
    terminal_states: [DEMOLISHED, REMOVED]
    transitions:
      - from: LISTED
        to: SCHEDULED
        trigger: "POST /registry/demolition-listings/{id}/schedule"
        actor: ProgramAdmin
        preconditions:
          - "status == LISTED"
          - "demolition_date supplied"
        side_effects:
          - "set status = SCHEDULED; store demolition_date"
          - "refresh updated_at; increment version by 1"
      - from: LISTED
        to: DEMOLISHED
        trigger: "system: POST /registry/properties/{id}/demolish cascade"
        actor: system
        preconditions:
          - "status in {LISTED, SCHEDULED}"
        side_effects:
          - "set status = DEMOLISHED"
          - "refresh updated_at; increment version by 1"
      - from: SCHEDULED
        to: DEMOLISHED
        trigger: "system: POST /registry/properties/{id}/demolish cascade"
        actor: system
        preconditions:
          - "status in {LISTED, SCHEDULED}"
        side_effects:
          - "set status = DEMOLISHED"
          - "refresh updated_at; increment version by 1"
      - from: LISTED
        to: REMOVED
        trigger: "system: POST /registry/properties/{id}/foreclosure {action: REDEEM} cascade"
        actor: system
        preconditions:
          - "status in {LISTED, SCHEDULED}"
        side_effects:
          - "set status = REMOVED (redemption clears the demolition list)"
          - "refresh updated_at; increment version by 1"
      - from: SCHEDULED
        to: REMOVED
        trigger: "system: POST /registry/properties/{id}/foreclosure {action: REDEEM} cascade"
        actor: system
        preconditions:
          - "status in {LISTED, SCHEDULED}"
        side_effects:
          - "set status = REMOVED"
          - "refresh updated_at; increment version by 1"

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: renew-stale-property
    parent_entity: Property
    write_endpoint: "POST /registry/properties/{id}/renew"
    occ_field: "expected_property_version"
    description: |
      Renewing a Property whose version has advanced since the client last
      observed it is rejected. A renewal legitimately supersedes the prior
      registration_expires_at, so a second renewal carrying a stale
      expected_property_version (the version bumped by the first renewal, or by
      any cascade that touched the property) is rejected on the stale-version
      check rather than silently extending an outdated view.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: registration_fee
    trigger: "POST /registry/properties (property creation)"
    algorithm: tiered_pricing
    formula: |
      base = (registration_type == LENDER) ? 20000 : 10000
      surcharge = (occupancy_status == ABANDONED) ? round(base * 0.5) : 0
      registration_fee_cents = base + surcharge
      # posted as a REGISTRATION_FEE LedgerEntry of +registration_fee_cents
    input_set: "the single property being created"
    constants:
      LENDER_BASE_CENTS: 20000
      OWNER_BASE_CENTS: 10000
      ABANDONED_SURCHARGE_PCT: 0.5
    precision: "integer cents, round_half_up"

  - name: fine_accrual
    trigger: "read on GET /registry/fines/{id} (provisional); frozen at Fine PAID/LIENED (finalized)"
    algorithm: threshold
    formula: |
      # days_overdue counts whole elapsed days from assessed_at to the eval instant
      days_overdue = floor((eval_instant - assessed_at) / 1 day)
      tier1_days = min(days_overdue, TIER2_THRESHOLD_DAYS)          # first 30 days
      tier2_days = max(days_overdue - TIER2_THRESHOLD_DAYS, 0)      # days on/after day 30
      raw = base_amount_cents
            + tier1_days * daily_penalty_cents
            + tier2_days * daily_penalty_cents * 2
      accrual = min(raw, base_amount_cents * MAX_MULTIPLE)          # cap at 3x base
    input_set: "the single fine; eval_instant = current clock (provisional) or settlement clock (finalized)"
    constants:
      DAILY_PENALTY_CENTS: 500
      TIER2_THRESHOLD_DAYS: 30
      MAX_MULTIPLE: 3
    precision: "integer cents"
    variants:
      - name: provisional
        when: "GET /registry/fines/{id}; fine still ASSESSED/DISPUTED"
        difference: "eval_instant = current clock, so the value grows as the clock advances; exposed as accrued_amount_cents, never written to the ledger"
      - name: finalized
        when: "Fine transitions to PAID or LIENED"
        difference: "eval_instant frozen at the settlement instant; written to finalized_amount_cents and reconciled into the ledger via FINE_ACCRUAL + FINE_PAYMENT/FINE_LIENED entries"

  - name: lien_payoff
    trigger: "read on GET /registry/liens/{id}; also evaluated at pay/foreclose"
    algorithm: aggregation
    formula: |
      # ACCRUED (chronological): per-whole-day interest, ROUND EACH DAY then SUM
      days = floor((eval_instant - recorded_at) / 1 day)
      daily_rate = interest_rate_bps / 10000 / 365
      day_interest = round_half_up(principal_cents * daily_rate)     # rounded to whole cents PER DAY
      accrued_interest = day_interest * days                         # pinned order: round-per-day THEN multiply/sum
      payoff_accrued = principal_cents + accrued_interest
      # QUOTED (forward_looking): single rounding at the end
      payoff_quoted = principal_cents + round_half_up(principal_cents * daily_rate * days)
    input_set: "the single lien; eval_instant = current clock"
    constants:
      LIEN_INTEREST_BPS: 1000
      DAY_COUNT: 365
    precision: "integer cents, round_half_up; rounding order is round-per-day-then-sum for the accrued variant"
    variants:
      - name: accrued
        when: "actual payoff at GET /registry/liens/{id}, /pay, /foreclose"
        difference: "rounds each day's interest to whole cents before summing (round-then-sum); exposed as payoff_amount_cents"
      - name: quoted
        when: "informational estimate"
        difference: "rounds once after multiplying the full-period interest (sum-then-round); diverges from accrued by the accumulated per-day rounding remainder"

  - name: property_outstanding_balance
    trigger: "recomputed on every LedgerEntry insert affecting the property"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(LedgerEntry.amount_cents
        for e in LedgerEntry where e.property_id == property.id)
      # entry_type in {REGISTRATION_FEE(+), FINE_ASSESSED(+), FINE_ACCRUAL(+),
      #   FINE_PAYMENT(-), FINE_WAIVED(-), FINE_LIENED(-), ABATEMENT_RECOVERY(+)}
    input_set: "all LedgerEntry rows for the property (append-only; no status filter, tie-break irrelevant since summed)"
    constants: {}
    precision: "integer cents"

  - name: property_lien_balance
    trigger: "recomputed when a Lien is recorded, satisfied, or foreclosed"
    algorithm: aggregation
    formula: |
      lien_balance_cents = sum(l.principal_cents
        for l in Lien where l.property_id == property.id and l.status == RECORDED)
    input_set: "the property's Liens filtered to status == RECORDED only"
    constants: {}
    precision: "integer cents"

  - name: demolition_priority_score
    trigger: "POST /registry/demolition-listings (computed at listing time)"
    algorithm: weighted_scoring
    formula: |
      severity_comp = min(sum(v.severity_weight
                              for v in Violation
                              where v.property_id == property.id
                                and v.status in {OPEN, ESCALATED}), 40)
      months_vacant = floor((clock - registered_at) / 30 days)
      vacancy_comp  = min(months_vacant * 2, 20)
      balance_comp  = min(floor(outstanding_balance_cents / 10000), 25)   # 1 pt per $100, cap 25
      foreclosure_comp = { REO:15, AUCTION_SCHEDULED:10, LIS_PENDENS:7,
                           NOTICE_OF_DEFAULT:4, NONE:0 }[foreclosure_status]
      priority_score = severity_comp + vacancy_comp + balance_comp + foreclosure_comp
    input_set: "the property, its OPEN/ESCALATED violations, its outstanding balance, its foreclosure_status"
    constants:
      SEVERITY_CAP: 40
      VACANCY_PT_PER_MONTH: 2
      VACANCY_CAP: 20
      BALANCE_CENTS_PER_POINT: 10000
      BALANCE_CAP: 25
    precision: "number, round_half_up to 2 decimals"

  - name: cost_recovery_charge
    trigger: "POST /registry/abatement-orders/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      # tiered administrative fee on the actual abatement cost
      if actual_cost_cents <= ADMIN_TIER1_CAP_CENTS:      # <= 100000
        admin_fee_cents = round_half_up(actual_cost_cents * 0.15)
      else:
        admin_fee_cents = round_half_up(ADMIN_TIER1_CAP_CENTS * 0.15)
                          + round_half_up((actual_cost_cents - ADMIN_TIER1_CAP_CENTS) * 0.10)
      recovered_amount_cents = actual_cost_cents + admin_fee_cents + INSPECTION_REIMB_CENTS
      # posted as an ABATEMENT_RECOVERY LedgerEntry of +recovered_amount_cents
    input_set: "the single abatement order at completion"
    constants:
      ADMIN_TIER1_CAP_CENTS: 100000
      ADMIN_TIER1_PCT: 0.15
      ADMIN_TIER2_PCT: 0.10
      INSPECTION_REIMB_CENTS: 5000
    precision: "integer cents, round_half_up; tier fees rounded independently then summed"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /registry/registrants"
  - priority: 2
    category: auth
    check: "the role is permitted for this endpoint per the RBAC matrix (and body action allowed for the role, e.g. lien PAY vs FORECLOSE)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path resource(s) exist, validated left-to-right"
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a {id} path segment (entity-specific NOT_FOUND error per resource)"
  - priority: 4
    category: existence
    check: "body foreign keys resolve: registrant_id on property create; property_id on inspection/abatement/receivership/demolition create"
    error_id: ERR_REGISTRANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /registry/properties, POST /registry/inspections, POST /registry/*/abatement-orders, receivership-referrals, demolition-listings"
  - priority: 5
    category: business_constraint
    check: "required body fields present and enum values legal; window fields well-formed types"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST with a body"
  - priority: 6
    category: business_referential
    check: "when registrant.party_type == LENDER, license_number must be present on registrant creation"
    error_id: ERR_LICENSE_REQUIRED
    http_status: 422
    applies_to: "POST /registry/registrants"
  - priority: 7
    category: business_referential
    check: "Property.registration_type must equal the referenced Registrant.party_type"
    error_id: ERR_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /registry/properties"
  - priority: 8
    category: business_constraint
    check: "Property.parcel_id is unique across all properties"
    error_id: ERR_DUPLICATE_PARCEL
    http_status: 409
    applies_to: "POST /registry/properties"
  - priority: 9
    category: state
    check: "target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (property foreclosure/demolish, violation transition/fines, fine transition/resolve-dispute/record-lien, lien pay/foreclose, inspection complete, abatement complete, receivership decide, demolition schedule)"
  - priority: 10
    category: business_temporal
    check: "inspection/abatement scheduled_end strictly after scheduled_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /registry/inspections, POST /registry/properties/{id}/abatement-orders"
  - priority: 11
    category: business_temporal
    check: "no other SCHEDULED inspection with the same inspector_badge whose half-open [scheduled_start, scheduled_end) overlaps; touching endpoints (end == start) are allowed"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /registry/inspections"
  - priority: 12
    category: business_temporal
    check: "no other non-terminal AbatementOrder on the same property whose closed [scheduled_start, scheduled_end] window is within ABATEMENT_BUFFER_HOURS (24h) of the new window; adjacency inside the buffer is rejected"
    error_id: ERR_ABATEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /registry/properties/{id}/abatement-orders"
  - priority: 13
    category: state
    check: "violation escalation requires clock >= cure_deadline_at (cure period elapsed)"
    error_id: ERR_CURE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /registry/violations/{id}/transition {action: ESCALATE}"
  - priority: 14
    category: business_referential
    check: "receivership referral allowed only when Property.foreclosure_status in {NOTICE_OF_DEFAULT, LIS_PENDENS}"
    error_id: ERR_FORECLOSURE_STAGE_INVALID
    http_status: 409
    applies_to: "POST /registry/properties/{id}/receivership-referrals"
  - priority: 15
    category: business_constraint
    check: "abatement order requires the property to have at least one Violation whose status is in {ESCALATED, FINED}"
    error_id: ERR_NO_ABATABLE_VIOLATION
    http_status: 409
    applies_to: "POST /registry/properties/{id}/abatement-orders"
  - priority: 16
    category: business_constraint
    check: "demolition listing requires Property.open_violation_count >= DEMOLITION_MIN_VIOLATIONS (3)"
    error_id: ERR_INSUFFICIENT_VIOLATIONS
    http_status: 409
    applies_to: "POST /registry/demolition-listings"
  - priority: 17
    category: business_fiscal
    check: "demolition listing requires Property.outstanding_balance_cents >= DEMOLITION_MIN_BALANCE_CENTS (50000)"
    error_id: ERR_BALANCE_BELOW_DEMOLITION_THRESHOLD
    http_status: 409
    applies_to: "POST /registry/demolition-listings"
  - priority: 18
    category: business_fiscal
    check: "record-lien requires the fine's finalized accrual to be >= MIN_LIEN_CENTS (25000)"
    error_id: ERR_LIEN_AMOUNT_TOO_LOW
    http_status: 409
    applies_to: "POST /registry/fines/{id}/record-lien"
  - priority: 19
    category: state
    check: "lien foreclose requires the encumbered Property.foreclosure_status == REO"
    error_id: ERR_PROPERTY_NOT_REO
    http_status: 409
    applies_to: "POST /registry/liens/{id}/foreclose"
  - priority: 20
    category: state
    check: "foreclosure ADVANCE cannot advance past REO; REDEEM requires foreclosure_status in {NOTICE_OF_DEFAULT, LIS_PENDENS, AUCTION_SCHEDULED}"
    error_id: ERR_FORECLOSURE_TERMINAL
    http_status: 409
    applies_to: "POST /registry/properties/{id}/foreclosure"
  - priority: 21
    category: state
    check: "renew OCC: expected_property_version must equal current Property.version"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /registry/properties/{id}/renew"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  - method: POST
    path: "/registry/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock to to_iso8601"]

  - method: POST
    path: "/registry/registrants"
    description: "Register an owner or lender party (self-service)."
    roles: [Anonymous]
    code: 201
    input: [legal_name, party_type, email, contact_phone, mailing_address, "license_number?"]
    output: Registrant
    side_effects: []

  - method: POST
    path: "/registry/properties"
    description: "Register a vacant/abandoned property under a registrant. Starts ACTIVE; foreclosure_status NONE; charges the registration fee to the ledger."
    roles: [Registrant]
    code: 201
    input: [registrant_id, parcel_id, street_address, occupancy_status, registration_type]
    output: Property
    side_effects:
      - "compute registration_fee_cents (calculations.registration_fee)"
      - "set registered_at = clock; registration_expires_at = clock + 365 days"
      - "post REGISTRATION_FEE LedgerEntry of +registration_fee_cents; recompute outstanding_balance_cents"

  - method: GET
    path: "/registry/properties/{id}"
    description: "Fetch a property including computed outstanding_balance_cents, lien_balance_cents, open_violation_count."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/registry/properties"
    description: "List/filter properties (also serves reverse lookup by registrant_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["registrant_id?", "registration_status?", "foreclosure_status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/registry/properties/{id}/renew"
    description: "Renew registration; extends registration_expires_at by 365 days. OCC-guarded on Property.version."
    roles: [Registrant]
    code: 200
    input: [expected_property_version]
    output: Property
    side_effects:
      - "extend registration_expires_at by 365 days"
      - "increments Property.version by 1"

  - method: POST
    path: "/registry/properties/{id}/foreclosure"
    description: "Advance foreclosure_status one stage (action ADVANCE) or reset it to NONE (action REDEEM)."
    roles: [Registrant, ProgramAdmin]
    code: 200
    input: [action]
    output: Property
    side_effects:
      - "advance or redeem foreclosure_status per the foreclosure state machine"
      - "REDEEM cascade: set LISTED/SCHEDULED DemolitionListings of this property to REMOVED"
      - "increments Property.version by 1"

  - method: POST
    path: "/registry/properties/{id}/demolish"
    description: "Mark the property DEMOLISHED (terminal) and run the demolition cascade."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Property
    side_effects:
      - "set registration_status = DEMOLISHED"
      - "cascade: OPEN/ESCALATED/FINED Violations -> VOIDED"
      - "cascade (caused by voiding): ASSESSED/DISPUTED Fines of voided violations -> WAIVED, post FINE_WAIVED ledger entries, recompute outstanding_balance_cents"
      - "cascade: LISTED/SCHEDULED DemolitionListings -> DEMOLISHED"
      - "increments Property.version by 1"

  - method: GET
    path: "/registry/properties/{id}/ledger"
    description: "List the property's LedgerEntry rows (reverse lookup for LedgerEntry.property_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/registry/maintenance-standards"
    description: "Create a maintenance standard (configuration)."
    roles: [ProgramAdmin]
    code: 201
    input: [code, category, description, severity_weight, cure_period_days, base_fine_cents]
    output: MaintenanceStandard
    side_effects: []

  - method: GET
    path: "/registry/maintenance-standards"
    description: "List maintenance standards."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: MaintenanceStandard[]
    side_effects: []

  - method: POST
    path: "/registry/inspections"
    description: "Schedule an inspection window for a property, assigned to an inspector badge."
    roles: [CodeOfficer]
    code: 201
    input: [property_id, inspector_badge, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["reject on inspector double-booking (half-open overlap)"]

  - method: GET
    path: "/registry/inspections/{id}"
    description: "Fetch an inspection."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/registry/inspections"
    description: "List/filter inspections (reverse lookup by property_id and by inspector_badge)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["property_id?", "inspector_badge?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/registry/inspections/{id}/complete"
    description: "Complete an inspection with a PASS/FAIL result; FAIL cites violations for each failed standard code."
    roles: [CodeOfficer]
    code: 200
    input: [result, "failed_standard_codes?"]
    output: Inspection
    side_effects:
      - "set status COMPLETED; set result; performed_at = clock"
      - "FAIL cascade: create/reopen a Violation per failed standard code (copies severity_weight, computes cure_deadline_at)"

  - method: GET
    path: "/registry/violations/{id}"
    description: "Fetch a violation including computed cure_deadline_at."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: GET
    path: "/registry/violations"
    description: "List/filter violations (reverse lookup by property_id and by inspection_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["property_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: POST
    path: "/registry/violations/{id}/transition"
    description: "Advance a violation: action CURE (-> CURED) or action ESCALATE (-> ESCALATED, requires cure period elapsed)."
    roles: [CodeOfficer]
    code: 200
    input: [action]
    output: Violation
    side_effects: ["CURE sets cured_at; ESCALATE requires clock >= cure_deadline_at"]

  - method: POST
    path: "/registry/violations/{id}/fines"
    description: "Assess a fine on an ESCALATED violation; transitions the violation to FINED and creates a Fine."
    roles: [CodeOfficer]
    code: 201
    input: []
    output: Fine
    side_effects:
      - "violation ESCALATED -> FINED"
      - "create Fine ASSESSED (base_amount_cents = standard.base_fine_cents, assessed_at = clock)"
      - "post FINE_ASSESSED LedgerEntry of +base_amount_cents; recompute outstanding_balance_cents"

  - method: GET
    path: "/registry/fines/{id}"
    description: "Fetch a fine including provisional accrued_amount_cents to the current clock."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: GET
    path: "/registry/fines"
    description: "List/filter fines (reverse lookup by violation_id and by property_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["violation_id?", "property_id?", "status?", "limit?", "offset?"]
    output: Fine[]
    side_effects: []

  - method: POST
    path: "/registry/fines/{id}/transition"
    description: "Owner/lender action on a fine: action PAY (-> PAID) or action DISPUTE (-> DISPUTED, with dispute_reason)."
    roles: [Registrant]
    code: 200
    input: [action, "dispute_reason?"]
    output: Fine
    side_effects:
      - "PAY: freeze finalized_amount_cents, post FINE_ACCRUAL + FINE_PAYMENT ledger entries, recompute balance"
      - "DISPUTE: set disputed_at, store dispute_reason"

  - method: POST
    path: "/registry/fines/{id}/resolve-dispute"
    description: "Adjudicate a disputed fine: decision DENY (-> ASSESSED) or decision WAIVE (-> WAIVED)."
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: Fine
    side_effects: ["WAIVE posts FINE_WAIVED ledger entry and recomputes balance"]

  - method: POST
    path: "/registry/fines/{id}/record-lien"
    description: "Convert an ASSESSED fine into a recorded Lien (fine -> LIENED)."
    roles: [ProgramAdmin]
    code: 201
    input: []
    output: Fine
    side_effects:
      - "freeze finalized_amount_cents; post FINE_ACCRUAL + FINE_LIENED ledger entries; recompute outstanding_balance_cents"
      - "cascade: create Lien (RECORDED, principal_cents = finalized_amount_cents), increasing lien_balance_cents"

  - method: GET
    path: "/registry/liens/{id}"
    description: "Fetch a lien including computed payoff_amount_cents (accrued variant) to the current clock."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Lien
    side_effects: []

  - method: GET
    path: "/registry/liens"
    description: "List/filter liens (reverse lookup by property_id and by source_fine_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["property_id?", "source_fine_id?", "status?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []

  - method: POST
    path: "/registry/liens/{id}/pay"
    description: "Satisfy a recorded lien (RECORDED -> SATISFIED)."
    roles: [Registrant]
    code: 200
    input: []
    output: Lien
    side_effects: ["decrease Property.lien_balance_cents by principal_cents"]

  - method: POST
    path: "/registry/liens/{id}/foreclose"
    description: "Foreclose a recorded lien (RECORDED -> FORECLOSED); requires Property.foreclosure_status == REO."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Lien
    side_effects: ["decrease Property.lien_balance_cents by principal_cents"]

  - method: POST
    path: "/registry/properties/{id}/abatement-orders"
    description: "Order nuisance abatement on a property. Requires an ESCALATED/FINED violation; rejects abatement windows within 24h of another order's window."
    roles: [ProgramAdmin]
    code: 201
    input: [scheduled_start, scheduled_end, estimated_cost_cents]
    output: AbatementOrder
    side_effects: ["set ordered_at = clock"]

  - method: GET
    path: "/registry/properties/{id}/abatement-orders"
    description: "List a property's abatement orders (reverse lookup for AbatementOrder.property_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AbatementOrder[]
    side_effects: []

  - method: POST
    path: "/registry/abatement-orders/{id}/complete"
    description: "Complete an abatement order with actual_cost_cents; computes and recovers cost to the ledger."
    roles: [ProgramAdmin]
    code: 200
    input: [actual_cost_cents]
    output: AbatementOrder
    side_effects:
      - "compute admin_fee_cents and recovered_amount_cents (calculations.cost_recovery_charge)"
      - "post ABATEMENT_RECOVERY LedgerEntry of +recovered_amount_cents; recompute outstanding_balance_cents"

  - method: POST
    path: "/registry/properties/{id}/receivership-referrals"
    description: "Refer a property to receivership; requires foreclosure_status in {NOTICE_OF_DEFAULT, LIS_PENDENS}."
    roles: [ProgramAdmin]
    code: 201
    input: [ground, receiver_name]
    output: ReceivershipReferral
    side_effects: ["set referred_at = clock"]

  - method: GET
    path: "/registry/properties/{id}/receivership-referrals"
    description: "List a property's receivership referrals (reverse lookup for ReceivershipReferral.property_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReceivershipReferral[]
    side_effects: []

  - method: POST
    path: "/registry/receivership-referrals/{id}/decide"
    description: "Decide a referral: decision ACCEPT (-> ACCEPTED) or decision DENY (-> DENIED)."
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: ReceivershipReferral
    side_effects: ["set decided_at = clock"]

  - method: POST
    path: "/registry/demolition-listings"
    description: "Place a property on the demolition list; requires >=3 open violations and outstanding balance >= 50000; computes priority_score."
    roles: [ProgramAdmin]
    code: 201
    input: [property_id]
    output: DemolitionListing
    side_effects: ["compute priority_score (calculations.demolition_priority_score); set listed_at = clock"]

  - method: GET
    path: "/registry/properties/{id}/demolition-listings"
    description: "List a property's demolition listings (reverse lookup for DemolitionListing.property_id)."
    roles: [Registrant, CodeOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DemolitionListing[]
    side_effects: []

  - method: POST
    path: "/registry/demolition-listings/{id}/schedule"
    description: "Schedule a listed property for demolition (LISTED -> SCHEDULED) with a demolition_date."
    roles: [ProgramAdmin]
    code: 200
    input: [demolition_date]
    output: DemolitionListing
    side_effects: ["set status SCHEDULED; store demolition_date"]

  - method: GET
    path: "/registry/reports/registry-summary"
    description: "Aggregate registry report: counts by registration_status and foreclosure_status, total outstanding balance and lien balance."
    roles: [ProgramAdmin]
    code: 200
    input: ["registration_status?", "foreclosure_status?"]
    output: "{ total_properties: integer, by_registration_status: object, by_foreclosure_status: object, total_outstanding_balance_cents: integer, total_lien_balance_cents: integer, demolition_listed_count: integer }"
    side_effects: []

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint, or body action not permitted for the role"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, illegal enum value, or malformed body"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "referenced property id (path or body) does not exist"
  - id: ERR_REGISTRANT_NOT_FOUND
    http: 404
    condition: "registrant_id on property creation does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id in path does not exist"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "violation id in path does not exist"
  - id: ERR_FINE_NOT_FOUND
    http: 404
    condition: "fine id in path does not exist"
  - id: ERR_LIEN_NOT_FOUND
    http: 404
    condition: "lien id in path does not exist"
  - id: ERR_ABATEMENT_ORDER_NOT_FOUND
    http: 404
    condition: "abatement order id in path does not exist"
  - id: ERR_RECEIVERSHIP_NOT_FOUND
    http: 404
    condition: "receivership referral id in path does not exist"
  - id: ERR_DEMOLITION_NOT_FOUND
    http: 404
    condition: "demolition listing id in path does not exist"
  - id: ERR_LICENSE_REQUIRED
    http: 422
    condition: "party_type == LENDER but license_number omitted on registrant creation"
  - id: ERR_TYPE_MISMATCH
    http: 422
    condition: "Property.registration_type does not equal the referenced Registrant.party_type"
  - id: ERR_DUPLICATE_PARCEL
    http: 409
    condition: "parcel_id already registered by another property"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a valid state for the requested transition"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "scheduled_end is not strictly after scheduled_start"
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "another SCHEDULED inspection for the same inspector_badge overlaps the half-open window"
  - id: ERR_ABATEMENT_WINDOW_CONFLICT
    http: 409
    condition: "another non-terminal abatement window on the property is within the 24h buffer"
  - id: ERR_CURE_PERIOD_ACTIVE
    http: 409
    condition: "escalation attempted before clock reaches cure_deadline_at"
  - id: ERR_FORECLOSURE_STAGE_INVALID
    http: 409
    condition: "receivership referral attempted when foreclosure_status not in {NOTICE_OF_DEFAULT, LIS_PENDENS}"
  - id: ERR_NO_ABATABLE_VIOLATION
    http: 409
    condition: "abatement order attempted with no ESCALATED/FINED violation on the property"
  - id: ERR_INSUFFICIENT_VIOLATIONS
    http: 409
    condition: "demolition listing attempted with open_violation_count < 3"
  - id: ERR_BALANCE_BELOW_DEMOLITION_THRESHOLD
    http: 409
    condition: "demolition listing attempted with outstanding_balance_cents < 50000"
  - id: ERR_LIEN_AMOUNT_TOO_LOW
    http: 409
    condition: "record-lien attempted when finalized fine accrual < 25000"
  - id: ERR_PROPERTY_NOT_REO
    http: 409
    condition: "lien foreclose attempted when Property.foreclosure_status != REO"
  - id: ERR_FORECLOSURE_TERMINAL
    http: 409
    condition: "foreclosure ADVANCE past REO, or REDEEM from NONE/REO"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "renew expected_property_version does not match current Property.version"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a registrant party"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/registrants"
    shared_operations: []

  - name: Registrant
    description: "Owner or lender party acting on their own properties, fines, and liens"
    identity: "entity_backed:Registrant"
    exclusive_operations:
      - "POST /registry/properties"
      - "POST /registry/properties/{id}/renew"
      - "POST /registry/fines/{id}/transition (PAY, DISPUTE)"
      - "POST /registry/liens/{id}/pay"
    shared_operations:
      - "POST /registry/properties/{id}/foreclosure (shared with ProgramAdmin)"
      - "all GET reads"

  - name: CodeOfficer
    description: "Municipal code-enforcement officer: inspections, violations, fine assessment"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/inspections"
      - "POST /registry/inspections/{id}/complete"
      - "POST /registry/violations/{id}/transition (CURE, ESCALATE)"
      - "POST /registry/violations/{id}/fines"
    shared_operations:
      - "all GET reads"

  - name: ProgramAdmin
    description: "Registry program administrator: standards, dispute adjudication, liens, abatement, receivership, demolition, reporting, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/_clock/set_current_utc"
      - "POST /registry/maintenance-standards"
      - "POST /registry/properties/{id}/demolish"
      - "POST /registry/fines/{id}/resolve-dispute"
      - "POST /registry/fines/{id}/record-lien"
      - "POST /registry/liens/{id}/foreclose"
      - "POST /registry/properties/{id}/abatement-orders"
      - "POST /registry/abatement-orders/{id}/complete"
      - "POST /registry/properties/{id}/receivership-referrals"
      - "POST /registry/receivership-referrals/{id}/decide"
      - "POST /registry/demolition-listings"
      - "POST /registry/demolition-listings/{id}/schedule"
      - "GET /registry/reports/registry-summary"
    shared_operations:
      - "POST /registry/properties/{id}/foreclosure (shared with Registrant)"
      - "all GET reads"
