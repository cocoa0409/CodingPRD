# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0462_climbing_gym_belay — EXPERT
# Nine §0.5 rules × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_settlement_returned_vs_lost_variant
        grounds:
          - calculations.rental_late_fee
          - state_machines.Rental.OUT_to_RETURNED
          - state_machines.Rental.OUT_to_LOST
          - entities.Rental.fields.late_fee_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          On a Rental (gear domain): the RETURNED variant computes late_fee from hours-late tiers
          (50h late, deposit 5000 -> fee 2400, refund 2600 credited to wallet) while the LOST variant
          forfeits the entire deposit (fee 5000, refund 0); identical deposit produces different settlements.
        test_recipe:
          setup:
            - "A FrontDesk-registered member with wallet_credit_cents=0."
            - "Two rentals checked out at clock 2026-06-01T00:00:00Z, each deposit 5000, due 2026-06-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Rae Renter", email: "rae@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${mem_id}", item_kind: "HARNESS", deposit_cents: 5000 }
              as: FrontDesk
              captures: { rent_a_id: $.data.id, rent_a_v: $.data.version }
            - call: "POST /rentals"
              payload: { member_id: "${mem_id}", item_kind: "SHOES", deposit_cents: 5000 }
              as: FrontDesk
              captures: { rent_b_id: $.data.id, rent_b_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T02:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /rentals/${rent_a_id}/return"
              payload: { expected_rental_version: "${rent_a_v}" }
              as: FrontDesk
            - call: "POST /rentals/${rent_b_id}/report-lost"
              payload: { expected_rental_version: "${rent_b_v}" }
              as: FrontDesk
          assert:
            - "Rental.${rent_a_id}.late_fee_cents == 2400"
            - "Rental.${rent_a_id}.refund_cents == 2600"
            - "Rental.${rent_b_id}.late_fee_cents == 5000"
            - "Rental.${rent_b_id}.refund_cents == 0"
            - "Member.${mem_id}.wallet_credit_cents == 2600"

      - name: freeze_credit_provisional_quote_vs_committed_variant
        grounds:
          - calculations.freeze_credit
          - state_machines.Membership.ACTIVE_to_FROZEN
          - entities.Membership.fields.frozen_at
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          On a Membership (billing domain, different entity from rental_late_fee): GET freeze-quote returns
          the provisional credit (3600) WITHOUT mutating wallet, while POST freeze commits the same 3600 to
          wallet_credit_cents; the quote variant leaves wallet at 0, the committed variant raises it to 3600.
        test_recipe:
          setup:
            - "A BASIC membership (fee 9000) created at clock 2026-06-01T00:00:00Z, cycle_end 2026-07-01T00:00:00Z, ACTIVE."
            - "Clock advanced to 2026-06-19T00:00:00Z (12 unused whole days to cycle_end)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Fern Freeze", email: "fern@x.com", date_of_birth: "1988-03-03" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: GymAdmin
            - call: "GET /memberships/${ms_id}/freeze-quote"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { quote_credit: $.data.freeze_credit_cents }
          trigger:
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "quote_credit == 3600"
            - "Member.${mem_id}.wallet_credit_cents == 3600 after freeze (quote did NOT mutate it; it was 0 before freeze)"
            - "Membership.${ms_id}.access_status == FROZEN"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: day_pass_price_youth_gear_nested_floor_mode_a
        grounds:
          - calculations.day_pass_price
          - entities.Member.fields.is_youth
          - entities.CheckIn.fields.price_cents
          - entities.CheckIn.fields.gear_bundle
        distinguishing_aspect: |
          MODE (a): price_cents has 3 inputs (is_youth, gear_bundle, base/bundle constants) with a non-linear
          branch — discount = floor(subtotal * 0.20) ONLY when is_youth. Youth+gear yields 2960
          (3700 - floor(740)); an adult with the same gear flag yields 3700, proving the conditional branch.
        test_recipe:
          setup:
            - "A youth member (DOB 2010-06-01, is_youth at created_at) with a VALID waiver."
            - "A facility with floor_capacity 50, requires_belay_cert false, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Yuki Youth", email: "yuki@x.com", date_of_birth: "2010-06-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mem_id}", minor_guardian_name: "Pat Parent" }
              as: FrontDesk
            - call: "POST /facilities"
              payload: { name: "Boulder Cave", floor_capacity: 50, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${mem_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", gear_bundle: true, expected_facility_version: "${fac_v}" }
              as: FrontDesk
          assert:
            - "CheckIn.price_cents == 2960"
            - "Facility.${fac_id}.occupancy == 1"

      - name: renewal_charge_wallet_then_card_pinned_order_mode_c
        grounds:
          - calculations.renewal_charge
          - calculations.freeze_credit
          - state_machines.Membership.CURRENT_to_CURRENT
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          MODE (c): the card charge is keyed on the post-wallet remainder, so evaluation order is pinned —
          wallet (3600) is drawn first, THEN card_charge = 9000 - 3600 = 5400 and wallet drops to 0. Computing
          card before wallet would yield a different (wrong) wallet/card split.
        test_recipe:
          setup:
            - "A BASIC membership with wallet_credit_cents=3600 (from a prior freeze) and resumed to ACTIVE."
            - "Clock advanced past cycle_end so a SUCCEEDED renewal is due."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Cory Cycle", email: "cory@x.com", date_of_birth: "1985-02-02" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { ms_v2: $.data.version }
            - call: "POST /memberships/${ms_id}/resume"
              payload: { expected_membership_version: "${ms_v2}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "SUCCEEDED" }
              as: FrontDesk
          assert:
            - "Member.${mem_id}.wallet_credit_cents == 0 (3600 wallet fully drawn)"
            - "Membership.${ms_id}.billing_status == CURRENT"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_parallel_billing_and_access_axes
        grounds:
          - state_machines.Membership.CURRENT_to_PAST_DUE
          - state_machines.Membership.ACTIVE_to_FROZEN
          - entities.Membership.fields.billing_status
          - entities.Membership.fields.access_status
        distinguishing_aspect: |
          On Membership: billing_status (CURRENT->PAST_DUE) and access_status (ACTIVE->FROZEN) are independent
          parallel dimensions on the same row — a membership can be PAST_DUE on billing while FROZEN on access,
          a state combination unreachable in a linear pipeline.
        test_recipe:
          setup:
            - "A BASIC membership created at clock 2026-05-01T00:00:00Z (cycle_end 2026-05-31T00:00:00Z)."
            - "Clock advanced to 2026-06-01T00:00:00Z (past cycle_end)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Dana Dual", email: "dana@x.com", date_of_birth: "1980-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "FAILED" }
              as: FrontDesk
              captures: { ms_v2: $.data.version }
          trigger:
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v2}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Membership.${ms_id}.billing_status == PAST_DUE"
            - "Membership.${ms_id}.access_status == FROZEN"

      - name: certification_branching_fork_pass_vs_fail
        grounds:
          - state_machines.Certification.REGISTERED_to_PASSED
          - state_machines.Certification.REGISTERED_to_FAILED
          - calculations.belay_weighted_score
          - entities.Certification.fields.passed_at
        distinguishing_aspect: |
          On Certification (different entity from Membership): REGISTERED forks to PASSED or FAILED with divergent
          side-effect sets — PASSED stamps passed_at/expires_at/examiner_user_id; FAILED leaves passed_at null.
          A station-floor failure (min 55 < 60) takes the FAIL branch even though the weighted 82 >= 80.
        test_recipe:
          setup:
            - "Two REGISTERED BELAY certifications on two members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Pass Member", email: "pass@x.com", date_of_birth: "1991-01-01" }
              as: FrontDesk
              captures: { mp_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Fail Member", email: "fail@x.com", date_of_birth: "1992-01-01" }
              as: FrontDesk
              captures: { mf_id: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${mp_id}", discipline: "BELAY" }
              as: Examiner
              captures: { cert_p_id: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${mf_id}", discipline: "BELAY" }
              as: Examiner
              captures: { cert_f_id: $.data.id }
          trigger:
            - call: "POST /certifications/${cert_p_id}/grade"
              payload: { knot: 90, commands: 85, catch: 70, lower: 95 }
              as: Examiner
            - call: "POST /certifications/${cert_f_id}/grade"
              payload: { knot: 95, commands: 90, catch: 55, lower: 95 }
              as: Examiner
          assert:
            - "Certification.${cert_p_id}.status == PASSED"
            - "Certification.${cert_p_id}.weighted_score == 84"
            - "Certification.${cert_f_id}.status == FAILED"
            - "Certification.${cert_f_id}.weighted_score == 82"
            - "Certification.${cert_f_id}.passed_at == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: serious_incident_three_hop_cascade
        grounds:
          - state_machines.Certification.PASSED_to_REVOKED
          - state_machines.Membership.access_status
          - state_machines.CheckIn.ON_FLOOR_to_CHECKED_OUT
          - entities.Incident.fields.severity
        distinguishing_aspect: |
          Depth-3 chain from a single SERIOUS Incident: (hop1) referenced PASSED Certification -> REVOKED;
          (hop2) BECAUSE the member's belay cert is revoked, their ACTIVE membership access_status -> SUSPENDED;
          (hop3) BECAUSE access is suspended, the member's ON_FLOOR CheckIn -> CHECKED_OUT and Facility.occupancy
          drops by 1. Each hop is caused by the prior hop's mutation, not the original action.
        test_recipe:
          setup:
            - "A member with a PASSED BELAY certification, an ACTIVE BASIC membership, a VALID waiver, and an ON_FLOOR check-in on a belay-required facility."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Ivy Injured", email: "ivy@x.com", date_of_birth: "1990-06-06" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mem_id}" }
              as: FrontDesk
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
            - call: "POST /certifications"
              payload: { member_id: "${mem_id}", discipline: "BELAY" }
              as: Examiner
              captures: { cert_id: $.data.id }
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 90, commands: 85, catch: 70, lower: 95 }
              as: Examiner
            - call: "POST /facilities"
              payload: { name: "Lead Wall", floor_capacity: 10, requires_belay_cert: true }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /check-ins"
              payload: { member_id: "${mem_id}", facility_id: "${fac_id}", entry_kind: "MEMBERSHIP", expected_facility_version: "${fac_v}" }
              as: FrontDesk
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /incidents"
              payload: { member_id: "${mem_id}", facility_id: "${fac_id}", severity: "SERIOUS", description: "Belay slip", certification_id: "${cert_id}" }
              as: GymAdmin
          assert:
            - "Certification.${cert_id}.status == REVOKED"
            - "Membership(member ${mem_id}).access_status == SUSPENDED"
            - "CheckIn.${ci_id}.status == CHECKED_OUT"
            - "Facility.${fac_id}.occupancy == 0"

      - name: clinic_cancel_two_hop_enrollment_cascade
        grounds:
          - state_machines.Clinic.SCHEDULED_to_CANCELLED
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Clinic.fields.enrolled_count
        distinguishing_aspect: |
          Depth-2 chain from a Clinic cancel (different trigger than the incident cascade): (hop1) Clinic
          SCHEDULED -> CANCELLED; (hop2) BECAUSE the clinic is cancelled, its ENROLLED Enrollment -> WITHDRAWN
          and enrolled_count recomputes to 0. The withdrawal is a consequence of the cancel, not a direct fan-out.
        test_recipe:
          setup:
            - "A SCHEDULED clinic (starts 2026-07-01) with one ENROLLED member, enrolled_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Cleo Clinic", email: "cleo@x.com", date_of_birth: "2009-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /clinics"
              payload: { title: "Youth Team", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T11:00:00Z", seat_capacity: 8 }
              as: GymAdmin
              captures: { cl_id: $.data.id, cl_v1: $.data.version }
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${mem_id}", expected_clinic_version: "${cl_v1}" }
              as: FrontDesk
              captures: { en_id: $.data.id, cl_v2: $.data.version }
          trigger:
            - call: "POST /clinics/${cl_id}/cancel"
              payload: { expected_clinic_version: "${cl_v2}" }
              as: GymAdmin
          assert:
            - "Clinic.${cl_id}.status == CANCELLED"
            - "Enrollment.${en_id}.status == WITHDRAWN"
            - "Clinic.${cl_id}.enrolled_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_safety_beats_capacity_fiscal_on_checkin
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          On POST /check-ins a request that BOTH lacks a valid waiver (business_safety, priority 7) AND targets a
          full facility (business_fiscal, priority 13) returns ERR_WAIVER_INVALID, not ERR_CAPACITY_FULL —
          safety category outranks fiscal category.
        test_recipe:
          setup:
            - "A facility with floor_capacity 1, already at occupancy 1 (full) from another member's check-in."
            - "A second member with NO waiver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Anchor One", email: "anchor1@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { m1_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m1_id}" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "No Waiver", email: "nowaiver@x.com", date_of_birth: "1991-01-01" }
              as: FrontDesk
              captures: { m2_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Tiny Wall", floor_capacity: 1, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /check-ins"
              payload: { member_id: "${m1_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v0}" }
              as: FrontDesk
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${m2_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WAIVER_INVALID (priority 7 wins over priority 13 ERR_CAPACITY_FULL)"
            - "Facility.${fac_id}.occupancy == 1 (rejected check-in did not increment)"

      - name: state_invalid_beats_capacity_fiscal_on_enroll
        grounds:
          - validations[priority=11]
          - validations[priority=13]
        distinguishing_aspect: |
          On POST /enrollments a request that BOTH targets a clinic whose enrollment window is closed
          (business_temporal, priority 11) AND a clinic at full seat_capacity (business_fiscal, priority 13)
          returns ERR_ENROLLMENT_WINDOW_CLOSED, not ERR_CAPACITY_FULL — temporal outranks fiscal.
        test_recipe:
          setup:
            - "A clinic seat_capacity 1, already at enrolled_count 1 (full), starts_at 2026-06-15."
            - "Clock advanced to 2026-06-16 (after starts_at, window closed)."
            - "A second member attempting to enroll."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Seat One", email: "seat1@x.com", date_of_birth: "2008-01-01" }
              as: FrontDesk
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Seat Two", email: "seat2@x.com", date_of_birth: "2008-02-02" }
              as: FrontDesk
              captures: { m2_id: $.data.id }
            - call: "POST /clinics"
              payload: { title: "Full Clinic", starts_at: "2026-06-15T09:00:00Z", ends_at: "2026-06-15T11:00:00Z", seat_capacity: 1 }
              as: GymAdmin
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${m1_id}", expected_clinic_version: "${cl_v0}" }
              as: FrontDesk
              captures: { cl_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${m2_id}", expected_clinic_version: "${cl_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ENROLLMENT_WINDOW_CLOSED (priority 11 wins over priority 13 ERR_CAPACITY_FULL)"
            - "Clinic.${cl_id}.enrolled_count == 1 (rejected enroll did not increment)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: facility_capacity_full_at_exact_floor_capacity
        grounds:
          - validations[priority=13]
          - calculations.day_pass_price
          - entities.Facility.fields.occupancy
        distinguishing_aspect: |
          Numeric threshold on Facility.occupancy via POST /check-ins: at occupancy == floor_capacity (2 of 2)
          the next check-in is rejected with ERR_CAPACITY_FULL (>= boundary), while at occupancy 1 of 2 it succeeds.
        test_recipe:
          setup:
            - "A facility floor_capacity 2, already at occupancy 2 from two waivered DAY_PASS check-ins."
            - "A third waivered member attempting to check in."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Cap A", email: "capa@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { ma_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${ma_id}" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "Cap B", email: "capb@x.com", date_of_birth: "1990-02-02" }
              as: FrontDesk
              captures: { mb_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mb_id}" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "Cap C", email: "capc@x.com", date_of_birth: "1990-03-03" }
              as: FrontDesk
              captures: { mc_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mc_id}" }
              as: FrontDesk
            - call: "POST /facilities"
              payload: { name: "Two Slot", floor_capacity: 2, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /check-ins"
              payload: { member_id: "${ma_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v0}" }
              as: FrontDesk
              captures: { fac_v1: $.data.version }
            - call: "POST /check-ins"
              payload: { member_id: "${mb_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v1}" }
              as: FrontDesk
              captures: { fac_v2: $.data.version }
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${mc_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAPACITY_FULL"
            - "Facility.${fac_id}.occupancy == 2 (unchanged)"

      - name: grace_sweep_suspends_at_exactly_seven_days
        grounds:
          - calculations.grace_sweep
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - entities.Membership.fields.past_due_since
        distinguishing_aspect: |
          Different metric (whole days overdue) reached through a different endpoint (POST /memberships/{id}/run-billing
          SWEEP): at exactly 7 days past_due the membership SUSPENDS (>= boundary), whereas a SWEEP at 6 days is a no-op
          leaving access_status ACTIVE.
        test_recipe:
          setup:
            - "A BASIC membership PAST_DUE since 2026-06-01T00:00:00Z (created 2026-05-01, FAILED at 2026-06-01)."
            - "Clock advanced to 2026-06-08T00:00:00Z (exactly 7 days overdue)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Gus Grace", email: "gus@x.com", date_of_birth: "1979-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "FAILED" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "SWEEP" }
              as: FrontDesk
          assert:
            - "Membership.${ms_id}.access_status == SUSPENDED"
            - "Membership.${ms_id}.billing_status == PAST_DUE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lead_grade_requires_passed_belay_on_member
        grounds:
          - state_machines.Certification.REGISTERED_to_PASSED
          - validations[priority=9]
          - entities.Certification.fields.discipline
        distinguishing_aspect: |
          Certification(LEAD) -> PASSED depends on the member's BELAY Certification being PASSED & not EXPIRED
          (Certification->Certification pair). Grading a LEAD cert with passing scores but no qualifying BELAY cert
          returns ERR_BELAY_PREREQUISITE_MISSING.
        test_recipe:
          setup:
            - "A member with NO belay certification and a REGISTERED LEAD certification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Lee Lead", email: "lee@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${mem_id}", discipline: "LEAD" }
              as: Examiner
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /certifications/${cert_id}/grade"
              payload: { knot: 95, commands: 95, catch: 95, lower: 95 }
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BELAY_PREREQUISITE_MISSING"
            - "Certification.${cert_id}.status == REGISTERED (grade rejected, no transition)"

      - name: membership_checkin_requires_active_access_status
        grounds:
          - validations[priority=10]
          - state_machines.Membership.access_status
          - entities.CheckIn.fields.entry_kind
        distinguishing_aspect: |
          CheckIn(MEMBERSHIP) -> ON_FLOOR depends on the member's Membership.access_status == ACTIVE
          (CheckIn->Membership pair, distinct from the Cert->Cert pair). A MEMBERSHIP check-in while the membership
          is FROZEN returns ERR_MEMBERSHIP_NOT_ACTIVE.
        test_recipe:
          setup:
            - "A member with a VALID waiver and a FROZEN BASIC membership."
            - "A facility with capacity 10, no belay requirement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Mara Member", email: "mara@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mem_id}" }
              as: FrontDesk
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v1: $.data.version }
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /facilities"
              payload: { name: "Open Wall", floor_capacity: 10, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${mem_id}", facility_id: "${fac_id}", entry_kind: "MEMBERSHIP", expected_facility_version: "${fac_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBERSHIP_NOT_ACTIVE"
            - "Facility.${fac_id}.occupancy == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_floor_live_occupancy_overlap
        grounds:
          - validations[priority=13]
          - entities.Facility.fields.occupancy
          - state_machines.CheckIn.ON_FLOOR_to_CHECKED_OUT
        distinguishing_aspect: |
          Facility uses LIVE-count interval semantics: a check-in occupies the floor only between checked_in_at and
          checked_out_at (an open-ended, instantaneously-released interval). After a member checks OUT, occupancy
          frees immediately so a new check-in on a capacity-1 facility succeeds — overlap is by current ON_FLOOR count,
          not by any fixed [start,end] window.
        test_recipe:
          setup:
            - "A capacity-1 facility with one ON_FLOOR member, plus a second waivered member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Occ A", email: "occa@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { ma_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${ma_id}" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "Occ B", email: "occb@x.com", date_of_birth: "1990-02-02" }
              as: FrontDesk
              captures: { mb_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${mb_id}" }
              as: FrontDesk
            - call: "POST /facilities"
              payload: { name: "Single", floor_capacity: 1, requires_belay_cert: false }
              as: GymAdmin
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /check-ins"
              payload: { member_id: "${ma_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v0}" }
              as: FrontDesk
              captures: { ci_a_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /check-ins/${ci_a_id}/check-out"
              payload: {}
              as: FrontDesk
              captures: { fac_v2: $.data.version }
          trigger:
            - call: "POST /check-ins"
              payload: { member_id: "${mb_id}", facility_id: "${fac_id}", entry_kind: "DAY_PASS", expected_facility_version: "${fac_v2}" }
              as: FrontDesk
          assert:
            - "second check-in succeeds (201); Facility.${fac_id}.occupancy == 1"

      - name: clinic_seat_overlap_persists_until_window
        grounds:
          - validations[priority=13]
          - entities.Clinic.fields.enrolled_count
          - validations[priority=11]
        distinguishing_aspect: |
          Clinic uses RESERVED-seat interval semantics distinct from Facility's live count: a seat stays occupied for
          the whole [now, starts_at) reservation window regardless of presence, and enroll is blocked once
          enrolled_count == seat_capacity. Unlike Facility, no check-out frees a seat mid-window — only a withdraw does.
        test_recipe:
          setup:
            - "A seat_capacity-1 clinic with one ENROLLED member, plus a second member, window still open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Enr A", email: "enra@x.com", date_of_birth: "2009-01-01" }
              as: FrontDesk
              captures: { ma_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Enr B", email: "enrb@x.com", date_of_birth: "2009-02-02" }
              as: FrontDesk
              captures: { mb_id: $.data.id }
            - call: "POST /clinics"
              payload: { title: "One Seat", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T11:00:00Z", seat_capacity: 1 }
              as: GymAdmin
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${ma_id}", expected_clinic_version: "${cl_v0}" }
              as: FrontDesk
              captures: { cl_v1: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { clinic_id: "${cl_id}", member_id: "${mb_id}", expected_clinic_version: "${cl_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAPACITY_FULL (seat still reserved; window open so not WINDOW_CLOSED)"
            - "Clinic.${cl_id}.enrolled_count == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rental_deposit_conservation_invariant
        grounds:
          - calculations.rental_late_fee
          - state_machines.Rental.OUT_to_RETURNED
          - entities.Rental.fields.late_fee_cents
          - entities.Rental.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity = deposit_cents on a Rental: across the OUT->RETURNED settlement,
          late_fee_cents + refund_cents == deposit_cents exactly (5000 = 2400 + 2600). No cents leak or are minted.
        test_recipe:
          setup:
            - "A rental deposit 5000, returned 50 hours late (clock 2026-06-04T02:00:00Z, due 2026-06-02T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Deb Deposit", email: "deb@x.com", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${mem_id}", item_kind: "ROPE", deposit_cents: 5000 }
              as: FrontDesk
              captures: { rent_id: $.data.id, rent_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T02:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /rentals/${rent_id}/return"
              payload: { expected_rental_version: "${rent_v}" }
              as: FrontDesk
          assert:
            - "Rental.${rent_id}.late_fee_cents == 2400"
            - "Rental.${rent_id}.refund_cents == 2600"
            - "Rental.${rent_id}.late_fee_cents + Rental.${rent_id}.refund_cents == 5000 (== deposit_cents)"

      - name: freeze_resume_cycle_fee_conservation_invariant
        grounds:
          - calculations.freeze_credit
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity = wallet store-credit value (different conserved quantity than rental deposit cents):
          freezing credits the prorated unused-cycle fee (3600) to wallet, and a subsequent renewal draws exactly that
          credit back against the next charge — the 3600 is conserved end-to-end (credited then fully redeemed, wallet 0).
        test_recipe:
          setup:
            - "A BASIC membership frozen at 2026-06-19 (credit 3600 to wallet), resumed, then renewed past cycle_end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: GymAdmin
            - call: "POST /members"
              payload: { full_name: "Wally Wallet", email: "wally@x.com", date_of_birth: "1986-01-01" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_tier: "BASIC" }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: GymAdmin
            - call: "POST /memberships/${ms_id}/freeze"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { ms_v2: $.data.version }
            - call: "GET /members/${mem_id}"
              payload: {}
              as: FrontDesk
              captures: { wallet_credited: $.data.wallet_credit_cents }
            - call: "POST /memberships/${ms_id}/resume"
              payload: { expected_membership_version: "${ms_v2}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00Z" }
              as: GymAdmin
          trigger:
            - call: "POST /memberships/${ms_id}/run-billing"
              payload: { outcome: "SUCCEEDED" }
              as: FrontDesk
          assert:
            - "wallet_credited == 3600 (credited at freeze)"
            - "Member.${mem_id}.wallet_credit_cents == 0 after renewal (3600 fully redeemed; conserved)"
