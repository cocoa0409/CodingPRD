  - section: errors
    instances:

      - name: err_stale_version_on_case_schedule
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[case-schedule-stale-truck]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Calling POST /cases/{cid}/schedule with an expected_truck_version that does not match the current Truck.version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; case TRIAGE; client holds a stale truck version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
