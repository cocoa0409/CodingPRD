            - { call: "POST /screening-packages", payload: { name: "P-CE2", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 10000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
