            - { call: "POST /spd/tray-templates", payload: { code: "THOR-01", name: "Thoracic Set", specialty: "THOR", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 15 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TR" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tr: "$.data.id" } }
            - { call: "POST /spd/trays/${tr}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tr}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tr}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tr}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lr: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lr}/trays", payload: { tray_id: "${tr}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lr}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lr}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lr}", as: Any, captures: { bir: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bir}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lr}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-A", surgeon: "Dr A", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { ca: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-B", surgeon: "Dr B", scheduled_start_at: "2026-05-10T12:45:00Z", scheduled_end_at: "2026-05-10T14:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cb: "$.data.id", cb_v: "$.data.version" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-C", surgeon: "Dr C", scheduled_start_at: "2026-05-10T12:44:00Z", scheduled_end_at: "2026-05-10T14:00:00Z", priority: "URGENT" }, as: OrScheduler, captures: { cc: "$.data.id", cc_v: "$.data.version" } }
          trigger:
            - { call: "POST /spd/or-cases/${ca}/reservations", payload: { tray_id: "${tr}", expected_or_case_version: "${ca_v}" }, as: OrScheduler, captures: { ra_st: "$.data.status" } }
            - { call: "POST /spd/or-cases/${cb}/reservations", payload: { tray_id: "${tr}", expected_or_case_version: "${cb_v}" }, as: OrScheduler, captures: { rb_st: "$.data.status" } }
            - { call: "POST /spd/or-cases/${cc}/reservations", payload: { tray_id: "${tr}", expected_or_case_version: "${cc_v}" }, as: OrScheduler, captures: { err: "$.data.error_id" } }
            - { call: "GET /spd/tray-reservations?tray_id=${tr}", as: Any }
          assert:
