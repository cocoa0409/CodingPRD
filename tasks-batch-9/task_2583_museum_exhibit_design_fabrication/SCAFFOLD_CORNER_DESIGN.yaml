  - section: consistency_model
    instances:
      - name: the_resolving_vote_returns_the_new_tally_and_the_resolution_in_one_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/review-rounds/{id}/votes
          - state_machines.ReviewRound
        distinguishing_aspect: |
          The vote endpoint deliberately returns the UPDATED round rather than the vote
          row it created, so the caller must see the incremented tally AND the resolved
          status in the same response - a two-phase implementation that resolves the
          round in a follow-up step returns status OPEN with cast_vote_count already at
          quorum, which is a state the machine never permits. The immediate model also
          reaches across aggregates: the package and the project counters are correct on
          a read taken directly afterwards, with no settling step. The round version is
          the tell-tale: §1.5 bumps it only when the round RESOLVES, so the first vote
          must leave it at 1 and the second must move it to 2.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with a DESIGN_DEV package under an OPEN three-role round"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { mv: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${mv}", stage: "DESIGN_DEV", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { mpkg: $.data.id }
            - call: "POST /design-packages/${mpkg}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { mrnd: $.data.id, mreq: $.data.required_vote_count, mrv: $.data.version }
          trigger:
            - call: "POST /review-rounds/${mrnd}/votes"
              payload: { decision: "APPROVE", comment: "Storyline reads clearly at the schematic level." }
              as: Curator
              as_user_id: cur-01
              captures: { n1cast: $.data.cast_vote_count, n1app: $.data.approve_count, n1st: $.data.status, n1v: $.data.version }
            - call: "GET /design-packages/${mpkg}"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { n1pkg: $.data.status, n1rc: $.data.review_round_count }
            - call: "POST /review-rounds/${mrnd}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { n2cast: $.data.cast_vote_count, n2app: $.data.approve_count, n2st: $.data.status, n2v: $.data.version, n2rev: $.data.revise_count, n2vet: $.data.veto_count }
            - call: "GET /design-packages/${mpkg}"
              payload: {}
              as: Conservator
              as_user_id: con-01
              captures: { n2pkg: $.data.status, n2revc: $.data.revision_count }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { n2or: $.data.open_revision_count, n2po: $.data.posture, n2ph: $.data.phase }
            - call: "GET /review-rounds/${mrnd}/votes"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
              captures: { nv0: "$.data[0].voter_role", nv1: "$.data[1].voter_role", nvd1: "$.data[1].decision" }
          assert:
            - "${mreq} == 2 == ceil(3 * 2 / 3) and ${mrv} == 1 - a freshly opened round is at version 1"
            - "${n1cast} == 1, ${n1app} == 1, ${n1st} == OPEN and ${n1v} == 1 - a non-resolving vote updates the tally in its own response and does NOT bump the round version"
            - "${n1pkg} == IN_REVIEW and ${n1rc} == 1 - the package moved when the round was opened, before any vote"
            - "${n2cast} == 2 == ${mreq}, ${n2app} == 2, ${n2rev} == 0, ${n2vet} == 0, ${n2st} == APPROVED and ${n2v} == 2 - the tally increment and the resolution arrive together, and the version moves only on resolution"
            - "${n2pkg} == APPROVED and ${n2revc} == 0 - the cascade into the package is visible on a read taken immediately afterwards, with no settling step"
            - "${n2or} == 0, ${n2po} == OPEN and ${n2ph} == DESIGN_DEV - an APPROVE outcome clears the open revision and does not revert the phase"
            - "${nv0} == Curator, ${nv1} == Conservator and ${nvd1} == APPROVE - both immutable vote rows are readable oldest first"

      - name: a_write_that_returns_a_different_entity_still_leaves_no_stale_read_behind
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/artifact-cases/{id}/placements
          - calculations.case_environmental_envelope
        distinguishing_aspect: |
          One write in this API returns an entity OTHER than the one whose derived state
          it rewrites: creating a placement returns the Artifact, while the strictest-wins
          environmental envelope it recomputes lives on the ArtifactCase. Under the
          immediate model the case read taken straight afterwards must already show the
          tightened bounds and the bumped case version - there is no window in which the
          artifact says RESERVED and the case still says it is empty. The instance also
          pins the other direction: the case create's own response already carries the
          empty-set envelope and the volume derived from its geometry, and the zone read
          taken immediately afterwards already shows the reserved slot, so no derived
          field anywhere in the graph lags a write.
