scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assistance_provisional_vs_final_divergence
        grounds:
          - calculations.provisional_assistance_quote
          - calculations.final_assistance_settlement
          - calculations.condition_deduction_schedule
          - calculations.holdover_penalty_accrual
          - state_machines.WorkoutCase.HANDOVER_INSPECTION_to_DISBURSEMENT_PENDING
        distinguishing_aspect: |
          Dual variant on the AGREEMENT/assistance-money domain: the same agreement
          carries provisional_assistance_cents (SELF_REPORTED basis) and
          final_assistance_cents (INSPECTED basis), and the two diverge by exactly
          the inspection deductions plus capped holdover penalty. The second
          dual_variant instance operates on the Loan-debt domain, not assistance.
        test_recipe:
          setup:
            - "DIL case for Loan LN-DV1 (UPB 20000000, accrued 300000, escrow 120000, fees 80000, rate 0.06, FMV 18000000, delinquency 90), borrower hardship MEDICAL, property OWNER_OCCUPIED"
            - "Case driven to AGREEMENT_ACTIVE; agreement vacate_date 2026-09-01, provisional 550000 (tier2 500000 x1.0 + 50000 MEDICAL)"
            - "Handover appointment 2026-09-05T10:00Z; inspection submitted on 2026-09-05 (1 penalty day past 3-day grace) with two MATERIAL deduction lines (CLEANLINESS_FAIL, DEBRIS_REMOVAL)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-DV1", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id, prov: $.data.provisional_assistance_cents } }
            - { call: "POST /property-solutions/agreements/${ag_id}/offer", payload: { offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}" }
            - { call: "POST /property-solutions/inspection-appointments", payload: { case_id: "${case_id}", inspector_id: "insp_1", appointment_type: HANDOVER, scheduled_start: "2026-09-05T10:00:00Z", scheduled_end: "2026-09-05T11:00:00Z" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { appt_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T10:30:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/inspection-appointments/${appt_id}/reports", payload: { broom_clean_verified: true, keys_returned_count: 2, line_items: [ { item_code: CLEANLINESS_FAIL, severity: MATERIAL }, { item_code: DEBRIS_REMOVAL, severity: MATERIAL } ] }, as: Inspector, as_user_id: insp_1, captures: { rep_id: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/inspection-reports/${rep_id}/submit", as: Inspector, as_user_id: insp_1, captures: { rep_total: $.data.total_deduction_cents, rep_result: $.data.result } }
          assert:
            - "SettlementAgreement.${ag_id}.provisional_assistance_cents == 550000"
            - "SettlementAgreement.${ag_id}.final_assistance_cents == 475002 (550000 - 59998 deductions - 15000 penalty; penalty = 1 day x 15000, under cap 275000)"
            - "SettlementAgreement.${ag_id}.condition_basis == INSPECTED"
            - "InspectionReport.${rep_id}.total_deduction_cents == 59998"
            - "InspectionReport.${rep_id}.result == PASSED_WITH_DEDUCTIONS"
            - "WorkoutCase.${case_id}.status == DISBURSEMENT_PENDING"
            - "WorkoutCase.${case_id}.remaining_assistance_cents == 475002"

      - name: deficiency_projected_vs_final_divergence
        grounds:
          - calculations.deficiency_waiver_amount
          - state_machines.DeficiencyWaiver.DOCUMENTED_to_EXECUTED
          - state_machines.DeedRecording.SUBMITTED_to_RECORDED
        distinguishing_aspect: |
          Dual variant on the LOAN-DEBT domain: projected_at_agreement accrues
          per-diem to the AGREED vacate_date while final_at_recording accrues to the
          ACTUAL recorded_at date; identical loan data yields 2601928 vs 2615080
          because recordation lands 4 days after the vacate date. Entity domain
          (Loan debt) differs from the assistance domain of the sibling instance.
        test_recipe:
          setup:
            - "DIL case LN-DV2 identical economics to LN-DV1 (per_diem 3288); agreement accepted 2026-08-01 with vacate_date 2026-09-01 (31-day projection window)"
            - "Clean handover inspection (no deduction lines) on 2026-09-05; full final assistance 535000 disbursed; waiver documented; recording submitted and confirmed on 2026-09-05 (35-day actual window from acceptance)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-DV2", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
            - { call: "POST /property-solutions/agreements/${ag_id}/offer", payload: { offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}" }
            - { call: "GET /property-solutions/cases/${case_id}/deficiency-waivers", as: LegalCounsel, as_user_id: lc_1, captures: { wv_id: "$.data[0].id", wv_proj: "$.data[0].projected_waiver_cents" } }
            - { call: "POST /property-solutions/inspection-appointments", payload: { case_id: "${case_id}", inspector_id: "insp_1", appointment_type: HANDOVER, scheduled_start: "2026-09-05T10:00:00Z", scheduled_end: "2026-09-05T11:00:00Z" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { appt_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T10:30:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/inspection-appointments/${appt_id}/reports", payload: { broom_clean_verified: true, keys_returned_count: 2, line_items: [] }, as: Inspector, as_user_id: insp_1, captures: { rep_id: $.data.id } }
            - { call: "POST /property-solutions/inspection-reports/${rep_id}/submit", as: Inspector, as_user_id: insp_1 }
            - { call: "POST /property-solutions/cases/${case_id}/disbursements", payload: { agreement_id: "${ag_id}", amount_cents: 535000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { disb_id: $.data.id } }
            - { call: "POST /property-solutions/disbursements/${disb_id}/approve", as: DisbursementOfficer, as_user_id: do_1 }
            - { call: "POST /property-solutions/disbursements/${disb_id}/release", as: DisbursementOfficer, as_user_id: do_2 }
            - { call: "POST /property-solutions/deficiency-waivers/${wv_id}/document", payload: { document_reference: "DOC-DV2" }, as: LegalCounsel, as_user_id: lc_1 }
            - { call: "POST /property-solutions/cases/${case_id}/deed-recordings", payload: { county: "Maricopa" }, as: LegalCounsel, as_user_id: lc_1, captures: { rec_id: $.data.id } }
            - { call: "POST /property-solutions/deed-recordings/${rec_id}/submit", as: LegalCounsel, as_user_id: lc_1 }
          trigger:
            - { call: "POST /property-solutions/deed-recordings/${rec_id}/confirm", payload: { instrument_number: "INST-DV2" }, as: LegalCounsel, as_user_id: lc_1 }
          assert:
            - "DeficiencyWaiver.${wv_id}.projected_waiver_cents == 2601928 (20500000 + 3288*31 - 18000000)"
            - "DeficiencyWaiver.${wv_id}.final_waiver_cents == 2615080 (20500000 + 3288*35 - 18000000)"
            - "DeficiencyWaiver.${wv_id}.status == EXECUTED"
            - "DeficiencyWaiver.${wv_id}.waived_amount_cents == 2615080"
            - "Loan.${loan_id}.deficiency_balance_cents == 0"
            - "Loan.${loan_id}.status == DEED_IN_LIEU_COMPLETED and servicing_system_synced == true"

  # =====================================================================
  # Rule 2 — combinatorial_formula (three different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assistance_cap_binds_after_tier_multiply_floor
        grounds:
          - calculations.provisional_assistance_quote
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — tier selection on UPB,
          occupancy multiplier, hardship bonus, floor-then-cap ordering. At UPB
          60000000 OWNER_OCCUPIED with INVOLUNTARY_UNEMPLOYMENT the raw result
          1250000 exceeds the cap; the pinned floor-before-cap order yields exactly
          1200000 (cap-last; a cap-before-bonus misreading would give 1300000 pre-floor).
        test_recipe:
          setup:
            - "Loan LN-CF1 UPB 60000000 (tier4 base 1150000), OWNER_OCCUPIED (x1.0), borrower hardship INVOLUNTARY_UNEMPLOYMENT (+100000); case driven to TERMS_NEGOTIATION via clean 92-day marketing and zero-lien title"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-CF1", unpaid_principal_balance_cents: 60000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.05, fair_market_value_cents: 70000000, delinquency_days: 120 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "C. Cap", email: "c@x.com", hardship_type: INVOLUNTARY_UNEMPLOYMENT, self_reported_condition_grade: A }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "9 Cap Way", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 65000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "C. Cap" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
          assert:
            - "SettlementAgreement.${ag_id}.provisional_assistance_cents == 1200000 (min(max(1150000*1.0 + 100000, 150000), 1200000))"
            - "SettlementAgreement.${ag_id}.status == DRAFT"

      - name: condition_deduction_per_item_rounding
        grounds:
          - calculations.condition_deduction_schedule
        distinguishing_aspect: |
          Mode (b): nested rounding order — rounding EACH line then summing yields
          59998 for MATERIAL CLEANLINESS_FAIL (22498.5->22499) plus MATERIAL
          DEBRIS_REMOVAL (37498.5->37499), while summing raw products then rounding
          would yield 59997. The scaffold pins round-per-item-then-sum.
        test_recipe:
          setup:
            - "DIL case LN-CF2 (same economics as LN-DV1) at VACATE_PENDING with handover appointment 2026-09-05T10:00Z; clock at handover"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-CF2", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
            - { call: "POST /property-solutions/agreements/${ag_id}/offer", payload: { offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}" }
            - { call: "POST /property-solutions/inspection-appointments", payload: { case_id: "${case_id}", inspector_id: "insp_1", appointment_type: HANDOVER, scheduled_start: "2026-09-05T10:00:00Z", scheduled_end: "2026-09-05T11:00:00Z" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { appt_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T10:30:00Z" }, as: ServicingAdmin }
          trigger:
            - { call: "POST /property-solutions/inspection-appointments/${appt_id}/reports", payload: { broom_clean_verified: true, keys_returned_count: 2, line_items: [ { item_code: CLEANLINESS_FAIL, severity: MATERIAL }, { item_code: DEBRIS_REMOVAL, severity: MATERIAL } ] }, as: Inspector, as_user_id: insp_1, captures: { rep_id: $.data.id } }
            - { call: "POST /property-solutions/inspection-reports/${rep_id}/submit", as: Inspector, as_user_id: insp_1 }
          assert:
            - "InspectionReport.${rep_id}.total_deduction_cents == 59998 (per-item round 22499 + 37499; sum-then-round would give 59997)"
            - "InspectionReport.${rep_id}.result == PASSED_WITH_DEDUCTIONS"

      - name: holdover_penalty_cap_evaluation_order
        grounds:
          - calculations.final_assistance_settlement
          - calculations.holdover_penalty_accrual
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the holdover penalty reduces
          final_assistance while its cap is 50% of assistance; the scaffold pins the
          cap against PROVISIONAL assistance (275000) computed before subtraction.
          A 29-day-late handover yields raw penalty 26*15000=390000, capped to
          275000, final = 550000 - 59998 - 275000 = 215002. Any order that caps
          against the final amount miscomputes.
        test_recipe:
          setup:
            - "DIL case LN-CF3 (same economics as LN-DV1) at AGREEMENT_ACTIVE, vacate 2026-09-01; handover appointment 2026-09-30T10:00Z (26 penalty days after grace)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-CF3", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
