      - name: s_document_signature_progression
        claim_type: valid_transition
        grounds: [state_machines.ClosingDocument, entities.ClosingDocument.fields.signed_party_ids]
        distinguishing_aspect: "Document walks OUT_FOR_SIGNATURE -> PARTIALLY_SIGNED -> FULLY_SIGNED as the two required signers sign in turn; signed_party_ids accumulates exactly [buyer, seller]."
        test_recipe:
          setup: ["CLEARED file; document requiring buyer and seller signatures, sent"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N128SG", serial_number: "S-17", make_model: "Citation M2", year: 2017 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files/${f}/documents", payload: { doc_type: "PURCHASE_AGREEMENT", required_signer_party_ids: ["${b}", "${s}"] }, as: EscrowOfficer, captures: { doc: $.data.id } }
            - { call: "POST /api/documents/${doc}/send", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/documents/${doc}/sign", payload: { signer_party_id: "${b}" }, as: EscrowOfficer, captures: { st1: $.data.status } }
            - { call: "POST /api/documents/${doc}/sign", payload: { signer_party_id: "${s}" }, as: EscrowOfficer, captures: { st2: $.data.status } }
          assert:
            - "after buyer signs: status == PARTIALLY_SIGNED"
            - "after seller signs: status == FULLY_SIGNED and signed_party_ids has exactly 2 entries"
      - name: s_hold_blocks_deposit_returns_file_on_hold
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "errors[ERR_FILE_ON_HOLD]"]
        distinguishing_aspect: "While the file is ON_HOLD, child mutations are blocked with ERR_FILE_ON_HOLD before any other business check (deposit create attempted with a correct OCC version)."
        test_recipe:
          setup: ["OPENED file placed ON_HOLD; version captured"]
