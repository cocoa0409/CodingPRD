        test_recipe:
          setup:
            - "A CA judgment with 5000000 cents principal at 0 bps whose version was read before the first offer was tendered."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-8001", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 0, entered_on: "2026-01-01" }
              as: CaseManager
              captures: { jud_id: $.data.id, v1: $.data.version }
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "CREDITOR", kind: "LUMP_SUM", amount_cents: 4500000, expires_at: "2026-12-01T00:00:00Z", expected_judgment_version: "${v1}" }
              as: CaseManager
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "DEBTOR", kind: "LUMP_SUM", amount_cents: 3200000, expires_at: "2026-12-01T00:00:00Z", responds_to_offer_id: "${o1}", expected_judgment_version: "${v1}" }
              as: Debtor
              as_user_id: "${dbt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_JUDGMENT_VERSION"
            - "HTTP status == 412"
            - "SettlementOffer.${o1}.status == OPEN"
            - "Judgment.${jud_id}.open_offer_count == 1"
            - "GET /settlement-offers?judgment_id=${jud_id} returns total_count == 1"

      - name: stale_debtor_version_on_skip_trace_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[skip-trace-stale-debtor]
          - validations[priority=13]
          - errors[ERR_STALE_DEBTOR_VERSION]
        distinguishing_aspect: "A second skip trace replaying the version read before the first trace is rejected with ERR_STALE_DEBTOR_VERSION (412), and Debtor.skip_trace_count stays 1."
        test_recipe:
          setup:
            - "A CA debtor whose version was read at creation and who has already had one successful skip trace run against that version."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id, dv1: $.data.version }
            - call: "POST /debtors/${dbt_id}/skip-trace"
              payload: { vendor: "TLOxp", located: true, hits_count: 3, expected_debtor_version: "${dv1}" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { loc1: $.data.locate_status, cnt1: $.data.skip_trace_count }
          trigger:
            - call: "POST /debtors/${dbt_id}/skip-trace"
              payload: { vendor: "IDI", located: false, hits_count: 0, expected_debtor_version: "${dv1}" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { err: $.data.error_id }
          assert:
            - "${loc1} == LOCATED"
            - "${cnt1} == 1"
            - "${err} == ERR_STALE_DEBTOR_VERSION"
            - "HTTP status == 412"
            - "Debtor.${dbt_id}.locate_status == LOCATED"
            - "Debtor.${dbt_id}.skip_trace_count == 1"

      - name: judgment_version_increments_by_one_on_a_recording_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Judgment.common_fields
          - state_machines.CountyFiling.SUBMITTED_to_RECORDED
        distinguishing_aspect: "Recording a county filing bumps Judgment.version by exactly 1 (v_after == v_before + 1) and refreshes updated_at, which is what makes a previously-read version stale."
        test_recipe:
          setup:
            - "A CA judgment with one SUBMITTED zero-fee CA county filing."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-8002", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 0, entered_on: "2026-01-01" }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { v_before: $.data.version }
          trigger:
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { v_after: $.data.version, posture: $.data.enforcement_posture }
          assert:
            - "${v_after} == ${v_before} + 1"
            - "${posture} == LIEN_PERFECTED"

      - name: skip_trace_supersede_stales_only_skip_trace_sourced_findings
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AssetFinding.VERIFIED_to_STALE
          - endpoints[POST /debtors/{debtor_id}/skip-trace]
          - entities.AssetFinding.fields.source
        distinguishing_aspect: "A new skip trace stales the VERIFIED SKIP_TRACE-sourced finding but leaves the VERIFIED PUBLIC_RECORD finding untouched, and the PRELIMINARY score falls from 88 to 64 accordingly."
        test_recipe:
          setup:
            - "A LOCATED CA debtor with one CA judgment carrying two VERIFIED findings of 2000000 cents each: one sourced SKIP_TRACE and one sourced PUBLIC_RECORD."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id, dv1: $.data.version }
            - call: "POST /debtors/${dbt_id}/skip-trace"
              payload: { vendor: "TLOxp", located: true, hits_count: 3, expected_debtor_version: "${dv1}" }
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-8003", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 0, entered_on: "2026-01-01" }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 2000000, source: "SKIP_TRACE" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_trace: $.data.id }
            - call: "POST /asset-findings/${af_trace}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "REAL_PROPERTY", institution_name: "LA County Recorder", identifier_last4: "0042", estimated_value_cents: 2000000, source: "PUBLIC_RECORD" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_public: $.data.id }
            - call: "POST /asset-findings/${af_public}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "GET /debtors/${dbt_id}"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { score0: $.data.recoverability_score, dv2: $.data.version }
          trigger:
            - call: "POST /debtors/${dbt_id}/skip-trace"
              payload: { vendor: "IDI", located: true, hits_count: 7, expected_debtor_version: "${dv2}" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { score1: $.data.recoverability_score, cnt: $.data.skip_trace_count }
          assert:
            - "${score0} == 88"
            - "AssetFinding.${af_trace}.status == STALE"
            - "AssetFinding.${af_public}.status == VERIFIED"
            - "${score1} == 64"
            - "${cnt} == 2"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: recording_cascade_is_visible_in_the_same_request_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CountyFiling.SUBMITTED_to_RECORDED
          - entities.Judgment.fields.costs_balance_cents
        distinguishing_aspect: "The adjudicate response itself already carries priority_rank 1 and lien_expires_on 2036-08-01, and an immediately following GET shows costs_balance_cents 3500, perfected_county_count 1 and posture LIEN_PERFECTED with no intervening call."
        test_recipe:
          setup:
            - "A CA judgment with 100000 cents principal at 0 bps and 0 filing costs, plus one SUBMITTED CA filing carrying a 3500-cent fee."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-9001", state_code: "CA", original_principal_cents: 100000, interest_rate_bps: 0, entered_on: "2026-01-01", filing_costs_cents: 0 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 3500 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
              captures: { rank: $.data.priority_rank, lexp: $.data.lien_expires_on, st: $.data.status }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { cb: $.data.costs_balance_cents, pcc: $.data.perfected_county_count, posture: $.data.enforcement_posture, tp: $.data.total_payoff_cents }
          assert:
            - "${st} == RECORDED"
            - "${rank} == 1"
            - "${lexp} == 2036-08-01"
            - "${cb} == 3500"
            - "${pcc} == 1"
            - "${posture} == LIEN_PERFECTED"
            - "${tp} == 103500"
