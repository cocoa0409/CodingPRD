# =============================================================================
# §1.9 Scaffold Corner Design — task 1968 (Prior Authorization UM Vendor)
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# All timestamps use the logical clock (startup default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities -----
  - section: entities
    instances:
      - name: provider_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Provider]
        distinguishing_aspect: "A new provider starts with gold_card_status NOT_GOLD_CARDED, null category, all counters 0, null rates, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /um/providers", payload: { npi: "2000000001", name: "Defaults Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin }
          assert:
            - "Provider.${p_id}.gold_card_status == NOT_GOLD_CARDED"
            - "Provider.${p_id}.gold_card_service_category == null"
            - "Provider.${p_id}.rolling_determination_count == 0 and rolling_approval_count == 0 and rolling_approval_rate == null"
            - "Provider.${p_id}.lifetime_determination_count == 0 and lifetime_approval_rate == null"
            - "Provider.${p_id}.version == 1"

      - name: provider_missing_required_npi_rejected
        claim_type: required_fields
        grounds: [entities.Provider.fields.npi, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input npi yields ERR_INVALID_REQUEST (400); each required field with source input and no default is enforced."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /um/providers", payload: { name: "No NPI Provider" }, as: UMAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: criteria_set_creation_client_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.ClinicalCriteriaSet]
        distinguishing_aspect: "Client-supplied id/status/version on create are ignored: the server mints id, sets status DRAFT, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /um/criteria-sets", payload: { name: "Ignored Fields Set", line_of_business: "MEDICAID", service_category: "DME", id: "11111111-2222-3333-4444-555555555555", status: "ACTIVE", version: 99 }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "cs_id != 11111111-2222-3333-4444-555555555555 (server-minted id)"
            - "st == DRAFT and v == 1 (client system-field values ignored)"

      - name: request_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND inside the fixed error envelope (response_type error, data.error_id + data.message, meta.api_request_id present)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /um/prior-auth-requests/123e4567-e89b-42d3-a456-426614174000", payload: {}, as: UMAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"
            - "error body carries response_type == 'error', data.message non-empty, meta.api_request_id present"

      - name: request_intake_client_status_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.PriorAuthRequest.fields.status, entities.PriorAuthRequest.fields.due_at]
        distinguishing_aspect: "Client-supplied status/due_at at intake are ignored; the server computes status from the auto-approval decision and due_at from the SLA matrix."
        test_recipe:
          setup:
            - "Active COMMERCIAL criteria set with published non-eligible guideline; provider"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000002", name: "Sneaky Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false, status: "APPROVED", due_at: "2030-01-01T00:00:00Z" }, as: IntakeSpecialist, captures: { st: $.data.status, due: $.data.due_at } }
          assert:
            - "st == PENDED_REVIEW (client status ignored; no auto-approval lane fired)"
            - "due == 2026-08-08T00:00:00.000Z (server-computed SLA, client due_at ignored)"

      - name: gold_card_evaluation_record_window_fields
        claim_type: creation
        grounds: [entities.GoldCardEvaluation]
        distinguishing_aspect: "A granted evaluation persists the observed window: window_start == clock-90d, window_end == clock, plus the count/rate snapshots used for the decision."
        test_recipe:
          setup:
            - "Active criteria set; provider with 10 reviewer approvals (all at default clock 2026-08-01)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000003", name: "Window Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w01: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w01}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w02: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w02}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w03: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w03}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-04", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w04: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w04}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-05", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w05: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w05}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-06", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w06: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w06}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-07", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w07: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w07}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-08", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w08: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w08}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w09: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w09}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "W-10", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { w10: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${w10}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
          trigger:
            - { call: "POST /um/providers/${p_id}/gold-card-evaluations", payload: { service_category: "IMAGING" }, as: UMAdmin, captures: { ev_id: $.data.id } }
            - { call: "GET /um/providers/${p_id}/gold-card-evaluations", payload: {}, as: UMAdmin, captures: { ws: "$.data[0].window_start", we: "$.data[0].window_end", wc: "$.data[0].window_determination_count", wr: "$.data[0].window_approval_rate", dec: "$.data[0].decision" } }
          assert:
            - "ws == 2026-05-03T00:00:00.000Z (evaluation clock 2026-08-01 minus 90 days)"
            - "we == 2026-08-01T00:00:00.000Z"
            - "wc == 10 and wr == 1.0 and dec == GRANTED"

      - name: request_list_pagination_and_filters
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /um/prior-auth-requests]"]
        distinguishing_aspect: "Default pagination returns 10 rows with total_count 12 and has_more true; offset 10 returns the remaining 2 with has_more false; status filter narrows the same collection."
        test_recipe:
          setup:
            - "Active criteria set; provider; 12 pended requests (all FAX, incomplete docs)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000004", name: "List Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-04", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-05", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-06", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-07", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-08", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-10", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-11", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "L-12", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist }
          trigger:
            - { call: "GET /um/prior-auth-requests", payload: {}, as: UMAdmin }
            - { call: "GET /um/prior-auth-requests", payload: { limit: 10, offset: 10 }, as: UMAdmin }
            - { call: "GET /um/prior-auth-requests", payload: { status: "PENDED_REVIEW" }, as: UMAdmin }
            - { call: "GET /um/prior-auth-requests", payload: { status: "APPROVED" }, as: UMAdmin }
          assert:
            - "unparameterized list returns exactly 10 rows with total_count == 12 and has_more == true (envelope pagination defaults)"
            - "offset page returns exactly 2 rows with total_count == 12 and has_more == false"
            - "status=PENDED_REVIEW filter returns total_count == 12"
            - "status=APPROVED filter returns total_count == 0 and zero rows"

  # ---------------------------------------------------------- state_machines --
  - section: state_machines
    instances:
      - name: reviewer_decision_on_auto_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PriorAuthRequest, "errors[ERR_REQUEST_NOT_PENDING]"]
        distinguishing_aspect: "reviewer-decision on an AUTO_APPROVED request fails with ERR_REQUEST_NOT_PENDING; no new determination is created (exactly one determination remains)."
        test_recipe:
          setup: ["Active criteria set with auto_approve_eligible guideline; provider; request auto-approved via PORTAL + complete docs"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: true, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000005", name: "Auto Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "PORTAL", documentation_complete: true }, as: IntakeSpecialist, captures: { req: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1", captures: { err: $.data.error_id } }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det_role: "$.data[0].decided_by_role" } }
          assert:
            - "st0 == AUTO_APPROVED (initial state RECEIVED is transient inside intake)"
            - "err == ERR_REQUEST_NOT_PENDING"
            - "exactly one determination exists for the request and det_role == SYSTEM_RULE"

      - name: withdraw_determined_request_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PriorAuthRequest, "errors[ERR_REQUEST_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdraw is only valid from PENDED_REVIEW/ESCALATED_MD; an APPROVED request rejects with ERR_REQUEST_NOT_WITHDRAWABLE and stays APPROVED."
        test_recipe:
          setup: ["Active criteria set; provider; one request approved by reviewer"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000006", name: "Withdraw Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/withdraw", payload: {}, as: IntakeSpecialist, captures: { err: $.data.error_id } }
            - { call: "GET /um/prior-auth-requests/${req}", payload: {}, as: UMAdmin, captures: { st: $.data.status } }
          assert:
            - "err == ERR_REQUEST_NOT_WITHDRAWABLE"
            - "st == APPROVED (unchanged)"

      - name: appeal_decide_after_upheld_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Appeal, "errors[ERR_INVALID_APPEAL_STATE]"]
        distinguishing_aspect: "UPHELD is terminal: a second decide on the same appeal fails with ERR_INVALID_APPEAL_STATE and decided_at stays at the first decision's timestamp."
        test_recipe:
          setup: ["Active criteria set; provider; denied request; appeal decided UPHELD by u-ar-1"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000007", name: "Appeal Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
