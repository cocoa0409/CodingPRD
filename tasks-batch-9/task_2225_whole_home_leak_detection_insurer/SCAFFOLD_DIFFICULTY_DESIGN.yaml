            - "After BEGIN_REVIEW succeeds, ReimbursementClaim.${c2}.status == UNDER_REVIEW and the second APPROVE returns HTTP 422 with ${err_cap} == ERR_ANNUAL_PAYOUT_CAP_EXCEEDED"
            - "ReimbursementClaim.${c2}.status is still UNDER_REVIEW after the rejected APPROVE: the cap check rejects rather than truncating the payout to 100000"
            - "InsurancePolicy.${pol1}.paid_payout_cents_total == 500000 throughout and ReimbursementClaim.${c1}.status == PAID with approved_payout_cents == 500000 and paid_at == 2026-08-01T07:00:00Z"
            - "ERR_SEGREGATION_OF_DUTIES never fires: the approving user adj-02 differs from Device.${d1}.install_verified_by_user_id == tech-01"
      - name: mode_transition_beats_snooze_cooldown
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - errors[ERR_MODE_TRANSITION_FORBIDDEN]
          - errors[ERR_SNOOZE_COOLDOWN_ACTIVE]
          - state_machines.Device.monitor_mode.SNOOZE_to_NORMAL
          - state_machines.Device.monitor_mode.NORMAL_to_VACATION
          - entities.Device.fields.snooze_window_end_at
        distinguishing_aspect: |
          One SNOOZE request violates BOTH priority 24 (category `business_constraint`: VACATION -> SNOOZE is not a
          declared transition) AND priority 25 (category `business_temporal`: the clock 2026-08-01T07:30Z is strictly
          before snooze_window_end_at 08:00Z + SNOOZE_COOLDOWN_MINUTES = 09:00Z); the response is
          ERR_MODE_TRANSITION_FORBIDDEN, and only after a revert to NORMAL makes the transition legal does the same
          request surface ERR_SNOOZE_COOLDOWN_ACTIVE. The category pair here is business_constraint x business_temporal,
          distinct from the state x business_fiscal pair of claim_state_beats_payout_cap.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
