            - "${by_proj_before} == 0 — the project lookup keys on linked_project_id, which is null until the link action runs"
            - "${cx1_triaged} == TRIAGED, ${cx1_linked} == LINKED and ${cx1_proj} == ${p1_id}"
            - "${by_proj_after} == 1 with ${by_proj_id} == ${cx1_id} — the same row is now reachable from all three parents"
            - "${by_status_total} == 1 with ${by_status_id} == ${cx1_id}, and ${req_open_total} == 1 with ${req_open_id} == ${cx2_id} — the status filter partitions the two complaints consistently across two different reverse lookups"

