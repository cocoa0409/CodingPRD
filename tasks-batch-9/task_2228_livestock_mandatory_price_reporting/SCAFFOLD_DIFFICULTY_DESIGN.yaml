  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: window_head_ledger_restored_by_correction_cycle
        grounds:
          - calculations.window_head_ledger
          - entities.ReportingWindow.fields.total_head_reported
          - entities.ReportingWindow.fields.accepted_submission_count
          - state_machines.Submission.ACCEPTED_to_UNDER_CORRECTION
          - state_machines.Submission.RESUBMITTED_to_ACCEPTED
        conserved_quantity: "ReportingWindow.total_head_reported == sum of Submission.reported_head over that window's ACCEPTED filings, and accepted_submission_count == the count of them"
        distinguishing_aspect: |
          Conserved quantity is the window's head ledger (integer head over ACCEPTED
          filings). A full correction cycle removes a filing's head and puts it back;
          because the ledger is recomputed from scratch on every transition rather than
          adjusted by deltas, the restored value is bit-identical to the original even
          though the window's version has advanced by several writes. Drift would show
          up as 1250 -> 1000 -> 1250 +/- something.
        test_recipe:
          setup:
            - "The three-reporter fixture in one OPEN weekly CATTLE LIVE_ANIMAL window: Alpha 500 head, Bravo 500 head, Cattle Coop 250 head, all ACCEPTED, so total_head_reported is 1250 over 3 filings."
