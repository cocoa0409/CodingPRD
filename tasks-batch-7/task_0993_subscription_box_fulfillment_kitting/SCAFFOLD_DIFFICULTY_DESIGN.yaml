              captures: { tc2_cp: $.data.id, tc2_cp_v: $.data.version }
            - { call: "POST /components/${tc2_cp}/receipts", payload: { quantity: 100, expected_component_version: "${tc2_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${tc2_cl}", name: "TC2 Box", sku: "PL-TC2", price_per_box_cents: 2000, shipping_weight_grams: 1200 }
              as: ClientOps
              as_user_id: "${tc2_cl}"
              captures: { tc2_pl: $.data.id, tc2_pl_v: $.data.version }
            - call: "POST /box-plans/${tc2_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${tc2_pl_v}" }
              as: ClientOps
              as_user_id: "${tc2_cl}"
              captures: { tc2_rv: $.data.id }
            - call: "PUT /kit-revisions/${tc2_rv}/bom-lines"
              payload: { lines: [{ component_id: "${tc2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${tc2_cl}"
            - { call: "POST /kit-revisions/${tc2_rv}/approve", as: ClientOps, as_user_id: "${tc2_cl}" }
            - { call: "POST /box-plans/${tc2_pl}/activate", as: ClientOps, as_user_id: "${tc2_cl}" }
            - call: "POST /box-plans/${tc2_pl}/import-batches"
              payload: { rows: [{ email: "tc2a@x.test", zone: 3 }, { email: "tc2b@x.test", zone: 3 }] }
              as: ClientOps
              as_user_id: "${tc2_cl}"
              captures: { tc2_ib: $.data.id }
            - { call: "POST /import-batches/${tc2_ib}/commit", as: ClientOps, as_user_id: "${tc2_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${tc2_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { tc2_rn: $.data.id }
            - { call: "POST /assembly-runs/${tc2_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${tc2_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${tc2_rn}/complete-kitting", payload: { actual_kitted_count: 2 }, as: WarehouseOps }
            - call: "GET /assembly-runs/${tc2_rn}/shipments"
              as: WarehouseOps
              captures: { tc2_sh1: "$.data[0].id", tc2_sh2: "$.data[1].id" }
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "GROUND", pickup_start: "2026-05-10T10:00:00Z", pickup_end: "2026-05-10T12:00:00Z" }
              as: WarehouseOps
              captures: { tc2_wv: $.data.id }
            - { call: "POST /shipping-waves/${tc2_wv}/assign-shipments", payload: { shipment_ids: ["${tc2_sh1}", "${tc2_sh2}"] }, as: WarehouseOps }
            - { call: "POST /shipping-waves/${tc2_wv}/manifest", as: WarehouseOps }
            - call: "GET /clients/${tc2_cl}/billing-statements"
              as: BillingAdmin
              captures: { tc2_st: "$.data[0].id", tc2_post_mid: "$.data[0].postage_cents", tc2_box_mid: "$.data[0].box_charge_cents" }
          trigger:
            - { call: "POST /shipping-waves/${tc2_wv}/cancel", as: WarehouseOps }
            - call: "GET /shipments/${tc2_sh1}"
              as: WarehouseOps
              captures: { tc2_sh1_ful: $.data.fulfill_status, tc2_sh1_lbl: $.data.label_status }
            - call: "GET /shipments/${tc2_sh2}"
