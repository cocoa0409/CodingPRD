              as: InventoryPlanner
              captures: { style_bare_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
          trigger:
