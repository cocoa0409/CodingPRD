              as: PlatformAdmin
              captures: { company_g_admin_id: $.data.id }
            - call: "POST /api/companies/${company_g_id}/users/${company_g_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_g_admin_id}"
            - call: "POST /api/companies/${company_g_id}/subscription/activate"
