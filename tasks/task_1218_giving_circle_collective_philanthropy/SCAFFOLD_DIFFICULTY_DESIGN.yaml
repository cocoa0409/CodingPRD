            - { call: "POST /api/members", payload: { full_name: "M Three", email: "m3.bp2@x.com" }, as: CircleAdmin, captures: { m3_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m3_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms3_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/memberships/${ms3_id}/accept", payload: {}, as: Member, as_user_id: "${m3_id}" }
            - { call: "POST /api/learning-sessions", payload: { cycle_id: "${cycle_id}", title: "Grantmaking 101", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z", capacity: 2 }, as: CircleAdmin, captures: { sess_id: $.data.id } }
            - { call: "POST /api/learning-sessions/${sess_id}/rsvp", payload: { membership_id: "${ms1_id}" }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/learning-sessions/${sess_id}/rsvp", payload: { membership_id: "${ms2_id}" }, as: Member, as_user_id: "${m2_id}" }
          trigger:
