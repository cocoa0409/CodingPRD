              captures: { room: $.data.id }
            - call: "POST /cabling/racks"
              payload: { telecom_room_id: "${room}", rack_code: "A", total_ru: 42 }
              as: DesignEngineer
              captures: { rack_a: $.data.id, rack_a_v1: $.data.version }
            - call: "POST /cabling/racks"
              payload: { telecom_room_id: "${room}", rack_code: "B", total_ru: 42 }
