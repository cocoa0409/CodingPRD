            - "response http status == 412"

  - section: calculations
    instances:
      - name: assessment_result_band_refer_and_flags
        claim_type: Correct Result
        grounds:
          - "calculations.assessment_result_band"
          - "entities.Assessment.fields.result_band"
        distinguishing_aspect: "raw_scores {communication:5, motor:50} totals 55 (<70) => result_band REFER with domain_flags == [communication] (5 < 10)."
        test_recipe:
          setup: ["ACTIVE enrollment with nurse N; one COMPLETED visit; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Band", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Band" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Band", mother_dob: "2003-03-03", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-05", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/complete"
              payload: { completed_date: "2026-05-05" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /assessments"
              payload: { visit_id: "${v1_id}", enrollment_id: "${enr_id}", instrument_type: "ASQ", raw_scores: { communication: 5, motor: 50 } }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          assert:
            - "response.data.result_band == REFER"
            - "response.data.domain_flags == [communication]"

      - name: visit_dosage_divergence_excluded
        claim_type: Variant Divergence
        grounds:
          - "calculations.visit_dosage"
        excluded_because:
          difficulty_instance: dual_variant_calc / dosage_to_date_vs_full_program_diverge
          rationale: "The two dosage variants and their divergence are asserted directly by the named §1.8 instance."
