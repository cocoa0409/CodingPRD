            - "BillableCharge.${acute_charge_id}.floor_adjustment_cents == 0"
            - "Visit.${visit_id}.gross_charge_total_cents == 3000"
            - "Visit.${visit_id}.payer_billed_total_cents == 0"
            - "Visit.${visit_id}.patient_responsibility_total_cents == 0"
            - "Visit.${visit_id}.write_off_total_cents == 0"
            - "Visit.${visit_id}.no_charge_total_cents == 3000"
            - "the residual gross_charge_total_cents - (payer_billed_total_cents + patient_responsibility_total_cents + write_off_total_cents + no_charge_total_cents) == 0 after the reversal"
            - "Visit.${visit_id}.clinical_status == COMPLETED"

