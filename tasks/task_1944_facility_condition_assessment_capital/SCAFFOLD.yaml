scenario: "1944. Facility Condition Assessment & Capital Planning (facility assessment consultant): asset inventory & condition rating by system, remaining useful life & replacement cost estimation, deficiency prioritization & facility condition index, multi-year capital plan & funding scenario modeling, deferred maintenance backlog reporting, code/accessibility deficiency identification, project bundling & phasing, plan refresh cycle & data maintenance"
domain_name: facility-condition-assessment-capital-planning
api_prefix: /fca

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the client organization
      - name: contact_email
        type: string
        source: input
        description: Primary administrative contact email

  - name: Facility
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; owning client organization
      - name: name
        type: string
        source: input
        description: Building or campus name
      - name: address
        type: string
        source: input
        description: Street address of the facility
      - name: gross_square_feet
        type: integer
        source: input
        description: Gross floor area; must be > 0
        constraints: "integer > 0"
      - name: current_replacement_value_cents
        type: integer
        source: computed
        description: Sum of replacement_cost_cents over all non-RETIRED AssetSystem rows of this facility; maintained by asset-system create/update/retire side effects
      - name: backlog_cost_cents
        type: integer
        source: computed
        description: Sum of cost_estimate_cents over Deficiency rows of this facility whose remediation_status IN {OPEN, IN_PROGRESS}; deferred-maintenance backlog total
      - name: facility_condition_index
        type: number
        source: computed
        description: backlog_cost_cents / current_replacement_value_cents, rounded to 4 decimal places round_half_up; 0 when current_replacement_value_cents is 0
      - name: assessment_epoch
        type: integer
        source: system
        description: RefreshCycle epoch this facility's data is current against; starts at 0

  - name: AssetSystem
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility that contains this system
      - name: system_category
        type: enum
        source: input
        description: Uniformat-style category
        constraints: "enum {HVAC, ROOF, ENVELOPE, ELECTRICAL, PLUMBING, FIRE_PROTECTION, CONVEYANCE, INTERIOR, SITE, STRUCTURE}"
      - name: name
        type: string
        source: input
        description: Human label, e.g. 'Main Chiller'
      - name: install_year
        type: integer
        source: input
        description: Calendar year the system was installed
        constraints: "1900 <= install_year <= 2100"
      - name: design_life_years
        type: integer
        source: input
        description: Industry-standard expected service life
        constraints: "integer > 0"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: Present-day (base-year) gross replacement cost
        constraints: "integer >= 0"
      - name: condition_rating
        type: integer
        source: input
        description: Assessor condition rating 1 (failed) .. 5 (excellent)
        constraints: "integer in [1,5]"
      - name: remaining_useful_life_years
        type: integer
        source: computed
        description: Per calculation remaining_useful_life; recomputed on create, on re-assess, and on refresh-cycle advance
      - name: status
        type: enum
        source: system
        description: Lifecycle
        constraints: "enum {ACTIVE, REASSESSED, RETIRED}"
        default: ACTIVE
      - name: last_assessed_epoch
        type: integer
        source: system
        description: RefreshCycle epoch of the most recent accepted assessment

  - name: Deficiency
    parent: AssetSystem
    common_fields: true
    fields:
      - name: asset_system_id
        type: string
        source: input
        description: FK -> AssetSystem.id; system the deficiency was observed on
      - name: description
        type: string
        source: input
        description: Free-text finding
      - name: cost_estimate_cents
        type: integer
        source: input
        description: Consultant's present-day correction cost estimate
        constraints: "integer > 0"
      - name: severity
        type: integer
        source: input
        description: Consequence of not correcting, 1 (minor) .. 5 (critical)
        constraints: "integer in [1,5]"
      - name: urgency
        type: integer
        source: input
        description: Time pressure, 1 (can wait years) .. 5 (immediate)
        constraints: "integer in [1,5]"
      - name: is_code_violation
        type: boolean
        source: input
        description: True when the finding violates a building/fire/energy code
        default: false
      - name: is_accessibility_violation
        type: boolean
        source: input
        description: True when the finding violates accessibility requirements
        default: false
      - name: recommended_year
        type: integer
        source: input
        description: Calendar year the consultant recommends correction
        constraints: "2000 <= recommended_year <= 2200"
      - name: priority_score
        type: number
        source: computed
        description: Per calculation deficiency_priority_score; 2 decimal places
      - name: remediation_status
        type: enum
        source: system
        description: Remediation progress axis (parallel state dimension 1)
        constraints: "enum {OPEN, IN_PROGRESS, CORRECTED, DEFERRED}"
        default: OPEN
      - name: verification_status
        type: enum
        source: system
        description: Independent verification axis (parallel state dimension 2)
        constraints: "enum {UNVERIFIED, VERIFIED, REJECTED}"
        default: UNVERIFIED

  - name: CapitalPlan
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility this plan covers
      - name: title
        type: string
        source: input
        description: Plan label, e.g. 'FY2027-FY2031 Capital Plan'
      - name: start_year
        type: integer
        source: input
        description: First plan year
        constraints: "2000 <= start_year <= 2200"
      - name: horizon_years
        type: integer
        source: input
        description: Number of plan years
        constraints: "integer in [1,10]"
      - name: status
        type: enum
        source: system
        description: Approval lifecycle
        constraints: "enum {DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED, ARCHIVED}"
        default: DRAFT
      - name: total_programmed_cents
        type: integer
        source: computed
        description: Sum of escalated_cost_cents over PlanLineItem rows of this plan with funding_status == FUNDED; maintained by line-item add/remove and scenario-run side effects

  - name: FundingScenario
    parent: CapitalPlan
    common_fields: true
    fields:
      - name: capital_plan_id
        type: string
        source: input
        description: FK -> CapitalPlan.id; plan this scenario belongs to
      - name: name
        type: string
        source: input
        description: Scenario label, e.g. 'Baseline', 'Aggressive'
      - name: annual_budget_cents
        type: integer
        source: input
        description: Uniform per-year funding envelope applied to every plan year
        constraints: "integer > 0"
      - name: escalation_rate
        type: number
        source: input
        description: Annual cost escalation as decimal, e.g. 0.03
        constraints: "0 <= escalation_rate <= 0.25"
      - name: status
        type: enum
        source: system
        description: Scenario run lifecycle
        constraints: "enum {CONFIGURED, RUN, SUPERSEDED}"
        default: CONFIGURED

  - name: PlanLineItem
    parent: CapitalPlan
    common_fields: true
    fields:
      - name: capital_plan_id
        type: string
        source: input
        description: FK -> CapitalPlan.id; plan this line item is programmed in
      - name: deficiency_id
        type: string
        source: input
        description: FK -> Deficiency.id; deficiency being programmed; unique per (capital_plan_id) among non-REMOVED items
      - name: funding_scenario_id
        type: string
        source: input
        description: FK -> FundingScenario.id; scenario this item was allocated under
      - name: planned_year
        type: integer
        source: input
        description: Calendar year the work is programmed
      - name: escalated_cost_cents
        type: integer
        source: computed
        description: Per calculation escalated_cost using the scenario's escalation_rate from base year 2026 to planned_year
      - name: funding_status
        type: enum
        source: system
        description: Waterfall allocation outcome
        constraints: "enum {FUNDED, UNFUNDED, REMOVED}"
      - name: project_bundle_id
        type: string
        source: input
        description: FK -> ProjectBundle.id; optional bundle grouping; null when unbundled
        constraints: "nullable"

  - name: ProjectBundle
    parent: CapitalPlan
    common_fields: true
    fields:
      - name: capital_plan_id
        type: string
        source: input
        description: FK -> CapitalPlan.id; plan this bundle phases work for
      - name: name
        type: string
        source: input
        description: Bundle label, e.g. 'Roof & Envelope Phase 1'
      - name: phase_number
        type: integer
        source: input
        description: Execution phase ordering; 1 = earliest
        constraints: "integer >= 1"
      - name: bundled_cost_cents
        type: integer
        source: computed
        description: Sum of escalated_cost_cents over PlanLineItem rows with project_bundle_id == this bundle and funding_status == FUNDED

  - name: RefreshCycle
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility whose data currency this cycle governs
      - name: epoch
        type: integer
        source: system
        description: Monotonic cycle number per facility; first cycle is 1
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle
        constraints: "enum {OPEN, CLOSED}"
        default: OPEN
      - name: opened_at
        type: datetime
        source: system
        description: Server logical-clock timestamp when the cycle opened

  - name: ConditionSnapshot
    parent: AssetSystem
    common_fields: false
    fields:
      - name: asset_system_id
        type: string
        source: input
        description: FK -> AssetSystem.id; system this snapshot records
      - name: condition_rating
        type: integer
        source: input
        description: Rating captured at snapshot time, 1..5
        constraints: "integer in [1,5]"
      - name: remaining_useful_life_years
        type: integer
        source: input
        description: RUL captured at snapshot time
      - name: epoch
        type: integer
        source: input
        description: RefreshCycle epoch the snapshot belongs to
      - name: note
        type: string
        source: input
        description: Assessor note
        constraints: "nullable"

state_machines:
  - entity: CapitalPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fca/capital-plans/{id}/submit"
        actor: CapitalPlanner
        preconditions:
          - "capital_plan.status == DRAFT"
          - "at least one PlanLineItem with capital_plan_id == plan.id and funding_status == FUNDED exists"
        side_effects:
          - "increments CapitalPlan.version by 1"
        note: Submission requires a non-empty funded program.
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fca/capital-plans/{id}/approve"
        actor: Approver
        preconditions:
          - "capital_plan.status == SUBMITTED"
          - "the acting Approver's X-User-ID differs from the X-User-ID that submitted the plan (segregation of duties)"
        side_effects:
          - "for every PlanLineItem of this plan with funding_status == FUNDED: set the linked Deficiency.remediation_status from OPEN or DEFERRED to IN_PROGRESS when currently OPEN, leave DEFERRED unchanged, leave IN_PROGRESS unchanged"
          - "set Facility.assessment_epoch unchanged; recompute Facility.backlog_cost_cents and Facility.facility_condition_index because remediation_status values changed"
          - "increments CapitalPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fca/capital-plans/{id}/reject"
        actor: Approver
        preconditions:
          - "capital_plan.status == SUBMITTED"
        side_effects:
          - "increments CapitalPlan.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /fca/capital-plans/{id}/revise"
        actor: CapitalPlanner
        preconditions:
          - "capital_plan.status == REJECTED"
        side_effects:
          - "increments CapitalPlan.version by 1"
        note: Revision loop — branching shape with revert.
      - from: APPROVED
        to: SUPERSEDED
        trigger: "side effect of POST /fca/capital-plans when a new plan for the same facility transitions DRAFT->SUBMITTED while an APPROVED plan exists for that facility"
        actor: system
        preconditions:
          - "another CapitalPlan for the same facility_id is in APPROVED"
        side_effects:
          - "prior APPROVED plan moves to SUPERSEDED; its FUNDED line items remain but no further bundles may attach"
      - from: APPROVED
        to: ARCHIVED
        trigger: "POST /fca/capital-plans/{id}/archive"
        actor: CapitalPlanner
        preconditions:
          - "capital_plan.status == APPROVED"
          - "every Deficiency linked by this plan's FUNDED PlanLineItem rows has remediation_status IN {CORRECTED, DEFERRED}"
        side_effects:
          - "increments CapitalPlan.version by 1"

  - entity: Deficiency
    initial_state: "remediation_status=OPEN, verification_status=UNVERIFIED"
    terminal_states: ["remediation_status=CORRECTED with verification_status=VERIFIED"]
    transitions:
      - from: "remediation_status=OPEN"
        to: "remediation_status=IN_PROGRESS"
        trigger: "side effect of CapitalPlan DRAFT->SUBMITTED->APPROVED when a FUNDED line item references this deficiency, or POST /fca/deficiencies/{id}/start-remediation"
        actor: "system | FacilityManager"
        preconditions:
          - "remediation_status == OPEN"
        side_effects:
          - "recompute Facility.backlog_cost_cents and Facility.facility_condition_index of the owning facility"
      - from: "remediation_status=IN_PROGRESS"
        to: "remediation_status=CORRECTED"
        trigger: "POST /fca/deficiencies/{id}/complete-remediation"
        actor: FacilityManager
        preconditions:
          - "remediation_status == IN_PROGRESS"
          - "owning AssetSystem.status != RETIRED"
        side_effects:
          - "recompute Facility.backlog_cost_cents and Facility.facility_condition_index"
      - from: "remediation_status=OPEN"
        to: "remediation_status=DEFERRED"
        trigger: "POST /fca/deficiencies/{id}/defer"
        actor: FacilityManager
        preconditions:
          - "remediation_status == OPEN"
        side_effects:
          - "none (DEFERRED remains in backlog set)"
      - from: "remediation_status=DEFERRED"
        to: "remediation_status=OPEN"
        trigger: "POST /fca/deficiencies/{id}/reopen"
        actor: FacilityManager
        preconditions:
          - "remediation_status == DEFERRED"
        side_effects:
          - "none (both states remain in backlog set)"
        note: Defer/reopen loop — cyclic shape.
      - from: "verification_status=UNVERIFIED, remediation_status=CORRECTED"
        to: "verification_status=VERIFIED"
        trigger: "POST /fca/deficiencies/{id}/verify"
        actor: Consultant
        preconditions:
          - "remediation_status == CORRECTED"
          - "verification_status == UNVERIFIED"
        side_effects:
          - "append ConditionSnapshot for the owning AssetSystem with current rating and RUL"
      - from: "verification_status=UNVERIFIED, remediation_status=CORRECTED"
        to: "verification_status=REJECTED"
        trigger: "POST /fca/deficiencies/{id}/reject-verification"
        actor: Consultant
        preconditions:
          - "remediation_status == CORRECTED"
          - "verification_status == UNVERIFIED"
        side_effects:
          - "set remediation_status back to IN_PROGRESS (compensation) and recompute Facility.backlog_cost_cents / facility_condition_index"

  - entity: AssetSystem
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: REASSESSED
        trigger: "POST /fca/asset-systems/{id}/assess"
        actor: Consultant
        preconditions:
          - "status == ACTIVE"
          - "an OPEN RefreshCycle exists for the owning facility"
        side_effects:
          - "recompute remaining_useful_life_years via remaining_useful_life calculation"
          - "append ConditionSnapshot for this system with the new rating, RUL and the facility's current epoch"
          - "set last_assessed_epoch to facility.assessment_epoch"
          - "recompute Facility.current_replacement_value_cents / backlog / facility_condition_index (rating does not change cost, but RUL affects plan refresh metrics)"
      - from: REASSESSED
        to: ACTIVE
        trigger: "POST /fca/asset-systems/{id}/accept-assessment"
        actor: FacilityManager
        preconditions:
          - "status == REASSESSED"
        side_effects:
          - "increments AssetSystem.version by 1"
      - from: REASSESSED
        to: ACTIVE
        trigger: "POST /fca/asset-systems/{id}/reject-assessment"
        actor: FacilityManager
        preconditions:
          - "status == REASSESSED"
        side_effects:
          - "revert condition_rating and remaining_useful_life_years to the values stored on the most recent prior ConditionSnapshot (compensation)"
        note: Fork at REASSESSED with two divergent side-effect sets — branching shape.
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fca/asset-systems/{id}/retire"
        actor: FacilityManager
        preconditions:
          - "status == ACTIVE"
          - "no Deficiency of this system has remediation_status IN {OPEN, IN_PROGRESS}"
        side_effects:
          - "recompute Facility.current_replacement_value_cents (exclude RETIRED) and facility_condition_index"
          - "any PlanLineItem referencing a Deficiency of this system with funding_status == FUNDED and owning CapitalPlan.status == DRAFT is moved to REMOVED, and CapitalPlan.total_programmed_cents is recomputed (transitive cascade AssetSystem -> PlanLineItem -> CapitalPlan)"

  - entity: RefreshCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /fca/refresh-cycles/{id}/close"
        actor: Consultant
        preconditions:
          - "status == OPEN"
          - "every non-RETIRED AssetSystem of the facility has last_assessed_epoch == this cycle's epoch"
        side_effects:
          - "set Facility.assessment_epoch to this epoch"
          - "open the next RefreshCycle with epoch = this.epoch + 1 for the same facility"
      - from: "(none)"
        to: OPEN
        trigger: "POST /fca/facilities/{id}/refresh-cycles (create)"
        actor: Consultant
        preconditions:
          - "no OPEN RefreshCycle exists for the facility"
        side_effects:
          - "epoch = (max epoch of prior cycles for this facility) + 1, or 1 when none"

  - entity: FundingScenario
    initial_state: CONFIGURED
    terminal_states: [RUN, SUPERSEDED]
    transitions:
      - from: CONFIGURED
        to: RUN
        trigger: "POST /fca/funding-scenarios/{id}/run"
        actor: CapitalPlanner
        preconditions:
          - "status == CONFIGURED"
          - "owning CapitalPlan.status == DRAFT"
        side_effects:
          - "execute waterfall_allocation over candidate deficiencies; create PlanLineItem rows with funding_status FUNDED or UNFUNDED"
          - "recompute CapitalPlan.total_programmed_cents"
          - "any other FundingScenario of the same plan in status RUN moves to SUPERSEDED and its non-REMOVED PlanLineItem rows are moved to REMOVED (transitive cascade FundingScenario -> PlanLineItem -> CapitalPlan)"
        note: Running a scenario supersedes the previously run scenario of the same plan.

concurrency_rules:
  - rule_id: plan-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /fca/capital-plans"
    occ_field: "expected_facility_version"
    description: |
      Creating a CapitalPlan against a Facility whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a plan for the same facility
      (which legitimately supersedes the prior APPROVED plan under the
      lifecycle rules) and the current writer's view of the facility is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: scenario-run-stale-plan
    parent_entity: CapitalPlan
    write_endpoint: "POST /fca/funding-scenarios/{id}/run"
    occ_field: "expected_capital_plan_version"
    description: |
      Running a FundingScenario against a CapitalPlan whose version has
      advanced since the client last observed it is rejected. A prior run
      of another scenario rewrites PlanLineItem rows and bumps the plan
      version, so a run issued from a stale plan view must fail rather
      than silently double-allocate.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: remaining_useful_life
    trigger: "on AssetSystem create, on POST /fca/asset-systems/{id}/assess, and on RefreshCycle close side effects that advance epochs"
    algorithm: decay_function
    formula: |
      age_years = current_calendar_year() - install_year
      rul = max(0, design_life_years - age_years)
      if condition_rating == 1: rul = 0
      elif condition_rating == 2: rul = min(rul, 2)
      return rul
    input_set: "the single AssetSystem row being (re)assessed; current_calendar_year() reads the server logical clock (default 2026-08-01 -> year 2026)"
    constants:
      FAILED_RATING: 1
      POOR_RATING: 2
      POOR_RUL_CAP: 2
    precision: "integer years; no rounding"
    variants:
      - name: optimistic_rul
        when: "base variant used for display on AssetSystem.remaining_useful_life_years"
        difference: "uses raw age only, as above"
      - name: pessimistic_rul
        when: "used by plan_refresh_health computation to stress-test the plan"
        difference: "subtracts an additional 2 years after all other adjustments, floored at 0: max(0, rul - 2)"

  - name: escalated_cost
    trigger: "on POST /fca/funding-scenarios/{id}/run for each candidate deficiency, and on PlanLineItem read"
    algorithm: forward_looking
    formula: |
      years_out = planned_year - BASE_YEAR
      escalated = cost_estimate_cents * (1 + escalation_rate) ** years_out
      return round_half_up(escalated, 0)  # integer cents
    input_set: "Deficiency.cost_estimate_cents and PlanLineItem.planned_year; escalation_rate from the FundingScenario being run; BASE_YEAR constant"
    constants:
      BASE_YEAR: 2026
    precision: "integer cents, round_half_up at the final step only"
    variants:
      - name: present_day_cost
        when: "used for Facility.backlog_cost_cents and deficiency listing"
        difference: "escalation_rate treated as 0 — cost_estimate_cents as-is"
      - name: escalated_to_year_of_need
        when: "used for PlanLineItem.escalated_cost_cents and all plan totals"
        difference: "full compounding as above"

  - name: deficiency_priority_score
    trigger: "on Deficiency create and on any PATCH to severity/urgency/is_code_violation/is_accessibility_violation"
    algorithm: weighted_scoring
    formula: |
      score = SEVERITY_WEIGHT * severity + URGENCY_WEIGHT * urgency
      if is_code_violation: score += CODE_BONUS
      if is_accessibility_violation: score += ACCESSIBILITY_BONUS
      return round_half_up(score, 2)
    input_set: "the single Deficiency row"
    constants:
      SEVERITY_WEIGHT: 0.6
      URGENCY_WEIGHT: 0.4
      CODE_BONUS: 10
      ACCESSIBILITY_BONUS: 5
    precision: "2 decimal places, round_half_up"

  - name: facility_condition_index
    trigger: "on any Deficiency create/complete/remediation-state change, on AssetSystem create/retire, and on POST /fca/facilities/{id}/recompute"
    algorithm: aggregation
    formula: |
      crv = sum(AssetSystem.replacement_cost_cents for systems of facility where status != RETIRED)
      backlog = sum(Deficiency.cost_estimate_cents for deficiencies of facility's systems where remediation_status IN {OPEN, IN_PROGRESS})
      fci = 0 if crv == 0 else round_half_up(backlog / crv, 4)
      store crv -> Facility.current_replacement_value_cents, backlog -> Facility.backlog_cost_cents, fci -> Facility.facility_condition_index
    input_set: "all AssetSystem rows of the facility (status != RETIRED) and all Deficiency rows whose parent AssetSystem belongs to the facility"
    constants:
      FCI_DECIMALS: 4
    precision: "FCI 4 decimal places round_half_up; cents fields exact integers"

  - name: waterfall_allocation
    trigger: "POST /fca/funding-scenarios/{id}/run"
    algorithm: waterfall_allocation
    formula: |
      candidates = [d for d in Deficiency where d.asset_system.facility_id == plan.facility_id
                    and d.remediation_status IN {OPEN, DEFERRED}
                    and d.asset_system.status != RETIRED
                    and plan.start_year <= d.recommended_year <= plan.start_year + plan.horizon_years - 1]
      sort candidates by (priority_score DESC, created_at ASC)   # deterministic; id never used
      for each plan_year in start_year .. start_year + horizon_years - 1:
          budget_remaining = scenario.annual_budget_cents
          for each candidate d with recommended_year == plan_year, in sorted order:
              cost = escalated_cost(d, scenario, planned_year = d.recommended_year)
              if cost <= budget_remaining:
                  create PlanLineItem(funding_status=FUNDED, planned_year=d.recommended_year, escalated_cost_cents=cost)
                  budget_remaining -= cost
              else:
                  create PlanLineItem(funding_status=UNFUNDED, planned_year=d.recommended_year, escalated_cost_cents=cost)
      CapitalPlan.total_programmed_cents = sum(escalated_cost_cents over FUNDED items)
    input_set: "candidate Deficiency rows of the facility in states OPEN or DEFERRED on non-RETIRED systems whose recommended_year falls inside the plan horizon"
    constants:
      BASE_YEAR: 2026
    precision: "integer cents; per-item escalated cost rounded once (round_half_up) before comparison — never re-round the running remainder"

  - name: plan_refresh_health
    trigger: "GET /fca/facilities/{id}/refresh-health (computed read)"
    algorithm: threshold
    formula: |
      stale_systems = count(AssetSystem where status != RETIRED and last_assessed_epoch < facility.assessment_epoch)
      total_systems = count(AssetSystem where status != RETIRED)
      stressed_backlog = sum(cost_estimate_cents of deficiencies OPEN/IN_PROGRESS whose system's pessimistic_rul <= 0)
      health = if total_systems == 0: 'NO_DATA'
               elif stale_systems > 0: 'STALE'
               elif fci >= CRITICAL_FCI_THRESHOLD: 'CRITICAL'
               elif fci >= WATCH_FCI_THRESHOLD: 'WATCH'
               else: 'GOOD'
      return { health, stale_systems, total_systems, stressed_backlog_cents: stressed_backlog }
    input_set: "facility's non-RETIRED AssetSystem rows and OPEN/IN_PROGRESS Deficiency rows"
    constants:
      WATCH_FCI_THRESHOLD: 0.05
      CRITICAL_FCI_THRESHOLD: 0.10
    precision: "FCI comparison uses the stored 4-decimal value; threshold crossing uses >= (value AT the threshold enters the worse band)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path (facility, asset-system, deficiency, capital-plan, funding-scenario, project-bundle, refresh-cycle) exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every foreign-key id in the request body (client_id, facility_id, asset_system_id, capital_plan_id, deficiency_id, funding_scenario_id, project_bundle_id) exists"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST/PATCH endpoints with body FKs"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition per §1.2 (e.g., submit requires DRAFT, approve requires SUBMITTED, verify requires remediation_status CORRECTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_*_version in the request matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fca/capital-plans, POST /fca/funding-scenarios/{id}/run"
  - priority: 7
    category: business_safety
    check: "segregation of duties: the Approver approving a plan MUST NOT be the same X-User-ID that submitted it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fca/capital-plans/{id}/approve"
  - priority: 8
    category: business_safety
    check: "code/accessibility hygiene: a Deficiency with is_code_violation=true or is_accessibility_violation=true MUST have severity >= 3"
    error_id: ERR_CODE_SEVERITY_TOO_LOW
    http_status: 422
    applies_to: "POST /fca/deficiencies, PATCH /fca/deficiencies/{id}"
  - priority: 9
    category: business_temporal
    check: "planned/recommended years: Deficiency.recommended_year must be >= 2026; PlanLineItem.planned_year must lie inside the owning plan's [start_year, start_year + horizon_years - 1]"
    error_id: ERR_YEAR_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /fca/deficiencies, POST /fca/capital-plans, POST /fca/funding-scenarios/{id}/run"
  - priority: 10
    category: business_constraint
    check: "field-shape constraints: enum membership, integer ranges (condition_rating 1..5, severity/urgency 1..5, gross_square_feet > 0, horizon_years 1..10), required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 11
    category: business_constraint
    check: "uniqueness: at most one non-REMOVED PlanLineItem per (capital_plan_id, deficiency_id); at most one OPEN RefreshCycle per facility"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /fca/funding-scenarios/{id}/run, POST /fca/facilities/{id}/refresh-cycles, POST /fca/plan-line-items"
  - priority: 12
    category: business_referential
    check: "a Deficiency may not be created on a RETIRED AssetSystem; an AssetSystem may not retire while it has OPEN/IN_PROGRESS deficiencies; a ProjectBundle's line items must belong to the same capital plan"
    error_id: ERR_REFERENTIAL_CONFLICT
    http_status: 409
    applies_to: "POST /fca/deficiencies, POST /fca/asset-systems/{id}/retire, POST /fca/project-bundles/{id}/attach"
  - priority: 13
    category: business_referential
    check: "cross-entity state: CapitalPlan submit requires >=1 FUNDED line item; RefreshCycle close requires every non-RETIRED system assessed in this epoch; archive requires all funded deficiencies CORRECTED or DEFERRED"
    error_id: ERR_PRECONDITION_UNMET
    http_status: 409
    applies_to: "submit/close/archive endpoints"
  - priority: 14
    category: business_fiscal
    check: "fiscal: FundingScenario.annual_budget_cents > 0; escalated cost of a single candidate may exceed the annual budget (item is then UNFUNDED, not an error)"
    error_id: ERR_INVALID_BUDGET
    http_status: 422
    applies_to: "POST /fca/funding-scenarios"

endpoints:
  - method: POST
