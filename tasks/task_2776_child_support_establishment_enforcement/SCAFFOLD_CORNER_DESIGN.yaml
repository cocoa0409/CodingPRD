            - "${e5} == ERR_INVALID_ORDER_STATUS  # deviation-request is declared only from CALCULATED"
            - "${e6} == ERR_INVALID_ORDER_STATUS  # deviation-findings is declared only from PENDING_DEVIATION_FINDINGS"
