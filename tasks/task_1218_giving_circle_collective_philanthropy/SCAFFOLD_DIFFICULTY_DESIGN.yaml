          assert:
            - "error_id == ERR_MEMBERSHIP_NOT_ACTIVE (409)"
            - "GivingCycle.${cycle_id}.ballots_cast_count == 0"
            - "Membership.${ms2_id}.status == WITHDRAWN"

      - name: contribution_receive_requires_pooling_phase
        grounds:
          - state_machines.Contribution.PLEDGED_to_RECEIVED
          - state_machines.GivingCycle.POOLING_to_NOMINATION
          - validations[priority=6]
          - errors[ERR_CYCLE_PHASE]
        distinguishing_aspect: |
          Entity pair Contribution x GivingCycle (different pair than Ballot x
          Membership): recording receipt of a still-PLEDGED contribution after
          the cycle left POOLING is rejected with ERR_CYCLE_PHASE although the
          contribution's own from-state (PLEDGED) is valid.
        test_recipe:
          setup:
            - "Cycle advanced POOLING -> NOMINATION (M1's received contribution satisfied the guard); M2's contribution still PLEDGED"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle CE2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
