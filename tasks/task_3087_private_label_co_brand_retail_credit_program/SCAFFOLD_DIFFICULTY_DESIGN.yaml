        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/applications
        payload:
          program_id: ${g_id}
          source_channel: DIGITAL
          requested_credit_limit_cents: 200000
        as: Applicant
        captures:
          app_a: $.data.id
      - call: POST /servicing/applications/${app_a}/decide
        payload: {}
        as: Underwriter
      - call: POST /servicing/applications
        payload:
          program_id: ${g_id}
          source_channel: DIGITAL
          requested_credit_limit_cents: 200000
        as: Applicant
        captures:
          app_b: $.data.id
      - call: POST /servicing/applications/${app_b}/decide
        payload: {}
        as: Underwriter
