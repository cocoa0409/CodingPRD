              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 70, attribute_score: 70, image_score: 70 }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 18000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_base: $.data.id }
          trigger:
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 17900, collection_method: "ONLINE", observed_at: "2026-07-31T18:30:00Z", in_stock: true }
              as: DataCollector
              captures: { err: $.data.error_id }
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 17800, collection_method: "ONLINE", observed_at: "2026-07-31T19:00:00Z", in_stock: true }
