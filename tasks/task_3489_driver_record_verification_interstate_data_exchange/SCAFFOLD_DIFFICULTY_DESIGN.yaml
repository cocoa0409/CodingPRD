            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "BB", name: "State B", fee_tier: "TIER_2" }
              as: AssociationAdmin
              captures: { j_b: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_b}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { p_b: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_b}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_b: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_b}/complete"
              payload: { result: "PASSED", score: 96 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_b}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_b}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Driver Eleven", date_of_birth: "1987-11-11", ssn_last4_hash: "h1111", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
            - call: "POST /driver-exchange/licenses"
              payload: { driver_id: "${d_id}", license_class: "STANDARD" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { l_id: $.data.id }
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "SSN", result: "VERIFIED" }
              as: FederalVerifier
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "LAWFUL_STATUS", result: "VERIFIED" }
              as: FederalVerifier
            - call: "GET /driver-exchange/drivers/${d_id}"
              payload: {}
              as: AssociationAdmin
              captures: { d_v2: $.data.version }
            - call: "POST /driver-exchange/license-transfers"
              payload: { driver_id: "${d_id}", prior_license_id: "${l_id}", expected_driver_version: "${d_v2}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { t_id: $.data.id }
            - call: "POST /driver-exchange/license-transfers/${t_id}/record-surrender"
              payload: {}
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "POST /driver-exchange/license-transfers/${t_id}/complete"
              payload: {}
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { t_status: $.data.status, t_new_license: $.data.new_license_id }
            - call: "GET /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}" }
              as: AuditAuthority
            - call: "GET /driver-exchange/licenses"
              payload: { driver_id: "${d_id}" }
              as: AuditAuthority
          assert:
            - "t_status == COMPLETED and t_new_license is non-null"
            - "The driver record list contains exactly 2 records: ${r_id} with status == TRANSFERRED_OUT (holding AA), and exactly one with status == ACTIVE held by BB — invariant |{ACTIVE records of D}| == 1 holds before and after"
            - "The license list contains exactly 2 licenses: ${l_id} SURRENDERED (issuing AA) and the new license PENDING_VERIFICATION (issuing BB, license_class STANDARD copied from the prior license)"
            - "The new license's record_id equals the new ACTIVE DriverRecord's id (referential closure of the move)"

      - name: settle_then_audit_conserves_recognized_dues
        grounds:
          - calculations.audited_dues_settlement
          - entities.FeeInvoice.fields.adjustment_amount_cents
          - state_machines.FeeInvoice.SETTLED_to_AUDITED
        distinguishing_aspect: |
          Conserved quantity = recognized money (a different type than entity cardinality):
          settlement at the provisional amount followed by the compensating audit adjustment
          leaves settled_amount_cents + adjustment_amount_cents == final_amount_cents
          (2600000 + 25000 == 2625000) — the audit trail reconciles to the true liability with
          no drift.
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with one CERTIFIED POINTER_NETWORK participation"
            - "Invoice for fiscal_year 2027 (projected_volume 8000, provisional 2600000) is SETTLED at 2600000"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/fee-invoices"
              payload: { jurisdiction_id: "${j_a}", fiscal_year: 2027, projected_volume: 8000 }
              as: AssociationAdmin
              captures: { f_id: $.data.id }
            - call: "POST /driver-exchange/fee-invoices/${f_id}/settle"
              payload: { amount_cents: 2600000 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "POST /driver-exchange/fee-invoices/${f_id}/finalize-audit"
              payload: { actual_volume_quarters: [1000, 2000, 3000, 4000] }
              as: AuditAuthority
              captures: { f_final: $.data.final_amount_cents, f_adj: $.data.adjustment_amount_cents }
          assert:
            - "f_final == 2625000 and f_adj == 25000"
            - "Invariant: settled_amount_cents (2600000) + adjustment_amount_cents (25000) == final_amount_cents (2625000) exactly"
            - "FeeInvoice.${f_id}.status == AUDITED (terminal)"
