              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /assets/${a_c}/condition-assessments"
              payload: { condition_code: "C4", functional: true, repair_cost_estimate_cents: 185000, assessed_on: "2026-08-14", expected_asset_version: "${a_c_v}" }
