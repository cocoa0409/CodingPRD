    roles: [LineOperator]
    code: 201
    input: [molding_line_id, heat_id, mold_ids, start_at, end_at]
    output: PourSlot
    side_effects: ["status=BOOKED; each mold.pour_slot_id := slot id; CURTAILED/EMBARGO gate applies"]
  - method: GET
    path: "/api/pour-slots/{id}"
    description: "Get a pour slot"
    roles: [FoundryAdmin, MeltSupervisor, LineOperator]
    code: 200
    input: []
    output: PourSlot
    side_effects: []
  - method: GET
    path: "/api/pour-slots"
    description: "List pour slots (reverse-reachability for PourSlot.molding_line_id/heat_id)"
    roles: [FoundryAdmin, MeltSupervisor, LineOperator]
    code: 200
    input: ["molding_line_id?", "heat_id?", "status?", "limit?", "offset?"]
    output: "PourSlot[]"
    side_effects: []
  - method: POST
    path: "/api/pour-slots/{id}/cancel"
    description: "Cancel a BOOKED slot; molds' pour_slot_id cleared"
    roles: [LineOperator]
    code: 200
    input: []
    output: PourSlot
    side_effects: ["status -> CANCELLED; molds stay ASSEMBLED"]
  - method: POST
    path: "/api/pour-slots/{id}/complete"
    description: "Complete a slot: pour its molds and create castings"
    roles: [LineOperator]
    code: 200
    input: []
    output: PourSlot
    side_effects:
      - "molds -> POURED (poured_at := now); heat.remaining_metal_kg debited"
      - "castings created per pattern.impressions (casting_weight rule)"

  # --- Mold ---
  - method: POST
    path: "/api/molds"
    description: "Assemble a mold from an ACTIVE pattern on an IN_SERVICE sand batch for an order"
    roles: [LineOperator]
    code: 201
    input: [pattern_id, sand_batch_id, order_id, sand_weight_kg, metal_weight_kg, cooling_hours]
    output: Mold
    side_effects:
      - "status=ASSEMBLED; batch.current_weight_kg -> committed_weight_kg by sand_weight_kg"
      - "order RECEIVED -> IN_PRODUCTION on first mold; order.pipeline_count recomputed"
      - "foundry.posture recomputed"
  - method: GET
    path: "/api/molds/{id}"
    description: "Get a mold"
    roles: [FoundryAdmin, LineOperator, QualityInspector]
    code: 200
    input: []
    output: Mold
    side_effects: []
  - method: GET
    path: "/api/molds"
    description: "List molds (reverse-reachability for Mold.pattern_id/sand_batch_id/order_id/pour_slot_id)"
    roles: [FoundryAdmin, LineOperator, QualityInspector]
    code: 200
    input: ["pattern_id?", "sand_batch_id?", "order_id?", "pour_slot_id?", "status?", "limit?", "offset?"]
    output: "Mold[]"
    side_effects: []
  - method: POST
    path: "/api/molds/{id}/shakeout"
    description: "Shake out a COOLED mold; sand moves committed -> spent"
    roles: [LineOperator]
    code: 200
    input: []
