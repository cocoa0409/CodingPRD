      - name: cascade_beta_critical_reading_reaches_site_posture_four_links_deep
        grounds:
          - calculations.telemetry_alert_evaluation
          - state_machines.MachinePlacement.operational_status.UP_to_DOWN
          - calculations.dispatch_priority_score
          - entities.Site.fields.service_posture
          - endpoints.POST_machine_placements_placement_id_telemetry_readings
        distinguishing_aspect: |
          Different trigger (a single telemetry POST, no clock movement, no operator intent) and a
          different causal spine four links deep: (1) the reading opens a CRITICAL LOW_RINSE_PRESSURE
          alert because 11 psi is at or below min_rinse_pressure_psi 15 minus the 3 psi critical margin,
          (2) BECAUSE a CRITICAL alert opened, the placement's health axis goes UP -> DOWN, (3) BECAUSE
          the placement reached DOWN, a TELEMETRY_AUTO ServiceTicket is auto-created with
          reported_symptom MACHINE_DOWN and priority_score 400 + 300 = 700 (down-in-operating-hours,
          since 14:00 UTC is inside the 600-1320 minute window), (4) BECAUSE that ticket's score is at
          or above 700, Site.service_posture is re-derived to CRITICAL, which in turn locks variance
          publication. Unlike cascade alpha, no entity is terminated and nothing is suppressed.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is moved to 2026-08-05T14:00:00Z, which is minute 840 - inside the site's 600-1320 operating window."
            - "One INSTALLED placement on model DT-88 (min_rinse_pressure_psi 15) with operational_status UP, site priority_tier STANDARD and service_posture NORMAL."
            - "No ticket and no alert exist before the trigger, so the auto-ticket is not suppressed by an existing open ticket and posture_component is 0."
