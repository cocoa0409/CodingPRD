            - { call: "POST /api/portfolios/${pf}/valuation-snapshots", payload: { period_start: "2026-08-16", period_end: "2027-01-29", expected_portfolio_version: "${pf_v}" }, as: PortfolioManager, captures: { err: "$.data.error_id" } }
