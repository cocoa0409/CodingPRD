            - "logical clock at 2026-08-01T00:00:00Z"
            - "GREENLIT title (royalty_pool_bps 1200, cover_participation_bps 1500) with ACCEPTED assignments SCRIPT 5000 bps carrying a 25000-cent advance, PENCILS 3000 bps and COVER 1500 bps"
