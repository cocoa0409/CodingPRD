# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buyer_fee_provisional_vs_final_after_partial_arbitration
        grounds:
          - calculations.buyer_fee
          - calculations.buyer_total_due
          - state_machines.RunListEntry.BIDDING_CLOSED_to_HAMMERED
          - state_machines.ArbitrationClaim.OPEN_to_RESOLVED
          - entities.Settlement.fields.buyer_fee_cents
        distinguishing_aspect: |
          buyer_fee is a Buyer/Settlement-domain calc: provisional (S=725000, fee=47850) at
          hammer differs from final (S reduced to 625000 by APPROVED_PARTIAL credit, fee=41250).
        test_recipe:
          setup:
            - "Sale RUNNING with one ACTIVE lane; Buyer credit_limit 5,000,000c; cataloged no-reserve consignment with a non-AS_IS condition report"
            - "Lot opened, B1 places PROXY ceiling 900000c ONLINE, second buyer B2 PROXY 700000c ONLINE so clearing settles to 725000; bidding closed; hammered -> Settlement provisional buyer_fee 47850"
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z", buyer_fee_schedule_code: "STANDARD" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A", seller_fee_pct: 0.02 }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "Buyer B1", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "Buyer B2", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00001", title_status: "ON_HAND" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 30000, announcements: [] }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 600000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 900000, channel: "ONLINE", expected_lot_version: "${v0}" }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { lot_after_b1: $.data.lot_id }
            - call: "GET /auction/lots/${lot_id}"
              payload: {}
              as: AuctionAdmin
              captures: { v1: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b2_id}", bid_type: "PROXY", amount_cents: 700000, channel: "ONLINE", expected_lot_version: "${v1}" }
              as: Buyer
              as_user_id: "${b2_id}"
            - call: "POST /auction/lots/${lot_id}/close-bidding"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/hammer"
              payload: {}
              as: AuctionAdmin
            - call: "GET /auction/settlements?lot_id=${lot_id}"
              payload: {}
              as: AuctionAdmin
              captures: { settlement_id: $.data.0.id }
            - call: "POST /auction/settlements/${settlement_id}/record-payment"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/arbitration-claims"
              payload: { lot_id: "${lot_id}", buyer_id: "${b1_id}", reason_code: "MECHANICAL", claimed_cents: 100000 }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /auction/arbitration-claims/${claim_id}/rule"
              payload: {}
              as: Arbitrator
              captures: { resolution: $.data.resolution }
          assert:
            - "Settlement.${settlement_id}.buyer_fee_cents == 41250"
            - "Settlement.${settlement_id}.sale_price_cents == 625000"
            - "Settlement.${settlement_id}.total_due_cents == 666250"
            - "ArbitrationClaim.${claim_id}.resolution == APPROVED_PARTIAL"

      - name: seller_proceeds_provisional_vs_final_after_partial_arbitration
        grounds:
          - calculations.seller_net_proceeds
          - state_machines.Consignment.RUN_LISTED_to_SOLD
          - state_machines.ArbitrationClaim.OPEN_to_RESOLVED
          - entities.Consignment.fields.expected_proceeds_cents
        distinguishing_aspect: |
          seller_net_proceeds is a Seller/Consignment-domain calc (NOT buyer fee): provisional at
          hammer S=725000 -> 705500; final after APPROVED_PARTIAL reduces S to 625000 -> 607500.
        test_recipe:
          setup:
            - "Same chain as buyer_fee instance: hammer at 725000 -> Consignment.expected_proceeds_cents provisional 705500 (commission 14500 + assurance 5000)"
            - "Settlement payment recorded; arbitration claim opened by winning buyer"
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z", buyer_fee_schedule_code: "STANDARD" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A", seller_fee_pct: 0.02 }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "Buyer B1", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "Buyer B2", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00002", title_status: "ON_HAND" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 30000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 600000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 900000, channel: "ONLINE", expected_lot_version: "${v0}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "GET /auction/lots/${lot_id}"
              payload: {}
              as: AuctionAdmin
              captures: { v1: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b2_id}", bid_type: "PROXY", amount_cents: 700000, channel: "ONLINE", expected_lot_version: "${v1}" }
              as: Buyer
              as_user_id: "${b2_id}"
            - call: "POST /auction/lots/${lot_id}/close-bidding"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/hammer"
              payload: {}
              as: AuctionAdmin
              captures: { proceeds_provisional: $.data.high_bid_cents }
            - call: "GET /auction/settlements?lot_id=${lot_id}"
              payload: {}
              as: AuctionAdmin
              captures: { settlement_id: $.data.0.id }
            - call: "POST /auction/settlements/${settlement_id}/record-payment"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/arbitration-claims"
              payload: { lot_id: "${lot_id}", buyer_id: "${b1_id}", reason_code: "MECHANICAL", claimed_cents: 100000 }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /auction/arbitration-claims/${claim_id}/rule"
              payload: {}
              as: Arbitrator
          assert:
            - "Consignment.${cons_id}.expected_proceeds_cents == 607500"
            - "Settlement.${settlement_id}.seller_proceeds_cents == 607500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: clearing_price_nested_min_max_three_inputs
        grounds:
          - calculations.clearing_price
          - calculations.bid_increment
          - entities.RunListEntry.fields.high_bid_cents
        distinguishing_aspect: |
          Mode (a): clearing price is min(top_ceiling, second_ref + bid_increment(second_ref)) with
          second_ref = max(C2, house_floor) — nested min/max over >=3 inputs (C1, C2, house_floor).
        test_recipe:
          setup:
            - "Lot starting_bid 500000, floor 0; B1 PROXY ceiling 1000000, B2 LIVE 500000; expect clearing 525000 (second_ref 500000 + increment 25000)"
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B1", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B2", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00003" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 500000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b2_id}", bid_type: "LIVE", amount_cents: 500000, channel: "LANE", expected_lot_version: "${v0}" }
              as: Buyer
              as_user_id: "${b2_id}"
            - call: "GET /auction/lots/${lot_id}"
              payload: {}
              as: AuctionAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 1000000, channel: "ONLINE", expected_lot_version: "${v1}" }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { lot_id_echo: $.data.lot_id }
          assert:
            - "RunListEntry.${lot_id}.high_bid_cents == 525000"
            - "RunListEntry.${lot_id}.high_bidder_id == ${b1_id}"

      - name: buyer_total_due_rounding_order_per_term_then_sum
        grounds:
          - calculations.buyer_total_due
          - calculations.buyer_fee
          - entities.Settlement.fields.total_due_cents
        distinguishing_aspect: |
          Mode (b): at S=200008 ONLINE STANDARD, round-each-term-then-sum gives fee 13200
          (base 12000 + online 1200), whereas sum-then-round-once gives 13201 — the scaffold pins
          per-term-then-sum, a strictly different mode than the nested-min/max clearing instance.
        test_recipe:
          setup:
            - "No-reserve cataloged lot; single buyer PROXY 300000 ONLINE; starting_bid 200008 so single-proxy clearing = 200008; hammer -> provisional buyer_fee 13200, total_due 213208"
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z", buyer_fee_schedule_code: "STANDARD" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A", seller_fee_pct: 0.02 }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B1", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00004" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 200008 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 300000, channel: "ONLINE", expected_lot_version: "${v0}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /auction/lots/${lot_id}/close-bidding"
              payload: {}
              as: AuctionAdmin
          trigger:
            - call: "POST /auction/lots/${lot_id}/hammer"
              payload: {}
              as: AuctionAdmin
              captures: { hp: $.data.hammer_price_cents }
          assert:
            - "RunListEntry.${lot_id}.hammer_price_cents == 200008"
            - "Settlement(lot_id=${lot_id}).buyer_fee_cents == 13200"
            - "Settlement(lot_id=${lot_id}).total_due_cents == 213208"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_parallel_payment_and_title_axes
        grounds:
          - state_machines.Settlement.OPEN_to_OPEN
          - state_machines.Settlement.OPEN_to_CLEARED
          - entities.Settlement.fields.payment_status
          - entities.Settlement.fields.title_status
        distinguishing_aspect: |
          Settlement has TWO independent state axes on one row (payment_status x title_status);
          recording title first leaves payment_status UNPAID, status stays OPEN until BOTH PAID+TITLE.
        test_recipe:
          setup:
            - "Hammered lot with Settlement (payment UNPAID, title PENDING_TITLE)"
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
