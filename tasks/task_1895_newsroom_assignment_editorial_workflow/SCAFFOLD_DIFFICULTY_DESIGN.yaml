            - { call: "POST /newsroom/stories/${story_id}/corrections", payload: { severity: MAJOR, correction_text: "Fixing the quote" }, as: Reporter, as_user_id: "${rep_id}", captures: { c2_id: "$.data.id" } }
            - { call: "POST /newsroom/corrections/${c1_id}/approve", payload: {}, as: ManagingEditor, as_user_id: "${me_id}" }
            - { call: "POST /newsroom/corrections/${c2_id}/approve", payload: {}, as: ManagingEditor, as_user_id: "${me_id}" }
            - { call: "POST /newsroom/corrections/${c1_id}/issue", payload: {}, as: ManagingEditor, as_user_id: "${me_id}" }
