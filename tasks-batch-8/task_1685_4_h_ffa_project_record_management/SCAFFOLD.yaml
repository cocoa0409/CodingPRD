scenario: "4-H & FFA Project Record Management (county extension 4-H program): member enrollment & project selection, record book (expenses/income/hours) submission & review, advisor/leader verification & scoring, county/state fair entry eligibility, degree/award application & rubric evaluation, scholarship application linkage, animal tagging & project timeline compliance, club meeting & volunteer screening"
domain_name: "ffa-4h-project-records"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the 4-H/FFA club."
      - name: county_code
        type: string
        source: input
        description: "Two-letter county code; part of uniqueness scope for club name."
      - name: treasury_balance_cents
        type: integer
        source: computed
        description: "Running club treasury balance in cents; equals sum of POSTED dues payments minus sum of APPROVED reimbursements for this club."
        default: 0
      - name: star_nomination_count
        type: integer
        source: computed
        description: "Count of AwardApplication rows for this club with award_track=STAR and status IN {NOMINATED, ENDORSED}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the club."
        constraints: "one of {ACTIVE, SUSPENDED}"
        default: ACTIVE

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the adult volunteer/leader."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all volunteers."
      - name: base_clearance
        type: integer
        source: input
        description: "Base clearance points assigned by the screening committee before adjustments (0-100)."
      - name: risk_flags
        type: integer
        source: input
        description: "Number of open background-check risk flags (>=0)."
        default: 0
      - name: years_service
        type: integer
        source: input
        description: "Completed years of volunteer service (>=0)."
        default: 0
      - name: screening_score
        type: integer
        source: computed
        description: "Derived screening score computed by calc volunteer_screening_score."
        default: 0
      - name: screening_status
        type: enum
        source: system
        description: "Screening lifecycle state."
        constraints: "one of {PENDING, CLEARED, DENIED}"
        default: PENDING
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; the club this volunteer is affiliated with."

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the youth member."
      - name: birth_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); used to derive age division."
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; the member's home club."
      - name: enrollment_status
        type: enum
        source: system
        description: "Enrollment lifecycle state."
        constraints: "one of {ENROLLED, ACTIVE, SUSPENDED, GRADUATED}"
        default: ENROLLED
      - name: is_club_officer
        type: boolean
        source: input
        description: "Whether the member currently holds a club officer role; feeds leadership bonus."
        default: false
      - name: eligibility_posture
        type: enum
        source: computed
        description: "Derived aggregate posture computed by calc member_eligibility_posture from record book, tagging, and attendance."
        constraints: "one of {ELIGIBLE, CONDITIONAL, INELIGIBLE}"
        default: INELIGIBLE

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member carrying this project."
      - name: project_type
        type: enum
        source: input
        description: "Project category."
        constraints: "one of {BEEF, SHEEP, SWINE, CROPS, FOODS, ROBOTICS}"
      - name: program_year
        type: integer
        source: input
        description: "4-H program year (e.g. 2026)."
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state."
        constraints: "one of {PLANNED, ACTIVE, COMPLETED, DROPPED}"
        default: PLANNED
      - name: grade
        type: enum
        source: input
        description: "Final grade assigned at completion; feeds scholarship points."
        constraints: "one of {A, B, C, NONE}"
        default: NONE

  - name: AnimalTag
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the livestock project this animal belongs to."
      - name: tag_number
        type: string
        source: input
        description: "Official ear-tag number; unique per program year."
      - name: species
        type: enum
        source: input
        description: "Animal species; determines ownership-day requirement."
        constraints: "one of {BEEF, SHEEP, SWINE}"
      - name: owned_since
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp when ownership began."
      - name: tagged_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp when the tagging record was created (server logical clock)."
      - name: tagging_status
        type: enum
        source: system
        description: "Tagging verification state."
        constraints: "one of {TAGGED, VERIFIED, REJECTED}"
        default: TAGGED

  - name: RecordBook
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this record book documents."
      - name: program_year
        type: integer
        source: input
        description: "Program year this record book covers."
      - name: status
        type: enum
        source: system
        description: "Record book review lifecycle."
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED, APPROVED, REJECTED}"
        default: DRAFT
      - name: submitted_at
        type: datetime
        source: system
        description: "Server logical-clock timestamp of the most recent DRAFT->SUBMITTED transition; null while never submitted."
      - name: provisional_score
        type: number
        source: computed
        description: "Score computed by calc record_book_score variant=provisional at submit time."
      - name: final_score
        type: number
        source: computed
        description: "Score computed by calc record_book_score variant=final at approval time; null until approved."
      - name: late_days
        type: integer
        source: computed
        description: "Whole calendar days the submission is past the record-book deadline; 0 when on time."
        default: 0

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: record_book_id
        type: string
        source: input
        description: "FK -> RecordBook.id; the record book this entry belongs to."
      - name: entry_kind
        type: enum
        source: input
        description: "Ledger classification."
        constraints: "one of {EXPENSE, INCOME, HOURS}"
      - name: amount_cents
        type: integer
        source: input
        description: "Monetary amount in cents for EXPENSE/INCOME; 0 for HOURS."
      - name: hours
        type: number
        source: input
        description: "Hours worked for HOURS entries; 0 for monetary entries."
      - name: entry_status
        type: enum
        source: system
        description: "Posting lifecycle of the ledger line."
        constraints: "one of {POSTED, VOIDED}"
        default: POSTED
      - name: recorded_on
        type: string
        source: input
        description: "ISO 8601 date the activity occurred."

  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; the club holding this meeting."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC meeting start."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC meeting end; must be strictly after starts_at."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the reserved room."
      - name: status
        type: enum
        source: system
        description: "Meeting lifecycle."
        constraints: "one of {SCHEDULED, HELD, CANCELLED}"
        default: SCHEDULED

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Room name; unique."
      - name: capacity
        type: integer
        source: input
        description: "Maximum occupancy."

  - name: Attendance
    parent: null
    common_fields: false
    fields:
      - name: meeting_id
        type: string
        source: input
        description: "FK -> Meeting.id; the meeting attended."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the attending member."
      - name: attendance_status
        type: enum
        source: input
        description: "Attendance disposition."
        constraints: "one of {PRESENT, ABSENT, EXCUSED}"

  - name: FairEntry
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; exhibiting member."
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project being exhibited."
      - name: fair_level
        type: enum
        source: input
        description: "Fair tier."
        constraints: "one of {COUNTY, STATE}"
      - name: status
        type: enum
        source: system
        description: "Fair entry lifecycle."
        constraints: "one of {ENTERED, CONFIRMED, SCRATCHED, EXHIBITED}"
        default: ENTERED
      - name: ownership_days_at_entry
        type: integer
        source: computed
        description: "Whole days the primary animal was owned as of the fair entry deadline; computed by calc ownership_days."

  - name: StallAssignment
    parent: null
    common_fields: true
    fields:
      - name: fair_entry_id
        type: string
        source: input
        description: "FK -> FairEntry.id; the entry being stalled."
      - name: pen_id
        type: string
        source: input
        description: "FK -> Pen.id; the pen assigned."
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle."
        constraints: "one of {ASSIGNED, RELEASED}"
        default: ASSIGNED

  - name: Pen
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Pen label; unique."
      - name: animal_capacity
        type: integer
        source: input
        description: "Maximum number of ASSIGNED StallAssignment rows allowed."

  - name: AwardApplication
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; applicant member."
      - name: award_track
        type: enum
        source: input
        description: "Award track."
        constraints: "one of {DEGREE, STAR, SCHOLARSHIP}"
      - name: record_book_id
        type: string
        source: input
        description: "FK -> RecordBook.id; the record book evaluated for this award."
      - name: status
        type: enum
        source: system
        description: "Award application lifecycle."
        constraints: "one of {DRAFT, NOMINATED, ENDORSED, EVALUATED, AWARDED, DENIED, WITHDRAWN}"
        default: DRAFT
      - name: rubric_score
        type: number
        source: computed
        description: "Computed by calc award_rubric_score at EVALUATED transition."
      - name: award_tier
        type: enum
        source: computed
        description: "Tier derived from rubric_score by calc award_rubric_score."
        constraints: "one of {GOLD, SILVER, BRONZE, NONE}"
      - name: nominated_by
        type: string
        source: system
        description: "Volunteer id who performed the DRAFT->NOMINATED transition; used for segregation-of-duties checks."

  - name: ScholarshipApp
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; applying member."
      - name: linked_award_application_id
        type: string
        source: input
        description: "FK -> AwardApplication.id; the SCHOLARSHIP-track award application this scholarship links to."
      - name: status
        type: enum
        source: system
        description: "Scholarship lifecycle."
        constraints: "one of {OPEN, UNDER_REVIEW, GRANTED, DECLINED}"
        default: OPEN
      - name: scholarship_points
        type: integer
        source: computed
        description: "Computed by calc scholarship_points at submit time."

  - name: ScreeningEvent
    parent: null
    common_fields: false
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the volunteer screened."
      - name: event_kind
        type: enum
        source: input
        description: "Screening event type."
        constraints: "one of {BACKGROUND_CHECK, REFERENCE_CHECK, INTERVIEW}"
      - name: outcome
        type: enum
        source: input
        description: "Event outcome."
        constraints: "one of {PASS, FLAG, FAIL}"

  - name: TreasuryTransaction
    parent: null
    common_fields: false
    fields:
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; the club whose treasury is affected."
      - name: txn_kind
        type: enum
        source: input
        description: "Transaction type."
        constraints: "one of {DUES_PAYMENT, EXPENSE_REIMBURSEMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive amount in cents."
      - name: txn_status
        type: enum
        source: system
        description: "Reimbursements require approval before they affect the balance."
        constraints: "one of {POSTED, APPROVED, VOIDED}"
        default: POSTED

state_machines:
  - entity: Member
    initial_state: ENROLLED
    terminal_states: [GRADUATED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /api/members/{id}/activate"
        actor: Volunteer
        preconditions:
          - "member.enrollment_status == ENROLLED"
          - "member.club_id references a Club with status == ACTIVE"
        side_effects:
          - "recompute member.eligibility_posture via calc member_eligibility_posture"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/members/{id}/suspend"
        actor: Volunteer
        preconditions:
          - "member.enrollment_status == ACTIVE"
        side_effects:
          - "set member.eligibility_posture = INELIGIBLE"
          - "for every Project of this member with status IN {PLANNED, ACTIVE}: set status = DROPPED"
          - "increments Member.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/members/{id}/reinstate"
        actor: Volunteer
        preconditions:
          - "member.enrollment_status == SUSPENDED"
        side_effects:
          - "recompute member.eligibility_posture via calc member_eligibility_posture"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /api/members/{id}/graduate"
        actor: Volunteer
        preconditions:
          - "member.enrollment_status == ACTIVE"
          - "no FairEntry for this member has status IN {ENTERED, CONFIRMED}"
        side_effects:
          - "set member.eligibility_posture = INELIGIBLE"
          - "increments Member.version by 1"

  - entity: Project
    initial_state: PLANNED
    terminal_states: [COMPLETED, DROPPED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /api/projects/{id}/start"
        actor: Member
        preconditions:
          - "project.status == PLANNED"
          - "project.member.enrollment_status == ACTIVE"
        side_effects:
          - "increments Project.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/projects/{id}/complete"
        actor: Volunteer
        preconditions:
          - "project.status == ACTIVE"
          - "a RecordBook exists for this project with status == APPROVED"
          - "grade input is one of {A, B, C}"
        side_effects:
          - "set project.grade to the supplied grade"
          - "recompute member.eligibility_posture via calc member_eligibility_posture"
          - "increments Project.version by 1"
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /api/projects/{id}/drop"
        actor: Member
        preconditions:
          - "project.status == ACTIVE"
        side_effects:
          - "if a RecordBook exists for this project in status IN {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED}: set its status = REJECTED"
          - "increments Project.version by 1"
      - from: PLANNED
        to: DROPPED
        trigger: "POST /api/projects/{id}/drop"
        actor: Member
        preconditions:
          - "project.status == PLANNED"
        side_effects:
          - "increments Project.version by 1"

  - entity: RecordBook
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/record-books/{id}/submit"
        actor: Member
        preconditions:
          - "record_book.status == DRAFT"
          - "record_book has at least one LedgerEntry with entry_status == POSTED"
          - "record_book.project.status == ACTIVE"
        side_effects:
          - "set submitted_at to the server logical clock"
          - "compute late_days from the record-book deadline via calc record_book_late_days"
          - "compute provisional_score via calc record_book_score variant=provisional"
          - "increments RecordBook.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/record-books/{id}/begin-review"
        actor: Volunteer
        preconditions:
          - "record_book.status == SUBMITTED"
          - "the acting volunteer is NOT the parent/guardian of record_book.project.member (segregation of duties)"
        side_effects:
          - "increments RecordBook.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /api/record-books/{id}/return"
        actor: Volunteer
        preconditions:
          - "record_book.status == UNDER_REVIEW"
        side_effects:
          - "increments RecordBook.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/record-books/{id}/submit"
        actor: Member
        preconditions:
          - "record_book.status == RETURNED"
          - "record_book.project.status == ACTIVE"
        side_effects:
          - "set submitted_at to the server logical clock"
          - "recompute late_days via calc record_book_late_days"
          - "recompute provisional_score via calc record_book_score variant=provisional"
          - "increments RecordBook.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/record-books/{id}/approve"
        actor: Volunteer
        preconditions:
          - "record_book.status == UNDER_REVIEW"
          - "the acting volunteer's screening_status == CLEARED"
        side_effects:
          - "compute final_score via calc record_book_score variant=final"
          - "recompute member.eligibility_posture via calc member_eligibility_posture"
          - "increments RecordBook.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/record-books/{id}/reject"
        actor: Volunteer
        preconditions:
          - "record_book.status == UNDER_REVIEW"
        side_effects:
          - "increments RecordBook.version by 1"

  - entity: FairEntry
    initial_state: ENTERED
    terminal_states: [EXHIBITED, SCRATCHED]
    transitions:
      - from: ENTERED
        to: CONFIRMED
        trigger: "POST /api/fair-entries/{id}/confirm"
        actor: Volunteer
        preconditions:
          - "fair_entry.status == ENTERED"
          - "fair_entry.member.eligibility_posture == ELIGIBLE"
          - "fair_entry.ownership_days_at_entry >= required ownership days for the project species"
        side_effects:
          - "increments FairEntry.version by 1"
      - from: CONFIRMED
        to: EXHIBITED
        trigger: "POST /api/fair-entries/{id}/mark-exhibited"
        actor: Volunteer
        preconditions:
          - "fair_entry.status == CONFIRMED"
          - "a StallAssignment exists for this entry with status == ASSIGNED"
        side_effects:
          - "increments FairEntry.version by 1"
      - from: ENTERED
        to: SCRATCHED
        trigger: "POST /api/fair-entries/{id}/scratch"
        actor: Member
        preconditions:
          - "fair_entry.status == ENTERED"
        side_effects:
          - "release any StallAssignment for this entry (set status = RELEASED), freeing Pen capacity"
          - "increments FairEntry.version by 1"
      - from: CONFIRMED
        to: SCRATCHED
        trigger: "POST /api/fair-entries/{id}/scratch"
        actor: Volunteer
        preconditions:
          - "fair_entry.status == CONFIRMED"
        side_effects:
          - "release any StallAssignment for this entry (set status = RELEASED), freeing Pen capacity"
          - "increments FairEntry.version by 1"

  - entity: AwardApplication
    initial_state: DRAFT
    terminal_states: [AWARDED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: NOMINATED
        trigger: "POST /api/award-applications/{id}/nominate"
        actor: Volunteer
        preconditions:
          - "award_application.status == DRAFT"
          - "award_application.record_book.status == APPROVED"
          - "if award_track == STAR: the member's club.star_nomination_count < 2"
        side_effects:
          - "set nominated_by to the acting volunteer id"
          - "if award_track == STAR: increment member.club.star_nomination_count by 1"
          - "increments AwardApplication.version by 1"
      - from: NOMINATED
        to: ENDORSED
        trigger: "POST /api/award-applications/{id}/endorse"
        actor: Volunteer
        preconditions:
          - "award_application.status == NOMINATED"
          - "the acting volunteer id != award_application.nominated_by (segregation of duties)"
        side_effects:
          - "increments AwardApplication.version by 1"
      - from: ENDORSED
        to: EVALUATED
        trigger: "POST /api/award-applications/{id}/evaluate"
        actor: Volunteer
        preconditions:
          - "award_application.status == ENDORSED"
        side_effects:
          - "compute rubric_score and award_tier via calc award_rubric_score"
          - "increments AwardApplication.version by 1"
      - from: EVALUATED
        to: AWARDED
        trigger: "POST /api/award-applications/{id}/award"
        actor: Volunteer
        preconditions:
          - "award_application.status == EVALUATED"
          - "award_application.award_tier != NONE"
        side_effects:
          - "if award_track == STAR: decrement member.club.star_nomination_count by 1"
          - "increments AwardApplication.version by 1"
      - from: EVALUATED
        to: DENIED
        trigger: "POST /api/award-applications/{id}/deny"
        actor: Volunteer
        preconditions:
          - "award_application.status == EVALUATED"
          - "award_application.award_tier == NONE"
        side_effects:
          - "increments AwardApplication.version by 1"
      - from: NOMINATED
        to: WITHDRAWN
        trigger: "POST /api/award-applications/{id}/withdraw"
        actor: Member
        preconditions:
          - "award_application.status == NOMINATED"
        side_effects:
          - "if award_track == STAR: decrement member.club.star_nomination_count by 1"
          - "increments AwardApplication.version by 1"
      - from: ENDORSED
        to: WITHDRAWN
        trigger: "POST /api/award-applications/{id}/withdraw"
        actor: Member
        preconditions:
          - "award_application.status == ENDORSED"
        side_effects:
          - "increments AwardApplication.version by 1"

  - entity: ScholarshipApp
    initial_state: OPEN
    terminal_states: [GRANTED, DECLINED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/scholarship-apps/{id}/submit"
        actor: Member
        preconditions:
          - "scholarship_app.status == OPEN"
          - "scholarship_app.linked_award_application.status == EVALUATED"
          - "scholarship_app.linked_award_application.award_tier IN {GOLD, SILVER}"
        side_effects:
          - "compute scholarship_points via calc scholarship_points"
          - "increments ScholarshipApp.version by 1"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /api/scholarship-apps/{id}/grant"
        actor: Volunteer
        preconditions:
          - "scholarship_app.status == UNDER_REVIEW"
          - "scholarship_app.scholarship_points >= 30"
        side_effects:
          - "increments ScholarshipApp.version by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /api/scholarship-apps/{id}/decline"
        actor: Volunteer
        preconditions:
          - "scholarship_app.status == UNDER_REVIEW"
        side_effects:
          - "increments ScholarshipApp.version by 1"

  - entity: Volunteer
    initial_state: PENDING
    terminal_states: [CLEARED, DENIED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /api/volunteers/{id}/clear"
        actor: ProgramAdmin
        preconditions:
          - "volunteer.screening_status == PENDING"
          - "volunteer.screening_score >= 40"
          - "no ScreeningEvent for this volunteer has outcome == FAIL"
        side_effects:
          - "increments Volunteer.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /api/volunteers/{id}/deny"
        actor: ProgramAdmin
        preconditions:
          - "volunteer.screening_status == PENDING"
        side_effects:
          - "increments Volunteer.version by 1"

  - entity: Meeting
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /api/meetings/{id}/mark-held"
        actor: Volunteer
        preconditions:
          - "meeting.status == SCHEDULED"
        side_effects:
          - "recompute eligibility_posture for every ACTIVE member of meeting.club via calc member_eligibility_posture"
          - "increments Meeting.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/meetings/{id}/cancel"
        actor: Volunteer
        preconditions:
          - "meeting.status == SCHEDULED"
        side_effects:
          - "increments Meeting.version by 1"

  - entity: AnimalTag
    initial_state: TAGGED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: TAGGED
        to: VERIFIED
        trigger: "POST /api/animal-tags/{id}/verify"
        actor: Volunteer
        preconditions:
          - "animal_tag.tagging_status == TAGGED"
        side_effects:
          - "recompute member.eligibility_posture via calc member_eligibility_posture"
          - "increments AnimalTag.version by 1"
      - from: TAGGED
        to: REJECTED
        trigger: "POST /api/animal-tags/{id}/reject"
        actor: Volunteer
        preconditions:
          - "animal_tag.tagging_status == TAGGED"
        side_effects:
          - "recompute member.eligibility_posture via calc member_eligibility_posture"
          - "increments AnimalTag.version by 1"

  - entity: StallAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /api/stall-assignments/{id}/release"
        actor: Volunteer
        preconditions:
          - "stall_assignment.status == ASSIGNED"
        side_effects:
          - "frees one unit of Pen.animal_capacity"
          - "increments StallAssignment.version by 1"

concurrency_rules:
  - rule_id: record-book-submit-stale-version
    parent_entity: RecordBook
    write_endpoint: "POST /api/record-books/{id}/submit"
    occ_field: "expected_record_book_version"
    description: |
      Submitting a RecordBook with an expected_record_book_version that no longer
      matches the server's current RecordBook.version is rejected. This captures the
      case where another writer has advanced the record book (e.g. a RETURNED->SUBMITTED
      resubmission or a review action) since the client last observed it, so the
      current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: award-nominate-stale-club
    parent_entity: Club
    write_endpoint: "POST /api/award-applications/{id}/nominate"
    occ_field: "expected_club_version"
    description: |
      Nominating a STAR-track AwardApplication against a Club whose version has
      advanced since the client last observed it is rejected, because another
      nomination may have just consumed the final slot of the club's star quota.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: record_book_score
    trigger: "on RecordBook DRAFT->SUBMITTED / RETURNED->SUBMITTED (provisional) and on UNDER_REVIEW->APPROVED (final)"
    algorithm: weighted_scoring
    formula: |
      inputs: section scores completeness, accuracy, financial, reflection (each 0-100),
              member.is_club_officer, record_book.late_days
      weights: completeness=0.30, accuracy=0.25, financial=0.25, reflection=0.20
      provisional = completeness*0.30 + accuracy*0.25 + financial*0.25 + reflection*0.20
      leadership_bonus = 5 if member.is_club_officer else 0
      late_penalty = min(late_days * 3, 15)
      final = max(0, min(100, provisional + leadership_bonus) - late_penalty)
      EVALUATION ORDER: provisional first, then bonus cap, then late penalty.
    input_set: "The four section scores supplied in the score payload; member officer flag; late_days."
    constants:
      W_COMPLETENESS: 0.30
      W_ACCURACY: 0.25
      W_FINANCIAL: 0.25
      W_REFLECTION: 0.20
      LEADERSHIP_BONUS: 5
      LATE_PENALTY_PER_DAY: 3
      LATE_PENALTY_CAP: 15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "computed at submit time (DRAFT->SUBMITTED and RETURNED->SUBMITTED)"
        difference: "no leadership bonus, no late penalty; plain weighted sum"
      - name: final
        when: "computed at approval time (UNDER_REVIEW->APPROVED)"
        difference: "adds leadership bonus capped at 100, then subtracts late penalty floored at 0"

  - name: record_book_late_days
    trigger: "on RecordBook submit"
    algorithm: chronological
    formula: |
      deadline = the program-year record-book deadline (fixed calendar date 2026-07-15, end of day UTC)
      late_days = number of whole calendar dates by which submitted_at's UTC date exceeds 2026-07-15;
                  0 when submitted on or before 2026-07-15.
    input_set: "record_book.submitted_at (server logical clock)"
    constants:
      RECORD_BOOK_DEADLINE_DATE: "2026-07-15"
    precision: "integer days"

  - name: award_rubric_score
    trigger: "on AwardApplication ENDORSED->EVALUATED"
    algorithm: weighted_scoring
    formula: |
      inputs: record_book_final (0-100), participation_pct (0-100), leadership_pts (>=0 integer)
      leadership_norm = min(20, leadership_pts) / 20 * 100
      rubric_score = 0.5*record_book_final + 0.3*participation_pct + 0.2*leadership_norm
      tier thresholds: GOLD when rubric_score >= 85; SILVER when >= 70; BRONZE when >= 55; else NONE
      Boundary is inclusive: exactly 85.00 is GOLD.
    input_set: "The evaluated application's linked record book final_score, member participation_pct, leadership_pts from payload."
    constants:
      W_RECORD: 0.5
      W_PARTICIPATION: 0.3
      W_LEADERSHIP: 0.2
      LEADERSHIP_CAP: 20
      TIER_GOLD: 85
      TIER_SILVER: 70
      TIER_BRONZE: 55
    precision: "2 decimal places, round_half_up"

  - name: scholarship_points
    trigger: "on ScholarshipApp OPEN->UNDER_REVIEW"
    algorithm: aggregation
    formula: |
      For each Project of the member with status == COMPLETED and grade IN {A,B,C}:
        per_project_raw = BASE_POINTS * multiplier(grade)
        multiplier: A=1.5, B=1.2, C=1.0
        per_project = round_half_up(per_project_raw) to integer   <-- ROUND PER LINE FIRST
      scholarship_points = sum(per_project)                        <-- THEN SUM
      PINNED ROUNDING ORDER: round each per-project value to an integer first, then sum.
      (sum-then-round is a rejected alternative and produces a different total.)
    input_set: "All Project rows for the member with status == COMPLETED and grade != NONE."
    constants:
      BASE_POINTS: 7
      MULT_A: 1.5
      MULT_B: 1.2
      MULT_C: 1.0
    precision: "integer points; per-line round_half_up before summation"

  - name: member_eligibility_posture
    trigger: "recomputed on member activate/reinstate, record book approve, project complete, and meeting mark-held"
    algorithm: constraint_propagation
    formula: |
      attendance_pct = (count of Attendance rows for member with attendance_status == PRESENT)
                       / (count of Attendance rows for member with attendance_status IN {PRESENT, ABSENT})
                       * 100   ; EXCUSED rows are excluded from both numerator and denominator.
      If denominator == 0, attendance_pct is undefined and treated as not meeting the threshold.
      has_approved_record_book = exists a RecordBook for a project of this member with status == APPROVED
      has_verified_tag (only required if the member has any project of type IN {BEEF, SHEEP, SWINE}) =
        every such project has at least one AnimalTag with tagging_status == VERIFIED
      ELIGIBLE   when attendance_pct >= 75 AND has_approved_record_book AND has_verified_tag
      CONDITIONAL when attendance_pct >= 75 AND (has_approved_record_book XOR has_verified_tag)
      INELIGIBLE otherwise
      Boundary: attendance_pct of exactly 75.00 satisfies the threshold (>=).
    input_set: "Attendance rows for the member; RecordBook rows for member's projects; AnimalTag rows for livestock projects."
    constants:
      ATTENDANCE_THRESHOLD_PCT: 75
    precision: "attendance_pct 2 decimal places, round_half_up"

  - name: ownership_days
    trigger: "on FairEntry creation"
    algorithm: chronological
    formula: |
      fair_entry_deadline = 2026-08-01T00:00:00Z (fixed program-year deadline)
      For the entry's primary animal (the earliest-created VERIFIED AnimalTag on the project;
      tie-break: smallest created_at, then smallest tag_number lexicographically):
        ownership_days_at_entry = number of whole days between animal.owned_since and the deadline.
      Eligibility boundary: BEEF requires ownership_days_at_entry >= 60; SHEEP/SWINE require >= 30.
      Exactly the required number qualifies (>= is inclusive).
    input_set: "VERIFIED AnimalTag rows on the fair entry's project."
    constants:
      FAIR_ENTRY_DEADLINE: "2026-08-01T00:00:00Z"
      BEEF_MIN_OWNERSHIP_DAYS: 60
      SHEEP_MIN_OWNERSHIP_DAYS: 30
      SWINE_MIN_OWNERSHIP_DAYS: 30
    precision: "integer days"

  - name: volunteer_screening_score
    trigger: "on Volunteer creation and whenever a ScreeningEvent is added"
    algorithm: aggregation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, PINNED ORDER:
        (1) years_cap = floor(base_clearance / 10)
        (2) effective_years = min(years_service, years_cap)
        (3) screening_score = base_clearance - risk_flags*10 + effective_years*2
      The cap on years_service depends only on base_clearance, never on the score itself,
      so evaluation terminates in exactly three steps.
    input_set: "volunteer.base_clearance, volunteer.risk_flags, volunteer.years_service"
    constants:
      RISK_FLAG_PENALTY: 10
      YEARS_BONUS: 2
      CLEARANCE_THRESHOLD: 40
    precision: "integer score"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a recognized role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role is permitted to invoke this endpoint per the RBAC matrix."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id referenced in the path and body exists, validated left-to-right (parent before child)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "For entity_backed roles, X-User-ID resolves to an existing entity of the role's backing type; for ownership-scoped endpoints the acting entity must own the target resource."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "member-scoped endpoints"
  - priority: 5
    category: state
    check: "The target resource is in a valid from-state for the requested transition (state-machine precondition)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the acting volunteer is not the record book member's parent/guardian (begin-review) and is not the same volunteer who nominated (endorse)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /api/record-books/{id}/begin-review, POST /api/award-applications/{id}/endorse"
  - priority: 7
    category: business_safety
    check: "Volunteer screening: a volunteer approving a record book must have screening_status == CLEARED; a volunteer being cleared must have screening_score >= 40 and no FAIL screening event."
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 422
    applies_to: "POST /api/record-books/{id}/approve, POST /api/volunteers/{id}/clear"
  - priority: 8
    category: business_temporal
    check: "Meeting room overlap: a new Meeting's [starts_at, ends_at) half-open interval must not overlap any existing SCHEDULED or HELD meeting in the same Room; meetings that merely touch (one ends exactly when the other begins) do NOT overlap."
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /api/meetings"
  - priority: 9
    category: business_constraint
    check: "Pen capacity: creating a StallAssignment must not cause the count of ASSIGNED StallAssignment rows for the Pen to exceed Pen.animal_capacity (aggregate-count capacity, not interval-based)."
    error_id: ERR_PEN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/stall-assignments"
  - priority: 10
    category: business_constraint
    check: "Star nomination quota: nominating a STAR-track AwardApplication requires the member's club.star_nomination_count < 2."
    error_id: ERR_STAR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /api/award-applications/{id}/nominate"
  - priority: 11
    category: business_temporal
    check: "Ownership-days requirement: confirming a FairEntry requires ownership_days_at_entry >= the species minimum (60 beef, 30 sheep/swine)."
    error_id: ERR_OWNERSHIP_PERIOD_SHORT
    http_status: 422
    applies_to: "POST /api/fair-entries/{id}/confirm"
  - priority: 12
    category: business_fiscal
    check: "Treasury solvency: approving an EXPENSE_REIMBURSEMENT must not drive the club's treasury_balance_cents negative."
    error_id: ERR_INSUFFICIENT_TREASURY
    http_status: 422
    applies_to: "POST /api/treasury-transactions/{id}/approve"
  - priority: 13
    category: business_referential
    check: "Referential integrity: a FairEntry's project must belong to the entry's member; a ScholarshipApp's linked award application must belong to the same member and be award_track == SCHOLARSHIP."
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /api/fair-entries, POST /api/scholarship-apps"
  - priority: 14
    category: business_constraint
    check: "Required-field and type validation: required input fields present, enum values valid, ends_at strictly after starts_at, amounts non-negative."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 15
    category: business_temporal
    check: "OCC optimistic concurrency: expected_<parent>_version matches the parent's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/record-books/{id}/submit, POST /api/award-applications/{id}/nominate"

