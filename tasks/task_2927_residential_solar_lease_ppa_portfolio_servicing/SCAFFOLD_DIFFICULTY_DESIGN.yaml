            - "after both rejections TransferCase.${tcI_id}.status is still CREDIT_APPROVED and title_cleared_at is null"
            - "record-subordination by u_title_2 (the requester was u_agent_1) -> 200; UccFiling.${uccI_id}.status == SUBORDINATED"
            - "the third clear-title -> 200; TransferCase.${tcI_id}.status == TITLE_CLEARED and title_cleared_at == 2026-08-01T00:00:00Z"
            - "SolarAgreement.${agI_id}.lifecycle_state == TRANSFER_PENDING throughout"

      - name: election_execution_requires_no_live_roof_work_order
        grounds:
          - validations[priority=12].roof_work_blocks_execution
          - errors[ERR_ROOF_WORK_IN_PROGRESS]
          - state_machines.EndOfTermElection.ACCEPTED_to_EXECUTED
          - state_machines.RoofWorkOrder.APPROVED_to_CANCELLED
          - state_machines.SolarAgreement.END_OF_TERM_PENDING_to_ACTIVE
          - calculations.end_of_term_election_pricing
        distinguishing_aspect: |
          An ACCEPTED RENEW election cannot execute while a RoofWorkOrder for the same
          agreement sits in APPROVED, even though nothing about the election itself is
          wrong; cancelling that unrelated child entity unblocks the very same request.
          Execution then loops the agreement back to ACTIVE with renewal_count 1 and
          contract_end_date pushed from 2026-08-31 to 2031-08-31, which is the cyclic
          edge of the lifecycle machine.
