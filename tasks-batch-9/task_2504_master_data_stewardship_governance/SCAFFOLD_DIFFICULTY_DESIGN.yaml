            - "${rec_b_completeness} == 80.00 and ${rec_b_score} == 102.00 (tier 5 x 10 = 50, round(80.00 * 0.40, 2) = 32.00, recency max(0, 20 - 4 * floor(4 / 30)) = 20)"
            - "${mp_score} == 77.00 (0.50*90.00 + 0.30*80.00 + 0.20*min(40.00, 80.00), no intra-source discount) and ${mp_conf} == MEDIUM"
