    check: "bearing_preload_micron is inside the inclusive window for MachineModel.drum_alloy_grade: AISI_304 [18.00, 32.00], AISI_316 [20.00, 34.00], DUPLEX_2205 [24.00, 40.00]; the field is required for BEARING_INSTALL logs and must be null otherwise"
    error_id: ERR_PRELOAD_OUT_OF_SPEC
