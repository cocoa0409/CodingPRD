              as: BoxManager
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${m_id}", membership_id: "${ms_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sess_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rv_id: $.data.id }
          trigger:
            - call: "GET /box/memberships/${ms_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { punches_now: $.data.punches_remaining }
          assert:
            - "Reservation.${rv_id}.punch_consumed == true"
            - "Membership.${ms_id}.punches_remaining == 4"
