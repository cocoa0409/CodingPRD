- method: GET
  path: /potato-shed/sheds/{id}/wash-water-checks
  description: 'List wash-water checks of a shed (reverse-reach WashWaterCheck.shed_id); list order pinned: created_at ASC'
  roles:
  - ShedAdmin
  - QualityAssuranceManager
  - PackLineSupervisor
  code: 200
  input:
  - limit?
  - offset?
  output: WashWaterCheck[]
  side_effects: []
- method: POST
