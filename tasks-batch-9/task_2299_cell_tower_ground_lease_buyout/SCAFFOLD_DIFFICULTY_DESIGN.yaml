      - name: offer_expired_precedes_insufficient_portfolio_capital
        grounds:
          - validations[priority=13]
          - validations[priority=41]
          - state_machines.Offer.SENT_to_LAPSED
          - calculations.deal_settlement_statement
        distinguishing_aspect: |
          A state-category rule (priority 13, ERR_OFFER_EXPIRED, 409) outranks a business_fiscal rule
          (priority 41, ERR_INSUFFICIENT_PORTFOLIO_CAPITAL, 402) on the same ACCEPT call: the portfolio
          holds only 30000000 against a 36540000 commitment so the fiscal rule is genuinely violated, yet
          the expiry check runs first and the response carries ERR_OFFER_EXPIRED, not the 402.
