  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_slot_halfopen_adjacency_allowed
        grounds:
          - validations[priority=9]
          - entities.RouteSchedule.fields.booked_minutes
          - entities.ServiceVisit.fields.slot_start_minute
        distinguishing_aspect: |
          HALF-OPEN interval semantics on RouteSchedule: a second visit at
          [570,660) placed immediately after the first [480,570) SUCCEEDS
          because adjacency (end==start) does not collide — booked_minutes
          becomes 180.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract/plan/crew/OPEN route shift [400,800); first SCHEDULED visit slot_start=480 duration=90 -> occupies [480,570)."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
