              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/effectiveness-check"
              payload: { basis: "VERIFIED_BASIS" }
              as: EnforcementOfficer
              as_user_id: "OFF-2"
              captures: { final_rate: $.data.verified_recovery_rate }
            - call: "POST /cosmetics/listings/${lst_id}/delist"
              payload: { reason: "Line discontinued" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          assert:
            - "before the trigger: ProductListing.${lst_id}.open_recall_count == 1, listing_status == LISTED, RecallAction.${rec_id}.status == EXECUTING"
            - "trigger[0] returns ERR_OPEN_RECALL_BLOCKS_DELIST with http 409 and leaves ProductListing.${lst_id}.listing_status == LISTED"
            - "after trigger[1]: MarketWithdrawal.${wd_id}.provisional_verified_rate == 90.00, unreachable_credit_pct == 0 (>= UNREACHABLE_TIER_HIGH), adjusted_denominator_units == 1000 and ${final_rate} == 90.00"
            - "after trigger[1]: MarketWithdrawal.${wd_id}.effectiveness_verdict == EFFECTIVE and status == CLOSED_EFFECTIVE; RecallAction.${rec_id}.status == CLOSED_EFFECTIVE with effectiveness_rate_final == 90.00"
            - "after trigger[1]: ProductListing.${lst_id}.open_recall_count == 0 and outstanding_units_total on the withdrawal == 100"
            - "trigger[2] — the SAME request as trigger[0] — succeeds: ProductListing.${lst_id}.listing_status == DELISTED with suspension_reason null, Facility.${fac_id}.listed_product_count == 0 and ResponsiblePerson.${rp_id}.active_designation_count == 0 with status DORMANT"
            - "the effectiveness rate sits exactly ON the EFFECTIVENESS_THRESHOLD (90.00), so an implementation using a strict > would leave the recall open and the delist blocked"

  - rule_id: resource_temporal_overlap
    instances:
      - name: inspection_half_open_windows_allow_adjacency_but_enforce_same_type_buffer
        grounds:
          - validations[priority=43]
          - validations[priority=42]
          - validations[priority=40]
          - entities.InspectionEngagement.fields.window_start
        distinguishing_aspect: |
          Resource = the facility's inspection calendar; interval semantics = HALF-OPEN
          [window_start, window_end), where touching endpoints are legal. Five bookings probe the two
          distinct rules on the same resource: an adjacent different-type window is accepted
          (existing end == requested start), a window that truly overlaps two existing ones is
          refused with ERR_INSPECTION_WINDOW_OVERLAP, and a non-overlapping SAME-type window only 5
          days clear of an existing GMP_ROUTINE is refused by the 7-day buffer instead — the buffer
          bites where the overlap rule does not.
        test_recipe:
          setup:
            - "one REGISTERED facility whose current registration period is 2026-08-01 .. 2028-07-31, so every window below satisfies validations[priority=40]"
            - "no inspections yet; all five bookings are made by RegulatoryReviewer RVW-1 at the untouched clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Bramble Compounding", owner_operator_name: "Bramble Co", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "IN" }
              as: FacilityRegistrant
