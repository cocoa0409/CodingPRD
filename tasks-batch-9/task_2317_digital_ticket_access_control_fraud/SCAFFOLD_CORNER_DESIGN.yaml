              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga}", holder_patron_id: "${p_bob_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_bob1: $.data.id }
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga}", holder_patron_id: "${p_bob_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_bob2: $.data.id }
            - call: "POST /tickets/${t_ada1}/device-binding"
              payload: { device_fingerprint: "DEV-A1" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_ada1}/device-binding/release"
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_ada1}/device-binding"
              payload: { device_fingerprint: "DEV-A2" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_ada1}/device-binding/release"
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_ada1}/device-binding"
              payload: { device_fingerprint: "DEV-A3" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_ada2}/device-binding"
              payload: { device_fingerprint: "DEV-A9" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_bob1}/device-binding"
              payload: { device_fingerprint: "DEV-B1" }
              as: Patron
              as_user_id: "${p_bob_id}"
            - call: "POST /tickets/${t_bob2}/device-binding"
              payload: { device_fingerprint: "DEV-B9" }
              as: Patron
              as_user_id: "${p_bob_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g2_id}", operator_device_id: "SCN-2", mode: "ONLINE", expected_gate_version: "${g2_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s2_id: $.data.id }
            - call: "GET /tickets/${t_ada1}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_a1: $.data.current_barcode }
            - call: "GET /tickets/${t_ada2}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_a2: $.data.current_barcode }
            - call: "GET /tickets/${t_bob1}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_b1: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_a1}", device_fingerprint: "DEV-A3", direction: "IN", dedupe_key: "A1" }
              as: GateOperator
              as_user_id: "gate-op-1"
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_a1}", device_fingerprint: "DEV-A3", direction: "IN", dedupe_key: "A2" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_a_dup: $.data.error_id }
            - call: "POST /scan-sessions/${s2_id}/scan-events"
              payload: { presented_barcode: "${bc_a2}", device_fingerprint: "DEV-A9", direction: "IN", dedupe_key: "A3" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_a_zone: $.data.error_id }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_b1}", device_fingerprint: "DEV-B1", direction: "IN", dedupe_key: "B1" }
              as: GateOperator
              as_user_id: "gate-op-1"
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_b1}", device_fingerprint: "DEV-B1", direction: "IN", dedupe_key: "B2" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_b_dup1: $.data.error_id }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_b1}", device_fingerprint: "DEV-B1", direction: "IN", dedupe_key: "B3" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_b_dup2: $.data.error_id }
          trigger:
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { ada_score: $.data.fraud_risk_score, ada_strikes: $.data.strike_count, ada_rebinds: $.data.device_rebind_count, ada_basis: $.data.fraud_risk_basis }
            - call: "GET /patrons/${p_bob_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { bob_score: $.data.fraud_risk_score, bob_strikes: $.data.strike_count, bob_rebinds: $.data.device_rebind_count }
            - call: "GET /tickets/${t_ada2}"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { ta2_v: $.data.version }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_ada2}", ask_price_cents: 12000, marketplace: "VERIFIED_PARTNER", expected_ticket_version: "${ta2_v}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { l_status: $.data.status, l_cap: $.data.cap_price_cents }
            - call: "GET /tickets/${t_bob2}"
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { tb2_v: $.data.version }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_bob2}", ask_price_cents: 12000, marketplace: "VERIFIED_PARTNER", expected_ticket_version: "${tb2_v}" }
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { e_blocked: $.data.error_id }
            - call: "POST /transfer-requests"
              payload: { ticket_id: "${t_bob2}", recipient_patron_id: "${p_ada_id}" }
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { e_blocked2: $.data.error_id }
          assert:
            - "${e_a_dup} == ERR_DUPLICATE_SCAN, ${e_a_zone} == ERR_ZONE_NOT_ENTITLED, ${e_b_dup1} == ERR_DUPLICATE_SCAN and ${e_b_dup2} == ERR_DUPLICATE_SCAN"
            - "${ada_rebinds} == 2 and ${ada_strikes} == 2 — two rebinds of the same ticket, two incidents"
            - "${ada_score} == 39 — 20 (DUPLICATE) + 15 (ZONE_VIOLATION) + 4 * max(2 - 1, 0) churn, all at PROVISIONAL weight, and ${ada_basis} == PROVISIONAL"
            - "${bob_rebinds} == 0 and ${bob_strikes} == 2, so ${bob_score} == 40 — 20 + 20 with no churn term"
            - "HTTP 201 for Ada with ${l_status} == LISTED and ${l_cap} == 14500 — 39 is strictly below FRAUD_BLOCK_THRESHOLD 40"
            - "${e_blocked} == ERR_PATRON_FRAUD_BLOCKED with HTTP 403 — exactly 40 blocks, so the comparison is score < 40 and not score <= 40"
            - "${e_blocked2} == ERR_PATRON_FRAUD_BLOCKED with HTTP 403 — the same gate applies to transfers"
            - "GET /resale-listings has total_count == 1 and GET /transfer-requests has total_count == 0"
            - "Ticket.${t_bob2}.lifecycle_status == ISSUED — the blocked calls wrote nothing"

      - name: cascading_side_effect_chain_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: credential_approval_cascade_freezes_zone_and_blocks_the_next_submit
          rationale: |
            That instance walks the deepest declared chain end to end — approval issues
            entitlements, which move zone and event counters, which recompute posture, which
            then refuses a following submit — and ticket_void_cascade_reverses_listing_zone_and_
            settlement_pool covers the compensating direction of the same chain.

      - name: dual_variant_occupancy_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.live_occupancy.variants
        excluded_because:
          difficulty_instance: occupancy_gate_live_vs_reconciled_variant_divergence
          rationale: "Both variants are computed over one identical scan set and their delta is asserted there."

      - name: dual_variant_fraud_score_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.patron_fraud_risk_score.variants
        excluded_because:
          difficulty_instance: patron_fraud_score_provisional_vs_adjudicated_variant_divergence
          rationale: "The PROVISIONAL to ADJUDICATED switch and the halving/dropping of weights is asserted there, including the basis flip."
  # ===========================================================================
  # Consistency model — immediate
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /tickets].side_effects
          - endpoints[POST /scan-sessions/{id}/scan-events].side_effects
          - calculations.live_occupancy
          - calculations.zone_posture
        distinguishing_aspect: |
          Nothing in this system lags. The issuance response itself already carries the minted
          barcode_seed and both state dimensions, and the very next read of the zone and the
          event shows the incremented counters, the recomputed posture and the credited
          settlement pool. Likewise the admit response carries the final result and the
          occupancy read taken immediately afterwards — with no clock movement in between —
          shows live_occupancy 1, the ticket INSIDE and the gate counter advanced. No retry,
          no re-read delay and no background recompute step is permitted.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with AccessZone GA1 (fire_code_capacity 2, so one issuance moves posture measurably); Gate G1; Ada verified; clock 2026-09-12T18:10:00Z; ONLINE session S1 open on G1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 2, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id, z_post0: $.data.posture, z_issued0: $.data.issued_entitlement_count }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
          trigger:
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id, t_life: $.data.lifecycle_status, t_adm: $.data.admission_status, t_bind: $.data.device_binding_status, t_seed: $.data.barcode_seed }
            - call: "GET /access-zones/${z_id}"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { z_issued1: $.data.issued_entitlement_count, z_post1: $.data.posture, z_occ1: $.data.occupancy_count }
            - call: "GET /events/${ev_id}"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { ev_out1: $.data.entitlements_outstanding, ev_pool1: $.data.settlement_pool_cents }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "C1" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { sc_result: $.data.result, sc_at: $.data.recorded_at, sc_src: $.data.source }
            - call: "GET /events/${ev_id}/occupancy"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { live1: $.data.live_occupancy, peak1: $.data.peak_live_occupancy, recon1: $.data.reconciled_attendance }
            - call: "GET /tickets/${t_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { t_adm2: $.data.admission_status }
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g_count: $.data.admitted_scan_count }
            - call: "GET /scan-sessions/${s1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s_online: $.data.online_scan_count }
          assert:
            - "${z_post0} == OPEN and ${z_issued0} == 0 at creation"
            - "The issuance response itself already carries ${t_life} == ISSUED, ${t_adm} == NOT_ADMITTED, ${t_bind} == UNBOUND and a non-null ${t_seed}"
            - "${z_issued1} == 1, ${z_occ1} == 0 and ${z_post1} == OPEN — 1 of 2 is a ratio of 0.50, below the 0.90 band"
            - "${ev_out1} == 1 and ${ev_pool1} == 12000 — the parent counters are current on the very next read, with no intervening write"
            - "${sc_result} == ADMITTED, ${sc_src} == ONLINE and ${sc_at} == 2026-09-12T18:10:00Z"
            - "${live1} == 1, ${peak1} == 1 and ${recon1} == 1 immediately after the admit, with no clock movement between the write and the read"
            - "${t_adm2} == INSIDE, ${g_count} == 1 and ${s_online} == 1 — every derived counter on every affected aggregate is already settled"
            - "Repeating all four reads a second time returns byte-identical derived values — reads are side-effect free and there is no lazy recompute on first access"
