            - "notice_round == 1 and notice_delivered_at == null (SCHEDULE arms the notice; DELIVER stamps it)."
            - "The one-second-short call on the sibling line returns HTTP 422 with data.error_id == 'ERR_NOTICE_LEAD_TIME_TOO_SHORT'."
