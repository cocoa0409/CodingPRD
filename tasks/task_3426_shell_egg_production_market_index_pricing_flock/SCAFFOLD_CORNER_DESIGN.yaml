              as: ComplexManager
              as_user_id: "${cx_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ORGANIC_INPUTS_REQUIRED"
            - "error_id != ERR_INSUFFICIENT_FEED_INVENTORY even though the organic pool is empty — the organic-integrity rule reports first"
            - "Complex.${cx_id}.corn_inventory_tons == 100 (untouched)"

      - name: batch_beyond_pool_returns_insufficient_feed_inventory
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors.ERR_INSUFFICIENT_FEED_INVENTORY
        distinguishing_aspect: "A CONVENTIONAL batch demanding 150 corn tons from a 100-ton pool is 422 ERR_INSUFFICIENT_FEED_INVENTORY and decrements nothing."
        test_recipe:
          setup: ["Complex 'Mill West' with 100 tons of non-organic corn received."]
          setup_api_calls:
            - *c_clock0901
