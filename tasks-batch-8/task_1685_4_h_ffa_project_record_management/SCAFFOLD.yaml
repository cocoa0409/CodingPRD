  - method: POST
    path: "/api/treasury-transactions/{id}/void"
    description: "Void a POSTED treasury transaction before it is approved; reverses any credit it applied."
    roles: [Volunteer]
    code: 200
    input: []
    output: TreasuryTransaction
    side_effects: ["sets txn_status=VOIDED", "if it was a DUES_PAYMENT, debit club.treasury_balance_cents to reverse the credit", "increments Club.version by 1"]

