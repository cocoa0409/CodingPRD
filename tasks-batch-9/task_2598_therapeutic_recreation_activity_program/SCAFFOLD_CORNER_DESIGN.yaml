        grounds:
          - validations.priority_21_ERR_TIME_WINDOW_INVALID
        distinguishing_aspect: "Interval sanity is strict for sessions and non-strict for packets: ends_at equal to starts_at is refused with ERR_TIME_WINDOW_INVALID, while a single-day packet whose window_end equals window_start is accepted."
        test_recipe:
          setup:
            - "one program and one empty room"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Zero Length Program", domain: "SPIRITUAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
