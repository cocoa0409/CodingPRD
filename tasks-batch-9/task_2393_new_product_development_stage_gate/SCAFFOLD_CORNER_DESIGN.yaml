              captures: { id_p_v2: $.data.version }
            - call: "POST /innovation-projects/${id_p_id}/business-cases"
              payload: { expected_project_version: "${id_p_v2}", variant_mode: "BOTTOM_UP", category_size_units_year: 5000000, target_share_pct: 3.00, cogs_per_unit_usd: 3.2000, slotting_fees_usd: 50000.00, capex_usd: 300000.00, discount_rate_pct: 9.00 }
              as: InnovationLead
              captures: { id_bc_id: $.data.id }
            - call: "POST /business-cases/${id_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2400, base_velocity_units_per_store_week: 1.20, promo_weeks: 4, promo_lift_pct: 30.00, list_price_usd: 5.7500 }
