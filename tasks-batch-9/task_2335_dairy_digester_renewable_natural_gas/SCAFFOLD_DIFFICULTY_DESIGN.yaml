  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_total_solids_exactly_equal_to_agreement_minimum_is_accepted
        grounds:
          - "validations[priority=140]"
          - entities.FeedstockDelivery.fields.total_solids_pct
          - entities.FeedstockAgreement.fields.minimum_total_solids_pct
          - calculations.organic_loading_rate
        distinguishing_aspect: |
          Metric: total solids percentage against the contractual floor, on
          POST /feedstock-deliveries. total_solids_pct == minimum_total_solids_pct (8.0
          against 8.0) is ACCEPTED and contributes 9.840 t of volatile solids, while 7.9 is
          rejected with ERR_SOLIDS_BELOW_MINIMUM - a strict greater-than implementation
          would reject the 8.0 load and leave organic_loading_rate at 0.000.
        test_recipe:
          setup:
            - "One ACTIVE agreement for dairy1 with minimum_total_solids_pct 8.0 against a facility of 6000.000 m3 and 500.000 t/day hydraulic capacity."
            - "One OPEN operations day 2026-08-03 inside the agreement term."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3000, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 18000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 8.0, term_start_date: "2026-01-01", term_end_date: "2026-12-31", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "R. Alvarez" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-03" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day1_id: "$.data.id" }
          trigger:
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr1_id}", ops_day_id: "${day1_id}", gross_tonnes: 150.000, tare_tonnes: 0.000, total_solids_pct: 8.0, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { del_at_boundary_id: "$.data.id", vs_at_boundary: "$.data.vs_tonnes" }
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr1_id}", ops_day_id: "${day1_id}", gross_tonnes: 100.000, tare_tonnes: 0.000, total_solids_pct: 7.9, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { err_below_boundary: "$.data.error_id" }
          assert:
            - "first call HTTP status == 201"
            - "vs_at_boundary == 9.840"
            - "FeedstockDelivery.${del_at_boundary_id}.status == ACCEPTED"
            - "FeedstockDelivery.${del_at_boundary_id}.net_tonnes == 150.000"
            - "FeedstockDelivery.${del_at_boundary_id}.haul_tonne_km == 1800.00"
            - "err_below_boundary == ERR_SOLIDS_BELOW_MINIMUM"
            - "second call HTTP status == 422"
            - "OperationsDay.${day1_id}.organic_loading_rate == 1.640"
            - "DigesterFacility.${facility_id}.total_manure_received_tonnes == 150.000"

      - name: bpc_hourly_injection_rate_exactly_at_interconnect_ceiling_is_accepted
