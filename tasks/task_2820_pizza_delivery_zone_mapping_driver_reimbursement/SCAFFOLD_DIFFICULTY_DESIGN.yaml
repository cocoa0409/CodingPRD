      - name: dispute_info_request_cycle_caps_at_two_rounds
        grounds:
          - state_machines.AddressDispute.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.AddressDispute.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.AddressDispute.fields.review_round_count
          - errors.ERR_DISPUTE_ROUND_LIMIT
          - validations.priority_28
        distinguishing_aspect: |
          The AddressDispute machine is cyclic: UNDER_REVIEW -> INFO_REQUESTED ->
          UNDER_REVIEW can be traversed twice, and review_round_count is NEVER
          decremented when the loop closes. The dispute is in exactly the same
          status (UNDER_REVIEW) before the first, second and third REQUEST_INFO,
          yet the third is rejected with ERR_DISPUTE_ROUND_LIMIT. A stateless
          transition table that only consults the current status accepts the
          third call; an implementation that decrements or resets the counter on
          re-review also accepts it.
        test_recipe:
          setup:
            - "A store with the ceiling-40 zone model and one EDGE address at grid 11.34 miles."
            - "A dispute on that address that has been taken UNDER_REVIEW and pushed twice around the INFO_REQUESTED loop, so review_round_count is exactly 2 and status is UNDER_REVIEW again."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, promise_minutes: 30, delivery_fee_cents: 399, cash_limit_cents: 5000, hot_bag_count: 4, max_stacked_stops: 3, handoff_minutes_per_stop: 6, dispatch_reset_buffer_minutes: 10, service_posture: "OPEN" }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "77 Far Ridge", latitude_micro: 39170100, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_h_id: $.data.id }
            - call: "POST /store-ops/address-disputes"
              payload: { service_address_id: "${addr_h_id}", claimed_state: "IN_ZONE", evidence_note: "Neighbour two doors down is delivered" }
              as: CustomerCareAgent
              as_user_id: "cca-1"
              captures: { disp_h_id: $.data.id }
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
              payload: { action: "START_REVIEW" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
              payload: { action: "REQUEST_INFO" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
              payload: { action: "START_REVIEW" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
              payload: { action: "REQUEST_INFO" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
              payload: { action: "START_REVIEW" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
              payload: { action: "REQUEST_INFO" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "HTTP 409 with error_id ERR_DISPUTE_ROUND_LIMIT"
            - "AddressDispute.${disp_h_id}.status == UNDER_REVIEW (unchanged by the rejected third request)"
            - "AddressDispute.${disp_h_id}.review_round_count == 2 (not incremented by the rejected call)"
            - "AddressDispute.${disp_h_id}.resolution == null"
            - "a subsequent POST /store-ops/address-disputes/${disp_h_id}/review with action GRANT and granted_until 2026-08-05T23:00:00Z still succeeds, proving only the REQUEST_INFO edge is capped"

      - name: dispatch_lock_unlock_relock_recomputes_route_from_scratch
        grounds:
          - state_machines.Dispatch.STACKED_to_LOCKED
          - state_machines.Dispatch.LOCKED_to_STACKED
          - calculations.route_duration_model
          - calculations.dispatch_reimbursement
          - entities.Dispatch.fields.route_minutes
          - entities.Dispatch.fields.estimated_reimbursement_cents
          - entities.DispatchStop.fields.sequence
        distinguishing_aspect: |
          Dispatch cycles STACKED -> LOCKED -> STACKED -> LOCKED. The unlock edge
          must NULL route_minutes, expected_return_at, resolved_cost_model_id and
          estimated_reimbursement_cents and release the reservations, and the
          second lock must recompute them over the NEW stop set: 24 minutes and
          336 cents on the first lock, 39 minutes and 651 cents on the second.
          An implementation that memoises the lock-time snapshot, or that only
          appends the newly added stop's contribution, reports 24/336 or the
          wrong 372/675 combination after the re-lock.
        test_recipe:
