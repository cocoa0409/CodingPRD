        grounds:
          - validations[priority=10]
          - calculations.bracket_assignment
        distinguishing_aspect: |
          Boundary on the FUNDED CENTS metric through POST generate-bracket: the gate
          is >= (inclusive), so funded exactly equal to target (200000 + 300000 ==
          500000) passes and the bracket is built; one cent less fails (paired corner
          instance funding_one_cent_short_fails).
