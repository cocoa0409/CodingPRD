            - { call: "POST /program/contractors", payload: { legal_name: "Bnd Co", license_number: "LIC-BN", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cbn_id: $.data.id } }
