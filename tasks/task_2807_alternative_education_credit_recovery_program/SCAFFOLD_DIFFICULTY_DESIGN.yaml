# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every numeric assert below was computed by
# executing the SCAFFOLD.yaml §1.3 formula against the pinned setup literals.
# Logical clock: the server starts at 2026-08-01T00:00:00Z; chains that need elapsed time move it
# forward with POST /_clock/set_current_utc.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: seat_time_vs_competency_award_same_progress_inputs
        grounds:
          - calculations.credit_award_credits
          - calculations.credit_award_credits.variants.seat_time_award
          - calculations.credit_award_credits.variants.competency_award
          - entities.Placement.fields.credit_policy
          - entities.CreditAward.fields.award_basis
          - state_machines.CourseEnrollment.SUBMITTED_FOR_AWARD_to_AWARDED
        distinguishing_aspect: |
          Two placements at the same center hold byte-identical coursework inputs (modules_passed 7
          of 8, seat_hours_logged 30.00 of 60.00 required, mastery_pct 84.00, final_percent 84.00);
          the SEAT_TIME placement posts 0.50 credits while the COMPETENCY placement posts 1.00 —
          a 0.50-credit divergence produced only by Placement.credit_policy.
        test_recipe:
          setup:
            - "one home school (accountability_cohort_year 2026) and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12 (intake_posture OPEN)"
            - "one PACKET course ALG1: credit_value 1.00, total_modules 8, required_seat_hours 60.00, pacing_days 40, proctoring_required false, min_passing_percent 60.00"
            - "student A on a SEAT_TIME placement and student B on a COMPETENCY placement, each with an ACTIVE graduation plan of required_credits_total 24.00 and grade_level 9"
            - "each student has one NEW_CREDIT enrollment in ALG1 with modules_passed 7, seat_hours_logged 30.00, module_avg_percent 84.00, submitted for award at final_percent 84.00"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-1001", full_name: "Ada Reyes", cohort_year: 2026, grade_level: 9 }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-1002", full_name: "Ben Ortiz", cohort_year: 2026, grade_level: 9 }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_a}", required_credits_total: 24.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2029-S2" }
              as: Registrar
              captures: { plan_a: $.data.id }
            - call: "POST /graduation-plans/${plan_a}/activate"
              payload: {}
              as: Registrar
              captures: { plan_a_v: $.data.version }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_b}", required_credits_total: 24.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2029-S2" }
              as: Registrar
              captures: { plan_b: $.data.id }
            - call: "POST /graduation-plans/${plan_b}/activate"
              payload: {}
              as: Registrar
              captures: { plan_b_v: $.data.version }
            - call: "POST /referrals"
              payload: { student_id: "${stu_a}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6, narrative: "four credits short after freshman year" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals/${ref_a}/screen"
              payload: { screening_note: "packet pathway fits" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_a}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_a}/accept-offer"
              payload: { credit_policy: "SEAT_TIME", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_a: $.data.id, pl_a_v: $.data.version }
            - call: "GET /centers/${ctr_id}"
              payload: {}
              as: DistrictAdmin
              captures: { ctr_v2: $.data.version }
            - call: "POST /referrals"
              payload: { student_id: "${stu_b}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6, narrative: "four credits short after freshman year" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_b: $.data.id }
            - call: "POST /referrals/${ref_b}/screen"
              payload: { screening_note: "competency pathway fits" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_b}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v2}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_b}/accept-offer"
              payload: { credit_policy: "COMPETENCY", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_b: $.data.id, pl_b_v: $.data.version }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_a}", course_id: "${crs_id}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_a_v}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_a: $.data.id }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_b}", course_id: "${crs_id}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_b_v}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_b: $.data.id }
            - call: "POST /course-enrollments/${enr_a}/progress"
              payload: { modules_passed_delta: 7, seat_hours_delta: 30.00, module_avg_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_b}/progress"
              payload: { modules_passed_delta: 7, seat_hours_delta: 30.00, module_avg_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_a}/submit-for-award"
              payload: { final_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_b}/submit-for-award"
              payload: { final_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
          trigger:
            - call: "POST /course-enrollments/${enr_a}/award-credit"
              payload: { expected_graduation_plan_version: "${plan_a_v}" }
              as: Registrar
              as_user_id: "reg-01"
              captures: { award_a: $.data.id }
            - call: "POST /course-enrollments/${enr_b}/award-credit"
              payload: { expected_graduation_plan_version: "${plan_b_v}" }
              as: Registrar
              as_user_id: "reg-01"
              captures: { award_b: $.data.id }
          assert:
            - "CourseEnrollment.${enr_a}.mastery_pct == 84.00 and CourseEnrollment.${enr_b}.mastery_pct == 84.00 (identical inputs)"
            - "CreditAward.${award_a}.award_basis == SEAT_TIME and CreditAward.${award_a}.credits_awarded == 0.50"
            - "CreditAward.${award_b}.award_basis == COMPETENCY and CreditAward.${award_b}.credits_awarded == 1.00"
            - "CreditAward.${award_b}.credits_awarded - CreditAward.${award_a}.credits_awarded == 0.50"
            - "CreditAward.${award_a}.transcript_grade_code == B and CreditAward.${award_b}.transcript_grade_code == B"
            - "CreditAward.${award_a}.grade_replacement_mode == NONE and CreditAward.${award_b}.grade_replacement_mode == NONE"
            - "GraduationPlan.${plan_a}.credits_earned == 0.50 and GraduationPlan.${plan_b}.credits_earned == 1.00"
            - "Student.${stu_a}.credits_earned_total == 0.50 and Student.${stu_b}.credits_earned_total == 1.00"
            - "Student.${stu_a}.gpa == 3.00 and Student.${stu_b}.gpa == 3.00"

      - name: gpa_replace_vs_average_policy_divergence
        grounds:
          - calculations.transcript_gpa
          - calculations.transcript_gpa.variants.replace_on_recovery
          - calculations.transcript_gpa.variants.average_on_recovery
          - entities.GraduationPlan.fields.grade_replacement_policy
          - entities.PriorCourseRecord.fields.replacement_status
          - entities.CreditAward.fields.grade_replacement_mode
        distinguishing_aspect: |
          Two students carry the identical failed history (ALG1 at 42.00 percent, 1.00 credit
          attempted) and the identical recovery award (1.00 credit, final_percent 84.00 = B); the
          REPLACE_ON_RECOVERY plan drops the F row from the GPA input set and reports gpa 3.00,
          while the AVERAGE_ON_RECOVERY plan keeps it and reports gpa 1.50 on the same credits.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one PACKET course ALG1: credit_value 1.00, total_modules 8, required_seat_hours 60.00, pacing_days 40, proctoring_required false, min_passing_percent 60.00"
            - "student A (plan grade_replacement_policy REPLACE_ON_RECOVERY) and student B (plan AVERAGE_ON_RECOVERY), each with a FAILED PriorCourseRecord for ALG1 at original_percent 42.00 and credits_attempted 1.00"
            - "each student on a COMPETENCY placement with one CREDIT_RECOVERY enrollment in ALG1 at modules_passed 8, module_avg_percent 84.00, submitted at final_percent 84.00"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-2001", full_name: "Cara Diaz", cohort_year: 2026, grade_level: 9 }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-2002", full_name: "Dev Nair", cohort_year: 2026, grade_level: 9 }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /prior-course-records"
              payload: { student_id: "${stu_a}", course_id: "${crs_id}", term_code: "2025-S1", original_percent: 42.00, credits_attempted: 1.00, outcome: "FAILED" }
              as: Registrar
              captures: { pcr_a: $.data.id }
            - call: "POST /prior-course-records"
              payload: { student_id: "${stu_b}", course_id: "${crs_id}", term_code: "2025-S1", original_percent: 42.00, credits_attempted: 1.00, outcome: "FAILED" }
              as: Registrar
              captures: { pcr_b: $.data.id }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_a}", required_credits_total: 24.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2029-S2" }
              as: Registrar
              captures: { plan_a: $.data.id }
            - call: "POST /graduation-plans/${plan_a}/activate"
              payload: {}
              as: Registrar
              captures: { plan_a_v: $.data.version }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_b}", required_credits_total: 24.00, grade_replacement_policy: "AVERAGE_ON_RECOVERY", projected_completion_term: "2029-S2" }
              as: Registrar
              captures: { plan_b: $.data.id }
            - call: "POST /graduation-plans/${plan_b}/activate"
              payload: {}
              as: Registrar
              captures: { plan_b_v: $.data.version }
            - call: "POST /referrals"
              payload: { student_id: "${stu_a}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals/${ref_a}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_a}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_a}/accept-offer"
              payload: { credit_policy: "COMPETENCY", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_a: $.data.id, pl_a_v: $.data.version }
            - call: "GET /centers/${ctr_id}"
              payload: {}
              as: DistrictAdmin
              captures: { ctr_v2: $.data.version }
            - call: "POST /referrals"
              payload: { student_id: "${stu_b}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_b: $.data.id }
            - call: "POST /referrals/${ref_b}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_b}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v2}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_b}/accept-offer"
              payload: { credit_policy: "COMPETENCY", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_b: $.data.id, pl_b_v: $.data.version }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_a}", course_id: "${crs_id}", enrollment_type: "CREDIT_RECOVERY", prior_course_record_id: "${pcr_a}", expected_placement_version: "${pl_a_v}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_a: $.data.id }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_b}", course_id: "${crs_id}", enrollment_type: "CREDIT_RECOVERY", prior_course_record_id: "${pcr_b}", expected_placement_version: "${pl_b_v}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_b: $.data.id }
            - call: "POST /course-enrollments/${enr_a}/progress"
              payload: { modules_passed_delta: 8, seat_hours_delta: 55.00, module_avg_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_b}/progress"
              payload: { modules_passed_delta: 8, seat_hours_delta: 55.00, module_avg_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_a}/submit-for-award"
              payload: { final_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_b}/submit-for-award"
              payload: { final_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
          trigger:
            - call: "POST /course-enrollments/${enr_a}/award-credit"
              payload: { expected_graduation_plan_version: "${plan_a_v}" }
              as: Registrar
              as_user_id: "reg-01"
              captures: { award_a: $.data.id }
            - call: "POST /course-enrollments/${enr_b}/award-credit"
              payload: { expected_graduation_plan_version: "${plan_b_v}" }
              as: Registrar
              as_user_id: "reg-01"
              captures: { award_b: $.data.id }
          assert:
            - "CreditAward.${award_a}.grade_replacement_mode == FULL_REPLACEMENT and CreditAward.${award_b}.grade_replacement_mode == AVERAGED"
            - "PriorCourseRecord.${pcr_a}.replacement_status == REPLACED and PriorCourseRecord.${pcr_b}.replacement_status == NOT_REPLACED"
            - "CreditAward.${award_a}.credits_awarded == 1.00 and CreditAward.${award_b}.credits_awarded == 1.00 (identical credit outcome)"
            - "Student.${stu_a}.credits_earned_total == 1.00 and Student.${stu_b}.credits_earned_total == 1.00"
            - "Student.${stu_a}.gpa == 3.00"
            - "Student.${stu_b}.gpa == 1.50"
            - "PriorCourseRecord.${pcr_a}.original_grade_code == F and PriorCourseRecord.${pcr_b}.original_grade_code == F"

  - rule_id: combinatorial_formula
    instances:
      - name: quarter_credit_floor_per_award_not_on_aggregate
        grounds:
          - calculations.credit_award_credits
          - calculations.credit_ledger_invariant
          - calculations.transcript_gpa
          - entities.CreditAward.fields.credits_awarded
          - entities.GraduationPlan.fields.credits_earned
        distinguishing_aspect: |
          Mode (b) — same operations, different grouping: the 0.25-credit floor is applied PER AWARD
          before summing, so two SEAT_TIME enrollments each at 22.50 of 60.00 required seat hours
          post 0.25 + 0.25 = 0.50 credits, whereas flooring the summed 0.75 fraction (the plausible
          wrong order) would post 0.75.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "two PACKET courses ALG1 and ENG1, each credit_value 1.00, total_modules 8, required_seat_hours 60.00, pacing_days 40, proctoring_required false, min_passing_percent 60.00"
            - "one student (grade_level 9) on a SEAT_TIME placement with an ACTIVE plan of required_credits_total 24.00"
            - "two NEW_CREDIT enrollments, each with seat_hours_logged 22.50 (0.375 of a credit before flooring) and final_percent 78.00"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_alg: $.data.id }
            - call: "POST /courses"
              payload: { code: "ENG1", title: "English I", subject_area: "ELA", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_eng: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-3001", full_name: "Eli Frank", cohort_year: 2026, grade_level: 9 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_id}", required_credits_total: 24.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2029-S2" }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /graduation-plans/${plan_id}/activate"
              payload: {}
              as: Registrar
              captures: { plan_v1: $.data.version }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/accept-offer"
              payload: { credit_policy: "SEAT_TIME", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_id: $.data.id, pl_v1: $.data.version }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_id}", course_id: "${crs_alg}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_v1}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_1: $.data.id }
            - call: "GET /placements/${pl_id}"
              payload: {}
              as: AltEdTeacher
              captures: { pl_v2: $.data.version }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_id}", course_id: "${crs_eng}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_v2}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_2: $.data.id }
            - call: "POST /course-enrollments/${enr_1}/progress"
              payload: { modules_passed_delta: 3, seat_hours_delta: 22.50, module_avg_percent: 78.00 }
