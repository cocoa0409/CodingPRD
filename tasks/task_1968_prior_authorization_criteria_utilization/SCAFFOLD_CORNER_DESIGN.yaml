            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "A-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "PORTAL", documentation_complete: true }, as: IntakeSpecialist, captures: { a2: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "H-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { h1: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${h1}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
