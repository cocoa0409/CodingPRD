# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2936: Pooled Employer Plan Administration
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. All numeric asserts were
# computed by executing the §1.3 formulas (.scratch/step2/calc4.py).
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: lost_earnings_vfcp_recovery_date_segments_by_quarter
        grounds:
          - calculations.lost_earnings
          - calculations.excise_tax_5330
          - entities.RemittanceDeposit.fields.correction_method
          - entities.RemittanceDeposit.fields.lost_earnings_cents
          - entities.RemittanceDeposit.fields.restoration_cents
          - state_machines.RemittanceDeposit.LATE_to_CORRECTION_COMPUTED
        distinguishing_aspect: |
          The VFCP_RECOVERY_DATE variant runs the interest period from the day after
          deposit_due_date through recovery_date and splits it at the calendar-quarter
          boundary, rounding each segment independently (2026Q2: 5 days at 8.0% = 9315;
          2026Q3: 62 days at 9.0% = 129945), so lost_earnings_cents is 139260 — not the
          52397 the IRS_6621_UNDERPAYMENT variant produces from the identical deposit.
        test_recipe:
          setup:
            - "Provider Meridian REGISTERED, plan document 001 ACTIVE with acknowledged 3(16) and 403(a) allocations."
            - "Adopting employer Sable ACTIVE (13 participants, is_small_plan true) with an APPROVED SAFE_HARBOR_BASIC election."
            - "One VALIDATED payroll batch, withholding_date 2026-06-15, deposit_due_date 2026-06-25, batch_total_cents 8500000."
            - "That batch's remittance POSTED on 2026-07-20, therefore timeliness_status LATE."
            - "Logical clock advanced to 2026-09-01 so a recovery_date of 2026-08-31 is in the past."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: RegulatorOps
              captures: { ppp_id: $.data.id }
            - call: "POST /pep/plan-providers/${ppp_id}/register"
              payload: { registration_effective_date: "2026-01-02" }
              as: RegulatorOps
            - call: "POST /pep/plan-documents"
              payload: { pooled_plan_provider_id: "${ppp_id}", plan_name: "Meridian PEP", plan_number: "001", plan_year_end_date: "2026-12-31", base_eligibility_min_age: 21, base_eligibility_service_months: 12, base_vesting_schedule: "CLIFF_3YR", base_match_formula_code: "SAFE_HARBOR_BASIC" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Northgate Recordkeeping Inc", provider_type: "RECORDKEEPER", revenue_sharing_bps: 25, direct_fee_cents_per_participant: 40000 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { rk_id: $.data.id }
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Harborline Trust Company", provider_type: "TRUSTEE", revenue_sharing_bps: 0, direct_fee_cents_per_participant: 20000 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { tr_id: $.data.id }
            - call: "GET /pep/plan-documents/${plan_id}"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_v1: $.data.version }
            - call: "POST /pep/fiduciary-role-allocations"
              payload: { plan_document_id: "${plan_id}", service_provider_id: "${rk_id}", fiduciary_role: "NAMED_FIDUCIARY_3_16", effective_from: "2026-01-01", effective_to: "2026-12-31", expected_plan_document_version: "${plan_v1}" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { alloc_nf_id: $.data.id }
            - call: "POST /pep/fiduciary-role-allocations/${alloc_nf_id}/acknowledge"
              payload: { acknowledgment_statement: "Northgate accepts the ERISA 3(16) named fiduciary function." }
              as: ServiceProvider
              as_user_id: "${rk_id}"
            - call: "GET /pep/plan-documents/${plan_id}"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_v2: $.data.version }
            - call: "POST /pep/fiduciary-role-allocations"
              payload: { plan_document_id: "${plan_id}", service_provider_id: "${tr_id}", fiduciary_role: "TRUSTEE_403A", effective_from: "2026-01-01", effective_to: "2026-12-31", expected_plan_document_version: "${plan_v2}" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { alloc_tr_id: $.data.id }
            - call: "POST /pep/fiduciary-role-allocations/${alloc_tr_id}/acknowledge"
              payload: { acknowledgment_statement: "Harborline accepts the ERISA 403(a) trustee function." }
              as: ServiceProvider
              as_user_id: "${tr_id}"
            - call: "POST /pep/plan-documents/${plan_id}/activate"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "POST /pep/adopting-employers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Sable Fabrication LLC", ein: "420000011", election_window_close_date: "2026-09-30", participant_count: 13, hce_count: 3, nhce_count: 10, benefiting_hce_count: 3, benefiting_nhce_count: 9, hce_avg_deferral_pct: 6.00, nhce_avg_deferral_pct: 4.00 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { emp_id: $.data.id, emp_v1: $.data.version }
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_id}", eligibility_min_age: 21, eligibility_service_months: 12, vesting_schedule: "CLIFF_3YR", match_formula_code: "SAFE_HARBOR_BASIC", expected_adopting_employer_version: "${emp_v1}" }
              as: AdoptingEmployer
              as_user_id: "${emp_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /pep/plan-design-elections/${elec_id}/submit"
              payload: { signatory_name: "R. Okonkwo" }
              as: AdoptingEmployer
              as_user_id: "${emp_id}"
            - call: "POST /pep/plan-design-elections/${elec_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-17T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/payroll-batches"
              payload: { adopting_employer_id: "${emp_id}", pay_period_start: "2026-06-01", pay_period_end: "2026-06-16", pay_date: "2026-06-15", withholding_date: "2026-06-15", payroll_provider_reference: "PR-2026-12", total_eligible_compensation_cents: 100000000, total_deferral_cents: 4500000, total_match_cents: 3750000, total_loan_repayment_cents: 250000, participant_line_count: 13 }
              as: AdoptingEmployer
              as_user_id: "${emp_id}"
              captures: { batch_id: $.data.id, due_date: $.data.deposit_due_date }
            - call: "POST /pep/payroll-batches/${batch_id}/validate"
              payload: { reconciliation_note: "Match reconciled to the safe-harbour basic formula." }
              as: ServiceProvider
              as_user_id: "${rk_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-21T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/remittance-deposits"
              payload: { payroll_batch_id: "${batch_id}", deposit_date: "2026-07-20", amount_cents: 8500000, deposit_reference: "WIRE-8845" }
              as: AdoptingEmployer
              as_user_id: "${emp_id}"
              captures: { dep_id: $.data.id }
            - call: "POST /pep/remittance-deposits/${dep_id}/post"
              payload: { posting_reference: "TRUST-POST-8845" }
              as: ServiceProvider
              as_user_id: "${rk_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: RegulatorOps
          trigger:
            - call: "POST /pep/remittance-deposits/${dep_id}/compute-correction"
              payload: { correction_method: "VFCP_RECOVERY_DATE", recovery_date: "2026-08-31", actual_investment_return_cents: 0 }
              as: ServiceProvider
              as_user_id: "${rk_id}"
          assert:
            - "PayrollBatch.${batch_id}.deposit_rule == SMALL_PLAN_7_BUSINESS_DAY"
            - "PayrollBatch.${batch_id}.deposit_due_date == 2026-06-25"
            - "RemittanceDeposit.${dep_id}.timeliness_status == CORRECTION_COMPUTED"
            - "RemittanceDeposit.${dep_id}.deposit_status == POSTED"
            - "RemittanceDeposit.${dep_id}.business_days_elapsed == 23"
            - "RemittanceDeposit.${dep_id}.late_by_business_days == 16"
            - "RemittanceDeposit.${dep_id}.lost_earnings_cents == 139260"
            - "RemittanceDeposit.${dep_id}.restoration_cents == 139260"
            - "RemittanceDeposit.${dep_id}.excise_tax_cents == 20889"
            - "RemittanceDeposit.${dep_id}.recovery_date == 2026-08-31"

