- method: GET
  path: /mfg/lines/{id}/day-availability
  description: Computed per-day occupancy (line_day_availability) for a UTC calendar day
  roles:
  - PlantAdmin
  - ProductionPlanner
  code: 200
  input:
  - date
  output:
    date: string
    occupied_minutes: integer
    buffered_minutes: integer
    free_minutes: integer
  side_effects: []
- method: GET
  path: /mfg/slots/{id}
  description: Read one line slot
  roles:
  - PlantAdmin
  - ProductionPlanner
  - QualityManager
  code: 200
  input: []
  output: LineSlot
  side_effects: []
- method: POST
  path: /mfg/production-runs
  description: Create a production run (PLANNED) against an APPROVED revision and ACTIVE agreement; reserves ingredients FIFO
    from RELEASED lots; OCC on the agreement
  roles:
  - ProductionPlanner
  code: 201
  input:
  - revision_id
  - agreement_id
  - line_id
  - planned_cases
  - expected_agreement_version
  output: ProductionRun
  side_effects:
  - validates gluten-free segregation (ERR_ALLERGEN_SEGREGATION_VIOLATION), revision APPROVED, agreement ACTIVE, customer
    ACTIVE, MOQ, OCC expected_agreement_version
  - computes provisional_sweetener_required_kg (PROVISIONAL variant) and reserved_lot_allocations (FIFO received_at ASC, created_at
    ASC over RELEASED lots); sets ingredient_readiness
  - increments ManufacturingAgreement.version by 1
- method: GET
  path: /mfg/production-runs
  description: List/filter production runs; BrandCustomerRep must scope via own customer (agreement's customer)
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  - BrandCustomerRep
  code: 200
  input:
  - revision_id?
  - agreement_id?
  - line_id?
  - status?
  - limit?
  - offset?
  output: ProductionRun[]
  side_effects: []
- method: GET
  path: /mfg/production-runs/{id}
  description: Read one run
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  - BrandCustomerRep
  code: 200
  input: []
  output: ProductionRun
  side_effects: []
- method: POST
  path: /mfg/production-runs/{id}/schedule
  description: 'Schedule the run: creates LineSlot + ChangeoverEvent; OCC on the line'
  roles:
  - ProductionPlanner
  code: 200
  input:
  - start_utc
  - end_utc
  - expected_line_version
  output: ProductionRun
  side_effects:
  - PLANNED -> SCHEDULED
  - creates LineSlot(CONFIRMED) with buffer_minutes
  - creates ChangeoverEvent (NONE auto-VALIDATED else PENDING)
  - increments ProductionLine.version and run.version by 1
- method: POST
  path: /mfg/production-runs/{id}/verify-pre-run
  description: SCHEDULED -> PRE_RUN_VERIFIED; composite substantiation + sweetener top-up
  roles:
  - QualityManager
  code: 200
  input: []
  output: ProductionRun
  side_effects:
  - computes revision.composite_protein_g_per_serving (COMPOSITE variant)
  - computes final_sweetener_required_kg and tops up sweetener reservations
  - increments run.version
- method: POST
  path: /mfg/production-runs/{id}/start
  description: PRE_RUN_VERIFIED -> IN_PRODUCTION; consumes reservations; sets line allergen profile
  roles:
  - ProductionPlanner
  code: 200
  input: []
  output: ProductionRun
  side_effects:
  - reserved -> consumed on allocated lots; lot may auto-DEPLETE
  - line.current_allergen_profile <- revision.allergen_profile
  - increments run.version and line.version
- method: POST
  path: /mfg/production-runs/{id}/complete
  description: IN_PRODUCTION -> COMPLETED; creates LotRelease; release_status -> PENDING_QC
  roles:
  - ProductionPlanner
  code: 200
  input:
  - produced_cases
  - scrapped_cases
  output: ProductionRun
  side_effects:
  - creates LotRelease with expected_cases and yield_variance_pct
  - slot CONFIRMED -> COMPLETED
  - completed_utc <- logical clock
  - release_status NOT_READY -> PENDING_QC
  - increments run.version
- method: POST
  path: /mfg/production-runs/{id}/cancel
  description: PLANNED|SCHEDULED -> CANCELLED; releases reservations/slot/changeover
  roles:
  - ProductionPlanner
  code: 200
  input: []
  output: ProductionRun
  side_effects:
  - releases reservations
  - slot CONFIRMED -> RELEASED when scheduled
  - changeover -> CANCELLED when scheduled
  - cancel_reason <- OPERATOR_CANCEL
  - increments run.version
- method: GET
  path: /mfg/production-runs/{id}/slots
  description: List the run's slot (0..1)
  roles:
  - PlantAdmin
  - ProductionPlanner
  - QualityManager
  code: 200
  input: []
  output: LineSlot[]
  side_effects: []
- method: GET
  path: /mfg/production-runs/{id}/changeovers
  description: List changeover events where the run is from_run or to_run
  roles:
  - PlantAdmin
  - ProductionPlanner
  - QualityManager
  - LabTechnician
  code: 200
  input: []
  output: ChangeoverEvent[]
  side_effects: []
- method: GET
  path: /mfg/production-runs/{id}/retain-samples
  description: List retain samples of the run
  roles:
  - PlantAdmin
  - QualityManager
  - LabTechnician
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: RetainSample[]
  side_effects: []
- method: GET
  path: /mfg/production-runs/{id}/lot-release
  description: Read the run's lot release (0..1 array)
  roles:
  - PlantAdmin
  - QualityManager
  - LabTechnician
  code: 200
  input: []
  output: LotRelease[]
  side_effects: []
- method: POST
  path: /mfg/production-runs/{id}/retain-samples
  description: Register a retain sample for a COMPLETED run
  roles:
  - QualityManager
  code: 201
  input:
  - bin_id
  - cases_count
  - retain_until_utc
  output: RetainSample
  side_effects:
  - validates retain period >= completed_utc + 30 days
  - LotRelease.retain_cases_stored recomputed
- method: GET
  path: /mfg/changeovers/{id}
  description: Read one changeover event
  roles:
  - PlantAdmin
  - ProductionPlanner
  - QualityManager
  - LabTechnician
  code: 200
  input: []
  output: ChangeoverEvent
  side_effects: []
- method: POST
  path: /mfg/changeovers/{id}/log-cleaning
  description: PENDING|FAILED -> CLEANING_LOGGED (re-clean loop)
  roles:
  - ProductionPlanner
  code: 200
  input: []
  output: ChangeoverEvent
  side_effects:
  - clears swab fields on re-clean
  - increments event.version
- method: POST
  path: /mfg/changeovers/{id}/record-swab
  description: CLEANING_LOGGED -> SWAB_RECORDED (SWAB_VALIDATE only)
  roles:
  - LabTechnician
  code: 200
  input:
  - swab_allergen_ppm
  output: ChangeoverEvent
  side_effects:
  - swab_recorded_by <- X-User-ID
  - increments event.version
- method: POST
  path: /mfg/changeovers/{id}/validate
  description: CLEANING_LOGGED|SWAB_RECORDED -> VALIDATED; swab limit + SoD guards
  roles:
  - QualityManager
  code: 200
  input: []
  output: ChangeoverEvent
  side_effects:
  - validated_by <- X-User-ID
  - line.last_wet_clean_utc <- clock when WET_CLEAN or SWAB_VALIDATE
  - increments event.version and line.version
- method: POST
  path: /mfg/changeovers/{id}/fail
  description: SWAB_RECORDED -> FAILED
  roles:
  - QualityManager
  code: 200
  input: []
  output: ChangeoverEvent
  side_effects:
  - increments event.version
- method: POST
  path: /mfg/shelf-life-studies
  description: Open a shelf-life study for an APPROVED revision; closed-interval chamber-position capacity
  roles:
  - LabTechnician
  code: 201
  input:
  - revision_id
  - chamber_id
  - shelf_position
  - start_utc
  - expiry_utc
  - hardness_limit_n
  - pull_interval_days?
  output: ShelfLifeStudy
  side_effects:
  - validates ERR_CHAMBER_POSITION_OCCUPIED (closed intervals)
- method: GET
  path: /mfg/shelf-life-studies/{id}
  description: Read one study incl. computed projection
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - LabTechnician
  code: 200
  input: []
  output: ShelfLifeStudy
  side_effects: []
- method: POST
  path: /mfg/shelf-life-studies/{id}/terminate
  description: ACTIVE -> TERMINATED
  roles:
  - LabTechnician
  code: 200
  input: []
  output: ShelfLifeStudy
  side_effects:
  - increments study.version
- method: POST
  path: /mfg/shelf-life-studies/{id}/pulls
  description: Record a texture pull; recomputes hardness projection; may auto-FAIL the study
  roles:
  - LabTechnician
  code: 201
  input:
  - hardness_n
  - recorded_utc
  output: ShelfLifePull
  side_effects:
  - pull_index and due_utc assigned
  - validates pull window (ERR_PULL_WINDOW_MISSED)
  - recomputes study.projected_hardness_at_expiry_n
  - study auto-FAILED when projected > limit (strict)
- method: GET
  path: /mfg/shelf-life-studies/{id}/pulls
  description: List pulls of a study
  roles:
  - PlantAdmin
  - QualityManager
  - LabTechnician
  code: 200
  input:
  - limit?
  - offset?
  output: ShelfLifePull[]
  side_effects: []
- method: GET
  path: /mfg/shelf-life-studies/{id}/projection
  description: Computed read of the hardness projection (hardness_projection)
  roles:
  - PlantAdmin
  - QualityManager
  - LabTechnician
  code: 200
  input: []
  output:
    projected_hardness_at_expiry_n: number
    pulls_used: integer
    will_fail: boolean
  side_effects: []
- method: GET
  path: /mfg/lot-releases/{id}
  description: Read one lot release
  roles:
  - PlantAdmin
  - QualityManager
  - LabTechnician
  code: 200
  input: []
  output: LotRelease
  side_effects: []
- method: POST
  path: /mfg/lot-releases/{id}/record-qc
  description: Record QC disposition (PENDING -> PASSED/FAILED)
  roles:
  - LabTechnician
  code: 200
  input:
  - qc_disposition
  output: LotRelease
  side_effects:
  - qc_recorded_by <- X-User-ID
  - increments release.version
- method: POST
  path: /mfg/lot-releases/{id}/decide
  description: 'Decide the lot: RELEASED | HOLD_REWORK | SCRAPPED; SoD + QC + yield + retain gates; drives run.release_status
    and agreement rollup'
  roles:
  - QualityManager
  code: 200
  input:
  - decision
  output: LotRelease
  side_effects:
  - run.release_status updated
  - agreement quarter rollup recomputed on RELEASED
  - decided_by <- X-User-ID
  - increments release.version, run.version, agreement.version
- method: POST
