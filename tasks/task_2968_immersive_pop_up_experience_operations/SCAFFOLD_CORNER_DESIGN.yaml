            - "trigger 4 responds 201: LOW_STIM_HOURS carries no room or roster precondition"
            - "trigger 7 responds 200 with status == CLEARED for the ambassador"
            - "trigger 8 responds 201: the identical ASL request now passes because the roster gate reads the live staff list, and it must require BOTH status CLEARED and staff_role AMBASSADOR"
