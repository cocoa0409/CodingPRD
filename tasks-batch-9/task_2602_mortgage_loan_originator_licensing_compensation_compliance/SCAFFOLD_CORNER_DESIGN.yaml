      - name: clock_and_sweep_are_platform_admin_exclusive_and_admin_holds_no_business_writes
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.LicensingAnalyst.exclusive_operations
          - roles.CompensationDesigner.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          The exclusivity is symmetric, which is the part an implementation usually gets half
          right: no other role may move the clock or run the sweep, AND PlatformAdmin may not
          licence an originator or approve a plan. The role check precedes every business check,
          so PlatformAdmin approving a DRAFT plan with no variables is 403 ERR_ROLE_NOT_PERMITTED
          rather than 422 ERR_PLAN_WEIGHTS_NOT_100, and a rejected clock call leaves the clock
          exactly where it was.
        test_recipe:
          setup:
            - "One Originator 2200001 and one DRAFT CompensationPlan with no variables yet, at
               clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
