# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 companion to SCAFFOLD.yaml
# Domain: hotel-night-audit-revenue-verification   api_prefix: /night-audit
# Every §0.5 Difficulty Rule below carries >= 2 differentiated instances.
# All asserted money/percentage literals were precomputed with Decimal + ROUND_HALF_UP to 2 dp.
#
# Shared fixture vocabulary used by the recipes below ("the standard property"):
#   room_count_total 100, standard_room_rate_amount 200.00, occupancy_tax_rate_pct 8.875,
#   fb_tax_rate_pct 6.25, service_charge_pct 18.0, large_ticket_threshold_amount 472.00,
#   large_party_discount_pct 5.0, allowance_manager_threshold_amount 250.00,
#   allowance_controller_threshold_amount 1000.00, rate_variance_tolerance_pct 95.0,
#   settlement_variance_tolerance_amount 5.00, city_ledger_fee_pct 1.5,
#   late_checkout_grace_minutes 30, card_authorization_valid_days 7,
#   no_show_charge_policy FIRST_NIGHT_PLUS_TAX
#   (rate_variance_tolerance_pct is widened to 95.0 so that off-rate fixtures do not
#    trip priority-70 ERR_RATE_VARIANCE_UNAUTHORIZED; instances that exercise rate
#    variance itself narrow it back to 5.0 explicitly.)
# Logical clock: every recipe pins it first; the system default is 2026-08-01T00:00:00Z.
# Segregation of duties: X-User-ID values are always distinct between requester and approver.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: occupancy_tax_provisional_vs_final_true_up_on_seal
        grounds: "§1.3 calculation occupancy_tax (variants PROVISIONAL / FINAL) plus occupancy_tax_final_true_up; §1.1 Folio.balance_amount; §1.1 BusinessDate.tax_revenue_amount; §1.2 BusinessDate ROOM_POSTING -> CHARGES_SEALED."
        distinguishing_aspect: >-
          Folio-level money domain. The two variants diverge because PROVISIONAL taxes the gross
          room charge line-by-line while FINAL taxes the allowance-reduced net for the whole stay,
          so the divergence is created by a later ALLOWANCE line that did not exist when the
          PROVISIONAL line was written; the switch is reconciled by an explicit TAX_TRUE_UP
          journal line rather than by rewriting the original posting.
        test_recipe:
          setup: "Standard property; business date 2026-08-01 with 4 out-of-order rooms; one CASH transient folio at contracted rate 189.99 checked in; room and tax posted provisionally; a 50.00 SERVICE_RECOVERY allowance approved and posted; then the charges are sealed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4, benchmark_calendar_room_revenue_amount: 400.00, benchmark_weekday_room_revenue_amount: 520.00 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id", period_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-1001", guest_name: "Ada Vance", room_number: "101", nights_count: 1, contracted_rate_amount: 189.99, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_a_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_a_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_a_id}", business_date_id: "${bd1_id}", requested_amount: 50.00, reason_code: "SERVICE_RECOVERY", narrative: "Air conditioning failed on arrival night." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { alw_id: "$.data.id" }
            - call: "POST /night-audit/allowances/${alw_id}/submit"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/allowances/${alw_id}/approve"
              payload: { approved_amount: 50.00 }
              as: NightAuditor
              as_user_id: "u_na_2"
          trigger: "POST /night-audit/business-dates/${bd1_id}/seal-charges as NightAuditor (X-User-ID u_na_1)."
          assert:
            - "The PROVISIONAL line written by post-room-and-tax is unchanged: GET /night-audit/journal-postings?folio_id=${folio_a_id}&charge_type=OCCUPANCY_TAX still contains exactly one row with amount == 16.86 (round(189.99 * 0.08875, 2) = 16.86)."
            - "seal-charges wrote exactly one TAX_TRUE_UP row for the folio with amount == -4.44 — FINAL is round((189.99 - 50.00) * 0.08875, 2) = 12.42 and 12.42 - 16.86 = -4.44."
            - "GET /night-audit/folios/${folio_a_id} returns balance_amount == 152.41 (189.99 + 16.86 - 50.00 - 4.44) and allowance_credit_amount == -50.00."
            - "GET /night-audit/business-dates/${bd1_id} returns tax_revenue_amount == 12.42 (16.86 + (-4.44)), room_night_revenue_amount == 139.99, total_revenue_amount == 152.41 and status == CHARGES_SEALED."
            - "The naive single-variant implementation that taxes only the gross would leave tax_revenue_amount at 16.86 and folio balance at 156.85; both are wrong."

      - name: pace_index_calendar_aligned_vs_weekday_aligned_benchmark
        grounds: "§1.3 calculation pace_index (variants CALENDAR_ALIGNED / WEEKDAY_ALIGNED); §1.1 RevenueReport.pace_index_pct and .benchmark_room_revenue_amount; §1.2 RevenueReport DRAFT lifecycle and SUPERSEDED."
        distinguishing_aspect: >-
          Reporting domain on a different entity (RevenueReport, not Folio) and a different
          divergence mechanism: the two variants read the *same* room revenue numerator and
          differ only in which benchmark denominator they select off the BusinessDate, so the
          delta is caused by variant selection rather than by a data change between the two
          evaluations. Creating the second report also supersedes the first.
        test_recipe:
          setup: "Standard property; business date 2026-08-01 carrying benchmark_calendar_room_revenue_amount 400.00 and benchmark_weekday_room_revenue_amount 160.00; one folio at rate 200.00 in house; room and tax posted, charges sealed, settlements verified so the date sits in SETTLEMENT_REVIEW; room_revenue_amount is 200.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4, benchmark_calendar_room_revenue_amount: 400.00, benchmark_weekday_room_revenue_amount: 160.00 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-2001", guest_name: "Bo Reyes", room_number: "201", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_b_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_b_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "GET /night-audit/business-dates/${bd1_id}"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_v1: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", pace_basis: "CALENDAR_ALIGNED", recipient_role_list: ["RevenueManager", "Controller"], expected_business_date_version: "${bd1_v1}" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { rpt_cal_id: "$.data.id" }
            - call: "GET /night-audit/business-dates/${bd1_id}"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_v2: "$.data.version" }
          trigger: "POST /night-audit/revenue-reports with pace_basis WEEKDAY_ALIGNED and expected_business_date_version ${bd1_v2}, as RevenueManager (X-User-ID u_rm_1)."
          assert:
            - "GET /night-audit/revenue-reports/${rpt_cal_id} returns benchmark_room_revenue_amount == 400.00 and pace_index_pct == 50.00 (round(200.00 * 100 / 400.00, 2))."
            - "The report created by the trigger returns benchmark_room_revenue_amount == 160.00 and pace_index_pct == 125.00 (round(200.00 * 100 / 160.00, 2))."
            - "Both reports carry the identical numerator room_revenue_amount == 200.00, so the 75.00 percentage-point delta comes only from variant selection."
            - "GET /night-audit/revenue-reports/${rpt_cal_id} now returns status == SUPERSEDED while the new report is DRAFT."
            - "An implementation that hard-codes one benchmark column returns the same pace_index_pct for both reports and fails."

  - rule_id: combinatorial_formula
    instances:

      - name: late_checkout_charge_nested_floor_and_rate_ceiling_clamp
        grounds: "§1.3 calculation late_checkout_charge (algorithm tiered_pricing, constants TIER_1_MINUTES 180, TIER_2_MINUTES 360, LATE_CHECKOUT_FLOOR_AMOUNT 25.00); §1.5 POST /night-audit/folios/{id}/check-out; §1.1 Folio.balance_amount."
        distinguishing_aspect: >-
          Mode (a) - nested min/max where evaluation order is observable. round(rate * pct, 2) is
          clamped by max(..., 25.00) and then by min(..., rate), so on a 20.00 rate the ceiling
          deliberately overrides the floor and the answer is 20.00, not 25.00. Applying the floor
          last returns 25.00 and is wrong.
        test_recipe:
          setup: "Standard property (late_checkout_grace_minutes 30); business date 2026-08-01; the logical clock parked at 2026-08-01T17:01:00.000Z; three in-house CASH folios whose scheduled_checkout_at values put them 361, 361 and 60 minutes overdue at contracted rates 250.00, 20.00 and 80.00. No room-and-tax run happens, so each folio's only line is its late-checkout charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-3001", guest_name: "Cy Nolan", room_number: "301", nights_count: 1, contracted_rate_amount: 250.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-01T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_hi_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-3002", guest_name: "Di Okafor", room_number: "302", nights_count: 1, contracted_rate_amount: 20.00, rate_plan_code: "STAFF", market_segment: "CORPORATE", settlement_method: "CASH", scheduled_checkout_at: "2026-08-01T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_lo_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-3003", guest_name: "Eli Pratt", room_number: "303", nights_count: 1, contracted_rate_amount: 80.00, rate_plan_code: "STAFF", market_segment: "CORPORATE", settlement_method: "CASH", scheduled_checkout_at: "2026-08-01T16:01:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_mid_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_hi_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${folio_lo_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${folio_mid_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T17:01:00.000Z" }
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/folios/${folio_hi_id}/check-out"
              payload: { business_date_id: "${bd1_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${folio_mid_id}/check-out"
              payload: { business_date_id: "${bd1_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/folios/${folio_lo_id}/check-out with business_date_id ${bd1_id} as FrontDeskAgent (X-User-ID u_fd_1) - the 20.00-rate folio where the ceiling has to beat the floor."
          assert:
            - "The trigger response returns balance_amount == 20.00: overdue 361 > 180 and > 360 so pct is 1.00, tiered = round(20.00 * 1.00, 2) = 20.00, max(20.00, 25.00) = 25.00, min(25.00, 20.00) = 20.00."
            - "GET /night-audit/journal-postings?folio_id=${folio_lo_id}&charge_type=LATE_CHECKOUT returns exactly one row with amount == 20.00 and source_channel == FRONT_DESK."
            - "GET /night-audit/folios/${folio_hi_id} returns balance_amount == 250.00 - tiered 250.00, floor no-op, ceiling min(250.00, 250.00) == 250.00."
            - "GET /night-audit/folios/${folio_mid_id} returns balance_amount == 25.00 - overdue 60 <= 180 so pct is 0.25, tiered = 20.00, the 25.00 floor lifts it, and the 80.00 ceiling does not bite."
            - "GET /night-audit/business-dates/${bd1_id} returns other_room_revenue_amount == 295.00 (250.00 + 25.00 + 20.00) and total_revenue_amount == 295.00."
            - "Clamping in the other order (min by rate first, then max by the floor) would report 25.00 for ${folio_lo_id} and total 300.00, and fails."

      - name: city_ledger_fee_rounded_per_folio_then_summed
        grounds: "§1.3 calculation city_ledger_sweep (algorithm chronological, precision 'applied once per folio BEFORE summation'); §1.1 BusinessDate.city_ledger_fee_total_amount, .city_ledger_transferred_balance_total_amount, .city_ledger_swept_folio_count; §1.1 LedgerAccount.current_balance_amount."
        distinguishing_aspect: >-
          Mode (b) - the same three balances produce two different fee totals depending on whether
          the 1.5% fee is rounded per folio and then summed (5.85) or summed and then rounded once
          (5.84). Unlike the late-checkout instance there is no clamp at all; the difficulty is
          purely the placement of the single rounding step inside a chronological loop, and the
          per-folio journal pair must still net BusinessDate.ledger_control_amount to 0.00.
        test_recipe:
          setup: "Standard property; a CITY_LEDGER ledger account opened with opening_balance_amount 0.00; business date 2026-08-01; three DIRECT_BILL folios created in the order 210.00, 77.77, 101.67, each carrying exactly one MISC_CHARGE of that amount, each checked in and then checked out before the grace window expires so no late-checkout charge is raised; post-room-and-tax then runs and touches nothing because all three folios are already DEPARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/ledger-accounts"
              payload: { property_id: "${prop_id}", ledger_type: "CITY_LEDGER", account_code: "CL-001", gl_account_code: "1230", opening_balance_amount: 0.00, credit_limit_amount: 100000.00 }
              as: Controller
              as_user_id: "u_ctl_1"
              captures: { city_gl_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-4001", guest_name: "Fay Quon", room_number: "401", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "CORP", market_segment: "CORPORATE", settlement_method: "DIRECT_BILL", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { db1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-4002", guest_name: "Gus Roy", room_number: "402", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "CORP", market_segment: "CORPORATE", settlement_method: "DIRECT_BILL", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { db2_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-4003", guest_name: "Hana Sim", room_number: "403", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "CORP", market_segment: "CORPORATE", settlement_method: "DIRECT_BILL", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { db3_id: "$.data.id" }
            - call: "POST /night-audit/folios/${db1_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${db2_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${db3_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "MISC_CHARGE", amount: 210.00, folio_id: "${db1_id}", memo: "Banquet deposit shortfall" }
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "MISC_CHARGE", amount: 77.77, folio_id: "${db2_id}", memo: "Minibar and laundry" }
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "MISC_CHARGE", amount: 101.67, folio_id: "${db3_id}", memo: "Parking and wifi" }
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/folios/${db1_id}/check-out"
