  - rule_id: cross_entity_state_dependency
    instances:

      - name: practice_block_creation_depends_on_player_contract_contract_status
        grounds:
          - validations[priority=8]
          - state_machines.PlayerContract.ACTIVE_to_SUSPENDED
          - state_machines.PracticeBlock.SCHEDULED_to_CANCELLED
          - entities.PlayerContract.fields.contract_status
        distinguishing_aspect: |
          Entity pair PracticeBlock -> PlayerContract. A booking is admissible only while the
          participant's contract is ACTIVE; the block carries no state of its own that would reveal
          this. The identical request succeeds before the suspension and is refused with
          ERR_CONTRACT_NOT_ACTIVE after it, and the suspension additionally cancels the block that
          was already scheduled — while a second player's ACTIVE contract in the same organization
          keeps booking normally, so the dependency is per contract, not per organization.
