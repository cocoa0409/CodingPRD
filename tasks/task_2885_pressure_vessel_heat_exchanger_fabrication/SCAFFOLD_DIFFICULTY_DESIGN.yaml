      - name: cross_entity_certificate_renewal_gated_on_satisfactory_closed_audit
        grounds:
          - validations[priority=88]
          - validations[priority=45]
          - state_machines.CertificateOfAuthorization.PROBATION_to_ACTIVE
          - state_machines.ShopAudit.SCHEDULED_to_CLOSED
          - calculations.certificate_posture
          - concurrency_rules.certificate-renewal-stale
        distinguishing_aspect: |
          A different entity pair (CertificateOfAuthorization depending on ShopAudit) whose gate is
          not a single state but a CONJUNCTION of a state and a derived boolean: the named audit must
          be CLOSED *and* satisfactory, and satisfactory is itself derived from the findings array
          with a minor-count threshold. The instance also proves that a satisfactory audit does not
          retroactively clear the counters accumulated by an earlier bad audit — only the renewal
          does — and that the OCC check at priority 45 outranks the audit gate at priority 88, so a
          replayed renewal fails on version rather than on the audit.
        test_recipe:
          setup:
            - "An ACTIVE certificate CA-U-8801 issued 2026-01-01 and expiring 2029-01-01."
            - "A first audit A1 (INTERNAL_QMS, scheduled 2026-08-01) already CLOSED on 2026-08-01 with exactly one MAJOR finding, which has driven the certificate to PROBATION with open_major_findings_count 1 and stamping_authorized false."
            - "A second audit A2 (INTERNAL_QMS, scheduled 2026-08-01) still SCHEDULED."
            - "A third audit A3 (TRIENNIAL_RENEWAL, scheduled 2026-08-01) still SCHEDULED."
            - "The logical clock is at its default 2026-08-01T00:00:00Z, so the certificate is nowhere near expiry."
          setup_api_calls:
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8801", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /shop-audits"
              payload: { certificate_id: "${cert_id}", audit_type: "INTERNAL_QMS", scheduled_date: "2026-08-01" }
              as: ShopAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /shop-audits/${a1_id}/close"
              payload: { closed_on: "2026-08-01", findings: [{ finding_code: "F-101", severity: "MAJOR", clause_reference: "UG-90(c)" }] }
              as: ShopAdmin
            - call: "POST /shop-audits"
              payload: { certificate_id: "${cert_id}", audit_type: "INTERNAL_QMS", scheduled_date: "2026-08-01" }
              as: ShopAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /shop-audits"
              payload: { certificate_id: "${cert_id}", audit_type: "TRIENNIAL_RENEWAL", scheduled_date: "2026-08-01" }
              as: ShopAdmin
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /certificates/${cert_id}"
              payload: {}
              as: ShopAdmin
              captures: { cv1: $.data.version }
            - call: "POST /certificates/${cert_id}/renewals"
              payload: { expected_certificate_version: "${cv1}", renewal_audit_id: "${a2_id}", new_expires_on: "2030-01-01" }
              as: ShopAdmin
              captures: { err_audit_open: $.data.error_id }
            - call: "POST /shop-audits/${a2_id}/close"
              payload: { closed_on: "2026-08-02", findings: [{ finding_code: "F-201", severity: "MINOR", clause_reference: "UG-4" }, { finding_code: "F-202", severity: "MINOR", clause_reference: "UG-4" }, { finding_code: "F-203", severity: "MINOR", clause_reference: "UG-11" }, { finding_code: "F-204", severity: "MINOR", clause_reference: "UG-11" }, { finding_code: "F-205", severity: "MINOR", clause_reference: "UG-16" }, { finding_code: "F-206", severity: "MINOR", clause_reference: "UG-16" }] }
              as: ShopAdmin
            - call: "GET /certificates/${cert_id}"
              payload: {}
              as: ShopAdmin
              captures: { cv2: $.data.version }
            - call: "POST /certificates/${cert_id}/renewals"
              payload: { expected_certificate_version: "${cv2}", renewal_audit_id: "${a2_id}", new_expires_on: "2030-01-01" }
              as: ShopAdmin
              captures: { err_audit_unsatisfactory: $.data.error_id }
            - call: "POST /shop-audits/${a3_id}/close"
              payload: { closed_on: "2026-08-03", findings: [{ finding_code: "F-301", severity: "OBSERVATION", clause_reference: "UG-22" }] }
              as: ShopAdmin
            - call: "GET /certificates/${cert_id}"
              payload: {}
              as: ShopAdmin
              captures: { cv3: $.data.version }
            - call: "POST /certificates/${cert_id}/renewals"
              payload: { expected_certificate_version: "${cv3}", renewal_audit_id: "${a3_id}", new_expires_on: "2030-01-01" }
              as: ShopAdmin
              captures: { renewal_count_after: $.data.renewal_count }
            - call: "POST /certificates/${cert_id}/renewals"
              payload: { expected_certificate_version: "${cv3}", renewal_audit_id: "${a3_id}", new_expires_on: "2031-01-01" }
              as: ShopAdmin
              captures: { err_replay: $.data.error_id }
          assert:
            - "Audit CLOSED requirement: ${err_audit_open} == ERR_RENEWAL_AUDIT_NOT_SATISFACTORY with HTTP 409 — A2 is still SCHEDULED, so it cannot support a renewal even though the OCC version is correct"
            - "Closing A2 with six MINOR findings gives ShopAudit.${a2_id}.major_finding_count == 0, minor_finding_count == 6 and satisfactory == false, because MINOR_PROBATION_THRESHOLD is 5 and satisfactory requires minor_finding_count <= 5"
            - "The certificate absorbs those minors: CertificateOfAuthorization.${cert_id}.open_minor_findings_count == 6, open_major_findings_count == 1, status is still PROBATION (majors below MAJOR_SUSPEND_THRESHOLD = 3) and stamping_authorized == false"
            - "Satisfactory requirement: ${err_audit_unsatisfactory} == ERR_RENEWAL_AUDIT_NOT_SATISFACTORY with HTTP 409 — A2 is now CLOSED but unsatisfactory, so state alone is not enough"
            - "Closing A3 with a single OBSERVATION gives major_finding_count == 0, minor_finding_count == 0 and satisfactory == true, yet the certificate is STILL PROBATION with open_major_findings_count == 1 — a clean audit does not clear counters accumulated by A1"
            - "The renewal citing A3 returns HTTP 200: status == ACTIVE, open_major_findings_count == 0, open_minor_findings_count == 0, ${renewal_count_after} == 1, expires_on == 2030-01-01 and stamping_authorized == true"
            - "Replay: ${err_replay} == ERR_STALE_CERTIFICATE_VERSION with HTTP 412, not ERR_RENEWAL_AUDIT_NOT_SATISFACTORY — priority 45 precedes priority 88, and A3 would still have been an acceptable audit"
            - "After the refused replay CertificateOfAuthorization.${cert_id}.expires_on is still 2030-01-01 and renewal_count is still 1"

  - rule_id: resource_temporal_overlap
    instances:
      - name: resource_temporal_furnace_cooldown_buffer_boundaries_both_directions
        grounds:
          - validations[priority=100]
          - entities.PWHTBatch.fields.furnace_code
          - entities.PWHTBatch.fields.scheduled_start
          - entities.PWHTBatch.fields.scheduled_end
          - endpoints.POST_/pwht-batches
        distinguishing_aspect: |
          The furnace resource uses a CLOSED interval inflated by a symmetric 180-minute cooldown
          buffer on both ends, so the forbidden zone is strictly wider than the booked window and
          adjacency is NOT enough — a charge must clear the previous one by a full three hours. The
          instance probes the buffer from both sides at one-minute resolution (a window ending
          exactly 180 minutes before an existing charge starts is admitted, 181 minutes' overlap is
          refused; a window starting exactly 180 minutes after an existing charge ends is admitted,
          179 is refused) and confirms the resource key is furnace_code, not the job.
