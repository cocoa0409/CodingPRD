scenario: |
  1108. Student Health Center Operations (campus student health center): appointment scheduling & same-day triage, immunization requirement enforcement & holds, insurance eligibility (student plan vs external) & billing, pharmacy & lab services, communicable disease reporting & campus outbreak response, sports-physical & travel-clinic services, after-hours coverage & hospital referral, health-fee funding model

domain_name: student-health-center
api_prefix: /shc

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; all FK links in body)
# All entities have common_fields: true → id (UUID, identity only, never used
# in any selector/ranking/tie-break), created_at, updated_at, version (int, 1-based,
# +1 on every mutation including cascaded side effects).
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "Campus student number; unique across all students" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: enrollment_status, type: enum, source: input, default: ENROLLED, description: "ENROLLED | LEAVE | WITHDRAWN", constraints: "enum {ENROLLED, LEAVE, WITHDRAWN}" }
      - { name: compliance_posture, type: enum, source: computed, default: CLEAR, description: "Derived per calculations.compliance_posture_derivation: CLEAR | PROVISIONAL_HOLD | REGISTRATION_HOLD", constraints: "enum {CLEAR, PROVISIONAL_HOLD, REGISTRATION_HOLD}" }
      - { name: active_hold_types, type: array, source: computed, default: [], description: "Subset of {IMMUNIZATION, FINANCIAL} currently contributing to a hold posture" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the covered student" }
      - { name: payer_type, type: enum, source: input, description: "STUDENT_PLAN | EXTERNAL", constraints: "enum {STUDENT_PLAN, EXTERNAL}" }
      - { name: policy_number, type: string, source: input, description: "Payer policy identifier" }
      - { name: coverage_start, type: datetime, source: input, description: "ISO8601 coverage start (inclusive)" }
      - { name: coverage_end, type: datetime, source: input, description: "ISO8601 coverage end (inclusive); must be > coverage_start" }
      - { name: copay_cents, type: integer, source: input, description: "Per-invoice copay, integer cents >= 0" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible, integer cents >= 0" }
      - { name: deductible_met_cents, type: integer, source: computed, default: 0, description: "Deductible accumulated across FINAL-issued invoices (see calculations.invoice_payer_split)" }
      - { name: coinsurance_pct, type: number, source: input, description: "Patient coinsurance share in [0, 1] applied after copay and deductible" }
      - { name: status, type: enum, source: system, description: "UNVERIFIED -> VERIFIED | SUPERSEDED | EXPIRED", constraints: "enum {UNVERIFIED, VERIFIED, SUPERSEDED, EXPIRED}" }
      - { name: verified_at, type: datetime, source: system, description: "Set on verify; null otherwise" }

  - name: ImmunizationRequirement
    parent: null
    common_fields: true
    fields:
      - { name: vaccine_code, type: string, source: input, description: "Unique vaccine code, e.g. MMR, MENINGITIS_ACWY" }
      - { name: required_doses, type: integer, source: input, description: "Doses required for compliance, 1..3", constraints: "1..3" }
      - { name: min_interval_days, type: integer, source: input, description: "Minimum days between consecutive doses (dose[n] >= dose[n-1] + min_interval_days)", constraints: ">= 0" }
      - { name: deadline_date, type: string, source: input, description: "Compliance deadline, ISO date YYYY-MM-DD; records not compliant after this date enter GRACE" }
      - { name: grace_period_days, type: integer, source: input, description: "Days after deadline_date before a non-compliant record becomes OVERDUE", constraints: ">= 0" }

  - name: ImmunizationRecord
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: requirement_id, type: string, source: input, description: "FK -> ImmunizationRequirement.id" }
      - { name: doses_received, type: integer, source: computed, default: 0, description: "Count of recorded doses" }
      - { name: dose_dates, type: array, source: computed, default: [], description: "ISO dates of recorded doses, chronological" }
      - { name: status, type: enum, source: system, description: "PENDING -> GRACE -> OVERDUE (clock sweep) ; PENDING|GRACE|OVERDUE -> IN_COMPLIANCE (doses complete) | EXEMPTED", constraints: "enum {PENDING, GRACE, OVERDUE, IN_COMPLIANCE, EXEMPTED}" }
      - { name: exemption_reason, type: string, source: system, description: "Set by exempt action; null otherwise" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: provider_type, type: enum, source: input, description: "CLINICIAN | NURSE", constraints: "enum {CLINICIAN, NURSE}" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the provider can take new appointments/shifts" }

  - name: OnCallShift
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: shift_start, type: datetime, source: input, description: "ISO8601 shift start (inclusive)" }
      - { name: shift_end, type: datetime, source: input, description: "ISO8601 shift end (inclusive); closed-interval semantics, must be > shift_start" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: visit_type, type: enum, source: input, description: "PRIMARY_URGENT | SAME_DAY_TRIAGE | FOLLOW_UP | SPORTS_PHYSICAL | TRAVEL_CLINIC", constraints: "enum {PRIMARY_URGENT, SAME_DAY_TRIAGE, FOLLOW_UP, SPORTS_PHYSICAL, TRAVEL_CLINIC}" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 start; half-open interval [start, end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 end; must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "BOOKED -> CHECKED_IN -> COMPLETED ; BOOKED -> CANCELLED | NO_SHOW", constraints: "enum {BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}" }
      - { name: cancel_reason, type: enum, source: system, default: NONE, description: "NONE | HOLD | CLIENT; HOLD when cancelled by the compliance sweep cascade", constraints: "enum {NONE, HOLD, CLIENT}" }

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; 1:1, set at check-in" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; copied from appointment" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from appointment" }
      - { name: visit_type, type: enum, source: system, description: "Copied from appointment.visit_type" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED", constraints: "enum {OPEN, CLOSED}" }
      - { name: clearance_outcome, type: enum, source: system, default: NONE, description: "NONE | CLEARED | NOT_CLEARED; only meaningful for SPORTS_PHYSICAL", constraints: "enum {NONE, CLEARED, NOT_CLEARED}" }
      - { name: fee_covered, type: boolean, source: computed, description: "True when visit_type in {PRIMARY_URGENT, SAME_DAY_TRIAGE, FOLLOW_UP} AND student enrollment_status == ENROLLED at close time; fee-covered encounters carry no invoice and debit the HealthFeePool" }
      - { name: opened_at, type: datetime, source: system, description: "Check-in timestamp" }
      - { name: closed_at, type: datetime, source: system, description: "Close timestamp; null while OPEN" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id (path parent)" }
      - { name: medication_stock_id, type: string, source: input, description: "FK -> MedicationStock.id" }
      - { name: quantity_prescribed, type: integer, source: input, description: "Total units prescribed, > 0" }
      - { name: quantity_dispensed, type: integer, source: computed, default: 0, description: "Units dispensed so far" }
      - { name: status, type: enum, source: system, description: "WRITTEN -> PARTIALLY_DISPENSED -> DISPENSED ; PARTIALLY_DISPENSED -> PARTIALLY_DISPENSED (additional dispense) ; WRITTEN -> CANCELLED", constraints: "enum {WRITTEN, PARTIALLY_DISPENSED, DISPENSED, CANCELLED}" }

  - name: MedicationStock
    parent: null
    common_fields: true
    fields:
      - { name: medication_code, type: string, source: input, description: "Unique medication code" }
      - { name: medication_name, type: string, source: input, description: "Display name" }
      - { name: initial_on_hand, type: integer, source: input, description: "Starting stock units, >= 0" }
      - { name: on_hand, type: integer, source: computed, description: "= initial_on_hand + sum(restock qty) - sum(dispensed qty); never negative" }
      - { name: reorder_threshold, type: integer, source: input, description: "Reorder flag threshold, >= 0" }
      - { name: needs_reorder, type: boolean, source: computed, default: false, description: "True iff on_hand <= reorder_threshold (boundary inclusive)" }

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id (path parent)" }
      - { name: test_code, type: string, source: input, description: "Lab test code" }
      - { name: reportable_disease_code, type: string, source: input, description: "Optional; when set and result flags reportable, a DiseaseCase is auto-created" }
      - { name: status, type: enum, source: system, description: "ORDERED -> SAMPLE_COLLECTED -> RESULTED -> REVIEWED", constraints: "enum {ORDERED, SAMPLE_COLLECTED, RESULTED, REVIEWED}" }
      - { name: result_summary, type: string, source: system, description: "Set by result action" }
      - { name: flags_reportable, type: boolean, source: system, default: false, description: "Set by result action" }

  - name: DiseaseCase
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; copied from the source encounter" }
      - { name: lab_order_id, type: string, source: system, description: "FK -> LabOrder.id; the originating lab order" }
      - { name: disease_code, type: string, source: system, description: "Copied from LabOrder.reportable_disease_code" }
      - { name: status, type: enum, source: system, description: "SUSPECTED -> CONFIRMED -> REPORTED -> RESOLVED ; CONFIRMED -> RESOLVED", constraints: "enum {SUSPECTED, CONFIRMED, REPORTED, RESOLVED}" }
      - { name: confirmed_at, type: datetime, source: system, description: "Set at confirm; null before" }
      - { name: reported_at, type: datetime, source: system, description: "Set at report; null before" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of confirming Clinician" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporting HealthAdmin; MUST differ from confirmed_by_user_id" }

  - name: OutbreakInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: disease_code, type: string, source: system, description: "Disease under investigation; unique among investigations with status != CLOSED" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> CONTAINED -> ACTIVE (relapse) ; CONTAINED -> CLOSED", constraints: "enum {ACTIVE, CONTAINED, CLOSED}" }
      - { name: opened_at, type: datetime, source: system, description: "Auto-open timestamp" }
      - { name: opened_case_count, type: integer, source: system, description: "Rolling-window confirmed count at the moment of auto-open (see calculations.outbreak_case_count)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id (path parent); exactly one invoice per encounter" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; copied from encounter" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> PARTIALLY_PAID -> PAID ; ISSUED|PARTIALLY_PAID -> OVERDUE (sweep) ; OVERDUE -> PARTIALLY_PAID | PAID", constraints: "enum {DRAFT, ISSUED, PARTIALLY_PAID, OVERDUE, PAID}" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL at generation; FINAL at issue", constraints: "enum {PROVISIONAL, FINAL}" }
      - { name: lines, type: array, source: input, description: "Charge lines: [{service_category, charge_cents}]; service_category in {CONSULT, PHARMACY, LAB, TRAVEL_VACCINE, SPORTS_FEE}; charge_cents integer > 0" }
      - { name: charge_total_cents, type: integer, source: computed, description: "Sum of per-line net charges after subsidy (see calculations.invoice_line_subsidy_rounding)" }
      - { name: subsidy_cents, type: integer, source: computed, description: "Health-fee pool subsidy applied (see calculations.pool_subsidy_waterfall)" }
      - { name: insurer_pays_cents, type: integer, source: computed, description: "Payer responsibility per calculations.invoice_payer_split" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "Patient responsibility per calculations.invoice_payer_split" }
      - { name: balance_cents, type: integer, source: computed, description: "= patient_responsibility_cents - sum(Payment.amount_cents where status == POSTED)" }
      - { name: due_date, type: string, source: system, description: "ISO date = date(issued_at) + 30 days; null while DRAFT" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp; null while DRAFT" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id (path parent)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount, integer cents > 0" }
      - { name: method, type: enum, source: input, description: "CARD | CASH | EXTERNAL_REMITTANCE", constraints: "enum {CARD, CASH, EXTERNAL_REMITTANCE}" }
      - { name: status, type: enum, source: system, description: "POSTED -> VOIDED", constraints: "enum {POSTED, VOIDED}" }
      - { name: voided_at, type: datetime, source: system, description: "Set on void; null while POSTED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id (path parent)" }
      - { name: hospital_name, type: string, source: input, description: "Receiving hospital" }
      - { name: reason, type: string, source: input, description: "Referral reason" }
      - { name: status, type: enum, source: system, description: "INITIATED -> ACCEPTED", constraints: "enum {INITIATED, ACCEPTED}" }
      - { name: after_hours, type: boolean, source: computed, description: "True when created outside 08:00-17:00 UTC (boundary: [08:00, 17:00) is business hours)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating Clinician" }

  - name: HealthFeePool
    parent: null
    common_fields: true
    fields:
      - { name: term_code, type: string, source: input, description: "Academic term, e.g. SP26. INVARIANT: at most one HealthFeePool with status OPEN exists at any time; creation while another pool is OPEN is rejected (ERR_DUPLICATE_POOL_TERM), so 'the OPEN pool' in calculations is always unambiguous" }
      - { name: budget_cents, type: integer, source: input, description: "Term health-fee budget, integer cents > 0" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "= sum of fee-covered visit subsidies (12000 each) + invoice subsidies + outbreak emergency debits" }
      - { name: term_end_date, type: string, source: input, description: "ISO date; sweep closes the pool when current date > term_end_date" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED", constraints: "enum {OPEN, CLOSED}" }
      - { name: exhausted, type: boolean, source: computed, default: false, description: "True iff spent_cents >= budget_cents (boundary inclusive)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: InsurancePolicy
    initial_state: UNVERIFIED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /shc/insurance-policies/{id}/verify"
        actor: BillingOfficer
        preconditions:
          - "status == UNVERIFIED (ERR_POLICY_NOT_UNVERIFIED)"
          - "coverage_end >= current logical time (ERR_POLICY_EXPIRED)"
          - "payer_type == STUDENT_PLAN requires Student.enrollment_status == ENROLLED (ERR_POLICY_NOT_ELIGIBLE)"
        side_effects:
          - "verified_at = now"
      - from: UNVERIFIED
        to: SUPERSEDED
        trigger: "system (POST /shc/insurance-policies creates a newer policy for the same student)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system (POST /shc/insurance-policies creates a newer policy for the same student)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNVERIFIED
        to: EXPIRED
        trigger: "system (clock sweep: coverage_end < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (clock sweep: coverage_end < now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ImmunizationRecord
    initial_state: PENDING
    terminal_states: [IN_COMPLIANCE, EXEMPTED]
    transitions:
      - from: PENDING
        to: GRACE
        trigger: "system (clock sweep: date(now) > requirement.deadline_date and <= deadline + grace_period_days)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed (may become PROVISIONAL_HOLD; IMMUNIZATION added to active_hold_types)"
      - from: GRACE
        to: OVERDUE
        trigger: "system (clock sweep: date(now) > requirement.deadline_date + grace_period_days)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed (becomes REGISTRATION_HOLD; IMMUNIZATION in active_hold_types)"
          - "All of the student's BOOKED appointments with visit_type in {SPORTS_PHYSICAL, TRAVEL_CLINIC} and scheduled_start > now are auto-cancelled with cancel_reason = HOLD"
      - from: PENDING
        to: OVERDUE
        trigger: "system (clock sweep: date(now) already > deadline + grace while record still PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "Same posture + elective-cancellation side effects as GRACE -> OVERDUE"
      - from: PENDING
        to: IN_COMPLIANCE
        trigger: "POST /shc/immunization-records/{id}/doses bringing doses_received == requirement.required_doses"
        actor: Nurse
        preconditions:
          - "status in {PENDING, GRACE, OVERDUE} (ERR_RECORD_NOT_DOSEABLE)"
          - "dose_date <= current logical date (ERR_DOSE_DATE_IN_FUTURE)"
          - "dose_date >= previous dose_date + requirement.min_interval_days (ERR_DOSE_INTERVAL_VIOLATION; first dose unconstrained)"
          - "OCC: expected_record_version == record.version (ERR_STALE_RECORD_VERSION)"
        side_effects:
          - "doses_received += 1; dose_dates appended; ImmunizationRecord.version += 1"
          - "When doses_received reaches required_doses: status -> IN_COMPLIANCE and Student.compliance_posture recomputed"
      - from: GRACE
        to: IN_COMPLIANCE
        trigger: "POST /shc/immunization-records/{id}/doses (same rule as PENDING)"
        actor: Nurse
        preconditions: ["same as PENDING -> IN_COMPLIANCE"]
        side_effects: ["same as PENDING -> IN_COMPLIANCE; posture recompute may clear PROVISIONAL_HOLD"]
      - from: OVERDUE
        to: IN_COMPLIANCE
        trigger: "POST /shc/immunization-records/{id}/doses (same rule as PENDING)"
        actor: Nurse
        preconditions: ["same as PENDING -> IN_COMPLIANCE"]
        side_effects: ["same as PENDING -> IN_COMPLIANCE; posture recompute may release REGISTRATION_HOLD"]
      - from: PENDING
        to: EXEMPTED
        trigger: "POST /shc/immunization-records/{id}/exempt"
        actor: Clinician
        preconditions:
          - "status in {PENDING, GRACE, OVERDUE} (ERR_RECORD_NOT_DOSEABLE)"
        side_effects:
          - "exemption_reason stored; Student.compliance_posture recomputed"
      - from: GRACE
        to: EXEMPTED
        trigger: "POST /shc/immunization-records/{id}/exempt"
        actor: Clinician
        preconditions: ["status in {PENDING, GRACE, OVERDUE} (ERR_RECORD_NOT_DOSEABLE)"]
        side_effects: ["exemption_reason stored; Student.compliance_posture recomputed"]
      - from: OVERDUE
        to: EXEMPTED
        trigger: "POST /shc/immunization-records/{id}/exempt"
        actor: Clinician
        preconditions: ["status in {PENDING, GRACE, OVERDUE} (ERR_RECORD_NOT_DOSEABLE)"]
        side_effects: ["exemption_reason stored; Student.compliance_posture recomputed"]

  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /shc/appointments/{id}/check-in"
        actor: FrontDeskStaff
        preconditions:
          - "status == BOOKED (ERR_APPOINTMENT_NOT_BOOKED)"
        side_effects:
          - "Creates Encounter (status OPEN) with appointment_id/student_id/provider_id/visit_type copied; opened_at = now"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (POST /shc/encounters/{id}/close on the linked encounter)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /shc/appointments/{id}/cancel"
        actor: Student | FrontDeskStaff
        preconditions:
          - "status == BOOKED (ERR_APPOINTMENT_NOT_CANCELLABLE)"
          - "Student actor: X-User-ID == appointment.student_id (ERR_FORBIDDEN)"
        side_effects:
          - "cancel_reason = CLIENT"
          - "Same-day triage quota for (provider, date) is freed (cancelled appointments no longer count)"
      - from: BOOKED
        to: CANCELLED
        trigger: "system (compliance sweep: student posture becomes REGISTRATION_HOLD and appointment is elective + future)"
        actor: system
        preconditions:
          - "visit_type in {SPORTS_PHYSICAL, TRAVEL_CLINIC} and scheduled_start > now"
        side_effects:
          - "cancel_reason = HOLD; triage quota freed"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (clock sweep: scheduled_end < now while still BOOKED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Encounter
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /shc/encounters/{id}/close"
        actor: Clinician
        preconditions:
          - "status == OPEN (ERR_ENCOUNTER_NOT_OPEN)"
          - "All Prescriptions of this encounter are in {DISPENSED, CANCELLED} and all LabOrders are REVIEWED (ERR_UNRESOLVED_CLINICAL_WORK)"
          - "If NOT fee_covered: an Invoice exists for this encounter (ERR_BILLING_NOT_CODED); fee-covered encounters must never have an invoice"
          - "If clearance_outcome == CLEARED: Student.compliance_posture == CLEAR (ERR_CLEARANCE_BLOCKED); clearance_outcome only allowed for SPORTS_PHYSICAL encounters (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "closed_at = now; linked Appointment -> COMPLETED"
          - "If fee_covered: the OPEN HealthFeePool (if any) spent_cents += 12000 (VISIT_SUBSIDY_CENTS)"

  - entity: Prescription
    initial_state: WRITTEN
    terminal_states: [DISPENSED, CANCELLED]
    transitions:
      - from: WRITTEN
        to: PARTIALLY_DISPENSED
        trigger: "POST /shc/prescriptions/{id}/dispense with quantity < remaining"
        actor: Pharmacist
        preconditions:
          - "status in {WRITTEN, PARTIALLY_DISPENSED} (ERR_PRESCRIPTION_NOT_DISPENSABLE)"
          - "quantity > 0 (ERR_INVALID_QUANTITY)"
          - "quantity <= quantity_prescribed - quantity_dispensed (ERR_DISPENSE_QUANTITY_EXCEEDS)"
          - "MedicationStock.on_hand >= quantity (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "quantity_dispensed += quantity"
          - "MedicationStock.on_hand -= quantity; MedicationStock.needs_reorder recomputed (on_hand <= reorder_threshold)"
      - from: PARTIALLY_DISPENSED
        to: PARTIALLY_DISPENSED
        trigger: "POST /shc/prescriptions/{id}/dispense with quantity < remaining (self-loop)"
        actor: Pharmacist
        preconditions: ["same as WRITTEN -> PARTIALLY_DISPENSED"]
        side_effects: ["same as WRITTEN -> PARTIALLY_DISPENSED"]
      - from: WRITTEN
        to: DISPENSED
        trigger: "POST /shc/prescriptions/{id}/dispense with quantity == remaining"
        actor: Pharmacist
        preconditions: ["same as WRITTEN -> PARTIALLY_DISPENSED"]
        side_effects: ["same as WRITTEN -> PARTIALLY_DISPENSED"]
      - from: PARTIALLY_DISPENSED
        to: DISPENSED
        trigger: "POST /shc/prescriptions/{id}/dispense with quantity == remaining"
        actor: Pharmacist
        preconditions: ["same as WRITTEN -> PARTIALLY_DISPENSED"]
        side_effects: ["same as WRITTEN -> PARTIALLY_DISPENSED"]
      - from: WRITTEN
        to: CANCELLED
        trigger: "POST /shc/prescriptions/{id}/cancel"
        actor: Clinician
        preconditions:
          - "status == WRITTEN (ERR_PRESCRIPTION_NOT_CANCELLABLE; a PARTIALLY_DISPENSED prescription may not be cancelled)"
        side_effects: []

  - entity: LabOrder
    initial_state: ORDERED
    terminal_states: [REVIEWED]
    transitions:
      - from: ORDERED
        to: SAMPLE_COLLECTED
        trigger: "POST /shc/lab-orders/{id}/collect"
        actor: Nurse
        preconditions:
          - "status == ORDERED (ERR_LAB_ORDER_NOT_ORDERED)"
        side_effects: []
      - from: SAMPLE_COLLECTED
        to: RESULTED
        trigger: "POST /shc/lab-orders/{id}/result"
        actor: Nurse
        preconditions:
          - "status == SAMPLE_COLLECTED (ERR_LAB_ORDER_NOT_COLLECTED)"
          - "flags_reportable == true requires reportable_disease_code set on the order (ERR_REPORTABLE_CODE_REQUIRED)"
        side_effects:
          - "result_summary, flags_reportable stored"
          - "If flags_reportable: create DiseaseCase (SUSPECTED) with student_id from encounter, lab_order_id, disease_code"
      - from: RESULTED
        to: REVIEWED
        trigger: "POST /shc/lab-orders/{id}/review"
        actor: Clinician
        preconditions:
          - "status == RESULTED (ERR_LAB_ORDER_NOT_RESULTED)"
        side_effects: []

  - entity: DiseaseCase
    initial_state: SUSPECTED
    terminal_states: [RESOLVED]
    transitions:
      - from: SUSPECTED
        to: CONFIRMED
        trigger: "POST /shc/disease-cases/{id}/confirm"
        actor: Clinician
        preconditions:
          - "status == SUSPECTED (ERR_CASE_NOT_CONFIRMABLE)"
        side_effects:
          - "confirmed_at = now; confirmed_by_user_id = X-User-ID"
          - "Evaluate calculations.outbreak_case_count (rolling variant). If count >= 3: (a) no OutbreakInvestigation with status in {ACTIVE, CONTAINED} for disease_code -> create one ACTIVE with opened_case_count = count, and debit the OPEN HealthFeePool (if any) spent_cents += 25000 (OUTBREAK_EMERGENCY_DEBIT_CENTS); (b) existing CONTAINED investigation -> reopen to ACTIVE"
      - from: CONFIRMED
        to: REPORTED
        trigger: "POST /shc/disease-cases/{id}/report"
        actor: HealthAdmin
        preconditions:
          - "status == CONFIRMED (ERR_CASE_NOT_REPORTABLE)"
          - "now <= confirmed_at + 24 hours (REPORT_WINDOW_HOURS; boundary inclusive) (ERR_REPORT_WINDOW_EXPIRED)"
          - "X-User-ID != confirmed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reported_at = now; reported_by_user_id = X-User-ID"
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /shc/disease-cases/{id}/resolve"
        actor: Clinician
        preconditions:
          - "status in {CONFIRMED, REPORTED} (ERR_CASE_NOT_RESOLVABLE)"
        side_effects: []
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /shc/disease-cases/{id}/resolve"
        actor: Clinician
        preconditions: ["status in {CONFIRMED, REPORTED} (ERR_CASE_NOT_RESOLVABLE)"]
        side_effects: []

  - entity: OutbreakInvestigation
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CONTAINED
        trigger: "POST /shc/outbreak-investigations/{id}/contain"
        actor: HealthAdmin
        preconditions:
          - "status == ACTIVE (ERR_OUTBREAK_NOT_ACTIVE)"
        side_effects: []
      - from: CONTAINED
        to: ACTIVE
        trigger: "POST /shc/outbreak-investigations/{id}/reopen OR system (case confirm pushes rolling count >= 3 while CONTAINED)"
        actor: HealthAdmin | system
        preconditions:
          - "status == CONTAINED (ERR_OUTBREAK_NOT_CONTAINED)"
        side_effects: []
      - from: CONTAINED
        to: CLOSED
        trigger: "POST /shc/outbreak-investigations/{id}/close"
        actor: HealthAdmin
        preconditions:
          - "status == CONTAINED (ERR_OUTBREAK_NOT_CONTAINED)"
          - "Zero DiseaseCases with this disease_code in status {SUSPECTED, CONFIRMED, REPORTED} (ERR_OUTBREAK_UNRESOLVED_CASES)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /shc/invoices/{id}/issue"
        actor: BillingOfficer
        preconditions:
          - "status == DRAFT (ERR_INVOICE_NOT_DRAFT)"
        side_effects:
          - "variant -> FINAL; calculations.invoice_payer_split recomputed (final variant): if a VERIFIED policy exists for the student, use adjudicated split and policy.deductible_met_cents += ded_applied; otherwise patient_responsibility_cents = charge_total_cents (self-pay)"
          - "issued_at = now; due_date = date(now) + 30 days; balance_cents = patient_responsibility_cents"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /shc/invoices/{id}/payments with amount_cents < balance_cents"
        actor: BillingOfficer
        preconditions:
          - "status in {ISSUED, PARTIALLY_PAID, OVERDUE} (ERR_INVOICE_NOT_PAYABLE)"
          - "amount_cents > 0 (ERR_INVALID_QUANTITY) and <= balance_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "Payment created POSTED; balance_cents recomputed"
      - from: OVERDUE
        to: PARTIALLY_PAID
        trigger: "POST /shc/invoices/{id}/payments with amount_cents < balance_cents"
        actor: BillingOfficer
        preconditions: ["same as ISSUED -> PARTIALLY_PAID"]
        side_effects: ["same as ISSUED -> PARTIALLY_PAID; Student.compliance_posture recomputed (invoice no longer OVERDUE)"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /shc/invoices/{id}/payments with amount_cents < balance_cents (self-loop)"
        actor: BillingOfficer
        preconditions: ["same as ISSUED -> PARTIALLY_PAID"]
        side_effects: ["same as ISSUED -> PARTIALLY_PAID"]
      - from: ISSUED
        to: PAID
        trigger: "POST /shc/invoices/{id}/payments with amount_cents == balance_cents"
        actor: BillingOfficer
        preconditions: ["same as ISSUED -> PARTIALLY_PAID"]
        side_effects:
          - "Payment created POSTED; balance_cents -> 0"
          - "Student.compliance_posture recomputed (financial hold released when no other OVERDUE invoice remains)"
      - from: OVERDUE
        to: PAID
        trigger: "POST /shc/invoices/{id}/payments with amount_cents == balance_cents"
        actor: BillingOfficer
        preconditions: ["same as ISSUED -> PARTIALLY_PAID"]
        side_effects: ["same as ISSUED -> PAID"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /shc/invoices/{id}/payments with amount_cents == balance_cents"
        actor: BillingOfficer
        preconditions: ["same as ISSUED -> PARTIALLY_PAID"]
        side_effects: ["same as ISSUED -> PAID"]
      - from: ISSUED
        to: OVERDUE
        trigger: "system (clock sweep: due_date < date(now) and balance_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed: REGISTRATION_HOLD with FINANCIAL in active_hold_types"
          - "Student's future BOOKED elective appointments (SPORTS_PHYSICAL / TRAVEL_CLINIC, scheduled_start > now) auto-cancelled with cancel_reason = HOLD"
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "system (clock sweep: due_date < date(now) and balance_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["same as ISSUED -> OVERDUE"]
      - from: PAID
        to: ISSUED
        trigger: "system (POST /shc/payments/{id}/void restores balance; due_date >= date(now))"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored by voided amount; Student.compliance_posture recomputed"]
      - from: PAID
        to: OVERDUE
        trigger: "system (POST /shc/payments/{id}/void restores balance; due_date < date(now))"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored; posture recomputed (may re-impose FINANCIAL hold)"]
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "system (POST /shc/payments/{id}/void restores full balance; due_date >= date(now))"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored by voided amount"]
      - from: OVERDUE
        to: ISSUED
        trigger: "system (POST /shc/payments/{id}/void restores balance; due_date >= date(now))"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored by voided amount; posture recomputed (FINANCIAL hold may release)"]
        note: "Void from OVERDUE keeps OVERDUE when due_date < date(now); it flips back to ISSUED only when the due date is still in the future"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /shc/payments/{id}/void"
        actor: BillingOfficer
        preconditions:
          - "status == POSTED (ERR_PAYMENT_NOT_VOIDABLE)"
        side_effects:
          - "voided_at = now; Invoice.balance_cents recomputed; Invoice.status re-derived (PAID -> ISSUED or OVERDUE per due_date vs now; PARTIALLY_PAID -> ISSUED when balance returns to full and due_date >= now)"

  - entity: Referral
    initial_state: INITIATED
    terminal_states: [ACCEPTED]
    transitions:
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /shc/referrals/{id}/accept"
        actor: Clinician
        preconditions:
          - "status == INITIATED (ERR_REFERRAL_NOT_INITIATED)"
        side_effects: []

  - entity: HealthFeePool
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (clock sweep: date(now) > term_end_date)"
        actor: system
        preconditions: []
        side_effects: ["No further subsidies are applied from a CLOSED pool"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other write-write conflicts reduce
# to state preconditions in §1.2 / §1.4)
# =============================================================================
concurrency_rules:
  - rule_id: insurance-policy-create-supersede
    parent_entity: Student
    write_endpoint: "POST /shc/insurance-policies"
    occ_field: expected_student_version
    description: |
      Creating an InsurancePolicy for a Student supersedes that student's
      existing UNVERIFIED/VERIFIED policy. The create is rejected when the
      caller's expected_student_version no longer matches Student.version,
      because another writer has mutated the student (e.g. created a policy,
      which legitimately superseded the prior one and bumped the version)
      since the caller last observed it.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
  - rule_id: dose-recording-stale-record
    parent_entity: ImmunizationRecord
    write_endpoint: "POST /shc/immunization-records/{id}/doses"
    occ_field: expected_record_version
    description: |
      Recording a dose against an ImmunizationRecord whose version has
      advanced since the caller last observed it is rejected, because the
      caller's view of doses_received/dose_dates is stale (e.g. another dose
      was recorded, bumping the version).
    error_id: ERR_STALE_RECORD_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_payer_split
    trigger: "invoice generation (PROVISIONAL variant) and invoice issue (FINAL variant)"
    algorithm: nested_min_max_split
    formula: |
      FINAL variant (a VERIFIED InsurancePolicy exists for the student):
        after_copay   = max(0, charge_total_cents - copay_cents)
        ded_remaining = max(0, deductible_cents - deductible_met_cents)
        ded_applied   = min(after_copay, ded_remaining)
        coins_base    = after_copay - ded_applied
        coins_patient = round_half_up(coins_base * coinsurance_pct)   # integer cents
        insurer_pays_cents           = charge_total_cents - copay_cents - ded_applied - coins_patient
        patient_responsibility_cents = copay_cents + ded_applied + coins_patient
        side effect at issue: policy.deductible_met_cents += ded_applied
      PROVISIONAL variant (default at generation; also FINAL fallback when no
      VERIFIED policy exists at issue = self-pay):
        insurer_pays_cents           = 0
        patient_responsibility_cents = charge_total_cents
      Inputs: charge_total_cents, copay_cents, deductible_cents,
      deductible_met_cents, coinsurance_pct (5 inputs, nested min/max).
    input_set: "The invoice's charge_total_cents (post-subsidy); the student's VERIFIED policy if one exists at issue time, else none"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up on the coinsurance multiplication"
    variants:
      - name: provisional_estimate
        when: "invoice generation (variant PROVISIONAL)"
        difference: "patient pays everything; insurer_pays_cents = 0 regardless of policy terms"
      - name: final_adjudicated
        when: "invoice issue (variant FINAL) with a VERIFIED policy"
        difference: "copay + deductible + coinsurance split applies; differs from provisional for identical charge data"

  - name: invoice_line_subsidy_rounding
    trigger: "invoice generation, before invoice_payer_split and pool_subsidy_waterfall"
    algorithm: per_line_rounding_then_sum
    formula: |
      For each line in request order:
        tentative_subsidy[line] = round_half_up(charge_cents * SUBSIDY_PCT)
          when service_category == TRAVEL_VACCINE AND encounter.visit_type == TRAVEL_CLINIC
          AND an OPEN, non-exhausted HealthFeePool exists; else 0.
      PINNED ROUNDING ORDER: subsidy is rounded PER LINE first, then summed.
      The alternative (sum travel charges, then round once) is REJECTED:
      it yields different cents (e.g. two 3333-cent lines at 50%: per-line
      1667+1667 = 3334 vs sum-then-round round(6666*0.5) = 3333).
      line_net[line] = charge_cents - applied_subsidy[line] (applied per pool_subsidy_waterfall)
      charge_total_cents = sum(line_net); subsidy_cents = sum(applied_subsidy)
    input_set: "the invoice's lines in request order; the OPEN HealthFeePool if any"
    constants:
      SUBSIDY_PCT: 0.5
    precision: "integer cents; round_half_up per line, then sum"

  - name: pool_subsidy_waterfall
    trigger: "invoice generation, after invoice_line_subsidy_rounding"
    algorithm: waterfall_allocation
    formula: |
      Circular-looking dependency, PINNED evaluation order:
        (1) pool_remaining = budget_cents - spent_cents, snapshotted BEFORE this invoice;
        (2) iterate lines in REQUEST ORDER:
              applied_subsidy[line] = min(tentative_subsidy[line], pool_remaining)
              pool_remaining -= applied_subsidy[line]
        (3) after the invoice is created: pool.spent_cents += subsidy_cents (single debit).
      The naive recompute-inside-loop reading (recompute remaining from a pool
      already debited by this same invoice) is REJECTED: the snapshot in (1)
      makes the result well-defined.
    input_set: "tentative per-line subsidies from invoice_line_subsidy_rounding; OPEN HealthFeePool state"
    constants:
      SUBSIDY_PCT: 0.5
    precision: "integer cents, no further rounding"

  - name: outbreak_case_count
    trigger: "DiseaseCase confirm (SUSPECTED -> CONFIRMED)"
    algorithm: chronological
    formula: |
      ROLLING variant (canonical for auto-open/auto-reopen):
        count = |{ DiseaseCase c : c.disease_code == X,
                    c.status IN {CONFIRMED, REPORTED},
                    c.confirmed_at IN [now - 168h, now]  (both bounds inclusive) }|
        if count >= OUTBREAK_THRESHOLD: auto-open (or auto-reopen from CONTAINED)
      ISO_CALENDAR_WEEK variant (reporting metric only, never drives auto-open):
        count_week = |{ c : same filters, but c.confirmed_at within the ISO
                        Monday-Sunday week containing now }|
      The two variants diverge at window edges: a case confirmed 7*24h - 1h ago
      counts under ROLLING but may fall in the previous ISO week.
    input_set: "DiseaseCases with the same disease_code; statuses CONFIRMED and REPORTED only (SUSPECTED and RESOLVED excluded)"
    constants:
      OUTBREAK_THRESHOLD: 3
      OUTBREAK_WINDOW_HOURS: 168
    precision: "inclusive bounds on both ends of the rolling window"
    variants:
      - name: rolling_168h
        when: "auto-open / auto-reopen evaluation at confirm time"
        difference: "trailing 168-hour window anchored at now"
      - name: iso_calendar_week
        when: "weekly surveillance reporting"
        difference: "ISO week bucket; same data can yield a smaller count (e.g. 3 rolling vs 1 current-week)"

  - name: triage_daily_quota
    trigger: "POST /shc/appointments with visit_type == SAME_DAY_TRIAGE"
    algorithm: aggregation
    formula: |
      count = |{ Appointment a : a.provider_id == new.provider_id,
                  date(a.scheduled_start) == date(new.scheduled_start),
                  a.visit_type == SAME_DAY_TRIAGE,
                  a.status IN {BOOKED, CHECKED_IN} }|
      Reject with ERR_TRIAGE_QUOTA_EXHAUSTED iff count >= TRIAGE_DAILY_QUOTA.
      Boundary: count == 3 -> 4th booking allowed; count == 4 -> 5th rejected.
      CANCELLED and NO_SHOW appointments do NOT count (cancel frees the slot).
    input_set: "same provider, same calendar date (UTC), visit_type SAME_DAY_TRIAGE, statuses {BOOKED, CHECKED_IN}"
    constants:
      TRIAGE_DAILY_QUOTA: 4
    precision: "integer count; reject at >= 4"

  - name: compliance_posture_derivation
    trigger: "clock sweep, dose recorded, exemption granted, invoice OVERDUE transition, invoice payment/void"
    algorithm: aggregation
    formula: |
      Let d = date(now), and consider all of the student's ImmunizationRecords
      with their requirement deadlines:
        record overdue   iff status == OVERDUE (set by sweep when d > deadline_date + grace_period_days)
        record in grace  iff status == GRACE   (d > deadline_date and d <= deadline_date + grace_period_days)
      immunization_hold  = any record OVERDUE
      provisional_hold   = not immunization_hold and any record GRACE
      financial_hold     = any Invoice of the student with status == OVERDUE
      posture = REGISTRATION_HOLD if immunization_hold or financial_hold
              else PROVISIONAL_HOLD if provisional_hold
              else CLEAR
      active_hold_types = {IMMUNIZATION if immunization_hold} union {FINANCIAL if financial_hold}
      Gates:
        - POST /shc/appointments with visit_type in {SPORTS_PHYSICAL, TRAVEL_CLINIC}
          requires posture != REGISTRATION_HOLD (ERR_COMPLIANCE_HOLD_ACTIVE)
        - POST /shc/encounters/{id}/close with clearance_outcome == CLEARED
          requires posture == CLEAR (ERR_CLEARANCE_BLOCKED)
    input_set: "all ImmunizationRecords of the student (any status); all OVERDUE Invoices of the student; current logical date"
    constants: {}
    precision: "date granularity; deadline/grace boundaries inclusive as written"

  - name: stock_reorder_flag
    trigger: "every dispense and restock on the MedicationStock"
    algorithm: threshold
    formula: |
      needs_reorder = (on_hand <= reorder_threshold)   # boundary INCLUSIVE:
      on_hand == reorder_threshold -> needs_reorder == true
    input_set: "the MedicationStock row"
    constants: {}
    precision: "integer units; <= boundary"

  - name: invoice_balance_and_status
    trigger: "payment posted, payment voided, invoice issue"
    algorithm: aggregation
    formula: |
      balance_cents = patient_responsibility_cents - sum(p.amount_cents for p in invoice.payments where p.status == POSTED)
      Status derivation after a payment/void:
        balance == 0                       -> PAID
        0 < balance < patient_responsibility -> PARTIALLY_PAID (or OVERDUE if due_date < date(now))
        balance == patient_responsibility  -> ISSUED (or OVERDUE if due_date < date(now))
      INVARIANT (money conservation): patient_responsibility_cents ==
        balance_cents + sum(POSTED payments). Post(p) followed by void(p)
        leaves balance_cents unchanged.
    input_set: "the invoice and its Payments with status POSTED"
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles; additionally Student actors may only book/cancel appointments whose student_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids must exist (left to right); body FK references (student_id, provider_id, medication_stock_id, requirement_id) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.5
    category: state
    check: "OCC: expected_student_version == Student.version (POST /shc/insurance-policies); expected_record_version == ImmunizationRecord.version (POST .../doses). Checked BEFORE business rules."
    error_id: "ERR_STALE_STUDENT_VERSION / ERR_STALE_RECORD_VERSION"
    http_status: 412
    applies_to: "POST /shc/insurance-policies ; POST /shc/immunization-records/{id}/doses"
  - priority: 4
    category: state
    check: "State-machine preconditions of the target resource (appointment BOOKED for check-in/cancel; encounter OPEN for children/close; prescription WRITTEN/PARTIALLY for dispense, WRITTEN for cancel; lab ORDERED/COLLECTED/RESULTED chain; case SUSPECTED/CONFIRMED chain; outbreak ACTIVE/CONTAINED; invoice DRAFT for issue, payable states for payment; payment POSTED for void; policy UNVERIFIED for verify; record doseable)"
    error_id: "ERR_APPOINTMENT_NOT_BOOKED | ERR_APPOINTMENT_NOT_CANCELLABLE | ERR_ENCOUNTER_NOT_OPEN | ERR_PRESCRIPTION_NOT_DISPENSABLE | ERR_PRESCRIPTION_NOT_CANCELLABLE | ERR_LAB_ORDER_NOT_ORDERED | ERR_LAB_ORDER_NOT_COLLECTED | ERR_LAB_ORDER_NOT_RESULTED | ERR_CASE_NOT_CONFIRMABLE | ERR_CASE_NOT_REPORTABLE | ERR_CASE_NOT_RESOLVABLE | ERR_OUTBREAK_NOT_ACTIVE | ERR_OUTBREAK_NOT_CONTAINED | ERR_INVOICE_NOT_DRAFT | ERR_INVOICE_NOT_PAYABLE | ERR_PAYMENT_NOT_VOIDABLE | ERR_POLICY_NOT_UNVERIFIED | ERR_RECORD_NOT_DOSEABLE | ERR_REFERRAL_NOT_INITIATED"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Compliance gates: elective booking (SPORTS_PHYSICAL/TRAVEL_CLINIC) blocked while posture == REGISTRATION_HOLD; clearance CLEARED requires posture == CLEAR; case report within 24h of confirm; case reporter != confirmer"
    error_id: "ERR_COMPLIANCE_HOLD_ACTIVE | ERR_CLEARANCE_BLOCKED | ERR_REPORT_WINDOW_EXPIRED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /shc/appointments ; POST /shc/encounters/{id}/close ; POST /shc/disease-cases/{id}/report"
  - priority: 6
    category: business_temporal
    check: "Temporal rules: end > start for appointments/policies/shifts; appointment start in the future; SAME_DAY_TRIAGE scheduled on the current date; provider slot overlap (half-open); on-call overlap (closed, evaluated before the rest buffer) and 12h rest buffer; dose interval and not-future dose date; policy not expired at verify; after-hours referral requires a covering OnCallShift (shift_start <= now < shift_end)"
    error_id: "ERR_INVALID_TIME_RANGE | ERR_APPOINTMENT_IN_PAST | ERR_SAME_DAY_ONLY | ERR_SLOT_CONFLICT | ERR_ONCALL_OVERLAP | ERR_ONCALL_REST_VIOLATION | ERR_DOSE_INTERVAL_VIOLATION | ERR_DOSE_DATE_IN_FUTURE | ERR_POLICY_EXPIRED | ERR_NO_ONCALL_COVERAGE"
    http_status: 422
    applies_to: "POST /shc/appointments ; POST /shc/insurance-policies ; POST /shc/on-call-shifts ; POST .../doses ; POST .../verify ; POST /shc/encounters/{id}/referrals"
    note: "ERR_SLOT_CONFLICT, ERR_ONCALL_OVERLAP, ERR_ONCALL_REST_VIOLATION, ERR_NO_ONCALL_COVERAGE return 409; the rest return 422"
  - priority: 7
    category: business_referential
    check: "Cross-references must be coherent: flags_reportable requires reportable_disease_code on the order"
    error_id: ERR_REPORTABLE_CODE_REQUIRED
    http_status: 422
    applies_to: "POST /shc/lab-orders/{id}/result"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and cardinality: external_ref unique; vaccine_code unique; medication_code unique; at most one OPEN health-fee pool at any time; one non-terminal ImmunizationRecord per (student, requirement); one Invoice per encounter; no invoice for fee-covered encounters; STUDENT_PLAN policy requires ENROLLED student at verify; triage daily quota"
    error_id: "ERR_DUPLICATE_STUDENT_REF | ERR_DUPLICATE_REQUIREMENT | ERR_DUPLICATE_MEDICATION | ERR_DUPLICATE_POOL_TERM | ERR_DUPLICATE_IMMUNIZATION_RECORD | ERR_INVOICE_EXISTS | ERR_INVOICE_NOT_ALLOWED | ERR_POLICY_NOT_ELIGIBLE | ERR_TRIAGE_QUOTA_EXHAUSTED"
    http_status: 409
    applies_to: "creation endpoints ; POST .../verify ; POST /shc/appointments"
    note: "ERR_POLICY_NOT_ELIGIBLE returns 422"
  - priority: 9
    category: business_fiscal
    check: "Fiscal gates last: TRAVEL_CLINIC booking requires a VERIFIED policy; dispense stock sufficiency and quantity bounds; payment amounts; payment must not exceed invoice balance"
    error_id: "ERR_INSURANCE_NOT_VERIFIED | ERR_INSUFFICIENT_STOCK | ERR_DISPENSE_QUANTITY_EXCEEDS | ERR_INVALID_QUANTITY | ERR_OVERPAYMENT"
    http_status: 422
    applies_to: "POST /shc/appointments ; POST .../dispense ; POST .../restock ; POST .../payments"
    note: "ERR_INSURANCE_NOT_VERIFIED returns 402; ERR_INSUFFICIENT_STOCK returns 409"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; also runs the deterministic daily sweep) ---
  - method: POST
    path: "/shc/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z (the logical clock MUST NOT fall back to wall-clock time). Setting the clock runs the deterministic sweep: (1) ISSUED/PARTIALLY_PAID invoices with due_date < date(now) and balance > 0 -> OVERDUE, triggering posture recompute and future-elective-appointment cancellation; (2) immunization records PENDING -> GRACE -> OVERDUE per deadline/grace, triggering posture recompute and elective cancellation; (3) UNVERIFIED/VERIFIED policies with coverage_end < now -> EXPIRED; (4) BOOKED appointments with scheduled_end < now -> NO_SHOW; (5) OPEN pools with date(now) > term_end_date -> CLOSED. Sweep order is (1)-(5); posture recomputed after each step; elective cancellations applied after each posture change."
    roles: [HealthAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["deterministic sweep as described"]

  # --- Students ---
  - method: POST
    path: "/shc/students"
    description: "Register a student"
    roles: [HealthAdmin]
    code: 201
    input: ["external_ref", "full_name", "enrollment_status?"]
    output: Student
    side_effects: ["compliance_posture = CLEAR; active_hold_types = []; version = 1"]

  - method: GET
    path: "/shc/students/{id}"
    description: "Get a student including computed compliance_posture and active_hold_types"
    roles: [Any]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- Insurance ---
  - method: POST
    path: "/shc/insurance-policies"
    description: "Create a policy for a student (supersedes the student's existing UNVERIFIED/VERIFIED policy). OCC via expected_student_version."
    roles: [BillingOfficer]
    code: 201
    input: ["student_id", "payer_type", "policy_number", "coverage_start", "coverage_end", "copay_cents", "deductible_cents", "coinsurance_pct", "expected_student_version"]
    output: InsurancePolicy
    side_effects:
      - "status = UNVERIFIED"
      - "existing UNVERIFIED/VERIFIED policy of the same student -> SUPERSEDED"
      - "increments Student.version by 1"
  - method: POST
    path: "/shc/insurance-policies/{id}/verify"
    description: "Verify a policy's eligibility"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status UNVERIFIED -> VERIFIED; verified_at = now"]
  - method: GET
    path: "/shc/students/{id}/insurance-policies"
    description: "List a student's policies (reverse reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "InsurancePolicy[]"
    side_effects: []

  # --- Immunization configuration & records ---
  - method: POST
    path: "/shc/immunization-requirements"
    description: "Define an immunization requirement"
    roles: [HealthAdmin]
    code: 201
    input: ["vaccine_code", "required_doses", "min_interval_days", "deadline_date", "grace_period_days"]
    output: ImmunizationRequirement
    side_effects: []
  - method: POST
    path: "/shc/immunization-records"
    description: "Open an immunization record for a student"
    roles: [Nurse]
    code: 201
    input: ["student_id", "requirement_id"]
    output: ImmunizationRecord
    side_effects: ["status = PENDING (or OVERDUE immediately if already past deadline+grace, with posture recompute)"]
  - method: GET
    path: "/shc/immunization-records"
    description: "List immunization records with filters"
    roles: [Any]
    code: 200
    input: ["student_id?", "requirement_id?", "status?"]
    output: "ImmunizationRecord[]"
    side_effects: []
  - method: GET
    path: "/shc/immunization-records/{id}"
    description: "Get one immunization record"
    roles: [Any]
    code: 200
    input: []
    output: ImmunizationRecord
    side_effects: []
  - method: POST
    path: "/shc/immunization-records/{id}/doses"
    description: "Record an administered dose. OCC via expected_record_version."
    roles: [Nurse]
    code: 200
    input: ["dose_date", "expected_record_version"]
    output: ImmunizationRecord
    side_effects:
      - "doses_received += 1; dose_dates appended; increments ImmunizationRecord.version by 1"
      - "when doses_received == required_doses: status -> IN_COMPLIANCE; Student.compliance_posture recomputed"
  - method: POST
    path: "/shc/immunization-records/{id}/exempt"
    description: "Grant a medical exemption"
    roles: [Clinician]
    code: 200
    input: ["exemption_reason"]
    output: ImmunizationRecord
    side_effects: ["status -> EXEMPTED; exemption_reason stored; Student.compliance_posture recomputed"]

  # --- Providers & on-call ---
  - method: POST
    path: "/shc/providers"
    description: "Create a provider"
    roles: [HealthAdmin]
    code: 201
    input: ["full_name", "provider_type"]
    output: Provider
    side_effects: []
  - method: GET
    path: "/shc/providers/{id}"
    description: "Get a provider"
    roles: [Any]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/shc/on-call-shifts"
    description: "Schedule an after-hours on-call shift. Overlap uses CLOSED-interval semantics (adjacent shifts conflict) and any two shifts of the same provider must be separated by >= 12 hours of rest (gap exactly 12h is allowed)."
    roles: [HealthAdmin]
    code: 201
    input: ["provider_id", "shift_start", "shift_end"]
    output: OnCallShift
    side_effects: []
  - method: GET
    path: "/shc/providers/{id}/on-call-shifts"
    description: "List a provider's on-call shifts (reverse reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "OnCallShift[]"
    side_effects: []

  # --- Appointments ---
  - method: POST
    path: "/shc/appointments"
    description: "Book an appointment. Slot conflict uses HALF-OPEN [start, end) semantics: an existing booking ending exactly at the new start is allowed. SAME_DAY_TRIAGE must be scheduled on the current date and consumes the provider's daily triage quota (4). Elective types (SPORTS_PHYSICAL, TRAVEL_CLINIC) are blocked by REGISTRATION_HOLD posture; TRAVEL_CLINIC additionally requires a VERIFIED insurance policy."
    roles: [Student, FrontDeskStaff]
    code: 201
    input: ["student_id", "provider_id", "visit_type", "scheduled_start", "scheduled_end"]
    output: Appointment
    side_effects: ["status = BOOKED; cancel_reason = NONE"]
  - method: GET
    path: "/shc/appointments"
    description: "List appointments with filters"
    roles: [Any]
    code: 200
    input: ["student_id?", "provider_id?", "date?", "status?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/shc/appointments/{id}"
    description: "Get an appointment"
    roles: [Any]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/shc/appointments/{id}/check-in"
    description: "Check in a booked appointment; creates the linked Encounter (OPEN)"
    roles: [FrontDeskStaff]
    code: 201
    input: []
    output: Encounter
    side_effects: ["Appointment BOOKED -> CHECKED_IN; Encounter created OPEN"]
  - method: POST
    path: "/shc/appointments/{id}/cancel"
    description: "Cancel a booked appointment (Student may only cancel own); frees triage quota"
    roles: [Student, FrontDeskStaff]
    code: 200
    input: []
    output: Appointment
    side_effects: ["BOOKED -> CANCELLED; cancel_reason = CLIENT"]

  # --- Encounters ---
  - method: GET
    path: "/shc/encounters"
    description: "List encounters with filters"
    roles: [Any]
    code: 200
    input: ["appointment_id?", "student_id?", "provider_id?", "status?"]
    output: "Encounter[]"
    side_effects: []
  - method: GET
    path: "/shc/encounters/{id}"
    description: "Get an encounter"
    roles: [Any]
    code: 200
    input: []
    output: Encounter
    side_effects: []
  - method: POST
    path: "/shc/encounters/{id}/close"
    description: "Close an encounter. Requires prescriptions terminal, lab orders REVIEWED, billing coded (invoice exists) for chargeable encounters; clearance_outcome CLEARED additionally requires student posture CLEAR. Fee-covered encounters close without an invoice and debit the OPEN pool 12000 cents."
    roles: [Clinician]
    code: 200
    input: ["clearance_outcome?"]
    output: Encounter
    side_effects: ["Encounter OPEN -> CLOSED; Appointment CHECKED_IN -> COMPLETED; fee-covered: HealthFeePool.spent_cents += 12000"]

  # --- Pharmacy ---
  - method: POST
    path: "/shc/encounters/{id}/prescriptions"
    description: "Write a prescription on an OPEN encounter"
    roles: [Clinician]
    code: 201
    input: ["medication_stock_id", "quantity"]
    output: Prescription
    side_effects: ["status = WRITTEN; quantity_dispensed = 0"]
  - method: GET
    path: "/shc/prescriptions"
    description: "List prescriptions with filters"
    roles: [Any]
    code: 200
    input: ["encounter_id?", "medication_stock_id?", "status?"]
    output: "Prescription[]"
    side_effects: []
  - method: GET
    path: "/shc/prescriptions/{id}"
    description: "Get a prescription"
    roles: [Any]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: POST
    path: "/shc/prescriptions/{id}/dispense"
    description: "Dispense units against a prescription; decrements stock and recomputes needs_reorder"
    roles: [Pharmacist]
    code: 200
    input: ["quantity"]
    output: Prescription
    side_effects: ["quantity_dispensed += quantity; MedicationStock.on_hand -= quantity; needs_reorder recomputed (on_hand <= reorder_threshold)"]
  - method: POST
    path: "/shc/prescriptions/{id}/cancel"
    description: "Cancel a WRITTEN prescription (never dispensed)"
    roles: [Clinician]
    code: 200
    input: []
    output: Prescription
    side_effects: ["WRITTEN -> CANCELLED"]
  - method: POST
    path: "/shc/medication-stocks"
    description: "Create a medication stock item"
    roles: [Pharmacist]
    code: 201
    input: ["medication_code", "medication_name", "initial_on_hand", "reorder_threshold"]
    output: MedicationStock
    side_effects: ["on_hand = initial_on_hand; needs_reorder computed"]
  - method: GET
    path: "/shc/medication-stocks"
    description: "List medication stock"
    roles: [Any]
    code: 200
    input: ["medication_code?"]
    output: "MedicationStock[]"
    side_effects: []
  - method: POST
    path: "/shc/medication-stocks/{id}/restock"
    description: "Restock units; recomputes needs_reorder"
    roles: [Pharmacist]
    code: 200
    input: ["quantity"]
    output: MedicationStock
    side_effects: ["on_hand += quantity; needs_reorder recomputed"]

  # --- Lab services ---
  - method: POST
    path: "/shc/encounters/{id}/lab-orders"
    description: "Order a lab test on an OPEN encounter"
    roles: [Clinician]
    code: 201
    input: ["test_code", "reportable_disease_code?"]
    output: LabOrder
    side_effects: ["status = ORDERED"]
  - method: GET
    path: "/shc/encounters/{id}/lab-orders"
    description: "List an encounter's lab orders (reverse reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "LabOrder[]"
    side_effects: []
  - method: GET
    path: "/shc/lab-orders/{id}"
    description: "Get a lab order"
    roles: [Any]
    code: 200
    input: []
    output: LabOrder
    side_effects: []
  - method: POST
    path: "/shc/lab-orders/{id}/collect"
    description: "Collect the sample"
    roles: [Nurse]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["ORDERED -> SAMPLE_COLLECTED"]
  - method: POST
    path: "/shc/lab-orders/{id}/result"
    description: "Enter the result; when flags_reportable and a reportable_disease_code is set, a DiseaseCase (SUSPECTED) is auto-created"
    roles: [Nurse]
    code: 200
    input: ["result_summary", "flags_reportable"]
    output: LabOrder
    side_effects: ["SAMPLE_COLLECTED -> RESULTED; result fields stored; conditional DiseaseCase creation"]
  - method: POST
    path: "/shc/lab-orders/{id}/review"
    description: "Clinician reviews the result"
    roles: [Clinician]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["RESULTED -> REVIEWED"]

  # --- Communicable disease & outbreak ---
  - method: GET
    path: "/shc/disease-cases"
    description: "List disease cases with filters"
    roles: [Any]
    code: 200
    input: ["student_id?", "disease_code?", "status?"]
    output: "DiseaseCase[]"
    side_effects: []
  - method: GET
    path: "/shc/disease-cases/{id}"
    description: "Get a disease case"
    roles: [Any]
    code: 200
    input: []
    output: DiseaseCase
    side_effects: []
  - method: GET
    path: "/shc/lab-orders/{id}/disease-cases"
    description: "List disease cases originating from a lab order (reverse reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "DiseaseCase[]"
    side_effects: []
  - method: POST
    path: "/shc/disease-cases/{id}/confirm"
    description: "Confirm a suspected case; evaluates the rolling outbreak threshold and may auto-open/reopen an OutbreakInvestigation (auto-open debits the OPEN pool 25000 cents)"
    roles: [Clinician]
    code: 200
    input: []
    output: DiseaseCase
    side_effects: ["SUSPECTED -> CONFIRMED; confirmed_at/confirmed_by set; outbreak threshold evaluation per calculations.outbreak_case_count"]
  - method: POST
    path: "/shc/disease-cases/{id}/report"
    description: "Report a confirmed case to public health within 24h of confirmation; reporter must differ from confirmer (segregation of duties)"
    roles: [HealthAdmin]
    code: 200
    input: []
    output: DiseaseCase
    side_effects: ["CONFIRMED -> REPORTED; reported_at/reported_by set"]
  - method: POST
    path: "/shc/disease-cases/{id}/resolve"
    description: "Resolve a confirmed/reported case"
    roles: [Clinician]
    code: 200
    input: []
    output: DiseaseCase
    side_effects: ["-> RESOLVED"]
  - method: GET
    path: "/shc/outbreak-investigations"
    description: "List outbreak investigations with filters"
    roles: [Any]
    code: 200
    input: ["disease_code?", "status?"]
    output: "OutbreakInvestigation[]"
    side_effects: []
  - method: POST
    path: "/shc/outbreak-investigations/{id}/contain"
    description: "Mark an ACTIVE outbreak contained"
    roles: [HealthAdmin]
    code: 200
    input: []
    output: OutbreakInvestigation
    side_effects: ["ACTIVE -> CONTAINED"]
  - method: POST
    path: "/shc/outbreak-investigations/{id}/reopen"
    description: "Reopen a CONTAINED outbreak (relapse cycle)"
    roles: [HealthAdmin]
    code: 200
    input: []
    output: OutbreakInvestigation
    side_effects: ["CONTAINED -> ACTIVE"]
  - method: POST
    path: "/shc/outbreak-investigations/{id}/close"
    description: "Close a CONTAINED outbreak; requires zero unresolved cases for the disease"
    roles: [HealthAdmin]
    code: 200
    input: []
    output: OutbreakInvestigation
    side_effects: ["CONTAINED -> CLOSED"]

  # --- Billing ---
  - method: POST
    path: "/shc/encounters/{id}/invoice"
    description: "Generate the invoice for a chargeable OPEN encounter (exactly one per encounter). Computes per-line subsidies (rounded per line then summed), the pool waterfall, and the PROVISIONAL payer split (patient pays all)."
    roles: [BillingOfficer]
    code: 201
    input: ["lines"]
    output: Invoice
    side_effects: ["status = DRAFT; variant = PROVISIONAL; pool subsidy debited at creation per calculations.pool_subsidy_waterfall"]
  - method: GET
    path: "/shc/invoices"
    description: "List invoices with filters"
    roles: [Any]
    code: 200
    input: ["student_id?", "encounter_id?", "status?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/shc/invoices/{id}"
    description: "Get an invoice"
    roles: [Any]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/shc/invoices/{id}/issue"
    description: "Issue a DRAFT invoice: recomputes the FINAL payer split (adjudicated when a VERIFIED policy exists, else self-pay), sets due_date = date(now) + 30 days, applies deductible accumulation"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT -> ISSUED; variant -> FINAL; balance_cents = patient_responsibility_cents"]
  - method: POST
    path: "/shc/invoices/{id}/payments"
    description: "Post a payment against an issued invoice"
    roles: [BillingOfficer]
    code: 201
    input: ["amount_cents", "method"]
    output: Payment
    side_effects: ["Payment POSTED; invoice balance/status recomputed; Student.compliance_posture recomputed (financial hold may release)"]
  - method: POST
    path: "/shc/payments/{id}/void"
    description: "Void a posted payment (compensating action)"
    roles: [BillingOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["POSTED -> VOIDED; invoice balance/status re-derived; posture recomputed"]
  - method: GET
    path: "/shc/invoices/{id}/payments"
    description: "List an invoice's payments (reverse reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "Payment[]"
    side_effects: []

  # --- After-hours referral ---
  - method: POST
    path: "/shc/encounters/{id}/referrals"
    description: "Initiate a hospital referral from an OPEN encounter. Business hours are [08:00, 17:00) UTC daily; outside them, a covering OnCallShift (shift_start <= now < shift_end, any provider) must exist or the referral is rejected with ERR_NO_ONCALL_COVERAGE."
    roles: [Clinician]
    code: 201
    input: ["hospital_name", "reason"]
    output: Referral
    side_effects: ["status = INITIATED; after_hours computed"]
  - method: POST
    path: "/shc/referrals/{id}/accept"
    description: "Mark the referral accepted by the hospital"
    roles: [Clinician]
    code: 200
    input: []
    output: Referral
    side_effects: ["INITIATED -> ACCEPTED"]
  - method: GET
    path: "/shc/encounters/{id}/referrals"
    description: "List an encounter's referrals (reverse reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "Referral[]"
    side_effects: []

  # --- Health fee funding ---
  - method: POST
    path: "/shc/health-fee-pools"
    description: "Open a term health-fee pool. At most one OPEN pool exists at any time; creating one while another is OPEN fails with ERR_DUPLICATE_POOL_TERM."
    roles: [HealthAdmin]
    code: 201
    input: ["term_code", "budget_cents", "term_end_date"]
    output: HealthFeePool
    side_effects: ["status = OPEN; spent_cents = 0; exhausted = false"]
  - method: GET
    path: "/shc/health-fee-pools"
    description: "List health-fee pools"
    roles: [Any]
    code: 200
    input: ["term_code?"]
    output: "HealthFeePool[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or Student actor acting on another student's appointment" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum value, clearance_outcome on a non-SPORTS_PHYSICAL encounter" }
  - { id: ERR_STALE_STUDENT_VERSION, http: 412, condition: "expected_student_version != Student.version on policy creation" }
  - { id: ERR_STALE_RECORD_VERSION, http: 412, condition: "expected_record_version != ImmunizationRecord.version on dose recording" }
  - { id: ERR_DUPLICATE_STUDENT_REF, http: 409, condition: "external_ref already registered" }
  - { id: ERR_DUPLICATE_REQUIREMENT, http: 409, condition: "vaccine_code already defined" }
  - { id: ERR_DUPLICATE_MEDICATION, http: 409, condition: "medication_code already exists" }
  - { id: ERR_DUPLICATE_POOL_TERM, http: 409, condition: "another HealthFeePool with status OPEN already exists (at most one OPEN pool at any time)" }
  - { id: ERR_DUPLICATE_IMMUNIZATION_RECORD, http: 409, condition: "a non-terminal record already exists for (student_id, requirement_id)" }
  - { id: ERR_POLICY_NOT_UNVERIFIED, http: 409, condition: "verify requires status UNVERIFIED" }
  - { id: ERR_POLICY_EXPIRED, http: 422, condition: "coverage_end < current logical time at verify" }
  - { id: ERR_POLICY_NOT_ELIGIBLE, http: 422, condition: "STUDENT_PLAN policy for a student whose enrollment_status != ENROLLED" }
  - { id: ERR_RECORD_NOT_DOSEABLE, http: 409, condition: "dose or exemption on a record in IN_COMPLIANCE or EXEMPTED" }
  - { id: ERR_DOSE_INTERVAL_VIOLATION, http: 422, condition: "dose_date < previous dose_date + min_interval_days" }
  - { id: ERR_DOSE_DATE_IN_FUTURE, http: 422, condition: "dose_date > current logical date" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end <= start (appointment, policy coverage, on-call shift)" }
  - { id: ERR_APPOINTMENT_IN_PAST, http: 422, condition: "scheduled_start <= current logical time" }
  - { id: ERR_SAME_DAY_ONLY, http: 422, condition: "SAME_DAY_TRIAGE appointment not scheduled on the current date" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "provider already has a BOOKED/CHECKED_IN appointment overlapping [start, end) (half-open; adjacency allowed)" }
  - { id: ERR_TRIAGE_QUOTA_EXHAUSTED, http: 409, condition: "provider already has 4 BOOKED/CHECKED_IN SAME_DAY_TRIAGE appointments on that date" }
  - { id: ERR_COMPLIANCE_HOLD_ACTIVE, http: 403, condition: "elective booking (SPORTS_PHYSICAL/TRAVEL_CLINIC) while posture == REGISTRATION_HOLD" }
  - { id: ERR_INSURANCE_NOT_VERIFIED, http: 402, condition: "TRAVEL_CLINIC booking without a VERIFIED policy for the student" }
  - { id: ERR_APPOINTMENT_NOT_BOOKED, http: 409, condition: "check-in requires status BOOKED" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires status BOOKED" }
  - { id: ERR_ENCOUNTER_NOT_OPEN, http: 409, condition: "child creation or close requires encounter OPEN" }
  - { id: ERR_BILLING_NOT_CODED, http: 409, condition: "closing a chargeable encounter with no invoice" }
  - { id: ERR_UNRESOLVED_CLINICAL_WORK, http: 409, condition: "closing with a prescription not in {DISPENSED, CANCELLED} or a lab order not REVIEWED" }
  - { id: ERR_CLEARANCE_BLOCKED, http: 403, condition: "clearance_outcome CLEARED requires student posture CLEAR" }
  - { id: ERR_INVOICE_NOT_ALLOWED, http: 409, condition: "invoice generation for a fee-covered encounter" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "dispense quantity > MedicationStock.on_hand" }
  - { id: ERR_DISPENSE_QUANTITY_EXCEEDS, http: 422, condition: "dispense quantity > remaining prescribed units" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "quantity/amount <= 0 (prescribe, dispense, restock, payment)" }
  - { id: ERR_PRESCRIPTION_NOT_DISPENSABLE, http: 409, condition: "dispense requires status WRITTEN or PARTIALLY_DISPENSED" }
  - { id: ERR_PRESCRIPTION_NOT_CANCELLABLE, http: 409, condition: "cancel requires status WRITTEN" }
  - { id: ERR_LAB_ORDER_NOT_ORDERED, http: 409, condition: "collect requires status ORDERED" }
  - { id: ERR_LAB_ORDER_NOT_COLLECTED, http: 409, condition: "result requires status SAMPLE_COLLECTED" }
  - { id: ERR_LAB_ORDER_NOT_RESULTED, http: 409, condition: "review requires status RESULTED" }
  - { id: ERR_REPORTABLE_CODE_REQUIRED, http: 422, condition: "flags_reportable true but the order has no reportable_disease_code" }
  - { id: ERR_CASE_NOT_CONFIRMABLE, http: 409, condition: "confirm requires status SUSPECTED" }
  - { id: ERR_CASE_NOT_REPORTABLE, http: 409, condition: "report requires status CONFIRMED" }
  - { id: ERR_REPORT_WINDOW_EXPIRED, http: 403, condition: "now > confirmed_at + 24h" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "case reporter X-User-ID equals confirmed_by_user_id" }
  - { id: ERR_CASE_NOT_RESOLVABLE, http: 409, condition: "resolve requires status CONFIRMED or REPORTED" }
  - { id: ERR_OUTBREAK_NOT_ACTIVE, http: 409, condition: "contain requires status ACTIVE" }
  - { id: ERR_OUTBREAK_NOT_CONTAINED, http: 409, condition: "reopen/close requires status CONTAINED" }
  - { id: ERR_OUTBREAK_UNRESOLVED_CASES, http: 409, condition: "close while cases in {SUSPECTED, CONFIRMED, REPORTED} exist for the disease_code" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "an invoice already exists for the encounter" }
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "issue requires status DRAFT" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "payment requires status ISSUED, PARTIALLY_PAID, or OVERDUE" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "payment amount_cents > balance_cents" }
  - { id: ERR_PAYMENT_NOT_VOIDABLE, http: 409, condition: "void requires status POSTED" }
  - { id: ERR_NO_ONCALL_COVERAGE, http: 409, condition: "after-hours referral with no covering OnCallShift" }
  - { id: ERR_REFERRAL_NOT_INITIATED, http: 409, condition: "accept requires status INITIATED" }
  - { id: ERR_ONCALL_OVERLAP, http: 409, condition: "on-call shift overlaps another shift of the same provider (closed-interval; adjacency conflicts)" }
  - { id: ERR_ONCALL_REST_VIOLATION, http: 409, condition: "less than 12 hours between two shifts of the same provider (exactly 12h allowed)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Patient portal user; may only act on own appointments"
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /shc/appointments — book for self (student_id == X-User-ID)"
      - "POST /shc/appointments/{id}/cancel — cancel own"
  - name: FrontDeskStaff
    description: "Front-desk operator for scheduling and check-in"
    identity: opaque
    exclusive_operations:
      - "POST /shc/appointments/{id}/check-in"
    shared_operations:
      - "POST /shc/appointments — book for any student"
      - "POST /shc/appointments/{id}/cancel — cancel any"
  - name: Nurse
    description: "Nurse: immunization records/doses, lab sample collection and results"
    identity: opaque
    exclusive_operations:
      - "POST /shc/immunization-records"
      - "POST /shc/immunization-records/{id}/doses"
      - "POST /shc/lab-orders/{id}/collect"
      - "POST /shc/lab-orders/{id}/result"
  - name: Clinician
    description: "Physician/NP: clinical documentation, prescriptions, exemptions, case confirmation/resolution, referrals"
    identity: opaque
    exclusive_operations:
      - "POST /shc/immunization-records/{id}/exempt"
      - "POST /shc/encounters/{id}/close"
      - "POST /shc/encounters/{id}/prescriptions"
      - "POST /shc/prescriptions/{id}/cancel"
      - "POST /shc/encounters/{id}/lab-orders"
      - "POST /shc/lab-orders/{id}/review"
      - "POST /shc/disease-cases/{id}/confirm"
      - "POST /shc/disease-cases/{id}/resolve"
      - "POST /shc/encounters/{id}/referrals"
      - "POST /shc/referrals/{id}/accept"
  - name: Pharmacist
    description: "Pharmacy operator: stock management and dispensing"
    identity: opaque
    exclusive_operations:
      - "POST /shc/medication-stocks"
      - "POST /shc/medication-stocks/{id}/restock"
      - "POST /shc/prescriptions/{id}/dispense"
  - name: BillingOfficer
    description: "Business office: insurance eligibility, invoicing, payments"
    identity: opaque
    exclusive_operations:
      - "POST /shc/insurance-policies"
      - "POST /shc/insurance-policies/{id}/verify"
      - "POST /shc/encounters/{id}/invoice"
      - "POST /shc/invoices/{id}/issue"
      - "POST /shc/invoices/{id}/payments"
      - "POST /shc/payments/{id}/void"
  - name: HealthAdmin
    description: "Health center administrator: configuration, compliance reporting, outbreak management, on-call scheduling, pools, clock"
    identity: opaque
    exclusive_operations:
      - "POST /shc/_clock/set_current_utc"
      - "POST /shc/students"
      - "POST /shc/immunization-requirements"
      - "POST /shc/providers"
      - "POST /shc/on-call-shifts"
      - "POST /shc/disease-cases/{id}/report"
      - "POST /shc/outbreak-investigations/{id}/contain | reopen | close"
      - "POST /shc/health-fee-pools"
  - name: Any
    description: "Pseudo-role: any authenticated role may use GET endpoints"
    identity: opaque
    shared_operations:
      - "All GET endpoints"
