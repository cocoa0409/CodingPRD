            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior One", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior Two", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc2_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Enrollment lane probe", summary: "Probe the enrollment lane.", requested_sections_count: 1, target_code_chapter: "Title 7", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /drafting-requests/${dr_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-01T06:00:00Z", engagement_end_utc: "2026-09-01T12:00:00Z" }
