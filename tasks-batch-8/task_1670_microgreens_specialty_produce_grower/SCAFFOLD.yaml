# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or type mismatch" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer_id does not exist" }
  - { id: ERR_VARIETY_NOT_FOUND, http: 404, condition: "variety_id does not exist" }
  - { id: ERR_SEED_LOT_NOT_FOUND, http: 404, condition: "seed_lot_id does not exist" }
  - { id: ERR_GERMINATION_TEST_NOT_FOUND, http: 404, condition: "germination test id does not exist" }
  - { id: ERR_CROP_PLAN_NOT_FOUND, http: 404, condition: "crop plan id does not exist" }
  - { id: ERR_TRAY_BATCH_NOT_FOUND, http: 404, condition: "tray batch id does not exist" }
  - { id: ERR_STANDING_ORDER_NOT_FOUND, http: 404, condition: "standing order id does not exist" }
  - { id: ERR_ORDER_ITEM_NOT_FOUND, http: 404, condition: "order item id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "delivery route id does not exist" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "delivery stop id does not exist" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "spoilage credit id does not exist" }
  - { id: ERR_TRIAL_NOT_FOUND, http: 404, condition: "variety trial id does not exist" }
  - { id: ERR_FOOD_SAFETY_NOT_APPROVED, http: 409, condition: "Sow attempted while FoodSafetyPlan status != APPROVED" }
  - { id: ERR_SANITATION_NOT_LOGGED, http: 409, condition: "Harvest attempted with no SanitationLog for the batch" }
  - { id: ERR_SANITATION_FAILED, http: 409, condition: "SanitationLog has surface_swab_passed=false or wash_water_ppm outside [50,200]" }
  - { id: ERR_SEED_LOT_NOT_RELEASED, http: 409, condition: "Sow from a lot not in RELEASED status" }
  - { id: ERR_INSUFFICIENT_SEED, http: 409, condition: "seed_grams_required > seeds_on_hand_grams" }
  - { id: ERR_VARIETY_NOT_LISTED, http: 409, condition: "Order line references a variety whose stage != LISTED" }
  - { id: ERR_WEEKLY_CHANGE_LOCKED, http: 409, condition: "Line change attempted after change_cutoff_day (order LOCKED)" }
  - { id: ERR_ORDER_NOT_EDITABLE, http: 409, condition: "Order not in DRAFT/CONFIRMED for line edits" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Confirm attempted with zero order lines" }
  - { id: ERR_EMPTY_ROUTE, http: 409, condition: "Dispatch attempted with no SCHEDULED stops" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "deliver attempted while route status != DISPATCHED" }
  - { id: ERR_BATCH_NOT_READY, http: 409, condition: "harvest attempted while batch status != READY" }
  - { id: ERR_CREDIT_EXCEEDS_DELIVERY, http: 422, condition: "credit_qty_kg exceeds delivered quantity of the order item" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version (OCC)" }
  - { id: ERR_TRIAL_CRITERIA_NOT_MET, http: 409, condition: "ADOPT attempted with avg_flavor_score < 6.0 or yield_score < 5.0" }
  - { id: ERR_VARIETY_IN_USE, http: 409, condition: "Retire attempted while PLANNED/ALLOCATED order lines reference the variety" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grower
    description: "Owns grow operations: varieties, trials, seed lots, crop plans, tray batches, harvest, surplus"
    identity: "opaque"
    exclusive_operations:
      - "POST /grow/varieties, /grow/varieties/{id}/retire"
      - "POST /grow/variety-trials, record-panel, decide"
      - "POST /grow/seed-lots, /grow/germination-tests, record-result"
      - "POST /grow/crop-plans, sow, cancel"
      - "POST /grow/tray-batches/{id}/advance, harvest"
      - "POST /grow/sanitation-logs"
      - "POST /grow/surplus-listings, sell, withdraw"
    shared_operations:
      - "GET on all grow + order + credit resources"
  - name: Chef
    description: "Owns ordering: creates standing orders, weekly line changes, confirms, cancels; reports spoilage"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /grow/standing-orders"
      - "POST /grow/standing-orders/{id}/lines, confirm, cancel"
    shared_operations:
      - "GET on customers, varieties, standing orders, order items, spoilage credits"
      - "POST /grow/spoilage-credits (report)"
  - name: OpsManager
    description: "Owns compliance, food-safety plans, delivery routes, credit approval, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /grow/customers"
      - "POST /grow/food-safety-plans, approve, suspend"
      - "POST /grow/delivery-routes, stops, dispatch, complete"
      - "POST /grow/delivery-stops/{id}/deliver, skip"
      - "POST /grow/spoilage-credits/{id}/approve, reject"
      - "POST /grow/_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"
