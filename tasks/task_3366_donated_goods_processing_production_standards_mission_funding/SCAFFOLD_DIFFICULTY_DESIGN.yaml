              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { blocked_err: $.data.error_id }
            - call: "POST /donated-goods/workforce-contracts/${con_id}/reviews"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /donated-goods/milestones/${m1}/attest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "attestation during UNDER_REVIEW fails with ERR_INVALID_STATE (${blocked_err})"
            - "review CLOSE finds no overdue milestone (target 2026-12-01 > clock) and returns the contract to ACTIVE"
            - "the retry attests: milestone ATTESTED, contract.attested_payout_cents == 50000"
            - "GET /donated-goods/member-orgs/${org_id} shows contract_revenue_cents == 50000 (separate ledger, retail pool untouched)"
            - "the contract auto-CLOSED (last PENDING milestone became terminal)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: territory_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors.ERR_TERRITORY_WINDOW_OVERLAP
          - entities.Territory
        distinguishing_aspect: |
          Territory resource uses HALF-OPEN [effective_from, effective_to) semantics:
          a window beginning exactly when another org's window for the same region
          ends is adjacency, not overlap, while a window crossing into it collides.
        test_recipe:
          setup:
            - "Two orgs A and B. A holds region PNW-N for [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org TA", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { orga: $.data.id }
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org TB", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { orgb: $.data.id }
            - call: "POST /donated-goods/territories"
              payload: { member_org_id: "${orga}", region_code: "PNW-N", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BrandRegulator
          trigger:
            - call: "POST /donated-goods/territories"
              payload: { member_org_id: "${orgb}", region_code: "PNW-N", effective_from: "2027-01-01T00:00:00Z" }
              as: BrandRegulator
              captures: { t2: $.data.id }
            - call: "POST /donated-goods/territories"
              payload: { member_org_id: "${orgb}", region_code: "PNW-N", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BrandRegulator
              captures: { overlap_err: $.data.error_id }
          assert:
            - "the adjacent assignment (from == other's to) is accepted with 201 (Territory.${t2} created, open-ended)"
            - "the crossing assignment is rejected with ERR_TERRITORY_WINDOW_OVERLAP (${overlap_err})"

      - name: contract_closed_interval_touching
        grounds:
          - validations[priority=13]
          - errors.ERR_CONTRACT_WINDOW_OVERLAP
          - entities.WorkforceContract
        distinguishing_aspect: |
          WorkforceContract resource uses CLOSED [start_date, end_date] semantics —
          the opposite treatment of adjacency from instance 1: a contract starting on
          the exact end_date of a same-agency contract DOES overlap, and only a start
          strictly after the end date is accepted.
        test_recipe:
          setup:
            - "One org holds agency DOL contract for [2026-03-01, 2026-06-30] (closed interval) with one milestone."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org CW", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-03-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z", contract_value_cents: 100000, enrolled_headcount: 20, milestones: [{ description: "M1", target_date: "2026-06-01T00:00:00Z", min_headcount: 10, payout_cents: 25000 }] }
              as: ContractManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-06-30T00:00:00Z", end_date: "2026-09-30T00:00:00Z", contract_value_cents: 80000, enrolled_headcount: 15, milestones: [{ description: "M1", target_date: "2026-09-01T00:00:00Z", min_headcount: 10, payout_cents: 20000 }] }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { touch_err: $.data.error_id }
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-07-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z", contract_value_cents: 80000, enrolled_headcount: 15, milestones: [{ description: "M1", target_date: "2026-09-01T00:00:00Z", min_headcount: 10, payout_cents: 20000 }] }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { c3: $.data.id }
          assert:
            - "the touching window (start 2026-06-30 == other's end 2026-06-30) is rejected with ERR_CONTRACT_WINDOW_OVERLAP (${touch_err})"
            - "the next-day window (start 2026-07-01) is accepted with 201 (WorkforceContract.${c3} created)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: approve_then_cancel_conserves_available_margin
        grounds:
          - state_machines.FundingAllocation.PENDING_to_APPROVED
          - state_machines.FundingAllocation.APPROVED_to_CANCELLED
          - entities.MemberOrg.fields.reserved_cents
        distinguishing_aspect: |
          Conserved quantity is AVAILABLE MARGIN (retail_margin_pool_cents -
          reserved_cents): approve reserves 500 against a 970 pool (available 470),
          and the compensating cancel releases exactly that reservation, returning
          available to 970 with the pool itself never touched.
        test_recipe:
          setup:
            - "Clock default. Org (reserve_floor 0) with pool exactly 970 (one grade-A item sold: price 1000 - STANDARD cost 30). Program inside window. Allocation of 500 created."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Inv", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site I", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v0}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DI", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 5 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${it}/sell"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog", program_type: "SUPPORT", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { org_v1: $.data.version }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 500, expected_member_org_version: "${org_v1}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/approve"
              payload: {}
              as: MemberCFO
              as_user_id: "cfo-1"
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/cancel"
              payload: {}
              as: MemberCFO
              as_user_id: "cfo-1"
          assert:
            - "after approve: reserved_cents == 500 and retail_margin_pool_cents == 970 (available 470)"
            - "after cancel: reserved_cents == 0 and retail_margin_pool_cents == 970 (available 970 — identical to pre-approve)"
            - "FundingAllocation.${alloc_id}.status == CANCELLED"

      - name: review_cycle_conserves_attested_ledger
        grounds:
          - state_machines.WorkforceContract.ACTIVE_to_UNDER_REVIEW
          - state_machines.WorkforceContract.UNDER_REVIEW_to_ACTIVE
          - state_machines.ContractMilestone.PENDING_to_ATTESTED
          - entities.WorkforceContract.fields.attested_payout_cents
        distinguishing_aspect: |
          Conserved quantity is the ATTESTATION LEDGER (a different quantity from
          instance 1's margin): a review OPEN+CLOSE cycle with no overdue milestones
          must leave attested_payout_cents, org.contract_revenue_cents and the
          per-milestone statuses exactly as the attestation left them.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Org with a contract (headcount 50) holding two milestones, both due 2026-12-01 (after the clock): M1 attested for 50000, M2 still PENDING."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Led", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-03-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", contract_value_cents: 200000, enrolled_headcount: 50, milestones: [{ description: "M1", target_date: "2026-12-01T00:00:00Z", min_headcount: 40, payout_cents: 50000 }, { description: "M2", target_date: "2026-12-01T00:00:00Z", min_headcount: 40, payout_cents: 30000 }] }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { con_id: $.data.id }
            - call: "GET /donated-goods/milestones"
              payload: { contract_id: "${con_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { m1: $.data.0.id, m2: $.data.1.id }
            - call: "POST /donated-goods/milestones/${m1}/attest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          trigger:
            - call: "POST /donated-goods/workforce-contracts/${con_id}/reviews"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /donated-goods/workforce-contracts/${con_id}/reviews"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "after the OPEN+CLOSE cycle: contract.attested_payout_cents == 50000 (unchanged by the cycle)"
            - "GET /donated-goods/member-orgs/${org_id} shows contract_revenue_cents == 50000 (unchanged)"
            - "ContractMilestone.${m1} remains ATTESTED and ContractMilestone.${m2} remains PENDING (no sweep: both targets 2026-12-01 are after the clock)"
            - "contract is ACTIVE again (not CLOSED — M2 is still PENDING)"
