  # -----------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # -----------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: book_gated_on_estimate_acceptance
        grounds:
          - state_machines.MoveOrder.REGISTERED_to_BOOKED
          - errors[ERR_NO_ACCEPTED_ESTIMATE]
          - calculations.delivery_spread_window
        distinguishing_aspect: |
          Entity pair MoveOrder x Estimate: the order's REGISTERED -> BOOKED transition is gated on a DIFFERENT
          entity (an ACCEPTED Estimate of matching kind); while the estimate languishes ISSUED the book fails,
          and only the estimate's acceptance unblocks it (which then also computes the spread window).
        test_recipe:
          setup:
            - "Order REGISTERED: valuation ELECTED, estimate ISSUED but not accepted, all three non-booking assignments CONFIRMED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /agents", payload: { legal_name: "Booking Co", agent_code: "BK13", capabilities: ["BOOKING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_b: $.data.id } }
