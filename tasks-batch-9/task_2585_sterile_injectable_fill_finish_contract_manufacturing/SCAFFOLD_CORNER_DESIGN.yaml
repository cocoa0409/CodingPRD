            - "response.data.fee_cents == 485000 and response.data.released_unit_count == 8750"
            - "BatchOrder.${batch_id}.quality_status == RELEASED"

      - name: media_fill_minimum_units_boundary_and_one_hundred_eighty_three_day_validity
        claim_type: threshold
        grounds:
          - calculations.media_fill_outcome
          - validations[priority=65]
          - errors[ERR_MEDIA_FILL_UNDERSIZED]
        distinguishing_aspect: "MEDIA_FILL_MIN_UNITS is an inclusive floor: 4999 units is rejected with ERR_MEDIA_FILL_UNDERSIZED (422) while exactly 5000 is accepted, and the PASSED readout stamps media_fill_valid_until as the readout instant plus exactly MEDIA_FILL_VALIDITY_DAYS = 183 days, i.e. 2026-09-01 -> 2027-03-03."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FS-1 grade B with one SCHEDULED media fill MF-1 and no prior qualification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
          trigger:
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 4999, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 5000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
          assert:
            - "trigger call 1: HTTP 422 with error.id == 'ERR_MEDIA_FILL_UNDERSIZED'; MediaFill.${mf1_id}.status == SCHEDULED"
            - "trigger call 2: MediaFill.${mf1_id}.status == INCUBATING and units_filled == 5000"
            - "trigger call 3: MediaFill.${mf1_id}.status == PASSED"
            - "FillingSuite.${suite_id}.aseptic_qualification_status == QUALIFIED"
            - "FillingSuite.${suite_id}.media_fill_valid_until == '2027-03-03T00:00:00Z'"
            - "FillingSuite.${suite_id}.posture == RESTRICTED — qualified_operator_count is still 0, below MIN_QUALIFIED_OPERATORS"

      - name: readiness_operator_partial_credit_uses_the_lenient_forecast_population
        claim_type: constants_applied
        grounds:
          - calculations.project_readiness_score.constants
          - endpoints[GET /client-projects/{id}/readiness-assessment]
        distinguishing_aspect: "With a single PENDING gowning qualification the INTAKE_FORECAST variant counts it (its population is status IN {PENDING, QUALIFIED, LAPSED} and it ignores expires_on) and awards partial credit round_half_up(20 * 1 / MIN_QUALIFIED_OPERATORS) = 10, while tech, analytical and aseptic all score 0 — total 10, not 20 and not 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FS-1 grade B with NO media fill (aseptic_qualification_status NOT_QUALIFIED)."
            - "Sponsor A in INTAKE with tech_transfer_stage NOT_STARTED and analytical_method_transfer_status NOT_STARTED; exactly one PENDING GOWNING qualification for OP-A in FS-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "GOWNING", expires_on: "2027-06-01T00:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
          trigger:
            - call: "GET /client-projects/${proj_id}/readiness-assessment"
              payload: { variant: "INTAKE_FORECAST" }
              as: ProgramManager
          assert:
            - "HTTP status == 200"
            - "response.data.variant == 'INTAKE_FORECAST'"
            - "response.data.tech_points == 0 and response.data.analytical_points == 0 and response.data.aseptic_points == 0"
            - "response.data.counted_operator_count == 1 and response.data.operator_points == 10"
            - "response.data.readiness_score == 10"
            - "response.data.assessed_at == '2026-09-01T00:00:00Z'"

      - name: changeover_selector_falls_back_then_applies_the_product_change_buffer
        claim_type: correct_result
        grounds:
          - calculations.changeover_minutes_applied
          - calculations.suite_committed_minutes
          - entities.BatchOrder.fields.changeover_minutes_applied
        distinguishing_aspect: "The first batch in an empty suite has no candidate predecessor and takes SUITE_INITIAL_SETUP_MINUTES = 60; the next batch, whose project runs a different molecule, takes changeover_minutes_product_change = 240 rather than the 60-minute same-product buffer, so committed_minutes becomes 540 + (240 + 240) = 1020."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FS-1 QUALIFIED with OP-A and OP-B QUALIFIED; changeover_minutes_same_product 60 and changeover_minutes_product_change 240."
            - "Sponsor A (MOL-A) is ACTIVE and owns B-001 on 2026-09-10 08:00-16:00. Sponsor B runs MOL-B and is also ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
