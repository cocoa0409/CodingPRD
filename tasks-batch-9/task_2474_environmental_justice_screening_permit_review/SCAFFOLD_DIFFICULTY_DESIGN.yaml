        grounds:
          - state_machines.PermitApplication.PENDING_DECISION_to_RETURNED_FOR_REVISION
          - state_machines.PermitApplication.RETURNED_FOR_REVISION_to_SUBMITTED
          - state_machines.PermitApplication.SUBMITTED_to_ENHANCED_REVIEW
          - state_machines.ParticipationPlan.CLOSED_to_OPEN
          - state_machines.CumulativeImpactAssessment.ACCEPTED_to_INVALIDATED
          - state_machines.CumulativeImpactAssessment.INVALIDATED_to_VOIDED
