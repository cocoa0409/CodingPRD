            - call: "POST /library/_ops/run"
              payload: {}
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan_id}" }
              as: Coordinator
              captures: { fee_id: "$.data[0].id" }
          trigger:
