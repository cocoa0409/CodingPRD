          assert:
            - "${e_disc} == ERR_DISCLOSURE_VERSION_UNSUPPORTED with HTTP 422 and RateCard.${card_old}.status stays DRAFT with published_at null"
            - "RateCard.${card_new} publishes to PUBLISHED with published_at 2026-08-01T00:00:00Z"
            - "both cards were created with HTTP 201 and identical buy_rate_micros 970600 / sell_rate_micros 878600: the gate never touches the derivation"
            - "${board_lines} == 1 and ${board_min} == 3: only the published card is on the board"
            - "the version-2 card was NOT superseded by the version-3 card, since supersession only truncates PUBLISHED incumbents; RateCard.${card_old}.superseded_by_rate_card_id is null"

      - name: quote_ttl_and_reversal_window_temporal_edges
        claim_type: temporal_validation
        grounds:
