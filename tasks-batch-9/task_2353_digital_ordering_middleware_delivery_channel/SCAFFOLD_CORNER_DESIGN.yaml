# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe) — task_2353
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN
# are emitted as `excluded_because:` stubs. Every literal below is pre-computed
# from §1.3.
#
# Shared shorthand used in `setup:` prose:
#   BASE = clock 2026-08-03T16:00:00Z; Channel MARKETMAX (MARKETPLACE, 1500 bps
#          NICKEL, svc 299, comm 2500, NET_MODE, HONOR_86, SUPPRESS_ON_THROTTLE,
#          CHANNEL_REVIEW); MenuVersion 2026-Q3-CORE finalized with BURGER
#          1099/875 and FRIES 399/875; Store S1 (offset -300, base_prep 12,
#          capacity 2, pos_retry_limit 2, tablet_backlog_threshold 1) with a
#          Monday 600..1320 hour window and the menu published.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: entity_store_creation_returns_system_defaults
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints["POST /stores"]
        distinguishing_aspect: "A brand-new Store starts PAUSED with every counter at 0 and no active menu; the caller supplies only configuration."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "GET /stores"
              payload: { limit: 10, offset: 0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
          assert:
            - "Response is 201 and Store.${store_id}.throttle_state == PAUSED"
            - "Store.${store_id}.open_order_count == 0, reserved_prep_slots == 0, tablet_backlog_count == 0"
            - "Store.${store_id}.active_menu_version_id == null and last_published_at == null"
            - "Store.${store_id}.version == 1 and id, created_at, updated_at are all present"
            - "The pre-trigger GET /stores returned total_count 0 and has_more false"

      - name: entity_courier_network_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.CourierNetwork
          - endpoints["POST /courier-networks"]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server for a common_fields entity; computed counters start at 0 even though the caller never mentions them."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /courier-networks"
              payload: { code: "N_FAST", name: "FastCourier", network_type: "COURIER", priority_rank: 1, per_delivery_fee_cents: 650, handoff_sla_seconds: 600, dispatch_buffer_seconds: 120, max_concurrent_assignments: 1 }
              as: PlatformAdmin
              captures: { net_id: "$.data.id", net_v: "$.data.version" }
          assert:
            - "Response is 201 with a server-minted id and created_at == 2026-08-03T16:00:00Z"
            - "CourierNetwork.${net_id}.version == 1"
            - "CourierNetwork.${net_id}.open_assignment_count == 0 and penalty_accrued_cents == 0"
            - "CourierNetwork.${net_id}.is_active == true (default applied because the field was omitted)"

      - name: entity_menu_item_delivery_eligible_defaults_true
        claim_type: Defaults
        grounds:
          - entities.MenuItem.fields.is_delivery_eligible
          - endpoints["POST /menu-versions/{id}/items"]
        distinguishing_aspect: "Omitting is_delivery_eligible yields true, while an explicit false is preserved; the two items sit in the same menu version."
        test_recipe:
          setup:
            - "A DRAFT MenuVersion for brand BRD1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
          trigger:
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
              captures: { item_burger_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "PLATTER", name: "Party Platter", base_price_cents: 46158, tax_bps: 0, is_delivery_eligible: false }
              as: PlatformAdmin
              captures: { item_platter_id: "$.data.id" }
          assert:
            - "MenuItem.${item_burger_id}.is_delivery_eligible == true"
            - "MenuItem.${item_platter_id}.is_delivery_eligible == false"
            - "MenuVersion.${mv_id}.item_count == 2 and state == DRAFT"

      - name: entity_channel_listing_price_computed_with_cent_rounding
        claim_type: Computed Fields
        grounds:
          - entities.ChannelListing.fields.price_cents
          - calculations.channel_listing_price
          - endpoints["GET /channel-listings"]
        distinguishing_aspect: "On a CENT-rounding channel with 800 bps markup the listing prices are 1187 and 431, which differ from the NICKEL channel's 1265 and 460 for the same base prices."
        test_recipe:
          setup:
            - "Channel AGGRPLUS (800 bps markup, CENT rounding) and Channel MARKETMAX (1500 bps markup, NICKEL rounding) both exist"
            - "MenuVersion 2026-Q3-CORE finalized with BURGER 1099 and FRIES 399"
            - "Store S1 has a Monday hour window and publishes that menu version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /channels"
              payload: { code: "AGGRPLUS", name: "AggrPlus", channel_type: "AGGREGATOR", markup_bps: 800, rounding_mode: "CENT", service_fee_cents: 149, commission_bps: 1800, settlement_mode: "GROSS_MODE", eighty_six_policy: "IGNORE_86", throttle_policy: "IGNORE_THROTTLE", adjustment_review_mode: "AUTO_ACCEPT", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_agg_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "GET /channel-listings"
              payload: { store_id: "${store_id}", channel_id: "${ch_agg_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
            - call: "GET /channel-listings"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "AGGRPLUS listings: BURGER price_cents == 1187 and FRIES price_cents == 431 (CENT rounding of 1099 x 1.08 and 399 x 1.08)"
            - "MARKETMAX listings: BURGER price_cents == 1265 and FRIES price_cents == 460 (NICKEL rounding of 1099 x 1.15 and 399 x 1.15)"
            - "Every listing has base_price_cents equal to the MenuItem base price (1099 or 399), suppressed == false, eighty_sixed == false and availability_state == AVAILABLE"
            - "Both list responses report total_count 2 and has_more false"

      - name: entity_store_hour_window_is_immutable_child
        claim_type: Immutability
        grounds:
          - entities.StoreHourWindow
          - endpoints["GET /stores/{id}/hour-windows"]
        distinguishing_aspect: "StoreHourWindow is declared common_fields false: the payload carries id and created_at but no version or updated_at, and §1.5 exposes no PATCH or DELETE for it."
        test_recipe:
          setup:
            - "Store S1 exists with no hour windows yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { win_id: "$.data.id" }
            - call: "GET /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, limit: 10, offset: 0 }
              as: StoreOperator
              as_user_id: "${store_id}"
          assert:
            - "StoreHourWindow.${win_id} carries id, created_at, store_id, day_of_week, opens_at_minute, closes_at_minute and window_minutes == 720"
            - "The response contains no version field and no updated_at field"
            - "The filtered list returns total_count 1 and its single element id == ${win_id}"
            - "No PATCH or DELETE endpoint for hour windows exists in the API surface"

      - name: entity_order_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints["GET /orders"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three orders and limit 2 the first page reports total_count 3 and has_more true, the second page returns the remaining order with has_more false, and the envelope always carries meta.api_request_id."
        test_recipe:
          setup:
            - "BASE, with prep_capacity_per_bucket 3 so three orders fit into bucket 44"
            - "Three PICKUP orders MP-1001, MP-1002 and MP-1003 exist, all PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 3, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1002", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o2_id: "$.data.id" }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1003", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o3_id: "$.data.id" }
          trigger:
            - call: "GET /orders"
              payload: { store_id: "${store_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /orders"
              payload: { store_id: "${store_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "First page: 2 elements, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: 1 element, total_count == 3, offset == 2, has_more == false"
            - "Both responses carry meta.api_request_id, meta.api_request_timestamp and response_type == array"
            - "The union of both pages is exactly {${o1_id}, ${o2_id}, ${o3_id}}"

      - name: entity_store_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_STORE_NOT_FOUND]
          - endpoints["GET /stores/{id}"]
        distinguishing_aspect: "A syntactically valid but unknown store id resolves to ERR_STORE_NOT_FOUND (404) rather than an empty 200 body."
        test_recipe:
          setup:
            - "One unrelated Store exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "GET /stores/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response is 404 with data.error_id == ERR_STORE_NOT_FOUND and a non-empty data.message"
            - "response_type == error and meta.api_request_id is present"
            - "GET /stores/${store_id} still returns 200, so the failure is id-specific"

      - name: entity_channel_missing_required_markup_rejected
        claim_type: Required Fields
        grounds:
          - endpoints["POST /channels"]
          - validations[priority=3]
        distinguishing_aspect: "markup_bps has source input with no default, so omitting it fails request-shape validation before any uniqueness or business rule is consulted."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "No Channel row is created, so a later well-formed POST /channels with the same code MARKETMAX succeeds with 201 instead of ERR_DUPLICATE_CHANNEL_CODE"

      - name: entity_order_invalid_enum_fulfillment_mode_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Order.fields.fulfillment_mode
          - validations[priority=3]
        distinguishing_aspect: "fulfillment_mode is constrained to DELIVERY | PICKUP, so DINE_IN is a 400 rather than a silently stored value; limit 0 on a list is likewise out of the 1..100 range."
        test_recipe:
          setup:
            - "BASE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "DINE_IN", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /orders"
              payload: { store_id: "${store_id}", limit: 0, offset: 0 }
              as: PlatformAdmin
          assert:
            - "The order attempt returns 400 ERR_INVALID_REQUEST and Store.${store_id}.open_order_count stays 0"
            - "The list call with limit 0 returns 400 ERR_INVALID_REQUEST because limit must be within 1..100"

      - name: entity_adjustment_parent_order_not_found_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Adjustment.fields.order_id
          - endpoints["POST /adjustments"]
        distinguishing_aspect: "The body foreign key order_id is resolved before OCC and before the fiscal ceiling, so an unknown order yields ERR_ORDER_NOT_FOUND even when the supplied version placeholder is well-formed."
        test_recipe:
          setup:
            - "BASE with one real order O1 injected ACCEPTED, whose current version is captured"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
            - call: "POST /orders/${o1_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "GET /orders/${o1_id}"
              payload: {}
              as: SettlementAnalyst
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /adjustments"
              payload: { order_id: "00000000-0000-0000-0000-000000000000", adjustment_type: "REFUND", amount_cents: 100, reason_code: "MISSING_ITEM", expected_order_version: "${o1_v}" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response is 404 with data.error_id == ERR_ORDER_NOT_FOUND"
            - "No Adjustment row exists: GET /adjustments with order_id ${o1_id} returns total_count 0"
            - "Order.${o1_id}.version is unchanged, proving no OCC bump happened"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: state_menu_version_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.MenuVersion.initial_DRAFT
          - endpoints["POST /menu-versions"]
        distinguishing_aspect: "A freshly created MenuVersion is DRAFT with item_count 0 and published_store_count 0; only finalize moves it to PUBLISHED."
        test_recipe:
          setup:
