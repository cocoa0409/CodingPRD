  - section: consistency_model
    instances:
      - name: immediate_consistency_of_cascade_in_same_read
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "All cascade side effects are atomic with the triggering request: the GET immediately following a plan completion shows updated recognized_fees_cents, anomaly REMEDIATED, and recomputed posture with no delay."
        test_recipe:
          setup: ["engagement IN_PROGRESS; MEDIUM anomaly VERIFIED; plan ISSUED (estimate 1800000)"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EIC", client_name: "C", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AIC", assembly_type: "MASONRY", design_u_factor: 1.0, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-01", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "MOISTURE_TRAP", severity: "MEDIUM", description: "wet" }
              as: Consultant
              captures: { an_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${an_id}/verify"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans"
              payload: { anomaly_ids: ["${an_id}"], spec_sections: ["07 01 00"], expected_engagement_version: "${eng_v}" }
              as: Consultant
              captures: { plan_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans/${plan_id}/issue"
              payload: { expected_engagement_version: "${eng_v2}" }
              as: Consultant
          trigger:
            - call: "POST /engagements/${eng_id}/remediation-plans/${plan_id}/complete"
              payload: {}
              as: Principal
            - call: "GET /engagements/${eng_id}/anomalies/${an_id}"
              payload: {}
              as: Consultant
              captures: { an_status: $.data.status }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Principal
              captures: { rec: $.data.recognized_fees_cents, posture: $.data.posture }
          assert:
            - "an_status == REMEDIATED (visible immediately)"
            - "rec == 1625000 (visible immediately)"
            - "posture == OPEN (all anomalies terminal, risk 100)"
