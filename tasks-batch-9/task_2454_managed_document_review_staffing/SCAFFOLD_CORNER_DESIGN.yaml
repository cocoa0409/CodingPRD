# §1.9 Scaffold Corner Design (Breadth Walk of the Claim-Extraction Guide)
# Task 2454 — Managed Document Review Staffing
#
# One instance per applicable row of references/claim-extraction-guide.md, walked
# section by section against §1.1–§1.7 of SCAFFOLD.yaml. Corners already asserted
# by a §1.8 instance appear as `excluded_because:` stubs that name it.
#
# The `&c_*` anchors below build the same core fixture the §1.8 file uses:
#   Client "Northwind Industries, Inc." (NY)
#   Matter 600 documents, deadline 2026-09-30T00:00:00Z, COMPLEX, PER_DOCUMENT at
#          150 c/doc, budget cap 600000, min_staffed_reviewers 1, onsite_seat_count 2
#   Protocol qc_sample_pct 0.10, privilege_sample_pct 0.20, max_discrepancy_pct 0.05,
#          min_pace_dph 55, second_level_required false
#   Reviewer A "Ada Ishikawa" (NY; EN, JA; ANTITRUST; FIRST_PASS; 5200 c/h)
#          effective FIRST_PASS rate 213 c/doc; Reviewer B "Ben Calder" SECOND_LEVEL
#          at 128 c/doc; Reviewer C "Cleo Marchetti" is the QC validator
scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:
      - name: matter_creation_echoes_declared_fields
        claim_type: creation
        grounds:
          - entities.Matter.fields.document_count
          - entities.Matter.fields.pricing_model
          - endpoints[POST /matters]
        distinguishing_aspect: "A matter created with every declared input field returns 201 and echoes each stored value, with status INTAKE, version 1 and unbatched_document_count seeded from document_count."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned at 2026-08-01T00:00:00Z"
            - "one Client exists"
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EngagementManager
            - &c_client
              call: "POST /clients"
              payload: { legal_name: "Northwind Industries, Inc.", primary_state: "NY" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
          trigger:
            - &c_matter
              call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Second Request"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "COMPLEX"
                required_languages: ["EN", "JA"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                hourly_rate_cents: 6500
                budget_cap_cents: 600000
                min_staffed_reviewers: 1
                onsite_seat_count: 2
                remote_work_permitted: true
              as: EngagementManager
              captures: { m_id: $.data.id, m_v1: $.data.version }
          assert:
            - "HTTP 201 and the envelope is { success: true, data: {...}, error_id: null, message: null }"
            - "response.data.document_count == 600, pricing_model == \"PER_DOCUMENT\", per_document_rate_cents == 150, budget_cap_cents == 600000"
            - "response.data.status == \"INTAKE\" and response.data.version == 1"
            - "response.data.unbatched_document_count == 600 and committed_spend_cents == 0 and staffed_reviewer_count == 0"
            - "response.data.required_pace_dph == 0.42 (600 documents / (1440 remaining hours * 1 effective reviewer))"
            - "Client.${cl_id}.matter_count == 1"

      - name: matter_read_returns_stored_and_recomputed_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /matters/{id}]
          - entities.Matter.fields.staffed_reviewer_count
        distinguishing_aspect: "GET /matters/{id} returns the same stored values as the create response and recomputes the derived trio staffed_reviewer_count, committed_spend_cents and unbatched_document_count on every read."
        test_recipe:
          setup:
            - "the core Client and Matter exist, nothing else"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
          trigger:
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { read_status: $.data.status }
          assert:
            - "HTTP 200 with response.data.id == ${m_id} and response.data.name == \"Northwind v. Calder — Second Request\""
            - "response.data.status == \"INTAKE\", version == 1, unbatched_document_count == 600"
            - "response.data.staffed_reviewer_count == 0 and committed_spend_cents == 0"
            - "response.data.required_languages == [\"EN\", \"JA\"] and required_bar_states == [\"NY\"]"

      - name: unknown_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_MATTER_NOT_FOUND]
          - errors[ERR_REVIEWER_NOT_FOUND]
        distinguishing_aspect: "Each path {id} that resolves to nothing returns the 404 of ITS OWN entity: a bogus matter id yields ERR_MATTER_NOT_FOUND while the same bogus id on the reviewer path yields ERR_REVIEWER_NOT_FOUND."
        test_recipe:
          setup:
            - "the core Client and Matter exist; no Reviewer and no Batch exist"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
          trigger:
            - call: "GET /matters/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: EngagementManager
              captures: { err_matter: $.data.error_id }
            - call: "GET /reviewers/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: StaffingCoordinator
              captures: { err_reviewer: $.data.error_id }
            - call: "GET /batches/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: EngagementManager
              captures: { err_batch: $.data.error_id }
          assert:
            - "first call: HTTP 404 with error_id \"ERR_MATTER_NOT_FOUND\", success false and data null"
            - "second call: HTTP 404 with error_id \"ERR_REVIEWER_NOT_FOUND\""
            - "third call: HTTP 404 with error_id \"ERR_BATCH_NOT_FOUND\""
            - "no row was created by any of the three calls"

      - name: matter_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /matters]
        distinguishing_aspect: "budget_cap_cents carries no default and is declared required, so omitting it yields ERR_INVALID_REQUEST (422) and no Matter row, while every optional field may be omitted freely."
        test_recipe:
          setup:
            - "the core Client exists"
          setup_api_calls:
            - *c_clock
            - *c_client
          trigger:
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Missing Cap"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "COMPLEX"
                required_languages: ["EN"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with response.error_id == \"ERR_INVALID_REQUEST\" and data null"
            - "GET /matters?client_id=${cl_id} returns an empty list"
            - "Client.${cl_id}.matter_count == 0"

      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Matter.fields.min_staffed_reviewers
          - entities.Matter.fields.onsite_seat_count
          - entities.Reviewer.fields.max_concurrent_batches
        distinguishing_aspect: "Omitting min_staffed_reviewers, onsite_seat_count and remote_work_permitted on POST /matters yields exactly 2, 1 and false, and omitting max_concurrent_batches and remote_work_authorized on POST /reviewers yields 2 and false — the declared §1.1 defaults, not nulls or zeroes."
        test_recipe:
          setup:
            - "the core Client exists"
          setup_api_calls:
            - *c_clock
            - *c_client
          trigger:
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Defaults Probe"
                document_count: 300
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "STANDARD"
                required_languages: ["EN"]
                required_bar_states: []
                subject_matter_tags: []
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 400000
              as: EngagementManager
              captures: { m_def_id: $.data.id }
            - call: "POST /reviewers"
              payload:
                full_name: "Default Probe Reviewer"
                bar_admissions: ["NY"]
                languages: ["EN"]
                subject_matter_tags: []
                tier: "FIRST_PASS"
                hourly_cost_cents: 5000
              as: StaffingCoordinator
              captures: { r_def_id: $.data.id }
          assert:
            - "Matter.${m_def_id}.min_staffed_reviewers == 2, onsite_seat_count == 1, remote_work_permitted == false"
            - "Matter.${m_def_id}.status == \"INTAKE\" and unbatched_document_count == 300"
            - "Reviewer.${r_def_id}.max_concurrent_batches == 2 and remote_work_authorized == false"
            - "Reviewer.${r_def_id}.credential_status == \"UNVERIFIED\", engagement_status == \"SOURCED\", accuracy_score == 1.0000, pace_dph == 0.00, scorecard_strikes == 0"

      - name: batching_recomputes_unbatched_count_and_required_pace
        claim_type: computed_fields
        grounds:
          - entities.Matter.fields.unbatched_document_count
          - calculations.matter_required_pace_dph
          - entities.Batch.fields.batch_number
        distinguishing_aspect: "Carving a 400-document batch moves those documents out of unbatched_document_count (600 -> 200) while required_pace_dph stays 0.42 because a CREATED batch's documents are still first-pass work — the two computed fields react differently to the same write."
        test_recipe:
          setup:
            - "the core Client and Matter with an APPROVED protocol, so batching is permitted"
            - "the matter is in STAFFING with staffed_reviewer_count 0"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - &c_proto
              call: "POST /matters/${m_id}/protocols"
              payload:
                expected_matter_version: "${m_v1}"
                issue_codes: ["RESPONSIVE", "NOT_RESPONSIVE", "PRIVILEGED", "HOT"]
                privilege_criteria: ["ATTORNEY_CLIENT", "WORK_PRODUCT"]
                qc_sample_pct: 0.10
                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: false
              as: EngagementManager
              captures: { p_id: $.data.id }
            - &c_proto_submit
              call: "POST /protocols/${p_id}/submit"
              payload: {}
              as: EngagementManager
            - &c_proto_approve
              call: "POST /protocols/${p_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientCounsel
              as_user_id: "${cl_id}"
          trigger:
            - &c_batch1
              call: "POST /matters/${m_id}/batches"
              payload: { document_count: 400, priority_rank: 5 }
              as: EngagementManager
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { unbatched_after: $.data.unbatched_document_count }
          assert:
            - "Batch.${b1_id}.batch_number == 1, document_count == 400, status == \"CREATED\", priority_rank == 5, version == 1"
            - "Batch.${b1_id}.qc_sample_target_size == 40 (max(10, ceil(400 * 0.10)))"
            - "Matter.${m_id}.unbatched_document_count == 200 and 400 + 200 == 600"
            - "Matter.${m_id}.required_pace_dph == 0.42 — the CREATED batch's 400 documents still count as remaining work"
            - "Matter.${m_id}.status == \"STAFFING\" and staffed_reviewer_count == 0"

      - name: system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Matter.fields.status
          - entities.Matter.fields.committed_spend_cents
          - validations[priority=8]
        distinguishing_aspect: "Unknown and system-owned keys in the body are IGNORED rather than rejected: a POST /matters carrying id, status, version and committed_spend_cents still returns a server-minted id, status INTAKE, version 1 and committed_spend_cents 0."
        test_recipe:
          setup:
            - "the core Client exists"
          setup_api_calls:
            - *c_clock
            - *c_client
          trigger:
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Injection Probe"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "COMPLEX"
                required_languages: ["EN", "JA"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 600000
                id: "11111111-1111-4111-8111-111111111111"
                status: "CLOSED"
                version: 99
                committed_spend_cents: 500000
                staffed_reviewer_count: 7
              as: EngagementManager
              captures: { m_inj_id: $.data.id }
          assert:
            - "HTTP 201 — the unknown/system keys are ignored, not rejected with ERR_INVALID_REQUEST"
            - "response.data.id != \"11111111-1111-4111-8111-111111111111\""
            - "response.data.status == \"INTAKE\" and version == 1"
            - "response.data.committed_spend_cents == 0 and staffed_reviewer_count == 0"
            - "response.data.created_at == \"2026-08-01T00:00:00Z\" — stamped from the logical clock, not from wall-clock time"

      - name: enum_and_language_constraints_rejected
        claim_type: type_constraints
        grounds:
          - entities.Matter.fields.complexity_tier
          - entities.Matter.fields.required_languages
          - validations[priority=8]
        distinguishing_aspect: "Both flavours of §1.1 constraint are enforced by the same rule: an out-of-enum complexity_tier and a required_languages array that omits the mandatory \"EN\" each yield ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "the core Client exists"
          setup_api_calls:
            - *c_clock
            - *c_client
          trigger:
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Bad Tier"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "EXTREME"
                required_languages: ["EN"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 600000
              as: EngagementManager
              captures: { err_tier: $.data.error_id }
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — No English"
                document_count: 600
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "COMPLEX"
                required_languages: ["JA"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 600000
              as: EngagementManager
              captures: { err_lang: $.data.error_id }
          assert:
            - "first call: HTTP 422 with error_id \"ERR_INVALID_REQUEST\""
            - "second call: HTTP 422 with error_id \"ERR_INVALID_REQUEST\" — required_languages must contain \"EN\""
            - "GET /matters?client_id=${cl_id} returns an empty list"

      - name: ledger_and_scorecard_rows_are_append_only
        claim_type: immutability
        grounds:
          - entities.BudgetLedgerEntry.fields.entry_type
          - entities.ScorecardEvent.fields.strike_delta
          - endpoints[GET /assignments/{id}/budget-ledger]
        distinguishing_aspect: "The two `common_fields: false` entities carry no version and no updated_at and are reachable only through GET sub-resources: submitting an assignment appends three ledger rows and never rewrites the COMMITMENT row it supersedes."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A VERIFIED, CLEARED and EXECUTED, so the matter is IN_REVIEW"
            - "Reviewer A holds an ACTIVE onsite session over [2026-08-01, 2026-08-31)"
            - "Batch 1 (400 documents) is assigned to Reviewer A, coded to completion and submitted"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - &c_rev_a
              call: "POST /reviewers"
              payload:
                full_name: "Ada Ishikawa"
                bar_admissions: ["NY"]
                languages: ["EN", "JA"]
                subject_matter_tags: ["ANTITRUST"]
                tier: "FIRST_PASS"
                hourly_cost_cents: 5200
                max_concurrent_batches: 2
                remote_work_authorized: false
              as: StaffingCoordinator
              captures: { ra_id: $.data.id }
            - &c_rev_a_verify
              call: "POST /reviewers/${ra_id}/credential-status"
              payload: { to_status: "VERIFIED", bar_admissions: ["NY"] }
              as: StaffingCoordinator
            - &c_screen_a
              call: "POST /conflicts-screenings"
              payload: { reviewer_id: "${ra_id}", matter_id: "${m_id}", declared_adverse_parties: [] }
              as: StaffingCoordinator
              captures: { sa_id: $.data.id }
            - &c_screen_a_clear
              call: "POST /conflicts-screenings/${sa_id}/decision"
              payload: { outcome: "CLEARED", decision_note: "no adverse party overlap" }
              as: StaffingCoordinator
            - &c_ca_a
              call: "POST /confidentiality-agreements"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                coverage_start_utc: "2026-08-01T00:00:00Z"
                coverage_end_utc: "2026-10-31T00:00:00Z"
                remote_work_addendum: false
              as: StaffingCoordinator
              captures: { caa_id: $.data.id }
            - &c_ca_a_exec
              call: "POST /confidentiality-agreements/${caa_id}/execute"
              payload: { signature_name: "Ada Ishikawa" }
              as: Reviewer
              as_user_id: "${ra_id}"
            - &c_sess_a
              call: "POST /sessions"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                workstation_class: "ONSITE_SECURE"
                starts_at_utc: "2026-08-01T00:00:00Z"
                ends_at_utc: "2026-08-31T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { sesa_id: $.data.id }
            - &c_sess_a_active
              call: "POST /sessions/${sesa_id}/lifecycle"
              payload: { to_status: "ACTIVE" }
              as: Reviewer
              as_user_id: "${ra_id}"
            - *c_batch1
            - &c_assign_a1
              call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a1_id: $.data.id }
            - &c_start_a1
              call: "POST /assignments/${a1_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - &c_progress_a1_full
              call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 400, minutes_logged: 420, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - &c_submit_a1
              call: "POST /assignments/${a1_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
          trigger:
            - call: "GET /assignments/${a1_id}/budget-ledger"
              payload: {}
              as: EngagementManager
              captures: { first_type: "$.data[0].entry_type" }
            - call: "GET /assignments/${a1_id}/budget-ledger"
              payload: { entry_type: "COMMITMENT" }
              as: EngagementManager
          assert:
            - "first call returns exactly 3 rows in created_at ASC order with entry_type COMMITMENT (+85200), REVERSAL (-85200), ACTUAL_PER_DOCUMENT (+85200)"
            - "no returned BudgetLedgerEntry row carries a `version` or `updated_at` key — the entity declares common_fields false"
            - "second call returns exactly 1 row, the original COMMITMENT of +85200, unmodified by the submit"
            - "§1.5 declares no endpoint that updates or deletes a BudgetLedgerEntry or a ScorecardEvent; both are reachable only through GET sub-resources"
            - "GET /reviewers/${ra_id}/scorecard-events returns an empty list — pace_dph 57.14 >= 55 appended no event"

      - name: filtered_lists_paginate_deterministically
        claim_type: listing
        grounds:
          - endpoints[GET /batches]
          - endpoints[GET /assignments]
        distinguishing_aspect: "List endpoints combine an entity filter with limit/offset over a created_at ASC ordering: three batches on one matter return 2 then 1 across two pages, with no row repeated or skipped."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol"
            - "three batches exist on the matter: 400, 150 and 50 documents, carved in that order"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_batch1
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 150, priority_rank: 4 }
              as: EngagementManager
              captures: { b2_id: $.data.id }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 50, priority_rank: 3 }
              as: EngagementManager
              captures: { b3_id: $.data.id }
          trigger:
            - call: "GET /batches"
              payload: { matter_id: "${m_id}", limit: 2, offset: 0 }
              as: EngagementManager
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /batches"
              payload: { matter_id: "${m_id}", limit: 2, offset: 2 }
              as: EngagementManager
            - call: "GET /batches"
              payload: { matter_id: "${m_id}", status: "CREATED" }
              as: EngagementManager
          assert:
            - "first call returns 2 rows: batch_number 1 (400 documents) then batch_number 2 (150 documents)"
            - "second call returns 1 row: batch_number 3 (50 documents); no row appears on both pages"
            - "third call returns all 3 rows because every batch is CREATED"
            - "Matter.${m_id}.unbatched_document_count == 0 (600 - 400 - 150 - 50)"

      - name: body_and_path_parents_must_resolve

        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_MATTER_NOT_FOUND]
        distinguishing_aspect: "Parent references are checked on BOTH channels: an unknown client_id in the POST /matters body yields ERR_CLIENT_NOT_FOUND, while an unknown {id} on POST /matters/{id}/batches yields ERR_MATTER_NOT_FOUND — a body FK and a path FK produce different error ids."
        test_recipe:
          setup:
            - "the core Client and Matter exist with an APPROVED protocol"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
          trigger:
            - call: "POST /matters"
              payload:
                client_id: "88888888-8888-4888-8888-888888888888"
                name: "Northwind v. Calder — Orphan"
                document_count: 100
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "SIMPLE"
                required_languages: ["EN"]
                required_bar_states: []
                subject_matter_tags: []
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 100000
              as: EngagementManager
              captures: { err_client: $.data.error_id }
            - call: "POST /matters/88888888-8888-4888-8888-888888888888/batches"
              payload: { document_count: 100, priority_rank: 5 }
              as: EngagementManager
              captures: { err_matter: $.data.error_id }
          assert:
            - "first call: HTTP 404 with error_id \"ERR_CLIENT_NOT_FOUND\""
            - "second call: HTTP 404 with error_id \"ERR_MATTER_NOT_FOUND\""
            - "Client.${cl_id}.matter_count == 1 and Matter.${m_id}.unbatched_document_count == 600 — neither call mutated anything"

      - name: reviewer_matter_junction_rows_are_per_pair
        claim_type: graph_topology
        grounds:
          - entities.ConflictsScreening.fields.reviewer_id
          - entities.ConfidentialityAgreement.fields.matter_id
          - endpoints[GET /conflicts-screenings]
        distinguishing_aspect: "ConflictsScreening and ConfidentialityAgreement are (reviewer, matter) junction rows in a graph topology: clearing Reviewer A on matter 1 leaves her PENDING screening on matter 2 untouched, and matter 2's staffed_reviewer_count stays 0."
        test_recipe:
          setup:
            - "the core matter (matter 1) with Reviewer A CLEARED and EXECUTED, so matter 1 is IN_REVIEW"
            - "a second matter for the same client also exists with an APPROVED protocol"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind v. Calder — Companion Matter"
                document_count: 200
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "STANDARD"
                required_languages: ["EN"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 200000
                min_staffed_reviewers: 1
                onsite_seat_count: 1
                remote_work_permitted: false
              as: EngagementManager
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /conflicts-screenings"
              payload: { reviewer_id: "${ra_id}", matter_id: "${m2_id}", declared_adverse_parties: ["Calder Holdings LLC"] }
              as: StaffingCoordinator
              captures: { s2_id: $.data.id }
            - call: "GET /conflicts-screenings"
              payload: { reviewer_id: "${ra_id}" }
              as: StaffingCoordinator
          assert:
            - "ConflictsScreening.${s2_id}.status == \"PENDING\" while ConflictsScreening.${sa_id}.status == \"CLEARED\" — the pair rows are independent"
            - "second call returns exactly 2 rows, one per (reviewer, matter) pair"
            - "Matter.${m_id}.staffed_reviewer_count == 1 and status == \"IN_REVIEW\""
            - "Matter.${m2_id}.staffed_reviewer_count == 0 and status == \"STAFFING\" — clearing on matter 1 does not staff matter 2"
            - "Reviewer.${ra_id}.engagement_status == \"CLEARED\" — the axis reflects the best standing across matters, not per pair"

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: new_rows_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Matter.INTAKE_to_PROTOCOL_PENDING
          - entities.Reviewer.fields.credential_status
          - entities.ConflictsScreening.fields.status
        distinguishing_aspect: "Every §1.2 machine's initial_state is observable on creation: Matter INTAKE, ReviewProtocol DRAFT at revision_number 1, Reviewer UNVERIFIED plus SOURCED on its two axes, ConflictsScreening PENDING."
        test_recipe:
          setup:
            - "the core Client and Matter exist"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
          trigger:
            - *c_proto
            - *c_rev_a
            - *c_screen_a
          assert:
            - "ReviewProtocol.${p_id}.status == \"DRAFT\" and revision_number == 1 and approved_at == null"
            - "Matter.${m_id}.status == \"PROTOCOL_PENDING\" and version == 2 — minting revision 1 moved the matter off INTAKE"
            - "Reviewer.${ra_id}.credential_status == \"UNVERIFIED\" and engagement_status == \"SOURCED\" on the two independent axes"
            - "ConflictsScreening.${sa_id}.status == \"PENDING\" with screened_at null and waiver_granted false"

      - name: protocol_request_changes_loop_then_approve
        claim_type: valid_transition
        grounds:
          - state_machines.ReviewProtocol.CLIENT_REVIEW_to_DRAFT
          - state_machines.ReviewProtocol.CLIENT_REVIEW_to_APPROVED
          - state_machines.Matter.PROTOCOL_PENDING_to_STAFFING
        distinguishing_aspect: "The DRAFT <-> CLIENT_REVIEW loop is traversed twice before approval: REQUEST_CHANGES returns the revision to DRAFT and stores change_notes, and only the APPROVE decision stamps approved_at and cascades the matter to STAFFING."
        test_recipe:
          setup:
            - "the core matter with ReviewProtocol revision 1 in DRAFT; the matter is PROTOCOL_PENDING"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
          trigger:
            - *c_proto_submit
            - call: "POST /protocols/${p_id}/client-decision"
              payload: { decision: "REQUEST_CHANGES", change_notes: "add a FOREIGN_LANGUAGE issue code" }
              as: ClientCounsel
              as_user_id: "${cl_id}"
            - *c_proto_submit
            - *c_proto_approve
          assert:
            - "after call 1: ReviewProtocol.${p_id}.status == \"CLIENT_REVIEW\""
            - "after call 2: status == \"DRAFT\" with change_notes == \"add a FOREIGN_LANGUAGE issue code\" and approved_at still null"
            - "after call 3: status == \"CLIENT_REVIEW\" again — the loop is re-entrant"
            - "after call 4: status == \"APPROVED\" with approved_at == \"2026-08-01T00:00:00Z\" and revision_number still 1"
            - "Matter.${m_id}.status == \"STAFFING\" — approval cascades PROTOCOL_PENDING -> STAFFING, and staffed_reviewer_count 0 < 1 keeps it there"

      - name: submit_on_approved_protocol_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - state_machines.Matter.QC_CLOSEOUT_to_CLOSED
        distinguishing_aspect: "A trigger absent from the current state's transition list is refused with ERR_INVALID_STATE (409) rather than being treated as a no-op: submit on an APPROVED protocol and close on a STAFFING matter both fail, and the second proves ERR_INVALID_STATE outranks the closeability rule at priority 42."
        test_recipe:
          setup:
            - "the core matter with ReviewProtocol revision 1 APPROVED; the matter is in STAFFING"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
          trigger:
            - call: "POST /protocols/${p_id}/submit"
              payload: {}
              as: EngagementManager
              captures: { err_submit: $.data.error_id }
            - call: "POST /matters/${m_id}/close"
              payload: {}
              as: EngagementManager
              captures: { err_close: $.data.error_id }
          assert:
            - "first call: HTTP 409 with error_id \"ERR_INVALID_STATE\"; ReviewProtocol.${p_id}.status is still \"APPROVED\""
            - "second call: HTTP 409 with error_id \"ERR_INVALID_STATE\", NOT \"ERR_MATTER_NOT_CLOSEABLE\" — close is only declared from QC_CLOSEOUT"
            - "Matter.${m_id}.status == \"STAFFING\" and its version is unchanged by both refusals"

      - name: second_execute_on_agreement_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ConfidentialityAgreement.PENDING_to_EXECUTED
          - validations[priority=12]
          - entities.ConfidentialityAgreement.fields.executed_at
        distinguishing_aspect: "The same trigger twice is an error, not an idempotent replay: the second POST /confidentiality-agreements/{id}/execute fails with ERR_INVALID_STATE and executed_at keeps its first value, so no second staffing recomputation occurs."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A VERIFIED and CLEARED"
            - "Reviewer A has already executed her confidentiality agreement, so the matter is IN_REVIEW"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
          trigger:
            - call: "POST /confidentiality-agreements/${caa_id}/execute"
              payload: { signature_name: "Ada Ishikawa (again)" }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id \"ERR_INVALID_STATE\""
            - "ConfidentialityAgreement.${caa_id}.status == \"EXECUTED\" with signature_name still \"Ada Ishikawa\" and executed_at \"2026-08-01T00:00:00Z\""
            - "Matter.${m_id}.staffed_reviewer_count == 1 — not double-counted"
            - "GET /confidentiality-agreements?reviewer_id=${ra_id} returns exactly 1 row"

      - name: second_level_fork_and_join
        claim_type: branching_shape
        grounds:
          - state_machines.Batch.IN_PROGRESS_to_SECOND_LEVEL
          - state_machines.Batch.SECOND_LEVEL_to_QC_SAMPLING
          - validations[priority=20]
          - calculations.assignment_billable_amount
        distinguishing_aspect: "The fork is decided by protocol.second_level_required: with it true the FIRST_PASS submit lands the batch in SECOND_LEVEL instead of QC_SAMPLING, the same reviewer is refused the second pass with ERR_SECOND_LEVEL_SAME_REVIEWER, and Reviewer B's second pass bills at the 0.60 multiplier (128 c/doc)."
        test_recipe:
          setup:
            - "the core matter, but its APPROVED protocol has second_level_required true"
            - "Reviewer A (FIRST_PASS) and Reviewer B (SECOND_LEVEL) are both VERIFIED, CLEARED, EXECUTED with ACTIVE onsite sessions"
            - "Batch 1 (400 documents) was coded and submitted by Reviewer A, so it is in SECOND_LEVEL"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
