            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
              captures: { ver_final: $.data.version }
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${insp_id}", violation_ids: ["${v_crit}", "${v_mod}"], narrative: "Retrain staff on supervision and replace the gate latch.", proposed_completion_date: "2026-08-08", expected_inspection_version: "${ver_pending}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${insp_id}", violation_ids: ["${v_crit}", "${v_mod}"], narrative: "Retrain staff on supervision and replace the gate latch.", proposed_completion_date: "2026-08-08", expected_inspection_version: "${ver_final}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { cap: $.data.id }
            - call: "POST /licensing/corrective-action-plans/${cap}/review"
              payload: { decision: "APPROVE", review_note: "Plan accepted." }
              as: LicensingSupervisor
          assert:
            - "the first CAP submission returns ERR_INVALID_INSPECTION_STATE (409) — the inspection is only PENDING_REVIEW; because the OCC check sits at priority 21 and the state check at priority 42, this call deliberately carries the LIVE version ${ver_pending} so that the state gate is the one observed"
            - "no CorrectiveActionPlan row exists for ${insp_id} after the refused submission"
            - "finalize returns 200, sets Inspection.${insp_id}.status == \"FINALIZED\", and ${ver_final} == ${ver_pending} + 1"
            - "resubmitting with the now-stale ${ver_pending} returns ERR_STALE_INSPECTION_VERSION (412) — the state gate is satisfied but the OCC gate at priority 21 is not"
            - "the same body with ${ver_final} returns 201: CorrectiveActionPlan.${cap}.status == \"SUBMITTED\", review_cycle_count == 1, provider_id == \"${prov}\""
            - "due_at == \"2026-08-08T13:00:00Z\" — now + min(CORRECTION_DAYS over {CRITICAL 3, MODERATE 30}) == now + 3 days, so the CRITICAL member sets the clock for the whole plan"
            - "Violation.${v_crit}.status == \"CORRECTION_PENDING\" and Violation.${v_mod}.status == \"CORRECTION_PENDING\" (finalize already moved both out of CITED)"
            - "the review returns 200 with status \"APPROVED\", approved_at == the clock, and reviewed_by_user_id set — the review's own Inspection == FINALIZED precondition is satisfied"
            - "Inspection.${insp_id}.version advanced once more when the plan was created (the CAP write bumps its parent)"

      - name: cross_entity_incident_close_requires_generated_complaint_resolved
        grounds:
          - state_machines.SeriousIncidentReport.transitions.INVESTIGATION_OPENED_to_CLOSED
          - state_machines.SeriousIncidentReport.transitions.REPORTED_to_UNDER_REVIEW
          - validations.priority_44_ERR_INVALID_COMPLAINT_STATE
          - validations.priority_62_ERR_INCIDENT_REQUIRES_INVESTIGATION
          - endpoints.POST_licensing_serious_incident_reports_close
        distinguishing_aspect: |
          Pair: SeriousIncidentReport x Complaint. Closing a report that opened an
          investigation is refused until the auto-generated Complaint reaches
          CLOSED or SCREENED_OUT, while a MONITOR-disposition report — which has
          generated_complaint_id null — closes immediately, so the identical close
          endpoint behaves differently based on a sibling row's existence and state.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-05T12:00:00Z."
            - "One ACTIVE Inspector (used as the complaint investigator), one CENTER provider with no inspections at all — so the segregation-of-duties lookback is empty and no FINALIZED inspection can satisfy a SUBSTANTIATED determination."
            - "Report R1: FATALITY occurred 2026-08-05T10:00:00Z (TIMELY)."
            - "Report R2: MEDICATION_ERROR occurred 2026-08-05T09:00:00Z (TIMELY)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Ivybridge Center", county_code: "CTY-01", site_address: "111 Ivybridge Rd", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "FATALITY", occurred_at: "2026-08-05T10:00:00Z", affected_child_age_group: "INFANT", narrative: "An infant was found unresponsive during nap time and did not survive." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep1: $.data.id }
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "MEDICATION_ERROR", occurred_at: "2026-08-05T09:00:00Z", affected_child_age_group: "PRESCHOOL", narrative: "A preschooler received a second dose of an inhaler in error; no symptoms followed." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep2: $.data.id }
          trigger:
            - call: "POST /licensing/serious-incident-reports/${rep1}/review"
              payload: { disposition: "MONITOR", agency_note: "Monitoring only." }
              as: LicensingSupervisor
            - call: "POST /licensing/serious-incident-reports/${rep1}/review"
              payload: { disposition: "OPEN_INVESTIGATION", agency_note: "Fatality: investigation opened." }
              as: LicensingSupervisor
              captures: { gen_cmp: $.data.generated_complaint_id }
            - call: "POST /licensing/serious-incident-reports/${rep1}/close"
              payload: { agency_note: "Attempting closure." }
              as: LicensingSupervisor
            - call: "POST /licensing/serious-incident-reports/${rep2}/review"
              payload: { disposition: "MONITOR", agency_note: "Medication error: monitoring." }
              as: LicensingSupervisor
            - call: "POST /licensing/serious-incident-reports/${rep2}/close"
              payload: { agency_note: "No further action." }
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${gen_cmp}/assign-investigator"
              payload: { investigator_id: "${insp_a}" }
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${gen_cmp}/determination"
              payload: { determination: "INCONCLUSIVE" }
              as: ComplaintInvestigator
              as_user_id: "${insp_a}"
            - call: "POST /licensing/serious-incident-reports/${rep1}/close"
              payload: { agency_note: "Second attempt, complaint still open." }
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${gen_cmp}/close"
              payload: { closure_note: "Investigation concluded; no licensing violation established." }
              as: LicensingSupervisor
            - call: "POST /licensing/serious-incident-reports/${rep1}/close"
              payload: { agency_note: "Closed after the complaint was closed." }
              as: LicensingSupervisor
          assert:
            - "both reports are created in status \"REPORTED\" with reporting_timeliness \"TIMELY\" and late_report_violation_created false"
            - "the MONITOR review of the FATALITY report returns ERR_INCIDENT_REQUIRES_INVESTIGATION (409) and SeriousIncidentReport.${rep1}.status stays \"REPORTED\""
            - "the OPEN_INVESTIGATION review returns 200: status == \"INVESTIGATION_OPENED\", reviewed_at == the clock, and ${gen_cmp} is non-null"
            - "the generated Complaint.${gen_cmp} is created in status \"SCREENED_IN\" with intake_channel \"AGENCY_INCIDENT\", allegation_category \"ABUSE\" (FATALITY), affected_age_group \"INFANT\", priority \"P1\", alleged_serious_harm true, anonymous false, and investigation_due_at == \"2026-09-04T12:00:00Z\" (now + 30 days)"
            - "the first close of ${rep1} returns ERR_INVALID_COMPLAINT_STATE (409) because the generated complaint is SCREENED_IN, which is neither CLOSED nor SCREENED_OUT; SeriousIncidentReport.${rep1}.status stays \"INVESTIGATION_OPENED\" and closed_at stays null"
            - "the MONITOR review of ${rep2} returns 200 with status \"UNDER_REVIEW\" and generated_complaint_id null, and its close returns 200 with status \"CLOSED\" — the same close endpoint with no sibling complaint is not gated at all"
            - "the second close of ${rep1}, attempted while Complaint.${gen_cmp}.status == \"DETERMINED\", STILL returns ERR_INVALID_COMPLAINT_STATE — DETERMINED is not in the allowed set, so the gate reads the exact state and not merely 'has a determination'"
            - "after closing the complaint, Complaint.${gen_cmp}.status == \"CLOSED\" and the third close of ${rep1} returns 200 with status \"CLOSED\" and closed_at == the clock"
            - "Provider.${prov}.open_violation_points is 0 throughout — an INCONCLUSIVE determination cites nothing, and neither report was LATE_REPORT"

  # =======================================================================
  # Rule 8 — resource / temporal overlap, four different resources with four
  #          different interval semantics
  #   1 = Inspector time     — HALF-OPEN [start, end), mutual exclusion
  #   2 = Provider site      — CLOSED buffered [start-60m, end+60m], mutual exclusion
  #   3 = Inspector calendar day — DATE BUCKET count, no interval arithmetic
  #   4 = StaffMember clearance — VALIDITY coverage [decided_at, expires_at)
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_inspector_half_open_window_allows_back_to_back
        grounds:
          - calculations.inspector_schedule_conflict_window
          - validations.priority_66_ERR_INSPECTOR_DOUBLE_BOOKED
          - entities.Inspection.fields.visit_window_end
          - entities.Inspector.fields.scheduled_visit_count
          - endpoints.POST_licensing_inspections
        distinguishing_aspect: |
          Resource: one Inspector's time. Semantics: HALF-OPEN [scheduled_for,
          visit_window_end), so a visit starting exactly when the previous one
          ends is accepted while one starting a single second earlier is refused.
          The occupied set holds only SCHEDULED and IN_PROGRESS visits, so
          voiding a visit releases its window.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One Inspector (Ada) certified for PRESCHOOL with max_daily_visits 3."
            - "Two CENTER providers A and B, so the provider-side buffer rule can never be the cause of a refusal."
            - "One ANNUAL inspection: Ada at provider A, scheduled_for 2026-08-05T09:00:00Z, duration 120 -> window [09:00:00Z, 11:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Alder Center", county_code: "CTY-01", site_address: "1 Alder St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Birchwood Center", county_code: "CTY-01", site_address: "2 Birchwood St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov_b: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_a}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_first: $.data.id, end_first: $.data.visit_window_end }
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp_a}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T10:59:59Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp_a}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T11:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_second: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_a}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections/${insp_first}/void"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_a}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_third: $.data.id }
          assert:
            - "${end_first} == \"2026-08-05T11:00:00Z\" and Inspector.${insp_a}.scheduled_visit_count == 1 after setup"
            - "scheduling at 10:59:59Z returns ERR_INSPECTOR_DOUBLE_BOOKED (409): [10:59:59Z, 12:59:59Z) intersects [09:00:00Z, 11:00:00Z) by exactly one second"
            - "the refused call leaves Inspector.${insp_a}.scheduled_visit_count at 1 and creates no Inspection row"
            - "scheduling at 11:00:00Z returns 201 — the intervals touch but do not intersect, so back-to-back visits fit; Inspection.${insp_second}.visit_window_end == \"2026-08-05T13:00:00Z\" and scheduled_visit_count == 2"
            - "the duplicate 09:00:00Z request returns ERR_INSPECTOR_DOUBLE_BOOKED, not ERR_PROVIDER_VISIT_BUFFER_CONFLICT — priority 66 is evaluated before 67 even though the provider-A buffered windows also collide"
            - "voiding ${insp_first} sets its status to \"VOIDED\" and removes it from the occupancy set"
            - "the identical 09:00:00Z request now returns 201 (Inspection.${insp_third}), which proves the occupancy set is restricted to SCHEDULED and IN_PROGRESS rows"
            - "Ada now holds two active visits on 2026-08-05, still strictly below max_daily_visits 3, so ERR_INSPECTOR_DAILY_LIMIT_REACHED never appears in this instance"

      - name: overlap_provider_site_closed_buffered_window_touch_conflicts
        grounds:
          - calculations.inspector_schedule_conflict_window
          - validations.priority_67_ERR_PROVIDER_VISIT_BUFFER_CONFLICT
          - global_constants.PROVIDER_VISIT_BUFFER_MINUTES
          - endpoints.POST_licensing_inspections
        distinguishing_aspect: |
          Resource: one provider's site. Semantics: CLOSED interval widened by
          PROVIDER_VISIT_BUFFER_MINUTES on BOTH sides and on BOTH rows, so two
          buffered windows that merely touch at a single instant DO conflict —
          the opposite edge rule from the inspector window, and it binds a
          different inspector than the one already booked.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Two Inspectors, Ada and Ben, both certified for PRESCHOOL with max_daily_visits 3, so no inspector-side conflict and no daily-limit refusal is possible."
            - "One CENTER provider A with one ANNUAL inspection: Ada, 2026-08-05T09:00:00Z, 120 minutes -> raw window [09:00, 11:00), buffered window [08:00:00Z, 12:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ben Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Cedarcroft Center", county_code: "CTY-01", site_address: "3 Cedarcroft St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov_a: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_a}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_anchor: $.data.id }
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_b}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T13:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_b}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T05:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_b}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T04:59:59Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_early: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_b}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T13:00:01Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_late: $.data.id }
          assert:
            - "the anchor visit occupies the buffered provider window [\"2026-08-05T08:00:00Z\", \"2026-08-05T12:00:00Z\"] (both edges inclusive)"
            - "scheduling Ben at 13:00:00Z returns ERR_PROVIDER_VISIT_BUFFER_CONFLICT (409): its buffered window [12:00:00Z, 15:00:00Z] touches the anchor's buffered window at exactly 12:00:00Z, and a touch on a closed interval IS an intersection"
            - "scheduling Ben at 05:00:00Z returns ERR_PROVIDER_VISIT_BUFFER_CONFLICT as well: buffered [04:00:00Z, 08:00:00Z] touches the anchor at exactly 08:00:00Z — the rule is symmetric on the lower edge"
            - "scheduling Ben at 04:59:59Z returns 201: buffered [03:59:59Z, 07:59:59Z] ends one second before the anchor's buffer begins; Inspection.${insp_early}.visit_window_end == \"2026-08-05T06:59:59Z\""
            - "scheduling Ben at 13:00:01Z returns 201: buffered [12:00:01Z, 15:00:01Z] begins one second after the anchor's buffer ends; Inspection.${insp_late}.visit_window_end == \"2026-08-05T15:00:01Z\""
            - "the two refusals name a DIFFERENT inspector than the anchor visit, so neither can be explained by ERR_INSPECTOR_DOUBLE_BOOKED — the contended resource is the site"
            - "Ben's own raw windows [04:59:59Z, 06:59:59Z) and [13:00:01Z, 15:00:01Z) are disjoint, and Inspector.${insp_b}.scheduled_visit_count == 2 while Inspector.${insp_a}.scheduled_visit_count == 1"
            - "the accepted pair proves the provider buffer is 60 minutes on each side and applied to BOTH rows: the gap between the anchor's raw end 11:00:00Z and 13:00:01Z is 2h00m01s, i.e. 60 + 60 minutes of buffer plus one second"

      - name: overlap_inspector_daily_bucket_counts_by_utc_date
        grounds:
          - calculations.inspector_schedule_conflict_window
          - validations.priority_76_ERR_INSPECTOR_DAILY_LIMIT_REACHED
          - entities.Inspector.fields.max_daily_visits
          - endpoints.POST_licensing_inspections
        distinguishing_aspect: |
          Resource: one Inspector's calendar-day quota. Semantics: a DATE BUCKET
          keyed on date_utc(scheduled_for) with no interval arithmetic at all —
          the fourth non-overlapping visit of the day is refused, a visit whose
          window runs past midnight is charged entirely to its start date, and
          voiding one visit frees a slot in that bucket.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One Inspector (Cara) certified for PRESCHOOL with max_daily_visits 3."
