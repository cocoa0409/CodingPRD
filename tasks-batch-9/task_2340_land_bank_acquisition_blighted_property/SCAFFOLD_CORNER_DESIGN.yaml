        grounds:
          - endpoints[GET /land-bank/inventory-summary]
          - calculations.inventory_area_position
          - calculations.funding_ledger_position
        distinguishing_aspect: "The summary is a pure derived read with two independent scopes in one payload: the situs_ward filter narrows the parcel figures (2 of the 3 acquired parcels sit in ward 7, 9000 of the 14000 sqft) while the four ledger totals stay authority-wide and satisfy authorized == available + committed + disbursed both before and after the filter is applied."
