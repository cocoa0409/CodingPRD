              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot2}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
          trigger:
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-05T10:05:00Z", exited_at: "2026-05-05T10:45:00Z", min_metal_temp_c: 180.0, minutes_at_or_above_temp: 20 }
