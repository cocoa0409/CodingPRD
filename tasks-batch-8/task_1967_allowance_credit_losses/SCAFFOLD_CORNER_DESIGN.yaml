              payload: {}
              as: ChiefCreditOfficer
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_q1: $.data.id }
            - call: "POST /cecl/model-runs/${run_q1}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q2", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
