          - entities.Subscription.fields.lifecycle_status
          - errors[ERR_ACCOUNT_HAS_ACTIVE_SUBS]
          - endpoints["POST /accounts/{id}/close"]
        distinguishing_aspect: |
          Entity pair Account<-Subscription: Account ACTIVE->CLOSED is rejected because a child
          Subscription is in {TRIALING, ACTIVE}; close depends on the subscription's state.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; BASIC plan trial_days 0; account with an ACTIVE subscription"
          setup_api_calls:
            - call: "POST /_clock/set"
