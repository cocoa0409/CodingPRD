            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T09:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
