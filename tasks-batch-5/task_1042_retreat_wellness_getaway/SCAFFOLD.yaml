scenario: "Retreat & Wellness-Getaway Booking: retreat catalog & date/capacity, room/tier & shared, deposit & balance, dietary/health & waiver, facilitator & schedule, transport/airport, cancellation, add-on"
domain_name: "retreat-wellness-getaway"
api_prefix: "/v1"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities under /v1 with FK references in bodies; no deep URL nesting.
  state_machine_shape: cyclic
  # Retreat has a PUBLISHED<->FULL capacity cycle; Booking is branching with divergent side effects.
  relationship_patterns:
    - one_to_many        # Retreat -> Room/Booking/Shuttle/ActivitySlot
    - many_to_many       # Booking <-> AddOn via BookingAddOn junction
    - cross_aggregate    # ActivitySlot references Retreat + Facilitator + Room
  role_model: peer_roles
  # Guest owns bookings/payments/waivers/transport; Operator owns catalog/schedule; Facilitator reads own slots.
  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Retreat
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Marketing name of the wellness getaway (catalog descriptor)."
      - name: theme
        type: string
        source: input
        description: "Catalog theme, e.g. YOGA, SILENT, DETOX."
      - name: location
        type: string
        source: input
        description: "Venue location text."
      - name: start_date
        type: datetime
        source: input
        description: "Retreat first-day check-in instant (ISO 8601 UTC)."
      - name: end_date
        type: datetime
        source: input
        description: "Retreat departure instant (ISO 8601 UTC); must be strictly after start_date."
      - name: capacity
        type: integer
        source: input
        description: "Maximum total guests across all bookings (sum of party_size)."
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: "Per-person base price in cents used by booking_total_charge."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, FULL, CANCELLED, COMPLETED}"
      - name: reserved_count
        type: integer
        source: computed
        description: "Sum of party_size over Bookings on this Retreat in status IN {PENDING_DEPOSIT, DEPOSIT_PAID, CONFIRMED, CHECKED_IN}."
        default: 0
      - name: schedule_ready
        type: boolean
        source: computed
        description: "True iff at least one ActivitySlot on this Retreat is in status SCHEDULED."
        default: false

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: retreat_id
        type: string
        source: input
        description: "FK -> Retreat.id; the retreat this room belongs to."
      - name: kind
        type: enum
        source: input
        description: "LODGING rooms hold beds for bookings; COMMON rooms are activity venues."
        constraints: "one of {LODGING, COMMON}"
      - name: tier
        type: enum
        source: input
        description: "Lodging tier; ignored for COMMON rooms."
        default: STANDARD
        constraints: "one of {PRIVATE, STANDARD, SHARED_DORM}"
      - name: tier_delta_cents
        type: integer
        source: input
        description: "Price delta added to a booking's subtotal when this LODGING room is chosen."
        default: 0
      - name: bed_count
        type: integer
        source: input
        description: "Number of beds; capacity of a LODGING room. COMMON rooms use 0."
        default: 0
        constraints: ">= 0"
      - name: label
        type: string
        source: input
        description: "Human label, e.g. 'Ocean Suite' or 'Yoga Hall'."
      - name: reserved_beds
        type: integer
        source: computed
        description: "Sum of party_size over Bookings on this Room in status IN {PENDING_DEPOSIT, DEPOSIT_PAID, CONFIRMED, CHECKED_IN}."
        default: 0

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Guest email; unique."
      - name: full_name
        type: string
        source: input
        description: "Guest full name."
      - name: phone
        type: string
        source: input
        description: "Contact phone."
        default: ""
      - name: dietary_notes
        type: string
        source: input
        description: "Free-text dietary requirements."
        default: ""
      - name: health_notes
        type: string
        source: input
        description: "Free-text health disclosures kept on the guest profile."
        default: ""

  - name: Facilitator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Facilitator full name."
      - name: email
        type: string
        source: input
        description: "Facilitator email."
      - name: specialty
        type: string
        source: input
        description: "Practice specialty, e.g. 'Vinyasa'."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE facilitators may be scheduled; WITHDRAWN cannot."
        default: ACTIVE
        constraints: "one of {ACTIVE, WITHDRAWN}"
      - name: payout_cents
        type: integer
        source: computed
        description: "Final per_head payout, stamped when the retreat COMPLETES (facilitator_payout final variant)."
        default: 0

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: retreat_id
        type: string
        source: input
        description: "FK -> Retreat.id; the retreat being booked."
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the owning guest (must equal X-User-ID for role Guest)."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; a LODGING room in the same retreat."
      - name: party_size
        type: integer
        source: input
        description: "Number of guests in this booking; consumes that many beds and retreat seats."
        constraints: ">= 1"
      - name: has_special_diet
        type: boolean
        source: input
        description: "When true, adds SPECIAL_DIET_SURCHARGE_CENTS once to the total."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Booking lifecycle."
        default: PENDING_DEPOSIT
        constraints: "one of {PENDING_DEPOSIT, DEPOSIT_PAID, CONFIRMED, CHECKED_IN, CANCELLED, COMPLETED}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "base_price_cents*party_size + room.tier_delta_cents + sum(BookingAddOn.price_cents_snapshot)."
        default: 0
      - name: group_discount_pct
        type: number
        source: computed
        description: "Tiered discount selected by party_size (see booking_total_charge constants)."
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * group_discount_pct)."
        default: 0
      - name: special_diet_surcharge_cents
        type: integer
        source: computed
        description: "SPECIAL_DIET_SURCHARGE_CENTS when has_special_diet else 0."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents + special_diet_surcharge_cents (pre-tax)."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Per-line-item rounded tax (booking_tax); sum of round_half_up(line*TAX_PCT) over pre-discount line items."
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: "total_cents + tax_cents; the amount the guest owes."
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "round_half_up(grand_total_cents * DEPOSIT_PCT)."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "grand_total_cents - deposit_cents."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of DEPOSIT+BALANCE Payments on this booking (refunds do NOT reduce it)."
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Refund issued on cancellation (cancellation_refund)."
        default: 0
      - name: cancelled_by
        type: enum
        source: computed
        description: "Who triggered the cancellation; selects the refund variant."
        default: null
        constraints: "one of {GUEST, OPERATOR} or null"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this payment/refund event belongs to."
      - name: type
        type: enum
        source: computed
        description: "DEPOSIT and BALANCE are inbound; REFUND is outbound."
        constraints: "one of {DEPOSIT, BALANCE, REFUND}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Positive magnitude of the money movement in cents."
      - name: note
        type: string
        source: computed
        description: "Human note, e.g. 'guest cancel 50% tier'."
        default: ""

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this waiver covers (one waiver per booking)."
      - name: health_disclosures
        type: string
        source: input
        description: "Health/medical disclosures supplied by the guest."
      - name: signature_name
        type: string
        source: input
        description: "Typed signature captured on sign."
        default: null
      - name: status
        type: enum
        source: computed
        description: "PENDING -> SIGNED -> (CLEARED | REJECTED)."
        default: PENDING
        constraints: "one of {PENDING, SIGNED, CLEARED, REJECTED}"
      - name: review_decision
        type: enum
        source: computed
        description: "Operator review outcome."
        default: null
        constraints: "one of {CLEAR, REJECT} or null"

  - name: ActivitySlot
    parent: null
    common_fields: true
    fields:
      - name: retreat_id
        type: string
        source: input
        description: "FK -> Retreat.id; the retreat this slot is scheduled in."
      - name: facilitator_id
        type: string
        source: input
        description: "FK -> Facilitator.id; the leading facilitator (must be ACTIVE)."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the COMMON room hosting the slot (the venue resource)."
      - name: title
        type: string
        source: input
        description: "Session title, e.g. 'Sunrise Vinyasa'."
      - name: start_datetime
        type: datetime
        source: input
        description: "Slot start (ISO 8601 UTC); interval is half-open [start,end)."
      - name: end_datetime
        type: datetime
        source: input
        description: "Slot end (ISO 8601 UTC); must be strictly after start_datetime."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED -> (CANCELLED | COMPLETED)."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED, COMPLETED}"

  - name: Shuttle
    parent: null
    common_fields: true
    fields:
      - name: retreat_id
        type: string
        source: input
        description: "FK -> Retreat.id; the retreat this airport shuttle serves."
      - name: direction
        type: enum
        source: input
        description: "ARRIVAL (airport->venue) or DEPARTURE (venue->airport)."
        constraints: "one of {ARRIVAL, DEPARTURE}"
      - name: depart_datetime
        type: datetime
        source: input
        description: "Shuttle departure instant (ISO 8601 UTC)."
      - name: seat_capacity
        type: integer
        source: input
        description: "Total seats on the shuttle."
        constraints: ">= 1"
      - name: reserved_seats
        type: integer
        source: computed
        description: "Sum of seat_count over TransportSegments on this Shuttle in status BOOKED."
        default: 0

  - name: TransportSegment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking whose party rides."
      - name: shuttle_id
        type: string
        source: input
        description: "FK -> Shuttle.id; the shuttle providing the seats."
      - name: seat_count
        type: integer
        source: computed
        description: "Copied from the booking's party_size at creation."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "BOOKED -> (CANCELLED | COMPLETED)."
        default: BOOKED
        constraints: "one of {BOOKED, CANCELLED, COMPLETED}"

  - name: AddOn
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Add-on name, e.g. 'Deep Tissue Massage'."
      - name: category
        type: enum
        source: input
        description: "Add-on category."
        constraints: "one of {SPA, EXCURSION, MEAL, GEAR}"
      - name: price_cents
        type: integer
        source: input
        description: "Catalog price in cents."
        constraints: ">= 0"

  - name: BookingAddOn
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking the add-on is attached to."
      - name: addon_id
        type: string
        source: input
        description: "FK -> AddOn.id; the catalog add-on selected."
      - name: price_cents_snapshot
        type: integer
        source: computed
        description: "AddOn.price_cents captured at attach time; immune to later catalog edits."
        default: 0

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Retreat
    initial_state: DRAFT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /v1/retreats/{id}/publish"
        actor: Operator
        preconditions: ["retreat has >= 1 LODGING Room"]
        side_effects: ["increments Retreat.version by 1"]
      - from: PUBLISHED
        to: FULL
        trigger: "system: booking_create pushes reserved_count == capacity"
        actor: system
        preconditions: ["reserved_count == capacity after the create"]
        side_effects: ["Retreat.status := FULL"]
        note: "Auto-transition evaluated at the end of POST /v1/bookings."
      - from: FULL
        to: PUBLISHED
        trigger: "system: a booking cancellation frees a seat (reserved_count < capacity)"
        actor: system
        preconditions: ["reserved_count < capacity after the release"]
        side_effects: ["Retreat.status := PUBLISHED"]
        note: "Cyclic partner of PUBLISHED->FULL."
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /v1/retreats/{id}/cancel"
        actor: Operator
        preconditions: []
        side_effects:
          - "for each Booking on the retreat in status IN {PENDING_DEPOSIT, DEPOSIT_PAID, CONFIRMED, CHECKED_IN}: transition Booking -> CANCELLED with cancelled_by=OPERATOR (cascade A link 1)"
          - "for each ActivitySlot in status SCHEDULED: transition -> CANCELLED"
          - "increments Retreat.version by 1"
      - from: FULL
        to: CANCELLED
        trigger: "POST /v1/retreats/{id}/cancel"
        actor: Operator
        preconditions: []
        side_effects:
          - "same cascade as PUBLISHED->CANCELLED (cascade A)"
          - "increments Retreat.version by 1"
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /v1/retreats/{id}/complete"
        actor: Operator
        preconditions: ["current_utc >= Retreat.end_date"]
        side_effects:
          - "for each Facilitator with >=1 slot on the retreat: stamp Facilitator.payout_cents := facilitator_payout final (per_head) variant"
          - "for each ActivitySlot in status SCHEDULED: transition -> COMPLETED"
          - "for each Booking in status CHECKED_IN: transition -> COMPLETED"
          - "increments Retreat.version by 1"
      - from: FULL
        to: COMPLETED
        trigger: "POST /v1/retreats/{id}/complete"
        actor: Operator
        preconditions: ["current_utc >= Retreat.end_date"]
        side_effects: ["same as PUBLISHED->COMPLETED", "increments Retreat.version by 1"]

  - entity: Booking
    initial_state: PENDING_DEPOSIT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: null
        to: PENDING_DEPOSIT
        trigger: "POST /v1/bookings"
        actor: Guest
        preconditions:
          - "Retreat.status == PUBLISHED (cross-entity: booking requires published retreat)"
          - "expected_retreat_version matches Retreat.version (OCC)"
          - "Room.kind == LODGING"
          - "Room.reserved_beds + party_size <= Room.bed_count"
          - "Retreat.reserved_count + party_size <= Retreat.capacity"
        side_effects:
          - "compute booking_total_charge and booking_tax; stamp subtotal_cents..balance_due_cents"
          - "Room.reserved_beds += party_size"
          - "Retreat.reserved_count += party_size; if now == capacity, Retreat -> FULL"
          - "increments Retreat.version by 1"
      - from: PENDING_DEPOSIT
        to: DEPOSIT_PAID
        trigger: "POST /v1/bookings/{id}/pay-deposit"
        actor: Guest
        preconditions: ["amount_cents == Booking.deposit_cents"]
        side_effects:
          - "create Payment{type:DEPOSIT, amount_cents:deposit_cents}"
          - "Booking.amount_paid_cents += deposit_cents"
      - from: DEPOSIT_PAID
        to: CONFIRMED
        trigger: "POST /v1/bookings/{id}/pay-balance"
        actor: Guest
        preconditions:
          - "Waiver for this booking exists and Waiver.status == CLEARED (cross-entity safety)"
          - "amount_cents == Booking.balance_due_cents"
        side_effects:
          - "create Payment{type:BALANCE, amount_cents:balance_due_cents}"
          - "Booking.amount_paid_cents += balance_due_cents"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /v1/bookings/{id}/check-in"
        actor: Operator
        preconditions:
          - "Waiver.status == CLEARED (safety)"
          - "current_utc >= Retreat.start_date (temporal)"
        side_effects: ["Booking.updated_at refreshed"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: retreat complete"
        actor: system
        preconditions: []
        side_effects: ["Booking.updated_at refreshed"]
      - from: PENDING_DEPOSIT
        to: CANCELLED
        trigger: "POST /v1/bookings/{id}/cancel (guest) OR cascade from retreat cancel"
        actor: Guest
        preconditions: []
        side_effects:
          - "compute cancellation_refund; if amount_paid_cents>0 create Payment{type:REFUND} and set refund_cents"
          - "Room.reserved_beds -= party_size (occupancy invariant)"
          - "Retreat.reserved_count -= party_size; if Retreat was FULL and now < capacity, Retreat -> PUBLISHED"
          - "for each TransportSegment of this booking in status BOOKED: transition -> CANCELLED (cascade)"
      - from: DEPOSIT_PAID
        to: CANCELLED
        trigger: "POST /v1/bookings/{id}/cancel (guest) OR cascade from retreat cancel"
        actor: Guest
        preconditions: []
        side_effects:
          - "compute cancellation_refund (guest variant when cancelled_by=GUEST, operator/full variant when cancelled_by=OPERATOR)"
          - "create Payment{type:REFUND, amount_cents:refund_cents} when refund_cents>0"
          - "Room.reserved_beds -= party_size"
          - "Retreat.reserved_count -= party_size; FULL->PUBLISHED if applicable"
          - "for each TransportSegment in status BOOKED: -> CANCELLED (cascade A link 2/3: booking->segment->shuttle.reserved_seats)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/bookings/{id}/cancel (guest) OR cascade from retreat cancel"
        actor: Guest
        preconditions: []
        side_effects:
          - "compute cancellation_refund; create Payment{type:REFUND} when refund_cents>0"
          - "Room.reserved_beds -= party_size"
          - "Retreat.reserved_count -= party_size; FULL->PUBLISHED if applicable"
          - "for each TransportSegment in status BOOKED: -> CANCELLED, freeing Shuttle.reserved_seats"

  - entity: Waiver
    initial_state: PENDING
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /v1/waivers"
        actor: Guest
        preconditions: ["no existing Waiver for this booking", "Booking exists"]
        side_effects: ["increments Waiver.version by 1 on later mutations"]
      - from: PENDING
        to: SIGNED
        trigger: "POST /v1/waivers/{id}/sign"
        actor: Guest
        preconditions: ["signature_name provided"]
        side_effects: ["Waiver.signature_name stamped", "increments Waiver.version by 1"]
      - from: SIGNED
        to: CLEARED
        trigger: "POST /v1/waivers/{id}/review with decision=CLEAR"
        actor: Operator
        preconditions: []
        side_effects: ["Waiver.review_decision := CLEAR", "increments Waiver.version by 1"]
      - from: SIGNED
        to: REJECTED
        trigger: "POST /v1/waivers/{id}/review with decision=REJECT"
        actor: Operator
        preconditions: []
        side_effects: ["Waiver.review_decision := REJECT", "increments Waiver.version by 1"]

  - entity: Facilitator
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /v1/facilitators/{id}/withdraw"
        actor: Operator
        preconditions: []
        side_effects:
          - "for each ActivitySlot of this facilitator in status SCHEDULED: transition -> CANCELLED (cascade B link 1)"
          - "recompute Retreat.schedule_ready for each affected retreat (cascade B link 2)"
          - "increments Facilitator.version by 1"

  - entity: ActivitySlot
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /v1/activity-slots"
        actor: Operator
        preconditions:
          - "Facilitator.status == ACTIVE (cross-entity)"
          - "Room.kind == COMMON"
          - "no SCHEDULED slot for this facilitator overlaps [start,end) (half-open, adjacency allowed)"
          - "no SCHEDULED slot in this room within SETUP_BUFFER_MINUTES=30 (buffered adjacency)"
        side_effects: ["set Retreat.schedule_ready := true"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/activity-slots/{id}/cancel OR cascade from facilitator withdraw"
        actor: Operator
        preconditions: []
        side_effects: ["recompute Retreat.schedule_ready"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: retreat complete"
        actor: system
        preconditions: []
        side_effects: ["recompute Retreat.schedule_ready"]

  - entity: TransportSegment
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: null
        to: BOOKED
        trigger: "POST /v1/transport-segments"
        actor: Guest
        preconditions:
          - "Booking.status IN {DEPOSIT_PAID, CONFIRMED, CHECKED_IN}"
          - "Shuttle.reserved_seats + Booking.party_size <= Shuttle.seat_capacity"
        side_effects:
          - "seat_count := Booking.party_size"
          - "Shuttle.reserved_seats += seat_count"
      - from: BOOKED
        to: CANCELLED
        trigger: "cascade from Booking cancel"
        actor: system
        preconditions: []
        side_effects: ["Shuttle.reserved_seats -= seat_count (money/seat release)"]
      - from: BOOKED
        to: COMPLETED
        trigger: "system: retreat complete"
        actor: system
        preconditions: []
        side_effects: []

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-retreat
    parent_entity: Retreat
    write_endpoint: "POST /v1/bookings"
    occ_field: "expected_retreat_version"
    description: |
      Creating a Booking against a Retreat whose version has advanced since the
      client last observed it is rejected. A prior booking create (or a
      publish/cancel) legitimately advances Retreat.version and consumes seats;
      the current writer's view of remaining capacity is therefore stale and
      must be refreshed before retrying.
    error_id: ERR_STALE_RETREAT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: booking_total_charge
    trigger: "POST /v1/bookings and POST /v1/booking-addons (recompute)"
    algorithm: threshold
    formula: |
      subtotal_cents = base_price_cents * party_size
                       + room.tier_delta_cents
                       + sum(BookingAddOn.price_cents_snapshot)
      group_discount_pct = 0.15 if party_size >= 4
                           else 0.08 if party_size >= 2
                           else 0.00
      discount_cents = round_half_up(subtotal_cents * group_discount_pct)
      special_diet_surcharge_cents = SPECIAL_DIET_SURCHARGE_CENTS if has_special_diet else 0
      total_cents = subtotal_cents - discount_cents + special_diet_surcharge_cents
    input_set: "the booking's own party_size, chosen room, and currently-attached BookingAddOns"
    constants:
      SPECIAL_DIET_SURCHARGE_CENTS: 5000
      DISCOUNT_TIER_2: 0.08
      DISCOUNT_TIER_4: 0.15
    precision: "cents, round_half_up"
    variants: []

  - name: booking_tax
    trigger: "same as booking_total_charge (stamped alongside it)"
    algorithm: aggregation
    formula: |
      # Pinned order: round EACH pre-discount line item's tax, THEN sum.
      # (Summing first then rounding can differ by 1 cent — see difficulty design.)
      line_items = [ base_price_cents * party_size,
                     room.tier_delta_cents ] + [ ba.price_cents_snapshot for ba in booking_addons ]
      tax_cents = sum( round_half_up(line * TAX_PCT) for line in line_items )
      grand_total_cents = total_cents + tax_cents
      deposit_cents = round_half_up(grand_total_cents * DEPOSIT_PCT)
      balance_due_cents = grand_total_cents - deposit_cents
    input_set: "pre-discount line items of the booking (base line, room delta, each add-on)"
    constants:
      TAX_PCT: 0.085
      DEPOSIT_PCT: 0.30
    precision: "cents, round_half_up, per-line then sum"
    variants: []

  - name: cancellation_refund
    trigger: "Booking -> CANCELLED (POST /v1/bookings/{id}/cancel or retreat-cancel cascade)"
    algorithm: threshold
    formula: |
      days_before = floor( (Retreat.start_date - current_utc) / 86400_seconds )
      if cancelled_by == OPERATOR:
          refund_pct = 1.00                      # full refund regardless of timing
      else:  # GUEST
          refund_pct = 1.00 if days_before >= 60
                       else 0.50 if days_before >= 30
                       else 0.25 if days_before >= 14
                       else 0.00
      refund_cents = round_half_up(amount_paid_cents * refund_pct)
    input_set: "the cancelled booking's amount_paid_cents and the retreat start_date vs current_utc"
    constants:
      FULL_REFUND_DAYS: 60
      HALF_REFUND_DAYS: 30
      QUARTER_REFUND_DAYS: 14
    precision: "cents, round_half_up"
    variants:
      - name: guest_cancel
        when: "cancelled_by == GUEST (guest-initiated single-booking cancel)"
        difference: "refund_pct is chosen from the days_before tier ladder; a 30-day cancel yields 0.50."
      - name: operator_cancel
        when: "cancelled_by == OPERATOR (retreat-cancel cascade)"
        difference: "refund_pct is forced to 1.00 (full refund) irrespective of days_before."

  - name: facilitator_payout
    trigger: "Retreat -> COMPLETED (final) / read at scheduling time (provisional)"
    algorithm: weighted_scoring
    formula: |
      slots_led = count(ActivitySlot where facilitator_id == F.id
                        and retreat_id == R.id and status IN {SCHEDULED, COMPLETED})
      attendee_count = sum(Booking.party_size where retreat_id == R.id
                           and status IN {CONFIRMED, CHECKED_IN, COMPLETED})
      # provisional (per_session_flat): payout = FACILITATOR_FLAT_CENTS * slots_led
      # final     (per_head):          payout = PER_HEAD_CENTS * attendee_count
      payout_cents = PER_HEAD_CENTS * attendee_count      # final; stamped on complete
    input_set: "the facilitator's SCHEDULED/COMPLETED slots in the retreat and the retreat's confirmed attendees"
    constants:
      FACILITATOR_FLAT_CENTS: 40000
      PER_HEAD_CENTS: 3000
    precision: "cents, exact integers"
    variants:
      - name: per_session_flat
        when: "provisional payout quoted at scheduling time"
        difference: "payout = FACILITATOR_FLAT_CENTS * slots_led; ignores actual attendance."
      - name: per_head
        when: "final payout stamped when the retreat COMPLETES"
        difference: "payout = PER_HEAD_CENTS * attendee_count; ignores slot count."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /v1/guests (Anonymous)"
  - priority: 2
    category: auth
    check: "role is permitted for this operation per §1.7; entity-backed role acts on own resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every referenced resource (path id and body FK) exists; validated left-to-right"
    error_id: ERR_RETREAT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking ids"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, integers non-negative, end > start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "target resource is in a state from which this transition is allowed (includes cross-entity: Retreat.status==PUBLISHED for booking create; Facilitator.status==ACTIVE for slot create)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_retreat_version equals current Retreat.version"
    error_id: ERR_STALE_RETREAT_VERSION
    http_status: 412
    applies_to: "POST /v1/bookings"
  - priority: 7
    category: business_safety
    check: "Waiver for the booking is CLEARED before pay-balance/check-in"
    error_id: ERR_WAIVER_NOT_CLEARED
    http_status: 422
    applies_to: "POST /v1/bookings/{id}/pay-balance, POST /v1/bookings/{id}/check-in"
  - priority: 8
    category: business_temporal
    check: "temporal windows: check-in only at/after start_date; ActivitySlot must not overlap the facilitator's other slots (half-open) nor fall within SETUP_BUFFER_MINUTES=30 of another slot in the same room"
    error_id: ERR_CHECKIN_TOO_EARLY
    http_status: 409
    applies_to: "POST /v1/bookings/{id}/check-in, POST /v1/activity-slots"
  - priority: 9
    category: business_constraint
    check: "capacity: room bed_count, retreat capacity, shuttle seat_capacity not exceeded; room kind matches use"
    error_id: ERR_ROOM_FULL
    http_status: 409
    applies_to: "POST /v1/bookings, POST /v1/transport-segments, POST /v1/activity-slots"
  - priority: 10
    category: business_fiscal
    check: "payment amount_cents matches the expected deposit_cents / balance_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /v1/bookings/{id}/pay-deposit, POST /v1/bookings/{id}/pay-balance"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test clock control. Sets the logical current UTC. Server startup default is 2026-07-01T00:00:00Z (used for all deadline/window math until set)."
    roles: [Operator]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

  - method: POST
    path: "/v1/retreats"
    description: "Create a retreat (catalog + dates + capacity) in DRAFT."
    roles: [Operator]
    code: 201
    input: [name, theme, location, start_date, end_date, capacity, base_price_cents]
    output: Retreat
    side_effects: ["Retreat created in DRAFT"]
  - method: GET
    path: "/v1/retreats/{id}"
    description: "Fetch one retreat."
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Retreat
    side_effects: []
  - method: GET
    path: "/v1/retreats"
    description: "List retreats (paginated)."
    roles: [Operator, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Retreat[]
    side_effects: []
  - method: POST
    path: "/v1/retreats/{id}/publish"
    description: "Publish a DRAFT retreat (requires >=1 LODGING room)."
    roles: [Operator]
    code: 200
    input: []
    output: Retreat
    side_effects: ["Retreat DRAFT->PUBLISHED", "increments Retreat.version by 1"]
  - method: POST
    path: "/v1/retreats/{id}/cancel"
    description: "Cancel a retreat; cascades booking cancellations (full refunds), transport releases, slot cancellations."
    roles: [Operator]
    code: 200
    input: []
    output: Retreat
    side_effects: ["Retreat -> CANCELLED", "cascade A: bookings->CANCELLED (operator variant full refund)->transport segments->shuttle seats; slots->CANCELLED", "increments Retreat.version by 1"]
  - method: POST
    path: "/v1/retreats/{id}/complete"
    description: "Complete a retreat once past end_date; stamps facilitator final payouts."
    roles: [Operator]
    code: 200
    input: []
    output: Retreat
    side_effects: ["Retreat -> COMPLETED", "facilitator_payout final variant stamped", "checked-in bookings & scheduled slots -> COMPLETED", "increments Retreat.version by 1"]
  - method: GET
    path: "/v1/retreats/{id}/rooms"
    description: "List rooms of a retreat (reverse-reachability for Room.retreat_id)."
    roles: [Operator, Guest]
    code: 200
    input: ["kind?"]
    output: Room[]
    side_effects: []
  - method: GET
    path: "/v1/retreats/{id}/shuttles"
    description: "List shuttles of a retreat (reverse-reachability for Shuttle.retreat_id)."
    roles: [Operator, Guest]
    code: 200
    input: ["direction?"]
    output: Shuttle[]
    side_effects: []

  - method: POST
    path: "/v1/rooms"
    description: "Create a room (LODGING or COMMON) under a retreat."
    roles: [Operator]
    code: 201
    input: [retreat_id, kind, tier, tier_delta_cents, bed_count, label]
    output: Room
    side_effects: ["Room created"]

  - method: POST
    path: "/v1/guests"
    description: "Self-register a guest (anonymous)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, "phone?", "dietary_notes?", "health_notes?"]
    output: Guest
    side_effects: ["Guest created"]
  - method: GET
    path: "/v1/guests/{id}"
    description: "Fetch a guest profile."
    roles: [Guest, Operator]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: POST
    path: "/v1/facilitators"
    description: "Create a facilitator (ACTIVE)."
    roles: [Operator]
    code: 201
    input: [full_name, email, specialty]
    output: Facilitator
    side_effects: ["Facilitator created"]
  - method: GET
    path: "/v1/facilitators/{id}"
    description: "Fetch a facilitator (with payout_cents)."
    roles: [Operator, Facilitator]
    code: 200
    input: []
    output: Facilitator
    side_effects: []
  - method: POST
    path: "/v1/facilitators/{id}/withdraw"
    description: "Withdraw a facilitator; cascades cancellation of their scheduled slots."
    roles: [Operator]
    code: 200
    input: []
    output: Facilitator
    side_effects: ["Facilitator ACTIVE->WITHDRAWN", "cascade B: SCHEDULED slots -> CANCELLED; Retreat.schedule_ready recomputed", "increments Facilitator.version by 1"]

  - method: POST
    path: "/v1/bookings"
    description: "Create a booking (holds beds/seats) against a PUBLISHED retreat; OCC on retreat version."
    roles: [Guest]
    code: 201
    input: [retreat_id, guest_id, room_id, party_size, "has_special_diet?", "addon_ids?", expected_retreat_version]
    output: Booking
    side_effects: ["Booking created PENDING_DEPOSIT", "booking_total_charge + booking_tax computed", "Room.reserved_beds & Retreat.reserved_count += party_size; may push Retreat -> FULL", "increments Retreat.version by 1"]
  - method: GET
    path: "/v1/bookings/{id}"
    description: "Fetch one booking with computed charges."
    roles: [Guest, Operator]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/v1/bookings"
    description: "List bookings filtered by retreat, guest, or room (reverse-reachability for Booking FKs)."
    roles: [Guest, Operator]
    code: 200
    input: ["retreat_id?", "guest_id?", "room_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/v1/bookings/{id}/pay-deposit"
    description: "Pay the deposit; PENDING_DEPOSIT -> DEPOSIT_PAID."
    roles: [Guest]
    code: 200
    input: [amount_cents]
    output: Booking
    side_effects: ["Payment{DEPOSIT} created", "amount_paid_cents += deposit_cents"]
  - method: POST
    path: "/v1/bookings/{id}/pay-balance"
    description: "Pay the balance; DEPOSIT_PAID -> CONFIRMED (requires cleared waiver)."
    roles: [Guest]
    code: 200
    input: [amount_cents]
    output: Booking
    side_effects: ["Payment{BALANCE} created", "amount_paid_cents += balance_due_cents"]
  - method: POST
    path: "/v1/bookings/{id}/cancel"
    description: "Guest cancels own booking; issues tiered refund, releases beds/seats, cancels transport."
    roles: [Guest]
    code: 200
    input: []
    output: Booking
    side_effects: ["Booking -> CANCELLED (cancelled_by=GUEST)", "cancellation_refund guest variant", "Room/Retreat seat release; FULL->PUBLISHED if applicable", "TransportSegments -> CANCELLED"]
  - method: POST
    path: "/v1/bookings/{id}/check-in"
    description: "Operator checks in a CONFIRMED booking on/after start_date."
    roles: [Operator]
    code: 200
    input: []
    output: Booking
    side_effects: ["Booking CONFIRMED -> CHECKED_IN"]
  - method: GET
    path: "/v1/bookings/{id}/payments"
    description: "List payment/refund events of a booking (reverse-reachability for Payment.booking_id)."
    roles: [Guest, Operator]
    code: 200
    input: []
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/v1/bookings/{id}/waiver"
    description: "List the waiver (0 or 1) of a booking (reverse-reachability for Waiver.booking_id)."
    roles: [Guest, Operator]
    code: 200
    input: []
    output: Waiver[]
    side_effects: []

  - method: POST
    path: "/v1/waivers"
    description: "Create a PENDING waiver for a booking."
    roles: [Guest]
    code: 201
    input: [booking_id, health_disclosures]
    output: Waiver
    side_effects: ["Waiver created PENDING"]
  - method: POST
    path: "/v1/waivers/{id}/sign"
    description: "Guest signs; PENDING -> SIGNED."
    roles: [Guest]
    code: 200
    input: [signature_name]
    output: Waiver
    side_effects: ["Waiver -> SIGNED", "increments Waiver.version by 1"]
  - method: POST
    path: "/v1/waivers/{id}/review"
    description: "Operator reviews; SIGNED -> CLEARED or REJECTED."
    roles: [Operator]
    code: 200
    input: [decision]
    output: Waiver
    side_effects: ["Waiver -> CLEARED|REJECTED", "increments Waiver.version by 1"]

  - method: POST
    path: "/v1/activity-slots"
    description: "Schedule a facilitator-led slot in a COMMON room; enforces facilitator overlap and room buffer."
    roles: [Operator]
    code: 201
    input: [retreat_id, facilitator_id, room_id, title, start_datetime, end_datetime]
    output: ActivitySlot
    side_effects: ["ActivitySlot created SCHEDULED", "Retreat.schedule_ready := true"]
  - method: GET
    path: "/v1/activity-slots/{id}"
    description: "Fetch one activity slot."
    roles: [Operator, Guest, Facilitator]
    code: 200
    input: []
    output: ActivitySlot
    side_effects: []
  - method: GET
    path: "/v1/activity-slots"
    description: "List activity slots filtered by retreat, facilitator, or room (reverse-reachability for ActivitySlot FKs)."
    roles: [Operator, Guest, Facilitator]
    code: 200
    input: ["retreat_id?", "facilitator_id?", "room_id?", "status?", "limit?", "offset?"]
    output: ActivitySlot[]
    side_effects: []
  - method: POST
    path: "/v1/activity-slots/{id}/cancel"
    description: "Cancel a scheduled slot."
    roles: [Operator]
    code: 200
    input: []
    output: ActivitySlot
    side_effects: ["ActivitySlot SCHEDULED -> CANCELLED", "Retreat.schedule_ready recomputed"]

  - method: POST
    path: "/v1/shuttles"
    description: "Create an airport shuttle for a retreat."
    roles: [Operator]
    code: 201
    input: [retreat_id, direction, depart_datetime, seat_capacity]
    output: Shuttle
    side_effects: ["Shuttle created"]

  - method: POST
    path: "/v1/transport-segments"
    description: "Reserve shuttle seats for a booking's party (capacity checked)."
    roles: [Guest]
    code: 201
    input: [booking_id, shuttle_id]
    output: TransportSegment
    side_effects: ["seat_count := booking.party_size", "Shuttle.reserved_seats += seat_count"]
  - method: GET
    path: "/v1/transport-segments/{id}"
    description: "Fetch one transport segment."
    roles: [Guest, Operator]
    code: 200
    input: []
    output: TransportSegment
    side_effects: []
  - method: GET
    path: "/v1/transport-segments"
    description: "List transport segments filtered by booking or shuttle (reverse-reachability for TransportSegment FKs)."
    roles: [Guest, Operator]
    code: 200
    input: ["booking_id?", "shuttle_id?", "status?", "limit?", "offset?"]
    output: TransportSegment[]
    side_effects: []

  - method: POST
    path: "/v1/addons"
    description: "Create a catalog add-on."
    roles: [Operator]
    code: 201
    input: [name, category, price_cents]
    output: AddOn
    side_effects: ["AddOn created"]
  - method: GET
    path: "/v1/addons/{id}"
    description: "Fetch one add-on."
    roles: [Operator, Guest]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: POST
    path: "/v1/booking-addons"
    description: "Attach a catalog add-on to a PENDING_DEPOSIT booking; snapshots price and recomputes charges."
    roles: [Guest]
    code: 201
    input: [booking_id, addon_id]
    output: BookingAddOn
    side_effects: ["price_cents_snapshot captured", "booking_total_charge + booking_tax recomputed"]
  - method: GET
    path: "/v1/booking-addons/{id}"
    description: "Fetch one booking-addon link."
    roles: [Guest, Operator]
    code: 200
    input: []
    output: BookingAddOn
    side_effects: []
  - method: GET
    path: "/v1/booking-addons"
    description: "List booking-addon links filtered by booking or addon (reverse-reachability for BookingAddOn FKs)."
    roles: [Guest, Operator]
    code: 200
    input: ["booking_id?", "addon_id?", "limit?", "offset?"]
    output: BookingAddOn[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or entity-backed role acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, bad enum, negative amount, end <= start"
  - id: ERR_RETREAT_NOT_FOUND
    http: 404
    condition: "retreat id not found"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "room id not found"
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "guest id not found"
  - id: ERR_FACILITATOR_NOT_FOUND
    http: 404
    condition: "facilitator id not found"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking id not found"
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "waiver id not found"
  - id: ERR_SHUTTLE_NOT_FOUND
    http: 404
    condition: "shuttle id not found"
  - id: ERR_ADDON_NOT_FOUND
    http: 404
    condition: "addon id not found"
  - id: ERR_ACTIVITY_SLOT_NOT_FOUND
    http: 404
    condition: "activity slot id not found"
  - id: ERR_TRANSPORT_SEGMENT_NOT_FOUND
    http: 404
    condition: "transport segment id not found"
  - id: ERR_BOOKING_ADDON_NOT_FOUND
    http: 404
    condition: "booking-addon id not found"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a valid state for the transition (includes Retreat not PUBLISHED for booking create, Facilitator not ACTIVE for slot create, booking not payable/cancellable, waiver not signed)"
  - id: ERR_STALE_RETREAT_VERSION
    http: 412
    condition: "expected_retreat_version != current Retreat.version on booking create (OCC)"
  - id: ERR_WAIVER_NOT_CLEARED
    http: 422
    condition: "pay-balance or check-in attempted while the booking's waiver is not CLEARED"
  - id: ERR_CHECKIN_TOO_EARLY
    http: 409
    condition: "check-in attempted before Retreat.start_date"
  - id: ERR_FACILITATOR_DOUBLE_BOOKED
    http: 409
    condition: "activity slot [start,end) overlaps another SCHEDULED slot of the same facilitator (half-open; adjacency allowed)"
  - id: ERR_SPACE_UNAVAILABLE
    http: 409
    condition: "activity slot falls within SETUP_BUFFER_MINUTES=30 of another SCHEDULED slot in the same room"
  - id: ERR_ROOM_FULL
    http: 409
    condition: "room.reserved_beds + party_size > room.bed_count"
  - id: ERR_RETREAT_FULL
    http: 409
    condition: "retreat.reserved_count + party_size > retreat.capacity"
  - id: ERR_SHUTTLE_FULL
    http: 409
    condition: "shuttle.reserved_seats + party_size > shuttle.seat_capacity"
  - id: ERR_ROOM_KIND_MISMATCH
    http: 422
    condition: "booking a non-LODGING room, or scheduling an activity in a non-COMMON room"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents != expected deposit_cents (deposit) or balance_due_cents (balance)"
  - id: ERR_WAIVER_ALREADY_EXISTS
    http: 409
    condition: "a waiver already exists for this booking"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as a guest."
    identity: "opaque"
    exclusive_operations: ["POST /v1/guests"]
    shared_operations: []
  - name: Guest
    description: "A registered guest booking a retreat; owns their bookings, payments, waivers, transport, add-ons."
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /v1/bookings"
      - "POST /v1/bookings/{id}/pay-deposit"
      - "POST /v1/bookings/{id}/pay-balance"
      - "POST /v1/bookings/{id}/cancel"
      - "POST /v1/waivers"
      - "POST /v1/waivers/{id}/sign"
      - "POST /v1/transport-segments"
      - "POST /v1/booking-addons"
    shared_operations:
      - "GET /v1/retreats, GET /v1/retreats/{id}, GET /v1/retreats/{id}/rooms, GET /v1/retreats/{id}/shuttles"
      - "GET /v1/bookings, GET /v1/bookings/{id}, GET /v1/bookings/{id}/payments, GET /v1/bookings/{id}/waiver"
      - "GET /v1/activity-slots, GET /v1/activity-slots/{id}, GET /v1/addons/{id}"
      - "GET /v1/transport-segments, GET /v1/transport-segments/{id}, GET /v1/booking-addons, GET /v1/booking-addons/{id}, GET /v1/guests/{id}"
  - name: Operator
    description: "Retreat operator; manages catalog, sessions, rooms, facilitators, schedule, shuttles, add-ons, cancellations, check-in, waiver review, and the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc"
