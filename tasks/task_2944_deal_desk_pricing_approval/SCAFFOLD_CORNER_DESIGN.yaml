      - name: submit_of_a_multi_element_quote_without_cleared_revrec_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.P14_structural_submit_gates
          - errors.ERR_REVREC_NOT_CLEARED
          - calculations.C7_revrec_allocation
          - state_machines.RevRecAssessment.ASSESSED_to_CLEARED
        distinguishing_aspect: |
          The gate reads a different entity's state, not the quote's own: a MULTI_ELEMENT quote whose
          only RevRecAssessment is still ASSESSED is rejected with ERR_REVREC_NOT_CLEARED (422), and the
          same submit succeeds the moment the accountant clears that assessment — a SINGLE_ELEMENT quote
          would never consult a RevRecAssessment at all.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote, term_months 12, payment_terms_days 30, with a Core Platform line of quantity 10 at requested_discount_pct 0 (RATABLE, list 1200000, net 1200000) and an Implementation Services line of quantity 1 at requested_discount_pct 0 (POINT_IN_TIME, list 200000, net 200000) — two distinct rev-rec categories and no usage line, so C7 reports MULTI_ELEMENT."
            - "One RevRecAssessment created for that quote and left in ASSESSED."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Platform Plus Services", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { core_line_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${svc_id}", quantity: 1, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { svc_line_id: $.data.id }
            - call: "POST /revrec-assessments"
              payload: { quote_id: "${q_id}" }
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures: { ra_id: $.data.id, ra_status: $.data.status, ra_type: $.data.arrangement_type, ra_allocable: $.data.allocable_amount_cents }
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /revrec-assessments/${ra_id}/assess"
              payload: { decision: "CLEAR", assessment_note: "Allocation reviewed" }
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures: { ra_cleared: $.data.status }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q2_status: $.data.status, q2_level: $.data.required_approval_level }
          assert:
            - "${ra_status} == ASSESSED"
            - "${ra_type} == MULTI_ELEMENT"
            - "${ra_allocable} == 1400000"
            - "${err_id} == ERR_REVREC_NOT_CLEARED"
            - "HTTP status == 422"
            - "${ra_cleared} == CLEARED"
            - "${q2_level} == 0"
            - "${q2_status} == APPROVED"
            - "Quote.${q_id}.status == APPROVED"

      - name: state_error_outranks_the_fiscal_floor_on_resubmit
        claim_type: priority_conflict
