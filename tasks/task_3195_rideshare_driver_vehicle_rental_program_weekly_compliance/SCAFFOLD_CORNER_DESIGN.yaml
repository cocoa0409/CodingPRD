      - name: delivery_vans_cannot_serve_ride_only_assignment
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MODEL_NOT_QUALIFIED]
          - validations[priority=17]
          - entities.ProgramVehicle.fields.vehicle_class
        distinguishing_aspect: |
          A DELIVERY_VAN unit carries qualifies_ride false, so assigning it on an agreement
          whose platform activity requires rides is refused with ERR_MODEL_NOT_QUALIFIED at
          status 409 rather than ERR_VEHICLE_NOT_AVAILABLE.
        test_recipe:
          setup: ["one verified enrollment and one AVAILABLE DELIVERY_VAN unit"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "3VWFE21C04M000001", model_name: "Sprinter", model_year: 2023, vehicle_class: "DELIVERY_VAN", odometer_miles: 18000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /program/platform-checks"
              payload: { agreement_id: "${e_id}", vehicle_id: "${v_id}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_MODEL_NOT_QUALIFIED with status 409"
            - "the same check against a STANDARD unit returns 201 with integration_result QUALIFIED and ride_qualified true"
            - "ProgramVehicle.${v_id}.qualifies_ride is false"

      - name: grace_not_lapsed_refuses_declaration
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GRACE_NOT_LAPSED]
          - validations[priority=22]
          - state_machines.RentalWeek.GRACE_to_DELINQUENT
        distinguishing_aspect: |
          Declaring a week delinquent before its grace_deadline is refused with
          ERR_GRACE_NOT_LAPSED at status 422, and the identical call one hour past the
          deadline succeeds.
        test_recipe:
          setup: ["one agreement with week 1 settled to DUE, grace_deadline 2026-09-11T00:00:00Z"]
          setup_api_calls:
