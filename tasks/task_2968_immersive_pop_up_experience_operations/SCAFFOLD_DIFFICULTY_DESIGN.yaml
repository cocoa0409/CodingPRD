              as: GuestServicesAgent
              as_user_id: "gsa-1"
              captures: { order3_id: $.data.id }
            - call: "POST /ticket-orders"
              payload: { slot_id: "${slot_id}", guest_account_id: "${guest_id}", order_type: "SINGLE", party_size: 4, wheelchair_party_count: 0, sensory_accommodations: [], merch_amount_cents: 25020 }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
              captures: { order4_id: $.data.id }
            - call: "POST /ticket-orders/${order1_id}/confirm"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /ticket-orders/${order2_id}/confirm"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /ticket-orders/${order4_id}/confirm"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: GuestServicesAgent
            - call: "POST /ticket-orders/${order4_id}/cancel"
              payload: { reason: "schedule change" }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /ticket-orders/${order4_id}/settle-refund"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T14:30:00Z" }
              as: GuestServicesAgent
            - call: "POST /ticket-orders/${order1_id}/attendance"
              payload: { decision: "CHECK_IN" }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { run_v1: $.data.version }
          trigger:
            - call: "POST /royalty-statements"
              payload: { run_id: "${run_id}", period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_run_version: "${run_v1}" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { statement_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /royalty-statements/${statement_id}/finalize"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
          assert:
            - "RoyaltyStatement.${statement_id}.ticket_base_cents == 429996 immediately after the create call (O1 + O2 + O3, the REFUNDED O4 excluded)"
            - "RoyaltyStatement.${statement_id}.merch_base_cents == 75060 immediately after the create call"
            - "RoyaltyStatement.${statement_id}.provisional_royalty_cents == 59380 (legs 53749.5 -> 53750 and 5629.5 -> 5630, rounded separately)"
            - "RoyaltyStatement.${statement_id}.final_royalty_cents == 37710 (ticket leg 35833 over net_collected_cents 286664, merch leg 1877 over CHECKED_IN merch 25020)"
            - "RoyaltyStatement.${statement_id}.provisional_royalty_cents - RoyaltyStatement.${statement_id}.final_royalty_cents == 21670"
            - "RoyaltyStatement.${statement_id}.mg_prorated_cents == 37802"
            - "RoyaltyStatement.${statement_id}.minimum_guarantee_shortfall_cents == 92"
            - "RoyaltyStatement.${statement_id}.amount_due_cents == 37802"
            - "RoyaltyStatement.${statement_id}.status == ISSUED"
            - "TicketOrder.${order4_id}.net_collected_cents == 0 and TicketOrder.${order4_id}.status == REFUNDED"

      - name: readiness_preflight_clears_while_audit_refuses
        grounds:
          - calculations.staff_readiness_score
          - entities.StaffMember.fields.readiness_score_preflight
          - entities.StaffMember.fields.readiness_score_audit
          - state_machines.StaffMember.TRAINING_to_CLEARED
          - validations[priority=140]
          - errors[ERR_STAFF_READINESS_BELOW_MIN]
        distinguishing_aspect: |
          The preflight variant counts completed_rehearsal_count + scheduled_rehearsal_count while
          the audit variant counts completed_rehearsal_count only, so one training record yields
          readiness_score_preflight 87.80 (above READINESS_CLEAR_MIN 78.00) and
          readiness_score_audit 75.30 (below it) on the same row, and the CLEAR gate - which reads
          the audit variant only - refuses with ERR_STAFF_READINESS_BELOW_MIN.
        test_recipe:
          setup:
            - "One PLANNED run at an NYC venue under an ACTIVE licence; no rooms or slots are needed."
            - "One PERFORMER staff member holding both required certifications (cert_coverage_pct 100.00) with incident_count 1."
            - "One training record: training_score 82, completed_rehearsal_count 2, scheduled_rehearsal_count 2, incident_delta 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
