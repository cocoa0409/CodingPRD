scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: adg_lifetime_vs_interval_diverge
        grounds:
          - calculations.average_daily_gain
          - entities.Animal.fields.lifetime_adg_kg
          - entities.WeightRecord.fields.interval_adg_kg
        distinguishing_aspect: "For the same second weighing the lifetime variant (gain since birth / age-in-days) yields 1.411 while the interval variant (gain since prior weighing / gap-in-days) yields 1.5 — two different ADG numbers on the Animal vs the WeightRecord domains from identical data."
        test_recipe:
          setup:
            - "Clock at 2026-04-01. One CATTLE herd, one animal born 2026-01-01 at 38.0 kg, two weighings: 2026-03-02=120.0 kg then 2026-04-01=165.0 kg."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H1", species: "CATTLE", premises_id: "PR-0398-1" }
              as: HerdManager
              captures: { herd1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd1}", ear_tag: "A001", sex: "FEMALE", birth_date: "2026-01-01", birth_weight_kg: 38.0 }
              as: HerdManager
              captures: { a1: $.data.id }
            - call: "POST /animals/${a1}/weights"
              payload: { weighed_at: "2026-03-02", weight_kg: 120.0 }
              as: HerdManager
            - call: "POST /animals/${a1}/weights"
              payload: { weighed_at: "2026-04-01", weight_kg: 165.0 }
              as: HerdManager
              captures: { wr2_interval: $.data.interval_adg_kg }
          trigger:
            - call: "GET /animals/${a1}"
              as: HerdManager
              captures: { lifetime: $.data.lifetime_adg_kg }
          assert:
            - "Animal.${a1}.lifetime_adg_kg == 1.411"
            - "WeightRecord(2026-04-01).interval_adg_kg == 1.5"
            - "Animal.${a1}.lifetime_adg_kg != WeightRecord(2026-04-01).interval_adg_kg"

      - name: sale_pricing_auction_vs_private_treaty
        grounds:
          - calculations.weight_ticket_pricing
          - entities.SaleLot.fields.commission_amount
          - entities.SaleLot.fields.net_proceeds
        distinguishing_aspect: "On the SaleLot domain the AUCTION variant charges commission (gross 2200.00 - commission 88.00 = net 2112.00 at 4%) while the PRIVATE_TREATY variant forces commission to 0 so net_proceeds equals gross 2200.00 — different net for the same single 500 kg / 0-shrink ticket."
        test_recipe:
          setup:
            - "Clock 2026-04-01. One herd, one ACTIVE CLEAR animal weighed 500 kg. Two lots: an AUCTION lot (shrink 0, commission 0.04) and a PRIVATE_TREATY lot (shrink 0, commission 0), each given a 500 kg ticket; sell each. Two animals so each lot has its own."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H2", species: "CATTLE", premises_id: "PR-0398-2" }
              as: HerdManager
              captures: { herd2: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd2}", ear_tag: "B001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ab1: $.data.id }
            - call: "POST /animals/${ab1}/weights"
              payload: { weighed_at: "2026-03-15", weight_kg: 500.0 }
              as: HerdManager
            - call: "POST /animals"
              payload: { herd_id: "${herd2}", ear_tag: "B002", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ab2: $.data.id }
            - call: "POST /animals/${ab2}/weights"
              payload: { weighed_at: "2026-03-15", weight_kg: 500.0 }
              as: HerdManager
            - call: "POST /sale-lots"
              payload: { herd_id: "${herd2}", channel: "AUCTION", pencil_shrink_pct: 0, commission_pct: 0.04 }
              as: SaleClerk
              captures: { lotA: $.data.id, lotA_v0: $.data.version }
            - call: "POST /sale-lots/${lotA}/tickets"
              payload: { animal_id: "${ab1}", gross_weight_kg: 500.0, expected_sale_lot_version: "${lotA_v0}" }
              as: SaleClerk
            - call: "POST /sale-lots/${lotA}/sell"
              as: SaleClerk
            - call: "POST /sale-lots"
              payload: { herd_id: "${herd2}", channel: "PRIVATE_TREATY", pencil_shrink_pct: 0, commission_pct: 0 }
              as: SaleClerk
              captures: { lotP: $.data.id, lotP_v0: $.data.version }
            - call: "POST /sale-lots/${lotP}/tickets"
              payload: { animal_id: "${ab2}", gross_weight_kg: 500.0, expected_sale_lot_version: "${lotP_v0}" }
              as: SaleClerk
          trigger:
            - call: "POST /sale-lots/${lotP}/sell"
              as: SaleClerk
              captures: { ptnet: $.data.net_proceeds }
          assert:
            - "SaleLot.${lotA}.gross_sale_amount == 2200.00"
            - "SaleLot.${lotA}.commission_amount == 88.00"
            - "SaleLot.${lotA}.net_proceeds == 2112.00"
            - "SaleLot.${lotP}.commission_amount == 0.00"
            - "SaleLot.${lotP}.net_proceeds == 2200.00"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_pricing_tier_shrink_commission_mode_a
        grounds:
          - calculations.weight_ticket_pricing
          - entities.WeightTicket.fields.price_per_100kg
          - entities.WeightTicket.fields.gross_line_amount
        distinguishing_aspect: "Mode (a) non-linear ≥3-input formula: net = gross*(1-shrink) then a tier price_per_100kg is chosen by a branch on the per-head net weight class then gross_line = net/100*price — a 460 kg ticket at 3% shrink lands net 446.2 in the HEAVY (>=400) tier at 440.00 giving 1963.28."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd + one ACTIVE CLEAR animal. AUCTION lot shrink 0.03 commission 0.05. One 460 kg ticket."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H3", species: "CATTLE", premises_id: "PR-0398-3" }
              as: HerdManager
              captures: { herd3: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd3}", ear_tag: "C001", sex: "STEER", birth_date: "2024-06-01", birth_weight_kg: 45.0 }
              as: HerdManager
              captures: { ac1: $.data.id }
            - call: "POST /animals/${ac1}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 460.0 }
              as: HerdManager
            - call: "POST /sale-lots"
              payload: { herd_id: "${herd3}", channel: "AUCTION", pencil_shrink_pct: 0.03, commission_pct: 0.05 }
              as: SaleClerk
              captures: { lot3: $.data.id, lot3_v0: $.data.version }
          trigger:
            - call: "POST /sale-lots/${lot3}/tickets"
              payload: { animal_id: "${ac1}", gross_weight_kg: 460.0, expected_sale_lot_version: "${lot3_v0}" }
              as: SaleClerk
              captures: { tk: $.data.id }
          assert:
            - "WeightTicket.${tk}.net_weight_kg == 446.2"
            - "WeightTicket.${tk}.price_per_100kg == 440.00"
            - "WeightTicket.${tk}.gross_line_amount == 1963.28"

      - name: lot_total_rounding_order_mode_b
        grounds:
          - calculations.weight_ticket_pricing
          - entities.SaleLot.fields.gross_sale_amount
          - state_machines.SaleLot.OPEN_to_SOLD
        distinguishing_aspect: "Mode (b) nested-rounding order is pinned: two 261 kg / 3%-shrink tickets each net 253.17 in the MEDIUM tier (480) round per-ticket to 1215.22 and the lot sums to 2430.44 — whereas sum-then-round would give 2430.43; the scaffold pins per-ticket-round-then-sum."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd + two ACTIVE CLEAR animals. PRIVATE_TREATY lot shrink 0.03 commission 0. Two 261 kg tickets; sell."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H4", species: "CATTLE", premises_id: "PR-0398-4" }
              as: HerdManager
              captures: { herd4: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd4}", ear_tag: "D001", sex: "STEER", birth_date: "2024-06-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ad1: $.data.id }
            - call: "POST /animals/${ad1}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 270.0 }
              as: HerdManager
            - call: "POST /animals"
              payload: { herd_id: "${herd4}", ear_tag: "D002", sex: "STEER", birth_date: "2024-06-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ad2: $.data.id }
            - call: "POST /animals/${ad2}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 270.0 }
              as: HerdManager
            - call: "POST /sale-lots"
              payload: { herd_id: "${herd4}", channel: "PRIVATE_TREATY", pencil_shrink_pct: 0.03, commission_pct: 0 }
              as: SaleClerk
              captures: { lot4: $.data.id, lot4_v0: $.data.version }
            - call: "POST /sale-lots/${lot4}/tickets"
              payload: { animal_id: "${ad1}", gross_weight_kg: 261.0, expected_sale_lot_version: "${lot4_v0}" }
              as: SaleClerk
              captures: { tk1: $.data.id, lot4_v1: $.data.version }
            - call: "POST /sale-lots/${lot4}/tickets"
              payload: { animal_id: "${ad2}", gross_weight_kg: 261.0, expected_sale_lot_version: "${lot4_v1}" }
              as: SaleClerk
              captures: { tk2: $.data.id }
          trigger:
            - call: "POST /sale-lots/${lot4}/sell"
              as: SaleClerk
              captures: { gross: $.data.gross_sale_amount }
          assert:
            - "WeightTicket.${tk1}.gross_line_amount == 1215.22"
            - "WeightTicket.${tk2}.gross_line_amount == 1215.22"
            - "SaleLot.${lot4}.gross_sale_amount == 2430.44"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: breeding_cycle_confirmed_back_to_open
        grounds:
          - state_machines.BreedingRecord.CONFIRMED_PREGNANT_to_OPEN
          - state_machines.BreedingRecord.OPEN_to_BRED
          - entities.BreedingRecord.fields.status
        distinguishing_aspect: "BreedingRecord is cyclic: OPEN->BRED->CONFIRMED_PREGNANT->OPEN->BRED re-traverses the same states (a pregnancy loss returns the dam to OPEN and re-breeding moves it forward again), unlike a linear pipeline."
        test_recipe:
          setup:
            - "Clock 2026-04-01. CATTLE herd, one FEMALE ACTIVE dam. Breeding record taken OPEN->BRED->CONFIRMED_PREGNANT, then back to OPEN (loss), then BRED again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H5", species: "CATTLE", premises_id: "PR-0398-5" }
              as: HerdManager
              captures: { herd5: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd5}", ear_tag: "E001", sex: "FEMALE", birth_date: "2022-01-01", birth_weight_kg: 42.0 }
              as: HerdManager
              captures: { dam5: $.data.id }
            - call: "POST /breeding-records"
              payload: { dam_animal_id: "${dam5}", bred_on: "2026-02-01" }
              as: HerdManager
              captures: { br5: $.data.id }
            - call: "POST /breeding-records/${br5}/transition"
              payload: { to_status: "BRED" }
              as: HerdManager
            - call: "POST /breeding-records/${br5}/transition"
              payload: { to_status: "CONFIRMED_PREGNANT" }
              as: Veterinarian
            - call: "POST /breeding-records/${br5}/transition"
              payload: { to_status: "OPEN" }
              as: HerdManager
          trigger:
            - call: "POST /breeding-records/${br5}/transition"
              payload: { to_status: "BRED" }
              as: HerdManager
              captures: { st: $.data.status }
          assert:
            - "BreedingRecord.${br5}.status == BRED"
            - "BreedingRecord.${br5}.expected_calving_on == 2026-11-11"

      - name: animal_parallel_dimensions_clearance_cycle
        grounds:
          - state_machines.Animal.CLEAR_to_WITHHELD
          - state_machines.Animal.WITHHELD_to_CLEAR
          - entities.Animal.fields.meat_clearance_status
          - entities.Animal.fields.life_status
        distinguishing_aspect: "Animal carries two orthogonal dimensions: life_status stays ACTIVE while meat_clearance_status cycles CLEAR->WITHHELD (on treatment) and back to CLEAR (on clock advance past clearance), evolving independently on the same row."
        test_recipe:
          setup:
            - "Clock 2026-05-01. Herd + ACTIVE animal. ANTIBIOTIC drug with INJECTION_IM=28d withdrawal. Treat 2026-05-01 -> withhold to 2026-05-29."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H6", species: "CATTLE", premises_id: "PR-0398-6" }
              as: HerdManager
              captures: { herd6: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd6}", ear_tag: "F001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { af1: $.data.id }
            - call: "POST /drug-products"
              payload: { name: "OxyJect", category: "ANTIBIOTIC", route_withdrawals: { INJECTION_IM: 28, ORAL: 14 } }
              as: Veterinarian
              captures: { drug6: $.data.id }
            - call: "POST /health-treatments"
              payload: { animal_id: "${af1}", drug_product_id: "${drug6}", route: "INJECTION_IM", first_dose_on: "2026-05-01", last_dose_on: "2026-05-01" }
              as: Veterinarian
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-29T00:00:00Z" }
              as: HerdManager
            - call: "GET /animals/${af1}"
              as: HerdManager
              captures: { mcs: $.data.meat_clearance_status, ls: $.data.life_status }
          assert:
            - "Animal.${af1}.life_status == ACTIVE"
            - "Animal.${af1}.meat_clearance_status == CLEAR"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sell_cascade_animal_pasture_herd_depth3
        grounds:
          - state_machines.SaleLot.OPEN_to_SOLD
          - state_machines.Animal.ACTIVE_to_SOLD
          - entities.Pasture.fields.current_au_load
          - entities.Herd.fields.total_au_load
        distinguishing_aspect: "Depth-3 chain from sell: SaleLot OPEN->SOLD causes Animal ACTIVE->SOLD, which itself subtracts the animal's AU from Pasture.current_au_load, which is part of the same propagation that decrements Herd.active_animal_count and total_au_load — each hop caused by the prior."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd, PEN capacity 10, one ACTIVE animal weighed 454 kg (AU 1.0), applied into the pen so Pasture.current_au_load==1.0 and Herd.total_au_load==1.0. AUCTION lot with a ticket; sell."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H7", species: "CATTLE", premises_id: "PR-0398-7" }
              as: HerdManager
              captures: { herd7: $.data.id }
            - call: "POST /pastures"
              payload: { name: "Pen7", kind: "PEN", capacity_au: 10 }
              as: HerdManager
              captures: { pen7: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd7}", ear_tag: "G001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ag1: $.data.id, ag1_v0: $.data.version }
            - call: "POST /animals/${ag1}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 454.0 }
              as: HerdManager
            - call: "POST /movement-records"
              payload: { animal_id: "${ag1}", to_pasture_id: "${pen7}", effective_from: "2026-03-21T00:00:00Z" }
              as: HerdManager
              captures: { mv7: $.data.id }
            - call: "GET /animals/${ag1}"
              as: HerdManager
              captures: { ag1_v1: $.data.version }
            - call: "POST /movement-records/${mv7}/apply"
              payload: { expected_animal_version: "${ag1_v1}" }
              as: HerdManager
            - call: "POST /sale-lots"
              payload: { herd_id: "${herd7}", channel: "AUCTION", pencil_shrink_pct: 0, commission_pct: 0.05 }
              as: SaleClerk
              captures: { lot7: $.data.id, lot7_v0: $.data.version }
            - call: "POST /sale-lots/${lot7}/tickets"
              payload: { animal_id: "${ag1}", gross_weight_kg: 454.0, expected_sale_lot_version: "${lot7_v0}" }
              as: SaleClerk
          trigger:
            - call: "POST /sale-lots/${lot7}/sell"
              as: SaleClerk
          assert:
            - "Animal.${ag1}.life_status == SOLD"
            - "Pasture.${pen7}.current_au_load == 0.0"
            - "Herd.${herd7}.total_au_load == 0.0"
            - "Herd.${herd7}.active_animal_count == 0"

      - name: mortality_void_reactivation_depth2
        grounds:
          - state_machines.MortalityRecord.RECORDED_to_VOIDED
          - state_machines.Animal.DEAD_to_ACTIVE
          - entities.Herd.fields.active_animal_count
        distinguishing_aspect: "Depth-2 chain from mortality void: MortalityRecord RECORDED->VOIDED causes Animal DEAD->ACTIVE, which itself restores Herd.active_animal_count — the count change is caused by the animal re-activation, not directly by the void."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd with one ACTIVE animal (active_animal_count 1). Record its death (count -> 0, animal DEAD)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H8", species: "CATTLE", premises_id: "PR-0398-8" }
              as: HerdManager
              captures: { herd8: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd8}", ear_tag: "H001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ah1: $.data.id }
            - call: "POST /mortality-records"
              payload: { animal_id: "${ah1}", died_on: "2026-03-30", cause: "DISEASE" }
              as: HerdManager
              captures: { mr8: $.data.id }
          trigger:
            - call: "POST /mortality-records/${mr8}/void"
              as: HerdManager
            - call: "GET /animals/${ah1}"
              as: HerdManager
              captures: { ls: $.data.life_status }
          assert:
            - "MortalityRecord.${mr8}.status == VOIDED"
            - "Animal.${ah1}.life_status == ACTIVE"
            - "Herd.${herd8}.active_animal_count == 1"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_sell_withheld_nonopen_lot
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WITHDRAWAL_NOT_CLEARED]
        distinguishing_aspect: "A WITHDRAWN lot (state, priority 5, ERR_INVALID_STATE 409) that also contains a now-WITHHELD animal (business_safety, priority 8, ERR_WITHDRAWAL_NOT_CLEARED 409): the lower-priority state check wins, returning ERR_INVALID_STATE — distinct from the safety/state pair below."
        test_recipe:
          setup:
            - "Clock 2026-05-01. Herd + animal weighed 500 kg. AUCTION lot OPEN with a ticket; WITHDRAW the lot. Then treat the animal IM 28d so it is WITHHELD. Attempt to sell the WITHDRAWN lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H9", species: "CATTLE", premises_id: "PR-0398-9" }
              as: HerdManager
              captures: { herd9: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd9}", ear_tag: "I001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ai1: $.data.id }
            - call: "POST /animals/${ai1}/weights"
              payload: { weighed_at: "2026-04-20", weight_kg: 500.0 }
              as: HerdManager
            - call: "POST /sale-lots"
              payload: { herd_id: "${herd9}", channel: "AUCTION", pencil_shrink_pct: 0, commission_pct: 0.05 }
              as: SaleClerk
              captures: { lot9: $.data.id, lot9_v0: $.data.version }
            - call: "POST /sale-lots/${lot9}/tickets"
              payload: { animal_id: "${ai1}", gross_weight_kg: 500.0, expected_sale_lot_version: "${lot9_v0}" }
              as: SaleClerk
            - call: "POST /sale-lots/${lot9}/withdraw"
              as: SaleClerk
            - call: "POST /drug-products"
              payload: { name: "OxyJect9", category: "ANTIBIOTIC", route_withdrawals: { INJECTION_IM: 28 } }
              as: Veterinarian
              captures: { drug9: $.data.id }
            - call: "POST /health-treatments"
              payload: { animal_id: "${ai1}", drug_product_id: "${drug9}", route: "INJECTION_IM", first_dose_on: "2026-05-01", last_dose_on: "2026-05-01" }
              as: Veterinarian
          trigger:
            - call: "POST /sale-lots/${lot9}/sell"
              as: SaleClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: existence_beats_pedigree_on_create_animal
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_PEDIGREE]
        distinguishing_aspect: "Creating an animal with a dam_animal_id that does not exist AND a sire_animal_id that exists but is FEMALE: existence (priority 3, ERR_NOT_FOUND 404) is checked before pedigree (priority 6, ERR_INVALID_PEDIGREE 422), so ERR_NOT_FOUND wins — a different category pair (existence vs business_referential) than the state/safety pair above."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd with one FEMALE animal (to serve as the wrong-sex sire reference). dam id is a fabricated non-existent UUID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
