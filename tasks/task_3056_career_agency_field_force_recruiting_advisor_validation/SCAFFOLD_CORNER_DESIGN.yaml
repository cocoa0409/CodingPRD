      - name: joint_case_split_credit_is_visible_in_the_submit_response_state
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.JointWorkCase.OPEN_to_SUBMITTED
          - calculations.commission_credit_allocation
        distinguishing_aspect: "allocation changes are atomic in the submit request: a read issued immediately after submit shows the split credits posted, with no lag and no reconcile endpoint."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office, two VALIDATED licensed-and-appointed REPs, an ISSUED policy of 480000 premium and an OPEN joint case at split 0.6."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
