      - name: sequence_duplicate_position_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_12_business_constraint
          - errors.ERR_SEQUENCE_DUPLICATE_POSITION
        distinguishing_aspect: "A replace payload where two entries claim line_of_travel_order 1 is rejected 409 ERR_SEQUENCE_DUPLICATE_POSITION — never resolved by id or arrival order (determinism rule)."
