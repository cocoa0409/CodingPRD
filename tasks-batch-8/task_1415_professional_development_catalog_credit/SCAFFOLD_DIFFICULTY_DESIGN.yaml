            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T12:00:00Z", ends_at: "2026-08-15T13:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m2: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T14:00:00Z", ends_at: "2026-08-15T15:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m3: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-16T10:00:00Z", ends_at: "2026-08-16T11:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m4: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-17T10:00:00Z", ends_at: "2026-08-17T11:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m5: "$.data.id" } }
