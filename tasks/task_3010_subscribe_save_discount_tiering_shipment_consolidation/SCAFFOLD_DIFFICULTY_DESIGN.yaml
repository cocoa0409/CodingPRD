  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: skip_cascades_line_count_tier_repricing_total
        grounds:
          - state_machines.PlanLine.SCHEDULED_to_SKIPPED
          - calculations.tier_discount_selection
          - calculations.line_charging_and_total
        distinguishing_aspect: |
          Depth-4 chain from the skip trigger: skip mutates PlanLine; the line
          flip forces active_line_count recompute (2); the count change forces
          tier 0.05 -> 0.00 (3); the tier change forces every surviving line's
          estimated charge to reprice 950 -> 1000 and the plan
          estimated_total_cents to move 2850 -> 2000 (4). Trigger: skip endpoint.
        test_recipe:
          setup:
            - "Logical clock default. Customer, product price 1000 stocked; three subscriptions qty 1; plan generated, tier 0.05, estimated 2850."
          setup_api_calls:
            - *d1_clock
