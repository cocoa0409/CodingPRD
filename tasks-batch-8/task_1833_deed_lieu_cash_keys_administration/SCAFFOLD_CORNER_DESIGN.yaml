scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: loan_creation_computes_per_diem
        claim_type: computed_fields
        grounds: ["entities.Loan.fields.per_diem_interest_cents", "endpoints.POST /property-solutions/loans"]
        distinguishing_aspect: "per_diem_interest_cents is computed server-side as round_half_up(20000000 * 0.06 / 365) == 3288; the response also carries system defaults status ACTIVE_DELINQUENT and version 1."
        test_recipe:
          setup: ["empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-E1", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id, pd: $.data.per_diem_interest_cents } }
          assert:
            - "Loan.${loan_id}.per_diem_interest_cents == 3288"
            - "Loan.${loan_id}.status == ACTIVE_DELINQUENT and foreclosure_referral_status == NONE (default) and version == 1"

      - name: property_creation_applies_default_condition_standard
        claim_type: defaults
        grounds: ["entities.Property.fields.required_condition_standard"]
        distinguishing_aspect: "Omitting required_condition_standard yields BROOM_CLEAN on the created Property."
        test_recipe:
          setup: ["one loan LN-E2 exists"]
          setup_api_calls:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-E2", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "7 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin, captures: { prop_id: $.data.id, std: $.data.required_condition_standard } }
          assert:
            - "Property.${prop_id}.required_condition_standard == BROOM_CLEAN"

      - name: case_creation_missing_borrower_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.WorkoutCase.fields.borrower_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases without required field borrower_id is rejected with ERR_INVALID_REQUEST (400) before any existence or state check."
        test_recipe:
          setup: ["one loan LN-E3 exists"]
          setup_api_calls:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-E3", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no case is created"

      - name: invalid_occupancy_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Property.fields.occupancy_type", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "occupancy_type outside {OWNER_OCCUPIED, TENANT_OCCUPIED, SECOND_HOME} is rejected with ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["one loan LN-E4 exists"]
          setup_api_calls:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-E4", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "8 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: "IGLOO" }, as: ServicingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM (400)"

      - name: get_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent case id returns ERR_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /property-solutions/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CASE_NOT_FOUND (404)"

      - name: cases_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "endpoints.GET /property-solutions/cases"]
        distinguishing_aspect: "List responses expose limit/offset/total_count/has_more; with one case and default pagination total_count == 1 and has_more == false, response_type == array."
        test_recipe:
          setup: ["one case exists for loan LN-E6"]
          setup_api_calls:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-E6", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "E. Six", email: "e6@x.com", hardship_type: NONE, self_reported_condition_grade: A }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: CASH_FOR_KEYS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "GET /property-solutions/cases", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
          assert:
            - "response envelope: response_type == array; pagination fields limit == 10, offset == 0, total_count == 1, has_more == false"
            - "GET /property-solutions/cases?loan_id=${loan_id} returns exactly the created case (filter works)"

      - name: property_with_unknown_loan_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Property.fields.loan_id", "errors[ERR_LOAN_NOT_FOUND]"]
        distinguishing_aspect: "Creating a Property whose loan_id does not resolve fails with ERR_LOAN_NOT_FOUND (404) — body FK integrity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /property-solutions/properties", payload: { loan_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", address_line: "9 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOAN_NOT_FOUND (404)"

      - name: loan_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.Loan", response_envelope]
        distinguishing_aspect: "A client-supplied id field on create is ignored; the server mints its own UUID (server-minted id differs from the supplied value and is a UUID)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /property-solutions/loans", payload: { id: "client-supplied-id", loan_number: "LN-E8", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
          assert:
            - "Loan id != 'client-supplied-id' and matches UUID format; created_at/updated_at are server-stamped"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: case_starts_in_intake
        claim_type: initial_state
        grounds: ["state_machines.WorkoutCase"]
        distinguishing_aspect: "A newly created WorkoutCase is in INTAKE with version 1 and assigned_specialist_id equal to the creator's X-User-ID."
        test_recipe:
          setup: ["loan LN-S1 and borrower exist"]
          setup_api_calls:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-S1", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "S. One", email: "s1@x.com", hardship_type: NONE, self_reported_condition_grade: A }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id, st: $.data.status, sp: $.data.assigned_specialist_id } }
          assert:
            - "WorkoutCase.${case_id}.status == INTAKE, version == 1, assigned_specialist_id == 'spec_1'"

      - name: certify_title_from_marketing_period_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.WorkoutCase.MARKETING_PERIOD", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "certify-title while the case is in MARKETING_PERIOD (not TITLE_REVIEW) is rejected with ERR_CASE_INVALID_STATE (409); no state change occurs."
        test_recipe:
          setup: ["case LN-S2 in MARKETING_PERIOD"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-S2", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "S. Two", email: "s2@x.com", hardship_type: NONE, self_reported_condition_grade: A }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CASE_INVALID_STATE (409); case remains MARKETING_PERIOD"

      - name: declined_case_terminal_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.WorkoutCase.ELIGIBILITY_REVIEW_to_DECLINED", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "After a FAIL decision the case is DECLINED (terminal): any further action (submit) returns ERR_CASE_INVALID_STATE and the loan is back to ACTIVE_DELINQUENT."
        test_recipe:
          setup: ["case LN-S3 in ELIGIBILITY_REVIEW"]
          setup_api_calls:
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-S3", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 10 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "S. Three", email: "s3@x.com", hardship_type: NONE, self_reported_condition_grade: C }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: FAIL }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CASE_INVALID_STATE (409) on the terminal DECLINED case"
            - "Loan.${loan_id}.status == ACTIVE_DELINQUENT (reverted by the FAIL cascade)"

      - name: double_accept_rejected
        claim_type: idempotency
        grounds: ["state_machines.SettlementAgreement.OFFERED_to_ACCEPTED", "errors[ERR_AGREEMENT_INVALID_STATE]"]
        distinguishing_aspect: "A second accept on an already-ACCEPTED agreement is rejected with ERR_AGREEMENT_INVALID_STATE; no duplicate side effects (case stays AGREEMENT_ACTIVE, exactly one waiver exists)."
        test_recipe:
          setup: ["DIL case LN-S4 with ACCEPTED agreement (standard economics, vacate 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-S4", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "S. Four", email: "s4@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "S. Four" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
            - { call: "POST /property-solutions/agreements/${ag_id}/offer", payload: { offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}" }
          trigger:
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AGREEMENT_INVALID_STATE (409)"
            - "WorkoutCase.${case_id}.status == AGREEMENT_ACTIVE; GET /property-solutions/cases/${case_id}/deficiency-waivers still returns exactly 1 waiver"

      - name: zero_lien_commitment_auto_clears_on_receive
        claim_type: side_effect_execution
        grounds: ["state_machines.TitleCommitment.RECEIVED_to_CLEARED", "state_machines.TitleCommitment.ORDERED_to_RECEIVED"]
        distinguishing_aspect: "Bubble-up: receiving a commitment with zero junior liens auto-transitions it RECEIVED -> CLEARED within the same request (response already shows CLEARED)."
        test_recipe:
          setup: ["case LN-S5 in TITLE_REVIEW; commitment ORDERED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-S5", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "S. Five", email: "s5@x.com", hardship_type: NONE, self_reported_condition_grade: A }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "S. Five" }, as: TitleOfficer, as_user_id: to_1, captures: { st1: $.data.status } }
          assert:
            - "Commitment status at creation == ORDERED; receive response status == CLEARED (auto bubble-up, unreleased_lien_count == 0)"

      - name: listing_close_closes_open_suspension
        claim_type: side_effect_execution
        grounds: ["state_machines.MarketingListing.SUSPENDED_to_CLOSED", "calculations.creditable_marketing_days"]
        distinguishing_aspect: "Closing a SUSPENDED listing closes the open suspension (ended_at set) and freezes creditable_days at 31 (span 41 from 2026-05-01 to 2026-06-11 minus 10 suspended days) — later clock movement does not change it."
        test_recipe:
          setup: ["case LN-S6 in MARKETING_PERIOD; listing 2026-05-01; suspended 2026-06-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-S6", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 0, escrow_advances_cents: 0, foreclosure_fees_cents: 0, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "S. Six", email: "s6@x.com", hardship_type: NONE, self_reported_condition_grade: A }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { lst_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/listings/${lst_id}/suspend", payload: { reason: "title objection" }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ServicingAdmin }
          trigger:
            - { call: "POST /property-solutions/listings/${lst_id}/close", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { cd: $.data.creditable_days } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "GET /property-solutions/listings/${lst_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { cd2: $.data.creditable_days } }
            - { call: "GET /property-solutions/listings/${lst_id}/suspensions", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { end0: "$.data[0].ended_at" } }
          assert:
            - "creditable_days == 31 at close and still 31 after the clock moves to 2026-08-01 (frozen)"
            - "The suspension's ended_at == 2026-06-11T00:00:00Z (not null)"

      - name: withdraw_cascades_to_children
        claim_type: side_effect_execution
        grounds: ["state_machines.WorkoutCase.AGREEMENT_ACTIVE_to_WITHDRAWN"]
