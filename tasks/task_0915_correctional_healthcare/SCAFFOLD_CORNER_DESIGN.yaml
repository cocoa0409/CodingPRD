scaffold_corner_design:

  - section: entities
    instances:

      - name: inmate_creation_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Inmate.fields.custody_status
          - entities.Inmate.fields.records_state
          - entities.Inmate.fields.admission_type
          - entities.Inmate.fields.account_balance_cents
        distinguishing_aspect: "A booking with only the required fields returns 201 with custody_status IN_CUSTODY, records_state OPEN, admission_type defaulted to NEW_BOOKING, account_balance_cents 0, indigent_flag true and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock left at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates"
              payload: { booking_number: "C-2000", full_name: "Ora Pike", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
          assert:
            - "The call returns 201"
            - "Inmate.${inm}.custody_status == IN_CUSTODY"
            - "Inmate.${inm}.records_state == OPEN"
            - "Inmate.${inm}.admission_type == NEW_BOOKING"
            - "Inmate.${inm}.account_balance_cents == 0"
            - "Inmate.${inm}.indigent_flag == true"
            - "Inmate.${inm}.version == 1"

      - name: inmate_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting full_name from POST /inmates returns 400 ERR_VALIDATION and creates no row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates"
              payload: { booking_number: "C-2001", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 400 with error_id ERR_VALIDATION"

      - name: inmate_invalid_enum_custody_level_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_INVALID_ENUM]"
          - entities.Inmate.fields.custody_level
        distinguishing_aspect: "custody_level SUPERMAX is outside the declared set {MINIMUM, MEDIUM, MAXIMUM} and returns 422 ERR_INVALID_ENUM, a different status and code from the 400 required-field failure."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates"
              payload: { booking_number: "C-2002", full_name: "Pia Quist", facility_code: "FAC-01", custody_level: "SUPERMAX", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 422 with error_id ERR_INVALID_ENUM"

      - name: inmate_duplicate_booking_number_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=34]"
          - "errors[ERR_DUPLICATE_KEY]"
        distinguishing_aspect: "booking_number is unique across all Inmate rows; a second booking with the same number returns 409 ERR_DUPLICATE_KEY."
        test_recipe:
          setup:
            - "One inmate already booked with booking_number C-2003."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2003", full_name: "Remy Salas", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
          trigger:
            - call: "POST /inmates"
              payload: { booking_number: "C-2003", full_name: "Different Person", facility_code: "FAC-02", custody_level: "MINIMUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 409 with error_id ERR_DUPLICATE_KEY"

      - name: inmate_get_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INMATE_NOT_FOUND]"
        distinguishing_aspect: "GET /inmates/{id} with a well-formed but unknown UUID returns 404 ERR_INMATE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "GET /inmates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HealthServicesAdmin
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 404 with error_id ERR_INMATE_NOT_FOUND"

      - name: medication_order_unknown_id_record_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_RECORD_NOT_FOUND]"
        distinguishing_aspect: "A clinical sub-resource path with an unknown id resolves to ERR_RECORD_NOT_FOUND, distinct from the inmate-specific 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /medication-orders/00000000-0000-4000-8000-000000000001/discontinue"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 404 with error_id ERR_RECORD_NOT_FOUND"

      - name: specialty_referral_unknown_id_referral_record_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_REFERRAL_RECORD_NOT_FOUND]"
        distinguishing_aspect: "The referral family has its own 404 code, so an unknown utilization-review id returns ERR_REFERRAL_RECORD_NOT_FOUND rather than ERR_RECORD_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /utilization-reviews/00000000-0000-4000-8000-000000000002/decide"
              payload: { decision: "APPROVE" }
              as: UtilizationReviewer
              as_user_id: "u-ur-1"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 404 with error_id ERR_REFERRAL_RECORD_NOT_FOUND"

      - name: chronic_care_visit_is_immutable_event_row
        claim_type: Immutability
        grounds:
          - entities.ChronicCareVisit.fields.due_at_snapshot
          - entities.ChronicCareVisit.fields.recorded_at
        distinguishing_aspect: "ChronicCareVisit is declared common_fields false, so it carries id and created_at but no version, and its due_at_snapshot freezes the enrollment's next_due_date at recording time even after the enrollment moves on."
        test_recipe:
          setup:
            - "One inmate with an ACTIVE SEVERE DIABETES enrollment created at 2026-05-01T00:00:00Z, so tier TIER_1, periodicity 30 and next_due_date 2026-05-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2010", full_name: "Sol Tavares", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/chronic-care-enrollments"
              payload: { condition_code: "DIABETES", severity: "SEVERE" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /chronic-care-enrollments/${enr}/visits"
              payload: { outcome: "COMPLETED" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { vis: $.data.id }
          assert:
            - "ChronicCareVisit.${vis}.due_at_snapshot == 2026-05-31T00:00:00.000Z"
            - "ChronicCareVisit.${vis}.recorded_at == 2026-05-20T00:00:00.000Z"
            - "ChronicCareVisit.${vis}.outcome == COMPLETED"
            - "ChronicCareEnrollment.${enr}.last_visit_at == 2026-05-20T00:00:00.000Z"
            - "ChronicCareEnrollment.${enr}.next_due_date == 2026-06-19T00:00:00.000Z"

      - name: sick_call_list_pagination_and_filter
        claim_type: Listing
        grounds:
          - entities.SickCallRequest.fields.status
        distinguishing_aspect: "GET /sick-call-requests honours inmate_id filtering together with limit and offset, returning total_count 3 and has_more true on the first page of size 2."
        test_recipe:
          setup:
            - "One inmate with three SUBMITTED sick-call requests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2020", full_name: "Tam Uribe", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "headache", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "back pain", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "rash", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
          trigger:
            - call: "GET /sick-call-requests"
              payload: { inmate_id: "${inm}", status: "SUBMITTED", limit: 2, offset: 0 }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "The response carries total_count == 3, has_more == true and exactly 2 data rows"
            - "Inmate.${inm}.open_sick_call_count == 3"

      - name: computed_fields_reject_client_supplied_values
        claim_type: Computed Fields
        grounds:
          - entities.MedicationOrder.fields.adherence_pct
          - entities.MedicationOrder.fields.prescriber_user_id
        distinguishing_aspect: "adherence_pct and prescriber_user_id are not in POST /medication-orders input, so the server sets adherence_pct to 0.00 and prescriber_user_id to the acting X-User-ID regardless of anything the client sends."
        test_recipe:
          setup:
            - "One inmate at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2030", full_name: "Ula Vance", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
          trigger:
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-77"
              captures: { ord: $.data.id }
          assert:
            - "MedicationOrder.${ord}.adherence_pct == 0.00"
            - "MedicationOrder.${ord}.prescriber_user_id == u-prov-77"
            - "MedicationOrder.${ord}.status == ACTIVE"
            - "MedicationOrder.${ord}.units_dispensed == 0 and MedicationOrder.${ord}.units_returned == 0"
            - "Inmate.${inm}.version == 2"

  - section: state_machines
    instances:

      - name: intake_screening_overdue_sweep_boundary_and_downstream_gate
        claim_type: Valid Transition
        grounds:
          - state_machines.IntakeScreening.PENDING_to_OVERDUE
          - calculations.intake_screening_due_at
          - "validations[priority=22]"
          - "errors[ERR_INTAKE_SCREENING_OVERDUE]"
        distinguishing_aspect: "A RECEIVING screening due 2026-05-01T12:00:00Z is still PENDING when the clock lands exactly on due_at and flips to OVERDUE one second later, after which POST /medication-orders is refused with ERR_INTAKE_SCREENING_OVERDUE."
        test_recipe:
          setup:
            - "A NEW_BOOKING inmate booked at 2026-05-01T00:00:00Z with one PENDING RECEIVING screening due at 2026-05-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2040", full_name: "Van Willis", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /inmates/${inm}/intake-screenings"
              payload: { screening_type: "RECEIVING" }
              as: IntakeOfficer
              captures: { scr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T12:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T12:00:01Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-02T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { err: $.data.error_id }
          assert:
            - "IntakeScreening.${scr}.due_at == 2026-05-01T12:00:00.000Z"
            - "At clock 2026-05-01T12:00:00Z the screening status was still PENDING"
            - "IntakeScreening.${scr}.status == OVERDUE after the clock reaches 2026-05-01T12:00:01Z"
            - "The medication-order call returns 422 with error_id ERR_INTAKE_SCREENING_OVERDUE"

      - name: intake_transfer_preserves_full_assessment_clock
        claim_type: Valid Transition
        grounds:
          - calculations.intake_screening_due_at
          - entities.Inmate.fields.admission_type
          - entities.Inmate.fields.prior_full_assessment_at
        distinguishing_aspect: "For an INTER_FACILITY_TRANSFER booked at 2026-05-01T00:00:00Z with a prior assessment on 2026-04-20T00:00:00Z, the RECEIVING clock restarts on the 4-hour fuse (due 2026-05-01T04:00:00Z) while the FULL_ASSESSMENT clock is preserved (due 2026-05-04T00:00:00Z, not 2026-05-15T00:00:00Z)."
        test_recipe:
          setup:
            - "One transferred inmate with prior_full_assessment_at 2026-04-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2050", full_name: "Wes Yoon", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "INTER_FACILITY_TRANSFER", prior_full_assessment_at: "2026-04-20T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
          trigger:
            - call: "POST /inmates/${inm}/intake-screenings"
              payload: { screening_type: "RECEIVING" }
              as: IntakeOfficer
              captures: { scr_r: $.data.id }
            - call: "POST /inmates/${inm}/intake-screenings"
              payload: { screening_type: "FULL_ASSESSMENT" }
              as: IntakeOfficer
              captures: { scr_f: $.data.id }
          assert:
            - "IntakeScreening.${scr_r}.due_at == 2026-05-01T04:00:00.000Z"
            - "IntakeScreening.${scr_f}.due_at == 2026-05-04T00:00:00.000Z"
            - "IntakeScreening.${scr_f}.due_at != 2026-05-15T00:00:00.000Z, which is the NEW_BOOKING answer"

      - name: intake_screening_disposition_completed_late_flag
        claim_type: Side Effect Execution
        grounds:
          - state_machines.IntakeScreening.PENDING_to_COMPLETED
          - entities.IntakeScreening.fields.completed_late
          - entities.Inmate.fields.prior_full_assessment_at
        distinguishing_aspect: "Completing a FULL_ASSESSMENT one second after its due_at sets completed_late true and copies completed_at onto Inmate.prior_full_assessment_at."
        test_recipe:
          setup:
            - "A NEW_BOOKING inmate with a PENDING FULL_ASSESSMENT screening due 2026-05-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2060", full_name: "Xan Zhu", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/intake-screenings"
              payload: { screening_type: "FULL_ASSESSMENT" }
              as: IntakeOfficer
              captures: { scr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:01Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /intake-screenings/${scr}/disposition"
              payload: { disposition: "COMPLETED", findings_code: "CHRONIC_CONDITION" }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "IntakeScreening.${scr}.status == COMPLETED"
            - "IntakeScreening.${scr}.completed_at == 2026-05-15T00:00:01.000Z"
            - "IntakeScreening.${scr}.completed_late == true"
            - "IntakeScreening.${scr}.findings_code == CHRONIC_CONDITION"
            - "Inmate.${inm}.prior_full_assessment_at == 2026-05-15T00:00:01.000Z"

      - name: chronic_enrollment_lapse_grace_boundary_then_re_enroll_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.ChronicCareEnrollment.ACTIVE_to_LAPSED
          - state_machines.ChronicCareEnrollment.LAPSED_to_ACTIVE
          - calculations.chronic_care_next_due_date
          - calculations.chronic_tier_assignment
        distinguishing_aspect: "A TIER_1 enrollment with next_due_date 2026-05-31T00:00:00Z is still ACTIVE at exactly 2026-06-15T00:00:00Z (grace boundary) and LAPSES one second later; re-enrolling at MODERATE re-anchors the clock to TIER_2 with a 90-day period."
        test_recipe:
          setup:
            - "One inmate with an ACTIVE SEVERE HYPERTENSION enrollment created 2026-05-01T00:00:00Z (TIER_1, periodicity 30, next_due_date 2026-05-31T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2070", full_name: "Yael Abbas", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/chronic-care-enrollments"
              payload: { condition_code: "HYPERTENSION", severity: "SEVERE" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:01Z" }
              as: HealthServicesAdmin
            - call: "POST /chronic-care-enrollments/${enr}/re-enroll"
              payload: { severity: "MODERATE" }
              as: Provider
              as_user_id: "u-prov-1"
          assert:
            - "At clock 2026-06-15T00:00:00Z the enrollment status was still ACTIVE"
            - "At clock 2026-06-15T00:00:01Z the enrollment status became LAPSED"
            - "ChronicCareEnrollment.${enr}.status == ACTIVE after the re-enroll"
            - "ChronicCareEnrollment.${enr}.tier == TIER_2"
            - "ChronicCareEnrollment.${enr}.periodicity_days == 90"
            - "ChronicCareEnrollment.${enr}.enrolled_at == 2026-06-15T00:00:01.000Z"
            - "ChronicCareEnrollment.${enr}.last_visit_at == null"
            - "ChronicCareEnrollment.${enr}.next_due_date == 2026-09-13T00:00:01.000Z"

      - name: chronic_missed_visits_escalate_tier_at_threshold
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChronicCareEnrollment.ACTIVE_to_ACTIVE
          - calculations.chronic_care_next_due_date
          - entities.ChronicCareEnrollment.fields.escalated
        distinguishing_aspect: "The first MISSED visit only increments missed_visit_count; the second reaches CHRONIC_MISSED_ESCALATION_COUNT and escalates TIER_3 to TIER_2, resetting periodicity_days to 90 and next_due_date to enrolled_at plus 90 days."
        test_recipe:
          setup:
            - "One inmate with an ACTIVE MILD ASTHMA enrollment created 2026-05-01T00:00:00Z (TIER_3, periodicity 180, next_due_date 2026-10-28T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
