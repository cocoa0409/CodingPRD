  # ===========================================================================
  # SECTION: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_blanket_version_release_returns_412_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[release-create-stale-blanket]
          - errors[ERR_STALE_VERSION]
          - entities.PurchaseOrder.fields.version
          - endpoints[POST /procurement/release-orders]
        distinguishing_aspect: "After a first release bumps the blanket PO version (1->2), a second release still carrying the originally-observed version (${po_v0}) is rejected with 412 ERR_STALE_VERSION; two strictly sequential requests."
        test_recipe:
          setup:
            - "An ISSUED BLANKET PO ceiling 1000000 at version 1; client captured po_v0=1; a first release of 200000 succeeds and advances version to 2."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-OCC1" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Cat", code: "OCC1CAT", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "BLANKET", ceiling_amount_cents: 1000000, valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-03-31T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id, po_v0: $.data.version }
            - call: "POST /procurement/release-orders"
              payload: { blanket_po_id: "${po_id}", amount_cents: 200000, lines: [ { sku: "A", quantity: 2, unit_price_cents: 100000 } ], expected_purchase_order_version: "${po_v0}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rel1_id: $.data.id }
          trigger:
            - call: "POST /procurement/release-orders"
              payload: { blanket_po_id: "${po_id}", amount_cents: 100000, lines: [ { sku: "A", quantity: 1, unit_price_cents: 100000 } ], expected_purchase_order_version: "${po_v0}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "the first release succeeded (HTTP 201) and PurchaseOrder.${po_id}.version advanced from 1 to 2"
            - "the second release (still carrying ${po_v0}=1) returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "PurchaseOrder.${po_id}.remaining_amount_cents == 800000 (only the first 200000 draw applied)"

      - name: release_create_then_cancel_remaining_invariant_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReleaseOrder.transitions.OPEN_to_CANCELLED
        excluded_because:
          difficulty_instance: blanket_remaining_ceiling_conserved_on_release_create_then_cancel
          rationale: "The release create/cancel compensating side-effect on remaining_amount_cents is asserted by the named §1.8 compensating_invariant instance."

      - name: receipt_post_then_reverse_ledger_invariant_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.GoodsReceipt.transitions.POSTED_to_REVERSED
        excluded_because:
          difficulty_instance: po_received_quantity_ledger_conserved_on_receipt_post_then_reverse
          rationale: "The receipt post/reverse compensating side-effect on the received_total ledger is asserted by the named §1.8 compensating_invariant instance."

      - name: match_fail_probation_threshold_trigger_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Vendor.transitions.APPROVED_to_PROBATION
        excluded_because:
          difficulty_instance: invoice_match_fail_cascades_exception_then_count_then_probation_depth3
          rationale: "The exception_count threshold crossing into PROBATION is asserted by the named §1.8 transitive_cascade instance."

