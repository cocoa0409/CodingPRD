            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: HRComplianceAdmin }
            - { call: "POST /_ops/escalation-sweep", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /_ops/escalation-sweep", payload: {}, as: HRComplianceAdmin }
            - { call: "GET /escalations", payload: { assignment_id: "${asg1}" }, as: HRComplianceAdmin, captures: { esc1: "$.data[0].id" } }
          assert:
            - "DistributionAssignment.${asg1}.window_start_date == 2026-09-01T00:00:00.000Z and due_date == 2026-10-01T00:00:00.000Z"
            - "after the sweep at exactly 2026-10-01 GET /escalations?assignment_id=${asg1} returns meta.total_count == 0, DistributionAssignment.${asg1}.escalation_state == NONE, days_overdue == 0 and Employee.${e1}.open_escalation_count == 0"
            - "the sweep at 2026-10-02 opens exactly one EscalationCase with status == OPEN and tier == 1, sets escalation_state == ESCALATING and Employee.${e1}.open_escalation_count == 1"
            - "the second sweep at 2026-10-02 opens no further case: GET /escalations?assignment_id=${asg1} still returns meta.total_count == 1 with the same id ${esc1} and Employee.${e1}.open_escalation_count is still 1"
            - "EscalationCase.${esc1}.tier is still 1 after the repeated sweep because days_overdue is still 1"
            - "DistributionAssignment.${asg1}.ack_state == PENDING throughout -- the deferred action moves only the escalation dimension"
      - name: corner_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers", "state_machines[LegalReview]", "state_machines[ReleasePackage]"]
        excluded_because:
          difficulty_instance: request_changes_unwinds_version_siblings_reviewer_counter_and_addenda
          rationale: "That §1.8 instance already drives the full multi-level chain end-to-end (LegalReview CHANGES_REQUESTED -> version back to DRAFT -> reviewer open-review counter decrement -> approved addenda reset), asserts hop ordering, and checks the partial-failure case; successor_release_supersedes_voids_and_moots_the_prior_generation covers the second chain. A §1.9 duplicate would add no new probe."
      - name: corner_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers", "calculations[distribution_coverage_rate]"]
        excluded_because:
          difficulty_instance: coverage_snapshot_vs_live_roster_denominator
          rationale: "That §1.8 instance already exercises both variants of distribution_coverage_rate on the same package (frozen roster_snapshot_size denominator versus the live ACTIVE/ON_LEAVE roster) and asserts the exact delta produced when a termination switches the live denominator, which is precisely this layer's claim."

  - section: consistency model
    instances:
      - name: corner_coverage_is_readable_immediately_in_the_same_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations[distribution_coverage_rate]", "endpoints[POST /release-packages/{release_package_id}/release]", "endpoints[GET /release-packages/{release_package_id}/coverage]", "endpoints[POST /acknowledgments]", "endpoints[PATCH /employees/{employee_id}]"]
        distinguishing_aspect: "Consistency is immediate, so no sweep, job or second request is needed to make derived state visible: the release response itself already carries roster_snapshot_size and both coverage variants, the acknowledgment response's effects are visible to the very next read, and a termination shifts the live denominator on the next read too -- with the snapshot variant provably unmoved, showing immediacy is not achieved by recomputing everything from the live roster."
        test_recipe:
          setup: ["Jurisdiction CA (ack_deadline_days 30, en, esign_permitted true); employees e1 and e2; an APPROVED CODE_OF_CONDUCT version with a PUBLISHED en Translation; a SCHEDULED ReleasePackage effective 2026-09-01."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer One", bar_number: "CA-1001", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One", preferred_language_code: "en" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e2@ex.com", full_name: "Emp Two", preferred_language_code: "en" }, as: HRComplianceAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r1}" }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r1}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r1}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r1}" }
            - { call: "POST /policy-versions/${v1}/approve", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /translations/${t1}/start", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/submit-a11y", payload: { section_scores: [0.96, 0.96] }, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/publish", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-09-01T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/schedule", payload: {}, as: HRComplianceAdmin, captures: { p1v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HRComplianceAdmin }
          trigger:
            - { call: "POST /release-packages/${p1}/release", payload: { expected_release_package_version: "${p1v}" }, as: HRComplianceAdmin }
            - { call: "GET /assignments", payload: { release_package_id: "${p1}", employee_id: "${e1}" }, as: HRComplianceAdmin, captures: { asg1: "$.data[0].id" } }
            - { call: "GET /assignments", payload: { release_package_id: "${p1}", employee_id: "${e2}" }, as: HRComplianceAdmin, captures: { asg2: "$.data[0].id" } }
            - { call: "POST /assignments/${asg1}/deliver", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /assignments/${asg2}/deliver", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /acknowledgments", payload: { assignment_id: "${asg1}", method: "ESIGN", language_code: "en", signature_text: "Emp One" }, as: Employee, as_user_id: "${e1}" }
            - { call: "GET /release-packages/${p1}/coverage", payload: {}, as: HRComplianceAdmin }
            - { call: "PATCH /employees/${e2}", payload: { employment_status: "TERMINATED" }, as: HRComplianceAdmin }
            - { call: "GET /release-packages/${p1}/coverage", payload: {}, as: PolicyAuthor }
          assert:
            - "the release response itself already carries status == RELEASED, roster_snapshot_size == 2, coverage_snapshot_pct == 0.00 and coverage_live_pct == 0.00 -- no follow-up read is required to observe them"
            - "the acknowledgment response returns http_status == 201 with status == EFFECTIVE and captured_at == 2026-09-01T00:00:00.000Z, accepted because the closed window [2026-09-01, 2026-10-01] includes its own start instant"
            - "the first coverage read (immediately after the acknowledgment, with no sweep in between) returns coverage_snapshot_pct == 50.00 and coverage_live_pct == 50.00"
            - "GET /acknowledgments?assignment_id=${asg1} returns meta.total_count == 1 and GET /retention-records?employee_id=${e1} returns one CAPTURE row with signed_delta == +1 in the same request cycle"
            - "the second coverage read returns coverage_snapshot_pct == 50.00 (denominator still the frozen roster_snapshot_size of 2) and coverage_live_pct == 100.00 (live denominator now 1 after ${e2} left the roster)"
            - "the coverage read does not mutate ReleasePackage.${p1}.version -- it is unchanged between the two reads"
            - "ReleasePackage.${p1}.status == RELEASED, not CLOSED, because ${asg2} is still PENDING even though its assignee is TERMINATED"
