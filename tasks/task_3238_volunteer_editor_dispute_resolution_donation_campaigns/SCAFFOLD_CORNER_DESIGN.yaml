  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_page_version_on_accept
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[page-revision-accept-stale]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Client reads page version V, another accept advances the page version, then the first client's accept carrying expected_page_version V is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Page with two PENDING revisions R1, R2; page version captured after creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "occ", email: "occ@x.com" }
              as: Anonymous
              captures: { occe_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "OCC Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${occe_id}"
              captures: { occp_id: $.data.id, occp_v: $.data.version }
            - call: "POST /wiki/pages/${occp_id}/revisions"
              payload: { content_text: "r1", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${occe_id}"
              captures: { occr1: $.data.id }
            - call: "POST /wiki/pages/${occp_id}/revisions"
              payload: { content_text: "r2", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${occe_id}"
              captures: { occr2: $.data.id }
          trigger:
            - call: "POST /wiki/revisions/${occr1}/accept"
              payload: { expected_page_version: "${occp_v}" }
              as: Administrator
            - call: "POST /wiki/revisions/${occr2}/accept"
              payload: { expected_page_version: "${occp_v}" }
              as: Administrator
              captures: { occerr: $.data.error_id }
          assert:
            - "first accept succeeds and bumps WikiPage version to ${occp_v} + 1"
            - "second accept with stale ${occp_v} fails 412 ERR_STALE_VERSION"

      - name: occ_stale_report_version_on_publish
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-publish-stale]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Publishing with an expected_report_version one behind the current version (captured before an intervening mutation) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. DRAFT transparency report; version captured at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/transparency-reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z" }
              as: LegalCounsel
              captures: { occr_id: $.data.id, occr_v: $.data.version }
          trigger:
            - call: "POST /wiki/transparency-reports/${occr_id}/publish"
              payload: { expected_report_version: "${occr_v} - 1" }
              as: LegalCounsel
              captures: { occrerr: $.data.error_id }
          assert:
            - "status 412 and error_id == ERR_STALE_VERSION"
            - "TransparencyReport.${occr_id}.status == DRAFT"

      - name: frequency_cap_resets_on_new_day_bucket
        claim_type: rate_threshold_triggers
        grounds:
          - entities.ImpressionEvent.fields.day_bucket
          - entities.CampaignBanner.fields.frequency_cap
        distinguishing_aspect: "The per-viewer daily cap is keyed on day_bucket derived from served_at; after the clock crosses midnight UTC the same viewer can be served again up to the cap."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T23:59:00Z. ACTIVE campaign, banner frequency_cap=1; one impression served to viewer V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T23:59:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Reset Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { rsc_id: $.data.id, rsc_v: $.data.version }
            - call: "POST /wiki/campaigns/${rsc_id}/banners"
              payload: { message_variant: "RS", geo_target: "GLOBAL", frequency_cap: 1 }
              as: FundraisingManager
              captures: { rsb_id: $.data.id }
            - call: "POST /wiki/campaigns/${rsc_id}/activate"
              payload: { expected_campaign_version: "${rsc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/banners/${rsb_id}/impressions"
              payload: { viewer_key: "rv", country_code: "US" }
              as: Anonymous
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:01:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/banners/${rsb_id}/impressions"
              payload: { viewer_key: "rv", country_code: "US" }
              as: Anonymous
          assert:
            - "second impression on the new day_bucket succeeds"
            - "CampaignBanner.${rsb_id}.impression_count == 2"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: donation_process_immediately_visible_in_campaign_total
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Under the immediate consistency model, a successful donation process is reflected in the campaign's raised_cents in the same request's subsequent GET — no lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE campaign, banner ACTIVE, PLEDGED donation of 4200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Imm Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { imc_id: $.data.id, imc_v: $.data.version }
            - call: "POST /wiki/campaigns/${imc_id}/banners"
              payload: { message_variant: "I", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
              captures: { imb_id: $.data.id }
            - call: "POST /wiki/campaigns/${imc_id}/activate"
              payload: { expected_campaign_version: "${imc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${imc_id}/donations"
              payload: { banner_id: "${imb_id}", donor_email_hash: "im", amount_cents: 4200, currency: "USD" }
              as: Anonymous
              captures: { imd_id: $.data.id }
          trigger:
            - call: "POST /wiki/donations/${imd_id}/process"
              payload: {}
              as: PaymentProcessor
            - call: "GET /wiki/campaigns/${imc_id}"
              payload: {}
              as: FundraisingManager
          assert:
            - "DonationCampaign.${imc_id}.raised_cents == 4200 immediately after process"
