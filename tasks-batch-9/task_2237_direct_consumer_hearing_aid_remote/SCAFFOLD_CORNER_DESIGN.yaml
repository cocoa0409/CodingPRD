            - { call: "POST /patients/${pat_v12}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_v12}", captures: { ord_v12: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_v12}", outcome: "AUTHORIZED" }, as: PlatformAdmin, note: "a confirm-fit here would be 422 ERR_WAIVER_NOT_ACKNOWLEDGED" }
            - { call: "POST /patients/${pat_v12}/acknowledge-waiver", payload: {}, as: Patient, as_user_id: "${pat_v12}" }
          trigger:
            - { call: "POST /device-orders/${ord_v12}/confirm-fit", payload: {}, as: CareOpsAgent }
          assert:
            - "HTTP 200"
            - "data.fulfillment_status == \"READY_TO_SHIP\""
            - "data.device_id is non-null (a device was assigned out of the NEO/M/OPEN pool)"
            - "GET /patients/${pat_v12} returns data.waiver_acknowledged_at == \"2026-08-01T00:00:00Z\""
            - "GET /inventory-pools/${pool_mo} returns data.on_hand_units == 4 and data.dispatched_units == 1"

