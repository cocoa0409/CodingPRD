          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "Landowner identity is entity-backed, so authorization is row-level: a second landowner holding a valid Landowner id is refused with ERR_NOT_RESOURCE_OWNER (403) at priority 6 and the tract stays OFFERED with no agreed compensation."
