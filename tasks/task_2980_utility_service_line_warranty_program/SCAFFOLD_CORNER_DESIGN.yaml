        grounds:
          - endpoints.GET /enrollments/{enrollmentId}
          - entities.Enrollment.fields.annual_benefit_used_cents
          - entities.Enrollment.fields.annual_benefit_reserved_cents
          - calculations.annual_and_occurrence_cap_usage
          - calculations.dispatch_benefit_settlement
        distinguishing_aspect: "The two money figures on the enrollment move in opposite directions across a single COMPLETE event: the forward-looking reservation drains to 0 while the ledger-backed usage fills to the invoiced benefit. Both are source: computed, so the read must recompute them from the dispatch set and the BENEFIT ledger rather than serve stored counters - and because nothing about the enrollment row itself is written, its version must be identical before and after."
