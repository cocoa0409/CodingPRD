              as_user_id: "ic-drew"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_SLOT_NOT_OPEN"

      - name: itinerary_confirm_with_pending_visits_rejected
        claim_type: Conditional action
        grounds: ["endpoints.POST_/itineraries/{itineraryId}/confirm", errors.ERR_UNCONFIRMED_VISITS_REMAIN]
        distinguishing_aspect: "Itinerary confirmation while any visit is still PENDING is a 409 ERR_UNCONFIRMED_VISITS_REMAIN."
