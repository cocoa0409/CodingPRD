    roles: [Trader]
    code: 200
    input: [outcome, "discount_pct?"]
    output: Shipment
    side_effects:
      - "dispute_status → RESOLVED_ACCEPTED or RESOLVED_REJECTED"
      - "If ACCEPT: GreenLot.lot_status REJECTED → RELEASED; landed_cost recomputed via calc_disputed_lot_landed_cost"
      - "WarehousePosition recompute"
      - "increments Shipment.version by 1"

