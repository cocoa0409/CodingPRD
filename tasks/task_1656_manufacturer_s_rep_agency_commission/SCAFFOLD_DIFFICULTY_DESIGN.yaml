              as: AgencyAdmin
              captures: { rma1: $.data.id }
            - call: "POST /rep-agency/rmas/${rma1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p2}"
          trigger:
            - call: "POST /rep-agency/rmas/${rma1}/receive"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p2}"
          assert:
            - "after the overdue sweep (mid-check): Rep.${rh}.commission_balance_cents == 15000 (100,000 accrual - 85,000 sample charge)"
            - "SampleCheckout.${co1}.status == CHARGED and charge_cents == 85000 (max(2000, 10000-1500x1) = 8500bp of 100,000c)"
            - "after receive: RMA.${rma1}.final_chargeback_cents == 100000 (original 1000bp, schedule unchanged)"
