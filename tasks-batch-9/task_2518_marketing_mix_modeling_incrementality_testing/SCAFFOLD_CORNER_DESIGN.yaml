        excluded_because:
          difficulty_instance: model_run_four_parallel_state_dimensions
          rationale: >-
            That instance walks all four ModelRun dimensions (fit_status, validation_status, calibration_status, publication_status) through a nine-call sequence and asserts the full combined tuple after every hop, including the two dimensions that must NOT move. A separate breadth probe would only re-assert a prefix of the same tuple.
      - name: cyclic_loop_termination_condition_respected
        claim_type: cyclic
        grounds:
          - "complexity_profile.state_machine_shape - cyclic sub-loop REJECTED -> DRAFT on Experiment"
          - "validations priority 62 (business_constraint) - redesign_count < MAX_REDESIGNS (2), else ERR_REDESIGN_LIMIT_REACHED"
          - "global_constants.MAX_REDESIGNS 2"
        excluded_because:
          difficulty_instance: experiment_reject_redesign_cycle_bounded_by_max_redesigns
          rationale: >-
            That instance drives the reject/release loop twice to redesign_count 2 and then asserts the third attempt is refused with ERR_REDESIGN_LIMIT_REACHED, which is exactly the guide's loop-count termination claim; it also asserts the full field reset on each loop, so a second probe would be strictly weaker.
      - name: guarded_transition_requires_other_entity_state
        claim_type: guarded_transitions
        grounds:
          - "complexity_profile.state_machine_shape - guarded transitions"
          - "state_machines ModelRun fit precondition DataWindow.status == SEALED, else ERR_DATA_WINDOW_NOT_SEALED"
          - "validations priority 45 (state) - ERR_DATA_WINDOW_NOT_SEALED (409)"
        excluded_because:
          difficulty_instance: model_run_fit_requires_sealed_data_window
          rationale: >-
            That instance is the guarded-transition claim in full: it attempts fit against an OPEN window, then against a REOPENED window, then against the SEALED window, asserting the guard is read from the parent DataWindow at each attempt rather than cached on the run.
      - name: cascade_down_parent_change_updates_non_terminal_children
        claim_type: cascade_down
        grounds:
          - "state_machines DataWindow SEALED -> REOPENED side_effects CASCADE HOP 1..HOP 4"
          - "complexity_profile.complexity_layers cascading_side_effects"
        excluded_because:
          difficulty_instance: window_reopen_cascades_stale_fit_to_scenario_invalidation
          rationale: >-
            That instance verifies all four reopen cascade hops end to end (FITTED -> STALE_FIT, contributions is_current false, OPTIMIZED/APPROVED scenarios INVALIDATED, posture FROZEN) and asserts that DRAFT scenarios are deliberately untouched, which is the 'only non-terminal children affected' half of the guide's claim.
      - name: cross_entity_side_effect_adjusts_second_entity
        claim_type: cross_entity
        grounds:
          - "state_machines GeoCell UNASSIGNED -> TREATMENT/CONTROL side_effects - Market.held_out_population += population"
          - "state_machines GeoCell WASHOUT -> UNASSIGNED side_effects - Market.held_out_population -= population"
        excluded_because:
          difficulty_instance: holdout_population_conservation_restored_by_release_then_sweep
          rationale: >-
            That instance asserts the Market-side counter after every GeoCell hop (assign, release to WASHOUT with the counter deliberately UNCHANGED, then sweep back to 0), which is a superset of the guide's 'verify B's state and fields' claim.
      - name: compensation_undo_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - "state_machines BudgetScenario OPTIMIZED -> DRAFT on revert-optimization, side_effect COMPENSATION - every side effect of optimize is reversed with no residual drift"
          - "complexity_profile.complexity_layers cascading_side_effects"
        excluded_because:
          difficulty_instance: budget_cent_conservation_restored_by_revert_optimization
          rationale: >-
            That instance is the compensation claim stated as a conserved quantity: it asserts allocated_total + fee + unallocated == total_budget_cents both after optimize and after revert, plus per-row restoration of allocated_cents, shifted_cents and constraint_binding, so no drift can hide.
      - name: conditional_cascade_applies_only_to_matching_children
        claim_type: conditional_cascade
        grounds:
          - "state_machines GeoCell WASHOUT -> UNASSIGNED note - one sweep call partially applies; elapsed cells clear and non-elapsed cells are untouched in the same request"
          - "endpoints POST /mmm/markets/{id}/washout-sweep"
        excluded_because:
          difficulty_instance: holdout_population_conservation_restored_by_release_then_sweep
          rationale: >-
            That instance runs the sweep at a clock where one cell's washout_until_date has elapsed and another's has not, and asserts the partial application plus the resulting Market counter, which is precisely the conditional-cascade claim.
  - section: calculations
    note: >-
      The nine declared algorithm values are constraint_propagation, decay_function, aggregation, threshold, tiered_pricing, weighted_scoring, projection, waterfall_allocation and chronological. Every literal below was executed in Decimal ROUND_HALF_UP against the SCAFFOLD.yaml formula on fixture F1. The guide's forward_looking, topological and tiered_pricing-straddle rows have no counterpart in this scaffold and are skipped.
    instances:
      - name: market_data_posture_first_match_wins_frozen_beats_restricted
        claim_type: constraint_propagation
        grounds:
          - "calculations.market_data_posture formula - FIRST MATCH WINS; the order of the three tests is normative"
          - "calculations.market_data_posture trigger - recomputed on every write that touches a market's DataWindows or ModelRuns"
          - "state_machines DataWindow SEALED -> REOPENED side_effect - recompute Market.data_posture -> FROZEN"
          - "state_machines DataWindow REOPENED -> SEALED side_effect - when no other window of the market is REOPENED the posture leaves FROZEN"
        distinguishing_aspect: |
          After a reopen BOTH the FROZEN test and the RESTRICTED test are satisfied at once (a REOPENED
          window exists AND no SEALED window remains), and first-match-wins must answer FROZEN; re-sealing
          then propagates the posture all the way back to OPEN in the same call, so the recomputation
          reaches a fixed point rather than latching on FROZEN.
          
        test_recipe:
          setup:
            - "Fixture F1 published: window W1 SEALED, EFFECT_PERIOD run R1 over both channels FITTED, HOLDOUT_PASSED and PUBLISHED with calibration_status NOT_REQUIRED. The market posture is therefore OPEN."
            - "The clock is at 2026-08-31T00:00:00Z, so the window may be re-sealed immediately after the reopen."
            - "W1 is the market's ONLY DataWindow, which is what makes the two posture branches fire simultaneously after the reopen."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
