scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_engagement_copies_type_and_guarantee_days_from_fee_schedule
        claim_type: computed_fields
        grounds:
          - entities.Engagement.fields.engagement_type
          - entities.Engagement.fields.guarantee_days
          - entities.Engagement.fields.min_offer_fit_score
          - entities.Engagement.fields.status
          - endpoints
        distinguishing_aspect: "POST /engagements with only client_company_id + fee_schedule_id + fee_cap_cents returns status DRAFT, engagement_type RETAINED and guarantee_days 180 copied from the fee schedule, min_offer_fit_score defaulted to 7.0, billed_gross_cents 0, placements_count 0, version 1."
        test_recipe:
          setup:
            - "One Partner consultant, one client company, one RETAINED fee schedule with guarantee_days 180."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id, fs_completion_pct: $.data.completion_pct }
          trigger:
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "${fs_completion_pct} == 0.30"
            - "Engagement.${eng_id}.status == DRAFT"
            - "Engagement.${eng_id}.engagement_type == RETAINED"
            - "Engagement.${eng_id}.guarantee_days == 180"
            - "Engagement.${eng_id}.min_offer_fit_score == 7.0"
            - "Engagement.${eng_id}.billed_gross_cents == 0"
            - "Engagement.${eng_id}.placements_count == 0"
            - "Engagement.${eng_id}.lead_partner_consultant_id == ${p_id}"
            - "Engagement.${eng_id}.version == 1"
            - "Engagement.${eng_id}.activated_at is null"

      - name: get_candidate_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CANDIDATE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /candidates/{id} with a well-formed but unknown UUID returns 404 ERR_CANDIDATE_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database (no candidates)."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /candidates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Consultant
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CANDIDATE_NOT_FOUND"

      - name: create_search_assignment_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /search-assignments omitting target_first_year_comp_cents returns 422 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "An ACTIVE RETAINED engagement exists."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_id}", role_title: "CFO", positions_total: 1 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /search-assignments?engagement_id=${eng_id} returns total_count == 0"

      - name: create_candidate_with_invalid_source_channel_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Candidate.fields.source_channel
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "source_channel = 'COLD_CALL' is not a member of {REFERRAL, RESEARCH, INBOUND} and yields 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One consultant and one company exist."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
          trigger:
            - call: "POST /candidates"
              payload: { full_name: "Kim Cand", current_employer_company_id: "${target_id}", current_title: "VP Finance", source_channel: "COLD_CALL" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /candidates?current_employer_company_id=${target_id} returns total_count == 0"

      - name: assessment_computed_role_and_weight_ignore_client_supplied_values
        claim_type: system_fields
        grounds:
          - entities.Assessment.fields.assessor_role
          - entities.Assessment.fields.assessor_weight
          - entities.Assessment.fields.composite_score
          - entities.Assessment.fields.assessor_user_id
        distinguishing_aspect: "A SCREEN assessment submitted by a Consultant comes back with assessor_role CONSULTANT, assessor_weight 1.0, composite_score 7.67 (round_half_up((7+8+8)/3, 2)) and assessor_user_id == the X-User-ID header — none of which are request inputs."
        test_recipe:
          setup:
            - "ACTIVE RETAINED engagement, OPEN assignment, one candidate sourced, one SCHEDULED interview with the sourcing consultant as interviewer."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_id}", role_title: "CFO", positions_total: 1, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /target-companies"
              payload: { assignment_id: "${asg_id}", company_id: "${target_id}", rationale: "Peer set" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /candidates"
              payload: { full_name: "Kim Cand", current_employer_company_id: "${target_id}", current_title: "VP Finance", source_channel: "RESEARCH" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /pipeline-entries"
              payload: { assignment_id: "${asg_id}", candidate_id: "${cand_id}" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { pe_id: $.data.id }
            - call: "POST /interviews"
              payload: { pipeline_entry_id: "${pe_id}", interviewer_consultant_id: "${c_id}", start_at: "2026-05-04T09:00:00Z", end_at: "2026-05-04T10:00:00Z", mode: "VIDEO" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { iv_id: $.data.id }
          trigger:
            - call: "POST /interviews/${iv_id}/assessments"
              payload: { assessment_kind: "SCREEN", leadership_score: 7, functional_score: 8, culture_score: 8 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id, a_role: $.data.assessor_role, a_weight: $.data.assessor_weight, a_comp: $.data.composite_score, a_user: $.data.assessor_user_id }
          assert:
            - "HTTP status == 201"
            - "${a_role} == CONSULTANT"
            - "${a_weight} == 1.0"
            - "${a_comp} == 7.67"
            - "${a_user} == ${c_id}"
            - "Assessment.${a_id}.interview_id == ${iv_id}"
            - "PipelineEntry.${pe_id}.preliminary_fit_score == 7.67"

      - name: list_pipeline_entries_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /pipeline-entries?assignment_id=X&limit=2&offset=1 returns response_type 'array', total_count 3, has_more false, and exactly 2 rows."
        test_recipe:
          setup:
            - "ACTIVE RETAINED engagement, OPEN assignment with positions_total 3, three candidates sourced onto it (three PipelineEntry rows)."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_id}", role_title: "CFO", positions_total: 3, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /target-companies"
              payload: { assignment_id: "${asg_id}", company_id: "${target_id}", rationale: "Peer set" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /candidates"
              payload: { full_name: "Cand One", current_employer_company_id: "${target_id}", current_title: "VP A", source_channel: "RESEARCH" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { cand1_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Cand Two", current_employer_company_id: "${target_id}", current_title: "VP B", source_channel: "REFERRAL" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { cand2_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Cand Three", current_employer_company_id: "${target_id}", current_title: "VP C", source_channel: "INBOUND" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { cand3_id: $.data.id }
            - call: "POST /pipeline-entries"
              payload: { assignment_id: "${asg_id}", candidate_id: "${cand1_id}" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /pipeline-entries"
              payload: { assignment_id: "${asg_id}", candidate_id: "${cand2_id}" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /pipeline-entries"
              payload: { assignment_id: "${asg_id}", candidate_id: "${cand3_id}" }
              as: Consultant
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /pipeline-entries"
              payload: { assignment_id: "${asg_id}", limit: 2, offset: 1 }
              as: Consultant
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 200"
            - "response_type == 'array'"
            - "meta/envelope carries total_count == 3, limit == 2, offset == 1, has_more == false"
            - "len(data) == 2"
            - "Every returned row has stage == SOURCED"

      - name: company_is_client_flag_toggles_with_engagement_activation
        claim_type: computed_fields
        grounds:
          - entities.Company.fields.is_client
          - state_machines.Engagement.DRAFT_to_ACTIVE
        distinguishing_aspect: "Company.is_client is FALSE at creation and while the engagement is DRAFT, and flips to TRUE the moment the engagement is activated — it is derived from Engagement rows, never set by input."
        test_recipe:
          setup:
            - "One Partner, one company, one RETAINED fee schedule, one DRAFT engagement on that company."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id, is_client_at_create: $.data.is_client }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "GET /companies/${client_id}"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
              captures: { is_client_draft: $.data.is_client }
          trigger:
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "GET /companies/${client_id}"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
              captures: { is_client_active: $.data.is_client }
          assert:
            - "${is_client_at_create} == false"
            - "${is_client_draft} == false"
            - "${is_client_active} == true"
            - "Engagement.${eng_id}.activated_at == 2026-05-01T00:00:00.000Z (the clock default)"

  # =========================================================================
  # Section 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_an_already_active_engagement_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Engagement.DRAFT_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second POST /engagements/{id}/activate on an ACTIVE engagement returns 409 ERR_INVALID_STATE and does NOT mint a second CLIENT_PROTECTION off-limits record."
        test_recipe:
          setup:
            - "One ACTIVE RETAINED engagement (activated exactly once)."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "Engagement.${eng_id}.status == ACTIVE"
            - "GET /off-limits-records?engagement_id=${eng_id}&scope=CLIENT_PROTECTION returns total_count == 1"

      - name: advance_from_terminal_rejected_stage_is_locked_down
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PipelineEntry.SOURCED_to_REJECTED
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once a PipelineEntry is REJECTED (a terminal stage), POST /advance with to_stage SCREENED returns 409 ERR_INVALID_STATE — terminal stages accept no further transitions."
        test_recipe:
          setup:
            - "ACTIVE RETAINED engagement, OPEN assignment, one candidate sourced and then rejected."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_id}", role_title: "CFO", positions_total: 1, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /target-companies"
              payload: { assignment_id: "${asg_id}", company_id: "${target_id}", rationale: "Peer set" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /candidates"
              payload: { full_name: "Kim Cand", current_employer_company_id: "${target_id}", current_title: "VP Finance", source_channel: "RESEARCH" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /pipeline-entries"
              payload: { assignment_id: "${asg_id}", candidate_id: "${cand_id}" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { pe_id: $.data.id }
            - call: "POST /pipeline-entries/${pe_id}/advance"
              payload: { to_stage: "REJECTED", rejection_reason: "Comp expectations too high" }
              as: Consultant
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /pipeline-entries/${pe_id}/advance"
              payload: { to_stage: "SCREENED" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "PipelineEntry.${pe_id}.stage == REJECTED"
