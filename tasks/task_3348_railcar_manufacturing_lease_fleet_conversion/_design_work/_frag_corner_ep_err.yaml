            - "While the order is COMPONENT_RESERVED the derived reserved_qty is 0: data.reserved_qty == ${reserved_pre} == 0, because component_allocation counts only ProductionOrder rows in status RELEASED"
            - "After POST /production-orders/${po_id}/release returns ${released_status} == \"RELEASED\", the derived value moves without any new stock movement: data.reserved_qty == ${reserved_post} == 10"
