  # ------------------------------------------------------------ calculations ---
  - section: calculations
    instances:
      - name: fuel_mpg_anomaly_exact_85_percent_not_flagged_then_flagged
        claim_type: correct_result
        grounds:
          - calculations.fuel_mpg_anomaly
        distinguishing_aspect: "Integer cross-multiplication boundary: log 4 at exactly 85% of the 3-log aggregate baseline (510*150*100 == 85*1800*50) is NOT flagged (strict <), while log 5 at 9.6 mpg vs 9.69 threshold IS flagged and auto-creates a MAJOR FUEL_SYSTEM defect."
        test_recipe:
          setup: ["Bus odometer 0; logs L1-L3 each 600 miles / 50 gal (aggregate 1800/150 = 12 mpg); clock default"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "F1", vin: "VINF1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-26", odometer_end: 600, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-27", odometer_end: 1200, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-28", odometer_end: 1800, fuel_gallons: 50 }, as: Operator }
          trigger:
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-29", odometer_end: 2310, fuel_gallons: 50 }, as: Operator, captures: { l4: $.data.id, l4s: $.data.status } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-30", odometer_end: 2790, fuel_gallons: 50 }, as: Operator, captures: { l5: $.data.id, l5s: $.data.status } }
            - { call: "GET /fleet/mileage-fuel-logs/${l5}/defect-reports", payload: {}, as: FleetManager, captures: { defects: $.data } }
          assert:
            - "L4 (510 mi / 50 gal = exactly 85% of 12 mpg baseline): status == POSTED, no defect created"
            - "L5 (480/50 = 9.6 < 0.85 * (1710/150 = 11.4) = 9.69): status == FLAGGED"
            - "Exactly one auto defect: severity MAJOR, defect_code FUEL_SYSTEM, status OPEN, flagged_by_log_id == ${l5}, odometer_at_report == 2790"

      - name: flagged_log_void_recomputes_odometer_and_withdraws_defect
        claim_type: input_set_filtering
        grounds:
          - calculations.fuel_mpg_anomaly
          - state_machines.MileageFuelLog.POSTED_or_FLAGGED_to_VOIDED
        distinguishing_aspect: "Voiding the latest (FLAGGED) log excludes it from the baseline set, recomputes Bus.odometer_miles from remaining logs (2790 -> 2310), and auto-withdraws the anomaly defect with resolution AUTO_VOIDED."
        test_recipe:
          setup: ["Same 5-log chain as the anomaly instance; L5 is FLAGGED with an OPEN auto defect"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "F2", vin: "VINF2", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-26", odometer_end: 600, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-27", odometer_end: 1200, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-28", odometer_end: 1800, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-29", odometer_end: 2310, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-07-30", odometer_end: 2790, fuel_gallons: 50 }, as: Operator, captures: { l5: $.data.id } }
            - { call: "GET /fleet/mileage-fuel-logs/${l5}/defect-reports", payload: {}, as: FleetManager, captures: { d5: "$.data[0].id" } }
          trigger:
            - { call: "POST /fleet/mileage-fuel-logs/${l5}/void", payload: { void_reason: "faulty pump meter" }, as: FleetManager, captures: { vst: $.data.status } }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { odo: $.data.odometer_miles } }
            - { call: "GET /fleet/defect-reports/${d5}", payload: {}, as: FleetManager, captures: { dst: $.data.status, dres: $.data.resolution } }
          assert:
            - "Void succeeds (L5 is latest): status == VOIDED"
            - "Bus odometer_miles == 2310 (max odometer_end over remaining non-voided logs)"
            - "Auto defect: status == WITHDRAWN, resolution == AUTO_VOIDED"

      - name: core_late_tier_half_credit_and_grace_expiry
        claim_type: constants_applied
        grounds:
          - calculations.core_exchange_credit
        distinguishing_aspect: "Tier constants 30d/15d/50%: a GOOD core returned 5 days after its due date earns exactly half (5000 of 10000); a second core still pending 20 days after due is auto-CORE_REJECTED by run_epoch and its CORE_RETURN attempt then fails with ERR_CORE_NOT_PENDING."
        test_recipe:
          setup: ["REBUILDABLE_CORE part (core 10000, on_hand 5); IN_PROGRESS WO with two lines A and B qty 1 each, both ISSUED at clock 2026-08-01 (due 2026-08-31)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "K2", vin: "VINK2", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-K2", description: "Starter core", part_class: "REBUILDABLE_CORE", unit_cost_cents: 25000, reorder_point: 0, initial_on_hand: 5, warranty_eligible: false, core_charge_cents: 10000 }, as: PartsClerk, captures: { p: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "K2A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 2, estimated_cost_cents: 50000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 1 }, as: PartsClerk, captures: { la: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 1 }, as: PartsClerk, captures: { lb: $.data.id } }
            - { call: "POST /fleet/part-lines/${la}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/part-lines/${lb}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
          trigger:
            - { call: "POST /fleet/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: FleetManager }
            - { call: "POST /fleet/run_epoch", payload: {}, as: FleetManager }
            - { call: "POST /fleet/part-lines/${la}/events", payload: { event_type: "CORE_RETURN", core_condition: "GOOD" }, as: PartsClerk, captures: { csa: $.data.core_status } }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: PartsClerk, captures: { cred: $.data.core_credits_cents } }
            - { call: "POST /fleet/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: FleetManager }
            - { call: "POST /fleet/run_epoch", payload: {}, as: FleetManager }
            - { call: "GET /fleet/part-lines/${lb}", payload: {}, as: PartsClerk, captures: { csb: $.data.core_status } }
            - { call: "POST /fleet/part-lines/${lb}/events", payload: { event_type: "CORE_RETURN", core_condition: "GOOD" }, as: PartsClerk, captures: { err: $.data.error_id } }
          assert:
            - "At 2026-09-05 (> due 2026-08-31, <= due+15): line A CORE_LATE after epoch, GOOD return -> CORE_CREDITED with 50% tier: WO.core_credits_cents == 5000"
            - "At 2026-09-20 (> due+15 == 2026-09-15): line B auto CORE_REJECTED (no credit)"
            - "CORE_RETURN on line B then fails: err == ERR_CORE_NOT_PENDING"

      - name: shift_coverage_vacuous_full_and_zero_coverage_short
        claim_type: correct_result
        grounds:
          - calculations.shift_coverage
        distinguishing_aspect: "Empty-set and zero-count edges: a shift with required_headcount {} publishes as FULL vacuously; a shift requiring {ENGINE: 1} with zero assignments is SHORT, and one CONFIRMED ENGINE-certified assignment flips it to FULL."
        test_recipe:
          setup: ["Mechanic m1 holds ENGINE cert; two shifts on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /fleet/mechanics", payload: { name: "Tech", employee_ref: "SC1" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics/${m1}/certifications", payload: { cert_type: "ENGINE", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-10", shift_type: "AM", required_headcount: {} }, as: MaintenanceSupervisor, captures: { s1: $.data.id } }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-10", shift_type: "PM", required_headcount: { ENGINE: 1 } }, as: MaintenanceSupervisor, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /fleet/shifts/${s1}/publish", payload: {}, as: MaintenanceSupervisor, captures: { cov1: $.data.coverage_status } }
            - { call: "POST /fleet/shifts/${s2}/publish", payload: {}, as: MaintenanceSupervisor, captures: { cov2: $.data.coverage_status } }
            - { call: "POST /fleet/shifts/${s2}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { a2: $.data.id } }
            - { call: "POST /fleet/shift-assignments/${a2}/events", payload: { event_type: "CONFIRM" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "GET /fleet/shifts/${s2}", payload: {}, as: MaintenanceSupervisor, captures: { cov3: $.data.coverage_status } }
          assert:
            - "Empty requirements publish as coverage_status == FULL (vacuous)"
            - "{ENGINE: 1} with zero assignments publishes as SHORT"
            - "After one CONFIRMED assignment by an ENGINE-certified mechanic: coverage_status == FULL"

      - name: campaign_scope_frozen_at_activation_keeps_retired_bus
        claim_type: variant_selection
        grounds:
          - calculations.campaign_progress
        distinguishing_aspect: "FROZEN_SCOPE variant: a bus retired after activation stays in scope_bus_ids and in the progress denominator — after retiring one of two scope buses with one campaign WO closed, progress remains 50.0 instead of jumping to 100 under dynamic membership."
