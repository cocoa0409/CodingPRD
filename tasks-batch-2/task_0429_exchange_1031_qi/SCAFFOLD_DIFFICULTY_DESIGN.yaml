  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trust_funds_conserved_under_settle_void
        grounds:
          - state_machines.Disbursement.REQUESTED_to_SETTLED
          - state_machines.Disbursement.SETTLED_to_VOIDED
          - calculations.trust_available_balance
          - entities.QualifiedTrust.fields.available_balance
        distinguishing_aspect: |
          Conserved quantity #1 = trust funds: the invariant
          deposited_amount == available_balance + sum(SETTLED disbursement.amount) holds before
          and after a settle (debit 1500) paired with its void (credit 1500); after void
          available_balance returns to 350000 with no drift.
        test_recipe:
          setup:
            - "FORWARD exchange closed, trust deposited 350000; a QI_FEE disbursement of 1500 settled (available 348500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Cons1 TP", taxpayer_id: "TP-CN1-1", email: "cn1@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-cn1"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "17 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /disbursements/${dis_id}/void"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          assert:
            - "QualifiedTrust.${tr_id}.available_balance == 350000.00 after void"
            - "QualifiedTrust.${tr_id}.deposited_amount == 350000.00 (invariant: deposited == available + sum SETTLED, sum SETTLED now 0)"

      - name: gain_conserved_realized_equals_recognized_plus_deferred
        grounds:
          - calculations.boot_and_recognized_gain
          - calculations.realized_gain
          - entities.Exchange.fields.recognized_gain
          - entities.Exchange.fields.deferred_gain
        distinguishing_aspect: |
          Conserved quantity #2 = total gain (a different conserved quantity from trust funds):
          the invariant realized_gain == recognized_gain + deferred_gain holds after a replacement
          is recorded — realized 290000 == recognized 50000 + deferred 240000.
        test_recipe:
          setup:
            - "FORWARD exchange closed: realized_gain 290000; FINALIZED identification with candidate 420000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Cons2 TP", taxpayer_id: "TP-CN2-1", email: "cn2@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-cn2"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "18 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Cand CN2", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /identifications/${idn_id}/finalize"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/replacement-properties"
              payload: { identified_property_id: "${cand_id}", purchase_price: 420000, replacement_debt: 100000 }
              as: QICoordinator
              captures: { rp_id: $.data.id }
          assert:
            - "Exchange.${ex_id}.realized_gain == 290000.00"
            - "Exchange.${ex_id}.recognized_gain == 50000.00"
            - "Exchange.${ex_id}.deferred_gain == 240000.00"
            - "recognized_gain + deferred_gain == realized_gain (50000 + 240000 == 290000)"
