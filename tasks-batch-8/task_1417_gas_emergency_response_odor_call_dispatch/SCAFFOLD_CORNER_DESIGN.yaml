        grounds: ["state_machines.PublicNotification", "errors[ERR_NOTIFICATION_NOT_DRAFT]", "errors[ERR_NOTIFICATION_NOT_ISSUED]"]
        distinguishing_aspect: "issue requires DRAFT, retract requires ISSUED: retracting a DRAFT fails with ERR_NOTIFICATION_NOT_ISSUED; issuing a RETRACTED notification fails with ERR_NOTIFICATION_NOT_DRAFT."
        test_recipe:
          setup: ["T1; one incident; one MANUAL DRAFT notification"]
          setup_api_calls:
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Z5", caller_phone: "555-0229", address_line: "5 Note St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
