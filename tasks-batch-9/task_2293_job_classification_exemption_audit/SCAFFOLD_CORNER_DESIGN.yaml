        distinguishing_aspect: "A SELF_CORRECT_FULL posture has to be funded to the last cent of the case's exposure. With exposure 17324736 an approval of 17000000 must fail with 409 ERR_CORRECTION_AMOUNT_BELOW_EXPOSURE - and specifically not with the authority-cap error, because 17000000 is still under LEGAL_COUNSEL_AUTHORITY_CAP_CENTS 25000000."
