# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All chains drive empty-DB -> state using only §1.5 endpoints.
# Positive ITA obligations carry a fresh ${la_v}; negative obligations rely on a
# higher-priority validation returning before the OCC check (priority 10).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: ita_obligated_vs_expended
        grounds:
          - calculations.ita_voucher_ledger
          - entities.ITAVoucher.fields.amount_obligated_cents
          - entities.ITAVoucher.fields.amount_expended_cents
          - state_machines.ITAVoucher.DRAFT_to_OBLIGATED
        distinguishing_aspect: "On one ITAVoucher the forward-looking amount_obligated_cents (800000, full authorized cost) diverges from the chronological amount_expended_cents (500000, sum of posted disbursements) — same row, two algorithms, different numbers."
        test_recipe:
          setup:
            - "LocalArea (total 5,000,000; individual cap 800,000). Participant ELIGIBLE+ENROLLED with an ACTIVE career plan; ETPL-eligible program (cost 1,000,000). Voucher authorized 800,000 OBLIGATED, with one 300,000 disbursement already posted."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp_id}", authorized_cost_cents: 800000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v_id: $.data.id }
            - call: "POST /wioa/ita-vouchers/${v_id}/obligate"
              payload: { expected_local_area_version: "${la_v}" }
              as: CaseManager
            - call: "POST /wioa/ita-vouchers/${v_id}/disburse"
              payload: { amount_cents: 300000 }
              as: FiscalOfficer
          trigger:
            - call: "POST /wioa/ita-vouchers/${v_id}/disburse"
              payload: { amount_cents: 200000 }
              as: FiscalOfficer
          assert:
            - "ITAVoucher.${v_id}.amount_obligated_cents == 800000"
            - "ITAVoucher.${v_id}.amount_expended_cents == 500000"
            - "ITAVoucher.${v_id}.amount_obligated_cents != ITAVoucher.${v_id}.amount_expended_cents"
            - "LocalArea.${la_id}.ita_budget_available_cents == 4200000"
            - "LocalArea.${la_id}.ita_budget_obligated_cents == 300000"
            - "LocalArea.${la_id}.ita_budget_expended_cents == 500000"

      - name: performance_raw_vs_adjusted_credential_rate
        grounds:
          - calculations.performance_summary
          - entities.Participant.fields.exit_exclusion
          - entities.Participant.fields.credential_attained
        distinguishing_aspect: "On the cohort (not on any fund ledger) raw_credential_rate=0.5 (1/2, raw denominator) diverges from adjusted_credential_rate=1.0 (1/1, exclusion-adjusted denominator) — different entity domain than the ITAVoucher ledger dual-variant."
        test_recipe:
          setup:
            - "Two EXITED participants: P1 non-excluded with a completed credential-bearing voucher; P2 exited with exit_exclusion=true and no credential."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "POST /wioa/participants/${p1_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p1_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p1_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp1_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp1_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p1_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp1_id}", authorized_cost_cents: 100000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v1_id: $.data.id }
            - call: "POST /wioa/ita-vouchers/${v1_id}/obligate"
              payload: { expected_local_area_version: "${la_v}" }
              as: CaseManager
            - call: "POST /wioa/ita-vouchers/${v1_id}/complete"
              payload: { credential_earned: true }
              as: CaseManager
            - call: "POST /wioa/participants/${p1_id}/exit"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P Two", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p2_id: $.data.id }
            - call: "POST /wioa/participants/${p2_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p2_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p2_id}/exit"
              payload: { exit_exclusion: true }
              as: CaseManager
          trigger:
            - call: "GET /wioa/local-areas/${la_id}/performance-summary"
              payload: {}
              as: Any
              captures: { raw: $.data.raw_credential_rate, adj: $.data.adjusted_credential_rate }
          assert:
            - "response.data.exiter_count == 2"
            - "response.data.excluded_count == 1"
            - "response.data.included_count == 1"
            - "response.data.credential_count == 1"
            - "response.data.raw_credential_rate == 0.5"
            - "response.data.adjusted_credential_rate == 1.0"

  - rule_id: combinatorial_formula
    instances:
      - name: ojt_reimbursement_min_cap
        grounds:
          - calculations.ojt_reimbursement
          - entities.OJTContract.fields.obligated_amount_cents
          - entities.OJTContract.fields.amount_expended_cents
          - state_machines.OJTContract.DRAFT_to_ACTIVE
        distinguishing_aspect: "Mode (a): reimbursement = min(round_half_up(rate*wage*hours), remaining_obligation) with rate ceiling conditioned on employer size; the second reimbursement's gross 40000 is capped to the remaining obligation 20000, so expended lands at 100000 not 120000."
        test_recipe:
          setup:
            - "SMALL employer (slots 5). ELIGIBLE+ENROLLED participant. ACTIVE OJT contract rate 0.5, wage 2000 c/hr, obligation 100000; one reimbursement for 80 hours already posted (gross 80000)."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/employers"
              payload: { name: "Acme", size: "SMALL", max_concurrent_ojt_slots: 5 }
              as: BusinessServicesRep
              captures: { emp_id: $.data.id }
            - call: "POST /wioa/employers/${emp_id}/ojt-contracts"
              payload: { participant_id: "${p_id}", reimbursement_rate: 0.5, wage_cents_per_hour: 2000, planned_hours: 100, obligated_amount_cents: 100000, start_date: "2026-06-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: BusinessServicesRep
              captures: { c_id: $.data.id }
            - call: "POST /wioa/ojt-contracts/${c_id}/activate"
              payload: {}
              as: BusinessServicesRep
            - call: "POST /wioa/ojt-contracts/${c_id}/reimburse"
              payload: { hours_worked: 80 }
              as: FiscalOfficer
          trigger:
            - call: "POST /wioa/ojt-contracts/${c_id}/reimburse"
              payload: { hours_worked: 40 }
              as: FiscalOfficer
          assert:
            - "OJTContract.${c_id}.amount_expended_cents == 100000"

      - name: mileage_round_per_trip_then_sum
        grounds:
          - calculations.mileage_reimbursement
          - entities.SupportiveServicePayment.fields.trips
          - entities.SupportiveServicePayment.fields.computed_amount_cents
        distinguishing_aspect: "Mode (b): pinned rounding order — round_half_up(5*65.5)=328 per trip x 3 = 984, whereas round_half_up(15*65.5)=983; the scaffold fixes per-trip-then-sum so computed_amount_cents==984."
        test_recipe:
          setup:
            - "A participant with a MILEAGE supportive request of three 5-mile trips."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /wioa/participants/${p_id}/supportive-services"
              payload: { service_type: "MILEAGE", trips: [5, 5, 5] }
              as: CaseManager
              captures: { ss_id: $.data.id, amt: $.data.computed_amount_cents }
          assert:
            - "response.data.computed_amount_cents == 984"
            - "SupportiveServicePayment.${ss_id}.computed_amount_cents == 984"

  - rule_id: non_linear_state_machine
    instances:
      - name: career_plan_revision_cycle
        grounds:
          - state_machines.CareerPlan.ACTIVE_to_UNDER_REVISION
          - state_machines.CareerPlan.UNDER_REVISION_to_ACTIVE
          - entities.CareerPlan.fields.revision_count
        distinguishing_aspect: "CareerPlan cycles ACTIVE->UNDER_REVISION->ACTIVE twice; revision_count increments to 2 and status returns to ACTIVE — a genuine cycle, not a linear pipeline."
        test_recipe:
          setup:
            - "ELIGIBLE participant with an ACTIVE career plan that has already completed one revision cycle and is back UNDER_REVISION."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/career-plans/${cp_id}/request-revision"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/career-plans/${cp_id}/approve-revision"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/career-plans/${cp_id}/request-revision"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /wioa/career-plans/${cp_id}/approve-revision"
              payload: {}
              as: CaseManager
          assert:
            - "CareerPlan.${cp_id}.status == \"ACTIVE\""
            - "CareerPlan.${cp_id}.revision_count == 2"

      - name: participant_parallel_eligibility_enrollment
        grounds:
          - state_machines.Participant.PENDING_to_ELIGIBLE
          - state_machines.Participant.NOT_ENROLLED_to_ENROLLED
          - entities.Participant.fields.eligibility_status
          - entities.Participant.fields.enrollment_status
        distinguishing_aspect: "Two independent parallel dimensions on one Participant row advance on distinct triggers: determine-eligibility moves eligibility_status to ELIGIBLE, enroll moves enrollment_status to ENROLLED — a different entity than CareerPlan's cycle."
        test_recipe:
          setup:
            - "A freshly intaken participant (eligibility PENDING, enrollment NOT_ENROLLED)."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
          assert:
            - "Participant.${p_id}.eligibility_status == \"ELIGIBLE\""
            - "Participant.${p_id}.enrollment_status == \"ENROLLED\""

  - rule_id: transitive_cascade
    instances:
      - name: participant_exit_closes_plan_cancels_voucher_releases_funds
        grounds:
          - state_machines.Participant.ENROLLED_to_EXITED
          - state_machines.CareerPlan.ACTIVE_to_CLOSED
          - state_machines.ITAVoucher.OBLIGATED_to_CANCELLED
          - calculations.ita_budget_conservation
        distinguishing_aspect: "Depth-3 chain: exit -> CareerPlan CLOSED -> its OBLIGATED voucher CANCELLED -> LocalArea available restored by 800000; each hop is caused by the prior one, not by exit directly."
        test_recipe:
          setup:
            - "ELIGIBLE+ENROLLED participant with an ACTIVE plan and an OBLIGATED voucher (authorized 800000); LocalArea available already drawn to 4,200,000."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp_id}", authorized_cost_cents: 800000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v_id: $.data.id }
            - call: "POST /wioa/ita-vouchers/${v_id}/obligate"
              payload: { expected_local_area_version: "${la_v}" }
              as: CaseManager
          trigger:
            - call: "POST /wioa/participants/${p_id}/exit"
              payload: {}
              as: CaseManager
          assert:
            - "Participant.${p_id}.enrollment_status == \"EXITED\""
            - "CareerPlan.${cp_id}.status == \"CLOSED\""
            - "ITAVoucher.${v_id}.status == \"CANCELLED\""
            - "LocalArea.${la_id}.ita_budget_available_cents == 5000000"
            - "LocalArea.${la_id}.ita_budget_obligated_cents == 0"

      - name: provider_suspend_suspends_program_cancels_draft_voucher
        grounds:
          - state_machines.TrainingProvider.ELIGIBLE_to_SUSPENDED
          - state_machines.TrainingProgram.ACTIVE_to_SUSPENDED
          - state_machines.ITAVoucher.DRAFT_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain from a different trigger (provider suspend): provider SUSPENDED -> its program SUSPENDED -> that program's DRAFT voucher CANCELLED; each hop caused by the prior."
        test_recipe:
          setup:
            - "ELIGIBLE+ENROLLED participant with an ACTIVE plan; ETPL-eligible provider+program; a DRAFT (unobligated) voucher referencing that program."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp_id}", authorized_cost_cents: 100000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /wioa/training-providers/${prov_id}/suspend"
              payload: {}
              as: StateAdmin
          assert:
            - "TrainingProvider.${prov_id}.etpl_status == \"SUSPENDED\""
            - "TrainingProgram.${prog_id}.status == \"SUSPENDED\""
            - "ITAVoucher.${v_id}.status == \"CANCELLED\""

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: obligate_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_PARTICIPANT_NOT_ENROLLED]
          - errors[ERR_ITA_CAP_EXCEEDED]
        distinguishing_aspect: "Dual failure on obligate — state (participant NOT_ENROLLED, priority 5) and business_fiscal (authorized 900000 > cap 800000, priority 9) — returns ERR_PARTICIPANT_NOT_ENROLLED, proving the state check wins."
        test_recipe:
          setup:
            - "ELIGIBLE-but-NOT-ENROLLED participant with an ACTIVE plan; ETPL-eligible program (cost 1,000,000); DRAFT voucher authorized 900000 (> individual cap 800000)."
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
