            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "2", amount_cents: 500, payee_name_raw: "P2", channel: "TELLER" }, as: BankOps, captures: { ex2: $.data.exception_id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T13:00:00Z" }, as: BankOps }
