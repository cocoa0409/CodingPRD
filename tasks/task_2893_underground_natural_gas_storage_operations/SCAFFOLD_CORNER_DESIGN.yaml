              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2027-01-01", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e1: $.data.error_id }
            - call: "POST /nominations"
