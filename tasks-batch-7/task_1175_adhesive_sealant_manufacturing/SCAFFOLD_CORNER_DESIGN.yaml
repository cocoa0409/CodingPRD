              captures: { dist_b: $.data.id }
            - call: "POST /api/formulation-requests"
              payload: { distributor_id: "${dist_a}", contact_name: "Ana", target_substrate: "glass", required_bond_strength_mpa: 11.0, application_notes: "clear" }
              as: Distributor
              as_user_id: "${dist_a}"
            - call: "POST /api/formulation-requests"
              payload: { distributor_id: "${dist_b}", contact_name: "Bob", target_substrate: "wood", required_bond_strength_mpa: 9.0, application_notes: "fast set" }
              as: Distributor
              as_user_id: "${dist_b}"
          trigger:
            - { call: "GET /api/formulation-requests", payload: {}, as: Distributor, as_user_id: "${dist_a}" }
          assert:
            - "total_count == 1 AND data[0].distributor_id == ${dist_a} (B's request is invisible to A)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_report_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-create-stale-agreement]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ConsignmentAgreement.version: after a first report create advances the agreement to version 3, a second create still carrying expected_agreement_version 2 is rejected with 412 — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["ACTIVE agreement at version 2 (create bumped to 1, activate to 2)"]
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "PU-OCC1", name: "PU Occ1", chemistry_family: "POLYURETHANE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/distributors"
              payload: { name: "Dist OCC1", credit_limit_cents: 1000000, contact_email: "o1@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 2000, max_consigned_value_cents: 900000, reorder_threshold_units: 0, reorder_qty_units: 100 }
              as: CommercialManager
              captures: { ag_id: $.data.id }
            - { call: "POST /api/consignment-agreements/${ag_id}/activate", payload: {}, as: CommercialManager, captures: { ag_v: $.data.version } }
          trigger:
            - { call: "POST /api/consignment-agreements/${ag_id}/consumption-reports", payload: { period: "2026-06", consumed_units: 5, expected_agreement_version: "${ag_v}" }, as: Distributor, as_user_id: "${dist_id}", captures: { rep1: $.data.id } }
            - { call: "POST /api/consignment-agreements/${ag_id}/consumption-reports", payload: { period: "2026-07", consumed_units: 5, expected_agreement_version: "${ag_v}" }, as: Distributor, as_user_id: "${dist_id}", captures: { err: $.data.error_id } }
          assert:
            - "first create: http 201 (expected ${ag_v} == current 2 at that moment) and bumps the agreement to version 3"
            - "second create with the same stale expected version: http 412; ${err} == ERR_STALE_VERSION"
            - "ConsumptionReport.${rep1}.status == DRAFT (unaffected)"

      - name: occ_agreement_patch_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PATCH: a patch carrying the pre-patch version succeeds and advances version to 2; replaying the same expected version is rejected with 412 and applies nothing."
        test_recipe:
          setup: ["DRAFT agreement at version 1"]
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "PU-OCC2", name: "PU Occ2", chemistry_family: "POLYURETHANE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/distributors"
              payload: { name: "Dist OCC2", credit_limit_cents: 1000000, contact_email: "o2@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 2000, max_consigned_value_cents: 500000, reorder_threshold_units: 0, reorder_qty_units: 100 }
              as: CommercialManager
              captures: { ag_id: $.data.id, ag_v: $.data.version }
          trigger:
            - { call: "PATCH /api/consignment-agreements/${ag_id}", payload: { max_consigned_value_cents: 550000, expected_agreement_version: "${ag_v}" }, as: CommercialManager, captures: { ag_v2: $.data.version } }
            - { call: "PATCH /api/consignment-agreements/${ag_id}", payload: { max_consigned_value_cents: 560000, expected_agreement_version: "${ag_v}" }, as: CommercialManager, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH: http 200, ${ag_v2} == 2, max_consigned_value_cents == 550000"
            - "second PATCH (stale ${ag_v} == 1 against current 2): http 412; ${err} == ERR_STALE_VERSION"
            - "max_consigned_value_cents remains 550000 (the losing patch applied nothing)"

      - name: derived_remaining_volume_reconciled_after_second_run
        claim_type: derived_field_reconciliation
        grounds: [calculations.pack_fill_allocation, entities.ProductionBatch.fields.remaining_bulk_volume_ml]
        distinguishing_aspect: "The denormalized remaining_bulk_volume_ml stays consistent across repeated completions: 2000 - 948 - 948 == 104, and lot.units_filled accumulates to 6."
        test_recipe:
          setup: ["MIXED batch of 2000 ml; first run completed (948 ml, 3 units)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-DRV", name: "Epx Drv", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-DRV", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 2000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:00:00Z" }
              as: BatchOperator
              captures: { run1: $.data.id }
            - { call: "POST /api/packaging-runs/${run1}/complete", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:20:00Z", planned_end_at: "2026-05-01T09:10:00Z" }
              as: BatchOperator
              captures: { run2: $.data.id }
          trigger:
            - { call: "POST /api/packaging-runs/${run2}/complete", payload: {}, as: BatchOperator }
          assert:
            - "PackagingRun.${run2}.total_filled_ml == 948"
            - "ProductionBatch.${bat_id}.remaining_bulk_volume_ml == 104 (2000 - 948 - 948; recomputed per completion, not a stale cache)"
            - "ProductionLot.${lot_id}.units_filled == 6; batch.status == PACKING (104 ml remaining, not 0)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_batch_create_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.POST /api/batches"]
        distinguishing_aspect: "Immediate consistency: the POST /api/batches response itself carries the atomically created lot link and computed fields — no re-read or wait is needed to observe them."
        test_recipe:
          setup: ["EFFECTIVE formulation and vessel exist"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-IMM", name: "Epx Imm", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-IMM", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
          trigger:
            - { call: "POST /api/batches", payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }, as: BatchOperator, captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id } }
          assert:
            - "the create response itself contains production_lot_id (non-null), remaining_bulk_volume_ml == 5000, written_off_volume_ml == 0, version == 1"
            - "the lot side of the same transaction is visible immediately: GET /api/production-lots/${lot_id} returns qa_status == AWAITING_TEST"
