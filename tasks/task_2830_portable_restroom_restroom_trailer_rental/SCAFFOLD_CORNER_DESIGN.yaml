          rationale: "The cross-entity guard 'PLANNED -> EN_ROUTE only if Route.status == ACTIVE' is asserted there in both directions, including the fact that the visit's own state is a valid from-state the whole time."

      - name: waiving_a_charge_reverses_every_side_effect_it_caused
        claim_type: compensation
        grounds:
          - state_machines.ChargeEvent.ASSESSED_to_WAIVED
          - state_machines.AssetUnit.IN_REPAIR_to_IN_YARD
        excluded_because:
          difficulty_instance: waiving_the_missed_service_credit_restores_the_account_credit_balance_exactly
          rationale: "Both §1.8 compensating_invariant instances live on this transition: one proves the account credit ledger returns to its pre-charge value with zero drift, the other proves the AssetUnit strike counters and the IN_REPAIR -> IN_YARD hop unwind exactly."

      - name: disputing_a_relocation_charge_drops_it_from_the_contract_ledger_and_upholding_restores_it
        claim_type: ledger_sync
        grounds:
          - state_machines.ChargeEvent.ASSESSED_to_DISPUTED
          - state_machines.ChargeEvent.DISPUTED_to_UPHELD
          - entities.RentalContract.fields.charge_debits_cents
          - entities.RentalContract.fields.net_billable_cents
          - calculations.relocation_charge
        distinguishing_aspect: "DISPUTED sits outside the {ASSESSED, UPHELD} input set, so the ancestor contract's debit roll-up must fall by exactly the charge amount on dispute and return to precisely the same figure on uphold — a ledger round trip that neither compensating_invariant instance covers (they both end in WAIVED, and they track the credit and strike ledgers, not charge_debits_cents)."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. One account with two placeable sites: origin OPEN_LOT and destination GATED (max_truck_length_ft 40), both approved to posture OPEN."
            - "One STANDARD_PORTABLE asset (tare 8 ft) deployed and activated on a CONSTRUCTION contract at the origin site."
            - "The unit is then relocated to the destination effective 2026-08-05 (NOT the clock date), minting a RELOCATION charge of 21275 assessed by officer-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Thistledown Civil", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Thistledown Origin", jurisdiction_code: "IA-PO-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { origin_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Thistledown Annex", jurisdiction_code: "IA-PO-CITY", access_class: "GATED", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { dest_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${origin_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9801", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p_origin: $.data.id }
            - call: "POST /placement-permits/${p_origin}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${p_origin}/approve"
              payload: { authority_decision_ref: "AD-9801" }
              as: ComplianceOfficer
            - call: "POST /placement-permits"
              payload: { site_id: "${dest_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9802", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p_dest: $.data.id }
            - call: "POST /placement-permits/${p_dest}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${p_dest}/approve"
              payload: { authority_decision_ref: "AD-9802" }
              as: ComplianceOfficer
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-501", unit_class: "STANDARD_PORTABLE", yard_code: "YD-5", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${origin_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
            - call: "POST /unit-deployments/${dep_id}/relocate"
              payload: { destination_site_id: "${dest_id}", effective_date: "2026-08-05", relocation_reason: "pad moved east" }
              as: DispatchPlanner
              as_user_id: "planner-1"
              captures: { dep_state: $.data.state, dep_site: $.data.site_id, dep_reloc: $.data.relocation_count }
            - call: "GET /charge-events?contract_id=${contract_id}&charge_kind=RELOCATION"
              payload: {}
