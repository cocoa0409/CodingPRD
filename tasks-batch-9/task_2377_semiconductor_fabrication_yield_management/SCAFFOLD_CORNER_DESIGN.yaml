      - name: process_step_reads_are_scoped_by_flow_and_by_rework_target
        claim_type: filtered_list
        grounds:
          - endpoints[GET /fab/process-steps]
          - endpoints[GET /fab/process-steps/{id}]
          - entities.ProcessStep.fields.rework_target_step_id
        distinguishing_aspect: "Steps are addressable both as a flow-scoped roster and individually: FLOW-A's three steps are returned by flow_id while FLOW-B's single step is not, the rework_target_step_id filter narrows the same roster to the one step that points back at seq 10, and the detail read returns that step's own standard_hours 3.0 rather than the flow's total."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with step seq 10 LITHO 2.0h, step seq 20 LITHO 3.0h whose rework_target_step_id is the seq 10 step, and step seq 30 LITHO 2.0h."
            - "A second flow FLOW-B (MEMORY_D5) with one step seq 10 LITHO 2.0h, created to prove the flow_id filter excludes it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
