            - "trigger call 3 returned 409 as well but for the OTHER reason — run A is RECALC_REQUIRED, and post is declared only from APPROVED, so ERR_INVALID_STATE_TRANSITION (or its specific-state sibling) answers rather than the disclosure error; either way posted_at stays null"
            - "trigger call 4 returned 200 and Plan.menu_posture == RESTRICTED: the posture rule's RESTRICTED band is entered on fee_disclosure_status == RESTATEMENT_REQUIRED alone, with at_risk_slot_ratio still 0.0000 and no fund in TERMINATION_PENDING"
            - "the recusals kept both fee motions carriable: each has for 2, against 0, abstain 0, recuse 1, so the VOTES_CAST denominator is 2 and support_pct is 100.0000 — a plan whose only third voting member is provider-affiliated can still transact fee business, but never with his support"
            - "the FUND_REPLACEMENT motion took the HR member's FOR vote without complaint, confirming that priority 52's fee-motion arm is scoped by subject_type and not by the member alone"

  - section: rbac
    # §1.7 declares six roles under role_model: segregation_of_duties, two of them
    # entity_backed (CommitteeChair, CommitteeMember) and four opaque. The auth
    # ladder is priority 10 (headers) -> 20 (endpoint roles) -> 25 (entity-backed
    # resolution) -> 27 (own-vote only), and every rung must answer BEFORE any
    # business state check, which is what these instances pin down.
    instances:
      - name: every_cross_role_write_is_refused_at_the_role_rung_before_any_state_or_business_check_runs
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.PlanSponsorAdmin.exclusive_operations
          - rbac.CommitteeChair.exclusive_operations
          - rbac.InvestmentConsultant.exclusive_operations
          - rbac.Recordkeeper.exclusive_operations
          - rbac.PlanAuditor
          - validations.priority_10
          - validations.priority_20
        distinguishing_aspect: "Each denial below targets an endpoint whose business state ALSO forbids the call — the proposal is UNDER_REVIEW rather than NOTICE_ISSUED when the chair tries to execute it, the run is DRAFT rather than APPROVED when the chair tries to post it, the member is ACTIVE when the chair tries to activate them — so a 403 ERR_ROLE_NOT_PERMITTED rather than the 409 those states would produce is proof that priority 20 short-circuits ahead of every state machine, and the two header failures prove priority 10 short-circuits ahead of priority 20."
        test_recipe:
          setup:
            - "chain_l3 plus the anchored proposal draft and submit, so FundReplacementProposal.prop_lc is UNDER_REVIEW."
            - "A zero-pool levelization run is drafted for quarter 0 and left in DRAFT, and a meeting is convened with an OPEN FUND_REPLACEMENT motion on it, so that a close and a post both have a real target."
          setup_api_calls:
            - *chain_l3
            - *b_plan_v_read
            - *b_prop_lc
            - *b_prop_submit
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 0, method: "PER_CAPITA", credit_pool_cents: 0, pool_fund_ids: ["${fund_bond_a_id}"] }
              as: Recordkeeper
              as_user_id: "rk-1"
              captures: { run_r1_id: $.data.id }
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-19", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_r1_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet_r1_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet_r1_id}", subject_type: "FUND_REPLACEMENT", subject_id: "${prop_lc_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
              captures: { motion_r1_id: $.data.id }
          trigger:
            - call: "POST /governance/fund-replacements/${prop_lc_id}/approve"
              payload: { approving_motion_id: "${motion_r1_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/execute"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fee-levelization-runs/${run_r1_id}/post"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions/${motion_r1_id}/close"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/asset-class-slots/${slot_lc_id}/seat-fund"
              payload: { fund_id: "${fund_lc_b_id}" }
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${prop_lc_id}", fund_id: "${fund_lc_a_id}", expected_review_version: 1, trailing_return_3y_bps: 900, trailing_return_5y_bps: 850, benchmark_return_3y_bps: 900, benchmark_return_5y_bps: 850, peer_rank_pct: 20.00, style_drift_r2: 0.9200, net_expense_ratio_bps: 45, peer_median_expense_bps: 40, manager_tenure_quarters: 20, manager_change_flag: false }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members/${mem_fin_id}/activate"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Meridian Retirement Services", provider_role: "RECORDKEEPER", term_start_date: "2026-01-01", term_end_date: "2027-12-31", per_head_fee_cents: 4200, asset_based_bps: 3 }
              as: Recordkeeper
              as_user_id: "rk-1"
            - call: "POST /governance/plans/${plan_id}/menu-posture/recompute"
              payload: {}
              as: PlanTrustee
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${plan_id}/menu-posture/recompute"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: ""
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "trigger call 1 returned 403 ERR_ROLE_NOT_PERMITTED: approve is CommitteeChair-exclusive and InvestmentConsultant — the role that DRAFTED the proposal — is not in the endpoint's roles list. FundReplacementProposal.${prop_lc_id} is still UNDER_REVIEW with approving_motion_id null"
            - "trigger call 2 returned 403 ERR_ROLE_NOT_PERMITTED, not the 409 the proposal's UNDER_REVIEW state would otherwise produce: priority 20 is evaluated before any §1.2 precondition"
            - "trigger call 3 returned 403 ERR_ROLE_NOT_PERMITTED, again ahead of the DRAFT-state rejection post would otherwise give; FeeLevelizationRun.${run_r1_id}.status is still DRAFT with posted_at null"
            - "trigger call 4 returned 403 ERR_ROLE_NOT_PERMITTED even though the SAME member legally created that motion on the line above: creating a motion is shared with CommitteeMember, closing it is chair-exclusive. Motion.${motion_r1_id}.status is still OPEN"
            - "trigger call 5 returned 403 ERR_ROLE_NOT_PERMITTED for the read-only auditor, and AssetClassSlot.${slot_lc_id}.current_fund_id is still ${fund_lc_a_id}"
            - "trigger call 6 returned 403 ERR_ROLE_NOT_PERMITTED for the sponsor admin on the consultant's scorecard endpoint — ahead of the 404 that its deliberately wrong review_id (a proposal id) would otherwise cause, which pins the ladder above existence checks too"
            - "trigger call 7 returned 403 ERR_ROLE_NOT_PERMITTED: activate is PlanSponsorAdmin-exclusive, so the chair cannot activate a member even though the chair may approve every fiduciary decision. CommitteeMember.${mem_fin_id}.status is still ACTIVE and Plan.documented_acceptance_count is still 3"
            - "trigger call 8 returned 403 ERR_ROLE_NOT_PERMITTED: registering a provider engagement is PlanSponsorAdmin-exclusive, and the recordkeeper cannot register its own engagement"
            - "trigger call 9 returned 400 ERR_MISSING_USER_CONTEXT — priority 10 — because PlanTrustee is not one of the six roles in §1.7, even though the X-User-ID header was a valid sponsor-admin identity: an unrecognised role is a header failure, not a permission failure"
            - "trigger call 10 returned 400 ERR_MISSING_USER_CONTEXT for the empty X-User-ID header on a call whose role WOULD have been permitted, which is the pair that proves priority 10 precedes priority 20"
            - "trigger call 11 returned 200: POST /_clock/set_current_utc is the one endpoint exempted from both header rules and from the role list, and PlanAuditor is explicitly among its three roles anyway"
            - "after every denial, Plan.version is unchanged from its value before the trigger: a rejected call at the auth rungs must not bump the OCC counter"

      - name: the_chair_who_approves_a_mapping_can_neither_notice_it_nor_execute_it_nor_undo_it
        claim_type: Segregation of duties
        grounds:
