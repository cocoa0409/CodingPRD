  - section: endpoints
    instances:
      - name: every_write_is_readable_and_no_row_is_editable_in_place
        claim_type: standard_crud
        grounds:
          - endpoints[POST /plan/carriers]
          - endpoints[GET /plan/carriers/{id}]
          - endpoints[GET /plan/carriers]
          - endpoints[POST /plan/applicants]
          - endpoints[GET /plan/applicants/{id}]
          - endpoints[POST /plan/applicants/{id}/vehicles]
          - endpoints[GET /plan/applicants/{id}/vehicles]
        distinguishing_aspect: |
          The catalogue has no PUT, PATCH or DELETE anywhere: every mutation is a named action
          endpoint. So the CRUD claim here is create-plus-read fidelity - the read must return the
          stored row byte for byte, including the fields the caller never sent - and the absence of a
          generic update path, which is what forces posture, status and every counter to move only
          through the transitions in section 1.2.
