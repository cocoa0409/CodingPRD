  - rule_id: combinatorial_formula
    instances:
      - name: tiered_line_payout_overperform_bonus
        grounds:
          - calculations.dispatch_line_payout
          - entities.Dispatch.fields.net_payment_cents
          - entities.Dispatch.fields.performance_ratio
        distinguishing_aspect: "Mode (a) non-linear tiered formula with >=3 inputs (delivered_kwh, performance_ratio, rate): a dispatch delivering 12.0 kWh at ratio 1.2 crosses OVERPERFORM_THRESHOLD (1.10) so incentive = 12.0 * 50 * 1.15 = 690 cents (bonus tier), not the flat 600."
        test_recipe:
          setup:
            - "One ACTIVE PAY_FOR_PERFORMANCE program, one enrolled device (committed_kw 5), baseline 9.0; event load 3.0 gives actual 6.0 kW, delivered 12.0 kWh, ratio 1.2; event COMPLETED; settlement created."
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
