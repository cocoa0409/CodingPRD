            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 10 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-9501", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-9502", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a1}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders/${ro1}/start-teardown", payload: {}, as: IntakeCoordinator }
