        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[occ-exposure-limit-update]
        distinguishing_aspect: "OCC on Originator.version: a PATCH carrying the current version (2) succeeds and bumps the version to 3; replaying the same observed version is then rejected 412 ERR_STALE_VERSION — the loser learns its view of the limit is stale."
        test_recipe:
          setup: ["P1 ACTIVE; O1 created and APPROVED (version 2 after the approve transition)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
