  - section: errors
    instances:
      - name: each_path_id_segment_reports_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
        distinguishing_aspect: |
          Seven different path segments each carry their own 404 error_id rather than a shared generic
          one, and every one of them is reachable with the same syntactically valid but unknown UUID on an
          otherwise empty database - which also proves the existence checks run before any body parsing or
          state inspection.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "the database holds no Device, Staff, TestOrder, MedicationHold, ChallengeRun, InterpretationReport or DeviceQualityEvent"
            - "00000000-0000-4000-8000-000000000000 is a well-formed UUID that matches no row"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
          trigger:
            - call: "GET /pft-lab/devices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/staff/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/test-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/medication-holds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/challenge-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/interpretation-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/device-quality-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
          assert:
            - "the device read returns HTTP 404 with error_id ERR_DEVICE_NOT_FOUND"
            - "the staff read returns HTTP 404 with error_id ERR_STAFF_NOT_FOUND and the order read ERR_ORDER_NOT_FOUND"
            - "the hold read returns ERR_HOLD_NOT_FOUND, the run read ERR_RUN_NOT_FOUND and the report read ERR_REPORT_NOT_FOUND"
            - "the quality-event read returns HTTP 404 with error_id ERR_QUALITY_EVENT_NOT_FOUND"
            - "every one of the seven responses carries a non-null error_id and message in the declared envelope"
      - name: quality_event_field_sets_are_both_complete_and_exclusive
        claim_type: error_triggerable
        grounds:
          - validations[priority=16]
          - errors[ERR_MISSING_EVENT_FIELDS]
          - endpoints[POST /pft-lab/devices/{device_id}/quality-events]
        distinguishing_aspect: |
          The one quality-event endpoint carries five disjoint conditional field sets, so
          ERR_MISSING_EVENT_FIELDS is raised in two opposite ways: a VOLUME_CALIBRATION missing
          barometric_pressure_kpa is incomplete, and a FILTER_REPLACEMENT that also carries dwell_minutes
          is complete but not exclusive. Neither refusal leaves an event row behind.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "technologist T-001 exists and device SPIRO-1 is registered with status NEW"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "FILTER_REPLACEMENT", filter_serial: "F-1001", dwell_minutes: 25 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "FILTER_REPLACEMENT", filter_serial: "F-1001" }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "GET /pft-lab/device-quality-events"
              payload: { device_id: "${dev1_id}" }
              as: LabManager
          assert:
            - "the calibration missing barometric_pressure_kpa returns HTTP 422 with error_id ERR_MISSING_EVENT_FIELDS"
            - "the filter replacement carrying dwell_minutes returns HTTP 422 with error_id ERR_MISSING_EVENT_FIELDS"
            - "the clean FILTER_REPLACEMENT returns HTTP 201 with outcome == COMPLETE"
            - "the event list for the device returns total_count 1, so neither refusal appended a row"
            - "Device.${dev1_id}.status is still NEW, because no calibration was ever accepted"
      - name: ambient_conditions_outside_the_btps_domain_are_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=18]
          - errors[ERR_AMBIENT_OUT_OF_RANGE]
          - endpoints[POST /pft-lab/devices/{device_id}/quality-events]
        distinguishing_aspect: |
          The BTPS water-vapour table is only total over [20, 27] degrees and [80.00, 110.00] kPa, so the
          domain guard is asserted from both sides on the one event type whose outcome is unconditional:
          28 degrees and 110.01 kPa are refused while the exact boundary pair 20 degrees and 80.00 kPa is
          accepted, which shows the interval is inclusive at both ends.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "technologist T-001 exists and device DLCO-1 is registered"
            - "LEAK_CHECK carries the same ambient field set as VOLUME_CALIBRATION but always computes outcome COMPLETE"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "DLCO-1", modality: "DLCO" }
              as: LabManager
              captures: { dev2_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "LEAK_CHECK", ambient_temp_c: 28, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "LEAK_CHECK", ambient_temp_c: 23, barometric_pressure_kpa: 110.01 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "LEAK_CHECK", ambient_temp_c: 20, barometric_pressure_kpa: 80.00 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "LEAK_CHECK", ambient_temp_c: 27, barometric_pressure_kpa: 110.00 }
              as: Technologist
              as_user_id: "${tech1_id}"
          assert:
            - "the 28 degree leak check returns HTTP 422 with error_id ERR_AMBIENT_OUT_OF_RANGE"
            - "the 110.01 kPa leak check returns HTTP 422 with error_id ERR_AMBIENT_OUT_OF_RANGE"
            - "the 20 degree and 80.00 kPa leak check returns HTTP 201 with outcome == COMPLETE"
            - "the 27 degree and 110.00 kPa leak check returns HTTP 201 with outcome == COMPLETE"
            - "GET /pft-lab/device-quality-events?device_id=${dev2_id} returns total_count 2"
      - name: natural_keys_are_unique_and_a_refitted_filter_is_not_a_change
        claim_type: error_triggerable
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_DUPLICATE_IDENTIFIER]
          - errors[ERR_FILTER_SERIAL_REUSED]
        distinguishing_aspect: |
          Four different entities share one uniqueness error, and the filter serial adds a fifth,
          subtler kind of duplicate: refitting the serial the device already carries is refused with its
          own ERR_FILTER_SERIAL_REUSED rather than with ERR_DUPLICATE_IDENTIFIER, because the same serial
          is perfectly legal on a different device.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "device SPIRO-1, staff T-001, patient MRN-7001 and lot L-2026-08 all exist"
