  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_block_interval_overlap_half_open
        grounds:
          - validations[priority=13]
          - entities.RentalBlock
        distinguishing_aspect: |
          Interval semantics = half-open [start_minute, end_minute): two
          RentalBlocks on the same TrackDay with intervals that touch (one
          ends at minute X, the next starts at minute X) are ALLOWED; any
          strict overlap is rejected with ERR_BLOCK_OVERLAP. Resource entity
          = RentalBlock.
        test_recipe:
          setup:
            - "TrackDay OPEN with one existing block [480, 540)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "LimeRock", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid15: $.data.id }
            - call: "POST /tracks/${tid15}/track-days"
              payload: { date: "2026-09-06" }
              as: TrackOps
              captures: { tdid15: $.data.id }
            - call: "POST /tracks/${tid15}/track-days/${tdid15}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid15}/track-days/${tdid15}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid15a: $.data.id }
          trigger:
            - call: "POST /tracks/${tid15}/track-days/${tdid15}/rental-blocks"
              payload: { block_index: 1, start_minute: 540, end_minute: 600, max_group_size: 5 }
              as: TrackOps
              captures: { rbid15b: $.data.id }
            - call: "POST /tracks/${tid15}/track-days/${tdid15}/rental-blocks"
              payload: { block_index: 2, start_minute: 539, end_minute: 600, max_group_size: 5 }
              as: TrackOps
              captures: { err15: $.data.error_id }
          assert:
            - "Block [540, 600) is created (adjacency allowed under half-open semantics)"
            - "Block [539, 600) is rejected with ERR_BLOCK_OVERLAP (overlaps [480,540) at minute 539 and also [540,600) at minutes 540..599)"

      - name: garage_bay_slot_occupancy_atomic
        grounds:
          - validations[priority=14]
          - entities.GarageAssignment
        distinguishing_aspect: |
          Different interval semantics from RentalBlock: GarageAssignment is
          a discrete slot-occupancy check — bay_number is an integer slot for
          the WHOLE day (no time interval at all); the collision rule is
          "another ACTIVE GarageAssignment on the same TrackDay with the
          same bay_number". A RELEASED assignment frees the bay. Resource
          entity = GarageAssignment. Different entity + different semantics
          (discrete slot vs continuous interval).
        test_recipe:
          setup:
            - "TrackDay OPEN; RentalBlock; Booking1 APPROVED; Booking2 APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Silverstone", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid16: $.data.id }
            - call: "POST /tracks/${tid16}/track-days"
              payload: { date: "2026-09-07" }
              as: TrackOps
              captures: { tdid16: $.data.id }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/open"
              payload: {}
              as: TrackOps
              captures: { td16_v_open: $.data.version }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid16: $.data.id, rb16_v0: $.data.version }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/rental-blocks/${rbid16}/bookings"
              payload: { organizer_user_id: "orgA16", group_name: "GA", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "PA" }
              as: Organizer
              as_user_id: orgA16
              captures: { bid16a: $.data.id }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/rental-blocks/${rbid16}/bookings"
              payload: { organizer_user_id: "orgB16", group_name: "GB", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "PB" }
              as: Organizer
              as_user_id: orgB16
              captures: { bid16b: $.data.id }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/rental-blocks/${rbid16}/bookings/${bid16a}/approve"
              payload: { expected_rental_block_version: "${rb16_v0}" }
              as: TrackOps
            - call: "GET /tracks/${tid16}/track-days/${tdid16}/rental-blocks/${rbid16}"
              payload: {}
              as: TrackOps
              captures: { rb16_v1: $.data.version }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/rental-blocks/${rbid16}/bookings/${bid16b}/approve"
              payload: { expected_rental_block_version: "${rb16_v1}" }
              as: TrackOps
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/garage-assignments"
              payload: { booking_id: "${bid16a}", bay_number: 2, power_hookups: 1, water_hookup: false, expected_track_day_version: "${td16_v_open}" }
              as: TrackOps
              captures: { gid16: $.data.id }
            - call: "GET /tracks/${tid16}/track-days/${tdid16}"
              payload: {}
              as: TrackOps
              captures: { td16_v_after_garage: $.data.version }
          trigger:
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/garage-assignments"
              payload: { booking_id: "${bid16b}", bay_number: 2, power_hookups: 0, water_hookup: false, expected_track_day_version: "${td16_v_after_garage}" }
              as: TrackOps
              captures: { err16: $.data.error_id }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/garage-assignments/${gid16}/release"
              payload: {}
              as: TrackOps
            - call: "GET /tracks/${tid16}/track-days/${tdid16}"
              payload: {}
              as: TrackOps
              captures: { td16_v_after_release: $.data.version }
            - call: "POST /tracks/${tid16}/track-days/${tdid16}/garage-assignments"
              payload: { booking_id: "${bid16b}", bay_number: 2, power_hookups: 0, water_hookup: false, expected_track_day_version: "${td16_v_after_release}" }
              as: TrackOps
              captures: { gid16b: $.data.id }
          assert:
            - "Second create on same bay_number=2 with first ACTIVE → ERR_BAY_OCCUPIED"
            - "After release, same bay_number=2 succeeds (RELEASED frees the slot)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seats_conservation_across_approve_cancel
        grounds:
          - calculations.rental_block_seats_available
          - state_machines.Booking.PENDING_to_APPROVED
          - state_machines.Booking.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = RentalBlock.seats_available +
          sum(driver_count for APPROVED bookings) == RentalBlock.max_group_size
          at all times. Approving then cancelling the same booking must
          restore the invariant with zero drift; two sequential approve+cancel
          cycles on the same block must leave seats_reserved == 0.
        test_recipe:
          setup:
            - "RentalBlock max_group_size=4, no bookings"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Spa", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid17: $.data.id }
            - call: "POST /tracks/${tid17}/track-days"
              payload: { date: "2026-09-08" }
              as: TrackOps
              captures: { tdid17: $.data.id }
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 4 }
              as: TrackOps
              captures: { rbid17: $.data.id, rb17_v0: $.data.version }
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}/bookings"
              payload: { organizer_user_id: "orgA17", group_name: "GA", run_group_class: "ADVANCED", driver_count: 2, insurance_policy_ref: "PA" }
              as: Organizer
              as_user_id: orgA17
              captures: { bid17a: $.data.id }
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}/bookings"
              payload: { organizer_user_id: "orgB17", group_name: "GB", run_group_class: "ADVANCED", driver_count: 2, insurance_policy_ref: "PB" }
              as: Organizer
              as_user_id: orgB17
              captures: { bid17b: $.data.id }
          trigger:
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}/bookings/${bid17a}/approve"
              payload: { expected_rental_block_version: "${rb17_v0}" }
              as: TrackOps
            - call: "GET /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}"
              payload: {}
              as: TrackOps
              captures: { rb17_v1: $.data.version, sr_mid: $.data.seats_reserved }
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}/bookings/${bid17b}/approve"
              payload: { expected_rental_block_version: "${rb17_v1}" }
              as: TrackOps
            - call: "GET /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}"
              payload: {}
              as: TrackOps
              captures: { rb17_v2: $.data.version }
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}/bookings/${bid17a}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Organizer
              as_user_id: orgA17
            - call: "POST /tracks/${tid17}/track-days/${tdid17}/rental-blocks/${rbid17}/bookings/${bid17b}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Organizer
              as_user_id: orgB17
          assert:
            - "After both approves: RentalBlock.seats_reserved == 4, seats_available == 0, status == FULL"
            - "After both cancels: RentalBlock.seats_reserved == 0, seats_available == 4, status == OPEN (compensation leaves zero drift)"
            - "Invariant holds at every intermediate step: seats_reserved + seats_available == max_group_size"

      - name: coach_assignment_conservation
        grounds:
          - calculations.coach_utilization
          - state_machines.Booking.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Coach.assigned_booking_ids content: the set of
          APPROVED bookings referencing this coach. Assigning and then
          cancelling a booking must leave the coach's assigned_booking_ids
          set EXACTLY equal to its initial state (no ghost references). The
          conserved quantity here is a SET membership invariant, not a
          scalar — different type than the seats invariant.
        test_recipe:
          setup:
            - "Coach C (INTERMEDIATE), TrackDay OPEN, RentalBlock, two NOVICE bookings"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Monza", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid18: $.data.id }
            - call: "POST /tracks/${tid18}/coaches"
              payload: { full_name: "Carol", cert_level: "INTERMEDIATE" }
              as: TrackOps
              captures: { cid18: $.data.id }
            - call: "POST /tracks/${tid18}/track-days"
              payload: { date: "2026-09-09" }
              as: TrackOps
              captures: { tdid18: $.data.id }
            - call: "POST /tracks/${tid18}/track-days/${tdid18}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid18}/track-days/${tdid18}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid18: $.data.id, rb18_v0: $.data.version }
            - call: "POST /tracks/${tid18}/track-days/${tdid18}/rental-blocks/${rbid18}/bookings"
              payload: { organizer_user_id: "orgC18", group_name: "GC", run_group_class: "NOVICE", driver_count: 1, insurance_policy_ref: "PC" }
              as: Organizer
              as_user_id: orgC18
              captures: { bid18: $.data.id }
          trigger:
            - call: "POST /tracks/${tid18}/track-days/${tdid18}/rental-blocks/${rbid18}/bookings/${bid18}/assign_coach"
              payload: { coach_id: "${cid18}" }
              as: TrackOps
            - call: "POST /tracks/${tid18}/track-days/${tdid18}/rental-blocks/${rbid18}/bookings/${bid18}/approve"
              payload: { expected_rental_block_version: "${rb18_v0}" }
              as: TrackOps
            - call: "GET /tracks/${tid18}/coaches/${cid18}"
              payload: {}
              as: TrackOps
              captures: { assigned_set_after_approve: $.data.assigned_booking_ids }
            - call: "POST /tracks/${tid18}/track-days/${tdid18}/rental-blocks/${rbid18}/bookings/${bid18}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Organizer
              as_user_id: orgC18
            - call: "GET /tracks/${tid18}/coaches/${cid18}"
              payload: {}
              as: TrackOps
              captures: { assigned_set_after_cancel: $.data.assigned_booking_ids }
          assert:
            - "After approve: Coach.assigned_booking_ids == [${bid18}]"
            - "After cancel: Coach.assigned_booking_ids == [] (no ghost reference remains)"
            - "Set-membership invariant restored exactly"
