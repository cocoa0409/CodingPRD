  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_territory_award_version_is_rejected_deterministically
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[territory-award-stale-territory]
          - errors.ERR_STALE_VERSION
          - complexity_profile.complexity_layers
          - endpoints.POST_/franchise/territories/{id}/award
        distinguishing_aspect: "The OCC guard on Territory.version reduces the write-write conflict to a stale-version check: an award carrying the version observed before the offer is refused with 412, and the award carrying the current version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Territory MS-01 is DEFINED. Agreement A1 for the triple is OFFERED. Version observed at definition time is captured before the offer."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - *k_agt
            - call: "POST /franchise/agreements/${agt_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v_stale: $.data.version }
          trigger:
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { ter_v_fresh: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v_stale}" }
              as: FranchiseAdmin
              captures: { stale_error: $.data.error_id }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v_fresh}" }
              as: FranchiseAdmin
              captures: { fresh_status: $.data.status }
          assert:
            - "the stale award returns 412 and stale_error == ERR_STALE_VERSION"
            - "Territory.${ter_ms_id}.status is still OFFERED and allocated_households == 0 after the stale award"
            - "the offer advanced Territory.${ter_ms_id}.version, so ${ter_v_stale} is one behind ${ter_v_fresh}"
            - "the award carrying the fresh version returns 200 and fresh_status == AWARDED"

      - name: lead_allocation_brand_count_flips_the_cost_at_the_portfolio_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.lead_cost_calculation
          - entities.Franchisee.fields.active_brand_count
          - endpoints.POST_/franchise/leads/{id}/allocate
        distinguishing_aspect: "The multi-brand discount is a threshold trigger on active_brand_count: a franchisee holding exactly one brand pays the full subtotal, and the same franchisee after activating a second brand pays 0.85 of it, with the boundary at MULTI_BRAND_MIN of 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mosaic Central LLC holds ACTIVE agreements A1 (brand MS) and A2 (brand IL), so active_brand_count is 2. Two BAND_2 leads valued at 150000 are RECEIVED."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_fr_il_plain
            - &k_fr_solo2
              call: "POST /franchise/franchisees"
              payload: { legal_name: "Solo Trades LLC", principal_name: "Marta Reyes", entity_type: "SOLE_PROPRIETOR", shared_services_enrolled: true }
              as: FranchiseAdmin
              captures: { fr_solo_id: $.data.id }
            - *k_brand_ms
            - *k_brand_il
            - *k_ter_ms
            - *k_ter_il
            - &k_ter_solo2
              call: "POST /franchise/territories"
              payload: { territory_code: "MS-80", brand_id: "${ms_brand_id}", household_count: 11000, postal_codes: ["79501"], expansion_right_households: 15000, protected: true, franchisee_id: "${fr_solo_id}" }
              as: FranchiseAdmin
              captures: { ter_solo_id: $.data.id }
            - *k_agt
