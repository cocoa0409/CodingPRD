      - name: expansion_conversion_is_allowed_only_from_the_approved_state
        claim_type: Conditional action
        grounds:
          - endpoints[POST /district-energy/expansion-projects/{project_id}/convert]
          - state_machines.ExpansionProject.APPROVED_to_CONVERTED
          - errors[ERR_PROJECT_STATE_INVALID]
        distinguishing_aspect: "Conversion is refused from SIZED and refused again from the terminal CONVERTED state, so the only window in which it works is APPROVED; the single successful call is what creates the PENDING_CAPACITY ConnectionAgreement carrying the project's own loop, tariff and COMMERCIAL_OFFICE class."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-X and RateSchedule RS-C, with ExpansionProject P1 (1200.0 kW, delta-T 40.0, route 850.0 m) already SIZED at 100 mm and npv 2051685.40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
