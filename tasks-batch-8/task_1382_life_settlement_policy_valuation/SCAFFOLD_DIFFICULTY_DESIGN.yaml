            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6500000 }, as: Underwriter, captures: { o2: "$.data.id" } }
          trigger:
            - { call: "POST /api/offers/${o1}/accept", payload: { broker_commission_bps: 455 }, as: Broker, as_user_id: "${b_id}", captures: { o1_status: "$.data.status" } }
          assert:
            - "captured o1_status == ACCEPTED; GET /api/offers/${o1}: effective_price_cents == 6000000"
            - "GET /api/offers/${o2}: status == REJECTED (sibling cascade)"
            - "GET /api/cases/${c1}: status == IN_CLOSING, purchase_price_cents == 6000000, broker_commission_bps == 455"
            - "Hop 1: GET /api/cases/${c1}/closing-package returns exactly 1 package, status ASSEMBLED, documents has 7 rows (TX: no STATE_SUPPLEMENT), all signed == false"
            - "Hop 2: GET /api/cases/${c1}/escrow-account returns exactly 1 escrow, status OPEN, expected_funding_cents == 6090000"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_offer_counter_rejected_before_increment_check
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Offer.PENDING_to_EXPIRED
        distinguishing_aspect: |
          Category pair (state, business_constraint): a counter on an EXPIRED
          offer whose amount also violates the 1% minimum increment returns
          ERR_ALREADY_TERMINAL (priority 6 state), never ERR_COUNTER_INCREMENT_TOO_SMALL
          (priority 10 business_constraint).
        test_recipe:
          setup:
            - "Canonical TX chain to MARKETED, disclosures delivered, offer 6000000 created at default clock 2026-08-01 (expires_at 2026-08-11)"
            - "Clock advanced to 2026-08-12: offer auto-transitioned to EXPIRED"
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
