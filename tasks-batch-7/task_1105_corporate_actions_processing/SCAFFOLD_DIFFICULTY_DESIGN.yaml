            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"], compensation_pool_cents: 100000 }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "PUT /api/accounts/${a1}", payload: { status: "FROZEN" }, as: OperationsManager }
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager }
            - { call: "GET /api/entitlements?event_id=${ev_id}&account_id=${a1}", payload: {}, as: OperationsManager, captures: { ent_id: "$.data[0].id"} }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: DeskAdministrator }
