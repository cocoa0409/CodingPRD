scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payt_weight_charge_marginal_vs_free_allowance
        grounds:
          - calculations.pay_as_you_throw_weight_charge
          - entities.Invoice.fields.weight_charge_cents
          - entities.ServiceAccount.fields.rate_class
        distinguishing_aspect: "PAYT cost accounting on Invoice/weight; same 350 net lbs produce 1400 cents for RESIDENTIAL (100-lb free allowance) but a different charge for COMMERCIAL_SMALL (0 allowance) — variant divergence on the Invoice/weight domain."
        test_recipe:
          setup:
            - "RESIDENTIAL account ACTIVE; one ACTIVE TRASH ServicePlan (base 2000); one ACTIVE TRASH cart (tare 50); route IN_PROGRESS with two completed TRASH pickups whose weight tickets net 200 and 150 lbs (total 350); billing period covers both tickets."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "1 Maple St", rate_class: "RESIDENTIAL", diversion_floor_pct: 0 }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 96, tare_weight_lbs: 50 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 2000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { acct_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-04T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-1" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop1_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 2 }
              as: Dispatcher
              captures: { stop2_id: $.data.id }
            - call: "POST /stops/${stop1_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk1_id: $.data.id }
            - call: "POST /stops/${stop2_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk2_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk1_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
              captures: { cart_v2: $.data.version }
            - call: "POST /pickups/${pk1_id}/weight-ticket"
              payload: { gross_weight_lbs: 250, diverted: false }
              as: Driver
            - call: "POST /pickups/${pk2_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /pickups/${pk2_id}/weight-ticket"
              payload: { gross_weight_lbs: 180, diverted: false }
              as: Driver
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: Billing
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
              captures: { wc: $.data.weight_charge_cents }
          assert:
            - "Invoice.${inv_id}.weight_charge_cents == 1400"
            - "Invoice.${inv_id}.base_fee_cents == 2000"
      - name: missed_credit_flat_vs_special_partial_refund
        grounds:
          - calculations.missed_pickup_credit_amount
          - entities.MissedPickupCredit.fields.amount_cents
          - entities.MissedPickupCredit.fields.source_type
        distinguishing_aspect: "Credit/goodwill domain (MissedPickupCredit), distinct from PAYT cost domain: a carrier-fault MISSED pickup yields a flat 1500-cent credit while a cancelled SCHEDULED special pickup yields 50% of its quoted fee (7000 for a 14000 corrosive quote) — two algorithms on the same metric, different entity sources."
        test_recipe:
          setup:
            - "ACTIVE account with one ACTIVE TRASH cart and ACTIVE TRASH plan; a route IN_PROGRESS with one SCHEDULED pickup; separately, an APPROVED+SCHEDULED HAZARDOUS/CORROSIVE special pickup (quoted 14000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "2 Oak St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65, tare_weight_lbs: 40 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 1500 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /routes"
              payload: { service_date: "2026-05-05T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-2" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop1_id: $.data.id }
            - call: "POST /stops/${stop1_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk1_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /accounts/${acct_id}/special-pickups"
              payload: { kind: "HAZARDOUS", requested_date: "2026-05-10T00:00:00Z", hazard_class: "CORROSIVE" }
              as: ResidentAccount
              as_user_id: "${acct_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /special-pickups/${sp_id}/approve"
              payload: {}
              as: Dispatcher
              captures: { sp_fee: $.data.quoted_fee_cents }
            - call: "POST /special-pickups/${sp_id}/schedule"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /pickups/${pk1_id}/miss"
              payload: { miss_reason: "MISSED_BY_CREW" }
              as: Driver
            - call: "POST /special-pickups/${sp_id}/cancel"
              payload: {}
              as: ResidentAccount
              as_user_id: "${acct_id}"
          assert:
            - "exactly one MissedPickupCredit exists with source_type == PICKUP, source_pickup_id == ${pk1_id}, amount_cents == 1500, status == PENDING"
            - "exactly one MissedPickupCredit exists with source_type == SPECIAL_PICKUP, source_special_pickup_id == ${sp_id}, amount_cents == 7000, status == PENDING"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payt_marginal_tier_three_inputs_mode_a
        grounds:
          - calculations.pay_as_you_throw_weight_charge
          - entities.Invoice.fields.weight_charge_cents
          - entities.ServiceAccount.fields.rate_class
        distinguishing_aspect: "Mode (a): >=3 inputs (period net weight, rate_class tier table, free allowance) with marginal tiered-rate selection straddling tier1/tier2 — 600 billable lbs for COMMERCIAL_SMALL = 200*7 + 300*10 + 100*15 = 5900 cents."
        test_recipe:
          setup:
            - "COMMERCIAL_SMALL account ACTIVE (no free allowance); one ACTIVE TRASH plan base 0; one ACTIVE TRASH cart tare 0; one COMPLETED TRASH pickup with a weight ticket net 600 lbs in the billing period."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "5 Dock Rd", rate_class: "COMMERCIAL_SMALL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 96, tare_weight_lbs: 0 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 0 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { acct_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-06T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-3" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop1_id: $.data.id }
            - call: "POST /stops/${stop1_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk1_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk1_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /pickups/${pk1_id}/weight-ticket"
              payload: { gross_weight_lbs: 600, diverted: false }
              as: Driver
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: Billing
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          assert:
            - "Invoice.${inv_id}.weight_charge_cents == 5900"
      - name: contamination_round_per_pickup_then_sum_mode_b
        grounds:
          - calculations.contamination_surcharge
          - entities.Invoice.fields.contamination_surcharge_cents
          - entities.ContaminationTag.fields.severity
        distinguishing_aspect: "Mode (b): nested rounding order pinned as round-per-pickup-THEN-sum (opposite of PAYT's sum-then-round) — pickup A (net 200, MAJOR) rounds to 2500, pickup B (net 150, MINOR) rounds to 800, summed to 3300."
        test_recipe:
          setup:
            - "RESIDENTIAL account ACTIVE; ACTIVE TRASH cart tare 50; ACTIVE TRASH plan base 0; route IN_PROGRESS; two COMPLETED pickups net 200 (MAJOR-tagged) and net 150 (MINOR-tagged); invoice period covers both."
