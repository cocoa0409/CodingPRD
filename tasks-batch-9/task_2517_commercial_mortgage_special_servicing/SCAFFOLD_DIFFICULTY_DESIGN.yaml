# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2517_commercial_mortgage_special_servicing
#
# 9 rule_ids / 23 instances. Every `grounds:` ref resolves into SCAFFOLD.yaml
# §1.1-§1.7. Every numeric literal in every `assert:` was executed against the
# corresponding §1.3 formula before being written here.
#
# Pinned fixture identities (opaque roles): ms-001 (MasterServicer),
# amgr-001 / amgr-002 (SpecialServicerAssetManager — two distinct humans so the
# segregation-of-duties rule at validation priority 10 can be satisfied),
# cmte-001 (SpecialServicingCommitteeOfficer), trustee-001 (Trustee),
# admin-001 (PlatformAdmin). The entity_backed roles present the owning row id:
# Borrower -> loan_id, ControllingClassRepresentative -> trust_id.
#
# The logical clock starts at 2026-08-01T00:00:00Z on an empty database.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: ara_gross_appraised_versus_net_liquidation_credit_basis
        grounds:
          - calculations.appraisal_reduction_amount
          - entities.Appraisal.fields.appraisal_type
          - entities.Appraisal.fields.estimated_liquidation_expenses_usd
          - entities.AppraisalReduction.fields.calculation_basis
          - entities.AppraisalReduction.fields.appraisal_credit_usd
          - state_machines.Appraisal.RECEIVED_to_ACCEPTED
        distinguishing_aspect: |
          The two variants diverge on WHERE the 90% credit is taken: an UPDATE appraisal takes it
          against the raw appraised value (GROSS_APPRAISED_BASIS) while a FULL_NARRATIVE appraisal
          deducts estimated liquidation expenses first (NET_LIQUIDATION_BASIS), so two loans with
          an identical 19,500,000.00 deficiency base and an identical 15,000,000 appraised value
          produce appraisal reductions of 6,000,000.00 and 6,810,000.00 — a divergence of exactly
          round(0.90 * 900000, 2) = 810,000.00.
        test_recipe:
          setup:
            - "One trust with the default 0.25% special servicing fee rate and an 8,000,000.00 original controlling class balance."
            - "Two loans in that trust, each with current_principal_balance_usd 19,500,000.00, accrued_unpaid_interest_usd 0.00 and no advances, so both deficiency bases are exactly 19,500,000.00."
            - "Both loans transferred to special servicing on a 60-day monetary default event."
            - "Loan A carries an ACCEPTED UPDATE appraisal at 15,000,000; loan B carries an ACCEPTED FULL_NARRATIVE appraisal at the same 15,000,000 with 900,000 of estimated liquidation expenses."
            - "Logical clock at the default 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-C1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 8000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-001", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_a_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-002", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_b_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_a_id}", event_code: "MONETARY_DEFAULT_60D", occurred_on: "2026-07-15T00:00:00Z", evidence_note: "60 days monetary delinquency", days_delinquent_at_event: 60 }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_b_id}", event_code: "MONETARY_DEFAULT_60D", occurred_on: "2026-07-15T00:00:00Z", evidence_note: "60 days monetary delinquency", days_delinquent_at_event: 60 }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_a_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_b_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_a_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_a_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_a_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 15000000, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_b_id}", appraisal_type: "FULL_NARRATIVE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_b_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_b_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 15000000, as_of_date: "2026-08-01T00:00:00Z", estimated_liquidation_expenses_usd: 900000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
          trigger:
            - call: "POST /special-servicing/appraisals/${appraisal_a_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "POST /special-servicing/appraisals/${appraisal_b_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_a_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_a_id: "$.data[0].id", ara_a_amount: "$.data[0].ara_amount_usd" }
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_b_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_b_id: "$.data[0].id", ara_b_amount: "$.data[0].ara_amount_usd" }
          assert:
            - "AppraisalReduction.${ara_a_id}.calculation_basis == GROSS_APPRAISED_BASIS"
            - "AppraisalReduction.${ara_a_id}.deficiency_base_usd == 19500000.00"
            - "AppraisalReduction.${ara_a_id}.appraisal_credit_usd == 13500000.00"
            - "AppraisalReduction.${ara_a_id}.ara_amount_usd == 6000000.00"
            - "AppraisalReduction.${ara_a_id}.ara_percentage == 30.7692"
            - "AppraisalReduction.${ara_b_id}.calculation_basis == NET_LIQUIDATION_BASIS"
            - "AppraisalReduction.${ara_b_id}.deficiency_base_usd == 19500000.00"
            - "AppraisalReduction.${ara_b_id}.appraisal_credit_usd == 12690000.00"
            - "AppraisalReduction.${ara_b_id}.ara_amount_usd == 6810000.00"
            - "AppraisalReduction.${ara_b_id}.ara_percentage == 34.9231"
            - "AppraisalReduction.${ara_b_id}.ara_amount_usd - AppraisalReduction.${ara_a_id}.ara_amount_usd == 810000.00"
            - "Both reductions are created in status PROVISIONAL, so Trust.${trust_id}.total_ara_usd == 0.00 and Trust.${trust_id}.control_status == CONTROLLING"

      - name: special_servicing_fee_stated_principal_versus_ara_adjusted_basis
        grounds:
          - calculations.special_servicing_fee_accrual
          - entities.Trust.fields.fee_basis_convention
          - entities.FeeAccrual.fields.basis_amount_usd
          - entities.FeeAccrual.fields.amount_usd
          - entities.Loan.fields.ara_amount_usd
          - state_machines.AppraisalReduction.PROVISIONAL_to_EFFECTIVE
        distinguishing_aspect: |
          The two variants diverge on the FEE BASIS, not on any rate: with an identical
          19,500,000.00 stated principal balance, an identical EFFECTIVE appraisal reduction of
          6,000,000.90 and an identical 0.25% annual rate, the STATED_PRINCIPAL trust accrues
          4,062.50 on a basis of 19,500,000.00 while the ARA_ADJUSTED trust accrues 2,812.50 on a
          basis of 13,499,999.10 — a divergence of exactly 1,250.00 driven purely by
          trust.fee_basis_convention.
        test_recipe:
          setup:
            - "Two trusts, identical except fee_basis_convention: trust S is STATED_PRINCIPAL, trust R is ARA_ADJUSTED. Both carry a 40,000,000.00 original controlling class balance so the 25% control test never fires and cannot perturb the fee."
            - "One loan per trust, both with current_principal_balance_usd 19,500,000.00 and no advances."
            - "Each loan carries an ACCEPTED UPDATE appraisal at 14,999,999 whose PROVISIONAL reduction of 6,000,000.90 has been made EFFECTIVE, so loan.ara_amount_usd is 6,000,000.90 on both."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-S1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000, special_servicing_fee_annual_pct: 0.25, fee_basis_convention: "STATED_PRINCIPAL" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_s_id: "$.data.id" }
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-R1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000, special_servicing_fee_annual_pct: 0.25, fee_basis_convention: "ARA_ADJUSTED" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_r_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_s_id}", loan_number: "L-S01", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_s_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_r_id}", loan_number: "L-R01", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_r_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_s_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition filed" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_r_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition filed" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_s_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_r_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_s_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_s_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_s_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 14999999, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_s_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_s_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_s_id: "$.data[0].id" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_s_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_r_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_r_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_r_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 14999999, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_r_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_r_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_r_id: "$.data[0].id" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_r_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
          trigger:
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_s_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { fee_s_id: "$.data.id", fee_s_amount: "$.data.amount_usd" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_r_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { fee_r_id: "$.data.id", fee_r_amount: "$.data.amount_usd" }
          assert:
            - "Loan.${loan_s_id}.ara_amount_usd == 6000000.90 and Loan.${loan_r_id}.ara_amount_usd == 6000000.90"
            - "FeeAccrual.${fee_s_id}.basis_amount_usd == 19500000.00"
            - "FeeAccrual.${fee_s_id}.amount_usd == 4062.50"
            - "FeeAccrual.${fee_r_id}.basis_amount_usd == 13499999.10"
            - "FeeAccrual.${fee_r_id}.amount_usd == 2812.50"
            - "FeeAccrual.${fee_s_id}.amount_usd - FeeAccrual.${fee_r_id}.amount_usd == 1250.00"
            - "FeeAccrual.${fee_s_id}.rate_pct == 0.020833 and FeeAccrual.${fee_r_id}.rate_pct == 0.020833"
            - "Loan.${loan_s_id}.fees_payable_usd == 4062.50 and Loan.${loan_r_id}.fees_payable_usd == 2812.50"

      - name: workout_npv_contractual_versus_delay_stressed_recommendation_flip
        grounds:
          - calculations.workout_alternative_npv
          - calculations.workout_alternative_ranking
          - entities.WorkoutPlan.fields.npv_basis
          - entities.WorkoutPlan.fields.recommended_alternative_id
          - entities.WorkoutAlternative.fields.npv_usd
          - state_machines.WorkoutPlan.DRAFT_to_SCORED
        distinguishing_aspect: |
          The two variants diverge on the DISCOUNT EXPONENT, and the divergence is large enough to
          change the servicer's obligation: with identical cash flows the CONTRACTUAL basis ranks
          MODIFICATION first (8,221,266.34 versus NOTE_SALE 8,220,502.28) while the DELAY_STRESSED
          basis, which pushes every recovery one annual period further out, ranks NOTE_SALE first
          (7,499,499.80 versus MODIFICATION 7,497,594.82) — a rank-1 flip, not merely a different
          number.
        test_recipe:
          setup:
            - "One trust, two loans, both transferred to special servicing."
            - "A WorkoutPlan on loan C with npv_basis CONTRACTUAL and discount_rate_pct 9.5; a WorkoutPlan on loan D with npv_basis DELAY_STRESSED and the same 9.5 rate."
            - "Each plan carries the same three alternatives: MODIFICATION cash flows [(1, 900000), (2, 950000), (3, 1000000), (4, 8576200)] with 120,000 upfront; NOTE_SALE [(1, 9100000)] with 90,000 upfront; FORECLOSURE [(1, 0), (2, 9800000)] with 650,000 upfront."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-N1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-C01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, accrued_unpaid_interest_usd: 0, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2028-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_c_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-D01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, accrued_unpaid_interest_usd: 0, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2028-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_d_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_c_id}", event_code: "IMMINENT_DEFAULT", occurred_on: "2026-07-20T00:00:00Z", evidence_note: "borrower certified imminent default", imminent_default_certified: true }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_d_id}", event_code: "IMMINENT_DEFAULT", occurred_on: "2026-07-20T00:00:00Z", evidence_note: "borrower certified imminent default", imminent_default_certified: true }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_c_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_d_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "GET /special-servicing/loans/${loan_c_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { loan_c_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_c_id}", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_c_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_c_id: "$.data.id" }
            - call: "GET /special-servicing/loans/${loan_d_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { loan_d_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_d_id}", discount_rate_pct: 9.5, npv_basis: "DELAY_STRESSED", expected_loan_version: "${loan_d_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_d_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_c_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 900000 }, { period_index: 2, amount_usd: 950000 }, { period_index: 3, amount_usd: 1000000 }, { period_index: 4, amount_usd: 8576200 }], upfront_cost_usd: 120000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_c_mod_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_c_id}", alternative_type: "NOTE_SALE", projected_cash_flows: [{ period_index: 1, amount_usd: 9100000 }], upfront_cost_usd: 90000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_c_note_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_c_id}", alternative_type: "FORECLOSURE", projected_cash_flows: [{ period_index: 1, amount_usd: 0 }, { period_index: 2, amount_usd: 9800000 }], upfront_cost_usd: 650000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_c_fore_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_d_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 900000 }, { period_index: 2, amount_usd: 950000 }, { period_index: 3, amount_usd: 1000000 }, { period_index: 4, amount_usd: 8576200 }], upfront_cost_usd: 120000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
