  - method: GET
    path: "/false-alarm-program/compliance-reports"
    description: "List compliance reports, filterable by monitoring company, status or period."
    roles: [ProgramAdministrator, FalseAlarmReviewOfficer, PermitClerk, AlarmCompanyOperator]
    code: 200
    input: ["monitoring_company_id?", "status?", "period_from?", "period_to?", "page?", "per_page?"]
    output: ComplianceReport[]
    side_effects: []

  # ------------------------------------------------- test-driving endpoints (/_*)
  - method: POST
    path: "/false-alarm-program/_clock/set_current_utc"
    description: "Set the server logical clock to any UTC instant. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time, so every window, deadline and expiry rule in this scaffold is deterministic."
    roles: [ProgramAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Moves the logical clock; no entity is recomputed until the next request or nightly run"]

  - method: POST
    path: "/false-alarm-program/_program-runs/nightly"
    description: "Run the nightly program batch at the current logical clock: permit renewal notices, grace and expiry, unpermitted cascade, invoice late penalties and dunning advance, suspension expiry, and untimely-appeal dismissal."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: null
    side_effects: ["AlarmPermit ACTIVE -> RENEWAL_DUE at term_end_at - 30 days, RENEWAL_DUE -> GRACE past term_end_at, GRACE -> EXPIRED past grace_through_at", "unpermitted_cascade: expired permit -> AlarmSystem UNPERMITTED -> UNPERMITTED_OPERATION_PENALTY invoice and AlarmSite.unpermitted_system_count / renewal_block_active recomputed", "PenaltyInvoice late_penalty_cents applied once and collections_stage advanced CURRENT -> NOTICE -> FINAL_NOTICE per §1.3 delinquency_escalation, skipping invoices frozen by a live appeal", "SuspensionOrder EFFECTIVE -> EXPIRED past effective_through", "Appeal FILED -> DISMISSED_UNTIMELY when never scheduled within 60 days of filed_at", "Recomputes AlarmSite balances, counters and response_status", "Increments the version of every entity it mutates by 1"]

# ============================================================================
# §1.6 ERROR CODE CATALOG
# ----------------------------------------------------------------------------
# Every code below is triggerable by at least one §1.5 endpoint and is referenced
# by a §1.2 precondition, a §1.2.1 concurrency rule or a §1.4 validation row.
# ============================================================================
errors:
  # ---------------------------------------------------------------- auth / RBAC
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-Role or X-User-ID header absent or empty" }
  - { id: ERR_UNKNOWN_ROLE, http: 401, condition: "X-User-Role is not one of the eight roles declared in §1.7" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Recognized role is not in the target endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "AlarmUser X-User-ID is not the AlarmSite.id of the target aggregate, or AlarmCompanyOperator X-User-ID is not the AlarmCompany.id of the target aggregate" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting user already performed the incompatible upstream step: deciding an appeal they determined or filed, determining an incident whose dispatch request they validated, or adjusting an invoice they posted a payment against" }
  - { id: ERR_NOT_DOCKET_OFFICER, http: 403, condition: "The acting user is not HearingDocket.hearing_officer_user_id of the docket that heard the appeal or of the docket being held" }

  # ------------------------------------------------------- field shape / paging
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 422, condition: "A field required by the endpoint's §1.5 input is absent or null" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "A supplied field violates its declared type, enum domain, non-negative-integer-cents rule, [0,1] percentage range or RFC 3339 UTC format" }
  - { id: ERR_INVALID_PAGINATION, http: 422, condition: "page below 1, per_page outside [1,100], or a sort key that is not a declared field of the listed entity" }

  # ------------------------------------------------------------------ existence
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Umbrella code for an unresolvable id when no entity-specific code applies" }
  - { id: ERR_FEE_SCHEDULE_NOT_FOUND, http: 404, condition: "scheduleId or governing_fee_schedule_id does not resolve to a FeeSchedule" }
  - { id: ERR_ALARM_COMPANY_NOT_FOUND, http: 404, condition: "companyId or monitoring_company_id does not resolve to an AlarmCompany" }
  - { id: ERR_ALARM_SITE_NOT_FOUND, http: 404, condition: "siteId or alarm_site_id does not resolve to an AlarmSite" }
  - { id: ERR_SITE_CONTACT_NOT_FOUND, http: 404, condition: "contactId or a call_attempts site_contact_id does not resolve to a SiteContact" }
  - { id: ERR_ALARM_SYSTEM_NOT_FOUND, http: 404, condition: "systemId or alarm_system_id does not resolve to an AlarmSystem" }
  - { id: ERR_ALARM_PERMIT_NOT_FOUND, http: 404, condition: "permitId or alarm_permit_id does not resolve to an AlarmPermit" }
  - { id: ERR_DISPATCH_REQUEST_NOT_FOUND, http: 404, condition: "requestId or dispatch_request_id does not resolve to a DispatchRequest" }
  - { id: ERR_FALSE_ALARM_INCIDENT_NOT_FOUND, http: 404, condition: "incidentId, false_alarm_incident_id or triggering_incident_id does not resolve to a FalseAlarmIncident" }
  - { id: ERR_HEARING_DOCKET_NOT_FOUND, http: 404, condition: "docketId or hearing_docket_id does not resolve to a HearingDocket" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appealId or prior_appeal_id does not resolve to an Appeal" }
  - { id: ERR_SUSPENSION_ORDER_NOT_FOUND, http: 404, condition: "orderId or suspension_order_id does not resolve to a SuspensionOrder" }
  - { id: ERR_PENALTY_INVOICE_NOT_FOUND, http: 404, condition: "invoiceId or an explicit_allocations penalty_invoice_id does not resolve to a PenaltyInvoice" }
  - { id: ERR_PAYMENT_RECORD_NOT_FOUND, http: 404, condition: "paymentId does not resolve to a PaymentRecord" }
  - { id: ERR_PAYMENT_ALLOCATION_NOT_FOUND, http: 404, condition: "allocationId does not resolve to a PaymentAllocation" }
  - { id: ERR_COMPLIANCE_REPORT_NOT_FOUND, http: 404, condition: "reportId does not resolve to a ComplianceReport" }

  # ------------------------------------------------ optimistic concurrency (OCC)
  - { id: ERR_STALE_ALARM_SITE_VERSION, http: 412, condition: "expected_alarm_site_version does not equal AlarmSite.version on suspension-order creation or payment posting (§1.2.1)" }
  - { id: ERR_STALE_PENALTY_INVOICE_VERSION, http: 412, condition: "expected_penalty_invoice_version does not equal PenaltyInvoice.version on an invoice adjustment (§1.2.1)" }
  - { id: ERR_STALE_ALARM_SYSTEM_VERSION, http: 412, condition: "expected_alarm_system_version does not equal AlarmSystem.version on system reconfiguration (§1.2.1)" }
  - { id: ERR_STALE_ALARM_PERMIT_VERSION, http: 412, condition: "expected_alarm_permit_version does not equal AlarmPermit.version on renewal (state-precondition version guard)" }
  - { id: ERR_STALE_FALSE_ALARM_INCIDENT_VERSION, http: 412, condition: "expected_false_alarm_incident_version does not equal FalseAlarmIncident.version on appeal filing (state-precondition version guard)" }
  - { id: ERR_STALE_HEARING_DOCKET_VERSION, http: 412, condition: "expected_hearing_docket_version does not equal HearingDocket.version on appeal scheduling (state-precondition version guard)" }

  # ---------------------------------------------------------- state preconditions
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state from which the requested §1.2 transition is declared, including every terminal-state target" }
  - { id: ERR_OPEN_DISPATCH_REQUEST_EXISTS, http: 409, condition: "The alarm system already has a DispatchRequest in SUBMITTED, VALIDATED or DISPATCHED" }
  - { id: ERR_INCIDENT_ALREADY_REPORTED, http: 409, condition: "The dispatch request already has a non-VOIDED FalseAlarmIncident" }
  - { id: ERR_DOCKET_NOT_OPEN, http: 409, condition: "The target HearingDocket.status is not OPEN when an appeal is scheduled onto it" }
  - { id: ERR_DOCKET_EMPTY, http: 409, condition: "hold-session on a docket with scheduled_appeal_count = 0" }
  - { id: ERR_INVOICE_WRITTEN_OFF, http: 409, condition: "The invoice collections_stage is WRITTEN_OFF, so it can no longer be adjusted, paid or referred" }

  # ----------------------------------------------------------- referential rules
  - { id: ERR_COMPANY_NOT_SYSTEM_MONITOR, http: 409, condition: "The reporting AlarmCompany is not AlarmSystem.monitoring_company_id of the referenced system, or the referenced system does not belong to the referenced site" }
  - { id: ERR_EXEMPT_CAUSE_NOT_RECOGNIZED, http: 422, condition: "exempt_cause_code is not a member of the governing FeeSchedule.exempt_cause_codes" }
  - { id: ERR_EXEMPT_CAUSE_MUST_BE_EXEMPT, http: 422, condition: "An EXEMPT determination omits exempt_cause_code, or a CHARGEABLE determination supplies one" }

  # ---------------------------------------------------------- safety / compliance
  - { id: ERR_COMPANY_DISPATCH_PRIVILEGE_SUSPENDED, http: 403, condition: "The reporting AlarmCompany.status is SUSPENDED or REVOKED" }
  - { id: ERR_POLICE_RESPONSE_SUSPENDED, http: 409, condition: "AlarmSite.response_status is RESPONSE_SUSPENDED, or a SuspensionOrder for the site is EFFECTIVE / REINSTATEMENT_PENDING" }
  - { id: ERR_INSUFFICIENT_ECV_CONTACTS, http: 409, condition: "The site's ACTIVE ECV-callable roster is below the distinct-contact minimum required for the system's posture" }
  - { id: ERR_ECV_REQUIREMENT_NOT_MET, http: 422, condition: "DispatchRequest.ecv_sufficient is false, so the request cannot be validated for dispatch" }
  - { id: ERR_VERIFIED_RESPONSE_NOT_CONFIRMED, http: 409, condition: "AlarmSystem.verified_response_mode demands audio/video or guard proof that the dispatch request does not carry" }

  # ------------------------------------------------------------- temporal windows
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "The appeal is filed later than determined_at + FeeSchedule.appeal_filing_days (20 days, inclusive)" }
  - { id: ERR_HEARING_SESSION_IN_PAST, http: 422, condition: "HearingDocket.session_start is not strictly after the logical clock, or session_end is not strictly after session_start" }
  - { id: ERR_HEARING_SESSION_NOT_STARTED, http: 409, condition: "hold-session before the logical clock reaches session_start" }
  - { id: ERR_INSPECTION_EVIDENCE_STALE, http: 409, condition: "technician_inspection_date is older than INSPECTION_VALID_DAYS (30 days, inclusive) at the reinstatement request" }
  - { id: ERR_SUSPENSION_EFFECTIVE_DATE_INVALID, http: 422, condition: "effective_from precedes the logical clock or the triggering incident's occurred_at, or effective_through is not strictly after effective_from" }
  - { id: ERR_PAYMENT_VOID_WINDOW_CLOSED, http: 409, condition: "The void arrives later than tendered_on + 2 whole days, or an allocated invoice has since become WRITTEN_OFF" }

  # -------------------------------------------------------- constraint / capacity
  - { id: ERR_APPEAL_ALREADY_PENDING, http: 409, condition: "The incident already has an Appeal in FILED, SCHEDULED or HEARD" }
  - { id: ERR_REHEARING_NOT_ELIGIBLE, http: 409, condition: "prior_appeal_id names an appeal that is not DENIED, or that already has a rehearing filed against it" }
  - { id: ERR_DOCKET_CAPACITY_EXCEEDED, http: 409, condition: "Scheduling the appeal would push scheduled_appeal_count above HearingDocket.capacity" }
  - { id: ERR_DOCKET_SESSION_OVERLAP, http: 409, condition: "The new docket overlaps a live docket of the same hearing officer under half-open plus 15-minute-buffer semantics" }
  - { id: ERR_SUSPENSION_PERIOD_OVERLAP, http: 409, condition: "The new order's closed [effective_from, effective_through] interval overlaps a PROPOSED / EFFECTIVE / REINSTATEMENT_PENDING order for the same site" }
  - { id: ERR_DUPLICATE_ADDRESS_KEY, http: 409, condition: "The normalized address_key already exists on a non-archived AlarmSite" }
  - { id: ERR_ACTIVE_PERMIT_EXISTS, http: 409, condition: "The alarm system already has an AlarmPermit in ACTIVE, RENEWAL_DUE or GRACE" }
  - { id: ERR_NO_ACTIVE_FEE_SCHEDULE, http: 409, condition: "No FeeSchedule is ACTIVE at the logical clock, so the fee about to be assessed has no governing schedule" }
  - { id: ERR_DUPLICATE_CONTACT_PRIORITY, http: 409, condition: "Another ACTIVE SiteContact of the same site already holds that contact_priority" }
  - { id: ERR_CONTACT_ROSTER_MINIMUM, http: 409, condition: "Removing the contact would drop the site's ECV-callable roster below MIN_DISTINCT_ECV_CONTACTS while it has live systems" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "The report period overlaps an existing report of the same monitoring company" }
  - { id: ERR_NO_REPORTABLE_VARIANCE, http: 409, condition: "A correction repeats every previously reported metric value" }
  - { id: ERR_CORRECTION_LIMIT_REACHED, http: 409, condition: "The report has already been corrected twice (correction_count = 2)" }
  - { id: ERR_SUSPENSION_BASIS_NO_LONGER_MET, http: 409, condition: "The site's chargeable count has fallen below suspension_threshold_count since the order was drafted" }
  - { id: ERR_ECV_ATTESTATION_REQUIRED, http: 422, condition: "A reinstatement request omits ecv_attestation = true or corrective_action_summary" }
  - { id: ERR_COMPANY_REINSTATEMENT_NOT_EARNED, http: 409, condition: "REINSTATE requested before two consecutive accepted report periods scored at or above the good-standing threshold" }
  - { id: ERR_INVOICE_UNDER_APPEAL, http: 409, condition: "The invoice's incident is APPEALED, so dunning and referral are frozen" }
  - { id: ERR_REFERRAL_CRITERIA_NOT_MET, http: 409, condition: "Referral attempted before collections_stage FINAL_NOTICE, before delinquency_days (90) or below collections_referral_threshold_cents (25000)" }

  # ----------------------------------------------------------------- fiscal rules
  - { id: ERR_SITE_BALANCE_DELINQUENT, http: 402, condition: "New permit issuance while the site's delinquent balance is at or above delinquent_balance_block_cents (50000)" }
  - { id: ERR_PERMIT_RENEWAL_BLOCKED, http: 409, condition: "Permit renewal while the site's delinquent balance is at or above delinquent_balance_block_cents (50000)" }
  - { id: ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT, http: 402, condition: "Lift requested while the site's net outstanding penalty balance is above zero" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "A WAIVE or REDUCE amount exceeds the invoice's current outstanding_cents" }
  - { id: ERR_ALLOCATION_MISMATCH, http: 422, condition: "Explicit allocations do not sum to amount_cents net of the credited residual, or target an ineligible invoice, breaking the money conservation invariant" }

# ============================================================================
# §1.7 RBAC MATRIX
# ----------------------------------------------------------------------------
# Role model: segregation_of_duties. Money assessment (adjust / waive / write off)
# is administrator-only and never available to the clerk who posts payments; the
# officer who determined an incident may not decide its appeal; the company that
# lodges a dispatch request never rules on the resulting incident.
# ============================================================================
roles:
  - name: ProgramAdministrator
    description: "Head of the false alarm reduction unit. Owns program configuration, suspensions, voids, adjustments and every administrative override, and is the only role permitted to drive the clock and the nightly batch."
    identity: "opaque"
    exclusive_operations:
      - "POST /false-alarm-program/fee-schedules and POST /false-alarm-program/fee-schedules/{scheduleId}/activate"
      - "POST /false-alarm-program/alarm-companies and POST /false-alarm-program/alarm-companies/{companyId}/status-actions"
      - "POST /false-alarm-program/alarm-permits/{permitId}/revoke"
      - "POST /false-alarm-program/false-alarm-incidents/{incidentId}/void"
      - "POST /false-alarm-program/suspension-orders, /serve co-shared, /lift and /vacate"
      - "POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments (waive / reduce / write off)"
      - "POST /false-alarm-program/payment-records/{paymentId}/void"
      - "POST /false-alarm-program/_clock/set_current_utc and POST /false-alarm-program/_program-runs/nightly"
    shared_operations:
      - "Premises, contact and system registration with PermitClerk"
      - "Permit renewal with PermitClerk and AlarmUser"
      - "Incident determination with FalseAlarmReviewOfficer"
      - "Appeal filing, scheduling and withdrawal with AlarmUser and HearingOfficer"
      - "Payment posting and collections referral with BillingClerk"
      - "Compliance report review with FalseAlarmReviewOfficer"
      - "All read endpoints"

  - name: PermitClerk
    description: "Counter clerk of the alarm permit desk. Registers premises, contacts and systems, issues and renews permits, and serves suspension orders, but never prices, waives or decides anything."
    identity: "opaque"
    exclusive_operations:
      - "POST /false-alarm-program/alarm-systems/{systemId}/approve-registration (shared only with ProgramAdministrator)"
      - "POST /false-alarm-program/alarm-systems/{systemId}/reject-registration (shared only with ProgramAdministrator)"
    shared_operations:
      - "POST /false-alarm-program/alarm-sites, /site-contacts, DELETE /site-contacts/{contactId}, POST /alarm-systems, PATCH /alarm-systems/{systemId}"
      - "POST /false-alarm-program/alarm-permits/{permitId}/renewals"
      - "POST /false-alarm-program/suspension-orders/{orderId}/serve"
      - "Read endpoints across sites, systems, permits, incidents, invoices and payments"

  - name: AlarmCompanyOperator
    description: "Central-station operator of a monitoring company. Lodges dispatch requests for the systems it monitors, opens incident reports, and files and corrects the company's periodic compliance reports."
    identity: "entity_backed:AlarmCompany"
    exclusive_operations:
      - "POST /false-alarm-program/dispatch-requests"
      - "POST /false-alarm-program/compliance-reports"
      - "POST /false-alarm-program/compliance-reports/{reportId}/correct"
    shared_operations:
      - "POST /false-alarm-program/false-alarm-incidents (with PoliceDispatchSupervisor and FalseAlarmReviewOfficer)"
      - "POST /false-alarm-program/dispatch-requests/{requestId}/cancel (with PoliceDispatchSupervisor)"
      - "Reads limited by the ownership check to its own company aggregate: its systems, dispatch requests, incidents and compliance reports"

  - name: AlarmUser
    description: "Owner or occupant of the alarmed premises. Registers systems and contacts, renews permits, contests determinations and requests reinstatement of police response."
    identity: "entity_backed:AlarmSite"
    exclusive_operations:
      - "POST /false-alarm-program/appeals (shared only with ProgramAdministrator)"
      - "POST /false-alarm-program/suspension-orders/{orderId}/reinstatement-requests (shared only with ProgramAdministrator)"
    shared_operations:
      - "POST /false-alarm-program/site-contacts, DELETE /site-contacts/{contactId}, POST /alarm-systems, PATCH /alarm-systems/{systemId}, POST /alarm-systems/{systemId}/decommission"
      - "POST /false-alarm-program/alarm-permits/{permitId}/renewals"
      - "POST /false-alarm-program/appeals/{appealId}/withdraw"
      - "Reads limited by the ownership check to its own premises aggregate: contacts, systems, permits, incidents, appeals, suspension orders, invoices, payments and allocations"

  - name: PoliceDispatchSupervisor
    description: "Communications-centre supervisor who decides whether a dispatch request earns a police response and records what happened."
    identity: "opaque"
    exclusive_operations:
      - "POST /false-alarm-program/dispatch-requests/{requestId}/validate"
      - "POST /false-alarm-program/dispatch-requests/{requestId}/refuse"
      - "POST /false-alarm-program/dispatch-requests/{requestId}/record-dispatch"
      - "POST /false-alarm-program/dispatch-requests/{requestId}/close-valid"
    shared_operations:
      - "POST /false-alarm-program/false-alarm-incidents"
      - "POST /false-alarm-program/dispatch-requests/{requestId}/cancel"
      - "Reads across sites, systems, contacts, dispatch requests, incidents and suspension orders"

  - name: FalseAlarmReviewOfficer
    description: "Reviewing officer of the reduction unit who rules each incident chargeable or exempt and reviews monitoring-company reports. Barred from deciding appeals against determinations they made and from determining incidents whose dispatch request they validated."
    identity: "opaque"
    exclusive_operations:
      - "POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination (shared only with ProgramAdministrator)"
    shared_operations:
      - "POST /false-alarm-program/false-alarm-incidents"
      - "POST /false-alarm-program/compliance-reports/{reportId}/review"
      - "Reads across sites, systems, permits, incidents, appeals, dockets, invoices and compliance reports"

  - name: HearingOfficer
    description: "Independent hearing officer who runs the appeal docket and rules on contested determinations. May only decide appeals on a docket they preside over."
    identity: "opaque"
    exclusive_operations:
      - "POST /false-alarm-program/appeals/{appealId}/decide"
      - "POST /false-alarm-program/hearing-dockets/{docketId}/hold-session"
    shared_operations:
      - "POST /false-alarm-program/hearing-dockets and POST /false-alarm-program/hearing-dockets/{docketId}/cancel"
      - "POST /false-alarm-program/appeals/{appealId}/schedule"
      - "Reads across dockets, appeals, incidents, sites, suspension orders and invoices"

  - name: BillingClerk
    description: "Revenue clerk who posts payments and refers unpaid penalties to collections. Never adjusts, waives or writes off an assessment, and an invoice they posted money against may not later be adjusted by them."
    identity: "opaque"
    exclusive_operations:
      - "POST /false-alarm-program/payment-records (shared only with ProgramAdministrator)"
      - "POST /false-alarm-program/penalty-invoices/{invoiceId}/collections-referral (shared only with ProgramAdministrator)"
    shared_operations:
      - "Reads across sites, invoices, payments, allocations, incidents, permits and companies"
