            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TX3" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/handlers/${h}/suspend", payload: { reason: "background check refresh" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/handlers/${h}/reinstate", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id, st: $.data.status } }
          assert:
            - "While handler SUSPENDED: err == ERR_HANDLER_NOT_ACTIVE"
            - "After reinstate: st == REQUESTED (same team, now succeeds)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: team_half_open_adjacency
        grounds:
          - errors[ERR_TEAM_SCHEDULING_CONFLICT]
          - validations[priority=10]
        distinguishing_aspect: |
          Resource = Team, semantics = half-open intervals [start,end):
          adjacency (prior end == new start) is ALLOWED, while a strict
          interior overlap is rejected. Distinct from the evaluator's buffered
          semantics (where adjacency conflicts) and the facility's aggregate
          capacity semantics.
        test_recipe:
          setup:
            - "Certified team + ACTIVE facility f (cap 2, weekly cap 5); clock 2026-08-02"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H O1", email: "ho1@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TO1" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev O1", email: "evo1@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-O1", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facilities", payload: { name: "School P", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/orientation-records", payload: { team_id: "${t}" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { o: $.data.id } }
            - { call: "POST /v1/orientation-records/${o}/complete", payload: { attended_on: "2026-08-02" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-08-02" }, as: Handler, as_user_id: "${h}" }
          trigger:
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { tv_a: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", expected_team_version: "${tv_a}" }, as: ProgramAdmin, captures: { v_a: $.data.id } }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { tv_b: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", expected_team_version: "${tv_b}" }, as: ProgramAdmin, captures: { v_b: $.data.id, v_b_st: $.data.lifecycle_status } }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { tv_d: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z", expected_team_version: "${tv_d}" }, as: ProgramAdmin, captures: { v_d: $.data.id } }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { tv_e: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-04T10:30:00Z", scheduled_end: "2026-08-04T11:30:00Z", expected_team_version: "${tv_e}" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "v_b_st == SCHEDULED (adjacency: prior end 11:00 == new start 11:00 allowed under half-open semantics)"
            - "err == ERR_TEAM_SCHEDULING_CONFLICT (10:30-11:30 strictly overlaps existing 10:00-11:00)"

      - name: evaluator_buffered_interval
        grounds:
          - errors[ERR_EVALUATOR_SCHEDULING_CONFLICT]
          - state_machines.Evaluation.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Resource = Evaluator, semantics = 30-minute buffered intervals (the
          new raw interval must not intersect [s-30min, e+30min) of any other
          SCHEDULED evaluation): a back-to-back evaluation with gap 0
          CONFLICTS (unlike the team's half-open rule where adjacency passes),
          while a gap of exactly 30 minutes passes.
        test_recipe:
          setup:
            - "Three handlers with FORMING teams (t1, t2, t3) each holding a REQUESTED evaluation; one shared evaluator ev specialized in DOG with default daily cap 4"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H E1", email: "he1@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h1: $.data.id } }
            - { call: "POST /v1/handlers/${h1}/approve", payload: {}, as: ProgramAdmin }
