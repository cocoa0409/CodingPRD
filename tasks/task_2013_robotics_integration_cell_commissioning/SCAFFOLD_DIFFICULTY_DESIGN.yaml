scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cycle_time_simulated_vs_measured_diverge
        grounds:
          - calculations.adjusted_cycle_time
          - calculations.adjusted_cycle_time.variants.simulated_estimate
          - calculations.adjusted_cycle_time.variants.measured_final
          - entities.ApplicationStudy.fields.adjusted_cycle_time_s
          - entities.AcceptanceTest.fields.measured_cycle_time_s
        distinguishing_aspect: |
          Same physical cell, two entity domains: ApplicationStudy stores a
          confidence-derated simulated estimate while AcceptanceTest stores a
          raw measured value; for a sim of 8.000s at 80% confidence and a
          measurement of 9.500s, the provisional (10.000s) and final (9.500s)
          cycle-time values diverge.
        test_recipe:
          setup:
            - "Org FANUC-specialized with retention 1000 bps; site; project P with contracted_cycle_time_s=10.0, contract_value_cents=1000000, guaranteed_oee_pct=80.0; project advanced to STUDY; study with sim 8.000s at 80% confidence submitted"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant A", plant_tz: "America/Chicago", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-100", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${proj_v0}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_v1: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/application-studies"
              payload: { expected_project_version: "${proj_v1}", sim_cycle_time_s: 8.0, sim_confidence_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { study_id: $.data.id }
            - call: "POST /robotics/application-studies/${study_id}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "GET /robotics/cell-projects/${proj_id}/application-studies"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          assert:
            - "ApplicationStudy.${study_id}.adjusted_cycle_time_s == 10.000"
            - "ApplicationStudy.${study_id}.feasibility == FEASIBLE"
            - "ApplicationStudy.${study_id}.sim_cycle_time_s == 8.0 (provisional derated to 10.000; a later FAT AcceptanceTest record with measured_cycle_time_s=9.5 would store 9.5 raw, never the derated 10.000)"

      - name: spare_parts_forecast_quoted_vs_delivered_diverge
        grounds:
          - calculations.spare_parts_consumption_forecast
          - calculations.spare_parts_consumption_forecast.variants.quoted_forecast
          - calculations.spare_parts_consumption_forecast.variants.delivered_forecast
          - entities.SparePartsPackage.fields.forecast_consumption_months
        distinguishing_aspect: |
          Spare-parts forecasting (different entity domain from cycle time): the
          quoted variant snapshots shift_windows_per_day=2 while the delivered
          variant re-derives after the site moves to 3 shifts, so the same
          package yields different forecast_consumption_months at the two
          lifecycle points (e.g. coverage 12mo, 2 shifts -> 12.0; re-derived at
          3 shifts -> 8.0).
        test_recipe:
          setup:
            - "Org, site with shift_windows_per_day=2, project P; SparePartsPackage with recommended_coverage_months=12 created (forecast 12.0); site then updated to 3 shifts; package delivered (forecast re-derived to 8.0)"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "ABB", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Svc Mgr", user_role: "SERVICE_MANAGER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { svc_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant B", plant_tz: "America/New_York", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-200", contracted_cycle_time_s: 12.0, contract_value_cents: 500000, guaranteed_oee_pct: 75.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /robotics/cell-projects/${proj_id}/spare-parts-packages"
              payload: { package_code: "SPP-ABB-STD", list_price_cents: 250000, recommended_coverage_months: 12 }
              as: ServiceManager
              as_user_id: "${svc_id}"
              captures: { pkg_id: $.data.id, quoted_forecast: $.data.forecast_consumption_months }
            - call: "PATCH /robotics/customer-sites/${site_id}"
              payload: { shift_windows_per_day: 3 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/spare-parts-packages/${pkg_id}/order"
              payload: {}
              as: ServiceManager
              as_user_id: "${svc_id}"
            - call: "POST /robotics/spare-parts-packages/${pkg_id}/deliver"
              payload: {}
              as: ServiceManager
              as_user_id: "${svc_id}"
              captures: { delivered_forecast: $.data.forecast_consumption_months }
          trigger:
            - call: "GET /robotics/cell-projects/${proj_id}/spare-parts-packages"
              payload: {}
              as: ServiceManager
              as_user_id: "${svc_id}"
          assert:
            - "quoted_forecast == 12.0 (2-shift snapshot at QUOTED)"
            - "delivered_forecast == 8.0 (re-derived at 3 shifts on DELIVERED: 12 * 2/3)"
            - "quoted_forecast != delivered_forecast"

  - rule_id: combinatorial_formula
    instances:
      - name: payload_margin_multi_input_threshold
        grounds:
          - calculations.payload_margin_check
          - entities.RobotSelection.fields.payload_margin_pct
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction:
          payload_margin_pct is a ratio of (rated - ee - part) over rated, then
          combined conjunctively with an independent wrist-inertia comparison —
          a passing margin with failing inertia still rejects.
        test_recipe:
          setup:
            - "Org DUAL, site, project P in DESIGN (study+safety approved); RobotSelection with rated=50.0, ee=6.0, part=4.0 (margin 80.00%) but wrist_inertia 12.5 > limit 12.0"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "DUAL", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Safety Lead", user_role: "SAFETY_LEAD" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { sl_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant C", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-300", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, v0: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v0}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v1: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/application-studies"
              payload: { expected_project_version: "${v1}", sim_cycle_time_s: 9.0, sim_confidence_pct: 100.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { study_id: $.data.id }
            - call: "POST /robotics/application-studies/${study_id}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/application-studies/${study_id}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "POST /robotics/cell-projects/${proj_id}/safety-risk-assessments"
              payload: { risk_score_pre_mitigation: 200, pl_target: "PLd", fencing_length_m: 40.0, light_curtain_zones: 4, muting_required: false }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { sra_id: $.data.id }
            - call: "POST /robotics/safety-risk-assessments/${sra_id}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/safety-risk-assessments/${sra_id}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v3: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v3}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/cell-projects/${proj_id}/robot-selections"
              payload: { robot_model: "FANUC M-710iC/50", brand: "FANUC", rated_payload_kg: 50.0, end_effector_weight_kg: 6.0, part_weight_kg: 4.0, wrist_inertia_kgm2: 12.5, wrist_inertia_limit_kgm2: 12.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /robotics/robot-selections/${rs_id}/validate"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          assert:
            - "response error_id == ERR_PAYLOAD_CHECK_FAILED (inertia 12.5 > limit 12.0 rejects even though margin 80.00% >= 20.0)"
            - "RobotSelection.${rs_id}.selection_status remains PROPOSED"

      - name: retention_waterfall_pinned_rounding_order
        grounds:
          - calculations.retention_release_schedule
          - entities.CellProject.fields.retention_balance_cents
          - entities.RetentionLedgerEntry
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: total rounds
          contract*rate to cents first, then FAT (30%) and SAT (40%) each round
          half-up, and the guarantee bucket is defined as the residual — pinned
          evaluation order total -> fat -> sat -> guarantee; a value like
          contract 999,999 cents at 333 bps exhibits different results under
          sum-then-round vs round-per-line.
        test_recipe:
          setup:
            - "Org with retention_rate_bps=333; site; project with contract_value_cents=999999 -> total retention round_half_up(999999*333/10000)=round_half_up(33299.9667)=33300; fat=round_half_up(33300*0.30)=9990; sat=round_half_up(33300*0.40)=13320; guarantee bucket residual=33300-9990-13320=9990"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "OddRates", brand_specialization: "FANUC", retention_rate_bps: 333, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant D", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-333", contracted_cycle_time_s: 10.0, contract_value_cents: 999999, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, bal0: $.data.retention_balance_cents }
          trigger:
            - call: "GET /robotics/cell-projects/${proj_id}/retention-ledger-entries"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
          assert:
            - "CellProject.${proj_id}.retention_balance_cents == 33300 (round_half_up of 33299.9667 to integer cents)"
            - "Exactly one WITHHOLD RetentionLedgerEntry exists with amount_cents == 33300"
            - "bal0 == 33300"

  - rule_id: non_linear_state_machine
    instances:
      - name: project_rework_cycle_design_fat_design
        grounds:
          - state_machines.CellProject.FAT_to_DESIGN
          - state_machines.CellProject.DESIGN_to_BUILD
          - entities.CellProject.fields.rework_count
        distinguishing_aspect: |
          CellProject exhibits a true cycle DESIGN -> BUILD -> FAT -> DESIGN
          (rework loop): a failed FAT returns the project to DESIGN and
          increments rework_count, and the project can traverse BUILD/FAT again.
        test_recipe:
          setup:
            - "Project driven DRAFT->STUDY->DESIGN->BUILD->FAT with approved study+assessment, locked selection, released program with SIM_PASSED; a FAT AcceptanceTest recorded then explicitly failed"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Safety Lead", user_role: "SAFETY_LEAD" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { sl_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Prog One", user_role: "CONTROLS_PROGRAMMER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { prog_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Prog Two", user_role: "CONTROLS_PROGRAMMER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { prog2_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Sup One", user_role: "SITE_SUPERVISOR" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { sup_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant E", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-CYC", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, v0: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v0}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v1: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/application-studies"
              payload: { expected_project_version: "${v1}", sim_cycle_time_s: 9.0, sim_confidence_pct: 100.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { study_id: $.data.id }
            - call: "POST /robotics/application-studies/${study_id}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/application-studies/${study_id}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "POST /robotics/cell-projects/${proj_id}/safety-risk-assessments"
              payload: { risk_score_pre_mitigation: 200, pl_target: "PLd", fencing_length_m: 40.0, light_curtain_zones: 4, muting_required: false }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { sra_id: $.data.id }
            - call: "POST /robotics/safety-risk-assessments/${sra_id}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/safety-risk-assessments/${sra_id}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v2: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v2}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v3: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/robot-selections"
              payload: { robot_model: "FANUC M-710iC/50", brand: "FANUC", rated_payload_kg: 50.0, end_effector_weight_kg: 6.0, part_weight_kg: 4.0, wrist_inertia_kgm2: 10.0, wrist_inertia_limit_kgm2: 12.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /robotics/robot-selections/${rs_id}/validate"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
