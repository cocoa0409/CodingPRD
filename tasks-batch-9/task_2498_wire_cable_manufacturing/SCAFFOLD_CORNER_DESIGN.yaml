              as: ProcessEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /customer-orders/${ord_id}/cancel"
              payload: {}
              as: BillingAnalyst
          trigger:
            - call: "POST /customer-orders/${ord_id}/cancel"
              payload: {}
              as: BillingAnalyst
              captures: { e_order: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
              captures: { e_step: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { disposition: "SCRAPPED", reason: "clear the floor" }
              as: QualityEngineer
              captures: { e_disp: $.data.error_id }
          assert:
            - "after the setup cancel: CustomerOrder.${ord_id}.fulfillment_status == \"CANCELLED\" and ProductionLot.${lot_id}.process_state == \"SCRAP_CLOSED\" with quality_state still \"PENDING\""
            - "${e_order} == \"ERR_INVALID_ORDER_STATE\" with HTTP 409 - CANCELLED is terminal"
            - "${e_step} == \"ERR_INVALID_LOT_STATE\" with HTTP 409 - SCRAP_CLOSED is terminal on the process dimension"
            - "${e_disp} == \"ERR_INVALID_LOT_STATE\" with HTTP 409 - a closed lot cannot be scrapped again, so scrapped_lbs cannot be double-counted"
            - "the ledger is unchanged by the three refusals: RodPurchaseLot.${rod_id}.remaining_lbs == 20000.00, committed_lbs == 0.00, scrapped_lbs == 0.00"
            - "ProductionLot.${lot_id}.rework_count is still 0 and quality_state is still \"PENDING\" (never SCRAPPED)"

      - name: certification_suspension_cascade_hops
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: inspection_suspend_cascades_four_hops_to_queued_lot
          rationale: "The deepest declared side-effect chain (failed follow-up inspection -> certification SUSPENDED -> SKU WITHDRAWN -> order pricing HELD -> queued lot QUARANTINED) is asserted hop by hop, with per-hop ordering, by that §1.8 instance; repeating it here would duplicate the same call sequence."

      - name: order_cancellation_compensating_reversal
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: rod_metal_mass_conserved_across_allocation_and_cancellation
          rationale: "The QUEUED-lot cancel path's compensating reversal (committed_lbs returns to remaining_lbs and never to scrapped_lbs, with purchase_weight_lbs == remaining + committed + scrapped holding throughout) is asserted arithmetically by that §1.8 instance; this section only checks that the resulting terminal states lock down."

      - name: order_and_lot_dimensions_advance_independently
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: customer_order_pricing_and_fulfillment_dimensions_move_independently
          rationale: "The two-dimensional CustomerOrder machine (pricing_status QUOTED/LOCKED/HELD/INVOICED versus fulfillment_status OPEN/PARTIALLY_SHIPPED/FULFILLED/CANCELLED) is driven through the cross-product by that §1.8 instance."

      - name: production_lot_rework_rewind_cycle
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: production_lot_rework_rewind_across_parallel_dimensions
          rationale: "The cyclic REWORK rewind (EXTRUDED -> DRAWN or STRANDED, extrusion measurements cleared, quality_state back to PENDING, rework_count incremented up to the limit of 2) is walked in full by that §1.8 instance."

