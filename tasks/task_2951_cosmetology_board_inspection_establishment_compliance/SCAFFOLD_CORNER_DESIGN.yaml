              as_user_id: "admin-001"
            - call: "GET /cosmetology/inspections/00000000-0000-4000-8000-0000000000a4"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "GET /cosmetology/violation-codes/00000000-0000-4000-8000-0000000000a5"
              payload: {}
              as: BoardAdmin
