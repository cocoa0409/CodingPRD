      - name: staff_allocation_curriculum_must_match_both_the_org_and_the_member
        claim_type: conditional_validation
        grounds:
          - "validations[priority=64]"
          - errors[ERR_CURRICULUM_VERSION_MISMATCH]
          - entities.StaffMember.fields.curriculum_version_certified
        distinguishing_aspect: "The rule is conjunctive and member-dependent: the same allocation body is refused when curriculum_version is 2025.2 (not ORG_CURRICULUM_VERSION) and again when it is 2026.1 against a member certified on 2025.2, and accepted only when org and member agree."
        test_recipe:
          setup:
            - "The logical clock is at 2026-04-01T00:00:00Z."
            - "An affiliate with an ACTIVE agreement (minimum_active_players 0, no required_staff_roles) so posture is OPEN and priority 52 cannot interfere."
            - "Staff member M_ok certified on 2026.1 and staff member M_old certified on 2025.2, both with certification_expires_on 2027-01-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Curriculum Club", level: "HIGH_A", market_city: "Peoria", meal_stipend_cents_per_day: 2800 }
