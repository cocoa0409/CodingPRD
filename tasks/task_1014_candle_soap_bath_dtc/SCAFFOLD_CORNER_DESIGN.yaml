            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 50, line_code: "OCL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "oc@x.com", full_name: "Oc" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "Order.${o1}.payment_status == UNPAID"

      - name: checkout_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-checkout-stale-version]", entities.Order.fields.version]
        distinguishing_aspect: "A checkout carrying the current expected_order_version succeeds (payment PAID) and increments Order.version by 1."
        test_recipe:
          setup: ["Customer order with one line; version captured immediately before checkout."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Cv", scent_family: "CITRUS", title: "Cv" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Cv", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 50, line_code: "CVL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "cv@x.com", full_name: "Cv" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          assert:
            - "response HTTP status == 200"
            - "Order.${o1}.payment_status == PAID"
            - "Order.${o1}.fulfillment_status == ALLOCATED"

