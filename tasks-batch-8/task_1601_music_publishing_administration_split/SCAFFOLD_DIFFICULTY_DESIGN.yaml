            - { call: "POST /works", payload: { title: "Zero Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
          trigger:
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: WRITER, writer_id: "${w2}", share_bp: 0 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 9999 }, { participant_type: WRITER, writer_id: "${w2}", share_bp: 1 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
          assert:
            - "${err} == ERR_ZERO_SHARE_LINE (0 rejected although writer pool still sums to 10000)"
            - "Second create with share_bp == 1 succeeds (201): ${ss} is a SplitSet id (boundary: 1 valid, 0 invalid)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: society_registration_submit_gated_on_confirmed_split_set
        grounds:
          - state_machines.SocietyRegistration.DRAFT_to_SUBMITTED
          - validations[priority=5]
          - errors[ERR_NO_CONFIRMED_SPLIT_SET]
        distinguishing_aspect: |
          Entity pair SocietyRegistration -> SplitSet: the registration cannot
          leave DRAFT until a DIFFERENT entity (the work's SplitSet) reaches
          CONFIRMED; the same call succeeds after the split set confirms.
        test_recipe:
          setup:
            - "Writer W1; Work K; Society S; SplitSet exists but only in DRAFT; SocietyRegistration R in DRAFT"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000001001", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Gated Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist, captures: { st2: $.data.status } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_reg: $.data.registration_status } }
          assert:
            - "${err} == ERR_NO_CONFIRMED_SPLIT_SET (split set only DRAFT)"
            - "${st2} == SUBMITTED (same call succeeds once the SplitSet is CONFIRMED)"
            - "${k_reg} == PENDING_SOCIETY (bubble-up side effect)"

      - name: advance_approve_gated_on_writer_active
        grounds:
          - state_machines.Advance.DRAFT_to_APPROVED
          - validations[priority=7]
          - errors[ERR_WRITER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Advance -> Writer (different pair from the other
          instance): approve is rejected while the writer is SUSPENDED and
          succeeds after reactivation.
        test_recipe:
          setup:
            - "Writer W (ACTIVE) with two DRAFT advances A1, A2; W then SUSPENDED"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W", ipi_number: "00000001101", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w: $.data.id, w_v1: $.data.version } }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v1}", agreement_ref: "A1", amount_cents: 1000 }, as: PublisherAdmin, captures: { a1: $.data.id } }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v2}", agreement_ref: "A2", amount_cents: 2000 }, as: PublisherAdmin, captures: { a2: $.data.id } }
            - { call: "POST /writers/${w}/suspend", payload: {}, as: PublisherAdmin }
          trigger:
            - { call: "POST /advances/${a2}/approve", payload: {}, as: FinanceManager, captures: { err: $.data.error_id } }
            - { call: "POST /writers/${w}/reactivate", payload: {}, as: PublisherAdmin }
            - { call: "POST /advances/${a2}/approve", payload: {}, as: FinanceManager, captures: { a2_st: $.data.status } }
            - { call: "POST /advances/${a1}/approve", payload: {}, as: FinanceManager, captures: { a1_st: $.data.status } }
          assert:
            - "${err} == ERR_WRITER_NOT_ACTIVE (writer SUSPENDED blocks approval)"
            - "${a2_st} == APPROVED after reactivation"
            - "${a1_st} == APPROVED (A1 created before suspension still approves once writer is ACTIVE)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: sub_publishing_coverage_half_open_overlap_vs_adjacency
        grounds:
          - state_machines.SubPublishingAgreement.DRAFT_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on the
          SubPublishingAgreement resource — an interior overlap is rejected
          while an exactly-touching interval (from == prior to) activates.
        test_recipe:
          setup:
            - "SubPublisher SP (ACTIVE); agreement A (DE/PERFORMANCE, [2026-01-01, 2027-01-01)) ACTIVE; agreements B (overlap), C (adjacent), D (different income type) in DRAFT"
          setup_api_calls:
            - { call: "POST /sub-publishers", payload: { name: "DE Sub", home_territory_code: "DE" }, as: PublisherAdmin, captures: { sp: $.data.id } }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["PERFORMANCE"], retention_bp: 2000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PublisherAdmin, captures: { aga: $.data.id } }
            - { call: "POST /sub-publishing-agreements/${aga}/activate", payload: {}, as: PublisherAdmin }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["PERFORMANCE"], retention_bp: 1500, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: PublisherAdmin, captures: { agb: $.data.id } }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["PERFORMANCE"], retention_bp: 1500, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }, as: PublisherAdmin, captures: { agc: $.data.id } }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["SYNC"], retention_bp: 1500, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: PublisherAdmin, captures: { agd: $.data.id } }
          trigger:
            - { call: "POST /sub-publishing-agreements/${agb}/activate", payload: {}, as: PublisherAdmin, captures: { err_b: $.data.error_id } }
            - { call: "POST /sub-publishing-agreements/${agc}/activate", payload: {}, as: PublisherAdmin, captures: { st_c: $.data.status } }
            - { call: "POST /sub-publishing-agreements/${agd}/activate", payload: {}, as: PublisherAdmin, captures: { st_d: $.data.status } }
          assert:
            - "${err_b} == ERR_COVERAGE_OVERLAP ([2026-06-01, 2027-06-01) intersects A's [2026-01-01, 2027-01-01))"
            - "${st_c} == ACTIVE (adjacent touch at 2027-01-01 is NOT an overlap under half-open semantics)"
            - "${st_d} == ACTIVE (income_types do not intersect, so no coverage conflict)"

      - name: licensee_audit_period_inclusive_overlap
        grounds:
          - endpoints: "POST /licensee-audits"
          - validations[priority=8]
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Different resource (LicenseeAudit) with DIFFERENT interval
          semantics: CLOSED INCLUSIVE [period_start, period_end] — a shared
          boundary date (2025-12-31) already conflicts, unlike the half-open
          agreement case where touching is allowed.
        test_recipe:
          setup:
            - "Licensee L; audit 1 over [2025-01-01, 2025-12-31] exists (any status)"
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T23:59:59Z", valuation_method: "ACTUAL_SHORTFALL" }, as: Auditor, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2025-12-31T23:59:59Z", period_end: "2026-06-30T23:59:59Z", valuation_method: "ACTUAL_SHORTFALL" }, as: Auditor, captures: { err: $.data.error_id } }
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", valuation_method: "EXTRAPOLATED" }, as: Auditor, captures: { a3: $.data.id } }
          assert:
            - "${err} == ERR_AUDIT_PERIOD_OVERLAP (shared boundary date 2025-12-31 conflicts under inclusive semantics)"
            - "${a3} created with status OPEN ([2026-01-01, ...] shares no date with [..., 2025-12-31])"

  - rule_id: compensating_invariant
    instances:
      - name: advance_principal_conserved_across_recoup_and_reversal
        grounds:
          - calculations.writer_recoupment_waterfall
          - state_machines.RoyaltyStatement.FINALIZED_to_SUPERSEDED
          - state_machines.Advance.RECOUPING_to_PAID
          - entities.RoyaltyStatement.fields.amends_statement_id
        distinguishing_aspect: |
          Conserved quantity: advance principal cents. Forward recoupment
          (finalize) paired with its compensating reversal (amendment
          supersedes the statement) leaves amount_cents ==
          recouped_cents + outstanding_cents at every step and returns the
          advance to PAID with zero drift.
        test_recipe:
          setup:
            - "Writer W with PAID advance A (3000 @ 10000bp); Work K CONFIRMED+REGISTERED with W 10000bp; statement S1 FINALIZED with one matched line gross 2000 (writer final 1000, recoup 1000)"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W", ipi_number: "00000001201", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w: $.data.id, w_v: $.data.version } }
            - { call: "POST /works", payload: { title: "Invariant Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000050" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000050-1" }, as: CopyrightSpecialist }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v}", agreement_ref: "A", amount_cents: 3000 }, as: PublisherAdmin, captures: { adv: $.data.id } }
            - { call: "POST /advances/${adv}/approve", payload: {}, as: FinanceManager }
            - { call: "POST /advances/${adv}/pay", payload: {}, as: FinanceManager }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 2000, lines: [ { line_number: 1, reported_title: "Invariant Song", reported_work_code: "${k_code}", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st}/finalize", payload: {}, as: RoyaltyAnalyst }
            - { call: "GET /advances/${adv}", as: PublisherAdmin, captures: { rec_after: $.data.recouped_cents, out_after: $.data.outstanding_cents } }
          trigger:
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 2000, amends_statement_id: "${st}", lines: [ { line_number: 1, reported_title: "Invariant Song", reported_work_code: "${k_code}", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { st2: $.data.id } }
            - { call: "GET /royalty-statements/${st}", as: RoyaltyAnalyst, captures: { st1_status: $.data.status } }
            - { call: "GET /advances/${adv}", as: PublisherAdmin, captures: { rec_rev: $.data.recouped_cents, out_rev: $.data.outstanding_cents, st_rev: $.data.status } }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { pay_rev: $.data.payable_balance_cents, life_rev: $.data.lifetime_earned_cents } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { coll_rev: $.data.total_collected_cents } }
          assert:
            - "After finalize: ${rec_after} == 1000 and ${out_after} == 2000 (invariant: 3000 == 1000 + 2000)"
            - "${st1_status} == SUPERSEDED (compensating action applied)"
            - "After reversal: ${rec_rev} == 0 and ${out_rev} == 3000 and ${st_rev} == PAID (invariant restored: 3000 == 0 + 3000; RECOUPING->PAID on full reversal)"
            - "${pay_rev} == 0 and ${life_rev} == 0 and ${coll_rev} == 0 (no drift in writer or work ledgers)"

      - name: confirmed_split_set_cardinality_conserved_across_supersede
        grounds:
          - state_machines.SplitSet.PENDING_CONFIRMATIONS_to_CONFIRMED
          - state_machines.SplitSet.CONFIRMED_to_SUPERSEDED
          - concurrency_rules[split-set-create-stale-work]
        distinguishing_aspect: |
          Conserved quantity of a different type: the CARDINALITY of CONFIRMED
          split sets per work. Confirming set B (forward) paired with the
          compensating supersede of set A keeps count(CONFIRMED) == 1 at every
          observable point.
        test_recipe:
          setup:
            - "Writers W1, W2; Work K; split set A (W1 10000 + pub) CONFIRMED; split set B (W1 5000 + W2 5000 + pub) created against the post-confirmation work version and submitted"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000001301", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /writers", payload: { legal_name: "W2", ipi_number: "00000001302", pro_affiliation: "BMI" }, as: PublisherAdmin, captures: { w2: $.data.id } }
            - { call: "POST /works", payload: { title: "Split Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v1: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v1}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ssa: $.data.id } }
            - { call: "POST /split-sets/${ssa}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ssa}", as: PublisherAdmin, captures: { a_l1: "$.data[0].id", a_l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${a_l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${a_l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-sets?work_id=${k}&status=CONFIRMED", as: PublisherAdmin, captures: { cnt_before: "$.data[0].id" } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_v2: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v2}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 5000 }, { participant_type: WRITER, writer_id: "${w2}", share_bp: 5000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ssb: $.data.id } }
            - { call: "POST /split-sets/${ssb}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ssb}", as: PublisherAdmin, captures: { b_l1: "$.data[0].id", b_l2: "$.data[1].id", b_l3: "$.data[2].id" } }
          trigger:
            - { call: "POST /split-lines/${b_l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${b_l2}/confirm", payload: {}, as: Writer, as_user_id: "${w2}" }
            - { call: "POST /split-lines/${b_l3}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-sets?work_id=${k}&status=CONFIRMED", as: PublisherAdmin, captures: { sole_confirmed: "$.data[0].id" } }
            - { call: "GET /split-sets/${ssa}", as: PublisherAdmin, captures: { ssa_st: $.data.status } }
            - { call: "GET /split-sets/${ssb}", as: PublisherAdmin, captures: { ssb_st: $.data.status } }
          assert:
            - "Before B's confirmation, exactly one CONFIRMED set exists for K and it is ${cnt_before} == ${ssa}"
            - "${ssb_st} == CONFIRMED (B's last confirmation bubbles up)"
            - "${ssa_st} == SUPERSEDED (compensating transition fired on A)"
            - "After: GET /split-sets?work_id&status=CONFIRMED returns exactly one row and ${sole_confirmed} == ${ssb} (cardinality conserved at 1)"
