            - call: "POST /signature-batches/${b1_id}/signatures"
              payload: { line_number: 2, signer_name: "Bob Brown", claimed_voter_id_number: "VB2", signed_on: "2026-08-06T00:00:00Z", signature_hash: "H-VB2" }
