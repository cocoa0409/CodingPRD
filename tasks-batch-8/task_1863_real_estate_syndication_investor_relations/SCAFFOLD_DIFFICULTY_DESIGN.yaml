          Trigger: POST /contributions/{id}/release-escrow on a
          CapitalCallContribution. Chain (depth 3): (1) CapitalCallContribution
          transitions ESCROW_RECEIVED -> RELEASED; (2) the linked Subscription
          mutates funded_cents and transitions AWAITING_FUNDING -> FUNDED;
          (3) the parent Offering recomputes total_funded_cents from its
          FUNDED subscriptions. Each link is caused by the previous link,
          not by the original release-escrow call directly.
