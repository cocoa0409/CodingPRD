# =============================================================================
# Scaffold: Circulating & Numismatic Coin Production + Subscription Sales (US Mint)
# =============================================================================

scenario: |
  Circulating and Numismatic Coin Production & Subscription Sales (United States Mint): circulating coin production planning against Federal Reserve orders with denomination mix and blank supply, metal procurement with commodity cost exposure and seigniorage computation per denomination, numismatic product development including commemorative programs authorized by legislation with surcharge beneficiaries, mintage limits and household order limits on high-demand releases with allocation and queue management, subscription programs enrolling collectors for recurring product delivery with billing and cancellation, bullion program operations with authorized purchaser arrangements and premium structures, quality control, error coin handling and destruction procedures, product release calendar with sell-out management and secondary market effects

domain_name: us-mint-coinage
api_prefix: /mint

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: ledger reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Denomination
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Denomination code, unique (e.g. PENNY, NICKEL, DIME, QUARTER)" }
      - { name: face_value_cents, type: integer, source: input, description: "Face value of one coin in cents (>= 1)" }
      - { name: blank_budget_cost_cents, type: number, source: input, description: "Budgeted blank (planchet) cost per piece in cents" }
      - { name: striking_cost_cents, type: number, source: input, description: "Striking (labor/overhead) cost per piece in cents" }
      - { name: blanks_per_tonne, type: integer, source: input, description: "Blank pieces yielded per metric tonne of delivered metal for this denomination" }
      - { name: blank_stock_pieces, type: integer, source: computed, description: "Unreserved blank pieces on hand; credited on lot delivery, debited on run start, credited back on run cancel from PLANNED/REWORK" }
      - { name: budgeted_unit_seigniorage_cents, type: number, source: computed, description: "face_value_cents - blank_budget_cost_cents - striking_cost_cents" }

  - name: FederalReserveOrder
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Federal fiscal year of the order (e.g. 2026)" }
      - { name: denomination_code, type: string, source: input, description: "Denomination code ordered; must match a Denomination.code" }
      - { name: quantity_ordered_pieces, type: integer, source: input, description: "Pieces ordered by the Federal Reserve (> 0)" }
      - { name: due_date, type: string, source: input, description: "Required delivery date, ISO8601 date" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCHEDULED | FULFILLING | FULFILLED | SHORTFALL_RECORDED | CANCELLED" }
      - { name: quantity_fulfilled_pieces, type: integer, source: computed, description: "Sum of produced_pieces over COMPLETED linked production runs" }
      - { name: budgeted_seigniorage_cents, type: number, source: computed, description: "Snapshot at creation: quantity_ordered_pieces x denomination.budgeted_unit_seigniorage_cents" }
      - { name: realized_seigniorage_cents, type: number, source: computed, description: "Finalized when status becomes FULFILLED: quantity_ordered_pieces x (face_value_cents - realized_unit_blank_cost_cents - striking_cost_cents); null before fulfillment", constraints: "nullable" }

  - name: MetalProcurementLot
    parent: null
    common_fields: true
    fields:
      - { name: commodity, type: enum, source: input, description: "COPPER | NICKEL | ZINC | GOLD | SILVER | PLATINUM" }
      - { name: denomination_code, type: string, source: input, description: "Denomination code these blanks are produced for; must match a Denomination.code" }
      - { name: quantity_tonnes, type: integer, source: input, description: "Metal tonnage procured (> 0)" }
      - { name: budget_price_cents_per_tonne, type: integer, source: input, description: "Budget reference price per tonne in cents" }
      - { name: locked_unit_price_cents_per_tonne, type: integer, source: input, description: "Hedged (locked) price per tonne in cents; absent means unhedged (exposed to spot)", constraints: "optional" }
      - { name: order_spot_cents_per_tonne, type: integer, source: system, description: "Current spot price per tonne recorded at lot creation" }
      - { name: vault, type: enum, source: input, description: "WEST_POINT | FORT_KNOX | DENVER_VAULT" }
      - { name: planned_delivery_date, type: string, source: input, description: "Planned delivery date, ISO8601 date (metadata only)" }
      - { name: status, type: enum, source: system, description: "ORDERED -> DELIVERED (terminal)" }
      - { name: blanks_produced, type: integer, source: computed, description: "quantity_tonnes x denomination.blanks_per_tonne; computed at creation" }
      - { name: realized_cost_cents, type: integer, source: computed, description: "Set on delivery: quantity_tonnes x (locked_unit_price_cents_per_tonne if present else spot price per tonne at delivery time); null until DELIVERED", constraints: "nullable" }

  - name: ProductionRun
    parent: FederalReserveOrder
    common_fields: true
    fields:
      - { name: fed_order_id, type: string, source: input, description: "FK -> FederalReserveOrder.id; the order this run strikes coins for" }
      - { name: facility, type: enum, source: input, description: "PHILADELPHIA | DENVER" }
      - { name: press_line, type: string, source: input, description: "Press line identifier within the facility (e.g. P1)" }
      - { name: planned_start, type: datetime, source: input, description: "Planned window start, ISO8601" }
      - { name: planned_end, type: datetime, source: input, description: "Planned window end, ISO8601; must be after planned_start" }
      - { name: planned_quantity, type: integer, source: input, description: "Pieces to strike (> 0)" }
      - { name: status, type: enum, source: system, description: "PLANNED | STRIKING | INSPECTION | REWORK | COMPLETED | CANCELLED" }
      - { name: reserved_blanks, type: integer, source: computed, description: "Blanks currently reserved by this run (set at start, zeroed at inspect/cancel)" }
      - { name: produced_pieces, type: integer, source: computed, description: "Good pieces produced (set at inspection PASS)" }
      - { name: scrapped_pieces, type: integer, source: computed, description: "Pieces scrapped (reserved - produced on PASS; all reserved on FAIL)" }
      - { name: rework_count, type: integer, source: system, description: "Number of INSPECTION->REWORK cycles" }

  - name: CommemorativeProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: statute_reference, type: string, source: input, description: "Authorizing public law citation" }
      - { name: max_mintage_legal, type: integer, source: input, description: "Statutory maximum mintage across all products of the program (> 0)" }
      - { name: surcharge_cents_per_unit, type: integer, source: input, description: "Statutory surcharge per unit sold (>= 0)" }
      - { name: beneficiary_name, type: string, source: input, description: "Statutory surcharge beneficiary organization" }
      - { name: beneficiary_cap_cents, type: integer, source: input, description: "Statutory cap on total surcharge disbursement (>= 0)" }
      - { name: direct_costs_cents, type: integer, source: input, description: "Direct program costs in cents (>= 0)" }
      - { name: sales_window_start, type: datetime, source: input, description: "Statutory sales window open, ISO8601" }
      - { name: sales_window_end, type: datetime, source: input, description: "Statutory sales window close, ISO8601; must be after start" }
      - { name: status, type: enum, source: system, description: "DESIGN_REVIEW | APPROVED_FOR_SALE | ON_SALE | SALES_CLOSED | SURCHARGE_DISBURSED" }
      - { name: design_revision_count, type: integer, source: system, description: "Number of REVISION_REQUESTED decisions" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramManager who created the program" }
      - { name: gross_receipts_cents, type: integer, source: computed, description: "Sum of quantity x price_cents over PAID orders of products belonging to this program" }
      - { name: surcharge_accrued_cents, type: integer, source: computed, description: "Sum of paid units across program products x surcharge_cents_per_unit" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "base = gross_receipts_cents - direct_costs_cents; admin_fee = round_half_up(base x 0.05); net = base - admin_fee" }
      - { name: disbursed_cents, type: integer, source: system, description: "Total surcharges disbursed to beneficiary; set by disburse-surcharges" }

  - name: NumismaticProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Catalog code, unique" }
      - { name: program_id, type: string, source: input, description: "FK -> CommemorativeProgram.id; null for non-commemorative products", constraints: "optional, nullable" }
      - { name: product_family, type: string, source: input, description: "Release-calendar family; releases within a family must be >= 24h apart" }
      - { name: product_type, type: enum, source: input, description: "PROOF_SET | COMMEMORATIVE | UNCIRCULATED | SUBSCRIPTION_SERIES" }
      - { name: price_cents, type: integer, source: input, description: "Unit retail price in cents (> 0)" }
      - { name: mintage_limit, type: integer, source: input, description: "Maximum sellable units (> 0)" }
      - { name: household_order_limit, type: integer, source: input, description: "Maximum units per household for this product (> 0)" }
      - { name: release_datetime, type: datetime, source: input, description: "Scheduled release instant, ISO8601" }
      - { name: subscription_eligible, type: boolean, source: input, description: "Whether subscriptions may enroll for this product", default: false }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_SALE | SOLD_OUT | WITHDRAWN" }
      - { name: allocated_units, type: integer, source: computed, description: "Sum of quantity over orders with allocation_status == ALLOCATED" }
      - { name: remaining_units, type: integer, source: computed, description: "mintage_limit - allocated_units" }

  - name: Collector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Collector full name" }
      - { name: email, type: string, source: input, description: "Email, unique across collectors" }
      - { name: household_id, type: string, source: input, description: "Household identifier shared by collectors of the same household; household order limits aggregate over it" }

  - name: NumismaticOrder
    parent: null
    common_fields: true
    fields:
      - { name: collector_id, type: string, source: system, description: "FK -> Collector.id; set from X-User-ID of the placing Collector" }
      - { name: product_id, type: string, source: input, description: "FK -> NumismaticProduct.id" }
      - { name: quantity, type: integer, source: input, description: "Units ordered (>= 1)" }
      - { name: total_cents, type: integer, source: computed, description: "quantity x product.price_cents" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED" }
      - { name: allocation_status, type: enum, source: system, description: "ALLOCATED | WAITLISTED | RELEASED" }
      - { name: status, type: enum, source: computed, description: "Derived: CANCELLED if allocation_status == RELEASED; COMPLETED if payment_status == PAID and allocation_status == ALLOCATED; else ACTIVE" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: collector_id, type: string, source: system, description: "FK -> Collector.id; set from X-User-ID" }
      - { name: product_id, type: string, source: input, description: "FK -> NumismaticProduct.id; product must be subscription_eligible" }
      - { name: units_per_cycle, type: integer, source: input, description: "Units delivered per billing cycle (>= 1)" }
      - { name: frequency, type: enum, source: input, description: "MONTHLY | QUARTERLY" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DUNNING | CANCELLED | CANCELLED_NONPAYMENT" }
      - { name: next_billing_date, type: string, source: system, description: "ISO8601 date of next billing; initialized to the current logical-clock date at enrollment, advanced by frequency after each successful billing cycle" }
      - { name: cycles_billed, type: integer, source: system, description: "Number of invoices generated" }

  - name: SubscriptionInvoice
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: period_index, type: integer, source: system, description: "1-based billing period counter" }
      - { name: amount_cents, type: integer, source: computed, description: "subscription_invoice_amount: round_half_up(price_cents x 0.90) per unit, x units_per_cycle, + shipping tier" }
      - { name: attempts, type: integer, source: system, description: "Number of payment attempts" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | FAILED | WRITTEN_OFF" }

  - name: BullionIssue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Issue name (e.g. American Gold Eagle 2026)" }
      - { name: metal, type: enum, source: input, description: "GOLD | SILVER | PLATINUM" }
      - { name: unit_weight_oz, type: number, source: input, description: "Troy ounces per unit (> 0)" }
      - { name: total_pool_units, type: integer, source: input, description: "Total units available to authorized purchasers (> 0)" }
      - { name: remaining_pool_units, type: integer, source: computed, description: "total_pool_units minus units in OFFERED, CONFIRMED, or SETTLED allocations" }
      - { name: offer_window_hours, type: integer, source: input, description: "Hours an allocation offer remains open before expiry (> 0)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SOLD_OUT (auto when remaining_pool_units == 0 and no OFFERED allocations remain)" }

  - name: AuthorizedPurchaser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Firm name" }
      - { name: tier, type: enum, source: input, description: "T1 | T2 | T3; drives bullion premium schedule" }
      - { name: status, type: enum, source: system, description: "APPROVED | SUSPENDED | TERMINATED" }

  - name: BullionAllocation
    parent: BullionIssue
    common_fields: true
    fields:
      - { name: bullion_issue_id, type: string, source: system, description: "FK -> BullionIssue.id; from path" }
      - { name: authorized_purchaser_id, type: string, source: input, description: "FK -> AuthorizedPurchaser.id" }
      - { name: quantity_units, type: integer, source: input, description: "Units offered (>= 1)" }
      - { name: offered_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramManager who created the offer" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Logical clock at creation + issue.offer_window_hours" }
      - { name: total_price_cents, type: integer, source: computed, description: "Set at confirm: round_half_up(quantity_units x unit_weight_oz x spot_cents x (1 + premium_bps/10000)); null until CONFIRMED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OFFERED | CONFIRMED | SETTLED | EXPIRED" }

  - name: ErrorCoinCase
    parent: ProductionRun
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id" }
      - { name: error_pieces, type: integer, source: input, description: "Error coins identified (> 0, <= run scrapped_pieces at creation)" }
      - { name: description, type: string, source: input, description: "Error description (e.g. off-center strike, doubled die)", constraints: "optional" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the QualityInspector who reported the case" }
      - { name: status, type: enum, source: system, description: "QUARANTINED | DESTROYED" }
      - { name: destroyed_by_user_ids, type: array, source: system, description: "The two distinct certifier user ids recorded at destruction", constraints: "null until DESTROYED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FederalReserveOrder
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, SHORTFALL_RECORDED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "system auto-transition when the first ProductionRun is created with fed_order_id == this order"
        actor: system
        preconditions: ["ProductionRun creation succeeded"]
        side_effects: ["order.version increments"]
      - from: SCHEDULED
        to: FULFILLING
        trigger: "system auto-transition when the first linked ProductionRun enters STRIKING"
        actor: system
        preconditions: []
        side_effects: ["order.version increments"]
      - from: FULFILLING
        to: FULFILLED
        trigger: "system auto-transition when a linked run completes and quantity_fulfilled_pieces >= quantity_ordered_pieces"
        actor: system
        preconditions: ["quantity_fulfilled_pieces >= quantity_ordered_pieces"]
        side_effects:
          - "realized_seigniorage_cents finalized: quantity_ordered_pieces x (face_value_cents - realized_unit_blank_cost_cents(denomination) - striking_cost_cents), unit margin rounded half-up to 2 decimals before multiplying"
          - "order.version increments"
      - from: FULFILLING
        to: SHORTFALL_RECORDED
        trigger: "system auto-transition when all linked runs are in {COMPLETED, CANCELLED} and quantity_fulfilled_pieces < quantity_ordered_pieces"
        actor: system
        preconditions: ["at least one linked run exists", "every linked run terminal", "quantity_fulfilled_pieces < quantity_ordered_pieces"]
        side_effects: ["order.version increments"]
      - from: SCHEDULED
        to: SHORTFALL_RECORDED
        trigger: "system auto-transition when all linked runs are in {COMPLETED, CANCELLED} and quantity_fulfilled_pieces < quantity_ordered_pieces"
        actor: system
        preconditions: ["at least one linked run exists", "every linked run terminal", "quantity_fulfilled_pieces < quantity_ordered_pieces"]
        side_effects: ["order.version increments"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /mint/federal-reserve-orders/{id}/cancel"
        actor: FedLiaison
        preconditions: []
        side_effects: ["order.version increments"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mint/federal-reserve-orders/{id}/cancel"
        actor: FedLiaison
        preconditions: []
        side_effects:
          - "cascade: every linked ProductionRun in {PLANNED, REWORK} becomes CANCELLED (each such run's own version increments)"
        note: "FULFILLING orders cannot be cancelled (ERR_FEDORDER_NOT_CANCELLABLE) because striking is underway; runs in PLANNED/REWORK hold no reserved blanks (reservation happens only at start), so no blank release occurs on cascade cancel"

  - entity: MetalProcurementLot
    initial_state: ORDERED
    terminal_states: [DELIVERED]
    transitions:
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /mint/metal-procurement-lots/{id}/receive"
        actor: ProcurementOfficer
        preconditions:
          - "vault daily capacity: sum of quantity_tonnes over lots DELIVERED at the same vault on the same UTC date (per logical clock) + this lot's quantity_tonnes <= 50 (ERR_VAULT_CAPACITY_EXCEEDED)"
        side_effects:
          - "realized_cost_cents = quantity_tonnes x (locked_unit_price_cents_per_tonne if present else current spot price per tonne for commodity)"
          - "denomination.blank_stock_pieces += blanks_produced; denomination.version increments"

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: STRIKING
        trigger: "POST /mint/production-runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "linked FederalReserveOrder.status in {SCHEDULED, FULFILLING} (ERR_RUN_NOT_STARTABLE)"
          - "denomination.blank_stock_pieces >= planned_quantity (ERR_BLANKS_INSUFFICIENT)"
          - "denomination trailing-30-day error rate < 0.02 (ERR_QUALITY_THRESHOLD_BREACH)"
        side_effects:
          - "denomination.blank_stock_pieces -= planned_quantity; run.reserved_blanks = planned_quantity; both versions increment"
          - "if linked order is SCHEDULED it becomes FULFILLING"
      - from: REWORK
        to: STRIKING
        trigger: "POST /mint/production-runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "linked FederalReserveOrder.status in {SCHEDULED, FULFILLING} (ERR_RUN_NOT_STARTABLE)"
          - "denomination.blank_stock_pieces >= planned_quantity (ERR_BLANKS_INSUFFICIENT)"
          - "denomination trailing-30-day error rate < 0.02 (ERR_QUALITY_THRESHOLD_BREACH)"
        side_effects:
          - "denomination.blank_stock_pieces -= planned_quantity; run.reserved_blanks = planned_quantity; both versions increment"
        note: "reworked run consumes a fresh blank reservation; previously scrapped pieces stay scrapped"
      - from: STRIKING
        to: INSPECTION
        trigger: "POST /mint/production-runs/{id}/inspect with outcome present"
        actor: QualityInspector
        preconditions: []
        side_effects: []
        note: "INSPECTION is entered and resolved within the same inspect call; it is never persisted as a resting state"
      - from: INSPECTION
        to: COMPLETED
        trigger: "POST /mint/production-runs/{id}/inspect with outcome=PASS"
        actor: QualityInspector
        preconditions: ["0 <= good_pieces <= reserved_blanks (ERR_INVALID_REQUEST)"]
        side_effects:
          - "produced_pieces = good_pieces; scrapped_pieces = reserved_blanks - good_pieces; reserved_blanks = 0"
          - "linked order.quantity_fulfilled_pieces += produced_pieces; if fulfilled >= ordered the order auto-transitions to FULFILLED and finalizes realized_seigniorage_cents"
          - "if all linked runs of the order are terminal and fulfilled < ordered the order auto-transitions to SHORTFALL_RECORDED"
      - from: INSPECTION
        to: REWORK
        trigger: "POST /mint/production-runs/{id}/inspect with outcome=FAIL"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "scrapped_pieces += reserved_blanks; reserved_blanks = 0; rework_count += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /mint/production-runs/{id}/cancel or cascade from FederalReserveOrder cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "if linked order has all runs terminal and fulfilled < ordered, order auto-transitions to SHORTFALL_RECORDED"
      - from: REWORK
        to: CANCELLED
        trigger: "POST /mint/production-runs/{id}/cancel or cascade from FederalReserveOrder cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "if linked order has all runs terminal and fulfilled < ordered, order auto-transitions to SHORTFALL_RECORDED"

  - entity: CommemorativeProgram
    initial_state: DESIGN_REVIEW
    terminal_states: [SURCHARGE_DISBURSED]
    transitions:
      - from: DESIGN_REVIEW
        to: APPROVED_FOR_SALE
        trigger: "POST /mint/commemorative-programs/{id}/decide-design with decision=APPROVED"
        actor: MintDirector
        preconditions: []
        side_effects: ["program.version increments"]
      - from: DESIGN_REVIEW
        to: DESIGN_REVIEW
        trigger: "POST /mint/commemorative-programs/{id}/decide-design with decision=REVISION_REQUESTED"
        actor: MintDirector
        preconditions: []
        side_effects: ["design_revision_count += 1", "program.version increments"]
        note: "revision self-loop: legislation-driven redesign cycles without leaving review"
      - from: APPROVED_FOR_SALE
        to: ON_SALE
        trigger: "system auto-transition evaluated on POST /_clock/set_current_utc when logical clock >= sales_window_start"
        actor: system
        preconditions: ["clock >= sales_window_start"]
        side_effects:
          - "products of this program in SCHEDULED whose release_datetime <= clock become ON_SALE"
          - "program.version increments"
      - from: ON_SALE
        to: SALES_CLOSED
        trigger: "system auto-transition evaluated on POST /_clock/set_current_utc when logical clock >= sales_window_end"
        actor: system
        preconditions: ["clock >= sales_window_end"]
        side_effects: ["program.version increments"]
      - from: SALES_CLOSED
        to: SURCHARGE_DISBURSED
        trigger: "POST /mint/commemorative-programs/{id}/disburse-surcharges"
        actor: FinanceOfficer
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "disbursed_cents = min(beneficiary_cap_cents, surcharge_accrued_cents)"
          - "program.version increments"

  - entity: NumismaticProduct
    initial_state: SCHEDULED
    terminal_states: [SOLD_OUT, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: ON_SALE
        trigger: "system auto-transition evaluated on POST /_clock/set_current_utc when logical clock >= release_datetime"
        actor: system
        preconditions:
          - "clock >= release_datetime"
          - "if program_id is set, the program must be ON_SALE (otherwise product remains SCHEDULED)"
        side_effects: ["product.version increments"]
      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system auto-transition when allocated_units reaches mintage_limit (on order allocation or waitlist promotion)"
        actor: system
        preconditions: ["allocated_units == mintage_limit"]
        side_effects: ["product.version increments"]
      - from: SOLD_OUT
        to: ON_SALE
        trigger: "system auto-transition when allocated_units falls below mintage_limit (on order cancel)"
        actor: system
        preconditions: ["allocated_units < mintage_limit"]
        side_effects: ["product.version increments"]
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /mint/products/{id}/withdraw"
        actor: ProgramManager
        preconditions: ["no Subscription with status in {ACTIVE, DUNNING} references this product (ERR_PRODUCT_NOT_WITHDRAWABLE)"]
        side_effects:
          - "cascade: orders of this product with allocation_status in {ALLOCATED, WAITLISTED} become RELEASED (order status becomes CANCELLED); each such order with payment_status == PAID becomes REFUNDED"
          - "product.version increments"
      - from: ON_SALE
        to: WITHDRAWN
        trigger: "POST /mint/products/{id}/withdraw"
        actor: ProgramManager
        preconditions: ["no Subscription with status in {ACTIVE, DUNNING} references this product (ERR_PRODUCT_NOT_WITHDRAWABLE)"]
        side_effects:
          - "cascade: orders of this product with allocation_status in {ALLOCATED, WAITLISTED} become RELEASED (order status becomes CANCELLED); each such order with payment_status == PAID becomes REFUNDED"
          - "product.version increments"
      - from: SOLD_OUT
        to: WITHDRAWN
        trigger: "POST /mint/products/{id}/withdraw"
        actor: ProgramManager
        preconditions: ["no Subscription with status in {ACTIVE, DUNNING} references this product (ERR_PRODUCT_NOT_WITHDRAWABLE)"]
        side_effects:
          - "cascade: orders of this product with allocation_status in {ALLOCATED, WAITLISTED} become RELEASED (order status becomes CANCELLED); each such order with payment_status == PAID becomes REFUNDED"
          - "product.version increments"

  - entity: NumismaticOrder
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    parallel_dimensions:
      allocation_status:
        initial: "ALLOCATED if product.remaining_units >= quantity at creation else WAITLISTED"
        transitions:
          - from: WAITLISTED
            to: ALLOCATED
            trigger: "waitlist promotion: units released by an order cancel/withdraw and this order is the earliest-created WAITLISTED order whose quantity fits remaining_units (strict head-of-line: if the earliest does not fit, no later order is considered)"
            actor: system
            preconditions: ["remaining_units >= quantity after the release"]
            side_effects:
              - "product.allocated_units += quantity; if allocated_units == mintage_limit product becomes SOLD_OUT"
          - from: ALLOCATED
            to: RELEASED
            trigger: "POST /mint/orders/{id}/cancel or product withdraw cascade"
            actor: Collector
            preconditions: []
            side_effects:
              - "product.allocated_units -= quantity; if product was SOLD_OUT it becomes ON_SALE"
              - "waitlist promotion scan runs on the released units (head-of-line, created_at ASC)"
          - from: WAITLISTED
            to: RELEASED
            trigger: "POST /mint/orders/{id}/cancel or product withdraw cascade"
            actor: Collector
            preconditions: []
            side_effects: []
      payment_status:
        initial: UNPAID
        transitions:
          - from: UNPAID
            to: PAID
            trigger: "POST /mint/orders/{id}/pay with amount_cents == total_cents"
            actor: Collector
            preconditions: ["allocation_status == ALLOCATED (ERR_ORDER_NOT_PAYABLE on WAITLISTED/RELEASED)"]
            side_effects: ["order.status recomputed (becomes COMPLETED)"]
          - from: PAID
            to: REFUNDED
            trigger: "POST /mint/orders/{id}/cancel or product withdraw cascade"
            actor: Collector
            preconditions: []
            side_effects: ["refund recorded; order.status becomes CANCELLED via allocation RELEASED"]
    note: "status is derived: CANCELLED iff allocation_status == RELEASED; COMPLETED iff PAID and ALLOCATED; else ACTIVE. status is never set directly."

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED, CANCELLED_NONPAYMENT]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mint/subscriptions/{id}/billing-cycle (self-transition: invoice generated, next_billing_date advanced by frequency)"
        actor: PlatformAdmin
        preconditions:
          - "expected_subscription_version == current version (ERR_STALE_VERSION)"
          - "logical clock date >= next_billing_date (ERR_BILLING_NOT_DUE)"
        side_effects:
          - "creates SubscriptionInvoice (PENDING, period_index = cycles_billed + 1, amount_cents per subscription_invoice_amount)"
          - "next_billing_date += 1 month (MONTHLY) or 3 months (QUARTERLY); cycles_billed += 1; version increments"
      - from: ACTIVE
        to: DUNNING
        trigger: "system auto-transition when a linked invoice payment attempt fails (attempts 1 or 2)"
        actor: system
        preconditions: []
        side_effects: ["subscription.version increments"]
      - from: DUNNING
        to: ACTIVE
        trigger: "system auto-transition when the failed invoice is subsequently paid"
        actor: system
        preconditions: []
        side_effects: ["subscription.version increments"]
      - from: DUNNING
        to: CANCELLED_NONPAYMENT
        trigger: "system auto-transition when a linked invoice reaches 3 failed attempts (WRITTEN_OFF)"
        actor: system
        preconditions: []
        side_effects: ["subscription.version increments"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /mint/subscriptions/{id}/cancel"
        actor: Collector
        preconditions: []
        side_effects: ["subscription.version increments"]
      - from: DUNNING
        to: CANCELLED
        trigger: "POST /mint/subscriptions/{id}/cancel"
        actor: Collector
        preconditions: []
        side_effects: ["subscription.version increments"]

  - entity: SubscriptionInvoice
    initial_state: PENDING
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /mint/subscription-invoices/{id}/pay with outcome=SUCCEEDED"
        actor: Collector
        preconditions: ["X-User-ID == subscription.collector_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["attempts += 1", "if subscription was DUNNING it returns to ACTIVE"]
      - from: PENDING
        to: FAILED
        trigger: "POST /mint/subscription-invoices/{id}/pay with outcome=FAILED"
        actor: Collector
        preconditions: ["X-User-ID == subscription.collector_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["attempts += 1", "subscription becomes DUNNING"]
      - from: FAILED
        to: PAID
        trigger: "POST /mint/subscription-invoices/{id}/pay with outcome=SUCCEEDED and attempts < 3"
        actor: Collector
        preconditions: ["attempts < 3 (ERR_INVOICE_NOT_PAYABLE)"]
        side_effects: ["attempts += 1", "subscription returns to ACTIVE"]
      - from: FAILED
        to: FAILED
        trigger: "POST /mint/subscription-invoices/{id}/pay with outcome=FAILED and attempts < 3"
        actor: Collector
        preconditions: ["attempts < 3 (ERR_INVOICE_NOT_PAYABLE)"]
        side_effects: ["attempts += 1", "if attempts reaches 3 the invoice becomes WRITTEN_OFF and the subscription becomes CANCELLED_NONPAYMENT"]
      - from: FAILED
        to: WRITTEN_OFF
        trigger: "system auto-transition when the third failed attempt lands"
        actor: system
        preconditions: ["attempts == 3"]
        side_effects: ["subscription becomes CANCELLED_NONPAYMENT"]

  - entity: BullionIssue
    initial_state: ACTIVE
    terminal_states: [SOLD_OUT]
    transitions:
      - from: ACTIVE
        to: SOLD_OUT
        trigger: "system auto-transition when remaining_pool_units == 0 and no allocation is OFFERED"
        actor: system
        preconditions: ["remaining_pool_units == 0", "no OFFERED allocations for this issue"]
        side_effects: ["issue.version increments"]
      - from: SOLD_OUT
        to: ACTIVE
        trigger: "system auto-transition when an allocation expires and restores units to remaining_pool_units"
        actor: system
        preconditions: []
        side_effects: ["issue.version increments"]

  - entity: AuthorizedPurchaser
    initial_state: APPROVED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /mint/authorized-purchasers/{id}/set-status with to_status=SUSPENDED"
        actor: MintDirector
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /mint/authorized-purchasers/{id}/set-status with to_status=APPROVED"
        actor: MintDirector
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /mint/authorized-purchasers/{id}/set-status with to_status=TERMINATED"
        actor: MintDirector
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mint/authorized-purchasers/{id}/set-status with to_status=TERMINATED"
        actor: MintDirector
        preconditions: []
        side_effects: []

  - entity: BullionAllocation
    initial_state: OFFERED
    terminal_states: [SETTLED, EXPIRED]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /mint/allocations/{id}/confirm"
        actor: BullionDealer
        preconditions:
          - "X-User-ID == authorized_purchaser_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "authorized purchaser status == APPROVED (ERR_AP_NOT_APPROVED)"
          - "logical clock < offer_expires_at (otherwise the clock sweep has already expired the offer)"
        side_effects:
          - "total_price_cents = round_half_up(quantity_units x unit_weight_oz x current spot cents per oz x (1 + premium_bps/10000)) where premium_bps = TIER_BPS[tier] + BRACKET_BPS(quantity_units x unit_weight_oz)"
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /mint/allocations/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "X-User-ID != offered_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "if remaining_pool_units == 0 and no OFFERED allocations remain, issue becomes SOLD_OUT"
      - from: OFFERED
        to: EXPIRED
        trigger: "system auto-transition evaluated on POST /_clock/set_current_utc when logical clock >= offer_expires_at"
        actor: system
        preconditions: ["clock >= offer_expires_at"]
        side_effects:
          - "quantity_units restored to issue.remaining_pool_units; issue becomes ACTIVE if it was SOLD_OUT; issue.version increments"

  - entity: ErrorCoinCase
    initial_state: QUARANTINED
    terminal_states: [DESTROYED]
    transitions:
      - from: QUARANTINED
        to: DESTROYED
        trigger: "POST /mint/error-coin-cases/{id}/destroy"
        actor: DestructionCertifier
        preconditions:
          - "primary_certifier_user_id != secondary_certifier_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "primary_certifier_user_id != reported_by_user_id and secondary_certifier_user_id != reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "destroyed_by_user_ids = [primary, secondary]"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-offer-stale-issue
    parent_entity: BullionIssue
    write_endpoint: "POST /mint/bullion-issues/{id}/allocations"
    occ_field: expected_bullion_issue_version
    description: |
      Creating a BullionAllocation against a BullionIssue whose version has
      advanced since the client last observed it is rejected, because the
      client is pricing and sizing the offer against a stale remaining_pool_units
      view left stale by another accepted offer or an expiry restoration.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: billing-cycle-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /mint/subscriptions/{id}/billing-cycle"
    occ_field: expected_subscription_version
    description: |
      Running a billing cycle against a Subscription whose version has advanced
      since the client last observed it is rejected, because an intervening
      billing cycle or dunning transition has already advanced next_billing_date
      and the client's view of the billing schedule is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: budgeted_unit_seigniorage
    trigger: "on Denomination creation; snapshotted into FederalReserveOrder.budgeted_seigniorage_cents at order creation"
    algorithm: aggregation
    formula: |
      budgeted_unit_seigniorage_cents = face_value_cents - blank_budget_cost_cents - striking_cost_cents
      order.budgeted_seigniorage_cents = quantity_ordered_pieces x budgeted_unit_seigniorage_cents
    input_set: "the Denomination row; the order's quantity"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: budgeted
        when: "at order creation"
        difference: "uses budgeted blank cost from Denomination config"
  - name: realized_unit_blank_cost
    trigger: "evaluated when a FederalReserveOrder becomes FULFILLED (for its denomination) and on the seigniorage report"
    algorithm: aggregation
    formula: |
      lots = MetalProcurementLot where denomination_code == D and status == DELIVERED
      realized_unit_blank_cost_cents = round_half_up(sum(lot.realized_cost_cents) / sum(lot.blanks_produced), 2)
      order.realized_seigniorage_cents = quantity_ordered_pieces x (face_value_cents - realized_unit_blank_cost_cents - striking_cost_cents)
      (unit margin rounded half-up to 2 decimals BEFORE multiplying by quantity)
    input_set: "DELIVERED lots for the denomination only; ORDERED lots excluded"
    constants: {}
    precision: "2 decimal places, round_half_up; unit margin rounded before multiplying"
    variants:
      - name: realized
        when: "at order fulfillment / realized report variant"
        difference: "uses delivered lots' realized_cost_cents (locked price if hedged, delivery-time spot if unhedged) instead of budget cost; differs from budgeted whenever realized blank cost differs from budget"
  - name: metal_cost_exposure
    trigger: "GET /mint/reports/metal-exposure"
    algorithm: aggregation
    formula: |
      exposed lots L = MetalProcurementLot where locked_unit_price_cents_per_tonne IS NULL and status in {ORDERED, DELIVERED}
      variant mark_to_market:   exposure_cents(commodity) = sum over L of quantity_tonnes x (current_spot_cents_per_tonne - order_spot_cents_per_tonne)
      variant budget_variance:  exposure_cents(commodity) = sum over L of quantity_tonnes x (current_spot_cents_per_tonne - budget_price_cents_per_tonne)
    input_set: "unhedged lots in ORDERED or DELIVERED, grouped by commodity; hedged lots (locked price present) excluded from both variants"
    constants: {}
    precision: "integer cents (tonnes and per-tonne prices are integers)"
    variants:
      - name: mark_to_market
        when: "variant=mark_to_market (default)"
        difference: "measures drift since the order was placed (current spot minus order-time spot)"
      - name: budget_variance
        when: "variant=budget_variance"
        difference: "measures drift against the budget reference price (current spot minus budget price); produces a different cents figure whenever order-time spot differs from budget price"
  - name: blank_stock_reconciliation
    trigger: "verified on every blank-affecting transition (lot receive, run start, inspect, run cancel); surfaced on the seigniorage report"
    algorithm: aggregation
    formula: |
      for each denomination D:
        delivered_pieces = sum(blanks_produced over DELIVERED lots of D)
        reserved_pieces  = sum(reserved_blanks over runs of D in {STRIKING, INSPECTION})
        produced_pieces  = sum(produced_pieces over runs of D)
        scrapped_pieces  = sum(scrapped_pieces over runs of D)
        INVARIANT: D.blank_stock_pieces + reserved_pieces + produced_pieces + scrapped_pieces == delivered_pieces
    input_set: "all lots and all runs of the denomination regardless of age"
    constants: {}
    precision: "integer pieces"
    variants: []
  - name: household_order_limit_check
    trigger: "POST /mint/orders"
    algorithm: threshold
    formula: |
      household_units = sum(quantity) over NumismaticOrder where product_id == P
        and order.status != CANCELLED
        and collector.household_id == placing collector's household_id
      accept only if household_units + new_quantity <= product.household_order_limit
      (equality is allowed: reaching exactly the limit succeeds; limit + 1 fails ERR_HOUSEHOLD_LIMIT_EXCEEDED)
    input_set: "non-cancelled orders of the same product placed by any collector sharing the household_id"
    constants: {}
    precision: "integer units; boundary: <= allowed, > rejected"
    variants: []
  - name: release_queue_allocation
    trigger: "POST /mint/orders (after household check passes)"
    algorithm: waterfall_allocation
    formula: |
      if product.allocated_units + quantity <= product.mintage_limit:
        allocation_status = ALLOCATED; product.allocated_units += quantity
      else:
        allocation_status = WAITLISTED (whole order waitlists; partial fills are never performed)
      product becomes SOLD_OUT iff allocated_units == mintage_limit (equality, not >=)
    input_set: "the product's current allocated_units"
    constants: {}
    precision: "integer units; atomic whole-order fill"
    variants: []
  - name: waitlist_promotion
    trigger: "whenever allocated units are released (order cancel, product withdraw does NOT promote because product is terminal)"
    algorithm: chronological
    formula: |
      scan WAITLISTED orders of the product in created_at ASC (ties: server receipt order)
      head-of-line blocking: consider only the earliest; if its quantity <= remaining_units, promote to ALLOCATED
      (allocated_units += quantity), then repeat with the new earliest; if it does not fit, STOP
      (no later order is considered even if it would fit)
    input_set: "WAITLISTED orders of the product"
    constants: {}
    precision: "integer units"
    variants: []
  - name: subscription_invoice_amount
    trigger: "POST /mint/subscriptions/{id}/billing-cycle"
    algorithm: tiered_pricing
    formula: |
      unit_net_cents = round_half_up(product.price_cents x (1 - SUBSCRIBER_DISCOUNT_PCT), 0)
      shipping_cents = 495 if units_per_cycle <= 3; 895 if 4 <= units_per_cycle <= 10; 0 if >= 11
      amount_cents = unit_net_cents x units_per_cycle + shipping_cents
      ROUNDING ORDER PINNED: the 10% subscriber discount is applied per unit and rounded to whole
      cents (round_half_up) BEFORE multiplying by units_per_cycle; rounding after the multiplication
      is a different, rejected order of operations.
    input_set: "the subscription's product price and units_per_cycle"
    constants:
      SUBSCRIBER_DISCOUNT_PCT: 0.10
      SHIPPING_TIER1_MAX_UNITS: 3
      SHIPPING_TIER1_CENTS: 495
      SHIPPING_TIER2_MAX_UNITS: 10
      SHIPPING_TIER2_CENTS: 895
    precision: "integer cents; per-unit round_half_up before multiplication"
    variants: []
  - name: program_net_proceeds
    trigger: "read on GET /mint/commemorative-programs/{id} (computed field net_proceeds_cents)"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER PINNED (the definition looks circular and is not):
        1. base_cents = gross_receipts_cents - direct_costs_cents
        2. admin_fee_cents = round_half_up(base_cents x ADMIN_FEE_PCT, 0)
        3. net_proceeds_cents = base_cents - admin_fee_cents
      gross_receipts_cents = sum over PAID orders of program products of (quantity x price_cents)
      surcharge_accrued_cents is computed separately and is NOT net of admin fee.
    input_set: "PAID orders of products whose program_id == this program"
    constants:
      ADMIN_FEE_PCT: 0.05
    precision: "integer cents; fee rounded half-up before subtraction"
    variants: []
  - name: surcharge_disbursement_amount
    trigger: "POST /mint/commemorative-programs/{id}/disburse-surcharges"
    algorithm: threshold
    formula: |
      disbursed_cents = min(beneficiary_cap_cents, surcharge_accrued_cents)
      surcharge_accrued_cents = (sum over PAID orders of program products of quantity) x surcharge_cents_per_unit
      boundary: when accrued == cap, disbursed == cap exactly
    input_set: "PAID orders of program products; statutory cap"
    constants: {}
    precision: "integer cents"
    variants: []
  - name: bullion_settlement_price
    trigger: "POST /mint/allocations/{id}/confirm"
    algorithm: tiered_pricing
    formula: |
      total_oz = quantity_units x issue.unit_weight_oz
      premium_bps = TIER_BPS[ap.tier] + BRACKET_BPS(total_oz)
      BRACKET_BPS: total_oz < 100 -> 200; 100 <= total_oz < 500 -> 100; total_oz >= 500 -> 0
      total_price_cents = round_half_up(total_oz x spot_cents_per_oz(metal) x (1 + premium_bps / 10000), 0)
      spot is the current logical-clock spot price for the issue metal; missing spot -> ERR_SPOT_PRICE_MISSING
    input_set: "allocation quantity, issue unit weight, AP tier, current metal spot"
    constants:
      TIER_BPS_T1: 300
      TIER_BPS_T2: 450
      TIER_BPS_T3: 625
      BRACKET_BPS_UNDER_100OZ: 200
      BRACKET_BPS_100_TO_499OZ: 100
      BRACKET_BPS_500OZ_PLUS: 0
    precision: "integer cents; single round_half_up at the end"
    variants: []
  - name: error_rate_threshold
    trigger: "POST /mint/production-runs/{id}/start (gate for the run's denomination)"
    algorithm: threshold
    formula: |
      window = [logical_now - 30 days, logical_now]
      error_pieces = sum(ErrorCoinCase.error_pieces for cases whose run is denomination D and case.created_at in window)
      struck_pieces = sum(run.produced_pieces + run.scrapped_pieces for runs of denomination D whose inspection completed in window)
      breach iff struck_pieces > 0 and error_pieces / struck_pieces >= 0.02
      boundary: exactly 0.02 breaches (>=); 0.0199... passes
    input_set: "ErrorCoinCases and inspected runs of the denomination inside the trailing 30-day window"
    constants:
      ERROR_RATE_THRESHOLD: 0.02
      ERROR_RATE_WINDOW_DAYS: 30
    precision: "ratio compared exactly (rational arithmetic on integers)"
    variants: []
  - name: press_window_overlap
    trigger: "POST /mint/production-runs"
    algorithm: interval_merge
    formula: |
      reject iff exists another run R with R.facility == facility and R.press_line == press_line
        and R.status not in {COMPLETED, CANCELLED}
        and half-open overlap: R.planned_start < planned_end and planned_start < R.planned_end
      adjacency is allowed: run A planned_end == run B planned_start does NOT overlap
    input_set: "non-terminal runs on the same (facility, press_line)"
    constants: {}
    precision: "half-open intervals [start, end)"
    variants: []
  - name: release_family_gap
    trigger: "POST /mint/products"
    algorithm: interval_merge
    formula: |
      reject iff exists another product Q with Q.product_family == product_family
        and Q.status != WITHDRAWN
        and abs(Q.release_datetime - release_datetime) < 24 hours
      exactly 24 hours apart is allowed (>= 24h passes, < 24h fails)
    input_set: "non-withdrawn products in the same release family"
    constants:
      RELEASE_MIN_GAP_HOURS: 24
    precision: "gap rule with >= boundary (different semantics from press-window overlap)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: Collector may only read/act on orders, subscriptions, invoices whose subscription/order collector_id == X-User-ID; Collector list filters collector_id must equal X-User-ID; BullionDealer may only confirm allocations whose authorized_purchaser_id == X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "GET /mint/orders, GET /mint/orders/{id}, POST /mint/orders/{id}/pay, POST /mint/orders/{id}/cancel, GET /mint/subscriptions, GET /mint/subscriptions/{id}, POST /mint/subscriptions/{id}/cancel, GET /mint/subscriptions/{id}/invoices, POST /mint/subscription-invoices/{id}/pay, POST /mint/allocations/{id}/confirm" }
  - { priority: 4, category: existence, check: "Every path id resolves to an existing resource (left to right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: state, check: "State-machine precondition of the invoked transition holds (from-state membership and transition-specific state preconditions); OCC: expected_*_version equals the parent entity's current version. Transitions with a dedicated domain error use it; any other invalid from-state uses the generic fallback.", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 422, applies_to: "all action endpoints", description: "dedicated domain errors take precedence where declared (e.g. ERR_RUN_NOT_STARTABLE, ERR_ORDER_NOT_PAYABLE, ERR_LOT_NOT_RECEIVABLE); ERR_STALE_VERSION carries http 412 for OCC" }
  - { priority: 5, category: state, check: "POST /mint/orders requires product.status in {ON_SALE, SOLD_OUT} (SCHEDULED or WITHDRAWN rejected)", error_id: ERR_PRODUCT_NOT_ORDERABLE, http_status: 422, applies_to: "POST /mint/orders" }
  - { priority: 5, category: state, check: "POST /mint/subscriptions requires product.status == ON_SALE", error_id: ERR_PRODUCT_NOT_ORDERABLE, http_status: 422, applies_to: "POST /mint/subscriptions" }
  - { priority: 6, category: business_referential, check: "denomination_code references an existing Denomination.code", error_id: ERR_UNKNOWN_DENOMINATION, http_status: 422, applies_to: "POST /mint/federal-reserve-orders, POST /mint/metal-procurement-lots" }
  - { priority: 6, category: business_referential, check: "program_id (when provided) references an existing CommemorativeProgram", error_id: ERR_UNKNOWN_PROGRAM, http_status: 422, applies_to: "POST /mint/products" }
  - { priority: 6, category: business_referential, check: "product_id references an existing NumismaticProduct", error_id: ERR_UNKNOWN_PRODUCT, http_status: 422, applies_to: "POST /mint/orders, POST /mint/subscriptions" }
  - { priority: 6, category: business_referential, check: "production run's denomination (from its Federal Reserve order) is consistent: run inherits order.denomination_code", error_id: ERR_UNKNOWN_DENOMINATION, http_status: 422, applies_to: "POST /mint/production-runs" }
  - { priority: 6, category: business_referential, check: "a current spot price has been established for the commodity/metal via the clock endpoint", error_id: ERR_SPOT_PRICE_MISSING, http_status: 422, applies_to: "POST /mint/metal-procurement-lots, POST /mint/allocations/{id}/confirm" }
  - { priority: 6, category: business_referential, check: "authorized purchaser exists and its status == APPROVED", error_id: ERR_AP_NOT_APPROVED, http_status: 422, applies_to: "POST /mint/bullion-issues/{id}/allocations, POST /mint/allocations/{id}/confirm" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: disburse-surcharges actor != program.created_by_user_id; allocation settle actor != allocation.offered_by_user_id; destroy certifier ids distinct from each other and from reported_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /mint/commemorative-programs/{id}/disburse-surcharges, POST /mint/allocations/{id}/settle, POST /mint/error-coin-cases/{id}/destroy" }
  - { priority: 7, category: business_safety, check: "Denomination trailing-30-day error rate < 0.02 before striking may begin", error_id: ERR_QUALITY_THRESHOLD_BREACH, http_status: 422, applies_to: "POST /mint/production-runs/{id}/start" }
  - { priority: 8, category: business_temporal, check: "Press window: no half-open overlap with a non-terminal run on the same (facility, press_line); planned_end > planned_start", error_id: ERR_PRESS_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /mint/production-runs" }
  - { priority: 8, category: business_temporal, check: "Release gap: release_datetime differs from every non-withdrawn product in the same family by >= 24 hours", error_id: ERR_RELEASE_GAP_VIOLATION, http_status: 409, applies_to: "POST /mint/products" }
  - { priority: 8, category: business_temporal, check: "Billing cycle may run only when logical clock date >= next_billing_date", error_id: ERR_BILLING_NOT_DUE, http_status: 422, applies_to: "POST /mint/subscriptions/{id}/billing-cycle" }
  - { priority: 8, category: business_temporal, check: "Logical clock is monotonic: set_current_utc may not move the clock backwards", error_id: ERR_CLOCK_REGRESSION, http_status: 422, applies_to: "POST /_clock/set_current_utc" }
  - { priority: 9, category: business_constraint, check: "Required fields present, types and enum membership valid, datetime strings parse, no undeclared/read-only fields in payload", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 9, category: business_constraint, check: "quantity / quantity_tonnes / planned_quantity / units fields > 0 (>= 1 where integer units)", error_id: ERR_QUANTITY_INVALID, http_status: 400, applies_to: "POST /mint/orders, POST /mint/metal-procurement-lots, POST /mint/production-runs, POST /mint/bullion-issues/{id}/allocations, POST /mint/subscriptions" }
  - { priority: 9, category: business_constraint, check: "Uniqueness: Denomination.code, NumismaticProduct.product_code, Collector.email", error_id: ERR_UNIQUENESS_DOMAIN, http_status: 409, applies_to: "POST /mint/denominations, POST /mint/products, POST /mint/collectors", description: "ERR_DENOMINATION_EXISTS, ERR_PRODUCT_CODE_EXISTS, ERR_EMAIL_EXISTS respectively" }
  - { priority: 9, category: business_constraint, check: "No ACTIVE or DUNNING subscription already exists for (collector_id, product_id)", error_id: ERR_DUPLICATE_SUBSCRIPTION, http_status: 409, applies_to: "POST /mint/subscriptions" }
  - { priority: 9, category: business_constraint, check: "Subscription product must have subscription_eligible == true", error_id: ERR_SUBSCRIPTION_NOT_ELIGIBLE_PRODUCT, http_status: 422, applies_to: "POST /mint/subscriptions" }
  - { priority: 9, category: business_constraint, check: "Vault daily aggregate capacity: sum of quantity_tonnes DELIVERED at the vault on the receipt UTC date + this lot <= 50", error_id: ERR_VAULT_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /mint/metal-procurement-lots/{id}/receive" }
  - { priority: 9, category: business_constraint, check: "Sum of mintage_limit over a program's products must stay <= program.max_mintage_legal", error_id: ERR_PROGRAM_MINTAGE_EXCEEDED, http_status: 422, applies_to: "POST /mint/products" }
  - { priority: 9, category: business_constraint, check: "Error pieces reported must be <= the run's scrapped_pieces at case creation", error_id: ERR_ERRORCOIN_QUANTITY_EXCEEDS, http_status: 422, applies_to: "POST /mint/error-coin-cases" }
  - { priority: 9, category: business_constraint, check: "Payment amount must equal the exact total_cents (order) or amount_cents (invoice)", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /mint/orders/{id}/pay" }
  - { priority: 9, category: business_constraint, check: "Product with ACTIVE or DUNNING subscriptions cannot be withdrawn", error_id: ERR_PRODUCT_NOT_WITHDRAWABLE, http_status: 422, applies_to: "POST /mint/products/{id}/withdraw" }
  - { priority: 10, category: business_fiscal, check: "Household aggregate units for the product + new quantity <= household_order_limit (equality allowed)", error_id: ERR_HOUSEHOLD_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /mint/orders" }
  - { priority: 10, category: business_fiscal, check: "Bullion offer quantity <= issue.remaining_pool_units", error_id: ERR_POOL_INSUFFICIENT, http_status: 422, applies_to: "POST /mint/bullion-issues/{id}/allocations" }
  - { priority: 10, category: business_fiscal, check: "Denomination blank_stock_pieces >= run.planned_quantity at start", error_id: ERR_BLANKS_INSUFFICIENT, http_status: 422, applies_to: "POST /mint/production-runs/{id}/start" }

# Domain state errors referenced by priority-5 state checks:
# ERR_PRODUCT_NOT_ORDERABLE, ERR_ORDER_NOT_PAYABLE, ERR_ORDER_NOT_CANCELLABLE,
# ERR_RUN_NOT_STARTABLE, ERR_RUN_NOT_INSPECTABLE, ERR_RUN_NOT_CANCELLABLE,
# ERR_FEDORDER_NOT_CANCELLABLE, ERR_PROGRAM_NOT_DISBURSABLE, ERR_SUBSCRIPTION_NOT_ACTIVE,
# ERR_INVOICE_NOT_PAYABLE, ERR_ALLOCATION_NOT_CONFIRMABLE, ERR_ALLOCATION_NOT_SETTLABLE,
# ERR_CASE_ALREADY_DESTROYED, ERR_LOT_NOT_RECEIVABLE, ERR_STALE_VERSION,
# ERR_INVALID_STATE_TRANSITION (generic fallback)

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (and optionally commodity/metal spot prices). Server boot default is exactly 2026-09-01T00:00:00Z with NO spot prices established; the clock never reads wall-clock time. Setting the clock evaluates all time-based auto-transitions (program sales open/close, product release, allocation expiry). spot_prices maps commodity/metal name to integer cents per unit (per troy oz for GOLD/SILVER/PLATINUM, per tonne for COPPER/NICKEL/ZINC) and replaces the current price for each key given. Clock must not move backwards (ERR_CLOCK_REGRESSION)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601, "spot_prices?"]
    output: "{ current_utc: string, spot_prices: object }"
    side_effects: ["evaluates time-based auto-transitions", "replaces spot prices for keys present"]

  - method: POST
    path: "/mint/denominations"
    description: "Create a denomination configuration"
    roles: [PlatformAdmin]
    code: 201
    input: [code, face_value_cents, blank_budget_cost_cents, striking_cost_cents, blanks_per_tonne]
    output: Denomination
    side_effects: ["computes budgeted_unit_seigniorage_cents", "blank_stock_pieces initialized to 0"]

  - method: POST
    path: "/mint/federal-reserve-orders"
    description: "Submit a Federal Reserve coin order (created in SUBMITTED)"
    roles: [FedLiaison]
    code: 201
    input: [fiscal_year, denomination_code, quantity_ordered_pieces, due_date]
    output: FederalReserveOrder
    side_effects: ["snapshots budgeted_seigniorage_cents from the denomination"]

  - method: GET
    path: "/mint/federal-reserve-orders/{id}"
    description: "Read a Federal Reserve order"
    roles: [FedLiaison, ProductionPlanner, MintDirector, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FederalReserveOrder
    side_effects: []

  - method: POST
    path: "/mint/federal-reserve-orders/{id}/cancel"
    description: "Cancel an order in SUBMITTED or SCHEDULED; cascades cancellation to linked non-terminal runs and releases their reserved blanks"
    roles: [FedLiaison]
    code: 200
    input: []
    output: FederalReserveOrder
    side_effects: ["linked runs in {PLANNED, REWORK} become CANCELLED", "reserved blanks released to denomination stock", "increments FederalReserveOrder.version"]

  - method: POST
    path: "/mint/metal-procurement-lots"
    description: "Create a metal procurement lot (created in ORDERED; locked_unit_price present means hedged). Requires a current spot price for the commodity."
    roles: [ProcurementOfficer]
    code: 201
    input: [commodity, denomination_code, quantity_tonnes, budget_price_cents_per_tonne, "locked_unit_price_cents_per_tonne?", vault, planned_delivery_date]
    output: MetalProcurementLot
    side_effects: ["records order_spot_cents_per_tonne from current spot", "computes blanks_produced"]

  - method: GET
    path: "/mint/metal-procurement-lots/{id}"
    description: "Read a metal procurement lot"
    roles: [ProcurementOfficer, ProductionPlanner, FinanceOfficer, MintDirector, PlatformAdmin]
    code: 200
    input: []
    output: MetalProcurementLot
    side_effects: []

  - method: POST
    path: "/mint/metal-procurement-lots/{id}/receive"
    description: "Record delivery of a lot at its vault (today per logical clock); enforces vault daily aggregate capacity and credits denomination blank stock"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: MetalProcurementLot
    side_effects: ["sets realized_cost_cents", "credits denomination.blank_stock_pieces by blanks_produced", "increments Denomination.version"]

  - method: POST
    path: "/mint/production-runs"
    description: "Schedule a production run (PLANNED); enforces press-window half-open overlap on (facility, press_line)"
    roles: [ProductionPlanner]
    code: 201
    input: [fed_order_id, facility, press_line, planned_start, planned_end, planned_quantity]
    output: ProductionRun
    side_effects: ["linked order SUBMITTED -> SCHEDULED on first run"]

  - method: GET
    path: "/mint/production-runs"
    description: "List production runs"
    roles: [ProductionPlanner, QualityInspector, FedLiaison, MintDirector, PlatformAdmin]
    code: 200
    input: ["fed_order_id?", "facility?", "status?", "denomination_code?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  - method: GET
    path: "/mint/production-runs/{id}"
    description: "Read a production run"
    roles: [ProductionPlanner, QualityInspector, FedLiaison, MintDirector, PlatformAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: POST
    path: "/mint/production-runs/{id}/start"
    description: "Start striking from PLANNED or REWORK; reserves blanks from denomination stock"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["reserves planned_quantity blanks", "linked order SCHEDULED -> FULFILLING on first start"]

  - method: POST
    path: "/mint/production-runs/{id}/inspect"
    description: "Inspect a STRIKING run. outcome=PASS requires good_pieces (0 <= good_pieces <= reserved_blanks) and completes the run; outcome=FAIL scraps all reserved blanks and returns the run to REWORK"
    roles: [QualityInspector]
    code: 200
    input: [outcome, "good_pieces?"]
    output: ProductionRun
    side_effects: ["PASS: produced/scrapped recorded, order fulfillment advances (possible FULFILLED with realized seigniorage, or SHORTFALL_RECORDED)", "FAIL: scrapped += reserved, rework_count += 1"]

  - method: POST
    path: "/mint/production-runs/{id}/cancel"
    description: "Cancel a run in PLANNED or REWORK"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["may drive linked order to SHORTFALL_RECORDED"]

  - method: POST
    path: "/mint/commemorative-programs"
    description: "Create a commemorative program authorized by legislation (created in DESIGN_REVIEW)"
    roles: [ProgramManager]
    code: 201
    input: [name, statute_reference, max_mintage_legal, surcharge_cents_per_unit, beneficiary_name, beneficiary_cap_cents, direct_costs_cents, sales_window_start, sales_window_end]
    output: CommemorativeProgram
    side_effects: ["records created_by_user_id from X-User-ID"]

  - method: GET
    path: "/mint/commemorative-programs/{id}"
    description: "Read a program including computed gross_receipts_cents, surcharge_accrued_cents, net_proceeds_cents, disbursed_cents"
    roles: [ProgramManager, MintDirector, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CommemorativeProgram
    side_effects: []

  - method: POST
    path: "/mint/commemorative-programs/{id}/decide-design"
    description: "MintDirector design decision: APPROVED moves DESIGN_REVIEW -> APPROVED_FOR_SALE; REVISION_REQUESTED loops in DESIGN_REVIEW and increments design_revision_count"
    roles: [MintDirector]
    code: 200
    input: [decision]
    output: CommemorativeProgram
    side_effects: ["design_revision_count += 1 on REVISION_REQUESTED"]

  - method: POST
    path: "/mint/commemorative-programs/{id}/disburse-surcharges"
    description: "Disburse accrued surcharges to the statutory beneficiary (requires SALES_CLOSED; actor must differ from program creator)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CommemorativeProgram
    side_effects: ["disbursed_cents = min(beneficiary_cap_cents, surcharge_accrued_cents)", "status -> SURCHARGE_DISBURSED"]

  - method: POST
    path: "/mint/products"
    description: "Create a numismatic product (created in SCHEDULED); enforces family release gap and program mintage ceiling"
    roles: [ProgramManager]
    code: 201
    input: [product_code, "program_id?", product_family, product_type, price_cents, mintage_limit, household_order_limit, release_datetime, "subscription_eligible?"]
    output: NumismaticProduct
    side_effects: []

  - method: GET
    path: "/mint/products"
    description: "List products (catalog browse)"
    roles: [Collector, ProgramManager, MintDirector, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["program_id?", "status?", "product_family?", "limit?", "offset?"]
    output: NumismaticProduct[]
    side_effects: []

  - method: GET
    path: "/mint/products/{id}"
    description: "Read a product"
    roles: [Collector, ProgramManager, MintDirector, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: NumismaticProduct
    side_effects: []

  - method: POST
    path: "/mint/products/{id}/withdraw"
    description: "Withdraw a product (SCHEDULED/ON_SALE/SOLD_OUT -> WITHDRAWN); cascades cancellation and refunds to its non-released orders"
    roles: [ProgramManager]
    code: 200
    input: []
    output: NumismaticProduct
    side_effects: ["orders ALLOCATED/WAITLISTED -> RELEASED; PAID -> REFUNDED"]

  - method: POST
    path: "/mint/collectors"
    description: "Register a collector"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, household_id]
    output: Collector
    side_effects: []

  - method: POST
    path: "/mint/orders"
    description: "Place a numismatic order: product must be ON_SALE or SOLD_OUT; household limit enforced; whole order allocates or waitlists against remaining mintage"
    roles: [Collector]
    code: 201
    input: [product_id, quantity]
    output: NumismaticOrder
    side_effects: ["collector_id set from X-User-ID", "ALLOCATED orders increase product.allocated_units and may flip product to SOLD_OUT"]

  - method: GET
    path: "/mint/orders"
    description: "List orders; Collector callers must pass their own collector_id"
    roles: [Collector, ProgramManager, MintDirector, PlatformAdmin]
    code: 200
    input: ["collector_id?", "product_id?", "allocation_status?", "payment_status?", "limit?", "offset?"]
    output: NumismaticOrder[]
    side_effects: []

  - method: GET
    path: "/mint/orders/{id}"
    description: "Read an order (Collector callers: own orders only)"
    roles: [Collector, ProgramManager, MintDirector, PlatformAdmin]
    code: 200
    input: []
    output: NumismaticOrder
    side_effects: []

  - method: POST
    path: "/mint/orders/{id}/pay"
    description: "Pay an order (UNPAID + ALLOCATED only); amount must equal total_cents exactly"
    roles: [Collector]
    code: 200
    input: [amount_cents]
    output: NumismaticOrder
    side_effects: ["payment_status -> PAID; status -> COMPLETED"]

  - method: POST
    path: "/mint/orders/{id}/cancel"
    description: "Cancel an order (ALLOCATED or WAITLISTED); releases units, refunds if PAID, runs waitlist promotion"
    roles: [Collector]
    code: 200
    input: []
    output: NumismaticOrder
    side_effects: ["allocation_status -> RELEASED", "PAID -> REFUNDED", "released units trigger waitlist promotion", "product may flip SOLD_OUT -> ON_SALE"]

  - method: POST
    path: "/mint/subscriptions"
    description: "Enroll in a subscription for a subscription_eligible ON_SALE product"
    roles: [Collector]
    code: 201
    input: [product_id, units_per_cycle, frequency]
    output: Subscription
    side_effects: ["next_billing_date initialized to current logical clock date"]

  - method: GET
    path: "/mint/subscriptions"
    description: "List subscriptions; Collector callers must pass their own collector_id"
    roles: [Collector, ProgramManager, PlatformAdmin]
    code: 200
    input: ["collector_id?", "product_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/mint/subscriptions/{id}"
    description: "Read a subscription (Collector callers: own only)"
    roles: [Collector, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/mint/subscriptions/{id}/cancel"
    description: "Cancel an ACTIVE or DUNNING subscription"
    roles: [Collector]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/mint/subscriptions/{id}/billing-cycle"
    description: "Run the billing cycle when due: creates a PENDING invoice with the discounted per-unit-rounded amount and advances next_billing_date. OCC-guarded via expected_subscription_version."
    roles: [PlatformAdmin]
    code: 201
    input: [expected_subscription_version]
    output: SubscriptionInvoice
    side_effects: ["creates SubscriptionInvoice", "advances next_billing_date by frequency", "increments Subscription.version"]

  - method: GET
    path: "/mint/subscriptions/{id}/invoices"
    description: "List invoices of a subscription (Collector callers: own only)"
    roles: [Collector, ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SubscriptionInvoice[]
    side_effects: []

  - method: POST
    path: "/mint/subscription-invoices/{id}/pay"
    description: "Attempt payment of an invoice (PENDING or FAILED with attempts < 3); outcome SUCCEEDED pays it, FAILED records a failed attempt and drives dunning"
    roles: [Collector]
    code: 200
    input: [outcome]
    output: SubscriptionInvoice
    side_effects: ["attempts += 1", "FAILED -> subscription DUNNING", "3rd FAILED -> WRITTEN_OFF + subscription CANCELLED_NONPAYMENT", "SUCCEEDED from FAILED -> subscription ACTIVE"]

  - method: POST
    path: "/mint/bullion-issues"
    description: "Create a bullion issue with a total unit pool (created ACTIVE)"
    roles: [ProgramManager]
    code: 201
    input: [name, metal, unit_weight_oz, total_pool_units, offer_window_hours]
    output: BullionIssue
    side_effects: ["remaining_pool_units = total_pool_units"]

  - method: GET
    path: "/mint/bullion-issues/{id}"
    description: "Read a bullion issue"
    roles: [ProgramManager, BullionDealer, FinanceOfficer, MintDirector, PlatformAdmin]
    code: 200
    input: []
    output: BullionIssue
    side_effects: []

  - method: POST
    path: "/mint/authorized-purchasers"
    description: "Register an authorized purchaser (created APPROVED)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier]
    output: AuthorizedPurchaser
    side_effects: []

  - method: POST
    path: "/mint/authorized-purchasers/{id}/set-status"
    description: "Transition an authorized purchaser: APPROVED <-> SUSPENDED, APPROVED/SUSPENDED -> TERMINATED"
    roles: [MintDirector]
    code: 200
    input: [to_status]
    output: AuthorizedPurchaser
    side_effects: []

  - method: POST
    path: "/mint/bullion-issues/{id}/allocations"
    description: "Offer an allocation of an ACTIVE issue to an APPROVED authorized purchaser; decrements remaining_pool_units; OCC-guarded via expected_bullion_issue_version"
    roles: [ProgramManager]
    code: 201
    input: [authorized_purchaser_id, quantity_units, expected_bullion_issue_version]
    output: BullionAllocation
    side_effects: ["remaining_pool_units -= quantity_units", "offer_expires_at = logical now + issue.offer_window_hours", "increments BullionIssue.version"]

  - method: GET
    path: "/mint/allocations"
    description: "List bullion allocations"
    roles: [ProgramManager, BullionDealer, FinanceOfficer, MintDirector, PlatformAdmin]
    code: 200
    input: ["bullion_issue_id?", "authorized_purchaser_id?", "status?", "limit?", "offset?"]
    output: BullionAllocation[]
    side_effects: []

  - method: GET
    path: "/mint/allocations/{id}"
    description: "Read a bullion allocation"
    roles: [ProgramManager, BullionDealer, FinanceOfficer, MintDirector, PlatformAdmin]
    code: 200
    input: []
    output: BullionAllocation
    side_effects: []

  - method: POST
    path: "/mint/allocations/{id}/confirm"
    description: "Authorized purchaser confirms an OFFERED allocation before expiry; computes the tiered premium settlement price"
    roles: [BullionDealer]
    code: 200
    input: []
    output: BullionAllocation
    side_effects: ["computes total_price_cents from spot + tier/bracket premium"]

  - method: POST
    path: "/mint/allocations/{id}/settle"
    description: "Settle a CONFIRMED allocation; settler must differ from the offering ProgramManager (segregation of duties)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: BullionAllocation
    side_effects: ["may flip issue to SOLD_OUT"]

  - method: POST
    path: "/mint/error-coin-cases"
    description: "Report an error-coin case against a production run (created QUARANTINED); error_pieces must not exceed the run's scrapped_pieces"
    roles: [QualityInspector]
    code: 201
    input: [production_run_id, error_pieces, "description?"]
    output: ErrorCoinCase
    side_effects: ["records reported_by_user_id from X-User-ID"]

  - method: GET
    path: "/mint/production-runs/{id}/error-coin-cases"
    description: "List error coin cases of a production run"
    roles: [QualityInspector, DestructionCertifier, ProductionPlanner, MintDirector, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ErrorCoinCase[]
    side_effects: []

  - method: POST
    path: "/mint/error-coin-cases/{id}/destroy"
    description: "Certify destruction of a quarantined error-coin case; requires two distinct certifier ids, neither of which may be the reporting inspector"
    roles: [DestructionCertifier]
    code: 200
    input: [primary_certifier_user_id, secondary_certifier_user_id]
    output: ErrorCoinCase
    side_effects: ["records destroyed_by_user_ids"]

  - method: GET
    path: "/mint/reports/{report_type}"
    description: "Computed report. report_type=seigniorage: rows per denomination with budgeted_seigniorage_cents (sum over non-cancelled orders' snapshots), realized_seigniorage_cents (sum over FULFILLED orders), blanks_on_hand_pieces, blanks_reserved_pieces, blanks_produced_pieces, blanks_scrapped_pieces, blanks_delivered_pieces; optional filters fiscal_year, denomination_code. report_type=metal-exposure: rows per commodity with exposure_cents under variant=mark_to_market (default) or variant=budget_variance."
    roles: [FinanceOfficer, ProductionPlanner, ProgramManager, MintDirector, PlatformAdmin, ProcurementOfficer]
    code: 200
    input: ["fiscal_year?", "denomination_code?", "commodity?", "variant?"]
    output: "{ report_type: string, rows: array }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role is declared but not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller touches a resource owned by another collector/authorized purchaser, or a Collector list filter names another collector_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, unknown enum member, undeclared/read-only field in payload, malformed datetime, or pagination limit outside [1, 100]" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 422, condition: "No declared transition exists from the resource's current state for the invoked action and no domain-specific state error applies (e.g. decide-design outside DESIGN_REVIEW, set-status with an undeclared AP transition)" }
  - { id: ERR_QUANTITY_INVALID, http: 400, condition: "A quantity/tonnage/units field is zero or negative" }
  - { id: ERR_UNKNOWN_DENOMINATION, http: 422, condition: "denomination_code does not match any Denomination.code" }
  - { id: ERR_UNKNOWN_PROGRAM, http: 422, condition: "program_id does not match any CommemorativeProgram" }
  - { id: ERR_UNKNOWN_PRODUCT, http: 422, condition: "product_id does not match any NumismaticProduct" }
  - { id: ERR_SPOT_PRICE_MISSING, http: 422, condition: "No current spot price established for the commodity/metal via the clock endpoint" }
  - { id: ERR_AP_NOT_APPROVED, http: 422, condition: "Authorized purchaser does not exist or is not in APPROVED status" }
  - { id: ERR_PRODUCT_NOT_ORDERABLE, http: 422, condition: "Order placement against a product in SCHEDULED or WITHDRAWN" }
  - { id: ERR_ORDER_NOT_PAYABLE, http: 422, condition: "pay called on an order whose payment_status != UNPAID or allocation_status != ALLOCATED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 422, condition: "cancel called on an order already RELEASED (CANCELLED)" }
  - { id: ERR_RUN_NOT_STARTABLE, http: 422, condition: "start called on a run not in PLANNED or REWORK, or whose linked order is not SCHEDULED/FULFILLING" }
  - { id: ERR_RUN_NOT_INSPECTABLE, http: 422, condition: "inspect called on a run not in STRIKING" }
  - { id: ERR_RUN_NOT_CANCELLABLE, http: 422, condition: "cancel called on a run in STRIKING, COMPLETED, or CANCELLED" }
  - { id: ERR_FEDORDER_NOT_CANCELLABLE, http: 422, condition: "cancel called on an order in FULFILLING, FULFILLED, SHORTFALL_RECORDED, or CANCELLED" }
  - { id: ERR_PROGRAM_NOT_DISBURSABLE, http: 422, condition: "disburse-surcharges called on a program not in SALES_CLOSED" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 422, condition: "billing-cycle called on a subscription not in ACTIVE" }
  - { id: ERR_BILLING_NOT_DUE, http: 422, condition: "billing-cycle called before next_billing_date" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 422, condition: "pay called on a PAID or WRITTEN_OFF invoice, or a FAILED invoice at 3 attempts" }
  - { id: ERR_ALLOCATION_NOT_CONFIRMABLE, http: 422, condition: "confirm called on an allocation not in OFFERED" }
  - { id: ERR_ALLOCATION_NOT_SETTLABLE, http: 422, condition: "settle called on an allocation not in CONFIRMED" }
  - { id: ERR_CASE_ALREADY_DESTROYED, http: 422, condition: "destroy called on a DESTROYED case" }
  - { id: ERR_LOT_NOT_RECEIVABLE, http: 422, condition: "receive called on a lot not in ORDERED" }
  - { id: ERR_PRODUCT_NOT_WITHDRAWABLE, http: 422, condition: "withdraw called on a WITHDRAWN product or one with ACTIVE/DUNNING subscriptions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the parent entity's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same user id on both sides of a segregated duty (disburser == program creator; settler == offerer; destroy certifier == reporter or certifiers equal)" }
  - { id: ERR_PRESS_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with a non-terminal run on the same (facility, press_line)" }
  - { id: ERR_RELEASE_GAP_VIOLATION, http: 409, condition: "Release datetime within 24 hours of another non-withdrawn product in the same family" }
  - { id: ERR_VAULT_CAPACITY_EXCEEDED, http: 422, condition: "Lot delivery would push the vault's same-day received tonnage past 50" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc would move the logical clock backwards" }
  - { id: ERR_DENOMINATION_EXISTS, http: 409, condition: "Denomination.code already exists" }
  - { id: ERR_PRODUCT_CODE_EXISTS, http: 409, condition: "NumismaticProduct.product_code already exists" }
  - { id: ERR_EMAIL_EXISTS, http: 409, condition: "Collector.email already exists" }
  - { id: ERR_DUPLICATE_SUBSCRIPTION, http: 409, condition: "An ACTIVE or DUNNING subscription already exists for this (collector, product)" }
  - { id: ERR_SUBSCRIPTION_NOT_ELIGIBLE_PRODUCT, http: 422, condition: "Subscription attempted for a product with subscription_eligible == false" }
  - { id: ERR_HOUSEHOLD_LIMIT_EXCEEDED, http: 422, condition: "Household aggregate units for the product would exceed household_order_limit" }
  - { id: ERR_POOL_INSUFFICIENT, http: 422, condition: "Allocation quantity exceeds issue.remaining_pool_units" }
  - { id: ERR_BLANKS_INSUFFICIENT, http: 422, condition: "Denomination blank stock below run.planned_quantity at start" }
  - { id: ERR_PROGRAM_MINTAGE_EXCEEDED, http: 422, condition: "Program products' mintage_limit sum would exceed max_mintage_legal" }
  - { id: ERR_QUALITY_THRESHOLD_BREACH, http: 422, condition: "Denomination trailing-30-day error rate >= 0.02 blocks striking" }
  - { id: ERR_ERRORCOIN_QUANTITY_EXCEEDS, http: 422, condition: "error_pieces exceeds the run's scrapped_pieces" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "amount_cents differs from the order's total_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only register as a collector"
    identity: opaque
    exclusive_operations: ["POST /mint/collectors"]
    shared_operations: []
  - name: PlatformAdmin
    description: "Mint platform operator; drives the logical clock and market data, seeds denominations, registers authorized purchasers, runs billing cycles"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /mint/denominations", "POST /mint/authorized-purchasers", "POST /mint/subscriptions/{id}/billing-cycle"]
    shared_operations: ["read endpoints across the surface"]
  - name: FedLiaison
    description: "Federal Reserve Bank liaison officer; submits and cancels circulating-coin orders"
    identity: opaque
    exclusive_operations: ["POST /mint/federal-reserve-orders", "POST /mint/federal-reserve-orders/{id}/cancel"]
    shared_operations: ["GET /mint/federal-reserve-orders/{id}", "GET /mint/production-runs", "GET /mint/production-runs/{id}"]
  - name: ProcurementOfficer
    description: "Metal procurement officer; creates and receives metal lots"
    identity: opaque
    exclusive_operations: ["POST /mint/metal-procurement-lots", "POST /mint/metal-procurement-lots/{id}/receive"]
    shared_operations: ["GET /mint/metal-procurement-lots/{id}", "GET /mint/reports/{report_type}"]
  - name: ProductionPlanner
    description: "Mint production planner; schedules, starts, and cancels production runs"
    identity: opaque
    exclusive_operations: ["POST /mint/production-runs", "POST /mint/production-runs/{id}/start", "POST /mint/production-runs/{id}/cancel"]
    shared_operations: ["GET /mint/production-runs", "GET /mint/production-runs/{id}", "GET /mint/federal-reserve-orders/{id}", "GET /mint/metal-procurement-lots/{id}", "GET /mint/production-runs/{id}/error-coin-cases", "GET /mint/reports/{report_type}"]
  - name: QualityInspector
    description: "Quality control inspector; inspects runs and reports error-coin cases; may never certify destruction of any case"
    identity: opaque
    exclusive_operations: ["POST /mint/production-runs/{id}/inspect", "POST /mint/error-coin-cases"]
    shared_operations: ["GET /mint/production-runs", "GET /mint/production-runs/{id}", "GET /mint/production-runs/{id}/error-coin-cases"]
  - name: DestructionCertifier
    description: "Destruction certification officer; certifies error-coin destruction with a second distinct certifier; segregated from reporting"
    identity: opaque
    exclusive_operations: ["POST /mint/error-coin-cases/{id}/destroy"]
    shared_operations: ["GET /mint/production-runs/{id}/error-coin-cases"]
  - name: ProgramManager
    description: "Numismatic program manager; creates programs, products, bullion issues; offers bullion allocations; withdraws products"
    identity: opaque
    exclusive_operations: ["POST /mint/commemorative-programs", "POST /mint/products", "POST /mint/products/{id}/withdraw", "POST /mint/bullion-issues", "POST /mint/bullion-issues/{id}/allocations"]
    shared_operations: ["GET /mint/commemorative-programs/{id}", "GET /mint/products", "GET /mint/products/{id}", "GET /mint/orders", "GET /mint/orders/{id}", "GET /mint/subscriptions", "GET /mint/subscriptions/{id}", "GET /mint/subscriptions/{id}/invoices", "GET /mint/bullion-issues/{id}", "GET /mint/allocations", "GET /mint/allocations/{id}", "GET /mint/reports/{report_type}"]
  - name: MintDirector
    description: "Mint director; approves/rejects program designs and manages authorized purchaser status"
    identity: opaque
    exclusive_operations: ["POST /mint/commemorative-programs/{id}/decide-design", "POST /mint/authorized-purchasers/{id}/set-status"]
    shared_operations: ["GET /mint/commemorative-programs/{id}", "GET /mint/products", "GET /mint/products/{id}", "GET /mint/orders", "GET /mint/orders/{id}", "GET /mint/federal-reserve-orders/{id}", "GET /mint/metal-procurement-lots/{id}", "GET /mint/production-runs", "GET /mint/production-runs/{id}", "GET /mint/bullion-issues/{id}", "GET /mint/allocations", "GET /mint/allocations/{id}", "GET /mint/production-runs/{id}/error-coin-cases", "GET /mint/reports/{report_type}"]
  - name: FinanceOfficer
    description: "Mint finance officer; disburses surcharges and settles bullion allocations; segregated from program creation and allocation offering"
    identity: opaque
    exclusive_operations: ["POST /mint/commemorative-programs/{id}/disburse-surcharges", "POST /mint/allocations/{id}/settle"]
    shared_operations: ["GET /mint/commemorative-programs/{id}", "GET /mint/products", "GET /mint/products/{id}", "GET /mint/federal-reserve-orders/{id}", "GET /mint/metal-procurement-lots/{id}", "GET /mint/bullion-issues/{id}", "GET /mint/allocations", "GET /mint/allocations/{id}", "GET /mint/reports/{report_type}"]
  - name: Collector
    description: "Registered collector; places and pays orders, manages subscriptions; identity is the Collector entity id"
    identity: "entity_backed:Collector"
    exclusive_operations: ["POST /mint/orders", "POST /mint/orders/{id}/pay", "POST /mint/orders/{id}/cancel", "POST /mint/subscriptions", "POST /mint/subscriptions/{id}/cancel", "POST /mint/subscription-invoices/{id}/pay"]
    shared_operations: ["GET /mint/products", "GET /mint/products/{id}", "GET /mint/orders", "GET /mint/orders/{id}", "GET /mint/subscriptions", "GET /mint/subscriptions/{id}", "GET /mint/subscriptions/{id}/invoices"]
  - name: BullionDealer
    description: "Authorized purchaser firm; confirms bullion allocations offered to it; identity is the AuthorizedPurchaser entity id"
    identity: "entity_backed:AuthorizedPurchaser"
    exclusive_operations: ["POST /mint/allocations/{id}/confirm"]
    shared_operations: ["GET /mint/bullion-issues/{id}", "GET /mint/allocations", "GET /mint/allocations/{id}"]
