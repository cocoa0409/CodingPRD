  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: pig_group_parallel_dimensions
        grounds:
          - state_machines.PigGroup
          - state_machines.PigGroupPhase
        distinguishing_aspect: |
          PigGroup carries two independent state dimensions: advancing the feed phase
          (STARTER->GROWER->FINISHER_1) never changes group_status, and delivering a load
          (PLACED->MARKETING) never changes current_phase. A linear machine cannot express
          this; the test interleaves transitions on both dimensions and asserts orthogonality.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 500 head placed 2026-03-02, target 2026-07-13"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /pig-groups/${group_id}/advance-phase", payload: {}, as: FieldTech, captures: { after_phase1: $.data.current_phase, status_after_phase1: $.data.group_status } }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-06-20", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 300 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 100, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-19T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-06-19T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
            - { call: "POST /truck-washes/${wash1}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator }
            - { call: "POST /market-loads/${load1}/deliver", payload: { live_weight_lbs_total: 26000 }, as: TransportCoordinator, captures: { status_after_deliver: $.data.load_status } }
          trigger:
            - { call: "POST /pig-groups/${group_id}/advance-phase", payload: {}, as: FieldTech }
            - { call: "GET /pig-groups/${group_id}", payload: {}, as: FieldTech }
          assert:
            - "After phase advance: current_phase == GROWER while group_status stays PLACED (captured: ${after_phase1}=GROWER, ${status_after_phase1}=PLACED)"
            - "After load delivery: load ${load1}.load_status == DELIVERED and group_status == MARKETING while current_phase stays GROWER"
            - "After second advance-phase: current_phase == FINISHER_1 and group_status still == MARKETING (dimensions independent)"
            - "PigGroup.${group_id}.head_marketed == 100 and head_current == 400"

      - name: settlement_dispute_cycle
        grounds:
          - state_machines.Settlement
        distinguishing_aspect: |
          Settlement machine is cyclic: FINALIZED -> DISPUTED -> FINALIZED (refinalize) can
          repeat — each refinalize REPLACES adjustment_cents (not accumulate). Round 1 sets
          +25000 (total 443000), round 2 sets -10000 (total 408000), then APPROVED -> PAID.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 100 head closed via one 100-head load @ 280 avg on 2026-07-13; feed 60000 lbs; no deductions"
            - "Settlement auto-created FINALIZED: base 400000, bonus 18000 (fcr 2.61 -> tier 0.30, adg 1.73 -> factor 0.5), total 418000"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 60000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { fo1: $.data.id } }
            - { call: "POST /feed-orders/${fo1}/schedule", payload: { scheduled_delivery_date: "2026-03-05" }, as: FeedMill }
            - { call: "POST /feed-orders/${fo1}/deliver", payload: { delivered_lbs: 60000 }, as: FeedMill }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 200, min_weight_lbs: 240, max_weight_lbs: 300 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 100, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-12T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-07-12T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
            - { call: "POST /truck-washes/${wash1}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load1}/deliver", payload: { live_weight_lbs_total: 28000 }, as: TransportCoordinator }
            - { call: "GET /settlements", payload: { group_id: "${group_id}" }, as: IntegratorAdmin, captures: { sett_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /settlements/${sett_id}/dispute", payload: { reason: "feed tally disputed" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "POST /settlements/${sett_id}/refinalize", payload: { adjustment_cents: 25000 }, as: FieldTech, captures: { tot_r1: $.data.total_pay_cents } }
            - { call: "POST /settlements/${sett_id}/dispute", payload: { reason: "still wrong" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "POST /settlements/${sett_id}/refinalize", payload: { adjustment_cents: -10000 }, as: FieldTech, captures: { tot_r2: $.data.total_pay_cents } }
            - { call: "POST /settlements/${sett_id}/approve", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /settlements/${sett_id}/pay", payload: {}, as: IntegratorAdmin, as_user_id: "adm_2" }
          assert:
            - "At creation: settlement_status FINALIZED, base_pay_cents == 400000, bonus_cents == 18000, total_pay_cents == 418000"
            - "After dispute+refinalize(+25000): status FINALIZED, adjustment_cents == 25000, total_pay_cents == 443000 (${tot_r1})"
            - "After second dispute+refinalize(-10000): adjustment_cents == -10000 (replaced, not accumulated), total_pay_cents == 408000 (${tot_r2})"
            - "Final: settlement_status == PAID; Grower.${grower_id}.lifetime_paid_cents == 408000"
            - "Cycle proof: DISPUTED -> FINALIZED transition executed twice on one settlement"

  # ---------------------------------------------------------------- rule 4
  - rule_id: transitive_cascade
    instances:
      - name: cascade_delivery_to_settlement_creation
        grounds:
          - state_machines.MarketLoad.DISPATCHED_to_DELIVERED
          - state_machines.PigGroup
          - calculations.settlement_pay
        distinguishing_aspect: |
          Depth-3 transitive chain fired by ONE trigger call (deliver of the last load):
          MarketLoad -> DELIVERED mutates PigGroup (head_marketed/head_current); that mutation
          itself fires group auto-close (CLOSED, barn -> WASH_REQUIRED); the close in turn
          mints a FINALIZED Settlement with computed pay. Trigger = POST /market-loads/{id}/deliver.
