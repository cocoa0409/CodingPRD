            - "FinancingAgreement.${a2}.monthly_amount_cents == 7380 (RENT_TO_OWN 1.2% flat)"
            - "Both agreements status == APPLIED"

      - name: rent_to_own_purchase_credit_and_conversion
        claim_type: correct_result
        grounds: [calculations.financing_schedule, entities.FinancingAgreement.fields.purchase_credit_cents, state_machines.FinancingAgreement.ACTIVE_to_CONVERTED_TO_PURCHASE]
        distinguishing_aspect: "Purchase credit accrues per posted payment: after 3 RTO payments credit == round(0.60 * 7380 * 3) == 13284 and conversion flips the order to PAID_IN_FULL."
        test_recipe:
          setup: ["Customer (credit 1000000); order total 615000; RENT_TO_OWN agreement APPROVED at default clock; 3 monthly payments of 7380 posted"]
