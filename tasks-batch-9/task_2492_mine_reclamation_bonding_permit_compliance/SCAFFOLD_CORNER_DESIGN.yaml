  # ===========================================================================
  # complexity_layers sweep: optimistic_concurrency (both §1.2.1 rules),
  # rate_threshold_triggers, and stubs where §1.8 already owns the layer.
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_permit_version_on_estimate_acceptance_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[estimate-accept-stale-permit]
          - errors[ERR_STALE_PERMIT_VERSION]
          - validations[priority=8]
          - state_machines.ReclamationCostEstimate.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: "Two SUBMITTED estimates read at the same permit version: accepting the 6500.00 estimate bumps the version and re-prices the bond to 938164.50, after which the 6000.00 estimate's acceptance carrying the original version returns ERR_STALE_PERMIT_VERSION (412) and succeeds only after re-reading."
        test_recipe:
          setup:
            - "One operator, one site, one APPLICATION_SUBMITTED 120-acre permit."
            - "Two SUBMITTED estimates on that permit, both effective 2026-07-01: estimate A at 6000.00/acre and estimate B at 6500.00/acre."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Two Estimates Mining", tangible_net_worth: 16200000.00, fixed_assets_in_state: 7980000.00, total_liabilities: 5140000.00, net_income_prior_year: 660000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op56_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Two Estimates Pit", county: "Pinal", total_acres: 280.00 }
              as: ProgramDirector
              captures: { c_site56_id: $.data.id }
            - call: "POST /mining/permits"
