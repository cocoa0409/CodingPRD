  - rule_id: resource_temporal_overlap
    instances:
      - name: hv_bay_aggregate_capacity_with_half_open_adjacent_windows
        resource_entity: ServiceCenter
        interval_semantics: "half-open [start, end), AGGREGATE occupancy counted against hv_bay_count"
        grounds:
          - calculations.hv_bay_window_conflict
          - validations[priority=54]
          - entities.ServiceCenter.fields.hv_bay_count
          - entities.WarrantyClaim.fields.hv_bay_window_start
        distinguishing_aspect: |
          The bay rule is an AGGREGATE count over half-open intervals at a single-bay center: the
          back-to-back window that starts exactly when the first one ends is ACCEPTED (shared instant,
          no overlap), while a later window that straddles both booked windows is refused - so the
          same [13:00, 15:00) request that fails against two neighbours succeeds once moved to
          [18:00, 20:00).
        test_recipe:
          setup:
            - "One L3 center with a pack lift and hv_bay_count 1, insulation tester due 2027-01-01."
            - "THREE technicians (A, B, C), each L3, so no cooldown high-water mark is shared and the bay rule is isolated."
            - "Three vehicles in service 2020-03-10, each with retention 70.00 % and two faulted modules, each claim adjudicated MODULE_REPLACEMENT (remedy_cost_cents 363092)."
