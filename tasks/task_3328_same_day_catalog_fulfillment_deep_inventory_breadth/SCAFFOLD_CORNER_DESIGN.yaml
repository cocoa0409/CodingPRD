              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: DCManager
              as_user_id: "dcm-mo"
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: DCManager
              as_user_id: "dcm-mo"
              captures: { error_id: $.data.error_id }
          assert:
            - "the owning account's GET returns 200 with CatalogOrder.order_status == DRAFT"
            - "the DCManager's GET of the same order also returns 200 with the identical order_status and line_count"
            - "the DCManager's release attempt returns 403 with error_id == ERR_UNAUTHORIZED, so the read was shared but the write was not"
            - "the order's version is unchanged by the denied release"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_version_on_allocate_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-allocate-stale-order]
          - validations[priority=7]
          - errors.ERR_STALE_VERSION
          - state_machines.CatalogOrder.RELEASED_AWAITING_RELEASE_to_RELEASED_ALLOCATED
        distinguishing_aspect: "The allocate OCC rule is enforced against a captured version: the same request that succeeded with the observed version is refused 412 ERR_STALE_VERSION once the order has been released again through the RELEASED -> DRAFT -> RELEASED cycle, so the check is a stale-version test and not a state test."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One DC BOS, one account, one curated item with 10 units of stock, one DRAFT order of 1 unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "OC-1001", description: "OCC probe item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { observed_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${observed_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${observed_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first allocate succeeds with 200 and CatalogOrder.${order_id}.fulfillment_status == ALLOCATED"
            - "the third call, re-using the version captured before the first allocate, returns 412 with error_id == ERR_STALE_VERSION"
            - "the stale call is refused on the version and not on the state, because CatalogOrder.${order_id}.order_status is still RELEASED"
            - "the order's version advances by exactly 1 on each successful mutation and not on the rejected one"

      - name: order_line_count_is_reconciled_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CatalogOrder.fields.line_count
          - entities.CatalogOrder.fields.order_total_cents
          - endpoints.POST_/orders/{id}/cancel
        distinguishing_aspect: "The denormalized line_count and order_total_cents are reconciled on every mutation, including a mutation on a different axis: cancelling an ALLOCATED order clears the fee and rolls the fulfillment axis back while line_count still reports the lines that remain on the order."
        test_recipe:
