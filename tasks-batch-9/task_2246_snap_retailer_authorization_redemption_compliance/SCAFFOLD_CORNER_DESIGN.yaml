            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "COMMERCIAL_POS_INTEGRATION", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_pos_id: $.data.id }
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "RECEIPT_PAPER_CASE", qty: 2 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_paper_id: $.data.id }
            - call: "POST /equipment-orders/${order_pos_id}/place"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "POST /equipment-orders/${order_pos_id}/fulfill"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /equipment-orders/${order_paper_id}/cancel"
