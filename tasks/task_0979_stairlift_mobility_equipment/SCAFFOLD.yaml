  - method: GET
    path: "/stairlift-ops/agreements/{id}/removal-jobs"
    description: "List RemovalJobs for Agreement"
    roles: [PlatformAdmin, InstallCoordinator, SalesRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RemovalJob[]"
    side_effects: []

  - method: GET
    path: "/stairlift-ops/removal-jobs/{id}"
    description: "Get a RemovalJob"
    roles: [PlatformAdmin, InstallCoordinator, SalesRep]
    code: 200
    input: []
    output: RemovalJob
    side_effects: []

  - method: POST
    path: "/stairlift-ops/removal-jobs/{id}/complete"
