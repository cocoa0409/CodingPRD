      - name: corner_calc_pet_stay_multiplier_is_applied_before_the_ceiling
        claim_type: Constants Applied
        grounds:
          - calculations.turnover_window_and_requirement.constants.PET_CLEAN_MULTIPLIER
          - entities.Booking.fields.pet_stay
          - entities.Turnover.fields.required_minutes
        distinguishing_aspect: |
          PET_CLEAN_MULTIPLIER 1.20 scales the raw requirement and only then is the ceiling
          taken: 150 + 24 + 24 == 198 raw, 198 * 1.20 == 237.6, ceil -> 238. Two identical
          TWO_BR units differing only in the outgoing booking's pet_stay flag therefore return
          238 versus 198, which flips is_tight (slack 32 vs 72) on the same 270-minute window.
          Rounding after the ceiling (ceil(198) * 1.2 == 237.6 -> 238) coincides here, but
          multiplying the min_clean_minutes floor instead would give 144.
        test_recipe:
          setup:
            - "Properties P1 (AUS-101) and P1P (AUS-121) are identical TWO_BR units: 2 bathrooms, 3 beds, local_utc_offset_minutes -300, min_clean_minutes 120."
            - "Each carries one outgoing booking checking out at 2026-08-08T16:00:00Z and one incoming booking arriving at 2026-08-08T21:00:00Z, so both windows are exactly 270 minutes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-121", name: "Barton Loft Pet Twin", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner21@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1p: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest No Pet", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id", b_pet: "$.data.pet_stay" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1p}", external_ref: "OUT-21", guest_name: "Guest With Pet", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z", party_size: 2, pet_stay: true }
              as: Coordinator
              captures: { bp_out: "$.data.id", bp_pet: "$.data.pet_stay" }
            - call: "POST /bookings"
              payload: { property_id: "${p1p}", external_ref: "IN-21", guest_name: "Guest In Twin", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { bp_in: "$.data.id" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t_plain: "$.data.id", plain_req: "$.data.required_minutes", plain_min: "$.data.window_minutes", plain_slack: "$.data.slack_minutes", plain_tight: "$.data.is_tight" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${bp_out}", incoming_booking_id: "${bp_in}" }
              as: Coordinator
              captures: { t_pet: "$.data.id", pet_req: "$.data.required_minutes", pet_min: "$.data.window_minutes", pet_slack: "$.data.slack_minutes", pet_tight: "$.data.is_tight", pet_esc: "$.data.escalation_required" }
          assert:
            - "${b_pet} == false (declared default) and ${bp_pet} == true"
            - "${plain_req} == 198, ${plain_min} == 270, ${plain_slack} == 72, ${plain_tight} == false"
            - "${pet_req} == 238 (ceil(198 * 1.20) == ceil(237.6)), ${pet_min} == 270, ${pet_slack} == 32"
            - "${pet_tight} == true (32 < TIGHT_SLACK_MINUTES 45) and ${pet_esc} == false (slack is still non-negative)"

      - name: corner_calc_checkout_clamped_variant_recomputes_without_refusing
        claim_type: Variant Selection
        grounds:
          - calculations.turnover_window_and_requirement.variants
          - endpoints["POST /bookings/{id}/checkout"].side_effects
          - entities.Turnover.fields.escalation_required
          - entities.Booking.fields.actual_checkout_at
        distinguishing_aspect: |
          The creation_strict variant would have refused a 60-minute window against
          required_minutes 198 with ERR_WINDOW_OVERRIDE_REQUIRED; the checkout_clamped variant
          selected by POST /bookings/{id}/checkout never refuses. A guest who actually leaves
          at 19:30Z pushes window_start_at to the MAX of contracted/late/actual, giving
          window_minutes 60, slack_minutes -138 and escalation_required true - with HTTP 200,
          not 422. The gate stays OPEN because the window did not collapse to 0.
        test_recipe:
          setup:
            - "P1 with T1 created at window 16:00Z-20:30Z (270 minutes, required 198, slack 72, escalation_required false, version 1)."
            - "Logical clock advanced to 2026-08-08T19:30:00Z, after the contracted checkout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", pre_min: "$.data.window_minutes", pre_slack: "$.data.slack_minutes", pre_esc: "$.data.escalation_required", pre_ver: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T19:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${b_out}/checkout"
              payload: { actual_checkout_at: "2026-08-08T19:30:00Z" }
              as: Coordinator
              captures: { bk_status: "$.data.status", bk_actual: "$.data.actual_checkout_at" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { post_start: "$.data.window_start_at", post_end: "$.data.window_end_at", post_min: "$.data.window_minutes", post_req: "$.data.required_minutes", post_slack: "$.data.slack_minutes", post_tight: "$.data.is_tight", post_esc: "$.data.escalation_required", post_ver: "$.data.version", post_status: "$.data.status" }
            - call: "GET /bookings/${b_in}"
              payload: {}
              as: Coordinator
              captures: { in_gate: "$.data.checkin_gate", in_notice: "$.data.guest_notice_code" }
          assert:
            - "${pre_min} == 270, ${pre_slack} == 72, ${pre_esc} == false, ${pre_ver} == 1"
            - "HTTP 200 - no ERR_WINDOW_OVERRIDE_REQUIRED and no ERR_CLEANING_WINDOW_NON_POSITIVE"
            - "${bk_status} == CHECKED_OUT and ${bk_actual} == 2026-08-08T19:30:00Z"
            - "${post_start} == 2026-08-08T19:30:00Z (MAX of contracted 16:00Z, late null, actual 19:30Z)"
            - "${post_end} == 2026-08-08T20:30:00Z, ${post_min} == 60, ${post_req} == 198"
            - "${post_slack} == -138, ${post_tight} == true, ${post_esc} == true"
            - "${post_ver} == 2 and ${post_status} == PENDING_ASSIGNMENT (the window moved; the workflow did not)"
            - "${in_gate} == OPEN and ${in_notice} == NONE (only a 0-minute window blocks arrival)"

      - name: corner_calc_match_score_tie_is_broken_by_higher_skill_level_not_by_created_at
        claim_type: weighted_scoring
        grounds:
          - calculations.cleaner_match_score
          - entities.Assignment.fields.match_score
          - entities.Assignment.fields.selection_mode
        distinguishing_aspect: |
          Two ACTIVE ZONE_A cleaners tie at match_score exactly 0.8500 on a min_skill_level 1
          property by different routes: skill 4 with quality 70.00 (0.3500 + 0.3000 + 0.2000)
          and skill 2 with quality 90.00 (0.4500 + 0.3000 + 0.1000). Tie-break rule 1 is higher
          skill_level, so the LOWER-quality cleaner wins; the higher-quality cleaner was also
          created first, proving rule 1 outranks the created_at fallback and that id never
          decides.
        test_recipe:
          setup:
