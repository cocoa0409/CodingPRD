      - name: defeasance_cascade_down_to_items_and_engagement
        claim_type: cascade_down
        grounds:
          - state_machines[BondIssue].OUTSTANDING->DEFEASED
          - state_machines[Undertaking.status].ACTIVE->TERMINATED
          - state_machines[AnnualReportCycle].DRAFTING->CLOSED_NOT_REQUIRED
          - state_machines[CycleContentItem].DRAFT->VOID
        excluded_because:
          difficulty_instance: defeasance_cascades_four_hops_to_items_and_engagement
          rationale: >-
            That §1.8 instance already walks the full parent-to-descendant chain
            BondIssue -> Undertaking -> AnnualReportCycle -> CycleContentItem plus the 2b hop to
            DisseminationEngagement in one request, and additionally asserts that only
            non-terminal descendants are touched (an already-WITHDRAWN cycle and its VOID items
            are left alone) and that the created_at ASC processing order is respected. A separate
            corner test would only re-run a subset of the same request.

      - name: late_confirmation_cross_entity_adjustment
        claim_type: cross_entity
        grounds:
          - state_machines[AnnualReportCycle].FILING_IN_PROGRESS->FILED_LATE
          - state_machines[FailureToFileEvent].OPEN->REMEDIATION_PENDING
          - state_machines[OfficialStatement].COMPLIANCE_REVIEW
        excluded_because:
          difficulty_instance: late_confirmation_cascades_five_hops_into_official_statement_adequacy
          rationale: >-
            A confirm on one Filing is the scaffold's widest cross-entity fan-out — cycle,
            FailureToFileEvent, Undertaking counters and posture, DisseminationEngagement invoice,
            and every COMPLIANCE_REVIEW OfficialStatement sharing the issuer_program_code. That
            §1.8 instance asserts each affected row's state AND fields hop by hop, which is
            exactly what this claim type asks for.

      - name: withdrawal_compensates_the_obligation_count
        claim_type: compensation
        grounds:
          - state_machines[AnnualReportCycle].DRAFTING->WITHDRAWN
          - calculations.undertaking_open_obligation_count
        excluded_because:
          difficulty_instance: cycle_withdrawal_restores_the_open_obligation_count_exactly
          rationale: >-
            Withdrawal is the scaffold's undo edge, and that §1.8 instance already asserts the
            before/after equality of open_obligation_count across the withdraw, plus the VOID
            cascade on every item and the return of completeness_score_pct to 0.00 with no drift.
            The confirmed-correction invariant in
            confirmed_correction_conserves_billable_filing_count_and_invoice_total covers the
            second compensating pair.

      - name: submit_guarded_on_the_engagement_state
        claim_type: guarded_transitions
        grounds:
          - state_machines[Filing].DRAFT->SUBMITTED
          - validations.priority_11
          - errors[ERR_ENGAGEMENT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: filing_submission_gated_on_engagement_status_with_calendar_ack_as_the_cure
          rationale: >-
            "Filing A may go DRAFT->SUBMITTED only if DisseminationEngagement C is ACTIVE" is
            precisely the guarded-transition claim, and that §1.8 instance tests it in both
            directions: refused while the engagement is SUSPENDED by the monitoring sweep, then
            accepted unchanged once the calendar acknowledgement restores it.

  - section: calculations
