  - rule_id: priority_pair_validation_conflict
    instances:
    - name: invalid_state_outranks_budget_exceeded_on_confirm
      grounds:
      - validations[priority=12]
      - validations[priority=38]
      - state_machines.PostAssignment.TENTATIVE_to_CONFIRMED
      - calculations.plan_cost_and_hours_ledger
      distinguishing_aspect: 'One request violates both the state guard (priority 12, the row is already CANCELLED) and the fiscal guard (priority 38, its 30000-cent line cost exceeds the 23500 cents left in the budget). The pair is discriminating because the two rules return different HTTP statuses — 409 vs 402 — so an implementation that checks affordability before liveness is caught by the status code alone, and the control CONFIRM on an identical but still-TENTATIVE row proves the fiscal rule really would have fired.

        '
      test_recipe:
