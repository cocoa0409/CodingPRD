# =============================================================================
# Task 0779 — Personal-Cause & Medical Fundraiser (GoFundMe-style)
# Difficulty: EXPERT
# =============================================================================

scenario: |
  Personal-Cause & Medical Fundraiser (GoFundMe style): campaign creation &
  goal/story, beneficiary verification & withdrawal setup, donation &
  tip/optional-fee, share & update/thank-you, team/organizer roles,
  dispute/fraud & refund, payout (Stripe) & hold, tax-receipt/non-deductible
  disclosure

domain_name: medical-fundraiser
api_prefix: /

complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer actor entities (Organizer, Beneficiary, Donor) linked to Campaign and
  # its financial children (Donation, Payout, Dispute, Refund, Hold, Update,
  # FeaturePlacement) by foreign keys. TeamMember is a many-to-many junction
  # between Organizer and Campaign. No URL nesting: every resource lives at a
  # flat /<collection>/{id} path; children reference parents via FK body fields.

  state_machine_shape: parallel
  # Campaign carries two independent state axes: lifecycle_status
  # (DRAFT->ACTIVE->...) and payout_posture (OPEN/HOLD/FROZEN), which evolve
  # independently. Dispute is cyclic (UNDER_REVIEW<->NEEDS_INFO). Payout is
  # branching (REQUESTED -> {PROCESSING->PAID, ON_HOLD, FAILED, CANCELLED}).

  relationship_patterns:
    - one_to_many        # Campaign -> Donation/Payout/Update/Hold/FeaturePlacement
    - many_to_many       # Organizer <-> Campaign via TeamMember
    - cross_aggregate    # Dispute (on Donation) cascades onto Campaign & Payout

  role_model: peer_roles
  # Organizer / Beneficiary / Donor each own distinct resource types;
  # TrustSafetyAgent and PlatformAdmin are opaque operational roles, the latter
  # a hierarchical superset for clock and feature-placement operations.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organizer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Organizer public display name" }
      - { name: email, type: string, source: input, description: "Organizer contact email" }
      - { name: total_dispute_count, type: integer, source: computed, description: "Count of Disputes (any status) on Donations belonging to Campaigns where this Organizer is organizer_id" }
      - { name: upheld_dispute_count, type: integer, source: computed, description: "Count of Disputes in status UPHELD on Donations of this Organizer's Campaigns" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Sum of Refund.amount_cents across Donations of this Organizer's Campaigns" }
      - { name: raised_cents, type: integer, source: computed, description: "Sum of net_to_campaign_cents over CAPTURED Donations across this Organizer's Campaigns" }
      - { name: has_unverified_beneficiary, type: boolean, source: computed, description: "True iff at least one Campaign of this Organizer has a Beneficiary whose verification_status != VERIFIED" }
      - { name: strict_risk_score, type: integer, source: computed, description: "Risk score variant STRICT (uses total_dispute_count); see calculations.entity_risk_score" }
      - { name: lenient_risk_score, type: integer, source: computed, description: "Risk score variant LENIENT (uses upheld_dispute_count); see calculations.entity_risk_score" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Beneficiary legal name for KYC" }
      - { name: email, type: string, source: input, description: "Beneficiary contact email" }
      - { name: stripe_account_ref, type: string, source: system, description: "Connected Stripe account reference; null until withdrawal-setup completes" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | PENDING | VERIFIED | REJECTED", default: UNVERIFIED }
      - { name: withdrawal_ready, type: boolean, source: computed, description: "True iff verification_status == VERIFIED AND stripe_account_ref is not null" }
      - { name: total_paid_out_cents, type: integer, source: computed, description: "Sum of amount_cents over PAID Payouts to this Beneficiary minus REVERSED payouts" }
      - { name: last_payout_settled_at, type: datetime, source: system, description: "settled_at of the most recent PAID Payout to this Beneficiary; null if none. Used for payout cooldown", default: null }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Donor public display name" }
      - { name: email, type: string, source: input, description: "Donor contact email" }
      - { name: is_anonymous_default, type: boolean, source: input, default: false, description: "Default anonymity applied to this donor's Donations when is_anonymous omitted" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: organizer_id, type: string, source: system, description: "FK -> Organizer.id; the creating Organizer (from X-User-ID). Also the initial OWNER TeamMember" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; recipient of funds" }
      - { name: title, type: string, source: input, description: "Campaign title" }
      - { name: story, type: string, source: input, description: "Campaign story / narrative body" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal in cents", constraints: "must be > 0" }
      - { name: category, type: enum, source: input, description: "MEDICAL | MEMORIAL | EMERGENCY | OTHER" }
      - { name: is_charity, type: boolean, source: input, default: false, description: "Whether the beneficiary is a registered charity (affects tax deductibility)" }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | COMPLETED | CANCELLED", default: DRAFT }
      - { name: payout_posture, type: enum, source: computed, description: "OPEN | HOLD | FROZEN — derived: FROZEN if beneficiary REJECTED; else HOLD if any ACTIVE Hold; else OPEN. See calculations.campaign_payout_posture" }
      - { name: raised_cents, type: integer, source: computed, description: "Sum of net_to_campaign_cents over CAPTURED Donations of this Campaign" }
      - { name: reserve_total_cents, type: integer, source: computed, description: "Sum over CAPTURED Donations of round_half_up(net_to_campaign_cents * RESERVE_RATE); rounded PER DONATION then summed" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of amount_cents over Payouts of this Campaign in status REQUESTED, PROCESSING, or PAID" }
      - { name: paid_out_cents, type: integer, source: computed, description: "Sum of amount_cents over PAID Payouts of this Campaign minus REVERSED payouts" }
      - { name: disputed_locked_cents, type: integer, source: computed, description: "Sum of net_to_campaign_cents over CAPTURED Donations of this Campaign that have a Dispute in status OPEN, UNDER_REVIEW, or NEEDS_INFO" }
      - { name: hold_locked_cents, type: integer, source: computed, description: "Sum of locked_amount_cents over ACTIVE Holds of this Campaign" }
      - { name: provisional_available_cents, type: integer, source: computed, description: "raised_cents - reserve_total_cents - committed_cents (optimistic; open disputes and holds ignored). See calculations.campaign_available variant PROVISIONAL" }
      - { name: settled_available_cents, type: integer, source: computed, description: "provisional_available_cents - disputed_locked_cents - hold_locked_cents (pessimistic). See calculations.campaign_available variant SETTLED" }
      - { name: tax_disclosure, type: string, source: computed, description: "'TAX_DEDUCTIBLE' if is_charity else 'NOT_TAX_DEDUCTIBLE'; non-deductible disclosure surfaced to donors" }

  - name: TeamMember
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: organizer_id, type: string, source: input, description: "FK -> Organizer.id" }
      - { name: team_role, type: enum, source: input, description: "OWNER | CO_ORGANIZER | WITHDRAWAL_MANAGER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED", default: ACTIVE }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; must equal X-User-ID of the acting Donor" }
      - { name: amount_cents, type: integer, source: input, description: "Gift amount in cents (goes to the campaign)", constraints: "must be integer >= MIN_DONATION_CENTS (100)" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Optional platform tip in cents (goes to the platform, not the campaign)" }
      - { name: is_anonymous, type: boolean, source: input, description: "Whether to hide donor identity; defaults to donor.is_anonymous_default when omitted" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "Payment processing fee; see calculations.donation_charge_breakdown" }
      - { name: total_charged_cents, type: integer, source: computed, description: "Amount the donor's card is charged = amount + tip + processing fee (grossed up); see calculations.donation_charge_breakdown" }
      - { name: net_to_campaign_cents, type: integer, source: computed, description: "Amount credited to the campaign = amount_cents (tip and fee excluded)" }
      - { name: reserve_cents, type: integer, source: computed, description: "round_half_up(net_to_campaign_cents * RESERVE_RATE); per-donation chargeback reserve" }
      - { name: status, type: enum, source: system, description: "CAPTURED | REFUNDED", default: CAPTURED }
      - { name: tax_receipt_status, type: enum, source: computed, description: "DEDUCTIBLE if parent Campaign.is_charity else NON_DEDUCTIBLE" }
      - { name: thanked, type: boolean, source: system, default: false, description: "Set true when a THANK_YOU Update references this Donation" }

  - name: Update
    parent: null
    common_fields: false
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: update_type, type: enum, source: input, description: "UPDATE | THANK_YOU" }
      - { name: body, type: string, source: input, description: "Update / thank-you text body" }
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id; optional target of a THANK_YOU; null for a general UPDATE", default: null }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; copied from the Campaign at request time" }
      - { name: amount_cents, type: integer, source: input, description: "Requested withdrawal amount in cents", constraints: "must be integer > 0" }
      - { name: scheduled_at, type: datetime, source: input, default: null, description: "When the payout should run; defaults to the current logical clock when omitted. Used for beneficiary payout cooldown" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PROCESSING | PAID | ON_HOLD | FAILED | REVERSED | CANCELLED", default: REQUESTED }
      - { name: stripe_payout_ref, type: string, source: system, default: null, description: "Stripe payout reference; set on settle" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the payout reached PAID" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id" }
      - { name: reason, type: enum, source: input, description: "FRAUD | UNAUTHORIZED | NOT_AS_DESCRIBED | OTHER" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | NEEDS_INFO | UPHELD | REJECTED", default: OPEN }
      - { name: resolution_note, type: string, source: system, default: null, description: "Free-text note recorded on uphold/reject" }

  - name: Refund
    parent: null
    common_fields: false
    fields:
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id" }
      - { name: dispute_id, type: string, source: input, description: "FK -> Dispute.id; null for a direct donor-requested refund", default: null }
      - { name: amount_cents, type: integer, source: system, description: "= parent Donation.net_to_campaign_cents; amount clawed back from the campaign" }
      - { name: reason, type: enum, source: input, description: "REQUESTED_BY_DONOR | DISPUTE_UPHELD" }

  - name: Hold
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: reason, type: string, source: input, description: "Reason the hold was placed" }
      - { name: severity, type: enum, source: input, description: "STANDARD | CRITICAL" }
      - { name: locked_amount_cents, type: integer, source: input, default: 0, description: "Amount of settled_available to lock while this Hold is ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE }

  - name: FeaturePlacement
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: category, type: enum, source: input, description: "HOMEPAGE | MEDICAL | EMERGENCY — the placement surface" }
      - { name: slot_index, type: integer, source: input, description: "Slot number within the (category) surface; a (category, slot_index) pair is an exclusive resource" }
      - { name: window_start, type: datetime, source: input, description: "Placement window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Placement window end (exclusive)", constraints: "must be > window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED | EXPIRED", default: BOOKED }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Campaign axis 1: lifecycle ---
  - entity: Campaign
    field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{id}/publish"
        actor: Organizer
        preconditions:
          - "Acting Organizer is an ACTIVE TeamMember with team_role OWNER on this Campaign (else ERR_FORBIDDEN)"
          - "goal_cents > 0"
        side_effects:
          - "lifecycle_status -> ACTIVE; donations now accepted"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /campaigns/{id}/pause"
        actor: Organizer
        preconditions:
          - "lifecycle_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status -> PAUSED; new donations rejected with ERR_CAMPAIGN_NOT_ACTIVE"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /campaigns/{id}/resume"
        actor: Organizer
        preconditions:
          - "lifecycle_status == PAUSED (else ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status -> ACTIVE"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /campaigns/{id}/complete"
        actor: Organizer
        preconditions:
          - "lifecycle_status IN {ACTIVE, PAUSED} (else ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status -> COMPLETED; new donations rejected; payouts still allowed"

      - from: PAUSED
        to: COMPLETED
        trigger: "POST /campaigns/{id}/complete"
        actor: Organizer
        preconditions:
          - "lifecycle_status IN {ACTIVE, PAUSED}"
        side_effects:
          - "same as ACTIVE -> COMPLETED"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: Organizer
        preconditions:
          - "lifecycle_status IN {DRAFT, ACTIVE, PAUSED} (else ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status -> CANCELLED"
          - "Cascade: every Payout of this Campaign in status {REQUESTED, PROCESSING, ON_HOLD} -> CANCELLED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: Organizer
        preconditions:
          - "lifecycle_status IN {DRAFT, ACTIVE, PAUSED}"
        side_effects:
          - "lifecycle_status -> CANCELLED"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: Organizer
        preconditions:
          - "lifecycle_status IN {DRAFT, ACTIVE, PAUSED}"
        side_effects:
          - "same as ACTIVE -> CANCELLED (cascade payouts to CANCELLED)"

  # --- Campaign axis 2: payout_posture (independent, computed) ---
  - entity: Campaign
    field: payout_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: HOLD
        trigger: "system — recomputed when a Hold on this Campaign becomes ACTIVE (POST /holds)"
        actor: system
        preconditions:
          - "At least one ACTIVE Hold; beneficiary.verification_status != REJECTED"
        side_effects:
          - "payout_posture -> HOLD; new Payout requests rejected with ERR_PAYOUT_ON_HOLD"

      - from: HOLD
        to: OPEN
        trigger: "system — recomputed when the last ACTIVE Hold is released (POST /holds/{id}/release)"
        actor: system
        preconditions:
          - "No ACTIVE Holds; beneficiary.verification_status != REJECTED"
        side_effects:
          - "payout_posture -> OPEN"

      - from: OPEN
        to: FROZEN
        trigger: "system — recomputed when the Campaign's Beneficiary transitions to REJECTED (POST /beneficiaries/{id}/reject-verification)"
        actor: system
        preconditions:
          - "beneficiary.verification_status == REJECTED"
        side_effects:
          - "payout_posture -> FROZEN; all payout operations blocked"
          - "Cascade: every Payout of this Campaign in status {REQUESTED, PROCESSING, ON_HOLD} -> CANCELLED"

      - from: HOLD
        to: FROZEN
        trigger: "system — Beneficiary transitions to REJECTED while a Hold is ACTIVE"
        actor: system
        preconditions:
          - "beneficiary.verification_status == REJECTED"
        side_effects:
          - "same as OPEN -> FROZEN"

      - from: FROZEN
        to: OPEN
        trigger: "system — recomputed when Beneficiary is re-approved to VERIFIED and no ACTIVE Holds remain"
        actor: system
        preconditions:
          - "beneficiary.verification_status == VERIFIED; no ACTIVE Holds"
        side_effects:
          - "payout_posture -> OPEN"

  # --- Beneficiary verification ---
  - entity: Beneficiary
    field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING
        trigger: "POST /beneficiaries/{id}/submit-verification"
        actor: Beneficiary
        preconditions:
          - "stripe_account_ref is not null (withdrawal setup complete, else ERR_WITHDRAWAL_NOT_READY)"
        side_effects:
          - "verification_status -> PENDING"

      - from: REJECTED
        to: PENDING
        trigger: "POST /beneficiaries/{id}/submit-verification"
        actor: Beneficiary
        preconditions:
          - "stripe_account_ref is not null"
        side_effects:
          - "verification_status -> PENDING (resubmission loop)"

      - from: PENDING
        to: VERIFIED
        trigger: "POST /beneficiaries/{id}/approve-verification"
        actor: TrustSafetyAgent
        preconditions:
          - "verification_status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "verification_status -> VERIFIED"
          - "Every Campaign of this Beneficiary recomputes payout_posture (may leave FROZEN -> OPEN)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /beneficiaries/{id}/reject-verification"
        actor: TrustSafetyAgent
        preconditions:
          - "verification_status IN {PENDING, VERIFIED} (else ERR_INVALID_STATE)"
        side_effects:
          - "verification_status -> REJECTED"
          - "Cascade level 1: every Campaign of this Beneficiary recomputes payout_posture -> FROZEN"
          - "Cascade level 2: each such Campaign's Payouts in {REQUESTED, PROCESSING, ON_HOLD} -> CANCELLED"

      - from: VERIFIED
        to: REJECTED
        trigger: "POST /beneficiaries/{id}/reject-verification"
        actor: TrustSafetyAgent
        preconditions:
          - "verification_status IN {PENDING, VERIFIED} (T&S revocation on discovered fraud)"
        side_effects:
          - "same cascade as PENDING -> REJECTED (freeze campaigns, cancel non-terminal payouts)"

  # --- Donation ---
  - entity: Donation
    field: status
    initial_state: CAPTURED
    terminal_states: [REFUNDED]
    transitions:
      - from: CAPTURED
        to: REFUNDED
        trigger: "system — a Refund is created (POST /donations/{id}/refund, or cascade from Dispute uphold)"
        actor: system
        preconditions:
          - "Donation.status == CAPTURED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> REFUNDED"
          - "Campaign.raised_cents -= net_to_campaign_cents; reserve_total_cents, provisional_available_cents, settled_available_cents recomputed"
          - "If donation was disputed_locked, disputed_locked_cents recomputed"

  # --- Dispute (cyclic: UNDER_REVIEW <-> NEEDS_INFO) ---
  - entity: Dispute
    field: status
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/assign"
        actor: TrustSafetyAgent
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /disputes/{id}/request-info"
        actor: TrustSafetyAgent
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> NEEDS_INFO"

      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/provide-info"
        actor: Donor
        preconditions:
          - "status == NEEDS_INFO (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> UNDER_REVIEW (review loop repeats)"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/uphold"
        actor: TrustSafetyAgent
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "parent Donation.status == CAPTURED"
        side_effects:
          - "status -> UPHELD; resolution_note set"
          - "Cascade level 1: create a Refund (reason DISPUTE_UPHELD, amount = donation.net_to_campaign_cents)"
          - "Cascade level 2: that Refund drives parent Donation CAPTURED -> REFUNDED"
          - "Cascade level 3: Donation refund recomputes Campaign.raised_cents / reserve_total_cents / provisional_available_cents / settled_available_cents"
          - "Cascade level 4: if provisional_available_cents < 0, Payouts in {REQUESTED, PROCESSING} are moved to ON_HOLD newest-first (created_at DESC) until provisional_available_cents >= 0"

      - from: NEEDS_INFO
        to: UPHELD
        trigger: "POST /disputes/{id}/uphold"
        actor: TrustSafetyAgent
        preconditions:
          - "status IN {UNDER_REVIEW, NEEDS_INFO}"
          - "parent Donation.status == CAPTURED"
        side_effects:
          - "same cascade as UNDER_REVIEW -> UPHELD"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disputes/{id}/reject"
        actor: TrustSafetyAgent
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED; Donation remains CAPTURED; disputed_locked_cents recomputed (donation unlocked)"

  # --- Payout (branching) ---
  - entity: Payout
    field: status
    initial_state: REQUESTED
    terminal_states: [FAILED, REVERSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: PROCESSING
        trigger: "POST /payouts/{id}/process"
        actor: PlatformAdmin
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "Campaign.payout_posture == OPEN (else ERR_PAYOUT_ON_HOLD)"
          - "Beneficiary.verification_status == VERIFIED (else ERR_BENEFICIARY_NOT_VERIFIED)"
        side_effects:
          - "status -> PROCESSING (funds submitted to Stripe)"

      - from: PROCESSING
        to: PAID
        trigger: "POST /payouts/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "status == PROCESSING (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> PAID; stripe_payout_ref and settled_at set"
          - "Campaign.paid_out_cents += amount_cents"
          - "Beneficiary.total_paid_out_cents += amount_cents; Beneficiary.last_payout_settled_at = settled_at"

      - from: REQUESTED
        to: ON_HOLD
        trigger: "system — after a refund/hold recompute leaves Campaign.provisional_available_cents < 0 (campaign over-committed)"
        actor: system
        preconditions:
          - "status IN {REQUESTED, PROCESSING}"
          - "Campaign.provisional_available_cents < 0 after the recompute"
        side_effects:
          - "status -> ON_HOLD; excluded from committed_cents"
        note: "Deterministic ordering: Payouts are moved to ON_HOLD newest-first (created_at DESC; created_at is the only tie-break) until provisional_available_cents >= 0 again."

      - from: PROCESSING
        to: ON_HOLD
        trigger: "system — after a refund/hold recompute leaves Campaign.provisional_available_cents < 0"
        actor: system
        preconditions:
          - "status IN {REQUESTED, PROCESSING}"
          - "Campaign.provisional_available_cents < 0 after the recompute"
        side_effects:
          - "same as REQUESTED -> ON_HOLD (newest-first until provisional_available_cents >= 0)"

      - from: ON_HOLD
        to: REQUESTED
        trigger: "POST /payouts/{id}/resume"
        actor: TrustSafetyAgent
        preconditions:
          - "status == ON_HOLD (else ERR_INVALID_STATE)"
          - "Campaign.payout_posture == OPEN"
          - "amount_cents <= Campaign.settled_available_cents (else ERR_INSUFFICIENT_AVAILABLE)"
        side_effects:
          - "status -> REQUESTED; re-enters committed_cents"

      - from: REQUESTED
        to: FAILED
        trigger: "POST /payouts/{id}/fail"
        actor: PlatformAdmin
        preconditions:
          - "status IN {REQUESTED, PROCESSING} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> FAILED (Stripe rejected); excluded from committed_cents"

      - from: PROCESSING
        to: FAILED
        trigger: "POST /payouts/{id}/fail"
        actor: PlatformAdmin
        preconditions:
          - "status IN {REQUESTED, PROCESSING}"
        side_effects:
          - "same as REQUESTED -> FAILED"

      - from: PAID
        to: REVERSED
        trigger: "POST /payouts/{id}/reverse"
        actor: TrustSafetyAgent
        preconditions:
          - "status == PAID (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> REVERSED"
          - "Compensation: Campaign.paid_out_cents -= amount_cents; Beneficiary.total_paid_out_cents -= amount_cents"

  # --- Hold ---
  - entity: Hold
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /holds/{id}/release"
        actor: TrustSafetyAgent
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> RELEASED; Campaign.hold_locked_cents recomputed; Campaign.payout_posture recomputed"

  # --- FeaturePlacement ---
  - entity: FeaturePlacement
    field: status
    initial_state: BOOKED
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /feature-placements/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "status == BOOKED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED; the (category, slot_index) window is freed for re-booking"

      - from: BOOKED
        to: EXPIRED
        trigger: "system — current logical clock >= window_end"
        actor: system
        preconditions:
          - "status == BOOKED; clock >= window_end"
        side_effects:
          - "status -> EXPIRED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on Campaign.version)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-edit-stale-version
    parent_entity: Campaign
    write_endpoint: "PATCH /campaigns/{id}"
    occ_field: "expected_campaign_version"
    description: |
      Editing a Campaign's goal/story against a version that has advanced since
      the client last observed it is rejected. Cascades (dispute uphold, hold,
      payout settle) silently advance Campaign.version, so an edit carrying a
      stale expected_campaign_version is refused rather than clobbering the
      newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /payouts"
    occ_field: "expected_campaign_version"
    description: |
      Creating a Payout against a Campaign whose version has advanced since the
      client computed settled_available_cents is rejected. This captures the
      case where the campaign's available balance has changed (another payout
      created, a refund posted, a hold placed) and the requester's view of the
      campaign is therefore stale; the new payout would otherwise legitimately
      draw against a balance that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: donation_charge_breakdown
    trigger: "Donation creation (POST /donations)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking: the processing fee is a percentage of the total the
      # donor pays, but the total includes the fee. Evaluation order is PINNED:
      # compute total_charged first via the closed-form gross-up, then derive
      # the fee as the residual.
      subtotal_cents      = amount_cents + tip_cents
      total_charged_cents = ceil( (subtotal_cents + PROCESSING_FIXED_CENTS)
                                  / (1 - PROCESSING_RATE) )   # ceil to whole cents
      processing_fee_cents = total_charged_cents - subtotal_cents
      net_to_campaign_cents = amount_cents        # tip -> platform, fee -> processor
      reserve_cents        = round_half_up(net_to_campaign_cents * RESERVE_RATE)
    input_set: "This single Donation's amount_cents and tip_cents"
    constants:
      PROCESSING_RATE: 0.029
      PROCESSING_FIXED_CENTS: 30
      RESERVE_RATE: 0.05
    precision: "integer cents; division gross-up ceilinged to whole cents; reserve round_half_up"
    variants: []

  - name: campaign_available
    trigger: "recomputed on Donation create/refund, Payout create/settle/hold/cancel, Hold create/release, Dispute open/uphold/reject"
    algorithm: aggregation
    formula: |
      # PINNED rounding order: reserve is rounded PER DONATION then summed
      # (NOT round(sum(net)*RESERVE_RATE)).
      raised_cents      = sum(d.net_to_campaign_cents for d in Donations
                              if d.campaign_id == C.id and d.status == CAPTURED)
      reserve_total     = sum(round_half_up(d.net_to_campaign_cents * RESERVE_RATE)
                              for d in Donations
                              if d.campaign_id == C.id and d.status == CAPTURED)
      committed_cents   = sum(p.amount_cents for p in Payouts
                              if p.campaign_id == C.id
                              and p.status in {REQUESTED, PROCESSING, PAID})
      disputed_locked   = sum(d.net_to_campaign_cents for d in Donations
                              if d.campaign_id == C.id and d.status == CAPTURED
                              and exists Dispute on d with status in
                                  {OPEN, UNDER_REVIEW, NEEDS_INFO})
      hold_locked       = sum(h.locked_amount_cents for h in Holds
                              if h.campaign_id == C.id and h.status == ACTIVE)
    input_set: "CAPTURED Donations, non-terminal Payouts, ACTIVE Holds, open Disputes of Campaign C"
    constants:
      RESERVE_RATE: 0.05
    precision: "integer cents; reserve round_half_up per donation then summed"
    variants:
      - name: PROVISIONAL
        when: "Optimistic view; ignores open disputes and active holds"
        difference: "provisional_available_cents = raised_cents - reserve_total - committed_cents"
      - name: SETTLED
        when: "Pessimistic view enforced on payout creation and resume"
        difference: "settled_available_cents = provisional_available_cents - disputed_locked - hold_locked"

  - name: entity_risk_score
    trigger: "recomputed on Dispute status change, Refund creation, Beneficiary verification change; exposed on GET /organizers/{id}"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear interaction: nested min/max clamp + a
      # conditional penalty branch on beneficiary verification.
      refund_ratio = refunded_amount_cents / max(1, raised_cents)   # max() guards div-by-zero
      def score(dispute_count_used):
          raw = ( W_DISPUTE * dispute_count_used
                  + round_half_up( W_REFUND * min(1.0, refund_ratio) ) )
          if has_unverified_beneficiary:
              raw += UNVERIFIED_PENALTY
          return min(SCORE_MAX, max(0, raw))
    input_set: "Organizer aggregates: total_dispute_count, upheld_dispute_count, refunded_amount_cents, raised_cents, has_unverified_beneficiary"
    constants:
      W_DISPUTE: 15
      W_REFUND: 50
      UNVERIFIED_PENALTY: 20
      SCORE_MAX: 100
    precision: "integer score in [0, 100]; refund term round_half_up"
    variants:
      - name: STRICT
        when: "Conservative risk view"
        difference: "strict_risk_score = score(total_dispute_count) — counts every dispute, including OPEN and REJECTED"
      - name: LENIENT
        when: "Forgiving risk view"
        difference: "lenient_risk_score = score(upheld_dispute_count) — counts only UPHELD disputes"

  - name: campaign_payout_posture
    trigger: "recomputed on Hold create/release and Beneficiary verification change"
    algorithm: constraint_propagation
    formula: |
      if beneficiary.verification_status == REJECTED:
          payout_posture = FROZEN
      elif exists Hold h with h.campaign_id == C.id and h.status == ACTIVE:
          payout_posture = HOLD
      else:
          payout_posture = OPEN
    input_set: "ACTIVE Holds of Campaign C and its Beneficiary.verification_status"
    constants: {}
    precision: "enum"
    variants: []

  - name: beneficiary_payout_cooldown
    trigger: "Payout creation (POST /payouts)"
    algorithm: threshold
    formula: |
      # Minimum-gap (buffer) semantics on the Beneficiary resource.
      if beneficiary.last_payout_settled_at is not null:
          earliest_next = beneficiary.last_payout_settled_at + COOLDOWN_HOURS hours
          reject if payout.scheduled_at < earliest_next   # strict <, boundary at ==
    input_set: "Beneficiary.last_payout_settled_at and the new Payout.scheduled_at"
    constants:
      COOLDOWN_HOURS: 24
    precision: "datetime comparison; boundary scheduled_at == earliest_next is allowed"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint (per RBAC matrix)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integer/datetime types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 4
    category: existence
    check: "All path and body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints referencing a resource

  - priority: 5
    category: auth
    check: "Ownership: acting Donor's X-User-ID equals Donation.donor_id; acting Organizer is an ACTIVE TeamMember of the Campaign with sufficient team_role"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /donations, campaign mutations, POST /updates, POST /payouts, POST /team-members"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for this transition; Campaign.lifecycle_status == ACTIVE for donations"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: state
    check: "Campaign.lifecycle_status must be ACTIVE to accept a donation"
    error_id: ERR_CAMPAIGN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /donations"

  - priority: 7
    category: business_safety
    check: "Campaign.payout_posture must be OPEN for payout create/process/resume (blocks HOLD and FROZEN)"
    error_id: ERR_PAYOUT_ON_HOLD
    http_status: 409
    applies_to: "POST /payouts, POST /payouts/{id}/process, POST /payouts/{id}/resume"

  - priority: 7
    category: business_safety
    check: "Campaign.payout_posture must not be FROZEN for any write to the campaign or its children"
    error_id: ERR_CAMPAIGN_FROZEN
    http_status: 409
    applies_to: "POST /updates, POST /payouts (when FROZEN and not otherwise on hold)"

  - priority: 8
    category: business_referential
    check: "Beneficiary.verification_status == VERIFIED and withdrawal_ready before a payout can be requested/processed"
    error_id: ERR_BENEFICIARY_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /payouts, POST /payouts/{id}/process"

  - priority: 9
    category: business_constraint
    check: "goal_cents > 0 on campaign create; window_end > window_start on placement; amount_cents > 0 on payout"
    error_id: ERR_GOAL_INVALID
    http_status: 422
    applies_to: "POST /campaigns"

  - priority: 9
    category: business_temporal
    check: "FeaturePlacement.window_end must be strictly after window_start"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /feature-placements"

  - priority: 10
    category: business_fiscal
    check: "Donation.amount_cents >= MIN_DONATION_CENTS (100)"
    error_id: ERR_AMOUNT_BELOW_MIN
    http_status: 422
    applies_to: "POST /donations"

  - priority: 11
    category: business_fiscal
    check: "Payout.amount_cents <= Campaign.settled_available_cents (>= boundary; equal is allowed)"
    error_id: ERR_INSUFFICIENT_AVAILABLE
    http_status: 402
    applies_to: "POST /payouts, POST /payouts/{id}/resume"

  - priority: 12
    category: business_temporal
    check: "FeaturePlacement window must not overlap an existing BOOKED placement on the same (category, slot_index); half-open [start,end), adjacency allowed"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /feature-placements"

  - priority: 12
    category: business_temporal
    check: "Payout.scheduled_at must be >= Beneficiary.last_payout_settled_at + COOLDOWN_HOURS (minimum-gap buffer)"
    error_id: ERR_PAYOUT_COOLDOWN
    http_status: 409
    applies_to: "POST /payouts"

  - priority: 13
    category: business_constraint
    check: "A given Organizer may hold at most one ACTIVE TeamMember row per Campaign"
    error_id: ERR_DUPLICATE_TEAM_MEMBER
    http_status: 409
    applies_to: "POST /team-members"

  - priority: 14
    category: business_referential
    check: "Donation.donor_id header/body must match X-User-ID of the acting Donor"
    error_id: ERR_DONOR_MISMATCH
    http_status: 403
    applies_to: "POST /donations"

  - priority: 15
    category: concurrency
    check: "expected_campaign_version must equal the current Campaign.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /campaigns/{id}, POST /payouts"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Advances the logical clock; may EXPIRE BOOKED FeaturePlacements whose window_end <= new clock"]

  # --- Organizer ---
  - method: POST
    path: "/organizers"
    description: "Register an Organizer"
    roles: [Guest]
    code: 201
    input: [display_name, email]
    output: Organizer
    side_effects: ["risk score fields initialized to 0"]

  - method: GET
    path: "/organizers/{id}"
    description: "Get an Organizer (with computed risk scores)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Organizer
    side_effects: []

  # --- Beneficiary ---
  - method: POST
    path: "/beneficiaries"
    description: "Register a Beneficiary"
    roles: [Guest]
    code: 201
    input: [legal_name, email]
    output: Beneficiary
    side_effects: ["verification_status=UNVERIFIED, stripe_account_ref=null"]

  - method: GET
    path: "/beneficiaries/{id}"
    description: "Get a Beneficiary"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: POST
    path: "/beneficiaries/{id}/withdrawal-setup"
    description: "Attach a connected Stripe account for withdrawals"
    roles: [Beneficiary, PlatformAdmin]
    code: 200
    input: [stripe_account_ref]
    output: Beneficiary
    side_effects: ["stripe_account_ref set; withdrawal_ready recomputed"]

  - method: POST
    path: "/beneficiaries/{id}/submit-verification"
    description: "Submit KYC for review (UNVERIFIED/REJECTED -> PENDING)"
    roles: [Beneficiary]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["verification_status -> PENDING"]

  - method: POST
    path: "/beneficiaries/{id}/approve-verification"
    description: "Approve KYC (PENDING -> VERIFIED)"
    roles: [TrustSafetyAgent]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["verification_status -> VERIFIED; campaigns' payout_posture recomputed"]

  - method: POST
    path: "/beneficiaries/{id}/reject-verification"
    description: "Reject KYC (PENDING -> REJECTED); cascades campaign freeze + payout cancel"
    roles: [TrustSafetyAgent]
    code: 200
    input: [reason]
    output: Beneficiary
    side_effects:
      - "verification_status -> REJECTED"
      - "Cascade: campaigns of this beneficiary -> payout_posture FROZEN; their {REQUESTED,PROCESSING,ON_HOLD} Payouts -> CANCELLED"

  # --- Donor ---
  - method: POST
    path: "/donors"
    description: "Register a Donor"
    roles: [Guest]
    code: 201
    input: [display_name, email, "is_anonymous_default?"]
    output: Donor
    side_effects: []

  - method: GET
    path: "/donors/{id}"
    description: "Get a Donor"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Donor
    side_effects: []

  # --- Campaign ---
  - method: POST
    path: "/campaigns"
    description: "Create a Campaign in DRAFT; organizer_id = X-User-ID; creates the OWNER TeamMember"
    roles: [Organizer]
    code: 201
    input: [beneficiary_id, title, story, goal_cents, category, "is_charity?"]
    output: Campaign
    side_effects:
      - "lifecycle_status=DRAFT, payout_posture=OPEN, all money fields 0"
      - "An ACTIVE TeamMember (team_role OWNER) is created linking X-User-ID organizer to this campaign"
      - "tax_disclosure computed from is_charity"

  - method: GET
    path: "/campaigns/{id}"
    description: "Get a Campaign with all computed money/posture fields"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/campaigns"
    description: "List Campaigns (filterable)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["organizer_id?", "beneficiary_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: PATCH
    path: "/campaigns/{id}"
    description: "Edit goal/story/title (OCC-guarded)"
    roles: [Organizer]
    code: 200
    input: ["title?", "story?", "goal_cents?", expected_campaign_version]
    output: Campaign
    side_effects: ["fields updated; increments Campaign.version by 1"]

  - method: POST
    path: "/campaigns/{id}/publish"
    description: "DRAFT -> ACTIVE"
    roles: [Organizer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["lifecycle_status -> ACTIVE"]

  - method: POST
    path: "/campaigns/{id}/pause"
    description: "ACTIVE -> PAUSED"
    roles: [Organizer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["lifecycle_status -> PAUSED"]

  - method: POST
    path: "/campaigns/{id}/resume"
    description: "PAUSED -> ACTIVE"
    roles: [Organizer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["lifecycle_status -> ACTIVE"]

  - method: POST
    path: "/campaigns/{id}/complete"
    description: "ACTIVE/PAUSED -> COMPLETED"
    roles: [Organizer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["lifecycle_status -> COMPLETED"]

  - method: POST
    path: "/campaigns/{id}/cancel"
    description: "-> CANCELLED; cancels non-terminal payouts"
    roles: [Organizer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["lifecycle_status -> CANCELLED; {REQUESTED,PROCESSING,ON_HOLD} Payouts -> CANCELLED"]

  # --- TeamMember ---
  - method: POST
    path: "/team-members"
    description: "Add a co-organizer / withdrawal manager to a campaign"
    roles: [Organizer]
    code: 201
    input: [campaign_id, organizer_id, team_role]
    output: TeamMember
    side_effects: ["status=ACTIVE; unique ACTIVE (campaign_id, organizer_id) enforced"]

  - method: GET
    path: "/team-members/{id}"
    description: "Get a TeamMember"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: TeamMember
    side_effects: []

  - method: GET
    path: "/team-members"
    description: "List TeamMembers (reverse-reachability for campaign_id / organizer_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "organizer_id?", "limit?", "offset?"]
    output: TeamMember[]
    side_effects: []

  - method: POST
    path: "/team-members/{id}/remove"
    description: "ACTIVE -> REMOVED"
    roles: [Organizer]
    code: 200
    input: []
    output: TeamMember
    side_effects: ["status -> REMOVED"]

  # --- Donation ---
  - method: POST
    path: "/donations"
    description: "Make a donation with optional tip; computes fee/net/reserve"
    roles: [Donor]
    code: 201
    input: [campaign_id, donor_id, amount_cents, "tip_cents?", "is_anonymous?"]
    output: Donation
    side_effects:
      - "processing_fee_cents/total_charged_cents/net_to_campaign_cents/reserve_cents computed"
      - "Campaign.raised_cents/reserve_total_cents/available recomputed"
      - "tax_receipt_status computed from Campaign.is_charity"

  - method: GET
    path: "/donations/{id}"
    description: "Get a Donation"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: GET
    path: "/donations"
    description: "List Donations (reverse-reachability for campaign_id / donor_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "donor_id?", "status?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []

  - method: POST
    path: "/donations/{id}/refund"
    description: "Donor-requested or platform refund; creates a Refund and refunds the Donation"
    roles: [Donor, TrustSafetyAgent, PlatformAdmin]
    code: 201
    input: []
    output: Refund
    side_effects:
      - "creates Refund (reason REQUESTED_BY_DONOR); Donation CAPTURED -> REFUNDED"
      - "Campaign.raised_cents/reserve_total_cents/available recomputed"

  # --- Update / Thank-you ---
  - method: POST
    path: "/updates"
    description: "Post a campaign UPDATE or a THANK_YOU (optionally targeting a Donation)"
    roles: [Organizer]
    code: 201
    input: [campaign_id, update_type, body, "donation_id?"]
    output: Update
    side_effects: ["If update_type==THANK_YOU and donation_id given: Donation.thanked -> true"]

  - method: GET
    path: "/updates/{id}"
    description: "Get an Update"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Update
    side_effects: []

  - method: GET
    path: "/updates"
    description: "List Updates (reverse-reachability for campaign_id / donation_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "donation_id?", "limit?", "offset?"]
    output: Update[]
    side_effects: []

  # --- Payout ---
  - method: POST
    path: "/payouts"
    description: "Request a Stripe payout (OCC-guarded); enforces posture, verification, available, cooldown"
    roles: [Organizer]
    code: 201
    input: [campaign_id, amount_cents, "scheduled_at?", expected_campaign_version]
    output: Payout
    side_effects:
      - "beneficiary_id copied from Campaign; status=REQUESTED"
      - "increments Campaign.version by 1; committed_cents/available recomputed"

  - method: GET
    path: "/payouts/{id}"
    description: "Get a Payout"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts"
    description: "List Payouts (reverse-reachability for campaign_id / beneficiary_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "beneficiary_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []

  - method: POST
    path: "/payouts/{id}/process"
    description: "REQUESTED -> PROCESSING (submit to Stripe)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status -> PROCESSING"]

  - method: POST
    path: "/payouts/{id}/settle"
    description: "PROCESSING -> PAID (Stripe webhook)"
    roles: [PlatformAdmin]
    code: 200
    input: ["stripe_payout_ref?"]
    output: Payout
    side_effects: ["status -> PAID; settled_at set; paid_out_cents & beneficiary totals updated; last_payout_settled_at set"]

  - method: POST
    path: "/payouts/{id}/fail"
    description: "REQUESTED/PROCESSING -> FAILED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status -> FAILED"]

  - method: POST
    path: "/payouts/{id}/resume"
    description: "ON_HOLD -> REQUESTED"
    roles: [TrustSafetyAgent]
    code: 200
    input: []
    output: Payout
    side_effects: ["status -> REQUESTED"]

  - method: POST
    path: "/payouts/{id}/reverse"
    description: "PAID -> REVERSED (fraud clawback)"
    roles: [TrustSafetyAgent]
    code: 200
    input: []
    output: Payout
    side_effects: ["status -> REVERSED; paid_out_cents & beneficiary totals decremented"]

  # --- Dispute ---
  - method: POST
    path: "/disputes"
    description: "Open a dispute on a CAPTURED Donation"
    roles: [Donor, TrustSafetyAgent]
    code: 201
    input: [donation_id, reason]
    output: Dispute
    side_effects: ["status=OPEN; Campaign.disputed_locked_cents recomputed"]

  - method: GET
    path: "/disputes/{id}"
    description: "Get a Dispute"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List Disputes (reverse-reachability for donation_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["donation_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/disputes/{id}/assign"
    description: "OPEN -> UNDER_REVIEW"
    roles: [TrustSafetyAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/disputes/{id}/request-info"
    description: "UNDER_REVIEW -> NEEDS_INFO"
    roles: [TrustSafetyAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> NEEDS_INFO"]

  - method: POST
    path: "/disputes/{id}/provide-info"
    description: "NEEDS_INFO -> UNDER_REVIEW (review loop)"
    roles: [Donor]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/disputes/{id}/uphold"
    description: "UNDER_REVIEW/NEEDS_INFO -> UPHELD; cascades refund + payout hold"
    roles: [TrustSafetyAgent]
    code: 200
    input: ["resolution_note?"]
    output: Dispute
    side_effects:
      - "status -> UPHELD; creates Refund; Donation -> REFUNDED"
      - "Campaign available recomputed; over-committed Payouts -> ON_HOLD"

  - method: POST
    path: "/disputes/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED"
    roles: [TrustSafetyAgent]
    code: 200
    input: ["resolution_note?"]
    output: Dispute
    side_effects: ["status -> REJECTED; disputed_locked_cents recomputed"]

  # --- Refund ---
  - method: GET
    path: "/refunds/{id}"
    description: "Get a Refund"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: GET
    path: "/refunds"
    description: "List Refunds (reverse-reachability for donation_id / dispute_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["donation_id?", "dispute_id?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  # --- Hold ---
  - method: POST
    path: "/holds"
    description: "Place a Trust & Safety hold on a campaign"
    roles: [TrustSafetyAgent]
    code: 201
    input: [campaign_id, reason, severity, "locked_amount_cents?"]
    output: Hold
    side_effects: ["status=ACTIVE; Campaign.payout_posture -> HOLD (if not FROZEN); hold_locked_cents recomputed"]

  - method: GET
    path: "/holds/{id}"
    description: "Get a Hold"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: Hold
    side_effects: []

  - method: GET
    path: "/holds"
    description: "List Holds (reverse-reachability for campaign_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []

  - method: POST
    path: "/holds/{id}/release"
    description: "ACTIVE -> RELEASED; recomputes posture"
    roles: [TrustSafetyAgent]
    code: 200
    input: []
    output: Hold
    side_effects: ["status -> RELEASED; hold_locked_cents & payout_posture recomputed"]

  # --- FeaturePlacement ---
  - method: POST
    path: "/feature-placements"
    description: "Book a campaign into a homepage/category feature slot for a time window"
    roles: [PlatformAdmin]
    code: 201
    input: [campaign_id, category, slot_index, window_start, window_end]
    output: FeaturePlacement
    side_effects: ["status=BOOKED; rejected on window overlap with existing BOOKED placement on same (category, slot_index)"]

  - method: GET
    path: "/feature-placements/{id}"
    description: "Get a FeaturePlacement"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: []
    output: FeaturePlacement
    side_effects: []

  - method: GET
    path: "/feature-placements"
    description: "List FeaturePlacements (reverse-reachability for campaign_id)"
    roles: [Guest, Organizer, Beneficiary, Donor, TrustSafetyAgent, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "category?", "limit?", "offset?"]
    output: FeaturePlacement[]
    side_effects: []

  - method: POST
    path: "/feature-placements/{id}/cancel"
    description: "BOOKED -> CANCELLED; frees the slot window"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FeaturePlacement
    side_effects: ["status -> CANCELLED; (category, slot_index) window freed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, wrong type" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting user is not the owner / not a sufficient TeamMember of the resource" }
  - { id: ERR_DONOR_MISMATCH, http: 403, condition: "Donation.donor_id does not equal the acting Donor's X-User-ID" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a valid state for the requested transition" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Campaign.lifecycle_status is not ACTIVE when a donation is attempted" }
  - { id: ERR_CAMPAIGN_FROZEN, http: 409, condition: "Campaign.payout_posture is FROZEN" }
  - { id: ERR_PAYOUT_ON_HOLD, http: 409, condition: "Campaign.payout_posture is HOLD (or FROZEN) for a payout operation" }
  - { id: ERR_BENEFICIARY_NOT_VERIFIED, http: 409, condition: "Beneficiary is not VERIFIED / not withdrawal_ready for a payout" }
  - { id: ERR_WITHDRAWAL_NOT_READY, http: 409, condition: "Beneficiary has no stripe_account_ref when submitting verification" }
  - { id: ERR_GOAL_INVALID, http: 422, condition: "goal_cents <= 0 on campaign create, or amount_cents <= 0 on payout" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "FeaturePlacement.window_end is not strictly after window_start" }
  - { id: ERR_AMOUNT_BELOW_MIN, http: 422, condition: "Donation.amount_cents below MIN_DONATION_CENTS (100)" }
  - { id: ERR_INSUFFICIENT_AVAILABLE, http: 402, condition: "Payout.amount_cents exceeds Campaign.settled_available_cents" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "FeaturePlacement window overlaps an existing BOOKED placement on the same (category, slot_index)" }
  - { id: ERR_PAYOUT_COOLDOWN, http: 409, condition: "Payout.scheduled_at is within COOLDOWN_HOURS of the beneficiary's last settled payout" }
  - { id: ERR_DUPLICATE_TEAM_MEMBER, http: 409, condition: "Organizer already has an ACTIVE TeamMember row on this Campaign" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_campaign_version does not match current Campaign.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Guest
    description: "Unauthenticated visitor; registers actor accounts and reads public resources"
    identity: opaque
    exclusive_operations:
      - "POST /organizers"
      - "POST /beneficiaries"
      - "POST /donors"
    shared_operations:
      - "All GET endpoints"

  - name: Organizer
    description: "Creates and manages campaigns, team, updates/thank-yous, and payout requests"
    identity: "entity_backed:Organizer"
    exclusive_operations:
      - "POST /campaigns"
      - "PATCH /campaigns/{id}"
      - "POST /campaigns/{id}/publish|pause|resume|complete|cancel"
      - "POST /team-members"
      - "POST /team-members/{id}/remove"
      - "POST /updates"
      - "POST /payouts"
    shared_operations:
      - "All GET endpoints"

  - name: Beneficiary
    description: "Sets up withdrawals and submits KYC verification"
    identity: "entity_backed:Beneficiary"
    exclusive_operations:
      - "POST /beneficiaries/{id}/withdrawal-setup"
      - "POST /beneficiaries/{id}/submit-verification"
    shared_operations:
      - "All GET endpoints"

  - name: Donor
    description: "Makes donations, requests refunds, opens/participates in disputes"
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /donations"
      - "POST /disputes/{id}/provide-info"
    shared_operations:
      - "POST /donations/{id}/refund (shared with TrustSafetyAgent, PlatformAdmin)"
      - "POST /disputes (shared with TrustSafetyAgent)"
      - "All GET endpoints"

  - name: TrustSafetyAgent
    description: "Reviews KYC, disputes, places/releases holds, reverses fraudulent payouts"
    identity: opaque
    exclusive_operations:
      - "POST /beneficiaries/{id}/approve-verification"
      - "POST /beneficiaries/{id}/reject-verification"
      - "POST /disputes/{id}/assign|request-info|uphold|reject"
      - "POST /holds and POST /holds/{id}/release"
      - "POST /payouts/{id}/resume"
      - "POST /payouts/{id}/reverse"
    shared_operations:
      - "POST /donations/{id}/refund (shared with Donor, PlatformAdmin)"
      - "POST /disputes (shared with Donor)"
      - "All GET endpoints"

  - name: PlatformAdmin
    description: "Operational superset: Stripe payout processing, feature placements, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /payouts/{id}/process|settle|fail"
      - "POST /feature-placements and POST /feature-placements/{id}/cancel"
    shared_operations:
      - "POST /beneficiaries/{id}/withdrawal-setup (shared with Beneficiary)"
      - "POST /donations/{id}/refund (shared with Donor, TrustSafetyAgent)"
      - "All GET endpoints"
