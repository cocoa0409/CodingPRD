nt is preserved, and the tier-remaining-quota is invariant across the zero-event round-trip just as it is across the non-zero-event manual round-trip."
            - "Cross-invariant disambiguation: invariant A's conserved quantity is Festival.outstanding_tickets_total (an integer cumulative ticket count, computed as Σ over Festival's TicketTypes of (issued_count − refunded_count), scope is the whole festival), invariant B's conserved quantity is SponsorTier.tier_remaining_quota (an integer quota remainder, computed as contracted_units − Σ over SponsorTier's ExposureAllocations of delivered_units, scope is a single sponsor tier).  The two quantities are aggregated over different entity sets (Festival's TicketTypes vs SponsorTier's ExposureAllocations), they have different units (ticket counts vs catalog-units), and they sit on different parent entities (Festival vs SponsorTier).  The forward and compensating actions are on different action pairs (ScheduleChange.apply/revert via the ticketing-sync envelope mechanism vs ExposureAllocation.deliver/void-delivery via the FulfilmentLog appended-rows mechanism).  The two invariants together satisfy the §0.5 rule-9 'different types of conserved quantities' clause — they are structurally orthogonal observations, neither a duplicate of the other.  The rule-9 two-instance minimum is met with two genuinely different invariants on two different action-and-quantity pairs.  Each invariant's central equality (the pre-action value of the conserved quantity equals the post-compensation value) is the falsifiable evidence; the transient intermediate's bulge in the sibling column (provisional_refund_cents_outstanding for invariant A, delivered_units for invariant B) is the falsifiable evidence that the apply did real work and the compensation undid it.  Without the transient bulge, a no-op-apply would trivially satisfy the conservation, the bulge is the affirmative evidence of the round-trip's non-triviality."

