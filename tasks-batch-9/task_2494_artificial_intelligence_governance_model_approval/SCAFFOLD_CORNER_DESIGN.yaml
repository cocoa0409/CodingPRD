            - "first resolve: HTTP 422 with data.error_id == ERR_REGULATOR_REPORT_REQUIRED, the row still CONTAINED at version 2 with resolved_at null"
            - "second resolve: HTTP 200, status RESOLVED, resolved_at 2026-08-01T00:00:00Z, reported_to_regulator true, version 3"
            - "with the incident resolved the posture returns to HEALTHY; the use case was never APPROVED so no reinstatement ledger entry is appended"

