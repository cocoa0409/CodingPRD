          assert:
            - "HTTP 201; ScanEvent.${se1_id}.dwell_days_closed == 30 (2 678 400 s + 82 800 s floored to 30 days, never 31)"
            - "ScanEvent.${se1_id}.fill_charge_net_cents == 2200: excess_days == max(0, 30 - 30) == 0, so no dwell surcharge and no volume discount (tier_basis 2200 < 4500)"
            - "ScanEvent.${se1_id}.is_late_arrival == false and recorded_at == 2026-08-31T23:00:00Z"
            - "Keg.${k1_id}.cumulative_dwell_days == 30 and custody_state == FILLED and fill_count == 1"
            - "Keg.${k1_id}.dwell_flag == WITHIN_LIMIT — a scan never promotes the flag to APPROACHING or OVERDUE even at 30 days; only the replenishment sweep reclassifies open spells"
            - "the dwell read reports brewer_spell_days == 0 (the FILL scan reset dwell_started_at to 2026-08-31T23:00:00Z), limit_days == 30 and approaching_days == 24"
            - "FloatAgreement.${fa1_id}.billed_amount_cents == 2200 and billed_fills_count == 1; Brewer.${b1_id}.lifetime_fill_count == 1"

