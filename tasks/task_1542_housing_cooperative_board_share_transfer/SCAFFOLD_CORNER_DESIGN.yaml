        distinguishing_aspect: "Request without X-User-ID or X-User-Role returns ERR_MISSING_CONTEXT_HEADER."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cooperatives"
              as: PlatformAdmin  # the test omits headers at HTTP layer; declared role here only for lint
              captures: { err: $.data.error_id }
          assert:
            - "When headers omitted at HTTP layer: error_id == ERR_MISSING_CONTEXT_HEADER, http_status == 400"

      - name: unauthorized_role_shareholder_cannot_create_resolution
        claim_type: violation_to_error
