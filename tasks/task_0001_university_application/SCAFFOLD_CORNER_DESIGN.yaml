        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_ESSAY_WORD_COUNT_OUT_OF_RANGE]
        excluded_because:
          difficulty_instance: boundary_precision_check / essay_word_count_upper_boundary_inclusive
          rationale: "Essay word_count boundary is the §1.8 boundary-precision instance."

