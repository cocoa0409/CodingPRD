# =============================================================================
# PRD-Bench scaffold — task_2540 Precision Optics Manufacturing
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2540. Precision Optics Manufacturing (precision optics manufacturer): optical design
  translation into manufacturable specifications with tolerance analysis, glass and
  substrate procurement with index homogeneity and striae requirements, grinding,
  polishing and figuring with interferometric surface measurement, coating deposition
  with spectral performance verification across the specified wavelength range,
  cementing, mounting and assembly with alignment and centration control, cleanroom
  handling and cleanliness specifications with scratch-dig inspection, metrology
  capability including wavefront error, surface roughness and transmitted wavefront
  measurement, export control classification for high-performance optics and
  documentation requirements

domain_name: precision-optics-manufacturing
api_prefix: /optics

# =============================================================================
# §0 Complexity profile
# =============================================================================
complexity_profile:
  difficulty_level: expert_plus            # above the §0.4 Expert band on coupling density
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is addressed at its own top-level collection under /optics and
  # linked by explicit foreign keys; no entity id is nested inside another
  # entity's create path. Sub-resource GETs exist only as read projections.

  state_machine_shape: parallel
  # WorkOrder carries two independent state dimensions (process_status ×
  # compliance_status) that advance on disjoint triggers and are joined only by
  # POST /optics/work-orders/{id}/release-to-assembly. Cyclic machines also
  # present: CoatingRun (LOADED→DEPOSITED→VERIFIED_FAIL→LOADED),
  # Assembly (MOUNTED→MOUNTED self-loop, ALIGNED→MOUNTED on component void),
  # DocumentationPackage (ASSEMBLING→SUBMITTED→ASSEMBLING).

  relationship_patterns:
    - one_to_many
    - many_to_many          # Assembly <-> WorkOrder via AssemblyComponent
    - self_referential      # OpticalDesign.supersedes_design_id -> OpticalDesign.id
    - cross_aggregate       # Assembly release reads ExportClassification of its design

  role_model: segregation_of_duties
  consistency_model: immediate

  structural_counts:
    entities: 14
    state_machines: 11
    calculations: 12
    endpoints: 74
    error_codes: 55
    roles: 7

# =============================================================================
# §1.0 Response envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-relationship table
# =============================================================================
entities:

  - name: OpticalDesign
    parent: null
    common_fields: true
    fields:
      - { name: design_code, type: string, source: input, description: "Human-readable design identifier; unique across all OpticalDesign rows (case-sensitive exact match)", constraints: "1..40 chars; unique" }
      - { name: aperture_mm, type: number, source: input, description: "Clear aperture diameter in millimetres", constraints: "> 0" }
      - { name: wavelength_min_nm, type: integer, source: input, description: "Inclusive lower bound of the specified wavelength range", constraints: ">= 200" }
      - { name: wavelength_max_nm, type: integer, source: input, description: "Inclusive upper bound of the specified wavelength range", constraints: "> wavelength_min_nm; <= 20000" }
      - { name: required_rms_wavefront_waves, type: number, source: input, description: "Specified RMS wavefront error of the finished optic, in waves at 632.8 nm", constraints: "> 0" }
      - { name: tolerance_budget_waves, type: number, source: input, description: "Total manufacturing tolerance budget the §1.3 tolerance stack must fit inside, in waves", constraints: "> 0" }
      - { name: transmitted_wavefront_budget_waves, type: number, source: input, description: "Budget for assembled transmitted wavefront RMS, in waves", constraints: "> 0" }
      - { name: surface_figure_budget_waves, type: number, source: input, default: 0.0250, description: "Per-surface figure RMS budget at the FIGURING stage, in waves", constraints: "> 0" }
      - { name: surface_roughness_budget_nm, type: number, source: input, default: 1.2000, description: "Surface micro-roughness budget in nm RMS, enforced at POLISHING and FIGURING stages only", constraints: "> 0" }
      - { name: min_center_thickness_um, type: number, source: input, default: 5800.0, description: "Minimum admissible center thickness after material removal, in micrometres", constraints: "> 0" }
      - { name: min_index_homogeneity_grade, type: enum, source: input, default: "H3", description: "Worst index-homogeneity grade acceptable for a substrate lot", constraints: "H1 | H2 | H3 | H4 | H5 (H1 tightest)" }
      - { name: max_striae_grade, type: enum, source: input, default: "B", description: "Worst striae grade acceptable for a substrate lot", constraints: "A | B | C | D (A best)" }
      - { name: scratch_dig_scratch_limit, type: integer, source: input, default: 40, description: "Scratch number limit of the MIL-PRF-13830B scratch-dig specification", constraints: ">= 0" }
      - { name: scratch_dig_dig_limit, type: integer, source: input, default: 20, description: "Dig number limit of the MIL-PRF-13830B scratch-dig specification", constraints: ">= 0" }
      - { name: cleanliness_limit_per_cm2, type: integer, source: input, default: 50, description: "Maximum admissible particle count per square centimetre at cleanroom inspection", constraints: ">= 0" }
      - { name: tolerance_method, type: enum, source: input, default: "STATISTICAL", description: "Selects which §1.3 tolerance_stack_analysis variant governs this design", constraints: "STATISTICAL | WORST_CASE" }
      - { name: design_status, type: enum, source: system, default: "DRAFT", description: "Lifecycle state, see §1.2 OpticalDesign", constraints: "DRAFT | TOLERANCED | RELEASED | SUPERSEDED" }
      - { name: rss_stack_waves, type: number, source: computed, default: null, description: "STATISTICAL variant output of tolerance_stack_analysis; null until the analysis has run at least once" }
      - { name: worst_case_stack_waves, type: number, source: computed, default: null, description: "WORST_CASE variant output of tolerance_stack_analysis; null until the analysis has run at least once" }
      - { name: governing_stack_waves, type: number, source: computed, default: null, description: "Whichever of rss_stack_waves / worst_case_stack_waves tolerance_method selects" }
      - { name: allocated_tolerance_waves, type: number, source: computed, default: null, description: "Mirror of governing_stack_waves persisted as the released allocation" }
      - { name: tolerance_verdict, type: enum, source: computed, default: "PENDING", description: "PASS when governing_stack_waves <= tolerance_budget_waves at the last analysis run", constraints: "PENDING | PASS | FAIL" }
      - { name: design_revision, type: integer, source: system, default: 1, description: "Revision ordinal; a successor created by POST /optics/optical-designs/{id}/revisions carries parent.design_revision + 1" }
      - { name: supersedes_design_id, type: string, source: system, default: null, description: "FK -> OpticalDesign.id; the predecessor this revision supersedes, null for a first-generation design" }

  - name: ToleranceAllocation
    parent: null
    common_fields: true
    fields:
      - { name: design_id, type: string, source: system, description: "FK -> OpticalDesign.id; owning design, taken from the create path" }
      - { name: contributor_type, type: enum, source: input, description: "Which physical error source this row budgets", constraints: "SURFACE_IRREGULARITY | INDEX_HOMOGENEITY | STRIAE | WEDGE_ANGLE | CENTER_THICKNESS | COATING_STRESS | MOUNT_STRAIN" }
      - { name: sensitivity_waves_per_unit, type: number, source: input, description: "Wavefront sensitivity in waves per one unit of the contributor's manufacturing tolerance", constraints: "> 0" }
      - { name: manufacturing_tolerance_units, type: number, source: input, description: "Manufacturing tolerance assigned to this contributor, expressed in the contributor's own units", constraints: "> 0" }
      - { name: contribution_waves, type: number, source: computed, description: "round_half_up(sensitivity_waves_per_unit * manufacturing_tolerance_units, 4); frozen at create time" }
      - { name: allocation_status, type: enum, source: system, default: "ACTIVE", description: "Only ACTIVE rows enter tolerance_stack_analysis", constraints: "ACTIVE | RETIRED" }

  - name: GlassLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Melt/lot identifier printed on the supplier certificate; unique across all GlassLot rows", constraints: "1..40 chars; unique" }
      - { name: glass_type, type: string, source: input, description: "Catalogue glass designation, e.g. N-BK7, S-FPL53", constraints: "1..30 chars" }
      - { name: melt_index_nd, type: number, source: input, default: 1.516800, description: "Measured melt refractive index at the d-line", constraints: "1.300000..2.200000" }
      - { name: declared_index_homogeneity_grade, type: enum, source: input, default: "H2", description: "Index homogeneity grade declared on the purchase order", constraints: "H1 | H2 | H3 | H4 | H5" }
      - { name: declared_striae_grade, type: enum, source: input, default: "A", description: "Striae grade declared on the purchase order", constraints: "A | B | C | D" }
      - { name: measured_index_homogeneity_grade, type: enum, source: system, default: null, description: "Grade recorded by POST /optics/glass-lots/{id}/certification; null before certification", constraints: "H1 | H2 | H3 | H4 | H5 | null" }
      - { name: measured_striae_grade, type: enum, source: system, default: null, description: "Grade recorded by POST /optics/glass-lots/{id}/certification; null before certification", constraints: "A | B | C | D | null" }
      - { name: effective_index_homogeneity_grade, type: enum, source: computed, description: "measured_index_homogeneity_grade when non-null, else declared_index_homogeneity_grade" }
      - { name: effective_striae_grade, type: enum, source: computed, description: "measured_striae_grade when non-null, else declared_striae_grade" }
      - { name: certificate_reference, type: string, source: system, default: null, description: "Supplier melt-certificate reference captured at certification" }
      - { name: total_blank_count, type: integer, source: input, description: "Total number of substrate blanks the lot was received with; immutable after create", constraints: ">= 1" }
      - { name: reserved_blank_count, type: integer, source: computed, default: 0, description: "Blanks reserved by WorkOrder rows whose process_status is not in {RELEASED_TO_ASSEMBLY, SCRAPPED, CANCELLED}" }
      - { name: consumed_blank_count, type: integer, source: computed, default: 0, description: "Blanks consumed by WorkOrder rows that reached RELEASED_TO_ASSEMBLY" }
      - { name: scrapped_blank_count, type: integer, source: computed, default: 0, description: "Blanks written off by WorkOrder rows that reached SCRAPPED" }
      - { name: available_blank_count, type: integer, source: computed, description: "total_blank_count - reserved_blank_count - consumed_blank_count - scrapped_blank_count; see §1.3 blank_conservation_ledger" }
      - { name: blank_center_thickness_um, type: number, source: input, default: 6200.0, description: "As-received center thickness of every blank in the lot, in micrometres", constraints: "> 0" }
      - { name: lot_status, type: enum, source: system, default: "QUARANTINED", description: "Lifecycle state, see §1.2 GlassLot", constraints: "QUARANTINED | RELEASED | BLOCKED | DEPLETED" }
      - { name: block_reason, type: string, source: system, default: null, description: "Free text recorded when the lot is blocked" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: wo_code, type: string, source: input, default: null, description: "Shop-floor traveller number; not unique" }
      - { name: design_id, type: string, source: input, description: "FK -> OpticalDesign.id; the design this order manufactures" }
      - { name: glass_lot_id, type: string, source: input, description: "FK -> GlassLot.id; the substrate lot the blanks are drawn from" }
      - { name: element_count, type: integer, source: input, description: "Number of finished elements the order must deliver", constraints: ">= 1" }
      - { name: spare_blank_count, type: integer, source: computed, description: "max(MIN_SPARE_BLANKS, ceil(element_count * SPARE_BLANK_RATE)); see §1.3 blank_reservation_sizing" }
      - { name: reserved_blank_count, type: integer, source: computed, description: "element_count + spare_blank_count; frozen at create time and used verbatim by every later ledger move" }
      - { name: blank_center_thickness_um, type: number, source: system, description: "Copy of GlassLot.blank_center_thickness_um taken at create time" }
      - { name: pinned_design_revision, type: integer, source: system, description: "Copy of OpticalDesign.design_revision taken at create time" }
      - { name: process_status, type: enum, source: system, default: "BLANKS_RESERVED", description: "Fabrication dimension of the parallel state machine, see §1.2 WorkOrder", constraints: "BLANKS_RESERVED | GRINDING | POLISHING | FIGURING | FIGURE_ACCEPTED | COATING | COATED | RELEASED_TO_ASSEMBLY | HELD | SCRAPPED | CANCELLED" }
      - { name: compliance_status, type: enum, source: system, default: "UNCLASSIFIED", description: "Export-compliance dimension of the parallel state machine, see §1.2 WorkOrder", constraints: "UNCLASSIFIED | SCREENED | CLEARED | BLOCKED" }
      - { name: figuring_iteration_count, type: integer, source: computed, default: 0, description: "Number of signed FIGURING-stage reports whose verdict was REWORK_REQUIRED" }
      - { name: cumulative_removal_nm, type: number, source: computed, default: 0, description: "See §1.3 figuring_removal_convergence" }
      - { name: remaining_center_thickness_um, type: number, source: computed, description: "See §1.3 figuring_removal_convergence" }
      - { name: hold_reason, type: string, source: system, default: null, description: "Set to GLASS_LOT_BLOCKED when the order is held by the §1.2 GlassLot block cascade" }
      - { name: scrap_reason, type: string, source: system, default: null, description: "FIGURE_CONVERGENCE_FAILURE | MIN_THICKNESS_BREACH | COATING_STRIP_LIMIT (all three set by the system) | LATENT_SUBSURFACE_DEFECT | ASSEMBLY_DAMAGE (supplied in the POST /optics/work-orders/{id}/scrap payload)" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Free text recorded when the order is cancelled" }

  - name: MetrologyInstrument
    parent: null
    common_fields: true
    fields:
      - { name: instrument_code, type: string, source: input, description: "Asset tag of the metrology station", constraints: "1..40 chars" }
      - { name: instrument_type, type: enum, source: input, default: "PHASE_SHIFTING_INTERFEROMETER", description: "Measurement principle", constraints: "PHASE_SHIFTING_INTERFEROMETER | WHITE_LIGHT_INTERFEROMETER | AFM_PROFILOMETER" }
      - { name: base_uncertainty_waves, type: number, source: input, description: "Expanded measurement uncertainty at the last calibration, in waves", constraints: "> 0" }
      - { name: lateral_resolution_um, type: number, source: input, default: 250.0, description: "Lateral sampling resolution in micrometres", constraints: "> 0" }
      - { name: last_calibrated_utc, type: datetime, source: input, description: "Timestamp of the last accepted calibration; refreshed by POST /optics/metrology-instruments/{id}/calibrations" }
      - { name: calibration_interval_days, type: integer, source: input, default: 90, description: "Calibration validity window in whole days", constraints: ">= 1" }
      - { name: days_since_calibration, type: integer, source: computed, description: "floor((logical_clock_now - last_calibrated_utc) / 86400 seconds)" }
      - { name: effective_uncertainty_waves, type: number, source: computed, description: "See §1.3 metrology_capability_index" }
      - { name: instrument_status, type: enum, source: computed, description: "OVERDUE when days_since_calibration > calibration_interval_days, else CALIBRATED", constraints: "CALIBRATED | OVERDUE" }
      - { name: booked_minutes_total, type: integer, source: computed, default: 0, description: "See §1.3 instrument_minutes_ledger" }

  - name: ProcessRun
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the order this run advances" }
      - { name: metrology_instrument_id, type: string, source: input, description: "FK -> MetrologyInstrument.id; station reserved for the post-run measurement" }
      - { name: run_stage, type: enum, source: input, description: "Material-removal stage this run executes", constraints: "GRINDING | POLISHING | FIGURING" }
      - { name: metrology_window_start_utc, type: datetime, source: input, description: "Inclusive start of the reserved metrology window" }
      - { name: metrology_window_end_utc, type: datetime, source: input, description: "Inclusive end of the reserved metrology window" }
      - { name: window_minutes, type: integer, source: computed, description: "Whole minutes between metrology_window_start_utc and metrology_window_end_utc" }
      - { name: capability_ratio_at_scheduling, type: number, source: computed, description: "§1.3 metrology_capability_index evaluated at create time and frozen" }
      - { name: material_removed_nm, type: number, source: system, default: null, description: "Material removed during the run, in nanometres; set by POST /optics/process-runs/{id}/complete" }
      - { name: started_at_utc, type: datetime, source: system, default: null, description: "Logical clock reading when the run was started" }
      - { name: run_status, type: enum, source: system, default: "SCHEDULED", description: "Lifecycle state, see §1.2 ProcessRun", constraints: "SCHEDULED | IN_PROCESS | AWAITING_METROLOGY | ACCEPTED | REWORK_REQUIRED | CANCELLED" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "CANCELLED_BY_OPERATOR | WORK_ORDER_HELD | WORK_ORDER_CANCELLED" }

  - name: MetrologyReport
    parent: null
    common_fields: true
    fields:
      - { name: process_run_id, type: string, source: input, description: "FK -> ProcessRun.id; the run this interferometric measurement reports on" }
      - { name: surface_rms_waves, type: number, source: input, description: "Measured surface figure error, RMS in waves", constraints: ">= 0" }
      - { name: surface_pv_waves, type: number, source: input, default: 0.0000, description: "Measured peak-to-valley surface figure error in waves; recorded for the certificate, not gated", constraints: ">= 0" }
      - { name: surface_roughness_nm_rms, type: number, source: input, default: 0.0000, description: "Measured micro-roughness in nm RMS", constraints: ">= 0" }
      - { name: transmitted_wavefront_rms_waves, type: number, source: input, default: 0.0000, description: "Measured transmitted wavefront error, RMS in waves; gated at the FIGURING stage only", constraints: ">= 0" }
      - { name: stage_figure_budget_waves, type: number, source: computed, description: "design.surface_figure_budget_waves * STAGE_FIGURE_MULTIPLIER[run.run_stage]; frozen at create time" }
      - { name: verdict, type: enum, source: computed, default: "PENDING", description: "Computed at sign time by §1.3 metrology_acceptance_verdict; PENDING while report_status is DRAFT", constraints: "PENDING | ACCEPTED | REWORK_REQUIRED" }
      - { name: report_status, type: enum, source: system, default: "DRAFT", description: "Lifecycle state, see §1.2 MetrologyReport", constraints: "DRAFT | SIGNED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the MetrologyTechnician that created the report" }
      - { name: signed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the MetrologyTechnician that signed the report" }
      - { name: signed_at_utc, type: datetime, source: system, default: null, description: "Logical clock reading at signature" }
      - { name: signature_note, type: string, source: system, default: null, description: "Free text recorded with the signature" }

  - name: CoatingChamber
    parent: null
    common_fields: true
    fields:
      - { name: chamber_code, type: string, source: input, description: "Asset tag of the deposition chamber", constraints: "1..40 chars" }
      - { name: coating_type, type: enum, source: input, default: "AR_BROADBAND", description: "Coating family the chamber is tooled for", constraints: "AR_BROADBAND | DIELECTRIC_MIRROR | BEAMSPLITTER" }
      - { name: slot_capacity, type: integer, source: input, description: "Number of load slots that may be occupied at the same instant; see §1.4 priority 14", constraints: ">= 1" }

  - name: CoatingRun
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the order whose elements are being coated" }
      - { name: coating_chamber_id, type: string, source: input, description: "FK -> CoatingChamber.id; the chamber booked for this run" }
      - { name: coating_recipe_code, type: string, source: input, description: "Deposition recipe identifier", constraints: "1..40 chars" }
      - { name: window_start_utc, type: datetime, source: input, description: "Start of the half-open chamber booking interval [window_start_utc, window_end_utc)" }
      - { name: window_end_utc, type: datetime, source: input, description: "End of the half-open chamber booking interval [window_start_utc, window_end_utc)" }
      - { name: spectral_samples, type: array, source: system, default: [], description: "Array of { wavelength_nm: integer, reflectance_pct: number } objects submitted by POST /optics/coating-runs/{id}/spectral-verification; replaced wholesale on each verification" }
      - { name: in_band_sample_count, type: integer, source: computed, default: 0, description: "Count of spectral_samples whose wavelength_nm satisfies design.wavelength_min_nm <= wavelength_nm <= design.wavelength_max_nm" }
      - { name: band_average_reflectance_pct, type: number, source: computed, default: null, description: "BAND_AVERAGE variant output of §1.3 spectral_performance_verification" }
      - { name: worst_point_reflectance_pct, type: number, source: computed, default: null, description: "WORST_POINT variant output of §1.3 spectral_performance_verification" }
      - { name: spectral_verdict, type: enum, source: computed, default: "PENDING", description: "PASS only when both variants are inside their own limit", constraints: "PENDING | PASS | FAIL" }
      - { name: strip_count, type: integer, source: computed, default: 0, description: "Number of completed strip-and-recoat cycles on this run" }
      - { name: coating_status, type: enum, source: system, default: "LOADED", description: "Lifecycle state, see §1.2 CoatingRun", constraints: "LOADED | DEPOSITED | VERIFIED_PASS | VERIFIED_FAIL | SCRAPPED" }

  - name: Assembly
    parent: null
    common_fields: true
    fields:
      - { name: design_id, type: string, source: input, description: "FK -> OpticalDesign.id; the design this assembly realises" }
      - { name: assembly_code, type: string, source: input, description: "Assembly serial number", constraints: "1..40 chars" }
      - { name: element_rss_waves, type: number, source: computed, default: null, description: "See §1.3 assembly_transmitted_wavefront" }
      - { name: centration_error_waves, type: number, source: computed, default: null, description: "See §1.3 assembly_transmitted_wavefront" }
      - { name: subtotal_waves, type: number, source: computed, default: null, description: "See §1.3 assembly_transmitted_wavefront; the value the cement-derate tier is selected from" }
      - { name: cement_derate_waves, type: number, source: computed, default: null, description: "See §1.3 assembly_transmitted_wavefront" }
      - { name: total_transmitted_wavefront_waves, type: number, source: computed, default: null, description: "See §1.3 assembly_transmitted_wavefront" }
      - { name: alignment_attempt_count, type: integer, source: computed, default: 0, description: "Number of align attempts whose total_transmitted_wavefront_waves exceeded the design budget" }
      - { name: assembly_status, type: enum, source: system, default: "KITTED", description: "Lifecycle state, see §1.2 Assembly", constraints: "KITTED | CEMENTED | MOUNTED | ALIGNED | SEALED | RELEASED | REJECTED | EXPORT_BLOCKED" }
      - { name: cement_lot_code, type: string, source: system, default: null, description: "Optical cement lot recorded at the cementing step" }
      - { name: mount_code, type: string, source: system, default: null, description: "Mount/barrel part number recorded at the mounting step" }
      - { name: released_at_utc, type: datetime, source: system, default: null, description: "Logical clock reading when the assembly was released for shipment" }

  - name: AssemblyComponent
    parent: null
    common_fields: true
    fields:
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; the assembly this element sits in" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the order that produced this element" }
      - { name: slot_index, type: integer, source: input, description: "Position of the element in the barrel, counted from the object side; unique among the assembly's component_status == ACTIVE rows", constraints: ">= 1" }
      - { name: decenter_um, type: number, source: input, default: 0.0, description: "Measured lateral decenter of the element in micrometres", constraints: ">= 0" }
      - { name: tilt_arcmin, type: number, source: input, default: 0.0, description: "Measured element tilt in arcminutes", constraints: ">= 0" }
      - { name: element_wavefront_rms_waves, type: number, source: input, default: 0.0000, description: "As-built RMS wavefront contribution of the element in waves", constraints: ">= 0" }
      - { name: component_status, type: enum, source: system, default: "ACTIVE", description: "VOIDED when the producing WorkOrder reaches SCRAPPED; only ACTIVE rows enter §1.3 assembly_transmitted_wavefront", constraints: "ACTIVE | VOIDED" }

  - name: InspectionRecord
    parent: null
    common_fields: true
    fields:
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; the assembly inspected in the cleanroom" }
      - { name: max_scratch_number, type: integer, source: input, description: "Largest scratch number observed on any surface", constraints: ">= 0" }
      - { name: max_dig_number, type: integer, source: input, description: "Largest dig number observed on any surface", constraints: ">= 0" }
      - { name: scratch_count_at_limit, type: integer, source: input, default: 1, description: "How many scratches sit exactly at max_scratch_number", constraints: ">= 0" }
      - { name: particle_count_per_cm2, type: integer, source: input, description: "Particle count per square centimetre measured under grazing illumination", constraints: ">= 0" }
      - { name: scratch_dig_pass, type: boolean, source: computed, description: "See §1.3 cleanliness_inspection_verdict" }
      - { name: cleanliness_pass, type: boolean, source: computed, description: "See §1.3 cleanliness_inspection_verdict" }
      - { name: inspection_status, type: enum, source: system, description: "PASSED or FAILED computed at create time by §1.3 cleanliness_inspection_verdict; only a waiver moves FAILED to WAIVED", constraints: "PASSED | FAILED | WAIVED" }
      - { name: inspected_by_user_id, type: string, source: system, description: "X-User-ID of the actor that created the record" }
      - { name: waived_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the QualityManager that granted the waiver" }
      - { name: waiver_justification, type: string, source: system, default: null, description: "Justification text recorded with the waiver" }

  - name: ExportClassification
    parent: null
    common_fields: true
    fields:
      - { name: design_id, type: string, source: input, description: "FK -> OpticalDesign.id; the design being classified" }
      - { name: destination_country, type: string, source: input, description: "ISO-3166-1 alpha-2 code of the ultimate destination", constraints: "exactly 2 upper-case letters" }
      - { name: end_use_statement, type: string, source: input, default: null, description: "Declared end use captured for the file" }
      - { name: figure_of_merit, type: number, source: computed, description: "See §1.3 export_control_classification" }
      - { name: eccn, type: string, source: computed, description: "6A004.A.1 for controlled optics, EAR99 otherwise; see §1.3 export_control_classification" }
      - { name: license_required, type: boolean, source: computed, description: "See §1.3 export_control_classification" }
      - { name: license_number, type: string, source: system, default: null, description: "License number recorded with an APPROVED decision" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ExportComplianceOfficer that recorded the license decision" }
      - { name: decision_note, type: string, source: system, default: null, description: "Free-text note recorded with a license decision or a later revocation" }
      - { name: classification_status, type: enum, source: system, description: "EXEMPT_CLEARED or LICENSE_REQUIRED at create time, then LICENSE_APPROVED or LICENSE_DENIED after a decision", constraints: "EXEMPT_CLEARED | LICENSE_REQUIRED | LICENSE_APPROVED | LICENSE_DENIED" }

  - name: DocumentationPackage
    parent: null
    common_fields: true
    fields:
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; at most one package per assembly" }
      - { name: attached_documents, type: array, source: system, default: [], description: "Append-only array of { document_type: enum, document_reference: string, attached_at_utc: datetime } in attachment order" }
      - { name: present_document_types, type: array, source: computed, default: [], description: "document_type values from attached_documents, in attachment order" }
      - { name: required_document_types, type: array, source: computed, description: "See §1.3 documentation_completeness; alphabetically ascending" }
      - { name: missing_document_types, type: array, source: computed, description: "required_document_types minus present_document_types, alphabetically ascending" }
      - { name: completeness_pct, type: number, source: computed, description: "See §1.3 documentation_completeness" }
      - { name: package_status, type: enum, source: system, default: "ASSEMBLING", description: "Lifecycle state, see §1.2 DocumentationPackage", constraints: "ASSEMBLING | SUBMITTED | APPROVED" }
      - { name: rejection_count, type: integer, source: computed, default: 0, description: "Number of REJECTED review decisions recorded against this package" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the QualityManager that submitted the package" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the QualityManager that recorded the last review decision" }
      - { name: last_review_note, type: string, source: system, default: null, description: "Note recorded with the last review decision" }

# =============================================================================
# §1.2 State machine table
# =============================================================================
state_machines:

  - entity: OpticalDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: TOLERANCED
        trigger: "POST /optics/optical-designs/{id}/tolerance-analysis"
        actor: OpticsEngineer
        preconditions:
          - "design_status == DRAFT"
          - "count of ToleranceAllocation rows with design_id == {id} and allocation_status == ACTIVE is >= 1, else ERR_TOLERANCE_STACK_EMPTY"
          - "§1.3 tolerance_stack_analysis runs and its tolerance_verdict (PASS or FAIL) is recorded; either verdict returns 200 and either verdict moves the design to TOLERANCED — the budget itself is NOT enforced here"
        side_effects:
          - "rss_stack_waves, worst_case_stack_waves, governing_stack_waves, tolerance_verdict recomputed by §1.3 tolerance_stack_analysis"
          - "allocated_tolerance_waves set to governing_stack_waves"
          - "design_status set to TOLERANCED whatever the tolerance_verdict is"
        note: "The analysis records a verdict; the budget gate lives on the release transition (§1.4 priority 25, ERR_TOLERANCE_BUDGET_EXCEEDED), which is the only place a FAIL is refused. Re-running the analysis on a TOLERANCED design is rejected with ERR_INVALID_STATE_TRANSITION and allocations may only be retired or added while DRAFT, so a design that reaches TOLERANCED with tolerance_verdict FAIL is a dead end: it can never be released and engineering must open a new design_code."
      - from: TOLERANCED
        to: RELEASED
        trigger: "POST /optics/optical-designs/{id}/release"
        actor: OpticsEngineer
        preconditions:
          - "design_status == TOLERANCED"
          - "tolerance_verdict == PASS, else ERR_TOLERANCE_BUDGET_EXCEEDED (§1.4 priority 25)"
        side_effects:
          - "design_status set to RELEASED"
        note: "Export classification is deliberately NOT a precondition of design release: §1.4 priorities 8 and 9 place the export gates on POST /optics/work-orders/{id}/compliance-screen and POST /optics/assemblies/{id}/release, so a design may be released for manufacture while its ExportClassification is still being worked."
      - from: RELEASED
        to: SUPERSEDED
        trigger: "POST /optics/optical-designs/{id}/revisions"
        actor: OpticsEngineer
        preconditions:
          - "design_status == RELEASED"
          - "payload expected_design_version equals the current OpticalDesign.version, else ERR_STALE_DESIGN_VERSION (see §1.2.1 design-revision-supersede)"
        side_effects:
          - "a new OpticalDesign row is created in DRAFT with supersedes_design_id == {id}, design_revision == parent.design_revision + 1, and every field the payload omits copied from the parent"
          - "the predecessor's design_status set to SUPERSEDED"
          - "increments OpticalDesign.version by 1 on the predecessor"
        note: "WorkOrder rows already created against the predecessor keep pinned_design_revision and are unaffected."

  - entity: GlassLot
    initial_state: QUARANTINED
    terminal_states: [BLOCKED, DEPLETED]
    transitions:
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /optics/glass-lots/{id}/certification"
        actor: ProcurementOfficer
        preconditions:
          - "lot_status == QUARANTINED"
        side_effects:
          - "certificate_reference, measured_index_homogeneity_grade and measured_striae_grade recorded from the payload when supplied"
          - "effective_index_homogeneity_grade and effective_striae_grade recomputed"
          - "lot_status set to RELEASED"
      - from: RELEASED
        to: BLOCKED
        trigger: "POST /optics/glass-lots/{id}/block"
        actor: ProcurementOfficer
        preconditions:
          - "lot_status == RELEASED"
        side_effects:
          - "hop 1: lot_status set to BLOCKED and block_reason recorded"
          - "hop 2 (caused by hop 1): every WorkOrder with glass_lot_id == {id} and process_status IN {BLANKS_RESERVED, GRINDING, POLISHING, FIGURING, FIGURE_ACCEPTED, COATING, COATED}, processed in created_at ASC order, has process_status set to HELD and hold_reason set to GLASS_LOT_BLOCKED"
          - "hop 3 (caused by hop 2): for each WorkOrder just moved to HELD, every ProcessRun with that work_order_id and run_status IN {SCHEDULED, IN_PROCESS}, processed in created_at ASC order, has run_status set to CANCELLED and cancel_reason set to WORK_ORDER_HELD"
          - "hop 4 (caused by hop 3): for each ProcessRun just cancelled, MetrologyInstrument.booked_minutes_total is decremented by that run's window_minutes (§1.3 instrument_minutes_ledger)"
      - from: RELEASED
        to: DEPLETED
        trigger: "system event: the last outstanding blank of the lot leaves reserved_blank_count"
        actor: system
        preconditions:
          - "lot_status == RELEASED"
          - "after the ledger move that triggered this evaluation, available_blank_count == 0 AND reserved_blank_count == 0"
        side_effects:
          - "lot_status set to DEPLETED"
        note: "Evaluated at the end of every §1.3 blank_conservation_ledger move (WorkOrder create, cancel, release-to-assembly and scrap cascades)."

  - entity: WorkOrder
    dimension: process_status
    initial_state: BLANKS_RESERVED
    terminal_states: [SCRAPPED, CANCELLED]
    transitions:
      - from: BLANKS_RESERVED
        to: GRINDING
        trigger: "POST /optics/process-runs/{id}/start where run_stage == GRINDING"
        actor: ProcessTechnician
        preconditions:
          - "run_status == SCHEDULED"
          - "process_status IN {BLANKS_RESERVED, GRINDING}"
        side_effects:
          - "process_status set to GRINDING"
          - "ProcessRun.started_at_utc set to the logical clock reading"
      - from: BLANKS_RESERVED
        to: POLISHING
        trigger: "POST /optics/process-runs/{id}/start where run_stage == POLISHING"
        actor: ProcessTechnician
        preconditions:
          - "run_status == SCHEDULED"
          - "process_status IN {BLANKS_RESERVED, GRINDING, POLISHING}"
        side_effects:
          - "process_status set to POLISHING"
          - "ProcessRun.started_at_utc set to the logical clock reading"
        note: "Pre-polished blanks may skip grinding; the stage gate in §1.4 priority 11 pins the admissible from-set per stage."
      - from: GRINDING
        to: POLISHING
        trigger: "system event: POST /optics/metrology-reports/{id}/sign with verdict ACCEPTED on a run whose run_stage == GRINDING"
        actor: system
        preconditions:
          - "the signed report's verdict == ACCEPTED"
          - "process_status NOT IN {SCRAPPED, CANCELLED, HELD}"
        side_effects:
          - "process_status set to STAGE_ADVANCE_MAP[run_stage] == POLISHING"
          - "cumulative_removal_nm and remaining_center_thickness_um recomputed by §1.3 figuring_removal_convergence"
        note: "The grinding stage is graded against the most lenient figure budget (STAGE_FIGURE_MULTIPLIER 10) and its roughness gate is suppressed entirely, so a rough-ground surface advances on figure alone."
      - from: POLISHING
        to: FIGURING
        trigger: "system event: POST /optics/metrology-reports/{id}/sign with verdict ACCEPTED on a run whose run_stage == POLISHING"
        actor: system
        preconditions:
          - "the signed report's verdict == ACCEPTED"
          - "process_status NOT IN {SCRAPPED, CANCELLED, HELD}"
        side_effects:
          - "process_status set to STAGE_ADVANCE_MAP[run_stage] == FIGURING"
          - "cumulative_removal_nm and remaining_center_thickness_um recomputed by §1.3 figuring_removal_convergence"
      - from: FIGURING
        to: FIGURE_ACCEPTED
        trigger: "system event: POST /optics/metrology-reports/{id}/sign with verdict ACCEPTED on a run whose run_stage == FIGURING"
        actor: system
        preconditions:
          - "the signed report's verdict == ACCEPTED"
          - "process_status NOT IN {SCRAPPED, CANCELLED, HELD}"
        side_effects:
          - "process_status set to STAGE_ADVANCE_MAP[run_stage] == FIGURE_ACCEPTED"
          - "cumulative_removal_nm and remaining_center_thickness_um recomputed by §1.3 figuring_removal_convergence"
      - from: FIGURING
        to: POLISHING
        trigger: "system event: POST /optics/metrology-reports/{id}/sign with verdict REWORK_REQUIRED on a run whose run_stage == FIGURING"
        actor: system
        preconditions:
          - "the signed report's verdict == REWORK_REQUIRED"
          - "figuring_iteration_count after increment is < MAX_FIGURING_ITERATIONS (2)"
          - "remaining_center_thickness_um after recomputation is >= design.min_center_thickness_um"
        side_effects:
          - "figuring_iteration_count incremented by 1"
          - "cumulative_removal_nm and remaining_center_thickness_um recomputed by §1.3 figuring_removal_convergence"
          - "process_status set back to POLISHING so a further polishing run can be scheduled"
        note: "This is the revision loop of the machine: FIGURING -> POLISHING -> FIGURING."
      - from: FIGURING
        to: SCRAPPED
        trigger: "system event: POST /optics/metrology-reports/{id}/sign on a run whose run_stage == FIGURING when a scrap condition is met"
        actor: system
        preconditions:
          - "the signed report's verdict == REWORK_REQUIRED"
          - "either remaining_center_thickness_um after recomputation < design.min_center_thickness_um (scrap_reason MIN_THICKNESS_BREACH, evaluated first) or figuring_iteration_count after increment >= MAX_FIGURING_ITERATIONS (2) (scrap_reason FIGURE_CONVERGENCE_FAILURE)"
        side_effects:
          - "hop 1: figuring_iteration_count incremented by 1, cumulative_removal_nm and remaining_center_thickness_um recomputed, process_status set to SCRAPPED and scrap_reason recorded"
          - "hop 2 (caused by hop 1): GlassLot.reserved_blank_count decremented by this order's reserved_blank_count and GlassLot.scrapped_blank_count incremented by the same amount, then available_blank_count recomputed; when available_blank_count == 0 AND reserved_blank_count == 0 the lot moves RELEASED -> DEPLETED"
          - "hop 3 (caused by hop 1): every AssemblyComponent with work_order_id == this order and component_status == ACTIVE, processed in created_at ASC order, has component_status set to VOIDED"
          - "hop 4 (caused by hop 3): for each AssemblyComponent just voided, its Assembly recomputes §1.3 assembly_transmitted_wavefront over the remaining ACTIVE components, and when assembly_status IN {ALIGNED, SEALED} it is set back to MOUNTED"
        note: "Side-effect order is pinned hop 1 -> hop 2 -> hop 3 -> hop 4. Hops 3 and 4 are vacuous on this path (a work order still in FIGURING has not been released to assembly, so it owns no AssemblyComponent); they become observable on the RELEASED_TO_ASSEMBLY -> SCRAPPED path declared below."
      - from: COATING
        to: COATED
        trigger: "system event: POST /optics/coating-runs/{id}/spectral-verification with spectral_verdict PASS"
        actor: system
        preconditions:
          - "spectral_verdict == PASS"
          - "process_status == COATING"
        side_effects:
          - "process_status set to COATED"
      - from: FIGURE_ACCEPTED
        to: COATING
        trigger: "POST /optics/coating-runs"
        actor: ProcessTechnician
        preconditions:
          - "process_status == FIGURE_ACCEPTED, else ERR_WORK_ORDER_NOT_IN_PROCESS"
        side_effects:
          - "process_status set to COATING"
      - from: COATED
        to: COATING
        trigger: "POST /optics/coating-runs/{id}/strip"
        actor: ProcessTechnician
        preconditions:
          - "the coating run's coating_status == VERIFIED_FAIL"
          - "process_status IN {COATING, COATED}"
        side_effects:
          - "process_status set to COATING"
          - "CoatingRun.strip_count incremented by 1 and coating_status set back to LOADED (strip-and-recoat loop)"
      - from: COATED
        to: RELEASED_TO_ASSEMBLY
        trigger: "POST /optics/work-orders/{id}/release-to-assembly"
        actor: ProcessTechnician
        preconditions:
          - "process_status == COATED, else ERR_WORK_ORDER_NOT_IN_PROCESS"
          - "compliance_status == CLEARED, else ERR_EXPORT_LICENSE_NOT_APPROVED"
        side_effects:
          - "process_status set to RELEASED_TO_ASSEMBLY"
          - "GlassLot ledger move: reserved_blank_count decremented by reserved_blank_count, consumed_blank_count incremented by element_count, and the spare_blank_count difference returned to available_blank_count (§1.3 blank_conservation_ledger)"
        note: "This transition is the join point of the two parallel dimensions."
      - from: RELEASED_TO_ASSEMBLY
        to: SCRAPPED
        trigger: "POST /optics/work-orders/{id}/scrap"
        actor: QualityManager
        preconditions:
          - "process_status IN {FIGURE_ACCEPTED, COATED, RELEASED_TO_ASSEMBLY}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "hop 1: process_status set to SCRAPPED and scrap_reason recorded from the payload"
          - "hop 2 (caused by hop 1): GlassLot ledger write-off — when the order was RELEASED_TO_ASSEMBLY its blanks were already consumed, so consumed_blank_count is decremented by element_count and scrapped_blank_count incremented by element_count; from FIGURE_ACCEPTED or COATED the still-open reservation is written off instead (reserved_blank_count decremented by reserved_blank_count, scrapped_blank_count incremented by the same); available_blank_count is recomputed either way and the total_blank_count invariant of §1.3 blank_conservation_ledger holds"
          - "hop 3 (caused by hop 1): every AssemblyComponent with work_order_id == this order and component_status == ACTIVE, processed in created_at ASC order, has component_status set to VOIDED"
          - "hop 4 (caused by hop 3): for each AssemblyComponent just voided, its Assembly recomputes §1.3 assembly_transmitted_wavefront over the remaining ACTIVE components (all five outputs null when none remains) and, when assembly_status IN {ALIGNED, SEALED}, is set back to MOUNTED"
        note: "Post-release scrap: a latent subsurface defect found during assembly. This is the only path by which an element already kitted into an assembly can be withdrawn, and therefore the only way hops 3 and 4 are reachable. Side-effect order is pinned hop 1 -> hop 2 -> hop 3 -> hop 4."
      - from: BLANKS_RESERVED
        to: CANCELLED
        trigger: "POST /optics/work-orders/{id}/cancel"
        actor: ProcessTechnician
        preconditions:
          - "process_status IN {BLANKS_RESERVED, GRINDING, POLISHING, FIGURING, FIGURE_ACCEPTED, HELD}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "hop 1: process_status set to CANCELLED and cancel_reason recorded"
          - "hop 2 (caused by hop 1): GlassLot.reserved_blank_count decremented by reserved_blank_count and available_blank_count incremented by the same amount"
          - "hop 3 (caused by hop 1): every ProcessRun with this work_order_id and run_status IN {SCHEDULED, IN_PROCESS} set to CANCELLED with cancel_reason WORK_ORDER_CANCELLED, and MetrologyInstrument.booked_minutes_total decremented by each cancelled run's window_minutes"
      - from: HELD
        to: CANCELLED
        trigger: "POST /optics/work-orders/{id}/cancel"
        actor: ProcessTechnician
        preconditions:
          - "process_status == HELD"
        side_effects:
          - "identical to the BLANKS_RESERVED -> CANCELLED hops"
      - from: COATING
        to: SCRAPPED
        trigger: "system event: POST /optics/coating-runs/{id}/strip when strip_count after increment > MAX_STRIP_CYCLES (1)"
        actor: system
        preconditions:
          - "the coating run's coating_status == VERIFIED_FAIL"
          - "strip_count after increment > MAX_STRIP_CYCLES (1)"
        side_effects:
          - "CoatingRun.coating_status set to SCRAPPED"
          - "process_status set to SCRAPPED with scrap_reason COATING_STRIP_LIMIT, then the same hop 2 / hop 3 / hop 4 chain declared on FIGURING -> SCRAPPED runs"

  - entity: WorkOrder
    dimension: compliance_status
    initial_state: UNCLASSIFIED
    terminal_states: [BLOCKED]
    transitions:
      - from: UNCLASSIFIED
        to: SCREENED
        trigger: "POST /optics/work-orders/{id}/compliance-screen"
        actor: ExportComplianceOfficer
        preconditions:
          - "compliance_status == UNCLASSIFIED, else ERR_INVALID_STATE_TRANSITION"
          - "a governing ExportClassification exists for work_order.design_id (see conventions.governing_export_classification), else ERR_EXPORT_CLASSIFICATION_MISSING"
        side_effects:
          - "compliance_status set to SCREENED when the governing ExportClassification has classification_status == LICENSE_REQUIRED"
          - "compliance_status set to CLEARED directly when the governing ExportClassification has classification_status IN {EXEMPT_CLEARED, LICENSE_APPROVED}"
      - from: SCREENED
        to: CLEARED
        trigger: "system event: POST /optics/export-classifications/{id}/license-decision with decision APPROVED"
        actor: system
        preconditions:
          - "the ExportClassification moved to LICENSE_APPROVED"
          - "compliance_status == SCREENED"
        side_effects:
          - "compliance_status set to CLEARED for every WorkOrder with design_id == the classification's design_id and compliance_status == SCREENED, processed in created_at ASC order"
      - from: SCREENED
        to: BLOCKED
        trigger: "system event: POST /optics/export-classifications/{id}/license-decision with decision DENIED"
        actor: system
        preconditions:
          - "the ExportClassification moved to LICENSE_DENIED"
          - "compliance_status IN {UNCLASSIFIED, SCREENED, CLEARED}"
        side_effects:
          - "hop 1: the ExportClassification's classification_status set to LICENSE_DENIED"
          - "hop 2 (caused by hop 1): every WorkOrder with design_id == the classification's design_id and compliance_status IN {UNCLASSIFIED, SCREENED, CLEARED}, processed in created_at ASC order, has compliance_status set to BLOCKED"
          - "hop 3 (caused by hop 2): for each WorkOrder just blocked, every Assembly that owns an AssemblyComponent with that work_order_id and component_status == ACTIVE, processed in created_at ASC order, has assembly_status set to EXPORT_BLOCKED when its assembly_status IN {ALIGNED, SEALED} (assemblies still in KITTED, CEMENTED or MOUNTED are left alone: they cannot reach release without passing the priority-9 export gate anyway)"

  - entity: ProcessRun
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, REWORK_REQUIRED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROCESS
        trigger: "POST /optics/process-runs/{id}/start"
        actor: ProcessTechnician
        preconditions:
          - "run_status == SCHEDULED, else ERR_INVALID_STATE_TRANSITION"
          - "work_order.process_status NOT IN {HELD, SCRAPPED, CANCELLED, RELEASED_TO_ASSEMBLY}, else ERR_WORK_ORDER_NOT_IN_PROCESS"
        side_effects:
          - "run_status set to IN_PROCESS and started_at_utc set to the logical clock reading"
          - "WorkOrder.process_status set to run_stage (see §1.2 WorkOrder process_status dimension)"
      - from: IN_PROCESS
        to: AWAITING_METROLOGY
        trigger: "POST /optics/process-runs/{id}/complete"
        actor: ProcessTechnician
        preconditions:
          - "run_status == IN_PROCESS, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "material_removed_nm recorded from the payload"
          - "run_status set to AWAITING_METROLOGY"
      - from: AWAITING_METROLOGY
        to: ACCEPTED
        trigger: "system event: POST /optics/metrology-reports/{id}/sign with verdict ACCEPTED"
        actor: system
        preconditions:
          - "run_status == AWAITING_METROLOGY"
        side_effects:
          - "run_status set to ACCEPTED, then the WorkOrder stage-advance transition fires"
      - from: AWAITING_METROLOGY
        to: REWORK_REQUIRED
        trigger: "system event: POST /optics/metrology-reports/{id}/sign with verdict REWORK_REQUIRED"
        actor: system
        preconditions:
          - "run_status == AWAITING_METROLOGY"
        side_effects:
          - "run_status set to REWORK_REQUIRED, then the WorkOrder rework or scrap transition fires"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /optics/process-runs/{id}/cancel"
        actor: ProcessTechnician
        preconditions:
          - "run_status IN {SCHEDULED, IN_PROCESS}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "run_status set to CANCELLED and cancel_reason recorded"
          - "MetrologyInstrument.booked_minutes_total decremented by window_minutes (§1.3 instrument_minutes_ledger)"
      - from: IN_PROCESS
        to: CANCELLED
        trigger: "POST /optics/process-runs/{id}/cancel"
        actor: ProcessTechnician
        preconditions:
          - "run_status IN {SCHEDULED, IN_PROCESS}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side effects; WorkOrder.process_status is left where the run put it"

  - entity: MetrologyReport
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /optics/metrology-reports/{id}/sign"
        actor: MetrologyTechnician
        preconditions:
          - "report_status == DRAFT, else ERR_REPORT_ALREADY_SIGNED"
          - "the run's run_status == AWAITING_METROLOGY, else ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID != recorded_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the run's MetrologyInstrument.instrument_status == CALIBRATED at the current logical clock reading, else ERR_INSTRUMENT_CALIBRATION_OVERDUE"
        side_effects:
          - "verdict computed by §1.3 metrology_acceptance_verdict, report_status set to SIGNED, signed_by_user_id and signed_at_utc recorded"
          - "the ProcessRun AWAITING_METROLOGY -> ACCEPTED or -> REWORK_REQUIRED transition fires, which in turn drives the WorkOrder process_status dimension and, on scrap, the four-hop cascade declared there"

  - entity: CoatingRun
    initial_state: LOADED
    terminal_states: [VERIFIED_PASS, SCRAPPED]
    transitions:
      - from: LOADED
        to: DEPOSITED
        trigger: "POST /optics/coating-runs/{id}/deposit"
        actor: ProcessTechnician
        preconditions:
          - "coating_status == LOADED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "coating_status set to DEPOSITED"
      - from: DEPOSITED
        to: VERIFIED_PASS
        trigger: "POST /optics/coating-runs/{id}/spectral-verification"
        actor: ProcessTechnician
        preconditions:
          - "coating_status == DEPOSITED, else ERR_INVALID_STATE_TRANSITION"
          - "in_band_sample_count >= MIN_IN_BAND_SAMPLES (5), else ERR_SPECTRAL_SAMPLE_INSUFFICIENT"
          - "§1.3 spectral_performance_verification yields spectral_verdict == PASS"
        side_effects:
          - "spectral_samples replaced, in_band_sample_count, band_average_reflectance_pct, worst_point_reflectance_pct and spectral_verdict recomputed"
          - "coating_status set to VERIFIED_PASS"
          - "WorkOrder.process_status COATING -> COATED"
      - from: DEPOSITED
        to: VERIFIED_FAIL
        trigger: "POST /optics/coating-runs/{id}/spectral-verification"
        actor: ProcessTechnician
        preconditions:
          - "coating_status == DEPOSITED"
          - "in_band_sample_count >= MIN_IN_BAND_SAMPLES (5)"
          - "§1.3 spectral_performance_verification yields spectral_verdict == FAIL"
        side_effects:
          - "spectral_samples replaced and all three spectral outputs recomputed"
          - "coating_status set to VERIFIED_FAIL; the WorkOrder stays in COATING"
      - from: VERIFIED_FAIL
        to: LOADED
        trigger: "POST /optics/coating-runs/{id}/strip"
        actor: ProcessTechnician
        preconditions:
          - "coating_status == VERIFIED_FAIL, else ERR_INVALID_STATE_TRANSITION"
          - "strip_count after increment <= MAX_STRIP_CYCLES (1)"
        side_effects:
          - "strip_count incremented by 1, spectral_samples reset to [], the three spectral outputs reset to null/null/PENDING and in_band_sample_count to 0"
          - "coating_status set back to LOADED (this is the strip-and-recoat loop LOADED -> DEPOSITED -> VERIFIED_FAIL -> LOADED)"
      - from: VERIFIED_FAIL
        to: SCRAPPED
        trigger: "POST /optics/coating-runs/{id}/strip when strip_count after increment > MAX_STRIP_CYCLES (1)"
        actor: ProcessTechnician
        preconditions:
          - "coating_status == VERIFIED_FAIL"
          - "strip_count after increment > MAX_STRIP_CYCLES (1)"
        side_effects:
          - "strip_count incremented by 1 and coating_status set to SCRAPPED"
          - "the WorkOrder COATING -> SCRAPPED transition fires with scrap_reason COATING_STRIP_LIMIT, carrying its blank-ledger, component-void and assembly-demote hops"

  - entity: Assembly
    initial_state: KITTED
    terminal_states: [RELEASED, REJECTED, EXPORT_BLOCKED]
    transitions:
      - from: KITTED
        to: CEMENTED
        trigger: "POST /optics/assemblies/{id}/cement"
        actor: ProcessTechnician
        preconditions:
          - "assembly_status == KITTED, else ERR_INVALID_STATE_TRANSITION"
          - "count of AssemblyComponent rows with assembly_id == {id} and component_status == ACTIVE is >= 1, else ERR_ASSEMBLY_EMPTY"
        side_effects:
          - "cement_lot_code recorded and assembly_status set to CEMENTED"
      - from: CEMENTED
        to: MOUNTED
        trigger: "POST /optics/assemblies/{id}/mount"
        actor: ProcessTechnician
        preconditions:
          - "assembly_status == CEMENTED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "mount_code recorded and assembly_status set to MOUNTED"
      - from: MOUNTED
        to: ALIGNED
        trigger: "POST /optics/assemblies/{id}/align"
        actor: ProcessTechnician
        preconditions:
          - "assembly_status == MOUNTED, else ERR_INVALID_STATE_TRANSITION"
          - "count of AssemblyComponent rows with assembly_id == {id} and component_status == ACTIVE is >= 1, else ERR_ASSEMBLY_EMPTY"
          - "every AssemblyComponent with assembly_id == {id} and component_status == ACTIVE has its WorkOrder.process_status == RELEASED_TO_ASSEMBLY, else ERR_COMPONENT_NOT_RELEASED"
          - "§1.3 assembly_transmitted_wavefront yields total_transmitted_wavefront_waves <= design.transmitted_wavefront_budget_waves"
        side_effects:
          - "the five §1.3 assembly_transmitted_wavefront outputs are written to the assembly"
          - "assembly_status set to ALIGNED"
      - from: MOUNTED
        to: MOUNTED
        trigger: "POST /optics/assemblies/{id}/align when the computed total exceeds the budget"
        actor: ProcessTechnician
        preconditions:
          - "assembly_status == MOUNTED"
          - "§1.3 assembly_transmitted_wavefront yields total_transmitted_wavefront_waves > design.transmitted_wavefront_budget_waves"
          - "alignment_attempt_count after increment is < MAX_ALIGNMENT_ATTEMPTS (3)"
        side_effects:
          - "the five §1.3 assembly_transmitted_wavefront outputs are written to the assembly"
          - "alignment_attempt_count incremented by 1; assembly_status stays MOUNTED (self-loop) and the request returns 200"
      - from: MOUNTED
        to: REJECTED
        trigger: "POST /optics/assemblies/{id}/align when the budget is exceeded for the MAX_ALIGNMENT_ATTEMPTS-th time"
        actor: ProcessTechnician
        preconditions:
          - "assembly_status == MOUNTED"
          - "total_transmitted_wavefront_waves > design.transmitted_wavefront_budget_waves"
          - "alignment_attempt_count after increment >= MAX_ALIGNMENT_ATTEMPTS (3)"
        side_effects:
          - "alignment_attempt_count incremented by 1 and assembly_status set to REJECTED"
      - from: ALIGNED
        to: MOUNTED
        trigger: "system event: an AssemblyComponent of this assembly is VOIDED by a WorkOrder scrap cascade"
        actor: system
        preconditions:
          - "assembly_status IN {ALIGNED, SEALED}"
        side_effects:
          - "the five §1.3 assembly_transmitted_wavefront outputs recomputed over the remaining ACTIVE components (all five set to null when no ACTIVE component remains)"
          - "assembly_status set back to MOUNTED; alignment_attempt_count is left unchanged"
      - from: ALIGNED
        to: SEALED
        trigger: "POST /optics/assemblies/{id}/seal"
        actor: ProcessTechnician
        preconditions:
          - "assembly_status == ALIGNED, else ERR_INVALID_STATE_TRANSITION"
          - "the assembly's latest InspectionRecord (greatest created_at) has inspection_status IN {PASSED, WAIVED}, and at least one InspectionRecord exists, else ERR_INSPECTION_NOT_PASSED"
        side_effects:
          - "assembly_status set to SEALED"
      - from: SEALED
        to: RELEASED
        trigger: "POST /optics/assemblies/{id}/release"
        actor: QualityManager
        preconditions:
          - "assembly_status == SEALED, else ERR_INVALID_STATE_TRANSITION"
          - "a governing ExportClassification exists for design_id, else ERR_EXPORT_CLASSIFICATION_MISSING"
          - "that classification's classification_status IN {EXEMPT_CLEARED, LICENSE_APPROVED}, else ERR_EXPORT_LICENSE_NOT_APPROVED"
          - "a DocumentationPackage exists for assembly_id, else ERR_DOCUMENTATION_PACKAGE_NOT_FOUND"
          - "that package's package_status == APPROVED, else ERR_DOCUMENTATION_NOT_APPROVED"
        side_effects:
          - "assembly_status set to RELEASED and released_at_utc set to the logical clock reading"
      - from: ALIGNED
        to: EXPORT_BLOCKED
        trigger: "system event: POST /optics/export-classifications/{id}/license-decision with decision DENIED, or POST /optics/export-classifications/{id}/revocation"
        actor: system
        preconditions:
          - "the assembly owns an ACTIVE AssemblyComponent whose WorkOrder was just moved to compliance_status BLOCKED"
        side_effects:
          - "assembly_status set to EXPORT_BLOCKED"
          - "the five transmitted-wavefront outputs computed by the last align are left untouched (an export block is a paperwork state, not a re-measurement)"
      - from: SEALED
        to: EXPORT_BLOCKED
        trigger: "system event: POST /optics/export-classifications/{id}/license-decision with decision DENIED, or POST /optics/export-classifications/{id}/revocation"
        actor: system
        preconditions:
          - "the assembly owns an ACTIVE AssemblyComponent whose WorkOrder was just moved to compliance_status BLOCKED"
        side_effects:
          - "assembly_status set to EXPORT_BLOCKED"

  - entity: InspectionRecord
    initial_state: PASSED
    terminal_states: [PASSED, WAIVED]
    transitions:
      - from: PASSED
        to: PASSED
        trigger: "POST /optics/inspection-records"
        actor: MetrologyTechnician
        preconditions:
          - "the assembly's assembly_status IN {MOUNTED, ALIGNED, SEALED}, else ERR_INVALID_STATE_TRANSITION"
          - "§1.3 cleanliness_inspection_verdict yields scratch_dig_pass == true AND cleanliness_pass == true"
        side_effects:
          - "inspection_status set to PASSED at creation; inspected_by_user_id recorded from X-User-ID"
        note: "The record is created directly in its computed state; PASSED and FAILED are both create-time initial states."
      - from: PASSED
        to: FAILED
        trigger: "POST /optics/inspection-records"
        actor: MetrologyTechnician
        preconditions:
          - "the assembly's assembly_status IN {MOUNTED, ALIGNED, SEALED}"
          - "§1.3 cleanliness_inspection_verdict yields scratch_dig_pass == false OR cleanliness_pass == false"
        side_effects:
          - "inspection_status set to FAILED at creation; inspected_by_user_id recorded from X-User-ID"
      - from: FAILED
        to: WAIVED
        trigger: "POST /optics/inspection-records/{id}/waiver"
        actor: QualityManager
        preconditions:
          - "inspection_status == FAILED, else ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID != inspected_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "cleanliness_pass == true AND max_dig_number <= design.scratch_dig_dig_limit * 2 AND max_scratch_number <= design.scratch_dig_scratch_limit * 2, else ERR_DEFECT_NOT_WAIVABLE"
          - "len(justification) >= 20, else ERR_INVALID_REQUEST"
        side_effects:
          - "inspection_status set to WAIVED, waived_by_user_id and waiver_justification recorded"
          - "every DocumentationPackage with assembly_id == this record's assembly_id recomputes required_document_types, missing_document_types and completeness_pct, which now include INSPECTION_WAIVER"

  - entity: ExportClassification
    initial_state: LICENSE_REQUIRED
    terminal_states: [EXEMPT_CLEARED, LICENSE_APPROVED, LICENSE_DENIED]
    transitions:
      - from: LICENSE_REQUIRED
        to: LICENSE_REQUIRED
        trigger: "POST /optics/export-classifications"
        actor: ExportComplianceOfficer
        preconditions:
          - "no other ExportClassification with the same design_id has classification_status != LICENSE_DENIED, else ERR_EXPORT_CLASSIFICATION_EXISTS"
          - "§1.3 export_control_classification yields license_required == true"
        side_effects:
          - "figure_of_merit, eccn and license_required computed; classification_status set to LICENSE_REQUIRED at creation"
      - from: LICENSE_REQUIRED
        to: EXEMPT_CLEARED
        trigger: "POST /optics/export-classifications"
        actor: ExportComplianceOfficer
        preconditions:
          - "no other ExportClassification with the same design_id has classification_status != LICENSE_DENIED"
          - "§1.3 export_control_classification yields license_required == false"
        side_effects:
          - "figure_of_merit, eccn and license_required computed; classification_status set to EXEMPT_CLEARED at creation"
      - from: LICENSE_REQUIRED
        to: LICENSE_APPROVED
        trigger: "POST /optics/export-classifications/{id}/license-decision with decision APPROVED"
        actor: ExportComplianceOfficer
        preconditions:
          - "classification_status == LICENSE_REQUIRED, else ERR_EXPORT_ALREADY_DECIDED"
        side_effects:
          - "classification_status set to LICENSE_APPROVED, license_number and decided_by_user_id recorded"
          - "every WorkOrder with design_id == this design and compliance_status == SCREENED moves SCREENED -> CLEARED"
      - from: LICENSE_REQUIRED
        to: LICENSE_DENIED
        trigger: "POST /optics/export-classifications/{id}/license-decision with decision DENIED"
        actor: ExportComplianceOfficer
        preconditions:
          - "classification_status == LICENSE_REQUIRED, else ERR_EXPORT_ALREADY_DECIDED"
        side_effects:
          - "the three-hop cascade declared on §1.2 WorkOrder compliance_status SCREENED -> BLOCKED fires"
      - from: LICENSE_APPROVED
        to: LICENSE_DENIED
        trigger: "POST /optics/export-classifications/{id}/revocation"
        actor: ExportComplianceOfficer
        preconditions:
          - "classification_status == LICENSE_APPROVED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "hop 1: classification_status set to LICENSE_DENIED and decision_note set to the revocation reason"
          - "hop 2 (caused by hop 1): every WorkOrder with design_id == this design and compliance_status IN {UNCLASSIFIED, SCREENED, CLEARED}, processed in created_at ASC order, has compliance_status set to BLOCKED"
          - "hop 3 (caused by hop 2): for each WorkOrder just blocked, every Assembly that owns an AssemblyComponent with that work_order_id and component_status == ACTIVE, processed in created_at ASC order, has assembly_status set to EXPORT_BLOCKED when its assembly_status IN {ALIGNED, SEALED} (assemblies still in KITTED, CEMENTED or MOUNTED are left alone: they cannot reach release without passing the priority-9 export gate anyway)"
        note: "Licence revocation by the issuing authority. This is the only path on which hop 3 is observable: a work order can only reach RELEASED_TO_ASSEMBLY (and so own an AssemblyComponent) after its licence was APPROVED, so the denial that reaches an assembly must be a revocation of an approved licence, not a first-instance denial. Side-effect order is pinned hop 1 -> hop 2 -> hop 3."

  - entity: DocumentationPackage
    initial_state: ASSEMBLING
    terminal_states: [APPROVED]
    transitions:
      - from: ASSEMBLING
        to: SUBMITTED
        trigger: "POST /optics/documentation-packages/{id}/submit"
        actor: QualityManager
        preconditions:
          - "package_status == ASSEMBLING, else ERR_INVALID_STATE_TRANSITION"
          - "completeness_pct == 100.00, else ERR_DOCUMENTATION_INCOMPLETE"
        side_effects:
          - "package_status set to SUBMITTED and submitted_by_user_id recorded"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /optics/documentation-packages/{id}/review with decision APPROVED"
        actor: QualityManager
        preconditions:
          - "package_status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
          - "completeness_pct == 100.00, else ERR_DOCUMENTATION_INCOMPLETE"
        side_effects:
          - "package_status set to APPROVED, reviewed_by_user_id and last_review_note recorded"
      - from: SUBMITTED
        to: ASSEMBLING
        trigger: "POST /optics/documentation-packages/{id}/review with decision REJECTED"
        actor: QualityManager
        preconditions:
          - "package_status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "package_status set back to ASSEMBLING, rejection_count incremented by 1, reviewed_by_user_id and last_review_note recorded"
        note: "This is the revision loop ASSEMBLING -> SUBMITTED -> ASSEMBLING; further documents may then be attached."

# =============================================================================
# §1.2.1 Concurrency rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: design-revision-supersede
    parent_entity: OpticalDesign
    write_endpoint: "POST /optics/optical-designs/{id}/revisions"
    occ_field: "expected_design_version"
    description: |
      Creating a revision of an OpticalDesign whose version has advanced since the
      client last read it is rejected. A revision legitimately supersedes the
      predecessor, so a writer holding a stale view would otherwise branch the
      revision chain off an already superseded generation.
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412

  - rule_id: work-order-create-stale-glass-lot
    parent_entity: GlassLot
    write_endpoint: "POST /optics/work-orders"
    occ_field: "expected_glass_lot_version"
    description: |
      Creating a WorkOrder against a GlassLot whose version has advanced since the
      client last read it is rejected. Two WorkOrders drawing blanks from the same
      lot are both legitimate, so nothing in the state machine stops the second
      writer; the stale version check is what forces the client to re-read the
      blank ledger before committing another reservation.
    error_id: ERR_STALE_GLASS_LOT_VERSION
    http_status: 412

  - rule_id: component-add-stale-assembly
    parent_entity: Assembly
    write_endpoint: "POST /optics/assembly-components"
    occ_field: "expected_assembly_version"
    description: |
      Adding an AssemblyComponent to an Assembly whose version has advanced since
      the client last read it is rejected. Adding a second element to the same
      assembly is legitimate, so the stale version check is the only thing that
      prevents a writer from populating a slot table it has not re-read.
    error_id: ERR_STALE_ASSEMBLY_VERSION
    http_status: 412

# =============================================================================
# Cross-cutting conventions referenced by §1.2–§1.5
# =============================================================================
conventions:
  created_at_ordering: |
    `created_at` is stamped by the server's own monotonically increasing row
    sequence (ISO 8601 UTC, three fractional digits) and is strictly increasing
    across all rows of a table, independently of the logical clock. Every
    ordering rule in this scaffold that says "created_at ASC" is therefore total
    and needs no further tie-break. `id` is a server-minted UUID used for
    identity only and MUST NOT participate in any ordering, ranking, selection
    or tie-break decision.
  logical_clock: |
    Business timestamps (started_at_utc, signed_at_utc, released_at_utc,
    attached_at_utc, days_since_calibration) read the logical clock, which
    starts at 2026-08-01T00:00:00Z and only moves via
    POST /_clock/set_current_utc. It never falls back to wall-clock time.
  governing_export_classification: |
    The governing ExportClassification of a design is the single
    ExportClassification row with that design_id whose classification_status !=
    LICENSE_DENIED. §1.4 priority 22 makes that row unique by rejecting a second
    create while one exists. When every row for the design is LICENSE_DENIED the
    design has no governing classification and gates that require one raise
    ERR_EXPORT_CLASSIFICATION_MISSING.
  grade_ranks: |
    INDEX_HOMOGENEITY_RANK = { H1: 1, H2: 2, H3: 3, H4: 4, H5: 5 } and
    STRIAE_RANK = { A: 1, B: 2, C: 3, D: 4 }; a lot satisfies a design when
    RANK(lot effective grade) <= RANK(design limit grade) for both scales.
  rounding: |
    round_half_up(x, n) rounds the exact decimal value of x to n decimal places,
    halves away from zero. Every calculation states its own decimal places and
    the order in which rounding is applied.

# =============================================================================
# §1.3 Calculation rules table
# =============================================================================
calculations:

  - name: tolerance_stack_analysis
    trigger: "POST /optics/optical-designs/{id}/tolerance-analysis (transition OpticalDesign DRAFT -> TOLERANCED)"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — per-contributor contribution, ALREADY rounded at create time and
      # stored on ToleranceAllocation.contribution_waves:
      #   c_i = round_half_up(a.sensitivity_waves_per_unit * a.manufacturing_tolerance_units, 4)
      # Step 2 — combine the stored, already-rounded c_i values. The rounding
      # order is PINNED: round each contributor to 4 dp FIRST, then combine, then
      # round the combined value to 4 dp. Combining raw unrounded products and
      # rounding once at the end is WRONG and produces different cents-level
      # values (e.g. four contributors of 0.00125 each give worst_case 0.0052
      # under the pinned order and 0.0050 under the wrong order).
      rss_stack_waves        = round_half_up(sqrt(sum over i of c_i * c_i), 4)
      worst_case_stack_waves = round_half_up(sum over i of c_i, 4)
      governing_stack_waves  = rss_stack_waves        if design.tolerance_method == STATISTICAL
                             = worst_case_stack_waves if design.tolerance_method == WORST_CASE
      allocated_tolerance_waves = governing_stack_waves
      tolerance_verdict = PASS if governing_stack_waves <= design.tolerance_budget_waves else FAIL
    input_set: "ToleranceAllocation rows with design_id == {id} AND allocation_status == ACTIVE, enumerated in created_at ASC order (the order does not change either output; it is pinned so the response is reproducible). RETIRED rows are excluded. An empty input set is rejected with ERR_TOLERANCE_STACK_EMPTY before any output is written."
    constants:
      CONTRIBUTION_DECIMALS: 4
      STACK_DECIMALS: 4
    precision: "4 decimal places, round_half_up, applied twice: once per contributor at create time, once on the combined value"
    variants:
      - name: STATISTICAL
        when: "design.tolerance_method == STATISTICAL (the create-time default)"
        difference: "Root-sum-square of the contributions: statistically independent error sources partially cancel, so the stack is smaller than the arithmetic sum whenever more than one contributor is non-zero."
      - name: WORST_CASE
        when: "design.tolerance_method == WORST_CASE"
        difference: "Arithmetic sum of the same contributions: assumes every error source lands at its limit with the same sign. On the same four allocations the two variants give 0.0735 vs 0.1470 waves, which straddles a 0.0800 budget and flips tolerance_verdict from PASS to FAIL."

  - name: spectral_performance_verification
    trigger: "POST /optics/coating-runs/{id}/spectral-verification (transition CoatingRun DEPOSITED -> VERIFIED_PASS | VERIFIED_FAIL)"
    algorithm: aggregation
    formula: |
      design = the OpticalDesign of the coating run's WorkOrder
      in_band = [ s for s in payload.spectral_samples
                  if design.wavelength_min_nm <= s.wavelength_nm <= design.wavelength_max_nm ]
      # Band membership is INCLUSIVE at both ends: a sample exactly at
      # wavelength_max_nm counts, a sample one nm above it does not.
      in_band_sample_count = len(in_band)
      if in_band_sample_count < MIN_IN_BAND_SAMPLES: reject ERR_SPECTRAL_SAMPLE_INSUFFICIENT
      band_average_reflectance_pct = round_half_up(
          (sum of s.reflectance_pct for s in in_band) / in_band_sample_count, 4)
      worst_point_reflectance_pct  = round_half_up(max(s.reflectance_pct for s in in_band), 4)
      band_average_ok = band_average_reflectance_pct <= MAX_BAND_AVERAGE_REFLECTANCE_PCT
      worst_point_ok  = worst_point_reflectance_pct  <= MAX_POINT_REFLECTANCE_PCT
      spectral_verdict = PASS if (band_average_ok AND worst_point_ok) else FAIL
    input_set: "Only the spectral_samples array of THIS request; the array replaces any previously stored samples on the run. Out-of-band samples are stored but excluded from both aggregates."
    constants:
      MIN_IN_BAND_SAMPLES: 5
      MAX_BAND_AVERAGE_REFLECTANCE_PCT: 0.5000
      MAX_POINT_REFLECTANCE_PCT: 1.2000
      AGGREGATE_DECIMALS: 4
    precision: "4 decimal places, round_half_up; the average is summed at full precision and rounded once"
    variants:
      - name: BAND_AVERAGE
        when: "Always computed; governs together with WORST_POINT"
        difference: "Mean in-band reflectance judged against 0.5000 %: a single narrow spike is diluted by the other samples and passes."
      - name: WORST_POINT
        when: "Always computed; governs together with BAND_AVERAGE"
        difference: "Maximum in-band reflectance judged against 1.2000 %: the same spike fails. On the sample set {480:0.2000, 550:0.1800, 600:0.2200, 650:0.2500, 700:1.3500} the variants give 0.4400 (pass) and 1.3500 (fail), so the pinned conjunction yields FAIL."

  - name: metrology_capability_index
    trigger: "POST /optics/process-runs (evaluated at scheduling and frozen into ProcessRun.capability_ratio_at_scheduling)"
    algorithm: threshold
    formula: |
      days_since_calibration = floor((logical_clock_now - instrument.last_calibrated_utc) / 86400 seconds)
      effective_uncertainty_waves = round_half_up(
          min( instrument.base_uncertainty_waves * (1 + UNCERTAINTY_DRIFT_PER_DAY * days_since_calibration),
               UNCERTAINTY_DRIFT_CAP_MULTIPLE * instrument.base_uncertainty_waves ), 6)
      capability_ratio = round_half_up(
          K_TEST_ACCURACY * effective_uncertainty_waves / design.tolerance_budget_waves, 4)
      # Gate is inclusive: a ratio of exactly 0.2500 is accepted.
      if capability_ratio > MAX_CAPABILITY_RATIO: reject ERR_METROLOGY_CAPABILITY_INSUFFICIENT
    input_set: "The single MetrologyInstrument named by the request and the OpticalDesign of the request's WorkOrder. Three inputs interact non-linearly: the linear drift term is clipped by the cap multiple (min), and the clipped uncertainty is then scaled against the design budget."
    constants:
      K_TEST_ACCURACY: 4
      UNCERTAINTY_DRIFT_PER_DAY: 0.0200
      UNCERTAINTY_DRIFT_CAP_MULTIPLE: 2
      MAX_CAPABILITY_RATIO: 0.2500
      UNCERTAINTY_DECIMALS: 6
      RATIO_DECIMALS: 4
    precision: "effective_uncertainty_waves to 6 decimals, capability_ratio to 4 decimals, both round_half_up"

  - name: assembly_transmitted_wavefront
    trigger: "POST /optics/assemblies/{id}/align, and recomputed by the AssemblyComponent VOIDED cascade (§1.2 WorkOrder FIGURING -> SCRAPPED hop 4)"
    algorithm: constraint_propagation
    formula: |
      comps = AssemblyComponent rows with assembly_id == {id} AND component_status == ACTIVE
      element_rss_waves = round_half_up(
          sqrt(sum over comps of c.element_wavefront_rms_waves ^ 2), 4)
      centration_error_waves = round_half_up(sqrt(sum over comps of (
            (c.decenter_um  * DECENTER_SENSITIVITY_WAVES_PER_UM) ^ 2
          + (c.tilt_arcmin  * TILT_SENSITIVITY_WAVES_PER_ARCMIN) ^ 2 )), 4)
      subtotal_waves = round_half_up(element_rss_waves + centration_error_waves, 4)
      # EVALUATION ORDER IS PINNED. The cement derate tier is selected from
      # subtotal_waves — the value BEFORE the derate is added. It is never
      # re-selected from total_transmitted_wavefront_waves, and the calculation
      # is single-pass (no fixed-point iteration).
      cement_derate_waves = 0.0020 if subtotal_waves <  0.0500
                          = 0.0060 if 0.0500 <= subtotal_waves < 0.1000
                          = 0.0150 if subtotal_waves >= 0.1000
      total_transmitted_wavefront_waves = round_half_up(subtotal_waves + cement_derate_waves, 4)
      aligned = total_transmitted_wavefront_waves <= design.transmitted_wavefront_budget_waves
    input_set: "AssemblyComponent rows of the assembly with component_status == ACTIVE, enumerated created_at ASC (order-independent for both sums; pinned for reproducibility). VOIDED components are excluded, which is what makes the cascade recomputation observable. When no ACTIVE component remains all five outputs are set to null and align is rejected with ERR_ASSEMBLY_EMPTY."
    constants:
      DECENTER_SENSITIVITY_WAVES_PER_UM: 0.0012
      TILT_SENSITIVITY_WAVES_PER_ARCMIN: 0.0080
      CEMENT_DERATE_TIER_1_LIMIT: 0.0500
      CEMENT_DERATE_TIER_2_LIMIT: 0.1000
      CEMENT_DERATE_TIER_1_WAVES: 0.0020
      CEMENT_DERATE_TIER_2_WAVES: 0.0060
      CEMENT_DERATE_TIER_3_WAVES: 0.0150
      MAX_ALIGNMENT_ATTEMPTS: 3
    precision: "4 decimal places, round_half_up at each of the four named intermediates"

  - name: metrology_acceptance_verdict
    trigger: "POST /optics/metrology-reports/{id}/sign (transition MetrologyReport DRAFT -> SIGNED)"
    algorithm: threshold
    formula: |
      design = the OpticalDesign of the report's ProcessRun's WorkOrder
      stage_figure_budget_waves = design.surface_figure_budget_waves
                                * STAGE_FIGURE_MULTIPLIER[run.run_stage]
      figure_ok    = report.surface_rms_waves <= stage_figure_budget_waves
      roughness_ok = true if run.run_stage == GRINDING
                     else report.surface_roughness_nm_rms <= design.surface_roughness_budget_nm
      twf_ok       = true if run.run_stage != FIGURING
                     else report.transmitted_wavefront_rms_waves <= design.transmitted_wavefront_budget_waves
      verdict = ACCEPTED if (figure_ok AND roughness_ok AND twf_ok) else REWORK_REQUIRED
      # All three gates are inclusive: a measurement exactly at its budget is ACCEPTED.
    input_set: "The single MetrologyReport being signed, its ProcessRun (for run_stage) and the design of the run's WorkOrder. Which gates apply is conditional on run_stage."
    constants:
      STAGE_FIGURE_MULTIPLIER: { GRINDING: 10, POLISHING: 3, FIGURING: 1 }
      STAGE_ADVANCE_MAP: { GRINDING: POLISHING, POLISHING: FIGURING, FIGURING: FIGURE_ACCEPTED }
    precision: "Comparisons are made on the stored 4-decimal values; stage_figure_budget_waves is stored to 4 decimals, round_half_up"

  - name: figuring_removal_convergence
    trigger: "system event: every POST /optics/metrology-reports/{id}/sign, after the ProcessRun reaches ACCEPTED or REWORK_REQUIRED"
    algorithm: chronological
    formula: |
      runs = ProcessRun rows with work_order_id == wo.id
             AND run_status IN {ACCEPTED, REWORK_REQUIRED}
             AND material_removed_nm IS NOT NULL,
             processed in started_at_utc ASC order, tie-break created_at ASC
      cumulative_removal_nm = sum over runs of run.material_removed_nm
      remaining_center_thickness_um = round_half_up(
          wo.blank_center_thickness_um - cumulative_removal_nm / 1000.0, 4)
      # Scrap adjudication, evaluated in this pinned order after the increment of
      # figuring_iteration_count:
      #   1. remaining_center_thickness_um < design.min_center_thickness_um
      #        -> process_status SCRAPPED, scrap_reason MIN_THICKNESS_BREACH
      #   2. figuring_iteration_count >= MAX_FIGURING_ITERATIONS
      #        -> process_status SCRAPPED, scrap_reason FIGURE_CONVERGENCE_FAILURE
      #   3. otherwise the FIGURING -> POLISHING rework loop is taken
    input_set: "ProcessRun rows of the work order whose run_status is ACCEPTED or REWORK_REQUIRED. CANCELLED, SCHEDULED, IN_PROCESS and AWAITING_METROLOGY runs never contribute, so a cancelled run's removal is excluded even when material_removed_nm was recorded before cancellation."
    constants:
      MAX_FIGURING_ITERATIONS: 2
      THICKNESS_DECIMALS: 4
      NM_PER_UM: 1000.0
    precision: "4 decimal places, round_half_up on remaining_center_thickness_um; cumulative_removal_nm is an exact sum of the recorded values"

  - name: blank_conservation_ledger
    trigger: "POST /optics/work-orders (reserve), POST /optics/work-orders/{id}/cancel (release), POST /optics/work-orders/{id}/release-to-assembly (consume), and the WorkOrder -> SCRAPPED cascade (write-off)"
    algorithm: aggregation
    formula: |
      # Reservation sizing, frozen on the WorkOrder at create time:
      spare_blank_count     = max(MIN_SPARE_BLANKS, ceil(element_count * SPARE_BLANK_RATE))
      reserved_blank_count  = element_count + spare_blank_count
      # Ledger moves on the GlassLot, each applied atomically:
      #   reserve  : reserved += wo.reserved_blank_count
      #   release  : reserved -= wo.reserved_blank_count
      #   consume  : reserved -= wo.reserved_blank_count ; consumed += wo.element_count
      #   write-off: reserved -= wo.reserved_blank_count ; scrapped += wo.reserved_blank_count
      available_blank_count = total_blank_count - reserved_blank_count
                            - consumed_blank_count - scrapped_blank_count
      # INVARIANT (checked after every move):
      #   total_blank_count == available_blank_count + reserved_blank_count
      #                      + consumed_blank_count + scrapped_blank_count
      # Reservation is admissible only when available_blank_count >= wo.reserved_blank_count
      # BEFORE the move (inclusive: exact equality is admissible), else
      # ERR_INSUFFICIENT_BLANKS.
    input_set: "The single GlassLot named by the WorkOrder and that WorkOrder's frozen reserved_blank_count / element_count. On consume, the spare_blank_count difference returns to available_blank_count implicitly through the formula."
    constants:
      SPARE_BLANK_RATE: 0.25
      MIN_SPARE_BLANKS: 1
    precision: "Integer arithmetic only; ceil applied to the spare term"

  - name: instrument_minutes_ledger
    trigger: "POST /optics/process-runs (book), POST /optics/process-runs/{id}/cancel (release), and the ProcessRun CANCELLED cascades from GlassLot block and WorkOrder cancel"
    algorithm: aggregation
    formula: |
      window_minutes = floor((run.metrology_window_end_utc - run.metrology_window_start_utc) / 60 seconds)
      # book   : instrument.booked_minutes_total += run.window_minutes
      # release: instrument.booked_minutes_total -= run.window_minutes
      # INVARIANT (checked after every move):
      #   instrument.booked_minutes_total == sum of window_minutes over ProcessRun rows
      #   with that metrology_instrument_id and run_status IN
      #   {SCHEDULED, IN_PROCESS, AWAITING_METROLOGY, ACCEPTED, REWORK_REQUIRED}
      # Interval admissibility on the same instrument (exclusive occupation with a
      # symmetric purge buffer, CLOSED endpoints):
      #   conflict iff  new_start < other_end + INSTRUMENT_PURGE_MINUTES
      #             AND other_start < new_end + INSTRUMENT_PURGE_MINUTES
      #   over other runs with run_status IN {SCHEDULED, IN_PROCESS, AWAITING_METROLOGY}
      #   A gap of exactly INSTRUMENT_PURGE_MINUTES is admissible; 14 minutes is not.
      # Window shape: MIN_WINDOW_MINUTES <= window_minutes <= MAX_WINDOW_MINUTES and
      # metrology_window_end_utc > metrology_window_start_utc, else ERR_INVALID_WINDOW.
    input_set: "ProcessRun rows on the same metrology_instrument_id whose run_status is SCHEDULED, IN_PROCESS or AWAITING_METROLOGY; CANCELLED, ACCEPTED and REWORK_REQUIRED runs no longer occupy the station and are excluded from the conflict scan (but ACCEPTED and REWORK_REQUIRED still count toward booked_minutes_total as consumed capacity)."
    constants:
      INSTRUMENT_PURGE_MINUTES: 15
      MIN_WINDOW_MINUTES: 30
      MAX_WINDOW_MINUTES: 480
    precision: "Whole minutes, floor"

  - name: chamber_capacity_occupancy
    trigger: "POST /optics/coating-runs"
    algorithm: interval_merge
    formula: |
      # Chamber bookings are HALF-OPEN intervals [window_start_utc, window_end_utc):
      #   overlaps(a, b) iff a.window_start_utc < b.window_end_utc
      #                  AND b.window_start_utc < a.window_end_utc
      # Touching bookings (previous.window_end_utc == new.window_start_utc) do NOT
      # overlap and are always admissible — there is no purge buffer on a chamber.
      occupancy = count of CoatingRun rows with the same coating_chamber_id,
                  coating_status IN {LOADED, DEPOSITED, VERIFIED_FAIL},
                  that overlap the requested interval
      if occupancy >= chamber.slot_capacity: reject ERR_CHAMBER_CAPACITY_EXCEEDED
      # Aggregate capacity, inclusive at the limit: with slot_capacity 2 the third
      # overlapping booking is the one rejected.
      # Window shape: MIN_WINDOW_MINUTES <= floor((end - start)/60) <= MAX_WINDOW_MINUTES
      # and end > start, else ERR_INVALID_WINDOW.
    input_set: "CoatingRun rows on the same chamber whose coating_status is LOADED, DEPOSITED or VERIFIED_FAIL. VERIFIED_PASS and SCRAPPED runs have left the chamber and are excluded."
    constants:
      MIN_WINDOW_MINUTES: 30
      MAX_WINDOW_MINUTES: 480
    precision: "Whole minutes, floor; comparisons on instants"

  - name: cleanliness_inspection_verdict
    trigger: "POST /optics/inspection-records"
    algorithm: threshold
    formula: |
      design = the OpticalDesign of the record's Assembly
      scratch_dig_pass = (record.max_scratch_number <= design.scratch_dig_scratch_limit)
                     AND (record.max_dig_number     <= design.scratch_dig_dig_limit)
                     AND (record.scratch_count_at_limit <= MAX_SCRATCHES_AT_LIMIT)
      cleanliness_pass = record.particle_count_per_cm2 <= design.cleanliness_limit_per_cm2
      inspection_status = PASSED if (scratch_dig_pass AND cleanliness_pass) else FAILED
      # All four comparisons are inclusive.
      # Waiver admissibility (POST /optics/inspection-records/{id}/waiver):
      #   waivable iff cleanliness_pass == true
      #            AND record.max_dig_number     <= design.scratch_dig_dig_limit * 2
      #            AND record.max_scratch_number <= design.scratch_dig_scratch_limit * 2
      #   else ERR_DEFECT_NOT_WAIVABLE
    input_set: "The single InspectionRecord being created and the design of its Assembly."
    constants:
      MAX_SCRATCHES_AT_LIMIT: 2
      WAIVER_DEFECT_MULTIPLE: 2
    precision: "Integer comparisons"

  - name: documentation_completeness
    trigger: "POST /optics/documentation-packages, POST /optics/documentation-packages/{id}/documents, and every cascade that changes the assembly's coating, waiver or export facts"
    algorithm: aggregation
    formula: |
      required = set(BASE_DOCUMENT_TYPES)
      if EXISTS CoatingRun cr with coating_status == VERIFIED_PASS
         AND cr.work_order_id IN { c.work_order_id : c is an AssemblyComponent of the
             package's assembly with component_status == ACTIVE }:
          required += { COATING_SPECTRAL_DATA }
      if the governing ExportClassification of the assembly's design exists
         AND its license_required == true:
          required += { EXPORT_LICENSE }
      if EXISTS InspectionRecord ir with ir.assembly_id == package.assembly_id
         AND ir.inspection_status == WAIVED:
          required += { INSPECTION_WAIVER }
      required_document_types = sorted(required) ASC by document_type name
      present_document_types  = [ d.document_type for d in attached_documents ]  # attachment order
      missing_document_types  = sorted(required - set(present_document_types)) ASC
      completeness_pct = round_half_up(
          100.0 * len(required ∩ set(present_document_types)) / len(required_document_types), 2)
      # Documents outside `required` are stored but never raise completeness_pct.
      # Submit and approve both demand completeness_pct == 100.00 exactly.
    input_set: "The package's attached_documents array plus three cross-entity predicates evaluated at read time: CoatingRun rows in VERIFIED_PASS for the assembly's ACTIVE components, the governing ExportClassification of the assembly's design, and InspectionRecord rows of the assembly in WAIVED."
    constants:
      BASE_DOCUMENT_TYPES: [CERTIFICATE_OF_CONFORMANCE, MELT_CERTIFICATE, INTERFEROGRAM_REPORT]
      DOCUMENT_TYPE_ENUM: [CERTIFICATE_OF_CONFORMANCE, COATING_SPECTRAL_DATA, EXPORT_LICENSE, INSPECTION_WAIVER, INTERFEROGRAM_REPORT, MELT_CERTIFICATE]
      PCT_DECIMALS: 2
    precision: "2 decimal places, round_half_up"

  - name: export_control_classification
    trigger: "POST /optics/export-classifications"
    algorithm: threshold
    formula: |
      design = the OpticalDesign named by design_id
      figure_of_merit = round_half_up(design.aperture_mm / design.required_rms_wavefront_waves, 2)
      controlled = ( design.aperture_mm >= CONTROLLED_APERTURE_MM
                     AND design.required_rms_wavefront_waves <= CONTROLLED_RMS_WAVES )
                   OR figure_of_merit >= CONTROLLED_FIGURE_OF_MERIT
      eccn = "6A004.A.1" if controlled else "EAR99"
      license_required = controlled
                         AND destination_country NOT IN LICENSE_EXEMPT_DESTINATIONS
      classification_status = LICENSE_REQUIRED if license_required else EXEMPT_CLEARED
      # Every threshold is inclusive: aperture exactly 100.0 mm with RMS exactly
      # 0.0500 waves is controlled, and a figure_of_merit of exactly 4000.00 is
      # controlled even at 80 mm aperture.
    input_set: "The single OpticalDesign named by design_id and the request's destination_country."
    constants:
      CONTROLLED_APERTURE_MM: 100.0
      CONTROLLED_RMS_WAVES: 0.0500
      CONTROLLED_FIGURE_OF_MERIT: 4000.00
      LICENSE_EXEMPT_DESTINATIONS: [CA, AU, GB]
      FOM_DECIMALS: 2
    precision: "2 decimal places, round_half_up on figure_of_merit"

# =============================================================================
# §1.4 Validation rules table (evaluated in ascending priority order; the FIRST
# violated rule determines the response, and no later rule is evaluated)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the request PATH resolves to a stored row, validated left-to-right"
    error_id: "ERR_DESIGN_NOT_FOUND | ERR_GLASS_LOT_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_PROCESS_RUN_NOT_FOUND | ERR_METROLOGY_REPORT_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_CHAMBER_NOT_FOUND | ERR_COATING_RUN_NOT_FOUND | ERR_ASSEMBLY_NOT_FOUND | ERR_INSPECTION_RECORD_NOT_FOUND | ERR_EXPORT_CLASSIFICATION_NOT_FOUND | ERR_DOCUMENTATION_PACKAGE_NOT_FOUND | ERR_TOLERANCE_ALLOCATION_NOT_FOUND (whichever collection the segment addresses)"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "every foreign-key id in the request BODY resolves to a stored row, validated in the order the fields are listed in the endpoint's input:"
    error_id: "the NOT_FOUND code of the referenced entity (same catalog as priority 3)"
    http_status: 404
    applies_to: "POST /optics/work-orders, POST /optics/process-runs, POST /optics/tolerance-allocations, POST /optics/metrology-reports, POST /optics/coating-runs, POST /optics/assemblies, POST /optics/assembly-components, POST /optics/inspection-records, POST /optics/export-classifications, POST /optics/documentation-packages"

  - priority: 5
    category: existence
    check: "request body parses, every required input field of the endpoint is present, every field has the declared type, enum values are members of their declared set, numeric fields are non-negative and within their declared range, timestamps are ISO-8601 UTC, spectral_samples/attached_documents arrays are non-empty when supplied, element_count >= 1 and <= 12, slot_index >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: state
    check: "the OCC guard of §1.2.1 holds: the supplied expected_<parent>_version equals the parent row's current version"
    error_id: "ERR_STALE_DESIGN_VERSION | ERR_STALE_GLASS_LOT_VERSION | ERR_STALE_ASSEMBLY_VERSION"
    http_status: 412
    applies_to: "POST /optics/optical-designs/{id}/revisions, POST /optics/work-orders, POST /optics/assembly-components"

  - priority: 7
    category: state
    check: "the target row's current state is a declared from: state of the requested §1.2 transition (includes terminal-state lockdown and second-application idempotency rejection)"
    error_id: "ERR_INVALID_STATE_TRANSITION, or the transition-specific code where §1.6 declares one (ERR_REPORT_ALREADY_SIGNED, ERR_EXPORT_ALREADY_DECIDED, ERR_WORK_ORDER_NOT_IN_PROCESS)"
    http_status: 409
    applies_to: "all action endpoints that drive a §1.2 transition"

  - priority: 8
    category: business_safety
    check: "a design being screened has a governing ExportClassification (conventions.governing_export_classification); when none exists the compliance screen cannot conclude"
    error_id: ERR_EXPORT_CLASSIFICATION_MISSING
    http_status: 409
    applies_to: "POST /optics/work-orders/{id}/compliance-screen, POST /optics/assemblies/{id}/release"

  - priority: 9
    category: business_safety
    check: "when the governing ExportClassification has license_required == true, its classification_status must be LICENSE_APPROVED before the assembly may be released"
    error_id: ERR_EXPORT_LICENSE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /optics/assemblies/{id}/release, POST /optics/work-orders/{id}/release-to-assembly"

  - priority: 10
    category: business_safety
    check: "the assembly's latest InspectionRecord by created_at is in PASSED or WAIVED; a FAILED record blocks release"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /optics/assemblies/{id}/release"

  - priority: 11
    category: business_safety
    check: "a FAILED InspectionRecord is waivable only when cleanliness_pass is true and both defect numbers are within twice the design limits (see calculations.cleanliness_inspection_verdict)"
    error_id: ERR_DEFECT_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /optics/inspection-records/{id}/waiver"

  - priority: 12
    category: business_safety
    check: "segregation of duties: the acting X-User-ID must differ from the user who performed the preceding step — signer != MetrologyReport.recorded_by_user_id; waiver granter != InspectionRecord.inspected_by_user_id; documentation reviewer != DocumentationPackage.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /optics/metrology-reports/{id}/sign, POST /optics/inspection-records/{id}/waiver, POST /optics/documentation-packages/{id}/review"

  - priority: 13
    category: business_constraint
    check: "cross-entity state dependency: the OpticalDesign referenced by a work order is in RELEASED (ERR_DESIGN_NOT_RELEASED); the GlassLot referenced by a work order is in RELEASED (ERR_GLASS_LOT_NOT_RELEASED); the WorkOrder of a new assembly component is in RELEASED_TO_ASSEMBLY (ERR_COMPONENT_NOT_RELEASED)"
    error_id: "ERR_DESIGN_NOT_RELEASED | ERR_GLASS_LOT_NOT_RELEASED | ERR_COMPONENT_NOT_RELEASED"
    http_status: 409
    applies_to: "POST /optics/work-orders, POST /optics/assembly-components, POST /optics/optical-designs/{id}/tolerance-allocations (rejected with ERR_DESIGN_NOT_RELEASED when design_status != DRAFT)"

  - priority: 14
    category: business_constraint
    check: "the requested run_stage is admissible from the work order's process_status per the stage gate (GRINDING from {BLANKS_RESERVED, GRINDING}; POLISHING from {BLANKS_RESERVED, GRINDING, POLISHING}; FIGURING from {POLISHING, FIGURING})"
    error_id: ERR_RUN_STAGE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /optics/process-runs"

  - priority: 15
    category: business_constraint
    check: "the work order has no other ProcessRun in run_status SCHEDULED, IN_PROCESS or AWAITING_METROLOGY"
    error_id: ERR_RUN_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /optics/process-runs"

  - priority: 16
    category: business_constraint
    check: "the chosen MetrologyInstrument is not calibration-overdue: days_since_calibration <= calibration_interval_days at the logical clock's current instant"
    error_id: ERR_INSTRUMENT_CALIBRATION_OVERDUE
    http_status: 409
    applies_to: "POST /optics/process-runs, POST /optics/metrology-reports/{id}/sign"

  - priority: 17
    category: business_constraint
    check: "the instrument's capability_ratio for the work order's design is <= 0.2500 (see calculations.metrology_capability_index)"
    error_id: ERR_METROLOGY_CAPABILITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /optics/process-runs"

  - priority: 18
    category: business_temporal
    check: "metrology_window_end_utc > metrology_window_start_utc (resp. window_end_utc > window_start_utc) and the duration in whole minutes is between 30 and 480 inclusive"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /optics/process-runs, POST /optics/coating-runs"

  - priority: 19
    category: business_temporal
    check: "exclusive instrument occupation: the requested window does not come within INSTRUMENT_PURGE_MINUTES (15) of any other active run's window on the same instrument (see calculations.instrument_minutes_ledger); a gap of exactly 15 minutes is admissible"
    error_id: ERR_INSTRUMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /optics/process-runs"

  - priority: 20
    category: business_temporal
    check: "aggregate chamber occupancy: the number of active CoatingRuns on the chamber whose half-open [start, end) interval overlaps the requested interval is < chamber.slot_capacity; touching intervals do not overlap"
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /optics/coating-runs"

  - priority: 21
    category: business_referential
    check: "the GlassLot's effective index-homogeneity and striae grades satisfy the design's minimum grades (conventions.grade_ranks) and its blank_center_thickness_um >= design.min_center_thickness_um"
    error_id: ERR_GLASS_GRADE_UNSUITABLE
    http_status: 409
    applies_to: "POST /optics/work-orders"

  - priority: 22
    category: business_referential
    check: "at most one ExportClassification per design may exist with classification_status != LICENSE_DENIED; at most one DocumentationPackage per assembly; design_code and lot_code are globally unique; an assembly's slot_index is unique among its ACTIVE components; a document_type appears at most once in a package"
    error_id: "ERR_EXPORT_CLASSIFICATION_EXISTS | ERR_DOCUMENTATION_PACKAGE_EXISTS | ERR_DUPLICATE_DESIGN_CODE | ERR_DUPLICATE_LOT_CODE | ERR_SLOT_ALREADY_OCCUPIED | ERR_DUPLICATE_DOCUMENT_TYPE"
    http_status: 409
    applies_to: "POST /optics/optical-designs, POST /optics/glass-lots, POST /optics/assembly-components, POST /optics/export-classifications, POST /optics/documentation-packages, POST /optics/documentation-packages/{id}/documents"

  - priority: 23
    category: business_referential
    check: "the number of ACTIVE AssemblyComponent rows drawing on a given work order does not exceed that work order's element_count"
    error_id: ERR_ELEMENT_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /optics/assembly-components"

  - priority: 24
    category: business_referential
    check: "the assembly has at least one ACTIVE component before align/seal/release; a documentation package's completeness_pct is exactly 100.00 before submit, and package_status is APPROVED before assembly release"
    error_id: "ERR_ASSEMBLY_EMPTY | ERR_DOCUMENTATION_INCOMPLETE | ERR_DOCUMENTATION_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /optics/assemblies/{id}/cement, POST /optics/assemblies/{id}/align, POST /optics/assemblies/{id}/release, POST /optics/documentation-packages/{id}/submit"

  - priority: 25
    category: business_constraint
    check: "the design has at least one ACTIVE ToleranceAllocation before tolerance analysis; the coating run supplies at least 5 in-band spectral samples; the analysed stack does not exceed the design's tolerance_budget_waves at release"
    error_id: "ERR_TOLERANCE_STACK_EMPTY | ERR_SPECTRAL_SAMPLE_INSUFFICIENT | ERR_TOLERANCE_BUDGET_EXCEEDED"
    http_status: 422
    applies_to: "POST /optics/optical-designs/{id}/tolerance-analysis, POST /optics/coating-runs/{id}/spectral-verification, POST /optics/optical-designs/{id}/release"

  - priority: 26
    category: business_fiscal
    check: "the GlassLot has available_blank_count >= the work order's computed reserved_blank_count (see calculations.blank_conservation_ledger); equality is admissible"
    error_id: ERR_INSUFFICIENT_BLANKS
    http_status: 409
    applies_to: "POST /optics/work-orders"

  - priority: 27
    category: business_temporal
    check: "the logical clock never moves backwards: the supplied current_utc is greater than or equal to the clock's present value"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API endpoint table
# Every response is wrapped in the §1.0 envelope; `output:` names the payload of
# the `data` member. The first path parameter of every path is literally `{id}`.
# A trailing `?` marks an optional input.
# =============================================================================
endpoints:

  # ---- OpticalDesign & ToleranceAllocation -----------------------------------
  - method: POST
    path: "/optics/optical-designs"
    description: "Translate an optical design into a manufacturable specification record in DRAFT."
    roles: [OpticsEngineer]
    code: 201
    input: ["design_code", "aperture_mm", "wavelength_min_nm", "wavelength_max_nm", "required_rms_wavefront_waves", "tolerance_budget_waves", "transmitted_wavefront_budget_waves", "surface_figure_budget_waves?", "surface_roughness_budget_nm?", "min_center_thickness_um?", "min_index_homogeneity_grade?", "max_striae_grade?", "scratch_dig_scratch_limit?", "scratch_dig_dig_limit?", "cleanliness_limit_per_cm2?", "tolerance_method?"]
    output: OpticalDesign
    side_effects: ["design_status set to DRAFT", "tolerance_verdict set to PENDING", "design_revision set to 1", "supersedes_design_id set to null", "rejects a duplicate design_code with ERR_DUPLICATE_DESIGN_CODE"]

  - method: GET
    path: "/optics/optical-designs/{id}"
    description: "Read one optical design, including its computed tolerance-stack outputs."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: OpticalDesign
    side_effects: []

  - method: GET
    path: "/optics/optical-designs"
    description: "List optical designs; the supersedes_design_id filter is the reverse-reachability channel for the self-referential revision FK."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["supersedes_design_id?", "design_status?", "tolerance_verdict?", "limit?", "offset?"]
    output: OpticalDesign[]
    side_effects: []

  - method: POST
    path: "/optics/optical-designs/{id}/tolerance-allocations"
    description: "Add one error contributor to the design's tolerance budget; contribution_waves is computed and rounded to 4 decimals at create time."
    roles: [OpticsEngineer]
    code: 201
    input: ["contributor_type", "sensitivity_waves_per_unit", "manufacturing_tolerance_units"]
    output: ToleranceAllocation
    side_effects: ["contribution_waves computed per §1.3 tolerance_stack_analysis step 1", "allocation_status set to ACTIVE", "rejected unless design_status == DRAFT"]

  - method: GET
    path: "/optics/optical-designs/{id}/tolerance-allocations"
    description: "List the tolerance allocations of a design (reverse-reachability for ToleranceAllocation.design_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["allocation_status?", "limit?", "offset?"]
    output: ToleranceAllocation[]
    side_effects: []

  - method: GET
    path: "/optics/tolerance-allocations/{id}"
    description: "Read one tolerance allocation."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: ToleranceAllocation
    side_effects: []

  - method: POST
    path: "/optics/tolerance-allocations/{id}/retire"
    description: "Retire an allocation so it no longer contributes to the stack."
    roles: [OpticsEngineer]
    code: 200
    input: []
    output: ToleranceAllocation
    side_effects: ["allocation_status set to RETIRED", "the row is excluded from every later §1.3 tolerance_stack_analysis input set"]

  - method: POST
    path: "/optics/optical-designs/{id}/tolerance-analysis"
    description: "Run the dual-variant tolerance stack-up (DRAFT -> TOLERANCED)."
    roles: [OpticsEngineer]
    code: 200
    input: []
    output: OpticalDesign
    side_effects: ["rss_stack_waves, worst_case_stack_waves, governing_stack_waves, allocated_tolerance_waves and tolerance_verdict written per §1.3 tolerance_stack_analysis", "design_status set to TOLERANCED", "rejects an empty ACTIVE allocation set with ERR_TOLERANCE_STACK_EMPTY", "increments OpticalDesign.version by 1"]

  - method: POST
    path: "/optics/optical-designs/{id}/release"
    description: "Release a toleranced design for manufacture (TOLERANCED -> RELEASED)."
    roles: [OpticsEngineer, QualityManager]
    code: 200
    input: []
    output: OpticalDesign
    side_effects: ["design_status set to RELEASED", "rejects tolerance_verdict == FAIL with ERR_TOLERANCE_BUDGET_EXCEEDED", "increments OpticalDesign.version by 1"]

  - method: POST
    path: "/optics/optical-designs/{id}/revisions"
    description: "Create the next revision of a released design under OCC on the design's version; the addressed design becomes SUPERSEDED."
    roles: [OpticsEngineer]
    code: 201
    input: ["expected_design_version", "design_code", "tolerance_budget_waves?", "transmitted_wavefront_budget_waves?", "tolerance_method?", "required_rms_wavefront_waves?", "aperture_mm?"]
    output: OpticalDesign
    side_effects: ["a new OpticalDesign row in DRAFT with design_revision = predecessor.design_revision + 1 and supersedes_design_id = {id}", "the addressed design's design_status set to SUPERSEDED", "increments the addressed OpticalDesign.version by 1", "stale expected_design_version rejected with ERR_STALE_DESIGN_VERSION (412)"]

  - method: GET
    path: "/optics/optical-designs/{id}/export-classifications"
    description: "List the export classifications of a design (reverse-reachability for ExportClassification.design_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["classification_status?", "limit?", "offset?"]
    output: ExportClassification[]
    side_effects: []

  # ---- GlassLot --------------------------------------------------------------
  - method: POST
    path: "/optics/glass-lots"
    description: "Receive a glass or substrate melt lot into quarantine pending certification."
    roles: [ProcurementOfficer]
    code: 201
    input: ["lot_code", "glass_type", "melt_index_nd", "total_blank_count", "declared_index_homogeneity_grade", "declared_striae_grade", "blank_center_thickness_um?"]
    output: GlassLot
    side_effects: ["lot_status set to QUARANTINED", "available_blank_count set to total_blank_count; reserved/consumed/scrapped set to 0", "rejects a duplicate lot_code with ERR_DUPLICATE_LOT_CODE"]

  - method: POST
    path: "/optics/glass-lots/{id}/certification"
    description: "Record the incoming-inspection certificate and release the lot (QUARANTINED -> RELEASED)."
    roles: [ProcurementOfficer]
    code: 200
    input: ["measured_index_homogeneity_grade", "measured_striae_grade", "certificate_reference"]
    output: GlassLot
    side_effects: ["measured grades stored", "effective_index_homogeneity_grade and effective_striae_grade set to the measured grades (the measured value overrides the declared one whenever it is non-null; see §1.1 GlassLot)", "lot_status set to RELEASED", "increments GlassLot.version by 1"]

  - method: POST
    path: "/optics/glass-lots/{id}/block"
    description: "Block a lot on a melt nonconformance; holds every open work order drawing on it."
    roles: [ProcurementOfficer, QualityManager]
    code: 200
    input: ["block_reason"]
    output: GlassLot
    side_effects: ["lot_status set to BLOCKED", "the 3-hop cascade of §1.2 GlassLot RELEASED -> BLOCKED (work orders to HELD, their open process runs to CANCELLED, instrument booked_minutes_total released)", "increments GlassLot.version by 1"]

  - method: GET
    path: "/optics/glass-lots/{id}"
    description: "Read one glass lot with its blank-conservation ledger."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: GlassLot
    side_effects: []

  - method: GET
    path: "/optics/glass-lots"
    description: "List glass lots."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["lot_status?", "glass_type?", "limit?", "offset?"]
    output: GlassLot[]
    side_effects: []

  # ---- WorkOrder -------------------------------------------------------------
  - method: POST
    path: "/optics/work-orders"
    description: "Open a fabrication work order, reserving blanks from the lot under OCC on the lot's version."
    roles: [ProcessTechnician]
    code: 201
    input: ["wo_code", "design_id", "glass_lot_id", "element_count", "expected_glass_lot_version"]
    output: WorkOrder
    side_effects: ["spare_blank_count and reserved_blank_count computed per §1.3 blank_conservation_ledger", "GlassLot.reserved_blank_count incremented and available_blank_count decremented", "pinned_design_revision frozen to the design's design_revision", "blank_center_thickness_um and remaining_center_thickness_um copied from the lot", "process_status BLANKS_RESERVED, compliance_status UNCLASSIFIED", "increments GlassLot.version by 1", "stale expected_glass_lot_version rejected with ERR_STALE_GLASS_LOT_VERSION (412)"]

  - method: GET
    path: "/optics/work-orders/{id}"
    description: "Read one work order with both state dimensions and its removal ledger."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/optics/work-orders"
    description: "List work orders; design_id and glass_lot_id are the reverse-reachability filters for both FKs."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["design_id?", "glass_lot_id?", "process_status?", "compliance_status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/optics/work-orders/{id}/assembly-components"
    description: "List the assembly components drawn from this work order (reverse-reachability for AssemblyComponent.work_order_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["component_status?", "limit?", "offset?"]
    output: AssemblyComponent[]
    side_effects: []

  - method: POST
    path: "/optics/work-orders/{id}/compliance-screen"
    description: "Screen the work order against the governing export classification of its design (UNCLASSIFIED -> SCREENED -> CLEARED | BLOCKED)."
    roles: [ExportComplianceOfficer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["compliance_status set to SCREENED, then to CLEARED when the governing classification needs no license or already holds LICENSE_APPROVED", "ERR_EXPORT_CLASSIFICATION_MISSING when the design has no governing classification"]

  - method: POST
    path: "/optics/work-orders/{id}/release-to-assembly"
    description: "Release a coated work order to assembly; the join point of the two parallel state dimensions."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["process_status set to RELEASED_TO_ASSEMBLY", "GlassLot ledger consume move per §1.3 blank_conservation_ledger", "GlassLot may transition to DEPLETED", "ERR_WORK_ORDER_NOT_IN_PROCESS unless process_status == COATED", "ERR_EXPORT_LICENSE_NOT_APPROVED unless compliance_status == CLEARED"]

  - method: POST
    path: "/optics/work-orders/{id}/scrap"
    description: "Scrap a finished or already-released work order on a latent nonconformance; withdraws the element from any assembly it was kitted into."
    roles: [QualityManager]
    code: 200
    input: ["scrap_reason"]
    output: WorkOrder
    side_effects: ["process_status set to SCRAPPED", "the 4-hop cascade of §1.2 WorkOrder RELEASED_TO_ASSEMBLY -> SCRAPPED (blank write-off, ACTIVE components VOIDED, affected assemblies recomputed and demoted from ALIGNED/SEALED to MOUNTED)"]

  - method: POST
    path: "/optics/work-orders/{id}/cancel"
    description: "Cancel a work order before coating completes, returning every reserved blank."
    roles: [ProcessTechnician, QualityManager]
    code: 200
    input: ["cancel_reason?"]
    output: WorkOrder
    side_effects: ["process_status set to CANCELLED", "the 3-hop compensating cascade of §1.2 WorkOrder -> CANCELLED (blanks returned, open runs cancelled, instrument minutes released)"]

  # ---- MetrologyInstrument ---------------------------------------------------
  - method: POST
    path: "/optics/metrology-instruments"
    description: "Register an interferometer, profilometer or transmitted-wavefront station."
    roles: [PlantAdmin]
    code: 201
    input: ["instrument_code", "instrument_type", "base_uncertainty_waves", "last_calibrated_utc", "lateral_resolution_um?", "calibration_interval_days?"]
    output: MetrologyInstrument
    side_effects: ["days_since_calibration, effective_uncertainty_waves and instrument_status computed at the current logical clock reading", "booked_minutes_total set to 0"]

  - method: GET
    path: "/optics/metrology-instruments/{id}"
    description: "Read one instrument with its clock-dependent calibration status and drifted uncertainty."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: MetrologyInstrument
    side_effects: []

  - method: GET
    path: "/optics/metrology-instruments"
    description: "List metrology instruments."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["instrument_type?", "instrument_status?", "limit?", "offset?"]
    output: MetrologyInstrument[]
    side_effects: []

  - method: POST
    path: "/optics/metrology-instruments/{id}/calibrations"
    description: "Record a calibration event, resetting the uncertainty drift curve."
    roles: [PlantAdmin, MetrologyTechnician]
    code: 200
    input: ["calibrated_at_utc?"]
    output: MetrologyInstrument
    side_effects: ["last_calibrated_utc set to calibrated_at_utc, or to the current logical clock reading when omitted", "days_since_calibration reset, effective_uncertainty_waves and instrument_status recomputed per §1.3 metrology_capability_index"]

  # ---- ProcessRun ------------------------------------------------------------
  - method: POST
    path: "/optics/process-runs"
    description: "Schedule a grinding, polishing or figuring run together with its exclusive metrology window; the capability index is evaluated and frozen here."
    roles: [ProcessTechnician]
    code: 201
    input: ["work_order_id", "metrology_instrument_id", "run_stage", "metrology_window_start_utc", "metrology_window_end_utc"]
    output: ProcessRun
    side_effects: ["window_minutes computed and MetrologyInstrument.booked_minutes_total incremented by it (§1.3 instrument_minutes_ledger)", "capability_ratio_at_scheduling frozen per §1.3 metrology_capability_index", "run_status set to SCHEDULED", "the §1.4 priority 14–19 gates apply in that order"]

  - method: GET
    path: "/optics/process-runs/{id}"
    description: "Read one process run."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: ProcessRun
    side_effects: []

  - method: GET
    path: "/optics/process-runs"
    description: "List process runs; work_order_id and metrology_instrument_id are the reverse-reachability filters for both FKs."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["work_order_id?", "metrology_instrument_id?", "run_stage?", "run_status?", "limit?", "offset?"]
    output: ProcessRun[]
    side_effects: []

  - method: GET
    path: "/optics/process-runs/{id}/metrology-reports"
    description: "List the metrology reports of a run (reverse-reachability for MetrologyReport.process_run_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["report_status?", "limit?", "offset?"]
    output: MetrologyReport[]
    side_effects: []

  - method: POST
    path: "/optics/process-runs/{id}/start"
    description: "Start the run on the shop floor (SCHEDULED -> IN_PROCESS); drives the work order's fabrication dimension to the run's stage."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: ProcessRun
    side_effects: ["run_status set to IN_PROCESS and started_at_utc stamped from the logical clock", "WorkOrder.process_status set to run_stage"]

  - method: POST
    path: "/optics/process-runs/{id}/complete"
    description: "Close the machining pass and record the material removed (IN_PROCESS -> AWAITING_METROLOGY)."
    roles: [ProcessTechnician]
    code: 200
    input: ["material_removed_nm"]
    output: ProcessRun
    side_effects: ["material_removed_nm recorded", "run_status set to AWAITING_METROLOGY"]

  - method: POST
    path: "/optics/process-runs/{id}/cancel"
    description: "Cancel a scheduled or in-process run, freeing the instrument window."
    roles: [ProcessTechnician, QualityManager]
    code: 200
    input: ["cancel_reason?"]
    output: ProcessRun
    side_effects: ["run_status set to CANCELLED", "MetrologyInstrument.booked_minutes_total decremented by window_minutes (compensating move of §1.3 instrument_minutes_ledger)"]

  # ---- MetrologyReport -------------------------------------------------------
  - method: POST
    path: "/optics/metrology-reports"
    description: "Record an interferometric measurement against a run awaiting metrology; the acting user becomes recorded_by_user_id."
    roles: [MetrologyTechnician]
    code: 201
    input: ["process_run_id", "surface_rms_waves", "surface_pv_waves?", "surface_roughness_nm_rms?", "transmitted_wavefront_rms_waves?"]
    output: MetrologyReport
    side_effects: ["report_status set to DRAFT, verdict PENDING", "recorded_by_user_id set to the acting X-User-ID", "stage_figure_budget_waves computed per §1.3 metrology_acceptance_verdict"]

  - method: GET
    path: "/optics/metrology-reports/{id}"
    description: "Read one metrology report."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: MetrologyReport
    side_effects: []

  - method: POST
    path: "/optics/metrology-reports/{id}/sign"
    description: "Sign off a metrology report under segregation of duties; computes the acceptance verdict and drives the whole downstream cascade."
    roles: [MetrologyTechnician, QualityManager]
    code: 200
    input: ["signature_note?"]
    output: MetrologyReport
    side_effects: ["verdict computed per §1.3 metrology_acceptance_verdict, report_status SIGNED, signed_by_user_id and signed_at_utc recorded", "the ProcessRun and WorkOrder transitions of §1.2 fire, including the removal-convergence and scrap adjudication of §1.3 figuring_removal_convergence", "ERR_SEGREGATION_OF_DUTIES when X-User-ID == recorded_by_user_id", "ERR_INSTRUMENT_CALIBRATION_OVERDUE when the run's instrument is overdue at the current clock reading"]

  # ---- CoatingChamber & CoatingRun -------------------------------------------
  - method: POST
    path: "/optics/coating-chambers"
    description: "Register a coating deposition chamber with its concurrent slot capacity."
    roles: [PlantAdmin]
    code: 201
    input: ["chamber_code", "slot_capacity", "coating_type?"]
    output: CoatingChamber
    side_effects: []

  - method: GET
    path: "/optics/coating-chambers/{id}"
    description: "Read one coating chamber."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: CoatingChamber
    side_effects: []

  - method: GET
    path: "/optics/coating-chambers"
    description: "List coating chambers."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["coating_type?", "limit?", "offset?"]
    output: CoatingChamber[]
    side_effects: []

  - method: POST
    path: "/optics/coating-runs"
    description: "Book a chamber slot and load the work order for coating deposition (WorkOrder FIGURE_ACCEPTED -> COATING)."
    roles: [ProcessTechnician]
    code: 201
    input: ["work_order_id", "coating_chamber_id", "coating_recipe_code", "window_start_utc", "window_end_utc"]
    output: CoatingRun
    side_effects: ["coating_status set to LOADED, strip_count 0, spectral_verdict PENDING", "WorkOrder.process_status set to COATING", "aggregate chamber occupancy checked per §1.3 chamber_capacity_occupancy"]

  - method: GET
    path: "/optics/coating-runs/{id}"
    description: "Read one coating run with its spectral aggregates."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: CoatingRun
    side_effects: []

  - method: GET
    path: "/optics/coating-runs"
    description: "List coating runs; work_order_id and coating_chamber_id are the reverse-reachability filters for both FKs."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["work_order_id?", "coating_chamber_id?", "coating_status?", "spectral_verdict?", "limit?", "offset?"]
    output: CoatingRun[]
    side_effects: []

  - method: POST
    path: "/optics/coating-runs/{id}/deposit"
    description: "Complete the deposition cycle (LOADED -> DEPOSITED)."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: CoatingRun
    side_effects: ["coating_status set to DEPOSITED"]

  - method: POST
    path: "/optics/coating-runs/{id}/spectral-verification"
    description: "Submit the spectrophotometer trace and verify spectral performance across the design's wavelength range (dual-variant)."
    roles: [ProcessTechnician, MetrologyTechnician]
    code: 200
    input: ["spectral_samples"]
    output: CoatingRun
    side_effects: ["spectral_samples replaced; in_band_sample_count, band_average_reflectance_pct, worst_point_reflectance_pct and spectral_verdict computed per §1.3 spectral_performance_verification", "coating_status set to VERIFIED_PASS or VERIFIED_FAIL", "on PASS the WorkOrder advances COATING -> COATED", "ERR_SPECTRAL_SAMPLE_INSUFFICIENT when fewer than 5 samples fall inside the design band"]

  - method: POST
    path: "/optics/coating-runs/{id}/strip"
    description: "Strip a failed coating for a recoat attempt, or scrap the work order when the strip limit is exhausted."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: CoatingRun
    side_effects: ["strip_count incremented by 1", "coating_status back to LOADED and the spectral outputs reset while strip_count <= MAX_STRIP_CYCLES (1)", "coating_status SCRAPPED and the WorkOrder scrapped with scrap_reason COATING_STRIP_LIMIT once the limit is exceeded"]

  # ---- Assembly & AssemblyComponent ------------------------------------------
  - method: POST
    path: "/optics/assemblies"
    description: "Open a cemented-doublet / mounted-assembly build record against a released design."
    roles: [ProcessTechnician]
    code: 201
    input: ["design_id", "assembly_code"]
    output: Assembly
    side_effects: ["assembly_status set to KITTED", "alignment_attempt_count set to 0", "the five transmitted-wavefront outputs set to null until the first align call"]

  - method: GET
    path: "/optics/assemblies/{id}"
    description: "Read one assembly with its transmitted-wavefront budget roll-up."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: Assembly
    side_effects: []

  - method: GET
    path: "/optics/assemblies"
    description: "List assemblies; design_id is the reverse-reachability filter for Assembly.design_id."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["design_id?", "assembly_status?", "limit?", "offset?"]
    output: Assembly[]
    side_effects: []

  - method: POST
    path: "/optics/assembly-components"
    description: "Kit one finished element into an assembly slot under OCC on the assembly's version, recording its decenter, tilt and element wavefront."
    roles: [ProcessTechnician]
    code: 201
    input: ["assembly_id", "work_order_id", "slot_index", "decenter_um", "tilt_arcmin", "element_wavefront_rms_waves", "expected_assembly_version"]
    output: AssemblyComponent
    side_effects: ["component_status set to ACTIVE", "increments Assembly.version by 1", "ERR_SLOT_ALREADY_OCCUPIED when another ACTIVE component holds the same slot_index", "ERR_ELEMENT_ALLOCATION_EXCEEDED when the work order's element_count is already fully drawn", "ERR_COMPONENT_NOT_RELEASED unless the work order is RELEASED_TO_ASSEMBLY", "stale expected_assembly_version rejected with ERR_STALE_ASSEMBLY_VERSION (412)"]

  - method: GET
    path: "/optics/assemblies/{id}/components"
    description: "List the components of an assembly (reverse-reachability for AssemblyComponent.assembly_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["component_status?", "limit?", "offset?"]
    output: AssemblyComponent[]
    side_effects: []

  - method: GET
    path: "/optics/assembly-components/{id}"
    description: "Read one assembly component."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: AssemblyComponent
    side_effects: []

  - method: POST
    path: "/optics/assemblies/{id}/cement"
    description: "Cement the kitted elements (KITTED -> CEMENTED)."
    roles: [ProcessTechnician]
    code: 200
    input: ["cement_lot_code"]
    output: Assembly
    side_effects: ["cement_lot_code recorded, assembly_status set to CEMENTED", "ERR_ASSEMBLY_EMPTY when the assembly has no ACTIVE component"]

  - method: POST
    path: "/optics/assemblies/{id}/mount"
    description: "Mount the cemented group into its housing (CEMENTED -> MOUNTED)."
    roles: [ProcessTechnician]
    code: 200
    input: ["mount_code"]
    output: Assembly
    side_effects: ["mount_code recorded, assembly_status set to MOUNTED"]

  - method: POST
    path: "/optics/assemblies/{id}/align"
    description: "Run a centration/alignment pass; computes the transmitted-wavefront roll-up and either advances to ALIGNED, self-loops in MOUNTED, or rejects the assembly on the third failure."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: Assembly
    side_effects: ["element_rss_waves, centration_error_waves, subtotal_waves, cement_derate_waves and total_transmitted_wavefront_waves written per §1.3 assembly_transmitted_wavefront", "assembly_status ALIGNED on success; MOUNTED self-loop with alignment_attempt_count incremented on failure; REJECTED on the MAX_ALIGNMENT_ATTEMPTS-th failure", "ERR_COMPONENT_NOT_RELEASED and ERR_ASSEMBLY_EMPTY per §1.4"]

  - method: POST
    path: "/optics/assemblies/{id}/seal"
    description: "Seal the aligned assembly for delivery (ALIGNED -> SEALED); requires a passing or waived cleanliness inspection."
    roles: [ProcessTechnician, QualityManager]
    code: 200
    input: []
    output: Assembly
    side_effects: ["assembly_status set to SEALED", "ERR_INSPECTION_NOT_PASSED when the latest InspectionRecord is FAILED or none exists"]

  - method: POST
    path: "/optics/assemblies/{id}/release"
    description: "Release the sealed assembly to the customer (SEALED -> RELEASED); the export licence and documentation gates are enforced here."
    roles: [QualityManager]
    code: 200
    input: []
    output: Assembly
    side_effects: ["assembly_status set to RELEASED and released_at_utc stamped from the logical clock", "ERR_EXPORT_CLASSIFICATION_MISSING, ERR_EXPORT_LICENSE_NOT_APPROVED, ERR_DOCUMENTATION_PACKAGE_NOT_FOUND and ERR_DOCUMENTATION_NOT_APPROVED per §1.4 priorities 8, 9 and 24"]

  - method: GET
    path: "/optics/assemblies/{id}/release-readiness"
    description: "Computed read: the release gate evaluated without mutating anything; blocking_error_id names the error a release call would return, or null when the assembly is releasable."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: "{ assembly_id: string, assembly_status: string, active_component_count: integer, inspection_ok: boolean, export_ok: boolean, documentation_ok: boolean, wavefront_ok: boolean, total_transmitted_wavefront_waves: number, transmitted_wavefront_budget_waves: number, completeness_pct: number, blocking_error_id: string }"
    side_effects: []

  - method: GET
    path: "/optics/assemblies/{id}/inspection-records"
    description: "List the cleanroom inspection records of an assembly (reverse-reachability for InspectionRecord.assembly_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["inspection_status?", "limit?", "offset?"]
    output: InspectionRecord[]
    side_effects: []

  - method: GET
    path: "/optics/assemblies/{id}/documentation-packages"
    description: "List the documentation packages of an assembly (reverse-reachability for DocumentationPackage.assembly_id)."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: ["package_status?", "limit?", "offset?"]
    output: DocumentationPackage[]
    side_effects: []

  # ---- InspectionRecord ------------------------------------------------------
  - method: POST
    path: "/optics/inspection-records"
    description: "Record a MIL-PRF-13830B scratch-dig and particulate cleanliness inspection; the verdict is computed at creation."
    roles: [MetrologyTechnician, QualityManager]
    code: 201
    input: ["assembly_id", "max_scratch_number", "max_dig_number", "particle_count_per_cm2", "scratch_count_at_limit?"]
    output: InspectionRecord
    side_effects: ["scratch_dig_pass, cleanliness_pass and inspection_status computed per §1.3 cleanliness_inspection_verdict", "inspected_by_user_id recorded from the acting X-User-ID"]

  - method: GET
    path: "/optics/inspection-records/{id}"
    description: "Read one inspection record."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: []

  - method: POST
    path: "/optics/inspection-records/{id}/waiver"
    description: "Waive a failed cleanliness inspection under segregation of duties (FAILED -> WAIVED)."
    roles: [QualityManager]
    code: 200
    input: ["justification"]
    output: InspectionRecord
    side_effects: ["inspection_status set to WAIVED, waived_by_user_id and waiver_justification recorded", "every DocumentationPackage of the assembly recomputes required_document_types, missing_document_types and completeness_pct, now including INSPECTION_WAIVER", "ERR_SEGREGATION_OF_DUTIES when X-User-ID == inspected_by_user_id", "ERR_DEFECT_NOT_WAIVABLE when the defect exceeds twice the design limit or cleanliness failed"]

  # ---- ExportClassification --------------------------------------------------
  - method: POST
    path: "/optics/export-classifications"
    description: "Classify a design for export control; computes the figure of merit, the ECCN and whether a licence is required."
    roles: [ExportComplianceOfficer]
    code: 201
    input: ["design_id", "destination_country", "end_use_statement?"]
    output: ExportClassification
    side_effects: ["figure_of_merit, eccn, license_required and classification_status computed per §1.3 export_control_classification", "ERR_EXPORT_CLASSIFICATION_EXISTS when the design already has a non-denied classification"]

  - method: GET
    path: "/optics/export-classifications/{id}"
    description: "Read one export classification."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: ExportClassification
    side_effects: []

  - method: POST
    path: "/optics/export-classifications/{id}/license-decision"
    description: "Record the licensing authority's decision; APPROVED clears every screened work order of the design, DENIED drives the three-hop block cascade."
    roles: [ExportComplianceOfficer]
    code: 200
    input: ["decision", "license_number?"]
    output: ExportClassification
    side_effects: ["classification_status set to LICENSE_APPROVED or LICENSE_DENIED, decided_by_user_id recorded", "on APPROVED every WorkOrder of the design in compliance_status SCREENED moves to CLEARED", "on DENIED the three-hop cascade of §1.2 WorkOrder compliance_status SCREENED -> BLOCKED fires and reaches every affected Assembly", "ERR_EXPORT_ALREADY_DECIDED on a second decision"]

  - method: POST
    path: "/optics/export-classifications/{id}/revocation"
    description: "Record a revocation of an already-approved export licence; blocks every work order of the design and export-blocks every assembly still holding one of its elements."
    roles: [ExportComplianceOfficer]
    code: 200
    input: ["revocation_reason"]
    output: ExportClassification
    side_effects: ["classification_status set to LICENSE_DENIED and decision_note set to revocation_reason", "the 3-hop cascade of §1.2 ExportClassification LICENSE_APPROVED -> LICENSE_DENIED (work orders BLOCKED, ALIGNED or SEALED assemblies holding their ACTIVE elements set to EXPORT_BLOCKED)", "ERR_INVALID_STATE_TRANSITION unless classification_status == LICENSE_APPROVED"]

  # ---- DocumentationPackage --------------------------------------------------
  - method: POST
    path: "/optics/documentation-packages"
    description: "Open the delivery documentation package for an assembly; the required document set is derived from the assembly's coating, waiver and export facts."
    roles: [QualityManager, ProcessTechnician]
    code: 201
    input: ["assembly_id"]
    output: DocumentationPackage
    side_effects: ["required_document_types, missing_document_types and completeness_pct computed per §1.3 documentation_completeness", "package_status set to ASSEMBLING, rejection_count 0", "ERR_DOCUMENTATION_PACKAGE_EXISTS when the assembly already has a package"]

  - method: GET
    path: "/optics/documentation-packages/{id}"
    description: "Read one documentation package with its completeness roll-up."
    roles: [OpticsEngineer, ProcurementOfficer, ProcessTechnician, MetrologyTechnician, QualityManager, ExportComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: DocumentationPackage
    side_effects: []

  - method: POST
    path: "/optics/documentation-packages/{id}/documents"
    description: "Attach one document to the package and re-derive completeness."
    roles: [QualityManager, ProcessTechnician, MetrologyTechnician]
    code: 200
    input: ["document_type", "document_reference"]
    output: DocumentationPackage
    side_effects: ["attached_documents appended, present_document_types, missing_document_types and completeness_pct recomputed per §1.3 documentation_completeness", "ERR_DUPLICATE_DOCUMENT_TYPE when the type is already attached", "rejected unless package_status == ASSEMBLING"]

  - method: POST
    path: "/optics/documentation-packages/{id}/submit"
    description: "Submit the completed package for review (ASSEMBLING -> SUBMITTED)."
    roles: [QualityManager, ProcessTechnician]
    code: 200
    input: []
    output: DocumentationPackage
    side_effects: ["package_status set to SUBMITTED, submitted_by_user_id recorded from X-User-ID", "ERR_DOCUMENTATION_INCOMPLETE unless completeness_pct == 100.00"]

  - method: POST
    path: "/optics/documentation-packages/{id}/review"
    description: "Approve or reject the submitted package under segregation of duties (SUBMITTED -> APPROVED | ASSEMBLING)."
    roles: [QualityManager]
    code: 200
    input: ["decision", "review_note?"]
    output: DocumentationPackage
    side_effects: ["on APPROVED package_status APPROVED; on REJECTED package_status back to ASSEMBLING with rejection_count incremented by 1", "reviewed_by_user_id and last_review_note recorded", "ERR_SEGREGATION_OF_DUTIES when X-User-ID == submitted_by_user_id", "ERR_DOCUMENTATION_INCOMPLETE on APPROVED when completeness_pct fell below 100.00 after submission"]

  # ---- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every business timestamp and every calibration/window rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock may only move forward."
    roles: [PlantAdmin]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["the logical clock is set to current_utc", "every MetrologyInstrument's days_since_calibration, effective_uncertainty_waves and instrument_status are re-derived on their next read", "ERR_CLOCK_NOT_MONOTONIC when current_utc precedes the present clock value"]

# =============================================================================
# §1.6 Error code catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven §1.7 roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "the acting role is not listed in the called endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum member, negative or out-of-range number, malformed timestamp, empty array where one is required, or a waiver justification shorter than 20 characters" }
  - { id: ERR_DESIGN_NOT_FOUND, http: 404, condition: "no OpticalDesign with the given id, in the path or in design_id" }
  - { id: ERR_TOLERANCE_ALLOCATION_NOT_FOUND, http: 404, condition: "no ToleranceAllocation with the given id" }
  - { id: ERR_GLASS_LOT_NOT_FOUND, http: 404, condition: "no GlassLot with the given id, in the path or in glass_lot_id" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "no WorkOrder with the given id, in the path or in work_order_id" }
  - { id: ERR_INSTRUMENT_NOT_FOUND, http: 404, condition: "no MetrologyInstrument with the given id, in the path or in metrology_instrument_id" }
  - { id: ERR_PROCESS_RUN_NOT_FOUND, http: 404, condition: "no ProcessRun with the given id, in the path or in process_run_id" }
  - { id: ERR_METROLOGY_REPORT_NOT_FOUND, http: 404, condition: "no MetrologyReport with the given id" }
  - { id: ERR_CHAMBER_NOT_FOUND, http: 404, condition: "no CoatingChamber with the given id, in the path or in coating_chamber_id" }
  - { id: ERR_COATING_RUN_NOT_FOUND, http: 404, condition: "no CoatingRun with the given id" }
  - { id: ERR_ASSEMBLY_NOT_FOUND, http: 404, condition: "no Assembly with the given id, in the path or in assembly_id" }
  - { id: ERR_ASSEMBLY_COMPONENT_NOT_FOUND, http: 404, condition: "no AssemblyComponent with the given id" }
  - { id: ERR_INSPECTION_RECORD_NOT_FOUND, http: 404, condition: "no InspectionRecord with the given id" }
  - { id: ERR_EXPORT_CLASSIFICATION_NOT_FOUND, http: 404, condition: "no ExportClassification with the given id" }
  - { id: ERR_DOCUMENTATION_PACKAGE_NOT_FOUND, http: 404, condition: "no DocumentationPackage with the given id, or the assembly being released has none" }
  - { id: ERR_STALE_DESIGN_VERSION, http: 412, condition: "expected_design_version does not equal the addressed OpticalDesign's current version" }
  - { id: ERR_STALE_GLASS_LOT_VERSION, http: 412, condition: "expected_glass_lot_version does not equal the referenced GlassLot's current version" }
  - { id: ERR_STALE_ASSEMBLY_VERSION, http: 412, condition: "expected_assembly_version does not equal the referenced Assembly's current version" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the addressed entity's current state is not a declared from: state of the requested §1.2 transition, including every terminal state" }
  - { id: ERR_DESIGN_NOT_RELEASED, http: 409, condition: "a work order is opened against a design whose design_status is not RELEASED, or a tolerance allocation is added to a design no longer in DRAFT" }
  - { id: ERR_GLASS_LOT_NOT_RELEASED, http: 409, condition: "a work order is opened against a lot whose lot_status is not RELEASED" }
  - { id: ERR_WORK_ORDER_NOT_IN_PROCESS, http: 409, condition: "the work order's process_status forbids the requested fabrication step (HELD, SCRAPPED, CANCELLED, RELEASED_TO_ASSEMBLY, or not COATED at release-to-assembly)" }
  - { id: ERR_RUN_STAGE_OUT_OF_ORDER, http: 409, condition: "the requested run_stage is not admissible from the work order's current process_status per the §1.4 priority 14 stage gate" }
  - { id: ERR_RUN_ALREADY_OPEN, http: 409, condition: "the work order already has a ProcessRun in SCHEDULED, IN_PROCESS or AWAITING_METROLOGY" }
  - { id: ERR_REPORT_ALREADY_SIGNED, http: 409, condition: "the metrology report's report_status is already SIGNED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the acting X-User-ID equals the user who performed the preceding step (report recorder, inspector, or package submitter)" }
  - { id: ERR_INSTRUMENT_CALIBRATION_OVERDUE, http: 409, condition: "days_since_calibration exceeds the instrument's calibration_interval_days at the current logical clock reading" }
  - { id: ERR_METROLOGY_CAPABILITY_INSUFFICIENT, http: 409, condition: "the instrument's capability_ratio for the design exceeds 0.2500" }
  - { id: ERR_INSTRUMENT_WINDOW_CONFLICT, http: 409, condition: "the requested metrology window falls within 15 minutes of another active run's window on the same instrument" }
  - { id: ERR_CHAMBER_CAPACITY_EXCEEDED, http: 409, condition: "the number of active coating runs overlapping the requested half-open chamber interval already equals slot_capacity" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window end is not after window start, or the duration in whole minutes is outside 30..480" }
  - { id: ERR_INSUFFICIENT_BLANKS, http: 409, condition: "the lot's available_blank_count is below the work order's computed reserved_blank_count" }
  - { id: ERR_GLASS_GRADE_UNSUITABLE, http: 409, condition: "the lot's effective index-homogeneity or striae grade is worse than the design's limit, or its blank thickness is below the design's minimum center thickness" }
  - { id: ERR_TOLERANCE_STACK_EMPTY, http: 422, condition: "tolerance analysis is requested on a design with no ACTIVE ToleranceAllocation" }
  - { id: ERR_TOLERANCE_BUDGET_EXCEEDED, http: 422, condition: "a design whose tolerance_verdict is FAIL is submitted for release" }
  - { id: ERR_SPECTRAL_SAMPLE_INSUFFICIENT, http: 422, condition: "fewer than 5 supplied spectral samples fall inside the design's inclusive wavelength band" }
  - { id: ERR_SLOT_ALREADY_OCCUPIED, http: 409, condition: "another ACTIVE AssemblyComponent of the assembly already holds the requested slot_index" }
  - { id: ERR_ELEMENT_ALLOCATION_EXCEEDED, http: 409, condition: "the ACTIVE components drawing on the work order already equal its element_count" }
  - { id: ERR_DUPLICATE_DESIGN_CODE, http: 409, condition: "another OpticalDesign already uses the design_code" }
  - { id: ERR_DUPLICATE_LOT_CODE, http: 409, condition: "another GlassLot already uses the lot_code" }
  - { id: ERR_EXPORT_LICENSE_NOT_APPROVED, http: 409, condition: "the governing ExportClassification requires a licence that is not yet LICENSE_APPROVED, or the work order's compliance_status is not CLEARED" }
  - { id: ERR_EXPORT_CLASSIFICATION_MISSING, http: 409, condition: "the design has no governing ExportClassification (none exists, or every row is LICENSE_DENIED)" }
  - { id: ERR_EXPORT_CLASSIFICATION_EXISTS, http: 409, condition: "the design already has an ExportClassification whose classification_status is not LICENSE_DENIED" }
  - { id: ERR_EXPORT_ALREADY_DECIDED, http: 409, condition: "a licence decision is recorded on a classification whose classification_status is not LICENSE_REQUIRED" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 409, condition: "the package's completeness_pct is not exactly 100.00 at submit or at approval" }
  - { id: ERR_DOCUMENTATION_NOT_APPROVED, http: 409, condition: "the assembly's documentation package is not in APPROVED at release" }
  - { id: ERR_DUPLICATE_DOCUMENT_TYPE, http: 409, condition: "the document_type is already attached to the package" }
  - { id: ERR_DOCUMENTATION_PACKAGE_EXISTS, http: 409, condition: "the assembly already has a DocumentationPackage" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 409, condition: "the assembly has no InspectionRecord, or its latest record by created_at is FAILED" }
  - { id: ERR_DEFECT_NOT_WAIVABLE, http: 409, condition: "the failed inspection also failed cleanliness, or a defect number exceeds twice the design limit" }
  - { id: ERR_COMPONENT_NOT_RELEASED, http: 409, condition: "a component's WorkOrder is not in process_status RELEASED_TO_ASSEMBLY" }
  - { id: ERR_ASSEMBLY_EMPTY, http: 409, condition: "the assembly has no AssemblyComponent in component_status ACTIVE" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "the requested current_utc precedes the logical clock's present value" }

# =============================================================================
# §1.7 RBAC matrix — segregation-of-duties model. Every role's X-User-ID is an
# operator identifier, so all seven are `opaque`; the scaffold stores those ids
# on rows (recorded_by_user_id, inspected_by_user_id, submitted_by_user_id, ...)
# purely to compare actors across steps, never to equal any entity's id.
# All GET endpoints in §1.5 are shared by all seven roles.
# =============================================================================
roles:
  - name: OpticsEngineer
    description: "Owns the design surface: translates optical designs into manufacturable specifications, allocates the tolerance budget, runs the stack-up and releases or revises designs."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/optical-designs"
      - "POST /optics/optical-designs/{id}/tolerance-allocations"
      - "POST /optics/tolerance-allocations/{id}/retire"
      - "POST /optics/optical-designs/{id}/tolerance-analysis"
      - "POST /optics/optical-designs/{id}/revisions"
    shared_operations:
      - "POST /optics/optical-designs/{id}/release (with QualityManager)"
      - "every GET endpoint in §1.5"

  - name: ProcurementOfficer
    description: "Owns incoming glass and substrate: receives melt lots, records index-homogeneity and striae certification, and blocks nonconforming lots."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/glass-lots"
      - "POST /optics/glass-lots/{id}/certification"
    shared_operations:
      - "POST /optics/glass-lots/{id}/block (with QualityManager)"
      - "every GET endpoint in §1.5"

  - name: ProcessTechnician
    description: "Owns the shop floor: opens work orders, schedules and runs grinding/polishing/figuring, books coating chambers, kits and aligns assemblies."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/work-orders"
      - "POST /optics/work-orders/{id}/release-to-assembly"
      - "POST /optics/process-runs"
      - "POST /optics/process-runs/{id}/start"
      - "POST /optics/process-runs/{id}/complete"
      - "POST /optics/coating-runs"
      - "POST /optics/coating-runs/{id}/deposit"
      - "POST /optics/coating-runs/{id}/strip"
      - "POST /optics/assemblies"
      - "POST /optics/assembly-components"
      - "POST /optics/assemblies/{id}/cement"
      - "POST /optics/assemblies/{id}/mount"
      - "POST /optics/assemblies/{id}/align"
    shared_operations:
      - "POST /optics/work-orders/{id}/cancel (with QualityManager)"
      - "POST /optics/process-runs/{id}/cancel (with QualityManager)"
      - "POST /optics/coating-runs/{id}/spectral-verification (with MetrologyTechnician)"
      - "POST /optics/assemblies/{id}/seal (with QualityManager)"
      - "POST /optics/documentation-packages, POST /optics/documentation-packages/{id}/documents, POST /optics/documentation-packages/{id}/submit (with QualityManager)"
      - "every GET endpoint in §1.5"

  - name: MetrologyTechnician
    description: "Owns measurement: records interferometric surface figure, roughness and transmitted-wavefront data, signs reports, and performs scratch-dig and cleanliness inspections."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/metrology-reports"
    shared_operations:
      - "POST /optics/metrology-reports/{id}/sign (with QualityManager; never by the report's own recorded_by_user_id)"
      - "POST /optics/metrology-instruments/{id}/calibrations (with PlantAdmin)"
      - "POST /optics/coating-runs/{id}/spectral-verification (with ProcessTechnician)"
      - "POST /optics/inspection-records (with QualityManager)"
      - "POST /optics/documentation-packages/{id}/documents (with QualityManager and ProcessTechnician)"
      - "every GET endpoint in §1.5"

  - name: QualityManager
    description: "Owns quality release: waives waivable defects, reviews documentation packages and releases finished assemblies. Cannot originate the record it later judges."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/inspection-records/{id}/waiver"
      - "POST /optics/documentation-packages/{id}/review"
      - "POST /optics/assemblies/{id}/release"
      - "POST /optics/work-orders/{id}/scrap"
    shared_operations:
      - "POST /optics/optical-designs/{id}/release (with OpticsEngineer)"
      - "POST /optics/glass-lots/{id}/block (with ProcurementOfficer)"
      - "POST /optics/work-orders/{id}/cancel, POST /optics/process-runs/{id}/cancel (with ProcessTechnician)"
      - "POST /optics/metrology-reports/{id}/sign (with MetrologyTechnician)"
      - "POST /optics/inspection-records (with MetrologyTechnician)"
      - "POST /optics/assemblies/{id}/seal (with ProcessTechnician)"
      - "POST /optics/documentation-packages, POST /optics/documentation-packages/{id}/documents, POST /optics/documentation-packages/{id}/submit (with ProcessTechnician)"
      - "every GET endpoint in §1.5"

  - name: ExportComplianceOfficer
    description: "Owns export control: classifies designs against the high-performance-optics thresholds, screens work orders, and records licensing decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/export-classifications"
      - "POST /optics/export-classifications/{id}/license-decision"
      - "POST /optics/export-classifications/{id}/revocation"
      - "POST /optics/work-orders/{id}/compliance-screen"
    shared_operations:
      - "every GET endpoint in §1.5"

  - name: PlantAdmin
    description: "Owns plant configuration and the logical clock: registers metrology instruments and coating chambers, records calibrations, and advances the clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /optics/metrology-instruments"
      - "POST /optics/coating-chambers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /optics/metrology-instruments/{id}/calibrations (with MetrologyTechnician)"
      - "every GET endpoint in §1.5"
