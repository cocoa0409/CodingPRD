# =============================================================================
# Medicaid Eligibility & Annual Redetermination — Seed Tables (v1)
# =============================================================================

scenario: |
  Medicaid Eligibility & Annual Redetermination: MAGI income calculation,
  state-specific rules, household size, asset exemptions, annual
  Redetermination, emergency continuous coverage, appeals and fair hearing.

domain_name: medicaid-eligibility
api_prefix: /households

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Household, Applicant, Application, Enrollment, Appeal, FairHearing)
  # linked via foreign keys; only IncomeRecord and AssetRecord nest under Applicant for
  # natural ownership. Most URLs are flat resource paths with FK references in bodies.

  state_machine_shape: branching
  # Application is branching with cyclic revert (DENIED -> APPEALED -> UNDER_REVIEW -> APPROVED|DENIED loop).
  # Enrollment uses cyclic redetermination (ACTIVE -> REDETERMINATION_DUE -> ACTIVE).
  # FairHearing is linear; Appeal is branching with revert.

  relationship_patterns:
    - one_to_many               # Household -> Applicant, Applicant -> IncomeRecord/AssetRecord
    - cross_aggregate           # Appeal references EligibilityDetermination across aggregate boundary
    - self_referential          # Household.head_applicant_id references one of its own Applicants

  role_model: segregation_of_duties
  # IntakeWorker creates applications and records; EligibilityCaseworker computes determinations
  # but CANNOT decide appeals; AppealsOfficer rules on appeals but CANNOT be the determiner who
  # originally denied; PolicyAdmin configures StatePolicy and EmergencyDeclaration.

  consistency_model: immediate
  # All cascaded mutations (appeal grant -> determination reverse -> enrollment reactivate ->
  # household summary recompute) happen synchronously within the triggering request.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StatePolicy
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code (e.g. CA, NY); unique" }
      - { name: fpl_year, type: integer, source: input, description: "Federal Poverty Level reference year (e.g. 2025)" }
      - { name: fpl_base_amount, type: number, source: input, description: "FPL annual amount for household size 1 in this state/year (USD)" }
      - { name: fpl_per_member_amount, type: number, source: input, description: "Additional FPL annual amount per extra household member (USD)" }
      - { name: magi_income_limit_pct, type: number, source: input, description: "MAGI eligibility ceiling as percent of FPL (e.g. 138.0 for ACA expansion, 133.0 for non-expansion)" }
      - { name: asset_limit_per_member, type: number, source: input, description: "Per-member countable asset limit (USD); 0 means no asset test (most MAGI categories)" }
      - { name: asset_test_applies, type: boolean, source: input, default: false, description: "Whether asset test applies; false for MAGI-based eligibility, true for non-MAGI categories" }
      - { name: state_disregard_amount, type: number, source: input, default: 0, description: "State-specific income disregard subtracted from MAGI before FPL check (USD/year)" }
      - { name: state_exempt_asset_types, type: array, source: input, description: "Array of asset_type strings exempt under this state's rules (in addition to federal exemptions)" }
      - { name: emergency_continuous_active, type: boolean, source: computed, description: "True iff an EmergencyDeclaration with scope STATE+state_code OR scope FEDERAL is ACTIVE at clock_now" }

  - name: EmergencyDeclaration
    parent: null
    common_fields: false  # immutable append-only — id and created_at only
    fields:
      - { name: scope, type: enum, source: input, description: "FEDERAL | STATE" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code, required iff scope=STATE; null for FEDERAL" }
      - { name: declared_at, type: datetime, source: input, description: "ISO 8601 UTC start of emergency" }
      - { name: expires_at, type: datetime, source: input, description: "ISO 8601 UTC end of emergency; exclusive upper bound" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | EXPIRED — ACTIVE iff declared_at <= clock_now < expires_at; EXPIRED iff clock_now >= expires_at" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; must match an existing StatePolicy.state_code" }
      - { name: head_applicant_id, type: string, source: system, description: "Self-referential FK to one of this Household's own Applicants; set when the first Applicant is created" }
      - { name: address_line, type: string, source: input, description: "Street address (free text)" }
      - { name: filing_status, type: enum, source: input, description: "SINGLE | MARRIED_JOINT | MARRIED_SEPARATE | HEAD_OF_HOUSEHOLD" }
      - { name: household_size, type: integer, source: computed, description: "Count of Applicants whose dependent_status != EXCLUDED" }
      - { name: total_magi, type: number, source: computed, description: "Sum of Applicant.magi_income across Applicants whose dependent_status != EXCLUDED, then minus StatePolicy.state_disregard_amount, floor at 0" }
      - { name: fpl_threshold_amount, type: number, source: computed, description: "fpl_base_amount + (household_size - 1) * fpl_per_member_amount, using the household's StatePolicy" }
      - { name: fpl_percent, type: number, source: computed, description: "(total_magi / fpl_threshold_amount) * 100, rounded HALF_UP to 2 decimals; if fpl_threshold_amount==0, set to null and surface ERR_FPL_THRESHOLD_INVALID at any eligibility-check trigger" }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of Enrollments where applicant_id belongs to this Household and coverage_status IN {ACTIVE, CONTINUOUS_COVERAGE}" }

  - name: Applicant
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "Parent Household ID" }
      - { name: full_name, type: string, source: input, description: "Applicant full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); used to derive age at clock_now" }
      - { name: dependent_status, type: enum, source: input, description: "PRIMARY | SPOUSE | DEPENDENT | EXCLUDED — EXCLUDED applicants do not contribute to household_size or total_magi" }
      - { name: is_disabled, type: boolean, source: input, default: false, description: "If true, applicant qualifies for non-MAGI evaluation path (asset test applies)" }
      - { name: is_pregnant, type: boolean, source: input, default: false, description: "Pregnancy flag; increases effective household_size by 1 per pregnancy when computing total_magi denominator" }
      - { name: magi_income, type: number, source: computed, description: "Per-applicant MAGI computed from IncomeRecords; see calculation magi_per_applicant" }
      - { name: countable_assets, type: number, source: computed, description: "Sum of non-exempt AssetRecord.market_value for this applicant; see calculation countable_asset_value" }
      - { name: redetermination_count_this_year, type: integer, source: computed, description: "Distinct number of Redetermination records (status != WITHDRAWN) tied to this applicant in current FPL year" }

  - name: IncomeRecord
    parent: Applicant
    common_fields: false  # immutable append-only — only id and created_at
    fields:
      - { name: applicant_id, type: string, source: system, description: "Parent Applicant ID" }
      - { name: source_type, type: enum, source: input, description: "WAGES | SELF_EMPLOYMENT | INTEREST | DIVIDENDS | CAPITAL_GAINS | SOCIAL_SECURITY | UNEMPLOYMENT | CHILD_SUPPORT | TANF | SSI | OTHER" }
      - { name: gross_amount, type: number, source: input, description: "Gross amount in USD" }
      - { name: frequency, type: enum, source: input, description: "ANNUAL | MONTHLY | BIWEEKLY | WEEKLY — annualized in MAGI calc" }

  - name: AssetRecord
    parent: Applicant
    common_fields: false  # immutable append-only — only id and created_at
    fields:
      - { name: applicant_id, type: string, source: system, description: "Parent Applicant ID" }
      - { name: asset_type, type: enum, source: input, description: "PRIMARY_RESIDENCE | VEHICLE | CHECKING | SAVINGS | RETIREMENT | INVESTMENT | LIFE_INSURANCE | OTHER" }
      - { name: market_value, type: number, source: input, description: "Current market value in USD" }
      - { name: exempt_under_federal, type: boolean, source: computed, description: "True if asset_type IN {PRIMARY_RESIDENCE, RETIREMENT, LIFE_INSURANCE}; the fixed federal exempt set" }
      - { name: exempt_under_state, type: boolean, source: computed, description: "True iff asset_type appears in the household's StatePolicy.state_exempt_asset_types" }
      - { name: countable_value, type: number, source: computed, description: "market_value if neither exempt flag is set under the chosen rule variant, else 0; the rule variant is chosen at Application submission time" }

  - name: Application
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "Parent Household ID" }
      - { name: program, type: enum, source: input, description: "MAGI_ADULT | MAGI_CHILD | MAGI_PREGNANT | NON_MAGI_DISABILITY | NON_MAGI_AGED" }
      - { name: rule_variant, type: enum, source: input, default: STATE, description: "FEDERAL | STATE — selects which disregard/exemption set the determination uses; FEDERAL ignores StatePolicy.state_disregard_amount and state_exempt_asset_types; STATE applies both" }
      - { name: submitted_at, type: datetime, source: system, description: "ISO 8601 UTC when application transitioned to UNDER_REVIEW" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | DENIED | APPEALED | WITHDRAWN" }
      - { name: snapshot_magi, type: number, source: system, description: "total_magi captured at submission time; immutable thereafter" }
      - { name: snapshot_fpl_percent, type: number, source: system, description: "fpl_percent captured at submission time; immutable thereafter" }
      - { name: snapshot_countable_assets, type: number, source: system, description: "Sum of Applicant.countable_assets across non-EXCLUDED applicants at submission time" }

  - name: EligibilityDetermination
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "Parent Application ID" }
      - { name: decided_at, type: datetime, source: system, description: "ISO 8601 UTC when determination was rendered" }
      - { name: outcome, type: enum, source: system, description: "ELIGIBLE | INELIGIBLE | OVERTURNED — OVERTURNED is set only by Appeal grant cascade" }
      - { name: ineligibility_reason, type: enum, source: system, description: "INCOME_EXCEEDS_LIMIT | ASSETS_EXCEED_LIMIT | NOT_RESIDENT | NON_QUALIFYING_PROGRAM | null if eligible" }
      - { name: computed_magi, type: number, source: system, description: "Copy of Application.snapshot_magi at decision time" }
      - { name: computed_fpl_percent, type: number, source: system, description: "Copy of Application.snapshot_fpl_percent at decision time" }
      - { name: applied_rule_variant, type: enum, source: system, description: "FEDERAL | STATE — copy of Application.rule_variant" }

  - name: Enrollment
    parent: null  # flat — peer to Application, linked via FK
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK to Applicant" }
      - { name: determination_id, type: string, source: system, description: "FK to the ELIGIBLE EligibilityDetermination that created this enrollment" }
      - { name: coverage_start, type: datetime, source: system, description: "ISO 8601 UTC start of coverage; half-open lower bound [start, end)" }
      - { name: coverage_end, type: datetime, source: system, description: "ISO 8601 UTC end of coverage; exclusive upper bound; coverage_start + 365 days at creation" }
      - { name: coverage_status, type: enum, source: system, description: "ACTIVE | CONTINUOUS_COVERAGE | REDETERMINATION_DUE | SUSPENDED | TERMINATED" }
      - { name: continuous_coverage_flag, type: boolean, source: computed, description: "True iff coverage_status == CONTINUOUS_COVERAGE; set when an EmergencyDeclaration covering this applicant's state becomes ACTIVE while enrollment is ACTIVE or REDETERMINATION_DUE" }
      - { name: redetermination_due_at, type: datetime, source: system, description: "ISO 8601 UTC = coverage_start + 365 days; flips coverage_status to REDETERMINATION_DUE at the next /_sweep/redeterminations call after this time" }

  - name: Redetermination
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "Parent Enrollment ID" }
      - { name: due_date, type: datetime, source: system, description: "Copy of Enrollment.redetermination_due_at at creation" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | RENEWED | TERMINATED | WITHDRAWN" }
      - { name: new_snapshot_magi, type: number, source: input, description: "MAGI for the renewal year; provided in the SUBMIT request body" }
      - { name: new_snapshot_fpl_percent, type: number, source: computed, description: "Computed at SUBMIT time using current Household.fpl_threshold_amount" }
      - { name: decision, type: enum, source: system, description: "RENEWED | TERMINATED — set by the system at SUBMIT based on snapshot vs StatePolicy.magi_income_limit_pct" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: determination_id, type: string, source: system, description: "FK to the EligibilityDetermination being appealed (must currently have outcome INELIGIBLE)" }
      - { name: filed_at, type: datetime, source: system, description: "ISO 8601 UTC when appeal was filed" }
      - { name: deadline_at, type: datetime, source: system, description: "filed_at + 90 days; the latest a hearing may be scheduled to start" }
      - { name: status, type: enum, source: system, description: "FILED | HEARING_SCHEDULED | UNDER_REVIEW | GRANTED | UPHELD | WITHDRAWN" }
      - { name: officer_id, type: string, source: system, description: "AppealsOfficer X-User-ID assigned at hearing-scheduling time" }
      - { name: outcome_reason, type: string, source: input, description: "Free-text rationale recorded at GRANT or UPHOLD time" }

  - name: FairHearing
    parent: Appeal
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: system, description: "Parent Appeal ID; unique — each Appeal has at most one FairHearing" }
      - { name: officer_id, type: string, source: input, description: "AppealsOfficer X-User-ID conducting the hearing" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start; closed-interval semantics with 30-minute buffer before and after" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC end; closed-interval; scheduled_end > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /applications/:application_id/submit"
        actor: IntakeWorker
        preconditions:
          - "Application must be DRAFT (ERR_INVALID_STATE)"
          - "Parent Household.head_applicant_id must be set (ERR_HOUSEHOLD_INCOMPLETE)"
          - "At least one Applicant exists with dependent_status != EXCLUDED (ERR_HOUSEHOLD_INCOMPLETE)"
          - "Household.state_code must reference an existing StatePolicy (ERR_NOT_FOUND)"
        side_effects:
          - "snapshot_magi := Household.total_magi (after disregard if rule_variant=STATE, else without disregard)"
          - "snapshot_fpl_percent := Household.fpl_percent recomputed with the rule-variant-adjusted total_magi"
          - "snapshot_countable_assets := sum of Applicant.countable_assets using the chosen rule_variant exempt set"
          - "submitted_at := clock_now"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/:application_id/decide  (decision=APPROVE)"
        actor: EligibilityCaseworker
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "EligibilityDetermination computed outcome must be ELIGIBLE (ERR_NOT_ELIGIBLE)"
          - "Acting caseworker X-User-ID must differ from any prior caseworker who denied this application (segregation of duties; ERR_FORBIDDEN_SAME_ACTOR)"
        side_effects:
          - "Create EligibilityDetermination with outcome=ELIGIBLE"
          - "Create Enrollment per non-EXCLUDED Applicant: coverage_start=clock_now, coverage_end=clock_now+365d, coverage_status=ACTIVE, redetermination_due_at=coverage_start+365d"
          - "Household.active_enrollment_count recomputed"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/:application_id/decide  (decision=DENY)"
        actor: EligibilityCaseworker
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Create EligibilityDetermination with outcome=INELIGIBLE and ineligibility_reason"
          - "No Enrollments created"

      - from: DENIED
        to: APPEALED
        trigger: "POST /appeals  (with determination_id pointing at this Application)"
        actor: IntakeWorker
        preconditions:
          - "Application must be DENIED (ERR_INVALID_STATE)"
          - "filed_at < EligibilityDetermination.decided_at + 90 days (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "Create Appeal record (status=FILED)"

      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "system (automatic when associated Appeal transitions to GRANTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Application returns to UNDER_REVIEW for re-decision"
          - "Cyclic — may transition to APPROVED or DENIED again"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/:application_id/withdraw"
        actor: IntakeWorker
        preconditions:
          - "Application must be DRAFT or UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/:application_id/withdraw"
        actor: IntakeWorker
        preconditions:
          - "Application must be DRAFT or UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects: []

  - entity: EligibilityDetermination
    initial_state: ELIGIBLE  # or INELIGIBLE — created in terminal-ish state by the decide transition
    terminal_states: [OVERTURNED]
    transitions:
      - from: INELIGIBLE
        to: OVERTURNED
        trigger: "system (automatic when associated Appeal transitions to GRANTED)"
        actor: system
        preconditions:
          - "EligibilityDetermination.outcome must be INELIGIBLE (ERR_INVALID_STATE)"
        side_effects:
          - "Application.status := APPEALED -> UNDER_REVIEW (cascade hop 1)"
          - "Caseworker must re-decide; if re-decided APPROVED, Enrollments are created (cascade hop 2)"
          - "Household.active_enrollment_count recomputed (cascade hop 3)"

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: REDETERMINATION_DUE
        trigger: "POST /_sweep/redeterminations  (system sweep)"
        actor: system
        preconditions:
          - "clock_now >= Enrollment.redetermination_due_at"
          - "Enrollment.coverage_status must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Create a Redetermination record with status=PENDING, due_date=redetermination_due_at"

      - from: REDETERMINATION_DUE
        to: ACTIVE
        trigger: "POST /redeterminations/:redetermination_id/submit  (decision=RENEW)"
        actor: EligibilityCaseworker
        preconditions:
          - "Redetermination must be PENDING (ERR_INVALID_STATE)"
          - "new_snapshot_fpl_percent must satisfy MAGI eligibility against current StatePolicy (ERR_NOT_ELIGIBLE)"
        side_effects:
          - "Redetermination.status := RENEWED, decision := RENEWED"
          - "Enrollment.coverage_start := clock_now, coverage_end := clock_now+365d, redetermination_due_at := coverage_start+365d"
          - "coverage_status := ACTIVE (cyclic loop closed)"

      - from: REDETERMINATION_DUE
        to: TERMINATED
        trigger: "POST /redeterminations/:redetermination_id/submit  (decision=TERMINATE)"
        actor: EligibilityCaseworker
        preconditions:
          - "Redetermination must be PENDING (ERR_INVALID_STATE)"
          - "new_snapshot_fpl_percent fails eligibility OR submission past 90-day grace from due_date"
        side_effects:
          - "Redetermination.status := TERMINATED"
          - "coverage_status := TERMINATED"
          - "Household.active_enrollment_count decremented (cascade hop)"

      - from: ACTIVE
        to: CONTINUOUS_COVERAGE
        trigger: "POST /emergency-declarations  (system cascade when scope covers this enrollment's state)"
        actor: system
        preconditions:
          - "Newly created EmergencyDeclaration has scope=FEDERAL OR scope=STATE with state_code matching this Enrollment's Applicant's Household.state_code"
        side_effects:
          - "continuous_coverage_flag := true"
          - "If coverage_status was REDETERMINATION_DUE, any associated PENDING Redetermination.status := WITHDRAWN (cascade hop)"

      - from: REDETERMINATION_DUE
        to: CONTINUOUS_COVERAGE
        trigger: "POST /emergency-declarations  (system cascade)"
        actor: system
        preconditions:
          - "Same as ACTIVE -> CONTINUOUS_COVERAGE"
        side_effects:
          - "Same as ACTIVE -> CONTINUOUS_COVERAGE"
          - "Associated PENDING Redetermination.status := WITHDRAWN"

      - from: CONTINUOUS_COVERAGE
        to: ACTIVE
        trigger: "POST /_clock/advance  (system cascade once all relevant EmergencyDeclarations expire)"
        actor: system
        preconditions:
          - "No EmergencyDeclaration with status=ACTIVE covers this Enrollment's state any longer"
        side_effects:
          - "continuous_coverage_flag := false"
          - "If redetermination_due_at < clock_now, the next /_sweep/redeterminations will transition this enrollment to REDETERMINATION_DUE again"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/:enrollment_id/suspend"
        actor: PolicyAdmin
        preconditions:
          - "Enrollment must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Household.active_enrollment_count recomputed (decrement)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/:enrollment_id/reactivate"
        actor: PolicyAdmin
        preconditions:
          - "Enrollment must be SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Household.active_enrollment_count recomputed (increment)"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, UPHELD, WITHDRAWN]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /appeals/:appeal_id/schedule-hearing"
        actor: AppealsOfficer
        preconditions:
          - "Appeal must be FILED (ERR_INVALID_STATE)"
          - "Hearing scheduled_start must be before Appeal.deadline_at (ERR_APPEAL_WINDOW_EXPIRED)"
          - "Hearing scheduled time must not collide with another SCHEDULED FairHearing for the same officer_id (ERR_HEARING_CONFLICT) — closed-interval overlap with 30-minute buffer applied on both sides"
          - "Acting AppealsOfficer X-User-ID must differ from the EligibilityCaseworker X-User-ID who created the appealed determination (ERR_FORBIDDEN_SAME_ACTOR)"
        side_effects:
          - "Create FairHearing record (status=SCHEDULED)"

      - from: HEARING_SCHEDULED
        to: UNDER_REVIEW
        trigger: "POST /fair-hearings/:fair_hearing_id/hold"
        actor: AppealsOfficer
        preconditions:
          - "FairHearing must be SCHEDULED (ERR_INVALID_STATE)"
          - "clock_now >= scheduled_start (ERR_HEARING_NOT_DUE)"
        side_effects:
          - "FairHearing.status := HELD"

      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/:appeal_id/grant"
        actor: AppealsOfficer
        preconditions:
          - "Appeal must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Associated FairHearing must be HELD (ERR_INVALID_STATE)"
        side_effects:
          - "EligibilityDetermination.outcome := OVERTURNED (cascade hop 1)"
          - "Associated Application.status := APPEALED -> UNDER_REVIEW (cascade hop 2)"
          - "Caseworker is required to re-decide; if re-decided APPROVED, Enrollments are created and Household.active_enrollment_count is recomputed (cascade hop 3)"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/:appeal_id/uphold"
        actor: AppealsOfficer
        preconditions:
          - "Appeal must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Associated FairHearing must be HELD (ERR_INVALID_STATE)"
        side_effects:
          - "EligibilityDetermination.outcome unchanged (INELIGIBLE)"
          - "Application stays DENIED"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /appeals/:appeal_id/withdraw"
        actor: IntakeWorker
        preconditions:
          - "Appeal must be FILED or HEARING_SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "If a SCHEDULED FairHearing exists, FairHearing.status := CANCELLED"

      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /appeals/:appeal_id/withdraw"
        actor: IntakeWorker
        preconditions:
          - "Same as FILED -> WITHDRAWN"
        side_effects:
          - "Same as FILED -> WITHDRAWN"

  - entity: FairHearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /fair-hearings/:fair_hearing_id/hold"
        actor: AppealsOfficer
        preconditions:
          - "FairHearing must be SCHEDULED (ERR_INVALID_STATE)"
          - "clock_now >= scheduled_start (ERR_HEARING_NOT_DUE)"
        side_effects:
          - "Appeal.status := UNDER_REVIEW (linked transition)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (automatic on Appeal withdraw)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two caseworkers simultaneously DECIDE the same UNDER_REVIEW Application"
    guarantee: "Exactly one decision succeeds; the second sees the Application no longer UNDER_REVIEW"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status"

  - scenario: "Two AppealsOfficers simultaneously schedule overlapping FairHearings on the same officer_id"
    guarantee: "First scheduling commits; second observes the overlap and is rejected"
    error_id: ERR_HEARING_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on FairHearing creation"

  - scenario: "A Redetermination is SUBMITTED while an EmergencyDeclaration arrives that triggers CONTINUOUS_COVERAGE on the same Enrollment"
    guarantee: "Whichever request reaches the Enrollment row first wins; the loser observes coverage_status no longer equals REDETERMINATION_DUE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Enrollment.coverage_status"

  - scenario: "Two distinct Appeals are filed against the same INELIGIBLE EligibilityDetermination"
    guarantee: "At most one Appeal exists per determination_id; second creation rejected"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on Appeal.determination_id uniqueness"

  - scenario: "Two simultaneous PATCH requests update the same Application body with stale version"
    guarantee: "One commits; the other is rejected as a stale write"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "version-field OCC; loser must refetch"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: magi_per_applicant
    trigger: "evaluated lazily on read of Applicant.magi_income AND captured into Application.snapshot_magi on POST /applications/:application_id/submit"
    algorithm: aggregation
    formula: |
      # MAGI = annualized countable income per applicant.
      # Countable source_types depend on the applicant's filing role.
      # Step 1: annualize each IncomeRecord:
      #   ANNUAL    -> gross_amount
      #   MONTHLY   -> gross_amount * 12
      #   BIWEEKLY  -> gross_amount * 26
      #   WEEKLY    -> gross_amount * 52
      # Step 2: include income only if source_type is countable for MAGI:
      #   Countable_for_MAGI = {WAGES, SELF_EMPLOYMENT, INTEREST, DIVIDENDS,
      #                         CAPITAL_GAINS, UNEMPLOYMENT, OTHER}
      #   Plus SOCIAL_SECURITY only if applicant.dependent_status == PRIMARY
      #     (dependents' SS benefits are excluded from MAGI under federal rule).
      #   Excluded_for_MAGI = {CHILD_SUPPORT, TANF, SSI}
      # Step 3: magi_income = sum of annualized countable amounts.
      # The denominator for Household.fpl_percent uses an EFFECTIVE household size
      # of: count(non-EXCLUDED Applicants) + count(Applicant.is_pregnant == true).
    input_set: "All IncomeRecord rows for the applicant, filtered by source_type per step 2"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_magi
        when: "Application.rule_variant == FEDERAL"
        difference: "Household.total_magi = sum(Applicant.magi_income) WITHOUT subtracting StatePolicy.state_disregard_amount."
      - name: state_adjusted_magi
        when: "Application.rule_variant == STATE"
        difference: "Household.total_magi = max(0, sum(Applicant.magi_income) - StatePolicy.state_disregard_amount). The two variants produce different snapshot_magi and therefore different snapshot_fpl_percent for identical income inputs."

  - name: countable_asset_value
    trigger: "evaluated lazily on read of Applicant.countable_assets AND captured into Application.snapshot_countable_assets on submit"
    algorithm: aggregation
    formula: |
      # For each AssetRecord:
      #   federal_exempt = asset_type IN {PRIMARY_RESIDENCE, RETIREMENT, LIFE_INSURANCE}
      #   state_exempt   = asset_type IN StatePolicy.state_exempt_asset_types
      # countable_value depends on rule_variant:
      #   FEDERAL: 0 if federal_exempt else market_value
      #   STATE:   0 if (federal_exempt OR state_exempt) else market_value
      # Applicant.countable_assets = sum(countable_value over AssetRecords)
      # Application.snapshot_countable_assets = sum across non-EXCLUDED Applicants
    input_set: "All AssetRecord rows for the applicant; the rule_variant comes from the parent Application at submission time"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: federal_exempt_set
        when: "Application.rule_variant == FEDERAL"
        difference: "Only the fixed federal exempt set {PRIMARY_RESIDENCE, RETIREMENT, LIFE_INSURANCE} is excluded; a CHECKING balance of $5,000 contributes its full market_value."
      - name: state_exempt_set
        when: "Application.rule_variant == STATE"
        difference: "Federal exempt set UNION StatePolicy.state_exempt_asset_types is excluded; e.g. if state exempts VEHICLE, a $20,000 vehicle contributes 0 instead of $20,000."

  - name: household_fpl_percent
    trigger: "evaluated lazily on read of Household.fpl_percent AND captured into Application.snapshot_fpl_percent on submit"
    algorithm: threshold
    formula: |
      # Step 1: effective_size = count(non-EXCLUDED Applicants) + count(Applicants where is_pregnant==true)
      # Step 2: fpl_threshold_amount = StatePolicy.fpl_base_amount +
      #                                (effective_size - 1) * StatePolicy.fpl_per_member_amount
      #   If effective_size == 0, set fpl_threshold_amount = 0 and abort with ERR_FPL_THRESHOLD_INVALID.
      # Step 3: total_magi already computed per rule_variant in magi_per_applicant.
      # Step 4: raw = total_magi / fpl_threshold_amount * 100
      # Step 5: fpl_percent = round_half_up(raw, 2)
      # Eligibility check at decide time:
      #   ELIGIBLE iff fpl_percent <= StatePolicy.magi_income_limit_pct
      #     (inclusive upper bound — exactly equal to the ceiling is ELIGIBLE)
      #   AND (if StatePolicy.asset_test_applies):
      #     snapshot_countable_assets <= StatePolicy.asset_limit_per_member * effective_size
    precision: "fpl_percent rounded HALF_UP to 2 decimals BEFORE the threshold comparison; the comparison is on the rounded value"

  - name: enrollment_redetermination_premium
    trigger: "computed and returned by GET /redeterminations/:id when status=PENDING; informational"
    algorithm: tiered_pricing
    formula: |
      # The redetermination "premium estimate" — what the household would pay if reduced cost-sharing
      # applies after renewal. Demonstrates nested rounding order.
      # Inputs per applicant in the enrollment's household (non-EXCLUDED only):
      #   age_factor = 1.0 if age < 18 else (1.0 + (min(age,64) - 18) * 0.02)
      #     (age computed at clock_now from date_of_birth)
      #   share_factor = max(0, (new_snapshot_fpl_percent - 100) / 100)
      #     (households at <=100% FPL contribute nothing)
      #   per_member_premium = age_factor * share_factor * 30.00
      # Total = SUM of per_member_premium, then round HALF_UP to 2 decimals.
      # ORDERING IS PINNED: round per-member first to 2 decimals using HALF_UP,
      # THEN sum the rounded per-member amounts, THEN round the sum to 2 decimals (no-op since inputs are already at 2 decimals).
      # The alternative order (sum exact-precision per-member values then round once)
      # produces a DIFFERENT cents value on some inputs; the pinned order is per-member-first.
    constants:
      BASE_PREMIUM_PER_FPL_UNIT: 30.00
      AGE_FACTOR_FLOOR_AGE: 18
      AGE_FACTOR_CEIL_AGE: 64
      AGE_FACTOR_PER_YEAR: 0.02
    precision: "round_half_up to 2 decimals at the per-member step; total is sum of already-rounded per-member values"

  - name: appeal_deadline
    trigger: "POST /appeals on creation"
    algorithm: forward_looking
    formula: |
      # deadline_at = EligibilityDetermination.decided_at + 90 days
      # If POST /appeals occurs at clock_now > deadline_at, reject with ERR_APPEAL_WINDOW_EXPIRED.
      # The Appeal record itself stores deadline_at := filed_at + 90 days (same value)
      # so downstream scheduling can compare against the immutable Appeal field.
    precision: "datetime arithmetic in UTC; 90 days = 90 * 86400 seconds"

  - name: fair_hearing_overlap_check
    trigger: "POST /appeals/:appeal_id/schedule-hearing"
    algorithm: interval_merge
    formula: |
      # Closed interval semantics with 30-minute buffer on both sides.
      # New hearing interval = [scheduled_start - 30min, scheduled_end + 30min].
      # For each existing FairHearing F with F.officer_id == new.officer_id AND F.status == SCHEDULED:
      #   existing_interval = [F.scheduled_start, F.scheduled_end]  (NO buffer applied to the existing side)
      #   reject if new_buffered_interval intersects existing_interval (closed-closed intersection)
      # i.e. reject iff: (new.scheduled_start - 30min) <= F.scheduled_end
      #                  AND F.scheduled_start <= (new.scheduled_end + 30min)
      # NOTE: Different from Enrollment coverage overlap (which is half-open and applies no buffer).
    precision: "all timestamps in UTC, second precision"

  - name: enrollment_coverage_overlap_check
    trigger: "system on Enrollment creation (from Application APPROVED decision side-effect)"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [coverage_start, coverage_end).
      # For each existing Enrollment E on the same applicant_id with E.coverage_status IN {ACTIVE, CONTINUOUS_COVERAGE, REDETERMINATION_DUE}:
      #   reject if [new.coverage_start, new.coverage_end) overlaps [E.coverage_start, E.coverage_end)
      # i.e. reject iff: new.coverage_start < E.coverage_end AND E.coverage_start < new.coverage_end
      # Adjacency (new.coverage_start == E.coverage_end) does NOT overlap under half-open.
    precision: "datetime UTC, second precision"

  - name: household_active_enrollment_count
    trigger: "any Enrollment state transition; any Applicant create/delete; recomputed in the same request"
    algorithm: aggregation
    formula: |
      # active_enrollment_count = count of Enrollment rows where
      #   applicant_id IN { Applicant.id where household_id == this.id }
      #   AND coverage_status IN {ACTIVE, CONTINUOUS_COVERAGE}
      # (REDETERMINATION_DUE counts as inactive — household is between coverage years
      # until the redetermination is decided; CONTINUOUS_COVERAGE explicitly counts as active.)
    precision: "integer"

  - name: applicant_redetermination_count_this_year
    trigger: "any Redetermination create/transition"
    algorithm: aggregation
    formula: |
      # current_year = StatePolicy.fpl_year for the Applicant's Household.state_code.
      # redetermination_count_this_year = count of distinct Redetermination rows where
      #   enrollment.applicant_id == this.id
      #   AND status IN {PENDING, SUBMITTED, RENEWED, TERMINATED}  -- NOT WITHDRAWN
      #   AND due_date's calendar year (UTC) == current_year
      # Important invariant: withdrawing a Redetermination must NOT decrement this counter
      # if a matching attempt was already counted; the formula filter (status != WITHDRAWN)
      # ensures withdraw-then-resubmit leaves the count UNCHANGED across the pair.
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must be present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role must be permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Segregation of duties: an AppealsOfficer ruling on an Appeal must NOT be the EligibilityCaseworker who created the appealed determination; an EligibilityCaseworker re-deciding an UNDER_REVIEW application that previously went DENIED must NOT be the same caseworker who issued the prior DENIED determination"
    error_id: ERR_FORBIDDEN_SAME_ACTOR
    http_status: 403
    applies_to: "POST /appeals/:id/grant, POST /appeals/:id/uphold, POST /applications/:id/decide (when prior determination DENIED)"

  - priority: 4
    category: existence
    check: "All path-id resources must exist; FK references in body (applicant_id, determination_id, etc.) must resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or FK references"

  - priority: 5
    category: state
    check: "Target resource must be in a valid state for the operation per §1.2 state machines"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Household.state_code must reference a StatePolicy; Household must have head_applicant_id set and at least one non-EXCLUDED Applicant before any Application submit"
    error_id: ERR_HOUSEHOLD_INCOMPLETE
    http_status: 409
    applies_to: "POST /applications/:id/submit"

  - priority: 7
    category: business_temporal
    check: "Appeal filed within 90 days of EligibilityDetermination.decided_at; hearing scheduled before Appeal.deadline_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /appeals, POST /appeals/:id/schedule-hearing"

  - priority: 8
    category: business_temporal
    check: "FairHearing.scheduled_start must be < FairHearing.scheduled_end and both must be in the future relative to clock_now at scheduling time; POST /fair-hearings/:id/hold requires clock_now >= scheduled_start"
    error_id: ERR_HEARING_NOT_DUE
    http_status: 409
    applies_to: "POST /fair-hearings/:id/hold"

  - priority: 9
    category: business_constraint
    check: "FairHearing.scheduled_start..scheduled_end (plus 30-min buffers on the new side) must not overlap another SCHEDULED FairHearing for the same officer_id (closed-interval semantics)"
    error_id: ERR_HEARING_CONFLICT
    http_status: 409
    applies_to: "POST /appeals/:id/schedule-hearing"

  - priority: 10
    category: business_constraint
    check: "Enrollment coverage window [coverage_start, coverage_end) must not overlap another non-TERMINATED Enrollment for the same applicant_id (half-open semantics)"
    error_id: ERR_ENROLLMENT_OVERLAP
    http_status: 409
    applies_to: "POST /applications/:id/decide (APPROVE), POST /redeterminations/:id/submit (RENEW)"

  - priority: 11
    category: business_constraint
    check: "At most one Appeal per EligibilityDetermination"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 12
    category: business_fiscal
    check: "Computed Household.fpl_percent must be <= StatePolicy.magi_income_limit_pct; if StatePolicy.asset_test_applies, snapshot_countable_assets <= StatePolicy.asset_limit_per_member * effective_size"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /applications/:id/decide (APPROVE), POST /redeterminations/:id/submit (RENEW)"

  - priority: 13
    category: business_fiscal
    check: "effective_size > 0 so fpl_threshold_amount > 0; division by zero protection"
    error_id: ERR_FPL_THRESHOLD_INVALID
    http_status: 422
    applies_to: "POST /applications/:id/submit, POST /redeterminations/:id/submit"

  - priority: 14
    category: business_constraint
    check: "OCC version match on PATCH requests"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /applications/:id, PATCH /households/:id"

  - priority: 15
    category: business_constraint
    check: "Request body well-formed and required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- StatePolicy (configuration; only PolicyAdmin writes) ---
  - method: POST
    path: "/state-policies"
    description: "Create a new StatePolicy for a (state_code, fpl_year) pair"
    roles: [PolicyAdmin]
    code: 201
    input: [state_code, fpl_year, fpl_base_amount, fpl_per_member_amount, magi_income_limit_pct, "asset_test_applies?", "asset_limit_per_member?", "state_disregard_amount?", "state_exempt_asset_types?"]
    output: StatePolicy
    side_effects: ["emergency_continuous_active recomputed from clock_now"]

  - method: GET
    path: "/state-policies/:state_code"
    description: "Get a StatePolicy by state_code"
    roles: [PolicyAdmin, IntakeWorker, EligibilityCaseworker, AppealsOfficer]
    code: 200
    input: []
    output: StatePolicy
    side_effects: []

  # --- EmergencyDeclaration ---
  - method: POST
    path: "/emergency-declarations"
    description: "Issue a new EmergencyDeclaration; cascades to flip eligible Enrollments to CONTINUOUS_COVERAGE"
    roles: [PolicyAdmin]
    code: 201
    input: [scope, "state_code?", declared_at, expires_at]
    output: EmergencyDeclaration
    side_effects:
      - "For each Enrollment whose Applicant's Household.state_code is covered: coverage_status -> CONTINUOUS_COVERAGE (if currently ACTIVE or REDETERMINATION_DUE)"
      - "Any PENDING Redetermination tied to a flipped Enrollment: status -> WITHDRAWN (cascade hop)"
      - "Household.active_enrollment_count recomputed (cascade hop)"

  - method: GET
    path: "/emergency-declarations/:declaration_id"
    description: "Get an EmergencyDeclaration"
    roles: [PolicyAdmin, IntakeWorker, EligibilityCaseworker, AppealsOfficer]
    code: 200
    input: []
    output: EmergencyDeclaration
    side_effects: []

  - method: GET
    path: "/emergency-declarations"
    description: "List EmergencyDeclarations; supports status filter"
    roles: [PolicyAdmin, IntakeWorker, EligibilityCaseworker, AppealsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmergencyDeclaration[]
    side_effects: []

  # --- Household ---
  - method: POST
    path: "/households"
    description: "Create a new Household"
    roles: [IntakeWorker]
    code: 201
    input: [state_code, address_line, filing_status]
    output: Household
    side_effects: ["head_applicant_id null until first Applicant is created"]

  - method: GET
    path: "/households/:household_id"
    description: "Get a Household with computed fields"
    roles: [IntakeWorker, EligibilityCaseworker, PolicyAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: PATCH
    path: "/households/:household_id"
    description: "Update Household address/filing_status; OCC via version"
    roles: [IntakeWorker]
    code: 200
    input: ["address_line?", "filing_status?", "version"]
    output: Household
    side_effects: ["total_magi/fpl_percent recomputed on next read"]

  # --- Applicant ---
  - method: POST
    path: "/households/:household_id/applicants"
    description: "Create an Applicant in a Household; first non-EXCLUDED applicant becomes head_applicant_id"
    roles: [IntakeWorker]
    code: 201
    input: [full_name, date_of_birth, dependent_status, "is_disabled?", "is_pregnant?"]
    output: Applicant
    side_effects:
      - "If parent Household.head_applicant_id is null and new dependent_status != EXCLUDED, set head_applicant_id to this new Applicant"
      - "Household.household_size and Household.fpl_threshold_amount recomputed"

  - method: GET
    path: "/households/:household_id/applicants/:applicant_id"
    description: "Get an Applicant"
    roles: [IntakeWorker, EligibilityCaseworker, PolicyAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/households/:household_id/applicants/:applicant_id/income"
    description: "Append an IncomeRecord (immutable)"
    roles: [IntakeWorker]
    code: 201
    input: [source_type, gross_amount, frequency]
    output: IncomeRecord
    side_effects: ["Applicant.magi_income recomputed on next read"]

  - method: POST
    path: "/households/:household_id/applicants/:applicant_id/assets"
    description: "Append an AssetRecord (immutable)"
    roles: [IntakeWorker]
    code: 201
    input: [asset_type, market_value]
    output: AssetRecord
    side_effects: ["Applicant.countable_assets recomputed on next read; under both FEDERAL and STATE variants"]

  # --- Application ---
  - method: POST
    path: "/households/:household_id/applications"
    description: "Create an Application in DRAFT"
    roles: [IntakeWorker]
    code: 201
    input: [program, "rule_variant?"]
    output: Application
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/households/:household_id/applications/:application_id"
    description: "Get an Application"
    roles: [IntakeWorker, EligibilityCaseworker, AppealsOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: PATCH
    path: "/households/:household_id/applications/:application_id"
    description: "Update Application.rule_variant while DRAFT; OCC via version"
    roles: [IntakeWorker]
    code: 200
    input: ["rule_variant?", "program?", "version"]
    output: Application
    side_effects: []

  - method: POST
    path: "/households/:household_id/applications/:application_id/submit"
    description: "Submit Application; computes snapshots and moves DRAFT -> UNDER_REVIEW"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Application
    side_effects:
      - "snapshot_magi, snapshot_fpl_percent, snapshot_countable_assets computed per chosen rule_variant"
      - "submitted_at := clock_now"

  - method: POST
    path: "/households/:household_id/applications/:application_id/decide"
    description: "Caseworker decides UNDER_REVIEW Application; APPROVE creates Enrollments, DENY records ineligibility"
    roles: [EligibilityCaseworker]
    code: 200
    input: [decision, "ineligibility_reason?"]
    output: EligibilityDetermination
    side_effects:
      - "Create EligibilityDetermination"
      - "If APPROVE: create one Enrollment per non-EXCLUDED Applicant (coverage_start=clock_now, coverage_end=clock_now+365d) AND recompute Household.active_enrollment_count"
      - "Eligibility comparison uses fpl_percent <= StatePolicy.magi_income_limit_pct (inclusive)"

  - method: POST
    path: "/households/:household_id/applications/:application_id/withdraw"
    description: "Withdraw Application from DRAFT or UNDER_REVIEW"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN"]

  # --- Enrollment ---
  - method: GET
    path: "/enrollments/:enrollment_id"
    description: "Get an Enrollment"
    roles: [IntakeWorker, EligibilityCaseworker, PolicyAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List Enrollments; supports applicant_id and coverage_status filters"
    roles: [IntakeWorker, EligibilityCaseworker, PolicyAdmin]
    code: 200
    input: ["applicant_id?", "coverage_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/:enrollment_id/suspend"
    description: "Suspend an ACTIVE Enrollment"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["coverage_status -> SUSPENDED; active_enrollment_count decremented"]

  - method: POST
    path: "/enrollments/:enrollment_id/reactivate"
    description: "Reactivate a SUSPENDED Enrollment"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["coverage_status -> ACTIVE; active_enrollment_count incremented"]

  # --- Redetermination ---
  - method: GET
    path: "/redeterminations/:redetermination_id"
    description: "Get a Redetermination; returns enrollment_redetermination_premium estimate when PENDING"
    roles: [IntakeWorker, EligibilityCaseworker, PolicyAdmin]
    code: 200
    input: []
    output: Redetermination
    side_effects: []

  - method: POST
    path: "/redeterminations/:redetermination_id/submit"
    description: "Caseworker submits Redetermination decision; RENEW renews the enrollment, TERMINATE ends coverage"
    roles: [EligibilityCaseworker]
    code: 200
    input: [decision, new_snapshot_magi]
    output: Redetermination
    side_effects:
      - "If RENEW: Enrollment.coverage_start := clock_now, coverage_end := +365d, redetermination_due_at := +365d, coverage_status -> ACTIVE"
      - "If TERMINATE: coverage_status -> TERMINATED; Household.active_enrollment_count decremented (cascade hop)"
      - "Applicant.redetermination_count_this_year recomputed"

  - method: POST
    path: "/redeterminations/:redetermination_id/withdraw"
    description: "Withdraw a PENDING Redetermination (e.g. caseworker filed in error)"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Redetermination
    side_effects: ["status -> WITHDRAWN; Applicant.redetermination_count_this_year unchanged (WITHDRAWN excluded from the count)"]

  # --- Appeal ---
  - method: POST
    path: "/appeals"
    description: "File an Appeal against an INELIGIBLE EligibilityDetermination"
    roles: [IntakeWorker]
    code: 201
    input: [determination_id]
    output: Appeal
    side_effects:
      - "filed_at := clock_now, deadline_at := clock_now + 90d"
      - "Associated Application.status -> APPEALED"

  - method: GET
    path: "/appeals/:appeal_id"
    description: "Get an Appeal"
    roles: [IntakeWorker, EligibilityCaseworker, AppealsOfficer, PolicyAdmin]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/:appeal_id/schedule-hearing"
    description: "AppealsOfficer schedules a FairHearing for the Appeal"
    roles: [AppealsOfficer]
    code: 200
    input: [officer_id, scheduled_start, scheduled_end]
    output: FairHearing
    side_effects: ["Appeal.status -> HEARING_SCHEDULED, Appeal.officer_id := officer_id"]

  - method: POST
    path: "/appeals/:appeal_id/grant"
    description: "AppealsOfficer grants the Appeal; cascades to overturn determination and reactivate application review"
    roles: [AppealsOfficer]
    code: 200
    input: ["outcome_reason?"]
    output: Appeal
    side_effects:
      - "EligibilityDetermination.outcome := OVERTURNED (cascade hop 1)"
      - "Application.status := UNDER_REVIEW (cascade hop 2)"
      - "If a subsequent /decide APPROVES, Enrollments created and Household.active_enrollment_count recomputed (cascade hop 3)"

  - method: POST
    path: "/appeals/:appeal_id/uphold"
    description: "AppealsOfficer upholds the original DENIED determination"
    roles: [AppealsOfficer]
    code: 200
    input: ["outcome_reason?"]
    output: Appeal
    side_effects: ["Appeal.status -> UPHELD"]

  - method: POST
    path: "/appeals/:appeal_id/withdraw"
    description: "Withdraw a FILED or HEARING_SCHEDULED Appeal; cancels any SCHEDULED FairHearing"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Appeal
    side_effects: ["Appeal.status -> WITHDRAWN; FairHearing.status -> CANCELLED if SCHEDULED"]

  # --- FairHearing ---
  - method: GET
    path: "/fair-hearings/:fair_hearing_id"
    description: "Get a FairHearing"
    roles: [IntakeWorker, EligibilityCaseworker, AppealsOfficer, PolicyAdmin]
    code: 200
    input: []
    output: FairHearing
    side_effects: []

  - method: POST
    path: "/fair-hearings/:fair_hearing_id/hold"
    description: "Mark FairHearing as HELD; gates Appeal grant/uphold"
    roles: [AppealsOfficer]
    code: 200
    input: []
    output: FairHearing
    side_effects: ["FairHearing.status -> HELD; Appeal.status -> UNDER_REVIEW"]

  # --- Test-driving endpoints (required by §1.5 Testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock to a specified ISO 8601 UTC instant. Required to reach time-gated states (redetermination_due_at, emergency expiry, hearing hold time, appeal deadline)."
    roles: [PolicyAdmin]
    code: 200
    input: [to]
    output: null
    side_effects:
      - "clock_now := to (must be >= current clock_now; backwards advance rejected with ERR_INVALID_REQUEST)"
      - "Any EmergencyDeclaration with expires_at <= clock_now transitions to EXPIRED"
      - "When all covering EmergencyDeclarations expire, Enrollments in CONTINUOUS_COVERAGE revert to ACTIVE (cascade)"

  - method: POST
    path: "/_sweep/redeterminations"
    description: "Run the auto-redetermination sweep: every ACTIVE Enrollment with redetermination_due_at <= clock_now flips to REDETERMINATION_DUE and a PENDING Redetermination is created."
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Bulk transition: ACTIVE -> REDETERMINATION_DUE for matching enrollments"
      - "Create PENDING Redetermination per flipped enrollment"
      - "Household.active_enrollment_count recomputed across all affected households (cascade)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid enum value, or clock-advance time goes backwards"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint per RBAC matrix"

  - id: ERR_FORBIDDEN_SAME_ACTOR
    http: 403
    condition: "Segregation-of-duties: the acting user cannot perform this step because they performed an earlier exclusive step (e.g. AppealsOfficer = original determining caseworker, or caseworker re-deciding their own prior DENY)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-id resource or body FK reference does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a valid state for this transition per §1.2"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version field does not match current version; stale write"

  - id: ERR_HOUSEHOLD_INCOMPLETE
    http: 409
    condition: "Household.head_applicant_id is unset or no non-EXCLUDED Applicant exists at Application submit time, or Household.state_code does not reference a StatePolicy"

  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "Appeal filed > 90 days after EligibilityDetermination.decided_at, or hearing scheduled past Appeal.deadline_at"

  - id: ERR_APPEAL_ALREADY_EXISTS
    http: 409
    condition: "An Appeal already exists for this determination_id"

  - id: ERR_HEARING_CONFLICT
    http: 409
    condition: "FairHearing scheduling (with 30-min buffer) collides with another SCHEDULED FairHearing for the same officer_id"

  - id: ERR_HEARING_NOT_DUE
    http: 409
    condition: "Hearing /hold called before clock_now >= scheduled_start"

  - id: ERR_ENROLLMENT_OVERLAP
    http: 409
    condition: "Enrollment coverage window overlaps an existing non-TERMINATED Enrollment for the same applicant (half-open semantics)"

  - id: ERR_NOT_ELIGIBLE
    http: 422
    condition: "Computed eligibility check fails: fpl_percent > StatePolicy.magi_income_limit_pct OR (asset_test_applies AND countable_assets > limit)"

  - id: ERR_FPL_THRESHOLD_INVALID
    http: 422
    condition: "Effective household size is 0 so fpl_threshold_amount is 0; eligibility cannot be computed"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeWorker
    description: "Front-line caseworker who creates Households, Applicants, IncomeRecords, AssetRecords, Applications, files Appeals, and submits/withdraws applications. Cannot decide eligibility."
    identity: opaque
    exclusive_operations:
      - "POST /households"
      - "POST /households/:id/applicants"
      - "POST /households/:id/applicants/:id/income"
      - "POST /households/:id/applicants/:id/assets"
      - "POST /households/:id/applications"
      - "PATCH /households/:id/applications/:id"
      - "POST /households/:id/applications/:id/submit"
      - "POST /households/:id/applications/:id/withdraw"
      - "POST /appeals"
      - "POST /appeals/:id/withdraw"
      - "POST /redeterminations/:id/withdraw"
      - "PATCH /households/:id"
    shared_operations:
      - "GET /households/:id, GET /households/:id/applicants/:id, GET /households/:id/applications/:id, GET /appeals/:id, GET /fair-hearings/:id, GET /enrollments/*, GET /redeterminations/:id, GET /state-policies/:id, GET /emergency-declarations*"

  - name: EligibilityCaseworker
    description: "Decides eligibility on UNDER_REVIEW Applications and submits Redeterminations. Cannot perform appeals or modify policy. Segregation-of-duties: cannot re-decide an UNDER_REVIEW Application that they themselves previously denied."
    identity: opaque
    exclusive_operations:
      - "POST /households/:id/applications/:id/decide"
      - "POST /redeterminations/:id/submit"
    shared_operations:
      - "GET endpoints listed under IntakeWorker"

  - name: AppealsOfficer
    description: "Schedules and rules on Appeals. Segregation-of-duties: cannot rule on an Appeal whose underlying determination was issued by themselves acting as caseworker (identity tracked via X-User-ID)."
    identity: opaque
    exclusive_operations:
      - "POST /appeals/:id/schedule-hearing"
      - "POST /appeals/:id/grant"
      - "POST /appeals/:id/uphold"
      - "POST /fair-hearings/:id/hold"
    shared_operations:
      - "GET endpoints related to Appeals, FairHearings, EligibilityDeterminations, Applications"

  - name: PolicyAdmin
    description: "Configures StatePolicy, issues EmergencyDeclarations, suspends/reactivates Enrollments, runs system sweeps and clock advances. Cannot adjudicate cases."
    identity: opaque
    exclusive_operations:
      - "POST /state-policies"
      - "POST /emergency-declarations"
      - "POST /enrollments/:id/suspend"
      - "POST /enrollments/:id/reactivate"
      - "POST /_clock/advance"
      - "POST /_sweep/redeterminations"
    shared_operations:
      - "GET endpoints across all resources"
