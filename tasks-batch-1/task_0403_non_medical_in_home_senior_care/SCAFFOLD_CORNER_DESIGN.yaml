              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "P1" }
              as: Scheduler
              captures: { p1: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "P2" }
              as: Scheduler
              captures: { p2: $.data.id }
          trigger:
            - call: "GET /clients/${cl}/care-plans"
              payload: {}
              as: Scheduler
          assert:
            - "response_type == array"
            - "meta.total_count == 2"

      - name: care_task_count_increments_and_decrements
        claim_type: Computed read
        grounds: [entities.CarePlan.fields.task_count, entities.CareTask.fields.status, endpoints]
        distinguishing_aspect: "Adding two tasks then removing one leaves CarePlan.task_count == 1 (REMOVED tasks excluded)."
        test_recipe:
          setup: ["A DRAFT care plan with two ACTIVE tasks; one is then removed."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/tasks"
              payload: { category: "ADL", name: "Bathing" }
              as: Scheduler
              captures: { t1: $.data.id }
            - call: "POST /care-plans/${plan}/tasks"
              payload: { category: "IADL", name: "Grocery", requires_companion_errand: true }
              as: Scheduler
              captures: { t2: $.data.id }
          trigger:
            - call: "DELETE /care-plans/${plan}/tasks/${t2}"
              payload: {}
              as: Scheduler
          assert:
            - "CareTask.${t2}.status == REMOVED"
            - "CarePlan.${plan}.task_count == 1"

  # ===========================================================================
  - section: errors
    instances:
      - name: invoice_not_found_on_get
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVOICE_NOT_FOUND]"]
        distinguishing_aspect: "GET /invoices/{id} with a non-existent UUID -> ERR_INVOICE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /invoices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVOICE_NOT_FOUND"
            - "HTTP status == 404"

      - name: claim_submit_invoice_not_issued
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVOICE_NOT_ISSUED]", state_machines.LtcClaim.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting a claim whose invoice is still DRAFT -> ERR_INVOICE_NOT_ISSUED (409). (Claim cannot be assigned to a DRAFT invoice; a test-only path reaches this via a draft state.) Asserted as the invoice-not-issued guard on submit."
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_covered_percentage_vs_cap
          rationale: "The ISSUED-invoice precondition for claim submission is exercised positively in the §1.8 claim_covered instance; the DRAFT-invoice negative is the same guard inverted and is covered by errors row ERR_INVOICE_NOT_ISSUED there. No separate recipe."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_invoice_version_on_claim_assign
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-assign-stale-invoice]", "errors[ERR_STALE_INVOICE_VERSION]", entities.LtcClaim.fields.expected_invoice_version]
        distinguishing_aspect: |
          Client reads Invoice.version after finalize, then a first claim is assigned+submitted (bumping
          the version); a second claim assignment carrying the now-stale expected_invoice_version is
          rejected with ERR_STALE_INVOICE_VERSION (412).
        test_recipe:
          setup: ["An ISSUED invoice; a first claim assigned then submitted so the invoice version has advanced beyond the originally observed value."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
