            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 40000000, delivery_window_start: "2026-08-31", delivery_expiry_date: "2026-09-30", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c_touch: $.data.id }
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "BEST_EFFORTS", notional_amount_cents: 40000000, delivery_window_start: "2026-08-15", delivery_expiry_date: "2026-09-15", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
