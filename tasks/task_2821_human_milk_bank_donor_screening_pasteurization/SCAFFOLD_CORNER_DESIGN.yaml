      - name: auto_high_risk_questionnaire_creates_a_system_deferral_event
        claim_type: cross_entity
        grounds:
          - state_machines.Donor.APPLICANT_to_TEMPORARILY_DEFERRED
          - calculations.donor_risk_score
          - entities.HealthHistoryQuestionnaire.fields.status
          - entities.DeferralEvent.fields.reason_code
          - entities.Donor.fields.active_deferral_until_date
        distinguishing_aspect: "A questionnaire with 4 flagged medications, travel risk, 4 alcohol units and 15 months postpartum scores base 81, so screening_risk_score caps at 100 (> 85), the questionnaire is stored AUTO_DEFERRED and the write also creates a system DeferralEvent of 90 days that moves the donor to TEMPORARILY_DEFERRED with active_deferral_until_date 2026-11-03 and surveillance_risk_score 96."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is APPLICANT with no questionnaire, no serology and no deferral history."
            - "base = 4*8 + 25 + 0 + 15 + min(30, 3*3) = 81; screening = min(100, 81 + 20 serology penalty) = 100; surveillance = min(100, round_half_up(81 + 15 * 0.5**0)) = 96."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 4, travel_risk_flag: true, tobacco_use: false, alcohol_units_per_week: 4, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/donors/${d1}/health-history", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/donors/${d1}/deferrals", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "first response: data.base_risk_points == 81 and data.screening_risk_score == 100 and data.status == AUTO_DEFERRED"
            - "second response: total_count == 1 and data[0].status == AUTO_DEFERRED"
            - "Donor.${d1}.status == TEMPORARILY_DEFERRED"
            - "Donor.${d1}.screening_risk_score == 100"
            - "Donor.${d1}.surveillance_risk_score == 96"
            - "Donor.${d1}.temporary_deferral_count == 1"
            - "Donor.${d1}.active_deferral_until_date == 2026-11-03"
            - "third response: total_count == 1 and data[0].reason_code == AUTO_HIGH_RISK and data[0].deferral_type == TEMPORARY"
            - "third response: data[0].effective_from == 2026-08-05 and data[0].deferral_days == 90 and data[0].lookback_days == 0"
            - "third response: data[0].recall_scope == NONE and data[0].status == ACTIVE and data[0].recorded_by_user_id == system"

