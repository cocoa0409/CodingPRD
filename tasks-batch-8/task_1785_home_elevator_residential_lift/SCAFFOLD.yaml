# =============================================================================
# PRD Benchmark Seed Tables — Home Elevator & Residential Lift Installation
# =============================================================================

scenario: |
  Home Elevator & Residential Lift Installation (residential elevator dealer): site survey & shaft/pit feasibility, product selection & code/permit requirements, structural modification coordination with contractor, installation scheduling & inspection sign-off, state elevator registration & annual inspection, service contract & emergency entrapment response, modernization of aging units, accessibility funding/grant coordination

domain_name: home-elevator-residential-lift
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # permits, state registration, annual inspections, entrapment SLA
  secondary_archetype: workflow_orchestration # survey -> selection -> permit -> structural -> install -> inspection -> registration
  complexity_layers:
    - cascading_side_effects     # annual FAIL -> cert revoke -> unit out-of-service -> calls cancelled
    - dual_variant_calculation   # provisional vs final: price quote, grant award, entrapment billing
    - optimistic_concurrency     # OCC on Project.version and ServiceContract.version
    - scheduled_actions          # logical clock drives permit expiry, certificate renewal-due/expiry sweeps
  entity_topology: flat                      # peer entities joined by FK references, no nested URL paths
  state_machine_shape: branching             # Project fork/join (structural branch) + cyclic permit corrections + parallel unit dimensions
  relationship_patterns:
    - one_to_many
    - self_referential          # ElevatorUnit.modernized_from_unit_id (modernization lineage)
    - cross_aggregate           # GrantApplication -> Project + GrantProgram; Inspection -> Unit + Project
  role_model: segregation_of_duties          # lead installer may not inspect own project; coordinator/contractor split
  consistency_model: immediate
  entity_count: 16
  state_machine_count: 16
  calculation_count: 11
  endpoint_count: 87
  error_code_count: 48
  role_count: 9

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (16 entities, all common_fields: true)
# Money fields are numbers in dollars, 2 decimal places, round_half_up.
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: owner_user_id, type: string, source: input, description: "Opaque user id of the homeowner who owns this property; ownership checks compare X-User-ID to this field" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: state_code, type: string, source: input, description: "2-letter US state code; drives registration requirement" }
      - { name: has_existing_shaft, type: boolean, source: input, default: false, description: "Whether a hoistway shaft already exists" }

  - name: SiteSurvey
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; surveyed home" }
      - { name: surveyor_technician_id, type: string, source: input, description: "FK -> Technician.id; assigned surveyor (must be ACTIVE)" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned survey date (ISO 8601)" }
      - { name: measured_pit_depth_inches, type: number, source: input, description: "Measured pit depth; recorded at completion" }
      - { name: measured_overhead_clearance_inches, type: number, source: input, description: "Measured overhead clearance; recorded at completion" }
      - { name: shaft_width_inches, type: number, source: input, description: "Measured shaft width" }
      - { name: shaft_depth_inches, type: number, source: input, description: "Measured shaft depth" }
      - { name: floors_served, type: integer, source: input, description: "Number of landings served (>= 2)" }
      - { name: feasibility_verdict, type: enum, source: computed, description: "FEASIBLE | CONDITIONAL | INFEASIBLE; computed at completion by feasibility_verdict calculation against all ACTIVE ProductModels" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique catalog code" }
      - { name: drive_type, type: enum, source: input, description: "HYDRAULIC | TRACTION | PNEUMATIC | PLATFORM_LIFT" }
      - { name: min_pit_depth_inches, type: number, source: input, description: "Minimum pit depth required" }
      - { name: min_overhead_clearance_inches, type: number, source: input, description: "Minimum overhead clearance required" }
      - { name: capacity_lbs, type: integer, source: input, description: "Rated load" }
      - { name: base_price, type: number, source: input, description: "Equipment price in dollars" }
      - { name: install_labor_price, type: number, source: input, description: "Standard installation labor price in dollars" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certification, type: enum, source: input, description: "CET | QEI | CET_AND_QEI; CET required to install/dispatch repair & entrapment, QEI required to inspect" }
      - { name: home_region, type: string, source: input, description: "Dispatch region label" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "General contractor company name" }
      - { name: license_number, type: string, source: input, description: "Contractor license number; unique" }
      - { name: license_state_code, type: string, source: input, description: "License issuing state" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: survey_id, type: string, source: input, description: "FK -> SiteSurvey.id; must be COMPLETED and not INFEASIBLE" }
      - { name: project_type, type: enum, source: input, description: "NEW_INSTALLATION | MODERNIZATION" }
      - { name: modernize_unit_id, type: string, source: input, description: "FK -> ElevatorUnit.id; required when project_type=MODERNIZATION, forbidden otherwise" }
      - { name: product_model_id, type: string, source: input, description: "FK -> ProductModel.id; set via PATCH product selection" }
      - { name: lead_installer_technician_id, type: string, source: input, description: "FK -> Technician.id; installer of record (segregation of duties vs inspector)" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; required when requires_structural is true" }
      - { name: requires_structural, type: boolean, source: computed, description: "true when selected model does not fit survey measurements within zero shortfall but within MAX_CORRECTABLE_INCHES" }
      - { name: structural_estimate, type: number, source: computed, description: "Estimated structural modification cost from installation_price_quote" }
      - { name: contract_price, type: number, source: computed, description: "Provisional quoted price (product + labor + structural estimate + floor fees)" }
      - { name: approved_change_order_total, type: number, source: computed, description: "Sum of effective_amount over APPROVED change orders, chronological markup rule applied" }
      - { name: structural_adjustment, type: number, source: computed, description: "Reconciliation of actual vs estimated structural cost at work-order verification" }
      - { name: final_invoice, type: number, source: computed, description: "Final settlement amount computed at close (null until CLOSED)" }
      - { name: disbursed_grants, type: number, source: computed, description: "Total grant dollars disbursed to this project" }
      - { name: homeowner_balance, type: number, source: computed, description: "final_invoice - disbursed_grants at close; before close: contract_price + approved_change_order_total - disbursed_grants" }
      - { name: funding_posture, type: enum, source: computed, description: "UNFUNDED | PARTIALLY_FUNDED | FULLY_FUNDED; from approved/disbursed grant awards vs current contract value" }
      - { name: install_start_date, type: datetime, source: system, description: "Scheduled install window start (set by schedule-installation)" }
      - { name: install_end_date, type: datetime, source: system, description: "Scheduled install window end" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | PERMIT_IN_PROGRESS | PERMIT_APPROVED | STRUCTURAL_IN_PROGRESS | READY_FOR_INSTALL | INSTALL_SCHEDULED | INSTALL_COMPLETE | AWAITING_REGISTRATION | REGISTERED | CLOSED | CANCELLED" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: ahj_name, type: string, source: input, description: "Authority having jurisdiction (permit office)" }
      - { name: fee, type: number, source: computed, description: "Permit fee from permit_fee calculation (per-component rounding, pinned order)" }
      - { name: revision_count, type: integer, source: system, description: "Number of CORRECTIONS_REQUIRED cycles; starts 0" }
      - { name: approved_date, type: datetime, source: system, description: "Set at approval" }
      - { name: valid_through, type: datetime, source: system, description: "approved_date + PERMIT_VALID_DAYS (180)" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | CORRECTIONS_REQUIRED | APPROVED | DENIED | EXPIRED | CANCELLED" }

  - name: StructuralWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; must match project.contractor_id" }
      - { name: scope_description, type: string, source: input, description: "Scope of structural modification" }
      - { name: scheduled_start_date, type: datetime, source: input, description: "Work window start (half-open interval [start, end))" }
      - { name: scheduled_end_date, type: datetime, source: input, description: "Work window end; must be > start" }
      - { name: estimated_cost, type: number, source: input, description: "Contractor estimate in dollars" }
      - { name: actual_cost, type: number, source: system, description: "Actual cost recorded at complete-work" }
      - { name: rejection_reason, type: string, source: system, description: "Verification rejection reason (rework loop)" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | WORK_COMPLETE | VERIFIED | CANCELLED" }

  - name: ElevatorUnit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; copied from installing project" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project that installed this unit" }
      - { name: product_model_id, type: string, source: system, description: "FK -> ProductModel.id; copied from project" }
      - { name: modernized_from_unit_id, type: string, source: system, description: "FK -> ElevatorUnit.id; set on the new unit created by a MODERNIZATION project (self-referential lineage)" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number; unique across all units" }
      - { name: install_date, type: datetime, source: system, description: "Logical clock timestamp at complete-installation" }
      - { name: equipment_status, type: enum, source: system, description: "INSTALLED | IN_SERVICE | OUT_OF_SERVICE | UNDER_MODERNIZATION | DECOMMISSIONED (parallel dimension 1)" }
      - { name: registration_status, type: enum, source: system, description: "UNREGISTERED | REGISTERED | LAPSED | SUSPENDED (parallel dimension 2)" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> ElevatorUnit.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; required for ACCEPTANCE and MODERNIZATION_ACCEPTANCE, null for ANNUAL/REINSPECTION" }
      - { name: inspector_technician_id, type: string, source: input, description: "FK -> Technician.id; must hold QEI and differ from project lead installer" }
      - { name: inspection_type, type: enum, source: input, description: "ACCEPTANCE | ANNUAL | REINSPECTION | MODERNIZATION_ACCEPTANCE" }
      - { name: scheduled_start, type: datetime, source: input, description: "Inspection window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Inspection window end; must be > start" }
      - { name: deficiency_codes, type: array, source: system, description: "Recorded deficiency codes (empty on PASS)" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock timestamp when result recorded" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | CANCELLED" }

  - name: RegistrationCertificate
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> ElevatorUnit.id" }
      - { name: certificate_number, type: string, source: system, description: "State certificate number (system-minted at issuance)" }
      - { name: issued_date, type: datetime, source: system, description: "Issuance timestamp" }
      - { name: expiration_date, type: datetime, source: system, description: "issued_date + 1 year; extended +1 year per renewal" }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals; starts 0" }
      - { name: last_renewal_fee, type: number, source: system, description: "Fee charged on most recent renewal" }
      - { name: status, type: enum, source: system, description: "PENDING_ISSUANCE | ACTIVE | RENEWAL_DUE | EXPIRED | REVOKED | SUPERSEDED" }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> ElevatorUnit.id" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM" }
      - { name: annual_fee, type: number, source: computed, description: "BASIC 600.00 | STANDARD 1200.00 | PREMIUM 2400.00" }
      - { name: included_visits, type: integer, source: computed, description: "Included maintenance visits per contract year: BASIC 1 | STANDARD 2 | PREMIUM 4" }
      - { name: visits_consumed, type: integer, source: computed, description: "Visits consumed in current contract year (dispatch of MAINTENANCE_VISIT +1, cancel before ON_SITE -1)" }
      - { name: entrapment_sla_minutes, type: integer, source: computed, description: "BASIC 240 | STANDARD 120 | PREMIUM 60" }
      - { name: contract_year_start, type: datetime, source: input, description: "Contract year anchor date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: ServiceCall
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> ElevatorUnit.id" }
      - { name: contract_id, type: string, source: system, description: "FK -> ServiceContract.id; auto-attached ACTIVE contract at creation, null for ad-hoc" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; set at dispatch" }
      - { name: call_type, type: enum, source: input, description: "MAINTENANCE_VISIT | REPAIR | ENTRAPMENT" }
      - { name: description, type: string, source: input, description: "Caller description (optional)" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: arrived_at, type: datetime, source: system, description: "Set at arrive" }
      - { name: resolved_at, type: datetime, source: system, description: "Set at resolve" }
      - { name: sla_deadline, type: datetime, source: computed, description: "ENTRAPMENT only: reported_at + contract sla (or 240 min ad-hoc); null otherwise" }
      - { name: sla_breached, type: boolean, source: computed, description: "ENTRAPMENT: arrived_at - reported_at > sla minutes (strictly greater; equality is compliant)" }
      - { name: provisional_estimate, type: number, source: computed, description: "Dispatch-time estimate: PREMIUM 0.00 | STANDARD 150.00 | BASIC 300.00 | ad-hoc 450.00" }
      - { name: final_billable, type: number, source: computed, description: "Final charge computed at resolve (half-hour rounding, after-hours multiplier, tier discount, SLA credit)" }
      - { name: status, type: enum, source: system, description: "OPEN | DISPATCHED | ON_SITE | RESOLVED | CANCELLED" }

  - name: GrantProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Program name" }
      - { name: funder_name, type: string, source: input, description: "Funding organization" }
      - { name: max_award, type: number, source: input, description: "Per-application award cap in dollars" }
      - { name: income_cap, type: number, source: input, description: "Household income eligibility cap in dollars (income <= cap is eligible)" }
      - { name: coverage_percent, type: number, source: input, description: "Fraction of current contract value covered (e.g. 0.40)" }
      - { name: total_pool, type: number, source: input, description: "Total funding pool in dollars" }
      - { name: remaining_pool, type: number, source: computed, description: "total_pool minus sum of final_award over APPROVED/DISBURSED applications (invariant)" }
      - { name: application_open_date, type: datetime, source: input, description: "Application window open (inclusive)" }
      - { name: application_close_date, type: datetime, source: input, description: "Application window close (inclusive)" }
      - { name: eligible_project_types, type: array, source: input, description: "Subset of {NEW_INSTALLATION, MODERNIZATION}" }
      - { name: status, type: enum, source: system, description: "OPEN | PAUSED | EXHAUSTED | CLOSED; EXHAUSTED auto when remaining_pool reaches 0" }

  - name: GrantApplication
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: program_id, type: string, source: input, description: "FK -> GrantProgram.id" }
      - { name: household_income, type: number, source: input, description: "Declared household income in dollars" }
      - { name: verified_income, type: number, source: system, description: "Income verified at approval" }
      - { name: provisional_award, type: number, source: computed, description: "Estimate at submission: min(max_award, coverage_percent x current contract value)" }
      - { name: final_award, type: number, source: computed, description: "Approved amount: min(coverage of current contract value, max_award, remaining_pool); null until APPROVED" }
      - { name: disbursed, type: number, source: computed, description: "Amount actually disbursed at project close (may be < final_award under the waterfall)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock timestamp at submission" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock timestamp at approval; drives waterfall ordering" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | DISBURSED | WITHDRAWN | CLAWED_BACK" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: description, type: string, source: input, description: "Change description" }
      - { name: amount, type: number, source: input, description: "Signed change amount in dollars (non-zero)" }
      - { name: effective_amount, type: number, source: computed, description: "Amount after markup rule: chronologically first APPROVED change order per project has no markup; subsequent ones get +10% (round_half_up 2dp)" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock timestamp at approval; drives markup ordering" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED" }

# =============================================================================
# 1.2 State Machine Table (16 machines; ElevatorUnit has two parallel dimensions)
# =============================================================================
state_machines:
  - entity: SiteSurvey
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/surveys/{surveyId}/complete"
        actor: Surveyor
        preconditions:
          - "X-User-ID == survey.surveyor_technician_id (ERR_NOT_ASSIGNED_SURVEYOR)"
        side_effects:
          - "Compute feasibility_verdict over all ACTIVE ProductModels (feasibility_verdict calculation)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/surveys/{surveyId}/cancel"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []

  - entity: ProductModel
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/product-models/{productModelId}/discontinue"
        actor: DealerAdmin
        preconditions: []
        side_effects: []

  - entity: Technician
    field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/technicians/{technicianId}/deactivate"
        actor: DealerAdmin
        preconditions:
          - "No ServiceCall with technician_id == this technician in OPEN/DISPATCHED/ON_SITE (ERR_TECHNICIAN_HAS_OPEN_CALLS)"
          - "No Inspection with inspector_technician_id == this technician in SCHEDULED (ERR_TECHNICIAN_HAS_OPEN_INSPECTIONS)"
        side_effects: []

  - entity: Contractor
    field: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/contractors/{contractorId}/suspend"
        actor: DealerAdmin
        preconditions: []
        side_effects: []

  - entity: Project
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "PATCH /api/projects/{projectId} (first valid product_model_id selection)"
        actor: ProjectCoordinator
        preconditions:
          - "Survey (project.survey_id) is COMPLETED (ERR_SURVEY_NOT_COMPLETED)"
          - "Survey verdict != INFEASIBLE (checked at project creation; ERR_SURVEY_INFEASIBLE)"
          - "ProductModel ACTIVE (ERR_MODEL_DISCONTINUED) and fits survey within MAX_CORRECTABLE_INCHES (ERR_MODEL_DOES_NOT_FIT)"
          - "If requires_structural: contractor_id present (ERR_CONTRACTOR_REQUIRED) and Contractor ACTIVE (ERR_CONTRACTOR_NOT_ACTIVE)"
          - "lead_installer_technician_id present, Technician ACTIVE and holds CET (ERR_TECHNICIAN_NOT_CERTIFIED)"
        side_effects:
          - "Compute requires_structural, structural_estimate, contract_price (installation_price_quote calculation)"
          - "Increments Project.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "PATCH /api/projects/{projectId} (re-selection supersedes prior selection; OCC-guarded)"
        actor: ProjectCoordinator
        preconditions:
          - "Same as DRAFT -> QUOTED; recompute all pricing fields"
        side_effects:
          - "Recompute requires_structural, structural_estimate, contract_price"
          - "Increments Project.version by 1"
      - from: QUOTED
        to: PERMIT_IN_PROGRESS
        trigger: "POST /api/permits (permit creation)"
        actor: ProjectCoordinator
        preconditions:
          - "Project in {QUOTED, PERMIT_APPROVED, READY_FOR_INSTALL} (re-permit after expiry allowed); PERMIT_APPROVED/READY_FOR_INSTALL projects stay in place, only QUOTED transitions"
          - "ProductModel still ACTIVE at permit creation (ERR_MODEL_DISCONTINUED)"
          - "No non-terminal PermitApplication for this project (ERR_OPEN_PERMIT_EXISTS)"
        side_effects: []
      - from: PERMIT_IN_PROGRESS
        to: PERMIT_APPROVED
        trigger: "POST /api/permits/{permitId}/approve (side effect)"
        actor: Regulator
        preconditions:
          - "Project in PERMIT_IN_PROGRESS (ERR_PROJECT_STATE_FORBIDS)"
        side_effects:
          - "If requires_structural == false: auto-advance to READY_FOR_INSTALL"
      - from: PERMIT_APPROVED
        to: STRUCTURAL_IN_PROGRESS
        trigger: "POST /api/work-orders/{workOrderId}/release (side effect)"
        actor: ProjectCoordinator
        preconditions:
          - "requires_structural == true"
        side_effects: []
      - from: STRUCTURAL_IN_PROGRESS
        to: READY_FOR_INSTALL
        trigger: "POST /api/work-orders/{workOrderId}/verify (side effect)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects:
          - "Compute structural_adjustment = reconciliation(actual_cost, structural_estimate)"
      - from: PERMIT_IN_PROGRESS
        to: QUOTED
        trigger: "POST /api/permits/{permitId}/deny (side effect; revision loop)"
        actor: Regulator
        preconditions: []
        side_effects: []
      - from: READY_FOR_INSTALL
        to: INSTALL_SCHEDULED
        trigger: "POST /api/projects/{projectId}/schedule-installation"
        actor: ProjectCoordinator
        preconditions:
          - "install_end_date > install_start_date (ERR_INVALID_DATE_RANGE)"
          - "Current permit APPROVED and logical clock <= permit.valid_through (ERR_PERMIT_EXPIRED_FOR_INSTALL)"
        side_effects: []
      - from: INSTALL_SCHEDULED
        to: INSTALL_COMPLETE
        trigger: "POST /api/projects/{projectId}/complete-installation"
        actor: Installer
        preconditions:
          - "X-User-ID == project.lead_installer_technician_id (ERR_NOT_LEAD_INSTALLER)"
          - "Logical clock >= install_start_date (ERR_INSTALL_WINDOW_NOT_STARTED)"
          - "serial_number unique across all ElevatorUnits (ERR_SERIAL_NUMBER_TAKEN)"
        side_effects:
          - "Create ElevatorUnit: property_id/product_model_id copied from project; serial_number from input; install_date = clock; equipment_status INSTALLED; registration_status UNREGISTERED; for MODERNIZATION modernized_from_unit_id = project.modernize_unit_id"
      - from: INSTALL_COMPLETE
        to: AWAITING_REGISTRATION
        trigger: "POST /api/inspections/{inspectionId}/record-result PASSED for ACCEPTANCE or MODERNIZATION_ACCEPTANCE (side effect)"
        actor: Inspector
        preconditions: []
        side_effects:
          - "For MODERNIZATION: prior unit (modernize_unit_id) UNDER_MODERNIZATION -> DECOMMISSIONED"
      - from: AWAITING_REGISTRATION
        to: REGISTERED
        trigger: "POST /api/registration-certificates/{certificateId}/issue (side effect)"
        actor: Regulator
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: CLOSED
        trigger: "POST /api/projects/{projectId}/close"
        actor: ProjectCoordinator
        preconditions: []
        side_effects:
          - "Compute final_invoice (final_invoice_settlement calculation: contract_price + approved change orders with chronological markup + structural_adjustment)"
          - "Execute grant_disbursement_waterfall across APPROVED applications (approved_at ASC, tie created_at ASC); each -> DISBURSED with disbursed amount; update disbursed_grants and homeowner_balance"
      - from: ANY_NON_TERMINAL
        to: CANCELLED
        trigger: "POST /api/projects/{projectId}/cancel"
        actor: ProjectCoordinator
        preconditions:
          - "status not in {CLOSED, CANCELLED, REGISTERED} (ERR_PROJECT_STATE_FORBIDS); a REGISTERED project cannot be cancelled"
        side_effects:
          - "Cascade: non-terminal PermitApplications -> CANCELLED (hop 1)"
          - "Cascade: non-terminal StructuralWorkOrders -> CANCELLED (hop 1)"
          - "Cascade: SUBMITTED GrantApplications -> WITHDRAWN (hop 1); APPROVED -> WITHDRAWN with pool credit to program (hop 2); pool credit on an EXHAUSTED program with remaining_pool > 0 reopens it to OPEN (hop 3); DISBURSED applications cannot exist here because cancel is blocked once the project is REGISTERED and disbursement happens at close"
          - "Cascade: unit created by this project (if any) INSTALLED -> DECOMMISSIONED"
          - "Cascade: SCHEDULED Inspections referencing this project -> CANCELLED"
          - "If a MODERNIZATION project is cancelled before acceptance: modernize_unit_id unit UNDER_MODERNIZATION -> IN_SERVICE"

  - entity: PermitApplication
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED, EXPIRED, CANCELLED]
    transitions:
      - from: UNDER_REVIEW
        to: CORRECTIONS_REQUIRED
        trigger: "POST /api/permits/{permitId}/request-corrections"
        actor: Regulator
        preconditions: []
        side_effects:
          - "revision_count += 1"
      - from: CORRECTIONS_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /api/permits/{permitId}/resubmit (revision cycle)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/permits/{permitId}/approve"
        actor: Regulator
        preconditions:
          - "Project in PERMIT_IN_PROGRESS (ERR_PROJECT_STATE_FORBIDS)"
        side_effects:
          - "approved_date = clock; valid_through = approved_date + 180 days"
          - "Project PERMIT_IN_PROGRESS -> PERMIT_APPROVED (then auto READY_FOR_INSTALL when requires_structural == false)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/permits/{permitId}/deny"
        actor: Regulator
        preconditions: []
        side_effects:
          - "Project PERMIT_IN_PROGRESS -> QUOTED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep: clock > valid_through and project install not complete)"
        actor: system
        preconditions: []
        side_effects:
          - "Project state unchanged; install scheduling blocked until a new permit is APPROVED (ERR_PERMIT_EXPIRED_FOR_INSTALL)"
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "system (project cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CORRECTIONS_REQUIRED
        to: CANCELLED
        trigger: "system (project cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: StructuralWorkOrder
    field: status
    initial_state: DRAFT
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /api/work-orders/{workOrderId}/release"
        actor: ProjectCoordinator
        preconditions:
          - "Contractor ACTIVE (ERR_CONTRACTOR_NOT_ACTIVE)"
          - "No pure half-open window overlap with this contractor's RELEASED/WORK_COMPLETE work orders: conflict iff new.start < existing.end AND existing.start < new.end (ERR_CONTRACTOR_WINDOW_OVERLAP); adjacency (end == start) is allowed"
        side_effects:
          - "Project PERMIT_APPROVED -> STRUCTURAL_IN_PROGRESS"
      - from: RELEASED
        to: WORK_COMPLETE
        trigger: "POST /api/work-orders/{workOrderId}/complete-work"
        actor: Contractor
        preconditions:
          - "X-User-ID == work_order.contractor_id (ERR_NOT_ASSIGNED_CONTRACTOR)"
        side_effects:
          - "actual_cost = input"
      - from: WORK_COMPLETE
        to: VERIFIED
        trigger: "POST /api/work-orders/{workOrderId}/verify"
        actor: ProjectCoordinator
        preconditions: []
        side_effects:
          - "Project STRUCTURAL_IN_PROGRESS -> READY_FOR_INSTALL"
          - "Project.structural_adjustment computed (over/under reconciliation)"
      - from: WORK_COMPLETE
        to: RELEASED
        trigger: "POST /api/work-orders/{workOrderId}/reject-verification (rework loop)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects:
          - "rejection_reason = input; actual_cost cleared (null)"
      - from: DRAFT
        to: CANCELLED
        trigger: "system (project cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: CANCELLED
        trigger: "system (project cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ElevatorUnit
    field: equipment_status
    initial_state: INSTALLED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: INSTALLED
        to: IN_SERVICE
        trigger: "POST /api/registration-certificates/{certificateId}/issue (side effect)"
        actor: Regulator
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (certificate REVOKED on failed ANNUAL inspection, or certificate EXPIRED on clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "OPEN/DISPATCHED ServiceCalls for this unit -> CANCELLED (consumed visits restored)"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /api/registration-certificates/{certificateId}/renew (reinstatement; side effect)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: UNDER_MODERNIZATION
        trigger: "POST /api/projects (MODERNIZATION project creation with modernize_unit_id; side effect)"
        actor: ProjectCoordinator
        preconditions:
          - "Unit equipment_status in {IN_SERVICE, OUT_OF_SERVICE} (ERR_UNIT_STATE_FORBIDS)"
          - "No other non-terminal Project references this unit via modernize_unit_id (ERR_UNIT_PROJECT_IN_PROGRESS)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: UNDER_MODERNIZATION
        trigger: "POST /api/projects (MODERNIZATION; side effect)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []
      - from: UNDER_MODERNIZATION
        to: DECOMMISSIONED
        trigger: "system (MODERNIZATION_ACCEPTANCE inspection PASSED on replacement unit)"
        actor: system
        preconditions: []
        side_effects:
          - "Replacement unit remains INSTALLED; property non-DECOMMISSIONED unit count unchanged across the pair"
          - "This unit's non-SUPERSEDED RegistrationCertificates -> SUPERSEDED"
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "system (installing project cancelled before registration)"
        actor: system
        preconditions: []
        side_effects:
          - "This unit's non-SUPERSEDED RegistrationCertificates -> SUPERSEDED"
      - from: UNDER_MODERNIZATION
        to: IN_SERVICE
        trigger: "system (modernization project cancelled before acceptance)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ElevatorUnit
    field: registration_status
    initial_state: UNREGISTERED
    terminal_states: []
    transitions:
      - from: UNREGISTERED
        to: REGISTERED
        trigger: "POST /api/registration-certificates/{certificateId}/issue (side effect)"
        actor: Regulator
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: LAPSED
        trigger: "system (clock sweep: certificate EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: REGISTERED
        trigger: "POST /api/registration-certificates/{certificateId}/renew within 90-day grace (side effect)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: SUSPENDED
        trigger: "system (ANNUAL inspection FAILED -> certificate REVOKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /api/registration-certificates/{certificateId}/renew after REINSPECTION PASSED (side effect)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []

  - entity: Inspection
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /api/inspections/{inspectionId}/record-result"
        actor: Inspector
        preconditions:
          - "X-User-ID == inspection.inspector_technician_id (ERR_NOT_ASSIGNED_INSPECTOR)"
          - "Logical clock >= scheduled_start (ERR_INSPECTION_NOT_STARTED)"
        side_effects:
          - "ACCEPTANCE / MODERNIZATION_ACCEPTANCE: project INSTALL_COMPLETE -> AWAITING_REGISTRATION"
          - "MODERNIZATION_ACCEPTANCE: old unit UNDER_MODERNIZATION -> DECOMMISSIONED"
          - "ANNUAL: enables certificate renewal"
          - "REINSPECTION: enables certificate reinstatement from REVOKED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/inspections/{inspectionId}/record-result"
        actor: Inspector
        preconditions:
          - "X-User-ID == inspection.inspector_technician_id (ERR_NOT_ASSIGNED_INSPECTOR)"
          - "Logical clock >= scheduled_start (ERR_INSPECTION_NOT_STARTED)"
        side_effects:
          - "deficiency_codes recorded (required non-empty on FAILED: ERR_DEFICIENCY_CODES_REQUIRED)"
          - "ANNUAL failure cascade (hop 1): RegistrationCertificate ACTIVE/RENEWAL_DUE -> REVOKED"
          - "hop 2: unit registration_status REGISTERED -> SUSPENDED"
          - "hop 3: unit equipment_status IN_SERVICE -> OUT_OF_SERVICE"
          - "hop 4: unit's OPEN/DISPATCHED ServiceCalls -> CANCELLED (consumed visits restored)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/inspections/{inspectionId}/cancel or system (project cancel cascade)"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []

  - entity: RegistrationCertificate
    field: status
    initial_state: PENDING_ISSUANCE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING_ISSUANCE
        to: ACTIVE
        trigger: "POST /api/registration-certificates/{certificateId}/issue"
        actor: Regulator
        preconditions: []
        side_effects:
          - "certificate_number minted; issued_date = clock; expiration_date = issued_date + 1 year"
          - "Unit registration_status UNREGISTERED -> REGISTERED; equipment_status INSTALLED -> IN_SERVICE"
          - "Project AWAITING_REGISTRATION -> REGISTERED"
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system (clock sweep: clock >= expiration_date - 30 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: clock > expiration_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit registration_status REGISTERED -> LAPSED; equipment_status IN_SERVICE -> OUT_OF_SERVICE (service calls cascade-cancelled)"
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /api/registration-certificates/{certificateId}/renew"
        actor: ProjectCoordinator
        preconditions:
          - "Latest ANNUAL inspection on unit PASSED (ERR_ANNUAL_INSPECTION_REQUIRED)"
        side_effects:
          - "expiration_date += 1 year; renewal_count += 1; last_renewal_fee = base renewal fee (registration_renewal_fee calculation)"
      - from: RENEWAL_DUE
        to: EXPIRED
        trigger: "system (clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> EXPIRED"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /api/registration-certificates/{certificateId}/renew (late renewal within 90-day grace)"
        actor: ProjectCoordinator
        preconditions:
          - "clock <= expiration_date + 90 days (ERR_RENEWAL_GRACE_EXPIRED)"
          - "Latest ANNUAL inspection on unit PASSED (ERR_ANNUAL_INSPECTION_REQUIRED)"
        side_effects:
          - "expiration_date = clock + 1 year; renewal_count += 1; last_renewal_fee includes late tier"
          - "Unit registration_status LAPSED -> REGISTERED; equipment_status OUT_OF_SERVICE -> IN_SERVICE"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (ANNUAL inspection FAILED; cascade hop 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: REVOKED
        trigger: "system (ANNUAL inspection FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_ISSUANCE
        to: SUPERSEDED
        trigger: "system (unit DECOMMISSIONED: modernization acceptance of replacement, or install-project cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (unit DECOMMISSIONED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: SUPERSEDED
        trigger: "system (unit DECOMMISSIONED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system (unit DECOMMISSIONED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVOKED
        to: SUPERSEDED
        trigger: "system (unit DECOMMISSIONED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /api/registration-certificates/{certificateId}/renew (reinstatement)"
        actor: ProjectCoordinator
        preconditions:
          - "Latest REINSPECTION on unit PASSED (ERR_REINSPECTION_REQUIRED)"
        side_effects:
          - "expiration_date = clock + 1 year; renewal_count += 1; last_renewal_fee at base tier"
          - "Unit registration_status SUSPENDED -> REGISTERED; equipment_status OUT_OF_SERVICE -> IN_SERVICE"

  - entity: ServiceContract
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/service-contracts/{contractId}/activate"
        actor: ProjectCoordinator
        preconditions:
          - "Unit equipment_status == IN_SERVICE (ERR_UNIT_NOT_IN_SERVICE)"
          - "No other ACTIVE/SUSPENDED contract on this unit (ERR_CONTRACT_ALREADY_EXISTS)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/service-contracts/{contractId}/suspend"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/service-contracts/{contractId}/resume"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/service-contracts/{contractId}/terminate"
        actor: ProjectCoordinator
        preconditions: []
        side_effects:
          - "Attached OPEN/DISPATCHED ServiceCalls are detached (contract_id -> null; become ad-hoc)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/service-contracts/{contractId}/terminate"
        actor: ProjectCoordinator
        preconditions: []
        side_effects: []

  - entity: ServiceCall
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /api/service-calls/{serviceCallId}/dispatch"
        actor: ProjectCoordinator
        preconditions:
          - "Technician ACTIVE (ERR_TECHNICIAN_NOT_ACTIVE)"
          - "REPAIR/ENTRAPMENT require CET or CET_AND_QEI certification (ERR_TECHNICIAN_NOT_CERTIFIED)"
          - "If attached contract and call_type == MAINTENANCE_VISIT: visits_consumed < included_visits (ERR_NO_VISITS_REMAINING)"
        side_effects:
          - "technician_id set; if attached contract and MAINTENANCE_VISIT: visits_consumed += 1"
          - "ENTRAPMENT: sla_deadline = reported_at + (contract ? contract.entrapment_sla_minutes : 240) minutes"
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /api/service-calls/{serviceCallId}/arrive"
        actor: Installer
        preconditions:
          - "X-User-ID == service_call.technician_id (ERR_NOT_ASSIGNED_TECHNICIAN)"
        side_effects:
          - "arrived_at = clock; ENTRAPMENT: sla_breached = (arrived_at - reported_at) > sla minutes (strictly greater)"
      - from: ON_SITE
        to: RESOLVED
        trigger: "POST /api/service-calls/{serviceCallId}/resolve"
        actor: Installer
        preconditions:
          - "X-User-ID == service_call.technician_id (ERR_NOT_ASSIGNED_TECHNICIAN)"
        side_effects:
          - "resolved_at = clock (must be >= arrived_at)"
          - "Compute final_billable (entrapment_billing calculation: half-hour rounding, after-hours 1.5x, tier discount, SLA breach credit 100.00 floor 0)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/service-calls/{serviceCallId}/cancel"
        actor: Homeowner
        preconditions:
          - "Homeowner caller must own the property of the unit (ERR_NOT_PROPERTY_OWNER)"
        side_effects:
          - "If a visit was consumed at dispatch: visits_consumed -= 1 (compensation)"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /api/service-calls/{serviceCallId}/cancel or system (unit OUT_OF_SERVICE cascade / project cancel)"
        actor: "Homeowner | ProjectCoordinator | system"
        preconditions: []
        side_effects:
          - "If a visit was consumed at dispatch: visits_consumed -= 1 (compensation)"

  - entity: GrantProgram
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PAUSED
        trigger: "POST /api/grant-programs/{programId}/pause"
        actor: DealerAdmin
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: OPEN
        trigger: "POST /api/grant-programs/{programId}/resume"
        actor: DealerAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (remaining_pool reaches exactly 0 on an approval debit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (pool credited back above 0 by withdrawal/clawback)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/grant-programs/{programId}/close"
        actor: DealerAdmin
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: CLOSED
        trigger: "POST /api/grant-programs/{programId}/close"
        actor: DealerAdmin
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /api/grant-programs/{programId}/close"
        actor: DealerAdmin
        preconditions: []
        side_effects: []

  - entity: GrantApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, CLAWED_BACK]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/grant-applications/{applicationId}/approve"
        actor: GrantOfficer
        preconditions:
          - "Program status in {OPEN, EXHAUSTED} (ERR_PROGRAM_NOT_OPEN); submission still requires OPEN"
          - "verified_income <= program.income_cap (ERR_VERIFIED_INCOME_INELIGIBLE)"
          - "Program remaining_pool > 0 (ERR_GRANT_POOL_EXHAUSTED)"
        side_effects:
          - "verified_income recorded; approved_at = clock"
          - "final_award = min(coverage_percent x current contract value, max_award, remaining_pool) (grant_final_award calculation)"
          - "Program remaining_pool -= final_award (hop 2); if remaining_pool == 0: program OPEN -> EXHAUSTED (hop 3)"
          - "Project funding_posture recomputed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/grant-applications/{applicationId}/deny"
        actor: GrantOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/grant-applications/{applicationId}/withdraw"
        actor: Homeowner
        preconditions:
          - "Caller owns the property of the project (ERR_NOT_PROPERTY_OWNER)"
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /api/grant-applications/{applicationId}/withdraw (compensating action)"
        actor: Homeowner
        preconditions:
          - "Caller owns the property of the project (ERR_NOT_PROPERTY_OWNER)"
        side_effects:
          - "Program remaining_pool += final_award (pool restored; EXHAUSTED -> OPEN if credited above 0)"
          - "Project funding_posture recomputed"
      - from: APPROVED
        to: DISBURSED
        trigger: "system (project close waterfall; grant_disbursement_waterfall calculation)"
        actor: system
        preconditions: []
        side_effects:
          - "disbursed = min(final_award, remaining homeowner balance at this application's turn)"
      - from: DISBURSED
        to: CLAWED_BACK
        trigger: "POST /api/grant-applications/{applicationId}/withdraw after disbursement, or system (project cancel)"
        actor: "Homeowner | system"
        preconditions:
          - "Homeowner caller must own the property (ERR_NOT_PROPERTY_OWNER)"
        side_effects:
          - "Program remaining_pool += disbursed; Project.disbursed_grants -= disbursed; homeowner_balance recomputed"

  - entity: ChangeOrder
    field: status
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/change-orders/{changeOrderId}/approve"
        actor: Homeowner
        preconditions:
          - "Caller owns the property of the project (ERR_NOT_PROPERTY_OWNER)"
          - "Project not CLOSED/CANCELLED (ERR_PROJECT_STATE_FORBIDS)"
        side_effects:
          - "approved_at = clock; effective_amount computed by chronological markup rule (first APPROVED change order per project: no markup; later ones: +10%, round_half_up 2dp; order by approved_at ASC, tie created_at ASC)"
          - "Project.approved_change_order_total, homeowner_balance, funding_posture recomputed"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/change-orders/{changeOrderId}/reject"
        actor: Homeowner
        preconditions:
          - "Caller owns the property of the project (ERR_NOT_PROPERTY_OWNER)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; true races only)
# =============================================================================
concurrency_rules:
  - rule_id: project-scope-update-stale-version
    parent_entity: Project
    write_endpoint: "PATCH /api/projects/{projectId}"
    occ_field: expected_project_version
    description: |
      A scope/product-selection PATCH against a Project whose version has advanced
      since the client last observed it is rejected. Re-selection legitimately
      supersedes the prior selection while the project is in DRAFT/QUOTED, so a
      writer holding a stale view must be refused rather than silently overwrite.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: contract-tier-change-stale-version
    parent_entity: ServiceContract
    write_endpoint: "PATCH /api/service-contracts/{contractId}"
    occ_field: expected_contract_version
    description: |
      A tier-change PATCH against a ServiceContract whose version has advanced
      since the client last observed it is rejected. Tier changes on a DRAFT
      contract legitimately supersede one another, so the stale writer is refused.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table (11 calculations)
# =============================================================================
calculations:
  - name: feasibility_verdict
    trigger: "SiteSurvey completion (POST /api/surveys/{surveyId}/complete)"
    algorithm: threshold
    formula: |
      Evaluate the survey against every ProductModel with status == ACTIVE:
        pit_shortfall(m)    = max(0, m.min_pit_depth_inches - measured_pit_depth_inches)
        overhead_shortfall(m) = max(0, m.min_overhead_clearance_inches - measured_overhead_clearance_inches)
        fits_directly(m)    = pit_shortfall(m) == 0 AND overhead_shortfall(m) == 0
        fits_correctable(m) = pit_shortfall(m) <= MAX_CORRECTABLE_INCHES AND overhead_shortfall(m) <= MAX_CORRECTABLE_INCHES
      verdict = FEASIBLE    if any ACTIVE model fits_directly
              = CONDITIONAL if none fits_directly but any fits_correctable
              = INFEASIBLE  otherwise (or when no ACTIVE models exist)
    input_set: "All ProductModels with status == ACTIVE at completion time"
    constants:
      MAX_CORRECTABLE_INCHES: 12
    precision: "integer inches comparison"

  - name: installation_price_quote
    trigger: "PATCH /api/projects/{projectId} product (re-)selection"
    algorithm: forward_looking
    formula: |
      pit_shortfall    = max(0, model.min_pit_depth_inches - survey.measured_pit_depth_inches)
      overhead_shortfall = max(0, model.min_overhead_clearance_inches - survey.measured_overhead_clearance_inches)
      if pit_shortfall > MAX_CORRECTABLE_INCHES or overhead_shortfall > MAX_CORRECTABLE_INCHES:
        reject ERR_MODEL_DOES_NOT_FIT
      requires_structural = (pit_shortfall > 0 OR overhead_shortfall > 0)
      structural_estimate = (requires_structural ? STRUCTURAL_BASE_FEE : 0)
                          + pit_shortfall * PIT_RATE_PER_INCH
                          + overhead_shortfall * OVERHEAD_RATE_PER_INCH
      floor_fee = max(0, survey.floors_served - INCLUDED_FLOORS) * PER_FLOOR_FEE
      contract_price = model.base_price + model.install_labor_price + structural_estimate + floor_fee
    input_set: "Selected ACTIVE ProductModel + COMPLETED SiteSurvey measurements"
    constants:
      MAX_CORRECTABLE_INCHES: 12
      STRUCTURAL_BASE_FEE: 1500.00
      PIT_RATE_PER_INCH: 250.00
      OVERHEAD_RATE_PER_INCH: 150.00
      INCLUDED_FLOORS: 2
      PER_FLOOR_FEE: 750.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_quote
        when: "At product selection (project QUOTED)"
        difference: "Uses survey measurements and catalog prices; structural work priced at ESTIMATE"
      - name: final_invoice
        when: "At project close (see final_invoice_settlement)"
        difference: "Uses actual structural cost reconciliation and approved change orders; may diverge from provisional quote for the same project"

  - name: final_invoice_settlement
    trigger: "POST /api/projects/{projectId}/close"
    algorithm: chronological
    formula: |
      1. approved COs = ChangeOrders of project with status == APPROVED,
         ordered by approved_at ASC, tie created_at ASC
      2. effective CO total: first CO in that order -> effective = amount (markup waived);
         each subsequent CO -> effective = round_half_up(amount * 1.10, 2)
         (ChangeOrder.effective_amount is frozen at approval time; sum them)
      3. structural_adjustment: if project.requires_structural and work order VERIFIED:
           delta = actual_cost - structural_estimate
           if delta > 0: adjustment = round_half_up(delta * OVERAGE_SHARE, 2)   # homeowner pays half the overage
           else:         adjustment = delta                                     # full credit for underrun
         else: adjustment = 0
      4. final_invoice = contract_price + sum(effective_amount) + structural_adjustment
      5. homeowner_balance = final_invoice - disbursed_grants (computed after the waterfall)
    input_set: "Project, its APPROVED ChangeOrders, its VERIFIED StructuralWorkOrder"
    constants:
      OVERAGE_SHARE: 0.50
      CHANGE_ORDER_MARKUP: 0.10
    precision: "2 decimal places, round_half_up"

  - name: permit_fee
    trigger: "POST /api/permits (permit creation)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (round per component, then sum; NO rounding after summation):
        plan_review_cents   = round_half_up(0.015 * project.contract_price, 2)
        energy_cents        = round_half_up(0.004 * project.contract_price, 2)
        accessibility_cents = round_half_up(0.007 * project.contract_price, 2)
        floor_component     = PER_FLOOR_PERMIT_FEE * survey.floors_served   (exact integer dollars)
        fee = BASE_PERMIT_FEE + floor_component + plan_review_cents + energy_cents + accessibility_cents
      NOTE: summing the raw unrounded components and rounding once at the end is a
      DIFFERENT (rejected) algorithm; per-component rounding is the pinned rule and
      can differ from sum-then-round by whole cents.
    input_set: "Project (contract_price) and its SiteSurvey (floors_served)"
    constants:
      BASE_PERMIT_FEE: 250.00
      PER_FLOOR_PERMIT_FEE: 50.00
      PLAN_REVIEW_RATE: 0.015
      ENERGY_RATE: 0.004
      ACCESSIBILITY_RATE: 0.007
    precision: "2 decimal places, round_half_up, per component before summation"

  - name: grant_provisional_award
    trigger: "POST /api/grant-applications (submission)"
    algorithm: forward_looking
    formula: |
      current_contract_value = project.contract_price + project.approved_change_order_total
      provisional_award = min(program.max_award, round_half_up(program.coverage_percent * current_contract_value, 2))
    input_set: "Project current contract value at submission time; GrantProgram caps"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At submission; based on declared income and contract value at that moment"
        difference: "Does not observe the funding pool; not re-anchored to later price changes"
      - name: final
        when: "At approval (see grant_final_award)"
        difference: "Recomputes coverage on the CURRENT contract value and clamps to remaining_pool; differs whenever price moved or the pool binds"

  - name: grant_final_award
    trigger: "POST /api/grant-applications/{applicationId}/approve"
    algorithm: threshold
    formula: |
      current_contract_value = project.contract_price + project.approved_change_order_total
      coverage_amount = round_half_up(program.coverage_percent * current_contract_value, 2)
      final_award = min(coverage_amount, program.max_award, program.remaining_pool)
      program.remaining_pool -= final_award
    input_set: "Application's program (must be OPEN) and project at approval time"
    precision: "2 decimal places, round_half_up"

  - name: grant_disbursement_waterfall
    trigger: "POST /api/projects/{projectId}/close"
    algorithm: waterfall_allocation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, PINNED EVALUATION ORDER:
      balance starts at final_invoice (which is computed BEFORE any disbursement).
      eligible = GrantApplications of project with status == APPROVED,
                 ordered by approved_at ASC, tie created_at ASC
      for each application in order:
        pay = min(application.final_award, balance)
        application.disbursed = pay; application -> DISBURSED
        balance -= pay
      project.disbursed_grants = sum(pay); project.homeowner_balance = balance
      (homeowner_balance depends on disbursements, and each disbursement cap depends on
      the remaining balance — the pinned chronological pass makes the value well-defined.)
    input_set: "APPROVED GrantApplications only (SUBMITTED/DENIED/WITHDRAWN excluded)"
    precision: "2 decimal places, round_half_up"

  - name: entrapment_billing
    trigger: "ServiceCall dispatch (provisional) and resolve (final)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL (at dispatch): PREMIUM contract -> 0.00; STANDARD -> 150.00; BASIC -> 300.00; ad-hoc -> 450.00
      FINAL (at resolve):
        units = ceil((resolved_at - arrived_at in minutes) / 30)          # half-hour rounding up
        labor = units * HALF_HOUR_RATE
        if arrived_at UTC hour >= 18 or < 7: labor = round_half_up(labor * AFTER_HOURS_MULTIPLIER, 2)
        gross = labor + parts_cost
        if attached contract tier == PREMIUM and call_type == ENTRAPMENT: gross = 0.00
        if attached contract tier == STANDARD: gross = round_half_up(gross * 0.50, 2)
        if attached contract tier == BASIC: no discount
        if call_type == ENTRAPMENT and sla_breached: gross = max(0, gross - SLA_BREACH_CREDIT)
        final_billable = gross
    input_set: "ServiceCall timestamps, attached ServiceContract tier, parts_cost input"
    constants:
      HALF_HOUR_RATE: 60.00
      AFTER_HOURS_MULTIPLIER: 1.5
      SLA_BREACH_CREDIT: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_estimate
        when: "At dispatch; flat tier-based estimate"
        difference: "Ignores actual duration, parts, after-hours, and SLA outcome"
      - name: final_billable
        when: "At resolve; computed from actual timestamps and parts"
        difference: "Can diverge arbitrarily from the provisional estimate for the same call"

  - name: registration_renewal_fee
    trigger: "POST /api/registration-certificates/{certificateId}/renew"
    algorithm: threshold
    formula: |
      days_late = max(0, floor((clock - expiration_date) / 86400 seconds))
      tier: days_late == 0      -> base fee
            1 <= days_late <= 30  -> base * 1.25
            31 <= days_late <= 90 -> base * 1.50
            days_late > 90       -> reject ERR_RENEWAL_GRACE_EXPIRED (re-registration required)
      fee = round_half_up(BASE_RENEWAL_FEE * tier_multiplier, 2)
      Reinstatement from REVOKED (after REINSPECTION PASSED) always uses the base tier.
    input_set: "Certificate expiration_date and logical clock"
    constants:
      BASE_RENEWAL_FEE: 175.00
      LATE_TIER1_MULTIPLIER: 1.25
      LATE_TIER2_MULTIPLIER: 1.50
      GRACE_DAYS: 90
    precision: "2 decimal places, round_half_up"

  - name: contract_visit_tracking
    trigger: "ServiceCall dispatch (consume) and cancel from OPEN/DISPATCHED (restore)"
    algorithm: aggregation
    formula: |
      On dispatch of MAINTENANCE_VISIT with attached ACTIVE contract:
        require visits_consumed < included_visits (ERR_NO_VISITS_REMAINING)
        visits_consumed += 1
      On cancel of that call from OPEN or DISPATCHED:
        visits_consumed -= 1
      CONSERVATION INVARIANT: visits_consumed + visits_remaining == included_visits
      (visits_remaining is derived: included_visits - visits_consumed)
    input_set: "ServiceCalls attached to the contract in the current contract year"
    precision: "integer counts"

  - name: funding_posture_derivation
    trigger: "GrantApplication approve/withdraw/clawback and ChangeOrder approval"
    algorithm: aggregation
    formula: |
      committed = sum(final_award over applications in {APPROVED, DISBURSED})
      current_contract_value = contract_price + approved_change_order_total
      posture = FULLY_FUNDED     if committed >= current_contract_value AND current_contract_value > 0
              = PARTIALLY_FUNDED if 0 < committed < current_contract_value
              = UNFUNDED         if committed == 0
    input_set: "Project's GrantApplications in APPROVED or DISBURSED status"
    precision: "2 decimal places"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right (ERR_PROPERTY_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_PRODUCT_MODEL_NOT_FOUND, ERR_TECHNICIAN_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_SERVICE_CALL_NOT_FOUND, ERR_GRANT_PROGRAM_NOT_FOUND, ERR_GRANT_APPLICATION_NOT_FOUND, ERR_CHANGE_ORDER_NOT_FOUND)", error_id: "ERR_*_NOT_FOUND (per resource)", http_status: 404, applies_to: "all pathed endpoints" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, types and enum members valid, no unknown fields (ERR_INVALID_REQUEST); then body foreign-key references exist (property_id, survey_id, product_model_id, technician ids, contractor_id, project_id, unit_id, program_id, modernize_unit_id -> same ERR_*_NOT_FOUND set)", error_id: "ERR_INVALID_REQUEST or ERR_*_NOT_FOUND", http_status: 400, applies_to: "creation/PATCH endpoints with bodies" }
  - { priority: 5, category: state, check: "Target resource is in a state that allows the operation (per §1.2 from-states). Creation-time cross-entity state gates: permit creation requires project in {QUOTED, PERMIT_APPROVED, READY_FOR_INSTALL}; work-order creation requires project PERMIT_APPROVED with requires_structural == true and no other non-terminal work order; inspection creation is type-gated (ACCEPTANCE/MODERNIZATION_ACCEPTANCE: project INSTALL_COMPLETE; ANNUAL: unit IN_SERVICE; REINSPECTION: unit's latest terminal inspection FAILED, else ERR_REINSPECTION_NOT_APPLICABLE); grant submission requires project in {QUOTED, PERMIT_IN_PROGRESS, PERMIT_APPROVED, STRUCTURAL_IN_PROGRESS, READY_FOR_INSTALL, INSTALL_SCHEDULED}; change-order creation requires project not CLOSED/CANCELLED", error_id: "ERR_<RESOURCE>_STATE_FORBIDS over the concrete set ERR_SURVEY_STATE_FORBIDS, ERR_PROJECT_STATE_FORBIDS, ERR_PERMIT_STATE_FORBIDS, ERR_WORK_ORDER_STATE_FORBIDS, ERR_UNIT_STATE_FORBIDS, ERR_INSPECTION_STATE_FORBIDS, ERR_CERTIFICATE_STATE_FORBIDS, ERR_CONTRACT_STATE_FORBIDS, ERR_SERVICE_CALL_STATE_FORBIDS, ERR_APPLICATION_STATE_FORBIDS, ERR_CHANGE_ORDER_STATE_FORBIDS, ERR_PROGRAM_STATE_FORBIDS", http_status: 409, applies_to: "all state-transition and gated creation endpoints" }
  - { priority: 6, category: business_safety, check: "Technician certification sufficient for the operation: CET for install/dispatch of REPAIR/ENTRAPMENT, QEI for inspections", error_id: ERR_TECHNICIAN_NOT_CERTIFIED, http_status: 403, applies_to: "PATCH /api/projects/{id}, POST /api/inspections, POST /api/service-calls/{id}/dispatch" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: inspector must differ from project lead installer (ERR_INSPECTOR_NOT_INDEPENDENT); caller identity bindings (ERR_NOT_LEAD_INSTALLER, ERR_NOT_ASSIGNED_SURVEYOR, ERR_NOT_ASSIGNED_INSPECTOR, ERR_NOT_ASSIGNED_TECHNICIAN, ERR_NOT_ASSIGNED_CONTRACTOR, ERR_NOT_PROPERTY_OWNER)", error_id: ERR_INSPECTOR_NOT_INDEPENDENT, http_status: 403, applies_to: "POST /api/inspections; identity-bound action endpoints" }
  - { priority: 8, category: business_referential, check: "Referenced entity in an allowed status: ProductModel ACTIVE at selection/permit (ERR_MODEL_DISCONTINUED), Contractor ACTIVE (ERR_CONTRACTOR_NOT_ACTIVE), Technician ACTIVE (ERR_TECHNICIAN_NOT_ACTIVE), GrantProgram OPEN (ERR_PROGRAM_NOT_OPEN), Unit IN_SERVICE for contract activation (ERR_UNIT_NOT_IN_SERVICE), survey COMPLETED (ERR_SURVEY_NOT_COMPLETED)", error_id: "ERR_* referential set", http_status: 409, applies_to: "endpoints referencing configured entities" }
  - { priority: 9, category: business_constraint, check: "Uniqueness and overlap: one non-terminal permit per project (ERR_OPEN_PERMIT_EXISTS); one ACTIVE/SUSPENDED contract per unit (ERR_CONTRACT_ALREADY_EXISTS); serial_number unique (ERR_SERIAL_NUMBER_TAKEN); one SUBMITTED/APPROVED application per (project, program) (ERR_DUPLICATE_APPLICATION); contractor window pure overlap (ERR_CONTRACTOR_WINDOW_OVERLAP); inspector 45-minute buffered conflict (ERR_INSPECTOR_BUFFER_CONFLICT); one non-terminal modernization per unit (ERR_UNIT_PROJECT_IN_PROGRESS); one non-terminal structural work order per project (ERR_OPEN_WORK_ORDER_EXISTS); project_type must be in program.eligible_project_types (ERR_PROJECT_TYPE_INELIGIBLE)", error_id: "ERR_* constraint set", http_status: 409, applies_to: "creation and scheduling endpoints" }
  - { priority: 10, category: business_temporal, check: "Windows and date ordering: scheduled_end > scheduled_start (ERR_INVALID_DATE_RANGE); grant application clock within [application_open_date, application_close_date] inclusive (ERR_APPLICATION_WINDOW_CLOSED); install scheduling while permit valid (ERR_PERMIT_EXPIRED_FOR_INSTALL); complete-installation not before install_start_date (ERR_INSTALL_WINDOW_NOT_STARTED); inspection result not before scheduled_start (ERR_INSPECTION_NOT_STARTED); renewal within 90-day grace (ERR_RENEWAL_GRACE_EXPIRED)", error_id: "ERR_* temporal set", http_status: 422, applies_to: "dated endpoints" }
  - { priority: 11, category: business_fiscal, check: "Money gates last: household_income <= income_cap at submission (ERR_INCOME_ABOVE_CAP); verified_income <= income_cap at approval (ERR_VERIFIED_INCOME_INELIGIBLE); remaining_pool > 0 at approval (ERR_GRANT_POOL_EXHAUSTED)", error_id: "ERR_* fiscal set", http_status: 402, applies_to: "grant endpoints" }

# =============================================================================
# 1.5 API Endpoint Table (87 endpoints; GETs are readable by all roles)
# =============================================================================
endpoints:
  # --- Property ---
  - { method: POST, path: "/api/properties", description: "Create a property", roles: [ProjectCoordinator], code: 201, input: [owner_user_id, address_line, state_code, "has_existing_shaft?"], output: Property, side_effects: [] }
  - { method: GET, path: "/api/properties", description: "List properties", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: ["limit?", "offset?", "owner_user_id?", "state_code?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/api/properties/{propertyId}", description: "Get a property", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: [], output: Property, side_effects: [] }

  # --- SiteSurvey ---
  - { method: POST, path: "/api/surveys", description: "Schedule a site survey", roles: [ProjectCoordinator], code: 201, input: [property_id, surveyor_technician_id, scheduled_date], output: SiteSurvey, side_effects: ["status SCHEDULED"] }
  - { method: GET, path: "/api/surveys", description: "List surveys", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: ["limit?", "offset?", "property_id?", "surveyor_technician_id?", "status?"], output: "SiteSurvey[]", side_effects: [] }
  - { method: GET, path: "/api/surveys/{surveyId}", description: "Get a survey", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: [], output: SiteSurvey, side_effects: [] }
  - { method: POST, path: "/api/surveys/{surveyId}/complete", description: "Record survey measurements; computes feasibility_verdict", roles: [Surveyor], code: 200, input: [measured_pit_depth_inches, measured_overhead_clearance_inches, shaft_width_inches, shaft_depth_inches, floors_served], output: SiteSurvey, side_effects: ["status -> COMPLETED", "feasibility_verdict computed over ACTIVE ProductModels"] }
  - { method: POST, path: "/api/surveys/{surveyId}/cancel", description: "Cancel a scheduled survey", roles: [ProjectCoordinator], code: 200, input: [], output: SiteSurvey, side_effects: ["status -> CANCELLED"] }

  # --- ProductModel ---
  - { method: POST, path: "/api/product-models", description: "Create a catalog product model", roles: [DealerAdmin], code: 201, input: [model_code, drive_type, min_pit_depth_inches, min_overhead_clearance_inches, capacity_lbs, base_price, install_labor_price], output: ProductModel, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/api/product-models", description: "List product models", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: ["limit?", "offset?", "drive_type?", "status?"], output: "ProductModel[]", side_effects: [] }
  - { method: GET, path: "/api/product-models/{productModelId}", description: "Get a product model", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: [], output: ProductModel, side_effects: [] }
  - { method: POST, path: "/api/product-models/{productModelId}/discontinue", description: "Discontinue a model", roles: [DealerAdmin], code: 200, input: [], output: ProductModel, side_effects: ["status -> DISCONTINUED"] }

  # --- Technician ---
  - { method: POST, path: "/api/technicians", description: "Onboard a technician", roles: [DealerAdmin], code: 201, input: [full_name, certification, home_region], output: Technician, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/api/technicians", description: "List technicians", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: ["limit?", "offset?", "certification?", "status?"], output: "Technician[]", side_effects: [] }
  - { method: GET, path: "/api/technicians/{technicianId}", description: "Get a technician", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: POST, path: "/api/technicians/{technicianId}/deactivate", description: "Deactivate a technician (no open calls/inspections)", roles: [DealerAdmin], code: 200, input: [], output: Technician, side_effects: ["status -> INACTIVE"] }

  # --- Contractor ---
  - { method: POST, path: "/api/contractors", description: "Register a general contractor", roles: [DealerAdmin], code: 201, input: [company_name, license_number, license_state_code], output: Contractor, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/api/contractors", description: "List contractors", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: ["limit?", "offset?", "status?"], output: "Contractor[]", side_effects: [] }
  - { method: GET, path: "/api/contractors/{contractorId}", description: "Get a contractor", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: [], output: Contractor, side_effects: [] }
  - { method: POST, path: "/api/contractors/{contractorId}/suspend", description: "Suspend a contractor", roles: [DealerAdmin], code: 200, input: [], output: Contractor, side_effects: ["status -> SUSPENDED"] }

  # --- Project ---
  - { method: POST, path: "/api/projects", description: "Create a project from a completed survey", roles: [ProjectCoordinator], code: 201, input: [property_id, survey_id, project_type, "modernize_unit_id?"], output: Project, side_effects: ["status DRAFT", "MODERNIZATION: target unit IN_SERVICE/OUT_OF_SERVICE -> UNDER_MODERNIZATION"] }
  - { method: GET, path: "/api/projects", description: "List projects", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: ["limit?", "offset?", "property_id?", "survey_id?", "product_model_id?", "lead_installer_technician_id?", "contractor_id?", "modernize_unit_id?", "status?", "project_type?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/api/projects/{projectId}", description: "Get a project", roles: [DealerAdmin, ProjectCoordinator, Surveyor, Installer, Inspector, Contractor, Homeowner, GrantOfficer, Regulator], code: 200, input: [], output: Project, side_effects: [] }
  - { method: PATCH, path: "/api/projects/{projectId}", description: "Select/supersede product model, lead installer, contractor (OCC-guarded scope update)", roles: [ProjectCoordinator], code: 200, input: ["product_model_id?", "lead_installer_technician_id?", "contractor_id?", expected_project_version], output: Project, side_effects: ["Recompute requires_structural/structural_estimate/contract_price when product set", "DRAFT -> QUOTED on first valid selection", "Increments Project.version by 1"] }
  - { method: POST, path: "/api/projects/{projectId}/schedule-installation", description: "Schedule the installation window", roles: [ProjectCoordinator], code: 200, input: [install_start_date, install_end_date], output: Project, side_effects: ["READY_FOR_INSTALL -> INSTALL_SCHEDULED"] }
