# =============================================================================
# Hotel Revenue Management System (RMS) — benchmark seed tables
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Hotel Revenue Management (RMS): demand forecast & pickup, BAR/rate-class & length-of-stay control,
  overbooking & oversell limit, competitor rate shop, channel/OTA parity, group-displacement analysis,
  last-room value & yield rules, RevPAR/ADR/occupancy KPI

domain_name: hotel-revenue-management
api_prefix: /

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation        # pickup forecast (snapshot-pace vs trailing-pickup); group displacement (LRV-based vs forecast-revenue-based)
    - cascading_side_effects          # rate decision publish -> channel rate sync -> parity recompute -> property KPI refresh
    - rate_threshold_triggers         # yield rules fire at occupancy breakpoints; last-room value premium
    - optimistic_concurrency          # rate decision publish on a stale RatePlan version

  entity_topology: flat
  # Peer top-level collections (/properties, /room-types, /rate-plans, /inventory-days, /rate-decisions,
  # /yield-rules, /group-blocks, /channel-mappings, /competitor-rates) linked by foreign keys carried in
  # request bodies (property_id, room_type_id, rate_plan_id). No nesting in URL paths.

  state_machine_shape: branching
  # RateDecision: DRAFT -> {PUBLISHED, REJECTED} -> SUPERSEDED (branching with divergent side-effects).
  # GroupBlock: cyclic revision loop (NEGOTIATING <-> REVISION_REQUESTED) before commit.

  relationship_patterns:
    - one_to_many        # Property -> RoomType -> RatePlan / InventoryDay
    - cross_aggregate    # ChannelMapping references RatePlan across the channel aggregate; CompetitorRate references Property

  role_model: peer_roles
  # RevenueManager owns rate decisions & yield rules; GroupSalesManager owns group blocks;
  # ChannelManager owns channel mappings/parity; Analyst is read-only KPI/forecast consumer.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Hotel property name" }
      - { name: total_rooms, type: integer, source: input, description: "Total physical sellable rooms across all room types", constraints: ">= 1" }
      - { name: overbooking_limit_pct, type: number, source: input, description: "Property-wide oversell ceiling as a fraction of total_rooms (e.g. 0.10 = may sell up to 110% of total_rooms)", default: 0.0, constraints: ">= 0 and <= 0.30" }
      - { name: currency, type: string, source: input, description: "ISO 4217 currency code for all monetary fields", default: "USD" }
      - { name: occupancy_pct, type: number, source: computed, description: "Property-level occupancy KPI for the current logical date; see calc property_kpi" }
      - { name: adr, type: number, source: computed, description: "Average Daily Rate KPI for the current logical date; see calc property_kpi" }
      - { name: revpar, type: number, source: computed, description: "Revenue Per Available Room KPI for the current logical date; see calc property_kpi" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: RoomType
    parent: Property
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: code, type: string, source: input, description: "Short room-type code, unique within the property (e.g. KING, DBLQ)" }
      - { name: name, type: string, source: input, description: "Display name of the room type" }
      - { name: physical_rooms, type: integer, source: input, description: "Physical room count of this type", constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: RatePlan
    parent: RoomType
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_type_id, type: string, source: input, description: "FK -> RoomType.id" }
      - { name: rate_class, type: enum, source: input, description: "BAR | CORPORATE | ADVANCE_PURCHASE | PACKAGE", constraints: "one of BAR,CORPORATE,ADVANCE_PURCHASE,PACKAGE" }
      - { name: is_master_bar, type: boolean, source: input, description: "True for the single BAR plan that drives derived/parity rates on the room type", default: false }
      - { name: min_los, type: integer, source: input, description: "Minimum length-of-stay (nights) required for a stay to use this plan", default: 1, constraints: ">= 1" }
      - { name: max_los, type: integer, source: input, description: "Maximum length-of-stay (nights) allowed; 0 means unbounded", default: 0, constraints: ">= 0" }
      - { name: base_rate, type: number, source: input, description: "List nightly rate before yield adjustment, in property currency", constraints: ">= 0" }
      - { name: floor_rate, type: number, source: input, description: "Lowest nightly rate yield rules may produce", constraints: ">= 0" }
      - { name: ceiling_rate, type: number, source: input, description: "Highest nightly rate yield rules may produce; must be >= floor_rate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED — CLOSED plans accept no new rate decisions or bookings", default: ACTIVE, constraints: "one of ACTIVE,CLOSED" }
      - { name: published_rate, type: number, source: computed, description: "Current effective nightly rate set by the latest PUBLISHED RateDecision; null until first publish" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: InventoryDay
    parent: RoomType
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_type_id, type: string, source: input, description: "FK -> RoomType.id" }
      - { name: stay_date, type: datetime, source: input, description: "The night this inventory record covers (date at 00:00:00Z)" }
      - { name: physical_capacity, type: integer, source: input, description: "Sellable rooms of this type for this night (defaults to RoomType.physical_rooms)", constraints: ">= 0" }
      - { name: group_held_rooms, type: integer, source: computed, description: "Rooms held by COMMITTED GroupBlocks overlapping this stay_date" }
      - { name: transient_sold_rooms, type: integer, source: input, description: "Confirmed transient (non-group) rooms sold for this night", default: 0, constraints: ">= 0" }
      - { name: transient_revenue, type: number, source: input, description: "Confirmed transient room revenue booked for this night, property currency", default: 0, constraints: ">= 0" }
      - { name: rooms_sold, type: integer, source: computed, description: "transient_sold_rooms + group_held_rooms" }
      - { name: rooms_available, type: integer, source: computed, description: "Sellable remaining for this night; may not exceed oversell ceiling; see calc availability" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: RateDecision
    parent: RatePlan
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id" }
      - { name: stay_date, type: datetime, source: input, description: "The night this rate decision applies to (date at 00:00:00Z)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | REJECTED | SUPERSEDED", default: DRAFT, constraints: "one of DRAFT,PUBLISHED,REJECTED,SUPERSEDED" }
      - { name: requested_rate, type: number, source: input, description: "Manager-proposed nightly rate before yield clamping", constraints: ">= 0" }
      - { name: yielded_rate, type: number, source: computed, description: "requested_rate after applying yield rules and floor/ceiling clamp; computed at publish; null while DRAFT" }
      - { name: applied_yield_rule_id, type: string, source: computed, description: "FK -> YieldRule.id — the single yield rule that fired at publish, or null if none fired" }
      - { name: last_room_premium_applied, type: boolean, source: computed, description: "True when the last-room-value premium was added at publish", default: false }
      - { name: reject_reason, type: string, source: input, description: "Free-text reason captured on REJECTED; null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: YieldRule
    parent: Property
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: name, type: string, source: input, description: "Human-readable rule label" }
      - { name: occupancy_threshold_pct, type: number, source: input, description: "Forecast occupancy at or above which the rule fires (inclusive, >=)", constraints: ">= 0 and <= 1" }
      - { name: adjustment_pct, type: number, source: input, description: "Multiplicative rate adjustment applied when the rule fires (e.g. 0.15 = +15%, -0.10 = -10%)" }
      - { name: priority, type: integer, source: input, description: "Tie-break ordinal; lower fires first when multiple rules are eligible", constraints: ">= 1" }
      - { name: enabled, type: boolean, source: input, description: "Only enabled rules are eligible at publish", default: true }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: GroupBlock
    parent: RoomType
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_type_id, type: string, source: input, description: "FK -> RoomType.id" }
      - { name: group_name, type: string, source: input, description: "Name of the requesting group" }
      - { name: arrival_date, type: datetime, source: input, description: "First night of the block (date at 00:00:00Z)" }
      - { name: nights, type: integer, source: input, description: "Number of consecutive nights in the block", constraints: ">= 1" }
      - { name: rooms_per_night, type: integer, source: input, description: "Rooms requested for every night of the block", constraints: ">= 1" }
      - { name: offered_rate, type: number, source: input, description: "Per-night per-room rate offered to the group", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING | REVISION_REQUESTED | COMMITTED | CANCELLED | LOST", default: NEGOTIATING, constraints: "one of NEGOTIATING,REVISION_REQUESTED,COMMITTED,CANCELLED,LOST" }
      - { name: displacement_cost, type: number, source: computed, description: "Computed displaced transient revenue at evaluation; see calc group_displacement; null until evaluated" }
      - { name: recommendation, type: enum, source: computed, description: "ACCEPT | REJECT recommendation from the last displacement evaluation; null until evaluated" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: ChannelMapping
    parent: RatePlan
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id" }
      - { name: channel, type: enum, source: input, description: "DIRECT | OTA_A | OTA_B | GDS", constraints: "one of DIRECT,OTA_A,OTA_B,GDS" }
      - { name: markup_pct, type: number, source: input, description: "Multiplicative markup over the plan's published_rate for this channel (e.g. 0.18 = +18% commission gross-up)", default: 0.0, constraints: ">= 0" }
      - { name: manual_rate_override, type: number, source: input, description: "When set (non-null), replaces the synced channel_rate for this channel; used to model a channel pricing off-strategy. null means follow sync.", default: null, constraints: ">= 0 when set" }
      - { name: parity_status, type: enum, source: computed, description: "IN_PARITY | OUT_OF_PARITY — whether this channel's net rate respects the parity band vs DIRECT's net rate", default: IN_PARITY, constraints: "one of IN_PARITY,OUT_OF_PARITY" }
      - { name: channel_rate, type: number, source: computed, description: "Synced rate pushed to this channel (manual_rate_override if set, else published_rate*(1+markup_pct)); see calc channel_sync; null until first sync" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: CompetitorRate
    parent: Property
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: competitor_name, type: string, source: input, description: "Name of the compset hotel that was shopped" }
      - { name: stay_date, type: datetime, source: input, description: "The night the shopped rate applies to (date at 00:00:00Z)" }
      - { name: shopped_rate, type: number, source: input, description: "Competitor's nightly rate observed at shop time, property currency", constraints: ">= 0" }
      - { name: shopped_at, type: datetime, source: input, description: "Logical time the shop snapshot was taken" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: TransientReservation
    parent: RoomType
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_type_id, type: string, source: input, description: "FK -> RoomType.id" }
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id — the plan whose LOS control and published_rate this booking uses" }
      - { name: arrival_date, type: datetime, source: input, description: "First night of the stay (date at 00:00:00Z)" }
      - { name: nights, type: integer, source: input, description: "Number of consecutive nights", constraints: ">= 1" }
      - { name: rooms, type: integer, source: input, description: "Rooms booked for every night of the stay", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED | CHECKED_OUT", default: HELD, constraints: "one of HELD,CONFIRMED,CANCELLED,CHECKED_OUT" }
      - { name: booked_rate, type: number, source: computed, description: "Per-night per-room rate captured at CONFIRMED from the rate plan's published_rate; null until confirmed" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RateDecision
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    note: "Branching: a DRAFT either PUBLISHED (and later auto-SUPERSEDED by a newer publish for the same plan+stay_date) or REJECTED. Divergent side-effect sets per branch."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rate-decisions/{id}/publish"
        actor: RevenueManager
        preconditions:
          - "RatePlan.status == ACTIVE"
          - "Decision.status == DRAFT"
          - "expected_rate_plan_version matches RatePlan.version (OCC)"
          - "An InventoryDay exists for (room_type_id, decision.stay_date) — yield uses its forecast occupancy"
        side_effects:
          - "Compute yielded_rate via calc rate_yield (apply at-most-one eligible YieldRule, last-room premium, clamp to floor/ceiling)"
          - "Set RateDecision.yielded_rate, applied_yield_rule_id, last_room_premium_applied"
          - "Set RatePlan.published_rate = this.yielded_rate; increment RatePlan.version by 1"
          - "Any prior PUBLISHED RateDecision on the same (rate_plan_id, stay_date) transitions PUBLISHED -> SUPERSEDED (cascade hop 1)"
          - "For the master BAR plan only: each ChannelMapping under the plan re-syncs channel_rate and recomputes parity_status via calc channel_sync (cascade hop 2)"
          - "Property KPI fields (occupancy_pct, adr, revpar) recomputed via calc property_kpi (cascade hop 3)"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /rate-decisions/{id}/reject"
        actor: RevenueManager
        preconditions:
          - "Decision.status == DRAFT"
        side_effects:
          - "Set reject_reason from request body"
          - "yielded_rate stays null; RatePlan.published_rate unchanged; no channel sync; no KPI recompute"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a newer RateDecision for the same rate_plan_id + stay_date is PUBLISHED)"
        actor: system
        preconditions:
          - "A newer decision on the same (rate_plan_id, stay_date) reaches PUBLISHED"
        side_effects:
          - "This decision no longer drives RatePlan.published_rate (the newer one does)"

  - entity: GroupBlock
    initial_state: NEGOTIATING
    terminal_states: [CANCELLED, LOST]
    note: "Cyclic revision loop NEGOTIATING <-> REVISION_REQUESTED before COMMITTED; COMMITTED can release back to CANCELLED."
    transitions:
      - from: NEGOTIATING
        to: REVISION_REQUESTED
        trigger: "POST /group-blocks/{id}/request-revision"
        actor: RevenueManager
        preconditions:
          - "Block.status == NEGOTIATING"
          - "Block has been evaluated (displacement_cost not null) and recommendation == REJECT"
        side_effects:
          - "Record that a higher rate / smaller block is requested; offered_rate/rooms_per_night may be revised by GroupSalesManager next"

      - from: REVISION_REQUESTED
        to: NEGOTIATING
        trigger: "PATCH /group-blocks/{id} (GroupSalesManager revises offered_rate and/or rooms_per_night)"
        actor: GroupSalesManager
        preconditions:
          - "Block.status == REVISION_REQUESTED"
        side_effects:
          - "Re-open negotiation; displacement_cost and recommendation reset to null (must be re-evaluated)"

      - from: NEGOTIATING
        to: COMMITTED
        trigger: "POST /group-blocks/{id}/commit"
        actor: GroupSalesManager
        preconditions:
          - "Block.status == NEGOTIATING"
          - "Block has been evaluated (displacement_cost not null) and recommendation == ACCEPT"
          - "expected_room_type_version matches RoomType.version (OCC)"
          - "For every night in the block, rooms_available on the InventoryDay (after oversell ceiling) >= rooms_per_night"
        side_effects:
          - "Each overlapping InventoryDay: group_held_rooms += rooms_per_night; rooms_sold and rooms_available recomputed via calc availability (cascade hop 1)"
          - "Increment RoomType.version by 1"
          - "Property KPI fields recomputed via calc property_kpi (cascade hop 2)"

      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /group-blocks/{id}/cancel"
        actor: GroupSalesManager
        preconditions:
          - "Block.status == COMMITTED"
        side_effects:
          - "Each overlapping InventoryDay: group_held_rooms -= rooms_per_night; rooms_sold and rooms_available recomputed (compensation: restores held rooms exactly)"
          - "Property KPI fields recomputed via calc property_kpi"

      - from: [NEGOTIATING, REVISION_REQUESTED]
        to: LOST
        trigger: "POST /group-blocks/{id}/cancel"
        actor: GroupSalesManager
        preconditions:
          - "Block.status in {NEGOTIATING, REVISION_REQUESTED}"
        side_effects:
          - "No inventory was held while NEGOTIATING/REVISION_REQUESTED; no InventoryDay change"

  - entity: RatePlan
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    note: "Lifecycle gate: CLOSED plans reject new rate decisions and group commits referencing them."
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rate-plans/{id}/close"
        actor: RevenueManager
        preconditions:
          - "RatePlan.status == ACTIVE"
        side_effects:
          - "All DRAFT RateDecisions on this plan transition DRAFT -> REJECTED with reject_reason='plan closed' (cascade)"
          - "Plan accepts no new rate-decision creation or publish"

  - entity: TransientReservation
    initial_state: HELD
    terminal_states: [CANCELLED, CHECKED_OUT]
    note: "Linear with revert: HELD -> CONFIRMED -> CHECKED_OUT, with CANCELLED reachable from HELD or CONFIRMED (compensating release). CONFIRMED consumes transient inventory; cross-entity gated on RatePlan published_rate."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /transient-reservations/{id}/confirm"
        actor: RevenueManager
        preconditions:
          - "Reservation.status == HELD"
          - "The reservation's RatePlan.status == ACTIVE and published_rate is not null (a rate has been published)"
          - "For every night in [arrival_date, arrival_date+nights): rooms_available on the InventoryDay (after oversell ceiling) >= rooms"
        side_effects:
          - "booked_rate = RatePlan.published_rate (captured at confirm)"
          - "Each overlapping InventoryDay: transient_sold_rooms += rooms; transient_revenue += rooms * booked_rate; recompute availability (cascade)"
          - "Property KPI recomputed (property_kpi)"

      - from: CONFIRMED
        to: CHECKED_OUT
        trigger: "POST /transient-reservations/{id}/check-out"
        actor: RevenueManager
        preconditions:
          - "Reservation.status == CONFIRMED"
        side_effects:
          - "Stay realized; transient counts remain consumed (no inventory release on checkout)"

      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /transient-reservations/{id}/cancel"
        actor: RevenueManager
        preconditions:
          - "Reservation.status in {HELD, CONFIRMED}"
        side_effects:
          - "If CONFIRMED: each overlapping InventoryDay transient_sold_rooms -= rooms; transient_revenue -= rooms * booked_rate; recompute availability (compensation: restores transient counts exactly); Property KPI recomputed"
          - "If HELD: no inventory was consumed; no InventoryDay change"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: publish-stale-rate-plan
    parent_entity: RatePlan
    write_endpoint: "POST /rate-decisions/{id}/publish"
    occ_field: "expected_rate_plan_version"
    description: |
      Publishing a RateDecision against a RatePlan whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer has
      already published a decision for this plan (legitimately superseding the prior published
      rate and bumping RatePlan.version), so the current writer's view of the plan — and of
      which decision is currently effective — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: commit-stale-room-type
    parent_entity: RoomType
    write_endpoint: "POST /group-blocks/{id}/commit"
    occ_field: "expected_room_type_version"
    description: |
      Committing a GroupBlock against a RoomType whose version has advanced since the client
      last observed it is rejected. This captures the case where another GroupBlock was just
      committed on the same RoomType (legitimately consuming shared inventory and bumping
      RoomType.version), so the current writer's availability view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: availability
    trigger: "InventoryDay read; recomputed after group commit/cancel and transient updates"
    algorithm: aggregation
    formula: |
      rooms_sold = transient_sold_rooms + group_held_rooms
      oversell_ceiling = floor(physical_capacity * (1 + Property.overbooking_limit_pct))
      rooms_available = max(0, oversell_ceiling - rooms_sold)
    input_set: "physical_capacity and transient_sold_rooms from this InventoryDay; group_held_rooms = sum(rooms_per_night) over COMMITTED GroupBlocks of the same RoomType whose [arrival_date, arrival_date+nights) interval contains stay_date"
    constants: {}
    precision: "rooms_* are integers; oversell_ceiling uses floor()"

  - name: pickup_forecast
    trigger: "GET /inventory-days/{id}/forecast (on demand)"
    algorithm: forward_looking
    formula: |
      # Forecast remaining transient rooms to be sold for a stay_date, two variants.
      # SNAPSHOT_PACE (default): scale current sold by booking-curve pace factor.
      #   forecast_final_sold = round(transient_sold_rooms * PACE_FACTOR)
      # TRAILING_PICKUP: add a fixed trailing daily pickup over remaining days-to-arrival.
      #   days_to_arrival = max(0, days_between(clock_now_date, stay_date))
      #   forecast_final_sold = transient_sold_rooms + (TRAILING_DAILY_PICKUP * days_to_arrival)
      # Both clamp: forecast_final_sold = min(forecast_final_sold, oversell_ceiling)
      forecast_occupancy_pct = forecast_final_sold / physical_capacity   # may exceed 1.0 only up to oversell
    input_set: "Single InventoryDay plus the logical clock date; group_held_rooms NOT included (forecast is transient-only)"
    constants:
      PACE_FACTOR: 1.5
      TRAILING_DAILY_PICKUP: 2
    precision: "forecast_final_sold rounded half-up to integer; forecast_occupancy_pct to 4 decimals round_half_up"
    variants:
      - name: SNAPSHOT_PACE
        when: "method query param omitted or = SNAPSHOT_PACE"
        difference: "Multiplies current sold by PACE_FACTOR; ignores days-to-arrival"
      - name: TRAILING_PICKUP
        when: "method=TRAILING_PICKUP"
        difference: "Adds TRAILING_DAILY_PICKUP per remaining day-to-arrival; ignores PACE_FACTOR"

  - name: rate_yield
    trigger: "RateDecision DRAFT -> PUBLISHED (publish endpoint)"
    algorithm: threshold
    formula: |
      # Step 1: select forecast occupancy basis from the matching InventoryDay (transient-only, SNAPSHOT_PACE).
      basis_occ = pickup_forecast.SNAPSHOT_PACE.forecast_occupancy_pct for (room_type_id, stay_date)
      # Step 2: choose AT MOST ONE eligible YieldRule.
      eligible = [r for r in YieldRule of property where r.enabled and basis_occ >= r.occupancy_threshold_pct]
      chosen = the eligible rule with the HIGHEST occupancy_threshold_pct;
               tie-break by lower priority value; further tie-break by earlier created_at
      rule_factor = (1 + chosen.adjustment_pct) if chosen else 1.0
      yielded = requested_rate * rule_factor
      # Step 3: last-room-value premium — fires when remaining sellable is scarce.
      if rooms_available (calc availability) <= LRV_SCARCITY_ROOMS:
          yielded = yielded * (1 + LRV_PREMIUM_PCT)
          last_room_premium_applied = true
      # Step 4: clamp to plan band, then round.
      yielded_rate = round( min(ceiling_rate, max(floor_rate, yielded)), 2 )
    input_set: "Single RateDecision + its RatePlan + the matching InventoryDay + enabled YieldRules of the property"
    constants:
      LRV_SCARCITY_ROOMS: 5
      LRV_PREMIUM_PCT: 0.20
    precision: "yielded_rate to 2 decimals, round_half_up; clamp applied AFTER premium, BEFORE rounding (premium then clamp then round — order pinned)"

  - name: group_displacement
    trigger: "POST /group-blocks/{id}/evaluate"
    algorithm: forward_looking
    formula: |
      # Two valuation methods produce different displaced revenue; both compare to group value.
      total_group_rooms = rooms_per_night * nights
      group_value = offered_rate * total_group_rooms
      # effective_bar_rate is the last-room-value proxy with a pinned fallback chain so the calc
      # is well-defined even when no rate has been published yet:
      #   = master_bar.published_rate          if a master BAR plan exists on the RoomType AND it is published
      #   = master_bar.base_rate               else if a master BAR plan exists (not yet published)
      #   = 0                                  else (no master BAR plan on the RoomType)
      # For each night n in [arrival_date, arrival_date+nights):
      #   forecast_demand_n = pickup_forecast.SNAPSHOT_PACE.forecast_final_sold for that InventoryDay
      #   capacity_n        = physical_capacity (NO oversell — displacement is true rooms)
      #   would_be_sold_without_group_n = min(forecast_demand_n, capacity_n - group_held_rooms_excluding_this_block)
      #   spill_n = max(0, (would_be_sold_without_group_n + rooms_per_night) - capacity_n)  # transient turned away
      # LRV method (default): displaced_revenue = sum_n( spill_n * effective_bar_rate )
      # FORECAST_REV method:  displaced_revenue = sum_n( spill_n * (transient_revenue_n / max(1, transient_sold_rooms_n)) )
      displacement_cost = round(displaced_revenue, 2)
      recommendation = ACCEPT if group_value >= displacement_cost else REJECT
    input_set: "GroupBlock nights; per-night InventoryDay of the same RoomType; the RoomType's master BAR RatePlan (effective_bar_rate per the fallback chain above); transient ADR per night"
    constants: {}
    precision: "displacement_cost and group_value to 2 decimals round_half_up; spill counts are integers"
    variants:
      - name: LRV
        when: "method query param omitted or = LRV"
        difference: "Values spilled transient rooms at the master BAR effective_bar_rate (last-room value proxy: published_rate, else base_rate, else 0)"
      - name: FORECAST_REV
        when: "method=FORECAST_REV"
        difference: "Values spilled transient rooms at the night's realized transient ADR (transient_revenue / transient_sold_rooms)"

  - name: channel_sync
    trigger: "Master BAR RateDecision PUBLISHED (cascade hop 2); ChannelMapping create/override-update"
    algorithm: aggregation
    formula: |
      # channel_rate: an explicit override wins, else the synced gross-up.
      channel_rate = manual_rate_override if manual_rate_override is not null
                     else round(RatePlan.published_rate * (1 + markup_pct), 2)
      net_channel  = channel_rate / (1 + markup_pct)
      # Parity reference is the DIRECT mapping of the same plan.
      direct_rate  = DIRECT.manual_rate_override if DIRECT.manual_rate_override is not null
                     else round(RatePlan.published_rate * (1 + DIRECT.markup_pct), 2)
      net_direct   = direct_rate / (1 + DIRECT.markup_pct)
      # A channel is OUT_OF_PARITY if its net (commission-stripped) rate undercuts
      # DIRECT's net rate by more than PARITY_TOLERANCE of net_direct.
      parity_status = OUT_OF_PARITY if net_channel < net_direct * (1 - PARITY_TOLERANCE) else IN_PARITY
    input_set: "Each ChannelMapping under the master BAR RatePlan; the DIRECT mapping of the same plan as parity reference. A pure synced channel (no override) always has net_channel == published_rate == net_direct -> IN_PARITY."
    constants:
      PARITY_TOLERANCE: 0.02
    precision: "channel_rate to 2 decimals round_half_up; the DIRECT mapping is always IN_PARITY (it is its own reference)"

  - name: property_kpi
    trigger: "RateDecision PUBLISHED (hop 3); GroupBlock commit/cancel (hop 2); on-demand GET /kpis"
    algorithm: aggregation
    formula: |
      # Computed for the logical clock's current date across all RoomTypes' InventoryDay with stay_date == clock_date.
      total_available_rooms = sum(physical_capacity) over those InventoryDays
      total_rooms_sold      = sum(rooms_sold) over those InventoryDays            # transient + group held
      total_room_revenue    = sum(transient_revenue) over those InventoryDays
                              + sum(group_held_rooms_n * committed_group_offered_rate) over committed group nights on clock_date
      occupancy_pct = round(total_rooms_sold / total_available_rooms, 4)          # 0 if no available rooms
      adr           = round(total_room_revenue / total_rooms_sold, 2)            # 0 if total_rooms_sold == 0
      revpar        = round(total_room_revenue / total_available_rooms, 2)        # 0 if total_available_rooms == 0
    input_set: "All InventoryDay rows whose stay_date equals the logical clock date; group revenue from COMMITTED blocks covering that date"
    constants: {}
    precision: "occupancy_pct to 4 decimals; adr and revpar to 2 decimals; all round_half_up; division-by-zero yields 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every {id} path resource exists (e.g. GET/POST on /rate-decisions/{id}, /group-blocks/{id}, /transient-reservations/{id})"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges respected (ceiling_rate >= floor_rate, overbooking_limit_pct in [0,0.30], counts >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_constraint
    check: "RatePlan created with max_los > 0 must satisfy max_los >= min_los"
    error_id: ERR_INVALID_LOS_BAND
    http_status: 422
    applies_to: "POST /rate-plans"

  - priority: 6
    category: business_referential
    check: "Every body foreign key (property_id, room_type_id, rate_plan_id) references an existing resource in the same property scope"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST /room-types, POST /rate-plans, POST /inventory-days, POST /yield-rules, POST /rate-decisions, POST /channel-mappings, POST /group-blocks, POST /transient-reservations, POST /competitor-rates"

  - priority: 7
    category: business_constraint
    check: "RoomType.code unique within its Property"
    error_id: ERR_DUPLICATE_ROOM_TYPE_CODE
    http_status: 409
    applies_to: "POST /room-types"

  - priority: 8
    category: business_constraint
    check: "At most one RatePlan with is_master_bar=true per RoomType"
    error_id: ERR_MASTER_BAR_EXISTS
    http_status: 409
    applies_to: "POST /rate-plans"

  - priority: 9
    category: business_constraint
    check: "At most one InventoryDay per (room_type_id, stay_date)"
    error_id: ERR_DUPLICATE_INVENTORY_DAY
    http_status: 409
    applies_to: "POST /inventory-days"

  - priority: 10
    category: business_constraint
    check: "At most one ChannelMapping per (rate_plan_id, channel)"
    error_id: ERR_CHANNEL_ALREADY_MAPPED
    http_status: 409
    applies_to: "POST /channel-mappings"

  - priority: 11
    category: business_fiscal
    check: "RateDecision created with requested_rate >= the plan's floor_rate"
    error_id: ERR_RATE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /rate-decisions"

  - priority: 12
    category: state
    check: "Target resource in valid state for the requested transition (RateDecision must be DRAFT to publish/reject; GroupBlock state gates commit/revise/cancel; TransientReservation state gates confirm/check-out/cancel; RatePlan must be ACTIVE to close)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 13
    category: business_constraint
    check: "RatePlan.status == ACTIVE when creating or publishing a RateDecision under it"
    error_id: ERR_PLAN_CLOSED
    http_status: 409
    applies_to: "POST /rate-decisions, POST /rate-decisions/{id}/publish"

  - priority: 14
    category: business_constraint
    check: "Confirming a TransientReservation requires its RatePlan.published_rate to be non-null (a decision has been published)"
    error_id: ERR_RATE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /transient-reservations/{id}/confirm"

  - priority: 15
    category: business_referential
    check: "Length-of-stay control. For a GroupBlock, the stay length `nights` is checked at COMMIT against the RoomType's master BAR plan (min_los <= nights and (max_los == 0 or nights <= max_los)); if the RoomType has no master BAR plan, no LOS constraint applies to the group. For a TransientReservation, `nights` is checked at create and confirm against the reservation's own rate_plan_id plan."
    error_id: ERR_LOS_VIOLATION
    http_status: 422
    applies_to: "POST /group-blocks/{id}/commit, POST /transient-reservations, POST /transient-reservations/{id}/confirm"

  - priority: 16
    category: business_temporal
    check: "Group evaluate/commit and transient confirm require an InventoryDay to exist for every night in [arrival_date, arrival_date+nights)"
    error_id: ERR_MISSING_INVENTORY_DAY
    http_status: 409
    applies_to: "POST /group-blocks/{id}/evaluate, POST /group-blocks/{id}/commit, POST /transient-reservations/{id}/confirm"

  - priority: 17
    category: business_constraint
    check: "GroupBlock commit/request-revision requires a prior evaluation with a recommendation (displacement_cost not null)"
    error_id: ERR_NOT_EVALUATED
    http_status: 409
    applies_to: "POST /group-blocks/{id}/commit, POST /group-blocks/{id}/request-revision"

  - priority: 18
    category: business_fiscal
    check: "Inventory ceiling: group commit, transient confirm, and transient PATCH must not push rooms_sold above the night's oversell ceiling (for every affected night)"
    error_id: ERR_OVERSELL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /group-blocks/{id}/commit, POST /transient-reservations/{id}/confirm, PATCH /inventory-days/{id}"

  - priority: 19
    category: state
    check: "OCC: expected_<parent>_version on publish/commit must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rate-decisions/{id}/publish, POST /group-blocks/{id}/commit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. KPI date and days-to-arrival derive from this clock."
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets logical clock used by pickup_forecast and property_kpi"]

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Create a property"
    roles: [RevenueManager]
    code: 201
    input: [name, total_rooms, "overbooking_limit_pct?", "currency?"]
    output: Property
    side_effects: ["KPIs initialized to 0; version=1"]

  - method: GET
    path: "/properties/{id}"
    description: "Get a property with current KPI fields"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/properties/{id}/kpis"
    description: "Computed read: recompute and return property KPIs (occupancy_pct, adr, revpar) for the current logical date"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: Property
    side_effects: ["Recompute property_kpi"]

  # --- RoomType ---
  - method: POST
    path: "/room-types"
    description: "Create a room type under a property (property_id in body)"
    roles: [RevenueManager]
    code: 201
    input: [property_id, code, name, physical_rooms]
    output: RoomType
    side_effects: ["version=1"]

  - method: GET
    path: "/room-types/{id}"
    description: "Get a room type"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  - method: GET
    path: "/room-types"
    description: "List room types (filtered list for FK Property)"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: RoomType[]
    side_effects: []

  # --- RatePlan ---
  - method: POST
    path: "/rate-plans"
    description: "Create a rate plan under a room type (room_type_id in body)"
    roles: [RevenueManager]
    code: 201
    input: [room_type_id, rate_class, "is_master_bar?", "min_los?", "max_los?", base_rate, floor_rate, ceiling_rate]
    output: RatePlan
    side_effects: ["status=ACTIVE; published_rate=null; version=1"]

  - method: GET
    path: "/rate-plans/{id}"
    description: "Get a rate plan"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  - method: GET
    path: "/rate-plans"
    description: "List rate plans (filtered list for FK RoomType)"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: ["room_type_id?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  - method: POST
    path: "/rate-plans/{id}/close"
    description: "Close a rate plan (terminal)"
    roles: [RevenueManager]
    code: 200
    input: []
    output: RatePlan
    side_effects: ["status->CLOSED; DRAFT rate-decisions on this plan -> REJECTED; version+1"]

  # --- InventoryDay ---
  - method: POST
    path: "/inventory-days"
    description: "Create an inventory day for a stay_date (room_type_id in body)"
    roles: [RevenueManager]
    code: 201
    input: [room_type_id, stay_date, "physical_capacity?", "transient_sold_rooms?", "transient_revenue?"]
    output: InventoryDay
    side_effects: ["group_held_rooms=0; rooms_sold/rooms_available computed; version=1"]

  - method: GET
    path: "/inventory-days/{id}"
    description: "Get an inventory day with computed availability"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: InventoryDay
    side_effects: ["Recompute availability"]

  - method: GET
    path: "/inventory-days"
    description: "List inventory days (filtered list for FK RoomType)"
    roles: [RevenueManager, GroupSalesManager, ChannelManager, Analyst]
    code: 200
    input: ["room_type_id?", "stay_date?", "limit?", "offset?"]
    output: InventoryDay[]
    side_effects: []

  - method: PATCH
    path: "/inventory-days/{id}"
    description: "Update transient sold rooms / revenue / capacity for a night"
    roles: [RevenueManager]
    code: 200
    input: ["physical_capacity?", "transient_sold_rooms?", "transient_revenue?"]
    output: InventoryDay
    side_effects: ["Recompute availability; oversell ceiling enforced; version+1"]

  - method: GET
    path: "/inventory-days/{id}/forecast"
    description: "Computed read: pickup/demand forecast for the night; method=SNAPSHOT_PACE (default) | TRAILING_PICKUP"
    roles: [RevenueManager, Analyst]
    code: 200
    input: ["method?"]
    output: "{ forecast_final_sold: integer, forecast_occupancy_pct: number, method: string }"
    side_effects: ["Recompute pickup_forecast"]

  # --- YieldRule ---
  - method: POST
    path: "/yield-rules"
    description: "Create a yield rule for the property (property_id in body)"
    roles: [RevenueManager]
    code: 201
    input: [property_id, name, occupancy_threshold_pct, adjustment_pct, priority, "enabled?"]
    output: YieldRule
    side_effects: ["version=1"]

  - method: GET
    path: "/yield-rules/{id}"
    description: "Get a yield rule"
    roles: [RevenueManager, Analyst]
    code: 200
    input: []
    output: YieldRule
    side_effects: []

  - method: GET
    path: "/yield-rules"
    description: "List yield rules (filtered list for FK Property)"
    roles: [RevenueManager, Analyst]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: YieldRule[]
    side_effects: []

  # --- RateDecision ---
  - method: POST
    path: "/rate-decisions"
    description: "Create a DRAFT rate decision for a stay_date (rate_plan_id in body)"
    roles: [RevenueManager]
    code: 201
    input: [rate_plan_id, stay_date, requested_rate]
    output: RateDecision
    side_effects: ["status=DRAFT; yielded_rate=null; version=1"]

  - method: GET
    path: "/rate-decisions/{id}"
    description: "Get a rate decision"
    roles: [RevenueManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: RateDecision
    side_effects: []

  - method: GET
    path: "/rate-decisions"
    description: "List rate decisions (filtered list for FK RatePlan and for the computed applied_yield_rule_id)"
    roles: [RevenueManager, ChannelManager, Analyst]
    code: 200
    input: ["rate_plan_id?", "stay_date?", "applied_yield_rule_id?", "limit?", "offset?"]
    output: RateDecision[]
    side_effects: []

  - method: POST
    path: "/rate-decisions/{id}/publish"
    description: "Publish a DRAFT rate decision (applies yield rules, syncs channels for master BAR, refreshes KPI). OCC on RatePlan.version."
    roles: [RevenueManager]
    code: 200
    input: [expected_rate_plan_version]
    output: RateDecision
    side_effects:
      - "Compute rate_yield -> yielded_rate, applied_yield_rule_id, last_room_premium_applied"
      - "RatePlan.published_rate=this.yielded_rate; increments RatePlan.version by 1"
      - "Prior PUBLISHED decision on same (plan, stay_date) -> SUPERSEDED"
      - "Master BAR only: ChannelMapping channel_rate/parity_status recomputed (channel_sync)"
      - "Property KPI recomputed (property_kpi)"

  - method: POST
    path: "/rate-decisions/{id}/reject"
    description: "Reject a DRAFT rate decision"
    roles: [RevenueManager]
    code: 200
    input: ["reject_reason?"]
    output: RateDecision
    side_effects: ["status->REJECTED; published_rate unchanged; no sync; no KPI recompute"]

  # --- ChannelMapping ---
  - method: POST
    path: "/channel-mappings"
    description: "Map a rate plan to a distribution channel (rate_plan_id in body)"
    roles: [ChannelManager]
    code: 201
    input: [rate_plan_id, channel, "markup_pct?", "manual_rate_override?"]
    output: ChannelMapping
    side_effects: ["channel_rate synced from published_rate (or override) if available; parity computed; version=1"]

  - method: GET
    path: "/channel-mappings/{id}"
    description: "Get a channel mapping"
    roles: [ChannelManager, RevenueManager, Analyst]
    code: 200
    input: []
    output: ChannelMapping
    side_effects: []

  - method: GET
    path: "/channel-mappings"
    description: "List channel mappings (filtered list for FK RatePlan)"
    roles: [ChannelManager, RevenueManager, Analyst]
    code: 200
    input: ["rate_plan_id?", "channel?", "limit?", "offset?"]
    output: ChannelMapping[]
    side_effects: []

  - method: PATCH
    path: "/channel-mappings/{id}"
    description: "Update a channel mapping's markup or manual_rate_override; re-syncs channel_rate and recomputes parity_status"
    roles: [ChannelManager]
    code: 200
    input: ["markup_pct?", "manual_rate_override?"]
    output: ChannelMapping
    side_effects: ["Recompute channel_sync (channel_rate, parity_status); version+1"]

  # --- GroupBlock ---
  - method: POST
    path: "/group-blocks"
    description: "Create a group block request (NEGOTIATING) (room_type_id in body)"
    roles: [GroupSalesManager]
    code: 201
    input: [room_type_id, group_name, arrival_date, nights, rooms_per_night, offered_rate]
    output: GroupBlock
    side_effects: ["status=NEGOTIATING; displacement_cost/recommendation null; version=1"]

  - method: GET
    path: "/group-blocks/{id}"
    description: "Get a group block"
    roles: [GroupSalesManager, RevenueManager, Analyst]
    code: 200
    input: []
    output: GroupBlock
    side_effects: []

  - method: GET
    path: "/group-blocks"
    description: "List group blocks (filtered list for FK RoomType)"
    roles: [GroupSalesManager, RevenueManager, Analyst]
    code: 200
    input: ["room_type_id?", "status?", "limit?", "offset?"]
    output: GroupBlock[]
    side_effects: []

  - method: PATCH
    path: "/group-blocks/{id}"
    description: "Revise a group block's offered_rate and/or rooms_per_night (REVISION_REQUESTED -> NEGOTIATING)"
    roles: [GroupSalesManager]
    code: 200
    input: ["offered_rate?", "rooms_per_night?"]
    output: GroupBlock
    side_effects: ["status REVISION_REQUESTED->NEGOTIATING; displacement_cost/recommendation reset to null; version+1"]

  - method: POST
    path: "/group-blocks/{id}/evaluate"
    description: "Run group-displacement analysis; method=LRV (default) | FORECAST_REV"
    roles: [RevenueManager]
    code: 200
    input: ["method?"]
    output: GroupBlock
    side_effects: ["Set displacement_cost and recommendation via group_displacement; version+1"]

  - method: POST
    path: "/group-blocks/{id}/request-revision"
    description: "Request a revision on a NEGOTIATING block that evaluated to REJECT"
    roles: [RevenueManager]
    code: 200
    input: []
    output: GroupBlock
    side_effects: ["status NEGOTIATING->REVISION_REQUESTED; version+1"]

  - method: POST
    path: "/group-blocks/{id}/commit"
    description: "Commit an ACCEPT-evaluated block, holding inventory. OCC on RoomType.version."
    roles: [GroupSalesManager]
    code: 200
    input: [expected_room_type_version]
    output: GroupBlock
    side_effects:
      - "status NEGOTIATING->COMMITTED"
      - "Each overlapping InventoryDay: group_held_rooms += rooms_per_night; recompute availability"
      - "Increments RoomType.version by 1"
      - "Property KPI recomputed"

  - method: POST
    path: "/group-blocks/{id}/cancel"
    description: "Cancel a block (COMMITTED->CANCELLED releasing inventory; NEGOTIATING/REVISION_REQUESTED->LOST)"
    roles: [GroupSalesManager]
    code: 200
    input: []
    output: GroupBlock
    side_effects: ["If COMMITTED: each overlapping InventoryDay group_held_rooms -= rooms_per_night; recompute availability; Property KPI recomputed. If NEGOTIATING/REVISION_REQUESTED: -> LOST, no inventory change"]

  # --- CompetitorRate ---
  - method: POST
    path: "/competitor-rates"
    description: "Record a competitor rate-shop snapshot (immutable) (property_id in body)"
    roles: [RevenueManager, ChannelManager]
    code: 201
    input: [property_id, competitor_name, stay_date, shopped_rate, shopped_at]
    output: CompetitorRate
    side_effects: []

  - method: GET
    path: "/competitor-rates/{id}"
    description: "Get a competitor rate snapshot"
    roles: [RevenueManager, ChannelManager, Analyst]
    code: 200
    input: []
    output: CompetitorRate
    side_effects: []

  - method: GET
    path: "/competitor-rates"
    description: "List competitor rate snapshots (filtered list for FK Property)"
    roles: [RevenueManager, ChannelManager, Analyst]
    code: 200
    input: ["property_id?", "stay_date?", "limit?", "offset?"]
    output: CompetitorRate[]
    side_effects: []

  # --- TransientReservation ---
  - method: POST
    path: "/transient-reservations"
    description: "Create a transient (non-group) reservation in HELD (room_type_id and rate_plan_id in body)"
    roles: [RevenueManager]
    code: 201
    input: [room_type_id, rate_plan_id, arrival_date, nights, rooms]
    output: TransientReservation
    side_effects: ["status=HELD; booked_rate=null; no inventory consumed yet; version=1"]

  - method: GET
    path: "/transient-reservations/{id}"
    description: "Get a transient reservation"
    roles: [RevenueManager, Analyst]
    code: 200
    input: []
    output: TransientReservation
    side_effects: []

  - method: GET
    path: "/transient-reservations"
    description: "List transient reservations (filtered list for FKs RoomType and RatePlan)"
    roles: [RevenueManager, Analyst]
    code: 200
    input: ["room_type_id?", "rate_plan_id?", "status?", "limit?", "offset?"]
    output: TransientReservation[]
    side_effects: []

  - method: POST
    path: "/transient-reservations/{id}/confirm"
    description: "Confirm a HELD reservation, consuming transient inventory; captures booked_rate from the plan's published_rate"
    roles: [RevenueManager]
    code: 200
    input: []
    output: TransientReservation
    side_effects:
      - "status HELD->CONFIRMED; booked_rate=RatePlan.published_rate"
      - "Each overlapping InventoryDay: transient_sold_rooms += rooms; transient_revenue += rooms*booked_rate; recompute availability"
      - "Property KPI recomputed"

  - method: POST
    path: "/transient-reservations/{id}/check-out"
    description: "Check out a CONFIRMED reservation (terminal)"
    roles: [RevenueManager]
    code: 200
    input: []
    output: TransientReservation
    side_effects: ["status CONFIRMED->CHECKED_OUT; transient counts retained"]

  - method: POST
    path: "/transient-reservations/{id}/cancel"
    description: "Cancel a reservation (HELD or CONFIRMED); CONFIRMED releases transient inventory"
    roles: [RevenueManager]
    code: 200
    input: []
    output: TransientReservation
    side_effects: ["status->CANCELLED; if was CONFIRMED: each overlapping InventoryDay transient_sold_rooms -= rooms, transient_revenue -= rooms*booked_rate, recompute availability, Property KPI recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource does not exist or is not nested under the given parent" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, numeric out of range, ceiling_rate < floor_rate" }
  - { id: ERR_DUPLICATE_ROOM_TYPE_CODE, http: 409, condition: "RoomType.code already used within the property" }
  - { id: ERR_MASTER_BAR_EXISTS, http: 409, condition: "A second RatePlan with is_master_bar=true on the same RoomType" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PLAN_CLOSED, http: 409, condition: "Rate decision create/publish on a CLOSED RatePlan" }
  - { id: ERR_LOS_VIOLATION, http: 422, condition: "Stay length violates the rate plan's min_los/max_los control" }
  - { id: ERR_MISSING_INVENTORY_DAY, http: 409, condition: "No InventoryDay exists for a night required by group evaluate/commit or rate publish" }
  - { id: ERR_NOT_EVALUATED, http: 409, condition: "Group commit/request-revision before a displacement evaluation produced a recommendation" }
  - { id: ERR_OVERSELL_LIMIT_EXCEEDED, http: 409, condition: "An operation would push rooms_sold above the night's oversell ceiling" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_RATE_NOT_PUBLISHED, http: 409, condition: "Confirming a transient reservation whose RatePlan has no published_rate yet (no PUBLISHED decision)" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "A foreign key in the request body (property_id, room_type_id, rate_plan_id) references a non-existent or cross-property resource" }
  - { id: ERR_DUPLICATE_INVENTORY_DAY, http: 409, condition: "An InventoryDay already exists for the same (room_type_id, stay_date)" }
  - { id: ERR_CHANNEL_ALREADY_MAPPED, http: 409, condition: "A ChannelMapping for the same (rate_plan_id, channel) already exists" }
  - { id: ERR_INVALID_LOS_BAND, http: 422, condition: "RatePlan created with max_los > 0 and max_los < min_los" }
  - { id: ERR_RATE_BELOW_FLOOR, http: 422, condition: "A RateDecision created with requested_rate below the plan's floor_rate (rejected at create, before yield)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RevenueManager
    description: "Owns rate strategy: properties, room types, rate plans, inventory days, yield rules, rate decisions, group displacement evaluation, competitor rate entry."
    identity: opaque
    exclusive_operations:
      - "POST /properties — create property"
      - "POST /room-types — create room type"
      - "POST /rate-plans — create rate plan"
      - "POST /rate-plans/{id}/close — close plan"
      - "POST /inventory-days — create inventory day"
      - "PATCH /inventory-days/{id} — update transient sell/capacity"
      - "POST /yield-rules — create yield rule"
      - "POST /rate-decisions — create rate decision"
      - "POST /rate-decisions/{id}/publish — publish (OCC)"
      - "POST /rate-decisions/{id}/reject — reject decision"
      - "POST /group-blocks/{id}/evaluate — run displacement analysis"
      - "POST /group-blocks/{id}/request-revision — request group revision"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /competitor-rates — record competitor shop (shared with ChannelManager)"

  - name: GroupSalesManager
    description: "Owns the group-block lifecycle: create, revise, commit, cancel."
    identity: opaque
    exclusive_operations:
      - "POST /group-blocks — create group block"
      - "PATCH /group-blocks/{id} — revise group block"
      - "POST /group-blocks/{id}/commit — commit (OCC)"
      - "POST /group-blocks/{id}/cancel — cancel/lose block"
    shared_operations:
      - "GET (group-block, room-type, property, kpi reads)"

  - name: ChannelManager
    description: "Owns distribution: channel mappings and parity, competitor rate entry."
    identity: opaque
    exclusive_operations:
      - "POST /channel-mappings — create channel mapping"
    shared_operations:
      - "GET (channel-mapping, rate-plan, property, competitor-rate reads)"
      - "POST /competitor-rates — record competitor shop (shared with RevenueManager)"

  - name: Analyst
    description: "Read-only consumer of KPIs, forecasts, yield rules, decisions, blocks."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints incl. /kpis and /forecast)"
