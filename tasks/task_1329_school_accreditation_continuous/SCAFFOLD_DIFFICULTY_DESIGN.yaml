          - validations[priority=6]
        distinguishing_aspect: |
          Interval semantics B — instant-membership against a half-open window
          [opens_at, closes_at) on the SurveyWindow resource: a response exactly
          at closes_at is rejected (instant outside the half-open interval),
          while a response exactly at opens_at is accepted. Different resource
