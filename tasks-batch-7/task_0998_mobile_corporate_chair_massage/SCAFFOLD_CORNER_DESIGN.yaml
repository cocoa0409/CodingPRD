scaffold_corner_design:
  # ==================================================================
  # Section: entities — creation / retrieval / not-found / required /
  # defaults / computed / system / enum / immutability / FK topology
  # ==================================================================
  - section: entities
    instances:
      - name: create_region_returns_201_and_system_fields
        claim_type: creation
        grounds:
          - "entities.Region"
          - "endpoints.POST /chair-massage/regions"
        distinguishing_aspect: "Creating a Region with all required inputs returns 201 and server-stamped id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /chair-massage/regions", payload: { code: "SF", name: "SF", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id", v: "$.data.version" } }
          assert:
            - "HTTP 201"
            - "Region.id is a non-empty UUID"
            - "Region.version == 1"
            - "Region.is_active defaults to true (omitted in payload)"

      - name: get_region_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - "entities.Region"
          - "endpoints.GET /chair-massage/regions/{id}"
        distinguishing_aspect: "GET /regions/{id} returns the entity whose id matches."
        test_recipe:
          setup: ["Region exists"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "SF", name: "SF", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
          trigger:
            - { call: "GET /chair-massage/regions/${rid}", payload: {}, as: PlatformAdmin }
          assert:
            - "HTTP 200"
            - "data.id == ${rid}"
            - "data.code == 'SF'"

      - name: get_region_missing_id_returns_404
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]", endpoints."GET /chair-massage/regions/{id}'
        distinguishing_aspect: "GET /regions/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /chair-massage/regions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_corporate_account_missing_billing_email_returns_400
        claim_type: required_fields
        grounds:
          - "entities.CorporateAccount.fields.billing_email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required field billing_email returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Region R0 exists"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
          trigger:
            - call: "POST /chair-massage/corporate-accounts"
              payload: { company_name: "X", region_id: "${rid}", credit_limit_cents: 1000 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_booking_window_not_divisible_returns_422
        claim_type: type_constraints
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_WINDOW_NOT_DIVISIBLE]"
        distinguishing_aspect: "window_duration_minutes=70 with slot_minutes=15 violates the divisibility constraint."
        test_recipe:
          setup: ["Region R0, ACME account"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "X", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
          trigger:
            - call: "POST /chair-massage/bookings"
              payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 70, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }
              as: Organizer
              as_user_id: "${aid}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == ERR_WINDOW_NOT_DIVISIBLE"

      - name: satisfaction_survey_common_fields_false_no_update
        claim_type: immutability
        grounds:
          - "entities.SatisfactionSurvey"
        distinguishing_aspect: "SatisfactionSurvey has common_fields=false: no update endpoint exists, no version field."
        test_recipe:
          setup: ["Full pipeline: one COMPLETED claim"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "A", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { tid: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${tid}", region_id: "${rid}", license_number: "L", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${aid}", captures: { bk: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}/chair-slots", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/assign", payload: { therapist_id: "${tid}" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { bk_v: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk}/confirm", payload: { expected_booking_version: "${bk_v}" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/chair-slots/${cs}/depart", payload: {}, as: Therapist, as_user_id: "${tid}" }
            - { call: "POST /chair-massage/chair-slots/${cs}/arrive", payload: {}, as: Therapist, as_user_id: "${tid}" }
            - { call: "POST /chair-massage/bookings/${bk}/start-service", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/chair-slots/${cs}", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/claims", payload: { recipient_name: "R", recipient_email: "r@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${aid}", captures: { cl: "$.data.id" } }
            - { call: "POST /chair-massage/slot-claims/${cl}/waiver", payload: { booking_id: "${bk}", signer_email: "r@x", signature_payload: "s" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "POST /chair-massage/slot-claims/${cl}/check-in", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "POST /chair-massage/slot-claims/${cl}/complete", payload: {}, as: Therapist, as_user_id: "${tid}" }
          trigger:
            - { call: "POST /chair-massage/slot-claims/${cl}/satisfaction-surveys", payload: { rating: 5, comment: "great" }, as: Organizer, as_user_id: "${aid}", captures: { sv_id: "$.data.id", sv_ver: "$.data.version" } }
          assert:
            - "HTTP 201"
            - "SatisfactionSurvey response has NO version field (common_fields: false)"
            - "SatisfactionSurvey response has id, created_at only"

      - name: create_slot_claim_response_includes_computed_fields
        claim_type: computed_fields
        grounds:
          - "entities.SlotClaim.fields.slot_ordinal"
          - "entities.SlotClaim.fields.start_offset_minutes"
        distinguishing_aspect: "slot_ordinal and start_offset_minutes are computed by the server; client-supplied values ignored."
        test_recipe:
          setup: ["Booking in SCHEDULING with chair assigned"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "A", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { tid: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${tid}", region_id: "${rid}", license_number: "L", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${aid}", captures: { bk: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}/chair-slots", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/assign", payload: { therapist_id: "${tid}" }, as: Organizer, as_user_id: "${aid}" }
          trigger:
            - { call: "GET /chair-massage/chair-slots/${cs}", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/claims", payload: { recipient_name: "R", recipient_email: "r@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${aid}", captures: { cl_ordinal: "$.data.slot_ordinal", cl_offset: "$.data.start_offset_minutes" } }
          assert:
            - "slot_ordinal == 0"
            - "start_offset_minutes == 0"

  # ==================================================================
  # Section: state_machines — invalid transitions, terminal lockdown
  # ==================================================================
  - section: state_machines
    instances:
      - name: cancel_booking_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Booking"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is terminal; cancel must fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["Booking driven to COMPLETED (no claims)"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "A", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { tid: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${tid}", region_id: "${rid}", license_number: "L", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${aid}", captures: { bk: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}/chair-slots", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/assign", payload: { therapist_id: "${tid}" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { bk_v: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk}/confirm", payload: { expected_booking_version: "${bk_v}" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/chair-slots/${cs}/depart", payload: {}, as: Therapist, as_user_id: "${tid}" }
            - { call: "POST /chair-massage/chair-slots/${cs}/arrive", payload: {}, as: Therapist, as_user_id: "${tid}" }
            - { call: "POST /chair-massage/bookings/${bk}/start-service", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "POST /chair-massage/bookings/${bk}/complete", payload: {}, as: Organizer, as_user_id: "${aid}" }
          trigger:
            - call: "POST /chair-massage/bookings/${bk}/cancel"
              payload: {}
              as: Organizer
              as_user_id: "${aid}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: license_terminal_revoked_cannot_be_reinstated
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.TherapistLicense"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "REVOKED is terminal; reinstate from REVOKED fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["License L1 REVOKED"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { tid: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${tid}", region_id: "${rid}", license_number: "L", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin, captures: { lid: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses/${lid}/revoke", payload: {}, as: PlatformAdmin }
          trigger:
            - call: "POST /chair-massage/therapist-licenses/${lid}/reinstate"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: booking_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.Booking"
        distinguishing_aspect: "Freshly created Booking has status=DRAFT, billing_status=UNBILLED."
        test_recipe:
          setup: ["Region, account exist"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "A", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
          trigger:
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${aid}", captures: { bk_status: "$.data.status", bk_billing: "$.data.billing_status" } }
          assert:
            - "status == DRAFT"
            - "billing_status == UNBILLED"

      - name: chair_slot_assign_from_assigned_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ChairSlot"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Re-assigning an already ASSIGNED ChairSlot is rejected (must release first)."
        test_recipe:
          setup: ["Chair cs0 ASSIGNED to T1; second therapist T2 also licensed"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "A", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T1", email: "t1@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { t1: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T2", email: "t2@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { t2: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1}", region_id: "${rid}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t2}", region_id: "${rid}", license_number: "L2", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${aid}", captures: { bk: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}/chair-slots", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/assign", payload: { therapist_id: "${t1}" }, as: Organizer, as_user_id: "${aid}" }
          trigger:
            - call: "POST /chair-massage/chair-slots/${cs}/assign"
              payload: { therapist_id: "${t2}" }
              as: Organizer
              as_user_id: "${aid}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"
            - "ChairSlot.therapist_id unchanged (still T1)"

      - name: slot_claim_check_in_requires_booking_in_progress
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.SlotClaim.CLAIMED_to_CHECKED_IN"
        distinguishing_aspect: "Check-in while Booking.status == CONFIRMED (not yet IN_PROGRESS) is rejected."
        test_recipe:
          setup: ["Booking CONFIRMED (not started); claim with waiver"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "A", billing_email: "a@x", region_id: "${rid}", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { aid: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${rid}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { tid: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${tid}", region_id: "${rid}", license_number: "L", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${aid}", region_id: "${rid}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${aid}", captures: { bk: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}/chair-slots", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/assign", payload: { therapist_id: "${tid}" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/chair-slots/${cs}", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs}/claims", payload: { recipient_name: "R", recipient_email: "r@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${aid}", captures: { cl: "$.data.id" } }
            - { call: "POST /chair-massage/slot-claims/${cl}/waiver", payload: { booking_id: "${bk}", signer_email: "r@x", signature_payload: "s" }, as: Organizer, as_user_id: "${aid}" }
            - { call: "GET /chair-massage/bookings/${bk}", payload: {}, as: Organizer, as_user_id: "${aid}", captures: { bk_v: "$.data.version" } }
