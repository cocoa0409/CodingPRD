  - rule_id: compensating_invariant
    instances:
      - name: feed_slot_ledger_returns_to_zero_after_cancel_and_frees_full_capacity
        grounds:
          - calculations.feed_slot_reservation_ledger
          - state_machines.SyndicationJob.QUEUED_to_CANCELLED
          - entities.Retailer.fields.feed_slots_reserved
          - validations[priority=45]
          - concurrency_rules[job-create-stale-retailer]
        distinguishing_aspect: |
          Cancelling the 6-slot job must return feed_slots_reserved to exactly 0, not merely decrement
          a counter, and the proof is that a following 10-slot queue against a capacity of 10 is
          accepted: any leaked slot would make 10 exceed the remaining capacity and raise
          ERR_FEED_CAPACITY_EXCEEDED. Retailer.version still advances on all three writes.
        test_recipe:
          setup:
            - "Retailer BigBox is ACTIVE with min_image_count 4, feed_slot_capacity 10, max_concurrent_feed_windows 2 and three REQUIRED requirement rows (title weight 40, description weight 30, brand weight 10), so the completeness denominator D == 80 + IMAGE_WEIGHT 20 == 100"
