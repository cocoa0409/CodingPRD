              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "response status == 409 (terminal-state precondition fails at priority 5, before the OCC check at priority 21)"

      - name: appraisal_supersede_on_reappraisal
        claim_type: Side Effect Execution
        grounds: [state_machines.Appraisal.VALID_to_SUPERSEDED, entities.Appraisal.fields.status]
        distinguishing_aspect: "Attaching a newer VALID appraisal to the same item via ADD_ITEM/re-appraise flips the prior appraisal to SUPERSEDED."
        test_recipe:
          setup: ["A Policyholder with two appraisals filed for the same item description; first appraisal attached to a scheduled item, then a newer appraisal attached via endorsement re-appraise."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "s7@x.com", full_name: "S7", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /appraisals"
              payload: { policyholder_id: "${ph}", appraised_value_cents: 2000000, effective_date_iso: "2026-01-10T00:00:00Z" }
              as: Appraiser
              captures: { ap1: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Big ring", category: "RING", location_zip: "10001", scheduled_value_cents: 2000000, appraisal_id: "${ap1}" }
              as: Underwriter
              captures: { it: $.data.id }
            - call: "POST /appraisals"
              payload: { policyholder_id: "${ph}", appraised_value_cents: 2200000, effective_date_iso: "2026-01-20T00:00:00Z" }
              as: Appraiser
              captures: { ap2: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Big ring", category: "RING", location_zip: "10001", scheduled_value_cents: 2200000, appraisal_id: "${ap2}" }
              as: Underwriter
              captures: { it2: $.data.id }
          trigger:
            - call: "GET /appraisals/${ap1}"
              payload: {}
              as: Underwriter
          assert:
            - "Appraisal.${ap1}.status == SUPERSEDED"
            - "Appraisal.${ap2}.status == VALID"

      - name: error_info_request_limit_on_third_request
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.UNDER_REVIEW_to_INFO_REQUESTED, "errors[ERR_INFO_REQUEST_LIMIT]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_cyclic_review_loop_bounded
          rationale: "The MAX_INFO_REQUESTS boundary and ERR_INFO_REQUEST_LIMIT are asserted as the trigger of the named §1.8 cyclic-machine instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: partial_damage_in_network_deductible_halving
        claim_type: Correct Result
        grounds: [calculations.claim_settlement, entities.RepairShop.fields.in_network]
        distinguishing_aspect: "A PARTIAL_DAMAGE claim (RING cv 1,000,000, STANDARD ded 50,000, claimed 300,000) repaired in-network halves the deductible to 25,000, so settlement_cents==275,000."
        test_recipe:
          setup: ["ACTIVE policy; PARTIAL_DAMAGE claim approved; settlement computed with in-network deductible halving."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /repair-shops"
              payload: { name: "InNet", service_zip: "10005", in_network: true }
              as: Underwriter
              captures: { shop: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "c1@x.com", full_name: "C1", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
