              as: MediaBuyer
              captures: { flight_id: $.data.id }
            - call: "POST /media-flights/${flight_id}/activate"
              as: MediaBuyer
          trigger:
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "FLAG", note: "salary range no longer accurate" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
          assert:
            - "Hop 1 - JobPosting.${posting_id}.compliance_status == FLAGGED and cleared_by_user_id == null"
            - "Hop 2 - JobPosting.${posting_id}.content_status == SUSPENDED and suspended_reason == COMPLIANCE_FLAG"
            - "Hop 3 - MediaFlight.${flight_id}.state == SUSPENDED_CONTENT, release_reason == COMPLIANCE_SUSPENSION, reserved_cents == 0"
            - "Hop 4 - Channel.${ch1_id}.active_flight_count == 0, pacing_status == IDLE, idle_since == 2026-08-01T00:00:00Z"
            - "Hop 5 - exactly one new BudgetLedgerEntry with entry_type RELEASE, bucket FAMILY_DEDICATED, delta_cents -360500"
            - "Program.${program_id}.committed_budget_cents == 0, available_budget_cents back to its pre-reservation value, JobFamily.${family_id}.reserved_cents == 0 and dedicated_available_cents == 500000"
            - "A POST /media-flights/${flight_id}/resume immediately after the cascade fails 409 with ERR_POSTING_NOT_PUBLISHED - the posting is SUSPENDED and flights are never auto-resumed"

  # =========================================================================
  # Rule 5 - priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: flight_state_error_outranks_compliance_gate_on_activate
        grounds:
          - validations[priority=16].ERR_FLIGHT_NOT_RESERVED
          - validations[priority=25].ERR_POSTING_COMPLIANCE_NOT_CLEARED
          - validations[priority=31].ERR_POSTING_NOT_PUBLISHED
          - endpoints["POST /media-flights/{flightId}/activate"]
        distinguishing_aspect: |
          One activate request violates a state rule (priority 16, category state) and a
          business_safety rule (priority 25) at the same time: the flight was cancelled and the
          posting it points at has been flagged and suspended. Only ERR_FLIGHT_NOT_RESERVED may
          surface. A control call on a sibling flight that is genuinely RESERVED proves the
          compliance condition was live all along - it returns ERR_POSTING_COMPLIANCE_NOT_CLEARED
          (priority 25) and not ERR_POSTING_NOT_PUBLISHED (priority 31), even though the posting
          also fails the publication test.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with all pools 0 and a JobFamily whose dedicated_budget_cents is 1000000."
            - "Channel Board A (JOB_BOARD), daily_capacity_cents 100000, min_flight_days 1."
            - "One PUBLISHED, CLEARED JobPosting with an APPROVED persona."
            - "Flight A over 2026-08-01 -> 2026-08-08 at 50000 per day (total 360500), then CANCELLED - cancelled flights leave the overlap and capacity windows free."
            - "The posting is then FLAGGED, which suspends it; no flight was ACTIVE so cascade hops 3-5 are no-ops."
            - "Flight B is reserved afterwards over the very same window, which succeeds precisely because Flight A is terminal."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 0, pool_social_cents: 0, pool_programmatic_cents: 0, flex_reserve_cents: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 1000000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv1: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${pv1}" }
              as: MediaBuyer
              captures: { flight_a_id: $.data.id }
            - call: "POST /media-flights/${flight_a_id}/cancel"
              payload: { reason: "buyer error" }
              as: MediaBuyer
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "FLAG", note: "pay range is stale" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv2: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${pv2}" }
              as: MediaBuyer
              captures: { flight_b_id: $.data.id }
          trigger:
            - call: "POST /media-flights/${flight_a_id}/activate"
              as: MediaBuyer
            - call: "POST /media-flights/${flight_b_id}/activate"
              as: MediaBuyer
          assert:
            - "Trigger call 1 returns 409 with error_id ERR_FLIGHT_NOT_RESERVED - the priority-16 state rule wins over the priority-25 compliance rule that the same request also violates"
            - "Trigger call 1 does not return ERR_POSTING_COMPLIANCE_NOT_CLEARED, ERR_POSTING_NOT_PUBLISHED or ERR_BRAND_HEALTH_GATE"
            - "MediaFlight.${flight_a_id}.state == CANCELLED and activated_at == null after trigger call 1"
            - "Trigger call 2 returns 409 with error_id ERR_POSTING_COMPLIANCE_NOT_CLEARED - priority 25 outranks the priority-31 ERR_POSTING_NOT_PUBLISHED that the SUSPENDED posting also triggers"
            - "MediaFlight.${flight_b_id}.state == RESERVED and reserved_cents == 360500 after trigger call 2 - a rejected activate mutates nothing"
            - "Channel.${ch1_id}.active_flight_count == 0 and Program.${program_id}.committed_budget_cents == 360500 (Flight B only)"

      - name: dispatch_consent_safety_outranks_send_quota_fiscal
        grounds:
          - validations[priority=26].ERR_NO_CONSENTED_AUDIENCE
          - validations[priority=49].ERR_SEND_QUOTA_EXCEEDED
          - calculations.nurture_dispatch_selection
          - state_machines.NurtureCampaign.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: |
          A different category pair - business_safety (priority 26) against business_fiscal
          (priority 49) - collides on POST /nurture-campaigns/{id}/dispatch: the only audience
          member is PAUSED and the campaign's max_sends of 5 exceeds the program's remaining send
          quota of 2. The consent-safety error must win. Resuming the member removes only the
          priority-26 failure, after which the very same request surfaces
          ERR_SEND_QUOTA_EXCEEDED, proving both rules were simultaneously violated and correctly
          ordered rather than one masking the other by accident.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with send_quota_total 2 and send_quota_used 0."
            - "One TalentCommunityMember with frequency_cap_per_30d 4 who confirms consent and is then PAUSED, so the eligible audience is non-empty but contains no SUBSCRIBED member."
            - "One NurtureCampaign for the whole program with max_sends 5, scheduled for exactly 2026-08-01T00:00:00Z so the dispatch-window check passes."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", send_quota_total: 2 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "paused@example.com", frequency_cap_per_30d: 4 }
              as: Anonymous
              captures: { member_id: $.data.id, member_token: $.data.consent_token }
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "${member_token}" }
              as: Anonymous
            - call: "POST /talent-community-members/${member_id}/consent-change"
              payload: { action: "PAUSE" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns"
              payload: { program_id: "${program_id}", name: "August talent digest", max_sends: 5 }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { campaign_id: $.data.id }
            - call: "POST /nurture-campaigns/${campaign_id}/schedule"
              payload: { scheduled_for: "2026-08-01T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /nurture-campaigns/${campaign_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /talent-community-members/${member_id}/consent-change"
              payload: { action: "RESUME" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns/${campaign_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Trigger call 1 returns 409 with error_id ERR_NO_CONSENTED_AUDIENCE, not ERR_SEND_QUOTA_EXCEEDED"
            - "After trigger call 1: NurtureCampaign.${campaign_id}.state == SCHEDULED, audience_size == 0, sent_count == 0, suppressed_consent_count == 0, no NurtureSend row exists and Program.${program_id}.send_quota_used == 0"
            - "Trigger call 2 returns 200 with TalentCommunityMember.${member_id}.consent_status == SUBSCRIBED"
            - "Trigger call 3 returns 409 with error_id ERR_SEND_QUOTA_EXCEEDED - max_sends 5 exceeds send_quota_total 2 minus send_quota_used 0"
            - "After trigger call 3: NurtureCampaign.${campaign_id}.state is still SCHEDULED, dispatched_at == null and still no NurtureSend row exists"

  # =========================================================================
  # Rule 6 - boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: frequency_cap_suppresses_at_exactly_the_cap_and_window_lower_bound_is_exclusive
        grounds:
          - calculations.nurture_dispatch_selection
          - entities.TalentCommunityMember.fields.frequency_cap_per_30d
          - entities.NurtureSend.fields.window_send_count_at_eval
          - entities.NurtureCampaign.fields.suppressed_frequency_count
          - endpoints["POST /nurture-campaigns/{campaignId}/dispatch"]
        distinguishing_aspect: |
          Two boundaries on the same metric - the 30-day send count - are pinned in one run.
          window_send_count 1 against frequency_cap_per_30d 1 suppresses (the comparison is >=,
          not >), while the same count against a cap of 2 sends. Then the clock moves to exactly
          30 days after the first dispatch, and because the window predicate is
          sent_at > now - 30 days (strictly greater), the day-old-by-exactly-30-days send drops
          out and the capped member becomes sendable again. An implementation using > for the cap
          or >= for the window boundary produces a different sent_count on both dispatches.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with send_quota_total 10."
            - "Two SUBSCRIBED members created in this order: M1 (frequency_cap_per_30d 1) then M2 (frequency_cap_per_30d 2); both have interest_job_family_id null and the campaigns target the whole program, so the audience order is M1 then M2 by created_at ASC."
            - "Campaign 1 (max_sends 2) is scheduled for 2026-08-01T00:00:00Z and dispatched, sending to both members."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", send_quota_total: 10 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "m1@example.com", frequency_cap_per_30d: 1 }
              as: Anonymous
              captures: { m1_id: $.data.id, m1_token: $.data.consent_token }
            - call: "POST /talent-community-members/${m1_id}/confirm-consent"
              payload: { consent_token: "${m1_token}" }
              as: Anonymous
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "m2@example.com", frequency_cap_per_30d: 2 }
              as: Anonymous
              captures: { m2_id: $.data.id, m2_token: $.data.consent_token }
            - call: "POST /talent-community-members/${m2_id}/confirm-consent"
              payload: { consent_token: "${m2_token}" }
              as: Anonymous
            - call: "POST /nurture-campaigns"
              payload: { program_id: "${program_id}", name: "Wave 1", max_sends: 2 }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /nurture-campaigns/${c1_id}/schedule"
              payload: { scheduled_for: "2026-08-01T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns/${c1_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns"
              payload: { program_id: "${program_id}", name: "Wave 2", max_sends: 2 }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { c2_id: $.data.id }
            - call: "POST /nurture-campaigns/${c2_id}/schedule"
              payload: { scheduled_for: "2026-08-01T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /nurture-campaigns/${c2_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: RecruitingOps
            - call: "POST /nurture-campaigns"
              payload: { program_id: "${program_id}", name: "Wave 3", max_sends: 2 }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { c3_id: $.data.id }
            - call: "POST /nurture-campaigns/${c3_id}/schedule"
              payload: { scheduled_for: "2026-08-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns/${c3_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "After the setup dispatch: NurtureCampaign.${c1_id}.audience_size == 2, sent_count == 2, suppressed_frequency_count == 0; the two NurtureSend rows have sequence_no 1 for M1 and 2 for M2, both with window_send_count_at_eval 0"
            - "Trigger call 1: NurtureCampaign.${c2_id}.audience_size == 2, sent_count == 1, suppressed_frequency_count == 1, suppressed_consent_count == 0"
            - "The M1 NurtureSend of campaign ${c2_id} has outcome SUPPRESSED_FREQUENCY with window_send_count_at_eval 1 and sent_at null - 1 >= 1 suppresses"
            - "The M2 NurtureSend of campaign ${c2_id} has outcome SENT with window_send_count_at_eval 1 - 1 >= 2 is false"
            - "Trigger call 5: NurtureCampaign.${c3_id}.sent_count == 2 and suppressed_frequency_count == 0, because both 2026-08-01T00:00:00Z sends sit exactly at now - 30 days and the predicate sent_at > now - 30 days excludes them"
            - "Both NurtureSend rows of campaign ${c3_id} carry window_send_count_at_eval 0"
            - "TalentCommunityMember.${m1_id}.sent_count_total == 2 and last_sent_at == 2026-08-31T00:00:00Z"
            - "TalentCommunityMember.${m2_id}.sent_count_total == 3 and last_sent_at == 2026-08-31T00:00:00Z"
            - "Program.${program_id}.send_quota_used == 5 (2 + 1 + 2)"

      - name: cpqa_exactly_at_pacing_threshold_stays_on_target_one_cent_over_throttles
        grounds:
          - calculations.channel_cpqa
          - entities.Channel.fields.pacing_status
          - entities.MediaFlight.fields.spent_cents
          - state_machines.MediaFlight.ACTIVE_to_PAUSED_PACING
          - endpoints["POST /media-flights/{flightId}/spend"]
        distinguishing_aspect: |
          A different metric (cost per qualified applicant against the 1.2x pacing threshold) on a
          different endpoint (spend recording). With credited_qualified_bp exactly 10000, spend of
          18000 cents makes cpqa_cents exactly equal the threshold round_half_up(15000 * 12 / 10)
          = 18000, which must stay ON_TARGET because the comparison is strictly greater. One
          additional cent of spend crosses the boundary, flips the channel to THROTTLED and drags
          the ACTIVE flight into PAUSED_PACING. A >= implementation pauses the flight one call too
          early and releases 360500 cents of budget that should still be committed.
