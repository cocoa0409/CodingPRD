          setup_api_calls: []
          trigger:
            - { call: "POST /api/easements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/transition", payload: { to: REQUESTED }, as: ConversionContractor, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN"
  # ============================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_replan_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[trueup-create-stale-project]", "endpoints[POST /api/projects/{id}/replan]"]
        distinguishing_aspect: "Replan carries expected_project_version: first replan succeeds and bumps version 1 -> 2; replaying the stale version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["one project (version 1)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "OCC1", rule20_credit_cents: 0, estimated_total_cost_cents: 1000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /api/projects/${proj}/replan", payload: { new_target_cutover_on: "2027-01-15T00:00:00Z", expected_project_version: "${v1}" }, as: ProgramManager, captures: { v2: "$.data.version", tc: "$.data.target_cutover_on" } }
            - { call: "POST /api/projects/${proj}/replan", payload: { new_target_cutover_on: "2027-02-01T00:00:00Z", expected_project_version: "${v1}" }, as: ProgramManager, captures: { err: "$.data.error_id" } }
          assert:
            - "v2 == 2 and tc == '2027-01-15T00:00:00Z'"
            - "err == ERR_STALE_VERSION on the replayed version"
      - name: permit_lazy_expiry_on_clock_advance
        claim_type: scheduled_actions
        grounds: [state_machines.Permit.ISSUED_to_EXPIRED, entities.Permit.fields.status]
        distinguishing_aspect: "An ISSUED permit whose valid_to has passed flips to EXPIRED lazily when read after the clock advances — no wall-clock dependency."
        test_recipe:
          setup: ["project + permit ISSUED valid 2026-08-01..2026-09-01"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "L1", rule20_credit_cents: 0, estimated_total_cost_cents: 1000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent, captures: { st1: "$.data.status" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: ProgramManager }
            - { call: "GET /api/permits/${perm}", payload: {}, as: RightOfWayAgent, captures: { st2: "$.data.status" } }
          assert:
            - "st1 == ISSUED and st2 == EXPIRED after the clock passes valid_to"
      - name: cascade_side_effects_index
        claim_type: cascading_side_effects
        grounds: [state_machines.UtilityParticipation, state_machines.ChangeOrder]
        excluded_because:
          difficulty_instance: participation_withdrawal_cascade
          rationale: "Both cascade chains asserted hop-by-hop in §1.8 (withdrawal + incorporation)."
      - name: dual_variant_layer_index
        claim_type: dual_variant_calculation
        grounds: [calculations.provisional_cost_share, calculations.depth_separation_requirement]
        excluded_because:
          difficulty_instance: provisional_vs_final_share_divergence
          rationale: "Both variants exercised with literal deltas in §1.8 rule 1."
      - name: derived_field_reconciliation_index
        claim_type: derived_field_reconciliation
        grounds: [entities.Project.fields.posture, entities.UtilityParticipation.fields.variance_flag]
        excluded_because:
          difficulty_instance: change_order_incorporation_cascade
          rationale: "Share/posture recomputation after incorporation asserted with literals in §1.8 rule 4."
  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: transition_response_reflects_new_state_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "The transition response body itself carries the post-mutation state (status COMMITTED, version 2) without a follow-up read."
        test_recipe:
          setup: ["project + INVITED participation"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "IM1", rule20_credit_cents: 0, estimated_total_cost_cents: 1000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 9999, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { st: "$.data.status", v: "$.data.version" } }
          assert:
            - "st == COMMITTED and v == 2 in the same response (immediate consistency, version incremented on mutation)"
  # ============================================================ errors
  - section: errors
    instances:
      - name: restoration_open_blocks_segment_close
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESTORATION_OPEN_BLOCKING]", state_machines.TrenchSegment]
        distinguishing_aspect: "Segment BACKFILLED with an OPEN restoration task cannot CLOSE; after the task is ACCEPTED the close succeeds."
        test_recipe:
          setup: ["mobilized project in TRENCHING; segment BACKFILLED; one restoration task OPEN"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E1", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 9999, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 1, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "13 B St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 50 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: RECORDED }, as: RightOfWayAgent }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 100, max_depth_inches: 60, parcel_ids: ["${parcel}"] }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_TRENCHING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLED }, as: ProgramManager }
            - { call: "POST /api/restoration-tasks", payload: { trench_segment_id: "${seg}", parcel_id: "${parcel}", task_type: LANDSCAPE }, as: ConversionContractor, captures: { rt: "$.data.id" } }
          trigger:
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: CLOSED }, as: ProgramManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/restoration-tasks/${rt}/transition", payload: { to: IN_WORK }, as: ConversionContractor }
            - { call: "POST /api/restoration-tasks/${rt}/transition", payload: { to: COMPLETE }, as: ConversionContractor }
            - { call: "POST /api/restoration-tasks/${rt}/transition", payload: { to: ACCEPTED }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: CLOSED }, as: ProgramManager, captures: { ok: "$.data.status" } }
          assert:
            - "err == ERR_RESTORATION_OPEN_BLOCKING while the task is OPEN"
            - "ok == CLOSED once every restoration task on the segment is ACCEPTED"
      - name: conversion_project_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_VALIDATION]", entities.ServiceConversion.fields.project_id]
        distinguishing_aspect: "project_id that does not match the parcel's project is rejected ERR_VALIDATION (denormalized key must be consistent)."
        test_recipe:
          setup: ["two projects; parcel belongs to project A"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E2A", rule20_credit_cents: 0, estimated_total_cost_cents: 1000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { projA: "$.data.id" } }
            - { call: "POST /api/projects", payload: { name: "E2B", rule20_credit_cents: 0, estimated_total_cost_cents: 1000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { projB: "$.data.id" } }
            - { call: "POST /api/parcels", payload: { project_id: "${projA}", address: "14 B St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 50 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
          trigger:
            - { call: "POST /api/service-conversions", payload: { parcel_id: "${parcel}", project_id: "${projB}" }, as: ConversionContractor, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"
