        distinguishing_aspect: "Three expiry positions against one clock: exactly 30 days out is CLEARED and near-expiry (+10), 30 days plus one second is CLEARED and NOT near-expiry, and an expiry exactly equal to the clock is already ASSET_EXPIRED — so intake reads 25.00 while the audit reads 85.00."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Asset A: RIGHTS_MANAGED, WORLDWIDE, fee 10000, expires 2026-10-01T00:00:00Z (exactly 30 days out)."
            - "Asset C: ROYALTY_FREE, WORLDWIDE, fee 500, expires 2026-10-01T00:00:01Z (one second past the window)."
            - "Asset B: RIGHTS_MANAGED, WORLDWIDE, fee 10000, expires 2026-09-01T00:00:00Z (equal to the clock)."
            - "One DRAFT stem package on an unlocked project; usages A and C are recorded first so no usage is created while the project is RESTRICTED."
