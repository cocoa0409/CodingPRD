  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: register_response_reflects_state_file_number_immediately
        claim_type: immediate
        grounds:
          - state_machines.VitalEvent.FILED_to_REGISTERED
          - entities.VitalEvent.fields.state_file_number
        distinguishing_aspect: "The register response (same request) already carries the minted state_file_number and status REGISTERED — cascades are immediate/atomic."
        test_recipe:
          setup:
            - "A FILED BIRTH event in CTY-59."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H59", facility_type: "HOSPITAL", jurisdiction_code: "CTY-59", npi: "NPI-059" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Im", subject_first_name: "Md", sex: "MALE", jurisdiction_code: "CTY-59", facility_id: "${fac}", place_of_event: "H59" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
          trigger:
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
              captures: { sfn: "$.data.state_file_number", st: "$.data.status" }
          assert:
            - "VitalEvent.${ev}.status == REGISTERED"
            - "VitalEvent.${ev}.state_file_number is non-null in the register response"

