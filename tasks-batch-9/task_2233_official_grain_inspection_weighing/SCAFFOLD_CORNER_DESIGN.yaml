            - "GET /grain-inspection/samples?inspection_request_id=11111111-2222-3333-4444-555555555555 -> 200 with total_count 0 (a filter on an unknown id is an empty list, not a 404)"

      - name: grading_result_sample_must_belong_to_the_named_request
