# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Multi-Tiered System of Supports (MTSS/RTI)
# Breadth coverage of §1.1–§1.7 surface claims NOT exercised by §1.8
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1: Entities (creation, retrieval, listing, defaults, computed fields)
  # ===========================================================================
  - section: entities
    instances:
      - name: district_creation_with_defaults
        claim_type: creation
        grounds:
          - entities.District
        distinguishing_aspect: "Omitting sped_referral_min_weeks and fidelity_threshold_pct applies the documented defaults 12 and 80."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "OnlyName", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_min: $.data.sped_referral_min_weeks, d_fid: $.data.fidelity_threshold_pct }
          trigger: []
          assert:
            - "District.${d_id}.sped_referral_min_weeks == 12"
            - "District.${d_id}.fidelity_threshold_pct == 80"
            - "District.version == 1 and created_at/updated_at populated"

      - name: student_creation_defaults
        claim_type: defaults
        grounds:
          - entities.Student
        distinguishing_aspect: "Student created without subgroup_codes gets [] and current_tier=TIER_1, weeks_at_tier3_unresponsive=0."
        test_recipe:
          setup: ["District and School exist"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "NewKid", grade_level: 2 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id, st_tier: $.data.current_tier, st_weeks: $.data.weeks_at_tier3_unresponsive, st_subs: $.data.subgroup_codes }
          assert:
            - "Student.current_tier == 'TIER_1'"
            - "Student.weeks_at_tier3_unresponsive == 0"
            - "Student.subgroup_codes == []"

      - name: interventionist_committed_minutes_computed_default_zero
        claim_type: computed_fields
        grounds:
          - entities.Interventionist.fields.committed_minutes_per_week
        distinguishing_aspect: "committed_minutes_per_week is computed, initialized to 0 on creation, ignores client input."
        test_recipe:
          setup: ["District and School exist"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 300, subjects: ["READING", "MATH"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id, committed: $.data.committed_minutes_per_week }
          assert:
            - "Interventionist.committed_minutes_per_week == 0"
            - "Interventionist.subjects == ['READING','MATH']"

      - name: screening_window_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_WINDOW_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET on a non-existent windowId returns ERR_WINDOW_NOT_FOUND (404), not a generic error."
        test_recipe:
          setup: ["District and School exist"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /districts/${d_id}/schools/${s_id}/screening-windows/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DistrictCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_WINDOW_NOT_FOUND'"
            - "HTTP status 404"

      - name: student_not_found_under_wrong_school
        claim_type: parent_relationship
        grounds:
          - entities.Student.parent
          - errors[ERR_STUDENT_NOT_FOUND]
        distinguishing_aspect: "Student id valid under school A is NOT reachable under school B — parent scoping enforced."
        test_recipe:
          setup: ["District with two schools; student created under school A"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "A", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "B", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${sa_id}/students"
              payload: { full_name: "X", grade_level: 1 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id }
          trigger:
            - call: "GET /districts/${d_id}/schools/${sb_id}/students/${st_id}"
              payload: {}
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_STUDENT_NOT_FOUND'"
            - "Parent scoping: child resource reachable only under its owning parent"

      - name: benchmark_cut_point_immutability
        claim_type: immutability
        grounds:
          - entities.BenchmarkCutPoint
        distinguishing_aspect: "BenchmarkCutPoint has common_fields:false — no updated_at, no version, no PUT/PATCH endpoint exists."
        test_recipe:
          setup: ["District and School exist"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
              captures: { cp_id: $.data.id }
          assert:
            - "Response has id and created_at, but NOT updated_at or version (common_fields:false)"
            - "Scaffold exposes no PUT/PATCH for /benchmark-cut-points/{id} — corrections require creating a new row"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - entities.ScreeningWindow.fields.window_kind
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST screening-windows with window_kind='SUMMER' returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["District and School exist"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "SUMMER", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"
            - "HTTP status 400"

      - name: invalid_cut_point_ordering_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_CUT_POINT]
        distinguishing_aspect: "tier3_max_score must be strictly less than tier2_max_score; equal values are rejected."
        test_recipe:
          setup: ["District and School exist"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 100 }
              as: DistrictCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_CUT_POINT'"
            - "HTTP status 400"

      - name: pagination_fields_on_list_endpoint
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints
        distinguishing_aspect: "GET list endpoints return pagination_fields (limit, offset, total_count, has_more) with defaults limit=10, offset=0."
        test_recipe:
          setup: ["District, School, and 3 students"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "S1", grade_level: 1 }
              as: SchoolRegistrar
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "S2", grade_level: 1 }
              as: SchoolRegistrar
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "S3", grade_level: 2 }
              as: SchoolRegistrar
          trigger:
            - call: "GET /districts/${d_id}/schools/${s_id}/students?limit=2&offset=0"
              payload: {}
              as: TeamLead
          assert:
            - "Response contains pagination keys: limit=2, offset=0, total_count=3, has_more=true"
            - "Response envelope has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'array' and data is a list of length 2"

  # ===========================================================================
  # Section 2: State Machines (valid/invalid transitions, side effects, terminal)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: window_invalid_from_schedule_to_scored
        claim_type: invalid_transition
        grounds:
          - state_machines.ScreeningWindow
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Attempting to /score a SCHEDULED (not yet OPEN, not CLOSED) window is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Window created but clock is before opens_on so window still SCHEDULED"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 0, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-09-01", closes_on: "2026-09-30" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            # Clock before opens_on
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "HTTP status 409"

      - name: team_meeting_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TeamMeeting
        distinguishing_aspect: "Once a TeamMeeting is MINUTED, further ratify calls (even for a valid PROPOSED movement on a real student) are rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Student with a PROPOSED movement; TeamMeeting already MINUTED (convened then minuted before the movement was attached)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L", grade_level: 3 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${st_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            # Convene and minute a meeting BEFORE attaching any movement (so it has 0 pending)
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/minute"
              payload: {}
              as: TeamLead
            # Read the proposed movement and student version
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}"
              payload: {}
              as: TeamLead
              captures: { st_v: $.data.version }
          trigger:
            # Try to ratify on the already-MINUTED meeting — terminal-state rejection
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${st_v}" }
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "TeamMeeting is MINUTED (terminal) — no further ratify actions accepted"

      - name: sped_referral_withdrawal_from_pending_consent
        claim_type: valid_transition
        grounds:
          - state_machines.SpedReferral.PENDING_CONSENT_to_WITHDRAWN
        distinguishing_aspect: "PENDING_CONSENT → WITHDRAWN transition is legal; status changes and triggered_plan_id remains pinned."
        test_recipe:
          setup: ["SpedReferral in PENDING_CONSENT for a TIER_3 student with weeks=4 (auto-created via probe cascade)"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026", sped_referral_min_weeks: 4 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "W", grade_level: 3 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${st_id}", subject: "READING", raw_score: 50 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}"
              payload: {}
              as: TeamLead
              captures: { st_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${st_v}" }
              as: TeamLead
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "I", subject: "READING", tier_target: "TIER_3", grade_min: 3, grade_max: 5, session_minutes: 60, sessions_per_week: 5, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 1200, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}"
              payload: {}
              as: TeamLead
              captures: { st_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${st_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id }
            # 4 NON_RESPONSIVE probes
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-18", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-25", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-01", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-08", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}/sped-referrals"
              payload: {}
              as: TeamLead
              captures: { ref_id: "$.data[0].id" }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/sped-referrals/${ref_id}/withdraw"
              payload: {}
              as: SpEdDirector
              captures: { ref_status: $.data.status }
          assert:
            - "SpedReferral.status == 'WITHDRAWN'"
            - "triggered_plan_id remains set (historical record)"

      - name: plan_cancel_blocked_after_first_probe
        claim_type: invalid_transition
        grounds:
          - state_machines.StudentPlan.ACTIVE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACTIVE plan with at least one ProgressProbe cannot be cancelled (must be exited via exit endpoint)."
        test_recipe:
          setup: ["Plan ACTIVE with 1 probe recorded"]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
