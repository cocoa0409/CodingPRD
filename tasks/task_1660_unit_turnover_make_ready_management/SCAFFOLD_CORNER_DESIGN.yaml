      - name: rm_tier_boundary_and_authority_enforcement
        claim_type: boundary_edge
        grounds: [calculations.scope_creep_tier, "errors[ERR_APPROVAL_AUTHORITY_EXCEEDED]"]
        distinguishing_aspect: "Second threshold: estimate 30000 → variance exactly 3000bp → stays PM tier (<= rm); 30010 → 3001bp → RM tier, and a PropertyManager approve on the RM-tier item is denied 403 while RegionalManager succeeds."
        test_recipe:
          setup:
            - "Turn SCOPED with approved_budget 100000 (base REPAIR item 100000)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
