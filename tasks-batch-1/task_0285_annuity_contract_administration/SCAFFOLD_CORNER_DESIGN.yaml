              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /crediting-events"
              payload: { contract_id: "${cid}", crediting_kind: "FIXED_GUARANTEED" }
              as: CreditingOfficer
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid}", requested_amount_cents: 200000, expected_contract_version: "${cv1}" }
              as: ContractAdmin
              captures: { wid: $.data.id }
            - call: "POST /withdrawals/${wid}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /_clock/roll_anniversary"
