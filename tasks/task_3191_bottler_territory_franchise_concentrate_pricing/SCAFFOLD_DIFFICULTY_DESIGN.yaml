              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/customers"
              payload: { agreement_id: "${ag_id}", name: "QuickMart 12", channel: "RETAIL", local_price_cents: 190 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /bottler/customers"
              payload: { agreement_id: "${ag_id}", name: "QuickMart 13", channel: "RETAIL", local_price_cents: 190 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /bottler/cold-drink-equipment"
              payload: { agreement_id: "${ag_id}", asset_tag: "CDE-0001" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { eq_id: $.data.id }
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/place"
              payload: { customer_id: "${c1_id}", placed_from: "2026-09-15", placed_until: "2026-09-30" }
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/uninstall"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/place"
              payload: { customer_id: "${c2_id}", placed_from: "2026-09-30", placed_until: "2026-10-31" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/place"
              payload: { customer_id: "${c2_id}", placed_from: "2026-10-01", placed_until: "2026-10-31" }
              as: BottlerOps
              as_user_id: "${ag_id}"
          assert:
            - "placement starting 2026-09-30 (touching prior end date) rejected with ERR_EQUIPMENT_PLACEMENT_OVERLAP (closed interval: shared date = overlap)"
            - "placement starting 2026-10-01 accepted"
            - "ColdDrinkEquipment.${eq_id}.status == PLACED and customer_id == ${c2_id} after the accepted placement"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: marketing_fund_accrual_then_equal_clawback_restores_balance
        grounds:
          - calculations.marketing_fund_accrual
          - entities.BottlerAgreement.fields.marketing_fund_balance_cents
          - errors[ERR_CLAWBACK_EXCEEDS_ACCRUAL]
        distinguishing_aspect: "Conserved quantity #1 (marketing fund cents): an ACCRUAL of amount A followed by a CLAWBACK referencing it with requested_amount_cents == A leaves marketing_fund_balance_cents unchanged; a clawback larger than the referenced accrual is rejected."
        test_recipe:
          setup:
            - "Seeded ACTIVE CASE_VOLUME agreement; accrual of 50000 cases posted (amount 2000000; balance 2000000)."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "ACCRUAL", period: "2026-09", cases_sold: 50000 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { accrual_id: $.data.id }
          trigger:
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "CLAWBACK", period: "2026-09", requested_amount_cents: 2000001, reference_entry_id: "${accrual_id}" }
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "CLAWBACK", period: "2026-09", requested_amount_cents: 2000000, reference_entry_id: "${accrual_id}" }
              as: BrandOwnerAdmin
          assert:
            - "oversized clawback (2000001 > 2000000) rejected with ERR_CLAWBACK_EXCEEDS_ACCRUAL"
            - "equal clawback accepted"
            - "BottlerAgreement.${ag_id}.marketing_fund_balance_cents == 0 (balance before accrual) — invariant balance_after(accrue A; clawback A) == balance_before"

