              as: ClientLiaison
              captures: { e_route: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${e_route} == 'ERR_NO_ELIGIBLE_ROUTE'"
            - "GET /on-demand-requests?contract_id=${cnr} -> total_count == 0"

      - name: driver_block_conflict_on_true_overlap
        claim_type: violation_to_error
