            - "GET /prescriber-opt-outs/${oo_id} still shows status SUBMITTED"

      - name: manufacturer_client_cannot_access_other_client
        claim_type: RBAC Denial
        grounds:
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_OWNERSHIP]
          - roles.ManufacturerClient
        distinguishing_aspect: "Entity-backed ownership: a ManufacturerClient reading another client's record via GET /clients/{id} is denied 403 ERR_FORBIDDEN_OWNERSHIP, while reading its own record succeeds."
        test_recipe:
          setup:
            - "Two clients A and B."
          setup_api_calls:
