        distinguishing_aspect: |
          ce_hours_valid is an aggregate with two independent filters: course_type must be CE_CORE or
          CE_ELECTIVE (a 12-hour PRELICENSE or POST_LICENSE completion contributes nothing) and
          credit_status must be VALID. An implementation that sums every completion reports 24 instead
          of 12 and flips ce_deficient a course too early.
