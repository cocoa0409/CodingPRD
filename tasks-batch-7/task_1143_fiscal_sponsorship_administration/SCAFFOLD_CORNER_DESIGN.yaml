            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_r2 }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 500000, donor_name: "D", donor_email: "d@x.org", payment_method: "ACH" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p}/disbursement-requests", payload: { amount_cents: 30000, purpose: "x", payee_type: "VENDOR", payee_name: "V", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p}", captures: { dr: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr}/submit", payload: {}, as: ProjectLead, as_user_id: "${p}" }
            - { call: "POST /fsa/disbursement-requests/${dr}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/projects/${p}/risk-incidents", payload: { category: "LIABILITY", severity: "CRITICAL", description: "lawsuit" }, as: ComplianceOfficer, as_user_id: user_co_1 }
          trigger:
