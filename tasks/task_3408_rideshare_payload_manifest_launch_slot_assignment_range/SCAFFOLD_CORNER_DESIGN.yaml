        distinguishing_aspect: "Three INTEGRATED payloads on ports stack 4 (RING_15), 3 (CUBESAT), 2 (CUBESAT) deploy tip-first: sequence 0/1/2 with offsets 0, 30, and 75 seconds — the last gap is 30 + 15 because events 1 and 2 share interface class CUBESAT (recontact avoidance)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission with ports DSP-A (stack 4, RING_15+RING_24), DSP-B (stack 3, CUBESAT), DSP-C (stack 2, RING_24+CUBESAT). Contract signed with PL_A 100 kg RING_15, PL_B 40 kg CUBESAT, PL_C 30 kg CUBESAT; all three assigned, verified, approved, CONFIRMED; manifest locked; launch license GRANTED; slot CONFIRMED; clock advanced into the window; mission launched."
