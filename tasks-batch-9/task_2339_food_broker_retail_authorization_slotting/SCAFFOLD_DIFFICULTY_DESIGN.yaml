  - rule_id: resource_temporal_overlap
    instances:
      - name: commission_agreement_half_open_window_adjacency_versus_one_day_overlap
        grounds:
          - validations[priority=11].ERR_AGREEMENT_WINDOW_OVERLAP
          - entities.CommissionAgreement.fields.effective_start_date
          - state_machines.CommissionAgreement.DRAFT_to_ACTIVE
          - errors.ERR_AGREEMENT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics = half-open DATE intervals on
          (principal_id, retailer_id, category_code), checked at activation time
          only against other ACTIVE agreements. Exact adjacency (new.start ==
          other.end) is legal, a single day of true overlap is not, and a
          TERMINATED agreement does not participate at all — so the same
          activation flips from 409 to 200 purely by terminating the incumbent.
          The sibling instance uses buffered TIMESTAMP intervals with an
          aggregate concurrency limit on a different entity (PromotionEvent demo
          slots at a store).
        test_recipe:
          setup:
            - "Clock 2026-08-01. Retailer BIGMART; principal NWF; ACTIVE agreement A1 for FROZEN_SNACKS with window [2026-01-01, 2026-09-01)."
            - "Three further DRAFT agreements for the same (principal, retailer, category): A2 [2026-09-01, 2027-01-01) — exactly adjacent; A3 [2026-08-31, 2027-06-01) — overlapping A1 by one day; A4 [2025-06-01, 2026-01-01) — exactly adjacent below A1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
