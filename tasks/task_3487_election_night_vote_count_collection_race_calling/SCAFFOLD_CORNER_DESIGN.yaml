      - name: stringer_cannot_check_in_other_stringers_assignment
        claim_type: Role Denial
        grounds:
          - roles.Stringer
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Check-in compares X-User-ID to assignment.stringer_id: a second stringer presenting at Sally's assignment fails 403."
        test_recipe:
          setup: ["Event at LIVE; Sally assigned to Alameda [08:00, 20:00); second stringer Sam on the roster; clock 13:00 inside the window."]
          setup_api_calls:
            - *k_clock
