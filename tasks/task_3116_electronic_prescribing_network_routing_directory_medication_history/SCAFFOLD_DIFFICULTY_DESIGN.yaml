          - calculations.routing_endpoint_selection.variants.backup_nomination
        distinguishing_aspect: "The Prescription.routing_status machine is cyclic rather than a pipeline: FALLBACK_SENT → ROUTED → BACKUP_SELECTION → FALLBACK_PENDING → FALLBACK_SENT returns to a state the row already occupied, so a second loop of the same five transitions is legal."
