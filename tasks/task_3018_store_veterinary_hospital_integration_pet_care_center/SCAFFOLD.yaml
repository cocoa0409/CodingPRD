      - "GET /stores/vaccination-visits, GET /stores/vaccination-visits/{visitId} and GET /stores/vaccination-visits/{visitId}/rabies-certificate"
      - "GET /stores/prescription-authorizations/{authorizationId} and GET /stores/{storeId}/prescription-authorizations"
      - "GET /stores/pharmacy-orders/{orderId} and GET /stores/prescription-authorizations/{authorizationId}/pharmacy-orders"
      - "GET /stores/incident-records/{incidentId}, GET /stores/{storeId}/incident-records and its claim-summary"
