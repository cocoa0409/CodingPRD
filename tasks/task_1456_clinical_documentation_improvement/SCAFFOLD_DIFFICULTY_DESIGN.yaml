scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: priority_score_provisional_vs_residual_on_open_query
    grounds:
    - calculations.case_priority_score
    - entities.PatientCase.fields.priority_score
    - entities.CDIQuery.fields.status
    distinguishing_aspect: 'Subject is PatientCase.priority_score. Two valid variants produce

      different numbers from identical case fields: provisional variant

      (case has an open SENT query) credits the proposed_drg_weight into

      base_opportunity, residual variant (no open queries) counts only

      working_drg_weight - initial_drg_weight.

      '
    test_recipe:
      setup:
      - CDIProgram with current_period_index = 5
      - Provider P1 in program
      - EscalationPolicy EP (response_due_periods=3, escalation_stage_periods=2, max_escalation_stage=2, is_default=true)
      - 'PatientCase C1: admission=0, discharge=4, initial_drg_weight=1.0000, working_drg_weight=1.0000, working_soi=2, working_rom=2 (case is UNDER_REVIEW with one ACTIVE review)'
      - CDIQuery Q1 in SENT state on C1 proposing proposed_drg_weight=1.5000
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F1
          program_code: P1
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP1
          response_due_periods: 3
          escalation_stage_periods: 2
          max_escalation_stage: 2
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: NPI-1
          full_name: Dr. A
          specialty: Cardiology
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 5
        as: CDIManager
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M1
          admission_period: 0
          discharge_period: 4
          attending_provider_id: ${prov}
          initial_drg_code: DRG-A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: Patient has WBC 14 and fever; please clarify
          clinical_indicators:
          - WBC-14
          - fever
          proposed_drg_code: DRG-B
          proposed_drg_weight: 1.5
          proposed_soi: 3
          proposed_rom: 3
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      trigger:
      - call: GET /api/patient-cases/${case}
        payload: {}
        as: CDISpecialist
        captures:
          prov_score: $.data.priority_score
      assert:
      - PatientCase.${case}.priority_score == 71.5000
  - name: cmi_snapshot_unadjusted_vs_adjusted_diverge
    grounds:
    - calculations.cmi_snapshot_computation
    - entities.CMISnapshot.fields.unadjusted_cmi
    - entities.CMISnapshot.fields.adjusted_cmi
    - entities.CMISnapshot.fields.cdi_lift
    distinguishing_aspect: 'Subject is CMISnapshot on CDIProgram (a different entity domain from

      PatientCase.priority_score). unadjusted uses initial_drg_weight,

      adjusted uses working_drg_weight; same case set, different results.

      '
    test_recipe:
      setup:
      - Program at period 10
      - Two cases both FINAL_CODED at period <= 10
      - 'Case A: initial=1.0000, working=1.0000 (no CDI change)'
      - 'Case B: initial=1.0000, working=2.0000 (CDI AGREE moved it)'
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F2
          program_code: P2
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 2
          escalation_stage_periods: 2
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: NPI-P
          full_name: Dr. X
          specialty: IM
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: MA
          admission_period: 0
          discharge_period: 3
          attending_provider_id: ${prov}
          initial_drg_code: DRG-X
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          caseA: $.data.id
          caseA_ver: $.data.version
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 5
        as: CDIManager
      - call: POST /api/patient-cases/${caseA}/finalize-coding
        payload:
          coder_drg_code: DRG-X
          coder_drg_weight: 1.0
          expected_case_version: ${caseA_ver}
        as: HIMCoder
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: MB
          admission_period: 0
          discharge_period: 3
          attending_provider_id: ${prov}
          initial_drg_code: DRG-X
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          caseB: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          revB: $.data.id
      - call: POST /api/cdi-reviews/${revB}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: WBC elevated; please clarify
          clinical_indicators:
          - WBC
          proposed_drg_code: DRG-Y
          proposed_drg_weight: 2.0
          proposed_soi: 3
          proposed_rom: 2
        as: CDISpecialist
        captures:
          qB: $.data.id
          qB_ver: $.data.version
      - call: POST /api/cdi-queries/${qB}/send
        payload:
          expected_query_version: ${qB_ver}
        as: CDISpecialist
      - call: POST /api/cdi-queries/${qB}/responses
        payload:
          response_type: AGREE
          response_text: agreed
        as: Provider
        as_user_id: ${prov}
      - call: GET /api/cdi-reviews/${revB}
        payload: {}
        as: CDISpecialist
        captures:
          revB_ver: $.data.version
      - call: POST /api/cdi-reviews/${revB}/close
        payload:
          closed_reason: OPPORTUNITY_CAPTURED
          expected_review_version: ${revB_ver}
        as: CDISpecialist
      - call: GET /api/patient-cases/${caseB}
        payload: {}
        as: HIMCoder
        captures:
          caseB_ver: $.data.version
      - call: POST /api/patient-cases/${caseB}/finalize-coding
        payload:
          coder_drg_code: DRG-Y
          coder_drg_weight: 2.0
          expected_case_version: ${caseB_ver}
        as: HIMCoder
      trigger:
      - call: POST /api/cdi-programs/${prog}/cmi-snapshots
        payload: {}
        as: CDIManager
        captures:
          snap: $.data.id
      assert:
      - CMISnapshot.${snap}.case_count == 2
      - CMISnapshot.${snap}.unadjusted_cmi == 1.0000
      - CMISnapshot.${snap}.adjusted_cmi == 1.5000
      - CMISnapshot.${snap}.cdi_lift == 0.5000
      - CMISnapshot.${snap}.unadjusted_cmi != CMISnapshot.${snap}.adjusted_cmi
- rule_id: combinatorial_formula
  instances:
  - name: priority_score_multibranch_acuity_and_los
    grounds:
    - calculations.case_priority_score
    distinguishing_aspect: 'Mode (a) — non-linear multi-input formula. priority_score combines

      base_opportunity, acuity_multiplier (4-branch piecewise on

      (working_soi, working_rom)), and los_factor (3-branch on

      current_period vs discharge_period). Tests pin soi=3,rom=2 -> 1.25

      branch and current_period > discharge_period -> 1.30 branch.

      '
    test_recipe:
      setup:
      - Program at period 7
      - Case with initial=1.2000, working=1.8000, working_soi=3, working_rom=2, admission=0, discharge=4
      - No open queries (residual variant)
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 1
          escalation_stage_periods: 1
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 4
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.2
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 1.8
          proposed_soi: 3
          proposed_rom: 2
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      - call: POST /api/cdi-queries/${q}/responses
        payload:
          response_type: AGREE
          response_text: ok
        as: Provider
        as_user_id: ${prov}
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 7
        as: CDIManager
      trigger:
      - call: GET /api/patient-cases/${case}
        payload: {}
        as: CDISpecialist
      assert:
      - PatientCase.${case}.priority_score == 97.5000
  - name: cmi_snapshot_round_per_ratio_then_subtract
    grounds:
    - calculations.cmi_snapshot_computation
    distinguishing_aspect: 'Mode (b) — nested rounding order pinned. unadjusted_cmi and

      adjusted_cmi are each rounded to 4 decimals FIRST; cdi_lift is the

      difference of the rounded values (NOT round(unadjusted - adjusted)).

      Case weights chosen so the two orderings diverge.

      '
    test_recipe:
      setup:
      - Program at period 5
      - Three FINAL_CODED cases with initial weights 0.33331, 0.33331, 0.33331 and working weights 0.66665, 0.66665, 0.66665
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 0.5
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M1
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 0.3333
        as: HIMCoder
        captures:
          c1: $.data.id
          c1v: $.data.version
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M2
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 0.3333
        as: HIMCoder
        captures:
          c2: $.data.id
          c2v: $.data.version
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M3
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 0.3333
        as: HIMCoder
        captures:
          c3: $.data.id
          c3v: $.data.version
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 5
        as: CDIManager
      - call: POST /api/patient-cases/${c1}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 0.3333
          expected_case_version: ${c1v}
        as: HIMCoder
      - call: POST /api/patient-cases/${c2}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 0.3333
          expected_case_version: ${c2v}
        as: HIMCoder
      - call: POST /api/patient-cases/${c3}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 0.3333
          expected_case_version: ${c3v}
        as: HIMCoder
      trigger:
      - call: POST /api/cdi-programs/${prog}/cmi-snapshots
        payload: {}
        as: CDIManager
        captures:
          snap: $.data.id
      assert:
      - CMISnapshot.${snap}.case_count == 3
      - CMISnapshot.${snap}.unadjusted_cmi == 0.3333
      - CMISnapshot.${snap}.adjusted_cmi == 0.3333
      - CMISnapshot.${snap}.cdi_lift == 0.0000
- rule_id: non_linear_state_machine
  instances:
  - name: cdi_review_active_hold_active_cycle
    grounds:
    - state_machines.CDIReview.ACTIVE_to_ON_HOLD
    - state_machines.CDIReview.ON_HOLD_to_ACTIVE
    distinguishing_aspect: 'CDIReview exhibits a non-trivial cycle ACTIVE -> ON_HOLD -> ACTIVE

      (revision-loop pattern), distinct from a linear pipeline; loop is

      guarded by no-unresolved-queries precondition.

      '
    test_recipe:
      setup:
      - Program, provider, case, ACTIVE review with no open queries
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      trigger:
      - call: POST /api/cdi-reviews/${rev}/hold
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-reviews/${rev}/resume
        payload: {}
        as: CDISpecialist
      - call: GET /api/cdi-reviews/${rev}
        payload: {}
        as: CDISpecialist
      assert:
      - CDIReview.${rev}.status == ACTIVE
      - CDIReview.${rev}.version == 4
  - name: cdi_query_escalated_responded_branching_and_no_response_terminal
    grounds:
    - state_machines.CDIQuery.SENT_to_ESCALATED
    - state_machines.CDIQuery.ESCALATED_to_ESCALATED
    - state_machines.CDIQuery.ESCALATED_to_RESPONDED
    - state_machines.CDIQuery.ESCALATED_to_NO_RESPONSE
    distinguishing_aspect: 'CDIQuery exhibits fork-join (SENT -> ESCALATED -> {ESCALATED loop, RESPONDED, NO_RESPONSE})

      on a different entity (CDIQuery) from CDIReview. ESCALATED is a

      self-loop AND branches to two terminals — different shape from

      review''s simple cycle.

      '
    test_recipe:
      setup:
      - Program at period 0; policy response_due_periods=2, escalation_stage_periods=2, max_escalation_stage=2
      - Case, ACTIVE review, query sent at period 0 -> due_period=2
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 2
          escalation_stage_periods: 2
          max_escalation_stage: 2
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 10
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 2.0
          proposed_soi: 3
          proposed_rom: 3
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      trigger:
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 3
        as: CDIManager
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 2
        as: CDIManager
      - call: POST /api/cdi-queries/${q}/responses
        payload:
          response_type: AGREE
          response_text: ok
        as: Provider
        as_user_id: ${prov}
      - call: GET /api/cdi-queries/${q}
        payload: {}
        as: CDISpecialist
      assert:
      - CDIQuery.${q}.status == RESPONDED
      - CDIQuery.${q}.escalation_stage == 2
      - CDIQuery.${q}.due_period == 2
- rule_id: transitive_cascade
  instances:
  - name: agree_response_cascade_query_to_case_to_review
    grounds:
    - state_machines.CDIQuery.SENT_to_RESPONDED
    - calculations.review_opportunity_deltas
    distinguishing_aspect: 'Trigger: POST .../responses with AGREE. Chain depth 3:

      (1) QueryResponse created -> (2) CDIQuery.status -> RESPONDED

      AND case.working_* updated -> (3) case.priority_score recomputed

      AND review.opportunity_*_delta recomputed. The mutation on the

      QueryResponse triggers mutation on the case; the case mutation in

      turn triggers recomputation on the parent review (bubble-up).

      '
    test_recipe:
      setup:
      - Case initial=1.0 working=1.0 soi=1 rom=1, ACTIVE review, SENT query proposing 2.5/soi=3/rom=4
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
