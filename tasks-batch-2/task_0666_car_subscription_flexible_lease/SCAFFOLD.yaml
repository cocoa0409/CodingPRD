scenario: |
  666. Car Subscription & Flexible Lease (Care by Volvo/Fair style): plan & vehicle-swap
  allowance, all-inclusive (insurance/maintenance) bundle, credit/eligibility & deposit,
  monthly billing & mileage, delivery/return & inspection, swap/upgrade logistics,
  early-cancel & fee, fleet utilization.

domain_name: car-subscription-flexible-lease
api_prefix: /
# Flat topology: many peer top-level collections (/subscriptions, /vehicles, /fleets,
# /applicants, /billing-cycles, /invoices, /swap-requests, /return-inspections,
# /couriers, /delivery-slots, /subscription-plans). The api_prefix is the root.

complexity_profile:
  primary_archetype: quota_allocation          # finite vehicle fleet reserved/assigned/released
  secondary_archetype: pricing_engine          # tiered plans, mileage overage, proration, early-cancel, deposit
  complexity_layers:
    - derived_field_reconciliation              # Fleet.utilization_pct, Subscription.swaps_used, lifetime_billed
    - scheduled_actions                          # logical clock drives billing-cycle close, min-term elapse
    - optimistic_concurrency                     # OCC on Vehicle.version for assign-with-supersede race
    - rate_threshold_triggers                    # mileage overage tier breakpoints

  entity_topology: flat
  # Peer entities linked by FK references; no deep nested ownership in URL paths. Subscription,
  # Vehicle, Applicant, Fleet, Courier are peers; BillingCycle/Invoice/SwapRequest/ReturnInspection
  # reference Subscription by FK; DamageLineItem references ReturnInspection; DeliverySlot references
  # Courier + Subscription.

  state_machine_shape: parallel
  # Subscription carries two independent state axes: lifecycle_status (DRAFT→...→CLOSED) and
  # billing_status (CURRENT⇄PAST_DUE) that evolve independently. Vehicle is cyclic
  # (AVAILABLE→RESERVED→ASSIGNED→IN_INSPECTION→AVAILABLE loop). SwapRequest is branching fork-join.

  relationship_patterns:
    - one_to_many        # Fleet→Vehicle; Subscription→BillingCycle; Subscription→Invoice; ReturnInspection→DamageLineItem
    - cross_aggregate    # Subscription.active_vehicle_id → Vehicle (across aggregate boundary)
    - polymorphic        # Invoice.source_ref_id references the billing-driver entity (BillingCycle | SwapRequest | ReturnInspection)

  role_model: peer_roles
  # Applicant/Member acts on own Subscription (entity_backed); FleetOperator owns Vehicle/Fleet/Courier
  # logistics; BillingAdmin owns financial settlement; PlatformAdmin opaque superset for catalog + clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Plan tier label."
        constraints: "one of {ESSENTIAL, PLUS, PREMIUM}; unique across active plans"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "All-inclusive monthly fee in cents (bundles insurance + maintenance)."
        constraints: ">= 1"
      - name: included_miles_per_cycle
        type: integer
        source: input
        description: "Miles included per billing cycle before overage applies."
        constraints: ">= 0"
      - name: free_buffer_miles
        type: integer
        source: input
        description: "Grace miles beyond included before any overage is billed."
        default: 0
        constraints: ">= 0"
      - name: overage_tier1_rate_cents
        type: integer
        source: input
        description: "Per-mile cents for the first OVERAGE_TIER1_LIMIT billable overage miles."
        constraints: ">= 0"
      - name: overage_tier2_rate_cents
        type: integer
        source: input
        description: "Per-mile cents for billable overage miles beyond OVERAGE_TIER1_LIMIT."
        constraints: ">= overage_tier1_rate_cents"
      - name: included_swaps_per_term
        type: integer
        source: input
        description: "Free vehicle swaps granted per subscription term before SWAP_FEE applies."
        default: 0
        constraints: ">= 0"
      - name: min_term_months
        type: integer
        source: input
        description: "Minimum commitment term in whole months; drives forward-looking early-cancel fee."
        constraints: ">= 1"
      - name: deposit_base_cents
        type: integer
        source: input
        description: "Base refundable security deposit before eligibility multiplier."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Catalog availability."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: Fleet
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Fleet display name (e.g., regional depot)."
      - name: region_code
        type: string
        source: input
        description: "Region code the fleet serves (e.g., CA, NY)."
      - name: total_vehicles
        type: integer
        source: computed
        description: "Derived count of Vehicles whose fleet_id == this Fleet (any state)."
      - name: in_use_count
        type: integer
        source: computed
        description: "Derived count of Vehicles in this Fleet with status IN {RESERVED, ASSIGNED}."
      - name: utilization_pct
        type: number
        source: computed
        description: "in_use_count / total_vehicles, 4 decimal places; 0 when total_vehicles == 0."

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: fleet_id
        type: string
        source: input
        description: "FK -> Fleet.id; the fleet that owns this vehicle."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the plan tier this vehicle is offered under."
      - name: vin
        type: string
        source: input
        description: "Vehicle identification string; unique across all Vehicles."
        constraints: "unique"
      - name: model_label
        type: string
        source: input
        description: "Human model label (e.g., XC40 Recharge)."
      - name: odometer_miles
        type: integer
        source: input
        description: "Current lifetime odometer reading in miles."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle state."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RESERVED, ASSIGNED, IN_INSPECTION, MAINTENANCE}"
      - name: active_subscription_id
        type: string
        source: system
        description: "FK -> Subscription.id; the subscription currently holding RESERVED/ASSIGNED, else null."
        default: null

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Applicants."
        constraints: "unique"
      - name: credit_score
        type: integer
        source: input
        description: "Reported credit score input to eligibility scoring."
        constraints: "300..850"
      - name: monthly_income_cents
        type: integer
        source: input
        description: "Reported gross monthly income in cents."
        constraints: ">= 0"
      - name: history_flag
        type: enum
        source: input
        description: "Driving/payment history classification feeding the eligibility weight."
        constraints: "one of {CLEAN, MINOR, SEVERE}"
      - name: eligibility_status
        type: enum
        source: computed
        description: "Outcome of the eligibility decision; null until decided."
        default: null
        constraints: "one of {APPROVED, CONDITIONAL, DECLINED}"
      - name: eligibility_score
        type: number
        source: computed
        description: "Weighted eligibility score, 4 decimal places; null until decided."
        default: null
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Deposit demanded after the eligibility decision; null until decided / DECLINED."
        default: null

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the subscriber."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the subscribed plan (drives fees, swaps, term)."
      - name: active_vehicle_id
        type: string
        source: system
        description: "FK -> Vehicle.id; currently assigned/reserved vehicle, else null."
        default: null
      - name: lifecycle_status
        type: enum
        source: system
        description: "Primary lifecycle axis (independent of billing_status)."
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_DELIVERY, ACTIVE, RETURN_PENDING, CLOSED}"
      - name: billing_status
        type: enum
        source: system
        description: "Independent billing axis evolving independently of lifecycle_status."
        default: CURRENT
        constraints: "one of {CURRENT, PAST_DUE}"
      - name: deposit_held_cents
        type: integer
        source: system
        description: "Security deposit captured at activation; conserved across settlement."
        default: 0
      - name: swaps_used
        type: integer
        source: system
        description: "Count of completed swaps this term; gates SWAP_FEE against plan.included_swaps_per_term."
        default: 0
      - name: cycle_start_iso
        type: datetime
        source: system
        description: "Start instant of the current open billing cycle (UTC)."
        default: null
      - name: term_start_iso
        type: datetime
        source: system
        description: "Instant the subscription went ACTIVE; anchors min-term elapsed-months math."
        default: null
      - name: lifetime_billed_cents
        type: integer
        source: computed
        description: "Running sum of all posted Invoice.amount_cents for this subscription."
        default: 0

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this cycle bills."
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; vehicle whose odometer this cycle measures."
      - name: cycle_index
        type: integer
        source: system
        description: "1-based ordinal of this cycle within the subscription term."
      - name: cycle_start_iso
        type: datetime
        source: system
        description: "Cycle window start (UTC), half-open with cycle_end_iso."
      - name: cycle_end_iso
        type: datetime
        source: system
        description: "Cycle window end (UTC); set when the cycle is closed."
        default: null
      - name: odometer_start_miles
        type: integer
        source: system
        description: "Vehicle odometer at cycle open."
      - name: odometer_end_miles
        type: integer
        source: input
        description: "Vehicle odometer reported at cycle close."
        default: null
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle."
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: overage_cents
        type: integer
        source: computed
        description: "Tiered mileage overage billed at close; 0 while OPEN."
        default: 0

  - name: Invoice
    parent: null
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the billed subscription."
      - name: source_kind
        type: enum
        source: system
        description: "Which workflow produced this invoice (polymorphic source)."
        constraints: "one of {CYCLE, SWAP, EARLY_CANCEL, RETURN_SETTLEMENT}"
      - name: source_ref_id
        type: string
        source: system
        description: "Id of the producing BillingCycle | SwapRequest | Subscription | ReturnInspection (per source_kind)."
      - name: amount_cents
        type: integer
        source: computed
        description: "Net charged amount in cents (may be negative for net credits on a swap downgrade)."
      - name: posted_at_iso
        type: datetime
        source: system
        description: "Logical-clock instant the invoice was posted (UTC)."

  - name: SwapRequest
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription requesting the swap."
      - name: from_vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the currently held vehicle being returned in the swap."
      - name: to_vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the target vehicle to switch into."
      - name: status
        type: enum
        source: system
        description: "Swap workflow state (fork-join over target reservation)."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, COMPLETED, REJECTED}"
      - name: swap_fee_applied_cents
        type: integer
        source: computed
        description: "SWAP_FEE charged on this swap (0 when within included_swaps_per_term)."
        default: 0
      - name: net_adjustment_cents
        type: integer
        source: computed
        description: "Net proration adjustment posted at completion (charge_new - credit_old + swap_fee)."
        default: 0

  - name: ReturnInspection
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the returning subscription."
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the vehicle being inspected on return."
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle (branching: PASS vs DAMAGE assessed)."
        default: OPEN
        constraints: "one of {OPEN, ASSESSED, SETTLED}"
      - name: reported_odometer_miles
        type: integer
        source: input
        description: "Odometer at return."
        constraints: ">= 0"
      - name: total_damage_cents
        type: integer
        source: computed
        description: "Sum of DamageLineItem.amount_cents whose inspection_id == this inspection."
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: "Portion of deposit consumed by settlement; 0 until SETTLED."
        default: 0
      - name: deposit_refunded_cents
        type: integer
        source: computed
        description: "Deposit returned to subscriber; 0 until SETTLED."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Outstanding amount owed beyond deposit; 0 until SETTLED."
        default: 0

  - name: DamageLineItem
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> ReturnInspection.id; the inspection this damage belongs to."
      - name: severity
        type: enum
        source: input
        description: "Damage severity label."
        constraints: "one of {MINOR, MODERATE, SEVERE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Assessed cost of this damage item in cents."
        constraints: ">= 1"
      - name: note
        type: string
        source: input
        description: "Free-text description of the damage."
        default: null

  - name: Courier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Courier/driver name handling delivery and return logistics."
      - name: fleet_id
        type: string
        source: input
        description: "FK -> Fleet.id; the fleet whose vehicles this courier serves."
      - name: buffer_minutes
        type: integer
        source: input
        description: "Travel buffer padded around each delivery slot (closed-interval geometry)."
        default: 30
        constraints: ">= 0"

  - name: DeliverySlot
    parent: null
    common_fields: true
    fields:
      - name: courier_id
        type: string
        source: input
        description: "FK -> Courier.id; the courier fulfilling this slot."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription being delivered to / returned from."
      - name: kind
        type: enum
        source: input
        description: "Slot purpose."
        constraints: "one of {DELIVERY, RETURN}"
      - name: window_start_iso
        type: datetime
        source: input
        description: "Slot start (UTC), closed interval; buffer-padded on both sides."
      - name: window_end_iso
        type: datetime
        source: input
        description: "Slot end (UTC), closed interval; must be > window_start_iso."
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, FULFILLED, CANCELLED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: DRAFT          # lifecycle_status axis
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PENDING_DELIVERY
        trigger: "POST /subscriptions/{id}/assign-vehicle"
        actor: FleetOperator
        preconditions:
          - "subscription.lifecycle_status == DRAFT"
          - "referenced Applicant.eligibility_status IN {APPROVED, CONDITIONAL}"
          - "target Vehicle.status == AVAILABLE"
          - "target Vehicle.plan_id == subscription.plan_id"
          - "expected_vehicle_version matches Vehicle.version (OCC)"
        side_effects:
          - "Vehicle.status AVAILABLE -> RESERVED (cross-entity)"
          - "Vehicle.active_subscription_id := subscription.id"
          - "increments Vehicle.version by 1"
          - "subscription.active_vehicle_id := vehicle.id"
          - "subscription.deposit_held_cents := Applicant.required_deposit_cents"
          - "Fleet.in_use_count and Fleet.utilization_pct recomputed for the vehicle's fleet"
        note: "Cascade origin A→B→C: assign mutates Vehicle (B); Vehicle status change recomputes its Fleet (C)."
      - from: PENDING_DELIVERY
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: FleetOperator
        preconditions:
          - "subscription.lifecycle_status == PENDING_DELIVERY"
          - "active Vehicle.status == RESERVED"
          - "a DeliverySlot for this subscription with kind == DELIVERY exists and status == SCHEDULED"
        side_effects:
          - "Vehicle.status RESERVED -> ASSIGNED (cross-entity)"
          - "increments Vehicle.version by 1"
          - "the DELIVERY DeliverySlot.status SCHEDULED -> FULFILLED"
          - "subscription.term_start_iso := clock.now; subscription.cycle_start_iso := clock.now"
          - "opens BillingCycle #1 (status OPEN, odometer_start_miles := Vehicle.odometer_miles)"
          - "Fleet.utilization_pct recomputed (RESERVED and ASSIGNED both count as in_use; net unchanged)"
      - from: ACTIVE
        to: RETURN_PENDING
        trigger: "POST /subscriptions/{id}/initiate-return"
        actor: Member
        preconditions:
          - "subscription.lifecycle_status == ACTIVE"
          - "subscription.billing_status == CURRENT"
        side_effects:
          - "no Vehicle state change yet; return logistics scheduled separately"
        note: "Guard: blocked when billing_status == PAST_DUE (cross-axis dependency on same entity)."
      - from: RETURN_PENDING
        to: CLOSED
        trigger: "POST /return-inspections/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "subscription.lifecycle_status == RETURN_PENDING"
          - "the ReturnInspection.subscription_id == subscription.id AND ReturnInspection.status == ASSESSED"
        side_effects:
          - "ReturnInspection.status ASSESSED -> SETTLED (deposit waterfall runs)"
          - "active Vehicle.status IN_INSPECTION -> AVAILABLE; Vehicle.active_subscription_id := null"
          - "increments Vehicle.version by 1"
          - "Fleet.in_use_count decremented; Fleet.utilization_pct recomputed"
          - "subscription.active_vehicle_id := null"
          - "posts RETURN_SETTLEMENT Invoice; subscription.lifetime_billed_cents += invoice.amount_cents"
        note: "Cascade depth-3 origin: settle mutates ReturnInspection (B) -> Vehicle->AVAILABLE (C) -> Fleet recompute (D)."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /subscriptions/{id}/early-cancel"
        actor: Member
        preconditions:
          - "subscription.lifecycle_status == ACTIVE"
          - "min-term not yet elapsed: clock.now < term_start_iso + plan.min_term_months months"
          - "expected_subscription_version matches Subscription.version (OCC)"
        side_effects:
          - "computes early_cancel_fee (forward-looking variant) and posts EARLY_CANCEL Invoice"
          - "subscription.lifetime_billed_cents += invoice.amount_cents"
          - "increments Subscription.version by 1"
          - "active Vehicle.status (ASSIGNED) -> IN_INSPECTION (return still required)"
          - "increments Vehicle.version by 1"
        note: "Early-cancel leaves vehicle IN_INSPECTION pending a separate ReturnInspection+settle."

  - entity: Subscription
    initial_state: CURRENT          # billing_status axis (parallel dimension on the same entity)
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/mark-past-due"
        actor: BillingAdmin
        preconditions:
          - "subscription.billing_status == CURRENT"
        side_effects:
          - "subscription.billing_status := PAST_DUE"
        note: "Explicit BillingAdmin delinquency flag; independent of lifecycle_status, so a subscription can be ACTIVE+PAST_DUE. No invoice precondition — the operator marks the account directly."
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /subscriptions/{id}/record-payment"
        actor: BillingAdmin
        preconditions:
          - "subscription.billing_status == PAST_DUE"
        side_effects:
          - "subscription.billing_status := CURRENT"

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /subscriptions/{id}/assign-vehicle"
        actor: FleetOperator
        preconditions:
          - "Vehicle.status == AVAILABLE"
          - "expected_vehicle_version matches Vehicle.version (OCC)"
        side_effects:
          - "Vehicle.active_subscription_id := subscription.id"
          - "increments Vehicle.version by 1"
          - "Fleet.in_use_count += 1; Fleet.utilization_pct recomputed"
      - from: RESERVED
        to: ASSIGNED
        trigger: "POST /subscriptions/{id}/activate"
        actor: FleetOperator
        preconditions:
          - "Vehicle.status == RESERVED"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: ASSIGNED
        to: IN_INSPECTION
        trigger: "POST /return-inspections (open inspection) OR early-cancel side-effect"
        actor: FleetOperator
        preconditions:
          - "Vehicle.status == ASSIGNED"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: IN_INSPECTION
        to: AVAILABLE
        trigger: "POST /return-inspections/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "Vehicle.status == IN_INSPECTION"
        side_effects:
          - "Vehicle.active_subscription_id := null"
          - "increments Vehicle.version by 1"
          - "Fleet.in_use_count -= 1; Fleet.utilization_pct recomputed"
      - from: ASSIGNED
        to: MAINTENANCE
        trigger: "POST /vehicles/{id}/maintenance"
        actor: FleetOperator
        preconditions:
          - "Vehicle.status == ASSIGNED"
          - "no overlapping non-terminal DeliverySlot conflict per buffer geometry"
        side_effects:
          - "increments Vehicle.version by 1"
          - "Fleet.in_use_count -= 1; Fleet.utilization_pct recomputed (MAINTENANCE not in_use)"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /vehicles/{id}/maintenance-complete"
        actor: FleetOperator
        preconditions:
          - "Vehicle.status == MAINTENANCE"
        side_effects:
          - "increments Vehicle.version by 1"

  - entity: SwapRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /swap-requests/{id}/approve"
        actor: FleetOperator
        preconditions:
          - "swap.status == REQUESTED"
          - "subscription.lifecycle_status == ACTIVE"
          - "to_vehicle.status == AVAILABLE (any plan tier — swap may upgrade/downgrade)"
          - "expected_vehicle_version matches to_vehicle.version (OCC on target Vehicle)"
        side_effects:
          - "to_vehicle.status AVAILABLE -> RESERVED; to_vehicle.active_subscription_id := subscription.id"
          - "increments to_vehicle.version by 1"
          - "Fleet.in_use_count += 1 for to_vehicle's fleet; utilization_pct recomputed"
        note: "Fork: target reserved while from_vehicle still ASSIGNED; join at COMPLETED."
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /swap-requests/{id}/complete"
        actor: FleetOperator
        preconditions:
          - "swap.status == APPROVED"
          - "from_vehicle.status == ASSIGNED AND to_vehicle.status == RESERVED"
        side_effects:
          - "computes swap_fee_applied_cents (gated on subscription.swaps_used vs plan.included_swaps_per_term BEFORE increment)"
          - "computes net_adjustment_cents proration; posts SWAP Invoice; lifetime_billed_cents += amount"
          - "from_vehicle.status ASSIGNED -> IN_INSPECTION; from_vehicle.active_subscription_id := null; from_vehicle.version += 1"
          - "to_vehicle.status RESERVED -> ASSIGNED; to_vehicle.version += 1"
          - "subscription.active_vehicle_id := to_vehicle.id; subscription.plan_id := to_vehicle.plan_id; subscription.swaps_used += 1"
          - "Fleet recompute for both fleets (from_vehicle leaves in_use; to_vehicle stays in_use)"
        note: "Join: both branches converge; from_vehicle path differs (->IN_INSPECTION) from to_vehicle path (->ASSIGNED) — divergent side-effect sets."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /swap-requests/{id}/reject"
        actor: FleetOperator
        preconditions:
          - "swap.status == REQUESTED"
        side_effects:
          - "no vehicle or fee changes (target was never reserved)"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /swap-requests/{id}/reject"
        actor: FleetOperator
        preconditions:
          - "swap.status == APPROVED"
        side_effects:
          - "compensation: to_vehicle.status RESERVED -> AVAILABLE; to_vehicle.active_subscription_id := null; to_vehicle.version += 1"
          - "Fleet.in_use_count -= 1 for to_vehicle's fleet; utilization_pct recomputed (reverts the approve reservation)"
        note: "Compensating action: reject-after-approve must leave Fleet.in_use_count exactly as before approve."

  - entity: ReturnInspection
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /return-inspections/{id}/assess"
        actor: FleetOperator
        preconditions:
          - "inspection.status == OPEN"
        side_effects:
          - "total_damage_cents := sum of DamageLineItem.amount_cents for this inspection"
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /return-inspections/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "inspection.status == ASSESSED"
          - "subscription.lifecycle_status == RETURN_PENDING OR subscription.active_vehicle_id == vehicle.id with vehicle IN_INSPECTION"
        side_effects:
          - "runs deposit waterfall; sets deposit_applied/refunded/balance_due"
          - "drives Subscription RETURN_PENDING -> CLOSED and Vehicle IN_INSPECTION -> AVAILABLE (see Subscription/Vehicle machines)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assign-vehicle-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /subscriptions/{id}/assign-vehicle"
    occ_field: "expected_vehicle_version"
    description: |
      Assigning a Vehicle to a Subscription whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      operator has just reserved that same vehicle for a different subscription
      (a legitimate supersede of the AVAILABLE state), so the current operator's
      view of the vehicle is stale. The loser carries an expected_vehicle_version
      that no longer matches.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

  - rule_id: swap-approve-stale-target-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /swap-requests/{id}/approve"
    occ_field: "expected_vehicle_version"
    description: |
      Approving a SwapRequest reserves the target Vehicle. If that target
      Vehicle's version has advanced since the client read it — e.g. another
      operator already reserved it for an assignment or another swap — the
      approval is rejected on the stale version, leaving exactly one writer
      able to reserve it.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: mileage_overage
    trigger: "POST /billing-cycles/{id}/close"
    algorithm: tiered_pricing
    formula: |
      delta = odometer_end_miles - odometer_start_miles            # >= 0 enforced by validation
      billable = max(0, delta - plan.included_miles_per_cycle - plan.free_buffer_miles)
      tier1 = min(billable, OVERAGE_TIER1_LIMIT)
      tier2 = max(0, billable - OVERAGE_TIER1_LIMIT)
      overage_cents = round(tier1 * plan.overage_tier1_rate_cents
                            + tier2 * plan.overage_tier2_rate_cents)
      # evaluation order pinned: subtract included THEN buffer, allocate tier1 before tier2.
    input_set: "single closing BillingCycle; odometer delta only (no cross-cycle carryover)."
    constants:
      OVERAGE_TIER1_LIMIT: 200
    precision: "integer cents, round_half_up"
    variants:
      - name: at_threshold
        when: "delta == included + buffer exactly"
        difference: "billable == 0; overage_cents == 0 (boundary: included+buffer is free, included+buffer+1 bills 1 mile)."

  - name: early_cancel_fee
    trigger: "POST /subscriptions/{id}/early-cancel"
    algorithm: forward_looking
    formula: |
      elapsed_full_months = whole months between term_start_iso and clock.now (floor)
      remaining_full_months = max(0, plan.min_term_months - elapsed_full_months)
      fee_cents = round(remaining_full_months * plan.monthly_fee_cents * EARLY_PENALTY_PCT)
    input_set: "projected remaining commitment; ignores actual days used in the current open cycle."
    constants:
      EARLY_PENALTY_PCT: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: forward_looking_remaining
        when: "early-cancel before min-term elapses"
        difference: "Charges projected unfulfilled months at 50%; identical subscription processed by the chronological variant below yields a different number."
      - name: chronological_actual
        when: "settlement reconstructs the actual unbilled accrual chronologically (used by /subscriptions/{id}/cancel-quote?mode=CHRONOLOGICAL)"
        difference: |
          fee_cents = FLAT_ETF_CENTS + round(plan.monthly_fee_cents / current_cycle_day_count * unbilled_days_in_open_cycle).
          Same subscription state -> different fee than forward_looking (e.g. 160000 vs 55806 for the worked instance).

  - name: eligibility_score
    trigger: "POST /applicants/{id}/decide-eligibility"
    algorithm: weighted_scoring
    formula: |
      norm_credit = (credit_score - 300) / 550                      # 0..1
      income_ratio = min(monthly_income_cents / plan.monthly_fee_cents, INCOME_RATIO_CAP)
      norm_income = income_ratio / INCOME_RATIO_CAP                  # 0..1
      hist = {CLEAN: 1.0, MINOR: 0.5, SEVERE: 0.0}[history_flag]
      raw = W_CREDIT*norm_credit + W_INCOME*norm_income + W_HISTORY*hist
      eligibility_score = round(raw, 4)
      # tier (deposit multiplier):
      #   score >= 0.80           -> APPROVED,    deposit = deposit_base_cents * 1
      #   0.60 <= score < 0.80    -> CONDITIONAL, deposit = deposit_base_cents * 2
      #   score < 0.60            -> DECLINED,    deposit = null
      required_deposit_cents = deposit_base_cents * multiplier
    input_set: "single Applicant + the SubscriptionPlan named in the decide request body."
    constants:
      W_CREDIT: 0.5
      W_INCOME: 0.3
      W_HISTORY: 0.2
      INCOME_RATIO_CAP: 5
    precision: "score 4 decimals round_half_up; deposit integer cents"
    variants:
      - name: approved_boundary
        when: "score lands at exactly 0.80 or 0.60"
        difference: ">= is inclusive: 0.80 -> APPROVED (1x); 0.60 -> CONDITIONAL (2x); 0.5991 -> DECLINED."

  - name: swap_net_adjustment
    trigger: "POST /swap-requests/{id}/complete"
    algorithm: aggregation
    formula: |
      from_plan = plan of swap.from_vehicle; to_plan = plan of swap.to_vehicle (may differ — upgrade/downgrade)
      cycle_days = number of days in the calendar month of subscription.cycle_start_iso
      remaining_days = whole days from clock.now to (cycle_start_iso + cycle_days), floor; min 0
      credit_old_cents  = round(from_plan.monthly_fee_cents * remaining_days / cycle_days)   # step 1
      charge_new_cents  = round(to_plan.monthly_fee_cents   * remaining_days / cycle_days)   # step 2
      swap_fee_applied_cents = SWAP_FEE_CENTS if subscription.swaps_used >= from_plan.included_swaps_per_term else 0   # step 3, BEFORE increment
      net_adjustment_cents = charge_new_cents - credit_old_cents + swap_fee_applied_cents     # step 4 (may be negative on a downgrade)
    input_set: "two SubscriptionPlans (from_vehicle.plan, to_vehicle.plan) + the subscription's open cycle window."
    constants:
      SWAP_FEE_CENTS: 7500
    precision: "round each proration leg independently to integer cents, then sum (per-leg rounding pinned BEFORE summation)."
    variants:
      - name: free_swap
        when: "subscription.swaps_used < plan.included_swaps_per_term"
        difference: "swap_fee_applied_cents == 0; net is pure proration delta."

  - name: deposit_settlement_waterfall
    trigger: "POST /return-inspections/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      outstanding_cents = inspection.total_damage_cents
                        + sum(unpaid CYCLE Invoice.amount_cents for subscription)
                        + sum(unpaid EARLY_CANCEL Invoice.amount_cents for subscription)
      deposit_applied_cents  = min(subscription.deposit_held_cents, outstanding_cents)
      deposit_refunded_cents = subscription.deposit_held_cents - deposit_applied_cents
      balance_due_cents      = outstanding_cents - deposit_applied_cents
      # RETURN_SETTLEMENT Invoice.amount_cents := balance_due_cents (the still-owed remainder)
    input_set: "one ReturnInspection + the subscription's unpaid Invoices (status-filtered to unpaid CYCLE and EARLY_CANCEL kinds)."
    constants: {}
    precision: "integer cents; no rounding (all inputs already integer cents)."
    variants:
      - name: full_refund
        when: "outstanding_cents == 0"
        difference: "deposit_applied == 0; deposit_refunded == deposit_held; balance_due == 0."

  - name: fleet_utilization
    trigger: "any Vehicle.status transition (assign, activate, swap, settle, maintenance)"
    algorithm: aggregation
    formula: |
      total_vehicles = count(Vehicle where fleet_id == fleet.id)              # any status
      in_use_count   = count(Vehicle where fleet_id == fleet.id AND status IN {RESERVED, ASSIGNED})
      utilization_pct = round(in_use_count / total_vehicles, 4) if total_vehicles > 0 else 0
    input_set: "all Vehicles of one Fleet; MAINTENANCE and IN_INSPECTION are NOT in_use; AVAILABLE not in_use."
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: reservation_inclusive
        when: "the persisted Fleet.utilization_pct (canonical)"
        difference: "RESERVED and ASSIGNED both count as in_use; a fleet with 1 RESERVED + 1 ASSIGNED of 4 reads 0.5."
      - name: assignment_only
        when: "the GET /fleets/{id}/utilization?basis=ASSIGNED_ONLY projection (operator what-if)"
        difference: "Only ASSIGNED counts; the same 1 RESERVED + 1 ASSIGNED of 4 fleet reads 0.25 — a different number for identical vehicle state."
      - name: empty_fleet
        when: "total_vehicles == 0"
        difference: "utilization_pct == 0 (avoid divide-by-zero), not null."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires PlatformAdmin"

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "entity_backed Member acting on a Subscription must own it (X-User-ID == subscription.applicant_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /subscriptions/{id}/initiate-return, POST /subscriptions/{id}/early-cancel, POST /subscriptions/{id}/swap-requests"

  - priority: 4
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "required body fields present and well-typed; enums within declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Vehicle.plan_id must equal Subscription.plan_id on initial assign-vehicle (swaps may cross plan tiers — that is an upgrade/downgrade)"
    error_id: ERR_PLAN_MISMATCH
    http_status: 409
    applies_to: "POST /subscriptions/{id}/assign-vehicle"

  - priority: 8
    category: business_safety
    check: "assign/activate blocked unless the referenced Applicant.eligibility_status IN {APPROVED, CONDITIONAL}"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/assign-vehicle"

  - priority: 9
    category: business_safety
    check: "initiate-return / early-cancel blocked while subscription.billing_status == PAST_DUE"
    error_id: ERR_BILLING_PAST_DUE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/initiate-return, POST /subscriptions/{id}/early-cancel"

  - priority: 10
    category: business_temporal
    check: "early-cancel only valid before min-term elapses (clock.now < term_start_iso + plan.min_term_months months)"
    error_id: ERR_MIN_TERM_ELAPSED
    http_status: 409
    applies_to: "POST /subscriptions/{id}/early-cancel"

  - priority: 11
    category: business_temporal
    check: "DeliverySlot half-open vehicle reservation: a new DELIVERY/RETURN slot must not overlap an existing non-cancelled slot on the same Vehicle's active reservation window [start,end) (adjacency end==start allowed)"
    error_id: ERR_VEHICLE_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /delivery-slots"

  - priority: 12
    category: business_temporal
    check: "Courier slot closed-interval+buffer: a new DeliverySlot must keep a courier.buffer_minutes gap from every other non-cancelled slot of the same Courier; padded closed intervals may not touch"
    error_id: ERR_COURIER_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-slots"

  - priority: 13
    category: business_constraint
    check: "Vehicle.vin unique across all Vehicles; Applicant.email unique; SubscriptionPlan.tier unique among ACTIVE plans"
    error_id: ERR_DUPLICATE_VALUE
    http_status: 409
    applies_to: "POST /vehicles, POST /applicants, POST /subscription-plans"

  - priority: 14
    category: business_constraint
    check: "BillingCycle close requires odometer_end_miles >= odometer_start_miles"
    error_id: ERR_ODOMETER_REGRESSION
    http_status: 422
    applies_to: "POST /billing-cycles/{id}/close"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the live parent version"
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/assign-vehicle, POST /swap-requests/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_subscription_version must equal the live Subscription.version"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/early-cancel"

  - priority: 17
    category: business_fiscal
    check: "no available vehicle in the requested fleet/plan when one is required by the operation"
    error_id: ERR_NO_VEHICLE_AVAILABLE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/assign-vehicle (when target Vehicle not provided and pool is empty)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Catalog / setup ----
  - method: POST
    path: "/subscription-plans"
    description: "Create a subscription plan tier."
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, included_miles_per_cycle, "free_buffer_miles?", overage_tier1_rate_cents, overage_tier2_rate_cents, "included_swaps_per_term?", min_term_months, deposit_base_cents]
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/subscription-plans/{id}"
    description: "Fetch a plan."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: SubscriptionPlan

  - method: GET
    path: "/subscription-plans"
    description: "List plans."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SubscriptionPlan[]

  - method: POST
    path: "/fleets"
    description: "Create a fleet."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code]
    output: Fleet
    side_effects: ["initializes total_vehicles=0, in_use_count=0, utilization_pct=0"]

  - method: GET
    path: "/fleets/{id}"
    description: "Fetch a fleet with derived utilization."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: []
    output: Fleet

  - method: GET
    path: "/fleets"
    description: "List fleets."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: ["region_code?", "limit?", "offset?"]
    output: Fleet[]

  - method: GET
    path: "/fleets/{id}/vehicles"
    description: "List vehicles of a fleet (FK reverse-reachability for Vehicle.fleet_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vehicle[]

  - method: GET
    path: "/fleets/{id}/utilization"
    description: "Computed utilization under a chosen counting basis (what-if projection; does not mutate the persisted canonical utilization_pct)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: ["basis?"]
    output: "{ basis: string, total_vehicles: integer, in_use_count: integer, utilization_pct: number }"

  - method: POST
    path: "/vehicles"
    description: "Add a vehicle to a fleet under a plan."
    roles: [FleetOperator, PlatformAdmin]
    code: 201
    input: [fleet_id, plan_id, vin, model_label, odometer_miles]
    output: Vehicle
    side_effects: ["Fleet.total_vehicles recomputed; utilization_pct recomputed"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: Vehicle

  - method: GET
    path: "/vehicles"
    description: "List/filter vehicles (FK reverse-reachability for Vehicle.fleet_id, Vehicle.plan_id, Vehicle.active_subscription_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: ["fleet_id?", "plan_id?", "active_subscription_id?", "status?", "limit?", "offset?"]
    output: Vehicle[]

  - method: POST
    path: "/vehicles/{id}/maintenance"
    description: "Move an ASSIGNED vehicle into MAINTENANCE."
    roles: [FleetOperator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["Vehicle.status -> MAINTENANCE; version+1; Fleet.in_use_count-1; utilization_pct recomputed"]

  - method: POST
    path: "/vehicles/{id}/maintenance-complete"
    description: "Return a MAINTENANCE vehicle to AVAILABLE."
    roles: [FleetOperator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["Vehicle.status -> AVAILABLE; version+1"]

  # ---- Applicant / eligibility ----
  - method: POST
    path: "/applicants"
    description: "Register an applicant."
    roles: [PlatformAdmin, Member]
    code: 201
    input: [full_name, email, credit_score, monthly_income_cents, history_flag]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Fetch an applicant."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: Applicant

  - method: POST
    path: "/applicants/{id}/decide-eligibility"
    description: "Run eligibility scoring against a named plan; sets eligibility_status, score, required_deposit_cents."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: [plan_id]
    output: Applicant
    side_effects: ["computes eligibility_score, eligibility_status, required_deposit_cents (eligibility_score calc)"]

  # ---- Subscription lifecycle ----
  - method: POST
    path: "/subscriptions"
    description: "Create a DRAFT subscription for an eligible applicant on a plan."
    roles: [Member, PlatformAdmin]
    code: 201
    input: [applicant_id, plan_id]
    output: Subscription
    side_effects: ["lifecycle_status=DRAFT, billing_status=CURRENT, deposit_held_cents=0, swaps_used=0"]

  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription (both state axes + derived lifetime_billed_cents)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: Subscription

  - method: GET
    path: "/subscriptions"
    description: "List/filter subscriptions (FK reverse-reachability for Subscription.applicant_id, plan_id, active_vehicle_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["applicant_id?", "plan_id?", "active_vehicle_id?", "lifecycle_status?", "billing_status?", "limit?", "offset?"]
    output: Subscription[]

  - method: POST
    path: "/subscriptions/{id}/assign-vehicle"
    description: "Reserve a vehicle for a DRAFT subscription (OCC on Vehicle.version)."
    roles: [FleetOperator]
    code: 200
    input: [vehicle_id, expected_vehicle_version]
    output: Subscription
    side_effects:
      - "Vehicle AVAILABLE->RESERVED; increments Vehicle.version by 1; Vehicle.active_subscription_id set"
      - "Subscription DRAFT->PENDING_DELIVERY; active_vehicle_id set; deposit_held_cents := Applicant.required_deposit_cents"
      - "Fleet.in_use_count+1; utilization_pct recomputed"

  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "Activate after delivery slot fulfilled; opens billing cycle #1."
    roles: [FleetOperator]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "Vehicle RESERVED->ASSIGNED; increments Vehicle.version by 1"
      - "DELIVERY DeliverySlot SCHEDULED->FULFILLED"
      - "Subscription PENDING_DELIVERY->ACTIVE; term_start_iso, cycle_start_iso set; BillingCycle #1 opened"

  - method: POST
    path: "/subscriptions/{id}/initiate-return"
    description: "Member starts the return flow (ACTIVE->RETURN_PENDING); blocked if PAST_DUE."
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription lifecycle_status ACTIVE->RETURN_PENDING"]

  - method: POST
    path: "/subscriptions/{id}/early-cancel"
    description: "Member cancels before min-term (OCC on Subscription.version); posts EARLY_CANCEL invoice; vehicle -> IN_INSPECTION."
    roles: [Member]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects:
      - "early_cancel_fee (forward-looking) computed; EARLY_CANCEL Invoice posted; lifetime_billed_cents += amount"
      - "increments Subscription.version by 1"
      - "active Vehicle ASSIGNED->IN_INSPECTION; increments Vehicle.version by 1"
      - "Subscription lifecycle_status ACTIVE->CLOSED"

  - method: GET
    path: "/subscriptions/{id}/cancel-quote"
    description: "What-if quote of the cancellation fee under a given mode without mutating state."
    roles: [Member, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["mode?"]
    output: "{ mode: string, fee_cents: integer }"

  - method: POST
    path: "/subscriptions/{id}/mark-past-due"
    description: "Flip billing_status to PAST_DUE (independent axis)."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["billing_status CURRENT->PAST_DUE"]

  - method: POST
    path: "/subscriptions/{id}/record-payment"
    description: "Flip billing_status back to CURRENT."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["billing_status PAST_DUE->CURRENT"]

  - method: GET
    path: "/subscriptions/{id}/billing-cycles"
    description: "List billing cycles of a subscription (FK reverse-reachability for BillingCycle.subscription_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingCycle[]

  - method: GET
    path: "/subscriptions/{id}/invoices"
    description: "List invoices of a subscription (FK reverse-reachability for Invoice.subscription_id)."
    roles: [PlatformAdmin, BillingAdmin, Member]
    code: 200
    input: ["source_kind?", "limit?", "offset?"]
    output: Invoice[]

  # ---- Billing cycles ----
  - method: GET
    path: "/billing-cycles/{id}"
    description: "Fetch a billing cycle."
    roles: [PlatformAdmin, BillingAdmin, Member]
    code: 200
    input: []
    output: BillingCycle

  - method: GET
    path: "/billing-cycles"
    description: "List/filter billing cycles (FK reverse-reachability for BillingCycle.subscription_id and vehicle_id)."
    roles: [PlatformAdmin, BillingAdmin, Member]
    code: 200
    input: ["subscription_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: BillingCycle[]

  - method: POST
    path: "/billing-cycles/{id}/close"
    description: "Close an OPEN cycle with the reported odometer; bills tiered overage; opens the next cycle."
    roles: [BillingAdmin]
    code: 200
    input: [odometer_end_miles]
    output: BillingCycle
    side_effects:
      - "computes overage_cents (mileage_overage calc); posts CYCLE Invoice (monthly_fee + overage); lifetime_billed_cents += amount"
      - "Vehicle.odometer_miles := odometer_end_miles"
      - "cycle.status OPEN->CLOSED; opens next BillingCycle (cycle_index+1, OPEN) if subscription still ACTIVE"

  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice."
    roles: [PlatformAdmin, BillingAdmin, Member]
    code: 200
    input: []
    output: Invoice

  - method: GET
    path: "/invoices"
    description: "List/filter invoices (FK reverse-reachability for Invoice.subscription_id)."
    roles: [PlatformAdmin, BillingAdmin, Member]
    code: 200
    input: ["subscription_id?", "source_kind?", "limit?", "offset?"]
    output: Invoice[]

  # ---- Swap / upgrade ----
  - method: POST
    path: "/subscriptions/{id}/swap-requests"
    description: "Member requests a vehicle swap/upgrade for an ACTIVE subscription."
    roles: [Member]
    code: 201
    input: [to_vehicle_id]
    output: SwapRequest
    side_effects: ["SwapRequest REQUESTED; from_vehicle_id := subscription.active_vehicle_id"]

  - method: GET
    path: "/swap-requests/{id}"
    description: "Fetch a swap request."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: SwapRequest

  - method: GET
    path: "/swap-requests"
    description: "List/filter swap requests (FK reverse-reachability for SwapRequest.subscription_id, from_vehicle_id, to_vehicle_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["subscription_id?", "from_vehicle_id?", "to_vehicle_id?", "status?", "limit?", "offset?"]
    output: SwapRequest[]

  - method: POST
    path: "/swap-requests/{id}/approve"
    description: "Operator approves a swap; reserves the target vehicle (OCC on target Vehicle.version)."
    roles: [FleetOperator]
    code: 200
    input: [expected_vehicle_version]
    output: SwapRequest
    side_effects:
      - "to_vehicle AVAILABLE->RESERVED; increments to_vehicle.version by 1; active_subscription_id set"
      - "Fleet.in_use_count+1 for to_vehicle's fleet; utilization_pct recomputed"
      - "SwapRequest REQUESTED->APPROVED"

  - method: POST
    path: "/swap-requests/{id}/complete"
    description: "Complete an approved swap; prorates and posts SWAP invoice; flips both vehicles."
    roles: [FleetOperator]
    code: 200
    input: []
    output: SwapRequest
    side_effects:
      - "computes swap_fee_applied_cents + net_adjustment_cents (swap_net_adjustment calc); posts SWAP Invoice; lifetime_billed_cents += amount"
      - "from_vehicle ASSIGNED->IN_INSPECTION (version+1); to_vehicle RESERVED->ASSIGNED (version+1)"
      - "subscription.active_vehicle_id := to_vehicle.id; subscription.plan_id := to_vehicle.plan_id; swaps_used += 1"
      - "Fleet recompute for both fleets"

  - method: POST
    path: "/swap-requests/{id}/reject"
    description: "Reject a swap; if it was APPROVED, compensates the target reservation back to AVAILABLE."
    roles: [FleetOperator]
    code: 200
    input: []
    output: SwapRequest
    side_effects:
      - "if was APPROVED: to_vehicle RESERVED->AVAILABLE (version+1); active_subscription_id cleared; Fleet.in_use_count-1; utilization_pct recomputed"
      - "SwapRequest -> REJECTED"

  # ---- Return / inspection ----
  - method: POST
    path: "/return-inspections"
    description: "Open a return inspection for a returning vehicle (also moves ASSIGNED vehicle to IN_INSPECTION)."
    roles: [FleetOperator]
    code: 201
    input: [subscription_id, vehicle_id, reported_odometer_miles]
    output: ReturnInspection
    side_effects: ["ReturnInspection OPEN; Vehicle ASSIGNED->IN_INSPECTION (version+1) if still ASSIGNED"]

  - method: GET
    path: "/return-inspections/{id}"
    description: "Fetch a return inspection."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: ReturnInspection

  - method: GET
    path: "/return-inspections"
    description: "List/filter return inspections (FK reverse-reachability for ReturnInspection.subscription_id, vehicle_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["subscription_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: ReturnInspection[]

  - method: POST
    path: "/return-inspections/{id}/damage-line-items"
    description: "Add a damage line item to an OPEN inspection."
    roles: [FleetOperator]
    code: 201
    input: [severity, amount_cents, "note?"]
    output: DamageLineItem
    side_effects: []

  - method: GET
    path: "/return-inspections/{id}/damage-line-items"
    description: "List damage line items of an inspection (FK reverse-reachability for DamageLineItem.inspection_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: DamageLineItem[]

  - method: POST
    path: "/return-inspections/{id}/assess"
    description: "Assess an OPEN inspection; sums damage line items into total_damage_cents."
    roles: [FleetOperator]
    code: 200
    input: []
    output: ReturnInspection
    side_effects: ["total_damage_cents := sum of DamageLineItem.amount_cents; status OPEN->ASSESSED"]

  - method: POST
    path: "/return-inspections/{id}/settle"
    description: "Settle an ASSESSED inspection; runs deposit waterfall; closes subscription; releases vehicle."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: ReturnInspection
    side_effects:
      - "deposit waterfall sets deposit_applied/refunded/balance_due; posts RETURN_SETTLEMENT Invoice; lifetime_billed_cents += balance_due"
      - "ReturnInspection ASSESSED->SETTLED"
      - "Vehicle IN_INSPECTION->AVAILABLE (version+1); active_subscription_id cleared; Fleet.in_use_count-1; utilization_pct recomputed"
      - "Subscription RETURN_PENDING->CLOSED; active_vehicle_id cleared"

  # ---- Delivery / return logistics ----
  - method: POST
    path: "/couriers"
    description: "Register a delivery courier for a fleet."
    roles: [FleetOperator, PlatformAdmin]
    code: 201
    input: [name, fleet_id, "buffer_minutes?"]
    output: Courier
    side_effects: []

  - method: GET
    path: "/couriers/{id}"
    description: "Fetch a courier."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: []
    output: Courier

  - method: GET
    path: "/couriers"
    description: "List couriers (FK reverse-reachability for Courier.fleet_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin]
    code: 200
    input: ["fleet_id?", "limit?", "offset?"]
    output: Courier[]

  - method: POST
    path: "/delivery-slots"
    description: "Schedule a delivery/return slot; enforces vehicle half-open overlap + courier closed+buffer geometry."
    roles: [FleetOperator]
    code: 201
    input: [courier_id, subscription_id, kind, window_start_iso, window_end_iso]
    output: DeliverySlot
    side_effects: []

  - method: GET
    path: "/delivery-slots/{id}"
    description: "Fetch a delivery slot."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: []
    output: DeliverySlot

  - method: GET
    path: "/delivery-slots"
    description: "List/filter delivery slots (FK reverse-reachability for DeliverySlot.courier_id, subscription_id)."
    roles: [PlatformAdmin, FleetOperator, BillingAdmin, Member]
    code: 200
    input: ["courier_id?", "subscription_id?", "kind?", "status?", "limit?", "offset?"]
    output: DeliverySlot[]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Startup default is 2026-04-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso: datetime }"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation per RBAC."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Member acting on a Subscription they do not own (X-User-ID != applicant_id)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path or body FK) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, or enum out of declared set."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the target's current state."
  - id: ERR_PLAN_MISMATCH
    http: 409
    condition: "Vehicle.plan_id != Subscription.plan_id on assign/swap-approve."
  - id: ERR_NOT_ELIGIBLE
    http: 409
    condition: "Applicant.eligibility_status not in {APPROVED, CONDITIONAL} when assigning a vehicle."
  - id: ERR_BILLING_PAST_DUE
    http: 409
    condition: "initiate-return / early-cancel attempted while billing_status == PAST_DUE."
  - id: ERR_MIN_TERM_ELAPSED
    http: 409
    condition: "early-cancel attempted at/after term_start_iso + plan.min_term_months months."
  - id: ERR_VEHICLE_SLOT_OVERLAP
    http: 409
    condition: "New delivery/return slot overlaps an existing non-cancelled slot on the same vehicle's reservation window (half-open [start,end))."
  - id: ERR_COURIER_BUFFER_CONFLICT
    http: 409
    condition: "New slot violates the courier.buffer_minutes gap against another non-cancelled slot of the same courier (closed-interval + buffer)."
  - id: ERR_DUPLICATE_VALUE
    http: 409
    condition: "Vehicle.vin / Applicant.email / SubscriptionPlan.tier uniqueness violated."
  - id: ERR_ODOMETER_REGRESSION
    http: 422
    condition: "BillingCycle close reported odometer_end_miles < odometer_start_miles."
  - id: ERR_STALE_VEHICLE_VERSION
    http: 412
    condition: "expected_vehicle_version != live Vehicle.version on assign or swap-approve."
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version != live Subscription.version on early-cancel."
  - id: ERR_NO_VEHICLE_AVAILABLE
    http: 409
    condition: "No AVAILABLE vehicle matching fleet/plan when assignment requires one and none is targeted."
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superset: manages catalog (plans), fleets, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /subscription-plans"
      - "POST /fleets"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /vehicles"
      - "POST /couriers"
      - "POST /applicants"
      - "POST /applicants/{id}/decide-eligibility"
      - "POST /subscriptions"
      - "all GET reads"

  - name: FleetOperator
    description: "Owns vehicle/fleet/courier logistics: assignment, activation, swaps, inspections, slots, maintenance."
    identity: opaque
    exclusive_operations:
      - "POST /subscriptions/{id}/assign-vehicle"
      - "POST /subscriptions/{id}/activate"
      - "POST /vehicles/{id}/maintenance"
      - "POST /vehicles/{id}/maintenance-complete"
      - "POST /swap-requests/{id}/approve"
      - "POST /swap-requests/{id}/complete"
      - "POST /swap-requests/{id}/reject"
      - "POST /return-inspections"
      - "POST /return-inspections/{id}/damage-line-items"
      - "POST /return-inspections/{id}/assess"
      - "POST /delivery-slots"
    shared_operations:
      - "POST /vehicles"
      - "POST /couriers"
      - "all GET reads"

  - name: BillingAdmin
    description: "Owns financial settlement: eligibility decision, cycle close, billing-status flips, deposit settlement."
    identity: opaque
    exclusive_operations:
      - "POST /billing-cycles/{id}/close"
      - "POST /subscriptions/{id}/mark-past-due"
      - "POST /subscriptions/{id}/record-payment"
      - "POST /return-inspections/{id}/settle"
    shared_operations:
      - "POST /applicants/{id}/decide-eligibility"
      - "GET /subscriptions/{id}/cancel-quote"
      - "all GET reads"

  - name: Member
    description: "Subscriber acting on their own Subscription: create, initiate-return, early-cancel, request swaps."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /subscriptions/{id}/initiate-return"
      - "POST /subscriptions/{id}/early-cancel"
      - "POST /subscriptions/{id}/swap-requests"
    shared_operations:
      - "POST /applicants"
      - "POST /subscriptions"
      - "GET /subscriptions/{id}/cancel-quote"
      - "own-resource GET reads"
