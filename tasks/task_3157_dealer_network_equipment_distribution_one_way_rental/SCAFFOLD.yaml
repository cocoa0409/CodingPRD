scenario: |
  Dealer Network Equipment Distribution & One-Way Rental Repositioning (U-Haul):
  independent dealer locations holding company-owned equipment with commission on
  rentals, one-way rental network where equipment accumulates at destinations and
  must be repositioned, rate setting by lane and season reflecting expected
  imbalance and repositioning cost, equipment availability guarantee with
  reservation reassignment across nearby locations, trailer and towing
  compatibility verification against the customer's vehicle before rental,
  damage protection product sales and claim handling at return, self-storage
  and moving supply cross-sell at the same location, dealer performance review
  and equipment allocation.

domain_name: "dealer-network-one-way-rental"
api_prefix: "/rental-network"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: dealer_code
        type: string
        source: input
        required: true
        description: "Globally unique human dealer code, e.g. UH-4821"
        constraints: "unique across Dealer"
      - name: name
        type: string
        source: input
        required: true
        description: "Dealer business name"
      - name: location_id
        type: string
        source: input
        required: true
        description: "FK -> Location.id; the site the dealer operates"
      - name: commission_rate_override
        type: number
        source: input
        required: false
        default: null
        description: "Optional per-dealer commission rate override (decimal 0..1); when null the LaneRate commission_rate for the settlement quarter applies"
      - name: status
        type: enum
        source: system
        required: true
        default: ACTIVE
        description: "Dealer operating posture"
        constraints: "one of ACTIVE | SUSPENDED | DEACTIVATED"
      - name: allocated_unit_count
        type: integer
        source: computed
        required: true
        default: 0
        description: "Count of EquipmentUnit rows whose current_dealer_id equals this dealer"
      - name: performance_score
        type: number
        source: computed
        required: true
        default: 0
        description: "Latest quarterly performance score written by POST /rental-network/performance-reviews; used as the allocation ranking key"

  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: location_code
        type: string
        source: input
        required: true
        description: "Globally unique site code, e.g. PHX-07"
        constraints: "unique across Location"
      - name: city
        type: string
        source: input
        required: true
        description: "City name"
      - name: geo_zone
        type: enum
        source: input
        required: true
        description: "Geographic zone used for reassignment search radius and storage capacity pooling"
        constraints: "one of NORTH | SOUTH | EAST | WEST | CENTRAL"
      - name: storage_capacity
        type: integer
        source: input
        required: true
        description: "Number of storage units at this site; aggregate pool per geo_zone"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        required: true
        default: OPEN
        description: "Location operating posture"
        constraints: "one of OPEN | CLOSED"

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        required: true
        description: "Globally unique fleet unit code"
        constraints: "unique across EquipmentUnit"
      - name: equipment_type
        type: enum
        source: input
        required: true
        description: "Fleet category"
        constraints: "one of TRUCK_10FT | TRUCK_15FT | TRUCK_26FT | TRAILER_4X8 | TRAILER_6X12 | TOW_DOLLY"
      - name: current_dealer_id
        type: string
        source: system
        required: true
        description: "FK -> Dealer.id; dealer currently holding the unit"
      - name: current_location_id
        type: string
        source: system
        required: true
        description: "FK -> Location.id; physical site of the unit"
      - name: status
        type: enum
        source: system
        required: true
        default: AVAILABLE
        description: "Unit lifecycle state"
        constraints: "one of AVAILABLE | HELD | OUT | REPOSITIONING | MAINTENANCE | RETIRED"
      - name: status_note
        type: string
        source: input
        required: false
        default: null
        description: "Free-text reason recorded on MAINTENANCE transitions"

  - name: VehicleProfile
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        required: true
        description: "Human label, e.g. '2019 F-150 SuperCrew 2WD'"
      - name: make
        type: string
        source: input
        required: true
        description: "Vehicle make"
      - name: model
        type: string
        source: input
        required: true
        description: "Vehicle model"
      - name: year
        type: integer
        source: input
        required: true
        description: "Model year"
        constraints: ">= 1980"
      - name: curb_weight_lbs
        type: integer
        source: input
        required: true
        description: "Vehicle curb weight in pounds"
        constraints: ">= 1000"
      - name: tow_capacity_lbs
        type: integer
        source: input
        required: true
        description: "Rated tow capacity in pounds; 0 means towing not rated"
        constraints: ">= 0"
      - name: hitch_class
        type: enum
        source: input
        required: true
        description: "Installed receiver class; NONE means no receiver"
        constraints: "one of CLASS_I | CLASS_II | CLASS_III | CLASS_IV | NONE"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        required: true
        description: "Unique customer email"
        constraints: "unique across Customer"
      - name: full_name
        type: string
        source: input
        required: true
        description: "Customer legal name"
      - name: vehicle_profile_id
        type: string
        source: input
        required: true
        description: "FK -> VehicleProfile.id; the tow vehicle presented at reservation time"
      - name: driver_license_verified
        type: boolean
        source: system
        required: true
        default: false
        description: "Set true only by POST /rental-network/customers/{id}/verify-license"

  - name: LaneRate
    parent: null
    common_fields: true
    fields:
      - name: origin_location_id
        type: string
        source: input
        required: true
        description: "FK -> Location.id; lane origin"
      - name: dest_location_id
        type: string
        source: input
        required: true
        description: "FK -> Location.id; lane destination"
      - name: equipment_type
        type: enum
        source: input
        required: true
        description: "Equipment category this rate row governs"
        constraints: "one of TRUCK_10FT | TRUCK_15FT | TRUCK_26FT | TRAILER_4X8 | TRAILER_6X12 | TOW_DOLLY"
      - name: season
        type: enum
        source: input
        required: true
        description: "Season bucket of the rental pickup date"
        constraints: "one of PEAK | SHOULDER | OFF_PEAK"
      - name: base_rate_cents
        type: integer
        source: input
        required: true
        description: "Per-day base rate in cents before adjustments"
        constraints: ">= 0"
      - name: reposition_surcharge_cents
        type: integer
        source: input
        required: true
        description: "Per-day surcharge in cents when imbalance_factor indicates destination accumulation"
        constraints: ">= 0"
      - name: imbalance_factor
        type: number
        source: computed
        required: true
        default: 1.0
        description: "Net accumulation signal for the lane; when > IMBALANCE_THRESHOLD the surcharge applies"
      - name: commission_rate
        type: number
        source: input
        required: true
        description: "Default commission rate (decimal 0..1) paid to dealers on settled rental totals for this lane/season"
        constraints: ">= 0 and <= 1"
      - name: status
        type: enum
        source: system
        required: true
        default: DRAFT
        description: "Rate lifecycle; only ACTIVE rows are used by quote_rated_price and commission_rate pinning"
        constraints: "one of DRAFT | ACTIVE | SUPERSEDED"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        required: true
        description: "FK -> Customer.id"
      - name: origin_dealer_id
        type: string
        source: input
        required: true
        description: "FK -> Dealer.id; dealer currently promising fulfilment (input at creation, mutated by reassignment)"
      - name: origin_location_id
        type: string
        source: system
        required: true
        description: "FK -> Location.id; mirrors origin_dealer's location at creation"
      - name: dest_location_id
        type: string
        source: input
        required: true
        description: "FK -> Location.id; drop-off site"
      - name: equipment_type
        type: enum
        source: input
        required: true
        description: "Requested equipment category"
        constraints: "one of TRUCK_10FT | TRUCK_15FT | TRUCK_26FT | TRAILER_4X8 | TRAILER_6X12 | TOW_DOLLY"
      - name: rental_kind
        type: enum
        source: input
        required: true
        description: "ROUND_TRIP returns to origin; ONE_WAY returns at dest_location_id"
        constraints: "one of ROUND_TRIP | ONE_WAY"
      - name: pickup_date
        type: datetime
        source: input
        required: true
        description: "Planned pickup instant (ISO8601); determines season and availability interval"
      - name: dropoff_date
        type: datetime
        source: input
        required: true
        description: "Planned return instant; rental_days derive from this window"
      - name: season
        type: enum
        source: computed
        required: true
        description: "Season bucket of pickup_date per season_of"
        constraints: "one of PEAK | SHOULDER | OFF_PEAK"
      - name: rental_days
        type: integer
        source: computed
        required: true
        description: "ceil((dropoff_date - pickup_date)/24h), minimum 1"
      - name: status
        type: enum
        source: system
        required: true
        default: QUOTED
        description: "Reservation lifecycle"
        constraints: "one of QUOTED | CONFIRMED | REASSIGNED | FULFILLED | CANCELLED | EXPIRED | NO_SHOW"
      - name: price_snapshot
        type: object
        source: computed
        required: true
        description: "Frozen quote components: quoted_rate_cents_per_day, applied_imbalance_factor, commission_rate, total_quoted_cents"
      - name: tow_check_result
        type: enum
        source: computed
        required: true
        default: NOT_REQUIRED
        description: "Result of towing compatibility evaluation at confirm time"
        constraints: "one of PASS | FAIL | NOT_REQUIRED"

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        required: true
        description: "FK -> Reservation.id; one agreement per reservation"
        constraints: "unique across RentalAgreement"
      - name: equipment_unit_id
        type: string
        source: input
        required: true
        description: "FK -> EquipmentUnit.id; physical unit checked out"
      - name: checkout_dealer_id
        type: string
        source: system
        required: true
        description: "FK -> Dealer.id; dealer performing checkout (equals reservation.origin_dealer_id at pickup)"
      - name: status
        type: enum
        source: system
        required: true
        default: ACTIVE
        description: "Agreement lifecycle"
        constraints: "one of ACTIVE | RETURNED | SETTLED"
      - name: checkout_at
        type: datetime
        source: system
        required: true
        description: "Logical-clock instant of pickup"
      - name: returned_at
        type: datetime
        source: system
        required: false
        default: null
        description: "Logical-clock instant of return; null while ACTIVE"
      - name: actual_days
        type: integer
        source: computed
        required: false
        default: null
        description: "ceil((returned_at - checkout_at)/24h), minimum 1; computed at return"
      - name: return_location_id
        type: string
        source: input
        required: true
        description: "FK -> Location.id; intended return site (reservation.dest for ONE_WAY, origin for ROUND_TRIP)"
      - name: late_fee_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Charged when actual_days exceeds reservation.rental_days; see calculate_settlement"
      - name: damage_charge_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Sum of DamageClaim amounts approved on this agreement; reconciled by reconcile_damage_charges"
      - name: total_settled_cents
        type: integer
        source: computed
        required: false
        default: null
        description: "Final settled total; see calculate_settlement"

  - name: DamageProtectionPlan
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        required: true
        description: "FK -> RentalAgreement.id; one plan per agreement"
        constraints: "unique across DamageProtectionPlan"
      - name: tier
        type: enum
        source: input
        required: true
        description: "Protection tier sold at pickup"
        constraints: "one of BASIC | STANDARD | PREMIUM"
      - name: premium_cents
        type: integer
        source: computed
        required: true
        description: "Protection premium; see protection_premium"
      - name: status
        type: enum
        source: system
        required: true
        default: ACTIVE
        description: "Plan lifecycle"
        constraints: "one of ACTIVE | EXPIRED | CANCELLED"

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        required: true
        description: "FK -> RentalAgreement.id; agreement the damage is reported against"
      - name: claimed_amount_cents
        type: integer
        source: input
        required: true
        description: "Claimed repair cost in cents"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        required: true
        default: FILED
        description: "Claim lifecycle"
        constraints: "one of FILED | APPROVED | DENIED | PAID"
      - name: approved_amount_cents
        type: integer
        source: computed
        required: false
        default: null
        description: "min(claimed_amount_cents, tier coverage cap); set on APPROVED"
      - name: resolution_note
        type: string
        source: input
        required: false
        default: null
        description: "Free-text resolution rationale recorded on APPROVED / DENIED"
      - name: filer_user_id
        type: string
        source: system
        required: true
        description: "X-User-ID of the DealerAgent who filed the claim; recorded at creation for segregation-of-duties checks"

  - name: RepositionTask
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: system
        required: true
        description: "FK -> EquipmentUnit.id; unit selected by the selector rule"
      - name: from_location_id
        type: string
        source: system
        required: true
        description: "FK -> Location.id; the imbalance origin"
      - name: to_location_id
        type: string
        source: system
        required: true
        description: "FK -> Location.id; deficit destination"
      - name: status
        type: enum
        source: system
        required: true
        default: OPEN
        description: "Task lifecycle"
        constraints: "one of OPEN | ASSIGNED | COMPLETED | CANCELLED"
      - name: assigned_driver_id
        type: string
        source: input
        required: false
        default: null
        description: "Operator identifier of the driver performing the move"
      - name: estimated_reposition_cost_cents
        type: integer
        source: computed
        required: true
        description: "Provisional reposition cost computed at creation (band cost only); see reposition_cost provisional_variant"
      - name: executed_reposition_cost_cents
        type: integer
        source: computed
        required: false
        default: null
        description: "Actual cost recorded on COMPLETED; feeds lane recompute"
      - name: scheduled_after
        type: datetime
        source: system
        required: true
        description: "Earliest start instant; defaults to logical clock at creation"

  - name: ReservationEvent
    parent: null
    common_fields: false
    fields:
      - name: reservation_id
        type: string
        source: system
        required: true
        description: "FK -> Reservation.id; append-only audit row"
      - name: event_type
        type: enum
        source: system
        required: true
        description: "Lifecycle event kind"
        constraints: "one of CREATED | CONFIRMED | REASSIGNED | CANCELLED | EXPIRED | NO_SHOW"
      - name: from_dealer_id
        type: string
        source: system
        required: false
        default: null
        description: "FK -> Dealer.id; dealer holding the reservation before a REASSIGNED event"
      - name: to_dealer_id
        type: string
        source: system
        required: false
        default: null
        description: "FK -> Dealer.id; dealer receiving the reservation after a REASSIGNED event"
      - name: note
        type: string
        source: system
        required: false
        default: null
        description: "Event detail (e.g. reassignment reason)"

  - name: CrossSellOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        required: true
        description: "FK -> Dealer.id; selling dealer"
      - name: agreement_id
        type: string
        source: input
        required: false
        default: null
        description: "FK -> RentalAgreement.id; optional link to the rental being cross-sold"
      - name: line_items
        type: array
        source: input
        required: true
        description: "Supply lines: array of { sku: string, qty: integer }"
      - name: storage_months
        type: integer
        source: input
        required: false
        default: 0
        description: "Months of self-storage purchased with this order; 0 = none"
        constraints: ">= 0"
      - name: supplies_subtotal_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Sum over line_items of catalog_price(sku) * qty, per-line rounded then summed"
      - name: storage_charge_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "storage_months * storage_month_rate_cents for the dealer's geo_zone"
      - name: bundle_discount_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Discount when supplies and storage are bought together; see cross_sell_bundle"
      - name: total_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "supplies_subtotal_cents + storage_charge_cents - bundle_discount_cents"

  - name: DealerSettlement
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        required: true
        description: "FK -> Dealer.id"
      - name: period
        type: string
        source: input
        required: true
        description: "Quarter label, e.g. 2026-Q3"
      - name: status
        type: enum
        source: system
        required: true
        default: DRAFT
        description: "Settlement lifecycle"
        constraints: "one of DRAFT | APPROVED | PAID | DISPUTED"
      - name: gross_rental_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Sum of total_settled_cents over agreements in scope; see dealer_settlement"
      - name: commission_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Commission paid; see dealer_settlement"
      - name: cross_sell_commission_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Commission on cross-sell orders; see dealer_settlement"
      - name: clawback_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Clawback for underperformance; see dealer_settlement"
      - name: net_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "commission_cents + cross_sell_commission_cents - clawback_cents"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Dealer
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rental-network/dealers/{id}/suspend"
        actor: NetworkAdmin
        preconditions:
          - "dealer.status == ACTIVE"
        side_effects:
          - "Every Reservation with origin_dealer_id == dealer and status in {CONFIRMED, REASSIGNED} auto-reassigns per the reassignment selector; if the selector's candidate pool is empty for such a reservation, that reservation moves to EXPIRED. QUOTED reservations are NOT swept — they stay QUOTED and their confirm is then blocked by the dealer-posture gate (validations priority 12)"
          - "New assignments to this dealer are blocked while SUSPENDED"
        note: "Suspension forces mass reassignment of promised reservations."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rental-network/dealers/{id}/reactivate"
        actor: NetworkAdmin
        preconditions:
          - "dealer.status == SUSPENDED"
        side_effects: []
        note: ""
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /rental-network/dealers/{id}/deactivate"
        actor: NetworkAdmin
        preconditions:
          - "dealer.status == ACTIVE"
          - "No Reservation with origin_dealer_id == dealer and status in {QUOTED, CONFIRMED, REASSIGNED}"
          - "No EquipmentUnit with current_dealer_id == dealer and status in {AVAILABLE, HELD, OUT}"
        side_effects: []
        note: "Terminal; dealer leaves the allocation pool."

  - entity: Location
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /rental-network/locations/{id}/close"
        actor: NetworkAdmin
        preconditions:
          - "location.status == OPEN"
          - "No EquipmentUnit with current_location_id == location and status in {AVAILABLE, HELD, OUT, REPOSITIONING}"
          - "No Reservation with origin_location_id == location and status in {QUOTED, CONFIRMED, REASSIGNED}"
        side_effects: []
        note: "Closure blocked while the site still holds fleet or promised reservations."
      - from: CLOSED
        to: OPEN
        trigger: "POST /rental-network/locations/{id}/reopen"
        actor: NetworkAdmin
        preconditions:
          - "location.status == CLOSED"
        side_effects: []
        note: ""

  - entity: EquipmentUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "System on POST /rental-network/reservations/{id}/confirm (unit selected for the reservation)"
        actor: system
        preconditions:
          - "unit.status == AVAILABLE"
          - "unit.current_dealer_id == reservation.origin_dealer_id"
        side_effects:
          - "Dealer.allocated_unit_count unchanged (unit still held by the same dealer)"
        note: "Soft hold pinning the unit to the confirmed reservation."
      - from: HELD
        to: OUT
        trigger: "POST /rental-network/rental-agreements (pickup against the holding reservation)"
        actor: DealerAgent
        preconditions:
          - "unit.status == HELD"
          - "reservation.status == CONFIRMED or REASSIGNED"
        side_effects:
          - "Reservation auto-transitions to FULFILLED"
        note: ""
      - from: OUT
        to: AVAILABLE
        trigger: "POST /rental-network/rental-agreements/{id}/return"
        actor: DealerAgent
        preconditions:
          - "unit.status == OUT"
        side_effects:
          - "unit.current_location_id set to agreement.return_location_id"
          - "unit.current_dealer_id set to the ACTIVE dealer at agreement.return_location_id (the ACTIVE dealer whose location_id equals return_location_id; 409 ERR_NO_ACTIVE_DEALER_AT_LOCATION if none)"
          - "The destination dealer's allocated_unit_count recomputes"
        note: "Return lands the unit at the drop-off site's dealer; this is how one-way accumulation forms."
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /rental-network/equipment-units/{id}/status with to_status: MAINTENANCE"
        actor: DealerAgent
        preconditions:
          - "unit.status == AVAILABLE"
          - "acting DealerAgent's dealer == unit.current_dealer_id"
        side_effects: []
        note: ""
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /rental-network/equipment-units/{id}/status with to_status: AVAILABLE"
        actor: DealerAgent
        preconditions:
          - "unit.status == MAINTENANCE"
          - "acting DealerAgent's dealer == unit.current_dealer_id"
        side_effects: []
        note: ""
      - from: AVAILABLE
        to: REPOSITIONING
        trigger: "POST /rental-network/reposition-tasks (unit selected by the selector rule)"
        actor: system
        preconditions:
          - "unit.status == AVAILABLE"
          - "unit.current_location_id == task.from_location_id"
        side_effects:
          - "The creating RepositionTask row's equipment_unit_id set to this unit"
        note: ""
      - from: REPOSITIONING
        to: AVAILABLE
        trigger: "POST /rental-network/reposition-tasks/{id}/complete"
        actor: RepositionDriver
        preconditions:
          - "unit.status == REPOSITIONING"
        side_effects:
          - "unit.current_location_id set to task.to_location_id"
          - "unit.current_dealer_id set to the ACTIVE dealer at task.to_location_id (409 ERR_NO_ACTIVE_DEALER_AT_LOCATION if none)"
          - "lane_imbalance recomputed for every ACTIVE LaneRate whose origin_location_id or dest_location_id equals task.from_location_id or task.to_location_id"
        note: ""
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /rental-network/equipment-units/{id}/retire"
        actor: NetworkAdmin
        preconditions:
          - "unit.status == AVAILABLE"
        side_effects:
          - "Current dealer's allocated_unit_count recomputes"
        note: "Terminal; unit leaves the fleet."

  - entity: LaneRate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rental-network/lane-rates/{id}/activate"
        actor: PricingManager
        preconditions:
          - "lane_rate.status == DRAFT"
        side_effects:
          - "Any other LaneRate with identical (origin_location_id, dest_location_id, equipment_type, season) and status == ACTIVE moves to SUPERSEDED"
        note: "Uniqueness of the ACTIVE rate per lane key is enforced here."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rental-network/lane-rates/{id}/supersede"
        actor: PricingManager
        preconditions:
          - "lane_rate.status == ACTIVE"
        side_effects: []
        note: ""

  - entity: Reservation
    initial_state: QUOTED
    terminal_states: [CANCELLED, EXPIRED, NO_SHOW, FULFILLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /rental-network/reservations/{id}/confirm"
        actor: Customer
        preconditions:
          - "reservation.status == QUOTED"
          - "request.expected_reservation_version == reservation.version"
          - "Dealer(reservation.origin_dealer_id).status == ACTIVE"
          - "Customer.driver_license_verified == true"
          - "Towing compatibility evaluation passes (see tow_compatibility)"
          - "Availability evaluation finds an EquipmentUnit at the origin dealer"
        side_effects:
          - "price_snapshot frozen at confirm time (recomputed by quote_rated_price at this instant)"
          - "The selected EquipmentUnit moves AVAILABLE -> HELD"
          - "ReservationEvent CREATED/CONFIRMED rows appended"
        note: "The availability guarantee: confirm either holds a unit or — via reassignment — moves the reservation to a dealer that can hold one."
      - from: CONFIRMED
        to: REASSIGNED
        trigger: "POST /rental-network/reservations/{id}/reassign or system reassignment on Dealer suspend"
        actor: NetworkAdmin
        preconditions:
          - "reservation.status in {CONFIRMED, REASSIGNED}"
          - "Reassignment selector pool non-empty (see reassign_reservation)"
        side_effects:
          - "If a unit was HELD for the reservation at the prior dealer it moves HELD -> AVAILABLE at that dealer"
          - "A unit at the selected new dealer moves AVAILABLE -> HELD"
          - "origin_dealer_id and origin_location_id updated; price_snapshot recomputed at the new lane rate if the origin location changed; version increments"
          - "ReservationEvent REASSIGNED appended with from_dealer_id / to_dealer_id"
        note: "REASSIGNED -> REASSIGNED is legal (cyclic): repeated reassignments append further events."
      - from: REASSIGNED
        to: REASSIGNED
        trigger: "POST /rental-network/reservations/{id}/reassign"
        actor: NetworkAdmin
        preconditions:
          - "reservation.status == REASSIGNED"
        side_effects:
          - "Same release/hold/event side effects as CONFIRMED -> REASSIGNED"
        note: "Cycle back-edge of the reservation machine."
      - from: CONFIRMED
        to: FULFILLED
        trigger: "System on POST /rental-network/rental-agreements (pickup)"
        actor: system
        preconditions:
          - "reservation.status in {CONFIRMED, REASSIGNED}"
          - "agreement.equipment_unit_id == the HELD unit for this reservation"
        side_effects:
          - "Unit HELD -> OUT"
        note: ""
      - from: REASSIGNED
        to: FULFILLED
        trigger: "System on POST /rental-network/rental-agreements (pickup)"
        actor: system
        preconditions:
          - "reservation.status == REASSIGNED"
        side_effects:
          - "Unit HELD -> OUT"
        note: ""
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /rental-network/reservations/{id}/cancel"
        actor: Customer
        preconditions:
          - "reservation.status in {QUOTED, CONFIRMED, REASSIGNED}"
          - "acting Customer is reservation.customer_id"
        side_effects:
          - "If a unit is HELD for the reservation it moves HELD -> AVAILABLE"
          - "ReservationEvent CANCELLED appended"
        note: ""
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rental-network/reservations/{id}/cancel"
        actor: Customer
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects:
          - "HELD unit released to AVAILABLE"
          - "ReservationEvent CANCELLED appended"
        note: ""
      - from: REASSIGNED
        to: CANCELLED
        trigger: "POST /rental-network/reservations/{id}/cancel"
        actor: Customer
        preconditions:
          - "reservation.status == REASSIGNED"
        side_effects:
          - "HELD unit released to AVAILABLE"
          - "ReservationEvent CANCELLED appended"
        note: ""
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /rental-network/reservations/{id}/expire or system sweep at pickup_date with no confirm"
        actor: NetworkAdmin
        preconditions:
          - "reservation.status == QUOTED"
        side_effects:
          - "ReservationEvent EXPIRED appended"
        note: ""
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /rental-network/reservations/{id}/mark-no-show after pickup_date passed on the logical clock"
        actor: NetworkAdmin
        preconditions:
          - "reservation.status in {CONFIRMED, REASSIGNED}"
          - "logical clock > reservation.pickup_date"
        side_effects:
          - "HELD unit released to AVAILABLE"
          - "ReservationEvent NO_SHOW appended"
        note: ""

  - entity: RentalAgreement
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rental-network/rental-agreements/{id}/return"
        actor: DealerAgent
        preconditions:
          - "agreement.status == ACTIVE"
          - "Location(return_location_id).status == OPEN"
        side_effects:
          - "actual_days computed"
          - "Unit OUT -> AVAILABLE at return_location_id with dealer handoff"
          - "DamageProtectionPlan on this agreement moves ACTIVE -> EXPIRED"
          - "late_fee_cents computed per calculate_settlement inputs"
        note: ""
      - from: RETURNED
        to: SETTLED
        trigger: "POST /rental-network/rental-agreements/{id}/settle"
        actor: DealerAgent
        preconditions:
          - "agreement.status == RETURNED"
          - "No DamageClaim on this agreement with status == FILED"
          - "request.expected_agreement_version == agreement.version"
        side_effects:
          - "reconcile_damage_charges runs: damage_charge_cents = sum of APPROVED DamageClaim.approved_amount_cents"
          - "total_settled_cents computed per calculate_settlement and frozen"
          - "agreement.version increments"
        note: "Settle is blocked while any claim is still FILED; DENIED or PAID claims do not block."

  - entity: DamageProtectionPlan
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "System on agreement return"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
        side_effects: []
        note: ""
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /rental-network/damage-protection-plans/{id}/cancel before agreement return"
        actor: DealerAgent
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.agreement status == ACTIVE"
        side_effects:
          - "Any DamageClaim on the same agreement with status == FILED is moved to DENIED (coverage withdrawn)"
        note: ""

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, PAID]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /rental-network/damage-claims/{id}/approve"
        actor: DealerAgent
        preconditions:
          - "claim.status == FILED"
          - "Segregation of duties: acting X-User-ID != claim.filer_user_id"
          - "claim.agreement.status in {ACTIVE, RETURNED} (not SETTLED)"
        side_effects:
          - "approved_amount_cents = min(claimed_amount_cents, coverage cap per plan tier; 0-cap when no ACTIVE plan)"
          - "reconcile_damage_charges on the agreement"
        note: ""
      - from: FILED
        to: DENIED
        trigger: "POST /rental-network/damage-claims/{id}/deny"
        actor: DealerAgent
        preconditions:
          - "claim.status == FILED"
          - "Segregation of duties: acting X-User-ID != claim.filer_user_id"
        side_effects: []
        note: ""
      - from: DENIED
        to: FILED
        trigger: "POST /rental-network/damage-claims/{id}/reopen"
        actor: DealerAgent
        preconditions:
          - "claim.status == DENIED"
          - "claim.agreement.status != SETTLED"
        side_effects: []
        note: "Appeal loop: DENIED -> FILED -> APPROVED/DENIED may repeat; agreement SETTLED seals the loop."
      - from: APPROVED
        to: PAID
        trigger: "POST /rental-network/damage-claims/{id}/pay"
        actor: DealerAgent
        preconditions:
          - "claim.status == APPROVED"
          - "claim.agreement.status == SETTLED"
        side_effects: []
        note: "Payment is possible only after the agreement is settled, so approved amounts are frozen into total_settled_cents first."

  - entity: RepositionTask
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /rental-network/reposition-tasks/{id}/assign"
        actor: NetworkAdmin
        preconditions:
          - "task.status == OPEN"
          - "task.equipment_unit.status == REPOSITIONING"
        side_effects: []
        note: ""
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /rental-network/reposition-tasks/{id}/complete"
        actor: RepositionDriver
        preconditions:
          - "task.status == ASSIGNED"
          - "acting X-User-ID == task.assigned_driver_id"
        side_effects:
          - "Unit REPOSITIONING -> AVAILABLE at to_location_id with dealer handoff"
          - "executed_reposition_cost_cents computed per reposition_cost"
          - "lane_imbalance recomputed for every ACTIVE LaneRate touching from/to locations (transitive: may flip imbalance_factor across IMBALANCE_THRESHOLD, changing future quote_rated_price output on those lanes)"
        note: ""
      - from: OPEN
        to: CANCELLED
        trigger: "POST /rental-network/reposition-tasks/{id}/cancel"
        actor: NetworkAdmin
        preconditions:
          - "task.status == OPEN"
        side_effects:
          - "Unit REPOSITIONING -> AVAILABLE at from_location_id (no location change)"
        note: ""

  - entity: DealerSettlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /rental-network/dealer-settlements/{id}/approve"
        actor: FinanceReviewer
        preconditions:
          - "settlement.status in {DRAFT, DISPUTED}"
          - "All RentalAgreements in scope have status == SETTLED"
        side_effects:
          - "dealer_settlement recomputed and fields frozen"
        note: "DISPUTED -> APPROVED is the cycle back-edge of the settlement machine."
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /rental-network/dealer-settlements/{id}/approve"
        actor: FinanceReviewer
        preconditions:
          - "settlement.status == DISPUTED"
        side_effects:
          - "dealer_settlement recomputed and fields frozen"
        note: ""
      - from: APPROVED
        to: PAID
        trigger: "POST /rental-network/dealer-settlements/{id}/pay"
        actor: FinanceReviewer
        preconditions:
          - "settlement.status == APPROVED"
          - "Segregation of duties: acting X-User-ID != the X-User-ID that approved the settlement"
        side_effects: []
        note: ""
      - from: DRAFT
        to: DISPUTED
        trigger: "POST /rental-network/dealer-settlements/{id}/dispute"
        actor: DealerAgent
        preconditions:
          - "settlement.status == DRAFT"
          - "acting DealerAgent's dealer == settlement.dealer_id"
        side_effects: []
        note: ""

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-confirm-stale-version
    parent_entity: Reservation
    write_endpoint: "POST /rental-network/reservations/{id}/confirm"
    occ_field: "expected_reservation_version"
    description: |
      Confirming a Reservation whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just reassigned the reservation (which legitimately moves the reservation
      to a different dealer and recomputes its price snapshot) and the current
      writer's quoted price and dealer are therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-settle-stale-version
    parent_entity: RentalAgreement
    write_endpoint: "POST /rental-network/rental-agreements/{id}/settle"
    occ_field: "expected_agreement_version"
    description: |
      Settling a RentalAgreement whose version has advanced since the client
      last observed it is rejected. A damage-claim approval recomputes
      damage_charge_cents and bumps the agreement's version, so a settle
      request carrying the pre-approval version must not freeze a stale total.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_rated_price
    trigger: "On POST /rental-network/reservations (QUOTED snapshot) and again on POST /rental-network/reservations/{id}/confirm (frozen into price_snapshot) and on reassign when origin_location_id changes"
    algorithm: tiered_pricing
    formula: |
      rate_row = the ACTIVE LaneRate for (origin_location_id, dest_location_id, equipment_type, season_of(pickup_date));
                 reject with ERR_NO_ACTIVE_RATE if none
      rental_days = ceil((dropoff_date - pickup_date) / 86400s), minimum 1
      daily_cents = rate_row.base_rate_cents
      if rate_row.imbalance_factor > IMBALANCE_THRESHOLD:
          daily_cents = daily_cents + rate_row.reposition_surcharge_cents
      if rental_days >= LONG_RENTAL_THRESHOLD:
          daily_cents = round_half_up(daily_cents * (1 - LONG_RENTAL_DISCOUNT))
      subtotal_cents = daily_cents * rental_days        # day-rate rounded first, then multiplied
      protection_cents = 0                               # protection is sold at pickup, not in the quote
      total_quoted_cents = subtotal_cents
    input_set: "Exactly one ACTIVE LaneRate per (origin, dest, equipment_type, season); DRAFT and SUPERSEDED rows excluded"
    constants:
      IMBALANCE_THRESHOLD: 1.0
      LONG_RENTAL_THRESHOLD: 7
      LONG_RENTAL_DISCOUNT: 0.10
    precision: "integer cents; round_half_up applied to the discounted daily rate before multiplying by rental_days"
    variants:
      - name: quoted_variant
        when: "At reservation creation (status QUOTED)"
        difference: "Uses the LaneRate ACTIVE at quote time; result stored on price_snapshot.quoted_rate_cents_per_day but NOT frozen"
      - name: frozen_variant
        when: "At confirm time"
        difference: "Recomputes against the LaneRate ACTIVE at the confirm instant; if the rate row changed between quote and confirm, the frozen total differs from the quoted total — this is intended and the frozen value wins"

  - name: tow_compatibility
    trigger: "On POST /rental-network/reservations/{id}/confirm when equipment_type is a towed type (TRAILER_4X8, TRAILER_6X12, TOW_DOLLY)"
    algorithm: threshold
    formula: |
      if equipment_type not in TOWED_TYPES: result = NOT_REQUIRED
      else:
        v = Customer(reservation.customer_id).vehicle_profile
        gvwr = EQUIPMENT_GVWR_LBS[equipment_type]
        checks in order:
          1. v.hitch_class not in HITCH_MIN[equipment_type]      -> FAIL (reason HITCH_CLASS)
          2. v.tow_capacity_lbs < gvwr * TOW_SAFETY_FACTOR       -> FAIL (reason TOW_CAPACITY)
          3. v.curb_weight_lbs < gvwr * CURB_RATIO_MIN           -> FAIL (reason CURB_WEIGHT)
          otherwise                                              -> PASS
      Equipment-to-vehicle curb-weight ratio uses strictly-greater semantics:
      PASS requires v.curb_weight_lbs / gvwr >= CURB_RATIO_MIN exactly at the boundary.
    input_set: "Customer's single VehicleProfile; equipment GVWR constants below"
    constants:
      TOWED_TYPES: ["TRAILER_4X8", "TRAILER_6X12", "TOW_DOLLY"]
      EQUIPMENT_GVWR_LBS: { TRAILER_4X8: 2500, TRAILER_6X12: 4400, TOW_DOLLY: 3450 }
      HITCH_MIN: { TRAILER_4X8: ["CLASS_I", "CLASS_II", "CLASS_III", "CLASS_IV"], TRAILER_6X12: ["CLASS_III", "CLASS_IV"], TOW_DOLLY: ["CLASS_II", "CLASS_III", "CLASS_IV"] }
      TOW_SAFETY_FACTOR: 0.8
      CURB_RATIO_MIN: 0.8
    precision: "integer pounds; comparisons use exact integers, no rounding"
    variants: []

  - name: lane_imbalance
    trigger: "On RepositionTask completion or cancellation, and on agreement return (unit lands at a new location)"
    algorithm: aggregation
    formula: |
      For lane (origin O, dest D, equipment_type T):
        net_flow = count of RentalAgreement with reservation.equipment_type == T,
                   reservation.origin_location_id == O, reservation.dest_location_id == D,
                   reservation.rental_kind == ONE_WAY, agreement.status in {RETURNED, SETTLED}
                   minus the symmetric count for lane (D, O, T)
        deficit = count of Reservation with status in {CONFIRMED, REASSIGNED},
                  origin_location_id == O, dest_location_id == D, equipment_type == T, rental_kind == ONE_WAY
                  minus the symmetric count for (D, O, T)
        imbalance_factor = 1.0 + IMBALANCE_WEIGHT * (net_flow + deficit) / max(fleet_total, 1)
        where fleet_total = count of EquipmentUnit with equipment_type == T and status != RETIRED
      Window: all time (no time filter); tie-breaking not applicable (pure counts).
      Only lanes with an ACTIVE LaneRate row are recomputed.
    input_set: "Agreements in {RETURNED, SETTLED}; reservations in {CONFIRMED, REASSIGNED}; units not RETIRED"
    constants:
      IMBALANCE_WEIGHT: 0.5
    precision: "4 decimal places, round_half_up"
    variants:
      - name: forward_looking_variant
        when: "Used by quote_rated_price for the surcharge decision"
        difference: "Includes the deficit term (pending confirmed demand), making the surcharge forward-looking"
      - name: historical_variant
        when: "Reported by GET /rental-network/reposition-tasks/imbalance-report for planning"
        difference: "Omits the deficit term; reflects only realized net_flow — the same lane yields a smaller factor than the forward-looking variant whenever unmet demand exists"

  - name: reposition_cost
    trigger: "On RepositionTask creation (estimated_reposition_cost_cents, provisional) and completion (executed_reposition_cost_cents, actual)"
    algorithm: tiered_pricing
    formula: |
      distance_band is a pure function of the two locations' geo_zones:
        same geo_zone -> SHORT; differing geo_zone sharing a letter-half
        ({NORTH,EAST,CENTRAL} vs {SOUTH,WEST,CENTRAL} — pairs crossing halves) -> MEDIUM;
        otherwise (NORTH<->SOUTH, EAST<->WEST) -> LONG.
        Exact table: SHORT = identical zones; LONG = {(NORTH,SOUTH),(EAST,WEST)} either direction;
        MEDIUM = every other distinct pair.
      Provisional (at creation):
        estimated_reposition_cost_cents = REPOSITION_BAND_COST_CENTS[distance_band]
      Actual (at completion):
        base = REPOSITION_BAND_COST_CENTS[distance_band]
        driver_fee = DRIVER_FEE_CENTS_PER_TASK
        executed_reposition_cost_cents = base + driver_fee
        if the unit sat in REPOSITIONING for > IDLE_PENALTY_HOURS on the logical clock:
            executed_reposition_cost_cents += IDLE_PENALTY_CENTS
    input_set: "The single task's unit and locations; distance band table is fixed per lane"
    constants:
      REPOSITION_BAND_COST_CENTS: { SHORT: 9000, MEDIUM: 24000, LONG: 52000 }
      DRIVER_FEE_CENTS_PER_TASK: 6000
      IDLE_PENALTY_HOURS: 48
      IDLE_PENALTY_CENTS: 15000
    precision: "integer cents, no rounding"
    variants:
      - name: provisional_variant
        when: "Task creation"
        difference: "Omits driver fee and idle penalty; the estimate is always <= the executed cost for the same task when idle penalty applies, so the two variants diverge on identical lane inputs"

  - name: protection_premium
    trigger: "On POST /rental-network/damage-protection-plans"
    algorithm: threshold
    formula: |
      days = reservation.rental_days at plan sale time
      premium_cents = PLAN_DAILY_CENTS[tier] * days
      if days >= PLAN_LONG_DAYS: premium_cents = round_half_up(premium_cents * (1 - PLAN_LONG_DISCOUNT))
      Coverage caps (used by claim approval): BASIC=200000, STANDARD=750000, PREMIUM=2500000 cents
    input_set: "Reservation's frozen rental_days"
    constants:
      PLAN_DAILY_CENTS: { BASIC: 1400, STANDARD: 2400, PREMIUM: 3900 }
      PLAN_LONG_DAYS: 7
      PLAN_LONG_DISCOUNT: 0.15
      PLAN_COVERAGE_CAP_CENTS: { BASIC: 200000, STANDARD: 750000, PREMIUM: 2500000 }
    precision: "integer cents; discount rounding applied to the whole premium, not per day"
    variants: []

  - name: calculate_settlement
    trigger: "On POST /rental-network/rental-agreements/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
        1. actual_days already computed at return
        2. billable_days = max(actual_days, reservation.rental_days)
        3. base_cents = reservation.price_snapshot.quoted_rate_cents_per_day * billable_days
        4. late_days = max(0, actual_days - reservation.rental_days)
           late_fee_cents = late_days * round_half_up(reservation.price_snapshot.quoted_rate_cents_per_day * LATE_DAY_MULTIPLIER)
        5. reconcile_damage_charges: damage_charge_cents = sum of DamageClaim.approved_amount_cents
           where claim.agreement_id == agreement and claim.status in {APPROVED, PAID}
        6. total_settled_cents = base_cents + late_fee_cents + damage_charge_cents
      Note: late fee multiplies the per-day rate first (rounded), then the late-day count — the reverse order yields different cents.
    input_set: "The agreement, its reservation's frozen price_snapshot, its DamageClaims in {APPROVED, PAID}"
    constants:
      LATE_DAY_MULTIPLIER: 1.5
    precision: "integer cents; late-day rate rounded before multiplication by late_days"
    variants:
      - name: provisional_estimate
        when: "GET /rental-network/rental-agreements/{id}/settlement-preview on an ACTIVE agreement"
        difference: "Uses projected actual_days = ceil((logical_clock - checkout_at)/24h); damage claims excluded (not yet reconciled); result not persisted"
      - name: final_settled
        when: "Settle on a RETURNED agreement"
        difference: "Uses actual returned_at, includes approved damage charges, and persists total_settled_cents — the two variants differ whenever the return occurs after the preview was taken or any claim is approved"

  - name: dealer_settlement
    trigger: "On POST /rental-network/dealer-settlements (draft computation) and again on approve (recompute + freeze)"
    algorithm: aggregation
    formula: |
      Scope: RentalAgreements with checkout_dealer_id == dealer, status == SETTLED,
             and returned_at within the settlement quarter [start, end) (closed-open window)
      gross_rental_cents = sum of total_settled_cents over scope
      rate_row(agreement) = the LaneRate ACTIVE at that agreement's checkout_at for its lane/season
      pinned_rate(agreement) = dealer.commission_rate_override if not null else rate_row.commission_rate
      commission_cents = sum over scope of round_half_up(total_settled_cents * pinned_rate(agreement))   # per-agreement rounding, then summed
      cross_sell_commission_cents = sum over CrossSellOrders in the quarter with dealer_id == dealer of
                                    round_half_up(order.total_cents * CROSS_SELL_COMMISSION_RATE)
      perf = dealer.performance_score
      clawback_cents = round_half_up((commission_cents + cross_sell_commission_cents) * CLAWBACK_RATE) if perf < PERFORMANCE_FLOOR else 0
      net_cents = commission_cents + cross_sell_commission_cents - clawback_cents
    input_set: "SETTLED agreements in the quarter; all CrossSellOrders of the dealer in the quarter regardless of agreement linkage"
    constants:
      CROSS_SELL_COMMISSION_RATE: 0.05
      CLAWBACK_RATE: 0.10
      PERFORMANCE_FLOOR: 60
    precision: "integer cents; round per agreement/order line, then sum (sum-then-round forbidden)"
    variants:
      - name: override_variant
        when: "dealer.commission_rate_override is set"
        difference: "Every agreement in scope uses the flat override rate regardless of lane"
      - name: lane_rate_variant
        when: "dealer.commission_rate_override is null"
        difference: "Each agreement uses its own lane's pinned commission_rate; two agreements with equal totals on different lanes contribute different commissions — the variants diverge on identical scope whenever lanes differ"

  - name: cross_sell_bundle
    trigger: "On POST /rental-network/cross-sell-orders"
    algorithm: threshold
    formula: |
      supplies_subtotal_cents = sum over line_items of round_half_up(catalog_price_cents(sku) * qty)   # per-line rounding, then sum
      storage_charge_cents = storage_months * STORAGE_MONTH_RATE_CENTS[dealer.location.geo_zone]
      Bundle discount (conditional):
        if storage_months > 0 and supplies_subtotal_cents > 0:
            bundle_discount_cents = round_half_up(supplies_subtotal_cents * BUNDLE_DISCOUNT_RATE)
        else: bundle_discount_cents = 0
      total_cents = supplies_subtotal_cents + storage_charge_cents - bundle_discount_cents
      Aggregate capacity check (zone-level):
        occupied = sum of storage_months over all CrossSellOrders at locations in the dealer's geo_zone
        capacity = sum of storage_capacity over OPEN locations in the geo_zone
        if occupied + storage_months > capacity: reject ERR_STORAGE_CAPACITY_EXCEEDED
    input_set: "The order's lines; zone pool = all OPEN Locations sharing the dealer's geo_zone"
    constants:
      CATALOG_PRICE_CENTS: { BOX_SMALL: 125, BOX_LARGE: 245, TAPE: 399, BLANKET: 899, LOCK: 1299 }
      STORAGE_MONTH_RATE_CENTS: { NORTH: 8900, SOUTH: 7900, EAST: 9500, WEST: 9900, CENTRAL: 6900 }
      BUNDLE_DISCOUNT_RATE: 0.10
    precision: "integer cents; per-line round_half_up before summing"
    variants: []

  - name: reassign_reservation
    trigger: "On POST /rental-network/reservations/{id}/reassign and on Dealer suspension mass-reassignment"
    algorithm: constraint_propagation
    formula: |
      Candidate dealers D such that:
        - D.status == ACTIVE
        - D.location.geo_zone == reservation.origin_location.geo_zone        (same-zone rule)
        - D.id != reservation.origin_dealer_id
        - exists EquipmentUnit u with u.current_dealer_id == D, u.equipment_type == reservation.equipment_type,
          u.status == AVAILABLE, and u is free for the reservation's pickup/dropoff interval
      Ranking: sort by (D.performance_score DESC, D.allocated_unit_count ASC, D.created_at ASC)
      Empty pool -> ERR_NO_REASSIGNMENT_CANDIDATE (manual reassign) or EXPIRED (suspension sweep)
      id MUST NOT be used anywhere in ranking or tie-break; created_at is the final tie-break.
    input_set: "ACTIVE dealers in the origin geo_zone with an AVAILABLE unit of the right type"
    constants: {}
    precision: "n/a"
    variants: []

  - name: allocation_score
    trigger: "On POST /rental-network/dealers/allocate (bulk equipment allocation round)"
    algorithm: weighted_scoring
    formula: |
      For each ACTIVE dealer requesting units in the round:
        score = W_PERF * dealer.performance_score + W_UTIL * utilization_pct(dealer) + W_ZONE * zone_deficit_bonus(dealer)
        utilization_pct = 100 * (count of dealer's units in {OUT, HELD}) / max(dealer.allocated_unit_count, 1)
        zone_deficit_bonus = 10 if dealer's geo_zone has negative lane_imbalance net flow else 0
      Allocation proceeds in score DESC order, tie-break created_at ASC, until the requested units of each type are exhausted.
      id MUST NOT be used in ranking or tie-break.
    input_set: "ACTIVE dealers that filed allocation requests for the round"
    constants:
      W_PERF: 0.5
      W_UTIL: 0.3
      W_ZONE: 0.2
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: season_of
    trigger: "On reservation creation/confirm (season field) and lane rate selection"
    algorithm: threshold
    formula: |
      month(pickup_date) in {6,7,8}  -> PEAK
      month(pickup_date) in {4,5,9,10} -> SHOULDER
      otherwise -> OFF_PEAK
    input_set: "pickup_date"
    constants: {}
    precision: "calendar month of the ISO8601 instant in UTC"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role is authorized for the endpoint per §1.5 roles and §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Every FK in the request body (dealer_id, location ids, customer_id, reservation_id, agreement_id, etc.) resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints with body FKs"
  - priority: 6
    category: existence
    check: "Uniqueness of natural keys: dealer_code, location_code, unit_code, customer email, agreement.reservation_id, plan.agreement_id"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 7
    category: state
    check: "Target entity's current state permits the transition per §1.2 (e.g. confirm requires QUOTED, settle requires RETURNED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version equals the entity's current version on confirm and settle"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /rental-network/reservations/{id}/confirm", "POST /rental-network/rental-agreements/{id}/settle"]
  - priority: 9
    category: state
    check: "Segregation of duties: damage-claim approver/denier X-User-ID != claim filer; settlement payer X-User-ID != approver"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /rental-network/damage-claims/{id}/approve", "POST /rental-network/damage-claims/{id}/deny", "POST /rental-network/dealer-settlements/{id}/pay"]
  - priority: 10
    category: business_safety
    check: "Towing compatibility (tow_compatibility): towed equipment requires hitch class, tow capacity >= GVWR * 0.8, and curb weight >= GVWR * 0.8"
    error_id: ERR_TOW_INCOMPATIBLE
    http_status: 422
    applies_to: ["POST /rental-network/reservations/{id}/confirm"]
  - priority: 11
    category: business_safety
    check: "Customer.driver_license_verified == true before confirm"
    error_id: ERR_LICENSE_NOT_VERIFIED
    http_status: 422
    applies_to: ["POST /rental-network/reservations/{id}/confirm"]
  - priority: 12
    category: business_referential
    check: "Reservation origin dealer is ACTIVE at confirm and at pickup; unit's holding dealer matches reservation origin dealer"
    error_id: ERR_DEALER_SUSPENDED
    http_status: 409
    applies_to: ["POST /rental-network/reservations/{id}/confirm", "POST /rental-network/rental-agreements"]
  - priority: 13
    category: business_constraint
    check: "Location posture: return_location must be OPEN at return; pickup dealer's location must be OPEN at pickup"
    error_id: ERR_LOCATION_CLOSED
    http_status: 409
    applies_to: ["POST /rental-network/rental-agreements", "POST /rental-network/rental-agreements/{id}/return"]
  - priority: 14
    category: business_temporal
    check: "dropoff_date > pickup_date; pickup_date >= logical clock at creation; no-show only after pickup_date has passed"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: ["POST /rental-network/reservations", "POST /rental-network/reservations/{id}/mark-no-show"]
  - priority: 15
    category: business_constraint
    check: "Unit availability: an EquipmentUnit of the requested type in AVAILABLE status exists at the origin dealer and is free for the whole pickup-dropoff interval"
    error_id: ERR_NO_UNIT_AVAILABLE
    http_status: 409
    applies_to: ["POST /rental-network/reservations/{id}/confirm"]
  - priority: 16
    category: business_constraint
    check: "ACTIVE LaneRate exists for (origin, dest, equipment_type, season_of(pickup_date))"
    error_id: ERR_NO_ACTIVE_RATE
    http_status: 422
    applies_to: ["POST /rental-network/reservations", "POST /rental-network/reservations/{id}/confirm"]
  - priority: 17
    category: business_constraint
    check: "Reassignment selector pool non-empty per reassign_reservation eligibility filter"
    error_id: ERR_NO_REASSIGNMENT_CANDIDATE
    http_status: 409
    applies_to: ["POST /rental-network/reservations/{id}/reassign"]
  - priority: 18
    category: business_constraint
    check: "Settle blocked while any DamageClaim on the agreement has status FILED"
    error_id: ERR_OPEN_CLAIMS
    http_status: 409
    applies_to: ["POST /rental-network/rental-agreements/{id}/settle"]
  - priority: 19
    category: business_constraint
    check: "Zone storage capacity: occupied storage_months + new storage_months <= sum of storage_capacity over OPEN locations in the geo_zone (aggregate; boundary is strictly-greater rejection, equal allowed)"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /rental-network/cross-sell-orders"]
  - priority: 20
    category: business_constraint
    check: "Reposition driver identity: complete allowed only when X-User-ID == task.assigned_driver_id"
    error_id: ERR_DRIVER_MISMATCH
    http_status: 403
    applies_to: ["POST /rental-network/reposition-tasks/{id}/complete"]
  - priority: 21
    category: business_fiscal
    check: "claimed_amount_cents > 0; approve amount is capped by the ACTIVE plan's tier coverage (0 cap when no plan)"
    error_id: ERR_INVALID_CLAIM_AMOUNT
    http_status: 422
    applies_to: ["POST /rental-network/damage-claims"]
  - priority: 22
    category: business_fiscal
    check: "Dealer deactivate blocked while units or live reservations are attached (state preconditions on Dealer)"
    error_id: ERR_DEALER_HAS_ACTIVE_HOLDINGS
    http_status: 409
    applies_to: ["POST /rental-network/dealers/{id}/deactivate"]
  - priority: 23
    category: business_constraint
    check: "Return handoff target exists: an ACTIVE dealer operates at the return location (else unit cannot be re-homed)"
    error_id: ERR_NO_ACTIVE_DEALER_AT_LOCATION
    http_status: 409
    applies_to: ["POST /rental-network/rental-agreements/{id}/return", "POST /rental-network/reposition-tasks/{id}/complete"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/rental-network/locations"
    description: "Create a location"
    roles: [NetworkAdmin]
    code: 201
    input: [location_code, city, geo_zone, storage_capacity]
    output: Location
    side_effects: []
  - method: GET
    path: "/rental-network/locations"
    description: "List locations; optional filters"
    roles: [NetworkAdmin, PricingManager, DealerAgent, FinanceReviewer]
    code: 200
    input: ["geo_zone?", "status?", "limit?", "offset?"]
    output: Location[]
    side_effects: []
  - method: GET
    path: "/rental-network/locations/{id}"
    description: "Fetch one location"
    roles: [NetworkAdmin, PricingManager, DealerAgent, FinanceReviewer]
    code: 200
    input: []
    output: Location
    side_effects: []
  - method: POST
    path: "/rental-network/locations/{id}/close"
    description: "Close a location (blocked while fleet or live reservations attached)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Location
    side_effects: ["Location OPEN -> CLOSED"]
  - method: POST
    path: "/rental-network/locations/{id}/reopen"
    description: "Reopen a closed location"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Location
    side_effects: ["Location CLOSED -> OPEN"]

  - method: POST
    path: "/rental-network/dealers"
    description: "Create a dealer"
    roles: [NetworkAdmin]
    code: 201
    input: [dealer_code, name, location_id, "commission_rate_override?"]
    output: Dealer
    side_effects: []
  - method: GET
    path: "/rental-network/dealers"
    description: "List dealers; optional filters"
    roles: [NetworkAdmin, PricingManager, FinanceReviewer]
    code: 200
    input: ["status?", "location_id?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []
  - method: GET
    path: "/rental-network/dealers/{id}/reservation-events"
    description: "Audit events where this dealer appears as from_dealer_id or to_dealer_id (reverse-reachability)"
    roles: [NetworkAdmin, FinanceReviewer]
    code: 200
    input: ["direction?", "limit?", "offset?"]
    output: ReservationEvent[]
    side_effects: []
  - method: GET
    path: "/rental-network/dealers/{id}"
    description: "Fetch one dealer"
    roles: [NetworkAdmin, DealerAgent, FinanceReviewer]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/rental-network/dealers/{id}/suspend"
    description: "Suspend dealer; mass-reassigns its live reservations"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: ["Dealer ACTIVE -> SUSPENDED", "reassign_reservation per affected reservation", "ReservationEvents appended"]
  - method: POST
    path: "/rental-network/dealers/{id}/reactivate"
    description: "Reactivate a suspended dealer"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: ["Dealer SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/rental-network/dealers/{id}/deactivate"
    description: "Deactivate a dealer (terminal)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: ["Dealer ACTIVE -> DEACTIVATED"]
  - method: POST
    path: "/rental-network/dealers/allocate"
    description: "Run an allocation round over ACTIVE dealers using allocation_score; body lists unit_codes to distribute"
    roles: [NetworkAdmin]
    code: 200
    input: [unit_codes]
    output: "{ allocated: array, skipped_unit_codes: array }"
    side_effects: ["allocation_score ranking", "EquipmentUnit.current_dealer_id reassigned for allocated units", "dealer.allocated_unit_count recomputed"]
  - method: POST
    path: "/rental-network/performance-reviews"
    description: "Post quarterly performance scores (bulk); writes Dealer.performance_score"
    roles: [NetworkAdmin]
    code: 200
    input: [period, scores]
    output: "{ updated_dealer_ids: array }"
    side_effects: ["Dealer.performance_score updated for each score entry"]

  - method: POST
    path: "/rental-network/equipment-units"
