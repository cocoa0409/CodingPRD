  - rule_id: cross_entity_state_dependency
    instances:

      - name: license_effectiveness_gates_agreement_activation
        grounds:
          - validations.priority_22_ERR_STATE_NOT_LICENSED
          - entities.License.fields.is_effective
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.PremiumFinanceAgreement.PENDING_VERIFICATION_to_ACTIVE
          - endpoints.POST_agreements_agreement_id_activate
        distinguishing_aspect: |
          Entity pair (License -> PremiumFinanceAgreement): a compliance artifact three hops away
          from the agreement (License -> StateRateRule -> PremiumFinanceAgreement) gates a lifecycle
          transition on it. The dependency is on a DERIVED state, is_effective, which folds the
          license status together with its date window and the logical clock, so a SUSPENDED license
          and an EXPIRED-window license both block activation while an unrelated ACTIVE, in-window
          license unblocks it without touching the agreement at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15; one TX StateRateRule with license_required == true and one ACTIVE, in-window License L1"
            - "one Insured, one ProducerAgent, one Insurer"
            - "one agreement in PENDING_VERIFICATION whose single 600000 policy is already VERIFIED, so nothing but the licensing check stands between it and ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { rule_tx: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { lic_l1: "$.data.id", lic_l1_eff: "$.data.is_effective" }
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_1: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_l: "$.data.id" }
            - call: "POST /agreements/${agr_l}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-L-9001", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pol_l: "$.data.id" }
            - call: "POST /agreements/${agr_l}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${pol_l}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /policies/${pol_l}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${agent_1}"
              captures: { pol_l_verified: "$.data.decision" }
          trigger:
            - call: "POST /licenses/${lic_l1}/suspend"
              payload: {}
              as: ComplianceOfficer
              captures: { l1_status: "$.data.status", l1_eff_after: "$.data.is_effective" }
            - call: "POST /agreements/${agr_l}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { blocked_1: "$.data.error_id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-EXPIRED", effective_date: "2024-01-01", expiration_date: "2025-12-31" }
              as: ComplianceOfficer
              captures: { lic_l3: "$.data.id", lic_l3_eff: "$.data.is_effective" }
            - call: "POST /agreements/${agr_l}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { blocked_2: "$.data.error_id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-002", effective_date: "2026-06-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { lic_l2: "$.data.id", lic_l2_eff: "$.data.is_effective" }
            - call: "POST /agreements/${agr_l}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { unblocked_status: "$.data.status", unblocked_af: "$.data.amount_financed_cents", unblocked_fc: "$.data.finance_charge_cents", unblocked_basis: "$.data.quote_basis" }
            - call: "GET /state-rate-rules/${rule_tx}/licenses"
              payload: { limit: 50 }
              as: ComplianceOfficer
          assert:
            - "precondition: ${lic_l1_eff} == true and ${pol_l_verified} == 'CONFIRMED' with FinancedPolicy.${pol_l}.status == 'VERIFIED'"
            - "${l1_status} == 'SUSPENDED' and ${l1_eff_after} == false — suspending the license is the ONLY change made to the system"
            - "${blocked_1} == 'ERR_STATE_NOT_LICENSED' with HTTP 422 and PremiumFinanceAgreement.${agr_l}.status stays 'PENDING_VERIFICATION' — a state change on License blocks a transition on an entity that does not reference License at all"
            - "${lic_l3_eff} == false — an ACTIVE license whose window closed on 2025-12-31 is not effective at clock 2026-08-15"
            - "${blocked_2} == 'ERR_STATE_NOT_LICENSED' with HTTP 422 — adding the expired license changes nothing, so the gate is on is_effective and not on the mere existence of a License row"
            - "${lic_l2_eff} == true, and then ${unblocked_status} == 'ACTIVE' with ${unblocked_basis} == 'FINAL', ${unblocked_af} == 502000 and ${unblocked_fc} == 37650 — the agreement activates without any request having touched the agreement itself between the two attempts"
            - "GET /state-rate-rules/${rule_tx}/licenses returns total_count == 3 with is_effective values false (suspended), false (expired) and true"
            - "six Installment rows now exist for the agreement, amount_cents 89941 x 5 plus 89945"

      - name: verified_policy_state_gates_endorsement_financing
        grounds:
          - validations.priority_42_ERR_NO_PENDING_ENDORSEMENTS
          - state_machines.PremiumEndorsement.PENDING_to_DECLINED
          - state_machines.PremiumEndorsement.PENDING_to_FINANCED
          - entities.FinancedPolicy.fields.endorsed_premium_cents
          - concurrency_rules.endorsement-financing-stale-agreement
          - endpoints.POST_agreements_agreement_id_endorsement_financings
        distinguishing_aspect: |
          A DIFFERENT entity pair and the opposite direction of travel: here a child work item
          (PremiumEndorsement) gates a recomputation whose visible result lands on its own parent
          (FinancedPolicy.endorsed_premium_cents and financed_premium_cents). Where the licensing
          instance gated a lifecycle STATUS transition on a compliance record's derived flag, this
          one gates a MONEY recomputation on the existence of a child in a particular status, and the
          write additionally carries an optimistic-concurrency token, so the dependency has to be
          re-evaluated against the version the caller last observed.
