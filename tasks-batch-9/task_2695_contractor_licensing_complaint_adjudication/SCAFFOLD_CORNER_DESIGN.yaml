      - name: corner_delinquent_renewal_tiers_off_the_stage_two_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.renewal_fee
          - calculations.renewal_fee.constants
        distinguishing_aspect: "The assessment rate is read off the stage-2 subtotal (97500 -> 0.10 -> 107250), not off the finished total (which would re-tier at 0.15 and yield 112125)."
        excluded_because:
          difficulty_instance: delinquent_renewal_fee_staged_ce_surcharge_then_tiered_assessment
          rationale: "That §1.8 instance renews delinquently with a 4-hour CE shortfall and asserts 107250 against the 112125 re-tiering trap, covering every stage of the ladder."

      - name: corner_credited_experience_clips_the_education_credential
        claim_type: Correct Result
        grounds:
          - calculations.credited_experience_months
          - validations[priority=71]
        distinguishing_aspect: "The education credential is clipped to floor(min_experience_months * 0.50) = 24, so 24 verified months plus a four-year degree credits exactly 48 and passes, while 23 months credits 47 and fails."
        excluded_because:
          difficulty_instance: credited_experience_exactly_at_minimum_versus_one_month_short
          rationale: "That §1.8 instance submits both the 24-month and the 23-month application and asserts the 48-vs-47 boundary together with ERR_EXPERIENCE_INSUFFICIENT."

      - name: corner_unlicensed_egregious_penalty_is_clamped
        claim_type: Constants Applied
        grounds:
          - calculations.citation_civil_penalty
          - calculations.citation_civil_penalty.constants
        distinguishing_aspect: "750000 * 2.0 * 1.50 = 2250000 exceeds STATUTORY_MAX_PENALTY_CENTS, so the stored penalty is exactly 1500000."
        excluded_because:
          difficulty_instance: unlicensed_sting_egregious_penalty_clamped_at_statutory_maximum
          rationale: "That §1.8 instance issues the sting citation and asserts the clamped 1500000 along with subject_type UNLICENSED."

      - name: corner_citation_penalty_diverges_between_its_two_variants
        claim_type: Variant Divergence
        grounds:
          - calculations.citation_civil_penalty.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The same citation carries a different penalty under INITIAL_ASSESSMENT than under POST_HEARING_RECALCULATION once priors accrue and the mitigation credit applies."
        excluded_because:
          difficulty_instance: citation_penalty_initial_assessment_vs_post_hearing_mitigation
          rationale: "That §1.8 instance asserts both variant outputs on one citation and the exact delta produced by the 25% mitigation credit."

      - name: corner_final_award_subtracts_the_mediation_settlement
        claim_type: Reconciliation
        grounds:
          - calculations.recovery_award.variants
        distinguishing_aspect: "final_award nets the settlement the consumer already banked, so it diverges from the never-revised estimated_award_cents by exactly that amount."
        excluded_because:
          difficulty_instance: recovery_claim_preliminary_estimate_vs_final_award_after_partial_settlement
          rationale: "That §1.8 instance asserts the estimate, the settlement, the netted final award and the divergence between the two variants."

      - name: corner_prorata_floors_each_share_then_distributes_the_residual
        claim_type: aggregation
        grounds:
          - calculations.recovery_prorata_distribution
        distinguishing_aspect: "When the pool cannot cover the cohort each share is floored and the leftover cents go to the earliest created_at, producing 572728 / 327272 rather than a proportional rounding."
        excluded_because:
          difficulty_instance: prorata_distribution_of_exhausted_fund_across_two_approved_claims
          rationale: "That §1.8 instance drives two APPROVED claims against an undersized pool and asserts both floored shares plus the one-cent residual placement."

  - section: validations
    instances:

      - name: corner_role_check_at_priority_two_outranks_the_state_check_at_twenty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The complaint is already screened (a priority-20 violation) AND the caller is a Consumer on an analyst-only endpoint (a priority-2 violation); the response must be ERR_ROLE_NOT_PERMITTED (403), never ERR_COMPLAINT_STATE_INVALID."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one unlicensed-subject complaint already screened into INVESTIGATION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Pria Priority", contact_email: "pria@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", subject_business_name: "Ladder Contracting", alleged_loss_cents: 400000, contract_date: "2026-07-01", description: "Framing left uninspected" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/complaints/${cmp_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 403"
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "Complaint.${cmp_id}.status == INVESTIGATION"

      - name: corner_pagination_limit_above_the_maximum_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - response_envelope.pagination_defaults
          - endpoints[GET /licensing/complaints]
        distinguishing_aspect: "limit must be an integer in 1..100, so limit=101 on a list endpoint returns ERR_INVALID_REQUEST (400) rather than silently clamping to 100."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one complaint on file so the list would otherwise return a row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Page Pager", contact_email: "page@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", subject_business_name: "Overpage Builders", alleged_loss_cents: 400000, contract_date: "2026-07-01", description: "Deck rails omitted" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
          trigger:
            - call: "GET /licensing/complaints?limit=101&offset=0"
              payload: {}
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /licensing/complaints?limit=100&offset=0 returns http status 200 with total_count == 1"

      - name: corner_sting_investigation_without_a_subject_name_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=55]
          - errors[ERR_INVESTIGATION_ORIGIN_MISMATCH]
          - endpoints[POST /licensing/investigations]
        distinguishing_aspect: "origin = STING with neither subject_license_id nor subject_business_name violates the origin-coherence rule and returns ERR_INVESTIGATION_ORIGIN_MISMATCH (422); no Investigation row is created."
        test_recipe:
          setup:
