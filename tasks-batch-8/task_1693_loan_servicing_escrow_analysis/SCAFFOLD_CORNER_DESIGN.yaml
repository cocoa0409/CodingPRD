            - "err2 == ERR_FORBIDDEN_FOR_ROLE (EscrowAnalyst cannot resolve)"
            - "err3 == ERR_FORBIDDEN_FOR_ROLE (PayeeVerifier cannot create payees)"

      - name: borrower_other_loan_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=3]", "errors[ERR_BORROWER_NOT_OWNER]", roles.Borrower]
        distinguishing_aspect: "entity_backed identity: Borrower with X-User-ID == loan 1 filing a case against loan 2 -> ERR_BORROWER_NOT_OWNER (ownership check, distinct from role denial)."
        test_recipe:
          setup: ["Two ACTIVE loans LN-RBAC-2A / LN-RBAC-2B (escrow_required false)"]
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-RBAC-2A", borrower_name: "Owner One", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan1: $.data.id } }
