  # ==========================================================================
  # §1.2.1 / complexity layers — one instance per declared layer, plus both
  # concurrency_rules entries exercised at their own write_endpoint.
  # ==========================================================================
  - section: complexity_layers
    instances:
      - name: stale_invoice_version_on_dispute_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.dispute-create-stale-invoice
          - errors.ERR_INVOICE_VERSION_STALE
        distinguishing_aspect: |
          The losing writer is told its READ is stale, not that anything is
          wrong with its payload: the replayed request is byte-identical to one
          that just succeeded. The invoice version advances on the dispute
          create even though nothing on the invoice body was addressed by the
          caller, and dispute_count proves the second create never landed.
        test_recipe:
          setup:
            - "one issued invoice carrying a single 47550 charge"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
