scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Order
          - endpoints.POST_/orders
        distinguishing_aspect: "POST /orders with customer_id, product_id, production_day_id -> 201; response has server-minted id, placed_at, production_status=DRAFT, payment_status=UNPAID, version=1."
        test_recipe:
          setup:
            - "ACTIVE product, ProductionDay, registered customer exist"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Basic", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, pstat: $.data.production_status, paystat: $.data.payment_status, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Order.${order_id}.production_status == DRAFT"
            - "Order.${order_id}.payment_status == UNPAID"
            - "Order.${order_id}.version == 1"

      - name: create_order_missing_product_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Order.fields.product_id
          - endpoints.POST_/orders
        distinguishing_aspect: "POST /orders omitting required product_id -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Customer and production day exist; product_id omitted from body"
          setup_api_calls:
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e2@x.com", full_name: "E Two" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_order_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Order
          - endpoints.GET_/orders/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /orders/{random-uuid} for an unknown id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No order with the queried id exists"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e3@x.com", full_name: "E Three" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_order_unknown_production_day_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Order.fields.production_day_id
          - endpoints.POST_/orders
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /orders whose production_day_id does not resolve -> ERR_REFERENCE_NOT_FOUND (404), distinct from a malformed-body 400."
        test_recipe:
          setup:
            - "Valid product + customer; production_day_id is a syntactically valid but nonexistent uuid"
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Ref", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e4@x.com", full_name: "E Four" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "11111111-1111-4111-8111-111111111111" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: line_computed_effective_allergens_union
        claim_type: Computed Fields
        grounds:
          - entities.OrderLineCustomization.fields.effective_allergen_codes
          - entities.OrderLineCustomization.fields.line_surcharge_cents
          - endpoints.POST_/orders/{id}/lines
        distinguishing_aspect: "A line on a product declaring [EGG] selecting an option introducing [NUT] yields effective_allergen_codes containing both EGG and NUT, and line_surcharge_cents == units*sum(option surcharges)."
        test_recipe:
          setup:
            - "Product declares EGG; option MARZIPAN(+800) introduces NUT and is allowed; DRAFT order; line units=2 [MARZIPAN] with no conflicting dietary tag"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /options"
              payload: { option_code: "MARZIPAN", surcharge_cents: 800, introduces_allergen_codes: ["NUT"], dietary_exclusion_codes: [] }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Allergen", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: ["MARZIPAN"], declared_allergen_codes: ["EGG"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e5@x.com", full_name: "E Five" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 2, selected_option_codes: ["MARZIPAN"], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id, surcharge: $.data.line_surcharge_cents }
          assert:
            - "response.status == 201"
            - "OrderLineCustomization.${line_id}.line_surcharge_cents == 1600"
            - "OrderLineCustomization.${line_id}.effective_allergen_codes contains EGG"
            - "OrderLineCustomization.${line_id}.effective_allergen_codes contains NUT"

      - name: order_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/orders
          - entities.Order
        distinguishing_aspect: "GET /orders?limit=1 returns response_type=array with total_count and has_more reflecting more than one order for the customer."
        test_recipe:
          setup:
            - "Customer with two DRAFT orders"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Pg", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e6@x.com", full_name: "E Six" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /orders?customer_id=${cust_id}&limit=1&offset=0"
              payload: { customer_id: "${cust_id}", limit: 1, offset: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.meta-or-body total_count == 2"
            - "response.has_more == true"

      - name: pagination_limit_over_max_returns_validation_error
        claim_type: Type Constraints
        grounds:
          - endpoints.GET_/orders
          - errors[ERR_VALIDATION_PAGINATION]
        distinguishing_aspect: "GET /orders?limit=500 exceeds the max of 100 -> ERR_VALIDATION_PAGINATION (400)."
        test_recipe:
          setup:
            - "Any authenticated customer"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e7@x.com", full_name: "E Seven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /orders?limit=500"
              payload: { limit: 500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION_PAGINATION"

      - name: payment_immutable_entity_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Payment
          - endpoints.POST_/orders/{id}/payments
        distinguishing_aspect: "Payment is common_fields:false (append-only): its create response exposes id and created_at but no version field, and there is no Payment update endpoint."
        test_recipe:
          setup:
            - "Order QUOTED and a DEPOSIT payment recorded"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Pay", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e8@x.com", full_name: "E Eight" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 1, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pay_id: $.data.id, amt: $.data.amount_cents }
          assert:
            - "response.status == 201"
            - "Payment.${pay_id}.amount_cents == 5000"

  # =========================================================================
  - section: state_machines
    instances:
      - name: approve_proof_from_terminal_fulfilled_order_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an order already in terminal FULFILLED -> ERR_INVALID_STATE (409); no cancel transition leaves a terminal state."
        test_recipe:
          setup:
            - "Order driven all the way to FULFILLED"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Term", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e9@x.com", full_name: "E Nine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 1, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "p1" }
              as: BakeryStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bv_order_id_1: $.data.version }
            - call: "POST /orders/${order_id}/balance-payment"
              payload: { kind: "BALANCE", applied_credit_cents: 0, expected_order_version: "${bv_order_id_1}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/slot"
              payload: { fulfillment_mode: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${order_id}/slot/${res_id}/commit"
              payload: { expected_order_version: "${ov}" }
              as: DeliveryDispatcher
            - call: "POST /orders/${order_id}/start-production"
              payload: {}
              as: BakeryStaff
            - call: "POST /orders/${order_id}/mark-ready"
              payload: {}
              as: BakeryStaff
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: BakeryStaff
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { cancel_reason: "too late" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.production_status == FULFILLED"

      - name: approve_proof_twice_second_attempt_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.DesignProof.AWAITING_REVIEW_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-APPROVED proof a second time -> ERR_INVALID_STATE (409); the proof is in terminal APPROVED."
        test_recipe:
          setup:
            - "Order PROOF_APPROVED via a first proof approval"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Idem", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e10@x.com", full_name: "E Ten" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 1, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "p1" }
              as: BakeryStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_post_commit_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.PROOF_APPROVED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_post_commit_releases_reservation_decrements_capacity
          rationale: "The cancel->release->capacity-decrement cascade is the body of the named §1.8 instance."

      - name: proof_revision_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.Order.CHANGES_REQUESTED_to_PROOF_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_proof_revision_cycle
          rationale: "The PROOF_PENDING<->CHANGES_REQUESTED cycle is the body of the named §1.8 instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: gross_balance_capture_no_credit
        claim_type: Correct Result
        grounds:
          - calculations.balance_capture
          - entities.Customer.fields.lifetime_spend_cents
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: "gross_capture variant (applied_credit_cents=0): a 16100 balance is fully tendered; lifetime_spend_cents rises by deposit(6900)+balance(16100)=23000; loyalty_tier stays STANDARD (<50000)."
        test_recipe:
          setup:
            - "Order non-peak, estimate 23000, deposit 6900, balance 16100, PROOF_APPROVED, capturing balance with zero credit"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Gross", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e11@x.com", full_name: "E Eleven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 2, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "p1" }
              as: BakeryStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bv_order_id_2: $.data.version }
            - call: "POST /orders/${order_id}/balance-payment"
              payload: { kind: "BALANCE", applied_credit_cents: 0, expected_order_version: "${bv_order_id_2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { credit_leg: $.data.credit_applied_cents, fresh: $.data.amount_cents }
          assert:
            - "Order.${order_id}.payment_status == PAID_IN_FULL"
            - "Order.${order_id}.balance_due_cents == 0"
            - "Customer.${cust_id}.lifetime_spend_cents == 23000"
            - "Customer.${cust_id}.loyalty_tier == STANDARD"

      - name: credit_offset_capture_loyalty_excludes_credit
        claim_type: Variant Selection
        grounds:
          - calculations.balance_capture
          - entities.Payment.fields.credit_applied_cents
          - entities.Customer.fields.lifetime_spend_cents
