      - name: plan_revision_cycle_conserves_base_payload_and_index
        conserved_quantity: "the plan's zero-fuel index moment as an additive decomposition over its distribution rows"
        invariant_formula: |
          base_payload_kg == round2(sum of PaxDistributionLine.line_weight_kg
                             + sum of BagAllocation.effective_weight_kg
                             + sum of assigned ACCEPTED/LOADED CargoItem.weight_kg)
          index_zfw       == round2(Flight.dry_operating_index
                             + sum of PaxDistributionLine.index_delta
                             + sum of BagAllocation.index_delta)          # PER_LINE_THEN_SUM
          # therefore adding a row and deleting the same row must return index_zfw
          # to the identical value, not merely to a value within a rounding step.
        grounds:
          - calculations.calculate_base_payload
          - calculations.calculate_balance_chain
          - state_machines.LoadPlan.transitions.COMPUTED_to_DRAFT
        distinguishing_aspect: |
          A third conserved quantity at a third level of the model - the plan rather
          than the sheet - and the only one that survives a full state-machine
          round trip COMPUTED -> DRAFT -> COMPUTED with the balance fields reset to
          0 in between. Because index_zfw is an exact sum of already-rounded
          per-row deltas, the restored value must be byte-identical (97.10, from
          27.44 + 7.13 on top of 62.53), which an implementation that re-derives
          the index from the aggregate payload weight cannot reproduce. The cycle
          also flips the takeoff aft knee 28.0 -> 26.5 -> 28.0, since the
          intermediate takeoff weight 60895.00 exceeds tow_knee_weight_kg while
          both endpoints, 57375.00, do not.
