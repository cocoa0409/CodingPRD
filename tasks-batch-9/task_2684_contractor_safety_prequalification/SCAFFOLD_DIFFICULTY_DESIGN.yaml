  - rule_id: resource_temporal_overlap
    instances:
      - name: certificate_half_open_interval_admits_touching_renewal_but_rejects_a_one_second_overlap
        grounds:
          - validations[priority=25]
          - errors.ERR_COVERAGE_PERIOD_OVERLAP
          - entities.InsuranceCertificate.fields.effective_date
          - calculations.certificate_lifecycle_status
        distinguishing_aspect: |
          The one-second discrimination is on the HALF-OPEN convention: a renewal whose
          effective_date equals the incumbent's expiration_date is legal, while the same renewal
          moved one second earlier is not. The overlap scope is also keyed on
          (contractor_id, coverage_type) and on verification_status in {PENDING, VERIFIED}, so the
          recipe additionally shows a WC certificate spanning the identical interval being accepted
          and a REJECTED GL certificate not blocking anything.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults."
            - "Contractor Acme holds a VERIFIED GL certificate for the half-open interval [2026-07-01, 2027-07-01) and a VERIFIED WC certificate spanning exactly the same dates (a different coverage_type, so no conflict)."
            - "A third GL certificate submitted for [2026-08-01, 2026-12-01) was REJECTED by the analyst, so it must not participate in overlap detection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Ironclad Mutual", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_gl_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "WC", carrier_name: "Ironclad Mutual", each_occurrence_limit: 500000, aggregate_limit: 1000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_wc_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_wc_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
          trigger:
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Harbor Casualty", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2027-07-01T00:00:00Z", expiration_date: "2028-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_renewal_id: $.data.id }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Harbor Casualty", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2027-06-30T23:59:59Z", expiration_date: "2028-06-30T23:59:59Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              expect_error: ERR_COVERAGE_PERIOD_OVERLAP
          assert:
            - "touching renewal: HTTP 201 with InsuranceCertificate.${cert_renewal_id}.verification_status == PENDING and lifecycle_status == NOT_YET_EFFECTIVE at the 2026-08-01 clock"
            - "one-second-earlier duplicate: HTTP 409 with error.code == ERR_COVERAGE_PERIOD_OVERLAP"
            - "GET /contractors/${con_id}/insurance-certificates?coverage_type=GL returns exactly 2 rows (${cert_gl_id} and ${cert_renewal_id})"
            - "InsuranceCertificate.${cert_gl_id} is unchanged: verification_status VERIFIED, lifecycle_status CURRENT, expiration_date 2027-07-01T00:00:00Z"
            - "the WC row ${cert_wc_id} spanning the identical dates was accepted, proving the overlap scope is (contractor_id, coverage_type)"

      - name: access_window_closed_interval_intersects_at_touching_endpoints_while_cooldown_clears_exactly_at_24h
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - errors.ERR_ACCESS_COOLDOWN_ACTIVE
          - errors.ERR_ACCESS_WINDOW_OVERLAP
          - state_machines.SiteAccessGrant.GRANTED_to_REVOKED
        distinguishing_aspect: |
          Two temporal conventions that point in OPPOSITE directions are pinned in one sequence:
          the access window is a CLOSED interval, so a new grant starting exactly where a live
          grant ends is rejected, while the revocation cooldown clears INCLUSIVELY, so a retry
          exactly at revoked_at + 24h succeeds and a retry one second earlier does not. An
          implementation that reuses the certificate half-open comparison for grants, or that uses
          a strict comparison for the cooldown, flips both outcomes.
