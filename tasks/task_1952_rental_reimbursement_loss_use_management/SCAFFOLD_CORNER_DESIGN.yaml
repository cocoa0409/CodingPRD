          setup: ["Reservation RETURNED at 2026-08-15 (repair IN_PROGRESS, no recovery); clean invoice AUTO_APPROVED with audited_payable 66800"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
