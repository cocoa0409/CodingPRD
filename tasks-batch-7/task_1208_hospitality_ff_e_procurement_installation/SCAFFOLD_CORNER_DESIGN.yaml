            - { call: "POST /api/damage-claims/${d2_id}/transitions", payload: { to_status: "RESOLVED_REPLACEMENT" }, as: PurchasingAgent, captures: { d2_status: $.data.status } }
            - { call: "POST /api/damage-claims/${s1_id}/transitions", payload: { to_status: "RESOLVED_REPLACEMENT" }, as: PurchasingAgent, captures: { s1_status: $.data.status } }
