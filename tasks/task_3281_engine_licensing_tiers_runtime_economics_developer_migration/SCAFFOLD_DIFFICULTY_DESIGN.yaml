            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-09", new_device_installs: 1100000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /install-reports/${rep_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "POST /orgs/${org_id}/migration-assessments"
              payload: { target_engine: "OtherEngine" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { ma_id: $.data.id }
            - call: "POST /migration-assessments/${ma_id}/advance"
              payload: { target: "EXPORT_READY" }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /migration-assessments/${ma_id}/advance"
              payload: { target: "COOLING_OFF" }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /migration-assessments/${ma_id}/advance"
              payload: { target: "COMPLETED" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MIGRATION_BLOCKED (one FINALIZED/UNPAID invoice of 2,000,000 cents outstanding)"
            - "MigrationAssessment.${ma_id}.assessment_status == COOLING_OFF (unchanged)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (two instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: seat_subscription_halfopen_adjacency_allowed
        grounds:
          - validations[priority=8]
        distinguishing_aspect: |
          Half-open [start, end) semantics on SeatSubscription: a new subscription
          whose coverage_start equals an existing same-tier subscription's
          coverage_end is ADJACENT and allowed, while overlapping by one day is
          rejected — adjacency-allowed is the distinguishing semantic.
        test_recipe:
          setup:
            - "PRO org with existing PRO subscription covering [2026-09-01, 2027-03-01)"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Overlap Co", contact_email: "o@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /orgs/${org_id}/seat-subscriptions"
              payload: { tier_code: "PRO", purchased_seats: 2, coverage_start: "2026-09-01", coverage_end: "2027-03-01", expected_org_version: "${org_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "GET /orgs/${org_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { org_v2: $.data.version }
          trigger:
            - call: "POST /orgs/${org_id}/seat-subscriptions"
              payload: { tier_code: "PRO", purchased_seats: 2, coverage_start: "2027-03-01", coverage_end: "2027-09-01", expected_org_version: "${org_v2}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { sub2_id: $.data.id }
            - call: "GET /orgs/${org_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { org_v3: $.data.version }
            - call: "POST /orgs/${org_id}/seat-subscriptions"
              payload: { tier_code: "PRO", purchased_seats: 1, coverage_start: "2027-02-28", coverage_end: "2027-04-01", expected_org_version: "${org_v3}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent subscription created successfully (sub2_id bound)"
            - "one-day-overlap subscription rejected: err == ERR_SUBSCRIPTION_OVERLAP"

      - name: export_agreement_closed_interval_adjacency_conflicts
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          Closed-interval [start, end] semantics on ExportAgreement (opposite of the
          half-open seat rule): a new CONSOLE_A agreement whose term_start equals the
          existing agreement's term_end IS a conflict because both endpoints are
          inclusive — adjacency itself collides.
        test_recipe:
          setup:
            - "PRO org with PENDING CONSOLE_A agreement [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Closed Co", contact_email: "cl@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/export-agreements"
              payload: { platform_code: "CONSOLE_A", term_start: "2026-01-01", term_end: "2026-12-31" }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /orgs/${org_id}/export-agreements"
              payload: { platform_code: "CONSOLE_A", term_start: "2026-12-31", term_end: "2027-06-30" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGREEMENT_OVERLAP (closed interval: shared endpoint 2026-12-31 collides; contrast with half-open seat rule where adjacency passes)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (two instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_assign_release_conserves_purchased_pool
        grounds:
          - entities.SeatSubscription.fields.active_seats
          - state_machines.SeatSubscription
        distinguishing_aspect: |
          Conserved quantity: purchased seat pool. Any sequence of assign/release
          pairs leaves active_seats + available_seats == purchased_seats exactly;
          EXHAUSTED->ACTIVE->EXHAUSTED cycling must not drift the invariant.
        test_recipe:
          setup:
            - "PRO org, one subscription purchased_seats=2"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Pool Co", contact_email: "pl@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /orgs/${org_id}/seat-subscriptions"
              payload: { tier_code: "PRO", purchased_seats: 2, coverage_start: "2026-09-01", coverage_end: "2027-09-01", expected_org_version: "${org_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /seat-subscriptions/${sub_id}/assign"
              payload: { member_label: "a" }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /seat-subscriptions/${sub_id}/assign"
              payload: { member_label: "b" }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /seat-subscriptions/${sub_id}/release"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /seat-subscriptions/${sub_id}/assign"
              payload: { member_label: "c" }
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "SeatSubscription.${sub_id}.active_seats == 2 and available_seats == 0 (active + available == purchased_seats == 2 after the release+assign pair)"
            - "SeatSubscription.${sub_id}.subscription_status == EXHAUSTED"

      - name: invoice_pay_waive_conserves_balance_due
        grounds:
          - calculations.invoice_net_settlement
          - entities.DeveloperOrg.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity: org balance_due ledger (different quantity from the
          seat pool). A waiver (capped at 50%) followed by an exact payment of the
          remainder leaves balance_due == 0 and final - paid - waived == 0 per
          invoice; no cent is created or destroyed by the pay+waive pair.
        test_recipe:
          setup:
            - "PRO org, revenue gate met, SHIPPED project, one ACCEPTED report with FINALIZED invoice final_amount_cents == 2000000"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Ledger Co", contact_email: "le@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.18f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game Led", editor_version_id: "${ev_id}", charity_flag: true }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 1100000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /install-reports/${rep_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "GET /projects/${proj_id}/invoices"
              payload: {}
              as: FinanceOps
              captures: { inv_id: $.data.0.id }
          trigger:
            - call: "POST /invoices/${inv_id}/waive"
              payload: { amount_cents: 1000000, reason: "charity project partial waiver (cap 50% of 2,000,000)" }
              as: FinanceOps
            - call: "POST /invoices/${inv_id}/pay"
              payload: { amount_cents: 1000000 }
              as: FinanceOps
            - call: "GET /orgs/${org_id}/ledger"
              payload: {}
              as: FinanceOps
          assert:
            - "RuntimeFeeInvoice.${inv_id}.waived_cents == 1000000 and paid_cents == 1000000 and payment_status == PAID"
            - "ledger balance_due_cents == 0 and invoiced_cents == 2000000 (final - paid - waived == 0)"
            - "DeveloperOrg.${org_id}.balance_due_cents == 0"
