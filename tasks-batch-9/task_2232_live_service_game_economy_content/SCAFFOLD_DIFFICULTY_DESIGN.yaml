            - "LiveEvent A (window 2026-08-05T00:00:00Z -> 2026-08-05T02:00:00Z, forecast_ccu 6000) is APPROVED, so reserved_ccu is 6000."
            - "LiveEvent B (window 2026-08-05T02:15:00Z -> 2026-08-05T04:00:00Z, forecast_ccu 4500) and LiveEvent C (same window, forecast_ccu 4000) are both PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
