            - { call: "POST /true-ups", payload: { contract_id: "${k}", expected_contract_version: "${k_v}" }, as: OpsDispatcher, captures: { tu1: $.data.id, tu1_status: $.data.status, tu1_due: $.data.balance_due_cents } }
          trigger:
            - { call: "POST /true-ups", payload: { contract_id: "${k}", expected_contract_version: "${k_v}" }, as: OpsDispatcher, captures: { err: $.data.error_id } }
            - { call: "GET /true-ups/${tu1}", as: OpsDispatcher, captures: { tu1_after: $.data.status } }
          assert:
            - "Stale create: HTTP 412 with error_id == ERR_STALE_CONTRACT_VERSION"
            - "First true-up ${tu1} remains DRAFT (not superseded by the rejected request) with balance_due_cents == 0 (no pushes all season)"

      - name: backup_selector_ranking_tiebreak_and_grace_extension
        claim_type: selector_policy
        grounds:
          - calculations.backup_subcontractor_selection
          - calculations.sla_deadline
          - state_machines.ServiceVisit.AWAITING_BACKUP_to_SCHEDULED
        distinguishing_aspect: "Selector determinism: two eligible backups tie on active-assignment count (0 each), so the tie breaks on subcontractor created_at ASC; the chosen backup extends the visit deadline by exactly BACKUP_GRACE_MINUTES and materializes a new ACTIVE coverage row."
        test_recipe:
          setup: ["Primary subP with ACTIVE coverage and assigned visit vB (deadline 14:00); eligible backups subB1 (created at 2026-05-01T00:01:00Z) and subB2 (created 2026-05-01T00:02:00Z); subP's coverage then fails"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Backup Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Backup Lot", address: "39 Spare St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /subcontractors", payload: { legal_name: "Primary Plow", contact_email: "p@sub.example" }, as: OpsDispatcher, captures: { subP: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:01:00Z" }, as: PlatformAdmin }
            - { call: "POST /subcontractors", payload: { legal_name: "Backup One", contact_email: "b1@sub.example" }, as: OpsDispatcher, captures: { subB1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:02:00Z" }, as: PlatformAdmin }
            - { call: "POST /subcontractors", payload: { legal_name: "Backup Two", contact_email: "b2@sub.example" }, as: OpsDispatcher, captures: { subB2: $.data.id } }
            - { call: "POST /subcontractors/${subP}/approve", as: PlatformAdmin }
            - { call: "POST /subcontractors/${subB1}/approve", as: PlatformAdmin }
            - { call: "POST /subcontractors/${subB2}/approve", as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${e}", contract_id: "${k}", subcontractor_id: "${subP}", coverage_start: "2026-12-10T00:00:00Z", coverage_end: "2026-12-10T12:00:00Z" }, as: OpsDispatcher, captures: { caP: $.data.id } }
            - { call: "POST /coverage-assignments/${caP}/activate", as: Subcontractor, as_user_id: "${subP}" }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z", assigned_subcontractor_id: "${subP}" }, as: OpsDispatcher, captures: { vB: $.data.id, vB_due0: $.data.sla_deadline_at } }
            - { call: "POST /coverage-assignments/${caP}/fail", payload: { failure_reason: "Transmission failure" }, as: Subcontractor, as_user_id: "${subP}" }
          trigger:
            - { call: "POST /visits/${vB}/reassign", payload: {}, as: OpsDispatcher, captures: { vB_sub: $.data.assigned_subcontractor_id, vB_due: $.data.sla_deadline_at, vB_grace: $.data.grace_extended, vB_exec: $.data.execution_status } }
            - { call: "GET /coverage-assignments", payload: { subcontractor_id: "${subB1}", storm_event_id: "${e}" }, as: OpsDispatcher }
          assert:
            - "Tie-break on created_at ASC: visit ${vB}.assigned_subcontractor_id == ${subB1} (created 2026-05-01T00:01:00Z beats subB2's 00:02:00Z; both had 0 active assignments for the event)"
            - "Failed primary subP is excluded from its own retry pool"
            - "execution_status returns to SCHEDULED with grace_extended == true and sla_deadline_at == \"2026-12-10T16:00:00.000Z\" (14:00 deadline + 120 min grace)"
            - "A new CoverageAssignment row for (event, contract, subB1) exists in ACTIVE status spanning the event window"

      - name: backup_selector_empty_pool_returns_409
        claim_type: selector_policy
        grounds:
          - calculations.backup_subcontractor_selection
          - validations[priority=20]
        distinguishing_aspect: "Empty-pool fallback: with the failed primary excluded and no other subcontractors registered, reassign fails with ERR_NO_BACKUP_AVAILABLE and the visit remains AWAITING_BACKUP."
        test_recipe:
          setup: ["Only one subcontractor exists; its coverage failed; visit is AWAITING_BACKUP"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "No Backup Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Alone Lot", address: "40 Solo St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /subcontractors", payload: { legal_name: "Only Plow", contact_email: "only@sub.example" }, as: OpsDispatcher, captures: { subX: $.data.id } }
            - { call: "POST /subcontractors/${subX}/approve", as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${e}", contract_id: "${k}", subcontractor_id: "${subX}", coverage_start: "2026-12-10T00:00:00Z", coverage_end: "2026-12-10T12:00:00Z" }, as: OpsDispatcher, captures: { caX: $.data.id } }
            - { call: "POST /coverage-assignments/${caX}/activate", as: Subcontractor, as_user_id: "${subX}" }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z", assigned_subcontractor_id: "${subX}" }, as: OpsDispatcher, captures: { vX: $.data.id } }
            - { call: "POST /coverage-assignments/${caX}/fail", payload: { failure_reason: "Engine seized" }, as: Subcontractor, as_user_id: "${subX}" }
          trigger:
            - { call: "POST /visits/${vX}/reassign", payload: {}, as: OpsDispatcher, captures: { err: $.data.error_id } }
            - { call: "GET /visits/${vX}", as: OpsDispatcher, captures: { vX_exec: $.data.execution_status, vX_sub: $.data.assigned_subcontractor_id } }
          assert:
            - "error_id == ERR_NO_BACKUP_AVAILABLE (409) — the failed subcontractor is retry-excluded and the pool is otherwise empty"
            - "Visit ${vX} remains execution_status == AWAITING_BACKUP with assigned_subcontractor_id == null"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_ledger_sync_after_issue
        claim_type: immediate_consistency
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Contract.fields.season_billed_cents
        distinguishing_aspect: "Immediate consistency: the very next read after issue reflects the ledger sync — no lag, no recomputation endpoint needed."
        test_recipe:
          setup: ["Billable visit; DRAFT invoice invC total 45000"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Consistent Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Sync Lot", address: "41 Now St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, trigger_depth_inches: 1.0, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e}/verify", as: OpsDispatcher }
            - { call: "POST /invoices", payload: { contract_id: "${k}", kind: "EVENT", storm_event_id: "${e}" }, as: OpsDispatcher, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/issue", as: OpsDispatcher }
            - { call: "GET /contracts/${k}", as: OpsDispatcher, captures: { billed: $.data.season_billed_cents, unbilled: $.data.unbilled_billable_cents } }
            - { call: "GET /visits/${v}", as: OpsDispatcher, captures: { v_bill: $.data.billing_status } }
          assert:
            - "The read immediately after issue: season_billed_cents == 45000 and unbilled_billable_cents == 0 and visit billing_status == INVOICED — all side effects visible without any delay or refresh call"

