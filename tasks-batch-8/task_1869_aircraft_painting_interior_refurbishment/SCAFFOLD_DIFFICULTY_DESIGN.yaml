# =============================================================================
# Task 1869 — SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x instances (25 total). Every chain replays from empty DB.
# Common fixture literals: base 12,345,673 / rate 150,000 / cap 0.10 /
# contractual 2026-09-01; scheme 2400sqft x 2 coats x 0.10 stripe; booth
# 25,000/h buffer 6h; bay 85,000/day; aircraft max_delta 50.0.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: weight_delta_provisional_vs_final_diverge
        grounds:
          - calculations.weight_delta
          - entities.WeightBalanceRecord.fields.delta_lbs
          - entities.WeightBalanceRecord.fields.variant
        distinguishing_aspect: |
          Entity domain = aircraft weight documentation (WeightBalanceRecord).
          Identical program, pinned scheme (2400 sqft, 2 coats, stripe 0.10,
          STRIP default) produce delta_lbs 41.7 under PROVISIONAL (film factor
          0.006 -> film 31.68) vs 38.6 under FINAL (factor 0.0058 -> film
          30.624) because the film factor differs by variant.
        test_recipe:
          setup:
            - "Program QUOTED with APPROVED scheme (2400 sqft, 2 coats, stripe 0.10); no assessment recorded (decision defaults to STRIP factor 1.0)"
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "PROVISIONAL", removal_weight_lbs: 100.0, installed_weight_lbs: 110.0 }, as: ShopTechnician, as_user_id: "tech-1", captures: { prov_delta: $.data.delta_lbs, prov_film: $.data.film_lbs } }
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "FINAL", removal_weight_lbs: 100.0, installed_weight_lbs: 108.0 }, as: ShopTechnician, as_user_id: "tech-1", captures: { fin_delta: $.data.delta_lbs, fin_film: $.data.film_lbs } }
          assert:
            - "provisional film_lbs == 31.68 (2400 x 2 x 0.006 x 1.1) and delta_lbs == 41.7 (110.0 - 100.0 + 31.68 rounded 1dp)"
            - "final film_lbs == 30.624 (2400 x 2 x 0.0058 x 1.1) and delta_lbs == 38.6 (108.0 - 100.0 + 30.624 rounded 1dp)"
            - "prov_delta != fin_delta for the same pinned scheme — variant selection, not input, drives the difference"

      - name: penalty_projection_vs_settlement_diverge
        grounds:
          - calculations.delivery_penalty
          - entities.RefurbProgram.fields.projected_penalty_cents
          - entities.RefurbProgram.fields.penalty_final_cents
        distinguishing_aspect: |
          Entity domain = delivery-guarantee billing (RefurbProgram/Invoice) —
          distinct from the weight domain instance. Same data (one REPORTED,
          never CONFIRMED, 5-day CUSTOMER_CAUSED event; delivery at clock
          2026-09-08): projection counts the pending event (adjusted 2026-09-06,
          2 days -> 300,000) while settlement ignores it (adjusted 2026-09-01,
          7 days -> 1,050,000).
        test_recipe:
          setup:
            - "Program driven to READY_FOR_DELIVERY (slot, assessment STRIP/NONE, scheme approved, booth booking completed 8h, PAINT/INTERIOR/FINAL inspections PASSED, lot CERTIFIED, FINAL WBR signed); one CUSTOMER_CAUSED 5-day DelayEvent left in REPORTED status; clock advanced to 2026-09-08"
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-22T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/surface-assessments", payload: { program_id: "${prog_id}" }, as: ShopTechnician, captures: { asm_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "SURFACE_REVIEW" }, as: ProgramManager }
            - { call: "POST /completion/surface-assessments/${asm_id}/decide", payload: { decision: "STRIP", corrosion_severity: "NONE" }, as: ShopTechnician }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v1: $.data.version } }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /completion/paint-booths", payload: { name: "BOOTH-1", hourly_rate_cents: 25000, cure_buffer_hours: 6 }, as: CenterAdmin, captures: { booth_id: $.data.id } }
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z" }, as: ProgramManager, captures: { bk_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "IN_WORK" }, as: ProgramManager }
            - { call: "POST /completion/delay-events", payload: { program_id: "${prog_id}", category: "CUSTOMER_CAUSED", impact_days: 5, reason: "Customer parts late" }, as: ProgramManager, captures: { dev_id: $.data.id } }
            - { call: "POST /completion/booth-bookings/${bk_id}/complete", payload: { actual_hours: 8 }, as: ShopTechnician }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "IN_INSPECTION" }, as: ProgramManager }
            - { call: "POST /completion/quality-inspections", payload: { program_id: "${prog_id}", inspection_type: "PAINT" }, as: QualityInspector, captures: { qi_p: $.data.id } }
            - { call: "POST /completion/quality-inspections/${qi_p}/record-result", payload: { result: "PASS", major_defects: 0, minor_defects: 0 }, as: QualityInspector }
            - { call: "POST /completion/quality-inspections", payload: { program_id: "${prog_id}", inspection_type: "INTERIOR" }, as: QualityInspector, captures: { qi_i: $.data.id } }
            - { call: "POST /completion/quality-inspections/${qi_i}/record-result", payload: { result: "PASS", major_defects: 0, minor_defects: 0 }, as: QualityInspector }
            - { call: "POST /completion/quality-inspections", payload: { program_id: "${prog_id}", inspection_type: "FINAL" }, as: QualityInspector, captures: { qi_f: $.data.id } }
            - { call: "POST /completion/quality-inspections/${qi_f}/record-result", payload: { result: "PASS", major_defects: 0, minor_defects: 0 }, as: QualityInspector }
            - { call: "POST /completion/soft-good-lots", payload: { program_id: "${prog_id}", description: "Seat covers", material: "Leather", quantity: 8, estimated_weight_lbs: 96.0 }, as: ShopTechnician, captures: { lot_id: $.data.id } }
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "VERTICAL_12S", result: "PASS", lab_name: "AeroBurn Labs" }, as: ShopTechnician }
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "FINAL", removal_weight_lbs: 100.0, installed_weight_lbs: 108.0 }, as: ShopTechnician, as_user_id: "tech-1", captures: { wbr_id: $.data.id } }
            - { call: "POST /completion/weight-balance-records/${wbr_id}/sign-off", payload: {}, as: QualityInspector, as_user_id: "qi-1" }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "READY_FOR_DELIVERY" }, as: ProgramManager }
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: CenterAdmin }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { proj_pen: $.data.projected_penalty_cents } }
          trigger:
            - { call: "POST /completion/invoices", payload: { program_id: "${prog_id}", kind: "FINAL" }, as: FinanceClerk, captures: { inv_id: $.data.id, inv_total: $.data.total_cents } }
            - { call: "POST /completion/invoices/${inv_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { fin_pen: $.data.penalty_final_cents } }
          assert:
            - "proj_pen == 300000 (projection: REPORTED event counts, adjusted 2026-09-06, delivery assumed at clock 2026-09-08 -> 2 days x 150000)"
            - "FINAL invoice penalty_credit line == -1050000 (settlement: REPORTED excluded, adjusted 2026-09-01 -> 7 days x 150000)"
            - "inv_total == 5322837 (remainder 6172837 + booth 200000 - penalty 1050000)"
            - "fin_pen == 1050000 persisted at issuance"

      - name: booth_fee_scheduled_vs_actual_diverge
