  # section: rbac — role denial and ownership claims are carried by the
  # validations instances wrong_role_denied_on_exclusive_endpoints,
  # assignee_cannot_dispute_other_employees_settlement, and the three
  # sod_* instances; no separate stubs are emitted (coverage is real, not cited).
