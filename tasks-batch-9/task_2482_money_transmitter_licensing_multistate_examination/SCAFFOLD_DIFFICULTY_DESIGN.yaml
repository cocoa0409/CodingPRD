              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 10000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: 85000000, memo: "Outstanding transmission liability" }
              as: LicensingManager
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "BankA", book_value_cents: 84999999, market_value_cents: 84999999 }
              as: ComplianceOfficer
          trigger:
            - call: "GET /licensees/${lic_id}/coverage-summary"
              as: ChiefComplianceOfficer
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "BankA", book_value_cents: 1, market_value_cents: 1 }
              as: ChiefComplianceOfficer
            - call: "GET /licensees/${lic_id}/coverage-summary"
              as: ChiefComplianceOfficer
          assert:
            - "trigger call 1: eligible_investment_value_cents == 84999999 and coverage_ratio_bps == 9999 and coverage_posture == WATCH"
            - "trigger call 3: eligible_investment_value_cents == 85000000 and coverage_ratio_bps == 10000 and coverage_posture == COMPLIANT"
            - "trigger call 3: book_coverage_ratio_bps == 10000 (both variants coincide when every holding is unhaircut CASH)"
            - "coverage_ratio_bps is never 10001 or 9999.9 — the value is a floored integer basis point"

      - name: oversight_score_of_exactly_seventy_admits_activation
        grounds:
          - calculations.delegate_oversight_score
          - validations[priority=75]
          - errors[ERR_OVERSIGHT_SCORE_INSUFFICIENT]
          - entities.DelegateAuthorization.fields.oversight_score_at_activation
        distinguishing_aspect: |
          A different metric (the 0-100 weighted oversight score, not a money ratio) observed at a
          different endpoint (POST /delegate-authorizations/{id}/activate): component scores
          (80,65,60) floor to 69 and are rejected, while (70,70,70) floor to exactly 70 and are
          admitted, pinning the gate as >= OVERSIGHT_MIN_SCORE with truncation, not rounding.
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with one ACTIVE CA license, no obligations, expansion_gate OPEN."
            - "Delegate D1 reviewed at training 80 / aml 65 / recordkeeping 60 with a PENDING_OVERSIGHT authorization."
            - "Delegate D2 reviewed at training 70 / aml 70 / recordkeeping 70 with a PENDING_OVERSIGHT authorization."
