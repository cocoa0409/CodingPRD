      - name: err_no_eligible_lead_state_for_an_unresourced_panel
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_ELIGIBLE_LEAD_STATE
          - validations[priority 63 ERR_NO_ELIGIBLE_LEAD_STATE]
          - calculations.lead_state_selection
        distinguishing_aspect: |
          The panel is well formed and the states are real, so this is a 422 about a derived value that
          cannot be computed rather than about the request's shape. Because the lead is mandatory on the
          entity, the whole collaboration is refused - no partially populated row with a null lead survives,
          which is what lets the coordinator retry with the same call_reference.
