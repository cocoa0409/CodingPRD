# §1.8 Scaffold Difficulty Design — Test Targeting Index (2 instances per rule)
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: d1_proration_daily_vs_monthly
        grounds: [calculations.closing_proration, entities.EscrowFile.fields.proration_amount_cents]
        distinguishing_aspect: |
          Two EscrowFiles with identical annual_registration_fee_cents (100001) and expected_close_date
          (2026-06-30) diverge purely by proration_method: DAILY yields 50411 (100001*184/365, single
          final rounding) while MONTHLY yields 49998 (6 months x round_half_up(100001/12)=8333, per-month
          rounding then sum) — same entity domain (EscrowFile proration), two variants, different cents.
        test_recipe:
          setup:
            - "empty DB; two aircraft; buyer and seller parties; two escrow files differing only in proration_method"
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N100DA", serial_number: "S-100", make_model: "Cessna 560XL", year: 2015 }, as: EscrowOfficer, captures: { ac1: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N100MA", serial_number: "S-101", make_model: "Cessna 560XL", year: 2016 }, as: EscrowOfficer, captures: { ac2: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac1}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 100001, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f1: $.data.id, f1_pror: $.data.proration_amount_cents } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac2}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 100001, proration_method: "MONTHLY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f2: $.data.id, f2_pror: $.data.proration_amount_cents } }
          trigger: []
          assert:
            - "EscrowFile.${f1}.proration_amount_cents == 50411 (DAILY: 184 days after 2026-06-30 through Dec 31)"
            - "EscrowFile.${f2}.proration_amount_cents == 49998 (MONTHLY: 6 full months x 8333, close day 30 > 15 so no half month)"
            - "the two values differ although every other input is identical"
      - name: d2_payoff_flat_vs_per_diem
        grounds: [calculations.effective_lien_payoff, entities.Lien.fields.amount_paid_cents, state_machines.LienRelease.FILED_to_RECORDED]
        distinguishing_aspect: |
          Two liens quoted with identical base (500000) and good_through date diverge purely by payoff_basis:
          FLAT freezes amount_paid at 500000 while PER_DIEM freezes 545000 (500000 + 9 days x 5000 per-diem)
          when recorded on 2026-06-10 — Lien-domain dual variant, distinct from the EscrowFile proration variant.
        test_recipe:
          setup:
            - "escrow file with lender; one search with two findings (lien L1 500000 FAA_RECORDED, lien L2 800000 IR_INTEREST); releases requested and quoted (L1 FLAT, L2 PER_DIEM 5000/day) at clock 2026-06-01; clock advanced to 2026-06-10"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N200PA", serial_number: "S-200", make_model: "King Air 350", year: 2012, is_international_registry: true }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", lender_party_id: "${ln}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [ { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 500000, lien_type: "FAA_RECORDED", filed_at: "2025-03-01" }, { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 800000, lien_type: "IR_INTEREST", filed_at: "2025-04-01", ir_registered_at: "2025-04-02" } ] }, as: EscrowOfficer }
            - { call: "GET /api/liens", payload: { escrow_file_id: "${f}" }, as: EscrowOfficer, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { r1: $.data.id } }
            - { call: "POST /api/liens/${l2}/releases", payload: {}, as: EscrowOfficer, captures: { r2: $.data.id } }
            - { call: "POST /api/releases/${r1}/quote", payload: { payoff_basis: "FLAT", quoted_payoff_cents: 500000, good_through_date: "2026-06-30" }, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/releases/${r2}/quote", payload: { payoff_basis: "PER_DIEM", quoted_payoff_cents: 500000, per_diem_cents: 5000, good_through_date: "2026-06-30" }, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/releases/${r1}/receive-release", payload: {}, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/releases/${r2}/receive-release", payload: {}, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/releases/${r1}/file", payload: {}, as: EscrowOfficer }
            - { call: "POST /api/releases/${r2}/file", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/releases/${r1}/record", payload: {}, as: EscrowOfficer }
            - { call: "POST /api/releases/${r2}/record", payload: {}, as: EscrowOfficer }
          assert:
            - "Lien.${l1}.amount_paid_cents == 500000 (FLAT ignores elapsed days)"
            - "Lien.${l2}.amount_paid_cents == 545000 (PER_DIEM: 500000 + 5000 x 9 days from 2026-06-01 to 2026-06-10)"
            - "Lien.${l1}.outstanding_cents == 0 and Lien.${l2}.outstanding_cents == 255000 (800000 - 545000)"
            - "both liens RELEASED; identical quote base and dates produced different frozen payoffs"

  - rule_id: combinatorial_formula
    instances:
      - name: c1_escrow_fee_tiered_with_trust_surcharge
        grounds: [calculations.escrow_fee_schedule, entities.EscrowFile.fields.escrow_fee_cents]
        distinguishing_aspect: |
          Mode (a): fee has >= 3 inputs with non-linear interaction — tiered marginal rates with min/max
          tier clamps, a conditional trust surcharge, a minimum-fee floor and a cap. Price 250000000 with
          zero proration yields 500000 (150000+300000+50000 marginal tiers); identical file with
          requires_trust=true yields 575000 (surcharge inside the min-with-cap, floor inactive).
        test_recipe:
          setup: ["two escrow files, same price 250000000 and annual fee 0; file B requires_trust"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N310FA", serial_number: "S-310", make_model: "Pilatus PC-12", year: 2018 }, as: EscrowOfficer, captures: { ac1: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N310FB", serial_number: "S-311", make_model: "Pilatus PC-12", year: 2019 }, as: EscrowOfficer, captures: { ac2: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac1}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 250000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { fa: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac2}", buyer_party_id: "${b}", seller_party_id: "${s}", requires_trust: true, purchase_price_cents: 250000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { fb: $.data.id } }
            - { call: "GET /api/escrow-files/${fa}/statement", payload: {}, as: EscrowOfficer, captures: { fee_a: $.data.escrow_fee_cents } }
            - { call: "GET /api/escrow-files/${fb}/statement", payload: {}, as: EscrowOfficer, captures: { fee_b: $.data.escrow_fee_cents } }
          trigger: []
          assert:
            - "statement of ${fa}: escrow_fee_cents == 500000"
            - "statement of ${fb}: escrow_fee_cents == 575000 (500000 + 75000 trust surcharge, below FEE_CAP)"
            - "EscrowFile.${fb}.posture == TRUST_BLOCKED (trust leg) while fee is still computed and frozen"
      - name: c2_statement_evaluation_order_pin
        grounds: [calculations.closing_statement_totals, calculations.escrow_fee_schedule, calculations.closing_proration]
        distinguishing_aspect: |
          Mode (c): the fee tier base is purchase_price + proration — a circular-looking dependency
          (due -> FUNDED gate -> close date -> proration -> fee base -> due) broken by pinned evaluation
          order proration -> fee -> due. With price 250000000, annual 120000, DAILY close 2026-06-30:
          proration 60493, fee 500060 (base 250060493; fee-on-price-alone would be 500000), due 250560553.
        test_recipe:
          setup: ["one escrow file with price 250000000, annual fee 120000, DAILY proration, expected close 2026-06-30"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N320EO", serial_number: "S-320", make_model: "Beechjet 400", year: 2010 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 250000000, annual_registration_fee_cents: 120000, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "GET /api/escrow-files/${f}/statement", payload: {}, as: EscrowOfficer, captures: { st_pror: $.data.proration_amount_cents, st_fee: $.data.escrow_fee_cents, st_due: $.data.buyer_amount_due_cents } }
          trigger: []
          assert:
            - "statement.proration_amount_cents == 60493"
            - "statement.escrow_fee_cents == 500060 (tier base includes proration: 150000 + 300000 + round_half_up(50060493 x 0.001) = 150000 + 300000 + 50060)"
            - "statement.buyer_amount_due_cents == 250560553 (250000000 + 60493 + 500060)"
            - "fee differs from the price-only-base value 500000, proving the pinned evaluation order"

  - rule_id: non_linear_state_machine
    instances:
      - name: n1_filing_reject_resubmit_cycle_with_parallel_verification
        grounds: [state_machines.Filing.SUBMITTED_to_REJECTED, state_machines.Filing.REJECTED_to_SUBMITTED, entities.Filing.fields.verification_status]
        distinguishing_aspect: |
          Filing is non-linear twice over: the SUBMITTED -> REJECTED -> SUBMITTED resubmission cycle, and
          the parallel verification_status dimension (PENDING -> MISMATCHED -> MATCHED) evolving
          independently of the lifecycle status (stays ACCEPTED while verification flips).
        test_recipe:
          setup: ["a CLOSED escrow file (clean search, funded exactly to due 250560553, closed)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N300FN", serial_number: "S-300", make_model: "Cessna Citation", year: 2014 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 250000000, annual_registration_fee_cents: 120000, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v1: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 250560553, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${v1}" }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v2: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/close", payload: { expected_escrow_file_version: "${v2}" }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files/${f}/filings", payload: { filing_type: "BILL_OF_SALE" }, as: EscrowOfficer, captures: { fl: $.data.id } }
            - { call: "POST /api/filings/${fl}/submit", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/filings/${fl}/reject", payload: { reason: "illegible notary seal" }, as: EscrowOfficer }
            - { call: "POST /api/filings/${fl}/resubmit", payload: {}, as: EscrowOfficer, captures: { st_resub: $.data.status } }
            - { call: "POST /api/filings/${fl}/accept", payload: { confirmation_code: "FAA-C-1" }, as: EscrowOfficer, captures: { st_acc: $.data.status, vs_acc: $.data.verification_status } }
            - { call: "POST /api/filings/${fl}/verify", payload: { recorded_confirmation_code: "FAA-C-999" }, as: EscrowOfficer, captures: { st_mm: $.data.status, vs_mm: $.data.verification_status } }
            - { call: "POST /api/filings/${fl}/verify", payload: { recorded_confirmation_code: "FAA-C-1" }, as: EscrowOfficer, captures: { vs_ok: $.data.verification_status } }
          assert:
            - "after reject+resubmit cycle: Filing.status == SUBMITTED again (REJECTED is not terminal)"
            - "after accept: status == ACCEPTED and verification_status == PENDING (parallel dimension armed)"
            - "wrong recorded code: verification_status == MISMATCHED while status remains ACCEPTED (dimensions independent)"
            - "re-verify with correct code: verification_status == MATCHED (MISMATCHED -> MATCHED re-verify cycle)"
      - name: n2_trust_reject_revise_cycle
        grounds: [state_machines.TrustAgreement.SUBMITTED_to_REJECTED, state_machines.TrustAgreement.REJECTED_to_DRAFT]
        distinguishing_aspect: |
          TrustAgreement is cyclic: DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> ACCEPTED;
          the revise loop clears submitted_at and permits new dates, a negotiation-round cycle on a
          different entity than Filing's resubmission cycle.
        test_recipe:
          setup: ["aircraft and a citizenship-verified trustee party"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N400TA", serial_number: "S-400", make_model: "Cirrus SR22", year: 2020 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "TRUSTEE", legal_name: "Trustee Co", is_citizenship_verified: true }, as: EscrowOfficer, captures: { tr: $.data.id } }
            - { call: "POST /api/trust-agreements", payload: { aircraft_id: "${ac}", trustee_party_id: "${tr}", beneficiary_name: "Beneficiary LLC", beneficiary_citizenship: "NON_US_CITIZEN", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: EscrowOfficer, captures: { ta: $.data.id } }
            - { call: "POST /api/trust-agreements/${ta}/submit", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/trust-agreements/${ta}/reject", payload: {}, as: EscrowManager, captures: { st_rej: $.data.status } }
            - { call: "POST /api/trust-agreements/${ta}/revise", payload: { effective_date: "2026-02-01", expiry_date: "2026-12-31" }, as: EscrowOfficer, captures: { st_rev: $.data.status, eff_rev: $.data.effective_date } }
            - { call: "POST /api/trust-agreements/${ta}/submit", payload: {}, as: EscrowOfficer }
            - { call: "POST /api/trust-agreements/${ta}/accept", payload: {}, as: EscrowManager, captures: { st_fin: $.data.status } }
          assert:
            - "after reject: status == REJECTED"
            - "after revise: status == DRAFT, effective_date == 2026-02-01, submitted_at == null (cycle reset)"
            - "after resubmit + accept: status == ACCEPTED (loop terminates)"

  - rule_id: transitive_cascade
    instances:
      - name: cas_a_release_record_to_cleared
        grounds: [state_machines.LienRelease.FILED_to_RECORDED, state_machines.Lien.RELEASE_PENDING_to_RELEASED, state_machines.EscrowFile.SEARCH_COMPLETE_to_CLEARED]
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger: POST record -> LienRelease RECORDED mutates Lien to
          RELEASED (link 1); the lien mutation recomputes EscrowFile.posture LIEN_BLOCKED -> READY
          (link 2); the posture flip auto-transitions EscrowFile SEARCH_COMPLETE -> CLEARED (link 3).
        test_recipe:
          setup: ["file with one lien in RELEASE_PENDING; release FILED; file is SEARCH_COMPLETE with posture LIEN_BLOCKED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N500CA", serial_number: "S-500", make_model: "Piper M600", year: 2017 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", lender_party_id: "${ln}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [ { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 500000, lien_type: "FAA_RECORDED", filed_at: "2025-03-01" } ] }, as: EscrowOfficer }
            - { call: "GET /api/liens", payload: { escrow_file_id: "${f}" }, as: EscrowOfficer, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { r1: $.data.id } }
            - { call: "POST /api/releases/${r1}/quote", payload: { payoff_basis: "FLAT", quoted_payoff_cents: 500000, good_through_date: "2026-06-30" }, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/releases/${r1}/receive-release", payload: {}, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/releases/${r1}/file", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/releases/${r1}/record", payload: {}, as: EscrowOfficer }
            - { call: "GET /api/liens/${l1}", payload: {}, as: EscrowOfficer, captures: { lien_st: $.data.status } }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { file_st: $.data.status, file_posture: $.data.posture } }
          assert:
            - "LienRelease.${r1}.status == RECORDED (trigger link)"
            - "Lien.${l1}.status == RELEASED (link 1, caused by the release recordation)"
            - "EscrowFile.${f}.posture == READY (link 2, caused by the lien mutation)"
            - "EscrowFile.${f}.status == CLEARED (link 3, bubble-up auto-transition caused by the posture flip)"
      - name: cas_b_search_complete_lien_posture
        grounds: [state_machines.TitleSearch.ACTIVE_to_COMPLETED, entities.EscrowFile.fields.posture]
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: POST complete -> creates Lien rows (link 1); each new
          DISCOVERED lien recomputes EscrowFile.posture to LIEN_BLOCKED (link 2), which BLOCKS the
          SEARCH_COMPLETE -> CLEARED auto-transition (status stays SEARCH_COMPLETE) — absence-of-transition
          is the observable effect of link 2, complementary to cas_a.
        test_recipe:
          setup: ["fresh file in SEARCH_ORDERED"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N600CB", serial_number: "S-600", make_model: "TBM 940", year: 2021 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
          trigger:
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [ { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 100000, lien_type: "FAA_RECORDED", filed_at: "2024-01-15" }, { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 200000, lien_type: "JUDGMENT", filed_at: "2024-06-01" } ] }, as: EscrowOfficer, captures: { fc: $.data.finding_count } }
            - { call: "GET /api/liens", payload: { escrow_file_id: "${f}" }, as: EscrowOfficer, captures: { l1: "$.data[0].id", l1_st: "$.data[0].status" } }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { file_st: $.data.status, file_posture: $.data.posture } }
          assert:
            - "TitleSearch.${ts}.finding_count == 2 and status COMPLETED"
            - "two Lien rows exist for the file, both status DISCOVERED (link 1)"
            - "EscrowFile.${f}.posture == LIEN_BLOCKED (link 2, caused by the lien creation)"
            - "EscrowFile.${f}.status == SEARCH_COMPLETE — the CLEARED auto-transition is suppressed by posture"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: p1_release_state_beats_fiscal
        grounds: ["validations[priority=8]", "validations[priority=28]", state_machines.DisbursementInstruction.APPROVED_to_RELEASED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: releasing an APPROVED disbursement while the file
          is CLEARED (state gate: file must be CLOSED/RECORDED) AND amount 500000 exceeds balance 100000
          (fiscal gate) — the state error ERR_INVALID_TRANSITION must win over ERR_ESCROW_SHORTFALL.
        test_recipe:
          setup: ["CLEARED file (due 10150000) with a single 100000 deposit; an APPROVED 500000 SELLER_PROCEEDS disbursement"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N700PP", serial_number: "S-700", make_model: "Cessna 182", year: 2005 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v1: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 100000, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${v1}" }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v2: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/disbursements", payload: { payee_party_id: "${s}", amount_cents: 500000, purpose: "SELLER_PROCEEDS", expected_escrow_file_version: "${v2}" }, as: EscrowOfficer, captures: { d: $.data.id } }
            - { call: "POST /api/disbursements/${d}/approve", payload: {}, as: EscrowManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/disbursements/${d}/release", payload: {}, as: EscrowManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "release rejected with ERR_INVALID_TRANSITION (state, priority 8) — NOT ERR_ESCROW_SHORTFALL (fiscal, priority 28), although both conditions hold"
            - "DisbursementInstruction.${d}.status remains APPROVED; EscrowFile escrow_balance_cents remains 100000"
      - name: p2_filing_sequence_beats_liens
        grounds: ["validations[priority=18]", "validations[priority=22]", state_machines.Filing.QUEUED_to_SUBMITTED]
        distinguishing_aspect: |
          Error-category pair business_constraint vs business_referential: DEREGISTRATION submit where the
          prerequisite BILL_OF_SALE is not ACCEPTED (constraint, priority 18) AND a post-close re-search has
          discovered a new unreleased lien (referential, priority 22) — ERR_FILING_SEQUENCE_VIOLATION wins.
        test_recipe:
          setup: ["CLOSED file; clock advanced past search validity; second search completed with one finding (lien DISCOVERED); BILL_OF_SALE and DEREGISTRATION filings both QUEUED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N710PS", serial_number: "S-710", make_model: "Cessna 206", year: 2008 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 250000000, annual_registration_fee_cents: 120000, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v1: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 250560553, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${v1}" }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v2: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/close", payload: { expected_escrow_file_version: "${v2}" }, as: EscrowOfficer }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-02T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts2: $.data.id } }
            - { call: "POST /api/title-searches/${ts2}/complete", payload: { findings: [ { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 75000, lien_type: "STATE", filed_at: "2026-06-15" } ] }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files/${f}/filings", payload: { filing_type: "BILL_OF_SALE" }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files/${f}/filings", payload: { filing_type: "DEREGISTRATION" }, as: EscrowOfficer, captures: { fld: $.data.id } }
          trigger:
            - { call: "POST /api/filings/${fld}/submit", payload: {}, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "submit rejected with ERR_FILING_SEQUENCE_VIOLATION (constraint, priority 18) — NOT ERR_LIENS_OUTSTANDING (referential, priority 22), although both hold"
            - "Filing.${fld}.status remains QUEUED"

  - rule_id: boundary_precision_check
    instances:
      - name: b1_funding_threshold_exact_cent
        grounds: [state_machines.EscrowFile.CLEARED_to_FUNDED, calculations.closing_statement_totals]
        distinguishing_aspect: |
          Money metric boundary: total_funded at due-1 (250560552) leaves the file CLEARED; adding exactly
          1 cent to reach due (250560553, inclusive >=) flips it to FUNDED — off-by-one-cent precision on
          the funding threshold, exercised through POST /api/escrow-files/{id}/deposits.
        test_recipe:
          setup: ["CLEARED file with buyer_amount_due_cents == 250560553 and no deposits"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N800B1", serial_number: "S-800", make_model: "Mooney M20", year: 2001 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 250000000, annual_registration_fee_cents: 120000, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 250560552, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${v1}" }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { st_low: $.data.status, fund_low: $.data.total_funded_cents, v2: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 1, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${v2}" }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { st_eq: $.data.status, fund_eq: $.data.total_funded_cents } }
          assert:
            - "after 250560552 (due - 1): status == CLEARED, total_funded_cents == 250560552"
            - "after +1 cent (== due exactly): status == FUNDED, total_funded_cents == 250560553"
      - name: b2_search_freshness_exact_second
        grounds: ["validations[priority=26]", state_machines.TitleSearch.COMPLETED_to_STALE]
        distinguishing_aspect: |
          Time metric boundary on a different endpoint (close): a search completed at 2026-06-01T00:00:00Z
          is fresh at exactly +30 days (2026-07-01T00:00:00Z, inclusive) so close succeeds, but stale one
          second later (strictly-greater rule) so close fails with ERR_SEARCH_STALE.
        test_recipe:
          setup: ["two identical files (aircraft N810B2 / N811B3), each CLEARED then FUNDED (due 10150000) with searches completed at clock 2026-06-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N810B2", serial_number: "S-810", make_model: "Piper PA-28", year: 2000 }, as: EscrowOfficer, captures: { acA: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N811B3", serial_number: "S-811", make_model: "Piper PA-28", year: 2001 }, as: EscrowOfficer, captures: { acB: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${acA}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { fA: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${acB}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { fB: $.data.id } }
            - { call: "POST /api/escrow-files/${fA}/title-searches", payload: {}, as: EscrowOfficer, captures: { tsA: $.data.id } }
            - { call: "POST /api/escrow-files/${fB}/title-searches", payload: {}, as: EscrowOfficer, captures: { tsB: $.data.id } }
            - { call: "POST /api/title-searches/${tsA}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "POST /api/title-searches/${tsB}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${fA}", payload: {}, as: EscrowOfficer, captures: { vA1: $.data.version } }
            - { call: "GET /api/escrow-files/${fB}", payload: {}, as: EscrowOfficer, captures: { vB1: $.data.version } }
            - { call: "POST /api/escrow-files/${fA}/deposits", payload: { payer_party_id: "${b}", amount_cents: 10150000, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${vA1}" }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files/${fB}/deposits", payload: { payer_party_id: "${b}", amount_cents: 10150000, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${vB1}" }, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: EscrowManager }
            - { call: "GET /api/escrow-files/${fA}", payload: {}, as: EscrowOfficer, captures: { vA2: $.data.version } }
            - { call: "POST /api/escrow-files/${fA}/close", payload: { expected_escrow_file_version: "${vA2}" }, as: EscrowOfficer, captures: { closeA: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:01Z" }, as: EscrowManager }
            - { call: "GET /api/escrow-files/${fB}", payload: {}, as: EscrowOfficer, captures: { vB2: $.data.version } }
            - { call: "POST /api/escrow-files/${fB}/close", payload: { expected_escrow_file_version: "${vB2}" }, as: EscrowOfficer, captures: { errB: $.data.error_id } }
          assert:
            - "at exactly effective_at + 30 days: file A close succeeds (status CLOSED) — boundary is inclusive"
            - "at +30 days + 1 second: file B close rejected with ERR_SEARCH_STALE (strictly-greater staleness rule)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: x1_dereg_submit_requires_liens_released
        grounds: ["validations[priority=22]", state_machines.Filing.QUEUED_to_SUBMITTED, entities.Lien.fields.status]
        distinguishing_aspect: |
          Entity pair Filing -> Lien: DEREGISTRATION submit is gated on every Lien of the file being
          RELEASED; with BILL_OF_SALE already ACCEPTED (sequence satisfied) a single DISCOVERED lien from
          a post-close re-search blocks the submit with ERR_LIENS_OUTSTANDING.
