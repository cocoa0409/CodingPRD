  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: leave_bid_closed_interval_shared_boundary_conflicts
        grounds:
          - state_machines.LeaveBid.SUBMITTED_to_AWARDED
          - validations[priority=10]
        distinguishing_aspect: |
          Semantics = CLOSED day-intervals on the LeaveBid resource (the same
          employee): an AWARDED leave of Aug 10..12 conflicts with a new bid
          whose start_date is Aug 12 (the shared boundary day IS leave), so
          awarding the second bid is rejected ERR_LEAVE_CONFLICT — adjacency
          does not merge away the conflict.
        test_recipe:
          setup:
            - "Employee E (CONDUCTOR/CHI) with AWARDED leave 2026-08-10..2026-08-12"
            - "Second SUBMITTED bid by E for 2026-08-12..2026-08-14 (shares boundary day Aug 12)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E9601", full_name: "Rae Conductor", craft: "CONDUCTOR", seniority_date: "2015-10-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/leave-bids"
              payload: { employee_id: "${emp_id}", leave_type: "VACATION", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-12T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { bid1_id: $.data.id }
            - call: "POST /api/leave-bids/${bid1_id}/award"
              payload: {}
              as: CrewManager
            - call: "POST /api/employees/${emp_id}/return-from-leave"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/leave-bids"
              payload: { employee_id: "${emp_id}", leave_type: "PERSONAL_DAY", start_date: "2026-08-12T00:00:00Z", end_date: "2026-08-14T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { bid2_id: $.data.id }
          trigger:
            - call: "POST /api/leave-bids/${bid2_id}/award"
              payload: {}
              as: CrewManager
              captures: { err_overlap: $.data.error_id }
          assert:
            - "captured err_overlap == ERR_LEAVE_CONFLICT (closed interval: shared day Aug 12 conflicts)"
            - "HTTP status == 422"

      - name: job_seat_capacity_aggregate_not_interval
        grounds:
          - validations[priority=11]
          - entities.Job.fields.crew_required
          - entities.Job.fields.filled_count
        distinguishing_aspect: |
          Semantics = AGGREGATE CAPACITY on the Job resource (not point or
          closed-interval overlap): two calls for the same report_time window
          are both acceptable until filled_count reaches crew_required; the
          seat that would make filled_count exceed crew_required is rejected
          ERR_JOB_ALREADY_FILLED — capacity arithmetic, not interval
          arithmetic.
        test_recipe:
          setup:
            - "Board with E1, E2 (CONDUCTOR/CHI); Job J crew_required=2"
            - "Call to E1 accepted (filled_count 1); call to E2 accepted (filled_count 2, job FILLED)"
            - "Third call cannot even be issued to a filled job — pinned probe: a second ACCEPT against the now-FILLED job via a call offered earlier to E1's boardmate... (pinned chain: crew_required=2, three employees; calls C1->E1 accept, C2->E2 accept fills; C3 was issued before fill? calls issue one at a time: after FILLED no third call can be issued; the capacity reject is therefore pinned as: E3's call issued while seat open, then E1+E2 fill, then E3 accept rejected)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
