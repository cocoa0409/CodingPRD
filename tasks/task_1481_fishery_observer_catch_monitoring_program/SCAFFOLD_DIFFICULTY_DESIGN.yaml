      - name: deployment_data_rejected_revision_loop
        grounds:
          - state_machines.Deployment.DEBRIEFING_to_DATA_REJECTED
          - state_machines.Deployment.DATA_REJECTED_to_DEBRIEFING
          - state_machines.Deployment.DEBRIEFING_to_DATA_VALIDATED
          - state_machines.Deployment.SCHEDULED_to_SAFETY_HOLD
          - state_machines.Deployment.SAFETY_HOLD_to_READY_TO_DEPLOY
        distinguishing_aspect: |
          Deployment is a branching machine with a revision loop (DEBRIEFING ->
          DATA_REJECTED -> DEBRIEFING -> DATA_VALIDATED) AND a fork-join safety
          sub-graph (SCHEDULED -> SAFETY_HOLD -> READY_TO_DEPLOY vs the direct
          SCHEDULED -> READY_TO_DEPLOY on first-pass PASS). A data rejection lets
          the observer resubmit and the deployment re-enter DEBRIEFING — a loop
          no linear pipeline admits — and this machine belongs to a different
          entity (Deployment) than the HarassmentReport appeal cycle.
        test_recipe:
