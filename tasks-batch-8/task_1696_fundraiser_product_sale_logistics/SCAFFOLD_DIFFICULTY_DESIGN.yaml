            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam2", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
              captures: { o2: $.data.id }
          trigger:
            - { call: "POST /fundraiser/sellers/${sA}/suspend", payload: {}, as: GroupCoordinator }
