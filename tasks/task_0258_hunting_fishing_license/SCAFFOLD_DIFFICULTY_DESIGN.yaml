scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: license_fee_resident_vs_nonresident_diverge
        grounds:
          - calculations.license_fee
          - entities.LicenseProduct.fields.base_fee_cents
          - entities.Applicant.fields.residency_status
          - validations[priority=9]
        distinguishing_aspect: |
          Domain = LicenseProduct pricing on the License entity. The same product
          (base_fee_cents 4500) issued OTC to a RESIDENT costs 4800 cents, to a
          NONRESIDENT costs 11550 cents — the residency multiplier produces
          divergent fees from identical product inputs.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z."
            - "A general STAMP product P_stamp (residency_restriction ANY, base_fee_cents 4500, requires_education false, min_age_years 0)."
            - "Resident applicant A_res (declared MT, residency APPROVED RESIDENT)."
            - "Nonresident applicant A_nr (declared CA, residency APPROVED NONRESIDENT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "STAMP-DUCK", product_kind: "STAMP", base_fee_cents: 4500, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_stamp_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_res_id: $.data.id }
            - call: "POST /residency-verifications/${rv_res_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /applicants"
              payload: { full_name: "A NR", birth_date: "1980-01-01", declared_state_code: "CA" }
              as: DrawOfficer
              captures: { a_nr_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_nr_id}", proof_type: "UTILITY_BILL", proof_state_code: "OR", continuous_months: 1 }
              as: DrawOfficer
              captures: { rv_nr_id: $.data.id }
            - call: "POST /residency-verifications/${rv_nr_id}/approve"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_stamp_id}" }
              as: LicenseAgent
              captures: { lic_res_id: $.data.id }
            - call: "POST /licenses"
              payload: { applicant_id: "${a_nr_id}", license_product_id: "${p_stamp_id}" }
              as: LicenseAgent
              captures: { lic_nr_id: $.data.id }
          assert:
            - "License.${lic_res_id}.fee_charged_cents == 4800"
            - "License.${lic_nr_id}.fee_charged_cents == 11550"

      - name: draw_priority_score_squared_vs_linear_diverge
        grounds:
          - calculations.draw_priority_score
          - entities.DrawApplication.fields.points_at_entry
          - entities.DrawPool.fields.scoring_model
          - state_machines.DrawPool.CLOSED_to_DRAWN
        distinguishing_aspect: |
          Domain = Applicant draw-ranking on the DrawApplication entity. The same
          frozen points_at_entry=2 yields priority_score 4 under a SQUARED pool but
          2 under a LINEAR pool — divergence on a different entity domain than the
          LicenseProduct fee calc.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z."
            - "ELK season SEAS (OPEN, draw_required true, bag_limit 1)."
            - "TAG product P_tag bound to SEAS (residency ANY, requires_education false)."
            - "Applicant X driven to preference_points=2 by losing two prior single-quota draws."
            - "Two terminal pools both quota=1: P_sq (SQUARED) and P_ln (LINEAR), both ACCEPTING with X as the sole entrant, both past their entry_deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "X", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { x_id: $.data.id }
            # --- losing draw L1: winner W1 (bonus 1) beats X (pp0,b0); X pp 0->1 ---
            - call: "POST /applicants"
              payload: { full_name: "W1", birth_date: "1980-01-01", declared_state_code: "MT", bonus_points: 1 }
              as: DrawOfficer
              captures: { w1_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-10T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pl1_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pl1_id}", applicant_id: "${w1_id}" }
              as: DrawOfficer
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pl1_id}", applicant_id: "${x_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pl1_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pl1_v: $.data.version }
            - call: "POST /draw-pools/${pl1_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pl1_v}" }
              as: DrawOfficer
            # --- losing draw L2: winner W2 (bonus 2, score 2) beats X (pp1, score 1); X pp 1->2 ---
            - call: "POST /applicants"
              payload: { full_name: "W2", birth_date: "1980-01-01", declared_state_code: "MT", bonus_points: 2 }
              as: DrawOfficer
              captures: { w2_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-20T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pl2_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pl2_id}", applicant_id: "${w2_id}" }
              as: DrawOfficer
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pl2_id}", applicant_id: "${x_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-21T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pl2_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pl2_v: $.data.version }
            - call: "POST /draw-pools/${pl2_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pl2_v}" }
              as: DrawOfficer
            # --- X now pp=2; enter both terminal pools while snapshot is 2 ---
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-30T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { p_sq_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-30T00:00:00Z", scoring_model: "LINEAR" }
              as: DrawOfficer
              captures: { p_ln_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${p_sq_id}", applicant_id: "${x_id}" }
              as: DrawOfficer
              captures: { da_sq_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${p_ln_id}", applicant_id: "${x_id}" }
              as: DrawOfficer
              captures: { da_ln_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${p_sq_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { p_sq_v: $.data.version }
            - call: "POST /draw-pools/${p_ln_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { p_ln_v: $.data.version }
          trigger:
            - call: "POST /draw-pools/${p_sq_id}/execute-draw"
              payload: { expected_draw_pool_version: "${p_sq_v}" }
              as: DrawOfficer
            - call: "POST /draw-pools/${p_ln_id}/execute-draw"
              payload: { expected_draw_pool_version: "${p_ln_v}" }
              as: DrawOfficer
          assert:
            - "DrawApplication.${da_sq_id}.priority_score == 4"
            - "DrawApplication.${da_ln_id}.priority_score == 2"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  #   (a) >=3 inputs / non-linear interaction  -> replacement_admin_fee
  #   (b) nested rounding where order matters   -> license_fee (multiply-then-add)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: replacement_fee_three_input_conditional_branches
        grounds:
          - calculations.replacement_admin_fee
          - entities.LicenseProduct.fields.product_kind
          - entities.Replacement.fields.reason
          - entities.Applicant.fields.residency_status
        distinguishing_aspect: |
          Mode (a): three inputs (product_kind, reason, residency_status) interact
          through conditional branches — TAG+LOST+RESIDENT = 2500, but STOLEN
          short-circuits the whole base to 0 regardless of the TAG surcharge.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z; ELK season SEAS OPEN (draw_required false so the TAG can be issued OTC)."
            - "TAG product P_tag bound to SEAS, residency ANY, requires_education false."
            - "Resident applicant A_res holds an ISSUED TAG license L_tag (OTC)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_tag_id: $.data.id }
          trigger:
            - call: "POST /replacements"
              payload: { original_license_id: "${l_tag_id}", reason: "LOST" }
              as: LicenseAgent
              captures: { repl_id: $.data.id }
          assert:
            - "Replacement.${repl_id}.admin_fee_cents == 2500"

      - name: license_fee_multiply_then_add_rounding_order_pinned
        grounds:
          - calculations.license_fee
          - entities.LicenseProduct.fields.base_fee_cents
          - entities.Applicant.fields.residency_status
          - entities.License.fields.issued_via
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned. For a NONRESIDENT OTC
          issuance the multiply (round_half_up(4500*2.5)=11250) happens BEFORE the
          300 agent surcharge is added (11550); the reversed order
          round((4500+300)*2.5)=12000 would diverge, so the pinned order is observable.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z."
            - "STAMP product P_stamp (base_fee_cents 4500, residency ANY)."
            - "Nonresident applicant A_nr (residency APPROVED NONRESIDENT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "STAMP-TROUT", product_kind: "STAMP", base_fee_cents: 4500, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_stamp_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A NR", birth_date: "1980-01-01", declared_state_code: "CA" }
              as: DrawOfficer
              captures: { a_nr_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_nr_id}", proof_type: "UTILITY_BILL", proof_state_code: "OR", continuous_months: 1 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /licenses"
              payload: { applicant_id: "${a_nr_id}", license_product_id: "${p_stamp_id}" }
              as: LicenseAgent
              captures: { lic_id: $.data.id }
          assert:
            - "License.${lic_id}.fee_charged_cents == 11550"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  #   (1) DrawApplication branching fork SUBMITTED->{AWARDED,UNSUCCESSFUL}
  #   (2) License revert ISSUED->VOIDED via replacement
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: draw_application_fork_awarded_vs_unsuccessful_divergent_side_effects
        grounds:
          - state_machines.DrawApplication.SUBMITTED_to_AWARDED
          - state_machines.DrawApplication.SUBMITTED_to_UNSUCCESSFUL
          - state_machines.DrawPool.CLOSED_to_DRAWN
          - entities.Applicant.fields.preference_points
        distinguishing_aspect: |
          Branching fork on DrawApplication: one execute-draw splits SUBMITTED into
          AWARDED (mint License, reset preference_points to 0) and UNSUCCESSFUL
          (+1 preference_points) — divergent side-effect sets per branch on the
          same transition trigger.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z; ELK season SEAS OPEN, draw_required true, bag_limit 1."
            - "TAG product P_tag bound to SEAS, residency ANY, requires_education false."
            - "Pool POOL quota=1, SQUARED. Two fresh applicants A1 (created first) and A2 (created second), both pp0/b0, both SUBMITTED. Clock past entry_deadline, pool CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-10T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A2", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: DrawOfficer
              captures: { da1_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a2_id}" }
              as: DrawOfficer
              captures: { da2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pool_v: $.data.version }
          trigger:
            - call: "POST /draw-pools/${pool_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pool_v}" }
              as: DrawOfficer
          assert:
            - "DrawApplication.${da1_id}.status == AWARDED"
            - "DrawApplication.${da1_id}.issued_license_id != null"
            - "DrawApplication.${da2_id}.status == UNSUCCESSFUL"
            - "DrawApplication.${da2_id}.issued_license_id == null"
            - "Applicant.${a1_id}.preference_points == 0"
            - "Applicant.${a2_id}.preference_points == 1"

      - name: license_issued_to_voided_revert_on_replacement
        grounds:
          - state_machines.License.ISSUED_to_VOIDED
          - entities.License.fields.superseded_by_id
          - entities.Replacement.fields.replacement_license_id
        distinguishing_aspect: |
          Non-linear revert on a DIFFERENT entity (License): a forward-only ISSUED
          license is moved back out of its active state to VOIDED by a Replacement,
          with superseded_by_id pointing at the freshly minted replacement.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z."
            - "STAMP product P_stamp (base_fee_cents 4500, residency ANY)."
            - "Resident applicant A_res holds an ISSUED STAMP license L_orig."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "STAMP-DUCK", product_kind: "STAMP", base_fee_cents: 4500, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_stamp_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_stamp_id}" }
              as: LicenseAgent
              captures: { l_orig_id: $.data.id }
          trigger:
            - call: "POST /replacements"
              payload: { original_license_id: "${l_orig_id}", reason: "DAMAGED" }
              as: LicenseAgent
              captures: { repl_id: $.data.id, repl_lic_id: $.data.replacement_license_id }
          assert:
            - "License.${l_orig_id}.status == VOIDED"
            - "License.${l_orig_id}.superseded_by_id == ${repl_lic_id}"
            - "License.${repl_lic_id}.status == ISSUED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  #   (1) depth>=3: execute-draw -> award DrawApplication -> mint License -> reset Applicant.preference_points
  #   (2) depth>=2: replacement -> void License -> re-link SUBMITTED HarvestReport to replacement
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: draw_award_depth3_cascade_application_license_points
        grounds:
          - state_machines.DrawPool.CLOSED_to_DRAWN
          - state_machines.DrawApplication.SUBMITTED_to_AWARDED
          - entities.License.fields.issued_via
          - entities.Applicant.fields.preference_points
        distinguishing_aspect: |
          Depth-3 cascade from execute-draw: (1) execute-draw flips the application
          to AWARDED, (2) AWARDED mints a DRAW_AWARD License, (3) minting resets the
          winning Applicant.preference_points to 0 — each link caused by the prior.
        test_recipe:
          setup:
            - "Clock at 2026-04-01T00:00:00Z; ELK season SEAS OPEN, draw_required true, bag_limit 1."
            - "TAG product P_tag bound to SEAS, residency ANY, requires_education false."
            - "Applicant W has preference_points=1 from one prior losing draw; then enters pool POOL (quota 1, SQUARED) as the only entrant; pool CLOSED past deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "W", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { w_id: $.data.id }
            # prior losing draw to lift W to pp=1
            - call: "POST /applicants"
              payload: { full_name: "Winner0", birth_date: "1980-01-01", declared_state_code: "MT", bonus_points: 5 }
              as: DrawOfficer
              captures: { w0_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-04-10T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pl0_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pl0_id}", applicant_id: "${w0_id}" }
              as: DrawOfficer
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pl0_id}", applicant_id: "${w_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
