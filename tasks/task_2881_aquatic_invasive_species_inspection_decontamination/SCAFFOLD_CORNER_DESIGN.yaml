            - "the refused re-screen changed nothing: GET /inspection-records/${rec_id} still shows residual_water_present == false, standing_water_ml == null and risk_score == 5"
            - "GET /watercraft/${wc_id} still shows version == ${wc_v2}, so a rejected write does not consume a version"
            - "control: the identical body with expected_watercraft_version ${wc_v2} returns 200, the record then shows residual_water_present == true and risk_score == 25 (5 + 0 + 20 + min(15, floor(500/100)=5)), and the vessel version has advanced to ${wc_v2} + 1"
            - "the state machine cannot substitute for the OCC check here: SCREENED -> SCREENED is a legal supersede, so both the stale and the fresh call see inspection_status == SCREENED"

      - name: optimistic_concurrency_stale_record_version_blocks_a_second_decon_order
