  - rule_id: compensating_invariant
    instances:

      - name: auxiliary_relief_minutes_net_zero_after_complete
        grounds:
          - calculations.auxiliary_assistance_minutes
          - state_machines.AuxiliaryAssignment.REQUESTED_to_APPROVED
          - state_machines.AuxiliaryAssignment.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: CarrierRoute.auxiliary_relief_minutes. The
          forward action (approve, +scheduled_minutes) paired with its
          compensating action (complete, −scheduled_minutes) returns the
          route's relief balance to exactly its pre-request value — approve
          165 then complete 165 nets 0, with the ACTIVE step in between
          holding the accrued value observable.
        test_recipe:
          setup:
            - "Logical clock at 2026-11-30T00:00:00Z (inside the Nov 15 – Jan 2 surge window). Route C930 has current_evaluated_minutes == 480 and auxiliary_relief_minutes == 0; an AUXILIARY helper exists; an assignment for service_date 2026-12-01 with projected_overrun 120 and surge flag true is REQUESTED."
