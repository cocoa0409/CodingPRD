              as: PlantAdmin
              captures: { line_a_id: $.data.id }
            - call: "POST /chassis-receipts"
              payload: { supplier_id: "${sup_ch_id}", chassis_serial: "CH-0001", chassis_class: "CLASS_A", gvwr_lbs: 26000, wheelbase_in: 242 }
              as: PlantAdmin
              captures: { ch1_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_a_id}", order_type: "SOLD", selected_option_ids: ["${opt_ac2_id}"], requested_delivery_date: "2026-09-15T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_a_id}", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v}" }
              as: ProductionScheduler
              captures: { slot_id: $.data.id }
            - call: "POST /unit-orders/${ord_id}/match-chassis"
              payload: {}
              as: ProductionScheduler
            - call: "POST /dealers/${dlr_id}/status"
              payload: { status: "SUSPENDED" }
              as: PlantAdmin
          trigger:
            - call: "POST /unit-orders/${ord_id}/release-to-line"
              payload: {}
              as: ProductionScheduler
            - call: "POST /dealers/${dlr_id}/status"
              payload: { status: "ACTIVE" }
              as: PlantAdmin
            - call: "POST /unit-orders/${ord_id}/release-to-line"
              payload: {}
              as: ProductionScheduler
              captures: { build_id: $.data.id }
          assert:
            - "the first trigger call returns 409 ERR_DEALER_SUSPENDED"
            - "after the first trigger call UnitOrder.${ord_id}.status is still SLOTTED and no UnitBuild row references it"
            - "the third trigger call returns 201 and UnitOrder.${ord_id}.status == IN_PRODUCTION"
            - "UnitBuild.${build_id}.current_station == CHASSIS_PREP and build_sequence == 1 and vin == FP-3410-000001"
            - "ChassisReceipt.${ch1_id}.status == INSTALLED"
            - "ProductionSlot.${slot_id}.status == CONSUMED"

