  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shape
        claim_type: response_shape
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type and data; error responses carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["class code 8810; policy WC-E1 created"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-E1", insured_name: "Envelope Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
          trigger:
            - { call: "GET /policies/${pol}", payload: {}, as: AuditManager }
            - { call: "GET /policies/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { err: "$.data.error_id" } }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data is the Policy"
            - "error: response_type == error, data.error_id == ERR_POLICY_NOT_FOUND, data.message present"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: not_found_errors_across_entities
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDITOR_NOT_FOUND]", "errors[ERR_CLASS_CODE_NOT_FOUND]", "errors[ERR_WORK_ORDER_NOT_FOUND]", "errors[ERR_RECORDS_REQUEST_NOT_FOUND]", "errors[ERR_APPOINTMENT_NOT_FOUND]", "errors[ERR_ALLOCATION_NOT_FOUND]", "errors[ERR_SUB_EXPOSURE_NOT_FOUND]", "errors[ERR_CERTIFICATE_NOT_FOUND]", "errors[ERR_AUDIT_RESULT_NOT_FOUND]", "errors[ERR_DISPUTE_NOT_FOUND]", "errors[ERR_BILLING_NOT_FOUND]", "errors[ERR_MOD_REVISION_NOT_FOUND]"]
        distinguishing_aspect: "Every entity-scoped 404 error_id is triggerable by addressing a well-formed but non-existent UUID at its endpoint family."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /auditors/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e1: "$.data.error_id" } }
            - { call: "GET /classification-codes/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e2: "$.data.error_id" } }
            - { call: "GET /audit-work-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e3: "$.data.error_id" } }
            - { call: "POST /records-requests/00000000-0000-0000-0000-000000000000/receive", payload: {}, as: Auditor, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { e4: "$.data.error_id" } }
            - { call: "GET /appointments/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e5: "$.data.error_id" } }
            - { call: "GET /payroll-allocations/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e6: "$.data.error_id" } }
            - { call: "GET /subcontractor-exposures/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e7: "$.data.error_id" } }
            - { call: "POST /certificates/00000000-0000-0000-0000-000000000000/verify", payload: {}, as: AuditManager, captures: { e8: "$.data.error_id" } }
            - { call: "GET /audit-results/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e9: "$.data.error_id" } }
            - { call: "GET /disputes/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e10: "$.data.error_id" } }
            - { call: "GET /billing-transactions/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { e11: "$.data.error_id" } }
            - { call: "POST /mod-revisions/00000000-0000-0000-0000-000000000000/apply", payload: {}, as: Underwriter, captures: { e12: "$.data.error_id" } }
          assert:
            - "e1 ERR_AUDITOR_NOT_FOUND, e2 ERR_CLASS_CODE_NOT_FOUND, e3 ERR_WORK_ORDER_NOT_FOUND, e4 ERR_RECORDS_REQUEST_NOT_FOUND"
            - "e5 ERR_APPOINTMENT_NOT_FOUND, e6 ERR_ALLOCATION_NOT_FOUND, e7 ERR_SUB_EXPOSURE_NOT_FOUND, e8 ERR_CERTIFICATE_NOT_FOUND"
            - "e9 ERR_AUDIT_RESULT_NOT_FOUND, e10 ERR_DISPUTE_NOT_FOUND, e11 ERR_BILLING_NOT_FOUND, e12 ERR_MOD_REVISION_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: insured_cannot_create_policy
