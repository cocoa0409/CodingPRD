          assert:
            - "e1 ERR_MASS_BALANCE_VIOLATION (1000+8000+999 = 9999 != 10000)"
            - "e2 ERR_MASS_BALANCE_VIOLATION (total 10000 balances but lint 1001 != SUM(bales) 1000)"
