  # ==========================================================================
  # RULE 8 - resource_temporal_overlap
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: lane_pair_half_open_windows_touch_ok_overlap_rejected_atomically
        grounds:
          - validations[priority=27]
          - errors[ERR_LANE_PAIR_CONFLICT]
          - entities.Match.fields.starts_at
          - entities.Match.fields.ends_at
          - entities.League.fields.total_weeks
        distinguishing_aspect: |
          The lane pair is the contended resource and priority 27 compares half-open
          [starts_at, ends_at) windows: two back-to-back matches touching at exactly
          2026-08-12T03:00:00Z are accepted, while a third match starting one minute before the
          first one ends is refused, and the refusal discards the whole batch so not even the
          two legal weeks are created.
        test_recipe:
          setup:
            - "One league on CONFIG-B, status BYLAWS_ADOPTED, with two teams, four adult memberships and a single certified lane pair ${lp1_id}."
            - "No schedule has been adopted yet: League.total_weeks == 0 and GET /matches?league_id=${lg_id} returns 0 rows."
            - "Logical clock at 2026-08-05T00:00:00Z, a week before every candidate window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
