      - name: an_authorization_request_copies_the_regimen_link_and_is_findable_by_either_parent
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /appointments/{id}/authorization-requests]
          - endpoints[GET /authorization-requests]
          - entities.AuthorizationRequest.fields.treatment_plan_id
        distinguishing_aspect: |
          The request body names only payer_name; both foreign keys are derived — the
          appointment from the path and treatment_plan_id copied from that appointment — so
          a client can never point an authorization at the wrong regimen. Two visits of the
          SAME plan therefore produce two authorizations that the appointment_id filter
          separates and the treatment_plan_id filter unites, which is the whole point of the
          denormalised link.
        test_recipe:
          setup:
            - "Standing center with two chairs, one nurse with capacity 12, the drug, a MID template, one 70 kg patient and one ACTIVE 6-cycle plan."
            - "Cycles 1 and 2 are booked on 2026-08-10 and 2026-08-17, both at 540."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 12, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-17", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap2: $.data.id }
          trigger:
            - call: "POST /appointments/${ap1}/authorization-requests"
              payload: { payer_name: "Northwind Health" }
              as: Scheduler
              captures: { az1: $.data.id, az1_ap: $.data.appointment_id, az1_plan: $.data.treatment_plan_id, az1_status: $.data.status, az1_count: $.data.submission_count }
            - call: "POST /appointments/${ap2}/authorization-requests"
              payload: { payer_name: "Meridian Mutual" }
              as: AuthorizationSpecialist
              captures: { az2: $.data.id, az2_plan: $.data.treatment_plan_id }
            - call: "GET /authorization-requests"
              payload: { appointment_id: "${ap1}" }
              as: AuthorizationSpecialist
              captures: { by_ap_first: "$.data[0].id" }
            - call: "GET /authorization-requests"
              payload: { treatment_plan_id: "${pl1}" }
              as: MedicalDirector
              captures: { by_plan_first: "$.data[0].id" }
            - call: "GET /authorization-requests"
              payload: { payer_name: "Meridian Mutual", status: "DRAFT" }
              as: Scheduler
              captures: { by_payer_first: "$.data[0].id" }
          assert:
            - "Both creations return HTTP 201 with ${az1_status} == 'DRAFT' and ${az1_count} == 0"
            - "${az1_ap} == ${ap1} — taken from the path, since the body carries no appointment_id"
            - "${az1_plan} == ${pl1} and ${az2_plan} == ${pl1} — both copied from their appointments, not supplied by the caller"
            - "The appointment_id == ${ap1} listing returns exactly 1 row and ${by_ap_first} == ${az1}"
            - "The treatment_plan_id == ${pl1} listing returns exactly 2 rows containing both ${az1} and ${az2}"
            - "The payer_name == 'Meridian Mutual' AND status == 'DRAFT' listing returns exactly 1 row and ${by_payer_first} == ${az2}"
            - "Appointment.${ap1}.readiness_status == 'PENDING' — merely creating a DRAFT authorization clears nothing"

      - name: the_chair_billing_read_is_repeatable_and_mutates_nothing_it_reports_on
