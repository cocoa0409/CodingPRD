              as_user_id: "u-prov-1"
              captures: { ref: $.data.id }
            - call: "POST /specialty-referrals/${ref}/submit-for-review"
              payload: { retrospective: false }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ur: $.data.id }
            - call: "POST /utilization-reviews/${ur}/decide"
              payload: { decision: "DENY" }
              as: UtilizationReviewer
              as_user_id: "u-ur-1"
            - call: "POST /utilization-reviews/${ur}/escalate-peer-review"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
          trigger:
            - call: "POST /utilization-reviews/${ur}/peer-decide"
              payload: { peer_decision: "OVERTURN" }
              as: PeerReviewer
              as_user_id: "u-ur-1"
            - call: "POST /utilization-reviews/${ur}/peer-decide"
              payload: { peer_decision: "OVERTURN" }
              as: PeerReviewer
              as_user_id: "u-peer-1"
          assert:
            - "The first trigger call returns 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "The second trigger call returns 200"
            - "UtilizationReview.${ur}.status == OVERTURNED"
            - "UtilizationReview.${ur}.peer_reviewer_user_id == u-peer-1"
