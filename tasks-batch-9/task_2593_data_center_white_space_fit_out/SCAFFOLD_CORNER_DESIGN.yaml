          trigger:
            - name: author_wearing_operations_manager_role_rejected
              call: "POST /mops/${mop_id}/approvals"
              as: OperationsManager
              as_user_id: "u-elec-1"
              payload: { decision: "APPROVE", comment: "author in a different hat" }
              captures: { e_author: "$.data.error_id" }
            - name: first_approval_as_change_manager
              call: "POST /mops/${mop_id}/approvals"
              as: ChangeManager
              as_user_id: "u-cm-1"
              payload: { decision: "APPROVE", comment: "board ok" }
            - name: same_user_second_vote_under_the_other_role_rejected
              call: "POST /mops/${mop_id}/approvals"
              as: OperationsManager
              as_user_id: "u-cm-1"
              payload: { decision: "APPROVE", comment: "same human, second hat" }
              captures: { e_dup: "$.data.error_id" }
            - name: distinct_user_second_approval_closes_quorum
              call: "POST /mops/${mop_id}/approvals"
              as: OperationsManager
              as_user_id: "u-om-1"
              payload: { decision: "APPROVE", comment: "operations concurs" }
          assert:
            - "author_wearing_operations_manager_role_rejected -> 422, error_id == ERR_APPROVER_IS_AUTHOR"
            - "first_approval_as_change_manager -> 200, status == UNDER_REVIEW, approval_count == 1"
            - "same_user_second_vote_under_the_other_role_rejected -> 409, error_id == ERR_DUPLICATE_APPROVER (identity wins over the role-distinctness rule that this vote would have satisfied)"
            - "GET /mops/${mop_id} as FacilityPlanner -> 200, status == UNDER_REVIEW, approval_count == 1"
            - "distinct_user_second_approval_closes_quorum -> 200, status == APPROVED, approval_count == 2"

  # =========================================================================
  # SECTION: cross-cutting complexity layers  (§1.0 complexity_layers)
  # =========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: optimistic_concurrency_on_cage_version_for_release_packets
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[release-packet-create-stale-cage]: parent_entity Cage, write_endpoint POST /release-packets, occ_field expected_cage_version, error ERR_STALE_CAGE_VERSION 412"
          - "endpoints[POST /release-packets].side_effects: increments Cage.version by 1"
          - "endpoints[POST /security-devices/{device_id}/commission].side_effects: increments Cage.version by 1 when the cage reaches SECURED"
        distinguishing_aspect: "Nothing about packet creation is state-blocked (a second packet legitimately supersedes the first), so the ONLY thing standing between a client and a blind supersede is the version token — and the token is invalidated by the packet creation itself as well as by unrelated security work on the cage. An implementation that treats expected_cage_version as decorative, or that forgets to bump Cage.version on packet creation, admits the stale second create."
        test_recipe:
          setup: "Hall CX89 with tenant TN89 and cage CG-1 (perimeter 40.0 m). The cage's version is read once, before any packet exists."
          setup_api_calls:
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "OCC Cage Hall", code: "CX89", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_id: "$.data.id" }
            - name: create_tenant
              call: "POST /tenants"
              as: FacilityPlanner
              payload: { name: "Tenant 89", code: "TN89", contracted_kw: 50.00, contract_start_date: "2026-08-01" }
              captures: { tenant_id: "$.data.id" }
            - name: create_cage
              call: "POST /cages"
              as: SecurityAdministrator
              payload: { hall_id: "${hall_id}", tenant_id: "${tenant_id}", label: "CG-1", perimeter_length_m: 40.0 }
              captures: { cage_id: "$.data.id" }
            - name: read_cage_version_1
              call: "GET /cages/${cage_id}"
              as: FacilityPlanner
              payload: {}
              captures: { cage_v1: "$.data.version" }
          trigger:
            - name: first_packet_with_current_version_succeeds
              call: "POST /release-packets"
              as: CommissioningAgent
              payload: { hall_id: "${hall_id}", cage_id: "${cage_id}", as_built_drawing_ref: "AB-CX89-CG1-r1", expected_cage_version: "${cage_v1}" }
              captures: { packet_1: "$.data.id" }
            - name: second_packet_with_stale_version_rejected
              call: "POST /release-packets"
              as: CommissioningAgent
              payload: { hall_id: "${hall_id}", cage_id: "${cage_id}", as_built_drawing_ref: "AB-CX89-CG1-r2", expected_cage_version: "${cage_v1}" }
              captures: { e_stale: "$.data.error_id" }
            - name: read_cage_version_2
              call: "GET /cages/${cage_id}"
              as: FacilityPlanner
              payload: {}
              captures: { cage_v2: "$.data.version" }
            - name: second_packet_with_refreshed_version_succeeds
              call: "POST /release-packets"
              as: CommissioningAgent
              payload: { hall_id: "${hall_id}", cage_id: "${cage_id}", as_built_drawing_ref: "AB-CX89-CG1-r2", expected_cage_version: "${cage_v2}" }
              captures: { packet_2: "$.data.id" }
            - name: third_packet_reusing_the_second_token_rejected
              call: "POST /release-packets"
              as: CommissioningAgent
              payload: { hall_id: "${hall_id}", cage_id: "${cage_id}", as_built_drawing_ref: "AB-CX89-CG1-r3", expected_cage_version: "${cage_v2}" }
              captures: { e_stale_again: "$.data.error_id" }
          assert:
            - "first_packet_with_current_version_succeeds -> 201, status == DRAFT, as_built_drawing_ref == AB-CX89-CG1-r1"
            - "second_packet_with_stale_version_rejected -> 412, error_id == ERR_STALE_CAGE_VERSION"
            - "GET /release-packets?cage_id=${cage_id} as FacilityPlanner -> 200, total_count == 1 (the refused create wrote nothing)"
            - "read_cage_version_2 -> 200, version == ${cage_v1} + 1 (packet creation bumped the cage exactly once, and the refused create did not bump it again)"
            - "second_packet_with_refreshed_version_succeeds -> 201, status == DRAFT, as_built_drawing_ref == AB-CX89-CG1-r2"
            - "third_packet_reusing_the_second_token_rejected -> 412, error_id == ERR_STALE_CAGE_VERSION (every successful write invalidates the token again)"
            - "GET /cages/${cage_id} as FacilityPlanner -> 200, version == ${cage_v1} + 2"
            - "GET /release-packets?cage_id=${cage_id} as FacilityPlanner -> 200, total_count == 2"

      - name: optimistic_concurrency_on_hall_version_for_commissioning_packages
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[commissioning-package-create-stale-hall]: parent_entity Hall, write_endpoint POST /commissioning-packages, occ_field expected_hall_version, error ERR_STALE_HALL_VERSION 412"
          - "endpoints[POST /commissioning-packages].side_effects: prior non-SUPERSEDED package of the same hall and level moves to SUPERSEDED; increments Hall.version by 1"
          - "Hall.version is also bumped by POST /rack-feeds, DELETE /rack-feeds/{feed_id}, power-on and advance-phase"
        distinguishing_aspect: "The hall token is invalidated by traffic that has nothing to do with commissioning — a single feed reservation elsewhere in the white space makes a previously read hall version stale — which is exactly the point: the agent must re-read committed_kw, the reserve tier and the postures before superseding a package. And when the refreshed create does land, the prior package of the same level is SUPERSEDED with superseded_by_package_id pointing at the new one."
        test_recipe:
          setup: "Hall CX90 driven to COMMISSIONING by the canonical build (both PDUs commissioned, BW-A1/BW-B1 ENERGIZED, zone CA-1 PASS, CU-1 IN_SERVICE, rack R-1-1 POWERED on two 7.50 kW feeds). A second PLANNED rack R-1-2 exists so that an unrelated feed reservation can bump the hall version mid-test."
