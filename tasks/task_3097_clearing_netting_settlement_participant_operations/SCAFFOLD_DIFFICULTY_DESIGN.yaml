            - "hop 4: GET /clearing/clearing-funds/${fund_sus} reports a total_component_cents recomputed over the remaining ACTIVE participants"
            - "the SUS1 window cannot reach SETTLED while the failed row belongs to a participant that is still ACTIVE, per ERR_WINDOW_HAS_ACTIVE_FAILS"
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspension_beats_self_trade_error_category_pair
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_SELF_TRADE_FORBIDDEN]
        distinguishing_aspect: "The error-category pair under test is auth versus business_safety: a request that violates BOTH the role gate and the self-trade prohibition must return the priority-2 auth error ERR_UNAUTHORIZED, not the priority-8 business error ERR_SELF_TRADE_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participant UA (legal name 'Unauth Alpha') is ACTIVE and holds its deposit pool."
            - "Security UNA1 is registered and an OPEN window exists for 2026-09-10."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Unauth Alpha", lei: "LEI-UA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ua: $.data.id }
            - call: "POST /clearing/participants/${p_ua}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "UNA1", cusip: "912828XL1", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_una: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_una}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_una: $.data.id }
          trigger:
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_ua}", security_id: "${sec_una}", side: "BUY", quantity: 100, trade_price_cents: 4200, trade_date: "2026-09-08T14:00:00Z" }
              as: RiskOfficer
              captures: { err_unauth: $.data.error_id }
          assert:
            - "the response status is 403 and ERR_UNAUTHORIZED is the returned error_id, not ERR_SELF_TRADE_FORBIDDEN"
            - "the payload also sets counterparty_participant_id equal to the acting participant, so the priority-8 self-trade rule is violated too, yet the priority-2 auth rule wins"
            - "GET /clearing/trade-submissions with participant_id=${p_ua} returns zero rows, so the rejected request wrote nothing"

      - name: invalid_state_beats_underfunded_settlement_error_category_pair
        grounds:
          - validations[priority=4]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OBLIGATION_UNDERFUNDED]
        distinguishing_aspect: "The error-category pair under test is state versus business_fiscal: settling a window whose status is still OPEN violates both the priority-4 state gate and the priority-16 funding gate, and the state error ERR_INVALID_STATE must win."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants PA (legal name 'Prior Alpha') and PB (legal name 'Prior Beta') ACTIVE."
            - "Security PRI1 with an OPEN window for 2026-09-10, and PA holds a locked-in matched BUY so a net position exists once the cycle is netted."
            - "Nothing is funded, so the priority-16 funding gate is also violated the moment the window becomes NETTED — but this trigger fires while the window is still OPEN."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Prior Alpha", lei: "LEI-PA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_pa: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Prior Beta", lei: "LEI-PB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_pb: $.data.id }
            - call: "POST /clearing/participants/${p_pa}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_pb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "PRI1", cusip: "912828XL2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_pri: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_pri}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_pri: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_pb}", security_id: "${sec_pri}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_pa}"
              captures: { t_pri: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_pri}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_pa}"
          trigger:
            - call: "POST /clearing/settlement-windows/${win_pri}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err_pri: $.data.error_id }
          assert:
            - "the response status is 409 and ERR_INVALID_STATE is the returned error_id, not ERR_OBLIGATION_UNDERFUNDED"
            - "GET /clearing/settlement-windows/${win_pri} still reports status == OPEN, so the state gate blocked the request before the funding gate was reached"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: volatility_multiplier_boundary_at_2500_bps
        grounds:
          - calculations.clearing_fund_scaling_and_cap.constants.VOLATILITY_ELEVATED_BPS
          - calculations.clearing_fund_scaling_and_cap.constants.MULTIPLIER_ELEVATED_BPS
          - calculations.clearing_fund_scaling_and_cap.constants.MULTIPLIER_BASE_BPS
          - entities.Security.fields.current_volatility_bps
        distinguishing_aspect: "The threshold is strict-greater-than on current_volatility_bps: 2500 bps takes the base multiplier of 10000 while 2501 bps takes the elevated multiplier of 15000, so the boundary is observable in component_amount_cents at exactly 2500 rather than 2501."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants VA (legal name 'Vol Alpha') and VB (legal name 'Vol Beta') ACTIVE, class BANK with net_capital_cents 2000000000."
            - "Security VOL1 registered at prev_settlement_price_cents 5000 with current_volatility_bps 2500 — exactly at the boundary."
            - "VA holds a locked-in matched 1-unit BUY at 1000000 cents, so open risk is 1000000 cents."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Vol Alpha", lei: "LEI-VA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_va: $.data.id }
            - call: "POST /clearing/participants"
