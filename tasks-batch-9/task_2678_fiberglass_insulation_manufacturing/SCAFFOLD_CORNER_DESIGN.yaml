      - name: an_uncertified_sku_cannot_take_orders_or_be_proposed_for_allocation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRODUCT_LINE_NOT_CERTIFIED]
          - validations[priority=82]
          - entities.ProductLine.fields.certification_status
        distinguishing_aspect: "The certification gate sits on the two doors into the allocation subsystem — placing an order and proposing a cycle — but NOT on opening a cycle. A DRAFT SKU can therefore have an AllocationCycle created against it and still be unable to move any glass, which is the only way to see that the check is attached to the propose transition rather than to cycle creation."
