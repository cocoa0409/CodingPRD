# =============================================================================
# Task 1898 — Curriculum Approval Workflow & Catalog Publication
# Faculty senate curriculum committee scenario. Seed tables (§1.0–§1.7).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1898. Curriculum Approval Workflow & Catalog Publication (faculty senate curriculum committee): proposal submission (new course/program change) & routing through committees, prerequisite/corequisite dependency validation, credit-hour & learning-outcome justification, state/accreditor notification threshold, effective term assignment & catalog freeze, cross-listing & shared-resource approval, deactivation/teach-out plan, catalog version publication & archive

domain_name: curriculum-approval-catalog
api_prefix: /curriculum

complexity_profile:
  primary_archetype: workflow_orchestration   # multi-stage committee routing with branching/return loops
  secondary_archetype: graph_constraint       # prerequisite/corequisite DAG with cycle detection
  complexity_layers:
    - optimistic_concurrency                  # OCC on Proposal.version and Term.version
    - cascading_side_effects                  # deactivation & publish cascades span 3+ entities
    - dual_variant_calculation                # provisional vs final substantive-change score; enrollment vs catalog teach-out
    - rate_threshold_triggers                 # accreditor notification threshold at score >= 50
  entity_topology: graph                      # self-referential requisite DAG + many-to-many cross-listings
  state_machine_shape: cyclic                 # Proposal RETURNED -> DEPT_REVIEW resubmission loops; CrossListing diamond with rescind revert
  relationship_patterns:
    - one_to_many                             # Proposal -> DecisionRecord / RequisiteLink; CatalogEdition -> CatalogEntry
    - many_to_many                            # CrossListing pairs two courses; RequisiteLink pairs course->course
    - self_referential                        # RequisiteLink.course_id and .requisite_course_id both reference Course
    - cross_aggregate                         # Proposal gates on Term status; Course gates on TeachOutPlan status
  role_model: approval_chain                  # FacultyProposer -> DepartmentChair -> CurriculumCommittee -> FacultySenate -> Registrar
  consistency_model: immediate                # every mutation visible in its own response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: dept_name, type: string, source: input, description: "Department name (e.g. 'Computer Science')" }
      - { name: subject_codes, type: array, source: input, description: "Subject code strings this department owns (e.g. ['CS','CSE'])" }
      - { name: college, type: string, source: input, description: "College the department belongs to" }

  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: term_code, type: string, source: input, description: "Term code, e.g. '2026FA'" }
      - { name: academic_year, type: string, source: input, description: "Academic year label, e.g. '2026-2027'; links terms to catalog editions" }
      - { name: sequence_index, type: integer, source: input, description: "Monotonic term ordering index; unique across all terms; used for teach-out term arithmetic" }
      - { name: classes_start_date, type: string, source: input, description: "First day of classes, ISO date YYYY-MM-DD; half-open interval start" }
      - { name: classes_end_date, type: string, source: input, description: "Day after last day of classes, ISO date; half-open interval end (exclusive)" }
      - { name: proposal_freeze_at, type: string, source: input, description: "ISO8601 datetime; submissions close and freeze-proposals unlocks at this instant" }
      - { name: catalog_freeze_at, type: string, source: input, description: "ISO8601 datetime; freeze-catalog unlocks at this instant; must be >= proposal_freeze_at" }
      - { name: scheduled_proposal_count, type: integer, source: computed, description: "count of Proposals with effective_term_id == this term and status IN {APPROVED, EFFECTIVE}" }
      - { name: status, type: enum, source: system, description: "OPEN_FOR_PROPOSALS -> PROPOSAL_FROZEN -> CATALOG_FROZEN (terminal)", constraints: "OPEN_FOR_PROPOSALS | PROPOSAL_FROZEN | CATALOG_FROZEN" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: subject_code, type: string, source: input, description: "Subject code, e.g. 'CS'" }
      - { name: course_number, type: string, source: input, description: "Catalog number string, e.g. '101'" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: number, source: input, description: "Credit hours carried by the course" }
      - { name: contact_hours_per_week, type: number, source: input, description: "Weekly scheduled contact hours" }
      - { name: out_of_class_hours_per_week, type: number, source: input, description: "Weekly expected out-of-class student work hours" }
      - { name: learning_outcomes, type: array, source: input, description: "Array of learning-outcome strings; non-empty for active courses" }
      - { name: owning_department_id, type: string, source: input, description: "FK -> Department.id; department that owns this course" }
      - { name: introduced_in_term_id, type: string, source: input, description: "FK -> Term.id; term the course first takes effect" }
      - { name: prerequisite_summary, type: string, source: computed, description: "Comma-joined 'SUBJ NUM' codes of ACTIVE PREREQUISITE RequisiteLinks' requisite courses, ordered by RequisiteLink.created_at ASC; empty string when none" }
      - { name: last_published_edition_id, type: string, source: system, description: "FK -> CatalogEdition.id; nullable; set when a CatalogEntry for this course is PUBLISHED" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DEACTIVATING -> INACTIVE", constraints: "ACTIVE | DEACTIVATING | INACTIVE" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: proposal_type, type: enum, source: input, description: "Kind of curriculum change", constraints: "NEW_COURSE | COURSE_CHANGE | DEACTIVATION" }
      - { name: proposer_id, type: string, source: system, description: "Opaque faculty id copied from X-User-ID at creation; ownership anchor" }
      - { name: proposer_department_id, type: string, source: input, description: "FK -> Department.id; sponsoring department (chair-stage ownership anchor)" }
      - { name: target_course_id, type: string, source: input, description: "FK -> Course.id; required for COURSE_CHANGE and DEACTIVATION, must be null for NEW_COURSE" }
      - { name: proposed_subject_code, type: string, source: input, description: "Proposed subject code; required at submit for NEW_COURSE/COURSE_CHANGE" }
      - { name: proposed_course_number, type: string, source: input, description: "Proposed catalog number; required at submit for NEW_COURSE" }
      - { name: proposed_title, type: string, source: input, description: "Proposed title; required at submit for NEW_COURSE/COURSE_CHANGE" }
      - { name: proposed_credit_hours, type: number, source: input, description: "Proposed credit hours; required at submit for NEW_COURSE/COURSE_CHANGE" }
      - { name: contact_hours_per_week, type: number, source: input, description: "Proposed weekly contact hours; required at submit for NEW_COURSE/COURSE_CHANGE" }
      - { name: out_of_class_hours_per_week, type: number, source: input, description: "Proposed weekly out-of-class hours; required at submit for NEW_COURSE/COURSE_CHANGE" }
      - { name: learning_outcomes, type: array, source: input, description: "Proposed learning outcomes; must be non-empty at submit for NEW_COURSE/COURSE_CHANGE" }
      - { name: justification, type: string, source: input, description: "Free-text academic justification" }
      - { name: proposed_requisites, type: array, source: input, description: "Array of {requisite_course_id, requisite_type} objects; requisite_type IN {PREREQUISITE, COREQUISITE}; default []", default: [] }
      - { name: declared_remaining_cohorts, type: integer, source: input, description: "DEACTIVATION only: number of enrolled cohorts still needing the course; >= 0" }
      - { name: requested_effective_term_id, type: string, source: input, description: "FK -> Term.id; term the proposer asks the change to take effect in" }
      - { name: effective_term_id, type: string, source: system, description: "FK -> Term.id; nullable; assigned by Registrar on APPROVE, changeable via REASSIGN_TERM while APPROVED" }
      - { name: substantive_change_score, type: integer, source: computed, description: "0..100 score from calculations.substantive_change_score; provisional at submit, recomputed final on entering REGISTRAR_REVIEW" }
      - { name: accreditor_notification_required, type: boolean, source: computed, description: "true iff substantive_change_score >= 50 (NOTIFY_THRESHOLD)" }
      - { name: notification_sent_at, type: string, source: system, description: "ISO8601 datetime of accreditor notification; null until NOTIFY decision action" }
      - { name: status, type: enum, source: system, description: "DRAFT -> DEPT_REVIEW -> COMMITTEE_REVIEW -> SENATE_REVIEW -> REGISTRAR_REVIEW -> APPROVED -> EFFECTIVE; RETURNED loops back to DEPT_REVIEW; REJECTED/WITHDRAWN terminal", constraints: "DRAFT | DEPT_REVIEW | COMMITTEE_REVIEW | SENATE_REVIEW | REGISTRAR_REVIEW | RETURNED | APPROVED | EFFECTIVE | REJECTED | WITHDRAWN" }

  - name: DecisionRecord
    parent: Proposal
    common_fields: false   # append-only audit log: id + created_at only
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id; proposal this record belongs to" }
      - { name: action, type: enum, source: system, description: "Recorded action", constraints: "SUBMIT | APPROVE | RETURN | REJECT | WITHDRAW | NOTIFY | REASSIGN_TERM | ACTIVATE" }
      - { name: from_status, type: string, source: system, description: "Proposal.status before the action" }
      - { name: to_status, type: string, source: system, description: "Proposal.status after the action (same as from_status for NOTIFY and REASSIGN_TERM self-loops)" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (opaque audit string)" }
      - { name: rationale, type: string, source: input, description: "Optional free-text rationale supplied with the decision" }
      - { name: recorded_term_id, type: string, source: system, description: "Denormalized audit copy of the term id supplied with APPROVE/REASSIGN_TERM actions; null otherwise (not a live FK)" }

  - name: RequisiteLink
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; the course that carries the requirement; null while its NEW_COURSE proposal is pre-EFFECTIVE" }
      - { name: requisite_course_id, type: string, source: system, description: "FK -> Course.id; the course that must be completed (PREREQUISITE) or co-taken (COREQUISITE)" }
      - { name: requisite_type, type: enum, source: input, description: "PREREQUISITE edges participate in cycle detection; COREQUISITE edges are exempt", constraints: "PREREQUISITE | COREQUISITE" }
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id; proposal whose submit created this link" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> REMOVED", constraints: "PROPOSED | ACTIVE | REMOVED" }

  - name: CrossListing
    parent: null
    common_fields: true
    fields:
      - { name: home_course_id, type: string, source: input, description: "FK -> Course.id; course owned by the requesting (home) department" }
      - { name: partner_course_id, type: string, source: input, description: "FK -> Course.id; course owned by the partner department; must differ from home_course_id and from home course's department" }
      - { name: home_department_id, type: string, source: computed, description: "Denormalized from home course.owning_department_id at creation" }
      - { name: partner_department_id, type: string, source: computed, description: "Denormalized from partner course.owning_department_id at creation" }
      - { name: home_approved_by, type: string, source: system, description: "X-User-ID (Department.id) of the home-side approving chair; null until home approval" }
      - { name: partner_approved_by, type: string, source: system, description: "X-User-ID (Department.id) of the partner-side approving chair; null until partner approval" }
      - { name: status, type: enum, source: system, description: "PENDING -> HOME_APPROVED | PARTNER_APPROVED -> ACTIVE; any side may REJECT; own-side RESCIND reverts to PENDING", constraints: "PENDING | HOME_APPROVED | PARTNER_APPROVED | ACTIVE | REJECTED" }

  - name: TeachOutPlan
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id; the DEACTIVATION proposal this plan serves (1:1)" }
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; denormalized from proposal.target_course_id" }
      - { name: enrolled_cohort_count, type: integer, source: input, description: "Number of enrolled cohorts; must equal proposal.declared_remaining_cohorts; >= 0" }
      - { name: cohort_sizes, type: array, source: input, description: "Array of integers, one enrollment size per cohort; length must equal enrolled_cohort_count; each >= 1" }
      - { name: last_enrolled_term_id, type: string, source: input, description: "FK -> Term.id; last term in which any cohort is enrolled" }
      - { name: provisional_completion_sequence, type: integer, source: computed, description: "ENROLLMENT_DRIVEN estimate at creation: last_enrolled_term.sequence_index + ceil(enrolled_cohort_count / COHORTS_DRAINED_PER_TERM)" }
      - { name: committed_completion_sequence, type: integer, source: computed, description: "CATALOG_DRIVEN value at commit: proposal.requested_effective_term.sequence_index + CATALOG_TEACH_OUT_TERMS; null until COMMITTED" }
      - { name: resource_cost_cents, type: integer, source: computed, description: "Teach-out sectioning cost computed at commit via calculations.teach_out_resource_cost_cents; null until COMMITTED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> COMMITTED -> IN_PROGRESS -> COMPLETE", constraints: "DRAFT | COMMITTED | IN_PROGRESS | COMPLETE" }

  - name: CatalogEdition
    parent: null
    common_fields: true
    fields:
      - { name: edition_label, type: string, source: input, description: "Human label, e.g. '2026-2027 Catalog'" }
      - { name: academic_year, type: string, source: input, description: "Academic year label; unique among editions whose status != ARCHIVED" }
      - { name: year_start_date, type: string, source: input, description: "First covered day, ISO date; CLOSED interval start (inclusive)" }
      - { name: year_end_date, type: string, source: input, description: "Last covered day, ISO date; CLOSED interval end (inclusive)" }
      - { name: included_entry_count, type: integer, source: computed, description: "Count of CatalogEntry rows in this edition with status INCLUDED; set at freeze sweep, maintained on exclusion cascades" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FROZEN -> PUBLISHED -> ARCHIVED", constraints: "DRAFT | FROZEN | PUBLISHED | ARCHIVED" }

  - name: CatalogEntry
    parent: CatalogEdition
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: system, description: "FK -> CatalogEdition.id; edition this entry belongs to" }
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; course snapshotted by this entry" }
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id; proposal whose activation staged this entry (audit reference)" }
      - { name: subject_code, type: string, source: system, description: "Snapshot of course subject_code at activation" }
      - { name: course_number, type: string, source: system, description: "Snapshot of course number at activation" }
      - { name: title, type: string, source: system, description: "Snapshot of course title at activation" }
      - { name: credit_hours, type: number, source: system, description: "Snapshot of course credit_hours at activation" }
      - { name: status, type: enum, source: system, description: "STAGED -> INCLUDED -> PUBLISHED -> ARCHIVED; EXCLUDED terminal branch from STAGED or INCLUDED", constraints: "STAGED | INCLUDED | EXCLUDED | PUBLISHED | ARCHIVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Term
    initial_state: OPEN_FOR_PROPOSALS
    terminal_states: [CATALOG_FROZEN]
    transitions:
      - from: OPEN_FOR_PROPOSALS
        to: PROPOSAL_FROZEN
        trigger: "POST /curriculum/terms/{id}/freeze-proposals"
        actor: Registrar
        preconditions:
          - "logical clock now >= term.proposal_freeze_at, else ERR_FREEZE_DATE_NOT_REACHED"
        side_effects:
          - "increments Term.version by 1"
      - from: PROPOSAL_FROZEN
        to: CATALOG_FROZEN
        trigger: "POST /curriculum/terms/{id}/freeze-catalog"
        actor: Registrar
        preconditions:
          - "logical clock now >= term.catalog_freeze_at, else ERR_FREEZE_DATE_NOT_REACHED"
        side_effects:
          - "increments Term.version by 1"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: DEPT_REVIEW
        trigger: "POST /curriculum/proposals/{id}/submit"
        actor: FacultyProposer
        preconditions:
          - "actor owns proposal (X-User-ID == proposer_id), else ERR_NOT_RESOURCE_OWNER"
          - "requested_effective_term.status == OPEN_FOR_PROPOSALS and logical clock now < term.proposal_freeze_at, else ERR_PROPOSAL_WINDOW_CLOSED"
          - "type-specific payload complete (see §1.4 priority 4), else ERR_VALIDATION"
          - "for COURSE_CHANGE/DEACTIVATION: target_course.status == ACTIVE, else ERR_INVALID_STATE"
          - "learning_outcomes non-empty for NEW_COURSE/COURSE_CHANGE, else ERR_LEARNING_OUTCOMES_REQUIRED"
          - "for NEW_COURSE: proposed (subject_code, course_number) not held by another Course with status IN {ACTIVE, DEACTIVATING} and not held by another Proposal with status IN {DEPT_REVIEW, COMMITTEE_REVIEW, SENATE_REVIEW, REGISTRAR_REVIEW, APPROVED}, else ERR_COURSE_NUMBER_HELD"
          - "every proposed_requisites entry: requisite_course_id exists, references a Course with status ACTIVE (else ERR_REQUISITE_TARGET_INACTIVE), != target_course_id (else ERR_SELF_REQUISITE)"
          - "credit-hour workload check for NEW_COURSE/COURSE_CHANGE (calculations.credit_hour_workload_check), else ERR_CREDIT_HOUR_MISMATCH"
        side_effects:
          - "creates one RequisiteLink (status PROPOSED) per proposed_requisites entry, in payload order (created_at ASC preserves it)"
          - "computes calculations.substantive_change_score PROVISIONAL variant; stores substantive_change_score and accreditor_notification_required"
          - "for NEW_COURSE: places a hold on (proposed_subject_code, proposed_course_number)"
          - "appends DecisionRecord(action=SUBMIT, from_status=DRAFT, to_status=DEPT_REVIEW)"
          - "increments Proposal.version by 1"
      - from: RETURNED
        to: DEPT_REVIEW
        trigger: "POST /curriculum/proposals/{id}/submit"
        actor: FacultyProposer
        preconditions:
          - "identical to DRAFT -> DEPT_REVIEW (all checks re-run on every resubmission)"
        side_effects:
          - "identical to DRAFT -> DEPT_REVIEW (prior PROPOSED links were REMOVED at RETURN; fresh links are created)"
      - from: DEPT_REVIEW
        to: COMMITTEE_REVIEW
        trigger: "POST /curriculum/proposals/{id}/decisions with action=APPROVE"
        actor: DepartmentChair
        preconditions:
          - "department match: acting chair's X-User-ID == proposal.proposer_department_id, else ERR_NOT_RESOURCE_OWNER"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "appends DecisionRecord(action=APPROVE, from_status=DEPT_REVIEW, to_status=COMMITTEE_REVIEW)"
          - "increments Proposal.version by 1"
      - from: COMMITTEE_REVIEW
        to: SENATE_REVIEW
        trigger: "POST /curriculum/proposals/{id}/decisions with action=APPROVE"
        actor: CurriculumCommittee
        preconditions:
          - "stage-role match: X-User-Role == CurriculumCommittee, else ERR_FORBIDDEN"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "appends DecisionRecord(action=APPROVE, from_status=COMMITTEE_REVIEW, to_status=SENATE_REVIEW)"
          - "increments Proposal.version by 1"
      - from: SENATE_REVIEW
        to: REGISTRAR_REVIEW
        trigger: "POST /curriculum/proposals/{id}/decisions with action=APPROVE"
        actor: FacultySenate
        preconditions:
          - "stage-role match: X-User-Role == FacultySenate, else ERR_FORBIDDEN"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "recomputes calculations.substantive_change_score FINAL variant; overwrites substantive_change_score and accreditor_notification_required"
          - "appends DecisionRecord(action=APPROVE, from_status=SENATE_REVIEW, to_status=REGISTRAR_REVIEW)"
          - "increments Proposal.version by 1"
      - from: REGISTRAR_REVIEW
        to: APPROVED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=APPROVE and effective_term_id"
        actor: Registrar
        preconditions:
          - "stage-role match: X-User-Role == Registrar, else ERR_FORBIDDEN"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
          - "payload effective_term_id supplied and references an existing Term, else ERR_VALIDATION / ERR_NOT_FOUND"
          - "if accreditor_notification_required == true then notification_sent_at must be non-null, else ERR_ACCREDITOR_NOTIFICATION_PENDING"
          - "if proposal_type == DEACTIVATION and declared_remaining_cohorts > 0 then a TeachOutPlan with proposal_id == this proposal and status IN {COMMITTED, IN_PROGRESS, COMPLETE} must exist, else ERR_TEACH_OUT_NOT_COMMITTED"
        side_effects:
          - "sets proposal.effective_term_id = payload effective_term_id"
          - "increments effective_term.scheduled_proposal_count by 1"
          - "appends DecisionRecord(action=APPROVE, from_status=REGISTRAR_REVIEW, to_status=APPROVED, recorded_term_id=effective_term_id)"
          - "increments Proposal.version by 1"
      - from: DEPT_REVIEW
        to: RETURNED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=RETURN"
        actor: DepartmentChair
        preconditions:
          - "department match (chair of proposer_department_id), else ERR_NOT_RESOURCE_OWNER"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=RETURN, from_status=DEPT_REVIEW, to_status=RETURNED)"
          - "increments Proposal.version by 1"
      - from: COMMITTEE_REVIEW
        to: RETURNED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=RETURN"
        actor: CurriculumCommittee
        preconditions:
          - "stage-role match, else ERR_FORBIDDEN"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=RETURN, from_status=COMMITTEE_REVIEW, to_status=RETURNED)"
          - "increments Proposal.version by 1"
      - from: SENATE_REVIEW
        to: RETURNED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=RETURN"
        actor: FacultySenate
        preconditions:
          - "stage-role match, else ERR_FORBIDDEN"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=RETURN, from_status=SENATE_REVIEW, to_status=RETURNED)"
          - "increments Proposal.version by 1"
      - from: REGISTRAR_REVIEW
        to: RETURNED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=RETURN"
        actor: Registrar
        preconditions:
          - "stage-role match, else ERR_FORBIDDEN"
          - "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=RETURN, from_status=REGISTRAR_REVIEW, to_status=RETURNED)"
          - "increments Proposal.version by 1"
      - from: DEPT_REVIEW
        to: REJECTED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=REJECT"
        actor: DepartmentChair
        preconditions: ["stage-role match, else ERR_FORBIDDEN", "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=REJECT, from_status=DEPT_REVIEW, to_status=REJECTED)"
          - "increments Proposal.version by 1"
      - from: COMMITTEE_REVIEW
        to: REJECTED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=REJECT"
        actor: CurriculumCommittee
        preconditions: ["stage-role match, else ERR_FORBIDDEN", "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=REJECT, from_status=COMMITTEE_REVIEW, to_status=REJECTED)"
          - "increments Proposal.version by 1"
      - from: SENATE_REVIEW
        to: REJECTED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=REJECT"
        actor: FacultySenate
        preconditions: ["stage-role match, else ERR_FORBIDDEN", "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=REJECT, from_status=SENATE_REVIEW, to_status=REJECTED)"
          - "increments Proposal.version by 1"
      - from: REGISTRAR_REVIEW
        to: REJECTED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=REJECT"
        actor: Registrar
        preconditions: ["stage-role match, else ERR_FORBIDDEN", "X-User-ID != proposal.proposer_id, else ERR_SELF_APPROVAL_FORBIDDEN"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=REJECT, from_status=REGISTRAR_REVIEW, to_status=REJECTED)"
          - "increments Proposal.version by 1"
      - from: REGISTRAR_REVIEW
        to: REGISTRAR_REVIEW
        trigger: "POST /curriculum/proposals/{id}/decisions with action=NOTIFY"
        actor: Registrar
        preconditions:
          - "stage-role match (Registrar), else ERR_FORBIDDEN"
          - "accreditor_notification_required == true and notification_sent_at == null, else ERR_INVALID_STATE"
        side_effects:
          - "sets notification_sent_at = logical clock now"
          - "appends DecisionRecord(action=NOTIFY, from_status=REGISTRAR_REVIEW, to_status=REGISTRAR_REVIEW)"
          - "increments Proposal.version by 1"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /curriculum/proposals/{id}/decisions with action=REASSIGN_TERM and effective_term_id"
        actor: Registrar
        preconditions:
          - "X-User-Role == Registrar, else ERR_FORBIDDEN"
          - "payload effective_term_id references an existing Term different from the current effective_term_id, else ERR_VALIDATION"
        side_effects:
          - "decrements old effective_term.scheduled_proposal_count by 1; increments new effective_term.scheduled_proposal_count by 1"
          - "sets proposal.effective_term_id = payload effective_term_id"
          - "appends DecisionRecord(action=REASSIGN_TERM, from_status=APPROVED, to_status=APPROVED, recorded_term_id=effective_term_id)"
          - "increments Proposal.version by 1"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /curriculum/proposals/{id}/activate"
        actor: Registrar
        preconditions:
          - "proposal.effective_term.status IN {PROPOSAL_FROZEN, CATALOG_FROZEN}, else ERR_TERM_NOT_LOCKED"
          - "for NEW_COURSE: (proposed_subject_code, proposed_course_number) still unheld by any Course with status IN {ACTIVE, DEACTIVATING}, else ERR_COURSE_NUMBER_HELD"
          - "requisite activation must not close a PREREQUISITE cycle (calculations.requisite_cycle_check), else ERR_REQUISITE_CYCLE"
        side_effects:
          - "NEW_COURSE: creates Course(status=ACTIVE, introduced_in_term_id=effective_term_id) from proposed_* payload; sets its RequisiteLinks' course_id to the new course"
          - "COURSE_CHANGE: overwrites target course's title/credit_hours/contact_hours_per_week/out_of_class_hours_per_week/learning_outcomes from proposed_* payload; increments target Course.version by 1"
          - "activates this proposal's RequisiteLinks PROPOSED -> ACTIVE in created_at ASC order, running calculations.requisite_cycle_check per link"
          - "recomputes prerequisite_summary on every course gaining an ACTIVE link"
          - "DEACTIVATION: target Course ACTIVE -> DEACTIVATING; its TeachOutPlan COMMITTED -> IN_PROGRESS; cascade: every RequisiteLink with requisite_course_id == target and status ACTIVE -> REMOVED, and each such removal recomputes prerequisite_summary and increments version on the dependent Course (link.course_id); every RequisiteLink with course_id == target and status ACTIVE -> REMOVED; every CatalogEntry with course_id == target and status STAGED -> EXCLUDED"
          - "stages a CatalogEntry (status STAGED, snapshot fields copied) in the edition selected by: academic_year == effective_term.academic_year AND status == DRAFT (at most one such edition by ERR_EDITION_WINDOW_CONFLICT uniqueness); if none exists, no entry is created — except DEACTIVATION proposals, which never stage an entry"
          - "appends DecisionRecord(action=ACTIVATE, from_status=APPROVED, to_status=EFFECTIVE)"
          - "increments Proposal.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["appends DecisionRecord(action=WITHDRAW)", "increments Proposal.version by 1"]
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["for NEW_COURSE: releases number hold (none held while RETURNED — no-op)", "appends DecisionRecord(action=WITHDRAW)", "increments Proposal.version by 1"]
      - from: DEPT_REVIEW
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=WITHDRAW)"
          - "increments Proposal.version by 1"
      - from: COMMITTEE_REVIEW
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=WITHDRAW)"
          - "increments Proposal.version by 1"
      - from: SENATE_REVIEW
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=WITHDRAW)"
          - "increments Proposal.version by 1"
      - from: REGISTRAR_REVIEW
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects:
          - "all RequisiteLinks of this proposal with status PROPOSED -> REMOVED"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=WITHDRAW)"
          - "increments Proposal.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /curriculum/proposals/{id}/withdraw"
        actor: FacultyProposer
        preconditions: ["actor owns proposal, else ERR_NOT_RESOURCE_OWNER"]
        side_effects:
          - "decrements effective_term.scheduled_proposal_count by 1"
          - "for NEW_COURSE: releases the (subject_code, course_number) hold"
          - "appends DecisionRecord(action=WITHDRAW)"
          - "increments Proposal.version by 1"

  - entity: Course
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: DEACTIVATING
        trigger: "POST /curriculum/proposals/{id}/activate on a DEACTIVATION proposal"
        actor: Registrar
        preconditions:
          - "proposal status APPROVED with effective_term locked (see Proposal APPROVED -> EFFECTIVE)"
        side_effects:
          - "cascade: RequisiteLinks with requisite_course_id == this course and status ACTIVE -> REMOVED; each removal recomputes prerequisite_summary and increments version on the dependent Course (link.course_id)"
          - "cascade: RequisiteLinks with course_id == this course and status ACTIVE -> REMOVED"
          - "cascade: CatalogEntries with course_id == this course and status STAGED -> EXCLUDED"
          - "linked TeachOutPlan COMMITTED -> IN_PROGRESS"
          - "increments Course.version by 1"
      - from: DEACTIVATING
        to: INACTIVE
        trigger: "POST /curriculum/teach-out-plans/{id}/complete on the linked plan"
        actor: Registrar
        preconditions:
          - "linked TeachOutPlan.status == IN_PROGRESS (the transition that completes the plan is the trigger), else ERR_INVALID_STATE"
        side_effects:
          - "cascade: CatalogEntries with course_id == this course and status INCLUDED in editions with status IN {DRAFT, FROZEN} -> EXCLUDED; recompute included_entry_count on affected editions"
          - "increments Course.version by 1"

  - entity: RequisiteLink
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /curriculum/proposals/{id}/activate on the owning proposal"
        actor: Registrar
        preconditions:
          - "calculations.requisite_cycle_check passes for this link, else ERR_REQUISITE_CYCLE (aborts the whole activate)"
        side_effects:
          - "recomputes prerequisite_summary on Course(link.course_id); increments that Course.version by 1"
      - from: PROPOSED
        to: REMOVED
        trigger: "owning proposal transitions to RETURNED / REJECTED / WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REMOVED
        trigger: "deactivation of the course at either end (Course ACTIVE -> DEACTIVATING cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "when removed because requisite_course_id deactivated: recomputes prerequisite_summary and increments version on Course(link.course_id)"

  - entity: CrossListing
    initial_state: PENDING
    terminal_states: [ACTIVE, REJECTED]
    transitions:
      - from: PENDING
        to: HOME_APPROVED
        trigger: "POST /curriculum/cross-listings/{id}/approve by chair whose X-User-ID == home_department_id"
        actor: DepartmentChair
        preconditions: ["side derivation: X-User-ID == home_department_id, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["sets home_approved_by = X-User-ID", "increments CrossListing.version by 1"]
      - from: PENDING
        to: PARTNER_APPROVED
        trigger: "POST /curriculum/cross-listings/{id}/approve by chair whose X-User-ID == partner_department_id"
        actor: DepartmentChair
        preconditions: ["side derivation: X-User-ID == partner_department_id, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["sets partner_approved_by = X-User-ID", "increments CrossListing.version by 1"]
      - from: HOME_APPROVED
        to: ACTIVE
        trigger: "POST /curriculum/cross-listings/{id}/approve by partner-side chair"
        actor: DepartmentChair
        preconditions:
          - "X-User-ID == partner_department_id, else ERR_NOT_RESOURCE_OWNER"
          - "both courses still status ACTIVE, else ERR_INVALID_STATE"
        side_effects: ["sets partner_approved_by = X-User-ID", "increments CrossListing.version by 1"]
      - from: PARTNER_APPROVED
        to: ACTIVE
        trigger: "POST /curriculum/cross-listings/{id}/approve by home-side chair"
        actor: DepartmentChair
        preconditions:
          - "X-User-ID == home_department_id, else ERR_NOT_RESOURCE_OWNER"
          - "both courses still status ACTIVE, else ERR_INVALID_STATE"
        side_effects: ["sets home_approved_by = X-User-ID", "increments CrossListing.version by 1"]
      - from: HOME_APPROVED
        to: PENDING
        trigger: "POST /curriculum/cross-listings/{id}/rescind by home-side chair"
        actor: DepartmentChair
        preconditions: ["X-User-ID == home_department_id, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["clears home_approved_by to null", "increments CrossListing.version by 1"]
      - from: PARTNER_APPROVED
        to: PENDING
        trigger: "POST /curriculum/cross-listings/{id}/rescind by partner-side chair"
        actor: DepartmentChair
        preconditions: ["X-User-ID == partner_department_id, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["clears partner_approved_by to null", "increments CrossListing.version by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /curriculum/cross-listings/{id}/reject by either side's chair"
        actor: DepartmentChair
        preconditions: ["X-User-ID IN {home_department_id, partner_department_id}, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["increments CrossListing.version by 1"]
      - from: HOME_APPROVED
        to: REJECTED
        trigger: "POST /curriculum/cross-listings/{id}/reject by either side's chair"
        actor: DepartmentChair
        preconditions: ["X-User-ID IN {home_department_id, partner_department_id}, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["increments CrossListing.version by 1"]
      - from: PARTNER_APPROVED
        to: REJECTED
        trigger: "POST /curriculum/cross-listings/{id}/reject by either side's chair"
        actor: DepartmentChair
        preconditions: ["X-User-ID IN {home_department_id, partner_department_id}, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["increments CrossListing.version by 1"]

  - entity: TeachOutPlan
    initial_state: DRAFT
    terminal_states: [COMPLETE]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /curriculum/teach-out-plans/{id}/commit"
        actor: DepartmentChair
        preconditions:
          - "acting chair's X-User-ID == proposal.proposer_department_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "computes committed_completion_sequence via calculations.teach_out_completion_terms CATALOG_DRIVEN variant"
          - "computes resource_cost_cents via calculations.teach_out_resource_cost_cents"
          - "increments TeachOutPlan.version by 1"
      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "system: owning DEACTIVATION proposal reaches EFFECTIVE (Proposal APPROVED -> EFFECTIVE cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments TeachOutPlan.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /curriculum/teach-out-plans/{id}/complete"
        actor: Registrar
        preconditions: []
        side_effects:
          - "cascade: linked Course DEACTIVATING -> INACTIVE (with its own CatalogEntry exclusion cascade)"
          - "increments TeachOutPlan.version by 1"

  - entity: CatalogEdition
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: FROZEN
        trigger: "POST /curriculum/editions/{id}/freeze"
        actor: Registrar
        preconditions:
          - "every Term with academic_year == edition.academic_year has status == CATALOG_FROZEN, else ERR_TERM_NOT_LOCKED"
        side_effects:
          - "runs calculations.edition_freeze_snapshot: each STAGED entry whose course status IN {ACTIVE, DEACTIVATING} -> INCLUDED; course status INACTIVE -> EXCLUDED"
          - "sets included_entry_count = count of INCLUDED entries in this edition"
          - "increments CatalogEdition.version by 1"
      - from: FROZEN
        to: PUBLISHED
        trigger: "POST /curriculum/editions/{id}/publish"
        actor: Registrar
        preconditions: []
        side_effects:
          - "cascade hop 1: every INCLUDED CatalogEntry in this edition -> PUBLISHED"
          - "cascade hop 2: each newly PUBLISHED entry sets Course.last_published_edition_id = this edition id and increments that Course.version by 1"
          - "cascade hop 1 (archive arm): the previously PUBLISHED edition (if any) -> ARCHIVED"
          - "cascade hop 2 (archive arm): every CatalogEntry in that archived edition with status PUBLISHED -> ARCHIVED"
          - "increments CatalogEdition.version by 1"

  - entity: CatalogEntry
    initial_state: STAGED
    terminal_states: [EXCLUDED, ARCHIVED]
    transitions:
      - from: STAGED
        to: INCLUDED
        trigger: "system: edition freeze sweep (CatalogEdition DRAFT -> FROZEN)"
        actor: system
        preconditions: ["entry.course.status IN {ACTIVE, DEACTIVATING} at sweep time"]
        side_effects: ["increments CatalogEntry.version by 1"]
      - from: STAGED
        to: EXCLUDED
        trigger: "system: course deactivation cascade (Proposal activate) or edition freeze sweep finds course INACTIVE"
        actor: system
        preconditions: []
        side_effects: ["increments CatalogEntry.version by 1"]
      - from: INCLUDED
        to: EXCLUDED
        trigger: "system: course reaches INACTIVE while edition status IN {DRAFT, FROZEN}"
        actor: system
        preconditions: []
        side_effects: ["recomputes edition.included_entry_count", "increments CatalogEntry.version by 1"]
      - from: INCLUDED
        to: PUBLISHED
        trigger: "system: edition publish (CatalogEdition FROZEN -> PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: ["sets Course.last_published_edition_id = entry.edition_id; increments that Course.version by 1", "increments CatalogEntry.version by 1"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "system: a newer edition is published (CatalogEdition FROZEN -> PUBLISHED archive arm)"
        actor: system
        preconditions: []
        side_effects: ["increments CatalogEntry.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: proposal-update-stale-version
    parent_entity: Proposal
    write_endpoint: "PUT /curriculum/proposals/{id}"
    occ_field: "expected_proposal_version"
    description: |
      Updating a DRAFT or RETURNED proposal whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just edited the proposal (advancing its version) and
      the current writer's payload is therefore based on a stale document.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: term-update-stale-version
    parent_entity: Term
    write_endpoint: "PATCH /curriculum/terms/{id}"
    occ_field: "expected_term_version"
    description: |
      Editing a term's dates whose version has advanced since the client last
      observed it is rejected. This captures the case where another registrar
      writer has just edited the term (advancing its version) and the current
      writer's edit is therefore based on a stale record.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: substantive_change_score
    trigger: "PROVISIONAL variant: on Proposal submit (DRAFT|RETURNED -> DEPT_REVIEW). FINAL variant: on the SENATE_REVIEW -> REGISTRAR_REVIEW transition (overwrites the stored fields)."
    algorithm: weighted_scoring
    formula: |
      score = BASE[proposal_type]
      if proposal_type == COURSE_CHANGE
          and abs(proposed_credit_hours - target_course.credit_hours) / target_course.credit_hours >= CREDIT_DELTA_RATIO:
          score += CREDIT_DELTA_FACTOR
      score += min(PREREQ_PER_LINK * count(payload proposed_requisites with requisite_type == PREREQUISITE
                                           and no ACTIVE RequisiteLink already links target course -> that requisite),
                   PREREQ_FACTOR_CAP)                      # counted in BOTH variants (payload-known)
      if variant == FINAL:
          if exists CrossListing with {home_course_id == target_course_id or partner_course_id == target_course_id}
             and status IN {PENDING, HOME_APPROVED, PARTNER_APPROVED, ACTIVE}:
              score += CROSS_LISTING_FACTOR
          if proposal_type == DEACTIVATION and declared_remaining_cohorts > 0:
              score += TEACH_OUT_FACTOR
      accreditor_notification_required = (score >= NOTIFY_THRESHOLD)
    input_set: "The proposal's own payload plus, for the FINAL variant only, live CrossListing rows touching target_course_id and declared_remaining_cohorts. Links counted in the prereq factor exclude any already-ACTIVE RequisiteLink from target course to the same requisite course."
    constants:
      BASE_NEW_COURSE: 20
      BASE_COURSE_CHANGE: 10
      BASE_DEACTIVATION: 30
      CREDIT_DELTA_FACTOR: 25
      CREDIT_DELTA_RATIO: 0.25
      PREREQ_PER_LINK: 10
      PREREQ_FACTOR_CAP: 20
      CROSS_LISTING_FACTOR: 15
      TEACH_OUT_FACTOR: 20
      NOTIFY_THRESHOLD: 50
    precision: "integer arithmetic; no rounding"
    variants:
      - name: PROVISIONAL
        when: "computed and stored at proposal submit (DRAFT|RETURNED -> DEPT_REVIEW)"
        difference: "excludes CROSS_LISTING_FACTOR and TEACH_OUT_FACTOR (both require post-submission state); counts only payload-known factors"
      - name: FINAL
        when: "recomputed on entering REGISTRAR_REVIEW (SENATE_REVIEW -> REGISTRAR_REVIEW transition)"
        difference: "adds CROSS_LISTING_FACTOR (live cross-listing rows) and TEACH_OUT_FACTOR (declared_remaining_cohorts > 0); same proposal can score lower provisionally and cross NOTIFY_THRESHOLD only at FINAL"

  - name: teach_out_completion_terms
    trigger: "ENROLLMENT_DRIVEN variant: on TeachOutPlan creation (sets provisional_completion_sequence). CATALOG_DRIVEN variant: on TeachOutPlan commit (sets committed_completion_sequence)."
    algorithm: forward_looking
    formula: |
      ENROLLMENT_DRIVEN:
        provisional_completion_sequence =
            last_enrolled_term.sequence_index + ceil(enrolled_cohort_count / COHORTS_DRAINED_PER_TERM)
      CATALOG_DRIVEN:
        committed_completion_sequence =
            proposal.requested_effective_term.sequence_index + CATALOG_TEACH_OUT_TERMS
    input_set: "ENROLLMENT_DRIVEN uses plan inputs (last_enrolled_term_id, enrolled_cohort_count). CATALOG_DRIVEN uses the owning proposal's requested_effective_term_id; ignores enrollment."
    constants:
      COHORTS_DRAINED_PER_TERM: 2
      CATALOG_TEACH_OUT_TERMS: 4
    precision: "integer term indices; ceil is exact integer division rounding up"
    variants:
      - name: ENROLLMENT_DRIVEN
        when: "at plan creation; stored as provisional_completion_sequence"
        difference: "derives completion from enrollment drain rate; for 3 cohorts with last_enrolled sequence 3 yields 5"
      - name: CATALOG_DRIVEN
        when: "at plan commit; stored as committed_completion_sequence"
        difference: "derives completion from catalog policy (requested effective term + 4); for the same plan with requested effective sequence 4 yields 8 — different answer for identical plan inputs"

  - name: teach_out_resource_cost_cents
    trigger: "on TeachOutPlan commit (DRAFT -> COMMITTED); stored as resource_cost_cents"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round per cohort first, then sum sections.
      sections_total = sum over each cohort_size in cohort_sizes of ceil(cohort_size / SECTION_CAPACITY)
      resource_cost_cents = sections_total * SECTION_COST_CENTS
      # Deliberately different from ceil(sum(cohort_sizes) / SECTION_CAPACITY) * SECTION_COST_CENTS:
      # sizes [16, 9] -> per-cohort: ceil(16/15)=2 + ceil(9/15)=1 = 3 sections -> 1,200,000 cents
      #              -> sum-first : ceil(25/15)=2 sections                ->   800,000 cents
    input_set: "TeachOutPlan.cohort_sizes (all cohorts, no status filter — every cohort runs to completion)"
    constants:
      SECTION_CAPACITY: 15
      SECTION_COST_CENTS: 400000
    precision: "integer cents; ceil applied per cohort BEFORE summation (order pinned, non-interchangeable)"

  - name: requisite_cycle_check
    trigger: "during POST /curriculum/proposals/{id}/activate, once per PROPOSED RequisiteLink of the proposal, in RequisiteLink.created_at ASC order, before flipping that link to ACTIVE"
    algorithm: topological
    formula: |
      graph G = all RequisiteLinks with status == ACTIVE and requisite_type == PREREQUISITE
              ∪ all links of this proposal already flipped to ACTIVE earlier in this batch
      for candidate link L (course_id = X, requisite_course_id = R):
          if R is null (NEW_COURSE target not yet materialized is impossible here — course is created first): skip
          if X is null: X = the course just created by this activation
          cycle iff X is reachable from R following G edges (course_id -> requisite_course_id)
      COREQUISITE edges never participate (neither as candidate edge nor as traversal edge)
    input_set: "RequisiteLink rows with status ACTIVE and requisite_type PREREQUISITE, plus this proposal's already-activated links; COREQUISITE rows excluded from the graph"
    constants: {}
    precision: "exact graph reachability; deterministic batch order by created_at ASC"

  - name: credit_hour_workload_check
    trigger: "on Proposal submit (DRAFT|RETURNED -> DEPT_REVIEW) for NEW_COURSE and COURSE_CHANGE"
    algorithm: threshold
    formula: |
      computed_credits = round_half_up((contact_hours_per_week + out_of_class_hours_per_week) * WEEKS_PER_TERM / 45, 1)
      pass iff abs(proposed_credit_hours - computed_credits) <= CREDIT_TOLERANCE
    input_set: "the proposal payload's contact_hours_per_week, out_of_class_hours_per_week, proposed_credit_hours"
    constants:
      WEEKS_PER_TERM: 15
      CARNEGIE_HOURS_PER_CREDIT: 45
      CREDIT_TOLERANCE: 0.5
    precision: "1 decimal place, round_half_up; comparison is <= (tolerance inclusive)"

  - name: edition_freeze_snapshot
    trigger: "on CatalogEdition freeze (DRAFT -> FROZEN)"
    algorithm: aggregation
    formula: |
      for each CatalogEntry in this edition with status == STAGED, processed in created_at ASC order:
          if entry.course.status IN {ACTIVE, DEACTIVATING}: entry -> INCLUDED
          if entry.course.status == INACTIVE: entry -> EXCLUDED
      included_entry_count = count of entries with status == INCLUDED in this edition
    input_set: "CatalogEntry rows of this edition with status STAGED only (EXCLUDED/PUBLISHED/ARCHIVED rows untouched)"
    constants: {}
    precision: "integer count; processing order created_at ASC (order-insensitive result, pinned for determinism)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the five declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles array", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-template ids resolve to existing resources, validated left-to-right along the path", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with templated path segments" }
  - { priority: 4, category: existence, check: "request body well-formed: required fields present, types match, enum members valid, unknown fields rejected; body-referenced FK ids (target_course_id, requested_effective_term_id, requisite_course_id, owning_department_id, introduced_in_term_id, last_enrolled_term_id, home_course_id, partner_course_id, effective_term_id) exist; type-specific submit completeness (NEW_COURSE: proposed_subject_code/proposed_course_number/proposed_title/proposed_credit_hours/contact_hours_per_week/out_of_class_hours_per_week; COURSE_CHANGE: target_course_id + same proposed_* set; DEACTIVATION: target_course_id + declared_remaining_cohorts >= 0); cohort_sizes length == enrolled_cohort_count and every size >= 1; classes_end_date > classes_start_date; proposal_freeze_at <= catalog_freeze_at; year_end_date >= year_start_date; REASSIGN_TERM effective_term_id differs from current; teach-out plan enrolled_cohort_count == proposal.declared_remaining_cohorts", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST/PUT/PATCH endpoints" }
  - { priority: 5, category: auth, check: "resource-level ownership: FacultyProposer acts only on proposals with proposer_id == X-User-ID (edit/submit/withdraw, teach-out create); DEPT_REVIEW decisions require acting chair X-User-ID == proposal.proposer_department_id; teach-out commit requires chair of proposer_department_id; cross-listing create requires chair of home course's owning department; cross-listing approve/reject/rescind derive the acting side from X-User-ID matching home_department_id or partner_department_id", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "PUT /curriculum/proposals/{id}; POST /curriculum/proposals/{id}/submit; POST /curriculum/proposals/{id}/withdraw; POST /curriculum/proposals/{id}/teach-out-plan; POST /curriculum/proposals/{id}/decisions (DEPT_REVIEW stage); POST /curriculum/teach-out-plans/{id}/commit; POST /curriculum/cross-listings; POST /curriculum/cross-listings/{id}/approve; POST /curriculum/cross-listings/{id}/reject; POST /curriculum/cross-listings/{id}/rescind" }
  - { priority: 6, category: state, check: "target resource is in a state from which the requested §1.2 transition exists (wrong-from-state, terminal-state lockdown, repeated NOTIFY after sent, approve of a cross-listing whose courses are no longer both ACTIVE, teach-out complete before IN_PROGRESS)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "stage-role class match on POST decisions: CurriculumCommittee role only advances COMMITTEE_REVIEW, FacultySenate only SENATE_REVIEW, Registrar only REGISTRAR_REVIEW; NOTIFY only valid in REGISTRAR_REVIEW; REASSIGN_TERM only valid in APPROVED; a role listed on the endpoint but mismatched to the current stage fails here", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /curriculum/proposals/{id}/decisions" }
  - { priority: 8, category: business_safety, check: "segregation of duties: on POST decisions with action APPROVE/RETURN/REJECT, X-User-ID != proposal.proposer_id (raw string equality)", error_id: ERR_SELF_APPROVAL_FORBIDDEN, http_status: 403, applies_to: "POST /curriculum/proposals/{id}/decisions" }
  - { priority: 9, category: business_safety, check: "Registrar APPROVE requires notification_sent_at non-null whenever accreditor_notification_required == true", error_id: ERR_ACCREDITOR_NOTIFICATION_PENDING, http_status: 409, applies_to: "POST /curriculum/proposals/{id}/decisions (action=APPROVE, Registrar)" }
  - { priority: 10, category: business_temporal, check: "submit requires requested_effective_term.status == OPEN_FOR_PROPOSALS and logical clock now < term.proposal_freeze_at", error_id: ERR_PROPOSAL_WINDOW_CLOSED, http_status: 409, applies_to: "POST /curriculum/proposals/{id}/submit" }
  - { priority: 11, category: business_temporal, check: "freeze-proposals requires now >= proposal_freeze_at; freeze-catalog requires now >= catalog_freeze_at", error_id: ERR_FREEZE_DATE_NOT_REACHED, http_status: 409, applies_to: "POST /curriculum/terms/{id}/freeze-proposals; POST /curriculum/terms/{id}/freeze-catalog" }
  - { priority: 12, category: business_temporal, check: "proposal activate requires effective_term.status IN {PROPOSAL_FROZEN, CATALOG_FROZEN}; edition freeze requires every Term with matching academic_year in status CATALOG_FROZEN", error_id: ERR_TERM_NOT_LOCKED, http_status: 409, applies_to: "POST /curriculum/proposals/{id}/activate; POST /curriculum/editions/{id}/freeze" }
  - { priority: 13, category: business_referential, check: "Registrar APPROVE of a DEACTIVATION proposal with declared_remaining_cohorts > 0 requires a TeachOutPlan with proposal_id == this proposal and status IN {COMMITTED, IN_PROGRESS, COMPLETE}", error_id: ERR_TEACH_OUT_NOT_COMMITTED, http_status: 409, applies_to: "POST /curriculum/proposals/{id}/decisions (action=APPROVE, Registrar)" }
  - { priority: 14, category: business_referential, check: "every proposed_requisites entry references a Course whose status == ACTIVE", error_id: ERR_REQUISITE_TARGET_INACTIVE, http_status: 422, applies_to: "POST /curriculum/proposals/{id}/submit" }
  - { priority: 15, category: business_constraint, check: "activating proposal requisites must not close a cycle in the ACTIVE PREREQUISITE graph (calculations.requisite_cycle_check)", error_id: ERR_REQUISITE_CYCLE, http_status: 422, applies_to: "POST /curriculum/proposals/{id}/activate" }
  - { priority: 16, category: business_constraint, check: "no proposed_requisites entry may name target_course_id as its own requisite", error_id: ERR_SELF_REQUISITE, http_status: 422, applies_to: "POST /curriculum/proposals/{id}/submit" }
  - { priority: 17, category: business_constraint, check: "(subject_code, course_number) uniqueness: not held by a Course with status IN {ACTIVE, DEACTIVATING} nor by another in-flight Proposal (status IN {DEPT_REVIEW, COMMITTEE_REVIEW, SENATE_REVIEW, REGISTRAR_REVIEW, APPROVED}); checked at submit and re-checked at activate and at POST /courses", error_id: ERR_COURSE_NUMBER_HELD, http_status: 409, applies_to: "POST /curriculum/proposals/{id}/submit; POST /curriculum/proposals/{id}/activate; POST /curriculum/courses" }
  - { priority: 18, category: business_constraint, check: "term half-open overlap: new/edited term [classes_start_date, classes_end_date) vs every other term: conflict iff start < other.end AND end > other.start (adjacency end == other.start is NOT a conflict)", error_id: ERR_TERM_DATE_OVERLAP, http_status: 409, applies_to: "POST /curriculum/terms; PATCH /curriculum/terms/{id}" }
  - { priority: 19, category: business_constraint, check: "term sequence_index unique across all terms", error_id: ERR_TERM_SEQUENCE_CONFLICT, http_status: 409, applies_to: "POST /curriculum/terms; PATCH /curriculum/terms/{id}" }
  - { priority: 20, category: business_constraint, check: "edition closed-interval rules: [year_start_date, year_end_date] inclusive both ends — conflict iff start <= other.end AND end >= other.start (a single shared day IS a conflict); when any non-ARCHIVED edition exists, the new edition's year_start_date must be exactly the day after the latest non-ARCHIVED edition's year_end_date (gap-free contiguity); academic_year unique among non-ARCHIVED editions", error_id: ERR_EDITION_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /curriculum/editions" }
  - { priority: 21, category: business_constraint, check: "no second CrossListing for the same unordered course pair while one with status IN {PENDING, HOME_APPROVED, PARTNER_APPROVED, ACTIVE} exists; home and partner courses must belong to different departments (different departments violation -> ERR_VALIDATION at priority 4)", error_id: ERR_CROSS_LISTING_EXISTS, http_status: 409, applies_to: "POST /curriculum/cross-listings" }
  - { priority: 22, category: business_constraint, check: "learning_outcomes present but empty array at submit for NEW_COURSE/COURSE_CHANGE (absent field is ERR_VALIDATION at priority 4)", error_id: ERR_LEARNING_OUTCOMES_REQUIRED, http_status: 422, applies_to: "POST /curriculum/proposals/{id}/submit" }
  - { priority: 23, category: business_fiscal, check: "credit-hour workload check (calculations.credit_hour_workload_check): abs(proposed_credit_hours - computed_credits) <= 0.5", error_id: ERR_CREDIT_HOUR_MISMATCH, http_status: 422, applies_to: "POST /curriculum/proposals/{id}/submit" }

# =============================================================================
# §1.5 API Endpoint Table (all paths under api_prefix /curriculum)
# =============================================================================
endpoints:
  - { method: POST, path: "/curriculum/_clock/set_current_utc", description: "Test-driving endpoint: sets the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [Registrar], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all subsequent time-gated validations (freeze dates, proposal window) evaluate against the new logical now"] }
  - { method: POST, path: "/curriculum/departments", description: "Registrar registers a department (chair identity anchor: X-User-ID of a DepartmentChair equals a Department id)", roles: [Registrar], code: 201, input: [dept_name, subject_codes, college], output: Department, side_effects: [] }
  - { method: POST, path: "/curriculum/terms", description: "Registrar creates a term; half-open overlap and sequence_index uniqueness enforced", roles: [Registrar], code: 201, input: [term_code, academic_year, sequence_index, classes_start_date, classes_end_date, proposal_freeze_at, catalog_freeze_at], output: Term, side_effects: ["validations 18/19 (overlap, sequence uniqueness)"] }
  - { method: GET, path: "/curriculum/terms/{id}", description: "Fetch one term (exposes computed scheduled_proposal_count)", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: [], output: Term, side_effects: [] }
  - { method: PATCH, path: "/curriculum/terms/{id}", description: "Registrar edits term dates; OCC-guarded", roles: [Registrar], code: 200, input: [expected_term_version, "classes_start_date?", "classes_end_date?", "proposal_freeze_at?", "catalog_freeze_at?"], output: Term, side_effects: ["increments Term.version by 1", "re-validates half-open overlap and date ordering"] }
  - { method: POST, path: "/curriculum/terms/{id}/freeze-proposals", description: "OPEN_FOR_PROPOSALS -> PROPOSAL_FROZEN; gated on logical clock >= proposal_freeze_at", roles: [Registrar], code: 200, input: [], output: Term, side_effects: ["increments Term.version by 1"] }
  - { method: POST, path: "/curriculum/terms/{id}/freeze-catalog", description: "PROPOSAL_FROZEN -> CATALOG_FROZEN; gated on logical clock >= catalog_freeze_at", roles: [Registrar], code: 200, input: [], output: Term, side_effects: ["increments Term.version by 1"] }
  - { method: POST, path: "/curriculum/courses", description: "Registrar imports a catalog course directly into ACTIVE status (initial catalog load path; NEW_COURSE proposals are the other path)", roles: [Registrar], code: 201, input: [subject_code, course_number, title, credit_hours, contact_hours_per_week, out_of_class_hours_per_week, learning_outcomes, owning_department_id, introduced_in_term_id], output: Course, side_effects: ["course-number uniqueness check (ERR_COURSE_NUMBER_HELD)"] }
  - { method: GET, path: "/curriculum/courses", description: "List courses with filters and pagination", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["owning_department_id?", "introduced_in_term_id?", "last_published_edition_id?", "status?", "subject_code?", "course_number?", "limit?", "offset?"], output: "Course[]", side_effects: [] }
  - { method: GET, path: "/curriculum/courses/{id}", description: "Fetch one course", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: [], output: Course, side_effects: [] }
  - { method: GET, path: "/curriculum/courses/{id}/requisites", description: "All RequisiteLinks touching this course on either side (course_id == id OR requisite_course_id == id)", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["requisite_type?", "status?", "limit?", "offset?"], output: "RequisiteLink[]", side_effects: [] }
  - { method: GET, path: "/curriculum/courses/{id}/cross-listings", description: "All CrossListings where this course is home or partner", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["status?", "limit?", "offset?"], output: "CrossListing[]", side_effects: [] }
  - { method: POST, path: "/curriculum/proposals", description: "FacultyProposer creates a DRAFT proposal; proposer_id is copied from X-User-ID", roles: [FacultyProposer], code: 201, input: [proposal_type, proposer_department_id, requested_effective_term_id, "target_course_id?", "proposed_subject_code?", "proposed_course_number?", "proposed_title?", "proposed_credit_hours?", "contact_hours_per_week?", "out_of_class_hours_per_week?", "learning_outcomes?", "justification?", "proposed_requisites?", "declared_remaining_cohorts?"], output: Proposal, side_effects: ["initial status DRAFT; substantive_change_score null until submit"] }
  - { method: GET, path: "/curriculum/proposals", description: "List proposals with filters and pagination", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["target_course_id?", "requested_effective_term_id?", "effective_term_id?", "proposer_department_id?", "proposer_id?", "status?", "limit?", "offset?"], output: "Proposal[]", side_effects: [] }
  - { method: GET, path: "/curriculum/proposals/{id}", description: "Fetch one proposal", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: [], output: Proposal, side_effects: [] }
  - { method: PUT, path: "/curriculum/proposals/{id}", description: "Owner edits a DRAFT or RETURNED proposal's proposed_* payload; OCC-guarded", roles: [FacultyProposer], code: 200, input: [expected_proposal_version, "proposed_subject_code?", "proposed_course_number?", "proposed_title?", "proposed_credit_hours?", "contact_hours_per_week?", "out_of_class_hours_per_week?", "learning_outcomes?", "justification?", "proposed_requisites?", "declared_remaining_cohorts?", "requested_effective_term_id?", "proposer_department_id?"], output: Proposal, side_effects: ["increments Proposal.version by 1", "allowed only while status IN {DRAFT, RETURNED} (else ERR_INVALID_STATE)"] }
  - { method: POST, path: "/curriculum/proposals/{id}/submit", description: "DRAFT|RETURNED -> DEPT_REVIEW; runs full submit validation battery; computes PROVISIONAL substantive_change_score; creates PROPOSED RequisiteLinks; holds NEW_COURSE number", roles: [FacultyProposer], code: 200, input: [], output: Proposal, side_effects: ["see Proposal DRAFT -> DEPT_REVIEW side effects", "increments Proposal.version by 1"] }
  - { method: POST, path: "/curriculum/proposals/{id}/withdraw", description: "Owner withdraws from any non-terminal state; releases number hold; PROPOSED links -> REMOVED; APPROVED withdrawal decrements term scheduled count", roles: [FacultyProposer], code: 200, input: [], output: Proposal, side_effects: ["see Proposal * -> WITHDRAWN side effects", "increments Proposal.version by 1"] }
  - { method: POST, path: "/curriculum/proposals/{id}/decisions", description: "Committee action endpoint. action=APPROVE advances the current stage (Registrar APPROVE requires effective_term_id and finalizes to APPROVED); RETURN sends to RETURNED; REJECT terminates; NOTIFY (Registrar, REGISTRAR_REVIEW, required-and-unsent) stamps notification_sent_at; REASSIGN_TERM (Registrar, APPROVED) changes effective_term_id", roles: [DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: [action, "rationale?", "effective_term_id?"], output: Proposal, side_effects: ["appends DecisionRecord for every action", "FINAL score recompute on SENATE_REVIEW -> REGISTRAR_REVIEW", "term scheduled_proposal_count adjustments on APPROVE/REASSIGN_TERM", "increments Proposal.version by 1"] }
  - { method: GET, path: "/curriculum/proposals/{id}/decisions", description: "Append-only decision log for a proposal, chronological (created_at ASC)", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["limit?", "offset?"], output: "DecisionRecord[]", side_effects: [] }
  - { method: GET, path: "/curriculum/proposals/{id}/requisites", description: "RequisiteLinks created by this proposal", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["status?", "limit?", "offset?"], output: "RequisiteLink[]", side_effects: [] }
  - { method: POST, path: "/curriculum/proposals/{id}/activate", description: "APPROVED -> EFFECTIVE; applies payload (create/update course, activate requisites with cycle check, deactivation cascades, stage catalog entry)", roles: [Registrar], code: 200, input: [], output: Proposal, side_effects: ["see Proposal APPROVED -> EFFECTIVE side effects", "increments Proposal.version by 1"] }
  - { method: POST, path: "/curriculum/proposals/{id}/teach-out-plan", description: "Owner creates the DRAFT TeachOutPlan for a DEACTIVATION proposal (1:1); computes provisional_completion_sequence (ENROLLMENT_DRIVEN)", roles: [FacultyProposer], code: 201, input: [enrolled_cohort_count, cohort_sizes, last_enrolled_term_id], output: TeachOutPlan, side_effects: ["provisional_completion_sequence computed at creation"] }
  - { method: GET, path: "/curriculum/teach-out-plans", description: "List teach-out plans with filters and pagination", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["proposal_id?", "course_id?", "last_enrolled_term_id?", "status?", "limit?", "offset?"], output: "TeachOutPlan[]", side_effects: [] }
  - { method: GET, path: "/curriculum/teach-out-plans/{id}", description: "Fetch one teach-out plan", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: [], output: TeachOutPlan, side_effects: [] }
  - { method: POST, path: "/curriculum/teach-out-plans/{id}/commit", description: "DRAFT -> COMMITTED by the proposer department's chair; computes committed_completion_sequence (CATALOG_DRIVEN) and resource_cost_cents", roles: [DepartmentChair], code: 200, input: [], output: TeachOutPlan, side_effects: ["calculations.teach_out_completion_terms CATALOG_DRIVEN", "calculations.teach_out_resource_cost_cents", "increments TeachOutPlan.version by 1"] }
  - { method: POST, path: "/curriculum/teach-out-plans/{id}/complete", description: "IN_PROGRESS -> COMPLETE by Registrar; cascades linked course DEACTIVATING -> INACTIVE and entry exclusions", roles: [Registrar], code: 200, input: [], output: TeachOutPlan, side_effects: ["Course DEACTIVATING -> INACTIVE cascade", "increments TeachOutPlan.version by 1"] }
  - { method: POST, path: "/curriculum/cross-listings", description: "Home-department chair requests a cross-listing; both courses must be ACTIVE, in different departments, and not already paired in a non-terminal listing", roles: [DepartmentChair], code: 201, input: [home_course_id, partner_course_id], output: CrossListing, side_effects: ["denormalizes home/partner department ids from the courses"] }
  - { method: POST, path: "/curriculum/cross-listings/{id}/approve", description: "Approves the acting chair's side; side derived from X-User-ID vs home/partner department ids; second-side approval activates", roles: [DepartmentChair], code: 200, input: [], output: CrossListing, side_effects: ["sets <side>_approved_by", "increments CrossListing.version by 1"] }
  - { method: POST, path: "/curriculum/cross-listings/{id}/reject", description: "Either side's chair rejects from PENDING/HOME_APPROVED/PARTNER_APPROVED", roles: [DepartmentChair], code: 200, input: ["rationale?"], output: CrossListing, side_effects: ["increments CrossListing.version by 1"] }
  - { method: POST, path: "/curriculum/cross-listings/{id}/rescind", description: "Acting side's chair withdraws a prior own-side approval: HOME_APPROVED|PARTNER_APPROVED -> PENDING", roles: [DepartmentChair], code: 200, input: [], output: CrossListing, side_effects: ["clears <side>_approved_by", "increments CrossListing.version by 1"] }
  - { method: POST, path: "/curriculum/editions", description: "Registrar creates a DRAFT catalog edition; closed-interval overlap + contiguity + academic_year uniqueness among non-ARCHIVED editions enforced", roles: [Registrar], code: 201, input: [edition_label, academic_year, year_start_date, year_end_date], output: CatalogEdition, side_effects: [] }
  - { method: POST, path: "/curriculum/editions/{id}/freeze", description: "DRAFT -> FROZEN; requires all same-year terms CATALOG_FROZEN; runs edition_freeze_snapshot sweep", roles: [Registrar], code: 200, input: [], output: CatalogEdition, side_effects: ["calculations.edition_freeze_snapshot", "sets included_entry_count", "increments CatalogEdition.version by 1"] }
  - { method: POST, path: "/curriculum/editions/{id}/publish", description: "FROZEN -> PUBLISHED; INCLUDED entries -> PUBLISHED (stamping course.last_published_edition_id); previously PUBLISHED edition and its PUBLISHED entries -> ARCHIVED", roles: [Registrar], code: 200, input: [], output: CatalogEdition, side_effects: ["see CatalogEdition FROZEN -> PUBLISHED cascade", "increments CatalogEdition.version by 1"] }
  - { method: GET, path: "/curriculum/catalog-entries", description: "List catalog entries with filters and pagination", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: ["edition_id?", "course_id?", "proposal_id?", "status?", "limit?", "offset?"], output: "CatalogEntry[]", side_effects: [] }
  - { method: GET, path: "/curriculum/catalog-entries/{id}", description: "Fetch one catalog entry", roles: [FacultyProposer, DepartmentChair, CurriculumCommittee, FacultySenate, Registrar], code: 200, input: [], output: CatalogEntry, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing X-User-Role/X-User-ID headers or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not in endpoint roles, or decision action's role class mismatched to the proposal's current review stage" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "templated path id does not resolve (checked left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed body: missing required field, bad enum/type, unknown field, nonexistent body-FK, or violated shape rule (date ordering, array length, same-term reassign, cohort-count mismatch)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "actor's X-User-ID does not own the resource scope (proposer id, department id, or cross-listing side)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition does not exist from the resource's current state (wrong-from-state, terminal lockdown, repeat NOTIFY, inactive course at cross-listing activation)" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "decision actor's X-User-ID equals proposal.proposer_id (segregation of duties)" }
  - { id: ERR_ACCREDITOR_NOTIFICATION_PENDING, http: 409, condition: "Registrar APPROVE attempted while accreditor_notification_required == true and notification_sent_at is null" }
  - { id: ERR_TEACH_OUT_NOT_COMMITTED, http: 409, condition: "Registrar APPROVE of DEACTIVATION with declared_remaining_cohorts > 0 but no COMMITTED/IN_PROGRESS/COMPLETE TeachOutPlan" }
  - { id: ERR_PROPOSAL_WINDOW_CLOSED, http: 409, condition: "submit while requested term not OPEN_FOR_PROPOSALS or now >= proposal_freeze_at" }
  - { id: ERR_FREEZE_DATE_NOT_REACHED, http: 409, condition: "freeze action attempted before its configured freeze datetime" }
  - { id: ERR_TERM_NOT_LOCKED, http: 409, condition: "activate with effective term not yet frozen; or edition freeze while a same-year term is not CATALOG_FROZEN" }
  - { id: ERR_REQUISITE_TARGET_INACTIVE, http: 422, condition: "proposed requisite references a course whose status != ACTIVE" }
  - { id: ERR_REQUISITE_CYCLE, http: 422, condition: "activation would close a cycle in the ACTIVE PREREQUISITE graph" }
  - { id: ERR_SELF_REQUISITE, http: 422, condition: "proposed requisite names the target course itself" }
  - { id: ERR_COURSE_NUMBER_HELD, http: 409, condition: "(subject_code, course_number) held by an ACTIVE/DEACTIVATING course or an in-flight proposal" }
  - { id: ERR_TERM_DATE_OVERLAP, http: 409, condition: "term [start, end) half-open interval collides with another term (adjacency allowed)" }
  - { id: ERR_TERM_SEQUENCE_CONFLICT, http: 409, condition: "term sequence_index already in use" }
  - { id: ERR_EDITION_WINDOW_CONFLICT, http: 409, condition: "edition closed-interval overlap, missing day-after contiguity, or duplicate academic_year among non-ARCHIVED editions" }
  - { id: ERR_CROSS_LISTING_EXISTS, http: 409, condition: "unordered course pair already has a non-terminal CrossListing" }
  - { id: ERR_LEARNING_OUTCOMES_REQUIRED, http: 422, condition: "learning_outcomes present-but-empty at submit for NEW_COURSE/COURSE_CHANGE" }
  - { id: ERR_CREDIT_HOUR_MISMATCH, http: 422, condition: "proposed_credit_hours deviates from computed workload credits by more than 0.5" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the resource's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacultyProposer
    description: "Faculty member who authors and shepherds curriculum proposals"
    identity: opaque
    exclusive_operations: ["POST /curriculum/proposals", "PUT /curriculum/proposals/{id} (own, DRAFT/RETURNED)", "POST /curriculum/proposals/{id}/submit (own)", "POST /curriculum/proposals/{id}/withdraw (own)", "POST /curriculum/proposals/{id}/teach-out-plan (own DEACTIVATION proposal)"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: DepartmentChair
    description: "Chair of a department; X-User-ID equals the Department id they chair"
    identity: "entity_backed:Department"
    exclusive_operations: ["POST /curriculum/proposals/{id}/decisions at DEPT_REVIEW for own department", "POST /curriculum/teach-out-plans/{id}/commit (own department)", "POST /curriculum/cross-listings (home department)", "POST /curriculum/cross-listings/{id}/approve|reject|rescind (own side)"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: CurriculumCommittee
    description: "Faculty senate curriculum committee reviewer"
    identity: opaque
    exclusive_operations: ["POST /curriculum/proposals/{id}/decisions at COMMITTEE_REVIEW"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: FacultySenate
    description: "Faculty senate reviewer"
    identity: opaque
    exclusive_operations: ["POST /curriculum/proposals/{id}/decisions at SENATE_REVIEW"]
    shared_operations: ["all GET list/detail endpoints"]
  - name: Registrar
    description: "Registrar operator: terms, departments, course import, editions, final approval, notification, activation, teach-out completion, clock"
    identity: opaque
    exclusive_operations: ["POST /curriculum/departments", "POST/PATCH /curriculum/terms*", "POST /curriculum/terms/{id}/freeze-*", "POST /curriculum/courses", "POST /curriculum/proposals/{id}/decisions at REGISTRAR_REVIEW (incl. NOTIFY, and REASSIGN_TERM while APPROVED)", "POST /curriculum/proposals/{id}/activate", "POST /curriculum/teach-out-plans/{id}/complete", "POST /curriculum/editions*", "POST /curriculum/_clock/set_current_utc"]
    shared_operations: ["all GET list/detail endpoints"]
