      - name: invalid_from_state_triggers_rejected_on_receipt_run_line_and_transfer
        claim_type: invalid_transitions
        grounds:
          - state_machines[Receipt].transitions
          - state_machines[AllocationRun].transitions
          - state_machines[AllocationLine].transitions[PENDING->SHIPPED]
          - state_machines[TransferRecommendation].transitions
          - validations[priority:8]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          The same claim on the four transactional machines, where skipping a step is the realistic operator
          error: closing a receipt that has never been allocated (CLOSED is reachable only from ALLOCATING or
          ALLOCATED), committing or recalling a run that is still DRAFT, recalling a run that is merely
          PROPOSED (recall exists only from COMMITTED), confirming receipt of a line that has not shipped, and
          dispatching or receiving a transfer that has not been approved. Every probe carries a legal role and
          a legal payload, so the ONLY defect is the from-state, and each interleaved successful call proves
          the endpoint itself works.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with transfer_min_ratio_bp 0; stores 0101 and 0102 with shelf plans 48/12 and 24/8"
            - "Positions: 0101 holds 4 units (S 0, M 3, L 1, XL 0) with min 12 / max 48 and forecast 9; 0102 holds 30 units with min 8 / max 24 and forecast 5"
            - "A 20-unit receipt ASN-8003 is STAGED; no run, line or transfer exists yet"
            - "The line confirm-receipt probe is issued by StoreOperator with X-User-ID equal to store 0101, so the scope rule at priority 3 passes and the state rule at priority 8 is what fires"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH", transfer_min_ratio_bp: 0 }
