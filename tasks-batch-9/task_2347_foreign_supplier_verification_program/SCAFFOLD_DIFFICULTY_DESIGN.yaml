              payload: { pair_id: "${pair1}", activity_type: "ONSITE_AUDIT", frequency_per_year: 1, justification_text: "Annual onsite audit of the foreign supplier for pathogen control", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", assigned_qi_id: "${qi_a}" }
