      - name: arbitrator_review_branches_diverge_in_seller_consequence
        grounds:
          - state_machines.ArbitrationCase.ARBITRATOR_REVIEW_to_DENIED
          - state_machines.ArbitrationCase.ARBITRATOR_REVIEW_to_RESOLVED_ALLOWANCE
          - calculations.transport_cost_allocation
          - calculations.seller_arbitration_rate
          - entities.Seller.fields.lifetime_upheld_count
        distinguishing_aspect: |
          Branching, and the branches are not symmetric: from the single ARBITRATOR_REVIEW
          state a CLAIM_DENIED decision leaves the seller's scorecard, tier and the sale's
          settlement dimension completely untouched and shifts the whole 32735-cent
          transport bill onto the buyer, whereas the sibling REPAIR_ALLOWANCE branch from
          the same state increments lifetime_upheld_count and splits transport 2000/7000.
