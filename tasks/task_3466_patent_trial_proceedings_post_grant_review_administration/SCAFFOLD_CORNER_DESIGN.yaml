  - section: roles
    instances:
      - name: clock_set_forbidden_for_board_panel_role
        claim_type: RBAC Denial
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The logical clock is a PlatformAdmin-only surface; BoardPanel credentials are rejected 403 before any payload processing."
        test_recipe:
          setup:
            - "Empty database (clock at its 2026-09-01T00:00:00Z default)."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: BoardPanel
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "a subsequent GET-side read still observes the default clock 2026-09-01T00:00:00Z (no mutation occurred)"

      - name: party_registration_forbidden_for_petitioner_role
        claim_type: RBAC Denial
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/ptab/parties
        distinguishing_aspect: "Party registration is docket administration: a Petitioner role caller is rejected 403 even with a well-formed payload."
        test_recipe:
          setup:
            - "Logical clock default; empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /ptab/parties"
              payload: { name: "Self Registrar Inc", party_type: "PETITIONER" }
              as: Petitioner
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"

