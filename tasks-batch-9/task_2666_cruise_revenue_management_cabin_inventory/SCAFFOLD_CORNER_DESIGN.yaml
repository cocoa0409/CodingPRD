            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ov}", physical_cabins: 30, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_l_ov: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_spa}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 289995, third_berth_fare_cents: 90000, fourth_berth_fare_cents: 70000 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_spa}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 249995, third_berth_fare_cents: 80000, fourth_berth_fare_cents: 60000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_l}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Nell Newman", email: "nell@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_nell: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", guest_id: "${g_nell}", occupancy_adults: 2 }
