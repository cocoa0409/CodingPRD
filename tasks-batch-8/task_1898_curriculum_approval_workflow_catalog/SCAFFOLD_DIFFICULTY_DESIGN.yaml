            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "401", title: "Z", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["z"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_z: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "402", title: "Y", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["y"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_y: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", target_course_id: "${course_z}", declared_remaining_cohorts: 0, justification: "no students left" }, as: FacultyProposer, as_user_id: "fac-001", captures: { p0: $.data.id } }
            - { call: "POST /curriculum/proposals/${p0}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${p0}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${p0}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${p0}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", target_course_id: "${course_y}", declared_remaining_cohorts: 1, justification: "one cohort left" }, as: FacultyProposer, as_user_id: "fac-001", captures: { p1: $.data.id } }
            - { call: "POST /curriculum/proposals/${p1}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
