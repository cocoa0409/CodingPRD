      - name: waive_critical_reconditioning_item_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines[ReconditioningItem].transitions[REQUIRED->WAIVED].preconditions
          - validations[priority=35]
          - errors[ERR_CRITICAL_RECONDITIONING_NOT_WAIVABLE]
          - errors[ERR_ROLE_FORBIDDEN]
          - roles[ProgramAdministrator].exclusive_operations
        distinguishing_aspect: |
          A CRITICAL repair can never be excused: waiving it is 422
          ERR_CRITICAL_RECONDITIONING_NOT_WAIVABLE even for the administrator, and the same call
          attempted by a technician is stopped earlier at priority 2 with ERR_ROLE_FORBIDDEN, because
          resolution WAIVED is administrator-exclusive within an endpoint that both roles may call.
          The mirror case is equally gated: an administrator requesting resolution COMPLETED is
