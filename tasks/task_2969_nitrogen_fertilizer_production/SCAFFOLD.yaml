scenario: |
  2969. Nitrogen Fertilizer Production (nitrogen fertilizer plant): ammonia synthesis with natural gas
  feedstock, reformer operation and catalyst life management, downstream production of urea, ammonium
  nitrate and solutions with product mix flexibility, natural gas hedging and feedstock cost pass-through
  to product pricing, turnaround planning with catalyst change, vessel inspection and multi-week outage
  sequencing, storage capacity across tanks, domes and terminals with seasonal demand for spring
  application, safety and security requirements for regulated substances with process safety management
  programs, logistics across rail, barge and truck with terminal network positioning, environmental
  permitting and emissions monitoring
domain_name: nitrogen-fertilizer-production
api_prefix: "/nitrogen-ops"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Thirteen peer entities linked exclusively by foreign keys carried in request bodies. Every URL is
    `/nitrogen-ops/<collection>` or `/nitrogen-ops/<collection>/{id}[/<action>]`; no entity is nested
    under another in a path. Reverse navigation is always a filtered list on the child collection.

  state_machine_shape: branching
  state_machine_shape_note: |
    Turnaround forks SUBMITTED -> {APPROVED, REJECTED} with disjoint side-effect sets and loops back
    REJECTED -> DRAFT. ProductionOrder carries two independent state dimensions on one row
    (`allocation_status` and `security_status`) that advance without reference to each other.
    ProductionRun and CatalystCharge each carry a revision loop (COMPLETED -> RUNNING,
    SPENT -> ACTIVE). Plant.operating_posture is a derived gate over its children.

  relationship_patterns:
    - one_to_many
    - self_referential      # TurnaroundTask.predecessor_task_id -> TurnaroundTask.id
    - cross_aggregate       # ProductionOrder spans ProductionRun, ProductLine and StorageAsset

  role_model: segregation_of_duties
  role_model_note: |
    The engineer identified by `X-User-ID` who authors a Turnaround may not sign its process-safety
    review, and the safety officer who signed the review may not approve the same Turnaround.
    Five operational roles own disjoint resource families; TerminalOperator is entity-backed and may
    only act on shipments arriving at its own StorageAsset.

  consistency_model: immediate

  difficulty_level: expert_plus
  difficulty_note: |
    Deliberately above the Expert band of SKILL.md 0.4 (13 entities / 71 endpoints / 43 error codes /
    10 calculations / 10 state machines). The density, not the volume, is the point: a single
    `POST /production-runs/{id}/complete` reprices the run against a chronological hedge waterfall,
    advances catalyst life, can retire the catalyst, derate the train and revert an unrelated approved
    run, all in one request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Plant
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable plant name."
        constraints: "1..120 chars, non-blank"
      - name: site_code
        type: string
        source: input
        description: "Operator site code."
        constraints: "unique across all Plants; 3..12 chars, uppercase A-Z and digits only"
      - name: permit_limit_tons_30d
        type: number
        source: input
        description: "Air-permit ceiling, in tons, applied independently to each pollutant's rolling 30-day mass."
        constraints: "> 0, 2 decimal places"
      - name: spot_gas_index_usd_per_mmbtu
        type: number
        source: input
        description: "Latest published spot natural-gas index for this plant's delivery point."
        constraints: "> 0, 4 decimal places"
      - name: gas_index_updated_at
        type: datetime
        source: system
        description: "Logical-clock instant at which spot_gas_index_usd_per_mmbtu was last written."
      - name: hedged_blend_usd_per_mmbtu
        type: number
        source: computed
        description: "Volume-weighted average strike of this plant's OPEN hedge lots; see calculations.plant_hedged_blend."
        constraints: "4 decimal places"
      - name: permit_status
        type: enum
        source: system
        description: "Air-permit standing for the site."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: psm_program_status
        type: enum
        source: system
        description: "Process-safety-management program standing."
        default: CURRENT
        constraints: "one of {CURRENT, DUE, OVERDUE}"
      - name: operating_posture
        type: enum
        source: computed
        description: "Derived gate over every child operation; see calculations.plant_operating_posture."
        default: NORMAL
        constraints: "one of {NORMAL, RESTRICTED, FROZEN}"
      - name: exceeded_pollutants
        type: array
        source: computed
        description: "Sorted list of pollutant enum values whose rolling 30-day mass currently exceeds permit_limit_tons_30d."
        default: "[]"
        constraints: "subset of {N2O, NH3, NOX, PM}, sorted ascending by enum spelling"
      - name: last_vessel_inspection_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent completed turnaround whose scope covered vessel inspection; null when none."

  - name: ReformerTrain
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the site this synthesis train belongs to."
      - name: train_code
        type: string
        source: input
        description: "Operator train designation."
        constraints: "unique per plant_id; 2..12 chars"
      - name: rated_ammonia_tpd
        type: number
        source: input
        description: "Nameplate ammonia output in tons per day."
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Train availability state."
        default: IDLE
        constraints: "one of {IDLE, RUNNING, DERATED, DOWN_FOR_TURNAROUND}"
      - name: active_charge_id
        type: string
        source: computed
        description: "Identifier of the single CatalystCharge on this train whose status == ACTIVE; null when this train has no ACTIVE charge. Mirror field only, never a decision input on its own."

  - name: CatalystCharge
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: train_id
        type: string
        source: input
        description: "FK -> ReformerTrain.id; the train this charge is loaded into."
      - name: charge_code
        type: string
        source: input
        description: "Catalyst charge designation."
        constraints: "unique per train_id; 2..16 chars"
      - name: design_life_hours
        type: number
        source: input
        description: "Vendor design life of the charge in operating hours."
        constraints: "> 0, 1 decimal place"
      - name: baseline_operating_hours
        type: number
        source: input
        description: "Operating hours already on the charge when it was registered (carry-over meter reading)."
        default: 0
        constraints: ">= 0, 1 decimal place"
      - name: poisoning_index
        type: number
        source: input
        description: "Latest laboratory sulphur/chloride poisoning index for the charge."
        default: 0.0
        constraints: "0.00 <= value <= 1.00, 2 decimal places"
      - name: regeneration_count
        type: integer
        source: system
        description: "Number of in-situ regenerations performed on this charge."
        default: 0
        constraints: ">= 0"
      - name: installed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the charge was registered."
      - name: cumulative_operating_hours
        type: number
        source: computed
        description: "baseline_operating_hours plus the summed actual_operating_hours of every ProductionRun whose catalyst_charge_id == this charge and whose status == COMPLETED."
        constraints: "1 decimal place"
      - name: calendar_activity_pct
        type: number
        source: computed
        description: "Straight-line calendar activity variant; see calculations.catalyst_activity_pct variant CALENDAR."
        constraints: "0.00..100.00, 2 decimal places"
      - name: activity_pct
        type: number
        source: computed
        description: "Severity-adjusted activity variant; the value every gate reads. See calculations.catalyst_activity_pct variant SEVERITY_ADJUSTED."
        constraints: "0.00..100.00, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Charge lifecycle state."
        default: ACTIVE
        constraints: "one of {ACTIVE, SPENT, RETIRED}"

  - name: GasHedgeLot
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the site whose burn this lot may cover."
      - name: lot_code
        type: string
        source: input
        description: "Trade ticket code for the hedged volume."
        constraints: "unique per plant_id; 2..16 chars"
      - name: mmbtu_volume
        type: number
        source: input
        description: "Hedged volume in MMBtu as transacted."
        constraints: "> 0, 1 decimal place"
      - name: strike_price_usd_per_mmbtu
        type: number
        source: input
        description: "Fixed strike price of the lot."
        constraints: "> 0, 4 decimal places"
      - name: delivery_month
        type: string
        source: input
        description: "Delivery month of the hedged volume."
        constraints: "exactly `YYYY-MM`, month 01..12"
      - name: consumed_mmbtu
        type: number
        source: computed
        description: "Volume drawn from this lot by ProductionRun completions and not since restored by a reopen."
        default: 0
        constraints: ">= 0, 1 decimal place"
      - name: remaining_mmbtu
        type: number
        source: computed
        description: "mmbtu_volume - consumed_mmbtu."
        constraints: ">= 0, 1 decimal place"
      - name: status
        type: enum
        source: computed
        description: "OPEN while remaining_mmbtu > 0, CLOSED once remaining_mmbtu == 0."
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

  - name: ProductLine
    parent: null
    common_fields: false
    entity_role: configuration
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the site that can make this product."
      - name: product_code
        type: enum
        source: input
        description: "Finished product this line makes."
        constraints: "one of {ANHYDROUS_AMMONIA, AMMONIUM_NITRATE, UAN_SOLUTION, UREA}; unique GLOBALLY. The product slate is a single register keyed by product code, and plant_id names the producing plant, so the ProductLine for a given product_code is always single-valued."
      - name: ammonia_tons_per_product_ton
        type: number
        source: input
        description: "Ammonia feed intensity: tons of NH3 consumed per finished ton."
        constraints: "> 0, 3 decimal places"
      - name: conversion_cost_usd_per_ton
        type: number
        source: input
        description: "Cash conversion cost per finished ton, excluding ammonia feed."
        constraints: "> 0, 3 decimal places"
      - name: regulated
        type: boolean
        source: input
        description: "True when the finished product is a regulated substance under the site security plan."
      - name: priority_rank
        type: integer
        source: input
        description: "Product-mix priority. Lower rank is released LAST when a run's reservations are unwound; the release sweep orders candidates by priority_rank DESC, then created_at ASC."
        constraints: "1..99"

  - name: ProductionRun
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: train_id
        type: string
        source: input
        description: "FK -> ReformerTrain.id; the train that will make the ammonia."
      - name: catalyst_charge_id
        type: string
        source: system
        description: "FK -> CatalystCharge.id; null until the run starts, then pinned to the train's ACTIVE charge and never rewritten."
      - name: run_code
        type: string
        source: input
        description: "Campaign code."
        constraints: "unique per train_id; 2..16 chars"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the campaign window (ISO 8601 UTC, three fractional digits)."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the campaign window (ISO 8601 UTC, three fractional digits); must be strictly after window_start."
      - name: target_ammonia_tons
        type: number
        source: input
        description: "Planned ammonia output for the campaign."
        constraints: "> 0, 3 decimal places"
      - name: actual_ammonia_tons
        type: number
        source: system
        description: "Ammonia actually made, supplied at completion; null before completion."
        constraints: "> 0 when set, 3 decimal places"
      - name: actual_operating_hours
        type: number
        source: system
        description: "Reformer operating hours actually logged for the campaign, supplied at completion; null before completion."
        constraints: "> 0 when set, 1 decimal place"
      - name: consumed_gas_mmbtu
        type: number
        source: computed
        description: "Total MMBtu drawn from GasHedgeLot rows by this run's completion; 0 before completion and after a reopen."
        default: 0
        constraints: ">= 0, 1 decimal place"
      - name: provisional_unit_cost_usd_per_ton
        type: number
        source: computed
        description: "Approval-time ammonia unit cost; see calculations.run_ammonia_unit_cost variant PROVISIONAL. Null while PLANNED."
        constraints: "2 decimal places"
      - name: final_unit_cost_usd_per_ton
        type: number
        source: computed
        description: "Completion-time ammonia unit cost; see calculations.run_ammonia_unit_cost variant FINAL. Null until COMPLETED, cleared by a reopen."
        constraints: "2 decimal places"
      - name: unallocated_ammonia_tons
        type: number
        source: computed
        description: "The run's ammonia pool basis minus the summed allocated_ammonia_tons of this run's ProductionOrder rows whose allocation_status is in {RESERVED, CONSUMED}. The BASIS SWITCHES AT SETTLEMENT: actual_ammonia_tons when status == COMPLETED, target_ammonia_tons in every other status. Reservations may therefore be booked forward against a campaign that has not run yet, and settlement can reveal that the campaign under-produced."
        default: 0
        constraints: ">= 0, 3 decimal places"
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle state."
        default: PLANNED
        constraints: "one of {PLANNED, APPROVED, RUNNING, COMPLETED, ABORTED}"
      - name: abort_reason
        type: string
        source: system
        description: "Free-text reason recorded when the run is aborted; null otherwise."
      - name: reopen_reason
        type: string
        source: system
        description: "Free-text reason recorded when a COMPLETED run is reopened; null otherwise."
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ProcessEngineer who created the run. Used only by the segregation-of-duties check on approval; never a ranking or ordering input."

  - name: ProductionOrder
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; the campaign whose ammonia this order draws on."
      - name: product_line_id
        type: string
        source: input
        description: "FK -> ProductLine.id; the finished product to be made."
      - name: destination_asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; where the finished tons land when produced."
      - name: order_code
        type: string
        source: input
        description: "Order code."
        constraints: "unique per run_id; 2..16 chars"
      - name: requested_tons
        type: number
        source: input
        description: "Finished tons the commercial team wants from this run."
        constraints: "> 0, 3 decimal places"
      - name: reserved_tons
        type: number
        source: system
        description: "Finished tons currently reserved against the run; 0 while UNALLOCATED or RELEASED."
        default: 0
        constraints: ">= 0, 3 decimal places"
      - name: allocated_ammonia_tons
        type: number
        source: computed
        description: "round(reserved_tons * ProductLine.ammonia_tons_per_product_ton, 3); 0 while UNALLOCATED or RELEASED."
        default: 0
        constraints: ">= 0, 3 decimal places"
      - name: produced_tons
        type: number
        source: system
        description: "Finished tons actually made, supplied at produce time; null before."
        constraints: "> 0 when set, 3 decimal places"
      - name: landed_cost_usd
        type: number
        source: computed
        description: "Fully-loaded cost of the produced tons; see calculations.production_order_landed_cost. Null before produce."
        constraints: "2 decimal places"
      - name: allocation_status
        type: enum
        source: system
        description: "Ammonia-allocation dimension; advances independently of security_status."
        default: UNALLOCATED
        constraints: "one of {UNALLOCATED, RESERVED, CONSUMED, RELEASED}"
      - name: security_status
        type: enum
        source: system
        description: "Regulated-substance clearance dimension; advances independently of allocation_status. Set to EXEMPT at creation when the ProductLine is not regulated, otherwise PENDING."
        constraints: "one of {PENDING, CLEARED, DENIED, EXEMPT}"
      - name: release_reason
        type: string
        source: system
        description: "Reason recorded when the reservation is released, whether by operator action or by cascade; null otherwise."
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CommercialManager who created the order. Used only by the segregation-of-duties check on the regulated-substance security check; never a ranking or ordering input."
      - name: security_checked_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SafetyOfficer who recorded the security decision; null while PENDING or EXEMPT."

  - name: StorageAsset
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the site that owns or operates the asset."
      - name: asset_code
        type: string
        source: input
        description: "Asset designation."
        constraints: "unique per plant_id; 2..16 chars"
      - name: asset_kind
        type: enum
        source: input
        description: "Physical asset class."
        constraints: "one of {DOME, TANK, TERMINAL}"
      - name: product_code
        type: enum
        source: input
        description: "The single product this asset may hold."
        constraints: "one of {ANHYDROUS_AMMONIA, AMMONIUM_NITRATE, UAN_SOLUTION, UREA}"
      - name: capacity_tons
        type: number
        source: input
        description: "Nameplate holding capacity in tons."
        constraints: "> 0, 3 decimal places"
      - name: security_class
        type: enum
        source: input
        description: "Site-security classification of the asset."
        constraints: "one of {BASIC, CONTROLLED, HIGH_SECURITY}"
      - name: seasonal_reserve_pct
        type: number
        source: input
        description: "Fraction of capacity withheld for spring application during the pre-spring build months."
        default: 0.00
        constraints: "0.00 <= value <= 1.00, 2 decimal places"
      - name: opening_balance_tons
        type: number
        source: system
        description: "Physically counted tons written by the opening-balance endpoint; the anchor of on_hand_tons."
        default: 0
        constraints: ">= 0, 3 decimal places"
      - name: on_hand_tons
        type: number
        source: computed
        description: "opening_balance_tons plus produced inbound tons plus delivered inbound tons minus delivered outbound tons; see calculations.storage_position."
        constraints: ">= 0, 3 decimal places"
      - name: reserved_tons
        type: number
        source: computed
        description: "Summed tons of Shipment rows whose origin_asset_id == this asset and whose status is in {BOOKED, IN_TRANSIT}."
        constraints: ">= 0, 3 decimal places"
      - name: seasonal_reserve_tons
        type: number
        source: computed
        description: "round(capacity_tons * seasonal_reserve_pct, 3) when the logical clock's UTC month is in {12, 01, 02}, otherwise 0.000."
        constraints: ">= 0, 3 decimal places"
      - name: available_tons
        type: number
        source: computed
        description: "on_hand_tons - reserved_tons - seasonal_reserve_tons; may be negative only if a seasonal reserve is introduced after tons were already reserved."
        constraints: "3 decimal places"

  - name: Shipment
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: origin_asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; asset the tons ship out of."
      - name: dest_asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; asset the tons ship into."
      - name: production_order_id
        type: string
        source: input
        description: "FK -> ProductionOrder.id; the order whose finished tons this waybill moves, or null for an inter-terminal repositioning move that carries no order. When non-null, origin_asset_id MUST equal that order's destination_asset_id."
      - name: shipment_code
        type: string
        source: input
        description: "Waybill code."
        constraints: "unique per origin_asset_id; 2..16 chars"
      - name: mode
        type: enum
        source: input
        description: "Transport mode."
        constraints: "one of {BARGE, RAIL, TRUCK}"
      - name: tons
        type: number
        source: input
        description: "Tons tendered."
        constraints: "> 0, 3 decimal places"
      - name: distance_miles
        type: number
        source: input
        description: "Tariff distance between origin and destination."
        constraints: "> 0, 1 decimal place"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the asset occupation window (ISO 8601 UTC, three fractional digits)."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the asset occupation window (ISO 8601 UTC, three fractional digits); must be strictly after window_start."
      - name: base_freight_usd
        type: number
        source: computed
        description: "Pre-surcharge freight; see calculations.shipment_freight_total. Null before booking."
        constraints: "2 decimal places"
      - name: fuel_surcharge_usd
        type: number
        source: computed
        description: "Fuel surcharge selected from the pre-surcharge base tier; see calculations.shipment_freight_total. Null before booking."
        constraints: "2 decimal places"
      - name: freight_total_usd
        type: number
        source: computed
        description: "base_freight_usd + fuel_surcharge_usd. Null before booking."
        constraints: "2 decimal places"
      - name: freight_per_ton_usd
        type: number
        source: computed
        description: "round(freight_total_usd / tons, 4). Null before booking."
        constraints: "4 decimal places"
      - name: received_tons
        type: number
        source: system
        description: "Tons acknowledged by the receiving terminal operator; null before delivery."
        constraints: "> 0 when set, 3 decimal places"
      - name: status
        type: enum
        source: system
        description: "Shipment lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, BOOKED, IN_TRANSIT, DELIVERED, CANCELLED}"
      - name: cancel_reason
        type: string
        source: system
        description: "Reason recorded when the shipment is cancelled, whether by operator action or by cascade; null otherwise."

  - name: PriceQuote
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the supplying site whose gas basis and posture price the quote."
      - name: product_line_id
        type: string
        source: input
        description: "FK -> ProductLine.id; the finished product being quoted."
      - name: quote_code
        type: string
        source: input
        description: "Quote code."
        constraints: "unique per plant_id; 2..16 chars"
      - name: tons
        type: number
        source: input
        description: "Tonnage the customer is asking for; drives the volume tier."
        constraints: "> 0, 3 decimal places"
      - name: pass_through_basis
        type: enum
        source: input
        description: "Which feedstock basis is passed through to the price."
        constraints: "one of {HEDGED_BLEND, SPOT_INDEX}"
      - name: expires_at
        type: datetime
        source: input
        description: "Instant after which the quote may no longer be accepted; its UTC month also selects the seasonal multiplier."
      - name: gas_basis_usd_per_mmbtu
        type: number
        source: computed
        description: "Gas unit price snapshotted at issue time from the selected basis; null before issue."
        constraints: "4 decimal places"
      - name: quoted_price_usd_per_ton
        type: number
        source: computed
        description: "Issued price; see calculations.quote_price_per_ton. Null before issue and after a revise."
        constraints: "2 decimal places"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issue; null before issue."
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, WITHDRAWN, EXPIRED}"
      - name: withdraw_reason
        type: string
        source: system
        description: "Reason recorded when the quote is withdrawn, whether by operator action or by posture cascade; null otherwise."

  - name: Turnaround
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the site whose outage crew and cranes are consumed."
      - name: train_id
        type: string
        source: input
        description: "FK -> ReformerTrain.id; the train taken down."
      - name: turnaround_code
        type: string
        source: input
        description: "Outage code."
        constraints: "unique per plant_id; 2..16 chars"
      - name: scope
        type: enum
        source: input
        description: "Work scope of the outage."
        constraints: "one of {CATALYST_CHANGE, COMBINED, VESSEL_INSPECTION}"
      - name: window_start
        type: datetime
        source: input
        description: "First day of the outage, inclusive (ISO 8601 UTC, three fractional digits)."
      - name: window_end
        type: datetime
        source: input
        description: "Last day of the outage, inclusive (ISO 8601 UTC, three fractional digits); must be strictly after window_start."
      - name: window_days
        type: number
        source: computed
        description: "Whole days from window_start to window_end, computed as (window_end - window_start) / 86400 seconds, truncated toward zero. Closed-interval semantics: both endpoints belong to the outage."
        constraints: ">= 1"
      - name: critical_path_days
        type: number
        source: computed
        description: "Longest chain through this outage's TurnaroundTask graph; see calculations.turnaround_task_schedule."
        default: 0
        constraints: ">= 0"
      - name: tasks_total_count
        type: integer
        source: computed
        description: "Count of TurnaroundTask rows whose turnaround_id == this turnaround."
        default: 0
      - name: tasks_done_count
        type: integer
        source: computed
        description: "Count of TurnaroundTask rows whose turnaround_id == this turnaround and whose status == DONE."
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: "The X-User-ID that created the turnaround. Read by the segregation-of-duties checks."
      - name: psm_review_decision
        type: enum
        source: system
        description: "Process-safety-management pre-startup review outcome."
        default: NONE
        constraints: "one of {NONE, ENDORSED, OBJECTED, VOID}"
      - name: psm_reviewed_by_user_id
        type: string
        source: system
        description: "The X-User-ID that signed the process-safety review; null while psm_review_decision == NONE."
      - name: psm_findings_count
        type: integer
        source: system
        description: "Open findings recorded by the process-safety review; null before the review."
        constraints: ">= 0 when set"
      - name: approved_by_user_id
        type: string
        source: system
        description: "The X-User-ID that approved the turnaround; null before approval."
      - name: status
        type: enum
        source: system
        description: "Outage lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, IN_PROGRESS, COMPLETED}"
      - name: rejection_reason
        type: string
        source: system
        description: "Reason recorded on rejection; cleared on revise; null otherwise."

  - name: TurnaroundTask
    parent: null
    common_fields: true
    entity_role: resource
    fields:
      - name: turnaround_id
        type: string
        source: input
        description: "FK -> Turnaround.id; the outage this task belongs to."
      - name: predecessor_task_id
        type: string
        source: input
        description: "FK -> TurnaroundTask.id; the task that must finish first, or null for a start task. Must belong to the same turnaround_id."
      - name: task_code
        type: string
        source: input
        description: "Task code."
        constraints: "unique per turnaround_id; 2..16 chars"
      - name: duration_days
        type: number
        source: input
        description: "Planned duration of the task in whole days."
        constraints: "> 0, integral value expressed as a number"
      - name: earliest_start_day
        type: number
        source: computed
        description: "Day offset from the outage's window_start at which this task can begin; see calculations.turnaround_task_schedule."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Task execution state."
        default: PENDING
        constraints: "one of {PENDING, READY, DONE, BLOCKED}"

  - name: EmissionsReading
    parent: null
    common_fields: false
    entity_role: event
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the monitored site."
      - name: pollutant
        type: enum
        source: input
        description: "Monitored species."
        constraints: "one of {N2O, NH3, NOX, PM}"
      - name: rate_lb_per_hour
        type: number
        source: input
        description: "Measured mass rate over the averaging period."
        constraints: ">= 0, 3 decimal places"
      - name: interval_hours
        type: number
        source: input
        description: "Length of the averaging period the rate represents."
        constraints: "> 0, 1 decimal place"
      - name: reading_at
        type: datetime
        source: input
        description: "Instant the averaging period closed (ISO 8601 UTC, three fractional digits). May not be after the logical clock."
      - name: tons
        type: number
        source: computed
        description: "rate_lb_per_hour * interval_hours / 2000, rounded half-up to 3 decimal places."
        constraints: ">= 0, 3 decimal places"
      - name: rolling_30d_tons
        type: number
        source: computed
        description: "Rolling 30-day mass for this plant_id and pollutant as of ingestion of this reading; see calculations.emissions_rolling_30d."
        constraints: ">= 0, 3 decimal places"
      - name: exceedance
        type: boolean
        source: computed
        description: "True when rolling_30d_tons > Plant.permit_limit_tons_30d at ingestion time; strict greater-than."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Plant
    shape: posture_driven
    initial_state: NORMAL
    terminal_states: []
    state_field: operating_posture
    transitions:
      - from: NORMAL
        to: RESTRICTED
        trigger: "system re-derivation after POST /nitrogen-ops/emissions-readings, POST /nitrogen-ops/plants/{id}/psm-program-status or POST /nitrogen-ops/plants/{id}/permit-status"
        actor: system
        preconditions:
          - "calculations.plant_operating_posture evaluates to RESTRICTED: permit_status == ACTIVE and exactly one pollutant exceeds permit_limit_tons_30d, or psm_program_status == OVERDUE with at most one pollutant exceeded"
        side_effects:
          - "Hop 1 — writes Plant.operating_posture = RESTRICTED and refreshes Plant.exceeded_pollutants."
          - "Hop 2 — because the posture became RESTRICTED, every PriceQuote whose plant_id == this plant, whose status == ISSUED and whose ProductLine.regulated == true transitions to WITHDRAWN with withdraw_reason = 'POSTURE_RESTRICTED'; the sweep processes candidates in issued_at ASC then created_at ASC order."
          - "increments Plant.version by 1 and the version of every withdrawn PriceQuote by 1."
        note: "New quotes issued while RESTRICTED carry the 1.06 posture factor of calculations.quote_price_per_ton instead of being blocked."
      - from: NORMAL
        to: FROZEN
        trigger: "system re-derivation after POST /nitrogen-ops/emissions-readings or POST /nitrogen-ops/plants/{id}/permit-status"
        actor: system
        preconditions:
          - "calculations.plant_operating_posture evaluates to FROZEN: permit_status == SUSPENDED, or two or more pollutants exceed permit_limit_tons_30d"
        side_effects:
          - "Hop 1 — writes Plant.operating_posture = FROZEN and refreshes Plant.exceeded_pollutants."
          - "Hop 2 — because the posture became FROZEN, every ProductionRun on this plant's trains whose status == APPROVED reverts to PLANNED with provisional_unit_cost_usd_per_ton cleared to null, processed in window_start ASC then created_at ASC order."
          - "Hop 3 — because those runs left APPROVED, every ProductionOrder whose run_id is one of the reverted runs and whose allocation_status == RESERVED transitions to RELEASED with release_reason = 'PLANT_FROZEN'."
          - "every PriceQuote whose plant_id == this plant and whose status == ISSUED transitions to WITHDRAWN with withdraw_reason = 'POSTURE_FROZEN'."
          - "increments Plant.version by 1 and the version of every mutated child by 1."
      - from: RESTRICTED
        to: FROZEN
        trigger: "system re-derivation after POST /nitrogen-ops/emissions-readings or POST /nitrogen-ops/plants/{id}/permit-status"
        actor: system
        preconditions:
          - "calculations.plant_operating_posture evaluates to FROZEN"
        side_effects:
          - "same side-effect set as NORMAL -> FROZEN"
      - from: RESTRICTED
        to: NORMAL
        trigger: "system re-derivation after POST /nitrogen-ops/plants/{id}/psm-program-status or POST /nitrogen-ops/plants/{id}/permit-status or POST /nitrogen-ops/_clock/set_current_utc (the 30-day window slides and stale readings drop out)"
        actor: system
        preconditions:
          - "calculations.plant_operating_posture evaluates to NORMAL"
        side_effects:
          - "writes Plant.operating_posture = NORMAL, empties Plant.exceeded_pollutants, increments Plant.version by 1"
          - "already-WITHDRAWN quotes are NOT reinstated; they must be revised back to DRAFT explicitly"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system re-derivation after POST /nitrogen-ops/plants/{id}/permit-status or POST /nitrogen-ops/_clock/set_current_utc"
        actor: system
        preconditions:
          - "calculations.plant_operating_posture evaluates to RESTRICTED"
        side_effects:
          - "writes Plant.operating_posture = RESTRICTED, refreshes Plant.exceeded_pollutants, increments Plant.version by 1"
      - from: FROZEN
        to: NORMAL
        trigger: "system re-derivation after POST /nitrogen-ops/plants/{id}/permit-status or POST /nitrogen-ops/_clock/set_current_utc"
        actor: system
        preconditions:
          - "calculations.plant_operating_posture evaluates to NORMAL"
        side_effects:
          - "writes Plant.operating_posture = NORMAL, empties Plant.exceeded_pollutants, increments Plant.version by 1"

  - entity: ReformerTrain
    shape: guarded
    initial_state: IDLE
    terminal_states: []
    state_field: status
    transitions:
      - from: IDLE
        to: RUNNING
        trigger: "POST /nitrogen-ops/production-runs/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "the starting ProductionRun.train_id == this train"
          - "this train has a CatalystCharge with status == ACTIVE"
        side_effects:
          - "increments ReformerTrain.version by 1"
      - from: RUNNING
        to: IDLE
        trigger: "POST /nitrogen-ops/production-runs/{id}/complete or POST /nitrogen-ops/production-runs/{id}/abort"
        actor: ProcessEngineer
        preconditions:
          - "no other ProductionRun on this train has status == RUNNING after the triggering transition"
          - "the train's ACTIVE charge still has activity_pct >= 55.00 after the completion recompute"
        side_effects:
          - "increments ReformerTrain.version by 1"
      - from: RUNNING
        to: DERATED
        trigger: "cascade from POST /nitrogen-ops/production-runs/{id}/complete or PATCH /nitrogen-ops/catalyst-charges/{id}"
        actor: system
        preconditions:
          - "the train's formerly ACTIVE CatalystCharge has just transitioned to SPENT because its recomputed activity_pct < 55.00"
        side_effects:
          - "Hop 3 of the catalyst-derate cascade — because the charge became SPENT, this train becomes DERATED."
          - "Hop 4 — because this train became DERATED, every ProductionRun on it whose status == APPROVED reverts to PLANNED with provisional_unit_cost_usd_per_ton cleared to null, processed in window_start ASC then created_at ASC order."
          - "increments ReformerTrain.version by 1 and the version of every reverted ProductionRun by 1"
      - from: IDLE
        to: DERATED
        trigger: "cascade from PATCH /nitrogen-ops/catalyst-charges/{id}"
        actor: system
        preconditions:
          - "the train's ACTIVE CatalystCharge has just transitioned to SPENT because its recomputed activity_pct < 55.00"
        side_effects:
          - "same hop 3 / hop 4 side-effect set as RUNNING -> DERATED"
      - from: DERATED
        to: IDLE
        trigger: "POST /nitrogen-ops/catalyst-charges/{id}/regenerate or POST /nitrogen-ops/turnarounds/{id}/complete"
        actor: system
        preconditions:
          - "this train now has a CatalystCharge with status == ACTIVE and activity_pct >= 55.00"
        side_effects:
          - "increments ReformerTrain.version by 1"
      - from: IDLE
        to: DOWN_FOR_TURNAROUND
        trigger: "POST /nitrogen-ops/turnarounds/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "the starting Turnaround.train_id == this train"
        side_effects:
          - "Hop 1 of the outage cascade; see Turnaround APPROVED -> IN_PROGRESS."
          - "increments ReformerTrain.version by 1"
      - from: RUNNING
        to: DOWN_FOR_TURNAROUND
        trigger: "POST /nitrogen-ops/turnarounds/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "the starting Turnaround.train_id == this train"
        side_effects:
          - "Hop 1 of the outage cascade; see Turnaround APPROVED -> IN_PROGRESS."
          - "increments ReformerTrain.version by 1"
      - from: DERATED
        to: DOWN_FOR_TURNAROUND
        trigger: "POST /nitrogen-ops/turnarounds/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "the starting Turnaround.train_id == this train"
        side_effects:
          - "Hop 1 of the outage cascade; see Turnaround APPROVED -> IN_PROGRESS."
          - "increments ReformerTrain.version by 1"
      - from: DOWN_FOR_TURNAROUND
        to: IDLE
        trigger: "POST /nitrogen-ops/turnarounds/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "this train has a CatalystCharge with status == ACTIVE and activity_pct >= 55.00 after the completion's catalyst side effects"
        side_effects:
          - "increments ReformerTrain.version by 1"
      - from: DOWN_FOR_TURNAROUND
        to: DERATED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "this train has no CatalystCharge with status == ACTIVE and activity_pct >= 55.00 after the completion's catalyst side effects (a VESSEL_INSPECTION-only outage that left a SPENT charge in place)"
        side_effects:
          - "increments ReformerTrain.version by 1"

  - entity: CatalystCharge
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    state_field: status
    transitions:
      - from: ACTIVE
        to: SPENT
        trigger: "system recompute after POST /nitrogen-ops/production-runs/{id}/complete or PATCH /nitrogen-ops/catalyst-charges/{id}"
        actor: system
        preconditions:
          - "the recomputed activity_pct < 55.00"
        side_effects:
          - "Hop 2 of the catalyst-derate cascade — because cumulative_operating_hours (or poisoning_index) moved, activity_pct fell under CATALYST_MIN_ACTIVITY_PCT and the charge becomes SPENT."
          - "Hop 3 — because this charge became SPENT, ReformerTrain(train_id).status becomes DERATED (see ReformerTrain RUNNING -> DERATED for hop 4)."
          - "clears ReformerTrain.active_charge_id to null"
          - "increments CatalystCharge.version by 1"
      - from: SPENT
        to: ACTIVE
        trigger: "POST /nitrogen-ops/catalyst-charges/{id}/regenerate or POST /nitrogen-ops/production-runs/{id}/reopen"
        actor: ProcessEngineer
        preconditions:
          - "the recomputed activity_pct >= 55.00 after regeneration_count is incremented, or after the reopened run's actual_operating_hours are subtracted from cumulative_operating_hours"
          - "no other CatalystCharge on the same train_id has status == ACTIVE"
        side_effects:
          - "restores ReformerTrain.active_charge_id to this charge id"
          - "ReformerTrain.status DERATED -> IDLE when the train has no RUNNING run, or DERATED -> RUNNING when the reopened run resumes"
          - "increments CatalystCharge.version by 1 and ReformerTrain.version by 1"
        note: "This is the revision loop that makes CatalystCharge non-linear."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /nitrogen-ops/catalyst-charges/{id}/regenerate"
        actor: ProcessEngineer
        preconditions:
          - "regeneration_count < 3"
        side_effects:
          - "increments regeneration_count by 1, recomputes activity_pct and calendar_activity_pct, increments CatalystCharge.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/complete with scope in {CATALYST_CHANGE, COMBINED}"
        actor: ProcessEngineer
        preconditions:
          - "the completing Turnaround.train_id == this charge's train_id"
        side_effects:
          - "creates a replacement CatalystCharge on the same train with status ACTIVE, charge_code = new_charge_code, design_life_hours = new_charge_design_life_hours, baseline_operating_hours = 0, poisoning_index = 0.00, regeneration_count = 0, installed_at = logical clock"
          - "sets ReformerTrain.active_charge_id to the replacement charge id"
          - "increments CatalystCharge.version by 1"
      - from: SPENT
        to: RETIRED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/complete with scope in {CATALYST_CHANGE, COMBINED}"
        actor: ProcessEngineer
        preconditions:
          - "the completing Turnaround.train_id == this charge's train_id"
        side_effects:
          - "same replacement-charge side-effect set as ACTIVE -> RETIRED"

  - entity: GasHedgeLot
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    state_field: status
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system recompute after POST /nitrogen-ops/production-runs/{id}/complete"
        actor: system
        preconditions:
          - "the chronological hedge waterfall of calculations.run_ammonia_unit_cost variant FINAL drew this lot down to remaining_mmbtu == 0"
        side_effects:
          - "writes consumed_mmbtu and remaining_mmbtu, recomputes Plant.hedged_blend_usd_per_mmbtu, increments GasHedgeLot.version by 1 and Plant.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /nitrogen-ops/production-runs/{id}/reopen"
        actor: ProcessEngineer
        preconditions:
          - "the reopened run had drawn volume from this lot, so restoring it leaves remaining_mmbtu > 0"
        side_effects:
          - "decrements consumed_mmbtu by exactly the volume this run had drawn, recomputes remaining_mmbtu and Plant.hedged_blend_usd_per_mmbtu, increments GasHedgeLot.version by 1 and Plant.version by 1"

  - entity: ProductionRun
    shape: cyclic
    initial_state: PLANNED
    terminal_states: [ABORTED]
    state_field: status
    transitions:
      - from: PLANNED
        to: APPROVED
        trigger: "POST /nitrogen-ops/production-runs/{id}/approve"
        actor: ProcessEngineer
        preconditions:
          - "Plant(ReformerTrain(train_id).plant_id).operating_posture != FROZEN"
          - "ReformerTrain(train_id).status is in {IDLE, RUNNING}"
          - "ReformerTrain(train_id) has a CatalystCharge whose status == ACTIVE"
          - "that ACTIVE charge's activity_pct >= 55.00"
          - "no other ProductionRun on train_id whose status is in {APPROVED, RUNNING, COMPLETED} has a half-open window [window_start, window_end) that intersects this run's window"
        side_effects:
          - "writes provisional_unit_cost_usd_per_ton from calculations.run_ammonia_unit_cost variant PROVISIONAL"
          - "increments ProductionRun.version by 1"
      - from: APPROVED
        to: PLANNED
        trigger: "cascade from POST /nitrogen-ops/turnarounds/{id}/start, from a catalyst SPENT derate, or from a plant FROZEN posture re-derivation"
        actor: system
        preconditions:
          - "ReformerTrain(train_id).status became DOWN_FOR_TURNAROUND or DERATED, or Plant.operating_posture became FROZEN"
        side_effects:
          - "clears provisional_unit_cost_usd_per_ton to null"
          - "increments ProductionRun.version by 1"
        note: "The revert arm that makes this machine non-linear together with COMPLETED -> RUNNING."
      - from: APPROVED
        to: RUNNING
        trigger: "POST /nitrogen-ops/production-runs/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "the logical clock is at or after window_start"
          - "Plant(ReformerTrain(train_id).plant_id).operating_posture != FROZEN"
          - "ReformerTrain(train_id).status is in {IDLE, RUNNING}"
          - "ReformerTrain(train_id) has a CatalystCharge whose status == ACTIVE and whose activity_pct >= 55.00"
        side_effects:
          - "pins catalyst_charge_id to that ACTIVE charge id"
          - "ReformerTrain(train_id).status IDLE -> RUNNING"
          - "increments ProductionRun.version by 1 and ReformerTrain.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /nitrogen-ops/production-runs/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "the logical clock is at or after window_start"
          - "actual_ammonia_tons > 0 and actual_operating_hours > 0"
          - "actual_ammonia_tons >= the summed allocated_ammonia_tons of this run's ProductionOrder rows whose allocation_status is in {RESERVED, CONSUMED}; settling below what has already been promised is rejected with ERR_AMMONIA_BALANCE_EXCEEDED"
        side_effects:
          - "writes actual_ammonia_tons and actual_operating_hours from the request body"
          - "runs the chronological hedge waterfall of calculations.run_ammonia_unit_cost variant FINAL, writing consumed_gas_mmbtu, incrementing each drawn GasHedgeLot.consumed_mmbtu and flipping any lot reaching remaining_mmbtu == 0 to CLOSED, then recomputing Plant.hedged_blend_usd_per_mmbtu"
          - "writes final_unit_cost_usd_per_ton"
          - "switches the ammonia pool basis from target_ammonia_tons to actual_ammonia_tons and recomputes unallocated_ammonia_tons against this run's already-RESERVED and CONSUMED orders"
          - "Hop 1 of the catalyst-derate cascade — adds actual_operating_hours to CatalystCharge(catalyst_charge_id).cumulative_operating_hours and recomputes calendar_activity_pct and activity_pct."
          - "Hop 2 — when the recomputed activity_pct < 55.00 the charge transitions ACTIVE -> SPENT (see CatalystCharge ACTIVE -> SPENT for hops 3 and 4)."
          - "ReformerTrain(train_id).status RUNNING -> IDLE when the charge is still ACTIVE, or RUNNING -> DERATED when it just became SPENT"
          - "increments ProductionRun.version by 1"
      - from: COMPLETED
        to: RUNNING
        trigger: "POST /nitrogen-ops/production-runs/{id}/reopen"
        actor: ProcessEngineer
        preconditions:
          - "no ProductionOrder whose run_id == this run has allocation_status == CONSUMED"
          - "Plant(ReformerTrain(train_id).plant_id).operating_posture != FROZEN"
          - "ReformerTrain(train_id).status != DOWN_FOR_TURNAROUND"
        side_effects:
          - "restores every GasHedgeLot this run drew from by decrementing consumed_mmbtu by exactly the volume drawn, flipping CLOSED lots back to OPEN where remaining_mmbtu > 0, and recomputing Plant.hedged_blend_usd_per_mmbtu"
          - "resets consumed_gas_mmbtu to 0 and clears final_unit_cost_usd_per_ton to null"
          - "subtracts actual_operating_hours from CatalystCharge(catalyst_charge_id).cumulative_operating_hours and recomputes activity_pct; a SPENT charge returns to ACTIVE when the recomputed activity_pct >= 55.00"
          - "releases every ProductionOrder on this run whose allocation_status == RESERVED to RELEASED with release_reason = 'RUN_REOPENED', ordered by ProductLine.priority_rank DESC then ProductionOrder.created_at ASC"
          - "clears actual_ammonia_tons and actual_operating_hours to null, so the ammonia pool basis reverts to target_ammonia_tons; with every RESERVED order released, unallocated_ammonia_tons returns to target_ammonia_tons"
          - "writes reopen_reason from the request body; ReformerTrain.status -> RUNNING"
          - "increments ProductionRun.version by 1"
        note: "The revision loop; this is what makes the machine cyclic rather than a pipeline."
      - from: RUNNING
        to: ABORTED
        trigger: "POST /nitrogen-ops/production-runs/{id}/abort, or cascade from POST /nitrogen-ops/turnarounds/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "no GasHedgeLot volume has been drawn by this run (a RUNNING run has never drawn any)"
        side_effects:
          - "writes abort_reason ('TRAIN_DOWN_FOR_TURNAROUND' when driven by the outage cascade, otherwise the request body value)"
          - "Hop 3 of the outage cascade — because this run left RUNNING, every ProductionOrder whose run_id == this run and whose allocation_status == RESERVED transitions to RELEASED with release_reason = 'RUN_ABORTED', ordered by ProductLine.priority_rank DESC then ProductionOrder.created_at ASC."
          - "ReformerTrain(train_id).status RUNNING -> IDLE unless the outage cascade already set DOWN_FOR_TURNAROUND"
          - "increments ProductionRun.version by 1"
      - from: APPROVED
        to: ABORTED
        trigger: "POST /nitrogen-ops/production-runs/{id}/abort"
        actor: ProcessEngineer
        preconditions: []
        side_effects:
          - "writes abort_reason, clears provisional_unit_cost_usd_per_ton to null, increments ProductionRun.version by 1"

  - entity: ProductionOrder
    shape: parallel
    initial_state: "allocation_status=UNALLOCATED x security_status=PENDING|EXEMPT"
    terminal_states: []
    state_field: "allocation_status (dimension A) and security_status (dimension B) advance without reference to each other"
    transitions:
      - from: "A:UNALLOCATED"
        to: "A:RESERVED"
        trigger: "POST /nitrogen-ops/production-orders/{id}/reserve"
        actor: CommercialManager
        preconditions:
          - "ProductionRun(run_id).status is in {APPROVED, RUNNING, COMPLETED}"
          - "Plant(ReformerTrain(ProductionRun(run_id).train_id).plant_id).operating_posture != FROZEN"
          - "expected_run_version equals ProductionRun(run_id).version"
          - "round(reserve_tons * ProductLine(product_line_id).ammonia_tons_per_product_ton, 3) <= ProductionRun(run_id).unallocated_ammonia_tons"
          - "StorageAsset(destination_asset_id).on_hand_tons + the summed reserved_tons of that asset's other RESERVED orders + reserve_tons <= StorageAsset.capacity_tons"
        side_effects:
          - "writes reserved_tons and allocated_ammonia_tons"
          - "decrements ProductionRun(run_id).unallocated_ammonia_tons by allocated_ammonia_tons"
          - "increments ProductionRun.version by 1 (this is the OCC advance concurrency_rules.order-reserve-stale-run guards) and ProductionOrder.version by 1"
      - from: "A:RESERVED"
        to: "A:RELEASED"
        trigger: "POST /nitrogen-ops/production-orders/{id}/release, or cascade from a run abort, a run reopen or a plant FROZEN posture re-derivation"
        actor: CommercialManager
        preconditions:
          - "allocation_status == RESERVED"
        side_effects:
          - "writes release_reason, resets reserved_tons and allocated_ammonia_tons to 0"
          - "increments ProductionRun(run_id).unallocated_ammonia_tons by exactly the allocated_ammonia_tons being released, restoring the ammonia-conservation invariant"
          - "Hop 4 of the outage cascade — because this order released, every Shipment whose production_order_id == this order and whose status is in {DRAFT, BOOKED} transitions to CANCELLED with cancel_reason = 'UPSTREAM_ALLOCATION_RELEASED'."
          - "increments ProductionOrder.version by 1 and ProductionRun.version by 1"
      - from: "A:RELEASED"
        to: "A:RESERVED"
        trigger: "POST /nitrogen-ops/production-orders/{id}/reserve"
        actor: CommercialManager
        preconditions:
          - "same preconditions as UNALLOCATED -> RESERVED"
        side_effects:
          - "same side-effect set as UNALLOCATED -> RESERVED, and clears release_reason to null"
      - from: "A:RESERVED"
        to: "A:CONSUMED"
        trigger: "POST /nitrogen-ops/production-orders/{id}/produce"
        actor: ProcessEngineer
        preconditions:
          - "security_status is in {CLEARED, EXEMPT}"
          - "produced_tons <= reserved_tons"
          - "StorageAsset(destination_asset_id).product_code == ProductLine(product_line_id).product_code"
          - "StorageAsset(destination_asset_id).on_hand_tons + produced_tons <= StorageAsset.capacity_tons"
          - "when ProductLine.regulated == true, StorageAsset(destination_asset_id).security_class is in {CONTROLLED, HIGH_SECURITY}"
        side_effects:
          - "writes produced_tons and landed_cost_usd from calculations.production_order_landed_cost"
          - "increments StorageAsset(destination_asset_id).on_hand_tons by produced_tons and recomputes reserved_tons, seasonal_reserve_tons and available_tons"
          - "increments ProductionOrder.version by 1 and StorageAsset.version by 1"
      - from: "B:PENDING"
        to: "B:CLEARED"
        trigger: "POST /nitrogen-ops/production-orders/{id}/security-check with decision CLEARED"
        actor: SafetyOfficer
        preconditions:
          - "ProductLine(product_line_id).regulated == true (a non-regulated line is EXEMPT at creation and has no PENDING state)"
        side_effects:
          - "increments ProductionOrder.version by 1"
        note: "Independent of dimension A: an order may be CLEARED while still UNALLOCATED, or RESERVED while still PENDING."
      - from: "B:PENDING"
        to: "B:DENIED"
        trigger: "POST /nitrogen-ops/production-orders/{id}/security-check with decision DENIED"
        actor: SafetyOfficer
        preconditions:
          - "ProductLine(product_line_id).regulated == true"
        side_effects:
          - "increments ProductionOrder.version by 1"
      - from: "B:DENIED"
        to: "B:PENDING"
        trigger: "POST /nitrogen-ops/production-orders/{id}/security-check with decision PENDING"
        actor: SafetyOfficer
        preconditions:
          - "ProductLine(product_line_id).regulated == true"
        side_effects:
          - "increments ProductionOrder.version by 1"
        note: "Re-submission loop after the customer's security paperwork is corrected."

  - entity: Shipment
    shape: branching
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    state_field: status
    transitions:
      - from: DRAFT
        to: BOOKED
        trigger: "POST /nitrogen-ops/shipments/{id}/book"
        actor: LogisticsCoordinator
        preconditions:
          - "Plant(StorageAsset(origin_asset_id).plant_id).operating_posture != FROZEN"
          - "expected_origin_asset_version equals StorageAsset(origin_asset_id).version"
          - "StorageAsset(origin_asset_id).product_code == StorageAsset(dest_asset_id).product_code"
          - "when production_order_id is non-null, origin_asset_id == ProductionOrder(production_order_id).destination_asset_id and that order's allocation_status is in {RESERVED, CONSUMED}"
          - "when the ProductLine whose product_code equals StorageAsset(origin_asset_id).product_code has regulated == true, both StorageAsset(origin_asset_id).security_class and StorageAsset(dest_asset_id).security_class are in {CONTROLLED, HIGH_SECURITY}"
          - "aggregate-capacity overlap check on the origin asset: for every instant covered by this shipment's half-open window, the summed tons of the origin asset's Shipment rows with status in {BOOKED, IN_TRANSIT} whose half-open windows cover that instant, plus this shipment's tons, is <= StorageAsset(origin_asset_id).on_hand_tons - StorageAsset(origin_asset_id).seasonal_reserve_tons"
          - "StorageAsset(dest_asset_id).on_hand_tons + the summed tons of that asset's inbound Shipment rows with status in {BOOKED, IN_TRANSIT} + tons <= StorageAsset(dest_asset_id).capacity_tons"
        side_effects:
          - "writes base_freight_usd, fuel_surcharge_usd, freight_total_usd and freight_per_ton_usd from calculations.shipment_freight_total"
          - "recomputes StorageAsset(origin_asset_id).reserved_tons and available_tons"
          - "increments StorageAsset(origin_asset_id).version by 1 (the OCC advance concurrency_rules.shipment-book-stale-storage guards) and Shipment.version by 1"
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /nitrogen-ops/shipments/{id}/depart"
        actor: LogisticsCoordinator
        preconditions:
          - "the logical clock is at or after window_start"
        side_effects:
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /nitrogen-ops/shipments/{id}/deliver"
        actor: TerminalOperator
        preconditions:
          - "the acting X-User-ID equals dest_asset_id"
          - "received_tons > 0 and received_tons <= tons"
          - "StorageAsset(dest_asset_id).on_hand_tons + received_tons <= StorageAsset(dest_asset_id).capacity_tons"
        side_effects:
          - "writes received_tons"
          - "decrements StorageAsset(origin_asset_id).on_hand_tons by tons and increments StorageAsset(dest_asset_id).on_hand_tons by received_tons"
          - "recomputes reserved_tons, seasonal_reserve_tons and available_tons on both assets"
          - "increments Shipment.version by 1 and the version of both StorageAsset rows by 1"
        note: "tons - received_tons is transit loss and simply disappears from the network; the storage-tonnage invariant is stated over received_tons."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /nitrogen-ops/shipments/{id}/cancel, or cascade from a ProductionOrder release"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "writes cancel_reason, increments Shipment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /nitrogen-ops/shipments/{id}/cancel, or cascade from a ProductionOrder release"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "writes cancel_reason ('UPSTREAM_ALLOCATION_RELEASED' when driven by the outage cascade, otherwise the request body value)"
          - "Hop 5 of the outage cascade — because this shipment left BOOKED, StorageAsset(origin_asset_id).reserved_tons and available_tons are recomputed."
          - "increments Shipment.version by 1 and StorageAsset(origin_asset_id).version by 1"

  - entity: PriceQuote
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    state_field: status
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /nitrogen-ops/price-quotes/{id}/issue"
        actor: CommercialManager
        preconditions:
          - "Plant(plant_id).operating_posture != FROZEN"
          - "the logical clock is strictly before expires_at"
        side_effects:
          - "snapshots gas_basis_usd_per_mmbtu from Plant.hedged_blend_usd_per_mmbtu or Plant.spot_gas_index_usd_per_mmbtu per pass_through_basis"
          - "writes quoted_price_usd_per_ton from calculations.quote_price_per_ton and issued_at from the logical clock"
          - "increments PriceQuote.version by 1"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /nitrogen-ops/price-quotes/{id}/withdraw, or cascade from a plant posture re-derivation to RESTRICTED or FROZEN"
        actor: CommercialManager
        preconditions: []
        side_effects:
          - "writes withdraw_reason, increments PriceQuote.version by 1"
      - from: WITHDRAWN
        to: DRAFT
        trigger: "POST /nitrogen-ops/price-quotes/{id}/revise"
        actor: CommercialManager
        preconditions: []
        side_effects:
          - "optionally overwrites tons, pass_through_basis and expires_at from the request body"
          - "clears quoted_price_usd_per_ton, gas_basis_usd_per_mmbtu, issued_at and withdraw_reason to null"
          - "increments PriceQuote.version by 1"
        note: "The negotiation loop DRAFT -> ISSUED -> WITHDRAWN -> DRAFT; a revised quote is re-priced at the gas basis prevailing when it is re-issued, not the original one."
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /nitrogen-ops/price-quotes/expire-due"
        actor: CommercialManager
        preconditions:
          - "the logical clock is at or after expires_at"
        side_effects:
          - "increments PriceQuote.version by 1"
        note: "Ops-run checkpoint: the sweep processes candidates in expires_at ASC then created_at ASC order and returns the count and ids it moved."
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /nitrogen-ops/price-quotes/expire-due"
        actor: CommercialManager
        preconditions:
          - "the logical clock is at or after expires_at"
        side_effects:
          - "increments PriceQuote.version by 1"

  - entity: Turnaround
    shape: branching
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    state_field: status
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/submit"
        actor: ProcessEngineer
        preconditions:
          - "tasks_total_count >= 1"
          - "critical_path_days <= window_days"
        side_effects:
          - "increments Turnaround.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/approve"
        actor: SafetyOfficer
        preconditions:
          - "psm_review_decision == ENDORSED"
          - "the acting X-User-ID differs from authored_by_user_id AND from psm_reviewed_by_user_id"
          - "no other Turnaround on the same plant_id whose status is in {APPROVED, IN_PROGRESS, COMPLETED} has a closed window [window_start, window_end] that intersects this one, and every such neighbour is separated from this window by at least 14 whole days"
          - "critical_path_days <= window_days"
        side_effects:
          - "writes approved_by_user_id from the acting X-User-ID"
          - "increments Turnaround.version by 1 and Plant.version by 1"
        note: "The APPROVE arm of the fork; its side-effect set is disjoint from the REJECT arm's."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/reject"
        actor: SafetyOfficer
        preconditions:
          - "the acting X-User-ID differs from authored_by_user_id"
        side_effects:
          - "writes rejection_reason"
          - "sets psm_review_decision to VOID and clears psm_findings_count to null"
          - "sets every TurnaroundTask of this turnaround whose status is in {PENDING, READY} to BLOCKED"
          - "increments Turnaround.version by 1 and the version of every blocked TurnaroundTask by 1"
        note: "The REJECT arm of the fork; it voids the safety review and blocks the task graph, none of which the APPROVE arm does."
      - from: REJECTED
        to: DRAFT
        trigger: "POST /nitrogen-ops/turnarounds/{id}/revise"
        actor: ProcessEngineer
        preconditions:
          - "the acting X-User-ID equals authored_by_user_id"
        side_effects:
          - "clears rejection_reason to null and resets psm_review_decision to NONE with psm_reviewed_by_user_id cleared to null"
          - "sets every BLOCKED TurnaroundTask of this turnaround back to PENDING"
          - "increments Turnaround.version by 1 and the version of every unblocked TurnaroundTask by 1"
        note: "Closes the loop DRAFT -> SUBMITTED -> REJECTED -> DRAFT."
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /nitrogen-ops/turnarounds/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "the logical clock is at or after window_start"
          - "psm_review_decision == ENDORSED"
        side_effects:
          - "Hop 1 — sets ReformerTrain(train_id).status to DOWN_FOR_TURNAROUND from IDLE, RUNNING or DERATED."
          - "Hop 2 — because the train became DOWN_FOR_TURNAROUND, every ProductionRun on that train whose status == RUNNING transitions to ABORTED with abort_reason = 'TRAIN_DOWN_FOR_TURNAROUND', and every ProductionRun on that train whose status == APPROVED reverts to PLANNED with provisional_unit_cost_usd_per_ton cleared to null; both sweeps process candidates in window_start ASC then created_at ASC order."
          - "Hop 3 — because those runs left RUNNING, every ProductionOrder whose run_id is one of the aborted runs and whose allocation_status == RESERVED transitions to RELEASED with release_reason = 'RUN_ABORTED', restoring ProductionRun.unallocated_ammonia_tons; the sweep orders candidates by ProductLine.priority_rank DESC then ProductionOrder.created_at ASC."
          - "Hop 4 — because those orders released, every Shipment whose production_order_id is one of the released orders and whose status is in {DRAFT, BOOKED} transitions to CANCELLED with cancel_reason = 'UPSTREAM_ALLOCATION_RELEASED'."
          - "Hop 5 — because those shipments left BOOKED, StorageAsset.reserved_tons and available_tons are recomputed on every affected origin asset."
          - "sets every TurnaroundTask of this turnaround whose predecessor_task_id is null and whose status == PENDING to READY."
          - "increments Turnaround.version by 1 and the version of every mutated ReformerTrain, ProductionRun, ProductionOrder, Shipment, StorageAsset and TurnaroundTask by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /nitrogen-ops/turnarounds/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "tasks_done_count == tasks_total_count"
          - "psm_review_decision == ENDORSED"
          - "when scope is in {CATALYST_CHANGE, COMBINED}, new_charge_code and new_charge_design_life_hours are present and new_charge_code is unique on the train"
        side_effects:
          - "when scope is in {CATALYST_CHANGE, COMBINED}: retires the train's current CatalystCharge (ACTIVE or SPENT -> RETIRED) and creates a replacement charge with baseline_operating_hours = 0, poisoning_index = 0.00, regeneration_count = 0, status ACTIVE"
          - "when scope is in {VESSEL_INSPECTION, COMBINED}: writes Plant.last_vessel_inspection_at from the logical clock"
          - "sets Plant.psm_program_status to CURRENT and re-derives Plant.operating_posture"
          - "ReformerTrain(train_id).status DOWN_FOR_TURNAROUND -> IDLE when the train ends with an ACTIVE charge at activity_pct >= 55.00, otherwise -> DERATED"
          - "increments Turnaround.version by 1, ReformerTrain.version by 1, Plant.version by 1 and CatalystCharge.version by 1"

  - entity: TurnaroundTask
    shape: compound
    initial_state: PENDING
    terminal_states: []
    state_field: status
    transitions:
      - from: PENDING
        to: READY
        trigger: "cascade from POST /nitrogen-ops/turnarounds/{id}/start (start tasks) or from POST /nitrogen-ops/turnaround-tasks/{id}/complete (successor tasks)"
        actor: system
        preconditions:
          - "Turnaround(turnaround_id).status == IN_PROGRESS"
          - "predecessor_task_id is null, or TurnaroundTask(predecessor_task_id).status == DONE"
        side_effects:
          - "increments TurnaroundTask.version by 1"
      - from: READY
        to: DONE
        trigger: "POST /nitrogen-ops/turnaround-tasks/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "Turnaround(turnaround_id).status == IN_PROGRESS"
          - "predecessor_task_id is null, or TurnaroundTask(predecessor_task_id).status == DONE"
        side_effects:
          - "increments Turnaround(turnaround_id).tasks_done_count by 1"
          - "every TurnaroundTask whose predecessor_task_id == this task and whose status == PENDING transitions to READY, processed in created_at ASC order"
          - "increments TurnaroundTask.version by 1 and Turnaround.version by 1"
      - from: PENDING
        to: BLOCKED
        trigger: "cascade from POST /nitrogen-ops/turnarounds/{id}/reject"
        actor: system
        preconditions: []
        side_effects:
          - "increments TurnaroundTask.version by 1"
      - from: READY
        to: BLOCKED
        trigger: "cascade from POST /nitrogen-ops/turnarounds/{id}/reject"
        actor: system
        preconditions: []
        side_effects:
          - "increments TurnaroundTask.version by 1"
      - from: BLOCKED
        to: PENDING
        trigger: "cascade from POST /nitrogen-ops/turnarounds/{id}/revise"
        actor: system
        preconditions: []
        side_effects:
          - "increments TurnaroundTask.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: order-reserve-stale-run
    parent_entity: ProductionRun
    write_endpoint: "POST /nitrogen-ops/production-orders/{id}/reserve"
    occ_field: "expected_run_version"
    description: |
      Reserving ammonia against a ProductionRun whose version has advanced since the client last read
      it is rejected. A reservation legitimately succeeds whenever the run still has enough
      unallocated ammonia, so a writer working from a stale view of the run cannot be distinguished
      from a correct one by state alone; the stale-version check makes the outcome deterministic.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412
  - rule_id: shipment-book-stale-storage
    parent_entity: StorageAsset
    write_endpoint: "POST /nitrogen-ops/shipments/{id}/book"
    occ_field: "expected_origin_asset_version"
    description: |
      Booking a shipment out of a StorageAsset whose version has advanced since the client last read
      it is rejected. Because the aggregate-capacity rule permits several bookings to occupy the same
      window, a second booking is legitimate on its own terms; the stale-version check pins which
      view of the asset the booking was priced and sized against.
    error_id: ERR_STALE_STORAGE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: plant_hedged_blend
    trigger: "Recomputed on Plant read and after any GasHedgeLot create/close and after any ProductionRun completion that consumes hedged gas; written to Plant.hedged_blend_usd_per_mmbtu."
    algorithm: weighted_scoring
    formula: |
      pool = GasHedgeLot rows where plant_id == plant.id
                                AND status == 'OPEN'
                                AND remaining_mmbtu > 0
      if pool is empty:
          hedged_blend_usd_per_mmbtu = null          # callers fall back to spot_gas_index_usd_per_mmbtu
      else:
          numerator   = sum over pool of (lot.remaining_mmbtu * lot.strike_price_usd_per_mmbtu)
          denominator = sum over pool of lot.remaining_mmbtu
          hedged_blend_usd_per_mmbtu = round_half_up(numerator / denominator, 4)
      hedged_volume_mmbtu = denominator (0 when the pool is empty)
    input_set: "GasHedgeLot rows on the plant with status == OPEN and remaining_mmbtu > 0. CLOSED lots and fully-consumed lots (remaining_mmbtu == 0) are excluded even before the close endpoint runs, so a lot drained to zero by a production run stops influencing the blend in the same request that drained it."
    constants: {}
    precision: "hedged_blend_usd_per_mmbtu: 4 decimal places, round_half_up. hedged_volume_mmbtu: integer MMBtu, exact."

  - name: run_ammonia_unit_cost
    trigger: "PROVISIONAL variant on POST /nitrogen-ops/production-runs/{id}/approve; FINAL variant on POST /nitrogen-ops/production-runs/{id}/complete."
    algorithm: waterfall_allocation
    formula: |
      required_mmbtu = ammonia_tons * GAS_INTENSITY_MMBTU_PER_TON        # ammonia_tons per variant

      # Waterfall: draw from the eligible hedge lots in the variant's declared order,
      # then buy any shortfall at the plant's spot index.
      remaining_need = required_mmbtu
      gas_cost       = 0                                                 # full precision, never rounded here
      for lot in eligible_lots (in the variant's sort order):
          if remaining_need == 0: break
          draw           = min(lot.remaining_mmbtu, remaining_need)
          gas_cost      += draw * lot.strike_price_usd_per_mmbtu
          remaining_need -= draw
      if remaining_need > 0:
          gas_cost += remaining_need * plant.spot_gas_index_usd_per_mmbtu

      # ONE rounding, at the very end. Do NOT round gas_cost, do NOT round the
      # per-ton gas component, do NOT round any per-lot subtotal.
      unit_cost = round_half_up(gas_cost / ammonia_tons + FIXED_CONVERSION_USD_PER_TON, 2)
    input_set: "GasHedgeLot rows on the run's plant with status == OPEN and remaining_mmbtu > 0, further filtered by delivery_month per variant. Lots with status CLOSED are never eligible. When no lot is eligible the whole requirement is bought at plant.spot_gas_index_usd_per_mmbtu."
    constants:
      GAS_INTENSITY_MMBTU_PER_TON: 33.0
      FIXED_CONVERSION_USD_PER_TON: 42.50
    precision: "2 decimal places, round_half_up, applied exactly once to the final per-ton figure. Intermediate gas cost and the gas_cost/tons quotient are carried at full precision."
    variants:
      - name: PROVISIONAL
        when: "POST /nitrogen-ops/production-runs/{id}/approve — an estimate written to provisional_unit_cost_usd_per_ton before any gas has actually burned."
        difference: |
          ammonia_tons     = run.target_ammonia_tons
          eligible_lots    = OPEN lots with remaining_mmbtu > 0 AND delivery_month == the UTC year-month of run.window_start
                             (an exact single-month match: only gas contracted for the month the run starts in)
          sort order       = strike_price_usd_per_mmbtu ASC, then created_at ASC
          lot mutation     = NONE. remaining_mmbtu and consumed_mmbtu are untouched; a provisional
                             estimate never draws down the hedge book, so re-approving after a revert
                             yields the same number.
      - name: FINAL
        when: "POST /nitrogen-ops/production-runs/{id}/complete — the settled cost written to final_unit_cost_usd_per_ton."
        difference: |
          ammonia_tons     = run.actual_ammonia_tons (from the request body)
          eligible_lots    = OPEN lots with remaining_mmbtu > 0 AND delivery_month <= the UTC year-month of
                             run.window_end. There is NO lower bound: gas contracted for any earlier month
                             is still in the tank and settles first.
          sort order       = delivery_month ASC, then strike_price_usd_per_mmbtu ASC, then created_at ASC
                             (oldest contracted gas burns first — NOT cheapest-first)
          lot mutation     = YES. Each drawn lot has consumed_mmbtu increased by its draw (so
                             remaining_mmbtu falls) and is set to CLOSED when remaining_mmbtu reaches 0.
                             run.consumed_gas_mmbtu records the hedged draw total.
        note: |
          The two variants therefore disagree on identical data in three independent ways — which lots
          are eligible, what order they are drawn in, and whether the draw is destructive — so FINAL is
          not merely PROVISIONAL recomputed with a different tonnage.

  - name: catalyst_activity_pct
    trigger: "Recomputed on CatalystCharge read, on POST /nitrogen-ops/production-runs/{id}/complete (operating hours accrue), on PATCH /nitrogen-ops/catalyst-charges/{id} (poisoning index revised) and on POST /nitrogen-ops/catalyst-charges/{id}/regenerate."
    algorithm: decay_function
    formula: |
      cumulative_operating_hours = charge.baseline_operating_hours
                                 + sum of actual_operating_hours over ProductionRun rows
                                   where catalyst_charge_id == charge.id AND status == 'COMPLETED'

      # Variant CALENDAR — pure life fraction, ignores poisoning and regeneration.
      calendar_activity_pct = round_half_up(
          100 - 100 * (cumulative_operating_hours / charge.design_life_hours), 2)

      # Variant SEVERITY_ADJUSTED — the gating value.
      severity_hours = cumulative_operating_hours * (1 + SEVERITY_WEIGHT * charge.poisoning_index)
      activity_pct   = round_half_up(
          100 - 100 * (severity_hours / charge.design_life_hours)
              + REGEN_RECOVERY_PCT * charge.regeneration_count, 2)
      activity_pct   = clamp(activity_pct, 0.00, 100.00)
    input_set: "The charge's own baseline_operating_hours, design_life_hours, poisoning_index and regeneration_count, plus actual_operating_hours summed over ProductionRun rows on that charge whose status == COMPLETED. ABORTED and RUNNING runs contribute nothing, so aborting a run gives its operating hours back to the catalyst."
    constants:
      CATALYST_MIN_ACTIVITY_PCT: 55.00
      SEVERITY_WEIGHT: 0.45
      REGEN_RECOVERY_PCT: 12.00
    precision: "2 decimal places, round_half_up, then clamped into [0.00, 100.00]. The clamp is applied after rounding."
    variants:
      - name: CALENDAR
        when: "Reported as CatalystCharge.calendar_activity_pct for asset-life planning and turnaround scheduling."
        difference: "Uses cumulative_operating_hours unmodified: poisoning_index and regeneration_count are both ignored, and no clamp is needed because the value is monotonically decreasing from 100."
      - name: SEVERITY_ADJUSTED
        when: "Reported as CatalystCharge.activity_pct and is the ONLY value compared against CATALYST_MIN_ACTIVITY_PCT by the run-approval gate and the SPENT transition."
        difference: |
          Inflates operating hours by (1 + 0.45 * poisoning_index) and then credits
          12.00 points per completed regeneration. On identical data the two variants diverge in both
          directions: heavy poisoning pushes SEVERITY_ADJUSTED below CALENDAR, while a regeneration
          pushes it above. A charge can therefore be gating-eligible (activity_pct >= 55.00) while its
          calendar activity is below 55.00, and vice versa.

  - name: quote_price_per_ton
    trigger: "POST /nitrogen-ops/price-quotes/{id}/issue; written to PriceQuote.quoted_price_usd_per_ton."
    algorithm: tiered_pricing
    formula: |
      # Step 1 — gas basis snapshot (written to quote.gas_basis_usd_per_mmbtu)
      if quote.pass_through_basis == 'HEDGED_BLEND':
          gas_unit = plant.hedged_blend_usd_per_mmbtu
          if gas_unit is null:                      # empty hedge pool
              gas_unit = plant.spot_gas_index_usd_per_mmbtu
      else:                                          # 'SPOT_INDEX'
          gas_unit = plant.spot_gas_index_usd_per_mmbtu

      # Step 2 — ammonia cash cost, then the product's cash cost
      nh3_cost_per_ton   = gas_unit * GAS_INTENSITY_MMBTU_PER_TON_NH3 + FIXED_CONVERSION_USD_PER_TON
      feedstock_per_ton  = nh3_cost_per_ton * product_line.ammonia_tons_per_product_ton
      cash_cost_per_ton  = feedstock_per_ton + product_line.conversion_cost_usd_per_ton

      # Step 3 — margin: the greater of the floor and the target percentage
      margin_per_ton     = max(MARGIN_FLOOR_USD_PER_TON, cash_cost_per_ton * TARGET_MARGIN_PCT)
      list_price_per_ton = cash_cost_per_ton + margin_per_ton

      # Step 4 — three INDEPENDENT multipliers, each selected from a different dimension
      seasonal = SPRING_MULTIPLIER if month(quote.expires_at UTC) in {3,4,5} else OFF_SEASON_MULTIPLIER
      if   quote.tons >= 25000: tier = 0.94
      elif quote.tons >=  5000: tier = 0.97
      else:                     tier = 1.00
      posture  = RESTRICTED_POSTURE_FACTOR if plant.operating_posture == 'RESTRICTED' else 1.00

      quoted_price_usd_per_ton = round_half_up(list_price_per_ton * seasonal * tier * posture, 2)
    input_set: "The quote's own tons, expires_at and pass_through_basis; the referenced ProductLine's ammonia_tons_per_product_ton and conversion_cost_usd_per_ton; and the plant's hedged_blend_usd_per_mmbtu / spot_gas_index_usd_per_mmbtu / operating_posture as they stand at issue time. Nothing is re-derived afterwards: a later gas move does not reprice an ISSUED quote."
    constants:
      GAS_INTENSITY_MMBTU_PER_TON_NH3: 33.0
      FIXED_CONVERSION_USD_PER_TON: 42.50
      SPRING_MULTIPLIER: 1.18
      OFF_SEASON_MULTIPLIER: 1.00
      VOLUME_TIER_25K_FACTOR: 0.94
      VOLUME_TIER_5K_FACTOR: 0.97
      VOLUME_TIER_BASE_FACTOR: 1.00
      RESTRICTED_POSTURE_FACTOR: 1.06
      MARGIN_FLOOR_USD_PER_TON: 25.00
      TARGET_MARGIN_PCT: 0.22
    precision: "2 decimal places, round_half_up, applied once to the final product of list price and the three multipliers. gas_unit is used at its stored 4-decimal precision; no intermediate step is rounded. The seasonal, volume and posture factors multiply in that order but the product is order-independent at full precision."

  - name: production_order_landed_cost
    trigger: "POST /nitrogen-ops/production-orders/{id}/produce; written to ProductionOrder.landed_cost_usd."
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PART OF THE CONTRACT: each of the four cost components is
      # rounded to 2 dp INDEPENDENTLY and the four rounded figures are then summed.
      # Summing at full precision and rounding once at the end is WRONG and will differ
      # by one or two cents on realistic tonnages.
      nh3_tons          = round_half_up(produced_tons * product_line.ammonia_tons_per_product_ton, 3)
      feedstock_usd     = round_half_up(nh3_tons     * run.final_unit_cost_usd_per_ton, 2)
      conversion_usd    = round_half_up(produced_tons * product_line.conversion_cost_usd_per_ton, 2)
      handling_usd      = round_half_up(produced_tons * STORAGE_HANDLING_USD_PER_TON, 2)
      security_usd      = round_half_up(produced_tons * SECURITY_FEE_USD_PER_TON, 2) if product_line.regulated
                          else 0.00

      landed_cost_usd = feedstock_usd + conversion_usd + handling_usd + security_usd
    input_set: "produced_tons from the request body; the order's ProductLine (ammonia_tons_per_product_ton, conversion_cost_usd_per_ton, regulated); and run.final_unit_cost_usd_per_ton, which requires the run to be COMPLETED — an order on a RUNNING run cannot be produced because the feedstock component has no settled input."
    constants:
      STORAGE_HANDLING_USD_PER_TON: 1.333
      SECURITY_FEE_USD_PER_TON: 2.755
    precision: |
      nh3_tons: 3 decimal places, round_half_up. Each of feedstock_usd, conversion_usd, handling_usd and
      security_usd: 2 decimal places, round_half_up, INDEPENDENTLY. landed_cost_usd is the exact sum of
      those four already-rounded values and is never re-rounded.

  - name: shipment_freight_total
    trigger: "POST /nitrogen-ops/shipments/{id}/book; written to Shipment.base_freight_usd, fuel_surcharge_usd, freight_total_usd and freight_per_ton_usd."
    algorithm: tiered_pricing
    formula: |
      rate         = MODE_RATE_USD_PER_TON_MILE[shipment.mode]
      linehaul     = shipment.tons * shipment.distance_miles * rate
      base_freight_usd = round_half_up(max(linehaul, MIN_CHARGE_USD[shipment.mode]), 2)

      # EVALUATION ORDER IS PART OF THE CONTRACT: the surcharge tier is selected from
      # base_freight_usd -- the PRE-surcharge figure. Adding the surcharge can push the
      # total across a tier boundary; that does NOT re-select the tier. There is exactly
      # one tier lookup per booking and it never iterates to a fixed point.
      if   base_freight_usd < 25000.00:   surcharge_rate = 0.085
      elif base_freight_usd < 100000.00:  surcharge_rate = 0.062
      else:                               surcharge_rate = 0.041

      fuel_surcharge_usd = round_half_up(base_freight_usd * surcharge_rate, 2)
      freight_total_usd  = base_freight_usd + fuel_surcharge_usd
      freight_per_ton_usd = round_half_up(freight_total_usd / shipment.tons, 4)
    input_set: "The shipment's own mode, tons and distance_miles. No hedge, plant or storage state enters freight; the minimum charge means a short low-tonnage move is priced off MIN_CHARGE_USD rather than the ton-mile rate."
    constants:
      MODE_RATE_USD_PER_TON_MILE: {RAIL: 0.0412, BARGE: 0.0189, TRUCK: 0.1075}
      MIN_CHARGE_USD: {RAIL: 2200.00, BARGE: 4800.00, TRUCK: 450.00}
      SURCHARGE_RATE_UNDER_25K: 0.085
      SURCHARGE_RATE_25K_TO_100K: 0.062
      SURCHARGE_RATE_100K_PLUS: 0.041
      SURCHARGE_TIER_1_CEILING_USD: 25000.00
      SURCHARGE_TIER_2_CEILING_USD: 100000.00
    precision: "base_freight_usd and fuel_surcharge_usd: 2 decimal places, round_half_up, each rounded before the sum. freight_total_usd is the exact sum of the two rounded figures. freight_per_ton_usd: 4 decimal places, round_half_up. Tier boundaries are half-open: 25000.00 falls in the middle tier, 100000.00 falls in the top tier."

  - name: plant_operating_posture
    trigger: "Re-derived on Plant read and after POST /nitrogen-ops/plants/{id}/permit-status, POST /nitrogen-ops/plants/{id}/psm-program-status, POST /nitrogen-ops/emissions-readings, POST /nitrogen-ops/turnarounds/{id}/complete and any logical-clock advance that changes the 30-day emissions window."
    algorithm: threshold
    formula: |
      exceeded = the set of DISTINCT pollutant codes on this plant whose
                 emissions_rolling_30d aggregate strictly exceeds their permit_limit_tons_30d

      # EVALUATION ORDER IS PART OF THE CONTRACT: FROZEN is tested first and wins outright.
      if plant.permit_status == 'SUSPENDED' or count(exceeded) >= 2:
          operating_posture = 'FROZEN'
      elif count(exceeded) == 1 or plant.psm_program_status == 'OVERDUE':
          operating_posture = 'RESTRICTED'
      else:
          operating_posture = 'NORMAL'
    input_set: "plant.permit_status, plant.psm_program_status, and the distinct pollutant codes flagged by calculations.emissions_rolling_30d over the plant's EmissionsReading rows inside the current 30-day window. Readings that have aged out of the window stop counting, so a posture can relax purely from a clock advance with no write to the plant."
    constants:
      FROZEN_EXCEEDED_POLLUTANT_COUNT: 2
      RESTRICTED_EXCEEDED_POLLUTANT_COUNT: 1
    precision: "Enum-valued; no rounding. count(exceeded) counts DISTINCT pollutant codes, not readings: ten exceeding NOX readings are still one exceeded pollutant."

  - name: emissions_rolling_30d
    trigger: "Recomputed on POST /nitrogen-ops/emissions-readings, on POST /nitrogen-ops/_clock/set_current_utc and on any Plant read."
    algorithm: interval_merge
    formula: |
      # Per-reading tonnage (stored as EmissionsReading.tons)
      reading.tons = round_half_up(reading.rate_lb_per_hour * reading.interval_hours / 2000, 3)

      # WINDOW SEMANTICS ARE PART OF THE CONTRACT: left-EXCLUSIVE, right-INCLUSIVE.
      window_lo = logical_clock - 30 days      # excluded
      window_hi = logical_clock                # included
      in_window(reading) = reading.reading_at > window_lo AND reading.reading_at <= window_hi

      for each DISTINCT pollutant value present on the plant's readings:
          rolling_30d_tons = round_half_up(sum of reading.tons over that pollutant's in-window readings, 3)
          # The SAME plant.permit_limit_tons_30d ceiling applies independently to every pollutant.
          # STRICT comparison: equal to the limit is COMPLIANT, not an exceedance.
          exceedance       = rolling_30d_tons > plant.permit_limit_tons_30d

      plant.exceeded_pollutants = the pollutant values whose exceedance is true, sorted ascending
    input_set: "EmissionsReading rows on the plant whose reading_at falls in the left-exclusive/right-inclusive 30-day window ending at the logical clock. A reading whose reading_at sits exactly 30 days before the clock has just aged out; one sitting exactly at the clock is inside. Future-dated readings are rejected at write time and so never appear."
    constants:
      ROLLING_WINDOW_DAYS: 30
      LB_PER_TON: 2000
    precision: "EmissionsReading.tons and rolling_30d_tons: 3 decimal places, round_half_up. Per-reading tonnage is rounded before summation, and the sum is rounded again. Exceedance is a STRICT greater-than against Plant.permit_limit_tons_30d."

  - name: turnaround_task_schedule
    trigger: "Recomputed on POST /nitrogen-ops/turnaround-tasks, on TurnaroundTask read and on Turnaround read; written to TurnaroundTask.earliest_start_day and Turnaround.critical_path_days."
    algorithm: topological
    formula: |
      # Each task has at most one predecessor, so the dependency structure is a forest.
      # Walk it in topological order, breaking ties by created_at ASC.
      for task in topological_order(tasks of this turnaround, tie-break created_at ASC):
          if task.predecessor_task_id is null:
              task.earliest_start_day = 0
          else:
              pred = TurnaroundTask(task.predecessor_task_id)
              task.earliest_start_day = pred.earliest_start_day + pred.duration_days

      critical_path_days = max over all tasks of (task.earliest_start_day + task.duration_days)
                           (0 when the turnaround has no tasks)

      # Cycle detection runs at task-creation time, before earliest_start_day is written:
      # if following predecessor_task_id from the proposed task ever returns to the proposed
      # task, reject with ERR_TASK_CYCLE_DETECTED.
      # Window feasibility: window_days = whole days from window_start to window_end INCLUSIVE
      # of both endpoints; window_days < critical_path_days is rejected.
    input_set: "All TurnaroundTask rows of the turnaround regardless of status — BLOCKED and DONE tasks still occupy their slot on the critical path, so rejecting a turnaround does not shorten its outage. Disconnected roots each start at day 0 and their chains are scheduled independently of one another; the critical path is the longest chain, not the sum of all durations."
    constants:
      TURNAROUND_SEPARATION_BUFFER_DAYS: 14
    precision: "Whole days, exact integer arithmetic. window_days counts both endpoints (window_start 2026-10-01 through window_end 2026-10-27 is 27 calendar dates but 26 whole elapsed days; the comparison uses the 26 figure)."

  - name: storage_position
    trigger: "Recomputed on StorageAsset read and after POST /nitrogen-ops/storage-assets/{id}/opening-balance, POST /nitrogen-ops/production-orders/{id}/produce, POST /nitrogen-ops/shipments/{id}/book, /depart, /deliver, /cancel and POST /nitrogen-ops/_clock/set_current_utc."
    algorithm: projection
    formula: |
      on_hand_tons = asset.opening_balance_tons
                   + sum of produced_tons over ProductionOrder rows where destination_asset_id == asset.id
                                                 AND allocation_status == 'CONSUMED'
                   + sum of received_tons  over Shipment rows where dest_asset_id  == asset.id
                                                 AND status == 'DELIVERED'
                   - sum of tons           over Shipment rows where origin_asset_id == asset.id
                                                 AND status == 'DELIVERED'

      reserved_tons = sum of tons over Shipment rows where origin_asset_id == asset.id
                                          AND status in {'BOOKED', 'IN_TRANSIT'}

      # Seasonal set-aside for spring application: held back only during the winter build months.
      if month(logical_clock UTC) in {12, 1, 2}:
          seasonal_reserve_tons = round_half_up(asset.capacity_tons * asset.seasonal_reserve_pct, 3)
      else:
          seasonal_reserve_tons = 0.000

      available_tons = on_hand_tons - reserved_tons - seasonal_reserve_tons
    input_set: "opening_balance_tons plus CONSUMED production into the asset, DELIVERED inbound shipments and DELIVERED outbound shipments. BOOKED and IN_TRANSIT outbound tons are NOT deducted from on_hand_tons — they sit in reserved_tons until delivery, so booking never moves inventory and cancelling a booking needs no compensating tonnage entry. Transit loss (tons shipped minus received_tons) simply leaves the network."
    constants:
      SEASONAL_RESERVE_MONTHS: [12, 1, 2]
    precision: "All tonnages: 3 decimal places, round_half_up. seasonal_reserve_tons is rounded before the subtraction; available_tons is the exact difference and may be negative when a seasonal reserve is imposed on an asset that is already committed."

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; the first violated rule wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared role names."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The acting role appears in the target endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Request body is schema-valid: required fields present, types correct, enum values in range, numeric fields within their declared bounds (tons > 0, percentages in [0,1], poisoning_index in [0.00, 1.00], distance_miles > 0, duration_days >= 1, window_end after window_start, expires_at after created_at)."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Every id in the request path resolves to an existing row, validated left to right."
    error_id: "ERR_PLANT_NOT_FOUND | ERR_TRAIN_NOT_FOUND | ERR_CATALYST_CHARGE_NOT_FOUND | ERR_HEDGE_LOT_NOT_FOUND | ERR_PRODUCT_LINE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_STORAGE_ASSET_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_TURNAROUND_NOT_FOUND | ERR_TASK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 6
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list."
    error_id: "ERR_PLANT_NOT_FOUND | ERR_TRAIN_NOT_FOUND | ERR_CATALYST_CHARGE_NOT_FOUND | ERR_PRODUCT_LINE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_STORAGE_ASSET_NOT_FOUND | ERR_TASK_NOT_FOUND"
    http_status: 404
    applies_to: "all creation endpoints and any action endpoint carrying an FK in its body"
  - priority: 7
    category: auth
    check: "When the acting role is TerminalOperator, X-User-ID equals the dest_asset_id of the shipment being delivered."
    error_id: ERR_TERMINAL_NOT_OWNER
    http_status: 403
    applies_to: "POST /nitrogen-ops/shipments/{id}/deliver"
  - priority: 8
    category: business_referential
    check: "Scoped business codes are unique within their parent: ReformerTrain.train_code per plant, CatalystCharge.charge_code per train, GasHedgeLot.lot_code per plant, ProductLine.product_code globally (the product slate is a single register keyed by product code), StorageAsset.asset_code per plant, Shipment.shipment_code globally, ProductionRun.run_code per plant, ProductionOrder.order_code globally, PriceQuote.quote_code globally, Turnaround.turnaround_code per plant, TurnaroundTask.task_code per turnaround."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "all creation endpoints and POST /nitrogen-ops/turnarounds/{id}/complete (new_charge_code)"
  - priority: 9
    category: state
    check: >-
      The target entity's current state permits the requested transition, per §1.2.
      Scope note for POST /nitrogen-ops/turnaround-tasks/{id}/complete: this priority-9 check covers
      only the task's own DONE or BLOCKED status and the parent Turnaround not being IN_PROGRESS. A
      PENDING task inside an IN_PROGRESS turnaround is NOT reported here — it is reported by priority
      24 as ERR_TASK_PREDECESSOR_NOT_DONE, which is the only way that state is ever reachable.
    error_id: "ERR_INVALID_STATE | ERR_RUN_NOT_COMPLETED | ERR_ORDER_ALREADY_PRODUCED | ERR_QUOTE_EXPIRED"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: business_safety
    check: "The governing Plant.operating_posture is not FROZEN. A FROZEN plant accepts only regulatory writes (permit-status, psm-program-status, emissions-readings), turnaround authoring and progression, and read traffic."
    error_id: ERR_PLANT_FROZEN
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-runs, /nitrogen-ops/production-runs/{id}/approve, /nitrogen-ops/production-runs/{id}/start, /nitrogen-ops/production-orders/{id}/reserve, /nitrogen-ops/production-orders/{id}/produce, /nitrogen-ops/shipments/{id}/book, /nitrogen-ops/price-quotes/{id}/issue"
  - priority: 11
    category: business_constraint
    check: "The supplied expected_<parent>_version equals the parent row's current version."
    error_id: "ERR_STALE_RUN_VERSION | ERR_STALE_STORAGE_VERSION"
    http_status: 412
    applies_to: "POST /nitrogen-ops/production-orders/{id}/reserve, POST /nitrogen-ops/shipments/{id}/book"
  - priority: 12
    category: auth
    check: "Segregation of duties: the acting X-User-ID differs from the user recorded at the preceding step. Turnaround approve/reject requires an actor other than authored_by_user_id, and approve additionally requires an actor other than psm_reviewed_by_user_id; turnaround revise requires the actor to BE authored_by_user_id; production-run approve requires an actor other than the run's created_by_user_id; order security-check requires an actor other than the order's created_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nitrogen-ops/turnarounds/{id}/approve, /nitrogen-ops/turnarounds/{id}/reject, /nitrogen-ops/turnarounds/{id}/revise, /nitrogen-ops/production-runs/{id}/approve, /nitrogen-ops/production-orders/{id}/security-check"
  - priority: 13
    category: business_safety
    check: "The reformer train's ACTIVE catalyst charge has activity_pct >= CATALYST_MIN_ACTIVITY_PCT (55.00). Evaluated on the SEVERITY_ADJUSTED variant only."
    error_id: ERR_CATALYST_ACTIVITY_TOO_LOW
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-runs/{id}/approve, POST /nitrogen-ops/production-runs/{id}/start"
  - priority: 14
    category: business_safety
    check: "The reformer train is available for the requested operation: status is IDLE or DERATED to start a run, and never DOWN_FOR_TURNAROUND or DOWN."
    error_id: ERR_TRAIN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-runs, POST /nitrogen-ops/production-runs/{id}/approve, POST /nitrogen-ops/production-runs/{id}/start"
  - priority: 15
    category: business_safety
    check: "The turnaround carries psm_review_decision == ENDORSED before it can be approved, started or completed."
    error_id: ERR_PSM_REVIEW_MISSING
    http_status: 409
    applies_to: "POST /nitrogen-ops/turnarounds/{id}/approve, /nitrogen-ops/turnarounds/{id}/start, /nitrogen-ops/turnarounds/{id}/complete"
  - priority: 16
    category: business_safety
    check: "Regulated-substance handling: when the ProductLine is regulated, the order's destination StorageAsset security_class must be CONTROLLED or HIGH_SECURITY; when the ProductLine whose product_code equals a shipment's origin asset product_code has regulated == true, both origin and destination assets must be CONTROLLED or HIGH_SECURITY. ProductLine.product_code is globally unique, so this lookup is single-valued; when no ProductLine carries that product_code the movement is treated as unregulated."
    error_id: ERR_SECURITY_CLASS_INSUFFICIENT
    http_status: 403
    applies_to: "POST /nitrogen-ops/production-orders, POST /nitrogen-ops/shipments/{id}/book"
  - priority: 17
    category: business_safety
    check: "An order on a regulated ProductLine has security_status == CLEARED or EXEMPT before product may be produced into storage. Reserving ammonia is deliberately NOT gated on clearance: the allocation and clearance dimensions advance independently and only converge at produce."
    error_id: ERR_SECURITY_CHECK_NOT_CLEARED
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-orders/{id}/produce"
  - priority: 18
    category: business_referential
    check: "Product identity agrees across the chain: the order's ProductLine.product_code equals its destination StorageAsset.product_code; a shipment's origin and destination assets carry the same product_code; a quote's ProductLine belongs to the quote's plant's product slate; an order's run and destination asset belong to the same plant."
    error_id: ERR_PRODUCT_MISMATCH
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-orders, POST /nitrogen-ops/shipments, POST /nitrogen-ops/shipments/{id}/book, POST /nitrogen-ops/price-quotes"
  - priority: 19
    category: business_temporal
    check: "No two ProductionRun rows on the same ReformerTrain have overlapping half-open [window_start, window_end) windows when both are in {PLANNED, APPROVED, RUNNING, COMPLETED}. Windows that merely touch (one ends exactly where the next begins) do not overlap."
    error_id: ERR_RUN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-runs"
  - priority: 20
    category: business_temporal
    check: "No two Turnaround rows on the same plant in {APPROVED, IN_PROGRESS, COMPLETED} have intersecting closed [window_start, window_end] windows, and consecutive turnarounds are separated by at least TURNAROUND_SEPARATION_BUFFER_DAYS (14) whole days."
    error_id: ERR_TURNAROUND_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /nitrogen-ops/turnarounds/{id}/approve"
  - priority: 21
    category: business_temporal
    check: "An emissions reading's reading_at is not after the logical clock."
    error_id: ERR_EMISSIONS_READING_IN_FUTURE
    http_status: 422
    applies_to: "POST /nitrogen-ops/emissions-readings"
  - priority: 22
    category: business_constraint
    check: "A task's predecessor_task_id does not create a cycle in the turnaround's dependency graph, and the predecessor belongs to the same turnaround."
    error_id: ERR_TASK_CYCLE_DETECTED
    http_status: 409
    applies_to: "POST /nitrogen-ops/turnaround-tasks"
  - priority: 23
    category: business_constraint
    check: "critical_path_days <= window_days for the turnaround being submitted or approved."
    error_id: ERR_OUTAGE_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: "POST /nitrogen-ops/turnarounds/{id}/submit, POST /nitrogen-ops/turnarounds/{id}/approve"
  - priority: 24
    category: business_constraint
    check: "A task may only be completed when its predecessor_task_id is null or that predecessor is DONE."
    error_id: ERR_TASK_PREDECESSOR_NOT_DONE
    http_status: 409
    applies_to: "POST /nitrogen-ops/turnaround-tasks/{id}/complete"
  - priority: 25
    category: business_fiscal
    check: "A reservation's ammonia requirement (round_half_up(reserve_tons * ProductLine.ammonia_tons_per_product_ton, 3)) does not exceed ProductionRun.unallocated_ammonia_tons, and a settlement's actual_ammonia_tons is not below the tonnage already promised to that run's RESERVED and CONSUMED orders."
    error_id: ERR_AMMONIA_BALANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-orders/{id}/reserve, POST /nitrogen-ops/production-runs/{id}/complete"
  - priority: 26
    category: business_fiscal
    check: "Tonnage entering a StorageAsset does not push it past capacity_tons: on_hand_tons + produced_tons for a produce call, and on_hand_tons + committed inbound + tons for a booking, and on_hand_tons + received_tons for a delivery."
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-orders/{id}/produce, POST /nitrogen-ops/shipments/{id}/book, POST /nitrogen-ops/shipments/{id}/deliver, POST /nitrogen-ops/storage-assets/{id}/opening-balance"
  - priority: 27
    category: business_fiscal
    check: "Aggregate outbound commitment on the origin asset: at every instant covered by the proposed shipment window, the summed tons of overlapping BOOKED/IN_TRANSIT shipments plus this shipment's tons stays within on_hand_tons - seasonal_reserve_tons."
    error_id: ERR_STORAGE_AVAILABILITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nitrogen-ops/shipments/{id}/book"
  - priority: 28
    category: business_fiscal
    check: "produced_tons does not exceed the order's reserved_tons."
    error_id: ERR_PRODUCED_EXCEEDS_RESERVED
    http_status: 409
    applies_to: "POST /nitrogen-ops/production-orders/{id}/produce"

# =============================================================================
# 1.5 API Endpoints  (71 endpoints; every path parameter is named {id})
# =============================================================================
endpoints:
  # --- Plant -----------------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/plants"
    description: "Register a nitrogen fertilizer plant with its air-permit ceiling and opening spot gas index."
    roles: [RegulatoryAdmin]
    code: 201
    input: [name, site_code, permit_limit_tons_30d, spot_gas_index_usd_per_mmbtu]
    output: Plant
    side_effects: ["permit_status defaults to ACTIVE, psm_program_status to CURRENT, operating_posture derived to NORMAL, exceeded_pollutants to [], hedged_blend_usd_per_mmbtu to null (no hedge lots yet)"]
  - method: GET
    path: "/nitrogen-ops/plants/{id}"
    description: "Fetch one plant with its re-derived operating posture, hedged blend and exceeded pollutant list."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: Plant
    side_effects: ["re-derives hedged_blend_usd_per_mmbtu, exceeded_pollutants and operating_posture from current state and the logical clock"]
  - method: GET
    path: "/nitrogen-ops/plants"
    description: "List plants."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: Plant[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/plants/{id}/gas-index"
    description: "Post a new spot natural gas index for the plant."
    roles: [RegulatoryAdmin]
    code: 200
    input: [spot_gas_index_usd_per_mmbtu]
    output: Plant
    side_effects: ["writes spot_gas_index_usd_per_mmbtu and gas_index_updated_at from the logical clock", "does NOT reprice any ISSUED PriceQuote or any COMPLETED ProductionRun", "increments Plant.version by 1"]
  - method: POST
    path: "/nitrogen-ops/plants/{id}/permit-status"
    description: "Record an air-permit standing change for the plant."
    roles: [RegulatoryAdmin]
    code: 200
    input: [permit_status]
    output: Plant
    side_effects: ["writes permit_status", "re-derives operating_posture per calculations.plant_operating_posture", "when the new posture is RESTRICTED or FROZEN, every ISSUED PriceQuote on the plant transitions to WITHDRAWN with withdraw_reason = 'PLANT_POSTURE_DEGRADED', processed in created_at ASC order", "increments Plant.version by 1 and the version of every withdrawn PriceQuote by 1"]
  - method: POST
    path: "/nitrogen-ops/plants/{id}/psm-program-status"
    description: "Record a process-safety-management program standing change for the plant."
    roles: [SafetyOfficer]
    code: 200
    input: [psm_program_status]
    output: Plant
    side_effects: ["writes psm_program_status", "re-derives operating_posture per calculations.plant_operating_posture", "when the new posture is RESTRICTED or FROZEN, every ISSUED PriceQuote on the plant transitions to WITHDRAWN with withdraw_reason = 'PLANT_POSTURE_DEGRADED', processed in created_at ASC order", "increments Plant.version by 1 and the version of every withdrawn PriceQuote by 1"]

  # --- ReformerTrain ---------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/reformer-trains"
    description: "Commission a steam-methane reformer / ammonia synthesis train at a plant."
    roles: [ProcessEngineer]
    code: 201
    input: [plant_id, train_code, rated_ammonia_tpd]
    output: ReformerTrain
    side_effects: ["status defaults to IDLE, active_charge_id to null"]
  - method: GET
    path: "/nitrogen-ops/reformer-trains/{id}"
    description: "Fetch one reformer train with its active catalyst charge mirror."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: ReformerTrain
    side_effects: ["re-derives active_charge_id from the train's charges"]
  - method: GET
    path: "/nitrogen-ops/reformer-trains"
    description: "List reformer trains, optionally scoped to one plant."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "status?", "limit?", "offset?"]
    output: ReformerTrain[]
    side_effects: []

  # --- CatalystCharge --------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/catalyst-charges"
    description: "Install a catalyst charge in a reformer train. baseline_operating_hours seeds an already-aged charge so its activity can be positioned anywhere on the decay curve without running campaigns."
    roles: [ProcessEngineer]
    code: 201
    input: ["train_id", "charge_code", "design_life_hours", "baseline_operating_hours?", "poisoning_index?"]
    output: CatalystCharge
    side_effects: ["status defaults to ACTIVE, regeneration_count to 0, installed_at from the logical clock", "any other ACTIVE charge on the same train transitions to RETIRED", "computes cumulative_operating_hours, calendar_activity_pct and activity_pct per calculations.catalyst_activity_pct", "increments ReformerTrain.version by 1"]
  - method: GET
    path: "/nitrogen-ops/catalyst-charges/{id}"
    description: "Fetch one catalyst charge with both activity variants."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: CatalystCharge
    side_effects: ["recomputes cumulative_operating_hours, calendar_activity_pct and activity_pct"]
  - method: GET
    path: "/nitrogen-ops/catalyst-charges"
    description: "List catalyst charges, optionally scoped to one train."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["train_id?", "status?", "limit?", "offset?"]
    output: CatalystCharge[]
    side_effects: []
  - method: PATCH
    path: "/nitrogen-ops/catalyst-charges/{id}"
    description: "Record a revised laboratory poisoning index for the charge."
    roles: [ProcessEngineer]
    code: 200
    input: [poisoning_index]
    output: CatalystCharge
    side_effects: ["writes poisoning_index", "recomputes activity_pct (calendar_activity_pct is unaffected)", "when the recomputed activity_pct falls below 55.00 the charge transitions ACTIVE -> SPENT and its train transitions to DERATED", "increments CatalystCharge.version by 1"]
  - method: POST
    path: "/nitrogen-ops/catalyst-charges/{id}/regenerate"
    description: "Run an in-situ catalyst regeneration, crediting REGEN_RECOVERY_PCT activity points."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: CatalystCharge
    side_effects: ["increments regeneration_count by 1", "recomputes activity_pct (calendar_activity_pct is unaffected)", "a SPENT charge whose recomputed activity_pct reaches 55.00 or above returns to ACTIVE and its DERATED train returns to IDLE", "increments CatalystCharge.version by 1"]

  # --- GasHedgeLot -----------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/gas-hedge-lots"
    description: "Book a fixed-strike natural gas hedge lot for a delivery month."
    roles: [CommercialManager]
    code: 201
    input: [plant_id, lot_code, mmbtu_volume, strike_price_usd_per_mmbtu, delivery_month]
    output: GasHedgeLot
    side_effects: ["consumed_mmbtu defaults to 0, remaining_mmbtu to mmbtu_volume, status to OPEN", "recomputes Plant.hedged_blend_usd_per_mmbtu"]
  - method: GET
    path: "/nitrogen-ops/gas-hedge-lots/{id}"
    description: "Fetch one hedge lot with its remaining volume."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: GasHedgeLot
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/gas-hedge-lots"
    description: "List hedge lots, optionally scoped to one plant or one status."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "status?", "delivery_month?", "limit?", "offset?"]
    output: GasHedgeLot[]
    side_effects: []

  # --- ProductLine -----------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/product-lines"
    description: "Define a finished-product line with its ammonia intensity, conversion cost and regulated-substance flag. Immutable once created."
    roles: [CommercialManager]
    code: 201
    input: [plant_id, product_code, ammonia_tons_per_product_ton, conversion_cost_usd_per_ton, regulated, priority_rank]
    output: ProductLine
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/product-lines/{id}"
    description: "Fetch one product line."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: ProductLine
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/product-lines"
    description: "List product lines, optionally scoped to one plant."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "limit?", "offset?"]
    output: ProductLine[]
    side_effects: []

  # --- ProductionRun ---------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/production-runs"
    description: "Schedule an ammonia synthesis campaign on a reformer train over a half-open [window_start, window_end) window."
    roles: [ProcessEngineer]
    code: 201
    input: [train_id, run_code, window_start, window_end, target_ammonia_tons]
    output: ProductionRun
    side_effects: ["status defaults to PLANNED, consumed_gas_mmbtu to 0, unallocated_ammonia_tons to 0, catalyst_charge_id to null", "records created_by_user_id from the acting X-User-ID", "rejects a window that overlaps another run on the same train per validations priority 19; touching windows are accepted"]
  - method: GET
    path: "/nitrogen-ops/production-runs/{id}"
    description: "Fetch one production run with both unit-cost variants and its unallocated ammonia balance."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["recomputes unallocated_ammonia_tons from the run's RESERVED and CONSUMED orders"]
  - method: GET
    path: "/nitrogen-ops/production-runs"
    description: "List production runs, optionally scoped to one train or one catalyst charge."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["train_id?", "catalyst_charge_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/production-runs/{id}/approve"
    description: "Approve a planned campaign, pricing it at the PROVISIONAL feedstock variant."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["PLANNED -> APPROVED", "writes provisional_unit_cost_usd_per_ton per calculations.run_ammonia_unit_cost variant PROVISIONAL; hedge lots are NOT drawn down", "requires the train's ACTIVE charge to have activity_pct >= 55.00 and the actor to differ from created_by_user_id", "increments ProductionRun.version by 1"]
  - method: POST
    path: "/nitrogen-ops/production-runs/{id}/start"
    description: "Put the campaign on line, pinning the catalyst charge that will wear during it."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["APPROVED -> RUNNING", "pins catalyst_charge_id to the train's ACTIVE charge and never rewrites it, even across a reopen", "sets ReformerTrain.status to RUNNING", "increments ProductionRun.version by 1 and ReformerTrain.version by 1"]
  - method: POST
    path: "/nitrogen-ops/production-runs/{id}/complete"
    description: "Settle the campaign: log actual ammonia tons and reformer hours, price at the FINAL feedstock variant and draw the hedge book down."
    roles: [ProcessEngineer]
    code: 200
    input: [actual_ammonia_tons, actual_operating_hours]
    output: ProductionRun
    side_effects: ["RUNNING -> COMPLETED", "writes actual_ammonia_tons, actual_operating_hours and final_unit_cost_usd_per_ton per calculations.run_ammonia_unit_cost variant FINAL", "draws the eligible hedge lots down in delivery_month ASC, strike_price_usd_per_mmbtu ASC, created_at ASC order, increments each lot's consumed_mmbtu and closes any lot reaching remaining_mmbtu == 0", "switches the ammonia pool basis to actual_ammonia_tons, recomputes unallocated_ammonia_tons, and rejects a settlement below the tonnage already promised to RESERVED and CONSUMED orders with ERR_AMMONIA_BALANCE_EXCEEDED", "recomputes Plant.hedged_blend_usd_per_mmbtu", "accrues actual_operating_hours onto the pinned CatalystCharge; when the recomputed activity_pct falls below 55.00 the charge transitions ACTIVE -> SPENT, its train transitions RUNNING -> DERATED, and every other APPROVED run on that train reverts to PLANNED with provisional_unit_cost_usd_per_ton cleared", "increments ProductionRun.version by 1 plus the version of every drawn GasHedgeLot, the CatalystCharge, the ReformerTrain, the Plant and every reverted run"]
  - method: POST
    path: "/nitrogen-ops/production-runs/{id}/abort"
    description: "Abort a campaign, unwinding every reservation booked against it."
    roles: [ProcessEngineer]
    code: 200
    input: [abort_reason]
    output: ProductionRun
    side_effects: ["APPROVED or RUNNING -> ABORTED", "writes abort_reason and returns ReformerTrain.status to IDLE or DERATED according to its charge's activity_pct", "every ProductionOrder on this run with allocation_status == RESERVED transitions to RELEASED with release_reason = 'RUN_ABORTED', ordered by ProductLine.priority_rank DESC then ProductionOrder.created_at ASC", "every Shipment whose production_order_id is one of those orders and whose status is in {DRAFT, BOOKED} transitions to CANCELLED", "recomputes StorageAsset.reserved_tons and available_tons on every affected origin asset", "increments ProductionRun.version by 1 plus the version of every mutated ReformerTrain, ProductionOrder, Shipment and StorageAsset"]
  - method: POST
    path: "/nitrogen-ops/production-runs/{id}/reopen"
    description: "Reopen a settled campaign for restatement, reversing the hedge draw and the catalyst wear."
    roles: [ProcessEngineer]
    code: 200
    input: [reopen_reason]
    output: ProductionRun
    side_effects: ["COMPLETED -> RUNNING", "writes reopen_reason and clears actual_ammonia_tons, actual_operating_hours and final_unit_cost_usd_per_ton to null", "restores consumed_mmbtu on every lot this run drew, returning consumed_gas_mmbtu to 0 and reopening any lot whose remaining_mmbtu becomes positive from CLOSED to OPEN, so the gas-volume invariant is unchanged before and after", "recomputes Plant.hedged_blend_usd_per_mmbtu and the pinned CatalystCharge's activity_pct (the run no longer counts as COMPLETED, so its hours come back)", "rejected when any ProductionOrder on this run has allocation_status == CONSUMED, because a produced order's landed cost is priced off the final unit cost", "increments ProductionRun.version by 1 plus the version of every restored GasHedgeLot, the CatalystCharge and the Plant"]

  # --- ProductionOrder -------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/production-orders"
    description: "Book a finished-product order against a campaign, destined for a storage asset."
    roles: [CommercialManager]
    code: 201
    input: [run_id, product_line_id, destination_asset_id, order_code, requested_tons]
    output: ProductionOrder
    side_effects: ["allocation_status defaults to UNALLOCATED, reserved_tons to 0, allocated_ammonia_tons to 0", "security_status is set to EXEMPT when the ProductLine is not regulated and to PENDING when it is", "records created_by_user_id from the acting X-User-ID", "requires the ProductLine.product_code to match the destination asset's product_code and, when regulated, the destination asset's security_class to be CONTROLLED or HIGH_SECURITY"]
  - method: GET
    path: "/nitrogen-ops/production-orders/{id}"
    description: "Fetch one production order with its ammonia allocation and landed cost."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/production-orders"
    description: "List production orders, optionally scoped to one run, product line or destination asset."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["run_id?", "product_line_id?", "destination_asset_id?", "allocation_status?", "security_status?", "limit?", "offset?"]
    output: ProductionOrder[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/production-orders/{id}/reserve"
    description: "Reserve finished tons against the campaign's unallocated ammonia. Guarded by optimistic concurrency on the parent run's version."
    roles: [CommercialManager]
    code: 200
    input: [reserve_tons, expected_run_version]
    output: ProductionOrder
    side_effects: ["allocation_status UNALLOCATED or RELEASED -> RESERVED", "requires ProductionRun.status to be APPROVED, RUNNING or COMPLETED; the ammonia pool is measured against target_ammonia_tons before settlement and against actual_ammonia_tons after it", "writes reserved_tons and allocated_ammonia_tons = round_half_up(reserve_tons * ProductLine.ammonia_tons_per_product_ton, 3)", "requires expected_run_version to equal ProductionRun.version, else ERR_STALE_RUN_VERSION (412)", "requires the ammonia requirement to fit inside ProductionRun.unallocated_ammonia_tons; clearance is NOT checked here", "decrements ProductionRun.unallocated_ammonia_tons and increments ProductionRun.version by 1", "increments ProductionOrder.version by 1"]
  - method: POST
    path: "/nitrogen-ops/production-orders/{id}/release"
    description: "Release a reservation back to the campaign's ammonia pool."
    roles: [CommercialManager]
    code: 200
    input: [release_reason]
    output: ProductionOrder
    side_effects: ["allocation_status RESERVED -> RELEASED", "an order already at CONSUMED is rejected with ERR_ORDER_ALREADY_PRODUCED rather than the generic state error", "writes release_reason, zeroes reserved_tons and allocated_ammonia_tons", "restores ProductionRun.unallocated_ammonia_tons and increments ProductionRun.version by 1", "every Shipment whose production_order_id is this order and whose status is in {DRAFT, BOOKED} transitions to CANCELLED with cancel_reason = 'UPSTREAM_ALLOCATION_RELEASED', and each affected origin StorageAsset has reserved_tons and available_tons recomputed", "increments ProductionOrder.version by 1 plus the version of every cancelled Shipment and touched StorageAsset"]
  - method: POST
    path: "/nitrogen-ops/production-orders/{id}/security-check"
    description: "Record the regulated-substance clearance decision for the order."
    roles: [SafetyOfficer]
    code: 200
    input: [decision]
    output: ProductionOrder
    side_effects: ["security_status PENDING -> CLEARED when decision == CLEARED, PENDING -> DENIED when decision == DENIED, and DENIED -> PENDING when decision == PENDING (the re-submission loop)", "writes security_checked_by_user_id from the acting X-User-ID and requires that id to differ from created_by_user_id", "leaves allocation_status untouched: the two dimensions advance independently", "increments ProductionOrder.version by 1"]
  - method: POST
    path: "/nitrogen-ops/production-orders/{id}/produce"
    description: "Book the finished tons actually made into the destination storage asset and settle the landed cost."
    roles: [ProcessEngineer]
    code: 200
    input: [produced_tons]
    output: ProductionOrder
    side_effects: ["allocation_status RESERVED -> CONSUMED", "requires ProductionRun.status == COMPLETED (ERR_RUN_NOT_COMPLETED), produced_tons <= reserved_tons, security_status in {CLEARED, EXEMPT} and destination capacity headroom", "writes produced_tons and landed_cost_usd per calculations.production_order_landed_cost", "increases StorageAsset.on_hand_tons by produced_tons and recomputes reserved_tons, seasonal_reserve_tons and available_tons on that asset", "increments ProductionOrder.version by 1 and StorageAsset.version by 1"]

  # --- StorageAsset ----------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/storage-assets"
    description: "Register a tank, dome or terminal that holds one product, with its capacity, security class and seasonal set-aside fraction."
    roles: [LogisticsCoordinator]
    code: 201
    input: ["plant_id", "asset_code", "asset_kind", "product_code", "capacity_tons", "security_class", "seasonal_reserve_pct?"]
    output: StorageAsset
    side_effects: ["opening_balance_tons defaults to 0 and every position field is derived per calculations.storage_position"]
  - method: GET
    path: "/nitrogen-ops/storage-assets/{id}"
    description: "Fetch one storage asset with its derived on-hand, reserved, seasonal-reserve and available position."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: StorageAsset
    side_effects: ["recomputes on_hand_tons, reserved_tons, seasonal_reserve_tons and available_tons against the logical clock"]
  - method: GET
    path: "/nitrogen-ops/storage-assets"
    description: "List storage assets, optionally scoped to one plant."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "asset_kind?", "product_code?", "limit?", "offset?"]
    output: StorageAsset[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/storage-assets/{id}/opening-balance"
    description: "Set the asset's opening inventory as of the season start. The operator surface for stating a starting position without fabricating production history."
    roles: [LogisticsCoordinator]
    code: 200
    input: [opening_balance_tons]
    output: StorageAsset
    side_effects: ["writes opening_balance_tons, rejecting a value above capacity_tons", "recomputes on_hand_tons, reserved_tons, seasonal_reserve_tons and available_tons", "increments StorageAsset.version by 1"]

  # --- Shipment --------------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/shipments"
    description: "Draft a rail, barge or truck movement between two storage assets, optionally tied to the production order whose tons it moves."
    roles: [LogisticsCoordinator]
    code: 201
    input: ["origin_asset_id", "dest_asset_id", "production_order_id?", "shipment_code", "mode", "tons", "distance_miles", "window_start", "window_end"]
    output: Shipment
    side_effects: ["status defaults to DRAFT; no freight is priced and no tonnage is committed until the booking", "requires origin and destination assets to carry the same product_code"]
  - method: GET
    path: "/nitrogen-ops/shipments/{id}"
    description: "Fetch one shipment with its freight breakdown."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/shipments"
    description: "List shipments, optionally scoped to an origin asset, destination asset or production order."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["origin_asset_id?", "dest_asset_id?", "production_order_id?", "status?", "mode?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/shipments/{id}/book"
    description: "Commit the movement: price the freight and hold the tonnage against the origin asset. Guarded by optimistic concurrency on the origin asset's version."
    roles: [LogisticsCoordinator]
    code: 200
    input: [expected_origin_asset_version]
    output: Shipment
    side_effects: ["DRAFT -> BOOKED", "writes base_freight_usd, fuel_surcharge_usd, freight_total_usd and freight_per_ton_usd per calculations.shipment_freight_total", "requires expected_origin_asset_version to equal StorageAsset.version, else ERR_STALE_STORAGE_VERSION (412)", "enforces the aggregate overlapping-commitment ceiling on the origin asset and the inbound capacity ceiling on the destination asset", "recomputes StorageAsset.reserved_tons and available_tons on the origin asset and increments StorageAsset.version by 1", "increments Shipment.version by 1"]
  - method: POST
    path: "/nitrogen-ops/shipments/{id}/depart"
    description: "Mark the movement as departed once the logical clock reaches its window."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["BOOKED -> IN_TRANSIT", "the tonnage stays in the origin asset's reserved_tons; no inventory moves yet", "increments Shipment.version by 1"]
  - method: POST
    path: "/nitrogen-ops/shipments/{id}/deliver"
    description: "Receiving terminal acknowledges the tons actually received. Only the destination asset's own operator may call this."
    roles: [TerminalOperator]
    code: 200
    input: [received_tons]
    output: Shipment
    side_effects: ["IN_TRANSIT -> DELIVERED", "requires the acting X-User-ID to equal dest_asset_id, else ERR_TERMINAL_NOT_OWNER (403)", "requires 0 < received_tons <= tons and destination capacity headroom", "moves tons out of the origin asset and received_tons into the destination asset, then recomputes the full position on both", "increments Shipment.version by 1 and the version of both StorageAsset rows by 1"]
  - method: POST
    path: "/nitrogen-ops/shipments/{id}/cancel"
    description: "Cancel a drafted or booked movement, releasing any tonnage hold."
    roles: [LogisticsCoordinator]
    code: 200
    input: [cancel_reason]
    output: Shipment
    side_effects: ["DRAFT or BOOKED -> CANCELLED", "writes cancel_reason", "recomputes StorageAsset.reserved_tons and available_tons on the origin asset when the shipment was BOOKED", "increments Shipment.version by 1 and StorageAsset.version by 1"]

  # --- PriceQuote ------------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/price-quotes"
    description: "Draft a customer price quote for a product line on a hedged or spot feedstock pass-through basis."
    roles: [CommercialManager]
    code: 201
    input: [plant_id, product_line_id, quote_code, tons, pass_through_basis, expires_at]
    output: PriceQuote
    side_effects: ["status defaults to DRAFT; no price is computed until the quote is issued"]
  - method: GET
    path: "/nitrogen-ops/price-quotes/{id}"
    description: "Fetch one price quote with its snapshotted gas basis and quoted price."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: PriceQuote
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/price-quotes"
    description: "List price quotes, optionally scoped to one plant or product line."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "product_line_id?", "status?", "limit?", "offset?"]
    output: PriceQuote[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/price-quotes/{id}/issue"
    description: "Issue the quote to the customer, snapshotting the feedstock basis and computing the price."
    roles: [CommercialManager]
    code: 200
    input: []
    output: PriceQuote
    side_effects: ["DRAFT -> ISSUED", "snapshots gas_basis_usd_per_mmbtu (hedged blend, or the spot index when the hedge pool is empty) and writes quoted_price_usd_per_ton per calculations.quote_price_per_ton", "writes issued_at from the logical clock", "rejected when Plant.operating_posture == FROZEN or the clock is already at or past expires_at", "increments PriceQuote.version by 1"]
  - method: POST
    path: "/nitrogen-ops/price-quotes/{id}/withdraw"
    description: "Withdraw an issued quote."
    roles: [CommercialManager]
    code: 200
    input: [withdraw_reason]
    output: PriceQuote
    side_effects: ["ISSUED -> WITHDRAWN", "writes withdraw_reason", "increments PriceQuote.version by 1"]
  - method: POST
    path: "/nitrogen-ops/price-quotes/{id}/revise"
    description: "Return a withdrawn quote to draft so it can be re-scoped and re-priced at the prevailing gas basis."
    roles: [CommercialManager]
    code: 200
    input: ["tons?", "pass_through_basis?", "expires_at?"]
    output: PriceQuote
    side_effects: ["WITHDRAWN -> DRAFT", "overwrites tons, pass_through_basis and expires_at when supplied", "clears quoted_price_usd_per_ton, gas_basis_usd_per_mmbtu, issued_at and withdraw_reason to null", "increments PriceQuote.version by 1"]
  - method: POST
    path: "/nitrogen-ops/price-quotes/expire-due"
    description: "Ops checkpoint that expires every DRAFT or ISSUED quote whose expires_at has been reached, processed in expires_at ASC then created_at ASC order."
    roles: [CommercialManager]
    code: 200
    input: []
    output: "{ expired_count: integer, expired_quote_ids: string[] }"
    side_effects: ["every DRAFT or ISSUED quote whose expires_at is at or before the logical clock transitions to EXPIRED", "increments the version of every expired quote by 1", "returns the count and the ids in the order processed"]

  # --- Turnaround ------------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/turnarounds"
    description: "Author a multi-week outage on a reformer train: catalyst change, vessel inspection or both."
    roles: [ProcessEngineer]
    code: 201
    input: [plant_id, train_id, turnaround_code, scope, window_start, window_end]
    output: Turnaround
    side_effects: ["status defaults to DRAFT, psm_review_decision to NONE, critical_path_days to 0, tasks_total_count and tasks_done_count to 0", "computes window_days from the closed [window_start, window_end] interval", "records authored_by_user_id from the acting X-User-ID"]
  - method: GET
    path: "/nitrogen-ops/turnarounds/{id}"
    description: "Fetch one turnaround with its recomputed critical path and task counters."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["recomputes critical_path_days, tasks_total_count and tasks_done_count per calculations.turnaround_task_schedule"]
  - method: GET
    path: "/nitrogen-ops/turnarounds"
    description: "List turnarounds, optionally scoped to one plant or train."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "train_id?", "status?", "scope?", "limit?", "offset?"]
    output: Turnaround[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/submit"
    description: "Submit the authored outage for safety review."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["DRAFT -> SUBMITTED", "requires at least one task and critical_path_days <= window_days (ERR_OUTAGE_WINDOW_TOO_SHORT)", "increments Turnaround.version by 1"]
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/psm-review"
    description: "Record the process-safety-management pre-startup review outcome and finding count."
    roles: [SafetyOfficer]
    code: 200
    input: [decision, findings_count]
    output: Turnaround
    side_effects: ["writes psm_review_decision (ENDORSED or OBJECTED), psm_findings_count and psm_reviewed_by_user_id from the acting X-User-ID", "leaves status at SUBMITTED: the review is a field write, not a state transition", "increments Turnaround.version by 1"]
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/approve"
    description: "Approve the outage. Requires an endorsed safety review, a clean plant outage calendar and an actor distinct from both the author and the reviewer."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["SUBMITTED -> APPROVED", "writes approved_by_user_id from the acting X-User-ID", "requires psm_review_decision == ENDORSED, the actor to differ from authored_by_user_id and psm_reviewed_by_user_id, no intersecting outage window on the plant, at least 14 whole days of separation from every neighbouring outage, and critical_path_days <= window_days", "increments Turnaround.version by 1 and Plant.version by 1"]
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/reject"
    description: "Reject the submitted outage, voiding the safety review and blocking its task graph."
    roles: [SafetyOfficer]
    code: 200
    input: [rejection_reason]
    output: Turnaround
    side_effects: ["SUBMITTED -> REJECTED", "writes rejection_reason, sets psm_review_decision to VOID and clears psm_findings_count to null", "sets every PENDING or READY TurnaroundTask of this turnaround to BLOCKED", "increments Turnaround.version by 1 and the version of every blocked task by 1"]
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/revise"
    description: "Return a rejected outage to draft. Only its original author may revise it."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["REJECTED -> DRAFT", "clears rejection_reason, resets psm_review_decision to NONE and psm_reviewed_by_user_id to null", "returns every BLOCKED task to PENDING", "requires the acting X-User-ID to equal authored_by_user_id", "increments Turnaround.version by 1 and the version of every unblocked task by 1"]
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/start"
    description: "Take the train down and begin the outage. This is the deepest cascade in the domain."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["APPROVED -> IN_PROGRESS", "hop 1: ReformerTrain.status -> DOWN_FOR_TURNAROUND", "hop 2: every RUNNING run on that train -> ABORTED with abort_reason = 'TRAIN_DOWN_FOR_TURNAROUND', and every APPROVED run on that train -> PLANNED with provisional_unit_cost_usd_per_ton cleared, both in window_start ASC then created_at ASC order", "hop 3: every RESERVED ProductionOrder on an aborted run -> RELEASED with release_reason = 'RUN_ABORTED', restoring ProductionRun.unallocated_ammonia_tons, in ProductLine.priority_rank DESC then created_at ASC order", "hop 4: every DRAFT or BOOKED Shipment on a released order -> CANCELLED with cancel_reason = 'UPSTREAM_ALLOCATION_RELEASED'", "hop 5: StorageAsset.reserved_tons and available_tons recomputed on every affected origin asset", "every start task (predecessor_task_id null) in PENDING -> READY", "increments Turnaround.version by 1 plus the version of every mutated train, run, order, shipment, storage asset and task"]
  - method: POST
    path: "/nitrogen-ops/turnarounds/{id}/complete"
    description: "Close out the outage: swap the catalyst charge when in scope, stamp the vessel inspection, and restore the plant's PSM standing."
    roles: [ProcessEngineer]
    code: 200
    input: ["new_charge_code?", "new_charge_design_life_hours?"]
    output: Turnaround
    side_effects: ["IN_PROGRESS -> COMPLETED", "requires every task DONE and psm_review_decision == ENDORSED", "when scope is CATALYST_CHANGE or COMBINED: requires new_charge_code and new_charge_design_life_hours, retires the train's current charge and installs a replacement with baseline_operating_hours 0, poisoning_index 0.00, regeneration_count 0 and status ACTIVE", "when scope is VESSEL_INSPECTION or COMBINED: writes Plant.last_vessel_inspection_at from the logical clock", "sets Plant.psm_program_status to CURRENT and re-derives Plant.operating_posture", "returns ReformerTrain.status to IDLE when it ends with an ACTIVE charge at activity_pct >= 55.00, otherwise DERATED", "increments Turnaround.version, ReformerTrain.version, Plant.version and CatalystCharge.version by 1"]

  # --- TurnaroundTask --------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/turnaround-tasks"
    description: "Add a work step to an outage that is still DRAFT or SUBMITTED, optionally chained behind a predecessor step. Adding a step to an already-SUBMITTED outage re-derives critical_path_days, which is why the window-feasibility check must run again at approval."
    roles: [ProcessEngineer]
    code: 201
    input: ["turnaround_id", "predecessor_task_id?", "task_code", "duration_days"]
    output: TurnaroundTask
    side_effects: ["status defaults to PENDING", "computes earliest_start_day and re-derives Turnaround.critical_path_days per calculations.turnaround_task_schedule", "increments Turnaround.tasks_total_count by 1 and Turnaround.version by 1", "rejects a predecessor that belongs to another turnaround or that would close a cycle (ERR_TASK_CYCLE_DETECTED)"]
  - method: GET
    path: "/nitrogen-ops/turnaround-tasks/{id}"
    description: "Fetch one turnaround task with its earliest start day."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: TurnaroundTask
    side_effects: ["recomputes earliest_start_day"]
  - method: GET
    path: "/nitrogen-ops/turnaround-tasks"
    description: "List turnaround tasks, optionally scoped to one turnaround or one predecessor task."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["turnaround_id?", "predecessor_task_id?", "status?", "limit?", "offset?"]
    output: TurnaroundTask[]
    side_effects: []
  - method: POST
    path: "/nitrogen-ops/turnaround-tasks/{id}/complete"
    description: "Mark a ready work step done, releasing its successors."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: TurnaroundTask
    side_effects: ["READY -> DONE", "requires Turnaround.status == IN_PROGRESS and the predecessor to be null or DONE (ERR_TASK_PREDECESSOR_NOT_DONE)", "every PENDING successor whose predecessor_task_id is this task -> READY, in created_at ASC order", "increments Turnaround.tasks_done_count by 1", "increments TurnaroundTask.version by 1, Turnaround.version by 1 and the version of every released successor by 1"]

  # --- EmissionsReading ------------------------------------------------------
  - method: POST
    path: "/nitrogen-ops/emissions-readings"
    description: "Ingest a continuous-emissions-monitoring reading for a plant. Immutable once written."
    roles: [RegulatoryAdmin]
    code: 201
    input: [plant_id, pollutant, rate_lb_per_hour, interval_hours, reading_at]
    output: EmissionsReading
    side_effects: ["computes tons, rolling_30d_tons and exceedance per calculations.emissions_rolling_30d", "rejects a reading_at after the logical clock (ERR_EMISSIONS_READING_IN_FUTURE)", "re-derives Plant.exceeded_pollutants and Plant.operating_posture; when the new posture is RESTRICTED or FROZEN every ISSUED PriceQuote on the plant is withdrawn with withdraw_reason = 'PLANT_POSTURE_DEGRADED'", "increments Plant.version by 1 and the version of every withdrawn quote by 1"]
  - method: GET
    path: "/nitrogen-ops/emissions-readings/{id}"
    description: "Fetch one emissions reading with its rolling window figure and exceedance flag as at ingestion."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: []
    output: EmissionsReading
    side_effects: []
  - method: GET
    path: "/nitrogen-ops/emissions-readings"
    description: "List emissions readings, optionally scoped to one plant or pollutant."
    roles: [RegulatoryAdmin, ProcessEngineer, SafetyOfficer, CommercialManager, LogisticsCoordinator, TerminalOperator]
    code: 200
    input: ["plant_id?", "pollutant?", "limit?", "offset?"]
    output: EmissionsReading[]
    side_effects: []

  # --- Logical clock (test-driving endpoint) ---------------------------------
  - method: POST
    path: "/nitrogen-ops/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every window, expiry, seasonal-reserve month and rolling-emissions cut-off in this domain is evaluated against this clock."
    roles: [RegulatoryAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock, which re-derives every StorageAsset seasonal_reserve_tons and available_tons, every plant's rolling 30-day emissions aggregate, exceeded_pollutants and operating_posture", "expires nothing on its own: quote expiry is realised only by POST /nitrogen-ops/price-quotes/expire-due"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed on the target endpoint."
  - id: ERR_TERMINAL_NOT_OWNER
    http: 403
    condition: "A TerminalOperator attempted to deliver a shipment whose dest_asset_id differs from the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is not allowed to perform this step given who performed the preceding one: approving or rejecting an outage one authored or reviewed, revising an outage one did not author, approving a run one created, or clearing the security check on an order one created."
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, unknown enum value, or a numeric field outside its declared range (non-positive tonnage or mileage, poisoning_index outside [0.00, 1.00], seasonal_reserve_pct outside [0.0, 1.0], duration_days below 1, window_end not after window_start, delivery_month not matching YYYY-MM)."
  # --- existence ---
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "No Plant with the referenced id."
  - id: ERR_TRAIN_NOT_FOUND
    http: 404
    condition: "No ReformerTrain with the referenced id."
  - id: ERR_CATALYST_CHARGE_NOT_FOUND
    http: 404
    condition: "No CatalystCharge with the referenced id."
  - id: ERR_HEDGE_LOT_NOT_FOUND
    http: 404
    condition: "No GasHedgeLot with the referenced id."
  - id: ERR_PRODUCT_LINE_NOT_FOUND
    http: 404
    condition: "No ProductLine with the referenced id."
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "No ProductionRun with the referenced id."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No ProductionOrder with the referenced id."
  - id: ERR_STORAGE_ASSET_NOT_FOUND
    http: 404
    condition: "No StorageAsset with the referenced id."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "No Shipment with the referenced id."
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "No PriceQuote with the referenced id."
  - id: ERR_TURNAROUND_NOT_FOUND
    http: 404
    condition: "No Turnaround with the referenced id."
  - id: ERR_TASK_NOT_FOUND
    http: 404
    condition: "No TurnaroundTask with the referenced id."
  - id: ERR_EMISSIONS_READING_NOT_FOUND
    http: 404
    condition: "No EmissionsReading with the referenced id."
  # --- uniqueness ---
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A business code collides inside its declared uniqueness scope (train_code per plant, charge_code per train, lot_code per plant, asset_code per plant, run_code per plant, turnaround_code per plant, task_code per turnaround, and product_code, order_code, shipment_code, quote_code globally)."
  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current state does not permit the requested transition."
  - id: ERR_RUN_NOT_COMPLETED
    http: 409
    condition: "An order was produced against a ProductionRun that has not reached COMPLETED, so no final unit cost exists to price the landed cost from."
  - id: ERR_ORDER_ALREADY_PRODUCED
    http: 409
    condition: "A run reopen or an order release was attempted while one of the run's orders is already CONSUMED."
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "A quote was issued at or after its expires_at."
  # --- safety / compliance ---
  - id: ERR_PLANT_FROZEN
    http: 409
    condition: "A commercial or production write was attempted while the governing Plant.operating_posture is FROZEN."
  - id: ERR_CATALYST_ACTIVITY_TOO_LOW
    http: 409
    condition: "The train's ACTIVE catalyst charge has severity-adjusted activity_pct below CATALYST_MIN_ACTIVITY_PCT (55.00)."
  - id: ERR_TRAIN_UNAVAILABLE
    http: 409
    condition: "The reformer train is DOWN or DOWN_FOR_TURNAROUND, or is not in a state that permits the requested campaign operation."
  - id: ERR_PSM_REVIEW_MISSING
    http: 409
    condition: "An outage was approved, started or completed without psm_review_decision == ENDORSED."
  - id: ERR_SECURITY_CLASS_INSUFFICIENT
    http: 403
    condition: "A regulated product was routed through a storage asset whose security_class is neither CONTROLLED nor HIGH_SECURITY."
  - id: ERR_SECURITY_CHECK_NOT_CLEARED
    http: 409
    condition: "Product was produced against a regulated order whose security_status is PENDING or DENIED."
  # --- optimistic concurrency ---
  - id: ERR_STALE_RUN_VERSION
    http: 412
    condition: "expected_run_version does not equal the parent ProductionRun's current version."
  - id: ERR_STALE_STORAGE_VERSION
    http: 412
    condition: "expected_origin_asset_version does not equal the origin StorageAsset's current version."
  # --- referential ---
  - id: ERR_PRODUCT_MISMATCH
    http: 409
    condition: "Product identity disagrees along the chain: order product line versus destination asset, shipment origin versus destination asset, or an order whose run and destination asset sit at different plants."
  # --- temporal ---
  - id: ERR_RUN_WINDOW_OVERLAP
    http: 409
    condition: "Two live ProductionRun windows on one reformer train strictly overlap on the half-open interval [window_start, window_end)."
  - id: ERR_TURNAROUND_BUFFER_CONFLICT
    http: 409
    condition: "Two outages on one plant have intersecting closed windows, or are separated by fewer than TURNAROUND_SEPARATION_BUFFER_DAYS (14) whole days."
  - id: ERR_EMISSIONS_READING_IN_FUTURE
    http: 422
    condition: "reading_at is after the logical clock."
  # --- constraint ---
  - id: ERR_TASK_CYCLE_DETECTED
    http: 409
    condition: "The proposed predecessor_task_id would close a cycle in the outage's dependency graph, or belongs to a different turnaround."
  - id: ERR_OUTAGE_WINDOW_TOO_SHORT
    http: 422
    condition: "critical_path_days exceeds window_days on submit or approve."
  - id: ERR_TASK_PREDECESSOR_NOT_DONE
    http: 409
    condition: "A task was completed while its predecessor is not DONE."
  # --- fiscal / capacity ---
  - id: ERR_AMMONIA_BALANCE_EXCEEDED
    http: 409
    condition: "A reservation's ammonia requirement exceeds ProductionRun.unallocated_ammonia_tons, or a campaign settled at an actual_ammonia_tons below the tonnage already promised to its RESERVED and CONSUMED orders."
  - id: ERR_STORAGE_CAPACITY_EXCEEDED
    http: 409
    condition: "Tonnage entering a storage asset would push on_hand_tons above capacity_tons."
  - id: ERR_STORAGE_AVAILABILITY_EXCEEDED
    http: 409
    condition: "The summed tons of overlapping BOOKED and IN_TRANSIT outbound shipments plus the proposed booking exceeds on_hand_tons minus seasonal_reserve_tons at some instant in the proposed window."
  - id: ERR_PRODUCED_EXCEEDS_RESERVED
    http: 409
    condition: "produced_tons exceeds the order's reserved_tons."

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: RegulatoryAdmin
    description: "Environmental and permitting authority for the site. Owns the air permit standing, the published spot gas index, the emissions monitoring feed and the logical clock. Cannot touch production, commercial or logistics state."
    identity: "opaque"
    exclusive_operations:
      - "POST /nitrogen-ops/plants"
      - "POST /nitrogen-ops/plants/{id}/gas-index"
      - "POST /nitrogen-ops/plants/{id}/permit-status"
      - "POST /nitrogen-ops/emissions-readings"
      - "POST /nitrogen-ops/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint in /nitrogen-ops"
  - name: ProcessEngineer
    description: "Owns the reformer trains, catalyst charges, production campaigns, outage authoring and outage execution, and books finished tons into storage. Authors outages but can never approve them, and cannot approve a campaign they created."
    identity: "opaque"
    exclusive_operations:
      - "POST /nitrogen-ops/reformer-trains"
      - "POST /nitrogen-ops/catalyst-charges"
      - "PATCH /nitrogen-ops/catalyst-charges/{id}"
      - "POST /nitrogen-ops/catalyst-charges/{id}/regenerate"
      - "POST /nitrogen-ops/production-runs"
      - "POST /nitrogen-ops/production-runs/{id}/approve"
      - "POST /nitrogen-ops/production-runs/{id}/start"
      - "POST /nitrogen-ops/production-runs/{id}/complete"
      - "POST /nitrogen-ops/production-runs/{id}/abort"
      - "POST /nitrogen-ops/production-runs/{id}/reopen"
      - "POST /nitrogen-ops/production-orders/{id}/produce"
      - "POST /nitrogen-ops/turnarounds"
      - "POST /nitrogen-ops/turnarounds/{id}/submit"
      - "POST /nitrogen-ops/turnarounds/{id}/revise"
      - "POST /nitrogen-ops/turnarounds/{id}/start"
      - "POST /nitrogen-ops/turnarounds/{id}/complete"
      - "POST /nitrogen-ops/turnaround-tasks"
      - "POST /nitrogen-ops/turnaround-tasks/{id}/complete"
    shared_operations:
      - "every GET endpoint in /nitrogen-ops"
  - name: SafetyOfficer
    description: "Process-safety and regulated-substance authority. Reviews and adjudicates outages, maintains the PSM program standing and clears regulated orders. Never authors an outage or a campaign, so approval is always someone else's signature."
    identity: "opaque"
    exclusive_operations:
      - "POST /nitrogen-ops/plants/{id}/psm-program-status"
      - "POST /nitrogen-ops/turnarounds/{id}/psm-review"
      - "POST /nitrogen-ops/turnarounds/{id}/approve"
      - "POST /nitrogen-ops/turnarounds/{id}/reject"
      - "POST /nitrogen-ops/production-orders/{id}/security-check"
    shared_operations:
      - "every GET endpoint in /nitrogen-ops"
  - name: CommercialManager
    description: "Owns the natural gas hedge book, the product slate, customer quoting and the order book, including ammonia reservations. Cannot produce tons, move product or clear a security check."
    identity: "opaque"
    exclusive_operations:
      - "POST /nitrogen-ops/gas-hedge-lots"
      - "POST /nitrogen-ops/product-lines"
      - "POST /nitrogen-ops/production-orders"
      - "POST /nitrogen-ops/production-orders/{id}/reserve"
      - "POST /nitrogen-ops/production-orders/{id}/release"
      - "POST /nitrogen-ops/price-quotes"
      - "POST /nitrogen-ops/price-quotes/{id}/issue"
      - "POST /nitrogen-ops/price-quotes/{id}/withdraw"
      - "POST /nitrogen-ops/price-quotes/{id}/revise"
      - "POST /nitrogen-ops/price-quotes/expire-due"
    shared_operations:
      - "every GET endpoint in /nitrogen-ops"
  - name: LogisticsCoordinator
    description: "Owns the storage and terminal network and the rail, barge and truck movements up to the point of delivery. Books and cancels movements but never acknowledges receipt — that signature belongs to the receiving terminal."
    identity: "opaque"
    exclusive_operations:
      - "POST /nitrogen-ops/storage-assets"
      - "POST /nitrogen-ops/storage-assets/{id}/opening-balance"
      - "POST /nitrogen-ops/shipments"
      - "POST /nitrogen-ops/shipments/{id}/book"
      - "POST /nitrogen-ops/shipments/{id}/depart"
      - "POST /nitrogen-ops/shipments/{id}/cancel"
    shared_operations:
      - "every GET endpoint in /nitrogen-ops"
  - name: TerminalOperator
    description: "The receiving end of the terminal network. Acts as a specific StorageAsset: X-User-ID is that asset's id, and the only write it may perform is acknowledging receipt of a shipment whose dest_asset_id equals its own id."
    identity: "entity_backed:StorageAsset"
    exclusive_operations:
      - "POST /nitrogen-ops/shipments/{id}/deliver"
    shared_operations:
      - "every GET endpoint in /nitrogen-ops"
