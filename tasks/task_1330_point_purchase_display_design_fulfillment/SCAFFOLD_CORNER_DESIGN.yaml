            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/programs/${program_id}/start-fulfillment"
              payload: {}
              as: ProgramManager
            - call: "GET /pop/production-runs/${run_id}/kits"
              payload: {}
              as: WarehouseOperator
              captures: { kit_id: "$.data[0].id" }
            - call: "POST /pop/kits/${kit_id}/mark-kitted"
              payload: {}
              as: WarehouseOperator
            - call: "POST /pop/shipments"
              payload: { kit_id: "${kit_id}", ship_window_start: "2026-08-10T00:00:00Z", ship_window_end: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { shipment_id: $.data.id }
            - call: "POST /pop/shipments/${shipment_id}/set-appointment"
              payload: { appointment_at: "2026-08-15T10:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /pop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pop/shipments/${shipment_id}/ship"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /pop/shipments/${shipment_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /pop/programs/${program_id}/close"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /pop/programs/${program_id}/cancel"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (CLOSED is terminal)"
      - name: side_effect_mark_produced_creates_kits
        claim_type: side_effect_execution
        grounds: [state_machines.ProductionRun.AUTHORIZED_to_PRODUCED]
        distinguishing_aspect: "mark-produced cascades to create exactly one PENDING kit per Store"
        test_recipe:
          setup:
            - "Program with 2 stores; run AUTHORIZED"
          setup_api_calls:
