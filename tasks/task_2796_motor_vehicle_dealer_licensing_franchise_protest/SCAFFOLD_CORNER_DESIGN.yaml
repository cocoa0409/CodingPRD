          - endpoints.POST_dealer-board_franchise-filings_id_finalize
        excluded_because:
          difficulty_instance: filing_finalize_blocked_by_active_protest
          rationale: "The named §1.8 instance is exactly the conditional-action corner of this endpoint: the same finalize call is refused while a live protest stands and succeeds once it is gone."

  - section: errors
    instances:
      - name: unknown_ids_on_reads_return_entity_specific_not_found_codes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MANUFACTURER_NOT_FOUND]
          - errors[ERR_HEARING_ROOM_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_SALESPERSON_NOT_FOUND]
          - errors[ERR_FILING_NOT_FOUND]
          - errors[ERR_PROTEST_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
        distinguishing_aspect: "Every detail reader answers with its own 404 code rather than a generic one: the same syntactically valid but unknown UUID yields eight different error_ids across the eight collections."
        test_recipe:
          setup:
            - "Empty store; no rows of any kind are created."
          setup_api_calls: []
          trigger:
            - call: "GET /dealer-board/manufacturers/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/hearing-rooms/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/license-applications/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/salespersons/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/franchise-filings/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/protests/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/warranty-rate-disputes/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
            - call: "GET /dealer-board/consumer-complaints/00000000-0000-4000-8000-000000000000"
              as: BoardAdmin
          assert:
            - "every call returns HTTP 404 with success false and data null"
            - "error_ids in call order: ERR_MANUFACTURER_NOT_FOUND, ERR_HEARING_ROOM_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_SALESPERSON_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_PROTEST_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND"
            - "each response carries a non-empty error.message and an error_id field"

      - name: clock_rewind_and_restamp_rejected_as_non_monotonic
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - validations.priority_52_ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "The logical clock is strictly forward-only: after advancing to 2026-09-10 both an earlier target and the identical current value are refused, and the refused calls leave the clock and every sweep counter untouched."
        test_recipe:
          setup:
            - "Clock advanced once from its 2026-08-01T00:00:00Z default to 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T23:59:59Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:01Z" }
              as: BoardAdmin
          assert:
            - "trigger 1: HTTP 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "trigger 2 (equal to the current value): HTTP 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "trigger 3 (one second forward): HTTP 200 with current_utc == 2026-09-10T00:00:01Z"
            - "trigger 3 reports swept_dealer_count 0, swept_salesperson_count 0, swept_protest_count 0 and swept_complaint_count 0"

      - name: second_hearing_room_reusing_a_room_code_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_ROOM_CODE]
          - validations.priority_60_ERR_DUPLICATE_ROOM_CODE
        distinguishing_aspect: "room_code is globally unique: a second room reusing HR-A is refused with 409 even though its seating capacity and buffer differ, and the first room's version stays 0."
        test_recipe:
          setup:
            - "One hearing room HR-A already registered."
          setup_api_calls:
            - call: "POST /dealer-board/hearing-rooms"
              payload: { room_code: "HR-A", seating_capacity: 40 }
              as: BoardAdmin
              captures: { room_e3_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/hearing-rooms"
              payload: { room_code: "HR-A", seating_capacity: 80, max_hearings_per_day: 3, buffer_minutes: 45 }
              as: BoardAdmin
          assert:
            - "HTTP status 409"
            - "error_id == ERR_DUPLICATE_ROOM_CODE"
            - "HearingRoom.${room_e3_id}.seating_capacity == 40 AND version == 0"
            - "GET /dealer-board/hearing-rooms reports total_count == 1"

      - name: complaint_resolution_state_loss_and_sanction_guards_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_COMPLAINT_STATE]
          - errors[ERR_LOSS_REQUIRED_FOR_SANCTION]
          - errors[ERR_SANCTION_TYPE_NOT_ALLOWED]
        distinguishing_aspect: "The resolution endpoint has three distinct refusals on one zero-loss complaint: resolving before the investigation (409), sanctioning a substantiated complaint whose alleged loss is 0 (422 priority 82), and pairing substantiated false with a sanction_type (422 priority 83)."
        test_recipe:
