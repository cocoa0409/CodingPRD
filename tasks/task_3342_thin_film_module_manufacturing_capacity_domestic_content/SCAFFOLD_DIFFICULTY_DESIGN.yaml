          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R (contracted_mw 10.0)"
            - "Delivery D1 SCHEDULED [2027-03-01, 2027-04-01) volume 6.0 with VERIFIED lot"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
