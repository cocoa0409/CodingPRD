              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Havenbrook Brands LLC", us_address_line: "2 Bay St, Annapolis MD 21401", contact_phone: "+1-202-555-0126", contact_email: "rp@havenbrook.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Havenbrook Eyeliner", category_code: "03B", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "DOMESTIC_ADDRESS", label_contact_value: "2 Bay St, Annapolis MD 21401" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr T Bright", assessment_basis: "PRODUCT_SPECIFIC" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "CLINICAL_SAFETY_STUDY", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "HRIPT 2025-500" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "IN_VITRO_TOXICOLOGY", reviewer_credential: "ERT", citation: "OECD 492 report" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "FULL" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/listings/${lst_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/listings/${lst_id}/listing-decision"
              payload: { decision: "LIST" }
              as: RegulatoryReviewer
