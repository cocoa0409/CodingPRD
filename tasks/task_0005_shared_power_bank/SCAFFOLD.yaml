# =============================================================================
# Shared Power Bank Operation System — Scaffold
# =============================================================================

scenario: |
  ## 5. Shared Power Bank Operation System

  **Extended System Functional Description:**

  Shared power bank operation system: multi-model device cabinet management with slot status monitoring, firmware version tracking, and offline-cabinet degraded service; borrow-and-return workflow with QR code unlock, cross-cabinet returns, return-failure retry, and stuck-device handling; time-based billing with per-hour rates, daily caps, free-period rules, and cross-city pricing differences; overdue penalty with progressive fee escalation, lost-device conversion after threshold hours, and deposit deduction; device fault reporting with user-submitted issues, automatic anomaly detection (abnormal battery level, charging failure), and repair ticket dispatch; field operation scheduling with cabinet replenishment routing, low-battery cabinet prioritization, and operator task assignment; revenue reconciliation with location-partner revenue sharing, refund-induced adjustments, invoice issuance, and periodic settlement; event-driven synchronization with payment, IM, and partner systems; risk control for repeated-refund abuse and abnormal borrow patterns.

domain_name: "shared-power-bank"
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: saga
  difficulty_target: expert

# =============================================================================
# System constants referenced by validations and state-machine thresholds
# (calculation-specific constants live under each calculations[*].constants:)
# =============================================================================
system_constants:
  HEARTBEAT_TIMEOUT_SECONDS: 300        # cabinet flips OFFLINE after 5 min without heartbeat
  MIN_DEPOSIT: 99.00                    # minimum deposit_balance required to borrow
  MAX_DEPOSIT: 99.00                    # cap (deposit endpoint clamps top-up)
  REFUND_LIMIT_30D: 5                   # risk control: refund_count_30d hard limit
  BORROW_LIMIT_24H: 10                  # risk control: borrow_count_24h hard limit
  OVERDUE_THRESHOLD_HOURS: 24           # rental flips OVERDUE when elapsed_hours > 24 (strict >)
  LOST_THRESHOLD_HOURS: 168             # rental flips LOST when elapsed_hours >= 168 (>=)
  LOST_DEVICE_FEE: 99.00                # CNY charged on LOST conversion
  LOW_BATTERY_THRESHOLD: 30             # devices with battery_level < 30 count toward operator priority
  MIN_BORROW_BATTERY: 50                # devices with battery_level < 50 are NOT eligible for borrow

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cabinet
    parent: null
    common_fields: true
    fields:
      - name: cabinet_code
        type: string
        source: input
        description: "Externally-known identifier printed on the cabinet (used for QR encoding)."
        constraints: "Globally unique."
      - name: city_code
        type: enum
        source: input
        description: "City the cabinet is located in. Drives pricing plan lookup."
        constraints: "Values: BJ, SH. Must match an existing PricingPlan.city_code."
      - name: location_partner_id
        type: string
        source: input
        description: "FK to LocationPartner. The partner whose venue hosts the cabinet."
      - name: model
        type: enum
        source: input
        description: "Hardware model."
        constraints: "Values: SLOT_8, SLOT_16, SLOT_24."
      - name: total_slots
        type: integer
        source: computed
        description: "Number of slots, derived from model: SLOT_8=8, SLOT_16=16, SLOT_24=24."
      - name: firmware_version
        type: string
        source: input
        description: "Firmware version string reported by heartbeat."
      - name: online_status
        type: enum
        source: computed
        description: "ONLINE if last heartbeat within HEARTBEAT_TIMEOUT_SECONDS, otherwise OFFLINE."
        default: ONLINE
        constraints: "Values: ONLINE, OFFLINE."
      - name: last_heartbeat_at
        type: datetime
        source: computed
        description: "Timestamp of most recent heartbeat."
        default: created_at

  - name: Slot
    parent: Cabinet
    common_fields: true
    fields:
      - name: cabinet_id
        type: string
        source: input
        description: "FK to Cabinet."
      - name: slot_index
        type: integer
        source: input
        description: "Zero-based position within the cabinet."
        constraints: "Unique within (cabinet_id, slot_index). 0 <= slot_index < cabinet.total_slots."
      - name: device_id
        type: string
        source: computed
        description: "FK to Device currently occupying this slot. null when EMPTY."
        default: null
      - name: slot_status
        type: enum
        source: computed
        description: "Current physical state."
        default: EMPTY
        constraints: "Values: EMPTY, OCCUPIED, RESERVED, FAULTY, STUCK."

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: device_code
        type: string
        source: input
        description: "Externally-known device serial number."
        constraints: "Globally unique."
      - name: model
        type: enum
        source: input
        description: "Hardware model."
        constraints: "Values: PB_5K, PB_10K, PB_20K."
      - name: battery_level
        type: integer
        source: input
        description: "Battery percentage 0-100."
        constraints: "0 <= battery_level <= 100."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: AVAILABLE
        constraints: "Values: AVAILABLE, BORROWED, FAULTY, STUCK_IN_SLOT, LOST."
      - name: current_cabinet_id
        type: string
        source: computed
        description: "FK to Cabinet currently housing the device. null when BORROWED."
        default: null
      - name: current_slot_index
        type: integer
        source: computed
        description: "Slot position within current_cabinet_id. null when BORROWED."
        default: null

  - name: PricingPlan
    parent: null
    common_fields: true
    fields:
      - name: city_code
        type: enum
        source: input
        description: "Two-letter city identifier."
        constraints: "Globally unique. Values: BJ, SH."
      - name: hourly_rate
        type: number
        source: input
        description: "CNY per hour after free period."
        constraints: "2 decimal places, > 0."
      - name: daily_cap
        type: number
        source: input
        description: "Max CNY chargeable per 24h period."
        constraints: "2 decimal places, > hourly_rate."
      - name: free_minutes
        type: integer
        source: input
        description: "Minutes free at start of every rental."
        constraints: ">= 0."
      - name: cross_city_surcharge
        type: number
        source: input
        description: "Flat CNY added when return cabinet's city_code differs from start cabinet's."
        constraints: "2 decimal places, >= 0."

  - name: User
    parent: null
    common_fields: true
    fields:
      - name: phone
        type: string
        source: input
        description: "User phone identifier."
        constraints: "Globally unique."
      - name: wallet_balance
        type: number
        source: computed
        description: "Prepaid CNY balance. Decremented on rental return, incremented on top-up and refund."
        default: 0.00
        constraints: "2 decimal places."
      - name: deposit_balance
        type: number
        source: computed
        description: "Deposit CNY held. Decremented on LOST conversion."
        default: 0.00
        constraints: "2 decimal places, 0.00 <= deposit_balance <= MAX_DEPOSIT."
      - name: refund_count_30d
        type: integer
        source: computed
        description: "Count of refunds issued to this user in the trailing 30 days, evaluated at borrow time."
        default: 0
      - name: borrow_count_24h
        type: integer
        source: computed
        description: "Count of POST /rentals attempts (successful or not) in the trailing 24 hours."
        default: 0

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - name: user_id
        type: string
        source: input
        description: "FK to User."
      - name: start_cabinet_id
        type: string
        source: input
        description: "FK to Cabinet where borrow occurred."
      - name: start_slot_index
        type: integer
        source: computed
        description: "Slot index device was dispensed from."
      - name: device_id
        type: string
        source: computed
        description: "FK to Device that was dispensed."
      - name: rented_at
        type: datetime
        source: computed
        description: "When borrow succeeded."
      - name: return_cabinet_id
        type: string
        source: input
        description: "FK to Cabinet where return was attempted. null until return."
        default: null
      - name: return_slot_index
        type: integer
        source: computed
        description: "Slot index device was returned into. null until return."
        default: null
      - name: returned_at
        type: datetime
        source: computed
        description: "When return succeeded. null until return."
        default: null
      - name: rental_status
        type: enum
        source: computed
        description: "Lifecycle state on the rental dimension."
        default: ACTIVE
        constraints: "Values: ACTIVE, OVERDUE, STUCK, RETURNED, LOST."
      - name: payment_status
        type: enum
        source: computed
        description: "Lifecycle state on the payment dimension. Evolves independently of rental_status."
        default: PENDING
        constraints: "Values: PENDING, BILLED, REFUNDED, DEPOSIT_DEDUCTED."
      - name: charged_amount
        type: number
        source: computed
        description: "Final CNY charged at return (or LOST conversion). null until BILLED/DEPOSIT_DEDUCTED."
        default: null
        constraints: "2 decimal places."
      - name: refund_amount
        type: number
        source: computed
        description: "CNY refunded if payment_status==REFUNDED. null otherwise."
        default: null
        constraints: "2 decimal places."

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - name: target_type
        type: enum
        source: input
        description: "Polymorphic target."
        constraints: "Values: DEVICE, CABINET."
      - name: target_id
        type: string
        source: input
        description: "FK to either Device or Cabinet, dispatched on target_type."
      - name: source
        type: enum
        source: input
        description: "How the ticket was raised."
        constraints: "Values: USER_REPORTED, AUTO_ANOMALY, OPERATOR_REPORTED."
      - name: issue_code
        type: enum
        source: input
        description: "Issue category."
        constraints: "Values: ABNORMAL_BATTERY, CHARGING_FAILURE, PHYSICAL_DAMAGE, STUCK_DEVICE, OFFLINE_CABINET."
      - name: status
        type: enum
        source: computed
        description: "Workflow state."
        default: OPEN
        constraints: "Values: OPEN, ASSIGNED, IN_PROGRESS, ON_HOLD, RESOLVED, CANCELLED."
      - name: assigned_operator_id
        type: string
        source: computed
        description: "Opaque operator id; null until assigned."
        default: null

  - name: OperatorTask
    parent: null
    common_fields: true
    fields:
      - name: cabinet_id
        type: string
        source: input
        description: "FK to Cabinet the task targets."
      - name: task_type
        type: enum
        source: input
        description: "Operational action."
        constraints: "Values: REPLENISHMENT, MAINTENANCE_SWAP, REPAIR_DISPATCH."
      - name: priority_score
        type: integer
        source: computed
        description: "Higher score = more urgent. Computed at creation, refreshed on auto-assign."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Workflow state."
        default: PENDING
        constraints: "Values: PENDING, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED."
      - name: assigned_operator_id
        type: string
        source: computed
        description: "Opaque operator id; null until assigned."
        default: null
      - name: linked_repair_ticket_id
        type: string
        source: input
        description: "FK to RepairTicket when task_type==REPAIR_DISPATCH; null otherwise."
        default: null

  - name: LocationPartner
    parent: null
    common_fields: true
    fields:
      - name: partner_code
        type: string
        source: input
        description: "Externally-known partner identifier."
        constraints: "Globally unique."
      - name: name
        type: string
        source: input
        description: "Partner display name."
      - name: revenue_share_pct
        type: number
        source: input
        description: "Decimal fraction of rental revenue paid to partner (e.g., 0.335 = 33.5%)."
        constraints: "0 <= revenue_share_pct <= 1, up to 4 decimal places."

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: location_partner_id
        type: string
        source: input
        description: "FK to LocationPartner the settlement is for."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the settlement period."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the settlement period."
      - name: gross_revenue
        type: number
        source: computed
        description: "Sum of qualifying Rental.charged_amount within period (see calc revenue_share_for_settlement)."
        constraints: "2 decimal places."
      - name: partner_amount
        type: number
        source: computed
        description: "Partner's share of gross_revenue; round-per-rental-then-sum (see calc revenue_share_for_settlement)."
        constraints: "2 decimal places."
      - name: refund_adjustment
        type: number
        source: computed
        description: "Sum of partner-attributed refunds within period; subtracted from partner_amount on settled variant."
        constraints: "2 decimal places."
      - name: status
        type: enum
        source: computed
        description: "Workflow state."
        default: DRAFT
        constraints: "Values: DRAFT, APPROVED, INVOICED, CANCELLED."
      - name: invoice_number
        type: string
        source: computed
        description: "Generated on issue-invoice. null until INVOICED."
        default: null

  - name: PaymentEvent
    parent: null
    common_fields: false
    fields:
      - name: idempotency_key
        type: string
        source: input
        description: "Caller-provided unique key for idempotent receipt."
        constraints: "Globally unique."
      - name: event_type
        type: enum
        source: input
        description: "Payment event kind."
        constraints: "Values: PAYMENT_CONFIRMED, PAYMENT_FAILED, REFUND_CONFIRMED."
      - name: rental_id
        type: string
        source: input
        description: "FK to Rental the event applies to."
      - name: amount
        type: number
        source: input
        description: "CNY amount."
        constraints: "2 decimal places."
      - name: occurred_at
        type: datetime
        source: input
        description: "Wall-clock time of the upstream payment event."

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - name: cabinet_id
        type: string
        source: input
        description: "FK to Cabinet."
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of maintenance window."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of maintenance window."
        constraints: "window_end > window_start."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: SCHEDULED
        constraints: "Values: SCHEDULED, CANCELLED."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Rental: parallel dimensions (rental_status × payment_status) ----
  - entity: Rental
    dimension: rental_status
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: ACTIVE
        to: STUCK
        trigger: "POST /rentals/{id}/return when slot rejects device (return-failure)"
        actor: User
        preconditions:
          - "rental.rental_status == ACTIVE"
          - "return target slot.slot_status NOT IN {EMPTY}"
        side_effects:
          - "Rental.return_cabinet_id set to attempted cabinet"
          - "Slot.slot_status -> STUCK on the attempted return slot"
          - "Device.status -> STUCK_IN_SLOT"
          - "RepairTicket auto-created (target_type=DEVICE, source=AUTO_ANOMALY, issue_code=STUCK_DEVICE)"
        note: "First leg of the cycle ACTIVE↔STUCK."

      - from: STUCK
        to: ACTIVE
        trigger: "POST /rentals/{id}/return-retry when retry succeeds"
        actor: User
        preconditions:
          - "rental.rental_status == STUCK"
          - "target slot.slot_status == EMPTY at retry time"
        side_effects:
          - "Slot.slot_status returns to EMPTY (was STUCK)"
          - "Device.status -> AVAILABLE (was STUCK_IN_SLOT)"
          - "Rental returns to ACTIVE so subsequent return attempts can complete (cycle close)"
        note: "Cycle close. The retry resolves the stuck condition; final return then occurs as a separate ACTIVE→RETURNED transition."

      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rentals/{id}/return when slot accepts device"
        actor: User
        preconditions:
          - "rental.rental_status == ACTIVE"
          - "elapsed_hours_since_rented_at <= 24"
          - "return cabinet.online_status == ONLINE"
          - "target slot.slot_status == EMPTY"
        side_effects:
          - "Rental.returned_at = now()"
          - "Slot.slot_status -> OCCUPIED on return slot"
          - "Slot.device_id = rental.device_id on return slot"
          - "Device.status -> AVAILABLE; Device.current_cabinet_id, current_slot_index updated"
          - "Calc rental_billing (final variant) runs; Rental.charged_amount populated"
          - "User.wallet_balance -= Rental.charged_amount"
          - "Rental.payment_status -> BILLED (parallel-dimension transition)"

      - from: ACTIVE
        to: OVERDUE
        trigger: "POST /_sweep/run when (now() - rented_at) > 24 hours"
        actor: system
        preconditions:
          - "rental.rental_status == ACTIVE"
          - "(now() - rented_at).total_hours > 24"
        side_effects:
          - "rental_status changes; provisional billing now includes overdue penalty (calc overdue_penalty)"

      - from: OVERDUE
        to: RETURNED
        trigger: "POST /rentals/{id}/return when slot accepts device"
        actor: User
        preconditions:
          - "rental.rental_status == OVERDUE"
          - "(now() - rented_at).total_hours < 168"
          - "return cabinet.online_status == ONLINE"
          - "target slot.slot_status == EMPTY"
        side_effects:
          - "Rental.returned_at = now()"
          - "Slot/Device updated as in ACTIVE→RETURNED"
          - "Calc rental_billing (final variant) + calc overdue_penalty run; Rental.charged_amount populated"
          - "User.wallet_balance -= Rental.charged_amount"
          - "Rental.payment_status -> BILLED"

      - from: OVERDUE
        to: LOST
        trigger: "POST /_sweep/run when (now() - rented_at) >= 168 hours"
        actor: system
        preconditions:
          - "rental.rental_status == OVERDUE"
          - "(now() - rented_at).total_hours >= 168"
        side_effects:
          - "Rental.charged_amount = LOST_DEVICE_FEE (99.00); replaces any prior provisional value"
          - "Calc lost_conversion runs"
          - "User.deposit_balance -= min(deposit_balance, LOST_DEVICE_FEE); residual debited from wallet"
          - "Rental.payment_status -> DEPOSIT_DEDUCTED"
          - "Device.status -> LOST; Device.current_cabinet_id and current_slot_index unchanged (stale snapshot)"

  - entity: Rental
    dimension: payment_status
    initial_state: PENDING
    terminal_states: [REFUNDED, DEPOSIT_DEDUCTED]
    transitions:
      - from: PENDING
        to: BILLED
        trigger: "Bubble-up from ACTIVE→RETURNED or OVERDUE→RETURNED"
        actor: system
        preconditions:
          - "rental_status transitioned to RETURNED in same operation"
        side_effects:
          - "User.wallet_balance debited (already enumerated under rental_status side effects)"

      - from: BILLED
        to: REFUNDED
        trigger: "POST /rentals/{id}/refund"
        actor: Admin
        preconditions:
          - "rental.payment_status == BILLED"
          - "rental.rental_status == RETURNED"
        side_effects:
          - "Rental.refund_amount = Rental.charged_amount"
          - "User.wallet_balance += Rental.refund_amount"
          - "If rental falls inside an INVOICED Settlement period: Settlement.refund_adjustment += refund_amount (cascade leg toward calc revenue_share_for_settlement)"

      - from: PENDING
        to: DEPOSIT_DEDUCTED
        trigger: "Bubble-up from OVERDUE→LOST"
        actor: system
        preconditions:
          - "rental_status transitioned to LOST in same operation"
        side_effects:
          - "User.deposit_balance and wallet_balance debited as enumerated under rental_status"

  # ---- Device ----
  - entity: Device
    initial_state: AVAILABLE
    terminal_states: [LOST]
    transitions:
      - from: AVAILABLE
        to: BORROWED
        trigger: "POST /rentals (selector picks this device)"
        actor: User
        preconditions:
          - "device.status == AVAILABLE"
          - "device.battery_level >= 50"
        side_effects:
          - "device.current_cabinet_id, current_slot_index cleared"
          - "Slot.device_id cleared, Slot.slot_status -> EMPTY"

      - from: BORROWED
        to: AVAILABLE
        trigger: "POST /rentals/{id}/return success"
        actor: User
        preconditions:
          - "device.status == BORROWED"
        side_effects:
          - "device.current_cabinet_id, current_slot_index populated to return slot"

      - from: BORROWED
        to: STUCK_IN_SLOT
        trigger: "POST /rentals/{id}/return when slot rejects device"
        actor: User
        preconditions: []
        side_effects: []

      - from: STUCK_IN_SLOT
        to: AVAILABLE
        trigger: "POST /rentals/{id}/return-retry success OR POST /cabinets/{id}/slots/{slot_index}/eject"
        actor: User | Operator
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: FAULTY
        trigger: "Cascade: a RepairTicket targeting this device was just created (via /_sweep/run anomaly or POST /devices/{id}/report-fault on a not-yet-borrowed device)"
        actor: system
        preconditions:
          - "device.status == AVAILABLE"
          - "a RepairTicket has been created in the same operation with target_type==DEVICE and target_id == this device.id"
        side_effects:
          - "if device is currently housed in a Slot (current_cabinet_id and current_slot_index not null): cascade leg → Slot.slot_status transitions OCCUPIED → FAULTY"
        note: "This transition is the second hop in the anomaly cascade chain: ticket creation → device FAULTY → slot FAULTY → operator task. Each link is caused by the previous one, not by the original action."

      - from: FAULTY
        to: AVAILABLE
        trigger: "POST /repair-tickets/{id}/resolve where ticket targets this device"
        actor: Operator
        preconditions:
          - "ticket.status == IN_PROGRESS"
          - "ticket.target_id == device.id"
        side_effects:
          - "Slot.slot_status -> EMPTY/OCCUPIED depending on whether device is in slot"

      - from: BORROWED
        to: LOST
        trigger: "POST /_sweep/run when overdue rental crosses LOST threshold"
        actor: system
        preconditions:
          - "linked rental.rental_status == OVERDUE"
          - "(now() - rental.rented_at).total_hours >= 168"
        side_effects: []

  # ---- RepairTicket: cycle on IN_PROGRESS↔ON_HOLD (non-linear) ----
  - entity: RepairTicket
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /repair-tickets/{id}/assign"
        actor: Operator
        preconditions:
          - "ticket.status == OPEN"
        side_effects:
          - "ticket.assigned_operator_id set"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "Implicit: first hold/resolve sets IN_PROGRESS automatically"
        actor: Operator
        preconditions:
          - "ticket.status == ASSIGNED"
        side_effects: []
        note: "ASSIGNED→IN_PROGRESS auto-transitions on first call to /hold or /resolve."

      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /repair-tickets/{id}/hold"
        actor: Operator
        preconditions:
          - "ticket.status == IN_PROGRESS"
        side_effects: []

      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /repair-tickets/{id}/resume"
        actor: Operator
        preconditions:
          - "ticket.status == ON_HOLD"
        side_effects: []
        note: "Cycle close. ON_HOLD↔IN_PROGRESS may iterate any number of times before RESOLVED."

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /repair-tickets/{id}/resolve"
        actor: Operator
        preconditions:
          - "ticket.status == IN_PROGRESS"
        side_effects:
          - "If ticket.target_type == DEVICE: Device.status -> AVAILABLE"
          - "If ticket.target_type == CABINET: no entity change beyond ticket"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /repair-tickets/{id}/resolve with body.cancel == true"
        actor: Operator
        preconditions:
          - "ticket.status == ASSIGNED"
        side_effects: []

  # ---- OperatorTask ----
  - entity: OperatorTask
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: ASSIGNED
        trigger: "POST /operator-tasks/auto-assign"
        actor: Operator
        preconditions:
          - "task.status == PENDING"
          - "task is winner of the priority-score selector (calc operator_task_priority)"
        side_effects:
          - "task.assigned_operator_id set to caller's operator_id"
          - "task.status -> ASSIGNED"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "implicit on first /complete attempt; client need not transition explicitly"
        actor: Operator
        preconditions:
          - "task.status == ASSIGNED"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /operator-tasks/{id}/complete"
        actor: Operator
        preconditions:
          - "task.status IN {ASSIGNED, IN_PROGRESS}"
          - "If task.task_type == REPAIR_DISPATCH: linked RepairTicket.status == RESOLVED"
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: "POST /operator-tasks/{id}/complete with body.cancel == true"
        actor: Admin
        preconditions:
          - "task.status == PENDING"
        side_effects: []

  # ---- Settlement ----
  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /settlements/{id}/approve"
        actor: Admin
        preconditions:
          - "settlement.status == DRAFT"
          - "calc revenue_share_for_settlement (provisional variant) has been computed"
        side_effects: []

      - from: APPROVED
        to: INVOICED
        trigger: "POST /settlements/{id}/issue-invoice"
        actor: Admin
        preconditions:
          - "settlement.status == APPROVED"
        side_effects:
          - "settlement.invoice_number generated"
          - "calc revenue_share_for_settlement (settled variant) recomputed; partner_amount and refund_adjustment frozen"

  # ---- Slot ----
  - entity: Slot
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: OCCUPIED
        trigger: "POST /rentals/{id}/return success"
        actor: User
        preconditions:
          - "slot.slot_status == EMPTY"
        side_effects:
          - "slot.device_id populated"

      - from: OCCUPIED
        to: EMPTY
        trigger: "POST /rentals (selector dispenses this slot's device)"
        actor: User
        preconditions:
          - "slot.slot_status == OCCUPIED"
        side_effects:
          - "slot.device_id cleared"

      - from: OCCUPIED
        to: FAULTY
        trigger: "Cascade: housed Device just transitioned AVAILABLE → FAULTY"
        actor: system
        preconditions:
          - "slot.slot_status == OCCUPIED"
          - "device housed in this slot transitioned to FAULTY in the same operation"
        side_effects:
          - "Cascade leg → OperatorTask auto-created (task_type=REPAIR_DISPATCH, cabinet_id=this slot's cabinet_id, linked_repair_ticket_id=the ticket whose creation initiated the chain, priority_score recomputed via calc operator_task_priority)"
        note: "Third hop in the anomaly cascade chain. The trigger is the device transition, not the API call."

      - from: EMPTY
        to: STUCK
        trigger: "POST /rentals/{id}/return triggers return-failure"
        actor: User
        preconditions: []
        side_effects: []

      - from: STUCK
        to: EMPTY
        trigger: "POST /rentals/{id}/return-retry success OR POST /cabinets/{id}/slots/{slot_index}/eject"
        actor: User | Operator
        preconditions: []
        side_effects: []

      - from: FAULTY
        to: EMPTY
        trigger: "POST /repair-tickets/{id}/resolve where ticket relates to housed device"
        actor: Operator
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two users borrow from the same cabinet simultaneously and the selector picks the same device"
    guarantee: "At most one rental wins; second is rejected"
    error_id: ERR_NO_AVAILABLE_DEVICE
    http_status: 409
    serialization: "First-writer-wins on Device.status BORROWED transition"

  - scenario: "Two operators auto-assign the same OperatorTask simultaneously"
    guarantee: "At most one assignment wins; second is rejected"
    error_id: ERR_TASK_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on OperatorTask.assigned_operator_id"

  - scenario: "Return and refund-issue happen simultaneously on the same rental"
    guarantee: "Exactly one operation succeeds; loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Rental.payment_status"

  - scenario: "Two PaymentEvents arrive with the same idempotency_key"
    guarantee: "Second is rejected as duplicate; no second side effect"
    error_id: ERR_DUPLICATE_PAYMENT_EVENT
    http_status: 409
    serialization: "First-writer-wins on PaymentEvent.idempotency_key"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_billing
    trigger: "GET /rentals/{id} (provisional variant); POST /rentals/{id}/return (final variant)"
    algorithm: tiered_pricing
    formula: |
      # All arithmetic uses Decimal with ROUND_HALF_UP at 2 decimal places.
      end_time = (provisional) clock.now() : (final) rental.returned_at
      total_minutes = floor((end_time - rental.rented_at).total_seconds() / 60)
      billable_minutes = max(0, total_minutes - plan.free_minutes)
      billable_hours = ceil(billable_minutes / 60)

      if billable_hours <= 24:
          rental_fee = min(billable_hours * plan.hourly_rate, plan.daily_cap)
      else:
          rental_fee = plan.daily_cap   # 24h fully filled at daily_cap
      # Cross-city surcharge applies only on final variant when start_cabinet.city_code != return_cabinet.city_code.
      if final and rental.return_cabinet_id is not None and start_city != return_city:
          rental_fee += plan.cross_city_surcharge
      total = rental_fee
    input_set: "Rental and its start-cabinet PricingPlan; on final variant also return-cabinet PricingPlan."
    constants:
      ROUNDING_MODE: ROUND_HALF_UP
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Read on GET /rentals/{id} while rental_status IN {ACTIVE, OVERDUE, STUCK}"
        difference: "end_time = clock.now(); cross_city_surcharge NEVER applied (return cabinet not yet known)."
      - name: final
        when: "On POST /rentals/{id}/return when rental_status IN {ACTIVE, OVERDUE} transitions to RETURNED"
        difference: "end_time = rental.returned_at; cross_city_surcharge applied if start.city_code != return.city_code."

  - name: overdue_penalty
    trigger: "GET /rentals/{id} or POST /rentals/{id}/return when rental.rental_status == OVERDUE; POST /_sweep/run"
    algorithm: tiered_pricing
    formula: |
      elapsed_seconds = ((provisional) clock.now() : (final) rental.returned_at) - rental.rented_at
      elapsed_hours = floor(elapsed_seconds.total_seconds() / 3600)

      if elapsed_hours <= 24:
          overdue_fee = 0.00
      else:
          overdue_hours = elapsed_hours - 24
          if overdue_hours <= 48:
              overdue_fee = overdue_hours * OVERDUE_TIER_A_HOURLY    # 5.00 CNY/h, hours 24-72 elapsed
          elif overdue_hours <= 144:
              overdue_fee = (48 * OVERDUE_TIER_A_HOURLY) + ((overdue_hours - 48) * OVERDUE_TIER_B_HOURLY)
              # OVERDUE_TIER_B_HOURLY = 10.00 CNY/h, hours 72-168 elapsed
          else:
              overdue_fee = (48 * OVERDUE_TIER_A_HOURLY) + (96 * OVERDUE_TIER_B_HOURLY)   # capped pre-LOST
      total = overdue_fee
    input_set: "Rental in rental_status==OVERDUE."
    constants:
      OVERDUE_TIER_A_HOURLY: 5.00
      OVERDUE_TIER_B_HOURLY: 10.00
      ROUNDING_MODE: ROUND_HALF_UP
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: lost_conversion
    trigger: "POST /_sweep/run when rental.rental_status == OVERDUE and elapsed_hours >= 168"
    algorithm: threshold
    formula: |
      Rental.charged_amount = LOST_DEVICE_FEE                # 99.00 CNY, replaces any provisional rental_fee+overdue
      deposit_deduction = min(user.deposit_balance, LOST_DEVICE_FEE)
      residual = LOST_DEVICE_FEE - deposit_deduction
      user.deposit_balance -= deposit_deduction              # clamped at 0
      user.wallet_balance -= residual                        # may go negative
      Rental.payment_status = DEPOSIT_DEDUCTED
      Device.status = LOST
    input_set: "Rental crossing 168h elapsed threshold."
    constants:
      LOST_DEVICE_FEE: 99.00
      LOST_THRESHOLD_HOURS: 168
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: revenue_share_for_settlement
    trigger: "POST /settlements (provisional variant); POST /settlements/{id}/issue-invoice (settled variant)"
    algorithm: aggregation
    formula: |
      # Universe of rentals attributable to this partner-period:
      #   r.start_cabinet.location_partner_id == settlement.location_partner_id
      #   AND r.rental_status == RETURNED
      #   AND r.returned_at IN [period_start, period_end)
      universe = [r for r in Rental satisfying the above]

      # Provisional variant (POST /settlements):
      if variant == provisional:
          billed = [r in universe if r.payment_status == BILLED]
          # Pinned order: round PER RENTAL to 2dp ROUND_HALF_UP, then sum.
          partner_amount = sum(round(r.charged_amount * partner.revenue_share_pct, 2, ROUND_HALF_UP)
                               for r in billed)
          gross_revenue = sum(r.charged_amount for r in billed)
          refund_adjustment = 0.00

      # Settled variant (POST /settlements/{id}/issue-invoice):
      else:
          billed    = [r in universe if r.payment_status == BILLED]
          refunded  = [r in universe if r.payment_status == REFUNDED]

          # refund_adjustment: sum of partner-share of refunds, rounded per rental then summed.
          refund_adjustment = sum(round(r.refund_amount * partner.revenue_share_pct, 2, ROUND_HALF_UP)
                                  for r in refunded)
          # partner_amount = (provisional-style sum of BILLED rentals' shares)  MINUS  refund_adjustment.
          partner_amount = (sum(round(r.charged_amount * partner.revenue_share_pct, 2, ROUND_HALF_UP)
                                for r in billed)
                            - refund_adjustment)
          gross_revenue = sum(r.charged_amount for r in billed) - sum(r.refund_amount for r in refunded)
    input_set: "Rentals whose start_cabinet.location_partner_id == settlement.location_partner_id, returned within period, rental_status==RETURNED."
    constants:
      ROUNDING_MODE: ROUND_HALF_UP
    precision: "2 decimal places, round_half_up; rounding-order PINNED: per-rental round, then sum. NOT sum-then-round."
    variants:
      - name: provisional
        when: "POST /settlements creates the row; partner_amount visible immediately"
        difference: "Filters universe to payment_status==BILLED; refund_adjustment = 0.00 because pending refunds are not yet attributed to this period."
      - name: settled
        when: "POST /settlements/{id}/issue-invoice freezes the values"
        difference: "Adds refunded rentals into the calculation: computes refund_adjustment from REFUNDED rentals in the same universe and subtracts it from the BILLED partner_amount. partner_amount and refund_adjustment are frozen on the Settlement row."

  - name: operator_task_priority
    trigger: "On OperatorTask creation and on each POST /operator-tasks/auto-assign call (re-evaluated for ranking)"
    algorithm: weighted_scoring
    formula: |
      # Filter low_battery_count to AVAILABLE devices only — FAULTY/STUCK_IN_SLOT/LOST devices are
      # out of service and do not count toward replenishment urgency.
      low_battery_count = count(d for d in Device
                                where d.current_cabinet_id == cabinet.id
                                  AND d.status == AVAILABLE
                                  AND d.battery_level < LOW_BATTERY_THRESHOLD)
      faulty_slot_count = count(s for s in Slot
                                where s.cabinet_id == cabinet.id
                                  AND s.slot_status == FAULTY)
      offline_bonus     = OFFLINE_BONUS if cabinet.online_status == OFFLINE else 0
      priority_score    = (LOW_BATTERY_WEIGHT * low_battery_count)
                        + (FAULTY_SLOT_WEIGHT * faulty_slot_count)
                        + offline_bonus
    input_set: "Cabinet linked to the task, plus its child slots and devices (Devices filtered to status==AVAILABLE for low_battery_count)."
    constants:
      LOW_BATTERY_WEIGHT: 10
      FAULTY_SLOT_WEIGHT: 5
      OFFLINE_BONUS: 50
      LOW_BATTERY_THRESHOLD: 30
    precision: "Integer; no rounding."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /payment-events, POST /_clock/advance, POST /_sweep/run, POST /_events/emit"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-parameter resources exist; left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: validation
    check: "Request body field shapes (types, enum membership, ranges)"
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for this operation; includes Rental.rental_status, RepairTicket.status, OperatorTask.status, Settlement.status, Device.status, Slot.slot_status preconditions enumerated in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 6
    category: state
    check: "Caller has no other ACTIVE/OVERDUE/STUCK Rental (one active rental per User invariant)"
    error_id: ERR_DUPLICATE_RENTAL
    http_status: 409
    applies_to: "POST /rentals"

  - priority: 7
    category: business_referential
    check: "Acting User owns the Rental (Rental.user_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /rentals/{id}/return, POST /rentals/{id}/return-retry, GET /rentals/{id}"

  - priority: 8
    category: business_safety
    check: "Cabinet.online_status == ONLINE for borrow/return"
    error_id: ERR_CABINET_OFFLINE
    http_status: 409
    applies_to: "POST /rentals, POST /rentals/{id}/return, POST /rentals/{id}/return-retry"

  - priority: 9
    category: business_safety
    check: "Maintenance window is not currently active for the cabinet (clock.now() falls outside any SCHEDULED MaintenanceWindow with window_start <= now < window_end)"
    error_id: ERR_CABINET_UNDER_MAINTENANCE
    http_status: 409
    applies_to: "POST /rentals, POST /rentals/{id}/return, POST /rentals/{id}/return-retry"

  - priority: 10
    category: business_constraint
    check: "Cabinet has at least one Device with status==AVAILABLE and battery_level >= 50"
    error_id: ERR_NO_AVAILABLE_DEVICE
    http_status: 409
    applies_to: "POST /rentals"

  - priority: 11
    category: business_constraint
    check: "Return slot.slot_status == EMPTY at moment of return"
    error_id: ERR_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /rentals/{id}/return"

  - priority: 12
    category: business_temporal
    check: "New MaintenanceWindow does not overlap any other SCHEDULED MaintenanceWindow on the same cabinet, using half-open interval semantics: [a.start, a.end) ∩ [b.start, b.end) == ∅; touching (a.end == b.start) is permitted"
    error_id: ERR_MAINTENANCE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /maintenance-windows"

  - priority: 13
    category: business_referential
    check: "PricingPlan exists for the start cabinet's city_code"
    error_id: ERR_PRICING_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /rentals"

  - priority: 14
    category: business_safety
    check: "Risk control: User.refund_count_30d < REFUND_LIMIT_30D (5)"
    error_id: ERR_REFUND_LIMIT_EXCEEDED
    http_status: 403
    applies_to: "POST /rentals"

  - priority: 15
    category: business_safety
    check: "Risk control: User.borrow_count_24h < BORROW_LIMIT_24H (10)"
    error_id: ERR_ABNORMAL_BORROW_PATTERN
    http_status: 403
    applies_to: "POST /rentals"

  - priority: 16
    category: business_fiscal
    check: "User.deposit_balance >= MIN_DEPOSIT (99.00)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /rentals"

  - priority: 17
    category: business_fiscal
    check: "User.wallet_balance >= 0 at moment of borrow (no outstanding debt)"
    error_id: ERR_WALLET_INSUFFICIENT
    http_status: 402
    applies_to: "POST /rentals"

  - priority: 18
    category: business_constraint
    check: "Settlement.period_end > Settlement.period_start"
    error_id: ERR_SETTLEMENT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /settlements"

  - priority: 19
    category: state
    check: "OperatorTask.task_type == REPAIR_DISPATCH requires linked RepairTicket.status == RESOLVED before complete"
    error_id: ERR_TICKET_UNRESOLVED
    http_status: 409
    applies_to: "POST /operator-tasks/{id}/complete"

  - priority: 20
    category: business_referential
    check: "PaymentEvent.idempotency_key is unique"
    error_id: ERR_DUPLICATE_PAYMENT_EVENT
    http_status: 409
    applies_to: "POST /payment-events"

  - priority: 21
    category: state
    check: "OCC version check on PATCH/mutation endpoints when client supplies version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints with optional version field"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Cabinet ----
  - method: POST
    path: "/cabinets"
    description: "Admin creates a cabinet."
    roles: [Admin]
    code: 201
    input: [cabinet_code, city_code, location_partner_id, model, firmware_version]
    output: Cabinet
    side_effects: ["total_slots derived from model", "child Slot rows auto-created in EMPTY state for slot_index in [0, total_slots)"]

  - method: GET
    path: "/cabinets/{id}"
    description: "Get cabinet with slots embedded as 'slots' array."
    roles: [Admin, Operator]
    code: 200
    input: []
    output: Cabinet
    side_effects: []

  - method: POST
    path: "/cabinets/{id}/heartbeat"
    description: "Cabinet posts heartbeat (system event). Sets last_heartbeat_at = body.timestamp; online_status = ONLINE if (clock.now() - timestamp) < HEARTBEAT_TIMEOUT_SECONDS, else OFFLINE."
    roles: [Admin]
    code: 200
    input: ["timestamp", "firmware_version?"]
    output: Cabinet
    side_effects: ["if online_status flips OFFLINE -> ONLINE: emit re-online event; if ONLINE -> OFFLINE: existing in-flight rentals continue but new borrows on this cabinet become rejectable"]

  # ---- Slot ----
  - method: POST
    path: "/cabinets/{id}/slots/{slot_index}/eject"
    description: "Operator force-ejects a stuck device from a slot."
    roles: [Operator]
    code: 200
    input: []
    output: Slot
    side_effects: ["slot.slot_status STUCK -> EMPTY", "Device.status STUCK_IN_SLOT -> AVAILABLE", "if linked Rental.rental_status == STUCK: rental remains STUCK (operator eject does NOT close cycle; user must call return-retry to close)"]

  # ---- Device ----
  - method: POST
    path: "/devices"
    description: "Admin registers a device into a slot."
    roles: [Admin]
    code: 201
    input: [device_code, model, battery_level, current_cabinet_id, current_slot_index]
    output: Device
    side_effects: ["target Slot.device_id set", "target Slot.slot_status EMPTY -> OCCUPIED"]

  - method: GET
    path: "/devices/{id}"
    description: "Get device."
    roles: [Admin, Operator]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/devices/{id}/report-fault"
    description: "User reports a fault on the device they are currently holding."
    roles: [User]
    code: 200
    input: [issue_code]
    output: RepairTicket
    side_effects:
      - "Action: RepairTicket created (target_type=DEVICE, target_id={id}, source=USER_REPORTED, status=OPEN)."
      - "If device.status == BORROWED at the moment of report: Device.status remains BORROWED. The fault is recorded against the ticket; on subsequent return, the return endpoint marks the device FAULTY (not AVAILABLE)."
      - "If device.status == AVAILABLE (in slot — non-typical for user-reported, but the endpoint accepts it): cascade per §1.2 fires (Device AVAILABLE→FAULTY → Slot OCCUPIED→FAULTY → OperatorTask auto-created)."
    note: "Caller (User) MUST be the holder: there must exist a Rental with user_id==X-User-ID, device_id=={id}, rental_status IN {ACTIVE, OVERDUE, STUCK}; otherwise ERR_FORBIDDEN."

  # ---- PricingPlan ----
  - method: POST
    path: "/pricing-plans"
    description: "Admin creates a PricingPlan for a city."
    roles: [Admin]
    code: 201
    input: [city_code, hourly_rate, daily_cap, free_minutes, cross_city_surcharge]
    output: PricingPlan
    side_effects: []

  # ---- User ----
  - method: POST
    path: "/users"
    description: "Register a user."
    roles: [Admin]
    code: 201
    input: [phone]
    output: User
    side_effects: []

  - method: GET
    path: "/users/{id}"
    description: "Get user (own record only for User role)."
    roles: [Admin, User]
    code: 200
    input: []
    output: User
    side_effects: []

  - method: POST
    path: "/users/{id}/wallet/topup"
    description: "Top up wallet."
    roles: [User]
    code: 200
    input: [amount]
    output: User
    side_effects: ["User.wallet_balance += amount"]

  - method: POST
    path: "/users/{id}/deposit"
    description: "Pay deposit."
    roles: [User]
    code: 200
    input: [amount]
    output: User
    side_effects: ["User.deposit_balance += amount"]

  # ---- Rental ----
  - method: POST
    path: "/rentals"
    description: "Borrow a power bank from a cabinet. Server picks AVAILABLE device with highest battery_level (selector policy)."
    roles: [User]
    code: 201
    input: [cabinet_id]
    output: Rental
    side_effects:
      - "Selector policy: eligibility {device.status==AVAILABLE AND device.current_cabinet_id==cabinet_id AND device.battery_level >= 50}; ranking ORDER BY battery_level DESC; tie-break ORDER BY device.id ASC; empty pool -> ERR_NO_AVAILABLE_DEVICE"
      - "selected Device.status -> BORROWED"
      - "selected Slot.slot_status OCCUPIED -> EMPTY; Slot.device_id cleared"
      - "Rental created with rental_status=ACTIVE, payment_status=PENDING, rented_at=clock.now()"
      - "User.borrow_count_24h += 1"

  - method: GET
    path: "/rentals/{id}"
    description: "Get rental with provisional billing computed (calc rental_billing provisional + calc overdue_penalty if OVERDUE)."
    roles: [Admin, User]
    code: 200
    input: []
    output: Rental
    side_effects: []

  - method: POST
    path: "/rentals/{id}/return"
    description: "Return device at any cabinet (cross-cabinet allowed)."
    roles: [User]
    code: 200
    input: [return_cabinet_id]
    output: Rental
    side_effects:
      - "Selector policy for return slot: eligibility {slot.slot_status==EMPTY AND slot.cabinet_id==return_cabinet_id}; ranking ORDER BY slot_index ASC; tie-break n/a; empty pool -> ERR_RETURN_FAILED with rental.rental_status=ACTIVE/OVERDUE -> STUCK and slot of attempted return left STUCK"
      - "On success: cascade chain ACTIVE→RETURNED documented in §1.2"
      - "On return-failure: rental_status flips to STUCK; first chosen slot.slot_status=STUCK; Device.status=STUCK_IN_SLOT; RepairTicket auto-created"

  - method: POST
    path: "/rentals/{id}/return-retry"
    description: "Retry return after a STUCK condition. Chooses a different slot if previous was STUCK; on success closes the STUCK→ACTIVE cycle and immediately performs ACTIVE→RETURNED."
    roles: [User]
    code: 200
    input: [return_cabinet_id]
    output: Rental
    side_effects:
      - "if retry succeeds: Slot previously STUCK -> EMPTY (cascade), Device STUCK_IN_SLOT -> AVAILABLE (cascade), Rental STUCK -> ACTIVE -> RETURNED (cycle close + final return)"

  - method: POST
    path: "/rentals/{id}/refund"
    description: "Admin refunds a rental that was billed."
    roles: [Admin]
    code: 200
    input: []
    output: Rental
    side_effects:
      - "Rental.payment_status BILLED -> REFUNDED"
      - "Rental.refund_amount = Rental.charged_amount"
      - "User.wallet_balance += refund_amount"
      - "User.refund_count_30d += 1"
      - "if rental's start_cabinet's partner has any INVOICED Settlement covering rental.returned_at: that Settlement.refund_adjustment += per-rental partner share (cascade leg, calc revenue_share_for_settlement settled variant)"

  # ---- RepairTicket ----
  - method: GET
    path: "/repair-tickets/{id}"
    description: "Get repair ticket."
    roles: [Admin, Operator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{id}/assign"
    description: "Operator self-assigns to a ticket."
    roles: [Operator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["ticket.assigned_operator_id = X-User-ID; ticket.status OPEN -> ASSIGNED"]

  - method: POST
    path: "/repair-tickets/{id}/hold"
    description: "Operator pauses an in-progress ticket."
    roles: [Operator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["if ticket.status == ASSIGNED: auto-transition to IN_PROGRESS first; then IN_PROGRESS -> ON_HOLD"]

  - method: POST
    path: "/repair-tickets/{id}/resume"
    description: "Operator resumes a held ticket."
    roles: [Operator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["ticket.status ON_HOLD -> IN_PROGRESS (cycle close)"]

  - method: POST
    path: "/repair-tickets/{id}/resolve"
    description: "Operator resolves (or cancels with body.cancel=true) a ticket."
    roles: [Operator]
    code: 200
    input: ["cancel?"]
    output: RepairTicket
    side_effects:
      - "if cancel==true and status==ASSIGNED: -> CANCELLED"
      - "else: -> RESOLVED"
      - "if RESOLVED and target_type==DEVICE: Device.status FAULTY -> AVAILABLE; Slot.slot_status FAULTY -> EMPTY/OCCUPIED depending on slot.device_id"

  # ---- OperatorTask ----
  - method: POST
    path: "/operator-tasks/auto-assign"
    description: "Operator requests highest-priority pending task."
    roles: [Operator]
    code: 200
    input: [city_code]
    output: OperatorTask
    side_effects:
      - "Selector policy: eligibility {task.status==PENDING AND task.cabinet.city_code == body.city_code}; ranking ORDER BY priority_score DESC (calc operator_task_priority, recomputed on each call); tie-break ORDER BY created_at ASC; empty pool -> ERR_NO_PENDING_TASKS"
      - "winner.assigned_operator_id = X-User-ID; winner.status PENDING -> ASSIGNED"

  - method: GET
    path: "/operator-tasks/{id}"
    description: "Get operator task."
    roles: [Admin, Operator]
    code: 200
    input: []
    output: OperatorTask
    side_effects: []

  - method: POST
    path: "/operator-tasks/{id}/complete"
    description: "Operator completes (or cancels with body.cancel=true) a task."
    roles: [Operator, Admin]
    code: 200
    input: ["cancel?"]
    output: OperatorTask
    side_effects:
      - "if cancel==true and status==PENDING: -> CANCELLED (Admin-only)"
      - "else: status ASSIGNED/IN_PROGRESS -> COMPLETED; pre-check: if task_type==REPAIR_DISPATCH, linked RepairTicket.status MUST == RESOLVED"

  # ---- Settlement ----
  - method: POST
    path: "/settlements"
    description: "Admin creates a settlement (provisional partner_amount computed at creation, calc revenue_share_for_settlement provisional variant)."
    roles: [Admin]
    code: 201
    input: [location_partner_id, period_start, period_end]
    output: Settlement
    side_effects: ["status=DRAFT; partner_amount populated"]

  - method: GET
    path: "/settlements/{id}"
    description: "Get settlement."
    roles: [Admin, Partner]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/settlements/{id}/approve"
    description: "Admin approves a draft settlement."
    roles: [Admin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status DRAFT -> APPROVED"]

  - method: POST
    path: "/settlements/{id}/issue-invoice"
    description: "Admin issues invoice (recomputes calc revenue_share_for_settlement settled variant; freezes partner_amount and refund_adjustment)."
    roles: [Admin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status APPROVED -> INVOICED", "invoice_number generated", "partner_amount and refund_adjustment recomputed (settled variant) and frozen"]

  # ---- LocationPartner ----
  - method: POST
    path: "/location-partners"
    description: "Admin creates a location partner."
    roles: [Admin]
    code: 201
    input: [partner_code, name, revenue_share_pct]
    output: LocationPartner
    side_effects: []

  # ---- MaintenanceWindow ----
  - method: POST
    path: "/maintenance-windows"
    description: "Admin schedules a cabinet maintenance window."
    roles: [Admin]
    code: 201
    input: [cabinet_id, window_start, window_end]
    output: MaintenanceWindow
    side_effects: ["status=SCHEDULED"]

  # ---- PaymentEvent ----
  - method: POST
    path: "/payment-events"
    description: "Idempotent receipt for events from upstream payment system. No auth (system-to-system)."
    roles: []
    code: 200
    input: [idempotency_key, event_type, rental_id, amount, occurred_at]
    output: PaymentEvent
    side_effects:
      - "if duplicate idempotency_key: ERR_DUPLICATE_PAYMENT_EVENT; no further effect"
      - "PaymentEvent record persisted"

  # ---- Test scaffolding endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the system clock. No auth."
    roles: []
    code: 200
    input: ["to?", "seconds?"]
    output: null
    side_effects: ["clock.now() updated"]

  - method: POST
    path: "/_sweep/run"
    description: "Test-only: run scheduled sweeps. No auth."
    roles: []
    code: 200
    input: [sweep_type]
    output: null
    side_effects:
      - "if sweep_type==overdue: every Rental with rental_status==ACTIVE and elapsed_hours > 24 transitions to OVERDUE"
      - "if sweep_type==lost: every Rental with rental_status==OVERDUE and elapsed_hours >= 168 transitions to LOST (calc lost_conversion runs)"
      - "if sweep_type==anomaly: for any Device with status==AVAILABLE, battery_level < 5, and currently housed in an OCCUPIED slot, the sweep CREATES a RepairTicket (target_type=DEVICE, source=AUTO_ANOMALY, issue_code=ABNORMAL_BATTERY, status=OPEN). This ticket creation is the action; everything else is cascade per §1.2: ticket-creation → Device.status FAULTY (depth 2, see §1.2 Device AVAILABLE→FAULTY transition) → Slot.slot_status FAULTY (depth 3, see §1.2 Slot OCCUPIED→FAULTY transition) → OperatorTask auto-created (depth 4, see §1.2 Slot OCCUPIED→FAULTY side_effects)."
      - "if sweep_type==all: runs overdue then lost then anomaly in that order"

  - method: POST
    path: "/_events/emit"
    description: "Test-only: emit external event (e.g., partner system sync). No auth."
    roles: []
    code: 200
    input: [event_type, payload]
    output: null
    side_effects: ["events of type=PARTNER_DEACTIVATE flip LocationPartner active flag (out of scope here)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted, or User acting on a Rental they do not own"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist"

  - id: ERR_INVALID_INPUT
    http: 400
    condition: "Body field shape, type, range, or enum membership invalid"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource in invalid state for requested operation (Rental, RepairTicket, OperatorTask, Settlement, Device, Slot)"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/mutation"

  - id: ERR_DUPLICATE_RENTAL
    http: 409
    condition: "User already has a rental in {ACTIVE, OVERDUE, STUCK}"

  - id: ERR_CABINET_OFFLINE
    http: 409
    condition: "Cabinet.online_status == OFFLINE during borrow/return"

  - id: ERR_CABINET_UNDER_MAINTENANCE
    http: 409
    condition: "An active SCHEDULED MaintenanceWindow covers clock.now() for the cabinet"

  - id: ERR_NO_AVAILABLE_DEVICE
    http: 409
    condition: "No Device in cabinet matches selector eligibility (status==AVAILABLE AND battery_level>=50)"

  - id: ERR_SLOT_OCCUPIED
    http: 409
    condition: "Return target slot has slot_status != EMPTY (used to drive return-failure path; loser sees this when racing return)"

  - id: ERR_RETURN_FAILED
    http: 409
    condition: "All slots in return cabinet are non-empty so the rental flips to STUCK"

  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "User.deposit_balance < MIN_DEPOSIT (99.00)"

  - id: ERR_WALLET_INSUFFICIENT
    http: 402
    condition: "User.wallet_balance < 0 at borrow time"

  - id: ERR_PRICING_NOT_CONFIGURED
    http: 422
    condition: "No PricingPlan exists for cabinet's city_code"

  - id: ERR_REFUND_LIMIT_EXCEEDED
    http: 403
    condition: "User.refund_count_30d >= 5 (risk control)"

  - id: ERR_ABNORMAL_BORROW_PATTERN
    http: 403
    condition: "User.borrow_count_24h >= 10 (risk control)"

  - id: ERR_TICKET_UNRESOLVED
    http: 409
    condition: "OperatorTask.task_type == REPAIR_DISPATCH complete attempted while linked RepairTicket.status != RESOLVED"

  - id: ERR_TASK_ALREADY_ASSIGNED
    http: 409
    condition: "Two operators race to assign the same OperatorTask; loser sees this"

  - id: ERR_NO_PENDING_TASKS
    http: 409
    condition: "auto-assign found no eligible task"

  - id: ERR_SETTLEMENT_PERIOD_INVALID
    http: 422
    condition: "period_end <= period_start"

  - id: ERR_DUPLICATE_PAYMENT_EVENT
    http: 409
    condition: "PaymentEvent.idempotency_key already received"

  - id: ERR_MAINTENANCE_WINDOW_OVERLAP
    http: 409
    condition: "New MaintenanceWindow overlaps an existing SCHEDULED window on same cabinet (half-open intervals; touching allowed)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: User
    description: "End user who borrows and returns power banks."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /rentals"
      - "POST /rentals/{id}/return"
      - "POST /rentals/{id}/return-retry"
      - "POST /devices/{id}/report-fault"
      - "POST /users/{id}/wallet/topup"
      - "POST /users/{id}/deposit"
    shared_operations:
      - "GET /rentals/{id}  (only own rental)"
      - "GET /users/{id}    (only own record)"

  - name: Operator
    description: "Field operator who handles repairs, stuck devices, and replenishment."
    identity: "opaque"
    exclusive_operations:
      - "POST /cabinets/{id}/slots/{slot_index}/eject"
      - "POST /repair-tickets/{id}/assign"
      - "POST /repair-tickets/{id}/hold"
      - "POST /repair-tickets/{id}/resume"
      - "POST /repair-tickets/{id}/resolve"
      - "POST /operator-tasks/auto-assign"
    shared_operations:
      - "GET /cabinets/{id}"
      - "GET /devices/{id}"
      - "GET /repair-tickets/{id}"
      - "GET /operator-tasks/{id}"
      - "POST /operator-tasks/{id}/complete"

  - name: Partner
    description: "Location partner viewing their settlements."
    identity: "entity_backed:LocationPartner"
    exclusive_operations: []
    shared_operations:
      - "GET /settlements/{id}  (only where settlement.location_partner_id == X-User-ID)"

  - name: Admin
    description: "Platform admin."
    identity: "opaque"
    exclusive_operations:
      - "POST /cabinets"
      - "POST /cabinets/{id}/heartbeat"
      - "POST /devices"
      - "POST /pricing-plans"
      - "POST /users"
      - "POST /location-partners"
      - "POST /maintenance-windows"
      - "POST /rentals/{id}/refund"
      - "POST /settlements"
      - "POST /settlements/{id}/approve"
      - "POST /settlements/{id}/issue-invoice"
    shared_operations:
      - "GET /cabinets/{id}"
      - "GET /devices/{id}"
      - "GET /rentals/{id}"
      - "GET /users/{id}"
      - "GET /repair-tickets/{id}"
      - "GET /operator-tasks/{id}"
      - "GET /settlements/{id}"
      - "POST /operator-tasks/{id}/complete  (when cancel==true)"
