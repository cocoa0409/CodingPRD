              as: VehicleOwner
              as_user_id: "${con}"
              captures: { cr: $.data.id }
            - call: "POST /corrections/${cr}/route_to_source"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /corrections/${cr}/source_confirm"
              payload: {}
              as: SourceOperator
              as_user_id: "${ins}"
            - call: "POST /corrections/${cr}/source_confirm"
