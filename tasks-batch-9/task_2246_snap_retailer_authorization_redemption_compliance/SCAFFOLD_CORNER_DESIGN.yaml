        distinguishing_aspect: "Period 2 is closed first and period 1 second; Store.redemption_flag_level must report period 2's FLAG_L1 because the selector is the highest period_index among CLOSED periods, not the most recently closed row."
        test_recipe:
          setup:
            - "The CONVENIENCE store (size expectation 1,250,000c) with two elapsed periods: index 1 imported at 1,234,567c (score 0) and index 2 imported at 3,000,000c (ratio 24000 bps, excess 0.7, 45 * 0.7 == 31.5 -> 32)."
          setup_api_calls:
