  # ===========================================================================
  - section: calculations
    instances:
      - name: waterfall_auto_apply_oldest_aging_first
        claim_type: waterfall_allocation
        grounds: [calculations.payment_waterfall_application, entities.PaymentApplication]
        distinguishing_aspect: >-
          Auto-applying a 30000 payment fills the B91_PLUS invoice (20000 -> PAID)
          before the B1_30 invoice (10000 applied, balance 10000 PARTIAL); leftover 0.
        test_recipe:
          setup: ["customer with invX(20000, B91_PLUS) and invY(20000, B1_30); 30000 payment; clock 2026-06-05"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "WF", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 20000 }
              as: AR_CLERK
              captures: { inv_x: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-05-01T00:00:00Z", due_date: "2026-05-20T00:00:00Z", face_amount_cents: 20000 }
              as: AR_CLERK
              captures: { inv_y: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 30000, received_at: "2026-06-05T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/auto-apply"
              payload: {}
              as: AR_CLERK
              captures: { unapplied: $.data.unapplied_cents }
            - call: "GET /ar/invoices/${inv_x}"
              payload: {}
              as: AR_MANAGER
              captures: { xst: $.data.status }
            - call: "GET /ar/invoices/${inv_y}"
              payload: {}
              as: AR_MANAGER
              captures: { ybal: $.data.balance_cents }
          assert:
            - "Invoice.${inv_x}.status == PAID"
            - "Invoice.${inv_y}.balance_cents == 10000"
            - "Payment.${pay_id}.unapplied_cents == 0"

      - name: credit_status_watch_at_80pct_threshold
        claim_type: threshold
        grounds: [calculations.credit_status_eval, entities.Customer.fields.credit_status]
        distinguishing_aspect: "exposure exactly 80000 of a 100000 limit (==80% via round_half_up) sets credit_status WATCH (>= watch threshold, < limit)."
        test_recipe:
          setup: ["customer limit 100000; one invoice 80000 -> exposure 80000"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "WT", credit_limit_cents: 100000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 80000 }
              as: AR_CLERK
          trigger:
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { cs: $.data.credit_status }
          assert:
            - "Customer.${c_id}.credit_status == WATCH"

      - name: cash_forecast_conservative_uncovered_invoice_only
        claim_type: Input Set Filtering
        grounds: [calculations.cash_forecast, entities.CashForecast.fields.projected_cents]
        distinguishing_aspect: "CONSERVATIVE forecast includes only non-terminal invoices whose due_date falls inside the horizon; a PAID invoice contributes 0."
        test_recipe:
          setup: ["customer with one OPEN invoice 10000 due 2026-06-20 (B1_30 at clock 2026-06-25) and one PAID invoice; horizon 30 days; clock 2026-06-25"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "CF2", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-05-01T00:00:00Z", due_date: "2026-06-20T00:00:00Z", face_amount_cents: 10000 }
              as: AR_CLERK
              captures: { inv_open: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-05-01T00:00:00Z", due_date: "2026-06-22T00:00:00Z", face_amount_cents: 9000 }
              as: AR_CLERK
              captures: { inv_paid: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 9000, received_at: "2026-06-23T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_paid}", applied_cents: 9000 }
              as: AR_CLERK
          trigger:
            - call: "GET /ar/cash-forecast"
              payload: { customer_id: "${c_id}", horizon_days: 30, method: "CONSERVATIVE" }
              as: AR_MANAGER
              captures: { proj: $.data.projected_cents }
          assert:
            - "CashForecast(CONSERVATIVE).projected_cents == 9000   # 10000 * 0.90 (B1_30); PAID invoice excluded"

      - name: finance_charge_excludes_current_bucket_invoices
        claim_type: Constants Applied
        grounds: [calculations.statement_finance_charge, entities.Statement.fields.finance_charge_cents]
        distinguishing_aspect: "A statement over a customer whose only invoice is CURRENT (not overdue) has finance_charge_cents 0 — MONTHLY_RATE applies only to overdue invoices."
        test_recipe:
          setup: ["customer with one invoice due in the future (CURRENT); clock 2026-05-01; period_end 2026-05-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "FC0", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-04-15T00:00:00Z", due_date: "2026-06-01T00:00:00Z", face_amount_cents: 50000 }
              as: AR_CLERK
          trigger:
            - call: "POST /ar/customers/${c_id}/statements"
              payload: { period_end: "2026-05-01T00:00:00Z" }
              as: AR_MANAGER
              captures: { fc: $.data.finance_charge_cents }
          assert:
            - "Statement.finance_charge_cents == 0"

