  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: person_list_pagination_limit_offset
        claim_type: listing
        grounds: ['response_envelope', 'endpoints["GET /persons"]']
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more behave per the fixed envelope over the (created_at, seq) ordering."
        test_recipe:
