  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: grove_retired_blocks_new_assignment
        claim_type: violation_to_error
        grounds: ["errors[ERR_GROVE_RETIRED]", state_machines.Grove.PRODUCTIVE_to_RETIRED]
        distinguishing_aspect: "A RETIRED grove rejects new harvest assignments with ERR_GROVE_RETIRED; retire itself is blocked while assignments are open."
        test_recipe:
          setup: ["Grower; grove with one SCHEDULED assignment (then cancelled so retire passes)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-ER1", display_name: "Retire Groves" }, as: PackinghouseAdmin, captures: { er1_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${er1_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { er1_gr: "$.data.id" } }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-ER1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { er1_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${er1_c}", grove_id: "${er1_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { er1_a: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/groves/${er1_gr}/retire", payload: {}, as: PackinghouseAdmin, captures: { er1_e1: "$.data.error_id" } }
            - { call: "POST /packinghouse/harvest-assignments/${er1_a}/cancel", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/groves/${er1_gr}/retire", payload: {}, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${er1_c}", grove_id: "${er1_gr}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { er1_e2: "$.data.error_id" } }
          assert:
            - "Retire with SCHEDULED assignment: ${er1_e1} == ERR_INVALID_STATE_TRANSITION"
            - "After cancel: retire succeeds (RETIRED); new assignment on retired grove: ${er1_e2} == ERR_GROVE_RETIRED"

      - name: crew_not_active_blocks_assignment_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREW_NOT_ACTIVE]", state_machines.HarvestCrew.ACTIVE_to_INACTIVE]
        distinguishing_aspect: "An INACTIVE crew rejects new assignments with ERR_CREW_NOT_ACTIVE."
        test_recipe:
          setup: ["Grower + grove; crew deactivated (no open assignments)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-ER2", display_name: "Crew State Groves" }, as: PackinghouseAdmin, captures: { er2_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${er2_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { er2_gr: "$.data.id" } }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-ER2", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { er2_c: "$.data.id" } }
            - { call: "POST /packinghouse/crews/${er2_c}/deactivate", payload: {}, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${er2_c}", grove_id: "${er2_gr}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { er2_err: "$.data.error_id" } }
          assert:
            - "${er2_err} == ERR_CREW_NOT_ACTIVE (409)"

      - name: maturity_required_and_not_passing_gates
        claim_type: violation_to_error
        grounds: ["errors[ERR_MATURITY_TEST_REQUIRED]", "errors[ERR_MATURITY_NOT_PASSING]", "validations[priority=8]"]
        distinguishing_aspect: "Two distinct maturity failures: no test at all -> ERR_MATURITY_TEST_REQUIRED on start; a CURRENT FAIL test (created via supersede after the assignment started) -> ERR_MATURITY_NOT_PASSING on delivery create."
        test_recipe:
          setup:
            - "Grove A: no maturity test at all, assignment AA window covers clock"
            - "Grove B: PASS test, assignment BB IN_PROGRESS, then a FAIL test supersedes (brix 8.0 -> ratio 8.0 < 9.0)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-ER3", display_name: "Maturity Gate Groves" }, as: PackinghouseAdmin, captures: { er3_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${er3_g}", block_code: "A1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { er3_ga: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${er3_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { er3_gb: "$.data.id", er3_gb_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${er3_gb}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${er3_gb_v}" }, as: QualityInspector, as_user_id: "qi_er3" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-ER3", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { er3_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${er3_c}", grove_id: "${er3_ga}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T06:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { er3_aa: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${er3_c}", grove_id: "${er3_gb}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { er3_ab: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${er3_ab}/start", payload: {}, as: FieldSupervisor }
