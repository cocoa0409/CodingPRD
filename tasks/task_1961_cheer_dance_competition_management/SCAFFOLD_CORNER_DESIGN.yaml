# =============================================================================
# Task 1961: Cheer & Dance Competition Management
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: division_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Division.fields.time_deduction_per_second, entities.Division.fields.bid_pool_available]
        distinguishing_aspect: "Omitting defaulted inputs yields documented defaults; bid_pool_available initializes to paid + at_large."
        test_recipe:
          setup: ["Event exists (DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
          trigger:
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"], paid_bid_count: 2, at_large_bid_count: 1 }, as: EventDirector, captures: { dv: $.data.id, pool: "$.data.bid_pool_available", tps: "$.data.time_deduction_per_second", sdp: "$.data.safety_deduction_points", bdp: "$.data.boundary_deduction_points", wd: "$.data.warmup_duration_seconds" } }
          assert:
            - "time_deduction_per_second == 0.5, safety_deduction_points == 2.0, boundary_deduction_points == 0.25, warmup_duration_seconds == 900"
            - "bid_pool_available == 3 (paid 2 + at_large 1) and scheduled == false, version == 1"

      - name: event_create_missing_name_returns_invalid_request
        claim_type: required_field_validation
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_INPUT]"]
        distinguishing_aspect: "Required input field missing -> 400 ERR_INVALID_INPUT before any state check."
        test_recipe:
          setup: ["(empty db)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/events", payload: { venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_INPUT, http 400"

      - name: get_missing_event_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["(empty db)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/events/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: EventDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: team_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Team.fields.reg_status, entities.Team.fields.music_status]
        distinguishing_aspect: "Client-supplied reg_status/music_status on create are ignored; server initializes REGISTERED/PENDING."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; division exists"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
          trigger:
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1", reg_status: "CHECKED_IN", music_status: "VERIFIED" }, as: TeamCoach, as_user_id: "coach-1", captures: { reg: "$.data.reg_status", mus: "$.data.music_status" } }
          assert:
            - "reg_status == REGISTERED and music_status == PENDING (client values ignored)"

  - section: state_machines
    instances:
      - name: withdrawn_team_cannot_withdraw_again
        claim_type: terminal_lockdown
        grounds: [state_machines.Team, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: second withdraw rejected, no side effects."
        test_recipe:
          setup: ["Team REGISTERED, then withdrawn"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/teams/${t1}/withdraw", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
          trigger:
            - { call: "POST /api/teams/${t1}/withdraw", payload: {}, as: TeamCoach, as_user_id: "coach-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409; team remains WITHDRAWN"

      - name: sheet_reopen_breaks_quorum_and_reverts_performance
        claim_type: side_effect_execution
        grounds: [state_machines.ScoreSheet.SUBMITTED_to_DRAFT, state_machines.Performance.SCORED_to_PERFORMED]
        distinguishing_aspect: "PATCH on a SUBMITTED sheet reopens it to DRAFT and, because quorum is lost, the Performance falls back SCORED -> PERFORMED (conditional cascade)."
        test_recipe:
          setup: ["Performance p1 SCORED (all 3 panel sheets SUBMITTED, provisional computed)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JS", certified_levels: [3] }, as: EventDirector, captures: { js: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id, dv_v: $.data.version } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/lock-roster", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 2, license_provider: "ACM", license_reference: "LIC-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms: $.data.id } }
            - { call: "POST /api/music-submissions/${ms}/review", payload: { decision: "VERIFIED" }, as: MusicCompliance }
            - { call: "POST /api/events/${ev}/close-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/divisions/${dv}/generate-schedule", payload: { expected_division_version: "${dv_v}" }, as: EventDirector }
            - { call: "POST /api/events/${ev}/go-live", payload: {}, as: EventDirector }
            - { call: "POST /api/teams/${t1}/check-in", payload: { athlete_ids: ["${a1}"] }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "GET /api/teams/${t1}/performances", payload: {}, as: EventDirector, captures: { p1: "$.data[0].id" } }
            - { call: "POST /api/performances/${p1}/mark-performed", payload: { actual_duration_seconds: 150, boundary_violations: 0 }, as: SafetyJudge, as_user_id: "${js}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 8.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /api/score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 8.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j2}", captures: { s2: $.data.id } }
            - { call: "POST /api/score-sheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 8.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j3}", captures: { s3: $.data.id } }
            - { call: "POST /api/score-sheets/${s3}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
          trigger:
            - { call: "PATCH /api/score-sheets/${s3}", payload: { overall_impression: 9.0 }, as: Judge, as_user_id: "${j3}", captures: { st: "$.data.status" } }
            - { call: "GET /api/performances/${p1}", payload: {}, as: EventDirector, captures: { pst: "$.data.status" } }
          assert:
            - "ScoreSheet.${s3}.status == DRAFT (reopened by edit)"
            - "Performance.${p1}.status == PERFORMED (quorum lost -> SCORED reverts)"

      - name: confirm_official_blocked_while_appeal_pending
        claim_type: precondition_enforcement
        grounds: [state_machines.Performance.SCORED_to_OFFICIAL, "errors[ERR_PENDING_APPEALS]"]
        distinguishing_aspect: "SCORED performance with an UNDER_APPEAL deduction cannot go OFFICIAL."
        test_recipe:
          setup: ["Performance p1 SCORED; SAFETY deduction appealed (UNDER_APPEAL)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JH", certified_levels: [3] }, as: EventDirector, captures: { jh: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JS", certified_levels: [3] }, as: EventDirector, captures: { js: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id, dv_v: $.data.version } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/lock-roster", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 2, license_provider: "ACM", license_reference: "LIC-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms: $.data.id } }
            - { call: "POST /api/music-submissions/${ms}/review", payload: { decision: "VERIFIED" }, as: MusicCompliance }
            - { call: "POST /api/events/${ev}/close-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/divisions/${dv}/generate-schedule", payload: { expected_division_version: "${dv_v}" }, as: EventDirector }
            - { call: "POST /api/events/${ev}/go-live", payload: {}, as: EventDirector }
            - { call: "POST /api/teams/${t1}/check-in", payload: { athlete_ids: ["${a1}"] }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "GET /api/teams/${t1}/performances", payload: {}, as: EventDirector, captures: { p1: "$.data[0].id" } }
            - { call: "POST /api/performances/${p1}/mark-performed", payload: { actual_duration_seconds: 150, boundary_violations: 0 }, as: SafetyJudge, as_user_id: "${js}" }
            - { call: "POST /api/performances/${p1}/deductions", payload: { type: "SAFETY", quantity: 1, skill_tier: 4 }, as: SafetyJudge, as_user_id: "${js}", captures: { ded: $.data.id } }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 8.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /api/score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 8.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j2}", captures: { s2: $.data.id } }
            - { call: "POST /api/score-sheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 8.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j3}", captures: { s3: $.data.id } }
            - { call: "POST /api/score-sheets/${s3}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
            - { call: "POST /api/deductions/${ded}/appeals", payload: { note: "dispute", video_ref: "vid-1" }, as: TeamCoach, as_user_id: "coach-1" }
          trigger:
            - { call: "POST /api/performances/${p1}/confirm-official", payload: {}, as: HeadJudge, as_user_id: "${jh}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PENDING_APPEALS, http 422; performance stays SCORED"

      - name: music_flag_then_replacement_supersedes
        claim_type: valid_transition
        grounds: [state_machines.MusicSubmission, state_machines.TeamMusic]
        distinguishing_aspect: "FLAGGED submission is superseded by a replacement (old -> SUPERSEDED, team returns to SUBMITTED); submitting while a review is pending is rejected."
        test_recipe:
          setup: ["Team REGISTERED with one FLAGGED submission"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 2, license_provider: "ACM", license_reference: "LIC-OLD" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms1: $.data.id } }
            - { call: "POST /api/music-submissions/${ms1}/review", payload: { decision: "FLAGGED", reason: "unlicensed track 2" }, as: MusicCompliance }
          trigger:
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 2, license_provider: "ACM", license_reference: "LIC-NEW" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms2: $.data.id } }
            - { call: "GET /api/teams/${t1}/music-submissions", payload: {}, as: MusicCompliance, captures: { s0: "$.data[0].status", s1: "$.data[1].status" } }
            - { call: "GET /api/teams/${t1}", payload: {}, as: EventDirector, captures: { mus: "$.data.music_status" } }
          assert:
            - "First submission ${ms1} status == SUPERSEDED; second ${ms2} status == SUBMITTED"
            - "Team.music_status == SUBMITTED (driven by the replacement)"

      - name: music_submit_while_review_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MusicSubmission, "errors[ERR_MUSIC_STATE_CONFLICT]"]
        distinguishing_aspect: "A second submission while the latest is SUBMITTED (pending review) is rejected; while VERIFIED is also rejected."
        test_recipe:
          setup: ["Team REGISTERED with one SUBMITTED (unreviewed) submission"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id } }
