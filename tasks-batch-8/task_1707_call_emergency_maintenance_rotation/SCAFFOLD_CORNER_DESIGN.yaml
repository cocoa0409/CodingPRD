            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:50:00Z" }, as: PropertyAdmin }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/close", as: Dispatcher, captures: { cb: $.data.callback_pay_cents, cm: $.data.callback_minutes } }
          assert:
            - "callback_minutes == 45 but billed at the 120-minute floor"
            - "callback_pay_cents == 9600 (120/60 x 4800 x 1.0 x 1.0 x 1.0)"

      - name: fatigue_719_minutes_stays_unblocked
        claim_type: constants_applied
        grounds: [calculations.fatigue_accumulation, entities.Technician.fields.fatigue_block_until]
        distinguishing_aspect: "The cap is inclusive at >= 720; 719 cumulative minutes (400 + 319) leaves fatigue_block_until null and the next dispatch succeeds — the mirror image of the §1.8 crossing case."
        test_recipe:
          setup:
            - "T1 shift A ACTIVE 2026-08-01 00:00-12:00; shift C PUBLISHED 2026-08-01 12:00-20:00 (adjacent, legal)"
            - "Ticket 1 closed with 400 callback minutes; Ticket 2 mitigated at 12:49 after a 07:30 dispatch (319 minutes), IR submitted"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
