              as: FIGRelationshipManager
              captures: { r_b_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_b_id}/nested-relationships"
              payload: { downstream_institution_name: "Petit Banque SA", downstream_jurisdiction_code: "FR", relationship_type: "DOWNSTREAM_CORRESPONDENT", discovery_source: "QUESTIONNAIRE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { nr_leaf: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_a_id}/nested-relationships"
              payload: { downstream_institution_name: "Sudbank AG", downstream_jurisdiction_code: "DE", relationship_type: "DOWNSTREAM_CORRESPONDENT", discovery_source: "QUESTIONNAIRE", downstream_respondent_bank_id: "${r_b_id}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { nr_hop: $.data.id }
          trigger:
            - call: "GET /correspondent-banking/respondents/${r_a_id}/nested-chain"
