      - name: quote_lazy_expires_when_clock_past_valid_until
        claim_type: Side Effect Execution
        grounds: [state_machines.Quote.DRAFT_to_EXPIRED, endpoints]
        distinguishing_aspect: "A SENT quote whose valid_until has passed lazily transitions to EXPIRED on read; accept then fails. Uses the clock-set endpoint to advance time."
        test_recipe:
          setup: ["A SENT quote with valid_until 2026-07-01T00:00:00Z; clock advanced to 2026-07-02."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "c11@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "P", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
