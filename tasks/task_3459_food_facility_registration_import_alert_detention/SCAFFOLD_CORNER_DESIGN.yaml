  # ===========================================================================
  - section: validations
    instances:
      - name: request_with_unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "An X-User-Role value outside the seven declared roles is rejected 401 ERR_UNAUTHENTICATED before any role, ownership, or business check runs."
        test_recipe:
          setup: ["Empty database; default clock."]
          trigger:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Ghost Co", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-2301" }
              as: WarehouseBoss
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401)"

      - name: importer_cannot_screen_entries_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
          - roles.Importer
        distinguishing_aspect: "Screening is an EntryReviewer-exclusive operation: the entry's own importer gets 403 ERR_FORBIDDEN, proving role denial is independent of ownership."
        test_recipe:
          setup: ["Default clock; facility, importer, and a filed entry."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Antwerp Chocolade", facility_kind: "FOREIGN", country_code: "BE", ufi: "UFI-BE-2302" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Coeur d'Alene Candies", account_code: "IMP-2302" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-CHO-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 11, unit_value_cents: 200, port_code: "US-NYC" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_id: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_id}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_id: $.data.id }
          trigger:
            - call: "POST /registry/entries/${ent_id}/screen"
              payload: {}
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (http 403); entry remains PENDING_SCREENING / PENDING"

      - name: importer_cannot_amend_another_importers_notice
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors.ERR_OWNERSHIP_VIOLATION
        distinguishing_aspect: "Entity-backed ownership: importer B's X-User-ID does not equal the notice's importer_id, so amending importer A's notice fails 403 ERR_OWNERSHIP_VIOLATION."
        test_recipe:
          setup: ["Default clock; facility; importers A (notice owner) and B."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Busan Sujebi", facility_kind: "FOREIGN", country_code: "KR", ufi: "UFI-KR-2303" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Acadia Imports", account_code: "IMP-2303A" }
              as: PlatformAdmin
              captures: { imp_a: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Big Sky Imports", account_code: "IMP-2303B" }
              as: PlatformAdmin
              captures: { imp_b: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_a}", facility_id: "${fac_id}", product_code: "PC-NOO-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-SEA" }
              as: Importer
              as_user_id: "${imp_a}"
              captures: { pn_id: $.data.id }
