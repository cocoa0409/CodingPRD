      - name: deduction_cap_constant_limits_the_allowed_deduction
        claim_type: constants_applied
        grounds:
          - calculations.royalty_due_computation
          - entities.ProductCategory.fields.deduction_cap_pct_bps
          - validations.priority_29
        distinguishing_aspect: |
          deduction_cap_pct_bps (500) and deduction_hard_limit_bps (2000) are two
          different constants doing two different jobs. A claimed deduction of
          80000 on gross 1000000 is 800 bps: it passes the hard limit (200000) so
          the report is accepted, but only floor(1000000 * 500 / 10000) == 50000 is
          allowed into the basis. net_regular is therefore 950000, not 920000, and
          royalty is 114000, not 110400. An implementation that subtracts the
          claimed deduction, or that rejects at 800 bps, fails.
