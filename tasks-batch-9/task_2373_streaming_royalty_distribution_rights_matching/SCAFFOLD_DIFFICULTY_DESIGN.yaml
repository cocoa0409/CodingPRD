  - rule_id: priority_pair_validation_conflict
    instances:
      - name: period_close_state_beats_holding_account_check
        grounds:
          - validations.priority_14
          - validations.priority_32
          - errors.ERR_INVALID_PERIOD_STATE
          - errors.ERR_HOLDING_UNRESOLVED
        distinguishing_aspect: |
          A close attempt on a period that is both in the wrong state (USAGE_SEALED) and holding
          unresolved money (99999 cents) must return the priority-14 state error, not the
          priority-32 fiscal error — and after only the state defect is repaired the SAME call on
          the SAME data returns the fiscal error, proving the ordering rather than a single
          catch-all.
        test_recipe:
          setup:
            - "One EFFECTIVE GB/INDIVIDUAL schedule; period 2026-06; one sealed batch whose single line is UNMATCHED (title-only 5000 confidence against a catalogue recording that has no registration)."
            - "Pool GB/INDIVIDUAL subscriber_count 1000, gross_revenue_cents 1428570, calculated at the default clock so the ALL_USAGE variant parks 999999 cents in holding_cents; the pool is NOT finalized, so the period is still USAGE_SEALED."
            - "Clock advanced to 2026-08-30T00:00:00Z so the close call's own claim-window precondition is satisfied and cannot mask either error."
