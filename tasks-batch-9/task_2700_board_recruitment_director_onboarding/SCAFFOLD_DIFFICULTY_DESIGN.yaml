  - rule_id: boundary_precision_check
    instances:
      - name: overboarding_limit_off_by_one_three_boards_admitted_four_boards_rejected
        grounds:
          - validations.priority_52.ERR_OVERBOARDING_LIMIT_EXCEEDED
          - calculations.interlock_and_overboarding_evaluation
          - entities.GovernancePolicy.fields.max_public_boards_default
          - entities.Candidate.fields.external_public_board_count
        distinguishing_aspect: |
          The rule is external_public_board_count + 1 > limit, so with max_public_boards_default 4 a
          candidate already on exactly 3 public boards lands on the limit (3 + 1 == 4) and must be admitted,
          while 4 existing boards (4 + 1 == 5) must be rejected. The instance pins both sides of the same
          integer boundary plus the boundary as enforced on a second endpoint, so an implementation that
          writes >= instead of >, or that forgets the +1 for the seat being sought, fails.
