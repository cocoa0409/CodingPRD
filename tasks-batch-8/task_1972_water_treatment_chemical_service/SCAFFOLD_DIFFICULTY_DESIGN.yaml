# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1972_water_treatment_chemical_service
# 9 rules x 2 instances (20 total). Every formula-derived assert is a literal
# computed by executing the §1.3 formula with the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lsi_provisional_vs_finalized_on_water_test_result
        grounds:
          - calculations.lsi_saturation_index
          - entities.WaterTestResult.fields.lsi_provisional
          - entities.WaterTestResult.fields.lsi_final
        distinguishing_aspect: |
          Same WaterTestResult field inputs produce lsi_provisional == 0.79 (TDS
          estimated as conductivity*0.7 = 1400) but lsi_final == 0.76 (lab TDS
          2600) — a dual-variant calc on the WaterTestResult entity domain.
        test_recipe:
          setup:
            - "Account A1 ACTIVE; asset AS1 (COOLING_TOWER, recirc 500 gpm) IN_SERVICE with ACCEPTED ProgramDesign (ph 7.0-9.5, conductivity_max 4000, inhibitor_target 5 ppm, proposed_coc 4.0)"
            - "FeedStation FS1 ONLINE for product P1; route R1 PUBLISHED with stop ST1 for AS1 window [2026-08-02T00:00:00Z, 2026-08-03T00:00:00Z); clock at 2026-08-02T12:00:00Z; ST1 ARRIVED"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Acme Plating", billing_model: "PRODUCT" }
              as: AccountManager
              captures: { acct1: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${acct1}", asset_tag: "CT-1", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 12000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { as1: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "INH-100", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 399, contract_price_cents_per_gal: 350 }
              as: PlatformAdmin
              captures: { prod1: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${as1}", product_id: "${prod1}", capacity_cap_ml_per_min: 50, feed_mode: "CONTINUOUS" }
              as: WaterChemist
              captures: { fs1: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${as1}", survey_notes: "initial" }
              as: WaterChemist
              captures: { pd1: $.data.id }
            - { call: "POST /wt/program-designs/${pd1}/record-survey", payload: { survey_notes: "surveyed" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${pd1}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 75000 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${pd1}/propose"
              payload: {}
              as: WaterChemist
              captures: { pd1_v: $.data.version }
            - call: "POST /wt/program-designs/${pd1}/accept"
              payload: { expected_program_design_version: "${pd1_v}" }
              as: CustomerContact
              as_user_id: "${acct1}"
              captures: { pd1_acc_v: $.data.version }
            - { call: "POST /wt/feed-stations/${fs1}/bring-online", payload: {}, as: WaterChemist }
            - { call: "POST /wt/assets/${as1}/commission", payload: {}, as: WaterChemist }
            - call: "POST /wt/test-routes"
              payload: { account_id: "${acct1}", route_name: "TUE-NORTH" }
              as: WaterChemist
              captures: { rt1: $.data.id }
            - call: "POST /wt/test-routes/${rt1}/stops"
              payload: { asset_id: "${as1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z", sequence_index: 1 }
              as: WaterChemist
              captures: { st1: $.data.id }
            - { call: "POST /wt/test-routes/${rt1}/publish", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${st1}/arrive", payload: {}, as: WaterChemist }
          trigger:
            - call: "POST /wt/route-stops/${st1}/water-test-results"
              payload: { asset_id: "${as1}", ph: 8.0, conductivity_umhos: 2000, calcium_ppm: 300, alkalinity_ppm: 150, temperature_f: 90, inhibitor_residual_ppm: 5.5 }
              as: WaterChemist
              captures: { wtr1: $.data.id }
            - call: "POST /wt/water-test-results/${wtr1}/confirm"
              payload: { lab_tds_ppm: 2600 }
              as: WaterChemist
          assert:
            - "WaterTestResult.${wtr1}.lsi_provisional == 0.79"
            - "WaterTestResult.${wtr1}.lsi_final == 0.76"
            - "WaterTestResult.${wtr1}.lsi_provisional != WaterTestResult.${wtr1}.lsi_final"
            - "WaterTestResult.${wtr1}.classification == BALANCED"
            - "WaterTestResult.${wtr1}.range_status == IN_RANGE"

      - name: invoice_pricing_service_contract_vs_product_on_invoice
        grounds:
          - calculations.invoice_pricing
          - entities.Invoice.fields.pricing_variant
          - entities.Invoice.fields.invoice_total_cents
        distinguishing_aspect: |
          Identical delivery set (110 gal of INH-100 + 55 gal of INH-200,
          both CLOSED inside the window) prices to invoice_total_cents ==
          54945 under the PRODUCT variant but == 123455 under the
          SERVICE_CONTRACT variant — a dual-variant calc on the Invoice
          entity domain (different domain from the LSI instance).
        test_recipe:
          setup:
            - "Two accounts A-PROD (billing_model PRODUCT) and A-SVC (billing_model SERVICE_CONTRACT); each with asset, ACCEPTED ProgramDesign (service_rate 75000), ONLINE stations for INH-100 (unit 399, contract 350) and INH-200 (unit 201, contract 181), and two CLOSED DeliveryOrders with scheduled_for inside [2026-08-05T00:00:00Z, 2026-09-01T00:00:00Z): 110 gal of INH-100 and 55 gal of INH-200, delivered_gal == quantity"
            - "Clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/products"
              payload: { product_code: "INH-100", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 399, contract_price_cents_per_gal: 350 }
              as: PlatformAdmin
              captures: { p100: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "INH-200", active_pct: 20, container_size_gal: 55, unit_price_cents_per_gal: 201, contract_price_cents_per_gal: 181 }
              as: PlatformAdmin
              captures: { p200: $.data.id }
            # ---- PRODUCT account subtree ----
            - call: "POST /wt/accounts"
              payload: { account_name: "Prod Co", billing_model: "PRODUCT" }
              as: AccountManager
              captures: { acctP: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${acctP}", asset_tag: "CT-1", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 12000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { asP: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${asP}" }
              as: WaterChemist
              captures: { pdP: $.data.id }
            - { call: "POST /wt/program-designs/${pdP}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${pdP}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 75000 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${pdP}/propose"
              payload: {}
              as: WaterChemist
              captures: { pdP_v: $.data.version }
            - call: "POST /wt/program-designs/${pdP}/accept"
              payload: { expected_program_design_version: "${pdP_v}" }
              as: CustomerContact
              as_user_id: "${acctP}"
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${asP}", product_id: "${p100}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { fsP: $.data.id }
            - { call: "POST /wt/feed-stations/${fsP}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${asP}", product_id: "${p200}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { fsP2: $.data.id }
            - { call: "POST /wt/feed-stations/${fsP2}/bring-online", payload: {}, as: WaterChemist }
            # delivery 1: 110 gal of INH-100
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${acctP}", station_id: "${fsP}", quantity_gal: 110 }
              as: AccountManager
              captures: { doP1: $.data.id, doP1_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${doP1}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doP1}/schedule", payload: { scheduled_for: "2026-08-06T00:00:00Z", expected_delivery_order_version: "${doP1_v}" }, as: AccountManager }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${doP1}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doP1}/confirm-delivery", payload: { delivered_gal: 110 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${doP1}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
            # delivery 2: 55 gal of INH-200
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${acctP}", station_id: "${fsP2}", quantity_gal: 55 }
              as: AccountManager
              captures: { doP2: $.data.id, doP2_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${doP2}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doP2}/schedule", payload: { scheduled_for: "2026-08-07T00:00:00Z", expected_delivery_order_version: "${doP2_v}" }, as: AccountManager }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${doP2}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doP2}/confirm-delivery", payload: { delivered_gal: 55 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${doP2}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
            # ---- SERVICE_CONTRACT account subtree (same deliveries) ----
            - call: "POST /wt/accounts"
              payload: { account_name: "Svc Co", billing_model: "SERVICE_CONTRACT" }
              as: AccountManager
              captures: { acctS: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${acctS}", asset_tag: "CT-1", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 12000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { asS: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${asS}" }
              as: WaterChemist
              captures: { pdS: $.data.id }
            - { call: "POST /wt/program-designs/${pdS}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${pdS}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 75000 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${pdS}/propose"
              payload: {}
              as: WaterChemist
              captures: { pdS_v: $.data.version }
            - call: "POST /wt/program-designs/${pdS}/accept"
              payload: { expected_program_design_version: "${pdS_v}" }
              as: CustomerContact
              as_user_id: "${acctS}"
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${asS}", product_id: "${p100}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { fsS: $.data.id }
            - { call: "POST /wt/feed-stations/${fsS}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${asS}", product_id: "${p200}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { fsS2: $.data.id }
            - { call: "POST /wt/feed-stations/${fsS2}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${acctS}", station_id: "${fsS}", quantity_gal: 110 }
              as: AccountManager
              captures: { doS1: $.data.id, doS1_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${doS1}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doS1}/schedule", payload: { scheduled_for: "2026-08-06T00:00:00Z", expected_delivery_order_version: "${doS1_v}" }, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doS1}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doS1}/confirm-delivery", payload: { delivered_gal: 110 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${doS1}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${acctS}", station_id: "${fsS2}", quantity_gal: 55 }
              as: AccountManager
              captures: { doS2: $.data.id, doS2_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${doS2}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doS2}/schedule", payload: { scheduled_for: "2026-08-07T00:00:00Z", expected_delivery_order_version: "${doS2_v}" }, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doS2}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${doS2}/confirm-delivery", payload: { delivered_gal: 55 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${doS2}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
            # invoices
            - call: "POST /wt/invoices"
              payload: { account_id: "${acctP}", period_start: "2026-08-05T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccountManager
              captures: { invP: $.data.id }
            - call: "POST /wt/invoices"
              payload: { account_id: "${acctS}", period_start: "2026-08-05T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccountManager
              captures: { invS: $.data.id }
          trigger:
            - { call: "POST /wt/invoices/${invP}/issue", payload: {}, as: AccountManager }
            - { call: "POST /wt/invoices/${invS}/issue", payload: {}, as: AccountManager }
          assert:
            - "Invoice.${invP}.pricing_variant == PRODUCT"
            - "Invoice.${invP}.product_charges_cents == 54945"
            - "Invoice.${invP}.service_fee_cents == 0"
            - "Invoice.${invP}.invoice_total_cents == 54945"
            - "Invoice.${invS}.pricing_variant == SERVICE_CONTRACT"
            - "Invoice.${invS}.product_charges_cents == 48455"
            - "Invoice.${invS}.service_fee_cents == 75000"
            - "Invoice.${invS}.invoice_total_cents == 123455"
            - "Invoice.${invP}.invoice_total_cents != Invoice.${invS}.invoice_total_cents"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas in DIFFERENT modes (a), (b), (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: feed_setpoint_mode_a_nested_minmax_mode_branch
        grounds:
          - calculations.feed_rate_setpoint
          - entities.FeedStation.fields.setpoint_ml_per_min
          - state_machines.ProgramDesign.PROPOSED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (a): setpoint is min(capacity_cap, max(0, raw)) with a
          CONTINUOUS-vs-SHOT_FEED branch; with recirc 500 gpm, coc frozen to
          4.0, inhibitor 5 ppm, active 10%, cap 50 the ACCEPTED setpoint is
          exactly 24.9206 ml/min — nested clamp does not engage.
        test_recipe:
          setup:
            - "Account with asset (recirculation_rate_gpm=500, evaporation_factor=0.0085, drift_factor=0.0002), FeedStation FS (CONTINUOUS, cap 50) for product (active_pct 10), ProgramDesign proposed with inhibitor_target_ppm=5, proposed_coc=4.0"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Combo A" }
              as: AccountManager
              captures: { c2a_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c2a_acct}", asset_tag: "CT-9", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 9000, metallurgy: "COPPER_ALLOY" }
              as: WaterChemist
              captures: { c2a_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "C2-INH", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { c2a_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c2a_asset}", product_id: "${c2a_prod}", capacity_cap_ml_per_min: 50, feed_mode: "CONTINUOUS" }
              as: WaterChemist
              captures: { c2a_fs: $.data.id, c2a_fs_v0: $.data.version }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c2a_asset}" }
              as: WaterChemist
              captures: { c2a_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c2a_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c2a_pd}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 1000 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c2a_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { c2a_pd_v: $.data.version }
          trigger:
            - call: "POST /wt/program-designs/${c2a_pd}/accept"
              payload: { expected_program_design_version: "${c2a_pd_v}" }
              as: CustomerContact
              as_user_id: "${c2a_acct}"
          assert:
            - "SystemAsset.${c2a_asset}.target_coc == 4.0"
            - "FeedStation.${c2a_fs}.setpoint_ml_per_min == 24.9206"
            - "FeedStation.${c2a_fs}.setpoint_ml_per_min < FeedStation capacity_cap_ml_per_min 50 (clamp not engaged)"

      - name: invoice_line_rounding_mode_b_per_line_then_sum
        grounds:
          - calculations.invoice_pricing
          - entities.Invoice.fields.product_charges_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order is round-each-line-then-sum. Two
          deliveries priced so per-line rounding (33.335 gal x 100c -> 3334;
          10.005 gal x 100c -> 1001) yields 4335 while sum-then-round would
          yield 4334 — the scaffold's pinned order produces 4335.
        test_recipe:
          setup:
            - "PRODUCT account; asset with ACCEPTED design; two ONLINE stations for products R1 and R2 both priced 100c/gal unit (contract 80c); two CLOSED orders inside [2026-08-05, 2026-09-01): delivered_gal 33.335 on R1 (quantity 55 container... quantity must be container multiple: use container 0.001? — NO: container_size_gal 55; quantity_gal must be a whole multiple. Instead set container_size_gal to 33.335 and 10.005 respectively so quantity_gal = delivered_gal exactly)"
            - "Product R1: container_size_gal 33.335, unit 100, contract 80; Product R2: container_size_gal 10.005, unit 100, contract 80"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/products"
              payload: { product_code: "RND-1", active_pct: 10, container_size_gal: 33.335, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 80 }
              as: PlatformAdmin
              captures: { c2b_p1: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "RND-2", active_pct: 10, container_size_gal: 10.005, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 80 }
              as: PlatformAdmin
              captures: { c2b_p2: $.data.id }
            - call: "POST /wt/accounts"
              payload: { account_name: "Rounding Co", billing_model: "PRODUCT" }
              as: AccountManager
              captures: { c2b_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c2b_acct}", asset_tag: "BLR-1", asset_type: "BOILER", recirculation_rate_gpm: 200, system_volume_gal: 4000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c2b_asset: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c2b_asset}" }
              as: WaterChemist
              captures: { c2b_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c2b_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c2b_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c2b_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { c2b_pd_v: $.data.version }
            - call: "POST /wt/program-designs/${c2b_pd}/accept"
              payload: { expected_program_design_version: "${c2b_pd_v}" }
              as: CustomerContact
              as_user_id: "${c2b_acct}"
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c2b_asset}", product_id: "${c2b_p1}", capacity_cap_ml_per_min: 100 }
              as: WaterChemist
              captures: { c2b_fs1: $.data.id }
            - { call: "POST /wt/feed-stations/${c2b_fs1}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c2b_asset}", product_id: "${c2b_p2}", capacity_cap_ml_per_min: 100 }
              as: WaterChemist
              captures: { c2b_fs2: $.data.id }
            - { call: "POST /wt/feed-stations/${c2b_fs2}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${c2b_acct}", station_id: "${c2b_fs1}", quantity_gal: 33.335 }
              as: AccountManager
              captures: { c2b_o1: $.data.id, c2b_o1_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${c2b_o1}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c2b_o1}/schedule", payload: { scheduled_for: "2026-08-06T00:00:00Z", expected_delivery_order_version: "${c2b_o1_v}" }, as: AccountManager }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${c2b_o1}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c2b_o1}/confirm-delivery", payload: { delivered_gal: 33.335 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${c2b_o1}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
            - call: "POST /wt/delivery-orders"
