              as: HousekeepingDirector
              captures: { roomB_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${propA_id}", business_date: "2026-08-03", forecast_occupied_rooms: 1, forecast_arrivals: 0, forecast_departures: 1, planned_deep_clean_rooms: 0 }
              as: HousekeepingDirector
