            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "1234567896" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Balance Gym C", room_type: "BALANCE_GYM" }
              as: ClinicSupervisor
              captures: { roomid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /authorizations"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", payer_name: "Medicare", visits_authorized: 5, allowed_amount_cents: 15000, coinsurance_pct: 0.20 }
              as: IntakeCoordinator
              captures: { authid: $.data.id }
            - call: "POST /authorizations/${authid}/decision"
              payload: { decision: "APPROVE" }
              as: ClinicSupervisor
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T11:15:00Z", scheduled_end: "2026-06-01T12:15:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /care-plans/${cpid}/discharge"
              payload: {}
              as: ClinicSupervisor
          assert:
            - "CarePlan.${cpid}.status == DISCHARGED"
            - "Session.${s2}.attendance_status == CANCELLED"
            - "Session.${s1}.attendance_status == ATTENDED"
            - "InsuranceAuthorization.${authid}.visits_used == 1"
            - "CarePlan.${cpid}.patient_responsibility_cents == 3000"

      - name: home_safety_finalize_creates_device_referral
        grounds:
          - state_machines.HomeSafetyEvaluation.DRAFT_to_FINALIZED
          - calculations.home_hazard_score
          - entities.AssistiveDeviceReferral.fields.source
          - entities.HomeSafetyEvaluation.fields.generated_device_referral_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: HomeSafetyEvaluation FINALIZED (hazard_tier HIGH)
          -> an AssistiveDeviceReferral(source=AUTO_HAZARD, GRAB_BAR, PENDING) is created.
        test_recipe:
          setup:
            - "ACTIVE plan; a DRAFT home-safety evaluation with missing_grab_bars=4 (score 20, HIGH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Hal Hazard", date_of_birth: "1941-04-04", insurance_member_id: "MEM-906-08" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "home falls" }
