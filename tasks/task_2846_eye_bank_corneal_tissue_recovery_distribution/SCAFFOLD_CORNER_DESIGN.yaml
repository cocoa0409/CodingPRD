          - calculations.allocation_processing_fee
        excluded_because:
          difficulty_instance: compensating_invariant / confirm_then_unused_return_conserves_the_surgeon_money_ledger
          rationale: "The named §1.8 instance reads gross_billed_cents, credited_fee_cents and outstanding_fee_cents after each step and asserts the identity gross - credited == outstanding throughout."

  # Every id in the §1.6 catalog is triggered either by an instance below, by an
  # instance in another section of this file, or by the cited §1.8 instance. The one
  # deliberate exception is ERR_SHIPMENT_INTEGRITY_FAILED: an EXCURSION_MAJOR verdict
  # already quarantines the tissue on arrival, so the implant-time integrity check is
  # defence in depth behind ERR_TISSUE_NOT_ELIGIBLE and has no reachable trigger.
  - section: errors
    instances:

      - name: every_not_found_id_in_the_catalog_is_reachable_with_an_unknown_uuid
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_4
          - validations.priority_5
          - "errors[ERR_DONOR_NOT_FOUND]"
          - "errors[ERR_TECHNICIAN_NOT_FOUND]"
          - "errors[ERR_SEROLOGY_PANEL_NOT_FOUND]"
          - "errors[ERR_RECOVERY_NOT_FOUND]"
          - "errors[ERR_TISSUE_NOT_FOUND]"
          - "errors[ERR_SURGEON_NOT_FOUND]"
          - "errors[ERR_REQUEST_NOT_FOUND]"
          - "errors[ERR_ALLOCATION_NOT_FOUND]"
          - "errors[ERR_SHIPMENT_NOT_FOUND]"
          - "errors[ERR_REPORT_NOT_FOUND]"
          - "errors[ERR_INVESTIGATION_NOT_FOUND]"
        distinguishing_aspect: |
          One sweep over an empty database proves each entity has its OWN 404 id rather than a
          single shared ERR_NOT_FOUND: eleven syntactically valid but unknown UUIDs return eleven
          distinct error_id values, and the body-FK case (POST /eye-bank/allocations with an
          unknown tissue_id) returns the tissue id rather than the request id because the
          priority-5 body-FK check reports the first unresolved key.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-03T06:00:00.000Z"
            - "every id below is 00000000-0000-0000-0000-0000000000NN, hex-shaped and absent"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
