            - "after lock: submit succeeds and disclosure status == SUBMITTED"

      - name: finalize_empty_snapshot_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ShareholderSnapshot.DRAFT_to_FINALIZED, "errors[ERR_SNAPSHOT_EMPTY]"]
