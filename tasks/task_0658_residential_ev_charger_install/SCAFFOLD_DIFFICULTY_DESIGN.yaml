              as: Homeowner
              as_user_id: "${ho17}"
            - call: "POST /permit-applications"
              payload: { install_job_id: "${job17}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {perm17: $.data.id}
            - call: "POST /permit-applications/${perm17}/approve"
              as: Coordinator
            - call: "POST /interconnection-requests"
