              as: AssetCustodian
              captures: { ra35: $.data.id, ra35_v1: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra35}", method: "BLUE_BOOK", raw_value_cents: 500000, assessed_condition_grade: "GOOD", expected_asset_version: "${ra35_v1}" }
              as: Appraiser
              captures: { rv35: $.data.id }
