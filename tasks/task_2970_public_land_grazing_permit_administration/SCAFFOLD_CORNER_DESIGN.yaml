              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp15_id: "$.data.id" }
          assert:
            - "BaseProperty.${c_bp14_id}.qualified_aums == 300 (floor(401 x 0.75) = floor(300.75)), NOT 301 and NOT 300.75"
            - "BaseProperty.${c_bp15_id}.qualified_aums == 401 (401 x 1.0)"
