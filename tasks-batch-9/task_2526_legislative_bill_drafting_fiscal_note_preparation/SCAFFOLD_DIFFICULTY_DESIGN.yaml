      - name: fiscal_note_routing_refused_by_agency_status_then_by_agency_open_request_capacity
        grounds:
          - state_machines.FiscalNoteRequest.null_to_ROUTED
          - validations.priority_160.ERR_AGENCY_INACTIVE
          - validations.priority_160.ERR_AGENCY_CAPACITY_EXCEEDED
          - entities.Agency.fields.status
          - entities.Agency.fields.open_request_count
          - endpoints.POST_bills_fiscal_note_requests
        distinguishing_aspect: |
          A different entity pair, FiscalNoteRequest -> Agency, and a different KIND
          of cross-entity dependency: not a state-machine state but two independent
          properties of the referenced agency — its lifecycle status and its live
          open-request occupancy. The same bill, in the same state, is refused twice
          for two different agency-side reasons and then admitted by a third agency,
          proving the dependency is on the Agency row rather than on the bill.
        test_recipe:
