              payload: { department_id: "${dept_id}", name: "Decoy", sku: "SKU-DECOY", sell_by_weight: false, unit_price_cents: 99, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { real_v: $.data.version }
          trigger:
            - call: "POST /price-plans"
              payload: { product_id: "00000000-0000-4000-8000-000000000000", ad_price_cents: 100, effective_start: "2026-06-10T00:00:00Z", effective_end: "2026-06-01T00:00:00Z", expected_product_version: "${real_v}" }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_PRODUCT_NOT_FOUND"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- numeric threshold: reorder_flag at on_hand == reorder_point (<=) ----
      - name: reorder_flag_at_exact_reorder_point
        grounds:
          - calculations.reorder_flag
          - entities.Product.fields.reorder_flagged
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Reorder point 5: a finalize that lowers on_hand to exactly 5 sets reorder_flagged == true
          (boundary uses <=). A separate product left at on_hand 6 (reorder_point 5) stays false.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Product reorder_point 5, on-hand 6, sale finalizes quantity 1 -> on-hand 5."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Flour", sku: "SKU-FLOUR", sell_by_weight: false, unit_price_cents: 99, is_perishable: false, reorder_point_qty: 5 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-I1", expected_total_cents: 600 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 6, accepted_qty: 6, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { flag_at_6: $.data.id }
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          assert:
            - "Product.${prod_id}.on_hand_qty == 5"
            - "Product.${prod_id}.reorder_flagged == true"

      # ---- empty-set boundary: finalize a sale with zero line items ----
      - name: finalize_empty_sale_returns_sale_empty
        grounds:
          - validations[priority=6]
          - errors[ERR_SALE_EMPTY]
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
        distinguishing_aspect: |
          An empty-collection boundary on a different endpoint/metric: finalizing an OPEN sale with
          zero SaleLineItems is rejected with ERR_SALE_EMPTY (the line-count == 0 edge), distinct from
          the numeric reorder boundary above.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. An OPEN sale with NO line items."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_SALE_EMPTY"

