            - "GRASS_HAY entry: usable_lbs == 576 AND days_of_supply_tight == 29.98 AND reorder_required == true (strictly-below-30 trigger at 29.98)"

      - name: reliability_gate_boundary
        claim_type: constants_applied
        grounds: [calculations.volunteer_reliability]
        distinguishing_aspect: "Claim gate is >= 40 inclusive: at score 30 (one no-show) the claim fails ERR_RELIABILITY_TOO_LOW; after two completions lift the score to exactly 40 the same claim succeeds."
        test_recipe:
          setup: ["Volunteer V (skills [FEEDING]) assigned to S1, S2, S3 (2026-08-05: 06:00-08:00, 08:00-10:00, 10:00-12:00); S4 (12:00-14:00) OPEN"]
          setup_api_calls:
            - { call: "POST /rescue-ops/volunteers", payload: { name: "V", contact_email: "v@x.com", skills: [FEEDING] }, as: Volunteer, captures: { v: $.data.id } }
            - { call: "POST /rescue-ops/barn-shifts", payload: { shift_date: "2026-08-05T00:00:00Z", start_time: "06:00", end_time: "08:00", barn_zone: MAIN_BARN, required_skill: FEEDING }, as: VolunteerCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /rescue-ops/barn-shifts", payload: { shift_date: "2026-08-05T00:00:00Z", start_time: "08:00", end_time: "10:00", barn_zone: MAIN_BARN, required_skill: FEEDING }, as: VolunteerCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /rescue-ops/barn-shifts", payload: { shift_date: "2026-08-05T00:00:00Z", start_time: "10:00", end_time: "12:00", barn_zone: MAIN_BARN, required_skill: FEEDING }, as: VolunteerCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /rescue-ops/barn-shifts", payload: { shift_date: "2026-08-05T00:00:00Z", start_time: "12:00", end_time: "14:00", barn_zone: MAIN_BARN, required_skill: FEEDING }, as: VolunteerCoordinator, captures: { s4: $.data.id } }
            - { call: "POST /rescue-ops/barn-shifts/${s1}/claim", payload: {}, as: Volunteer, as_user_id: "${v}" }
            - { call: "POST /rescue-ops/barn-shifts/${s2}/claim", payload: {}, as: Volunteer, as_user_id: "${v}" }
            - { call: "POST /rescue-ops/barn-shifts/${s3}/claim", payload: {}, as: Volunteer, as_user_id: "${v}" }
          trigger:
            - { call: "POST /rescue-ops/barn-shifts/${s1}/mark-no-show", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /rescue-ops/barn-shifts/${s4}/claim", payload: {}, as: Volunteer, as_user_id: "${v}", captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/barn-shifts/${s2}/complete", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /rescue-ops/barn-shifts/${s3}/complete", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /rescue-ops/volunteers/${v}", as: VolunteerCoordinator, captures: { score: $.data.reliability_score } }
            - { call: "POST /rescue-ops/barn-shifts/${s4}/claim", payload: {}, as: Volunteer, as_user_id: "${v}", captures: { s4_st: $.data.status, s4_vol: $.data.volunteer_id } }
          assert:
            - "err == ERR_RELIABILITY_TOO_LOW at score 30"
            - "score == 40 after two completions (50 - 20 + 5 + 5)"
            - "s4_st == ASSIGNED AND s4_vol == ${v} (exactly 40 passes the >= 40 gate)"

      - name: purchase_order_rounding_already_covered
        claim_type: precision
        grounds: [calculations.purchase_order_cost]
        excluded_because:
          difficulty_instance: purchase_order_per_lot_rounding_order
          rationale: "Per-lot-then-sum vs sum-then-round divergence (7494 vs 7493, surcharge 600, grand 8094) is asserted in the named §1.8 instance."

      - name: care_cost_variants_already_covered
        claim_type: variant_divergence
        grounds: [calculations.lifetime_care_cost_projection]
        excluded_because:
          difficulty_instance: care_plan_actuarial_vs_straight_line_divergence
          rationale: "Variant divergence for identical horse data (6059405 vs 6930000) is asserted in the named §1.8 instance."

  - section: validations
    instances:
      - name: missing_auth_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with missing X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED before any other check (priority 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rescue-ops/horses", as: SanctuaryDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED with http status 401 (test sends the request with auth headers stripped)"

      - name: quarantine_service_restriction
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_QUARANTINE_SERVICE_RESTRICTED]"]
        distinguishing_aspect: "While the horse is QUARANTINE, a FARRIER_TRIM booking fails ERR_QUARANTINE_SERVICE_RESTRICTED while a VET_EXAM booking succeeds — the safety gate is service-type-conditional."
        test_recipe:
          setup: ["Horse H in QUARANTINE; farrier F and vet V registered"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Far F", specialty: FARRIER }, as: SanctuaryDirector, captures: { far: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${far}", service_type: FARRIER_TRIM, scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T09:45:00Z" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet_id}", service_type: VET_EXAM, scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T10:45:00Z" }, as: IntakeCoordinator, captures: { ok: $.data.status } }
          assert:
            - "err == ERR_QUARANTINE_SERVICE_RESTRICTED (422)"
            - "ok == REQUESTED (VET_EXAM is the only permitted service during quarantine)"

      - name: duty_segregation_euthanasia_certify
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", state_machines.EuthanasiaCase.PROPOSED_to_CERTIFIED, "errors[ERR_DUTY_SEGREGATION]"]
        distinguishing_aspect: "The proposing veterinarian cannot certify their own case (ERR_DUTY_SEGREGATION); a second veterinarian can."
        test_recipe:
          setup: ["Horse H in REHABILITATION; case EC PROPOSED by vet1; vet2 also registered"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V1", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet1: $.data.id } }
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V2", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet2: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 17, body_condition_score: 4, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet1}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/euthanasia-cases", payload: { horse_id: "${h}", clinical_summary: "navicular", suffering_score: 6 }, as: Veterinarian, as_user_id: "${vet1}", captures: { ec: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/euthanasia-cases/${ec}/certify", payload: { decision: CONCUR, emergency_attestation: false }, as: Veterinarian, as_user_id: "${vet1}", captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/euthanasia-cases/${ec}/certify", payload: { decision: CONCUR, emergency_attestation: false }, as: Veterinarian, as_user_id: "${vet2}", captures: { st: $.data.status, cert: $.data.certifying_practitioner_id } }
          assert:
            - "err == ERR_DUTY_SEGREGATION (proposer == certifier rejected)"
            - "st == CERTIFIED AND cert == ${vet2} (distinct certifier accepted)"

      - name: duty_segregation_adoption_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", state_machines.AdoptionApplication.HOME_CHECK_PASSED_to_APPROVED, "errors[ERR_DUTY_SEGREGATION]"]
        distinguishing_aspect: "The officer who completed the passed home check cannot approve that application (ERR_DUTY_SEGREGATION); a different officer can."
        test_recipe:
          setup: ["Horse H ADOPTABLE; application APP HOME_CHECK_PASSED with the home check completed by officer-1"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 8, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad D", contact_email: "ad@x.com", experience_level: EXPERT, has_stall_facility: true }, as: Adopter, captures: { ad: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications", payload: { adopter_id: "${ad}", horse_id: "${h}", proposed_pickup_date: "2026-08-25T00:00:00Z" }, as: Adopter, as_user_id: "${ad}", captures: { app: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/start-review", payload: {}, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/home-checks", payload: { application_id: "${app}", scheduled_date: "2026-08-15T10:00:00Z" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { hc: $.data.id } }
            - { call: "POST /rescue-ops/home-checks/${hc}/complete", payload: { outcome: PASSED }, as: AdoptionOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /rescue-ops/adoption-applications/${app}/approve", payload: {}, as: AdoptionOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/approve", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2", captures: { st: $.data.status } }
          assert:
            - "err == ERR_DUTY_SEGREGATION (home-check completer cannot approve)"
            - "st == APPROVED when a different officer approves"

      - name: home_check_expired_after_180_days
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_HOME_CHECK_EXPIRED]"]
        distinguishing_aspect: "Approve at completed_at + 181 days fails ERR_HOME_CHECK_EXPIRED; the document is valid through exactly +180 days."
