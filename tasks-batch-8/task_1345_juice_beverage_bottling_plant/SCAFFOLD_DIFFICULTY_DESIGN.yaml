  - rule_id: non_linear_state_machine
    instances:
      - name: batch_qa_reblend_cycle_twice
        grounds:
          - state_machines.Batch.QA_FAILED_to_BLENDING
          - state_machines.Batch.BLENDING_to_AWAITING_QA
          - calculations.brix_adjustment
        distinguishing_aspect: |
          Cyclic machine on Batch: AWAITING_QA -> QA_FAILED -> BLENDING ->
          AWAITING_QA loops twice (water then concentrate branch), with
          adjustment_count as the loop governor; the loop then exits via PASS.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula (target 12.0, tol 0.3, conc 65.0); tank T-6 cap 5000; batch 2000 L in BLENDING"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "Cycle Juice", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "CY-1", name: "Cycle Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-6", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.8 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 11.5 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.2 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { b_status: $.data.status } }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_water: $.data.added_water_liters, b_conc: $.data.added_concentrate_liters, b_qty: $.data.quantity_liters, b_count: $.data.adjustment_count } }
          assert:
            - "Batch.${batch_id}.status == QA_PASSED after two full FAIL->adjust loops"
            - "Batch.${batch_id}.adjustment_count == 2"
            - "Batch.${batch_id}.added_water_liters == 133.3 and added_concentrate_liters == 20.1 (2133.3 * 0.5 / 53 rounded 0.1)"
            - "Batch.${batch_id}.quantity_liters == 2153.4 (mass balance: 2000 + 133.3 + 20.1)"

      - name: production_run_parallel_invoice_dimension
        grounds:
