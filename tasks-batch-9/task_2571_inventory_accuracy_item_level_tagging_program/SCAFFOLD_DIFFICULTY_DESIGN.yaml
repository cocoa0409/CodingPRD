      - name: vendor_chargeback_gross_tier_pins_credit
        grounds:
          - calculations.vendor_shortage_chargeback
          - endpoints.POST_/inventory-integrity/vendors/{vendor_id}/chargebacks
          - entities.Vendor.fields.chargeback_balance_cents
          - entities.VarianceInvestigation.fields.approved_root_cause
        distinguishing_aspect: |
          MODE (c) — an apparently circular dependency resolved by a PINNED evaluation order. net =
          gross - credit, and the credit rate is itself a tier lookup, so an implementation must
          decide which amount keys the credit tier. Pinned answer: the GROSS 205000 selects TIER_3,
          so the credit is 500 bps = 10250 and net = 194750. Keying the credit off net (194750,
          which lands in TIER_2 at 1000 bps) yields credit 20500 and net 184500 — the forbidden
          answer. Neither mode (a) rounding order nor mode (b) threshold nesting is at issue here.
