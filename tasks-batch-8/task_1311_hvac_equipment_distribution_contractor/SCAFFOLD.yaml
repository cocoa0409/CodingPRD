    roles: [ContractorUser]
    code: 200
    input: []
    output: Order
    side_effects: ["DRAFT -> SUBMITTED; pricing per dealer_tier_calculation/prebuy_discount_calculation; allocation_consumption reservation; coop_accrual provisional recompute; increments version by 1"]
  - method: POST
    path: /api/v1/orders/{id}/cancel
