scenario: |
  2789. Demand Planning & Sales and Operations Planning (consumer packaged goods supply chain):
  statistical baseline forecasting with seasonality, trend and causal factors by item and customer,
  consensus adjustment incorporating sales intelligence, promotions and new item plans, forecast
  accuracy measurement with bias detection and accountability by planner and product family, supply
  review balancing capacity, materials and inventory targets with constraint identification, scenario
  planning for capacity investment, allocation and rationing decisions, executive review reconciling
  volume plans with financial commitments and gap-closing actions, new product introduction and
  discontinuation planning with runout management, inventory policy setting by service level and
  demand variability
domain_name: demand-planning-sop
api_prefix: "/sop"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under /sop; all
  # relationships are expressed as foreign keys in request bodies and as filter query
  # parameters on list endpoints. There is exactly ONE nested read path in the whole
  # surface (GET /sop/planning-cycles/{cycle_id}/accuracy-summary) and it is a computed
  # projection, not a child collection — no entity is addressed through a parent path.

  state_machine_shape: cyclic
  # PlanningCycle loops EXECUTIVE_REVIEW -> DEMAND_REVIEW (bounded reopen rounds) and
  # ConsensusAdjustment loops PROPOSED -> REVISION_REQUESTED -> PROPOSED (bounded revision
  # rounds). Item adds a branching fork (PRELAUNCH -> {RAMP, CANCELLED_NPI}) and Scenario
  # adds a second fork (SELECTED -> {SUPERSEDED, EXECUTED}) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # PlanningCycle -> DemandForecast / SupplyPlan / Scenario / AccuracyRecord
    - many_to_many         # DemandForecast and Allocation are (item x customer) junctions
    - self_referential     # Item.successor_item_id -> Item.id (runout / successor chain)
    - cross_aggregate      # SupplyPlan reads DemandForecast state; Scenario writes PlanningCycle money

  role_model: segregation_of_duties
  # The DemandReviewLead who reviews a ConsensusAdjustment MUST NOT be the user who proposed
  # it, and the ExecutiveSponsor who selects a Scenario MUST NOT be the user who created it.
  # Both are enforced on X-User-ID, not on role alone.

  consistency_model: immediate

difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: PlanningCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_code
        type: string
        source: input
        description: human-readable cycle label, e.g. "CY-2026-09"
        constraints: "non-empty; unique across PlanningCycle"
      - name: horizon_start_month
        type: string
        source: input
        description: first planned month of the cycle horizon
        constraints: "format YYYY-MM"
      - name: horizon_end_month
        type: string
        source: input
        description: last planned month of the cycle horizon (inclusive)
        constraints: "format YYYY-MM; >= horizon_start_month"
      - name: financial_commitment_cents
        type: integer
        source: input
        description: revenue the executive team has already committed for this horizon, in cents
        constraints: ">= 0"
      - name: supply_review_policy
        type: enum
        source: input
        description: selects which variant of calc_constrained_supply this cycle uses
        constraints: "one of {NET_INVENTORY_FIRST, GROSS_CAPACITY_FIRST}"
      - name: status
        type: enum
        source: system
        description: S&OP phase of this cycle
        default: DEMAND_REVIEW
        constraints: "one of {DEMAND_REVIEW, SUPPLY_REVIEW, SCENARIO_REVIEW, EXECUTIVE_REVIEW, PUBLISHED}"
      - name: posture
        type: enum
        source: computed
        description: derived gate over all cycle-scoped child mutations; see calc_cycle_posture
        default: GREEN
        constraints: "one of {GREEN, AT_RISK, FROZEN}"
      - name: reopen_count
        type: integer
        source: system
        description: number of EXECUTIVE_REVIEW -> DEMAND_REVIEW reopen rounds already taken
        default: 0
        constraints: "<= MAX_REOPENS (2)"
      - name: plan_value_cents
        type: number
        source: computed
        description: cross-entity roll-up of constrained supply value; see calc_cycle_financials
        default: 0
      - name: gross_gap_cents
        type: number
        source: computed
        description: financial_commitment_cents - plan_value_cents; see calc_cycle_financials
        default: 0
      - name: selected_closure_cents
        type: number
        source: computed
        description: sum of net_gap_closure_cents over this cycle's SELECTED Scenarios
        default: 0
      - name: residual_gap_cents
        type: number
        source: computed
        description: gross_gap_cents - selected_closure_cents; publishing requires this <= 0
        default: 0
      - name: constrained_plan_count
        type: integer
        source: computed
        description: count of this cycle's SupplyPlan rows in status IN {PLANNED, RATIONED} whose constraint_type != NONE
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant at which the cycle reached PUBLISHED; null before that
        default: null

  - name: ProductFamily
    parent: null
    common_fields: true
    fields:
      - name: family_code
        type: string
        source: input
        description: family label, e.g. "FAM-SNACK"
        constraints: "non-empty; unique across ProductFamily"
      - name: name
        type: string
        source: input
        description: display name of the product family
      - name: accountable_planner_user_id
        type: string
        source: input
        description: opaque X-User-ID of the DemandPlanner accountable for this family's forecast accuracy
      - name: units_per_hour
        type: number
        source: input
        description: conversion rate from scheduled capacity hours to producible units for this family
        constraints: "> 0"
      - name: max_monthly_hours
        type: number
        source: input
        description: ceiling on total CapacityBlock.available_hours bucketed by start_date calendar month
        constraints: "> 0"
      - name: rolling_wmape_pct
        type: number
        source: computed
        description: volume-weighted MAPE over ALL AccuracyRecord rows of this family's items; see calc_accuracy_rollup
        default: null
      - name: rolling_bias_pct
        type: number
        source: computed
        description: signed bias over ALL AccuracyRecord rows of this family's items; see calc_accuracy_rollup
        default: null
      - name: bias_flag
        type: enum
        source: computed
        description: bias verdict derived from rolling_bias_pct
        default: NONE
        constraints: "one of {NONE, OVER_FORECAST, UNDER_FORECAST}"
      - name: accuracy_grade
        type: enum
        source: computed
        description: accountability grade derived from rolling_wmape_pct
        default: UNGRADED
        constraints: "one of {UNGRADED, A, B, C, D}"
      - name: scored_record_count
        type: integer
        source: computed
        description: number of AccuracyRecord rows contributing to the rolling metrics
        default: 0

  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: stock-keeping unit code
        constraints: "non-empty; unique across Item"
      - name: family_id
        type: string
        source: input
        description: FK -> ProductFamily.id; the family whose capacity and accountability this item inherits
      - name: unit_price_cents
        type: integer
        source: input
        description: net selling price per unit in cents, used for plan valuation
        constraints: "> 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: standard cost per unit in cents
        constraints: "> 0"
      - name: on_hand_units
        type: integer
        source: input
        description: current finished-goods inventory position in units
        constraints: ">= 0"
      - name: material_supply_cap_units
        type: integer
        source: input
        description: hard ceiling on producible units imposed by component/material availability
        constraints: ">= 0"
      - name: avg_monthly_demand_units
        type: integer
        source: input
        description: demand rate used by calc_inventory_policy for safety stock and reorder point
        constraints: ">= 0"
      - name: npi_ramp_pct
        type: number
        source: input
        description: new-item ramp factor applied by ANALOG_PROFILE baselines and NEW_ITEM_PLAN adjustments
        default: 100
        constraints: ">= 0 and <= 200"
      - name: service_level_target_pct
        type: number
        source: system
        description: target cycle service level; overwritten by POST /sop/items/{item_id}/inventory-policy
        default: 95.0
        constraints: "> 0 and <= 100"
      - name: demand_cv
        type: number
        source: system
        description: coefficient of variation of demand; overwritten by POST /sop/items/{item_id}/inventory-policy
        default: 0.30
        constraints: ">= 0 and <= 3"
      - name: lead_time_days
        type: integer
        source: system
        description: replenishment lead time in days; overwritten by POST /sop/items/{item_id}/inventory-policy
        default: 30
        constraints: "> 0"
      - name: safety_stock_units
        type: integer
        source: computed
        description: see calc_inventory_policy; also serves as SupplyPlan.target_build_units
        default: 0
      - name: reorder_point_units
        type: integer
        source: computed
        description: see calc_inventory_policy
        default: 0
      - name: lifecycle_state
        type: enum
        source: system
        description: NPI / runout / discontinuation lifecycle position
        default: PRELAUNCH
        constraints: "one of {PRELAUNCH, RAMP, MATURE, RUNOUT, DISCONTINUED, CANCELLED_NPI}"
      - name: successor_item_id
        type: string
        source: system
        description: FK -> Item.id; self-referential successor recorded when this item enters RUNOUT; null otherwise
        default: null
      - name: runout_end_month
        type: string
        source: system
        description: last month this item may be planned for; set when entering RUNOUT
        default: null
        constraints: "format YYYY-MM when present"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: customer_code
        type: string
        source: input
        description: trade customer code, e.g. "NATL-A"
        constraints: "non-empty; unique across Customer"
      - name: name
        type: string
        source: input
        description: display name of the trade customer
      - name: channel
        type: enum
        source: input
        description: go-to-market channel of this customer
        constraints: "one of {GROCERY, CLUB, DISCOUNT, ECOMMERCE}"
      - name: priority_rank
        type: integer
        source: input
        description: allocation priority; lower ranks are served first, ranks <= PROTECTED_RANK are filled in full first
        constraints: ">= 1"
      - name: credit_hold
        type: boolean
        source: input
        description: when true the customer is withheld from every allocation pass
        default: false

  - name: CapacityBlock
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: FK -> ProductFamily.id; the family whose asset group this block schedules
      - name: start_date
        type: string
        source: input
        description: inclusive start of the scheduled interval (half-open interval start)
        constraints: "format YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: exclusive end of the scheduled interval (half-open interval end)
        constraints: "format YYYY-MM-DD; > start_date"
      - name: available_hours
        type: number
        source: input
        description: scheduled run hours available on this family's asset group over the interval
        constraints: "> 0"

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> Item.id; the promoted item
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the trade customer the promotion runs at
      - name: start_month
        type: string
        source: input
        description: inclusive first promoted month (closed interval start)
        constraints: "format YYYY-MM"
      - name: end_month
        type: string
        source: input
        description: inclusive last promoted month (closed interval end)
        constraints: "format YYYY-MM; >= start_month"
      - name: lift_pct
        type: number
        source: input
        description: percentage uplift applied to the baseline by a PROMOTION adjustment
        constraints: "> 0 and <= 300"
      - name: cannibalization_pct
        type: number
        source: input
        description: percentage of baseline lost to cannibalized siblings, netted against the lift
        constraints: ">= 0 and <= 100"
      - name: status
        type: enum
        source: system
        description: promotion approval lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, CANCELLED_RUNOUT}"

  - name: DemandForecast
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PlanningCycle.id; the cycle this forecast belongs to
      - name: item_id
        type: string
        source: input
        description: FK -> Item.id; forecast subject item
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; forecast subject customer
      - name: month
        type: string
        source: input
        description: forecast month, must lie inside the cycle horizon
        constraints: "format YYYY-MM"
      - name: level_units
        type: integer
        source: input
        description: de-seasonalized level term of the statistical baseline
        constraints: ">= 0"
      - name: trend_units_per_month
        type: number
        source: input
        description: linear trend term per month of horizon offset
      - name: seasonal_index
        type: number
        source: input
        description: multiplicative seasonal index for this month
        constraints: "> 0 and <= 5"
      - name: causal_uplift_pct
        type: number
        source: input
        description: causal-factor uplift expressed as a PERCENT (10 means +10%), applied as (1 + causal_uplift_pct / 100)
        constraints: ">= -100 and <= 500"
      - name: method
        type: enum
        source: computed
        description: statistical method selected by calc_statistical_baseline
        constraints: "one of {HOLT_WINTERS, CROSTON_FLAT, ANALOG_PROFILE}"
      - name: baseline_units
        type: integer
        source: computed
        description: statistical baseline in units; see calc_statistical_baseline
      - name: consensus_units
        type: integer
        source: computed
        description: baseline plus endorsed/committed adjustments; see calc_consensus_units
      - name: status
        type: enum
        source: system
        description: consensus lifecycle position of this forecast line
        default: BASELINE
        constraints: "one of {BASELINE, UNDER_CONSENSUS, CONSENSUS_LOCKED, RUNOUT_TRUNCATED}"
      - name: endorsed_adjustment_count
        type: integer
        source: computed
        description: number of ConsensusAdjustment rows on this forecast in status IN {ENDORSED, COMMITTED}
        default: 0

  - name: ConsensusAdjustment
    parent: null
    common_fields: true
    fields:
      - name: demand_forecast_id
        type: string
        source: input
        description: FK -> DemandForecast.id; the forecast line being adjusted
      - name: promotion_id
        type: string
        source: input
        description: FK -> Promotion.id; required for adjustment_type PROMOTION, absent or null otherwise
        default: null
      - name: adjustment_type
        type: enum
        source: input
        description: which consensus input this adjustment encodes
        constraints: "one of {SALES_INTELLIGENCE, PROMOTION, NEW_ITEM_PLAN}"
      - name: delta_units
        type: integer
        source: input
        description: raw unit delta supplied by the planner; required on every create, and IGNORED for adjustment_type PROMOTION whose delta is derived entirely from the cited promotion's lift_pct and cannibalization_pct (send 0 by convention)
        default: null
      - name: applied_delta_units
        type: integer
        source: computed
        description: rounded per-adjustment delta actually folded into consensus; see calc_consensus_units
      - name: rationale
        type: string
        source: input
        description: planner's justification text
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: review lifecycle of this adjustment
        default: PROPOSED
        constraints: "one of {PROPOSED, REVISION_REQUESTED, ENDORSED, COMMITTED, REJECTED, VOIDED}"
      - name: revision_round
        type: integer
        source: system
        description: number of REVISION_REQUESTED -> PROPOSED resubmissions already taken
        default: 0
        constraints: "<= MAX_REVISION_ROUNDS (3)"
      - name: proposed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID captured from the proposing request; drives segregation of duties
      - name: reviewed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the reviewing DemandReviewLead; null before review
        default: null
      - name: review_note
        type: string
        source: system
        description: reviewer note copied from the review request
        default: null

  - name: SupplyPlan
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PlanningCycle.id; the cycle this supply plan belongs to
      - name: item_id
        type: string
        source: input
        description: FK -> Item.id; the item being supply-planned
      - name: gross_requirement_units
        type: integer
        source: computed
        description: sum of consensus_units over CONSENSUS_LOCKED forecasts for (cycle_id, item_id)
      - name: target_build_units
        type: integer
        source: computed
        description: inventory target contribution, equal to Item.safety_stock_units at plan time
      - name: available_units
        type: integer
        source: computed
        description: capacity converted to units; see calc_constrained_supply
      - name: material_cap_units
        type: integer
        source: computed
        description: snapshot of Item.material_supply_cap_units at plan time
      - name: demand_side_units
        type: integer
        source: computed
        description: policy-dependent demand quantity the constraints are compared against
      - name: constrained_units
        type: integer
        source: computed
        description: feasible build quantity; see calc_constrained_supply
      - name: shortfall_units
        type: integer
        source: computed
        description: demand_side_units - constrained_units, never negative
      - name: constraint_type
        type: enum
        source: computed
        description: identified binding constraint; see calc_constrained_supply
        constraints: "one of {NONE, MATERIAL, CAPACITY, INVENTORY_TARGET}"
      - name: unallocated_units
        type: integer
        source: system
        description: constrained_units not yet handed to any Allocation row; conserved quantity of inv_allocation_units_conserved
      - name: status
        type: enum
        source: system
        description: supply plan lifecycle
        default: PLANNED
        constraints: "one of {PLANNED, RATIONED, STALE, COMMITTED}"
      - name: requires_replan
        type: boolean
        source: system
        description: set true when the plan is invalidated by an upstream change
        default: false

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - name: supply_plan_id
        type: string
        source: input
        description: FK -> SupplyPlan.id; the rationed plan this allocation belongs to
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the customer receiving the allocation
      - name: requested_units
        type: integer
        source: computed
        description: sum of consensus_units over CONSENSUS_LOCKED forecasts for (plan.cycle_id, plan.item_id, customer_id)
      - name: allocated_units
        type: integer
        source: computed
        description: units granted by calc_rationing_waterfall
      - name: fill_rate_pct
        type: number
        source: computed
        description: allocated_units / requested_units as a percentage, 2dp; exactly 100.00 when requested_units == 0
      - name: allocation_status
        type: enum
        source: system
        description: outcome of the rationing pass for this customer
        constraints: "one of {ALLOCATED, WITHHELD_CREDIT_HOLD, VOIDED}"
      - name: allocation_pass
        type: enum
        source: computed
        description: which rationing pass granted the units
        constraints: "one of {PROTECTED, PRO_RATA, NONE}"

  - name: Scenario
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> PlanningCycle.id; the cycle this scenario closes gap for
      - name: scenario_type
        type: enum
        source: input
        description: gap-closing lever this scenario models
        constraints: "one of {CAPACITY_INVESTMENT, PRICE_REALIZATION}"
      - name: name
        type: string
        source: input
        description: display name of the scenario
        constraints: "non-empty"
      - name: target_item_id
        type: string
        source: input
        description: FK -> Item.id; required for CAPACITY_INVESTMENT, must be null for PRICE_REALIZATION
        default: null
      - name: added_capacity_hours
        type: number
        source: input
        description: incremental run hours purchased; required for CAPACITY_INVESTMENT, null otherwise
        default: null
        constraints: "> 0 when present"
      - name: price_increase_pct
        type: number
        source: input
        description: list-price realization percentage; required for PRICE_REALIZATION, null otherwise
        default: null
        constraints: "> 0 and <= 100 when present"
      - name: incremental_units
        type: integer
        source: computed
        description: extra sellable units unlocked; see calc_scenario_gap_closure
        default: 0
      - name: gross_uplift_cents
        type: number
        source: computed
        description: step 2 of calc_scenario_gap_closure
        default: 0
      - name: investment_cost_cents
        type: number
        source: computed
        description: step 3 of calc_scenario_gap_closure
        default: 0
      - name: pre_trade_closure_cents
        type: number
        source: computed
        description: step 4 of calc_scenario_gap_closure; the ONLY input to the trade-rate tier
        default: 0
      - name: trade_rate_pct
        type: number
        source: computed
        description: step 5 tier selection of calc_scenario_gap_closure
        default: 0
      - name: trade_spend_cents
        type: number
        source: computed
        description: step 6 of calc_scenario_gap_closure
        default: 0
      - name: net_gap_closure_cents
        type: number
        source: computed
        description: step 7 of calc_scenario_gap_closure; contributes to PlanningCycle.selected_closure_cents while SELECTED
        default: 0
      - name: status
        type: enum
        source: system
        description: scenario lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, EVALUATED, SELECTED, SUPERSEDED, EXECUTED}"
      - name: created_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the creating SupplyPlanner; drives segregation of duties on select
      - name: selected_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the selecting ExecutiveSponsor; null before selection
        default: null

  - name: AccuracyRecord
    parent: null
    common_fields: false
    # Immutable ledger row: it carries id and created_at but deliberately has NO
    # updated_at and NO version, because nothing may ever rewrite a posted actual.
    fields:
      - name: id
        type: string
        source: system
        description: server-generated identifier
      - name: created_at
        type: datetime
        source: system
        description: logical-clock instant at which the actual was posted; the tie-break key of calc_accuracy_rollup's worst_item_id
      - name: cycle_id
        type: string
        source: input
        description: FK -> PlanningCycle.id; the published cycle being scored
      - name: item_id
        type: string
        source: input
        description: FK -> Item.id; scored item
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; scored customer
      - name: actual_units
        type: integer
        source: input
        description: realized shipment units for the scored forecast line
        constraints: ">= 0"
      - name: forecast_units_snapshot
        type: integer
        source: computed
        description: consensus_units copied from the matching CONSENSUS_LOCKED DemandForecast at record creation
      - name: abs_error_units
        type: integer
        source: computed
        description: abs(forecast_units_snapshot - actual_units)
      - name: signed_error_units
        type: integer
        source: computed
        description: forecast_units_snapshot - actual_units; positive means over-forecast
      - name: ape_pct
        type: number
        source: computed
        description: abs_error_units / actual_units as a percentage, 2dp; null when actual_units == 0
        default: null
      - name: accountable_planner_user_id
        type: string
        source: computed
        description: ProductFamily.accountable_planner_user_id of the scored item's family, copied at creation

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: PlanningCycle
    initial_state: DEMAND_REVIEW
    terminal_states: [PUBLISHED]
    transitions:
      - from: DEMAND_REVIEW
        to: SUPPLY_REVIEW
        trigger: "POST /sop/planning-cycles/{cycle_id}/transitions with target_status=SUPPLY_REVIEW"
        actor: SopAdmin or ExecutiveSponsor
        preconditions:
          - "cycle.status == DEMAND_REVIEW"
          - "no ConsensusAdjustment whose demand_forecast_id belongs to this cycle has status IN {PROPOSED, REVISION_REQUESTED} (else ERR_OPEN_ADJUSTMENTS)"
        side_effects:
          - "every DemandForecast of this cycle with status IN {BASELINE, UNDER_CONSENSUS} transitions to CONSENSUS_LOCKED"
          - "every ConsensusAdjustment on those forecasts with status == ENDORSED transitions to COMMITTED (applied_delta_units unchanged, so consensus_units is unchanged)"
          - "recompute calc_cycle_financials (plan_value_cents, gross_gap_cents, residual_gap_cents) and calc_cycle_posture"
          - "increments PlanningCycle.version by 1"
      - from: SUPPLY_REVIEW
        to: SCENARIO_REVIEW
        trigger: "POST /sop/planning-cycles/{cycle_id}/transitions with target_status=SCENARIO_REVIEW"
        actor: SopAdmin or ExecutiveSponsor
        preconditions:
          - "cycle.status == SUPPLY_REVIEW"
          - "no SupplyPlan of this cycle has status == STALE (else ERR_STALE_SUPPLY_PLAN)"
        side_effects:
          - "recompute calc_cycle_financials and calc_cycle_posture"
          - "increments PlanningCycle.version by 1"
      - from: SCENARIO_REVIEW
        to: EXECUTIVE_REVIEW
        trigger: "POST /sop/planning-cycles/{cycle_id}/transitions with target_status=EXECUTIVE_REVIEW"
        actor: SopAdmin or ExecutiveSponsor
        preconditions:
          - "cycle.status == SCENARIO_REVIEW"
          - "no Scenario of this cycle has status == DRAFT (else ERR_UNEVALUATED_SCENARIO)"
        side_effects:
          - "recompute calc_cycle_financials and calc_cycle_posture"
          - "increments PlanningCycle.version by 1"
      - from: EXECUTIVE_REVIEW
        to: PUBLISHED
        trigger: "POST /sop/planning-cycles/{cycle_id}/transitions with target_status=PUBLISHED"
        actor: ExecutiveSponsor
        preconditions:
          - "cycle.status == EXECUTIVE_REVIEW"
          - "cycle.residual_gap_cents <= 0 (else ERR_UNCLOSED_GAP)"
        side_effects:
          - "every SupplyPlan of this cycle with status IN {PLANNED, RATIONED} transitions to COMMITTED"
          - "every Scenario of this cycle with status == SELECTED transitions to EXECUTED"
          - "published_at := logical clock now"
          - "posture := FROZEN (calc_cycle_posture rule 1)"
          - "increments PlanningCycle.version by 1"
        note: "PUBLISHED is terminal; posture FROZEN then blocks every cycle-scoped child mutation with ERR_CYCLE_FROZEN."
      - from: EXECUTIVE_REVIEW
        to: DEMAND_REVIEW
        trigger: "POST /sop/planning-cycles/{cycle_id}/transitions with target_status=DEMAND_REVIEW and reopen_reason"
        actor: ExecutiveSponsor
        preconditions:
          - "cycle.status == EXECUTIVE_REVIEW"
          - "cycle.reopen_count < MAX_REOPENS (2) (else ERR_REOPEN_LIMIT_REACHED)"
        side_effects:
          - "reopen_count := reopen_count + 1"
          - "every DemandForecast of this cycle with status == CONSENSUS_LOCKED transitions to UNDER_CONSENSUS"
          - "every Scenario of this cycle with status == SELECTED transitions to SUPERSEDED and its net_gap_closure_cents leaves selected_closure_cents"
          - "every SupplyPlan of this cycle with status IN {PLANNED, RATIONED} transitions to STALE with requires_replan := true; because those plans became STALE, each of their Allocation rows with allocation_status == ALLOCATED transitions to VOIDED with allocated_units := 0 and fill_rate_pct := 0.00, and the plan's unallocated_units := constrained_units"
          - "recompute calc_cycle_financials (STALE plans leave plan_value_cents) and calc_cycle_posture"
          - "increments PlanningCycle.version by 1"
        note: "This is the cycle's revision loop — the only backward edge in the phase machine."

  - entity: DemandForecast
    initial_state: BASELINE
    terminal_states: [RUNOUT_TRUNCATED]
    transitions:
      - from: BASELINE
        to: UNDER_CONSENSUS
        trigger: "POST /sop/demand-forecasts/{forecast_id}/transitions with target_status=UNDER_CONSENSUS, or implicitly by POST /sop/consensus-adjustments (first adjustment created against this forecast)"
        actor: SopAdmin, DemandPlanner or DemandReviewLead (system when driven by the adjustment create)
        preconditions:
          - "forecast.status == BASELINE"
          - "the forecast's cycle.status == DEMAND_REVIEW"
        side_effects:
          - "increments DemandForecast.version by 1"
      - from: UNDER_CONSENSUS
        to: CONSENSUS_LOCKED
        trigger: "POST /sop/demand-forecasts/{forecast_id}/transitions with target_status=CONSENSUS_LOCKED, or system on PlanningCycle DEMAND_REVIEW -> SUPPLY_REVIEW"
        actor: SopAdmin, DemandPlanner or DemandReviewLead (system on the cycle advance)
        preconditions:
          - "no ConsensusAdjustment on this forecast has status IN {PROPOSED, REVISION_REQUESTED}"
        side_effects:
          - "consensus_units frozen at its current calc_consensus_units value"
          - "increments DemandForecast.version by 1"
      - from: BASELINE
        to: CONSENSUS_LOCKED
        trigger: "POST /sop/demand-forecasts/{forecast_id}/transitions with target_status=CONSENSUS_LOCKED, or system on PlanningCycle DEMAND_REVIEW -> SUPPLY_REVIEW"
        actor: SopAdmin, DemandPlanner or DemandReviewLead (system on the cycle advance)
        preconditions: []
        side_effects:
          - "consensus_units == baseline_units is frozen"
          - "increments DemandForecast.version by 1"
      - from: CONSENSUS_LOCKED
        to: UNDER_CONSENSUS
        trigger: "POST /sop/demand-forecasts/{forecast_id}/transitions with target_status=UNDER_CONSENSUS, or system on PlanningCycle EXECUTIVE_REVIEW -> DEMAND_REVIEW (reopen)"
        actor: SopAdmin, DemandPlanner or DemandReviewLead (system on the reopen)
        preconditions: []
        side_effects:
          - "forecast becomes adjustable again; COMMITTED adjustments keep contributing to consensus_units"
          - "increments DemandForecast.version by 1"
        note: "Cyclic edge: a forecast can be locked, reopened and locked again, bounded by MAX_REOPENS on the cycle."
      - from: CONSENSUS_LOCKED
        to: RUNOUT_TRUNCATED
        trigger: "system, on Item MATURE -> RUNOUT when forecast.month > item.runout_end_month"
        actor: system
        preconditions:
          - "forecast.item_id == the transitioning item"
          - "forecast.month > item.runout_end_month (string compare on YYYY-MM)"
        side_effects:
          - "consensus_units := 0 and baseline_units unchanged"
          - "increments DemandForecast.version by 1"
      - from: UNDER_CONSENSUS
        to: RUNOUT_TRUNCATED
        trigger: "system, on Item MATURE -> RUNOUT or PRELAUNCH -> CANCELLED_NPI"
        actor: system
        preconditions:
          - "forecast.item_id == the transitioning item"
          - "for RUNOUT: forecast.month > item.runout_end_month; for CANCELLED_NPI: every month"
        side_effects:
          - "consensus_units := 0"
          - "increments DemandForecast.version by 1"

  - entity: ConsensusAdjustment
    initial_state: PROPOSED
    terminal_states: [REJECTED, VOIDED, COMMITTED]
    transitions:
      - from: PROPOSED
        to: ENDORSED
        trigger: "POST /sop/consensus-adjustments/{adjustment_id}/reviews with decision=ENDORSE"
        actor: DemandReviewLead
        preconditions:
          - "adjustment.status == PROPOSED (else ERR_ADJUSTMENT_NOT_REVIEWABLE)"
          - "the adjustment's forecast's cycle.status == DEMAND_REVIEW (else ERR_CYCLE_PHASE_CLOSED)"
          - "X-User-ID != adjustment.proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "the adjustment's DemandForecast.endorsed_adjustment_count and consensus_units are recomputed by calc_consensus_units; increments DemandForecast.version by 1"
          - "increments ConsensusAdjustment.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /sop/consensus-adjustments/{adjustment_id}/reviews with decision=REJECT"
        actor: DemandReviewLead
        preconditions:
          - "adjustment.status == PROPOSED"
          - "the adjustment's forecast's cycle.status == DEMAND_REVIEW"
          - "X-User-ID != adjustment.proposed_by_user_id"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; consensus_units unchanged (REJECTED never contributes)"
          - "increments ConsensusAdjustment.version by 1"
      - from: PROPOSED
        to: REVISION_REQUESTED
        trigger: "POST /sop/consensus-adjustments/{adjustment_id}/reviews with decision=REQUEST_REVISION"
        actor: DemandReviewLead
        preconditions:
          - "adjustment.status == PROPOSED"
          - "the adjustment's forecast's cycle.status == DEMAND_REVIEW"
          - "X-User-ID != adjustment.proposed_by_user_id"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; review_note stored"
          - "increments ConsensusAdjustment.version by 1"
      - from: REVISION_REQUESTED
        to: PROPOSED
        trigger: "POST /sop/consensus-adjustments/{adjustment_id}/resubmit"
        actor: DemandPlanner
        preconditions:
          - "adjustment.status == REVISION_REQUESTED (else ERR_ADJUSTMENT_NOT_RESUBMITTABLE)"
          - "adjustment.revision_round < MAX_REVISION_ROUNDS (3) (else ERR_REVISION_LIMIT_REACHED)"
          - "the adjustment's forecast's cycle.status == DEMAND_REVIEW"
          - "expected_demand_forecast_version matches the forecast's current version"
        side_effects:
          - "revision_round := revision_round + 1; delta_units and rationale replaced; applied_delta_units recomputed"
          - "reviewed_by_user_id := null; review_note := null"
          - "increments DemandForecast.version by 1 and ConsensusAdjustment.version by 1"
        note: "Cyclic edge: PROPOSED -> REVISION_REQUESTED -> PROPOSED, bounded at three revision rounds (revision_round 0 -> 1 -> 2 -> 3, the fourth resubmit is rejected)."
      - from: ENDORSED
        to: COMMITTED
        trigger: "system, on PlanningCycle DEMAND_REVIEW -> SUPPLY_REVIEW"
        actor: system
        preconditions: []
        side_effects:
          - "increments ConsensusAdjustment.version by 1; consensus_units unchanged"
      - from: PROPOSED
        to: VOIDED
        trigger: "system, on POST /sop/consensus-adjustments superseding an earlier PROPOSED adjustment of the same adjustment_type and proposed_by_user_id on the same forecast, or on Item MATURE -> RUNOUT / PRELAUNCH -> CANCELLED_NPI cascade"
        actor: system
        preconditions: []
        side_effects:
          - "applied_delta_units := 0; the forecast's consensus_units recomputed (a PROPOSED adjustment contributed nothing, so the value is unchanged)"
          - "increments ConsensusAdjustment.version by 1"
      - from: ENDORSED
        to: VOIDED
        trigger: "system, on Promotion APPROVED -> CANCELLED_RUNOUT (which is itself caused by Item MATURE -> RUNOUT)"
        actor: system
        preconditions:
          - "adjustment.adjustment_type == PROMOTION and adjustment.promotion_id == the cancelled promotion"
        side_effects:
          - "applied_delta_units := 0; the forecast's consensus_units and endorsed_adjustment_count recomputed by calc_consensus_units; increments DemandForecast.version by 1"
          - "increments ConsensusAdjustment.version by 1"
      - from: COMMITTED
        to: VOIDED
        trigger: "system, on Promotion APPROVED -> CANCELLED_RUNOUT"
        actor: system
        preconditions:
          - "adjustment.adjustment_type == PROMOTION and adjustment.promotion_id == the cancelled promotion"
        side_effects:
          - "applied_delta_units := 0; the forecast's consensus_units recomputed; increments DemandForecast.version by 1"
          - "increments ConsensusAdjustment.version by 1"

  - entity: Item
    initial_state: PRELAUNCH
    terminal_states: [DISCONTINUED, CANCELLED_NPI]
    transitions:
      - from: PRELAUNCH
        to: RAMP
        trigger: "POST /sop/items/{item_id}/lifecycle-transitions with target_state=RAMP"
        actor: SopAdmin
        preconditions:
          - "item.lifecycle_state == PRELAUNCH (else ERR_ITEM_LIFECYCLE_TRANSITION_INVALID)"
        side_effects:
          - "item becomes promotable (Promotion DRAFT -> APPROVED requires lifecycle_state IN {RAMP, MATURE})"
          - "increments Item.version by 1"
        note: "Fork branch 1 out of PRELAUNCH."
      - from: PRELAUNCH
        to: CANCELLED_NPI
        trigger: "POST /sop/items/{item_id}/lifecycle-transitions with target_state=CANCELLED_NPI"
        actor: SopAdmin
        preconditions:
          - "item.lifecycle_state == PRELAUNCH"
        side_effects:
          - "every ConsensusAdjustment with adjustment_type == NEW_ITEM_PLAN on a DemandForecast of this item with status IN {PROPOSED, ENDORSED, COMMITTED} transitions to VOIDED"
          - "every DemandForecast of this item with status IN {BASELINE, UNDER_CONSENSUS, CONSENSUS_LOCKED} transitions to RUNOUT_TRUNCATED with consensus_units := 0 (every month, not just months past a runout boundary)"
          - "every Promotion of this item with status IN {DRAFT, APPROVED} transitions to CANCELLED_RUNOUT"
          - "increments Item.version by 1"
        note: "Fork branch 2 out of PRELAUNCH — the side-effect set is disjoint from RAMP's (which touches nothing)."
      - from: RAMP
        to: MATURE
        trigger: "POST /sop/items/{item_id}/lifecycle-transitions with target_state=MATURE"
        actor: SopAdmin
        preconditions:
          - "item.lifecycle_state == RAMP"
        side_effects:
          - "increments Item.version by 1"
      - from: MATURE
        to: RUNOUT
        trigger: "POST /sop/items/{item_id}/lifecycle-transitions with target_state=RUNOUT, runout_end_month required, successor_item_id optional"
        actor: SopAdmin
        preconditions:
          - "item.lifecycle_state == MATURE"
          - "runout_end_month present and format YYYY-MM (else ERR_INVALID_REQUEST)"
          - "when successor_item_id is present, the successor Item exists, is a DIFFERENT item in the SAME ProductFamily, and its lifecycle_state IN {PRELAUNCH, RAMP} (else ERR_SUCCESSOR_NOT_ELIGIBLE)"
        side_effects:
          - "runout_end_month and successor_item_id stored"
          - "HOP 1 -> HOP 2: every Promotion of this item with status IN {DRAFT, APPROVED} whose start_month > runout_end_month transitions to CANCELLED_RUNOUT"
          - "HOP 2 -> HOP 3 (caused by each promotion's cancellation, not by the item transition): every ConsensusAdjustment with adjustment_type == PROMOTION and promotion_id == that cancelled promotion whose status IN {PROPOSED, ENDORSED, COMMITTED} transitions to VOIDED with applied_delta_units := 0, and the adjustment's DemandForecast.consensus_units + endorsed_adjustment_count are recomputed by calc_consensus_units (DemandForecast.version increments)"
          - "every DemandForecast of this item whose month > runout_end_month transitions to RUNOUT_TRUNCATED with consensus_units := 0"
          - "increments Item.version by 1"
      - from: RUNOUT
        to: DISCONTINUED
        trigger: "POST /sop/items/{item_id}/lifecycle-transitions with target_state=DISCONTINUED"
        actor: SopAdmin
        preconditions:
          - "item.lifecycle_state == RUNOUT"
          - "item.on_hand_units == 0 (else ERR_RUNOUT_INVENTORY_REMAINS)"
        side_effects:
          - "increments Item.version by 1"
        note: "Boundary: on_hand_units == 0 passes, on_hand_units == 1 fails."

  - entity: Promotion
    initial_state: DRAFT
    terminal_states: [CANCELLED_RUNOUT]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /sop/promotions/{promotion_id}/approve"
        actor: DemandReviewLead
        preconditions:
          - "promotion.status == DRAFT (else ERR_PROMOTION_NOT_APPROVABLE)"
          - "the promoted Item.lifecycle_state IN {RAMP, MATURE} (else ERR_ITEM_NOT_PROMOTABLE)"
          - "no other Promotion with the same item_id and customer_id and status == APPROVED has a month window that intersects [start_month, end_month] (else ERR_PROMOTION_WINDOW_OVERLAP)"
        side_effects:
          - "the promotion becomes usable as a PROMOTION ConsensusAdjustment's promotion_id"
          - "increments Promotion.version by 1"
      - from: DRAFT
        to: CANCELLED_RUNOUT
        trigger: "system, on Item MATURE -> RUNOUT (start_month > runout_end_month) or PRELAUNCH -> CANCELLED_NPI"
        actor: system
        preconditions: []
        side_effects:
          - "increments Promotion.version by 1"
      - from: APPROVED
        to: CANCELLED_RUNOUT
        trigger: "system, on Item MATURE -> RUNOUT (start_month > runout_end_month) or PRELAUNCH -> CANCELLED_NPI"
        actor: system
        preconditions: []
        side_effects:
          - "because this promotion was cancelled, every ConsensusAdjustment with promotion_id == this promotion and status IN {PROPOSED, ENDORSED, COMMITTED} transitions to VOIDED (next hop of the runout cascade)"
          - "increments Promotion.version by 1"

  - entity: SupplyPlan
    initial_state: PLANNED
    terminal_states: [STALE, COMMITTED]
    transitions:
      - from: PLANNED
        to: RATIONED
        trigger: "POST /sop/supply-plans/{supply_plan_id}/ration"
        actor: SupplyPlanner
        preconditions:
          - "plan.status == PLANNED (else ERR_SUPPLY_PLAN_NOT_RATIONABLE)"
          - "the plan's cycle.status == SUPPLY_REVIEW (else ERR_CYCLE_PHASE_CLOSED)"
        side_effects:
          - "one Allocation row is created per Customer that has at least one CONSENSUS_LOCKED DemandForecast for (plan.cycle_id, plan.item_id), populated by calc_rationing_waterfall"
          - "unallocated_units := constrained_units - sum(Allocation.allocated_units)"
          - "increments SupplyPlan.version by 1"
      - from: PLANNED
        to: STALE
        trigger: "system, on POST /sop/items/{item_id}/inventory-policy for this plan's item, or on PlanningCycle EXECUTIVE_REVIEW -> DEMAND_REVIEW"
        actor: system
        preconditions: []
        side_effects:
          - "requires_replan := true"
          - "the plan's cycle.plan_value_cents excludes this plan, so calc_cycle_financials and calc_cycle_posture are recomputed (PlanningCycle.version increments)"
          - "increments SupplyPlan.version by 1"
      - from: RATIONED
        to: STALE
        trigger: "system, on POST /sop/items/{item_id}/inventory-policy for this plan's item, or on PlanningCycle EXECUTIVE_REVIEW -> DEMAND_REVIEW"
        actor: system
        preconditions: []
        side_effects:
          - "requires_replan := true"
          - "because this plan became STALE, every Allocation row of this plan with allocation_status == ALLOCATED transitions to VOIDED with allocated_units := 0 and fill_rate_pct := 0.00 and allocation_pass := NONE, and unallocated_units := constrained_units (inv_allocation_units_conserved still holds)"
          - "the plan's cycle.plan_value_cents excludes this plan, so calc_cycle_financials and calc_cycle_posture are recomputed (PlanningCycle.version increments)"
          - "increments SupplyPlan.version by 1"
      - from: PLANNED
        to: COMMITTED
        trigger: "system, on PlanningCycle EXECUTIVE_REVIEW -> PUBLISHED"
        actor: system
        preconditions: []
        side_effects:
          - "increments SupplyPlan.version by 1"
      - from: RATIONED
        to: COMMITTED
        trigger: "system, on PlanningCycle EXECUTIVE_REVIEW -> PUBLISHED"
        actor: system
        preconditions: []
        side_effects:
          - "Allocation rows are frozen as the committed customer allocations"
          - "increments SupplyPlan.version by 1"

  - entity: Scenario
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXECUTED]
    transitions:
      - from: DRAFT
        to: EVALUATED
        trigger: "POST /sop/scenarios/{scenario_id}/evaluate"
        actor: SupplyPlanner
        preconditions:
          - "scenario.status == DRAFT (else ERR_SCENARIO_NOT_EVALUATABLE)"
          - "the scenario's cycle.status == SCENARIO_REVIEW (else ERR_UNAUTHORIZED_PHASE_ACTOR at priority 60, or ERR_CYCLE_PHASE_CLOSED when the actor owns the phase)"
          - "for CAPACITY_INVESTMENT: a SupplyPlan with status IN {PLANNED, RATIONED} exists for (cycle_id, target_item_id) (else ERR_SUPPLY_PLAN_NOT_FOUND)"
        side_effects:
          - "all seven calc_scenario_gap_closure outputs are written in the pinned step order"
          - "increments Scenario.version by 1"
      - from: EVALUATED
        to: SELECTED
        trigger: "POST /sop/scenarios/{scenario_id}/select"
        actor: ExecutiveSponsor
        preconditions:
          - "scenario.status == EVALUATED (else ERR_SCENARIO_NOT_SELECTABLE)"
          - "the scenario's cycle.status == EXECUTIVE_REVIEW (else ERR_CYCLE_PHASE_CLOSED)"
          - "X-User-ID != scenario.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_cycle_version matches the cycle's current version (else ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "selected_by_user_id := X-User-ID"
          - "any other Scenario of the same cycle with the same scenario_type and status == SELECTED transitions to SUPERSEDED"
          - "cycle.selected_closure_cents and cycle.residual_gap_cents are recomputed by calc_cycle_financials, then calc_cycle_posture; increments PlanningCycle.version by 1"
          - "increments Scenario.version by 1"
      - from: SELECTED
        to: SUPERSEDED
        trigger: "system, on another Scenario of the same cycle and scenario_type being selected, or on PlanningCycle EXECUTIVE_REVIEW -> DEMAND_REVIEW"
        actor: system
        preconditions: []
        side_effects:
          - "net_gap_closure_cents leaves cycle.selected_closure_cents; cycle.residual_gap_cents recomputed (inv_gap_closure_cents_conserved)"
          - "increments Scenario.version by 1"
        note: "Fork branch 1 out of SELECTED — money is REMOVED from the cycle."
      - from: SELECTED
        to: EXECUTED
        trigger: "system, on PlanningCycle EXECUTIVE_REVIEW -> PUBLISHED"
        actor: system
        preconditions: []
        side_effects:
          - "net_gap_closure_cents REMAINS inside cycle.selected_closure_cents"
          - "increments Scenario.version by 1"
        note: "Fork branch 2 out of SELECTED — money is RETAINED. Divergent side-effect set versus SUPERSEDED."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: adjustment-create-stale-forecast
    parent_entity: DemandForecast
    write_endpoint: "POST /sop/consensus-adjustments"
    occ_field: "expected_demand_forecast_version"
    description: |
      Creating a ConsensusAdjustment against a DemandForecast whose version has advanced
      since the client last observed it is rejected. A second create of the same
      adjustment_type by the same proposer on the same forecast legitimately supersedes
      the earlier PROPOSED adjustment (voiding it), so the write cannot be rejected by any
      state precondition — the client's stale view of the forecast is the only signal that
      it never saw the adjustment it is about to discard.
    error_id: ERR_STALE_FORECAST_VERSION
    http_status: 412
  - rule_id: scenario-select-stale-cycle
    parent_entity: PlanningCycle
    write_endpoint: "POST /sop/scenarios/{scenario_id}/select"
    occ_field: "expected_cycle_version"
    description: |
      Selecting a Scenario against a PlanningCycle whose version has advanced since the
      client last read it is rejected. Selecting a scenario legitimately supersedes the
      cycle's other SELECTED scenario of the same scenario_type and rewrites
      selected_closure_cents / residual_gap_cents, so a second select of a different
      scenario would itself succeed under the product semantics; the stale version is the
      only way to detect that the selector never saw the closure it is replacing.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: calc_statistical_baseline
    trigger: "POST /sop/demand-forecasts (writes DemandForecast.method and DemandForecast.baseline_units, then consensus_units := baseline_units)"
    algorithm: threshold
    formula: |
      # --- step 1: method selection (evaluate in this order, FIRST match wins) ---
      if item.lifecycle_state == "PRELAUNCH":            method = "ANALOG_PROFILE"
      elif item.demand_cv >= INTERMITTENT_CV_THRESHOLD:  method = "CROSTON_FLAT"
      else:                                             method = "HOLT_WINTERS"

      # --- step 2: horizon offset (integer months, 0-based) ---
      offset = (year(forecast.month) - year(cycle.horizon_start_month)) * 12
             + (month_no(forecast.month) - month_no(cycle.horizon_start_month))

      # --- step 3: raw level ---
      if method == "HOLT_WINTERS":
          raw = (level_units + trend_units_per_month * offset) * seasonal_index
      elif method == "CROSTON_FLAT":
          raw = level_units                     # trend AND seasonality are BOTH suppressed
      else:  # ANALOG_PROFILE
          raw = level_units * (item.npi_ramp_pct / 100) * seasonal_index   # trend suppressed only

      # --- step 4: causal factor (a PERCENT, e.g. 10 means +10%), then ONE rounding at the end ---
      baseline_units = round_half_up(raw * (1 + causal_uplift_pct / 100), 0)   # integer units
      consensus_units = baseline_units                                    # no adjustments yet
    input_set: "exactly one DemandForecast row's own input fields plus item.lifecycle_state, item.demand_cv and item.npi_ramp_pct read at creation time; no other forecast rows participate"
    constants:
      INTERMITTENT_CV_THRESHOLD: 0.75
    precision: "baseline_units is an integer; a single round_half_up is applied at step 4 and nowhere else"
    variants:
      - name: holt_winters
        when: "item.lifecycle_state != PRELAUNCH and item.demand_cv < 0.75"
        difference: "trend and seasonal_index both participate"
      - name: croston_flat
        when: "item.lifecycle_state != PRELAUNCH and item.demand_cv >= 0.75"
        difference: "intermittent demand — trend and seasonal_index are ignored entirely, only level and causal survive"
      - name: analog_profile
        when: "item.lifecycle_state == PRELAUNCH"
        difference: "new item with no history — level is scaled by item.npi_ramp_pct and seasonality is kept, trend is ignored"

  - name: calc_consensus_units
    trigger: "ConsensusAdjustment PROPOSED_to_ENDORSED, ENDORSED_to_VOIDED, COMMITTED_to_VOIDED, REVISION_REQUESTED_to_PROPOSED, and Item MATURE_to_RUNOUT / PRELAUNCH_to_CANCELLED_NPI cascades (writes DemandForecast.consensus_units and DemandForecast.endorsed_adjustment_count, plus ConsensusAdjustment.applied_delta_units)"
    algorithm: aggregation
    formula: |
      # --- per-adjustment applied_delta_units (computed when the row is created or resubmitted) ---
      if adjustment_type == "PROMOTION":
          # promotion_id must point at an APPROVED Promotion
          lift_term   = round_half_up(forecast.baseline_units * promotion.lift_pct / 100, 0)
          cannib_term = round_half_up(forecast.baseline_units * promotion.cannibalization_pct / 100, 0)
          applied_delta_units = lift_term - cannib_term
          # PINNED: the two terms are rounded SEPARATELY to integer units and only THEN
          # subtracted. Rounding the net (round_half_up(base*(lift-cannib)/100)) is FORBIDDEN
          # and produces a different integer.
      elif adjustment_type == "SALES_INTELLIGENCE":
          applied_delta_units = delta_units                       # already integer
      else:  # NEW_ITEM_PLAN
          applied_delta_units = round_half_up(delta_units * item.npi_ramp_pct / 100, 0)

      # --- forecast roll-up ---
      contributing = [a for a in adjustments_of(forecast) if a.status IN {"ENDORSED", "COMMITTED"}]
      consensus_units = forecast.baseline_units + sum(a.applied_delta_units for a in contributing)
      endorsed_adjustment_count = count(contributing)
      # PINNED SUMMATION ORDER: each adjustment's applied_delta_units is ALREADY an integer
      # before it enters the sum ("round per line, then sum"). Summing unrounded percentage
      # terms across adjustments and rounding once at the end is FORBIDDEN.
      # If forecast.status == RUNOUT_TRUNCATED, consensus_units := 0 regardless of the sum.
    input_set: "ConsensusAdjustment rows whose demand_forecast_id == this forecast and whose status IN {ENDORSED, COMMITTED}; rows in PROPOSED, REVISION_REQUESTED, REJECTED and VOIDED are excluded; ordering is irrelevant because every term is an integer"
    constants:
      MAX_SWING_PCT: 25
    precision: "integer units; round_half_up applied per adjustment term, never on a cross-adjustment sum"
    variants:
      - name: promotion_term_rounding
        when: "adjustment_type == PROMOTION"
        difference: "two independent roundings (lift, cannibalization) whose difference is the delta"
      - name: flat_delta
        when: "adjustment_type == SALES_INTELLIGENCE"
        difference: "no rounding at all — the planner's integer delta is used verbatim"

  - name: calc_inventory_policy
    trigger: "POST /sop/items (with the field defaults) and POST /sop/items/{item_id}/inventory-policy (writes Item.safety_stock_units and Item.reorder_point_units)"
    algorithm: tiered_pricing
    formula: |
      # --- step 1: service-level z factor (tiered, FIRST matching band wins) ---
      if   service_level_target_pct >= 99.0: z = 2.33
      elif service_level_target_pct >= 97.5: z = 1.96
      elif service_level_target_pct >= 95.0: z = 1.65
      elif service_level_target_pct >= 90.0: z = 1.28
      else:                                  z = 0.84

      # --- step 2: safety stock, ONE ceiling at the end of the expression ---
      safety_stock_units = ceil(z * demand_cv * avg_monthly_demand_units
                                * sqrt(lead_time_days / 30))

      # --- step 3: reorder point. PINNED ORDER: the cycle-stock term is ceilinged FIRST and
      #     the ALREADY-CEILINGED safety_stock_units is then added. Ceiling the whole sum in
      #     one pass is FORBIDDEN.
      reorder_point_units = ceil(avg_monthly_demand_units * lead_time_days / 30)
                          + safety_stock_units
    input_set: "one Item row's service_level_target_pct, demand_cv, lead_time_days and avg_monthly_demand_units; no other entity participates"
    constants:
      Z_99_0: 2.33
      Z_97_5: 1.96
      Z_95_0: 1.65
      Z_90_0: 1.28
      Z_FLOOR: 0.84
      DAYS_PER_MONTH: 30
    precision: "both outputs are integers produced by ceil(); intermediate products are kept at full precision"

  - name: calc_constrained_supply
    trigger: "POST /sop/supply-plans (writes SupplyPlan.gross_requirement_units, target_build_units, available_units, material_cap_units, demand_side_units, constrained_units, shortfall_units, constraint_type, unallocated_units)"
    algorithm: constraint_propagation
    formula: |
      # --- demand side ---
      gross_requirement_units = sum(f.consensus_units
                                    for f in DemandForecast
                                    where f.cycle_id == cycle.id
                                      and f.item_id == item.id
                                      and f.status == "CONSENSUS_LOCKED")     # RUNOUT_TRUNCATED, BASELINE and UNDER_CONSENSUS excluded
      target_build_units = item.safety_stock_units                            # inventory target
      material_cap_units = item.material_supply_cap_units

      # --- capacity side: CapacityBlock rows FULLY CONTAINED in the cycle horizon window ---
      # horizon window = [first_day(cycle.horizon_start_month),
      #                   first_day(add_months(cycle.horizon_end_month, 1)))     (half-open)
      # A block qualifies iff block.start_date >= window_start AND block.end_date <= window_end.
      # Partially overlapping blocks are EXCLUDED entirely (no proration).
      eligible_hours = sum(b.available_hours for b in CapacityBlock
                           where b.family_id == item.family_id and fully_contained(b))
      available_units = floor(round(eligible_hours * family.units_per_hour, 6))

      # --- the two policy variants (cycle.supply_review_policy) ---
      if cycle.supply_review_policy == "NET_INVENTORY_FIRST":
          demand_side_units = max(0, gross_requirement_units + target_build_units
                                     - item.on_hand_units)
          constrained_units = min(demand_side_units, available_units, material_cap_units)
      else:  # GROSS_CAPACITY_FIRST
          demand_side_units = gross_requirement_units + target_build_units
          capped            = min(demand_side_units, available_units, material_cap_units)
          constrained_units = max(0, capped - item.on_hand_units)

      shortfall_units  = max(0, demand_side_units - constrained_units)
      unallocated_units = constrained_units          # nothing rationed yet

      # --- constraint identification (evaluate in this order, FIRST match wins) ---
      if   material_cap_units <= available_units and material_cap_units < demand_side_units:
          constraint_type = "MATERIAL"
      elif available_units < demand_side_units:
          constraint_type = "CAPACITY"
      elif constrained_units < gross_requirement_units:
          constraint_type = "INVENTORY_TARGET"
      else:
          constraint_type = "NONE"
    input_set: "CONSENSUS_LOCKED DemandForecast rows for (cycle_id, item_id) across all customers; CapacityBlock rows of the item's family fully contained in the cycle horizon window; the Item's on_hand_units / safety_stock_units / material_supply_cap_units snapshot at plan-creation time"
    constants:
      HOURS_ROUNDING_DP: 6
    precision: "all outputs are integers; the only rounding is floor() on available_units after rounding the hours-to-units product to 6 decimal places to defuse binary float drift"
    variants:
      - name: net_inventory_first
        when: "cycle.supply_review_policy == NET_INVENTORY_FIRST"
        difference: "on-hand inventory is netted off the requirement BEFORE the capacity/material minimum, so on-hand can never be wasted against a binding capacity ceiling; demand_side_units is the NET requirement"
      - name: gross_capacity_first
        when: "cycle.supply_review_policy == GROSS_CAPACITY_FIRST"
        difference: "the GROSS requirement is capped by capacity/material FIRST and on-hand is subtracted from the capped result, which strictly lowers constrained_units whenever a ceiling binds; demand_side_units is the GROSS requirement, which can flip constraint_type from INVENTORY_TARGET to CAPACITY on identical inputs"

  - name: calc_rationing_waterfall
    trigger: "POST /sop/supply-plans/{supply_plan_id}/ration (creates every Allocation row and rewrites SupplyPlan.unallocated_units)"
    algorithm: waterfall_allocation
    formula: |
      # --- candidate rows: one per Customer with >= 1 CONSENSUS_LOCKED forecast for this plan ---
      requested_units[c] = sum(f.consensus_units for f in DemandForecast
                               where f.cycle_id == plan.cycle_id
                                 and f.item_id  == plan.item_id
                                 and f.customer_id == c.id
                                 and f.status == "CONSENSUS_LOCKED")
      remaining = plan.constrained_units

      # --- credit hold: allocated 0, never enters any pass ---
      for c where c.credit_hold == true:
          allocated[c] = 0; allocation_status[c] = "WITHHELD_CREDIT_HOLD"; allocation_pass[c] = "NONE"

      # --- zero requests: allocated 0, EXCLUDED from pass 2's denominator ---
      for c where c.credit_hold == false and requested_units[c] == 0:
          allocated[c] = 0; allocation_status[c] = "ALLOCATED"; allocation_pass[c] = "NONE"

      # --- PASS 1 (protected): priority_rank <= PROTECTED_RANK, filled in full, in
      #     priority_rank ASC then created_at ASC order ---
      for c in sorted([c: c.credit_hold == false and requested_units[c] > 0
                          and c.priority_rank <= PROTECTED_RANK],
                      key=(priority_rank ASC, created_at ASC)):
          allocated[c] = min(requested_units[c], remaining)
          allocation_status[c] = "ALLOCATED"; allocation_pass[c] = "PROTECTED"
          remaining -= allocated[c]

      # --- PASS 2 (pro-rata largest-remainder over the leftover) ---
      pool  = [c: c.credit_hold == false and requested_units[c] > 0
                  and c.priority_rank > PROTECTED_RANK]
      total = sum(requested_units[c] for c in pool)
      if total == 0 or remaining == 0:
          # nothing is distributed and `remaining` is kept, but every pool member still
          # gets a row so the plan's customer set is complete.
          for c in pool:
              allocated[c] = 0; allocation_status[c] = "ALLOCATED"; allocation_pass[c] = "NONE"
      else:
          # PINNED: never distribute more units than the pool actually asked for. The
          # distributable amount is min(remaining, total), so no customer can ever be
          # allocated more than its own requested_units, and any surplus above the pool's
          # total request stays in unallocated_units instead of inflating fill rates.
          start = min(remaining, total)
          for c in pool:
              raw_share[c] = start * requested_units[c] / total   # exact rational, <= requested_units[c]
              allocated[c] = floor(raw_share[c])
              allocation_status[c] = "ALLOCATED"; allocation_pass[c] = "PRO_RATA"
          # largest-remainder top-up of the floor losses, ordered by fractional part DESC,
          # then priority_rank ASC, then created_at ASC. `id` is NEVER consulted.
          top_up = start - sum(allocated[c] for c in pool)
          for c in sorted(pool, key=(frac(raw_share[c]) DESC, priority_rank ASC, created_at ASC))[0:top_up]:
              allocated[c] += 1
          remaining = remaining - start

      unallocated_units = remaining
      fill_rate_pct[c] = 100.00 if requested_units[c] == 0
                         else round_half_up(allocated[c] / requested_units[c] * 100, 2)
    input_set: "Customer rows that own at least one CONSENSUS_LOCKED DemandForecast for (plan.cycle_id, plan.item_id); requested_units aggregates that customer's locked forecast lines across ALL horizon months"
    constants:
      PROTECTED_RANK: 2
    precision: "allocated_units integer via floor + largest-remainder top-up; fill_rate_pct 2 decimal places round_half_up"

  - name: calc_scenario_gap_closure
    trigger: "POST /sop/scenarios/{scenario_id}/evaluate (writes incremental_units, gross_uplift_cents, investment_cost_cents, pre_trade_closure_cents, trade_rate_pct, trade_spend_cents, net_gap_closure_cents)"
    algorithm: tiered_pricing
    formula: |
      # The trade rate is a tier over the gap closure, and the gap closure is net of trade
      # spend — a circular-looking dependency. It is resolved by PINNING these seven steps
      # in order and forbidding any iteration or fixed-point search.

      # step 1 - incremental_units
      if scenario_type == "CAPACITY_INVESTMENT":
          plan = the SupplyPlan with cycle_id == scenario.cycle_id
                 and item_id == scenario.target_item_id and status IN {PLANNED, RATIONED}
          capacity_units   = floor(round(added_capacity_hours * family.units_per_hour, 6))
          incremental_units = min(capacity_units, plan.shortfall_units)
      else:  # PRICE_REALIZATION
          incremental_units = 0

      # step 2 - gross_uplift_cents
      if scenario_type == "CAPACITY_INVESTMENT":
          gross_uplift_cents = incremental_units * item.unit_price_cents
      else:
          gross_uplift_cents = round_half_up(cycle.plan_value_cents * price_increase_pct / 100, 0)

      # step 3 - investment_cost_cents
      if scenario_type == "CAPACITY_INVESTMENT":
          investment_cost_cents = round_half_up(added_capacity_hours * CAPACITY_HOURLY_COST_CENTS, 0)
      else:
          investment_cost_cents = 0

      # step 4 - pre_trade_closure_cents
      pre_trade_closure_cents = gross_uplift_cents - investment_cost_cents

      # step 5 - trade_rate_pct: the tier is selected from pre_trade_closure_cents ONLY.
      #          Selecting it from gross_uplift_cents or from net_gap_closure_cents is FORBIDDEN.
      if   pre_trade_closure_cents >= TRADE_TIER_2_CENTS: trade_rate_pct = 8.0
      elif pre_trade_closure_cents >= TRADE_TIER_1_CENTS: trade_rate_pct = 6.0
      else:                                              trade_rate_pct = 4.0

      # step 6 - trade_spend_cents is a percentage of GROSS uplift, not of the pre-trade closure
      trade_spend_cents = round_half_up(gross_uplift_cents * trade_rate_pct / 100, 0)

      # step 7 - net
      net_gap_closure_cents = pre_trade_closure_cents - trade_spend_cents
    input_set: "the Scenario's own inputs, the target item's unit_price_cents and family.units_per_hour, the matching SupplyPlan's shortfall_units, and cycle.plan_value_cents as it stands at evaluate time"
    constants:
      CAPACITY_HOURLY_COST_CENTS: 25000
      TRADE_TIER_1_CENTS: 1000000
      TRADE_TIER_2_CENTS: 5000000
    precision: "cents integers; round_half_up at steps 2, 3 and 6 only"
    variants:
      - name: capacity_investment
        when: "scenario_type == CAPACITY_INVESTMENT"
        difference: "volume-driven: units are unlocked and priced, and hours cost money"
      - name: price_realization
        when: "scenario_type == PRICE_REALIZATION"
        difference: "price-driven: zero incremental units and zero investment cost, so pre_trade_closure_cents == gross_uplift_cents"

  - name: calc_cycle_financials
    trigger: "every PlanningCycle transition, POST /sop/supply-plans, SupplyPlan PLANNED_to_STALE / RATIONED_to_STALE, Scenario EVALUATED_to_SELECTED and SELECTED_to_SUPERSEDED (writes plan_value_cents, gross_gap_cents, selected_closure_cents, residual_gap_cents, constrained_plan_count)"
    algorithm: aggregation
    formula: |
      plan_value_cents = sum(p.constrained_units * item_of(p).unit_price_cents
                             for p in SupplyPlan
                             where p.cycle_id == cycle.id
                               and p.status IN {"PLANNED", "RATIONED", "COMMITTED"})   # STALE excluded
      gross_gap_cents       = cycle.financial_commitment_cents - plan_value_cents
      selected_closure_cents = sum(s.net_gap_closure_cents for s in Scenario
                                   where s.cycle_id == cycle.id
                                     and s.status IN {"SELECTED", "EXECUTED"})          # SUPERSEDED excluded
      residual_gap_cents    = gross_gap_cents - selected_closure_cents
      constrained_plan_count = count(p in SupplyPlan where p.cycle_id == cycle.id
                                     and p.status IN {"PLANNED", "RATIONED"}
                                     and p.constraint_type != "NONE")
    input_set: "SupplyPlan rows of this cycle in status {PLANNED, RATIONED, COMMITTED} (STALE excluded); Scenario rows of this cycle in status {SELECTED, EXECUTED} (DRAFT, EVALUATED and SUPERSEDED excluded)"
    constants: {}
    precision: "integer cents; no rounding (all terms are already integers)"

  - name: calc_cycle_posture
    trigger: "immediately after every calc_cycle_financials run (writes PlanningCycle.posture)"
    algorithm: threshold
    formula: |
      # evaluate in this order, FIRST match wins
      if cycle.status == "PUBLISHED":                                   posture = "FROZEN"
      elif cycle.residual_gap_cents > 0 or cycle.constrained_plan_count >= 1:
                                                                       posture = "AT_RISK"
      else:                                                            posture = "GREEN"
    input_set: "the cycle's own status, residual_gap_cents and constrained_plan_count, all written by calc_cycle_financials in the same request"
    constants:
      AT_RISK_CONSTRAINED_PLAN_MIN: 1
    precision: "enum, no arithmetic"

  - name: calc_accuracy_record
    trigger: "POST /sop/accuracy-records (writes forecast_units_snapshot, abs_error_units, signed_error_units, ape_pct, accountable_planner_user_id)"
    algorithm: aggregation
    formula: |
      snapshot = sum(f.consensus_units for f in DemandForecast
                     where f.cycle_id == cycle.id and f.item_id == item.id
                       and f.customer_id == customer.id
                       and f.status == "CONSENSUS_LOCKED")
      forecast_units_snapshot = snapshot
      signed_error_units      = snapshot - actual_units          # positive == over-forecast
      abs_error_units         = abs(signed_error_units)
      ape_pct                 = null if actual_units == 0
                                else round_half_up(abs_error_units / actual_units * 100, 2)
      accountable_planner_user_id = family_of(item).accountable_planner_user_id
    input_set: "CONSENSUS_LOCKED DemandForecast rows for the exact (cycle_id, item_id, customer_id) triple, summed across horizon months"
    constants: {}
    precision: "ape_pct 2 decimal places round_half_up; null when actual_units == 0"

  - name: calc_accuracy_rollup
    trigger: "POST /sop/accuracy-records (writes ProductFamily.rolling_wmape_pct, rolling_bias_pct, bias_flag, accuracy_grade, scored_record_count) and GET /sop/planning-cycles/{cycle_id}/accuracy-summary (computes the same metrics over the cycle-scoped record set)"
    algorithm: weighted_scoring
    formula: |
      # R = the record set (see input_set for the two scopes)
      record_count = count(R)
      if record_count == 0: mape_pct = null; wmape_pct = null; bias_pct = null;
                            bias_flag = "NONE"; accuracy_grade = "UNGRADED"; worst_item_id = null
      else:
        # --- VARIANT A: unweighted MAPE. Per-record ape_pct is ALREADY rounded to 2dp by
        #     calc_accuracy_record; the mean of those rounded values is then rounded to 2dp.
        #     Records with actual_units == 0 (ape_pct null) are EXCLUDED from this mean.
        scored = [r in R where r.ape_pct != null]
        mape_pct = null if count(scored) == 0
                   else round_half_up(sum(r.ape_pct for r in scored) / count(scored), 2)

        # --- VARIANT B: volume-weighted WMAPE over the FULL record set, ratio of raw sums.
        total_actual = sum(r.actual_units for r in R)
        wmape_pct = null if total_actual == 0
                    else round_half_up(sum(r.abs_error_units for r in R) / total_actual * 100, 2)

        # --- bias detection on the ROUNDED signed ratio ---
        bias_pct = null if total_actual == 0
                   else round_half_up(sum(r.signed_error_units for r in R) / total_actual * 100, 2)
        if   bias_pct != null and bias_pct >=  BIAS_THRESHOLD_PCT: bias_flag = "OVER_FORECAST"
        elif bias_pct != null and bias_pct <= -BIAS_THRESHOLD_PCT: bias_flag = "UNDER_FORECAST"
        else:                                                      bias_flag = "NONE"

        # --- accountability grade from WMAPE (variant B), tiered, FIRST match wins ---
        if   wmape_pct == null:      accuracy_grade = "UNGRADED"
        elif wmape_pct <= 10.00:     accuracy_grade = "A"
        elif wmape_pct <= 20.00:     accuracy_grade = "B"
        elif wmape_pct <= 35.00:     accuracy_grade = "C"
        else:                        accuracy_grade = "D"

        # --- worst offender: highest per-item WMAPE; ties broken by the earliest
        #     AccuracyRecord.created_at among the tied items. `id` is NEVER consulted.
        worst_item_id = argmax over item_id of
                        (sum(abs_error) / sum(actual) for that item, items with
                         sum(actual) == 0 ranked last), tie-break earliest created_at
    input_set: "ProductFamily fields roll up EVERY AccuracyRecord whose item's family_id == this family, across ALL cycles. GET /sop/planning-cycles/{cycle_id}/accuracy-summary rolls up only AccuracyRecord rows whose cycle_id == the path cycle, further filtered to one family when family_id is supplied. The two scopes coincide only when the family has been scored in exactly one cycle."
    constants:
      BIAS_THRESHOLD_PCT: 5.00
      GRADE_A_MAX_WMAPE: 10.00
      GRADE_B_MAX_WMAPE: 20.00
      GRADE_C_MAX_WMAPE: 35.00
    precision: "all three percentages 2 decimal places round_half_up; MAPE averages ALREADY-rounded per-record ape_pct values (round-then-average), WMAPE divides raw unrounded sums (aggregate-then-round)"
    variants:
      - name: unweighted_mape
        when: "reported as mape_pct; the historical planner-facing metric"
        difference: "every forecast line counts equally, so small-volume lines dominate; excludes zero-actual records; rounds per record then averages"
      - name: volume_weighted_wmape
        when: "reported as wmape_pct and is the ONLY input to accuracy_grade"
        difference: "weights each line by its actual volume, so large-volume lines dominate; includes zero-actual records in the numerator; produces a materially different percentage from unweighted_mape on identical records"

  - name: inv_allocation_units_conserved
    trigger: "asserted after POST /sop/supply-plans, POST /sop/supply-plans/{supply_plan_id}/ration, and every SupplyPlan PLANNED_to_STALE / RATIONED_to_STALE compensation"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY: units of constrained supply on a single SupplyPlan.
      sum(a.allocated_units for a in Allocation where a.supply_plan_id == plan.id)
        + plan.unallocated_units
        == plan.constrained_units
      # Holds in all three states: before rationing (0 + constrained == constrained), after
      # rationing (allocated + leftover == constrained), and after the VOIDED compensation
      # (0 + constrained == constrained). VOIDED rows carry allocated_units == 0, so the
      # forward action and its compensation leave zero drift.
    input_set: "every Allocation row of the plan regardless of allocation_status (ALLOCATED, WITHHELD_CREDIT_HOLD and VOIDED all participate, the latter two contributing 0)"
    constants: {}
    precision: "exact integer identity; no tolerance"

  - name: inv_gap_closure_cents_conserved
    trigger: "asserted after Scenario EVALUATED_to_SELECTED, SELECTED_to_SUPERSEDED and SELECTED_to_EXECUTED"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY: committed gap-closing money on a single PlanningCycle.
      cycle.residual_gap_cents
        == cycle.financial_commitment_cents
           - cycle.plan_value_cents
           - sum(s.net_gap_closure_cents for s in Scenario
                 where s.cycle_id == cycle.id and s.status IN {"SELECTED", "EXECUTED"})
      # Selecting scenario S2 of the same scenario_type supersedes S1: S1's contribution is
      # subtracted out in the same request that adds S2's, so residual_gap_cents returns to
      # exactly (gross_gap_cents - S2.net_gap_closure_cents) with zero drift from S1.
    input_set: "Scenario rows of this cycle in status {SELECTED, EXECUTED}; SUPERSEDED rows contribute nothing even though their net_gap_closure_cents field retains its evaluated value"
    constants: {}
    precision: "exact integer cents identity; no tolerance"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered; lower priority number is checked first)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    rule: "The request carries an X-User-Role header naming a role that exists in §1.7, and an X-User-ID header. Both must be present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 20
    rule: "The role named by X-User-Role is permitted to invoke this endpoint per §1.5 roles / §1.7."
    error_id: ERR_UNAUTHORIZED
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 30
    rule: "The request body parses, every required field is present, every field has the declared type, every enum value is a member of the declared enum, and every declared numeric range holds (unit_price_cents > 0, unit_cost_cents > 0, on_hand_units >= 0, material_supply_cap_units >= 0, avg_monthly_demand_units >= 0, npi_ramp_pct in [0, 200], priority_rank >= 1, lift_pct in (0, 300], cannibalization_pct in [0, 100], service_level_target_pct in (0, 100], demand_cv in [0, 3], lead_time_days >= 1, seasonal_index in (0, 5], causal_uplift_pct in [-100, 500], level_units >= 0, financial_commitment_cents >= 0, units_per_hour > 0, max_monthly_hours > 0, available_hours > 0, added_capacity_hours > 0 when present, price_increase_pct in (0, 100] when present, actual_units >= 0, month strings match YYYY-MM, date strings match YYYY-MM-DD, horizon_end_month >= horizon_start_month, end_month >= start_month, end_date > start_date). Unknown fields are ignored. Conditionally required fields are also checked here: promotion_id is required for adjustment_type PROMOTION and must be absent or null for SALES_INTELLIGENCE and NEW_ITEM_PLAN (delta_units is required for every adjustment_type but is IGNORED for PROMOTION); target_item_id and added_capacity_hours are required for scenario_type CAPACITY_INVESTMENT and must be absent or null for PRICE_REALIZATION, while price_increase_pct is required for PRICE_REALIZATION and must be absent or null for CAPACITY_INVESTMENT; runout_end_month is required for target_state RUNOUT and must be absent otherwise; reopen_reason is required for target_status DEMAND_REVIEW on a cycle transition."
    error_id: ERR_INVALID_REQUEST
    category: request_shape
    applies_to: "every endpoint that accepts a body or path/query parameters"

  - priority: 40
    rule: "Every id appearing in the URL path resolves to an existing row of the expected entity type."
    error_id: "the matching *_NOT_FOUND error for the path segment's entity (ERR_ITEM_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_FORECAST_NOT_FOUND, ERR_ADJUSTMENT_NOT_FOUND, ERR_PROMOTION_NOT_FOUND, ERR_SUPPLY_PLAN_NOT_FOUND, ERR_SCENARIO_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_FAMILY_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_CAPACITY_BLOCK_NOT_FOUND, ERR_ACCURACY_RECORD_NOT_FOUND)"
    category: existence
    applies_to: "every endpoint with a path parameter"

  - priority: 50
    rule: "Every foreign-key id supplied in the request BODY resolves to an existing row of the expected entity type (family_id, item_id, customer_id, cycle_id, demand_forecast_id, promotion_id, successor_item_id, target_item_id)."
    error_id: "the matching *_NOT_FOUND error for the referenced entity"
    category: existence
    applies_to: "POST /sop/items, POST /sop/items/{item_id}/lifecycle-transitions, POST /sop/capacity-blocks, POST /sop/promotions, POST /sop/demand-forecasts, POST /sop/consensus-adjustments, POST /sop/supply-plans, POST /sop/scenarios, POST /sop/accuracy-records"

  - priority: 60
    rule: "The acting role matches the phase of the governing PlanningCycle: consensus adjustments may only be created, resubmitted or reviewed while the cycle status is DEMAND_REVIEW; supply plans may only be created or rationed while the cycle status is SUPPLY_REVIEW; scenarios may only be created or evaluated while the cycle status is SCENARIO_REVIEW; scenario selection may only occur while the cycle status is EXECUTIVE_REVIEW; accuracy records may only be created while the cycle status is PUBLISHED."
    error_id: ERR_UNAUTHORIZED_PHASE_ACTOR
    category: auth
    applies_to: "POST /sop/consensus-adjustments, POST /sop/consensus-adjustments/{adjustment_id}/reviews, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/supply-plans, POST /sop/supply-plans/{supply_plan_id}/ration, POST /sop/scenarios, POST /sop/scenarios/{scenario_id}/evaluate, POST /sop/scenarios/{scenario_id}/select, POST /sop/accuracy-records"

  - priority: 70
    rule: "A caller whose X-User-Role is CustomerRep may only read rows scoped to its own Customer: GET /sop/demand-forecasts, GET /sop/allocations and GET /sop/accuracy-records must be called with customer_id equal to the caller's own customer, and a single-resource GET must target a row whose customer_id is the caller's own."
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    category: auth
    applies_to: "GET /sop/demand-forecasts, GET /sop/demand-forecasts/{forecast_id}, GET /sop/allocations, GET /sop/allocations/{allocation_id}, GET /sop/accuracy-records, GET /sop/accuracy-records/{record_id}"

  - priority: 80
    rule: "Segregation of duties on X-User-ID: the user who proposed a ConsensusAdjustment (proposed_by_user_id) may not review it, and the user who created a Scenario (created_by_user_id) may not select it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: auth
    applies_to: "POST /sop/consensus-adjustments/{adjustment_id}/reviews, POST /sop/scenarios/{scenario_id}/select"

  - priority: 90
    rule: "The supplied expected_<parent>_version equals the current version of the parent row named by the §1.2.1 concurrency rule."
    error_id: "the concurrency rule's error_id (ERR_STALE_FORECAST_VERSION, ERR_STALE_CYCLE_VERSION)"
    category: concurrency
    applies_to: "POST /sop/consensus-adjustments, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/scenarios/{scenario_id}/select"

  - priority: 100
    rule: "The governing PlanningCycle's posture is not FROZEN. A FROZEN cycle accepts no writes to any of its forecasts, adjustments, supply plans, allocations or scenarios."
    error_id: ERR_CYCLE_FROZEN
    category: state
    applies_to: "POST /sop/demand-forecasts, POST /sop/demand-forecasts/{forecast_id}/transitions, POST /sop/consensus-adjustments, POST /sop/consensus-adjustments/{adjustment_id}/reviews, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/supply-plans, POST /sop/supply-plans/{supply_plan_id}/ration, POST /sop/scenarios, POST /sop/scenarios/{scenario_id}/evaluate, POST /sop/scenarios/{scenario_id}/select"

  - priority: 110
    rule: "The governing PlanningCycle is in a status whose phase still admits this class of write (DEMAND_REVIEW admits forecast and adjustment writes; SUPPLY_REVIEW admits supply-plan writes; SCENARIO_REVIEW admits scenario create/evaluate; EXECUTIVE_REVIEW admits scenario select and cycle publish). Once the cycle has advanced past a phase, that phase's writes are closed."
    error_id: ERR_CYCLE_PHASE_CLOSED
    category: state
    applies_to: "POST /sop/demand-forecasts, POST /sop/demand-forecasts/{forecast_id}/transitions, POST /sop/consensus-adjustments, POST /sop/consensus-adjustments/{adjustment_id}/reviews, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/supply-plans, POST /sop/supply-plans/{supply_plan_id}/ration, POST /sop/scenarios, POST /sop/scenarios/{scenario_id}/evaluate, POST /sop/scenarios/{scenario_id}/select"

  - priority: 120
    rule: "The requested transition is declared for the subject row's current state in §1.2: PlanningCycle target_status must be reachable from its current status; a DemandForecast target_status must be reachable from its current status; a ConsensusAdjustment must be in PROPOSED to be reviewed and in REVISION_REQUESTED to be resubmitted; an Item's target_state must be reachable from its lifecycle_state; a SupplyPlan must be in PLANNED to be rationed; a Scenario must be in DRAFT to be evaluated and in EVALUATED to be selected; a Promotion must be in DRAFT to be approved."
    error_id: "ERR_CYCLE_TRANSITION_INVALID, ERR_FORECAST_TRANSITION_INVALID, ERR_ADJUSTMENT_NOT_REVIEWABLE, ERR_ADJUSTMENT_NOT_RESUBMITTABLE, ERR_ITEM_LIFECYCLE_TRANSITION_INVALID, ERR_SUPPLY_PLAN_NOT_RATIONABLE, ERR_SCENARIO_NOT_EVALUATABLE, ERR_SCENARIO_NOT_SELECTABLE, ERR_PROMOTION_NOT_APPROVABLE (whichever matches the subject)"
    category: state
    applies_to: "POST /sop/planning-cycles/{cycle_id}/transitions, POST /sop/demand-forecasts/{forecast_id}/transitions, POST /sop/consensus-adjustments/{adjustment_id}/reviews, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/items/{item_id}/lifecycle-transitions, POST /sop/supply-plans/{supply_plan_id}/ration, POST /sop/scenarios/{scenario_id}/evaluate, POST /sop/scenarios/{scenario_id}/select, POST /sop/promotions/{promotion_id}/approve"

  - priority: 130
    rule: "Cross-entity referential eligibility of the operands, checked BEFORE any temporal or capacity arithmetic. (a) A Promotion may only be approved when its item's lifecycle_state is RAMP or MATURE -> ERR_ITEM_NOT_PROMOTABLE. (b) A PROMOTION-type ConsensusAdjustment's promotion_id must be APPROVED and must reference the same item as the target forecast -> ERR_PROMOTION_NOT_APPROVED. (c) A NEW_ITEM_PLAN adjustment is only permitted when the forecast's item is PRELAUNCH or RAMP, and a SALES_INTELLIGENCE adjustment is forbidden on a PRELAUNCH item -> ERR_ADJUSTMENT_TYPE_NOT_PERMITTED. (d) An Item MATURE_to_RUNOUT transition's successor_item_id, when supplied, must reference a different Item in the same ProductFamily whose lifecycle_state is PRELAUNCH or RAMP -> ERR_SUCCESSOR_NOT_ELIGIBLE. (e) A SupplyPlan may only be created when at least one DemandForecast exists for (cycle_id, item_id) and EVERY such forecast is CONSENSUS_LOCKED or RUNOUT_TRUNCATED -> ERR_FORECAST_NOT_LOCKED. (f) A DemandForecast may only leave UNDER_CONSENSUS for CONSENSUS_LOCKED when it has no adjustment in PROPOSED or REVISION_REQUESTED -> ERR_OPEN_ADJUSTMENTS. (g) A Scenario may only be selected when its net_gap_closure_cents has been evaluated and its target SupplyPlan is not STALE -> ERR_STALE_SUPPLY_PLAN. (h) A PlanningCycle may only advance SCENARIO_REVIEW -> EXECUTIVE_REVIEW when no Scenario of that cycle is still in DRAFT -> ERR_UNEVALUATED_SCENARIO."
    error_id: "ERR_ITEM_NOT_PROMOTABLE, ERR_PROMOTION_NOT_APPROVED, ERR_ADJUSTMENT_TYPE_NOT_PERMITTED, ERR_SUCCESSOR_NOT_ELIGIBLE, ERR_FORECAST_NOT_LOCKED, ERR_OPEN_ADJUSTMENTS, ERR_STALE_SUPPLY_PLAN, ERR_UNEVALUATED_SCENARIO"
    category: business_referential
    applies_to: "POST /sop/promotions/{promotion_id}/approve, POST /sop/consensus-adjustments, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/items/{item_id}/lifecycle-transitions, POST /sop/supply-plans, POST /sop/demand-forecasts/{forecast_id}/transitions, POST /sop/planning-cycles/{cycle_id}/transitions, POST /sop/scenarios/{scenario_id}/select"

  - priority: 140
    rule: "Interval and calendar checks. (a) An APPROVED Promotion's month window [start_month, end_month] (CLOSED INCLUSIVE) must not overlap another APPROVED Promotion for the same (item_id, customer_id); back-to-back windows that merely touch at adjacent months do NOT overlap -> ERR_PROMOTION_WINDOW_OVERLAP. (b) A CapacityBlock's date window [start_date, end_date) (HALF-OPEN) must not come within CHANGEOVER_BUFFER_DAYS = 2 days of another CapacityBlock of the same family_id: the block is rejected unless new.start_date >= existing.end_date + 2 days or existing.start_date >= new.end_date + 2 days, so exactly adjacent blocks ARE rejected -> ERR_CAPACITY_BLOCK_OVERLAP. (c) A Promotion may only be approved while its start_month is strictly after the current logical month -> ERR_PROMOTION_HORIZON_FROZEN. (d) A DemandForecast's month and an AccuracyRecord's implied months must lie within [cycle.horizon_start_month, cycle.horizon_end_month] -> ERR_MONTH_OUTSIDE_HORIZON."
    error_id: "ERR_PROMOTION_WINDOW_OVERLAP, ERR_CAPACITY_BLOCK_OVERLAP, ERR_PROMOTION_HORIZON_FROZEN, ERR_MONTH_OUTSIDE_HORIZON"
    category: business_temporal
    applies_to: "POST /sop/promotions/{promotion_id}/approve, POST /sop/capacity-blocks, POST /sop/demand-forecasts"

  - priority: 150
    rule: "Aggregate capacity and uniqueness constraints. (a) The sum of available_hours of all CapacityBlock rows of one family whose start_date falls in the same calendar month, including the incoming block, must not exceed family.max_monthly_hours -> ERR_FAMILY_MONTHLY_HOURS_EXCEEDED. (b) At most one DemandForecast may exist per (cycle_id, item_id, customer_id, month) -> ERR_DUPLICATE_FORECAST. (c) At most one SupplyPlan may exist per (cycle_id, item_id) in a non-STALE status -> ERR_SUPPLY_PLAN_EXISTS. (d) At most one AccuracyRecord may exist per (cycle_id, item_id, customer_id) -> ERR_DUPLICATE_ACCURACY_RECORD. (e) family_code, sku, customer_code and cycle_code are globally unique -> ERR_INVALID_REQUEST."
    error_id: "ERR_FAMILY_MONTHLY_HOURS_EXCEEDED, ERR_DUPLICATE_FORECAST, ERR_SUPPLY_PLAN_EXISTS, ERR_DUPLICATE_ACCURACY_RECORD, ERR_INVALID_REQUEST"
    category: business_constraint
    applies_to: "POST /sop/capacity-blocks, POST /sop/demand-forecasts, POST /sop/supply-plans, POST /sop/accuracy-records, POST /sop/product-families, POST /sop/items, POST /sop/customers, POST /sop/planning-cycles"

  - priority: 160
    rule: "Rate and volume safety limits. (a) A PlanningCycle may not be reopened from EXECUTIVE_REVIEW more than MAX_REOPENS = 2 times (reopen_count) -> ERR_REOPEN_LIMIT_REACHED. (b) A ConsensusAdjustment may not be resubmitted more than MAX_REVISION_ROUNDS = 3 times (revision_round) -> ERR_REVISION_LIMIT_REACHED. (c) An Item may not transition RUNOUT -> DISCONTINUED while its on_hand_units exceed RUNOUT_TOLERANCE_UNITS = 0 -> ERR_RUNOUT_INVENTORY_REMAINS."
    error_id: "ERR_REOPEN_LIMIT_REACHED, ERR_REVISION_LIMIT_REACHED, ERR_RUNOUT_INVENTORY_REMAINS"
    category: business_safety
    applies_to: "POST /sop/planning-cycles/{cycle_id}/transitions, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/items/{item_id}/lifecycle-transitions"

  - priority: 170
    rule: "Financial guardrails, evaluated LAST because they depend on the arithmetic of §1.3. (a) A single ConsensusAdjustment's |applied_delta_units| may not exceed MAX_SWING_PCT = 25 percent of the target forecast's baseline_units, computed as round_half_up(baseline_units * 25 / 100, 0) -> ERR_ADJUSTMENT_SWING_EXCEEDED. (b) A PlanningCycle may not advance EXECUTIVE_REVIEW -> PUBLISHED while residual_gap_cents > 0 -> ERR_UNCLOSED_GAP."
    error_id: "ERR_ADJUSTMENT_SWING_EXCEEDED, ERR_UNCLOSED_GAP"
    category: business_fiscal
    applies_to: "POST /sop/consensus-adjustments, POST /sop/consensus-adjustments/{adjustment_id}/resubmit, POST /sop/planning-cycles/{cycle_id}/transitions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- reference data: product families -----------------------------------
  - method: POST
    path: "/sop/product-families"
    description: "Register a product family with its accountable planner, hourly throughput and monthly hour ceiling."
    roles: [SopAdmin]
    code: 201
    input: [family_code, name, accountable_planner_user_id, units_per_hour, max_monthly_hours]
    output: ProductFamily
    side_effects: ["initializes rolling_wmape_pct=null, rolling_bias_pct=null, bias_flag=NONE, accuracy_grade=UNGRADED, scored_record_count=0"]

  - method: GET
    path: "/sop/product-families/{family_id}"
    description: "Read one product family including its rolling accuracy and bias state."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: ProductFamily
    side_effects: []

  - method: GET
    path: "/sop/product-families"
    description: "List product families, optionally filtered by accountable planner or accuracy grade."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["accountable_planner_user_id?", "accuracy_grade?", "limit?", "offset?"]
    output: ProductFamily[]
    side_effects: []

  # ---- reference data: items ----------------------------------------------
  - method: POST
    path: "/sop/items"
    description: "Create an item inside a product family with its cost, price, inventory position, supply cap and initial inventory-policy parameters."
    roles: [SopAdmin]
    code: 201
    input: [sku, family_id, unit_price_cents, unit_cost_cents, on_hand_units, material_supply_cap_units, avg_monthly_demand_units, "npi_ramp_pct?", "service_level_target_pct?", "demand_cv?", "lead_time_days?", "lifecycle_state?"]
    output: Item
    side_effects: ["runs calc_inventory_policy to set safety_stock_units and reorder_point_units", "defaults lifecycle_state to MATURE when omitted", "defaults npi_ramp_pct=100, service_level_target_pct=95.0, demand_cv=0.30, lead_time_days=30"]

  - method: GET
    path: "/sop/items/{item_id}"
    description: "Read one item including lifecycle state, successor pointer and derived inventory policy."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: GET
    path: "/sop/items"
    description: "List items, filterable by family, by successor pointer (to find the predecessors that run out into a given item) and by lifecycle state."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["family_id?", "successor_item_id?", "lifecycle_state?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  - method: POST
    path: "/sop/items/{item_id}/inventory-policy"
    description: "Reset an item's service level, demand variability and lead time, re-deriving its safety stock and reorder point."
    roles: [SopAdmin, SupplyPlanner]
    code: 200
    input: [service_level_target_pct, demand_cv, lead_time_days]
    output: Item
    side_effects: ["re-runs calc_inventory_policy", "marks every non-STALE SupplyPlan of this item STALE, which voids that plan's allocations and re-runs calc_cycle_financials and calc_cycle_posture on the owning cycle"]

  - method: POST
    path: "/sop/items/{item_id}/lifecycle-transitions"
    description: "Drive the item lifecycle: PRELAUNCH to RAMP or CANCELLED_NPI, RAMP to MATURE, MATURE to RUNOUT (with successor and runout end month), RUNOUT to DISCONTINUED."
    roles: [SopAdmin, DemandPlanner]
    code: 200
    input: [target_state, "successor_item_id?", "runout_end_month?"]
    output: Item
    side_effects: ["MATURE_to_RUNOUT truncates every CONSENSUS_LOCKED or UNDER_CONSENSUS DemandForecast after runout_end_month to RUNOUT_TRUNCATED with consensus_units=0, cancels the APPROVED Promotions covering those months, voids the ConsensusAdjustments attached to the truncated forecasts and re-runs calc_consensus_units", "PRELAUNCH_to_CANCELLED_NPI voids every NEW_ITEM_PLAN adjustment on the item's forecasts and re-runs calc_consensus_units", "any transition marks the item's non-STALE SupplyPlans STALE and re-runs calc_cycle_financials and calc_cycle_posture"]

  # ---- reference data: customers -----------------------------------------
  - method: POST
    path: "/sop/customers"
    description: "Register a customer with its channel, allocation priority rank and credit-hold flag."
    roles: [SopAdmin]
    code: 201
    input: [customer_code, name, channel, priority_rank, "credit_hold?"]
    output: Customer
    side_effects: ["defaults credit_hold to false"]

  - method: GET
    path: "/sop/customers/{customer_id}"
    description: "Read one customer."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor, CustomerRep]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/sop/customers"
    description: "List customers, filterable by channel and credit-hold flag."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["channel?", "credit_hold?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ---- capacity ----------------------------------------------------------
  - method: POST
    path: "/sop/capacity-blocks"
    description: "Declare a half-open [start_date, end_date) block of available production hours for a product family."
    roles: [SopAdmin, SupplyPlanner]
    code: 201
    input: [family_id, start_date, end_date, available_hours]
    output: CapacityBlock
    side_effects: ["rejects blocks within CHANGEOVER_BUFFER_DAYS of an existing block of the same family", "rejects when the family's per-calendar-month hour total would exceed max_monthly_hours"]

  - method: GET
    path: "/sop/capacity-blocks/{block_id}"
    description: "Read one capacity block."
    roles: [SopAdmin, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: CapacityBlock
    side_effects: []

  - method: GET
    path: "/sop/capacity-blocks"
    description: "List capacity blocks for a family."
    roles: [SopAdmin, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: CapacityBlock[]
    side_effects: []

  # ---- promotions --------------------------------------------------------
  - method: POST
    path: "/sop/promotions"
    description: "Draft a trade promotion for one item and customer over a closed-inclusive month window, with lift and cannibalization percentages."
    roles: [SopAdmin, DemandPlanner]
    code: 201
    input: [item_id, customer_id, start_month, end_month, lift_pct, cannibalization_pct]
    output: Promotion
    side_effects: ["created in DRAFT; DRAFT promotions are invisible to calc_consensus_units"]

  - method: POST
    path: "/sop/promotions/{promotion_id}/approve"
    description: "Approve a DRAFT promotion so consensus adjustments may cite it. Enforces item promotability, the closed-inclusive window overlap rule and the frozen-horizon rule."
    roles: [DemandReviewLead]
    code: 200
    input: []
    output: Promotion
    side_effects: ["status DRAFT to APPROVED"]

  - method: GET
    path: "/sop/promotions/{promotion_id}"
    description: "Read one promotion."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: GET
    path: "/sop/promotions"
    description: "List promotions, filterable by item, customer and status."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["item_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []

  # ---- planning cycle ----------------------------------------------------
  - method: POST
    path: "/sop/planning-cycles"
    description: "Open a monthly S&OP cycle over a month horizon, carrying the financial commitment it must reconcile against and the supply-review netting policy it will use."
    roles: [SopAdmin]
    code: 201
    input: [cycle_code, horizon_start_month, horizon_end_month, financial_commitment_cents, supply_review_policy]
    output: PlanningCycle
    side_effects: ["created in DEMAND_REVIEW with reopen_count=0, plan_value_cents=0, constrained_plan_count=0", "runs calc_cycle_financials then calc_cycle_posture, so gross_gap_cents == financial_commitment_cents and posture is AT_RISK whenever the commitment is positive"]

  - method: POST
    path: "/sop/planning-cycles/{cycle_id}/transitions"
    description: "Advance the cycle through DEMAND_REVIEW, SUPPLY_REVIEW, SCENARIO_REVIEW, EXECUTIVE_REVIEW and PUBLISHED, or reopen it from EXECUTIVE_REVIEW back to DEMAND_REVIEW."
    roles: [SopAdmin, ExecutiveSponsor]
    code: 200
    input: [target_status, "reopen_reason?"]
    output: PlanningCycle
    side_effects: ["SCENARIO_REVIEW_to_EXECUTIVE_REVIEW rejects while any Scenario of the cycle is DRAFT", "EXECUTIVE_REVIEW_to_PUBLISHED rejects while residual_gap_cents > 0, then sets published_at, promotes SELECTED scenarios to EXECUTED, marks the cycle's SupplyPlans COMMITTED and sets posture FROZEN", "EXECUTIVE_REVIEW_to_DEMAND_REVIEW increments reopen_count, unlocks every CONSENSUS_LOCKED forecast back to UNDER_CONSENSUS, marks every PLANNED or RATIONED SupplyPlan STALE (voiding their allocations) and supersedes every SELECTED Scenario", "re-runs calc_cycle_financials and calc_cycle_posture", "increments PlanningCycle.version by 1"]

  - method: GET
    path: "/sop/planning-cycles/{cycle_id}"
    description: "Read one planning cycle including its money reconciliation fields, posture and version."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: PlanningCycle
    side_effects: []

  - method: GET
    path: "/sop/planning-cycles"
    description: "List planning cycles, filterable by status and posture."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["status?", "posture?", "limit?", "offset?"]
    output: PlanningCycle[]
    side_effects: []

  - method: GET
    path: "/sop/planning-cycles/{cycle_id}/accuracy-summary"
    description: "Computed read: forecast accuracy for the cycle's AccuracyRecord rows, reporting BOTH the unweighted MAPE and the volume-weighted WMAPE variants of calc_accuracy_rollup, plus bias detection and the worst-offending item. Optionally narrowed to one product family."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, ExecutiveSponsor]
    code: 200
    input: ["family_id?"]
    output: { record_count: integer, mape_pct: "decimal|null", wmape_pct: "decimal|null", bias_pct: "decimal|null", bias_flag: string, accuracy_grade: string, total_actual_units: integer, total_abs_error_units: integer, worst_item_id: "uuid|null" }
    side_effects: []

  # ---- demand forecasts --------------------------------------------------
  - method: POST
    path: "/sop/demand-forecasts"
    description: "Create one statistical baseline forecast line for a (cycle, item, customer, month) and run calc_statistical_baseline to pick the method and compute baseline_units."
    roles: [SopAdmin, DemandPlanner]
    code: 201
    input: [cycle_id, item_id, customer_id, month, level_units, trend_units_per_month, seasonal_index, causal_uplift_pct]
    output: DemandForecast
    side_effects: ["runs calc_statistical_baseline to set method, baseline_units and consensus_units", "created in BASELINE with endorsed_adjustment_count=0"]

  - method: POST
    path: "/sop/demand-forecasts/{forecast_id}/transitions"
    description: "Move a forecast line through the consensus workflow: BASELINE to UNDER_CONSENSUS, UNDER_CONSENSUS to CONSENSUS_LOCKED (only with no open adjustments), CONSENSUS_LOCKED back to UNDER_CONSENSUS for rework."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead]
    code: 200
    input: [target_status]
    output: DemandForecast
    side_effects: ["UNDER_CONSENSUS_to_CONSENSUS_LOCKED commits every ENDORSED adjustment on the line to COMMITTED and re-runs calc_consensus_units", "CONSENSUS_LOCKED_to_UNDER_CONSENSUS returns COMMITTED adjustments to ENDORSED and marks the item's non-STALE SupplyPlans STALE", "increments DemandForecast.version by 1"]

  - method: GET
    path: "/sop/demand-forecasts/{forecast_id}"
    description: "Read one forecast line including baseline_units, consensus_units and version (the OCC token for adjustment writes)."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor, CustomerRep]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []

  - method: GET
    path: "/sop/demand-forecasts"
    description: "List forecast lines, filterable by cycle, item, customer, month and status. A CustomerRep must supply its own customer_id."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor, CustomerRep]
    code: 200
    input: ["cycle_id?", "item_id?", "customer_id?", "month?", "status?", "limit?", "offset?"]
    output: DemandForecast[]
    side_effects: []

  # ---- consensus adjustments --------------------------------------------
  - method: POST
    path: "/sop/consensus-adjustments"
    description: "Propose a consensus adjustment against a forecast line, carrying the OCC token the planner last observed on that line."
    roles: [DemandPlanner]
    code: 201
    input: [demand_forecast_id, adjustment_type, delta_units, rationale, "promotion_id?", expected_demand_forecast_version]
    output: ConsensusAdjustment
    side_effects: ["moves the target forecast BASELINE to UNDER_CONSENSUS on the first adjustment", "computes applied_delta_units per calc_consensus_units and enforces the MAX_SWING_PCT guardrail against baseline_units", "created in PROPOSED with revision_round=0 and proposed_by_user_id from X-User-ID", "increments DemandForecast.version by 1"]

  - method: POST
    path: "/sop/consensus-adjustments/{adjustment_id}/reviews"
    description: "Review a PROPOSED adjustment: decision ENDORSE, REJECT or REQUEST_REVISION. The proposer may not review their own adjustment."
    roles: [DemandReviewLead]
    code: 200
    input: [decision, "review_note?"]
    output: ConsensusAdjustment
    side_effects: ["ENDORSE sets status ENDORSED and re-runs calc_consensus_units on the forecast, updating consensus_units and endorsed_adjustment_count", "REJECT sets status REJECTED (terminal)", "REQUEST_REVISION sets status REVISION_REQUESTED", "records reviewed_by_user_id from X-User-ID", "increments DemandForecast.version by 1"]

  - method: POST
    path: "/sop/consensus-adjustments/{adjustment_id}/resubmit"
    description: "Resubmit a REVISION_REQUESTED adjustment back to PROPOSED with an optionally revised delta, bounded by MAX_REVISION_ROUNDS."
    roles: [DemandPlanner]
    code: 200
    input: [rationale, "delta_units?", expected_demand_forecast_version]
    output: ConsensusAdjustment
    side_effects: ["status REVISION_REQUESTED to PROPOSED, increments revision_round, clears reviewed_by_user_id and review_note", "recomputes applied_delta_units and re-enforces the MAX_SWING_PCT guardrail", "increments DemandForecast.version by 1"]

  - method: GET
    path: "/sop/consensus-adjustments/{adjustment_id}"
    description: "Read one consensus adjustment including applied_delta_units and revision_round."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: ConsensusAdjustment
    side_effects: []

  - method: GET
    path: "/sop/consensus-adjustments"
    description: "List consensus adjustments, filterable by forecast line, cited promotion, status and type."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["demand_forecast_id?", "promotion_id?", "status?", "adjustment_type?", "limit?", "offset?"]
    output: ConsensusAdjustment[]
    side_effects: []

  # ---- supply review -----------------------------------------------------
  - method: POST
    path: "/sop/supply-plans"
    description: "Run the supply review for one item in one cycle: aggregate locked demand, apply the cycle's netting policy, bind against capacity and materials, and identify the binding constraint."
    roles: [SupplyPlanner]
    code: 201
    input: [cycle_id, item_id]
    output: SupplyPlan
    side_effects: ["runs calc_constrained_supply to set gross_requirement_units, target_build_units, available_units, material_cap_units, demand_side_units, constrained_units, shortfall_units, constraint_type and unallocated_units", "created in PLANNED with requires_replan=false", "re-runs calc_cycle_financials and calc_cycle_posture on the cycle"]

  - method: POST
    path: "/sop/supply-plans/{supply_plan_id}/ration"
    description: "Ration a constrained plan across customers via the protected-then-pro-rata waterfall, creating one Allocation per requesting customer."
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: SupplyPlan
    side_effects: ["runs calc_rationing_waterfall, creating Allocation rows and rewriting unallocated_units", "status PLANNED to RATIONED", "preserves inv_allocation_units_conserved"]

  - method: GET
    path: "/sop/supply-plans/{supply_plan_id}"
    description: "Read one supply plan including its constraint identification and leftover units."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: SupplyPlan
    side_effects: []

  - method: GET
    path: "/sop/supply-plans"
    description: "List supply plans, filterable by cycle, item, status and binding constraint type."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["cycle_id?", "item_id?", "status?", "constraint_type?", "limit?", "offset?"]
    output: SupplyPlan[]
    side_effects: []

  - method: GET
    path: "/sop/allocations/{allocation_id}"
    description: "Read one allocation line including its fill rate and which waterfall pass produced it."
    roles: [SopAdmin, SupplyPlanner, ExecutiveSponsor, CustomerRep]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: GET
    path: "/sop/allocations"
    description: "List allocations, filterable by supply plan, customer and allocation status. A CustomerRep must supply its own customer_id."
    roles: [SopAdmin, SupplyPlanner, ExecutiveSponsor, CustomerRep]
    code: 200
    input: ["supply_plan_id?", "customer_id?", "allocation_status?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  # ---- scenario planning and executive review ---------------------------
  - method: POST
    path: "/sop/scenarios"
    description: "Draft a gap-closing scenario: either a capacity investment against a shortfall or a price-realization play against the plan value."
    roles: [SupplyPlanner, ExecutiveSponsor]
    code: 201
    input: [cycle_id, scenario_type, name, "target_item_id?", "added_capacity_hours?", "price_increase_pct?"]
    output: Scenario
    side_effects: ["created in DRAFT with all money fields 0 and created_by_user_id from X-User-ID"]

  - method: POST
    path: "/sop/scenarios/{scenario_id}/evaluate"
    description: "Evaluate a DRAFT scenario through the seven pinned steps of calc_scenario_gap_closure, pinning the trade-rate tier to the pre-trade closure."
    roles: [SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: Scenario
    side_effects: ["runs calc_scenario_gap_closure to set incremental_units, gross_uplift_cents, investment_cost_cents, pre_trade_closure_cents, trade_rate_pct, trade_spend_cents and net_gap_closure_cents", "status DRAFT to EVALUATED; does NOT change the cycle's money fields"]

  - method: POST
    path: "/sop/scenarios/{scenario_id}/select"
    description: "Select an EVALUATED scenario for the executive review, superseding any previously selected scenario of the same scenario_type and applying its closure to the cycle's residual gap. Carries the OCC token the executive last observed on the cycle; the scenario's author may not select it."
    roles: [ExecutiveSponsor]
    code: 200
    input: [expected_cycle_version]
    output: Scenario
    side_effects: ["status EVALUATED to SELECTED and records selected_by_user_id from X-User-ID", "supersedes the cycle's existing SELECTED scenario of the same scenario_type", "re-runs calc_cycle_financials and calc_cycle_posture, preserving inv_gap_closure_cents_conserved", "increments PlanningCycle.version by 1"]

  - method: GET
    path: "/sop/scenarios/{scenario_id}"
    description: "Read one scenario including every evaluated money field."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: []
    output: Scenario
    side_effects: []

  - method: GET
    path: "/sop/scenarios"
    description: "List scenarios, filterable by cycle, target item, status and scenario type."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, SupplyPlanner, ExecutiveSponsor]
    code: 200
    input: ["cycle_id?", "target_item_id?", "status?", "scenario_type?", "limit?", "offset?"]
    output: Scenario[]
    side_effects: []

  # ---- accuracy accountability ------------------------------------------
  - method: POST
    path: "/sop/accuracy-records"
    description: "Post the realized actuals for a (cycle, item, customer) after publication, snapshotting the locked consensus and rolling the family's accuracy, bias and grade forward."
    roles: [SopAdmin, DemandPlanner]
    code: 201
    input: [cycle_id, item_id, customer_id, actual_units]
    output: AccuracyRecord
    side_effects: ["runs calc_accuracy_record to set forecast_units_snapshot, signed_error_units, abs_error_units, ape_pct and accountable_planner_user_id", "runs calc_accuracy_rollup to update the item's ProductFamily rolling_wmape_pct, rolling_bias_pct, bias_flag, accuracy_grade and scored_record_count"]

  - method: GET
    path: "/sop/accuracy-records/{record_id}"
    description: "Read one immutable accuracy record."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, ExecutiveSponsor, CustomerRep]
    code: 200
    input: []
    output: AccuracyRecord
    side_effects: []

  - method: GET
    path: "/sop/accuracy-records"
    description: "List accuracy records, filterable by cycle, item and customer. A CustomerRep must supply its own customer_id."
    roles: [SopAdmin, DemandPlanner, DemandReviewLead, ExecutiveSponsor, CustomerRep]
    code: 200
    input: ["cycle_id?", "item_id?", "customer_id?", "limit?", "offset?"]
    output: AccuracyRecord[]
    side_effects: []

  # ---- test-driving surface ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by the promotion frozen-horizon rule. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SopAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["repositions the logical clock; no business rows are modified"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_UNAUTHORIZED_PHASE_ACTOR
    http: 403
    condition: "the operation belongs to a different S&OP phase than the governing cycle's current status (e.g. a SupplyPlanner rationing while the cycle is still in DEMAND_REVIEW)"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "a CustomerRep reads forecasts, allocations or accuracy records for a customer_id other than its own, or omits customer_id on a list call"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals the adjustment's proposed_by_user_id on a review, or the scenario's created_by_user_id on a select"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, enum value outside the declared set, numeric value outside the declared range, malformed YYYY-MM or YYYY-MM-DD string, inverted month or date window, or a duplicate family_code / sku / customer_code / cycle_code"

  # --- existence ---
  - id: ERR_FAMILY_NOT_FOUND
    http: 404
    condition: "family_id in the path or body matches no ProductFamily"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "item_id, successor_item_id or target_item_id matches no Item"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id matches no Customer"
  - id: ERR_CAPACITY_BLOCK_NOT_FOUND
    http: 404
    condition: "block_id matches no CapacityBlock"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "promotion_id matches no Promotion"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "cycle_id matches no PlanningCycle"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "forecast_id or demand_forecast_id matches no DemandForecast"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "adjustment_id matches no ConsensusAdjustment"
  - id: ERR_SUPPLY_PLAN_NOT_FOUND
    http: 404
    condition: "supply_plan_id matches no SupplyPlan"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocation_id matches no Allocation"
  - id: ERR_SCENARIO_NOT_FOUND
    http: 404
    condition: "scenario_id matches no Scenario"
  - id: ERR_ACCURACY_RECORD_NOT_FOUND
    http: 404
    condition: "record_id matches no AccuracyRecord"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_FORECAST_VERSION
    http: 412
    condition: "expected_demand_forecast_version does not equal the target DemandForecast's current version"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the governing PlanningCycle's current version"

  # --- state / workflow ---
  - id: ERR_CYCLE_FROZEN
    http: 409
    condition: "the governing PlanningCycle's posture is FROZEN, which admits no writes to any of its planning artifacts"
  - id: ERR_CYCLE_PHASE_CLOSED
    http: 409
    condition: "the cycle has advanced past the phase that admits this class of write (e.g. an adjustment write while the cycle is in SUPPLY_REVIEW)"
  - id: ERR_CYCLE_TRANSITION_INVALID
    http: 409
    condition: "target_status is not reachable from the cycle's current status"
  - id: ERR_FORECAST_TRANSITION_INVALID
    http: 409
    condition: "target_status is not reachable from the forecast line's current status, including any transition out of the terminal RUNOUT_TRUNCATED state"
  - id: ERR_ADJUSTMENT_NOT_REVIEWABLE
    http: 409
    condition: "the adjustment is not in PROPOSED (already ENDORSED, REJECTED, COMMITTED, VOIDED or awaiting revision)"
  - id: ERR_ADJUSTMENT_NOT_RESUBMITTABLE
    http: 409
    condition: "the adjustment is not in REVISION_REQUESTED"
  - id: ERR_ITEM_LIFECYCLE_TRANSITION_INVALID
    http: 409
    condition: "target_state is not reachable from the item's current lifecycle_state, including any transition out of DISCONTINUED or CANCELLED_NPI"
  - id: ERR_SUPPLY_PLAN_NOT_RATIONABLE
    http: 409
    condition: "the supply plan is not in PLANNED (already RATIONED, STALE or COMMITTED)"
  - id: ERR_SCENARIO_NOT_EVALUATABLE
    http: 409
    condition: "the scenario is not in DRAFT"
  - id: ERR_SCENARIO_NOT_SELECTABLE
    http: 409
    condition: "the scenario is not in EVALUATED (still DRAFT, or already SELECTED, SUPERSEDED or EXECUTED)"
  - id: ERR_PROMOTION_NOT_APPROVABLE
    http: 409
    condition: "the promotion is not in DRAFT (already APPROVED or CANCELLED_RUNOUT)"

  # --- business: referential eligibility (priority 130) ---
  - id: ERR_ITEM_NOT_PROMOTABLE
    http: 422
    condition: "the promotion's item lifecycle_state is not RAMP or MATURE"
  - id: ERR_PROMOTION_NOT_APPROVED
    http: 422
    condition: "a PROMOTION-type adjustment cites a promotion that is not APPROVED, or one whose item differs from the target forecast's item"
  - id: ERR_ADJUSTMENT_TYPE_NOT_PERMITTED
    http: 422
    condition: "NEW_ITEM_PLAN used on an item that is neither PRELAUNCH nor RAMP, or SALES_INTELLIGENCE used on a PRELAUNCH item"
  - id: ERR_SUCCESSOR_NOT_ELIGIBLE
    http: 422
    condition: "successor_item_id is the item itself, sits in a different ProductFamily, or is not PRELAUNCH or RAMP"
  - id: ERR_FORECAST_NOT_LOCKED
    http: 422
    condition: "supply plan creation attempted while the (cycle, item) has no forecast at all, or has at least one forecast still in BASELINE or UNDER_CONSENSUS"
  - id: ERR_OPEN_ADJUSTMENTS
    http: 422
    condition: "a forecast line is locked while it still carries an adjustment in PROPOSED or REVISION_REQUESTED"
  - id: ERR_STALE_SUPPLY_PLAN
    http: 422
    condition: "a CAPACITY_INVESTMENT scenario is selected while the supply plan it was evaluated against has since gone STALE"
  - id: ERR_UNEVALUATED_SCENARIO
    http: 422
    condition: "the cycle advances SCENARIO_REVIEW to EXECUTIVE_REVIEW while at least one of its scenarios is still DRAFT"

  # --- business: temporal / interval (priority 140) ---
  - id: ERR_PROMOTION_WINDOW_OVERLAP
    http: 409
    condition: "approving the promotion would make two APPROVED promotions for the same (item_id, customer_id) share at least one month under closed-inclusive window semantics; windows that merely abut do not conflict"
  - id: ERR_CAPACITY_BLOCK_OVERLAP
    http: 409
    condition: "the incoming CapacityBlock's half-open [start_date, end_date) window comes within CHANGEOVER_BUFFER_DAYS of another block of the same family, which includes exactly adjacent blocks"
  - id: ERR_PROMOTION_HORIZON_FROZEN
    http: 422
    condition: "approving a promotion whose start_month is the current logical month or earlier"
  - id: ERR_MONTH_OUTSIDE_HORIZON
    http: 422
    condition: "the forecast month lies outside [cycle.horizon_start_month, cycle.horizon_end_month]"

  # --- business: aggregate constraints and uniqueness (priority 150) ---
  - id: ERR_FAMILY_MONTHLY_HOURS_EXCEEDED
    http: 422
    condition: "the family's total available_hours for the calendar month of start_date, including the incoming block, would exceed max_monthly_hours"
  - id: ERR_DUPLICATE_FORECAST
    http: 409
    condition: "a DemandForecast already exists for the (cycle_id, item_id, customer_id, month) tuple"
  - id: ERR_SUPPLY_PLAN_EXISTS
    http: 409
    condition: "a non-STALE SupplyPlan already exists for the (cycle_id, item_id) pair"
  - id: ERR_DUPLICATE_ACCURACY_RECORD
    http: 409
    condition: "an AccuracyRecord already exists for the (cycle_id, item_id, customer_id) triple"

  # --- business: rate and volume safety limits (priority 160) ---
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 422
    condition: "reopening a cycle whose reopen_count already equals MAX_REOPENS (2)"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "resubmitting an adjustment whose revision_round already equals MAX_REVISION_ROUNDS (3)"
  - id: ERR_RUNOUT_INVENTORY_REMAINS
    http: 422
    condition: "discontinuing a RUNOUT item whose on_hand_units still exceed RUNOUT_TOLERANCE_UNITS (0)"

  # --- business: financial guardrails (priority 170) ---
  - id: ERR_ADJUSTMENT_SWING_EXCEEDED
    http: 422
    condition: "the absolute applied_delta_units of a single adjustment exceeds round_half_up(baseline_units * MAX_SWING_PCT / 100, 0)"
  - id: ERR_UNCLOSED_GAP
    http: 422
    condition: "publishing a cycle whose residual_gap_cents is still greater than 0"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: SopAdmin
    description: "S&OP process owner. Maintains master data (families, items, customers, capacity), opens and drives planning cycles, and repositions the logical clock for horizon testing. Cannot review adjustments or select scenarios."
    identity: "opaque"
    exclusive_operations:
      - "POST /sop/product-families"
      - "POST /sop/items"
      - "POST /sop/customers"
      - "POST /sop/planning-cycles"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /sop/items/{item_id}/inventory-policy (with SupplyPlanner)"
      - "POST /sop/items/{item_id}/lifecycle-transitions (with DemandPlanner)"
      - "POST /sop/capacity-blocks (with SupplyPlanner)"
      - "POST /sop/promotions (with DemandPlanner)"
      - "POST /sop/planning-cycles/{cycle_id}/transitions (with ExecutiveSponsor)"
      - "POST /sop/demand-forecasts (with DemandPlanner)"
      - "POST /sop/demand-forecasts/{forecast_id}/transitions (with DemandPlanner, DemandReviewLead)"
      - "POST /sop/accuracy-records (with DemandPlanner)"
      - "all GET reads except GET /sop/allocations, which it shares with SupplyPlanner and ExecutiveSponsor"

  - name: DemandPlanner
    description: "Owns statistical baselines and proposes consensus adjustments. Accountable for forecast accuracy at product-family level. May never review or endorse an adjustment, including its own."
    identity: "opaque"
    exclusive_operations:
      - "POST /sop/consensus-adjustments"
      - "POST /sop/consensus-adjustments/{adjustment_id}/resubmit"
    shared_operations:
      - "POST /sop/promotions (with SopAdmin)"
      - "POST /sop/demand-forecasts (with SopAdmin)"
      - "POST /sop/demand-forecasts/{forecast_id}/transitions (with SopAdmin, DemandReviewLead)"
      - "POST /sop/items/{item_id}/lifecycle-transitions (with SopAdmin)"
      - "POST /sop/accuracy-records (with SopAdmin)"
      - "read access to families, items, customers, promotions, cycles, forecasts, adjustments, supply plans, scenarios, accuracy records and the cycle accuracy summary"

  - name: DemandReviewLead
    description: "Chairs the demand review. Sole approver of promotions and sole reviewer of consensus adjustments (endorse, reject, request revision). Segregation of duties forbids reviewing an adjustment it proposed, which it cannot propose anyway."
    identity: "opaque"
    exclusive_operations:
      - "POST /sop/promotions/{promotion_id}/approve"
      - "POST /sop/consensus-adjustments/{adjustment_id}/reviews"
    shared_operations:
      - "POST /sop/demand-forecasts/{forecast_id}/transitions (with SopAdmin, DemandPlanner)"
      - "read access to families, items, customers, promotions, cycles, forecasts, adjustments, supply plans, scenarios, accuracy records and the cycle accuracy summary"

  - name: SupplyPlanner
    description: "Runs the supply review: publishes capacity, builds constrained supply plans, executes the rationing waterfall and drafts capacity-investment scenarios. Cannot select a scenario or publish a cycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /sop/supply-plans"
      - "POST /sop/supply-plans/{supply_plan_id}/ration"
    shared_operations:
      - "POST /sop/capacity-blocks (with SopAdmin)"
      - "POST /sop/items/{item_id}/inventory-policy (with SopAdmin)"
      - "POST /sop/scenarios (with ExecutiveSponsor)"
      - "POST /sop/scenarios/{scenario_id}/evaluate (with ExecutiveSponsor)"
      - "read access to families, items, customers, capacity blocks, promotions, cycles, forecasts, adjustments, supply plans, allocations and scenarios"

  - name: ExecutiveSponsor
    description: "Chairs the executive review. Sole selector of gap-closing scenarios and, with SopAdmin, the driver of cycle transitions including publication and reopening. Segregation of duties forbids selecting a scenario it authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /sop/scenarios/{scenario_id}/select"
    shared_operations:
      - "POST /sop/planning-cycles/{cycle_id}/transitions (with SopAdmin)"
      - "POST /sop/scenarios (with SupplyPlanner)"
      - "POST /sop/scenarios/{scenario_id}/evaluate (with SupplyPlanner)"
      - "read access to families, items, customers, capacity blocks, promotions, cycles, forecasts, adjustments, supply plans, allocations, scenarios, accuracy records and the cycle accuracy summary"

  - name: CustomerRep
    description: "External representative of exactly one Customer. X-User-ID is that Customer's id. Read-only, and every read is scoped to its own customer's forecast lines, allocations and accuracy records."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /sop/customers/{customer_id}"
      - "GET /sop/demand-forecasts and GET /sop/demand-forecasts/{forecast_id}, restricted to its own customer_id"
      - "GET /sop/allocations and GET /sop/allocations/{allocation_id}, restricted to its own customer_id"
      - "GET /sop/accuracy-records and GET /sop/accuracy-records/{record_id}, restricted to its own customer_id"
