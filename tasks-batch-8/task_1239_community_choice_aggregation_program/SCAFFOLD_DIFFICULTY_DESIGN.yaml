  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check on DIFFERENT metrics/endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: discount_floor_bps_exact_boundary_adopt
        grounds:
          - calculations.rate_comparison_margin
          - validations[priority=14]
          - endpoints: "POST /cca/rate-schedules/{id}/adopt"
        distinguishing_aspect: |
          Metric: integer basis-point margin on the rate-adopt endpoint. The gate is
          inclusive (>=): a schedule whose comparison_margin_bps EQUALS the floor must
          adopt; one 1 bp below must fail. 12.00 benchmark, rate 11.88 -> margin exactly
          100 bps; rate 11.8801 is not representable, so the below case uses rate 11.89
          -> round_half_up(10000 x 0.11/12) = 92 bps.
        test_recipe:
          setup:
            - "Authority (FORMING is fine) with DISCOUNT_TO_INCUMBENT, discount_floor_bps == 100"
            - "Product P in DRAFT; schedules S_EQ (rate 11.88 -> 100 bps) and S_BELOW (rate 11.89 -> 92 bps), both PROPOSED"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "DISCOUNT_TO_INCUMBENT", discount_floor_bps: 100, rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.88, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_eq: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_eq}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.89, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_below: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_below}/propose"
              payload: {}
              as: RateAnalyst
          trigger:
            - call: "POST /cca/rate-schedules/${rs_eq}/adopt"
              payload: {}
              as: BoardDirector
              captures: { st_eq: $.data.status, margin_eq: $.data.comparison_margin_bps }
            - call: "POST /cca/rate-schedules/${rs_below}/adopt"
              payload: {}
              as: BoardDirector
              captures: { err_below: $.data.error_id }
          assert:
            - "S_EQ comparison_margin_bps == 100 and status == ADOPTED (inclusive >= boundary accepts equality)"
            - "S_BELOW comparison_margin_bps == 92 and adopt returns ERR_FISCAL_GATE (strictly below the floor rejects)"
      - name: zero_rec_claim_prepare_rejected
        grounds:
          - state_machines.ComplianceFiling.DRAFT_to_PREPARED
          - errors[ERR_ZERO_REC_CLAIM]
          - endpoints: "POST /cca/compliance-filings/{id}/prepare"
        distinguishing_aspect: |
