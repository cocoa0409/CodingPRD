              as_user_id: "usr-coord-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 -> HTTP 200 with audited_count == 2, retained_count == 1, lost_count == 1, audit_reference == \"AUD-W26-01\" and audited_slot_holding_ids containing both ${shA_id} and ${shB_id}"
            - "SlotHolding.${shA_id}.utilization_pct == 60.00, holding_status == \"LOST\", historic_precedence == false, retains_historic_precedence == false, at_risk_of_loss == false"
            - "SlotHolding.${shB_id}.utilization_pct == 80.00 and holding_status == \"HELD\" — 80.00 is not STRICTLY below UTILIZATION_THRESHOLD_PCT 80.0"
            - "Season.${season_id}.slot_audit_completed_at_utc is non-null, audit_reference == \"AUD-W26-01\", status == \"CLOSED\" and held_series_count == 1"
            - "trigger call 2 -> HTTP 409 with data.error_id == \"ERR_SLOT_AUDIT_ALREADY_RUN\"; Season.${season_id}.audit_reference is STILL \"AUD-W26-01\""
            - "no PassengerNotificationObligation was created because no leg referenced ${shA_id}"

      - name: conditional_cascade_leaves_queued_submissions_untouched_when_blocked
        claim_type: conditional_cascade
        grounds:
          - state_machines.ScheduleVersion.CLEAN_to_BLOCKED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / schedule_blocked_outranks_filing_charge_budget_exceeded_on_the_same_transmit
          rationale: "That instance asserts, after the BLOCKED cascade, that the QUEUED submission is still QUEUED while TRANSMITTED/ACKNOWLEDGED siblings would have been rejected — the conditional-cascade claim verbatim."

      - name: compensation_reverses_every_side_effect_of_a_transmission
        claim_type: compensation
        grounds:
          - state_machines.FilingSubmission.TRANSMITTED_to_REJECTED
        excluded_because:
          difficulty_instance: compensating_invariant / filing_charge_ledger_returns_to_exactly_zero_after_transmit_then_rejection
          rationale: "The REJECT acknowledgement's full undo — ledger back to 0, version FILED -> VALIDATED, legs FILED -> SLOT_BACKED, stored total preserved — is asserted there with zero drift."

      - name: ledger_sync_keeps_the_version_accrual_equal_to_its_live_submissions
        claim_type: ledger_sync
        grounds:
          - entities.ScheduleVersion.fields.filing_charge_accrued_cents
        excluded_because:
          difficulty_instance: compensating_invariant / filing_charge_ledger_returns_to_exactly_zero_after_transmit_then_rejection
          rationale: "The same instance pins the ancestor-side derived field before, during and after the child submission's state changes."

      - name: parallel_dimensions_of_a_schedule_version_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.ScheduleVersion
        excluded_because:
          difficulty_instance: non_linear_state_machine / schedule_version_filing_status_and_compliance_state_move_independently
          rationale: "That instance freezes one dimension while the other moves, in both directions, which is the parallel-shape claim for this scaffold."

      - name: guarded_transition_requires_the_foreign_entity_to_be_in_service
        claim_type: guarded_transitions
        grounds:
          - state_machines.FlightLeg.DRAFT_to_ASSIGNED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / leg_assignment_is_gated_by_the_aircraft_status_dimension
          rationale: "The DRAFT -> ASSIGNED guard on Aircraft.status is asserted there in both the denied and the permitted direction."

  # ===================================================================
  # SECTION 3 — calculations  (§1.4, 8 calculations)
  # ===================================================================
  - section: calculations
    instances:

      - name: filing_charge_for_two_standard_legs_totals_eight_thousand_four_hundred_fifty
        claim_type: correct_result
        grounds:
          - calculations.filing_change_charge_cents
          - endpoints.POST_filing_submissions
        distinguishing_aspect: |
          Two SLOT_BACKED legs are inside TIER_1_MAX_LEGS 5, so base_charge_subtotal_cents is
          2 * BASE_RATE_PER_LEG_CENTS 4225 = 8450 with TIER_1_SURCHARGE_PCT 0.0, and change_window
          STANDARD gives expedite_rate_pct 0.0 and expedite_fee_cents 0, so total_charge_cents == 8450.
          The same recipe then proves the count is FROZEN: after one leg is retimed out of SLOT_BACKED a
          second submission prices at 4225 while the first still reads 8450.
        test_recipe:
          setup:
            - "Home carrier HX; MUC and TXL both LEVEL_2_FACILITATED so no slot is required and unslotted_leg_count stays 0; Season W26 OPEN; clock at its default 2026-08-01T00:00:00Z, which is before filing_change_window_close_utc 2026-10-11."
            - "Aircraft D-AHXA, min_turn_minutes 45, max_daily_block_minutes 600."
            - "ScheduleVersion W26-F1 with two legs on 2026-11-03: MUC->TXL 08:00Z->09:00Z and TXL->MUC 10:00Z->11:00Z (turn 60 >= 45), both assigned to D-AHXA and therefore SLOT_BACKED, version VALIDATED by usr-comp-1."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-F1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX321", origin_station_id: "${txl_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T10:00:00Z", arr_utc: "2026-11-03T11:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
            - call: "POST /flight-legs/${leg1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /schedule-versions/${sv_id}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
          trigger:
            - call: "POST /filing-submissions"
              payload: { schedule_version_id: "${sv_id}", distribution_system: "OAG", change_window: "STANDARD" }
              as: FilingAgent
              as_user_id: "usr-file-1"
              captures: { fs1_id: "$.data.id" }
            - call: "PATCH /flight-legs/${leg2_id}"
              payload: { dep_utc: "2026-11-03T12:00:00Z", arr_utc: "2026-11-03T13:00:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /filing-submissions"
              payload: { schedule_version_id: "${sv_id}", distribution_system: "OAG", change_window: "STANDARD" }
              as: FilingAgent
              as_user_id: "usr-file-1"
              captures: { fs2_id: "$.data.id" }
          assert:
            - "FilingSubmission.${fs1_id}: changed_leg_count == 2, base_charge_subtotal_cents == 8450, expedite_rate_pct == 0.0, expedite_fee_cents == 0, total_charge_cents == 8450, status == \"QUEUED\", codeshare_sync_status == \"NOT_REQUIRED\", submitted_by_user_id == \"usr-file-1\""
            - "after trigger call 2, FlightLeg.${leg2_id}.status == \"ASSIGNED\" (the retime dropped it out of SLOT_BACKED)"
            - "FilingSubmission.${fs2_id}: changed_leg_count == 1, base_charge_subtotal_cents == 4225, total_charge_cents == 4225"
            - "FilingSubmission.${fs1_id} STILL reads changed_leg_count == 2 and total_charge_cents == 8450 — the frozen input set was not recomputed"
            - "ScheduleVersion.${sv_id}.filing_charge_accrued_cents == 0 because neither submission has been transmitted"

      - name: compliance_score_deducts_eight_points_for_each_unslotted_coordinated_leg
        claim_type: weight_application
        grounds:
          - calculations.schedule_compliance_score
          - entities.ScheduleVersion.fields.unslotted_leg_count
        distinguishing_aspect: |
          Two legs departing LEVEL_3_COORDINATED FRA with no slot attached give unslotted_leg_count 2 and
          score BASE_SCORE 100.0 - 2 * W_UNSLOTTED 8.0 = 84.00, which is below WARN_THRESHOLD 85.00 and
          therefore compliance_state WARNED — not BLOCKED, because at_risk_slot_count is 0 and 84.00 is
          above BLOCK_THRESHOLD 60.00. An implementation that charges the weight once per version rather
          than once per leg reports 92.00 and CLEAN.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN; ScheduleVersion W26-C1 with no legs yet."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-C1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX103", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-09T08:00:00Z", arr_utc: "2026-11-09T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
          assert:
            - "after trigger call 1: ScheduleVersion.${sv_id}.unslotted_leg_count == 1 and schedule_compliance_score == 92.00 and compliance_state == \"CLEAN\""
            - "after trigger call 2: unslotted_leg_count == 2, schedule_compliance_score == 84.00, compliance_state == \"WARNED\""
            - "curfew_violation_count == 0, mct_violation_count == 0, gate_overflow_count == 0, at_risk_slot_count == 0 — only the unslotted weight was charged"
            - "leg_count == 2 and both legs are status \"DRAFT\""

      - name: cancelled_legs_drop_out_of_the_compliance_score_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.schedule_compliance_score
          - state_machines.FlightLeg.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          The score's input set is "FlightLeg rows of this version with status != CANCELLED", so
          cancelling one of two unslotted legs must move the score 84.00 -> 92.00 and the state WARNED ->
          CLEAN while leg_count stays 2. An implementation that filters on nothing keeps the 84.00, and
          one that also decrements leg_count loses the audit trail of the cancelled leg.
        test_recipe:
          setup:
            - "Exactly the end state of compliance_score_deducts_eight_points_for_each_unslotted_coordinated_leg: ScheduleVersion W26-C1 with two unslotted FRA->MUC legs, score 84.00, compliance_state WARNED."
          setup_api_calls:
