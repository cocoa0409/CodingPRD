  - section: endpoints
    instances:
      - name: land_resource_create_and_read_back
        claim_type: standard_crud
        grounds:
          - endpoints."POST /land-resources"
          - endpoints."GET /land-resources/{landResourceId}"
        distinguishing_aspect: "POST /land-resources returns 201 with every supplied field, including fx_rate_bp and force_majeure_notice_days, and the follow-up GET returns the identical row rather than a re-derived one."
        test_recipe:
          setup:
            - "No prior state is needed; a land resource is a standalone catalogue row owned by the LandContractor."
          setup_api_calls: []
          trigger:
            - call: "POST /land-resources"
              payload: { operator_name: "Galilee Coaches Ltd", country: "IL", resource_type: "MOTORCOACH", units_total: 4, unit_rate_local_cents: 90000, fx_rate_bp: 10833, force_majeure_notice_days: 30 }
              as: LandContractor
              captures: { lr_id: $.data.id }
            - call: "GET /land-resources/${lr_id}"
              payload: {}
              as: ProgramManager
          assert:
