# =============================================================================
# §1.9 Scaffold Corner Design — animation-studio-production-pipeline
# Breadth probe over the nine sections of references/claim-extraction-guide.md.
# Every recipe drives empty-DB state through §1.5 endpoints only; the logical
# clock starts at 2026-08-01T00:00:00Z unless a call moves it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: production_create_applies_defaults_and_materializes_four_gates
        claim_type: defaults
        grounds:
          - entities.Production.fields.contingency_pct
          - entities.Production.fields.approved_color_spaces
          - entities.Production.fields.gate_types
          - entities.PreProductionGate.fields.sequence_index
          - response_envelope
        distinguishing_aspect: |
          A create carrying only the six required inputs must fill contingency_pct 0.1,
          approved_color_spaces ["ACEScg"] and the four-gate default set, materialize four DRAFT gates at
          sequence_index 1..4, and return them inside the declared success envelope.
        test_recipe:
          setup:
            - "the database is empty"
          setup_api_calls: []
          trigger:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id", p_cont: "$.data.contingency_pct", p_spaces: "$.data.approved_color_spaces", p_gates: "$.data.gate_types", p_phase: "$.data.phase", p_available: "$.data.available_cents", p_version: "$.data.version" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { g0_type: "$.data[0].gate_type", g0_index: "$.data[0].sequence_index", g0_status: "$.data[0].status", g3_type: "$.data[3].gate_type", g3_index: "$.data[3].sequence_index" }
          assert:
            - "${p_cont} == 0.1 and ${p_spaces} == [\"ACEScg\"] and ${p_gates} == [\"SCRIPT\", \"STORYBOARD\", \"ANIMATIC\", \"DESIGN\"]"
            - "${p_phase} == PRE_PRODUCTION, ${p_available} == 110000000 and ${p_version} == 1"
            - "the create response carries meta.api_request_id, meta.api_request_timestamp, response_type == object and a data object"
            - "the gate list returns exactly 4 rows; ${g0_type} == SCRIPT with ${g0_index} == 1 and ${g0_status} == DRAFT, ${g3_type} == DESIGN with ${g3_index} == 4"
            - "the gate list response carries response_type == array plus limit, offset, total_count == 4 and has_more == false"
      - name: screening_room_get_returns_stored_row_with_derived_calibration_status
        claim_type: retrieval
        grounds:
          - entities.ScreeningRoom.fields.calibration_status
          - entities.ScreeningRoom.fields.turnover_buffer_minutes
          - entities.ScreeningRoom.fields.calibration_valid_days
        distinguishing_aspect: |
          GET on a freshly created room echoes every stored input unchanged and reports the two derived
          calibration fields as UNCALIBRATED / null, because calibration_status is re-derived on read
          rather than stored at create time.
        test_recipe:
          setup:
            - "screening room STAGE-1 was created with 12 seats and default buffer and validity"
          setup_api_calls:
            - call: "POST /studio/screening-rooms"
              payload: { name: "STAGE-1", seat_capacity: 12, room_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { room_id: "$.data.id" }
          trigger:
            - call: "GET /studio/screening-rooms/${room_id}"
              as: ProductionManager
              captures: { r_name: "$.data.name", r_seats: "$.data.seat_capacity", r_buffer: "$.data.turnover_buffer_minutes", r_days: "$.data.calibration_valid_days", r_space: "$.data.room_color_space", r_status: "$.data.calibration_status", r_last: "$.data.last_calibrated_at" }
          assert:
            - "${r_name} == STAGE-1, ${r_seats} == 12 and ${r_space} == ACEScg"
            - "${r_buffer} == 30 and ${r_days} == 30 (declared defaults)"
            - "${r_status} == UNCALIBRATED and ${r_last} is null"
      - name: shot_list_filters_by_production_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /studio/shots]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three shots under AD01 and one under AD02, GET /studio/shots?production_id=AD01&limit=2
          returns exactly two rows with total_count 3 and has_more true, and offset 2 returns the single
          remaining row with has_more false — the filter is applied before the window, not after.
        test_recipe:
          setup:
            - "production AD01 holds three shots and production AD02 holds one, all created while both are PRE_PRODUCTION"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_a_id: "$.data.id" }
            - call: "POST /studio/productions"
              payload: { title: "Copper Skies", production_code: "AD02", format: "SERIES_EPISODE", budget_cents: 60000000, render_allowance_cents: 4000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_b_id: "$.data.id" }
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_a_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_a_id}", shot_code: "AD01_010_0020", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_a_id}", shot_code: "AD01_020_0010", sequence_code: "020", frame_count: 60, budget_cents: 500000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_b_id}", shot_code: "AD02_010_0010", sequence_code: "010", frame_count: 96, budget_cents: 800000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
          trigger:
            - call: "GET /studio/shots?production_id=${prod_a_id}&limit=2&offset=0"
              as: Supervisor
              captures: { page1_first: "$.data[0].shot_code", page1_second: "$.data[1].shot_code" }
            - call: "GET /studio/shots?production_id=${prod_a_id}&limit=2&offset=2"
              as: Supervisor
              captures: { page2_first: "$.data[0].shot_code" }
          assert:
            - "the first page returns exactly 2 rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "${page1_first} == AD01_010_0010 and ${page1_second} == AD01_010_0020 (created_at ASC)"
            - "the second page returns exactly 1 row with ${page2_first} == AD01_020_0010, total_count == 3, offset == 2 and has_more == false"
            - "no page contains AD02_010_0010"
      - name: render_pool_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_POOL_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid but unknown render pool id on the scalar read returns 404 with error_id
          ERR_POOL_NOT_FOUND and the declared error envelope, not an empty 200 body.
        test_recipe:
          setup:
            - "one render pool exists so the collection itself is non-empty"
          setup_api_calls:
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id" }
          trigger:
            - call: "GET /studio/render-pools/00000000-0000-0000-0000-000000000000"
              as: ProductionManager
              captures: { err_id: "$.data.error_id", err_msg: "$.data.message" }
          assert:
            - "HTTP status is 404 and ${err_id} == ERR_POOL_NOT_FOUND"
            - "${err_msg} is a non-empty string and the response carries response_type == error"
            - "GET /studio/render-pools still reports total_count == 1"
      - name: production_create_missing_master_color_space_rejects
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - entities.Production.fields.master_color_space
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          master_color_space has source input and no default, so omitting it returns 422 ERR_VALIDATION and
          persists nothing — no production row and no cascade-created gates.
        test_recipe:
          setup:
            - "the database is empty"
          setup_api_calls: []
          trigger:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422 and ${err_id} == ERR_VALIDATION"
            - "GET /studio/productions reports total_count == 0"
            - "GET /studio/pre-production-gates reports total_count == 0 (no partial cascade)"
      - name: shot_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Shot.fields.status
          - entities.Shot.fields.bcwp_cents
          - entities.Shot.fields.retake_count
        distinguishing_aspect: |
          id, version, status and the computed earned-value fields are system or computed sources, so
          supplying them in the create body changes nothing: the shot is minted with a server id, version 1,
          status BLOCKED_PREPROD and bcwp_cents 0.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
          trigger:
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z", id: "shot-i-picked", status: "COMPLETE", bcwp_cents: 999999, retake_count: 7, version: 42 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id", s_status: "$.data.status", s_bcwp: "$.data.bcwp_cents", s_retakes: "$.data.retake_count", s_version: "$.data.version" }
          assert:
            - "HTTP status is 201 and ${shot_id} != shot-i-picked"
            - "${s_status} == BLOCKED_PREPROD, ${s_bcwp} == 0, ${s_retakes} == 0 and ${s_version} == 1"
            - "unknown body fields are ignored rather than rejected, so no ERR_VALIDATION is returned"
      - name: asset_create_invalid_asset_type_rejects
        claim_type: type_constraints
        grounds:
          - entities.Asset.fields.asset_type
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          asset_type is closed over {CHARACTER_MODEL, PROP, ENVIRONMENT, RIG, SURFACING_PACKAGE}; the
          plausible-looking value MATTE_PAINTING is rejected with 422 ERR_VALIDATION, as is a
          base_complexity_points of 0 which violates the > 0 constraint.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
          trigger:
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_MATTE_01", asset_type: "MATTE_PAINTING", base_complexity_points: 100.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { err_1: "$.data.error_id" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_PROP_01", asset_type: "PROP", base_complexity_points: 0 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { err_2: "$.data.error_id" }
          assert:
            - "both calls return HTTP 422 with ${err_1} == ERR_VALIDATION and ${err_2} == ERR_VALIDATION"
            - "GET /studio/assets?production_id=${prod_id} reports total_count == 0"
      - name: shot_create_with_unknown_production_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - entities.Shot.fields.production_id
          - errors[ERR_PRODUCTION_NOT_FOUND]
        distinguishing_aspect: |
          Flat topology means every FK in a body is checked against storage: an unknown production_id on
          shot creation returns 404 ERR_PRODUCTION_NOT_FOUND, while a valid one materializes exactly five
          stage tasks reachable only through the shot_id filter.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION and holds no shots"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
          trigger:
            - call: "POST /studio/shots"
              payload: { production_id: "00000000-0000-0000-0000-000000000000", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t0_stage: "$.data[0].stage", t0_order: "$.data[0].stage_order", t0_weight: "$.data[0].stage_weight_pct", t4_stage: "$.data[4].stage", t4_order: "$.data[4].stage_order", t4_weight: "$.data[4].stage_weight_pct", t0_shot: "$.data[0].shot_id" }
          assert:
            - "the first call returns 404 with ${err_id} == ERR_PRODUCTION_NOT_FOUND"
            - "the stage-task list returns exactly 5 rows with total_count == 5"
            - "${t0_stage} == LAYOUT, ${t0_order} == 1, ${t0_weight} == 0.10 and ${t0_shot} == ${shot_id}"
            - "${t4_stage} == COMP, ${t4_order} == 5 and ${t4_weight} == 0.20"
      - name: shot_computed_earned_value_fields_correct_after_create
        claim_type: computed_fields
        grounds:
          - entities.Shot.fields.bcwp_cents
          - calculations.shot_earned_value
        excluded_because:
          difficulty_instance: dual_variant_calc / shot_bcwp_stage_weight_vs_hours_progress
          rationale: "That instance pins bcws, bcwp, acwp, cpi and spi as literals for both variants on a shot whose stages are partly approved and partly logged."

  - section: state_machines
    instances:
      - name: render_job_initial_state_is_reserved
        claim_type: initial_state
        grounds:
          - state_machines.RenderJob.null_to_RESERVED
          - entities.RenderJob.fields.status
          - entities.RenderJob.fields.final_cost_cents
        distinguishing_aspect: |
          A newly created render job starts at RESERVED with final_cost_cents null and
          actual_seconds_per_frame null, and the pool's reserved_job_count moves to 1 in the same request.
        test_recipe:
          setup:
            - "production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 whose LAYOUT task is IN_PROGRESS"
            - "render pool FARM-A has 100 cores at 175 cents per core-hour"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, gate_types: ["SCRIPT"], master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id", pool_v0: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 3, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_status: "$.data.status", job_final: "$.data.final_cost_cents", job_actual_spf: "$.data.actual_seconds_per_frame", job_frames_done: "$.data.frames_completed", job_preempted_by: "$.data.preempted_by_render_job_id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_jobs: "$.data.reserved_job_count" }
          assert:
            - "${job_status} == RESERVED"
            - "${job_final} is null, ${job_actual_spf} is null, ${job_frames_done} == 0 and ${job_preempted_by} is null"
            - "${pool_jobs} == 1"
      - name: library_submit_before_publish_rejects
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Asset.PRIVATE_to_LIBRARY_CANDIDATE
          - errors[ERR_ASSET_BUILD_STATE_INVALID]
        distinguishing_aspect: |
          The library dimension has a precondition on the other dimension: library-submit on an asset whose
          build_status is still BRIEFED returns 409 ERR_ASSET_BUILD_STATE_INVALID and leaves library_status
          at PRIVATE.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION and asset AD01_PROP_01 sits at build_status BRIEFED"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_PROP_01", asset_type: "PROP", base_complexity_points: 50.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { asset_id: "$.data.id" }
          trigger:
            - call: "POST /studio/assets/${asset_id}/library-submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /studio/assets/${asset_id}"
              as: Artist
              captures: { a_build: "$.data.build_status", a_lib: "$.data.library_status", a_submitter: "$.data.library_submitted_by_user_id" }
          assert:
            - "the trigger returns 409 with ${err_id} == ERR_ASSET_BUILD_STATE_INVALID"
            - "${a_build} == BRIEFED, ${a_lib} == PRIVATE and ${a_submitter} is null"
      - name: director_note_moves_submitted_task_to_in_review
        claim_type: side_effect_execution
        grounds:
          - state_machines.ShotStageTask.SUBMITTED_to_IN_REVIEW
          - endpoints[POST /studio/director-notes].side_effects
          - entities.ReviewSession.fields.note_count
        distinguishing_aspect: |
          Raising a note is the only trigger of SUBMITTED -> IN_REVIEW: the note lands OPEN, the session's
          note_count becomes 1 and the target task flips to IN_REVIEW without any revision being counted.
        test_recipe:
          setup:
            - "production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 whose LAYOUT task was assigned and submitted"
            - "screening room STAGE-1 is calibrated and an IN_PROGRESS DAILIES session is open on it"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, gate_types: ["SCRIPT"], master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
