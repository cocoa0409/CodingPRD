  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_stale_expected_negotiation_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.accept-offer-stale-negotiation
          - validations[priority=38]
          - errors.ERR_STALE_NEGOTIATION_VERSION
          - endpoints["POST /retrans/offers/{id}/accept"]
          - entities.Negotiation.version
        distinguishing_aspect: "The counter-offer leaves the station's own offer SUBMITTED, so nothing about the target offer's state is stale — only Negotiation.version has moved, and that alone must produce 412 ERR_STALE_NEGOTIATION_VERSION; re-reading the negotiation and resubmitting the identical body then succeeds, and version advances by exactly one per write (1 on creation, 2 after the station offer, 3 after the counter, 4 after acceptance)."
        test_recipe:
          setup:
            - "The canonical WXYZ / Cascade Cable slot filed as RETRANS_CONSENT with an open negotiation"
            - "A 2027-01 subscriber report of 100000 billed households"
            - "The station has submitted a 250-cent / 700 bp / 36-month EXPANDED_BASIC offer"
