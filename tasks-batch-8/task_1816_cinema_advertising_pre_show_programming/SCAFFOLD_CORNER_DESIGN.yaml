      - name: error_ids_exercised_by_difficulty_instances
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAMPAIGN_NOT_BOOKABLE]", "errors[ERR_RATING_PLACEMENT_VIOLATION]", "errors[ERR_SLOT_INTERVAL_OVERLAP]", "errors[ERR_MAKE_GOOD_THRESHOLD_NOT_MET]", "errors[ERR_POOL_CAPACITY_EXCEEDED]", "errors[ERR_INVOICE_NOT_CERTIFIABLE]", "errors[ERR_INVOICE_NOT_SETTLABLE]", "errors[ERR_SHOWTIME_OVERLAP]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / slot_create_requires_campaign_approved; priority_pair_validation_conflict / safety_beats_constraint_on_slot_create; resource_temporal_overlap / slot_halfopen_overlap_in_reel; boundary_precision_check / make_good_threshold_exactly_5pct_rejected; boundary_precision_check / pool_capacity_exact_fill_allowed; cross_entity_state_dependency / certify_requires_attendance_accepted; non_linear_state_machine / invoice_parallel_dimensions; resource_temporal_overlap / showtime_buffered_overlap_on_screen"
          rationale: "Each listed error id is asserted as the failure path of the cited §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: theaterops_cannot_create_advertiser
        claim_type: rbac_deny
        grounds: ["roles.TheaterOps", "roles.SalesManager", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role-tier denial: TheaterOps invoking the SalesManager-exclusive advertiser creation gets 403 ERR_FORBIDDEN_ROLE at priority 2, before any request-shape or existence work."
        test_recipe:
          setup: ["a theater exists to back the TheaterOps identity"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/advertisers", payload: { name: "Sneaky", advertiser_type: LOCAL, category: RETAIL }, as: TheaterOps, as_user_id: "${t_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "http status 403 and error_id == ERR_FORBIDDEN_ROLE; no Advertiser is created"

      - name: auditor_cannot_approve_campaign
        claim_type: rbac_deny
        grounds: ["roles.Auditor", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Auditor invoking campaign approve (SalesManager-exclusive) is denied with ERR_FORBIDDEN_ROLE even when the SoD constraint (different user) would have been satisfied."
        test_recipe:
          setup: ["campaign SUBMITTED by sm-1"]
          setup_api_calls:
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
          trigger:
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: Auditor, as_user_id: "aud-1", captures: { err: "$.data.error_id" } }
          assert:
            - "http status 403 and error_id == ERR_FORBIDDEN_ROLE; campaign stays SUBMITTED"

      - name: networkops_cannot_certify_invoice
        claim_type: rbac_deny
        grounds: ["roles.NetworkOps", "roles.Auditor", "errors[ERR_FORBIDDEN_ROLE]"]
