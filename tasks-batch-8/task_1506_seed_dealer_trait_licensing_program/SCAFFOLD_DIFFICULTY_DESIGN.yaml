            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1200}, {cutoff_at: "2026-11-15T23:59:59Z", discount_bps: 1000}, {cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}, {pay_by: "2027-02-15T23:59:59Z", discount_bps: 500}], volume_rebate_tiers: [{min_units: 500, rebate_bps: 500}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 1000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 1000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 40 }
              as: SalesRep
              captures: { ln: $.data.id }
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { pay0: $.data.payment_status, ful0: $.data.fulfillment_status }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders/${o}/prepay"
              payload: { amount_cents: 582912 }
              as: SalesRep
              captures: { pay1: $.data.payment_status, ful1: $.data.fulfillment_status }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o}", order_line_id: "${ln}", type: "DELIVERY", scheduled_date: "2027-03-10T00:00:00Z", units: 25 }
              as: SalesRep
              captures: { t1: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T12:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/delivery-tickets/${t1}/complete"
              as: SalesRep
            - call: "GET /dealer/orders/${o}"
              as: SalesRep
              captures: { pay2: $.data.payment_status, ful2: $.data.fulfillment_status }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o}", order_line_id: "${ln}", type: "PICKUP", scheduled_date: "2027-03-11T00:00:00Z", units: 15 }
              as: SalesRep
