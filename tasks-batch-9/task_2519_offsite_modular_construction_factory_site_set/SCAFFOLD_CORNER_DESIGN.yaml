# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task 2519 — Offsite Modular Construction Factory & Site Set
#
# Breadth probe over §1.1–§1.7 of the sibling SCAFFOLD.yaml, walked against
# references/claim-extraction-guide.md. Sections and claim_type values come from
# that guide only. Corners already asserted by a §1.8 instance appear as
# `excluded_because:` stubs naming that instance.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * logical clock starts at 2026-08-01T00:00:00Z, moved to 2026-09-01T08:00:00Z
#   * Factory PMP1: takt 90, 6 stations, parallel capacity 2,
#     wip_unit_value_cents 8_750_000, shift window [06:00, 24:00) UTC
#   * Project Rainier Flats: WA / SEA, planned_module_count 4, deposit 0.20,
#     retainage 0.05, crane chart 90 ft / 96_000 lb, buffer 45 min,
#     weather_exposure_limit_hours 8.0
#   * DesignEngineer eng-001 submits, eng-002 reviews
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: factory_creation_returns_declared_fields_and_envelope
        claim_type: Creation
        grounds:
          - entities.Factory
          - response_envelope
          - endpoints[POST /modular/factories]
        distinguishing_aspect: |
          A create call with only the required fields must return HTTP 201, the success envelope
          {success, data, error_id: null, message: null}, and every declared Factory field —
          including the system and defaulted ones the caller never sent.
        test_recipe:
          setup: ["empty database; the logical clock has been moved off its 2026-08-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id", ver: "$.data.version", ls: "$.data.line_state", shift: "$.data.shift_minutes_per_day", ledger: "$.data.committed_line_minutes" }
          assert:
            - "HTTP 201 with success == true, error_id == null and message == null"
            - "${ver} == 1, ${ls} == 'RUNNING', ${shift} == 1080, ${ledger} == 0"
            - "shift_start_minute_of_day == 360 and takt_minutes == 90 are echoed back"
            - "${fac} is a bare UUID with no type prefix, and created_at / updated_at are ISO 8601 UTC with three fractional digits"

      - name: project_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Project
          - endpoints[GET /modular/projects/{projectId}]
        distinguishing_aspect: |
          GET by id returns the same field values the create call reported, including the crane
          capacity chart array in the order supplied, and does not mutate version.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Factory PMP1 and Project Rainier Flats created"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 60, capacity_lb: 150000 }, { radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id" }
          trigger:
            - call: "GET /modular/projects/${proj}"
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { name: "$.data.name", phase: "$.data.phase", posture: "$.data.permit_posture", ver: "$.data.version" }
          assert:
            - "HTTP 200, ${name} == 'Rainier Flats', ${phase} == 'PRECONSTRUCTION', ${posture} == 'DUAL_BLOCKED', ${ver} == 1"
            - "crane_capacity_chart is returned as [{radius_ft: 60, capacity_lb: 150000}, {radius_ft: 90, capacity_lb: 96000}] in that order"
            - "deposit_pct == 0.2, retainage_pct == 0.05, crane_rigging_buffer_minutes == 45, weather_exposure_limit_hours == 8.0"

      - name: modules_listing_filters_and_paginates
        claim_type: Listing
        grounds:
          - entities.ModuleUnit
          - endpoints[GET /modular/modules]
        distinguishing_aspect: |
          The list endpoint must combine a filter (project_id), an ordering, and a limit/offset
          window: with three modules created in code order and limit 2 / offset 1, exactly the
          second and third rows come back, and total_count still reports 3.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project with DRAFT package and modules M-01, M-02, M-03 created in that order"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-02", set_sequence_index: 2, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-03", set_sequence_index: 3, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
          trigger:
            - call: "GET /modular/modules"
              payload: { project_id: "${proj}", limit: 2, offset: 1 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { first: "$.data[0].module_code", second: "$.data[1].module_code" }
          assert:
            - "HTTP 200 with ${first} == 'M-02' and ${second} == 'M-03' — the window skips exactly one row"
            - "the envelope reports total_count == 3 and has_more == false"
            - "GET /modular/modules with production_status=SLOTTED returns an empty data array with total_count == 0, not a 404"

      - name: design_package_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_DESIGN_PACKAGE_NOT_FOUND]
          - endpoints[GET /modular/design-packages/{packageId}]
        distinguishing_aspect: |
          A well-formed but unknown UUID must produce the entity-specific 404 error envelope, not a
          generic 400 and not an empty 200 body.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; no design package exists"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /modular/design-packages/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "${err} == 'ERR_DESIGN_PACKAGE_NOT_FOUND' with HTTP 404"
            - "success == false, data == null and ${msg} is a non-empty human-readable string"

      - name: module_create_without_gross_weight_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.ModuleUnit.fields.gross_weight_lb
          - validations[priority=3]
          - endpoints[POST /modular/modules]
        distinguishing_aspect: |
          gross_weight_lb has source input and no default, so omitting it must fail schema validation
          at priority 3 — before any existence or state check — and must not create a row.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Factory, Project and DRAFT package exist"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
          trigger:
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST' with HTTP 422"
            - "GET /modular/modules?project_id=${proj} returns an empty data array — nothing was persisted"

      - name: shipment_create_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Shipment.fields.status
          - entities.Shipment.fields.route_survey_state
          - entities.Shipment.fields.escort_confirmed
          - endpoints[POST /modular/shipments]
        distinguishing_aspect: |
          A shipment created with no load and no survey data must take every declared default at
          once: DRAFT status, NOT_REQUIRED survey state, STANDARD envelope class over an empty load,
          zero fee, zero loaded modules and escort_confirmed false.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project Rainier Flats exists"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id" }
          trigger:
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "NWHEAVY", route_state_codes: ["WA"], planned_departure_at: "2026-09-08T13:00:00Z", planned_arrival_at: "2026-09-08T21:00:00Z" }
              as: TransportCoordinator
              captures: { st: "$.data.status", rs: "$.data.route_survey_state", cls: "$.data.max_envelope_class", fee: "$.data.permit_fee_cents", cnt: "$.data.loaded_module_count", esc: "$.data.escort_confirmed" }
          assert:
            - "HTTP 201 with ${st} == 'DRAFT', ${rs} == 'NOT_REQUIRED', ${cls} == 'STANDARD', ${fee} == 0, ${cnt} == 0, ${esc} == false"
            - "escort_required == false, survey_completed_at == null, permit_expires_at == null, dispatched_at == null, delivered_at == null"

      - name: shipment_permit_fee_is_computed_and_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Shipment.fields.permit_fee_cents
          - entities.Shipment.fields.max_envelope_class
          - calculations.shipment_permit_fee_and_escort
          - endpoints[POST /modular/shipments]
        distinguishing_aspect: |
          permit_fee_cents, escort_required, loaded_module_count and max_envelope_class are
          source: computed and are not in the create endpoint's input list, so values supplied by a
          client must be ignored rather than stored — the empty load prices at 0 regardless.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project Rainier Flats exists"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id" }
          trigger:
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "NWHEAVY", route_state_codes: ["WA", "OR"], planned_departure_at: "2026-09-08T13:00:00Z", planned_arrival_at: "2026-09-08T21:00:00Z", permit_fee_cents: 999999, max_envelope_class: "SUPERLOAD", loaded_module_count: 7 }
              as: TransportCoordinator
              captures: { fee: "$.data.permit_fee_cents", cls: "$.data.max_envelope_class", cnt: "$.data.loaded_module_count" }
          assert:
            - "${fee} == 0, ${cls} == 'STANDARD' and ${cnt} == 0 — every computed field is derived, never accepted from the payload"
            - "escort_required == false even though the caller claimed SUPERLOAD"

      - name: factory_system_fields_are_server_minted_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Factory
          - endpoints[POST /modular/factories]
        distinguishing_aspect: |
          id, created_at, updated_at, version, line_state and committed_line_minutes are server
          controlled; a payload attempting to seed them must not affect the stored row, and id must
          not be the client-supplied string.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000, id: "fac_seeded_by_client", version: 42, committed_line_minutes: 5000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id", ver: "$.data.version", ledger: "$.data.committed_line_minutes" }
          assert:
            - "${fac} != 'fac_seeded_by_client' and is a bare UUID"
            - "${ver} == 1 and ${ledger} == 0 — the seeded values are ignored"
            - "created_at == updated_at on the freshly created row"

      - name: agency_accreditation_state_rejects_undeclared_enum_value
        claim_type: Type Constraints
        grounds:
          - entities.InspectionAgency.fields.accreditation_state
          - validations[priority=3]
          - endpoints[POST /modular/agencies]
        distinguishing_aspect: |
          accreditation_state is constrained to ACCREDITED | PROBATION | SUSPENDED; a plausible but
          undeclared value such as REVOKED must be refused at priority 3 rather than stored or
          silently coerced to the default.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/agencies"
              payload: { name: "Cascade Inspection Services", agency_code: "CIS", accredited_state_codes: ["WA"], per_inspection_fee_cents: 120000, accreditation_state: "REVOKED" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST' with HTTP 422"
            - "GET /modular/agencies?agency_code=CIS returns an empty data array"

      - name: project_planned_module_count_below_one_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Project.fields.planned_module_count
          - validations[priority=3]
          - endpoints[POST /modular/projects]
        distinguishing_aspect: |
          Numeric range constraints are enforced on input, not merely documented: planned_module_count
          is declared >= 1, so 0 must be refused even though every downstream calculation would
          tolerate it arithmetically.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Factory PMP1 exists"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
          trigger:
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 0, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST' with HTTP 422"

      - name: module_create_with_design_package_of_another_project_is_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[priority=88]
          - errors[ERR_CROSS_AGGREGATE_MISMATCH]
          - endpoints[POST /modular/modules]
        distinguishing_aspect: |
          Both foreign keys resolve to stored rows, so existence passes; the failure is purely
          relational — the referenced DesignPackage belongs to a different Project. A NOT_FOUND
          response would be wrong here.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; two projects at the same factory, each with its own DRAFT package"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { projA: "$.data.id", projAv: "$.data.version" }
            - call: "POST /modular/projects"
              payload: { name: "Cedar Court", factory_id: "${fac}", state_code: "WA", ahj_code: "TAC", planned_module_count: 4, contract_price_cents: 2800000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { projB: "$.data.id", projBv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${projB}", revision_index: 1, module_split_count: 4, expected_project_version: "${projBv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkgB: "$.data.id" }
          trigger:
            - call: "POST /modular/modules"
              payload: { project_id: "${projA}", design_package_id: "${pkgB}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_CROSS_AGGREGATE_MISMATCH' with HTTP 422 — not ERR_DESIGN_PACKAGE_NOT_FOUND, because ${pkgB} does exist"
            - "GET /modular/modules?project_id=${projA} returns an empty data array"

      - name: permit_create_with_unknown_project_returns_project_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PROJECT_NOT_FOUND]
          - endpoints[POST /modular/permits]
        distinguishing_aspect: |
          Existence of the parent is checked at priority 5, ahead of every business rule, so an
          unknown project_id yields 404 even though the payload is otherwise valid.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; no project exists"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/permits"
              payload: { project_id: "c1f4b8d2-7e35-4a60-9b11-5d3ac0e77f44", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_PROJECT_NOT_FOUND' with HTTP 404"

      - name: graph_topology_defect_claim_joins_module_and_inspection_record
        claim_type: graph
        grounds:
          - entities.DefectClaim.fields.module_id
          - entities.DefectClaim.fields.inspection_id
          - validations[priority=88]
          - endpoints[POST /modular/defect-claims]
        distinguishing_aspect: |
          The entity topology is a graph, and DefectClaim is the junction that joins a ModuleUnit to
          an InspectionRecord. Cross-reference integrity must hold on the diagonal: an inspection
          record belonging to a DIFFERENT module must be refused, while the matching pair links.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN package, APPROVED plan review, agency CIS ACCREDITED in WA"
            - "modules M-01 and M-02 both LINE_COMPLETE; an IN_PLANT inspection record exists for M-02 only"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
