              payload: { finalized_at_utc: "2026-08-10T16:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "GET /compliance/bookings/${bk_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_ver: "$.data.version" }
          trigger:
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bk_id}", basis: "FARE", issuance_mode: "PROACTIVE", expected_booking_version: "${bk_ver}", flight_segment_id: "${seg1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { ob_id: "$.data.id" }
            - call: "POST /compliance/refund-obligations/${ob_id}/void"
              payload: { void_reason: "CREATED_IN_ERROR" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
          assert:
            - "the trigger's first call returned 201 with headroom_at_creation_cents == 60000 and amount_cents == 60000 — the 77500 DENIED_BOARDING row consumed none of the headroom"
            - "RefundObligation.${ob_id}.settlement_status == VOIDED and RefundObligation.${ob_id}.void_reason == CREATED_IN_ERROR"
            - "GET /compliance/bookings/${bk_id}/refund-exposure returns obligated_total_cents == 77500"
            - "GET /compliance/bookings/${bk_id}/refund-exposure returns remaining_headroom_cents == 60000"
            - "GET /compliance/bookings/${bk_id}/refund-exposure returns collected_total_cents == 60000"
            - "Booking.${bk_id}.total_refund_obligated_cents == 77500"

      - name: regulator_metrics_closed_window_includes_the_period_end_instant
        claim_type: correct_result
        grounds: ["calculations.regulator_report_metrics.input_set", "endpoints.POST /compliance/regulator-reports/{id}/submit"]
        distinguishing_aspect: "A complaint received at exactly 2026-08-31T23:59:59Z counts (the window is inclusive on both ends) while one received at 2026-09-01T00:00:00Z neither counts nor blocks the submit, even though it is still RECEIVED."
        test_recipe:
          setup:
            - "PolicyProfile with one booking; complaint A received exactly at the period end and answered; complaint B received one second later, left RECEIVED."
            - "DRAFT report for 2026-08-01T00:00:00Z .. 2026-08-31T23:59:59Z."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bk_id}", category: "REFUND", channel: "EMAIL", received_at_utc: "2026-08-31T23:59:59Z", summary: "In-window complaint." }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { cmp_a: "$.data.id" }
            - call: "POST /compliance/consumer-complaints/${cmp_a}/acknowledge"
              payload: { acknowledged_at_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /compliance/consumer-complaints/${cmp_a}/answer"
              payload: { disposition: "POLICY_EXPLAINED", answered_at_utc: "2026-09-01T01:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bk_id}", category: "BAGGAGE", channel: "EMAIL", received_at_utc: "2026-09-01T00:00:00Z", summary: "Out-of-window complaint." }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { cmp_b: "$.data.id" }
            - call: "GET /compliance/policy-profiles/${pol_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_ver: "$.data.version" }
            - call: "POST /compliance/regulator-reports"
              payload: { policy_profile_id: "${pol_id}", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-08-31T23:59:59Z", expected_policy_profile_version: "${pol_ver}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/regulator-reports/${rep_id}/submit"
              payload: { submitted_at_utc: "2026-09-02T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
          assert:
            - "HTTP 200 — complaint ${cmp_b} is outside the period, so ERR_OPEN_COMPLAINT_IN_PERIOD does not fire"
            - "RegulatorReport.${rep_id}.status == SUBMITTED"
            - "RegulatorReport.${rep_id}.complaint_count == 1"
            - "RegulatorReport.${rep_id}.disability_complaint_count == 0 and RegulatorReport.${rep_id}.late_answer_count == 0"
            - "RegulatorReport.${rep_id}.tarmac_violation_count == 0 and RegulatorReport.${rep_id}.involuntary_denied_boarding_count == 0"
            - "RegulatorReport.${rep_id}.refund_obligation_cents_total == 0 and RegulatorReport.${rep_id}.overdue_refund_count == 0"
            - "RegulatorReport.${rep_id}.policy_version_pinned == 2"
            - "ConsumerComplaint.${cmp_b}.status == RECEIVED"

      - name: tiered_denied_boarding_ladder_boundaries
        claim_type: tiered_pricing
        excluded_because:
