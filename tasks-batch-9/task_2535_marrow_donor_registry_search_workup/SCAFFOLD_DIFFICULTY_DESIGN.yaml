# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2535 - Marrow Donor Registry Search & Workup
#
# Fixture conventions shared by every instance below:
#   * the logical clock starts at its mandated default 2026-08-01T00:00:00Z;
#     any instance that needs a different instant calls POST /_clock/set_current_utc
#   * opaque operator ids: "tc-1" (TransplantCoordinator), "md-1" / "md-2"
#     (MedicalDirector, deliberately distinct for the segregation-of-duties rule),
#     "ops-1" (RegistryOperations)
#   * entity-backed roles pass the entity id: DonorRegistryLiaison -> Registry.id,
#     CollectionCenterOps -> CollectionCenter.id
#   * every monetary / score literal in `assert:` was produced by executing the
#     §1.3 formulas with their `constants:` (see the worked examples in §1.3)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: preliminary_vs_confirmed_match_score_diverges_on_match_candidate
        grounds:
          - calculations.match_probability_score
          - entities.MatchCandidate.fields.preliminary_score
          - entities.MatchCandidate.fields.confirmed_score
          - entities.MatchCandidate.fields.confirmed_match_grade
          - entities.DonorProfile.fields.ambiguous_loci
          - state_machines.MatchCandidate.TYPING_REQUESTED_to_TYPING_RESPONDED
        distinguishing_aspect: |
          This dual-variant pair lives in the HLA-matching domain on MatchCandidate: the PRELIMINARY
          variant compares the donor's ambiguous locus C at antigen level AND subtracts a 3.5 ambiguity
          penalty, while the CONFIRMED variant compares all five loci at allele level with no penalty,
          so identical donor data yields 94.75 versus 98.25 on the same row.
        test_recipe:
          setup:
            - "one domestic registry (USD, fx 1.0000, ct_response_deadline_hours 168) with one donor D1 aged 27, CMV POSITIVE, ambiguous_loci [\"C\"]"
            - "one patient whose allele-level typing matches D1 fully at A, B, C and DRB1 and half at DQB1"
            - "a DOMESTIC_ONLY search that materialized D1 as the rank-1 PRIMARY candidate"
            - "clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id", pool_size: "$.data.match_pool_size" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id", mc1_prelim: "$.data[0].preliminary_score" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id" }
          trigger:
            - call: "POST /registry/typing-requests/${ct1_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
          assert:
            - "MatchCandidate.${mc1_id}.preliminary_score == 94.75"
            - "MatchCandidate.${mc1_id}.confirmed_score == 98.25"
            - "MatchCandidate.${mc1_id}.confirmed_score - MatchCandidate.${mc1_id}.preliminary_score == 3.50 (exactly the AMBIGUITY_PENALTY_PER_LOCUS of the single ambiguous locus)"
            - "MatchCandidate.${mc1_id}.confirmed_match_grade == \"9/10\""
            - "MatchCandidate.${mc1_id}.status == TYPING_RESPONDED"
            - "ConfirmatoryTypingRequest.${ct1_id}.status == RESPONDED"

      - name: provisional_vs_final_reimbursement_claim_diverges_on_claim
        grounds:
          - calculations.reimbursement_claim_amount
          - entities.ReimbursementClaim.fields.variant_applied
          - entities.ReimbursementClaim.fields.volume_discount_pct
          - entities.ReimbursementClaim.fields.total_usd_cents
          - state_machines.ReimbursementClaim.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          This dual-variant pair lives in the cost-accounting domain on ReimbursementClaim, a different
          entity domain from the HLA-matching pair: the PROVISIONAL variant must assume PBSC and a
          6-day donor window because no method exists at claim creation, while the FINAL variant reads
          the case's authorized MARROW method and 8-day window, producing 2072000 versus 2532700 cents
          and crossing the 2500000-cent volume-discount tier that the provisional total never reached.
        test_recipe:
          setup:
            - "the full domestic happy path of donor D1 driven to an INFUSED patient with collection_method MARROW"
            - "clock walked 2026-08-01 -> 2026-09-11T08:00Z (clearance) -> 2026-10-05T09:00Z (conditioning start) -> 2026-10-11T14:00Z (collection) -> 2026-10-12T09:00Z (delivery)"
            - "conditioning_start_date 2026-10-05, so the only legal collection dates are 2026-10-11..2026-10-13"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Metro Apheresis Center", country_code: "US", concurrent_collection_capacity: 1 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ctr_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id" }
            - call: "POST /registry/typing-requests/${ct1_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/workup-cases"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { wc_id: "$.data.id" }
            - call: "GET /registry/reimbursement-claims"
              payload: { workup_case_id: "${wc_id}" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { clm_id: "$.data[0].id", clm_prov_total: "$.data[0].total_usd_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "GET /registry/workup-cases/${wc_id}/clearance-items"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { ci_phys: "$.data[0].id", ci_idm: "$.data[1].id", ci_consent: "$.data[2].id" }
            - call: "POST /registry/clearance-items/${ci_phys}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /registry/clearance-items/${ci_idm}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /registry/clearance-items/${ci_consent}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /registry/workup-cases/${wc_id}/collection-method"
              payload: { method: "MARROW", rationale: "Recipient weight and marrow-preferred protocol" }
              as: MedicalDirector
              as_user_id: "md-2"
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_ver1: "$.data.version" }
            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "SCHEDULE", conditioning_start_date: "2026-10-05", expected_patient_version: "${p_ver1}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
            - call: "GET /registry/workup-cases/${wc_id}"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { wc_ver1: "$.data.version" }
            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}", collection_center_id: "${ctr_id}", start_at: "2026-10-11T08:00:00Z", expected_workup_case_version: "${wc_ver1}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk_id: "$.data.id" }
            - call: "POST /registry/collection-bookings/${bk_id}/confirm"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T09:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { p_ver2: "$.data.version" }
            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "START", expected_patient_version: "${p_ver2}" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T14:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/collection-bookings/${bk_id}/shipments"
              payload: { collected_cd34_e6_per_kg: 5.20, collected_volume_ml: 280.0, courier_reference: "AWB-77120" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { sh_id: "$.data.id" }
            - call: "POST /registry/shipments/${sh_id}/events"
              payload: { event_type: "DEPARTED" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-12T09:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/shipments/${sh_id}/events"
              payload: { event_type: "DELIVERED" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { p_ver3: "$.data.version" }
            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "INFUSE", expected_patient_version: "${p_ver3}" }
              as: MedicalDirector
              as_user_id: "md-1"
          trigger:
            - call: "POST /registry/reimbursement-claims/${clm_id}/finalize"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
          assert:
            - "the PROVISIONAL claim captured before finalize had total_usd_cents == 2072000 with volume_discount_pct == 0"
            - "ReimbursementClaim.${clm_id}.variant_applied == FINAL"
            - "ReimbursementClaim.${clm_id}.line_items == [{CT_TYPING,34500},{WORKUP_PHYSICAL,78000},{IDM_PANEL,52500},{COLLECTION,1980000},{COURIER,265000},{DONOR_LOST_WAGE,256000},{CANCELLATION,0}]"
            - "ReimbursementClaim.${clm_id}.subtotal_usd_cents == 2666000"
            - "ReimbursementClaim.${clm_id}.volume_discount_pct == 0.05"
            - "ReimbursementClaim.${clm_id}.discount_usd_cents == 133300"
            - "ReimbursementClaim.${clm_id}.intl_coordination_fee_usd_cents == 0"
            - "ReimbursementClaim.${clm_id}.total_usd_cents == 2532700"
            - "ReimbursementClaim.${clm_id}.billed_amount_local_cents == 2532700"
            - "Patient.${p_id}.committed_cost_cents == 2532700"

  - rule_id: combinatorial_formula
    instances:
      - name: candidate_rank_score_combines_three_clamped_factors_mode_a
        grounds:
          - calculations.candidate_rank_score
          - calculations.candidate_pool_materialization
          - entities.MatchCandidate.fields.rank_score
          - entities.MatchCandidate.fields.rank_position
          - entities.MatchCandidate.fields.candidate_role
          - entities.SearchRequest.fields.backup_candidate_count
        distinguishing_aspect: |
          Mode (a): a single output combines four independent inputs (preliminary_score, donor age,
          registry domesticity/tier, prior_donation_count) non-linearly - an absolute-difference age
          curve clamped by nested min/max, a three-branch logistics factor whose international branch
          is itself a min() cap, then a weighted sum rounded half-up at 3 decimals. Two of the three
          expected values (97.1125 -> 97.113 and 65.5435 -> 65.544) land exactly on the half-up
          boundary, so truncation or banker's rounding is visible in the ranking output.
        test_recipe:
          setup:
            - "one domestic registry (tier 1, fx 1.0000) and one international registry (DE/EUR, cooperation_tier 2, fx 1.0850)"
            - "three donors: D1 domestic age 27 CMV POSITIVE prior 0 ambiguous [\"C\"]; D2 international age 41 CMV NEGATIVE prior 1 ambiguous [\"DQB1\"]; D3 domestic age 55 CMV POSITIVE prior 0 no ambiguity"
            - "one patient, then one DOMESTIC_AND_INTERNATIONAL search that materializes all three"
            - "clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/registries"
              payload: { code: "ZKRD-DE", name: "German Bone Marrow Donor Registry", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_intl_id}", donor_code: "D-0002", age_years: 41, sex: "M", weight_kg: 84.0, cmv_status: "NEGATIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "11:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06", "02"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["DQB1"], prior_donation_count: 1 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_intl_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], ambiguous_loci: [], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_AND_INTERNATIONAL" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
          assert:
            - "SearchRequest.${sr_id}.match_pool_size == 3"
            - "SearchRequest.${sr_id}.backup_candidate_count == 2"
            - "SearchRequest.${sr_id}.min_preliminary_score == 60.00 (MIN_PRELIM_SCORE_DEFAULT applied because the field was omitted)"
            - "the D1 candidate has preliminary_score 94.75, rank_score 97.113 (= 0.55*94.75 + 0.25*100 + 0.20*100 = 97.1125 rounded half-up), rank_position 1, candidate_role PRIMARY"
            - "the D2 candidate has preliminary_score 86.58, rank_score 76.869 (= 0.55*86.58 + 0.25*65 + 0.20*min(70, 55+5*2)), rank_position 2, candidate_role BACKUP"
            - "the D3 candidate has preliminary_score 69.17, rank_score 65.544 (= 0.55*69.17 + 0.25*max(0, 100-2.5*28) + 0.20*100 = 65.5435 rounded half-up), rank_position 3, candidate_role BACKUP"
            - "GET /registry/match-candidates?search_request_id=${sr_id} returns the three rows ordered D1, D2, D3 by rank_score DESC"
            - "every candidate has status IDENTIFIED and confirmed_score null"

      - name: reimbursement_total_requires_pinned_discount_then_fee_order_mode_c
        grounds:
          - calculations.reimbursement_claim_amount
          - entities.ReimbursementClaim.fields.volume_discount_pct
          - entities.ReimbursementClaim.fields.intl_coordination_fee_usd_cents
          - entities.ReimbursementClaim.fields.total_usd_cents
          - entities.ReimbursementClaim.fields.billed_amount_local_cents
        distinguishing_aspect: |
          Mode (c): the three amounts look mutually dependent - the discount tier is keyed on the
          subtotal, the international coordination fee is charged on the post-discount base, and the
          total is subtotal - discount + fee - so an implementation that keys the tier on the total
          (fee included) or charges the fee on the raw subtotal produces a different number from the
          same inputs. The pinned order is (1) round each line, (2) sum, (3) select tier from the
          subtotal, (4) round the discount, (5) charge the fee on subtotal - discount, (6) add.
          Both intermediate roundings (137937.5 -> 137938 and 209664.96 -> 209665) plus the local-
          currency division 2830477 / 1.0850 -> 2608735 are half-up boundary cases.
        test_recipe:
          setup:
            - "one international registry only (DE/EUR, fx_rate_to_usd 1.0850, cooperation_tier 2), donor D2 aged 41 registered under it"
            - "the international donor driven all the way to an INFUSED patient with collection_method MARROW (planned_window_days 8)"
            - "clock walked 2026-08-01 -> 2026-09-11T08:00Z -> 2026-10-05T09:00Z -> 2026-10-11T14:00Z -> 2026-10-12T09:00Z"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "ZKRD-DE", name: "German Bone Marrow Donor Registry", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Rhein Harvest Center", country_code: "DE", concurrent_collection_capacity: 1 }
              as: RegistryOperations
