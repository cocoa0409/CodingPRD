      - name: draft_report_marked_stale_on_new_incident_in_period
        claim_type: derived_field_reconciliation
        grounds: [entities.RegulatoryReport.fields.needs_regeneration, calculations.regulatory_compliance_snapshot]
        distinguishing_aspect: "Derived-field reconciliation: a DRAFT report's snapshot is stale the moment a new incident's response_clock_started_at lands in its period; regenerate clears the flag and recounts. A SUBMITTED report is NOT marked stale (frozen snapshot)."
        test_recipe:
          setup: ["T1; DRAFT report covering the day; then a new call creates an incident in-period"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/regulatory-reports"
              payload: { territory_id: "${terr_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Z15", caller_phone: "555-0239", address_line: "15 Stale St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "GET /gas-ops/regulatory-reports/${rep_id}"
              payload: {}
              as: Supervisor
              captures: { stale_flag: "$.data.needs_regeneration" }
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/regenerate"
              payload: {}
              as: Supervisor
            - call: "GET /gas-ops/regulatory-reports/${rep_id}"
              payload: {}
              as: Supervisor
          assert:
            - "At creation the DRAFT report had incident_count == 0 and determined_count == 0"
            - "After the new incident: stale_flag == true (snapshot still shows the old counts)"
            - "Submit while stale would fail with ERR_REPORT_NOT_DRAFT — instead regenerate: needs_regeneration == false, regeneration_count == 1, incident_count == 1"

      - name: submit_frozen_report_not_marked_stale
        claim_type: derived_field_reconciliation
        grounds: [entities.RegulatoryReport.fields.needs_regeneration, state_machines.RegulatoryReport.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Version-pinning on approval: once SUBMITTED the snapshot is frozen — later incident changes must NOT set needs_regeneration on the submitted report."
        test_recipe:
          setup: ["T1; DRAFT report generated and submitted; then a new incident lands in the period"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/regulatory-reports"
              payload: { territory_id: "${terr_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
              captures: { rep_id: "$.data.id" }
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/submit"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Z16", caller_phone: "555-0240", address_line: "16 Frozen St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
            - call: "GET /gas-ops/regulatory-reports/${rep_id}"
              payload: {}
              as: Supervisor
          assert:
            - "RegulatoryReport.${rep_id}.status == SUBMITTED"
            - "needs_regeneration == false (frozen at submit; new incident flows into the next regeneration cycle only for DRAFT/REJECTED reports)"
            - "incident_count still == 0 (snapshot unchanged)"

      - name: cascade_claims_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.GasIncident, state_machines.ResponsibilityDetermination]
        excluded_because:
          difficulty_instance: duplicate_call_priority_escalation_cascade
          rationale: "Depth-3 cascade claims (call -> incident -> notification/report-stale) are asserted hop-by-hop in the §1.8 instance; the determination cascade is covered by responsibility_finalization_work_order_budget_cascade."

      - name: dual_variant_claims_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.response_elapsed_time, calculations.repair_cost_final]
        excluded_because:
          difficulty_instance: response_elapsed_raw_vs_adjusted_variants
          rationale: "Both dual-variant domains (incident timing, work-order costing) are asserted with literal divergent values in §1.8."

