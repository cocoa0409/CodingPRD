      - name: dispenser_efficacy_lockout_and_recovery_close_the_active_locked_active_loop
        claim_type: cyclic
        grounds:
          - state_machines.Dispenser.dispenser_status.ACTIVE_to_LOCKED_OUT
          - state_machines.Dispenser.dispenser_status.LOCKED_OUT_to_ACTIVE
          - validations.efficacy_failure_must_be_resolved
          - calculations.sanitizer_efficacy_verdict
        distinguishing_aspect: |
          The dispenser walks ACTIVE -> LOCKED_OUT -> ACTIVE inside a single visit, and the loop is
          closed only by the declared recovery path: a later PASS record on the SAME dispenser plus a
          VERIFIED audit. The failing record has drift_pct 0.00, so the FAIL verdict can only come from
          branch 1 of concentration_drift_verdict (efficacy FAIL wins before any drift threshold is
          consulted) - a contact-time breach, not a concentration breach. In between, submit is refused
          with ERR_EFFICACY_FAILURE_UNRESOLVED while a new calibration record is still accepted,
          because lockout_reason EFFICACY_FAILURE is the one clearable lockout.
