              captures: { t2_avail: "$.data.available_covers", t2_exp: "$.data.exposed "}
          assert:
            - "InjuryEvent.${inj}.status == COVERED (link 0)"
            - "CastMember.${p1}.status == ON_LEAVE (link 1)"
            - "CoverageAssignment.${cov1}.status == ACTIVATED (link 2)"
            - "CoverageAssignment.${cov2}.status == SUSPENDED (link 1b: own coverage suspended by the ON_LEAVE mutation)"
            - "CharacterTrack.${t1}.available_covers == 0 and exposed == true (link 3)"
            - "CharacterTrack.${t2}.available_covers == 0 and exposed == true (link 2b->3b)"

      - name: tech_fail_certification_revocation_cascade
        grounds:
          - state_machines.TechRiderCheck.PASS_to_FAIL
          - state_machines.Stop.compliance_status
          - state_machines.Stop.READY_to_ADVANCED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (check re-measurement, not injury):
          actual_value below required -> check FAIL (link 1) -> stop.compliance_status
          NON_COMPLIANT which itself drags booking_status READY->ADVANCED (link 2); the
