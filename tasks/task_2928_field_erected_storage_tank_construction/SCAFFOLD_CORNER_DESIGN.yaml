            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Gary Works", heat_number: "H-4471", thickness_in: 0.4375, plate_count: 10, plate_weight_lb: 1250.5, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lot_id: $.data.id }
            - call: "POST /plate-lots/${lot_id}/status-transitions"
              payload: { target_status: "ROLLED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_id}/status-transitions"
              payload: { target_status: "SHIPPED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_id}/status-transitions"
              payload: { target_status: "RECEIVED", mtr_number: "MTR-4471-A" }
              as: ErectionSuperintendent
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 9000, specified_prep_standard: "SSPC_SP6", specified_min_dft_mils: 8.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "acrylic 3 coat" }
              as: ProjectEngineer
              captures: { ca_id: $.data.id }
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r1: $.data.id }
            - call: "POST /nde-reports/${r1}/result"
              payload: { decision: "REJECT", indication_count: 3, film_count: 4, defect_type: "SLAG_INCLUSION" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s2}", method: "RT", window_start_utc: "2026-08-11T14:00:00Z", window_end_utc: "2026-08-11T15:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r2: $.data.id }
            - call: "POST /nde-reports/${r2}/result"
              payload: { decision: "REJECT", indication_count: 2, film_count: 4, defect_type: "POROSITY" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s3}", method: "RT", window_start_utc: "2026-08-11T18:00:00Z", window_end_utc: "2026-08-11T19:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r3: $.data.id }
            - call: "POST /nde-reports/${r3}/result"
              payload: { decision: "REJECT", indication_count: 1, film_count: 4, defect_type: "CRACK" }
              as: QcInspector
              as_user_id: "qc-1"
          trigger:
            - call: "POST /shell-courses/${c2}/fitup"
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_id}/allocations"
              payload: { shell_course_id: "${c2}", allocated_weight_lb: 8000 }
              as: ErectionSuperintendent
            - call: "POST /coating-applications/${ca_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 2.5, dew_point_spread_f: 9.0 }
              as: QcInspector
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 99.900 }, { point_index: 2, elevation_in: 99.900 }, { point_index: 3, elevation_in: 99.900 }, { point_index: 4, elevation_in: 99.900 }, { point_index: 5, elevation_in: 99.900 }, { point_index: 6, elevation_in: 99.900 }, { point_index: 7, elevation_in: 99.900 }, { point_index: 8, elevation_in: 99.900 } ] }
              as: CivilContractor
            - call: "POST /nde-reports/${r3}/void"
              payload: { void_reason: "film mislabelled - wrong seam radiographed" }
              as: AuthorizedInspector
              as_user_id: "ai-2"
            - call: "POST /shell-courses/${c2}/fitup"
              as: ErectionSuperintendent
          assert:
            - "the three rejections walk the posture ladder: after r1 quality_posture == 'RESTRICTED' with open_nonconformance_count == 1, after r2 still 'RESTRICTED' with 2, after r3 'FROZEN' with 3"
            - "the fitup on the untouched course ${c2} returns HTTP 409 ERR_TANK_POSTURE_FROZEN and the course stays 'SPECIFIED'"
            - "the allocation returns HTTP 409 ERR_TANK_POSTURE_FROZEN even though the lot is RECEIVED, the course is UNALLOCATED and 8000.00 lb is within the lot's 12505.00 lb - priority 23 outranks the allocation state check at 12 and the weight check at 52"
            - "the coating surface-prep returns HTTP 409 ERR_TANK_POSTURE_FROZEN, not ERR_SURFACE_PREP_DEFICIENT: SSPC_SP10 is cleaner than the specified SSPC_SP6 and would have passed"
            - "the settlement survey is still accepted with HTTP 201 while the tank is FROZEN, with survey_role == 'MONITORING', uniform_settlement_in == 0.100 and verdict == 'WITHIN_TOLERANCE' - surveys, examination results, NDE voids and welder qualification actions are the whitelisted operations that can clear a freeze"
            - "the void returns HTTP 200, drops open_nonconformance_count to 2 and thaws quality_posture to 'RESTRICTED'; WeldSeam.${s3}.status returns to 'WELDED'"
            - "the identical fitup on ${c2} now returns HTTP 200 with status == 'FITTED': RESTRICTED permits production work, and only hydrotest approval, fill advance, commissioning submission and commissioning review require an OPEN tank"

      - name: clean_holiday_test_over_a_failed_dft_is_rejected
        claim_type: evidence_gate_rejection
        grounds:
          - validations.priority_30_ERR_DFT_NOT_PASSED
          - state_machines.CoatingApplication.transitions.DFT_RECORDED_to_ACCEPTED
        distinguishing_aspect: |
          A perfect holiday test cannot launder a failed film-thickness measurement: zero
          holidays is accepted only when dft_verdict is PASS, while a holiday count of one or
          more is always accepted as a finding. So the same endpoint refuses the good news
          and records the bad news, which is the opposite of the usual polarity.
        test_recipe:
          setup:
            - "Tank TK-101 with an EXTERNAL_COATING application specified at 10.0 mils under SPOT_AVERAGE_80_120, prepared and then measured at a single spot of 6.0 / 6.0 / 6.0 mils, so dft_verdict is FAIL."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 9000, specified_prep_standard: "SSPC_SP6", specified_min_dft_mils: 10.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "acrylic 3 coat" }
              as: ProjectEngineer
              captures: { ca_id: $.data.id }
            - call: "POST /coating-applications/${ca_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP6", profile_mils: 2.5, dew_point_spread_f: 9.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/dft-readings"
              payload: { spot_readings: [ [ 6.0, 6.0, 6.0 ] ] }
              as: QcInspector
          trigger:
            - call: "POST /coating-applications/${ca_id}/holiday-test"
              payload: { holidays_found: 0, test_voltage_v: 200 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/holiday-test"
              payload: { holidays_found: 2, test_voltage_v: 200 }
              as: QcInspector
          assert:
            - "before the triggers CoatingApplication.${ca_id}.status == 'DFT_RECORDED' with spot_count == 1, computed_spot_average_min_mils == 6.00, computed_overall_average_mils == 6.00 and dft_verdict == 'FAIL' (6.00 is below the 80 percent floor of 8.00)"
            - "the zero-holiday call returns HTTP 409 ERR_DFT_NOT_PASSED and leaves the application in DFT_RECORDED with holidays_found == null"
            - "no voltage rule interferes: the scope is EXTERNAL_COATING, so the 67.5 V per mil floor - which would have demanded 675 V - does not apply and 200 V is acceptable"
            - "the two-holiday call on the identical application returns HTTP 200 with status == 'REWORK_REQUIRED', holidays_found == 2 and holiday_test_voltage_v == 200: a finding is always recordable"
            - "the rework opens one nonconformance, so Tank.${tank_id}.open_nonconformance_count == 1 and quality_posture == 'RESTRICTED'; construction_phase stays 'DESIGN_REGISTERED' because the tank was never COATED"

      - name: installing_an_already_installed_appurtenance_is_rejected
        claim_type: terminal_state_rejection
        grounds:
          - validations.priority_21_ERR_APPURTENANCE_STATE_INVALID
          - state_machines.Appurtenance.terminal_states
        distinguishing_aspect: |
          INSTALLED is terminal, so the repeat call is refused rather than treated as an
          idempotent re-record - which also means installed_at_utc, the stamp the clearance
          re-check and the commissioning gate both read, can never be silently overwritten by
          a second crew entry.
        test_recipe:
          setup:
            - "Tank TK-101 with course 1 RT_ACCEPTED (single seam V1 welded and radiographed) and one DESIGNED 6 in nozzle at azimuth 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
