      - name: cell_contact_cap_sliding_window
        grounds:
          - calculations.invitation_dispatch_gates
          - errors[ERR_CELL_CONTACT_CAP_REACHED]
        distinguishing_aspect: |
          Aggregate sliding-window capacity semantics on the PanelCell resource
          (distinct from the pairwise panelist buffer): a 4th send into a cell holding
          3 sends inside the trailing 7-day window is rejected, still rejected at
          exactly +7d (window lower bound inclusive), and allowed at +7d+1h.
