  - rule_id: transitive_cascade
    instances:
      - name: discharge_five_hop_chain_converts_the_plan_and_retires_the_catheter
        grounds:
          - state_machines.Procedure.clinical_status.RECOVERY_to_DISCHARGED
          - state_machines.Referral.SCHEDULED_to_COMPLETED
          - state_machines.VascularAccess.MATURING_to_IN_USE
          - state_machines.AccessConversionPlan.ACTIVE_to_CONVERTED
          - state_machines.VascularAccess.IN_USE_to_ABANDONED
          - entities.Patient.fields.access_count
        distinguishing_aspect: |
          One discharge call propagates through five distinct entities in a fixed order:
          DeviceUsage (RESERVED -> CONSUMED) -> Referral (SCHEDULED -> COMPLETED) ->
          VascularAccess target (MATURING -> IN_USE) -> AccessConversionPlan (ACTIVE ->
          CONVERTED) -> VascularAccess from_access (IN_USE -> ABANDONED). Hops 4 and 5 are
          conditional on state that was itself only reached through the ACTIVE <->
          MATURATION_HOLD loop, so the chain fires only because a failing check was followed by a
          passing one. This is the conversion-planning chain; the other transitive_cascade
          instance is the facility-posture chain and shares no hop with it.
