        claim_type: violation_to_error
        grounds: ["errors[ERR_TASK_NOT_ADVANCEABLE]"]
        distinguishing_aspect: "Skipping IN_PROGRESS (advance PENDING -> DONE) and advancing a DONE task are both rejected."
        test_recipe:
          setup: ["Season PLANNING; task T PENDING"]
          setup_api_calls:
