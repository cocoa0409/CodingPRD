            - { call: "POST /fleet/mechanics/${m1}/certifications", payload: { cert_type: "PM_INSPECTION", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "PM1B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: MaintenanceSupervisor, captures: { bv2: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "PM_C", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 8, estimated_cost_cents: 52000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 8 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/buses/${b}/pm-status", payload: {}, as: FleetManager, captures: { sa: $.data.miles_since_pm_a, sb: $.data.miles_since_pm_b, sc: $.data.miles_since_pm_c, due: $.data.pm_due_status } }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { la: $.data.last_pm_a_miles, lb: $.data.last_pm_b_miles, lc: $.data.last_pm_c_miles } }
          assert:
            - "After PM_C close: last_pm_a_miles == last_pm_b_miles == last_pm_c_miles == 36000"
            - "miles_since_pm_a == miles_since_pm_b == miles_since_pm_c == 0 and pm_due_status == CURRENT"

      - name: warranty_claim_snapshot_ignores_post_submit_core_credit
        claim_type: reconciliation
        grounds:
          - calculations.warranty_claim_amount
          - calculations.core_exchange_credit
        distinguishing_aspect: "Evaluation-order pin (mode c): a core credit posted AFTER the claim's SUBMIT reduces WorkOrder.parts_net_cents but must NOT change the claim's pinned claimed_cents (31500); the snapshot is immutable once submitted."
        test_recipe:
          setup: ["Bus inside base warranty; CLOSED CORRECTIVE WO with a REBUILDABLE_CORE warranty-eligible line (unit 25000, core 10000) CONSUMED and 1h labor; core still CORE_PENDING; auto claim SUBMITTED with claimed 31500"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "WS1", vin: "VINWS1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-WS1", description: "Alternator", part_class: "REBUILDABLE_CORE", unit_cost_cents: 25000, reorder_point: 0, initial_on_hand: 3, warranty_eligible: true, core_charge_cents: 10000 }, as: PartsClerk, captures: { p: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "WS1A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "WS1B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 31500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 1 }, as: PartsClerk, captures: { ln: $.data.id } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CONSUME" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/work-orders/${wo}/warranty-claims", payload: {}, as: WarrantyClerk, captures: { claim: "$.data[0].id" } }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "SUBMIT" }, as: WarrantyClerk, as_user_id: "clerk-9", captures: { pinned: $.data.claimed_cents, elig: $.data.eligible_cents } }
          trigger:
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CORE_RETURN", core_condition: "GOOD" }, as: PartsClerk }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: WarrantyClerk, captures: { pnet: $.data.parts_net_cents, cred: $.data.core_credits_cents } }
            - { call: "GET /fleet/warranty-claims/${claim}", payload: {}, as: WarrantyClerk, captures: { after: $.data.claimed_cents } }
          assert:
            - "At SUBMIT: eligible_cents == 31500 (25000 parts + 6500 labor, zero core credits so far), claimed_cents == 31500 (BASE_OEM fraction 1)"
            - "After the on-time core credit: WO core_credits_cents == 10000 and parts_net_cents == 21500"
            - "Claim claimed_cents still == 31500 (snapshot pinned at SUBMIT; later core credit does not retroactively reduce the claim)"

  # ------------------------------------------------------------- validations ---
  - section: validations
    instances:
      - name: posture_yellow_blocks_elective_but_allows_routine
        claim_type: conditional_validation
        grounds:
          - validations[priority=27]
          - calculations.fleet_posture
        distinguishing_aspect: "Conditional posture gate: at ratio 1/6 = 0.1667 (YELLOW band [0.15,0.20)) an ELECTIVE create fails with ERR_FLEET_POSTURE_YELLOW while the same create at ROUTINE priority succeeds."
        test_recipe:
          setup: ["Six ACTIVE buses; SAFETY_CRITICAL defects hold five (available 1/6 -> YELLOW)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y1", vin: "VINY1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y2", vin: "VINY2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y3", vin: "VINY3", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b3: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y4", vin: "VINY4", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b4: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y5", vin: "VINY5", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b5: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y6", vin: "VINY6", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b6: $.data.id, bv6: $.data.version } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b1}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h1", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b2}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h2", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b3}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h3", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b4}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h4", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b5}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h5", odometer_at_report: 10000 }, as: Operator }
          trigger:
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b6}", wo_type: "CORRECTIVE", priority: "ELECTIVE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv6}" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b6}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv6}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id, wst: $.data.status } }
          assert:
            - "ELECTIVE create rejected: err == ERR_FLEET_POSTURE_YELLOW (409)"
            - "ROUTINE create succeeds at YELLOW: 201, status DRAFT (only ELECTIVE is gated at YELLOW)"

      - name: posture_constraint_beats_fiscal_overhaul_cap
        claim_type: priority_conflict
        grounds:
          - validations[priority=28]
          - validations[priority=43]
        distinguishing_aspect: "Dual-failure ordering across bands: at RED posture an OVERHAUL create that ALSO exceeds the 40% cost cap must surface ERR_FLEET_POSTURE_RED (constraint p28), not ERR_OVERHAUL_COST_CAP_EXCEEDED (fiscal p43)."
        test_recipe:
          setup: ["Single ACTIVE bus held by a SAFETY_CRITICAL defect (ratio 0/1 -> RED)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y7", vin: "VINY7", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "hold", odometer_at_report: 10000 }, as: Operator }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: MaintenanceSupervisor, captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "OVERHAUL", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_labor_hours: 40, estimated_cost_cents: 99999999, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
          assert: ["err == ERR_FLEET_POSTURE_RED (not ERR_OVERHAUL_COST_CAP_EXCEEDED)", "HTTP 409"]

      - name: safety_deferral_rule_beats_temporal_window
        claim_type: priority_conflict
        grounds:
          - validations[priority=14]
          - validations[priority=24]
        distinguishing_aspect: "A SAFETY_CRITICAL deferral to clock+1 day sits inside the generic MAJOR/MINOR date windows yet must fail the safety-specific rule first: ERR_DEFECT_NOT_DEFERRABLE (p14), not ERR_DEFER_DATE_INVALID (p24)."
        test_recipe:
          setup: ["SAFETY_CRITICAL defect OPEN; clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y8", vin: "VINY8", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "fade", odometer_at_report: 10000 }, as: Operator, captures: { d: $.data.id } }
          trigger:
            - { call: "POST /fleet/defect-reports/${d}/events", payload: { event_type: "TRIAGE", disposition: "DEFER", defer_until_date: "2026-08-02", defer_justification: "overnight only" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
          assert: ["err == ERR_DEFECT_NOT_DEFERRABLE (422)", "Defect remains OPEN; SAFETY hold persists on the bus"]

      - name: odometer_regression_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_ODOMETER_REGRESSION]
        distinguishing_aspect: "odometer_end equal to the current bus odometer (not strictly greater) is already a regression; 500 against 500 fails."
        test_recipe:
          setup: ["Bus with initial odometer 500"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y9", vin: "VINY9", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 500, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-08-01", odometer_end: 500, fuel_gallons: 40 }, as: Operator, captures: { err: $.data.error_id } }
          assert: ["err == ERR_ODOMETER_REGRESSION (422)", "Bus odometer remains 500"]

      - name: log_date_in_future_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_LOG_DATE_IN_FUTURE]
        distinguishing_aspect: "log_date 2026-08-02 is after the logical-clock date 2026-08-01; rejected before odometer checks mutate anything."
        test_recipe:
          setup: ["Bus with initial odometer 100"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y10", vin: "VINY10", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-08-02", odometer_end: 900, fuel_gallons: 40 }, as: Operator, captures: { err: $.data.error_id } }
          assert: ["err == ERR_LOG_DATE_IN_FUTURE (422)"]

      - name: pm_policy_non_nested_intervals_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=42]
          - errors[ERR_PM_POLICY_INVALID]
        distinguishing_aspect: "Level B 7000 is not a multiple of level A 6000; interval nesting validation rejects the policy."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/pm-policies", payload: { level_a_interval_miles: 6000, level_b_interval_miles: 7000, level_c_interval_miles: 36000, tolerance_miles: 500, calendar_interval_days: 180 }, as: FleetManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_PM_POLICY_INVALID (422)", "No policy persisted (GET /fleet/pm-policies empty)"]

      - name: warranty_base_claim_outside_warranty_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors[ERR_WARRANTY_NOT_ELIGIBLE]
        distinguishing_aspect: "BASE_OEM claim against a WO whose bus was past base warranty at open (odometer_at_open 200000 > 100000) fails the eligibility gate with ERR_WARRANTY_NOT_ELIGIBLE."
        test_recipe:
          setup: ["Bus past base warranty; CLOSED labor-only CORRECTIVE WO (no auto claim created)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y11", vin: "VINY11", model_year: 2020, in_service_date: "2025-01-01", initial_odometer_miles: 200000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2026-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "Y11A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "Y11B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: WarrantyClerk, captures: { wov: $.data.version } }
          trigger:
            - { call: "POST /fleet/warranty-claims", payload: { work_order_id: "${wo}", claim_type: "BASE_OEM", expected_work_order_version: "${wov}" }, as: WarrantyClerk, captures: { err: $.data.error_id } }
          assert: ["err == ERR_WARRANTY_NOT_ELIGIBLE (422)"]

      - name: recovery_exceeding_approved_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors[ERR_RECOVERY_EXCEEDS_APPROVED]
        distinguishing_aspect: "Posting received_cents 17000 against approved_cents 16500 violates the fiscal cap even though the claim is APPROVED and the caller is a FleetManager."
        test_recipe:
          setup: ["APPROVED claim for 16500 (auto claim on closed WO: part 10000 + labor 6500, base warranty)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y12", vin: "VINY12", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-Y12", description: "Pump", part_class: "CONSUMABLE", unit_cost_cents: 10000, reorder_point: 0, initial_on_hand: 3, warranty_eligible: true }, as: PartsClerk, captures: { p: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "Y12A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "Y12B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 16500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 1 }, as: PartsClerk, captures: { ln: $.data.id } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CONSUME" }, as: Mechanic, as_user_id: "${m1}" }
