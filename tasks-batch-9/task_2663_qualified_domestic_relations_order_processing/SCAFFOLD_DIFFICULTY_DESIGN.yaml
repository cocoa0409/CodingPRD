      - name: append_only_tax_ledger_nets_to_zero_after_void
        grounds:
          - calculations.tax_report_net_position
          - calculations.ap_account_derived_totals
          - calculations.distribution_settlement
          - entities.TaxReport.fields.correction_of_tax_report_id
          - entities.TaxReport.fields.reportable_taxable_cents
          - state_machines.Distribution
          - endpoints[POST /distributions/{id}/void]
        distinguishing_aspect: |
          The 1099-R ledger is append-only, so a void must not mutate or delete the original line: it
          appends a NEGATED line whose correction_of_tax_report_id points back, and the two lines net to
          zero in every signed column while the original still reports its full +1034709 taxable and
          +206942 withheld. Meanwhile the alternate payee's own balances are compensated by
          RECOMPUTATION over the ISSUED set only — balance_cents back to 1648001, after_tax_basis_cents
          back to 24000 (not 8709, and not 24000 minus anything), total_distributed_gross_cents back to 0
          — which is a different mechanism from the ledger's negation. The compensation must be exact
          enough that an identical distribution issued afterwards reproduces the original figures cent for
          cent, including the basis-recovery denominator; if the void restored the balance but not the
          basis pool, the replay's basis_recovery_cents would drift away from 15291.
        test_recipe:
          setup:
            - "The Conservation-Plan fixture above, carried as far as the qualification of case 1: an ESTABLISHED SEPARATE_INTEREST AlternatePayeeAccount with balance_cents 1648001, after_tax_basis_cents 24000, total_distributed_gross_cents 0 and version 1."
            - "The payee's date of birth is 1981-07-05, so the age-59.5 threshold falls on 2041-01-05 and every CASH row is coded CODE_2."
