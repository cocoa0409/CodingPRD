        test_recipe:
          setup: ["membership with end_date 2026-08-10; clock advanced to 2026-08-20; sweep expires it"]
          setup_api_calls:
            - { call: "POST /memberships", payload: { member_name: "M X", member_email: "mx@x.org", tier: "BASIC", end_date: "2026-08-10" }, as: ShopCoordinator, captures: { m: $.data.id } }
