              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { q_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Quinn", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "QA" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { qa_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Sven", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "SENIOR" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
            - call: "POST /moderation/reviewers/${r2_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r2_v}" }
