            - "second activate response error_id == ERR_ENTITLEMENT_EXCEEDED   # consumed 5 + 1 == 6 > 5, rejected"

      - name: trueup_empty_install_set_zero_count
        grounds:
          - calculations.true_up_position
          - entities.TrueUpReconciliation.fields.total_consumed_units
