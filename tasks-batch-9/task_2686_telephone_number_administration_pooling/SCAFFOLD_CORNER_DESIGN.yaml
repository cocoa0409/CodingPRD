  - section: consistency model
    instances:
      - name: filing_submission_recomputes_the_rate_center_aggregate_in_the_same_write
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.filing_utilization_pct", "calculations.rate_center_aggregate_utilization_pct", "endpoints[POST /numbering/utilization-filings/{filing_id}/submissions]"]
        distinguishing_aspect: "The consistency claim across an entity boundary: one submission must recompute both the filing's own two percentages and the parent rate center's pooled aggregate before the response returns, with no refresh endpoint and no deferred recomputation anywhere in the API surface. A read issued immediately after the write already sees 65.00 on the rate center, and the rate center's version has advanced in the same write."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED in OH. NPA 614 / rate center COLUMBUS holds exactly two blocks, 614-554-0 and 614-554-1, both loaded to carrier A as activated legacy holdings, so A is a qualifying holder for the aggregate. A DRAFT 2026-H1 filing exists for A with numbers_assigned 1200, numbers_intermediate 100, blocks_held_at_period_end 2 and nothing administrative or aging, so the denominator is 2000, the claimed numerator is 1300 and the strict numerator is 1200."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, contaminated_count: 0, holder_carrier_id: "${a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 1, contaminated_count: 0, holder_carrier_id: "${a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 1200, numbers_intermediate: 100, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 2, forecast_quarters: [3000, 3000, 0, 0] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { f_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { st: "$.data.status" }
          assert:
            - "HTTP 200 and the write's own response body already carries status == \"SUBMITTED\", submitted_at == \"2026-08-01T00:00:00Z\", claimed_utilization_pct == 65.00 and strict_utilization_pct == 60.00, with audited_utilization_pct still null"
            - "GET /numbering/rate-centers/${rc_id} issued right after reads aggregate_utilization_pct == 65.00 - pooled over the single qualifying holder, rounded once - with assigned_block_count == 2 and available_block_count == 0"
            - "GET /numbering/utilization-filings/${f_id} returns byte-identical percentages to the write response, so nothing was settled after the fact"
            - "GET /numbering/utilization-filings?carrier_id=${a_id}&status=SUBMITTED reads total_count == 1"

      - name: audit_acceptance_settles_filing_carrier_and_request_in_one_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /numbering/audit-findings/{finding_id}/dispositions]", "state_machines.UtilizationFiling.transitions.UNDER_AUDIT_to_REJECTED", "calculations.audit_penalty_action", "entities.AllocationRequest.fields.info_request_count"]
        distinguishing_aspect: "Immediate consistency across four entities touched by a single disposition - finding, filing, carrier and the carrier's open allocation request - where the last hop is reached only through a computed penalty. The trap is treating the probation cascade as a follow-up administrative step: the request must already read INFO_REQUESTED on the very next call, while the rate center's pending_request_count must NOT move, because INFO_REQUESTED is still an open status."
        test_recipe:
          setup: ["Carrier A licensed and VERIFIED in OH. NPA 614 / rate center COLUMBUS with five unassigned blocks 614-554-0..4. A's 2026-H1 filing claims 80.00 (1600 assigned, blocks_held 2, forecast 3000/3000/0/0) and is SUBMITTED. A then files a GROWTH request for one block, which sits PENDING_REVIEW with info_request_count 0 and pins pending_request_count at 1. admin-1 opens an OVERSTATED_UTILIZATION finding adjusting assigned to 1500, a 5.00-point overstatement whose computed penalty_action is PROBATION."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 1, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 2, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 3, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 4, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 1600, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 2, forecast_quarters: [3000, 3000, 0, 0] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { f_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: NumberingAdministrator
              captures: { rc_v: "$.data.version" }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "growth filed before the audit lands", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { req_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings/${f_id}/audit-findings"
              payload: { finding_type: "OVERSTATED_UTILIZATION", adjusted_numbers_assigned: 1500, adjusted_numbers_administrative: 0, disposition_note: "reserved numbers stripped out" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
              captures: { finding_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/audit-findings/${finding_id}/dispositions"
              payload: { disposition: "ACCEPT", disposition_note: "finding stands" }
              as: RegulatoryApprover
              as_user_id: "approver-1"
              captures: { fst: "$.data.status" }
          assert:
            - "HTTP 200 and the response body already reads status == \"ACCEPTED\", penalty_action == \"PROBATION\", adjusted_utilization_pct == 75.00 and disposed_by_user_id == \"approver-1\""
            - "GET /numbering/utilization-filings/${f_id} reads status == \"REJECTED\" with audited_utilization_pct == 75.00 and claimed_utilization_pct == 80.00 left intact"
            - "GET /numbering/carriers/${a_id} reads eligibility_status == \"PROBATION\" and probation_until == \"2027-01-28T00:00:00Z\" with reclamation_strike_count == 0 - PROBATION carries no strike"
            - "GET /numbering/allocation-requests/${req_id} reads status == \"INFO_REQUESTED\" and info_request_count == 1 - the cascade landed inside the disposition, not on a later poll"
            - "GET /numbering/rate-centers/${rc_id} still reads pending_request_count == 1, because INFO_REQUESTED is an open status, and available_block_count == 5 - no inventory moved"

      - name: block_load_recomputes_rate_center_and_npa_posture_before_responding
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /numbering/blocks]", "calculations.npa_exhaust_posture", "state_machines.NPA.transitions.ACTIVE_to_JEOPARDY", "entities.RateCenter.fields.accepts_initial_requests"]
        distinguishing_aspect: "Immediate consistency for a threshold-driven system transition rather than an actor-driven one: creating inventory recomputes counters two levels up, and the count of one available block is already inside the jeopardy band, so the NPA must read JEOPARDY and every rate center under it must read accepts_initial_requests false on the next call - with no jeopardy-declaration endpoint ever invoked. The write response for the second block also shows its own derived stamps rather than a pre-cascade snapshot."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED in OH. NPA 614 is ACTIVE with zero blocks; it has two rate centers, COLUMBUS and DUBLIN, both NON_POOLED with jeopardy_flag false and accepts_initial_requests true. Nothing else exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "DUBLIN", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc2_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
              captures: { blk0_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 1, contaminated_count: 0, holder_carrier_id: "${a_id}", mark_activated: true }
              as: NumberingAdministrator
              captures: { blk1_id: "$.data.id" }
          assert:
            - "the first call is HTTP 201 with data.block_label == \"614-554-0\", allocation_status == \"POOL_AVAILABLE\", routing_status == \"UNROUTED\", is_pooling_eligible == true and holder_carrier_id == null"
            - "the second call is HTTP 201 and its own body already reads allocation_status == \"ASSIGNED\", holder_carrier_id == \"${a_id}\", assigned_at == \"2026-08-01T00:00:00Z\", activation_due_at == \"2027-01-28T00:00:00Z\" and activated_at == \"2026-08-01T00:00:00Z\""
            - "GET /numbering/npas/${npa_id} reads total_block_count == 2, available_block_count == 1, status == \"JEOPARDY\" and jeopardy_declared_at == \"2026-08-01T00:00:00Z\" - the threshold transition fired inside the block writes"
            - "GET /numbering/rate-centers/${rc_id} reads available_block_count == 1, assigned_block_count == 1, jeopardy_flag == true and accepts_initial_requests == false"
            - "GET /numbering/rate-centers/${rc2_id} - the sibling rate center that holds nothing - also reads jeopardy_flag == true and accepts_initial_requests == false, so the cascade reached every child in the same write"
            - "GET /numbering/carriers/${a_id} reads blocks_held_count == 1"
