scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_heloc_with_all_required_fields_returns_201
        claim_type: Creation
        grounds: [entities.Heloc, endpoints]
        distinguishing_aspect: "POST /helocs with all required fields returns 201 and status APPLICATION, current_balance_cents 0."
        test_recipe:
          setup: ["A CLEARED borrower and a property exist."]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { full_name: "C One", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "C1", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "SECOND", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
          assert:
            - "Heloc.${hl_id}.status == APPLICATION"
            - "Heloc.${hl_id}.current_balance_cents == 0"
            - "Heloc.${hl_id}.version == 1"

      - name: get_heloc_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Heloc, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /helocs/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /helocs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: create_borrower_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Borrower, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /borrowers missing credit_score is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /borrowers"
              payload: { full_name: "No Score", annual_income_cents: 50000000 }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422)"

      - name: borrower_credit_score_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Borrower.fields.credit_score, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "credit_score 900 (> 850) is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /borrowers"
              payload: { full_name: "Bad Score", annual_income_cents: 50000000, credit_score: 900, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422)"

      - name: heloc_credit_limit_below_floor_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Heloc.fields.credit_limit_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "credit_limit_cents 50000 (< 100000 floor) is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A borrower and property exist."]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { full_name: "C Floor", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "CF", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422)"

      - name: borrower_default_kyc_status_pending_applied
        claim_type: Defaults
        grounds: [entities.Borrower.fields.kyc_status]
        distinguishing_aspect: "Omitting kyc_status yields default PENDING on the created Borrower."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /borrowers"
              payload: { full_name: "Def KYC", annual_income_cents: 50000000, credit_score: 750 }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
          assert:
            - "Borrower.${bor_id}.kyc_status == PENDING"
            - "Borrower.${bor_id}.monthly_debt_obligation_cents == 0"

      - name: heloc_id_and_system_fields_server_minted
        claim_type: System Fields
        grounds: [entities.Heloc.fields.current_apr_bps]
        distinguishing_aspect: "current_apr_bps is computed (0 in APPLICATION) regardless of any client input; id/created_at server-minted."
        test_recipe:
          setup: ["A borrower and property exist."]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { full_name: "Sys", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "SY", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
          assert:
            - "Heloc.${hl_id}.current_apr_bps == 0  # not set until activation"
            - "Heloc.${hl_id}.created_at is a server ISO8601 timestamp"

      - name: list_helocs_pagination_envelope
        claim_type: Listing
        grounds: [entities.Heloc, endpoints]
        distinguishing_aspect: "GET /helocs returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["At least one borrower, property, and heloc exist."]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { full_name: "L", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "L1", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
          trigger:
            - call: "GET /helocs?status=APPLICATION"
              payload: {}
              as: LoanOfficer
          assert:
            - "response meta.total_count >= 1"
            - "response has_more is present and boolean"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_heloc_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Heloc.APPLICATION_to_DRAW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a heloc already in DRAW returns ERR_INVALID_STATE (409); no second LienRecord created."
        test_recipe:
          setup: ["Heloc activated to DRAW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "S One", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "S1", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
          trigger:
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: new_heloc_initial_state_application
        claim_type: Initial State
        grounds: [state_machines.Heloc]
        distinguishing_aspect: "A freshly created Heloc starts in status APPLICATION."
        test_recipe:
          setup: ["A borrower and property exist."]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { full_name: "Init", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "IN", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
          assert:
            - "Heloc.${hl_id}.status == APPLICATION"

      - name: convert_to_repayment_after_draw_period_elapsed_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Heloc.DRAW_to_REPAYMENT, entities.Heloc.fields.available_credit_cents]
        distinguishing_aspect: "At clock 2036-01-01 (== draw-end), convert-to-repayment succeeds: status REPAYMENT, available_credit_cents 0."
        test_recipe:
          setup: ["Heloc DRAW, origination 2026-01-01, draw_period 10y; clock advanced to 2036-01-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "Conv", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "CV", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z", draw_period_years: 10 }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2036-01-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/convert-to-repayment"
              payload: {}
              as: LoanServicer
              captures: { st: $.data.status }
          assert:
            - "Heloc.${hl_id}.status == REPAYMENT"
            - "Heloc.${hl_id}.available_credit_cents == 0"

      - name: terminal_closed_heloc_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Heloc.DRAW_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED heloc rejects freeze with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Heloc closed from DRAW after draw-end (no early fee); balance 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2036-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "Term", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "TM", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z", draw_period_years: 10 }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/close"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/freeze"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: unfreeze_blocked_while_covenant_breached
        claim_type: guarded transitions
        grounds: [state_machines.Heloc.FROZEN_to_DRAW]
        distinguishing_aspect: "FROZEN->DRAW unfreeze is rejected ERR_INVALID_STATE-class while a covenant remains BREACHED; the cross-entity guard blocks the cure path."
        test_recipe:
          setup: ["Heloc FROZEN via MAX_CLTV breach (cltv 9000 > 8500), covenant still BREACHED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "Unf", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "UF", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 95000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 8500 }
              as: LoanOfficer
              captures: { cov: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 90000000 }
              as: LoanServicer
            - call: "POST /helocs/${hl_id}/covenants/${cov}/evaluate"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/unfreeze"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)  # breached covenant blocks unfreeze"
            - "Heloc.${hl_id}.status == FROZEN"

      - name: draw_reverse_already_reversed_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Draw.BOOKED_to_REVERSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reversing an already-REVERSED draw a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Heloc DRAW with one BOOKED draw 200000 already reversed once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "Rev2", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "RV", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 200000 }
              as: LoanServicer
              captures: { draw_id: $.data.id }
            - call: "POST /helocs/${hl_id}/draws/${draw_id}/reverse"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/draws/${draw_id}/reverse"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: fee_settled_via_payment_waterfall_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.FeeAssessment.OUTSTANDING_to_SETTLED, calculations.annual_fee_assessment]
        distinguishing_aspect: "An ANNUAL fee 5000 assessed at the 1-year anniversary is SETTLED once a payment's waterfall fee bucket covers it."
        test_recipe:
          setup: ["Heloc DRAW; advance clock to 2027-01-01 (1 anniversary) -> ANNUAL fee 5000 OUTSTANDING; balance 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "Fee", annual_income_cents: 50000000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "FE", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, annual_fee_cents: 5000, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
