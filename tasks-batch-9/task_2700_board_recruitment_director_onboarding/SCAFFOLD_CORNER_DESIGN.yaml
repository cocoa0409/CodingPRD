          rationale: "Both sides of the max_public_boards_default boundary, on two different endpoints, are asserted there."

      - name: empty_input_set_denominators_are_exercised_on_both_percentage_calculations
        claim_type: input_set_filtering
        grounds:
          - calculations.slate_independence_pct
          - calculations.skills_gap_analysis
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_set_denominator_boundaries_gap_index_and_slate_independence_pct
          rationale: "The zero-denominator fallbacks of board_gap_index and independent_nominee_pct are asserted there against the same empty database."

      - name: onboarding_rollup_correct_result_is_exercised_by_the_seating_gate
        claim_type: correct_result
        grounds:
          - calculations.director_onboarding_rollup
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / seating_a_director_requires_every_required_onboarding_item_complete
          rationale: "The rollup's percentages and its NOT_STARTED / IN_PROGRESS / COMPLETE branches are asserted there as the seating precondition moves."

      - name: committee_seat_ledger_correct_result_is_exercised_by_the_conserved_count
        claim_type: correct_result
        grounds:
          - calculations.committee_seat_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / committee_seat_ledger_returns_to_its_pre_activation_value_after_revocations
          rationale: "filled_seats and the derived posture are asserted before, during and after every activation and revocation there."

  - section: validations
    instances:
      - name: slate_independence_exactly_at_the_floor_passes_submit_for_review
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_65.ERR_INDEPENDENCE_SHORTFALL
          - calculations.slate_independence_pct
          - endpoints.POST_/governance/slates/{slate_id}/submit-for-review
        distinguishing_aspect: |
          The shortfall comparison is strictly less than the policy floor, so two independent nominees out of
          three - round_half_up(100 * 2 / 3) == 66.67 against the 66.67 default - satisfies the rule and the
          slate reaches COMMITTEE_REVIEW with independence_shortfall false. An implementation using > instead
          of >= rejects a compliant slate.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with the default independence_min_pct 66.67."
            - "Three SEATED incumbent directors appointed 2021-01-01, two of them is_independent true and one false."
            - "A DRAFT slate for cycle 2026 with seat_count 9 carrying all three as nominees."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Indy One", email: "indy1@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { ind1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Indy Two", email: "indy2@issuer.example", birth_date: "1969-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { ind2_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Manny Management", email: "manny@issuer.example", birth_date: "1970-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_management: true, is_independent: false }
              as: CorporateSecretary
              captures: { mgmt_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${ind1_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom1_id: $.data.id }
            - call: "GET /governance/slates/${slate_id}"
              payload: {}
              as: GovernanceStaff
              captures: { slate_v2: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 2, incumbent_director_id: "${ind2_id}", expected_slate_version: "${slate_v2}" }
              as: GovernanceStaff
              captures: { nom2_id: $.data.id }
            - call: "GET /governance/slates/${slate_id}"
              payload: {}
              as: GovernanceStaff
              captures: { slate_v3: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 3, incumbent_director_id: "${mgmt_id}", expected_slate_version: "${slate_v3}" }
              as: GovernanceStaff
              captures: { nom3_id: $.data.id }
          trigger:
            - call: "POST /governance/slates/${slate_id}/submit-for-review"
              payload: {}
              as: GovernanceStaff
          assert:
            - "HTTP 200 with NominationSlate.${slate_id}.status == \"COMMITTEE_REVIEW\""
            - "NominationSlate.${slate_id}.nominee_count == 3, independent_nominee_count == 2, independent_nominee_pct == 66.67"
            - "NominationSlate.${slate_id}.independence_shortfall == false and no \"ERR_INDEPENDENCE_SHORTFALL\" is returned"
            - "NominationSlate.${slate_id}.contested == false and universal_proxy_applicable == false (no UNIVERSAL_PROXY_NOMINATION nominee)"
            - "SlateNominee.${nom3_id}.is_independent == false, copied from the incumbent director"

      - name: tenure_and_retirement_age_guidelines_each_reject_their_own_incumbent
        claim_type: violation_to_error
        grounds:
          - validations.priority_52.ERR_TENURE_LIMIT_EXCEEDED
          - validations.priority_52.ERR_RETIREMENT_AGE_EXCEEDED
          - entities.GovernancePolicy.fields.max_tenure_years
          - entities.GovernancePolicy.fields.mandatory_retirement_age
        distinguishing_aspect: |
          Both guidelines are at-or-above tests measured at the nomination cycle start (2026-01-01): a
          director appointed 2011-01-01 has exactly 15 completed years against max_tenure_years 15 and is
          refused with ERR_TENURE_LIMIT_EXCEEDED, while a director born 1951-01-01 is exactly 75 against
          mandatory_retirement_age 75 and is refused with ERR_RETIREMENT_AGE_EXCEEDED. Neither rejection
          consumes the slate version.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with the default max_tenure_years 15 and mandatory_retirement_age 75."
            - "One SEATED director appointed 2011-01-01 born 1970-01-01 (15 years of service, age 56) and one SEATED director appointed 2022-01-01 born 1951-01-01 (4 years of service, age 75)."
            - "A DRAFT slate for cycle 2026 with seat_count 9 and no nominees."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Terry Tenure", email: "terry@issuer.example", birth_date: "1970-01-01", appointed_on: "2011-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { tenure_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Rita Retire", email: "rita@issuer.example", birth_date: "1951-01-01", appointed_on: "2022-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { retire_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
          trigger:
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${tenure_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { tenure_error_id: $.data.error_id }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${retire_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { retire_error_id: $.data.error_id }
          assert:
            - "The first call returns HTTP 422 with data.error_id == \"ERR_TENURE_LIMIT_EXCEEDED\""
            - "The second call returns HTTP 422 with data.error_id == \"ERR_RETIREMENT_AGE_EXCEEDED\""
            - "NominationSlate.${slate_id}.nominee_count == 0 and version is still ${slate_v1} after both rejections"
            - "Both directors keep service_status \"SEATED\" - a refused nomination does not change the incumbent"

      - name: an_all_independent_committee_refuses_a_non_independent_assignment
        claim_type: violation_to_error
        grounds:
          - validations.priority_52.ERR_COMMITTEE_INDEPENDENCE_REQUIRED
          - entities.Committee.fields.requires_all_independent
          - endpoints.POST_/governance/committees/{committee_id}/assignments
        distinguishing_aspect: |
          The rule is conditional on the committee's own flag: the same non-independent director is refused
          with 422 ERR_COMMITTEE_INDEPENDENCE_REQUIRED by an AUDIT committee with requires_all_independent
          true and accepted by a FINANCE committee with the flag false, so an implementation that hardcodes
          the check for every committee fails the second call.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "One SEATED non-independent management director."
            - "An AUDIT committee with requires_all_independent true and a FINANCE committee with the flag left at its default false."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Manny Management", email: "manny@issuer.example", birth_date: "1970-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_management: true, is_independent: false }
              as: CorporateSecretary
              captures: { mgmt_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1, requires_all_independent: true }
              as: CorporateSecretary
              captures: { audit_id: $.data.id, audit_v1: $.data.version }
            - call: "POST /governance/committees"
              payload: { code: "FINANCE", name: "Finance Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { fin_id: $.data.id, fin_v1: $.data.version }
          trigger:
            - call: "POST /governance/committees/${audit_id}/assignments"
              payload: { director_id: "${mgmt_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${audit_v1}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { independence_error_id: $.data.error_id }
            - call: "POST /governance/committees/${fin_id}/assignments"
              payload: { director_id: "${mgmt_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${fin_v1}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { fin_assignment_id: $.data.id }
          assert:
            - "The AUDIT call returns HTTP 422 with data.error_id == \"ERR_COMMITTEE_INDEPENDENCE_REQUIRED\""
            - "Committee.${audit_id}.version is still ${audit_v1} and filled_seats == 0"
            - "The FINANCE call returns HTTP 201 with CommitteeAssignment.${fin_assignment_id}.status == \"PROPOSED\""
            - "Committee.${fin_id}.filled_seats == 0 (a PROPOSED assignment occupies no seat) and status == \"UNDER_STRENGTH\""

      - name: a_candidate_below_the_readiness_floor_cannot_be_nominated
        claim_type: violation_to_error
        grounds:
          - validations.priority_65.ERR_READINESS_BELOW_THRESHOLD
          - calculations.candidate_readiness_score
          - entities.GovernancePolicy.fields.readiness_min_score
        distinguishing_aspect: |
          A universal-proxy candidate with one COMPLETED interview scored 1 scores
          8.00 + 30.00 + 5.00 + 10.00 == 53.00, below the 60.00 default floor, so the nomination is refused
          with 422 ERR_READINESS_BELOW_THRESHOLD even though the candidate is SLATE_ELIGIBLE and fully
          screened. The candidate's own state is untouched by the refusal.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with min_completed_interviews 1 and the default readiness_min_score 60.00."
            - "One SEATED chair director and one SEATED interviewer director."
            - "One UNIVERSAL_PROXY_NOMINATION candidate driven to SLATE_ELIGIBLE with a clean screen, one COMPLETED interview scored 1, a clean reference check and conflict clearance."
