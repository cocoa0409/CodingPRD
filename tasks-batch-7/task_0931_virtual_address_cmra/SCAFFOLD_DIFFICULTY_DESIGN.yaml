              payload: {}
              as: CmraOperator
          assert:
            - "before the trigger call, ForwardShipment.${ship_id}.base_price_cents == 11550"
            - "before the trigger call, ForwardShipment.${ship_id}.consolidation_discount_cents == 1733"
            - "before the trigger call, ForwardShipment.${ship_id}.total_price_cents == 9817"
            - "ForwardShipment.${ship_id}.status == CANCELLED"
            - "ForwardShipment.${ship_id}.item_count == 0"
            - "MailItem.${mi_a}.forward_shipment_id == null"
            - "MailItem.${mi_b}.forward_shipment_id == null"
            - "MailItem.${mi_c}.forward_shipment_id == null"
            - "MailItem.${mi_a}.handling_status == PENDING_DISPOSITION"
            - "MailItem.${mi_a}.storage_status == FREE_WINDOW"
            - "GET /boxes/${box_id}/summary returns items_in_custody 3, items_released 0, items_destroyed 0"
            - "the box has zero UsageLedgerEntry rows with unit_type FORWARD"
