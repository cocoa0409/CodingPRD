# =============================================================================
# Mobile Health Screening & Wellness Events — benchmark seed tables (v1)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  527. Mobile Health Screening & Wellness Events (mobile mammography style):
  employer/event scheduling & route, participant registration & consent,
  screening type & results delivery, abnormal-result follow-up & navigation,
  billing (insurance/self-pay/grant), unit/equipment & staff roster, reminder
  & no-show, sponsor reporting

domain_name: mobile-screening
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity Profile (§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration        # participant lifecycle: register → consent → screen → result → follow-up/navigation, with billing branch
  secondary_archetype: temporal_windowing          # event route slots + mobile-unit day occupation must not overlap
  complexity_layers:
    - optimistic_concurrency                        # OCC on Event.version for slot booking races and on Charge.version for adjudication
    - cascading_side_effects                        # result -> follow-up -> navigation; event cancel -> appointments -> charges -> reminders
    - dual_variant_calculation                      # provisional vs finalized patient responsibility; estimated vs actual grant burn
    - rate_threshold_triggers                       # no-show strike threshold flips participant to BLOCKED; grant depletion threshold

  entity_topology: flat                             # peer entities linked by FK; filtered-list GETs for reverse-reachability (§1.5)
  state_machine_shape: branching                    # Appointment forks by result (NORMAL vs ABNORMAL) into divergent side-effect sets
  relationship_patterns:
    - one_to_many
    - cross_aggregate                               # Charge references Appointment + Participant + fund source; Referral references Appointment
  role_model: peer_roles                            # ProgramManager, ClinicalStaff, BillingClerk, PatientNavigator, SponsorViewer own different resource types
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration / roster ---
  - name: MobileUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mobile unit label, e.g. 'Van A'" }
      - { name: modality, type: enum, source: input, description: "Screening modality this unit is equipped for: MAMMOGRAPHY | BLOOD_PANEL | BONE_DENSITY | SKIN" }
      - { name: daily_capacity, type: integer, source: input, description: "Max appointment slots the unit can serve per event-day (>= 1)" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RETIRED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: role_type, type: enum, source: input, description: "TECHNOLOGIST | RADIOLOGIST | NAVIGATOR | PHLEBOTOMIST" }
      - { name: modality, type: enum, source: input, description: "Modality this staff member is credentialed for: MAMMOGRAPHY | BLOOD_PANEL | BONE_DENSITY | SKIN" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsoring employer or grant body" }
      - { name: sponsor_type, type: enum, source: input, description: "EMPLOYER | GRANT" }
      - { name: viewer_user_id, type: string, source: input, description: "Opaque X-User-ID of the SponsorViewer permitted to read this sponsor's reports" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; the GRANT-type sponsor funding this grant" }
      - { name: name, type: string, source: input, description: "Grant program name" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total funding pool in cents (>= 0)" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of grant_covered_cents over Charges in COMMITTED or SETTLED state drawing this grant" }
      - { name: settled_cents, type: integer, source: computed, default: 0, description: "Sum of grant_covered_cents over Charges in SETTLED state drawing this grant" }
      - { name: remaining_cents, type: integer, source: computed, description: "= total_budget_cents - committed_cents (available headroom for new commitments)" }
      - { name: is_depleted, type: boolean, source: computed, default: false, description: "True when remaining_cents <= DEPLETION_FLOOR_CENTS (see grant_depletion calc)" }

  # --- Event & route (temporal windowing) ---
  - name: ScreeningEvent
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; employer or grant body hosting the event" }
      - { name: mobile_unit_id, type: string, source: input, description: "FK -> MobileUnit.id; the unit assigned to this event-day" }
      - { name: modality, type: enum, source: input, description: "Screening modality offered: MAMMOGRAPHY | BLOOD_PANEL | BONE_DENSITY | SKIN (must equal the unit's modality)" }
      - { name: site_label, type: string, source: input, description: "Physical location description" }
      - { name: event_date, type: string, source: input, description: "Calendar day of the event, YYYY-MM-DD (the unit's exclusive occupation day)" }
      - { name: window_start_min, type: integer, source: input, description: "Minutes-from-midnight the event opens on event_date (0..1439, inclusive lower bound)" }
      - { name: window_end_min, type: integer, source: input, description: "Minutes-from-midnight the event closes (1..1440, exclusive upper bound; must be > window_start_min)" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of Appointments on this event in non-terminal-cancelled states (SCHEDULED, CHECKED_IN, SCREENED, RESULT_READY, CLOSED)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED -> CLOSED | CANCELLED" }

  # --- Participant (rate/threshold) ---
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD; used for age-eligibility on modality" }
      - { name: pay_type, type: enum, source: input, description: "INSURANCE | SELF_PAY | GRANT" }
      - { name: insurance_member_id, type: string, source: input, required: false, description: "Required only when pay_type == INSURANCE" }
      - { name: grant_id, type: string, source: input, required: false, description: "FK -> Grant.id; required only when pay_type == GRANT" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of appointments that transitioned to NO_SHOW; increments on each no-show mark" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> BLOCKED (auto when no_show_strikes >= NO_SHOW_STRIKE_LIMIT); BLOCKED -> ACTIVE via reinstate" }

  # --- Appointment (branching state machine) ---
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ScreeningEvent.id; the event this appointment belongs to" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the person being screened" }
      - { name: slot_start_min, type: integer, source: input, description: "Minutes-from-midnight the appointment starts (must lie within the event window)" }
      - { name: slot_duration_min, type: integer, source: input, description: "Slot length in minutes (>= 1); [slot_start_min, slot_start_min + slot_duration_min) is the half-open occupied interval" }
      - { name: consent_signed, type: boolean, source: computed, default: false, description: "True once consent recorded via consent endpoint" }
      - { name: consent_signed_at, type: string, source: system, required: false, description: "ISO8601 when consent was recorded" }
      - { name: result, type: enum, source: system, required: false, description: "NORMAL | ABNORMAL; set at result-delivery time" }
      - { name: result_delivered_at, type: string, source: system, required: false, description: "ISO8601 when result was delivered" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> CHECKED_IN -> SCREENED -> RESULT_READY -> CLOSED; SCHEDULED -> CANCELLED; SCHEDULED -> NO_SHOW" }

  # --- Result-driven follow-up (cascade + navigation) ---
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; the abnormal appointment that spawned this referral" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; the participant referred" }
      - { name: priority, type: enum, source: system, description: "ROUTINE | URGENT; derived from result-delivery inputs (see referral_priority calc)" }
      - { name: due_by_date, type: string, source: system, description: "YYYY-MM-DD deadline for navigation contact (event_date + SLA days per priority)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CONTACTED -> SCHEDULED_FOLLOWUP -> RESOLVED; OPEN|CONTACTED|SCHEDULED_FOLLOWUP -> LOST_TO_FOLLOWUP" }

  # --- Billing (dual-variant, cross-aggregate) ---
  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; the screened appointment being billed" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; the payer subject" }
      - { name: grant_id, type: string, source: system, required: false, description: "FK -> Grant.id; the drawn grant when pay_type == GRANT, else null" }
      - { name: list_price_cents, type: integer, source: system, description: "Gross screening price captured from event.modality price at creation" }
      - { name: pay_type, type: enum, source: system, description: "Snapshot of participant.pay_type at charge creation: INSURANCE | SELF_PAY | GRANT" }
      - { name: insurance_allowed_cents, type: integer, source: input, required: false, description: "Payer-allowed amount supplied at adjudication (INSURANCE only)" }
      - { name: grant_covered_cents, type: integer, source: computed, default: 0, description: "Amount drawn from the grant (GRANT only)" }
      - { name: provisional_patient_responsibility_cents, type: integer, source: computed, description: "Estimated patient owed at charge creation (see patient_responsibility calc, provisional variant)" }
      - { name: final_patient_responsibility_cents, type: integer, source: computed, required: false, description: "Finalized patient owed after adjudication (see patient_responsibility calc, finalized variant)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ADJUDICATED -> SETTLED; DRAFT|ADJUDICATED -> VOID" }

  # --- Reminders (scheduled comms) ---
  - name: Reminder
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the appointment this reminder concerns" }
      - { name: send_at_min, type: integer, source: input, description: "Minutes-from-midnight on event_date at which the reminder is due" }
      - { name: channel, type: enum, source: input, description: "SMS | EMAIL" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> SENT; PENDING -> CANCELLED (auto when appointment cancels/no-shows)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: ScreeningEvent
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /screening-events/{id}/publish"
        actor: ProgramManager
        preconditions:
          - "Event in DRAFT (ERR_INVALID_STATE)"
          - "MobileUnit.status == AVAILABLE (ERR_UNIT_UNAVAILABLE)"
          - "event.modality == mobile_unit.modality (ERR_MODALITY_MISMATCH)"
          - "No other PUBLISHED-or-CLOSED ScreeningEvent shares this mobile_unit_id AND event_date (ERR_UNIT_DAY_CONFLICT) — a unit occupies a whole calendar day exclusively"
        side_effects:
          - "increments ScreeningEvent.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /screening-events/{id}/close"
        actor: ProgramManager
        preconditions:
          - "Event in PUBLISHED (ERR_INVALID_STATE)"
          - "No Appointment on this event in an in-progress state CHECKED_IN, SCREENED, or RESULT_READY (ERR_OPEN_APPOINTMENTS_EXIST). SCHEDULED appointments are permitted — closing the event day leaves them SCHEDULED so they can subsequently be marked NO_SHOW; only mid-screening work blocks closure."
        side_effects:
          - "increments ScreeningEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /screening-events/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "Event in DRAFT or PUBLISHED (ERR_INVALID_STATE)"
        side_effects:
          - "increments ScreeningEvent.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /screening-events/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "Event in DRAFT or PUBLISHED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE (hop 1): each Appointment on this event in {SCHEDULED, CHECKED_IN} transitions to CANCELLED (does NOT increment no_show_strikes)"
          - "CASCADE (hop 2): each Reminder whose appointment_id is one of the just-cancelled appointments and is in PENDING transitions to CANCELLED"
          - "CASCADE (hop 2, billing): each Charge whose appointment_id is one of the just-cancelled appointments and is in {DRAFT, ADJUDICATED} transitions to VOID; if that Charge drew a grant, Grant.committed_cents is reduced by that Charge.grant_covered_cents (grant conservation)"
          - "increments ScreeningEvent.version by 1"
        note: "3-hop cascade: event CANCEL -> appointment CANCELLED -> (reminder CANCELLED) and (charge VOID -> grant.committed_cents restored)"

  # ---------------------------------------------------------------------------
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: ClinicalStaff
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
          - "Parent ScreeningEvent.status == PUBLISHED (ERR_EVENT_NOT_PUBLISHED) — cross-entity: event must be open for operations"
          - "appointment.consent_signed == true (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "increments Appointment.version by 1"
      - from: CHECKED_IN
        to: SCREENED
        trigger: "POST /appointments/{id}/screen"
        actor: ClinicalStaff
        preconditions:
          - "Appointment in CHECKED_IN (ERR_INVALID_STATE)"
          - "A StaffMember with role_type == TECHNOLOGIST or PHLEBOTOMIST, status ACTIVE, and modality == event.modality exists (ERR_NO_CREDENTIALED_STAFF) — cross-entity: roster gates screening"
        side_effects:
          - "CASCADE (hop 1): create a Charge in DRAFT for this appointment (list_price_cents = modality price; pay_type snapshot from participant; provisional_patient_responsibility_cents computed; if GRANT, grant_covered_cents computed and Grant.committed_cents increased by that amount)"
          - "increments Appointment.version by 1"
        note: "Screening spawns the billing Charge (cross-aggregate cascade into Grant ledger)."
      - from: SCREENED
        to: RESULT_READY
        trigger: "POST /appointments/{id}/deliver-result"
        actor: ClinicalStaff
        preconditions:
          - "Appointment in SCREENED (ERR_INVALID_STATE)"
          - "For modality MAMMOGRAPHY, an ACTIVE StaffMember with role_type == RADIOLOGIST and modality MAMMOGRAPHY must exist (ERR_NO_CREDENTIALED_STAFF)"
        side_effects:
          - "sets appointment.result to the delivered result (NORMAL | ABNORMAL) and result_delivered_at"
          - "BRANCH ABNORMAL (hop 1): create a Referral in OPEN for this appointment (priority + due_by_date per referral_priority calc)"
          - "BRANCH NORMAL: no Referral is created"
          - "increments Appointment.version by 1"
        note: "Branching fork: NORMAL vs ABNORMAL produce divergent side-effect sets."
      - from: RESULT_READY
        to: CLOSED
        trigger: "POST /appointments/{id}/close"
        actor: ClinicalStaff
        preconditions:
          - "Appointment in RESULT_READY (ERR_INVALID_STATE)"
          - "If appointment.result == ABNORMAL, the linked Referral.status must be RESOLVED or LOST_TO_FOLLOWUP (ERR_REFERRAL_UNRESOLVED) — cross-entity: appointment closure gated by referral terminal state"
        side_effects:
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: each PENDING Reminder for this appointment transitions to CANCELLED"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/mark-no-show"
        actor: ProgramManager
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
          - "Parent ScreeningEvent.status == CLOSED (ERR_EVENT_NOT_CLOSED) — no-show can only be marked after the event day is closed"
        side_effects:
          - "CASCADE (hop 1): participant.no_show_strikes += 1"
          - "CASCADE (hop 2): if participant.no_show_strikes >= NO_SHOW_STRIKE_LIMIT and participant.status == ACTIVE, participant.status -> BLOCKED"
          - "CASCADE (hop 2, comms): each PENDING Reminder for this appointment transitions to CANCELLED"
          - "increments Appointment.version by 1"
        note: "no_show strike accumulation with threshold flip to BLOCKED."

  # ---------------------------------------------------------------------------
  - entity: Referral
    initial_state: OPEN
    terminal_states: [RESOLVED, LOST_TO_FOLLOWUP]
    transitions:
      - from: OPEN
        to: CONTACTED
        trigger: "POST /referrals/{id}/contact"
        actor: PatientNavigator
        preconditions:
          - "Referral in OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "increments Referral.version by 1"
      - from: CONTACTED
        to: SCHEDULED_FOLLOWUP
        trigger: "POST /referrals/{id}/schedule-followup"
        actor: PatientNavigator
        preconditions:
          - "Referral in CONTACTED (ERR_INVALID_STATE)"
        side_effects:
          - "increments Referral.version by 1"
      - from: SCHEDULED_FOLLOWUP
        to: RESOLVED
        trigger: "POST /referrals/{id}/resolve"
        actor: PatientNavigator
        preconditions:
          - "Referral in SCHEDULED_FOLLOWUP (ERR_INVALID_STATE)"
        side_effects:
          - "increments Referral.version by 1"
      - from: OPEN
        to: LOST_TO_FOLLOWUP
        trigger: "POST /referrals/{id}/mark-lost"
        actor: PatientNavigator
        preconditions:
          - "Referral in OPEN, CONTACTED, or SCHEDULED_FOLLOWUP (ERR_INVALID_STATE)"
        side_effects:
          - "increments Referral.version by 1"
      - from: CONTACTED
        to: LOST_TO_FOLLOWUP
        trigger: "POST /referrals/{id}/mark-lost"
        actor: PatientNavigator
        preconditions:
          - "Referral in OPEN, CONTACTED, or SCHEDULED_FOLLOWUP (ERR_INVALID_STATE)"
        side_effects:
          - "increments Referral.version by 1"
      - from: SCHEDULED_FOLLOWUP
        to: LOST_TO_FOLLOWUP
        trigger: "POST /referrals/{id}/mark-lost"
        actor: PatientNavigator
        preconditions:
          - "Referral in OPEN, CONTACTED, or SCHEDULED_FOLLOWUP (ERR_INVALID_STATE)"
        side_effects:
          - "increments Referral.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Charge
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: DRAFT
        to: ADJUDICATED
        trigger: "POST /charges/{id}/adjudicate"
        actor: BillingClerk
        preconditions:
          - "Charge in DRAFT (ERR_INVALID_STATE)"
          - "expected_charge_version matches Charge.version (ERR_STALE_VERSION)"
          - "If pay_type == INSURANCE, insurance_allowed_cents is present and 0 <= insurance_allowed_cents <= list_price_cents (ERR_INVALID_ADJUDICATION)"
        side_effects:
          - "computes final_patient_responsibility_cents (finalized variant of patient_responsibility calc)"
          - "increments Charge.version by 1"
      - from: ADJUDICATED
        to: SETTLED
        trigger: "POST /charges/{id}/settle"
        actor: BillingClerk
        preconditions:
          - "Charge in ADJUDICATED (ERR_INVALID_STATE)"
          - "expected_charge_version matches Charge.version (ERR_STALE_VERSION)"
        side_effects:
          - "if grant-funded, Grant.settled_cents increased by Charge.grant_covered_cents (committed_cents unchanged — commitment becomes a settlement)"
          - "increments Charge.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /charges/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Charge in DRAFT or ADJUDICATED (ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: if grant-funded, Grant.committed_cents reduced by Charge.grant_covered_cents (restores grant headroom — conservation invariant)"
          - "increments Charge.version by 1"
      - from: ADJUDICATED
        to: VOID
        trigger: "POST /charges/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Charge in DRAFT or ADJUDICATED (ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: if grant-funded, Grant.committed_cents reduced by Charge.grant_covered_cents (restores grant headroom — conservation invariant)"
          - "increments Charge.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Participant
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "system: no-show mark pushes no_show_strikes >= NO_SHOW_STRIKE_LIMIT"
        actor: system
        preconditions:
          - "no_show_strikes >= NO_SHOW_STRIKE_LIMIT"
        side_effects: []
        note: "Auto-transition fired as hop 2 of the Appointment NO_SHOW cascade."
      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /participants/{id}/reinstate"
        actor: ProgramManager
        preconditions:
          - "Participant in BLOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "resets no_show_strikes to 0"
          - "increments Participant.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Reminder
    initial_state: PENDING
    terminal_states: [SENT, CANCELLED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /reminders/{id}/send"
        actor: ProgramManager
        preconditions:
          - "Reminder in PENDING (ERR_INVALID_STATE)"
          - "linked Appointment.status IN {SCHEDULED, CHECKED_IN} (ERR_APPOINTMENT_NOT_ACTIVE) — cross-entity: cannot remind a cancelled/no-show/closed appointment"
          - "logical clock (current_utc) time-of-day minutes-from-midnight >= send_at_min OR current date > event_date (ERR_REMINDER_NOT_DUE)"
        side_effects:
          - "increments Reminder.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "system: parent appointment cancels/no-shows, or POST /reminders/{id}/cancel"
        actor: ProgramManager | system
        preconditions:
          - "Reminder in PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "increments Reminder.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version — §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: charge-adjudicate-stale
    parent_entity: Charge
    write_endpoint: "POST /charges/{id}/adjudicate"
    occ_field: "expected_charge_version"
    description: |
      Adjudicating a Charge whose version has advanced since the client last
      observed it is rejected. A void or an earlier adjudication attempt that
      the client did not observe advances the Charge version, so the current
      adjudication carries a stale expected_charge_version and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: charge-settle-stale
    parent_entity: Charge
    write_endpoint: "POST /charges/{id}/settle"
    occ_field: "expected_charge_version"
    description: |
      Settling a Charge whose version has advanced since the client last
      observed it is rejected. The adjudication that moved the Charge to
      ADJUDICATED advanced its version; a settle request still carrying the
      pre-adjudication version is stale and rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant #1 (billing domain): patient responsibility ---
  - name: patient_responsibility
    trigger: "Charge creation (provisional) on Appointment SCREENED; Charge adjudication (finalized) on POST /charges/{id}/adjudicate"
    algorithm: forward_looking
    formula: |
      list = list_price_cents  (captured from MODALITY_PRICE_CENTS[event.modality] at charge creation)

      PROVISIONAL variant (at Charge creation, status DRAFT):
        if pay_type == SELF_PAY:
          grant_covered_cents = 0
          provisional_patient_responsibility_cents = list
        if pay_type == INSURANCE:
          grant_covered_cents = 0
          # estimate before payer adjudication: assume standard coinsurance on full list
          provisional_patient_responsibility_cents = round_half_up(list * INSURANCE_ESTIMATE_COINSURANCE)
        if pay_type == GRANT:
          # grant pays up to the participant's remaining grant headroom, capped at list
          grant_covered_cents = min(list, grant.remaining_cents)   # remaining_cents evaluated BEFORE this commitment
          provisional_patient_responsibility_cents = list - grant_covered_cents

      FINALIZED variant (at adjudication, status DRAFT->ADJUDICATED):
        if pay_type == SELF_PAY:
          final_patient_responsibility_cents = list
        if pay_type == INSURANCE:
          # actual: patient owes list minus what payer allowed
          final_patient_responsibility_cents = list - insurance_allowed_cents
        if pay_type == GRANT:
          final_patient_responsibility_cents = list - grant_covered_cents
    input_set: "single Charge; for GRANT, grant.remaining_cents at the instant of charge creation (committed before this charge)"
    constants:
      INSURANCE_ESTIMATE_COINSURANCE: 0.20   # 20% provisional coinsurance estimate
      MODALITY_PRICE_CENTS: { MAMMOGRAPHY: 20000, BLOOD_PANEL: 8000, BONE_DENSITY: 12000, SKIN: 6000 }
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "Charge in DRAFT, at creation during Appointment SCREENED"
        difference: "INSURANCE uses a 20% coinsurance estimate on full list; GRANT commits against remaining headroom at creation time"
      - name: finalized
        when: "Charge adjudicated"
        difference: "INSURANCE uses actual insurance_allowed_cents (patient owes list - allowed); provisional estimate is superseded, not summed"

  # --- Dual-variant #2 (grant/fund domain): grant depletion (estimated vs actual burn) ---
  - name: grant_depletion
    trigger: "Grant read; recomputed after any Charge commit/settle/void touching the grant"
    algorithm: aggregation
    formula: |
      committed_cents = sum(grant_covered_cents) over Charges drawing this grant in {DRAFT, ADJUDICATED, SETTLED}
      settled_cents   = sum(grant_covered_cents) over Charges drawing this grant in {SETTLED}
      remaining_cents = total_budget_cents - committed_cents        # ESTIMATED burn (commitments count immediately)
      is_depleted     = (remaining_cents <= DEPLETION_FLOOR_CENTS)
    input_set: "all Charges with grant_id == this grant; commit-basis (DRAFT/ADJUDICATED/SETTLED) for committed_cents; settle-basis (SETTLED only) for settled_cents"
    constants:
      DEPLETION_FLOOR_CENTS: 0
    precision: "integer cents (exact)"
    variants:
      - name: estimated_burn
        when: "remaining_cents / is_depleted (drives new-commitment gating)"
        difference: "counts COMMITTED (DRAFT+ADJUDICATED) charges as spent — conservative headroom"
      - name: actual_burn
        when: "settled_cents (drives sponsor reporting of realized spend)"
        difference: "counts only SETTLED charges — realized spend, always <= estimated burn"

  # --- Combinatorial (b): rounding-order-pinned event fill rate ---
  - name: event_fill_rate
    trigger: "GET /screening-events/{id}/summary"
    algorithm: aggregation
    formula: |
      booked = booked_count  (Appointments in {SCHEDULED, CHECKED_IN, SCREENED, RESULT_READY, CLOSED})
      screened = count(Appointments on event in {SCREENED, RESULT_READY, CLOSED})
      no_shows = count(Appointments on event in {NO_SHOW})
      capacity = mobile_unit.daily_capacity
      # Rounding ORDER is pinned: compute the ratio to 4 dp, THEN round to whole
      # percent — NOT round each count first. round_half_up applies once, at the end.
      fill_rate_pct = round_half_up( (booked / capacity) * 100 , 0 )   # ratio-then-round
      show_rate_pct = round_half_up( (screened / booked) * 100 , 0 ) if booked > 0 else 0
    input_set: "Appointments on the event, filtered by status as above; capacity from the event's mobile_unit"
    constants: {}
    precision: "round_half_up to whole percent, applied ONCE after the ratio (ratio-then-round, not round-then-combine)"

  # --- Combinatorial (a): sponsor report >=3 inputs, nested min/branches ---
  - name: sponsor_report_totals
    trigger: "GET /sponsors/{id}/report"
    algorithm: aggregation
    formula: |
      Over all ScreeningEvents with sponsor_id == this sponsor (any status), and their Appointments/Charges:
        events_published    = count(events whose status IN {PUBLISHED, CLOSED})
        total_screened      = count(Appointments in {SCREENED, RESULT_READY, CLOSED})
        abnormal_count      = count(Appointments in {RESULT_READY, CLOSED} with result == ABNORMAL)
        abnormal_rate_pct   = round_half_up( (abnormal_count / total_screened) * 100 , 0 ) if total_screened > 0 else 0
        # realized sponsor cost blends grant settled spend and self-pay/insurance patient responsibility:
        grant_settled_cents = sum(Charge.grant_covered_cents) over SETTLED grant Charges on this sponsor's events
        patient_paid_cents  = sum(Charge.final_patient_responsibility_cents) over SETTLED non-grant Charges on this sponsor's events
        realized_cost_cents = grant_settled_cents + patient_paid_cents
        # navigation effectiveness: resolved out of all abnormal referrals
        referrals_total     = count(Referrals on this sponsor's events)
        referrals_resolved  = count(Referrals in {RESOLVED})
        resolution_rate_pct = round_half_up( (referrals_resolved / referrals_total) * 100 , 0 ) if referrals_total > 0 else 0
    input_set: "all events for the sponsor and their descendant appointments/charges/referrals, filtered by the status sets shown"
    constants: {}
    precision: "round_half_up to whole percent for rates; integer cents for money"

  # --- Referral priority + SLA (branch-derived) ---
  - name: referral_priority
    trigger: "Referral creation on ABNORMAL result delivery"
    algorithm: threshold
    formula: |
      # result delivery supplies a boolean `flagged_urgent`
      priority = URGENT if flagged_urgent == true else ROUTINE
      sla_days = URGENT_SLA_DAYS if priority == URGENT else ROUTINE_SLA_DAYS
      due_by_date = event.event_date + sla_days   (calendar days)
    input_set: "the single ABNORMAL appointment and its event.event_date"
    constants:
      URGENT_SLA_DAYS: 7
      ROUTINE_SLA_DAYS: 30

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in the path exist (validated left-to-right)"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Referenced FK ids in the request body exist (e.g. event_id, participant_id, grant_id, sponsor_id, mobile_unit_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST /screening-events, POST /appointments, POST /grants, POST /reminders, POST /participants"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in range; window_end_min > window_start_min; slot_duration_min >= 1; daily_capacity >= 1; pay_type INSURANCE requires insurance_member_id; pay_type GRANT requires grant_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

  - priority: 6
    category: state
    check: "Target resource in a state that permits this transition (per §1.2 from-state and terminal lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Appointment check-in requires appointment.consent_signed == true"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 8
    category: business_referential
    check: "Cross-entity gate: check-in requires parent event PUBLISHED; screen requires credentialed ACTIVE staff of the event modality; deliver-result (MAMMOGRAPHY) requires ACTIVE RADIOLOGIST; close of ABNORMAL appointment requires linked Referral terminal; no-show requires parent event CLOSED"
    error_id: "ERR_EVENT_NOT_PUBLISHED / ERR_NO_CREDENTIALED_STAFF / ERR_REFERRAL_UNRESOLVED / ERR_EVENT_NOT_CLOSED"
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in, /screen, /deliver-result, /close, /mark-no-show"

  - priority: 9
    category: business_safety
    check: "Participant.status must be ACTIVE to book an appointment (BLOCKED participants cannot be booked)"
    error_id: ERR_PARTICIPANT_BLOCKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 10
    category: business_temporal
    check: "Appointment slot [slot_start_min, slot_start_min+slot_duration_min) must lie fully within [event.window_start_min, event.window_end_min) (half-open) — else ERR_SLOT_OUTSIDE_WINDOW"
    error_id: ERR_SLOT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 11
    category: business_temporal
    check: "Appointment slot half-open interval [start, start+duration) must not overlap any existing non-cancelled Appointment interval on the same event (touching-at-a-point is allowed; shared interior minute is a conflict) — else ERR_SLOT_OVERLAP"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 12
    category: business_constraint
    check: "Event booked_count must be < mobile_unit.daily_capacity at booking time (>= capacity rejects) — else ERR_EVENT_FULL"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 13
    category: business_fiscal
    check: "For GRANT participants, at booking the referenced grant must not be depleted (is_depleted == false) — else ERR_GRANT_DEPLETED"
    error_id: ERR_GRANT_DEPLETED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 14
    category: business_referential
    check: "Publish: mobile_unit AVAILABLE; event.modality == unit.modality; no unit-day conflict"
    error_id: "ERR_UNIT_UNAVAILABLE / ERR_MODALITY_MISMATCH / ERR_UNIT_DAY_CONFLICT"
    http_status: 409
    applies_to: "POST /screening-events/{id}/publish"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_charge_version must equal the charge's current version on adjudicate/settle"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /charges/{id}/adjudicate, POST /charges/{id}/settle"

