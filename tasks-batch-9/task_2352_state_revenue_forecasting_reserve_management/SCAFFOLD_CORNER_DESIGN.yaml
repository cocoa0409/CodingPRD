            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
          trigger:
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err_early: $.data.error_id } }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/reopen", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err_reopen: $.data.error_id } }
