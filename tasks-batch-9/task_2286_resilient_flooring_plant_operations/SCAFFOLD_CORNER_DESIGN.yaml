      - name: blend_indices_carried_at_six_decimals_before_the_single_rounding
        claim_type: precision
        grounds:
          - "calculations.formulation_blend_metrics.precision"
          - "calculations.formulation_blend_metrics.formula (SINGLE final rounding)"
        distinguishing_aspect: |
          F-MIN is chosen so that rounding the three blend indices to 2 dp before weighting
          gives 89.29 while the contract's 6-dp indices with one final rounding give 89.28.
          A single cent-level discrepancy in the score is the only observable, which is why
          this instance exists separately from the correct-result one.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
          trigger:
            - *fminC2
            - call: "GET /formulations/${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { fmin_score: $.data.performance_score, fmin_cost: $.data.blended_cost_per_kg_cents, fmin_class: $.data.indentation_resistance_class, fmin_total: $.data.total_phr }
          assert:
            - "${fmin_total} == 103.00 and ${fmin_cost} == 201 (20700 / 103 = 200.970874 -> 201)"
            - "${fmin_score} == 89.28, computed from blended_indentation 89.126214, blended_thermal 85.320388 and blended_migration_resistance 95.087379 with a single ROUND_HALF_UP of raw_score 89.284466"
            - "${fmin_score} is NOT 89.29, which is what pre-rounding the indices to 89.13 / 85.32 / 95.09 would yield"
            - "${fmin_class} == CLASS_34_43 because blended_indentation 89.126214 >= 88.00"

      - name: warranty_term_tiers_at_wear_layer_rung_boundaries_and_caps
        claim_type: tiered_pricing
        grounds:
          - "calculations.sku_warranty_terms"
          - "calculations.sku_warranty_terms.constants RESIDENTIAL_TIERS / COMMERCIAL_TIERS"
          - "calculations.sku_warranty_terms.constants WATERPROOF_CLICK_BONUS_YEARS / caps"
        distinguishing_aspect: |
          Three SKUs straddling one rung of the wear-layer ladder: 11.9 mil sits on the
          >= 6 rung, exactly 12 mil steps up (the comparison is inclusive), and 20 mil on
          a waterproof click-lock plank takes the +5 bonus into BOTH caps at once, so the
          cap clamps 25+5 to 30 and 15+5 to 20.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *lic
            - *pf1
          trigger:
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-T1", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 11.9, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2000 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { t1_res: $.data.warranty_years, t1_com: $.data.light_commercial_warranty_years }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-T2", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 12, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2000 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { t2_res: $.data.warranty_years, t2_com: $.data.light_commercial_warranty_years }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-T3", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: CLICK_LOCK_SPC, wear_layer_mil: 20, overall_thickness_mm: 5.00, royalty_basis_price_cents_per_sqm: 2600, waterproof_rated: true, profile_family: UNILIN_5G, tongue_thickness_target_mm: 1.80, tolerance_plus_mm: 0.15, tolerance_minus_mm: 0.15, target_lock_shear_n_per_mm: 8.00 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { t3_res: $.data.warranty_years, t3_com: $.data.light_commercial_warranty_years }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-T4", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 20, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2600, waterproof_rated: true }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { t4_res: $.data.warranty_years, t4_com: $.data.light_commercial_warranty_years }
          assert:
            - "${t1_res} == 15 and ${t1_com} == 5 — 11.9 mil clears the >= 6 rung but not the >= 12 rung"
            - "${t2_res} == 20 and ${t2_com} == 10 — exactly 12 mil takes the next rung up (inclusive)"
            - "${t3_res} == 30 and ${t3_com} == 20 — 25 + 5 clamped by RESIDENTIAL_CAP_YEARS 30 and 15 + 5 clamped by COMMERCIAL_CAP_YEARS 20"
            - "${t4_res} == 25 and ${t4_com} == 15 — a waterproof GLUE_DOWN gets NO bonus, so the caps are not reached; the bonus needs both conditions"

