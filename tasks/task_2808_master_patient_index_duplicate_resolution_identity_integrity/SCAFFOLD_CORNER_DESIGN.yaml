            - "After the first trigger call: ContaminationRemediation.${rem_vl_id}.state == QUARANTINED, element_count_reassigned == 0 and reassigned_to_record_mrn == null"
            - "Second trigger call: HTTP 200 with $.data.state == REASSIGNED and $.data.element_count_reassigned == 10 and $.data.reassigned_to_record_mrn == \"VL-3000\""
            - "PatientRecord.${rec_vlc_id}.clinical_element_count == 15 and enterprise_id == ${rec_vlc_eid} (unchanged by the refile)"
            - "PatientRecord.${rec_vla_id}.clinical_element_count == 24 (34 minus the 10 elements that left the cluster)"

      - name: occ_stale_version_outranks_the_fraud_hold_on_overlay_creation
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: occ_stale_record_version_outranks_fraud_hold
          rationale: "The difficulty instance already stages a record that is simultaneously stale (expected_record_version behind) and under an OPEN FraudInvestigation and pins ERR_STALE_RECORD_VERSION as the winner, then flips only the version to expose ERR_RECORD_UNDER_FRAUD_HOLD. A separate corner instance would repeat that exact two-violation setup."

      - name: fraud_hold_outranks_the_pair_queue_state_precondition
        claim_type: priority_ordering
        grounds:
          - validations[priority=21]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: fraud_hold_outranks_pair_queue_state
          rationale: "That instance triggers a merge on a pair that is both in the wrong queue_state and holds a FRAUD_SUSPECTED record and asserts ERR_RECORD_UNDER_FRAUD_HOLD rather than ERR_PAIR_INVALID_STATE, which is exactly the priority-conflict claim this row would make."

      - name: propagation_deadline_outranks_the_dispatch_capacity_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=43]
          - validations[priority=45]
        excluded_because:
          difficulty_instance: propagation_deadline_outranks_dispatch_capacity
          rationale: "The difficulty instance stages a send that is both past propagation_deadline_at and over the system's max_concurrent_dispatch and asserts ERR_PROPAGATION_WINDOW_EXPIRED, then rolls the clock back to reveal ERR_DISPATCH_CAPACITY_EXCEEDED on the same request."

      - name: dispatch_capacity_counts_only_windows_that_actually_intersect
        claim_type: aggregate_validation
        grounds:
          - validations[priority=45]
          - state_machines.PropagationTask
          - errors[ERR_DISPATCH_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: dispatch_window_half_open_adjacency_then_capacity_breach
          rationale: "That instance sends a window that only touches an existing SENT window (accepted, because the interval is half-open) and then one that overlaps by a single millisecond over a max_concurrent_dispatch of 1 (rejected), covering both the aggregate count and the adjacency boundary."

      - name: metric_window_collision_is_scoped_per_attribution_variant
        claim_type: temporal_validation
        grounds:
          - validations[priority=44]
          - errors[ERR_METRIC_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: metric_window_closed_adjacency_collides_but_other_variant_does_not
          rationale: "The difficulty instance publishes a second window that shares a single boundary day with the first under the same attribution_variant (rejected, because metric windows are closed intervals) and then the identical window under the other variant (accepted), which is precisely the scoping and adjacency claim here."

      - name: registration_search_blocks_creation_using_records_from_other_sites
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=46]
          - calculations.registration_search_evaluation
        excluded_because:
          difficulty_instance: registration_blocked_by_active_record_at_a_different_site
          rationale: "That instance searches from site B while the only matching ACTIVE record lives at site A, showing that the search pool is enterprise-wide while the mrn uniqueness scope is per site, and asserts the resulting ERR_DUPLICATE_CREATION_BLOCKED."

  - section: endpoints
    instances:
      - name: patch_registration_site_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /mpi/registration-sites/{id}]
          - entities.RegistrationSite
        distinguishing_aspect: "PATCH is a true partial update: sending only registrar_headcount leaves name, region_code and status untouched, and sending only name leaves the new headcount in place, with version incrementing once per call."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One RegistrationSite EA-SITE created with registrar_headcount 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "EA-SITE", name: "Eastside Admitting", region_code: "US-NC", registrar_headcount: 5 }
              as: MpiAdmin
              captures: { site_ea_id: $.data.id, site_ea_v1: $.data.version, site_ea_region: $.data.region_code }
          trigger:
            - call: "PATCH /mpi/registration-sites/${site_ea_id}"
              payload: { registrar_headcount: 9 }
              as: MpiAdmin
            - call: "PATCH /mpi/registration-sites/${site_ea_id}"
              payload: { name: "Eastside Admitting & Registration" }
              as: MpiAdmin
          assert:
            - "${site_ea_v1} == 1 and ${site_ea_region} == \"US-NC\""
            - "First trigger call: HTTP 200 with $.data.registrar_headcount == 9, $.data.name == \"Eastside Admitting\", $.data.region_code == \"US-NC\", $.data.status == ACTIVE and $.data.version == 2"
            - "Second trigger call: HTTP 200 with $.data.name == \"Eastside Admitting & Registration\", $.data.registrar_headcount == 9, $.data.status == ACTIVE and $.data.version == 3"
            - "GET /mpi/registration-sites/${site_ea_id} returns site_code == \"EA-SITE\" (site_code is not in the PATCH input set and cannot change) and active_record_count == 0"

      - name: resolve_distinct_closes_the_pair_and_leaves_both_records_active
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mpi/candidate-pairs/{id}/resolve-distinct]
          - state_machines.DuplicateCandidatePair
        distinguishing_aspect: "resolve-distinct is the terminal branch that changes no PatientRecord at all: both records stay ACTIVE with their original clinical_element_count, and because RESOLVED_DISTINCT is excluded from the duplicate-pair uniqueness check the same two records can be paired again."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite EB-SITE and one MatchRuleSet RS-BASE."
            - "Two PatientRecord rows scoring STRICT 70.00 (EB-2000 omits ssn_last4, postal_code and phone), so the pair is POTENTIAL_DUPLICATE and lands in NEW."
            - "The pair is triaged, taken into review and given two SUPPORTS_DISTINCT evidence rows of 3.00 and 2.00 (evidence_points -5.00, base_band P2 so multiplier 1.00, effective_score 65.00), then recommended DISTINCT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "EB-SITE", name: "Distinct Resolution Clinic", region_code: "US-SC", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_eb_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_eb_id}", mrn: "EB-1000", last_name: "Villanueva", first_name: "Rosa", dob: "1981-04-04", sex: "F", ssn_last4: "2929", postal_code: "29201", phone: "8035550101", clinical_element_count: 7 }
              as: IdentityAnalyst
              captures: { rec_eba_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_eb_id}", mrn: "EB-2000", last_name: "Villanueva", first_name: "Rosa", dob: "1981-04-04", sex: "F", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_ebb_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_eba_id}", record_b_id: "${rec_ebb_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_eb_id: $.data.id, pair_eb_class: $.data.classification }
            - call: "POST /mpi/candidate-pairs/${pair_eb_id}/triage"
              payload: { triage_note: "Mother and daughter suspected." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_eb_id}/start-review"
              payload: {}
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_eb_id}/evidence"
              payload: { evidence_type: "PHOTO_ID", outcome: "SUPPORTS_DISTINCT", weight_points: 3.00, note: "Different faces." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_eb_id}/evidence"
              payload: { evidence_type: "CLINICAL_CHART_COMPARE", outcome: "SUPPORTS_DISTINCT", weight_points: 2.00, note: "Different obstetric histories." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_eb_id}/recommend"
              payload: { recommendation: "DISTINCT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_eb_eff: $.data.effective_score, pair_eb_qs: $.data.queue_state }
          trigger:
            - call: "POST /mpi/candidate-pairs/${pair_eb_id}/resolve-distinct"
              payload: { resolution_note: "Confirmed two different patients." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_eba_id}", record_b_id: "${rec_ebb_id}", rule_set_id: "${rs_base_id}", score_variant: "TOLERANT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "${pair_eb_class} == \"POTENTIAL_DUPLICATE\", ${pair_eb_eff} == 65.00 and ${pair_eb_qs} == \"RECOMMENDED_DISTINCT\""
            - "First trigger call: HTTP 200 with $.data.queue_state == RESOLVED_DISTINCT and $.data.approved_by_user_id == \"steward-1\" and $.data.version == 7"
            - "PatientRecord.${rec_eba_id}: identity_state == ACTIVE, clinical_element_count == 7, survivor_record_id == null"
            - "PatientRecord.${rec_ebb_id}: identity_state == ACTIVE, clinical_element_count == 3, survivor_record_id == null"
            - "Second trigger call: HTTP 201 (no ERR_PAIR_ALREADY_EXISTS, because the earlier pair is RESOLVED_DISTINCT) with $.data.score_variant == TOLERANT and $.data.match_score == 77.50 (the same two records score 70.00 under STRICT and 77.50 under TOLERANT)"
            - "GET /mpi/merge-operations returns exactly 0 rows"

      - name: pausing_a_downstream_system_blocks_sends_until_it_is_reactivated
        claim_type: conditional_action
        grounds:
          - endpoints[PATCH /mpi/downstream-systems/{id}]
          - endpoints[POST /mpi/propagation-tasks/{id}/send]
          - errors[ERR_DOWNSTREAM_SYSTEM_PAUSED]
        distinguishing_aspect: "The send precondition reads the system's live status, so the identical send body is 409 ERR_DOWNSTREAM_SYSTEM_PAUSED while the system is PAUSED and 200 once it is patched back to ACTIVE, with attempt_count moving from 0 to 1 exactly once."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite EC-SITE, one MatchRuleSet RS-BASE, and one ACTIVE DownstreamSystem EC-SYS (BATCH, ack_required true, max_concurrent_dispatch 1)."
            - "Two identical-attribute PatientRecord rows are merged (AUTO_LINK, so the pair is minted in RECOMMENDED_MERGE with recommended_by_user_id null), leaving the MergeOperation in PENDING_PROPAGATION with one QUEUED PropagationTask."
            - "The DownstreamSystem is then patched to status PAUSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "EC-SITE", name: "Paused Consumer Clinic", region_code: "US-GA", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_ec_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "EC-SYS", name: "Nightly Data Warehouse", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 1 }
              as: MpiAdmin
              captures: { sys_ec_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ec_id}", mrn: "EC-1000", last_name: "Baptiste", first_name: "Yvette", dob: "1994-09-09", sex: "F", ssn_last4: "3131", postal_code: "30303", phone: "4045550101", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_eca_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ec_id}", mrn: "EC-2000", last_name: "Baptiste", first_name: "Yvette", dob: "1994-09-09", sex: "F", ssn_last4: "3131", postal_code: "30303", phone: "4045550101", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_ecb_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_eca_id}", record_b_id: "${rec_ecb_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_ec_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_ec_id}", survivor_record_id: "${rec_eca_id}", subsumed_record_id: "${rec_ecb_id}", rationale: "Same patient." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_ec_id: $.data.id, merge_ec_state: $.data.state, merge_ec_count: $.data.propagation_task_count }
            - call: "GET /mpi/propagation-tasks?merge_operation_id=${merge_ec_id}"
              payload: {}
              as: MpiAdmin
              captures: { task_ec_id: "$.data[0].id", task_ec_deadline: "$.data[0].propagation_deadline_at" }
            - call: "PATCH /mpi/downstream-systems/${sys_ec_id}"
              payload: { status: "PAUSED" }
              as: MpiAdmin
              captures: { sys_ec_status: $.data.status, sys_ec_unacked: $.data.unacked_task_count }
          trigger:
            - call: "POST /mpi/propagation-tasks/${task_ec_id}/send"
              payload: { dispatch_window_start_at: "2026-08-01T01:00:00Z", dispatch_window_end_at: "2026-08-01T02:00:00Z" }
              as: MpiAdmin
            - call: "PATCH /mpi/downstream-systems/${sys_ec_id}"
              payload: { status: "ACTIVE" }
              as: MpiAdmin
            - call: "POST /mpi/propagation-tasks/${task_ec_id}/send"
              payload: { dispatch_window_start_at: "2026-08-01T01:00:00Z", dispatch_window_end_at: "2026-08-01T02:00:00Z" }
              as: MpiAdmin
          assert:
            - "${merge_ec_state} == \"PENDING_PROPAGATION\", ${merge_ec_count} == 1, ${task_ec_deadline} == \"2026-08-04T00:00:00.000Z\" (BATCH is created_at + 72 hours) and ${sys_ec_status} == \"PAUSED\" and ${sys_ec_unacked} == 1"
            - "First trigger call: HTTP 409 with $.data.error_id == \"ERR_DOWNSTREAM_SYSTEM_PAUSED\""
            - "After the first trigger call: PropagationTask.${task_ec_id}.state == QUEUED, attempt_count == 0 and version == 1"
            - "Third trigger call: HTTP 200 with $.data.state == SENT, $.data.attempt_count == 1, $.data.dispatch_window_start_at == \"2026-08-01T01:00:00.000Z\" and $.data.version == 2"
            - "MergeOperation.${merge_ec_id}.state == PENDING_PROPAGATION and completed_at == null (a send is not an ack)"

      - name: overlay_apply_opens_a_remediation_only_above_the_element_threshold
        claim_type: conditional_action
        grounds:
