          Every accepted deliverable create bumps Production.version, so a client that batches two creates
          from one read gets 412 on the second. The guard also outranks the group conflict: replaying the
          stale version for a type that already has a DRAFT returns 412, not ERR_DELIVERABLE_VERSION_CONFLICT.
