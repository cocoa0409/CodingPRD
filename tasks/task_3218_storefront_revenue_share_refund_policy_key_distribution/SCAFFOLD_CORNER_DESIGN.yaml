# =============================================================================
# §1.9: Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: developer_account_creation_and_defaults
        claim_type: creation_defaults
        grounds:
          - entities.DeveloperAccount.fields.onboarding_fee_paid
          - endpoints.POST /storefront/developer-accounts
        distinguishing_aspect: "POST with required fields returns 201 with status PENDING, onboarding_fee_paid false, bank_details_submitted false, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Fresh Studio", contact_email: "fresh@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
          trigger:
            - call: "GET /storefront/developer-accounts/${dv_id}"
              payload: {}
              as: PlatformOps
          assert:
            - "DeveloperAccount.status == PENDING"
            - "DeveloperAccount.onboarding_fee_paid == false"
            - "DeveloperAccount.bank_details_submitted == false"
            - "DeveloperAccount.version == 1"

      - name: developer_account_duplicate_email_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second developer account with the same contact_email is rejected with ERR_DUPLICATE."
        test_recipe:
          setup: ["one developer account exists"]
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "First", contact_email: "dup@studio.example" }
              as: PlatformOps
          trigger:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Second", contact_email: "dup@studio.example" }
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with ERR_DUPLICATE"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET /storefront/titles/{id}
        distinguishing_aspect: "GET with a random UUID id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /storefront/titles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with ERR_NOT_FOUND"

      - name: title_patch_only_in_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.Title
          - endpoints.PATCH /storefront/titles/{id}
        distinguishing_aspect: "PATCH of a title that has left DRAFT (PENDING_REVIEW) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["active developer; title submitted (PENDING_REVIEW)"]
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Patch Studio", contact_email: "patch@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Patch Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
          trigger:
            - call: "PATCH /storefront/titles/${t_id}"
              payload: { title_name: "Renamed" }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with ERR_INVALID_STATE"
            - "Title.${t_id}.title_name == 'Patch Game' (unchanged)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: scheduled_release_fires_on_clock_sweep
        claim_type: valid_transition
        grounds:
          - state_machines.Title.RELEASE_SCHEDULED_to_RELEASED
          - endpoints.POST /storefront/_clock/set_current_utc
        distinguishing_aspect: "RELEASE_SCHEDULED title flips to RELEASED with released_at == scheduled_release_at exactly when the logical clock reaches the scheduled instant (inclusive boundary)."
        test_recipe:
          setup: ["APPROVED title scheduled for 2026-09-15T00:00:00Z; clock at 2026-09-01"]
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Sched Studio", contact_email: "sched@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Sched Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/schedule-release"
              payload: { release_at: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dv_id}"
          trigger:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T23:59:59Z" }
              as: PlatformOps
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { st_before: $.data.status }
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformOps
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { st_after: $.data.status, rel_at: $.data.released_at }
          assert:
            - "status at 2026-09-14T23:59:59Z == RELEASE_SCHEDULED (one second before the boundary)"
            - "status at exactly 2026-09-15T00:00:00Z == RELEASED (inclusive boundary)"
            - "released_at == 2026-09-15T00:00:00Z (equals scheduled instant, not sweep time)"

      - name: early_access_schedule_requires_disclosure
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_MISSING_DISCLOSURE]
        distinguishing_aspect: "early_access title without disclosure text cannot schedule; after PATCH sets the disclosure text, scheduling succeeds."
        test_recipe:
          setup: ["APPROVED early-access title with null disclosure; clock at 2026-09-01"]
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "EA Studio", contact_email: "ea@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "EA Game", base_price_usd_cents: 500, early_access: true }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
          trigger:
            - call: "POST /storefront/titles/${t_id}/schedule-release"
              payload: { release_at: "2026-09-10T00:00:00Z" }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { err: $.data.error_id }
            - call: "POST /storefront/titles/${t_id}/cancel-release"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "schedule-release rejected with ERR_MISSING_DISCLOSURE"
            - "cancel-release after failed schedule rejected with ERR_INVALID_STATE (title still APPROVED)"

      - name: schedule_release_in_past_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_SCHEDULE]
        distinguishing_aspect: "release_at equal to or before now is rejected with ERR_INVALID_SCHEDULE (strictly-future rule)."
        test_recipe:
          setup: ["APPROVED title; clock at 2026-09-05T00:00:00Z"]
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Past Studio", contact_email: "past@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Past Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
          trigger:
            - call: "POST /storefront/titles/${t_id}/schedule-release"
              payload: { release_at: "2026-09-05T00:00:00Z" }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with ERR_INVALID_SCHEDULE (release_at == now is not strictly future)"

      - name: terminal_states_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.RefundRequest
          - state_machines.StorePageReview
        distinguishing_aspect: "A DENIED RefundRequest cannot be approved afterwards (terminal); an APPROVED StorePageReview cannot be rejected afterwards."
        test_recipe:
          setup: ["RELEASED title; buyer purchase with 200 minutes playtime; refund request DENIED by TrustSafety; title's store-page review APPROVED"]
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Term Studio", contact_email: "term@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Term Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "tb@players.example" }
              as: PlatformOps
              captures: { u_id: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u_id}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u_id}"
              captures: { p_id: $.data.id }
            - call: "POST /storefront/purchases/${p_id}/playtime"
              payload: { minutes: 200 }
              as: User
              as_user_id: "${u_id}"
            - call: "POST /storefront/refund-requests"
              payload: { purchase_id: "${p_id}", reason: "slow" }
              as: User
              as_user_id: "${u_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /storefront/refund-requests/${rr_id}/deny"
              payload: { decision_reason: "played too much" }
              as: TrustSafety
          trigger:
            - call: "POST /storefront/refund-requests/${rr_id}/approve"
              payload: {}
              as: TrustSafety
              captures: { err1: $.data.error_id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/reject"
              payload: { review_notes: "too late" }
              as: StoreReviewer
              captures: { err2: $.data.error_id }
          assert:
            - "approve of DENIED refund rejected with ERR_INVALID_STATE"
            - "reject of APPROVED store-page review rejected with ERR_INVALID_STATE"
            - "RefundRequest.${rr_id}.status == DENIED with decision_reason 'played too much'"

      - name: developer_terminate_revokes_unused_keys
        claim_type: cascade_down
        grounds:
          - state_machines.DeveloperAccount
          - state_machines.ActivationKey
        distinguishing_aspect: "Terminating the developer cascades: title DELISTED and all UNUSED keys REVOKED; a subsequent redeem of a revoked key fails."
        test_recipe:
          setup: ["Active developer, RELEASED title, APPROVED batch of 2 keys"]
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Rev Studio", contact_email: "rev@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Rev Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/key-batches"
              payload: { title_id: "${t_id}", requested_quantity: 2, free_keys_in_batch: 0 }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { kb_id: $.data.id }
            - call: "POST /storefront/key-batches/${kb_id}/approve"
              payload: {}
              as: PlatformOps
            - call: "GET /storefront/key-batches/${kb_id}/keys"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { k0: $.data.0.key_code }
            - call: "POST /storefront/user-accounts"
              payload: { email: "rk@players.example" }
              as: PlatformOps
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /storefront/developer-accounts/${dv_id}/terminate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/keys/redeem"
              payload: { key_code: "${k0}" }
              as: User
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Title.${t_id}.status == DELISTED"
            - "Redeem of revoked key rejected with ERR_KEY_NOT_REDEEMABLE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: tier_boundary_inclusive_crossing
        claim_type: correct_result
        grounds:
          - calculations.revenue_share_tier_evaluation
        distinguishing_aspect: "At recognized revenue exactly 1000000000 cents the tier is 2 (inclusive >=); a 1-cent refund dropping it to 999999999 degrades the tier back to 1 and the NEXT purchase's split uses 30% again."
        test_recipe:
          setup: ["RELEASED title; a purchase whose refund lands the ledger exactly on the boundary; PlatformOps adjustment to push ledger to exactly TIER2_THRESHOLD"]
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Tier Studio", contact_email: "tier@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Tier Game", base_price_usd_cents: 100, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { tv: $.data.version }
            - call: "POST /storefront/titles/${t_id}/adjustments"
              payload: { delta_usd_cents: 1000000000, reason: "seed", expected_title_version: "${tv}" }
              as: PlatformOps
          trigger:
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { tier_at: $.data.current_tier, tv2: $.data.version }
            - call: "POST /storefront/user-accounts"
              payload: { email: "t1@players.example" }
              as: PlatformOps
              captures: { u1: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u1}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u1}"
              captures: { p_tier2: $.data.id, fee_t2: $.data.platform_fee_cents }
            - call: "POST /storefront/refund-requests"
              payload: { purchase_id: "${p_tier2}", amount_cents: 1, reason: "cent back" }
              as: User
              as_user_id: "${u1}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "t2@players.example" }
              as: PlatformOps
              captures: { u2: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u2}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u2}"
              captures: { fee_t1: $.data.platform_fee_cents }
          assert:
            - "tier at recognized == 1000000000 is 2 (inclusive boundary)"
            - "tier-2 purchase fee == round_half_up(100*0.25) == 25"
            - "After purchase (+100) then 1-cent partial refund: recognized == 1000000099, tier remains 2"
            - "Second purchase fee == 25 (tier still 2 after refund)"
            - "Purchase partial refund leaves status PARTIALLY_REFUNDED"

      - name: recent_review_summary_thresholds
        claim_type: correct_result
        grounds:
          - calculations.review_score_aggregation
        distinguishing_aspect: "recent_review_summary bucket boundaries: 7 positive / 3 negative (0.70 share) -> MOSTLY_POSITIVE; 4/10 -> MIXED; 3/10 -> MOSTLY_NEGATIVE (boundary inclusive at 0.70 and 0.40)."
        test_recipe:
          setup: ["RELEASED title; 10 owners with purchases; clock 2026-09-03"]
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Sum Studio", contact_email: "sum@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Sum Game", base_price_usd_cents: 500, early_access: false }
              as: Developer
