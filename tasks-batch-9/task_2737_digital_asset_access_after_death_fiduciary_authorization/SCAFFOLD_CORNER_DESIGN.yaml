  # ===========================================================================
  - section: rbac
    instances:

      - name: role_gates_separate_the_endpoint_from_the_individual_action
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - roles
        distinguishing_aspect: |
          Priority 3 rejects a role that is absent from the endpoint's authorized_roles, while priority
          5 rejects a role that is authorized on the /transitions endpoint but not for the submitted
          action — so DECIDE as Fiduciary and SUBMIT as PlatformCompliance are ERR_ACTION_ROLE_MISMATCH
          on the very same path where VERIFY as Fiduciary is ERR_ROLE_NOT_PERMITTED, and both are
          decided before any state check.
        test_recipe:
          setup:
            - "one Platform, one Estate with one Fiduciary, one PENDING DEATH_CERTIFICATE and one DRAFT CATALOG_ACCESS request"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C36" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C36" }
