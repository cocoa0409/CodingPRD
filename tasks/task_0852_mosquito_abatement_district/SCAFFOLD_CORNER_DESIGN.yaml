      - name: corner_request_resolve_before_inspection_returns_not_verified
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceRequest.INSPECTED_to_RESOLVED
          - errors[ERR_REQUEST_NOT_VERIFIED]
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "RESOLVE from ASSIGNED has no transition (ERR_INVALID_TRANSITION), and the priority-11 verification gate ERR_REQUEST_NOT_VERIFIED is what blocks RESOLVE from INSPECTED whenever verification_status is somehow still UNVERIFIED; the happy path only opens after INSPECT records FIELD_CONFIRMED."
        test_recipe:
          setup:
            - "One ServiceRequest triaged and ASSIGNED to an ACTIVE applicator, verification_status still UNVERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "LARVICIDE_ONLY", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "a@example.com", category: "STANDING_WATER", description: "Pooled water by the fence", x_m: 10, y_m: 10 }
              as: Resident
              as_user_id: "u-res-1"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "TRIAGE", priority: "URGENT" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { due_urgent: $.data.due_at }
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "ASSIGN", assigned_applicator_id: "${tech_id}" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "RESOLVE", resolution_note: "Nothing found" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "INSPECT", verification_status: "FIELD_CONFIRMED" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "RESOLVE", resolution_note: "Treated and drained" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { final_handling: $.data.handling_status }
          assert:
            - "${due_urgent} == 2026-06-02T00:00:00.000Z"
            - "${err_id} == ERR_INVALID_TRANSITION"
            - "${final_handling} == RESOLVED"
            - "ServiceRequest.${req_id}.resolved_at == 2026-06-01T00:00:00.000Z"
            - "ServiceArea.${area_id}.request_open_count == 0"
            - "ServiceArea.${area_id}.request_resolved_count == 1"

      - name: corner_request_assign_to_suspended_applicator_rejected
