              as: LineOperator
              captures: { h1_after: $.data.version }
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 100 }
              as: LineOperator
            - call: "POST /api/hoppers/${h1}/load"
