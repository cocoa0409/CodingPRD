      - name: unknown_path_and_body_ids_return_their_not_found_errors
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_LISTING_NOT_FOUND]
          - errors[ERR_NEGOTIATION_NOT_FOUND]
          - errors[ERR_SALE_ORDER_NOT_FOUND]
          - errors[ERR_APPOINTMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_MANIFEST_LINE_NOT_FOUND]
          - errors[ERR_SELLER_NOT_FOUND]
          - errors[ERR_BUYER_NOT_FOUND]
          - errors[ERR_CARRIER_NOT_FOUND]
          - errors[ERR_BRAND_POLICY_NOT_FOUND]
          - validations[priority 3 -> per-entity NOT_FOUND]
          - validations[priority 8 -> body foreign keys resolve]
        distinguishing_aspect: >
          Existence is checked in two distinct places with two distinct priorities: an unresolved
          {id} in the path yields that segment's own 404 at priority 3, while an unresolved
          foreign key in the request body yields its own 404 at priority 8 - so seller_id,
          buyer_id, carrier_id and brand_policy_id in bodies are separately falsifiable from the
          path ids, and each entity family returns its own error id rather than one generic 404.
