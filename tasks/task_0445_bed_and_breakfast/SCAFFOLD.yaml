# =============================================================================
# Bed & Breakfast / Boutique Inn — benchmark seed tables (Expert band)
# Room inventory & rate, peak / two-night minimum, breakfast & dietary,
# direct-booking vs OTA, deposit & cancellation tiers, housekeeping & turnover,
# occupancy / lodging tax remittance, gift certificate & package.
# =============================================================================

scenario: |
  Bed & Breakfast / Boutique Inn: room inventory & rate, peak/two-night minimum,
  breakfast & dietary, direct-booking vs OTA, deposit & cancellation tier,
  housekeeping & turnover, occupancy/lodging tax remittance, gift certificate & package

domain_name: bed-and-breakfast
api_prefix: /inns/{inn_id}

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Room, Booking, GiftCertificate, Package, TaxRemittance) joined
  # by FK references, not nested ownership trees. Inn is a shared config root that
  # peers reference by inn_id; URLs stay flat under /inns/{inn_id}/<collection>.

  state_machine_shape: parallel
  # Booking carries two independent state axes: reservation_status (lifecycle of
  # the stay) and payment_status (deposit/settlement money trail) that evolve on
  # the same row. HousekeepingTask and GiftCertificate add branching machines.

  relationship_patterns:
    - one_to_many        # Inn -> Room/Booking/Package/GiftCertificate/TaxRemittance
    - cross_aggregate    # Booking references Room, Package, GiftCertificate across peers
    - polymorphic        # PaymentLedgerEntry.source_kind references DEPOSIT|REFUND|REDEMPTION

  role_model: peer_roles
  # Guest owns its own bookings; Innkeeper owns inventory + rates + packages;
  # Housekeeper owns turnover; FinanceManager owns tax remittance + gift certs.
  # FinanceManager is opaque (operator), the others are entity-backed or operator.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Inn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Inn display name" }
      - { name: lodging_tax_rate_bps, type: integer, source: input, description: "Occupancy/lodging tax rate in basis points (e.g. 1450 = 14.50%); applied to taxable room revenue" }
      - { name: checkin_time, type: string, source: input, description: "Daily check-in clock time HH:MM, used for cancellation-tier day math", default: "15:00" }
      - { name: checkout_time, type: string, source: input, description: "Daily check-out clock time HH:MM", default: "11:00" }
      - { name: gift_cert_expiry_days, type: integer, source: input, description: "Days from issuance after which a GiftCertificate expires", default: 365 }
      - { name: turnover_minutes, type: integer, source: input, description: "Minimum minutes a Room must rest between a checkout and the next check-in (turnover buffer)", default: 180 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id" }
      - { name: name, type: string, source: input, description: "Room label, unique within an Inn (e.g. 'Rose Suite')" }
      - { name: base_rate_cents, type: integer, source: input, description: "Nightly rack rate in cents before any RatePeriod multiplier", constraints: ">= 0" }
      - { name: max_occupancy, type: integer, source: input, description: "Maximum guest headcount", constraints: ">= 1" }
      - { name: is_taxable, type: boolean, source: input, description: "Whether room revenue is subject to lodging tax", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED rooms accept no new bookings", default: "ACTIVE", constraints: "ACTIVE,RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; bumped on every booking placed/released against this room and on room edits" }

  - name: RatePeriod
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id; rate period is inn-wide and applies to every Room of the inn" }
      - { name: label, type: string, source: input, description: "Human label (e.g. 'Summer Peak')" }
      - { name: start_date, type: string, source: input, description: "First night (inclusive) this period governs, YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last night (inclusive) this period governs, YYYY-MM-DD; must be >= start_date" }
      - { name: rate_multiplier_bps, type: integer, source: input, description: "Multiplier in basis points applied to Room.base_rate_cents for nights inside the window (10000 = 1.0x, 15000 = 1.5x peak)", constraints: ">= 0" }
      - { name: min_nights, type: integer, source: input, description: "Two-night-minimum style floor: a booking whose stay touches any night in this window must span >= min_nights total nights", default: 1, constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Package
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id" }
      - { name: name, type: string, source: input, description: "Package name (e.g. 'Romance Package')" }
      - { name: flat_add_cents, type: integer, source: input, description: "Flat add-on charged once per booking that selects this package", default: 0, constraints: ">= 0" }
      - { name: per_night_add_cents, type: integer, source: input, description: "Add-on charged per night of the stay", default: 0, constraints: ">= 0" }
      - { name: is_taxable, type: boolean, source: input, description: "Whether the package add-on revenue is subject to lodging tax", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED packages cannot be selected on new bookings", default: "ACTIVE", constraints: "ACTIVE,RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Guest
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; equals X-User-ID when acting as Guest" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id" }
      - { name: full_name, type: string, source: input, description: "Guest legal name" }
      - { name: email, type: string, source: input, description: "Contact email, unique within an Inn" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: GiftCertificate
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id" }
      - { name: code, type: string, source: system, description: "Server-issued redemption code, unique within an Inn" }
      - { name: face_value_cents, type: integer, source: input, description: "Original loaded value in cents", constraints: ">= 1" }
      - { name: remaining_cents, type: integer, source: computed, description: "Face value minus sum of applied redemptions; never negative" }
      - { name: issued_on, type: string, source: system, description: "Issuance date YYYY-MM-DD, stamped from the logical clock at creation" }
      - { name: expires_on, type: string, source: system, description: "issued_on + Inn.gift_cert_expiry_days; certificate is invalid for redemption on/after this date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | EXPIRED | VOID", default: "ACTIVE", constraints: "ACTIVE,DEPLETED,EXPIRED,VOID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; bumped on each redemption applied or void" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; optional, null when no package selected" }
      - { name: channel, type: enum, source: input, description: "DIRECT | OTA; DIRECT booked through the inn, OTA booked through an online travel agency", constraints: "DIRECT,OTA" }
      - { name: ota_commission_bps, type: integer, source: input, description: "Commission basis points withheld by the OTA on OTA bookings; ignored (forced 0) for DIRECT", default: 0 }
      - { name: checkin_date, type: string, source: input, description: "Arrival night, YYYY-MM-DD (first occupied night)" }
      - { name: checkout_date, type: string, source: input, description: "Departure date, YYYY-MM-DD; nights = checkout_date - checkin_date, must be >= 1" }
      - { name: guest_count, type: integer, source: input, description: "Headcount; must be <= Room.max_occupancy", constraints: ">= 1" }
      - { name: nights, type: integer, source: computed, description: "checkout_date - checkin_date in days" }
      - { name: room_charge_cents, type: integer, source: computed, description: "Sum over occupied nights of base_rate * applicable RatePeriod multiplier; see calc room_charge" }
      - { name: package_charge_cents, type: integer, source: computed, description: "Package flat + per_night add-ons; 0 when no package" }
      - { name: taxable_base_cents, type: integer, source: computed, description: "Room + package revenue subject to lodging tax" }
      - { name: lodging_tax_cents, type: integer, source: computed, description: "Tax computed from taxable_base_cents; see calc lodging_tax" }
      - { name: total_cents, type: integer, source: computed, description: "room_charge + package_charge + lodging_tax" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "Deposit required at confirmation; see calc deposit_due" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Sum of DEPOSIT PaymentLedgerEntry.amount_cents (incl. gift redemptions) minus REFUND entries" }
      - { name: refund_cents, type: integer, source: computed, description: "Amount refunded on cancellation; see calc cancellation_refund; 0 until cancelled" }
      - { name: net_inn_revenue_cents, type: integer, source: computed, description: "total minus OTA commission minus lodging_tax (commission applies only to OTA channel)" }
      - { name: reservation_status, type: enum, source: system, description: "PENDING | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED | NO_SHOW", default: "PENDING", constraints: "PENDING,CONFIRMED,CHECKED_IN,CHECKED_OUT,CANCELLED,NO_SHOW" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | DEPOSIT_HELD | SETTLED | REFUNDED | FORFEITED", default: "UNPAID", constraints: "UNPAID,DEPOSIT_HELD,SETTLED,REFUNDED,FORFEITED" }
      - { name: cancelled_on, type: string, source: system, description: "Logical-clock date YYYY-MM-DD when cancellation was requested; null until cancelled" }
      - { name: remitted, type: boolean, source: system, description: "True once this booking's lodging tax has been swept into a TaxRemittance batch", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation incl. cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: BreakfastPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; one breakfast plan per booking" }
      - { name: party_size, type: integer, source: input, description: "Number of covers to prepare each morning; must be <= the booking's guest_count", constraints: ">= 1" }
      - { name: dietary_flags, type: array, source: input, description: "Subset of {VEGETARIAN, VEGAN, GLUTEN_FREE, NUT_FREE, DAIRY_FREE}; VEGAN implies VEGETARIAN" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CANCELLED", default: "REQUESTED", constraints: "REQUESTED,CONFIRMED,CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PaymentLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: source_kind, type: enum, source: system, description: "Polymorphic ledger kind: DEPOSIT | REFUND | REDEMPTION | FORFEIT", constraints: "DEPOSIT,REFUND,REDEMPTION,FORFEIT" }
      - { name: gift_certificate_id, type: string, source: system, description: "FK -> GiftCertificate.id; set only on REDEMPTION entries, else null" }
      - { name: amount_cents, type: integer, source: system, description: "Signed minor units: DEPOSIT/REDEMPTION are positive (money in), REFUND is negative (money out), FORFEIT is 0 audit marker" }
      - { name: occurred_on, type: string, source: system, description: "Logical-clock date YYYY-MM-DD when the entry was recorded" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; append-only, never mutated" }

  - name: HousekeepingTask
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the stay whose checkout created this turnover task" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; copied from the booking" }
      - { name: ready_after, type: string, source: system, description: "Earliest logical-clock datetime the room may receive a new check-in: booking checkout instant + Inn.turnover_minutes" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | DONE | SKIPPED", default: "PENDING", constraints: "PENDING,IN_PROGRESS,DONE,SKIPPED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: TaxRemittance
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: inn_id, type: string, source: input, description: "FK -> Inn.id" }
      - { name: period_start, type: string, source: input, description: "Remittance period first date YYYY-MM-DD (inclusive), matched on Booking.checkout_date" }
      - { name: period_end, type: string, source: input, description: "Remittance period last date YYYY-MM-DD (inclusive); must be >= period_start" }
      - { name: variant, type: enum, source: input, description: "ESTIMATED | FINAL; ESTIMATED sweeps on confirmed-revenue, FINAL sweeps on realized checked-out revenue; see calc tax_remittance_total", constraints: "ESTIMATED,FINAL" }
      - { name: swept_booking_count, type: integer, source: computed, description: "Count of bookings included in this remittance" }
      - { name: tax_total_cents, type: integer, source: computed, description: "Sum of lodging_tax_cents across swept bookings under the chosen variant" }
      - { name: status, type: enum, source: system, description: "OPEN | FILED; FILED marks each swept Booking.remitted = true", default: "OPEN", constraints: "OPEN,FILED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Booking: axis 1 — reservation_status (lifecycle of the stay) ----------
  - entity: Booking
    field: reservation_status
    initial_state: PENDING
    terminal_states: [CHECKED_OUT, CANCELLED, NO_SHOW]
    note: "Parallel to payment_status; the two axes evolve independently on the same row."
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /inns/{inn_id}/bookings/{booking_id}/confirm"
        actor: Guest
        preconditions:
          - "Booking.reservation_status == PENDING"
          - "Room.status == ACTIVE"
          - "No CONFIRMED/CHECKED_IN booking on the same Room whose [checkin_date, checkout_date) night interval overlaps this booking (see validation p70)"
          - "deposit_paid_cents >= deposit_due_cents (deposit fully covered, possibly via gift redemption)"
        side_effects:
          - "payment_status: UNPAID -> DEPOSIT_HELD (axis-2 transition fires)"
          - "increments Room.version by 1 (the room night-interval is now committed)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /inns/{inn_id}/bookings/{booking_id}/check-in"
        actor: Innkeeper
        preconditions:
          - "Booking.reservation_status == CONFIRMED"
          - "logical clock date >= checkin_date"
          - "The Room's most recent HousekeepingTask (if any) has status DONE or SKIPPED and its ready_after <= current logical clock (turnover satisfied; see validation p80)"
        side_effects: []

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /inns/{inn_id}/bookings/{booking_id}/check-out"
        actor: Innkeeper
        preconditions:
          - "Booking.reservation_status == CHECKED_IN"
        side_effects:
          - "payment_status: DEPOSIT_HELD -> SETTLED (axis-2; balance considered collected)"
          - "creates a HousekeepingTask in PENDING for Room.id with ready_after = checkout instant + Inn.turnover_minutes (cascade hop 1)"
          - "increments Room.version by 1"

      - from: [PENDING, CONFIRMED]
        to: CANCELLED
        trigger: "POST /inns/{inn_id}/bookings/{booking_id}/cancel"
        actor: Guest
        preconditions:
          - "Booking.reservation_status IN {PENDING, CONFIRMED}"
        side_effects:
          - "stamps cancelled_on = current logical clock date"
          - "computes refund_cents via calc cancellation_refund (tier keyed on days-before-checkin)"
          - "if refund_cents > 0: appends a REFUND PaymentLedgerEntry (amount = -refund_cents); payment_status -> REFUNDED (axis-2)"
          - "if refund_cents == 0 and deposit_paid_cents > 0: appends a FORFEIT PaymentLedgerEntry (amount 0); payment_status -> FORFEITED (axis-2)"
          - "if the cancelled booking had a redemption: GiftCertificate redeemed amount net of forfeiture is restored (cascade hop — see calc cancellation_refund variants and GiftCertificate machine)"
          - "increments Room.version by 1 (night interval released, room re-bookable)"
          - "if a BreakfastPlan exists in REQUESTED/CONFIRMED: it transitions to CANCELLED (cascade hop 2)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /inns/{inn_id}/bookings/{booking_id}/mark-no-show"
        actor: Innkeeper
        preconditions:
          - "Booking.reservation_status == CONFIRMED"
          - "logical clock date > checkin_date (the arrival night has fully passed); if not yet passed the transition is rejected with ERR_INVALID_STATE (booking is not yet no-show-eligible)"
        side_effects:
          - "payment_status: DEPOSIT_HELD -> FORFEITED (axis-2); entire deposit is forfeited, no refund"
          - "appends a FORFEIT PaymentLedgerEntry (amount 0)"
          - "increments Room.version by 1 (night interval released)"
          - "if a BreakfastPlan exists in REQUESTED/CONFIRMED: it transitions to CANCELLED (cascade)"

  # ---- Booking: axis 2 — payment_status (money trail) ------------------------
  - entity: Booking
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, FORFEITED]
    note: "Driven entirely by reservation_status side-effects above; never set by a direct endpoint."
    transitions:
      - from: UNPAID
        to: DEPOSIT_HELD
        trigger: "system (reservation_status PENDING -> CONFIRMED)"
        actor: system
        preconditions: ["deposit_paid_cents >= deposit_due_cents"]
        side_effects: []
      - from: DEPOSIT_HELD
        to: SETTLED
        trigger: "system (reservation_status CHECKED_IN -> CHECKED_OUT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPOSIT_HELD
        to: REFUNDED
        trigger: "system (reservation_status -> CANCELLED with refund_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [UNPAID, DEPOSIT_HELD]
        to: FORFEITED
        trigger: "system (reservation_status -> CANCELLED with refund_cents == 0, or -> NO_SHOW)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- GiftCertificate -------------------------------------------------------
  - entity: GiftCertificate
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, VOID]
    note: "Branching: ACTIVE may go to DEPLETED (and back to ACTIVE if a cancellation restores balance), EXPIRED, or VOID."
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (a REDEMPTION drives remaining_cents to exactly 0)"
        actor: system
        preconditions: ["remaining_cents == 0 after the redemption"]
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (a booking cancellation restores redeemed value, remaining_cents > 0 again)"
        actor: system
        preconditions: ["remaining_cents > 0 after restoration", "expires_on is in the future relative to the logical clock"]
        side_effects: []
      - from: [ACTIVE, DEPLETED]
        to: EXPIRED
        trigger: "system (redemption attempted on/after expires_on, or finance voids an expired cert)"
        actor: system
        preconditions: ["logical clock date >= expires_on"]
        side_effects: []
      - from: ACTIVE
        to: VOID
        trigger: "POST /inns/{inn_id}/gift-certificates/{gift_certificate_id}/void"
        actor: FinanceManager
        preconditions: ["No REDEMPTION PaymentLedgerEntry references this certificate (remaining_cents == face_value_cents)"]
        side_effects: ["Certificate can no longer be redeemed"]

  # ---- HousekeepingTask (turnover) ------------------------------------------
  - entity: HousekeepingTask
    field: status
    initial_state: PENDING
    terminal_states: [DONE, SKIPPED]
    note: "Branching: PENDING -> IN_PROGRESS -> DONE, or PENDING -> SKIPPED."
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}/start"
        actor: Housekeeper
        preconditions: ["HousekeepingTask.status == PENDING"]
        side_effects: []
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}/complete"
        actor: Housekeeper
        preconditions: ["HousekeepingTask.status == IN_PROGRESS"]
        side_effects: ["Room becomes eligible for new check-ins once ready_after <= logical clock"]
      - from: PENDING
        to: SKIPPED
        trigger: "POST /inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}/skip"
        actor: Innkeeper
        preconditions: ["HousekeepingTask.status == PENDING"]
        side_effects: ["Turnover waived; Room eligible for check-in once ready_after <= logical clock"]

  # ---- BreakfastPlan ---------------------------------------------------------
  - entity: BreakfastPlan
    field: status
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    note: "REQUESTED -> CONFIRMED -> CANCELLED, or REQUESTED -> CANCELLED; CANCELLED is terminal."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /inns/{inn_id}/breakfast-plans/{breakfast_plan_id}/confirm"
        actor: Innkeeper
        preconditions:
          - "BreakfastPlan.status == REQUESTED"
          - "The parent Booking.reservation_status IN {CONFIRMED, CHECKED_IN} (kitchen only commits covers for live stays; see validation p72)"
        side_effects: []
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /inns/{inn_id}/breakfast-plans/{breakfast_plan_id}/cancel OR system (parent Booking cancelled/no-show)"
        actor: "Guest or system"
        preconditions: ["BreakfastPlan.status IN {REQUESTED, CONFIRMED}"]
        side_effects: []

  # ---- TaxRemittance ---------------------------------------------------------
  - entity: TaxRemittance
    field: status
    initial_state: OPEN
    terminal_states: [FILED]
    transitions:
      - from: OPEN
        to: FILED
        trigger: "POST /inns/{inn_id}/tax-remittances/{tax_remittance_id}/file"
        actor: FinanceManager
        preconditions:
          - "TaxRemittance.status == OPEN"
          - "No swept booking already has remitted == true (no double-remit; see validation p74)"
        side_effects:
          - "freezes swept_booking_count and tax_total_cents at filing time"
          - "sets remitted = true on every swept Booking (cascade across the swept set)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-confirm-stale-room
    parent_entity: Room
    write_endpoint: "POST /inns/{inn_id}/bookings/{booking_id}/confirm"
    occ_field: "expected_room_version"
    description: |
      Confirming a Booking commits its night interval against the Room and bumps
      Room.version. If the Room's version has advanced since the client last
      observed it — because another booking on the same room was already confirmed
      (legitimately occupying an adjacent or overlapping interval) — the current
      confirm is rejected as stale. This is the CREATE-with-supersede race: the
      loser's view of the room's committed intervals is out of date.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: gift-redemption-stale-cert
    parent_entity: GiftCertificate
    write_endpoint: "POST /inns/{inn_id}/bookings/{booking_id}/redeem-gift"
    occ_field: "expected_gift_certificate_version"
    description: |
      Applying a gift-certificate redemption against a Booking debits the
      certificate's remaining_cents and bumps GiftCertificate.version. If the
      certificate version has advanced since the client read it — another booking
      already redeemed part of the balance — the current redemption is rejected as
      stale rather than overdrawing the certificate.
    error_id: ERR_STALE_GIFT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: room_charge
    trigger: "Booking create; recomputed on confirm"
    algorithm: chronological
    formula: |
      nights = date_diff(checkout_date, checkin_date)            # whole days, >= 1
      occupied_nights = [checkin_date, checkin_date+1, ..., checkout_date-1]   # half-open: checkout night NOT occupied
      room_charge_cents = 0
      for night in occupied_nights (ascending date order):       # deterministic ascending date order
          period = the RatePeriod of this inn whose [start_date, end_date] inclusive window contains `night`,
                   choosing the one with the HIGHEST rate_multiplier_bps when several windows contain `night`,
                   tie-broken by RatePeriod.created_at ASC; if none contains `night`, multiplier = 10000
          nightly = floor(base_rate_cents * multiplier_bps / 10000)   # round per-night, then sum (ORDER PINNED)
          room_charge_cents += nightly
    input_set: "Occupied nights are the half-open interval [checkin_date, checkout_date); the checkout date itself is not charged."
    constants:
      DEFAULT_MULTIPLIER_BPS: 10000
    precision: "integer cents; floor per-night BEFORE summing (round-then-sum, not sum-then-round)"

  - name: package_charge
    trigger: "Booking create; recomputed on confirm"
    algorithm: aggregation
    formula: |
      if package_id is null: package_charge_cents = 0
      else: package_charge_cents = Package.flat_add_cents + Package.per_night_add_cents * nights
    input_set: "Package referenced by package_id; flat charged once, per_night times the night count."
    precision: "integer cents"

  - name: lodging_tax
    trigger: "Booking create; recomputed on confirm"
    algorithm: threshold
    formula: |
      taxable_base_cents = (Room.is_taxable ? room_charge_cents : 0)
                         + (package_id != null AND Package.is_taxable ? package_charge_cents : 0)
      lodging_tax_cents = round_half_up(taxable_base_cents * Inn.lodging_tax_rate_bps / 10000)
      total_cents = room_charge_cents + package_charge_cents + lodging_tax_cents
    input_set: "Only revenue lines whose is_taxable flag is true enter taxable_base_cents."
    constants:
      BPS_DENOM: 10000
    precision: "round_half_up to integer cents on the single tax multiplication"

  - name: deposit_due
    trigger: "Booking create; recomputed on confirm"
    algorithm: tiered_pricing
    formula: |
      # Deposit policy differs by booking channel (different entity-state branch).
      if channel == DIRECT:
          deposit_due_cents = round_half_up(total_cents * DIRECT_DEPOSIT_BPS / 10000)   # 30%
      else:  # OTA
          deposit_due_cents = total_cents                                               # OTA prepays in full
      # First-night floor: deposit is never less than one night's room charge.
      first_night_cents = nightly charge of the FIRST occupied night (from room_charge, before summing)
      deposit_due_cents = max(deposit_due_cents, first_night_cents)
    input_set: "Uses total_cents and the first occupied night's nightly charge."
    constants:
      DIRECT_DEPOSIT_BPS: 3000
    precision: "round_half_up to integer cents on the percentage branch; max() applied AFTER rounding"
    variants:
      - name: direct_percentage
        when: "channel == DIRECT"
        difference: "30% of total, floored at one night's room charge"
      - name: ota_full_prepay
        when: "channel == OTA"
        difference: "full total prepaid; first-night floor is a no-op since total >= one night"

  - name: cancellation_refund
    trigger: "Booking reservation_status -> CANCELLED"
    algorithm: tiered_pricing
    formula: |
      days_before = date_diff(checkin_date, cancelled_on)      # >= 0; negative clamped to 0
      # Tier table keyed on days_before checkin (refund_pct of deposit_paid_cents):
      #   days_before >= 14        -> 100%   (full refund)
      #   7  <= days_before < 14   ->  50%
      #   1  <= days_before <   7  ->  10%
      #   days_before == 0 (same day) ->  0%
      refund_pct_bps = tier_lookup(days_before)
      gross_refund = round_half_up(deposit_paid_cents * refund_pct_bps / 10000)
      # OTA bookings are non-refundable below the 14-day tier regardless of tier table.
      if channel == OTA AND days_before < 14: gross_refund = 0
      refund_cents = gross_refund
    input_set: "deposit_paid_cents at cancellation time (cash + gift redemptions); tier boundaries are >= comparisons (14 inclusive, 7 inclusive, 1 inclusive)."
    constants:
      TIER_FULL_DAYS: 14
      TIER_HALF_DAYS: 7
      TIER_TOKEN_DAYS: 1
      FULL_BPS: 10000
      HALF_BPS: 5000
      TOKEN_BPS: 1000
    precision: "round_half_up to integer cents; tier boundaries use >= (14 -> full, 7 -> half, 1 -> token, 0 -> none)"
    variants:
      - name: provisional_refund_estimate
        when: "GET /inns/{inn_id}/bookings/{booking_id}/refund-quote (what-if, booking still CONFIRMED)"
        difference: "Computed against TODAY's logical clock (days_before from now); booking NOT mutated, no ledger entry, no gift restore."
      - name: final_refund_on_cancel
        when: "POST .../cancel actually executes"
        difference: "Computed against cancelled_on (the clock at the cancel call); writes refund_cents, appends REFUND ledger entry, restores gift balance for the refunded portion."

  - name: gift_restore_on_cancel
    trigger: "Booking cancel when a REDEMPTION ledger entry exists for the booking"
    algorithm: waterfall_allocation
    formula: |
      # A cancellation refund pays back cash first, then restores gift balance.
      redeemed_total = sum(PaymentLedgerEntry.amount_cents WHERE booking_id == this AND source_kind == REDEMPTION)
      cash_deposit   = sum(PaymentLedgerEntry.amount_cents WHERE booking_id == this AND source_kind == DEPOSIT)
      # refund_cents (from cancellation_refund) is allocated across buckets in priority order:
      #   bucket 1: cash deposit (refunded as a negative REFUND ledger entry)
      #   bucket 2: gift redemption (restored to GiftCertificate.remaining_cents)
      cash_refund = min(refund_cents, cash_deposit)
      gift_restore = refund_cents - cash_refund                  # remainder flows to gift bucket
      GiftCertificate.remaining_cents += gift_restore
      if GiftCertificate.status == DEPLETED and gift_restore > 0 and not expired: status -> ACTIVE
    input_set: "Ledger entries for this booking; refund_cents from cancellation_refund."
    precision: "integer cents; cash bucket fills before gift bucket (ORDER PINNED)"

  - name: tax_remittance_total
    trigger: "TaxRemittance create; frozen at file"
    algorithm: aggregation
    formula: |
      # variant chooses which bookings' tax is swept for [period_start, period_end] (inclusive on checkout_date):
      if variant == ESTIMATED:
          pool = bookings WHERE inn_id == this AND remitted == false
                 AND reservation_status IN {CONFIRMED, CHECKED_IN, CHECKED_OUT}
                 AND checkout_date BETWEEN period_start AND period_end (inclusive)
      else:  # FINAL
          pool = bookings WHERE inn_id == this AND remitted == false
                 AND reservation_status == CHECKED_OUT
                 AND checkout_date BETWEEN period_start AND period_end (inclusive)
      swept_booking_count = count(pool)
      tax_total_cents = sum(b.lodging_tax_cents for b in pool)
    input_set: "Same calendar window and inn; ESTIMATED includes still-confirmed/in-house stays, FINAL only realized checkouts."
    precision: "integer cents; pure sum of already-rounded per-booking lodging_tax_cents"
    variants:
      - name: estimated_remittance
        when: "variant == ESTIMATED"
        difference: "Includes CONFIRMED + CHECKED_IN + CHECKED_OUT bookings — forward-looking accrual on expected stays."
      - name: final_remittance
        when: "variant == FINAL"
        difference: "Includes only CHECKED_OUT bookings — realized revenue; a confirmed-but-not-yet-stayed booking is excluded, so FINAL <= ESTIMATED for the same window."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: "Guest acting on a Booking must own it (Booking.guest_id == X-User-ID)"
    error_id: ERR_NOT_BOOKING_OWNER
    http_status: 403
    applies_to: "Guest-driven booking actions (confirm, cancel, redeem-gift, refund-quote)"

  - priority: 30
    category: existence
    check: "Path resources exist within the inn scope, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 35
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, dates parseable, integers non-negative where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all writes

  - priority: 40
    category: business_referential
    check: "FK targets (room_id, guest_id, package_id, gift_certificate_id) belong to the same inn as the path inn_id"
    error_id: ERR_CROSS_INN_REFERENCE
    http_status: 409
    applies_to: "Booking create, gift redemption"

  - priority: 50
    category: business_temporal
    check: "checkout_date > checkin_date (nights >= 1); RatePeriod.end_date >= start_date; TaxRemittance.period_end >= period_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "Booking create, RatePeriod create, TaxRemittance create"

  - priority: 55
    category: business_constraint
    check: "guest_count <= Room.max_occupancy"
    error_id: ERR_OCCUPANCY_EXCEEDED
    http_status: 422
    applies_to: "Booking create"

  - priority: 60
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2 from-states)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 65
    category: business_constraint
    check: "Booking selecting a Package requires Package.status == ACTIVE; booking against a RETIRED Room is rejected"
    error_id: ERR_RESOURCE_RETIRED
    http_status: 409
    applies_to: "Booking create"

  - priority: 68
    category: business_safety
    check: "BreakfastPlan.party_size <= parent Booking.guest_count"
    error_id: ERR_BREAKFAST_OVER_PARTY
    http_status: 422
    applies_to: "BreakfastPlan create"

  - priority: 70
    category: business_temporal
    check: "On confirm, no other CONFIRMED/CHECKED_IN booking on the same Room has a [checkin_date, checkout_date) night interval overlapping this one. Half-open semantics: a booking ending exactly on another's start night does NOT overlap (back-to-back same-day turnover is allowed at the date level)."
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "Booking confirm"

  - priority: 72
    category: business_temporal
    check: "On check-in, the Room's turnover buffer is satisfied: the latest non-SKIPPED HousekeepingTask for the room must be DONE and its ready_after <= current logical clock. Buffer is an instant-level gap (checkout instant + turnover_minutes), distinct from the date-level interval rule at p70."
    error_id: ERR_TURNOVER_NOT_READY
    http_status: 409
    applies_to: "Booking check-in"

  - priority: 74
    category: business_constraint
    check: "Two-night-minimum: if the stay touches any night governed by a RatePeriod with min_nights > 1, nights >= that period's min_nights (max over all touched periods)"
    error_id: ERR_MIN_NIGHTS_NOT_MET
    http_status: 422
    applies_to: "Booking create"

  - priority: 76
    category: business_fiscal
    check: "Cash deposit amount_cents >= 1 AND amount_cents <= (total_cents - deposit_paid_cents); a payment that would overpay the booking is rejected"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "Booking pay-deposit"

  - priority: 78
    category: business_fiscal
    check: "Gift redemption amount_cents >= 1 AND amount_cents <= min(GiftCertificate.remaining_cents, booking outstanding owed = total_cents - deposit_paid_cents); certificate ACTIVE and not expired (logical clock < expires_on)"
    error_id: ERR_GIFT_INSUFFICIENT
    http_status: 422
    applies_to: "Booking redeem-gift"

  - priority: 80
    category: business_fiscal
    check: "On confirm, deposit_paid_cents >= deposit_due_cents"
    error_id: ERR_DEPOSIT_NOT_MET
    http_status: 422
    applies_to: "Booking confirm"

  - priority: 84
    category: business_constraint
    check: "TaxRemittance file: no swept booking already has remitted == true (no double-remit)"
    error_id: ERR_ALREADY_REMITTED
    http_status: 409
    applies_to: "TaxRemittance file"

  - priority: 90
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes (§1.2.1)"
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412
    applies_to: "Booking confirm, Booking redeem-gift"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time. All date math (cancellation tiers, gift expiry, no-show, turnover) reads this clock."
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Advances/sets the logical clock used by every date/time computation"]

  # ---- Inn -------------------------------------------------------------------
  - method: POST
    path: "/inns"
    description: "Create an inn (config root)"
    roles: [Innkeeper]
    code: 201
    input: [name, lodging_tax_rate_bps, "checkin_time?", "checkout_time?", "gift_cert_expiry_days?", "turnover_minutes?"]
    output: Inn
    side_effects: ["version=1"]

  - method: GET
    path: "/inns/{inn_id}"
    description: "Get inn"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: []
    output: Inn
    side_effects: []

  # ---- Room ------------------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/rooms"
    description: "Create a room"
    roles: [Innkeeper]
    code: 201
    input: [inn_id, name, base_rate_cents, max_occupancy, "is_taxable?"]
    output: Room
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/inns/{inn_id}/rooms"
    description: "List rooms; filterable by inn"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: ["inn_id?", "status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/rooms/{room_id}"
    description: "Get room"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/rooms/{room_id}/retire"
    description: "Retire a room (no new bookings)"
    roles: [Innkeeper]
    code: 200
    input: ["expected_room_version?"]
    output: Room
    side_effects: ["status=RETIRED", "increments Room.version by 1"]

  # ---- RatePeriod ------------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/rate-periods"
    description: "Create a peak/off-peak rate period with multiplier and min_nights"
    roles: [Innkeeper]
    code: 201
    input: [inn_id, label, start_date, end_date, rate_multiplier_bps, "min_nights?"]
    output: RatePeriod
    side_effects: ["version=1"]

  - method: GET
    path: "/inns/{inn_id}/rate-periods"
    description: "List rate periods for an inn"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: ["inn_id?", "limit?", "offset?"]
    output: RatePeriod[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/rate-periods/{rate_period_id}"
    description: "Get a rate period"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: []
    output: RatePeriod
    side_effects: []

  # ---- Package ---------------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/packages"
    description: "Create a package (add-on bundle)"
    roles: [Innkeeper]
    code: 201
    input: [inn_id, name, "flat_add_cents?", "per_night_add_cents?", "is_taxable?"]
    output: Package
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/inns/{inn_id}/packages"
    description: "List packages for an inn"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: ["inn_id?", "status?", "limit?", "offset?"]
    output: Package[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/packages/{package_id}"
    description: "Get a package"
    roles: [Innkeeper, FinanceManager, Housekeeper, Guest]
    code: 200
    input: []
    output: Package
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/packages/{package_id}/retire"
    description: "Retire a package"
    roles: [Innkeeper]
    code: 200
    input: ["expected_package_version?"]
    output: Package
    side_effects: ["status=RETIRED", "increments Package.version by 1"]

  # ---- Guest -----------------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/guests"
    description: "Register a guest"
    roles: [Innkeeper, Guest]
    code: 201
    input: [inn_id, full_name, email]
    output: Guest
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/guests"
    description: "List guests for an inn (filtered list)"
    roles: [Innkeeper, FinanceManager]
    code: 200
    input: ["inn_id?", "email?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/guests/{guest_id}"
    description: "Get guest"
    roles: [Innkeeper, FinanceManager, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  # ---- GiftCertificate -------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/gift-certificates"
    description: "Issue a gift certificate; server mints code, issued_on, expires_on from the clock"
    roles: [FinanceManager, Innkeeper]
    code: 201
    input: [inn_id, face_value_cents]
    output: GiftCertificate
    side_effects: ["status=ACTIVE, remaining_cents=face_value_cents, code issued, version=1"]

  - method: GET
    path: "/inns/{inn_id}/gift-certificates"
    description: "List gift certificates for an inn (filtered list, supports code lookup)"
    roles: [FinanceManager, Innkeeper, Guest]
    code: 200
    input: ["inn_id?", "code?", "status?", "limit?", "offset?"]
    output: GiftCertificate[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/gift-certificates/{gift_certificate_id}"
    description: "Get gift certificate"
    roles: [FinanceManager, Innkeeper, Guest]
    code: 200
    input: []
    output: GiftCertificate
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/gift-certificates/{gift_certificate_id}/redemptions"
    description: "List REDEMPTION ledger entries that drew on this gift certificate"
    roles: [FinanceManager, Innkeeper, Guest]
    code: 200
    input: []
    output: PaymentLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/gift-certificates/{gift_certificate_id}/void"
    description: "Void an unredeemed gift certificate"
    roles: [FinanceManager]
    code: 200
    input: ["expected_gift_certificate_version?"]
    output: GiftCertificate
    side_effects: ["status=VOID", "increments GiftCertificate.version by 1"]

  # ---- Booking ---------------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/bookings"
    description: "Create a booking (PENDING). Computes nights, room_charge, package_charge, lodging_tax, total, deposit_due."
    roles: [Innkeeper, Guest]
    code: 201
    input: [inn_id, room_id, guest_id, "package_id?", channel, "ota_commission_bps?", checkin_date, checkout_date, guest_count]
    output: Booking
    side_effects:
      - "reservation_status=PENDING, payment_status=UNPAID"
      - "runs calc room_charge, package_charge, lodging_tax, deposit_due"
      - "validates date range, occupancy, min_nights, package/room retirement, cross-inn refs"

  - method: GET
    path: "/inns/{inn_id}/bookings"
    description: "List bookings; filter by room, guest, package, status, channel"
    roles: [Innkeeper, FinanceManager, Guest]
    code: 200
    input: ["inn_id?", "room_id?", "guest_id?", "package_id?", "reservation_status?", "channel?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/bookings/{booking_id}"
    description: "Get booking with all computed money fields"
    roles: [Innkeeper, FinanceManager, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/pay-deposit"
    description: "Record a cash deposit payment toward the booking (creates a DEPOSIT ledger entry, increases deposit_paid_cents). amount_cents capped at total_cents - deposit_paid_cents."
    roles: [Innkeeper, Guest]
    code: 200
    input: [amount_cents]
    output: Booking
    side_effects:
      - "appends DEPOSIT PaymentLedgerEntry (positive amount)"
      - "recomputes deposit_paid_cents"

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/redeem-gift"
    description: "Apply a gift certificate toward the booking's outstanding balance (creates a REDEMPTION ledger entry, debits the cert). amount_cents is capped at min(cert remaining, total_cents - deposit_paid_cents). OCC on the gift certificate's version."
    roles: [Innkeeper, Guest]
    code: 200
    input: [gift_certificate_id, amount_cents, expected_gift_certificate_version]
    output: Booking
    side_effects:
      - "appends REDEMPTION PaymentLedgerEntry (positive amount)"
      - "GiftCertificate.remaining_cents -= amount_cents; -> DEPLETED if 0"
      - "increments GiftCertificate.version by 1"
      - "recomputes deposit_paid_cents"

  - method: GET
    path: "/inns/{inn_id}/bookings/{booking_id}/refund-quote"
    description: "What-if cancellation refund (provisional variant): computes the refund the guest WOULD receive if they cancelled now, against the current logical clock. Does not mutate the booking."
    roles: [Innkeeper, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: ["read-only; returns booking snapshot with refund_cents reflecting the provisional quote, no persistence"]

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/confirm"
    description: "Confirm a PENDING booking. OCC on Room.version. Commits the night interval, checks overlap and deposit coverage."
    roles: [Guest, Innkeeper]
    code: 200
    input: [expected_room_version]
    output: Booking
    side_effects:
      - "reservation_status PENDING->CONFIRMED; payment_status UNPAID->DEPOSIT_HELD"
      - "increments Room.version by 1"
      - "validates overlap (p70) and deposit coverage (p80)"

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/check-in"
    description: "Check a confirmed booking in"
    roles: [Innkeeper]
    code: 200
    input: []
    output: Booking
    side_effects: ["reservation_status CONFIRMED->CHECKED_IN", "validates turnover readiness (p72)"]

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/check-out"
    description: "Check a booking out; settles payment and spawns a turnover task"
    roles: [Innkeeper]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "reservation_status CHECKED_IN->CHECKED_OUT; payment_status DEPOSIT_HELD->SETTLED"
      - "creates HousekeepingTask (PENDING) for the room with ready_after = checkout instant + turnover_minutes"
      - "increments Room.version by 1"

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/cancel"
    description: "Cancel a PENDING/CONFIRMED booking. Computes refund (final variant), restores gift balance, cascades to breakfast plan."
    roles: [Guest, Innkeeper]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "reservation_status ->CANCELLED; stamps cancelled_on"
      - "runs calc cancellation_refund (final) + gift_restore_on_cancel"
      - "payment_status -> REFUNDED or FORFEITED; appends REFUND or FORFEIT ledger entry"
      - "restores GiftCertificate.remaining_cents for refunded redemption portion"
      - "increments Room.version by 1; cascades BreakfastPlan -> CANCELLED"

  - method: POST
    path: "/inns/{inn_id}/bookings/{booking_id}/mark-no-show"
    description: "Mark a confirmed booking as a no-show after the arrival night passes; forfeits deposit"
    roles: [Innkeeper]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "reservation_status CONFIRMED->NO_SHOW; payment_status DEPOSIT_HELD->FORFEITED"
      - "appends FORFEIT ledger entry; increments Room.version by 1; cascades BreakfastPlan -> CANCELLED"

  - method: GET
    path: "/inns/{inn_id}/bookings/{booking_id}/ledger"
    description: "List the booking's PaymentLedgerEntry rows (deposits, redemptions, refunds, forfeits)"
    roles: [Innkeeper, FinanceManager, Guest]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: PaymentLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/payment-ledger-entries"
    description: "List PaymentLedgerEntry rows across the inn; filter by booking or gift certificate"
    roles: [Innkeeper, FinanceManager, Guest]
    code: 200
    input: ["booking_id?", "gift_certificate_id?", "source_kind?", "limit?", "offset?"]
    output: PaymentLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/payment-ledger-entries/{payment_ledger_entry_id}"
    description: "Get a single PaymentLedgerEntry"
    roles: [Innkeeper, FinanceManager, Guest]
    code: 200
    input: []
    output: PaymentLedgerEntry
    side_effects: []

  # ---- BreakfastPlan ---------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/breakfast-plans"
    description: "Create a breakfast plan for a booking with party size and dietary flags"
    roles: [Innkeeper, Guest]
    code: 201
    input: [booking_id, party_size, "dietary_flags?"]
    output: BreakfastPlan
    side_effects: ["status=REQUESTED, version=1", "validates party_size <= booking.guest_count"]

  - method: GET
    path: "/inns/{inn_id}/breakfast-plans"
    description: "List breakfast plans; filter by booking"
    roles: [Innkeeper, Guest]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: BreakfastPlan[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/breakfast-plans/{breakfast_plan_id}"
    description: "Get a breakfast plan"
    roles: [Innkeeper, Guest]
    code: 200
    input: []
    output: BreakfastPlan
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/breakfast-plans/{breakfast_plan_id}/confirm"
    description: "Confirm a breakfast plan (kitchen commits covers)"
    roles: [Innkeeper]
    code: 200
    input: []
    output: BreakfastPlan
    side_effects: ["status REQUESTED->CONFIRMED", "validates parent booking is CONFIRMED/CHECKED_IN"]

  - method: POST
    path: "/inns/{inn_id}/breakfast-plans/{breakfast_plan_id}/cancel"
    description: "Cancel a breakfast plan"
    roles: [Innkeeper, Guest]
    code: 200
    input: []
    output: BreakfastPlan
    side_effects: ["status ->CANCELLED"]

  # ---- HousekeepingTask ------------------------------------------------------
  - method: GET
    path: "/inns/{inn_id}/housekeeping-tasks"
    description: "List turnover tasks; filter by booking or room or status"
    roles: [Innkeeper, Housekeeper]
    code: 200
    input: ["booking_id?", "room_id?", "status?", "limit?", "offset?"]
    output: HousekeepingTask[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}"
    description: "Get a turnover task"
    roles: [Innkeeper, Housekeeper]
    code: 200
    input: []
    output: HousekeepingTask
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}/start"
    description: "Begin turnover cleaning"
    roles: [Housekeeper]
    code: 200
    input: []
    output: HousekeepingTask
    side_effects: ["status PENDING->IN_PROGRESS"]

  - method: POST
    path: "/inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}/complete"
    description: "Finish turnover cleaning"
    roles: [Housekeeper]
    code: 200
    input: []
    output: HousekeepingTask
    side_effects: ["status IN_PROGRESS->DONE"]

  - method: POST
    path: "/inns/{inn_id}/housekeeping-tasks/{housekeeping_task_id}/skip"
    description: "Skip turnover (waive cleaning)"
    roles: [Innkeeper]
    code: 200
    input: []
    output: HousekeepingTask
    side_effects: ["status PENDING->SKIPPED"]

  # ---- TaxRemittance ---------------------------------------------------------
  - method: POST
    path: "/inns/{inn_id}/tax-remittances"
    description: "Open a tax remittance batch over a date window; computes swept count and tax total under ESTIMATED/FINAL variant"
    roles: [FinanceManager]
    code: 201
    input: [inn_id, period_start, period_end, variant]
    output: TaxRemittance
    side_effects: ["status=OPEN, version=1", "runs calc tax_remittance_total"]

  - method: GET
    path: "/inns/{inn_id}/tax-remittances"
    description: "List tax remittances for an inn"
    roles: [FinanceManager, Innkeeper]
    code: 200
    input: ["inn_id?", "status?", "variant?", "limit?", "offset?"]
    output: TaxRemittance[]
    side_effects: []

  - method: GET
    path: "/inns/{inn_id}/tax-remittances/{tax_remittance_id}"
    description: "Get a tax remittance"
    roles: [FinanceManager, Innkeeper]
    code: 200
    input: []
    output: TaxRemittance
    side_effects: []

  - method: POST
    path: "/inns/{inn_id}/tax-remittances/{tax_remittance_id}/file"
    description: "File the remittance; freezes totals and marks swept bookings remitted"
    roles: [FinanceManager]
    code: 200
    input: ["expected_tax_remittance_version?"]
    output: TaxRemittance
    side_effects: ["status OPEN->FILED", "sets remitted=true on all swept bookings", "increments TaxRemittance.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_BOOKING_OWNER, http: 403, condition: "Guest acting on a booking they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist in the inn scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, unparseable date, negative where non-negative required" }
  - { id: ERR_CROSS_INN_REFERENCE, http: 409, condition: "FK target belongs to a different inn than the path inn_id" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "checkout_date <= checkin_date, or end_date < start_date, or period_end < period_start" }
  - { id: ERR_OCCUPANCY_EXCEEDED, http: 422, condition: "guest_count exceeds Room.max_occupancy" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_RESOURCE_RETIRED, http: 409, condition: "Booking against a RETIRED room or selecting a RETIRED package" }
  - { id: ERR_BREAKFAST_OVER_PARTY, http: 422, condition: "BreakfastPlan.party_size exceeds the booking's guest_count" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Confirm collides with an existing CONFIRMED/CHECKED_IN night interval on the same room (half-open overlap)" }
  - { id: ERR_TURNOVER_NOT_READY, http: 409, condition: "Check-in attempted before the room's turnover buffer is satisfied (task not DONE/SKIPPED or ready_after in the future)" }
  - { id: ERR_MIN_NIGHTS_NOT_MET, http: 422, condition: "Stay touches a RatePeriod with min_nights > nights (two-night-minimum style floor)" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Cash deposit payment would overpay the booking (amount > total_cents - deposit_paid_cents)" }
  - { id: ERR_GIFT_INSUFFICIENT, http: 422, condition: "Redemption exceeds gift remaining balance or owed deposit, or certificate not ACTIVE/expired" }
  - { id: ERR_DEPOSIT_NOT_MET, http: 422, condition: "Confirm attempted with deposit_paid_cents < deposit_due_cents" }
  - { id: ERR_ALREADY_REMITTED, http: 409, condition: "Filing a remittance whose swept set includes an already-remitted booking" }
  - { id: ERR_STALE_ROOM_VERSION, http: 412, condition: "expected_room_version does not match Room.version on confirm" }
  - { id: ERR_STALE_GIFT_VERSION, http: 412, condition: "expected_gift_certificate_version does not match GiftCertificate.version on redeem-gift" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Innkeeper
    description: "Owns inventory (rooms, rate periods, packages), runs front-desk operations (check-in/out, no-show, skip turnover)."
    identity: opaque
    exclusive_operations:
      - "POST /inns — create inn"
      - "POST /inns/{inn_id}/rooms — create room"
      - "POST /inns/{inn_id}/rooms/{room_id}/retire — retire room"
      - "POST /inns/{inn_id}/rate-periods — create rate period"
      - "POST /inns/{inn_id}/packages — create package"
      - "POST /inns/{inn_id}/packages/{package_id}/retire — retire package"
      - "POST .../bookings/{booking_id}/check-in — check in"
      - "POST .../bookings/{booking_id}/check-out — check out"
      - "POST .../bookings/{booking_id}/mark-no-show — mark no-show"
      - "POST .../housekeeping-tasks/{id}/skip — skip turnover"
      - "POST .../breakfast-plans/{id}/confirm — confirm breakfast plan"
    shared_operations:
      - "POST .../bookings — create booking (with Guest)"
      - "POST .../bookings/{id}/confirm — confirm booking (with Guest)"
      - "POST .../bookings/{id}/cancel — cancel booking (with Guest)"
      - "POST .../bookings/{id}/pay-deposit — record cash deposit (with Guest)"
      - "POST .../bookings/{id}/redeem-gift — redeem gift (with Guest)"
      - "POST .../breakfast-plans — create breakfast plan (with Guest)"
      - "POST .../breakfast-plans/{id}/cancel — cancel breakfast plan (with Guest)"
      - "POST .../gift-certificates — issue gift certificate (with FinanceManager)"
      - "GET endpoints — read access across the inn"

  - name: Guest
    description: "Books and manages own stays; can self-register, book, confirm, cancel, redeem gifts, request breakfast."
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST .../guests — self-register (with Innkeeper)"
      - "POST .../bookings — create own booking (with Innkeeper)"
      - "POST .../bookings/{id}/confirm — confirm own booking (with Innkeeper)"
      - "POST .../bookings/{id}/cancel — cancel own booking (with Innkeeper)"
      - "POST .../bookings/{id}/pay-deposit — record cash deposit on own booking (with Innkeeper)"
      - "POST .../bookings/{id}/redeem-gift — redeem gift toward own booking (with Innkeeper)"
      - "GET .../bookings/{id}/refund-quote — what-if refund on own booking"
      - "POST .../breakfast-plans — request breakfast (with Innkeeper)"
      - "POST .../breakfast-plans/{id}/cancel — cancel breakfast (with Innkeeper)"
      - "GET endpoints — read access scoped to the inn"

  - name: Housekeeper
    description: "Executes room turnover tasks."
    identity: opaque
    exclusive_operations:
      - "POST .../housekeeping-tasks/{id}/start — begin turnover"
      - "POST .../housekeeping-tasks/{id}/complete — finish turnover"
    shared_operations:
      - "GET .../housekeeping-tasks — list/read turnover tasks"
      - "GET .../rooms — read room inventory"

  - name: FinanceManager
    description: "Owns money operations: gift certificate issuance/void and occupancy/lodging tax remittance."
    identity: opaque
    exclusive_operations:
      - "POST .../gift-certificates/{id}/void — void gift certificate"
      - "POST .../tax-remittances — open remittance batch"
      - "POST .../tax-remittances/{id}/file — file remittance"
    shared_operations:
      - "POST .../gift-certificates — issue gift certificate (with Innkeeper)"
      - "GET endpoints — read access for reconciliation"
