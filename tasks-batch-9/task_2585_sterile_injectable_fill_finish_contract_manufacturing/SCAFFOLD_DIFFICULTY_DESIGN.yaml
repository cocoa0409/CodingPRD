  - rule_id: compensating_invariant
    instances:

      - name: batch_cancellation_restores_component_unit_ledger_exactly
        grounds:
          - state_machines.BatchOrder.production_status.SETUP_to_CANCELLED
          - state_machines.ComponentReservation.status.RESERVED_to_RELEASED
          - state_machines.ComponentLot.status.EXHAUSTED_to_RELEASED
          - calculations.suite_committed_minutes
          - calculations.component_demand_units
          - entities.ComponentLot.fields.quantity_available
          - entities.ClientProject.fields.committed_demand_units
        distinguishing_aspect: |
          Cancelling the batch must run every reservation side effect backwards with zero drift, and
          the invariant that has to hold before AND after is
          quantity_received == quantity_available + SUM(quantity_reserved WHERE status IN {RESERVED,
          CONSUMED}) for each lot. The VIAL lot is sized to exactly 10560 so the reservation drives
          it to quantity_available 0 and status EXHAUSTED, which means the compensation must also
          reverse a *state* change (EXHAUSTED -> RELEASED), not just a number. Three separate
          derived ledgers unwind in the same request — the lots' quantity_available, the project's
          committed_demand_units (21560 -> 0) and the suite's committed_minutes (540 -> 0) — while
          quality_status is stamped REJECTED, and the released_reason must be 'BATCH_CANCELLED'
          rather than the suspension variant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-1 grade B QUALIFIED and cleaning-validated for MOL-A, OP-A and OP-B QUALIFIED, posture OPEN."
            - "ClientProject 'Sponsor A' ACTIVE, dosage_form VIAL, reserved_unit_budget 30000, committed_demand_units 21560."
            - "ComponentLot VL-1 with quantity_received 10560 (exactly the VIAL line demand) and ST-1 with quantity_received 30000, both RELEASED before reservation."
            - "BatchOrder B-001 production_status SETUP with a 10560 VIAL reservation and an 11000 STOPPER reservation, so VL-1 is EXHAUSTED at quantity_available 0 and ST-1 sits at 19000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-B", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_b_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_b_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /filling-suites/${suite_id}/cleaning-validation"
              payload: { molecule_name: "MOL-A", residue_ug_per_swab: 12 }
              as: MicrobiologyAnalyst
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "ENGINEERING_RUN", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "COMPLETE", analytical_method_transfer_status: "VALIDATED" }
              as: ProgramManager
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-1", quantity_received: 10560, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_vial_id: $.data.id }
            - call: "POST /component-lots/${lot_vial_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "STOPPER", lot_code: "ST-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_stop_id: $.data.id }
            - call: "POST /component-lots/${lot_stop_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { suite_v1: $.data.version }
            - call: "POST /batch-orders"
              payload: { client_project_id: "${proj_id}", suite_id: "${suite_id}", lead_operator_qualification_id: "${pq_a_id}", batch_number: "B-001", planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-10T16:00:00Z", target_fill_units: 10000, expected_suite_version: "${suite_v1}" }
              as: ProgramManager
              captures: { batch_id: $.data.id }
            - call: "GET /component-lots/${lot_vial_id}"
              as: ProgramManager
              captures: { lot_vial_v1: $.data.version }
            - call: "POST /component-reservations"
              payload: { batch_order_id: "${batch_id}", component_lot_id: "${lot_vial_id}", quantity_reserved: 10560, expected_component_lot_version: "${lot_vial_v1}" }
              as: ProgramManager
              captures: { resv_vial_id: $.data.id }
            - call: "GET /component-lots/${lot_stop_id}"
              as: ProgramManager
              captures: { lot_stop_v1: $.data.version }
            - call: "POST /component-reservations"
              payload: { batch_order_id: "${batch_id}", component_lot_id: "${lot_stop_id}", quantity_reserved: 11000, expected_component_lot_version: "${lot_stop_v1}" }
              as: ProgramManager
              captures: { resv_stop_id: $.data.id }
            - call: "POST /batch-orders/${batch_id}/setup"
              as: ProductionSupervisor
          trigger:
            - call: "POST /batch-orders/${batch_id}/cancel"
              payload: { cancellation_reason: "Sponsor deferred the campaign after the technology-transfer review." }
              as: ProgramManager
          assert:
            - "before the trigger: ComponentLot.${lot_vial_id}.quantity_available == 0 and ComponentLot.${lot_vial_id}.status == EXHAUSTED"
            - "before the trigger: ComponentLot.${lot_stop_id}.quantity_available == 19000 and ComponentLot.${lot_stop_id}.status == RELEASED"
            - "BatchOrder.${batch_id}.production_status == CANCELLED"
            - "BatchOrder.${batch_id}.quality_status == REJECTED"
            - "ComponentReservation.${resv_vial_id}.status == RELEASED and released_reason == 'BATCH_CANCELLED'"
            - "ComponentReservation.${resv_stop_id}.status == RELEASED and released_reason == 'BATCH_CANCELLED'"
            - "ComponentLot.${lot_vial_id}.quantity_available == 10560 and ComponentLot.${lot_vial_id}.status == RELEASED"
            - "ComponentLot.${lot_stop_id}.quantity_available == 30000 and ComponentLot.${lot_stop_id}.status == RELEASED"
            - "ClientProject.${proj_id}.committed_demand_units == 0"
            - "FillingSuite.${suite_id}.committed_minutes == 0"
            - "invariant per lot: quantity_received == quantity_available + SUM(quantity_reserved of its reservations with status IN {RESERVED, CONSUMED}) — 10560 == 10560 + 0 and 30000 == 30000 + 0"

      - name: capa_approval_compensates_the_escalated_risk_score_not_the_original_increment
        grounds:
          - calculations.deviation_risk_score
          - state_machines.Deviation.status.OPEN_to_UNDER_INVESTIGATION
          - state_machines.Deviation.status.UNDER_INVESTIGATION_to_CAPA_PENDING
          - state_machines.Deviation.status.CAPA_PENDING_to_UNDER_INVESTIGATION
          - state_machines.Deviation.status.CAPA_PENDING_to_CLOSED
          - entities.ClientProject.fields.open_deviation_risk_total
          - entities.Deviation.fields.capa_rejection_count
          - validations[priority=70]
        distinguishing_aspect: |
          A ledger whose compensation amount is NOT the amount originally added — the trap of any
          naive "subtract what you added" implementation. D2 adds 20 points at MAJOR
          classification, then a rejected CAPA re-scores it to round_half_up(20 * 1.5) = 30 and
          adjusts the project total by exactly the DELTA (+10, never +30), and the eventual CAPA
          approval must remove exactly the CURRENT 30, returning
          open_deviation_risk_total to 5 — the pre-D2 value carried by the still-open MINOR D1 —
          rather than the 20 that was first added or 0. It also pins that the compensation is
          per-deviation: D1's 5 points survive untouched, and that decide-capa is subject to
          segregation of duties (opened by qa-001, decided by qa-002).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-1 grade B QUALIFIED, OP-A QUALIFIED, ClientProject 'Sponsor A' ACTIVE with open_deviation_risk_total 0."
            - "BatchOrder B-001 SCHEDULED in FS-1."
            - "Deviation D1 on B-001 opened by qa-001 and classified MINOR, so its risk_score is 5 and the project total is 5."
            - "Deviation D2 on B-001 opened by qa-001, still OPEN, with no em_sample_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
