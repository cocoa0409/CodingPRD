            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-8002", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "POST /press-reservations"
              payload: {build_job_id: "${j1}", press_id: "PRESS_500T", start_time: "2026-08-10T10:00:00Z", end_time: "2026-08-10T14:00:00Z"}
              as: ProjectManager
              captures: {pr1: $.data.id}
          trigger:
            - call: "POST /press-reservations"
              payload: {build_job_id: "${j1}", press_id: "PRESS_500T", start_time: "2026-08-10T13:00:00Z", end_time: "2026-08-10T12:00:00Z"}
              as: ProjectManager
              captures: {err1: $.data.error_id}
          assert:
            - "trigger returns http 422 with error_id == ERR_INVALID_TIME_WINDOW (temporal beats constraint)"
            - "captured err1 == ERR_INVALID_TIME_WINDOW"
            - "captured err1 != ERR_PRESS_DOUBLE_BOOKED"
            - "PressReservation.${pr1}.status == RESERVED  # existing window untouched"

