              captures: { ref_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", referring_provider_npi: "NPI999", department_code: "CARD", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRH" }
              as: Registrar
              captures: { a_id: $.data.id, matched_ref: $.data.referral_id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
