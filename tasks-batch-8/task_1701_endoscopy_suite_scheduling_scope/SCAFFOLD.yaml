# =============================================================================
# PRD Benchmark Seed Tables — Endoscopy Suite Scheduling & Scope Reprocessing
# =============================================================================

scenario: |
  Endoscopy Suite Scheduling & Scope Reprocessing (GI endoscopy unit): procedure booking by type & duration with prep instructions, bowel-prep adequacy & rescheduling, room/anesthesia coordination, scope inventory, reprocessing cycle & drying/storage limits, high-level disinfection documentation & scope tracking to patient, positive culture & scope quarantine, pathology specimen handoff, quality metrics (adenoma detection/withdrawal time)

domain_name: endoscopy-suite
api_prefix: /endoscopy

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # room/anesthesia interval conflict + buffer semantics
  secondary_archetype: compliance_audit        # HLD documentation, scope-to-patient traceability, quarantine protocol
  complexity_layers:
    - optimistic_concurrency                   # OCC on ProcedureBooking.version and Scope.version
    - cascading_side_effects                   # positive culture → quarantine → exposure flags → patient recall flags
    - rate_threshold_triggers                  # reprocessing step minimums, hang-time expiry, transport windows
    - selector_policy                          # deterministic scope assignment from eligible pool
  entity_topology: flat                        # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: parallel                # ProcedureBooking carries booking_status × prep_status axes; Scope is cyclic; QuarantineCase/Specimen branch
  relationship_patterns:
    - one_to_many                              # Provider → ProcedureBooking; Scope → ReprocessingCycle
    - many_to_many                             # ProcedureBooking ↔ Scope via ScopeUsage junction (scope-to-patient traceability)
    - self_referential                         # ProcedureBooking.rescheduled_from_id chains a booking to its predecessor
    - cross_aggregate                          # ReprocessingCycle → ProcedureBooking; QuarantineCase → ScopeCultureTest
  role_model: segregation_of_duties            # quarantine releaser must differ from reprocessing technician
  consistency_model: immediate                 # all mutations atomic and visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across patients" }
      - { name: full_name, type: string, source: input, description: "Patient full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD; drives age_at_scheduled computations" }
      - { name: contact_phone, type: string, source: input, required: false, default: null, description: "Optional contact phone" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Endoscopist full name" }
      - { name: specialty, type: enum, source: input, constraints: "GASTROENTEROLOGY | COLORECTAL_SURGERY", description: "Clinical specialty" }
      - { name: credential_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED blocks new bookings and procedure starts" }

  - name: ProcedureType
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique type code, e.g. COLONOSCOPY" }
      - { name: display_name, type: string, source: input, description: "Human-readable name" }
      - { name: base_duration_minutes, type: integer, source: input, constraints: "> 0", description: "Base procedure minutes before add-ons" }
      - { name: prep_protocol, type: enum, source: input, constraints: "NONE | CLEAR_LIQUIDS | SPLIT_DOSE", description: "Required prep; drives minimum booking lead time" }
      - { name: colonoscopy_family, type: boolean, source: input, description: "True when procedures count toward withdrawal-time and cecal-intubation metrics" }
      - { name: adr_relevant, type: boolean, source: input, description: "True when procedures can enter adenoma-detection-rate denominators" }
      - { name: required_scope_type, type: enum, source: input, constraints: "COLONOSCOPE | GASTROSCOPE | SIGMOIDOSCOPE", description: "Scope type compatible with this procedure type" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room display name" }
      - { name: room_class, type: enum, source: input, constraints: "STANDARD | ERCP_CAPABLE", description: "Drives turnover buffer minutes" }
      - { name: supports_anesthesia, type: boolean, source: input, description: "Whether anesthesia cases may be booked in this room" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | OUT_OF_SERVICE", description: "OUT_OF_SERVICE blocks new bookings and procedure starts" }

  - name: AnesthesiaProvider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Anesthesia provider full name" }
      - { name: credential_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED blocks new assignments" }
      - { name: scheduled_minutes, type: integer, source: computed, default: 0, description: "Sum of minutes over own AnesthesiaAssignment rows with status IN {ASSIGNED, CONFIRMED} (anesthesia_minutes_ledger)" }

  - name: Scope
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across scopes" }
      - { name: scope_type, type: enum, source: input, constraints: "COLONOSCOPE | GASTROSCOPE | SIGMOIDOSCOPE", description: "Physical scope type" }
      - { name: status, type: enum, source: system, default: AVAILABLE, constraints: "AVAILABLE | IN_USE | AWAITING_REPROCESS | REPROCESSING | QUARANTINED | OUT_OF_SERVICE", description: "Cyclic reprocessing state machine with quarantine branch" }
      - { name: storage_expires_at, type: datetime, source: system, default: null, description: "= reprocessing cycle dried_at + 72h; null on never-reprocessed scopes" }
      - { name: awaiting_reprocess_since, type: datetime, source: system, default: null, description: "Timestamp of last entry into AWAITING_REPROCESS; drives the 60-minute preclean deadline" }
      - { name: use_count, type: integer, source: system, default: 0, description: "= count of ScopeUsage rows for this scope with status != VOID (scope_use_ledger)" }
      - { name: is_storage_current, type: boolean, source: computed, description: "storage_expires_at IS NULL OR logical now < storage_expires_at (strict)" }

  - name: ProcedureBooking
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: procedure_type_id, type: string, source: input, description: "FK -> ProcedureType.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: indication, type: enum, source: input, constraints: "SCREENING | SURVEILLANCE | DIAGNOSTIC", description: "Clinical indication; drives ADR denominator inclusion" }
      - { name: anesthesia_type, type: enum, source: input, constraints: "NONE | MAC | GENERAL", description: "Anesthesia level; != NONE requires a CONFIRMED AnesthesiaAssignment before start" }
      - { name: notes, type: string, source: input, required: false, default: null, description: "Free-text scheduling notes" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned procedure start (UTC); must be in the future and respect prep lead time" }
      - { name: procedure_minutes, type: integer, source: computed, description: "base_duration_minutes + anesthesia add-on {NONE:0, MAC:10, GENERAL:15} + age add-on (5 when patient age at scheduled_start >= 65)" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + procedure_minutes" }
      - { name: room_block_end, type: datetime, source: computed, description: "scheduled_end + turnover buffer {STANDARD:15, ERCP_CAPABLE:25} minutes; used by room overlap and day-capacity rules" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | CHECKED_IN | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW | RESCHEDULED | ABORTED_PREP_INADEQUATE", description: "Booking axis of the parallel state machine" }
      - { name: prep_status, type: enum, source: system, default: PREP_PENDING, constraints: "PREP_PENDING | PREP_CONFIRMED | PREP_ADEQUATE | PREP_INADEQUATE", description: "Prep axis; evolves independently of booking axis" }
      - { name: bbps_left, type: integer, source: system, default: null, constraints: "0..3", description: "Boston Bowel Preparation Scale left-segment score recorded at assessment" }
      - { name: bbps_right, type: integer, source: system, default: null, constraints: "0..3", description: "BBPS right-segment score" }
      - { name: bbps_transverse, type: integer, source: system, default: null, constraints: "0..3", description: "BBPS transverse-segment score" }
      - { name: actual_start, type: datetime, source: system, default: null, description: "Set when procedure starts" }
      - { name: actual_end, type: datetime, source: system, default: null, description: "Set when procedure completes or aborts" }
      - { name: actual_duration_minutes, type: integer, source: computed, default: null, description: "floor((actual_end - actual_start) in seconds / 60); null until completion/abort" }
      - { name: cecum_intubated, type: boolean, source: system, default: null, description: "Recorded at completion; feeds CIR and withdrawal-time eligibility" }
      - { name: withdrawal_time_seconds, type: integer, source: system, default: null, constraints: ">= 0", description: "Recorded at completion; feeds withdrawal-time average" }
      - { name: adenomas_detected, type: integer, source: system, default: null, constraints: ">= 0", description: "Recorded at completion; feeds ADR numerator and withdrawal exclusion" }
      - { name: notification_flag, type: boolean, source: system, default: false, description: "Set true by positive-culture cascade when an exposure-flagged ScopeUsage bubbles up" }
      - { name: rescheduled_from_id, type: string, source: system, default: null, description: "FK -> ProcedureBooking.id; set on the replacement booking created by reschedule" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason captured on cancel/abort" }

  - name: ScopeUsage
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ProcedureBooking.id" }
      - { name: scope_id, type: string, source: system, description: "FK -> Scope.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the booking for traceability queries" }
      - { name: used_at, type: datetime, source: system, description: "= booking actual_start" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | VOID", description: "VOID reverses a usage recorded in error" }
      - { name: void_reason, type: string, source: system, default: null, description: "Required when voiding" }
      - { name: exposure_flagged, type: boolean, source: system, default: false, description: "Set by positive-culture cascade when usage falls inside the exposure window" }

  - name: ReprocessingCycle
    parent: null
    common_fields: true
    fields:
      - { name: scope_id, type: string, source: input, description: "FK -> Scope.id" }
      - { name: booking_id, type: string, source: input, required: false, default: null, description: "FK -> ProcedureBooking.id; nullable (manual sends have no booking)" }
      - { name: technician_id, type: string, source: system, description: "X-User-ID of the creating ReprocessingTechnician; used by segregation-of-duties on quarantine release" }
      - { name: status, type: enum, source: system, default: INITIATED, constraints: "INITIATED | PRECLEANED | CLEANED | DISINFECTED | DRIED | COMPLETE | FAILED", description: "Strictly ordered step machine; skipping steps is rejected" }
      - { name: is_reculture, type: boolean, source: system, default: false, description: "True when created against a QUARANTINED scope (drives QuarantineCase RECULTURING)" }
      - { name: requires_extended_soak, type: boolean, source: computed, description: "True when cycle created more than 60 minutes after scope.awaiting_reprocess_since" }
      - { name: hld_solution_lot, type: string, source: system, default: null, description: "Disinfectant lot recorded at DISINFECTED step" }
      - { name: hld_concentration_ppm, type: number, source: system, default: null, description: "Measured concentration at DISINFECTED step; < 300 ppm fails the cycle" }
      - { name: initiated_at, type: datetime, source: system, description: "Cycle creation time" }
      - { name: precleaned_at, type: datetime, source: system, default: null, description: "Timestamp of PRECLEANED step" }
      - { name: cleaned_at, type: datetime, source: system, default: null, description: "Timestamp of CLEANED step (manual clean end)" }
      - { name: disinfected_at, type: datetime, source: system, default: null, description: "Timestamp of DISINFECTED step (HLD contact end)" }
      - { name: dried_at, type: datetime, source: system, default: null, description: "Timestamp of DRIED step; basis of storage_expires_at" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Timestamp of COMPLETE step" }

  - name: ScopeCultureTest
    parent: null
    common_fields: true
    fields:
      - { name: scope_id, type: string, source: input, description: "FK -> Scope.id" }
      - { name: reprocessing_cycle_id, type: string, source: input, description: "FK -> ReprocessingCycle.id; referenced cycle must be COMPLETE and belong to scope_id" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the InfectionControlNurse who created the test" }
      - { name: sampled_at, type: datetime, source: system, description: "= logical now at creation" }
      - { name: status, type: enum, source: system, default: PENDING, constraints: "PENDING | RESULTED", description: "PENDING until a result is recorded" }
      - { name: result, type: enum, source: system, default: null, constraints: "NEGATIVE | POSITIVE", description: "Recorded once; POSITIVE triggers the quarantine cascade" }
      - { name: organism, type: string, source: system, default: null, description: "Organism name; required when result is POSITIVE" }
      - { name: cfu_count, type: integer, source: system, default: null, constraints: ">= 0", description: "Colony-forming units; required when result is POSITIVE" }
      - { name: resulted_at, type: datetime, source: system, default: null, description: "Timestamp of result recording" }

  - name: QuarantineCase
    parent: null
    common_fields: true
    fields:
      - { name: scope_id, type: string, source: system, description: "FK -> Scope.id" }
      - { name: triggering_culture_id, type: string, source: system, description: "FK -> ScopeCultureTest.id; the POSITIVE culture that opened the case" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | RECULTURING | RELEASED | SCOPE_RETIRED", description: "OPEN until a reculture cycle starts; RELEASED via explicit release; SCOPE_RETIRED if scope retired first" }
      - { name: opened_at, type: datetime, source: system, description: "Case creation time" }
      - { name: exposure_window_start, type: datetime, source: computed, default: null, description: "sampled_at of the latest NEGATIVE culture on the scope strictly before the trigger sample; null means unbounded past (culture_exposure_window)" }
      - { name: exposure_window_end, type: datetime, source: computed, description: "= triggering culture sampled_at" }
      - { name: reculture_cycle_id, type: string, source: system, default: null, description: "FK -> ReprocessingCycle.id; set when the reculture cycle is created" }
      - { name: released_by, type: string, source: system, default: null, description: "X-User-ID of the releasing InfectionControlNurse" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Timestamp of RELEASED or SCOPE_RETIRED" }

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> ProcedureBooking.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the booking" }
      - { name: specimen_type, type: enum, source: input, constraints: "POLYP | BIOPSY | OTHER", description: "Specimen classification" }
      - { name: container_count, type: integer, source: input, constraints: ">= 1", description: "Number of specimen containers" }
      - { name: status, type: enum, source: system, default: COLLECTED, constraints: "COLLECTED | LABELED | IN_TRANSIT | RECEIVED_BY_LAB | RESULTED | REJECTED_BY_LAB", description: "Chain-of-custody state machine" }
      - { name: collected_at, type: datetime, source: system, description: "= logical now at collection; basis of the 120-minute transport window" }
      - { name: labeled_at, type: datetime, source: system, default: null, description: "Must be within 15 minutes of collected_at" }
      - { name: labeled_by, type: string, source: system, default: null, description: "X-User-ID of the labeler" }
      - { name: handed_off_at, type: datetime, source: system, default: null, description: "Courier handoff timestamp" }
      - { name: handed_off_by, type: string, source: system, default: null, description: "X-User-ID releasing the specimen to the courier" }
      - { name: courier_id, type: string, source: system, default: null, description: "Courier identifier supplied at handoff" }
      - { name: received_at, type: datetime, source: system, default: null, description: "Lab receipt timestamp; must satisfy transport window" }
      - { name: received_by, type: string, source: system, default: null, description: "X-User-ID of receiving lab staff" }
      - { name: reject_reason, type: string, source: system, default: null, description: "Reason recorded when REJECTED_BY_LAB" }
      - { name: adenoma_confirmed, type: boolean, source: system, default: null, description: "Pathology result flag recorded at RESULTED" }
      - { name: resulted_at, type: datetime, source: system, default: null, description: "Timestamp of RESULTED" }

  - name: QualityMetricReport
    parent: null
    common_fields: false
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive lower bound on booking actual_end (closed interval)" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive upper bound on booking actual_end (closed interval); must be >= period_start" }
      - { name: metric_variant, type: enum, source: input, constraints: "STRICT | EXPANDED", description: "Selects the ADR denominator variant; other metrics are variant-invariant" }
      - { name: adenoma_detection_rate, type: number, source: computed, default: null, description: "100 * adr_numerator / adr_denominator, 1 decimal round_half_up; null when adr_denominator == 0 (adenoma_detection_rate)" }
      - { name: adr_numerator, type: integer, source: computed, description: "Denominator-set bookings with adenomas_detected >= 1" }
      - { name: adr_denominator, type: integer, source: computed, description: "Variant-dependent inclusion set size" }
      - { name: withdrawal_time_avg_seconds, type: number, source: computed, default: null, description: "Mean withdrawal_time_seconds over the withdrawal inclusion set, 1 decimal round_half_up; null when empty (withdrawal_time_average)" }
      - { name: withdrawal_sample_size, type: integer, source: computed, description: "Size of the withdrawal inclusion set" }
      - { name: cecal_intubation_rate, type: number, source: computed, default: null, description: "100 * cecum_intubated / completed colonoscopy_family bookings, 1 decimal round_half_up; null when denominator 0" }
      - { name: prep_adequacy_rate, type: number, source: computed, default: null, description: "100 * PREP_ADEQUATE / assessed bookings in period, 1 decimal round_half_up; null when denominator 0" }

  - name: AnesthesiaAssignment
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> ProcedureBooking.id" }
      - { name: anesthesia_provider_id, type: string, source: input, description: "FK -> AnesthesiaProvider.id" }
      - { name: minutes, type: integer, source: system, description: "Snapshot of booking.procedure_minutes at assignment creation; never recomputed" }
      - { name: status, type: enum, source: system, default: ASSIGNED, constraints: "ASSIGNED | CONFIRMED | COMPLETED | CANCELLED", description: "ASSIGNED -> CONFIRMED -> COMPLETED; ASSIGNED/CONFIRMED -> CANCELLED" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason captured on cancellation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProcedureBooking
    note: "booking axis of the parallel machine (independent of prep axis except where preconditions reference it)"
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, RESCHEDULED, ABORTED_PREP_INADEQUATE]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /endoscopy/bookings/{id}/check-in"
        actor: SchedulingCoordinator
        preconditions:
          - "prep_status == PREP_CONFIRMED (ERR_PREP_NOT_CONFIRMED)"
          - "scheduled_start - 60min <= now <= scheduled_start + 30min (ERR_CHECKIN_WINDOW_CLOSED)"
        side_effects:
          - "increments ProcedureBooking.version by 1"
      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /endoscopy/bookings/{id}/start"
        actor: Endoscopist
        preconditions:
          - "caller X-User-ID == booking.provider_id (ERR_PROVIDER_OWNERSHIP_MISMATCH)"
          - "provider.credential_status == ACTIVE (ERR_PROVIDER_SUSPENDED)"
          - "room.status == ACTIVE (ERR_ROOM_NOT_IN_SERVICE)"
          - "if anesthesia_type != NONE: an AnesthesiaAssignment for this booking is CONFIRMED (ERR_ANESTHESIA_NOT_CONFIRMED)"
          - "explicit scope_id: scope.status == AVAILABLE (ERR_SCOPE_NOT_AVAILABLE) and is_storage_current (ERR_SCOPE_STORAGE_EXPIRED) and scope.scope_type == procedure_type.required_scope_type (ERR_SCOPE_TYPE_MISMATCH)"
          - "omitted scope_id: scope_selection selector must return a scope (ERR_NO_COMPATIBLE_SCOPE)"
        side_effects:
          - "actual_start = now"
          - "ScopeUsage created (booking_id, scope_id, patient_id denormalized, used_at = now)"
          - "scope -> IN_USE; scope.use_count += 1 (scope_use_ledger)"
          - "increments ProcedureBooking.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /endoscopy/bookings/{id}/complete"
        actor: Endoscopist
        preconditions:
          - "caller X-User-ID == booking.provider_id (ERR_PROVIDER_OWNERSHIP_MISMATCH)"
          - "prep_status IN {PREP_ADEQUATE, PREP_INADEQUATE} (ERR_PREP_NOT_ASSESSED)"
          - "withdrawal_time_seconds >= 0 and adenomas_detected >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "actual_end = now; actual_duration_minutes computed (procedure_occupancy_minutes actual variant)"
          - "if an ACTIVE ScopeUsage exists: scope -> AWAITING_REPROCESS, awaiting_reprocess_since = now"
          - "AnesthesiaAssignment in CONFIRMED -> COMPLETED; provider scheduled_minutes released (anesthesia_minutes_ledger)"
          - "increments ProcedureBooking.version by 1"
      - from: IN_PROGRESS
        to: ABORTED_PREP_INADEQUATE
        trigger: "POST /endoscopy/bookings/{id}/abort"
        actor: Endoscopist
        preconditions:
          - "caller X-User-ID == booking.provider_id (ERR_PROVIDER_OWNERSHIP_MISMATCH)"
          - "prep_status == PREP_INADEQUATE (ERR_PREP_NOT_INADEQUATE)"
        side_effects:
          - "actual_end = now; cancel_reason = reason"
          - "if an ACTIVE ScopeUsage exists: scope -> AWAITING_REPROCESS, awaiting_reprocess_since = now"
          - "AnesthesiaAssignment in {ASSIGNED, CONFIRMED} -> CANCELLED; provider scheduled_minutes released (anesthesia_minutes_ledger)"
          - "increments ProcedureBooking.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /endoscopy/bookings/{id}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "booking axis IN {SCHEDULED, CHECKED_IN} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "cancel_reason set; prep_status left unchanged (parallel axes are independent)"
          - "AnesthesiaAssignment in {ASSIGNED, CONFIRMED} -> CANCELLED; provider scheduled_minutes released"
          - "increments ProcedureBooking.version by 1"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /endoscopy/bookings/{id}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "booking axis IN {SCHEDULED, CHECKED_IN} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "cancel_reason set; prep_status left unchanged"
          - "AnesthesiaAssignment in {ASSIGNED, CONFIRMED} -> CANCELLED; provider scheduled_minutes released"
          - "increments ProcedureBooking.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /endoscopy/bookings/{id}/mark-no-show"
        actor: SchedulingCoordinator
        preconditions:
          - "now > scheduled_start + 30min (ERR_NO_SHOW_WINDOW_NOT_REACHED)"
        side_effects:
          - "AnesthesiaAssignment in {ASSIGNED, CONFIRMED} -> CANCELLED; provider scheduled_minutes released"
          - "increments ProcedureBooking.version by 1"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /endoscopy/bookings/{id}/reschedule"
        actor: SchedulingCoordinator
        preconditions:
          - "expected_booking_version == current version (ERR_STALE_BOOKING_VERSION, 412)"
          - "new slot passes all POST /bookings validations (existence, lead time, overlap, capacity) against new_room_id or the current room"
        side_effects:
          - "new ProcedureBooking created with rescheduled_from_id = this id, status SCHEDULED, prep_status PREP_PENDING"
          - "AnesthesiaAssignment in {ASSIGNED, CONFIRMED} -> CANCELLED; provider scheduled_minutes released"
          - "increments this ProcedureBooking.version by 1"

  - entity: ProcedureBookingPrep
    note: "prep axis of ProcedureBooking (parallel dimension; fields prep_status, bbps_*). Machine name distinct for grounds references; both axes live on the ProcedureBooking row."
    initial_state: PREP_PENDING
    terminal_states: [PREP_ADEQUATE, PREP_INADEQUATE]
    transitions:
      - from: PREP_PENDING
        to: PREP_CONFIRMED
        trigger: "POST /endoscopy/bookings/{id}/confirm-prep"
        actor: SchedulingCoordinator
        preconditions:
          - "booking axis == SCHEDULED (ERR_BOOKING_NOT_SCHEDULED)"
        side_effects:
          - "increments ProcedureBooking.version by 1"
      - from: PREP_CONFIRMED
        to: PREP_ADEQUATE
        trigger: "POST /endoscopy/bookings/{id}/record-prep-assessment"
        actor: Endoscopist
        preconditions:
          - "caller X-User-ID == booking.provider_id (ERR_PROVIDER_OWNERSHIP_MISMATCH)"
          - "booking axis == IN_PROGRESS (ERR_BOOKING_NOT_IN_PROGRESS)"
          - "bbps_* all null (single-shot; ERR_PREP_ALREADY_ASSESSED)"
          - "bowel_prep_adequacy: sum >= 6 AND every segment >= 2"
        side_effects:
          - "bbps_left/right/transverse stored"
          - "increments ProcedureBooking.version by 1"
      - from: PREP_CONFIRMED
        to: PREP_INADEQUATE
        trigger: "POST /endoscopy/bookings/{id}/record-prep-assessment"
        actor: Endoscopist
        preconditions:
          - "caller X-User-ID == booking.provider_id (ERR_PROVIDER_OWNERSHIP_MISMATCH)"
          - "booking axis == IN_PROGRESS (ERR_BOOKING_NOT_IN_PROGRESS)"
          - "bbps_* all null (ERR_PREP_ALREADY_ASSESSED)"
          - "bowel_prep_adequacy: sum < 6 OR any segment < 2"
        side_effects:
          - "bbps_left/right/transverse stored"
          - "increments ProcedureBooking.version by 1"

  - entity: Scope
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "system (booking start assigns the scope)"
        actor: system
        preconditions:
          - "is_storage_current (ERR_SCOPE_STORAGE_EXPIRED raised at the driving endpoint)"
        side_effects:
          - "ScopeUsage created; use_count += 1; version += 1"
      - from: IN_USE
        to: AWAITING_REPROCESS
        trigger: "system (booking complete or abort with ACTIVE usage)"
        actor: system
        preconditions: []
        side_effects:
          - "awaiting_reprocess_since = now; version += 1"
      - from: AVAILABLE
        to: AWAITING_REPROCESS
        trigger: "POST /endoscopy/scopes/{id}/send-to-reprocessing"
        actor: ReprocessingTechnician | UnitAdmin
        preconditions:
          - "scope.status == AVAILABLE (ERR_SCOPE_NOT_REPROCESSABLE)"
        side_effects:
          - "awaiting_reprocess_since = now; version += 1"
      - from: AWAITING_REPROCESS
        to: REPROCESSING
        trigger: "system (reprocessing cycle created)"
        actor: system
        preconditions: []
        side_effects:
          - "version += 1"
      - from: QUARANTINED
        to: REPROCESSING
        trigger: "system (reculture reprocessing cycle created)"
        actor: system
        preconditions: []
        side_effects:
          - "cycle.is_reculture = true"
          - "open QuarantineCase -> RECULTURING; case.reculture_cycle_id = new cycle id"
          - "version += 1"
      - from: REPROCESSING
        to: AVAILABLE
        trigger: "system (cycle reaches COMPLETE and scope is not under quarantine)"
        actor: system
        preconditions: []
        side_effects:
          - "storage_expires_at = cycle.dried_at + 72h (scope_storage_expiry); version += 1"
      - from: REPROCESSING
        to: QUARANTINED
        trigger: "system (reculture cycle reaches COMPLETE while case still open)"
        actor: system
        preconditions: []
        side_effects:
          - "storage_expires_at = cycle.dried_at + 72h (documentation preserved); version += 1"
      - from: REPROCESSING
        to: AWAITING_REPROCESS
        trigger: "system (cycle FAILED at the HLD concentration gate)"
        actor: system
        preconditions: []
        side_effects:
          - "awaiting_reprocess_since = now; version += 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system (culture result recorded POSITIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "QuarantineCase created OPEN with exposure window (culture_exposure_window)"
          - "in-window ScopeUsages -> exposure_flagged = true; their bookings -> notification_flag = true"
          - "version += 1"
      - from: AWAITING_REPROCESS
        to: QUARANTINED
        trigger: "system (culture result recorded POSITIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "QuarantineCase created OPEN with exposure window; usage/booking flags as above; version += 1"
      - from: REPROCESSING
        to: QUARANTINED
        trigger: "system (culture result recorded POSITIVE while cycle running)"
        actor: system
        preconditions: []
        side_effects:
          - "QuarantineCase created OPEN with exposure window; usage/booking flags as above; version += 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /endoscopy/scopes/{id}/release-quarantine"
        actor: InfectionControlNurse
        preconditions:
          - "expected_scope_version == current version (ERR_STALE_SCOPE_VERSION, 412)"
          - "an open QuarantineCase exists for this scope (ERR_NO_OPEN_QUARANTINE)"
          - "a NEGATIVE ScopeCultureTest exists on case.reculture_cycle_id (ERR_RECULTURE_NOT_NEGATIVE)"
          - "caller X-User-ID != reculture cycle.technician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "QuarantineCase -> RELEASED (released_by, resolved_at set)"
          - "version += 1"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /endoscopy/scopes/{id}/retire"
        actor: UnitAdmin
        preconditions:
          - "scope.status IN {AVAILABLE, AWAITING_REPROCESS, QUARANTINED} (ERR_SCOPE_NOT_RETIRABLE)"
        side_effects:
          - "if an open QuarantineCase exists: case -> SCOPE_RETIRED (resolved_at set)"
          - "version += 1"
      - from: AWAITING_REPROCESS
        to: OUT_OF_SERVICE
        trigger: "POST /endoscopy/scopes/{id}/retire"
        actor: UnitAdmin
        preconditions:
          - "scope.status IN {AVAILABLE, AWAITING_REPROCESS, QUARANTINED} (ERR_SCOPE_NOT_RETIRABLE)"
        side_effects:
          - "version += 1"
      - from: QUARANTINED
        to: OUT_OF_SERVICE
        trigger: "POST /endoscopy/scopes/{id}/retire"
        actor: UnitAdmin
        preconditions:
          - "scope.status IN {AVAILABLE, AWAITING_REPROCESS, QUARANTINED} (ERR_SCOPE_NOT_RETIRABLE)"
        side_effects:
          - "open QuarantineCase -> SCOPE_RETIRED (resolved_at set)"
          - "version += 1"

  - entity: ReprocessingCycle
    initial_state: INITIATED
    terminal_states: [COMPLETE, FAILED]
    transitions:
      - from: INITIATED
        to: PRECLEANED
        trigger: "POST /endoscopy/reprocessing-cycles/{id}/steps/advance { to_step: PRECLEANED }"
        actor: ReprocessingTechnician
        preconditions:
          - "to_step is exactly the next step in INITIATED -> PRECLEANED -> CLEANED -> DISINFECTED -> DRIED -> COMPLETE (ERR_CYCLE_STEP_OUT_OF_ORDER)"
        side_effects:
          - "precleaned_at = now; version += 1"
      - from: PRECLEANED
        to: CLEANED
        trigger: "POST /endoscopy/reprocessing-cycles/{id}/steps/advance { to_step: CLEANED }"
        actor: ReprocessingTechnician
        preconditions:
          - "step order (ERR_CYCLE_STEP_OUT_OF_ORDER)"
          - "elapsed(precleaned_at -> now) >= 20 min when requires_extended_soak else >= 5 min (ERR_STEP_DURATION_TOO_SHORT)"
        side_effects:
          - "cleaned_at = now; version += 1"
      - from: CLEANED
        to: DISINFECTED
        trigger: "POST /endoscopy/reprocessing-cycles/{id}/steps/advance { to_step: DISINFECTED, hld_solution_lot, hld_concentration_ppm }"
        actor: ReprocessingTechnician
        preconditions:
          - "step order (ERR_CYCLE_STEP_OUT_OF_ORDER)"
          - "elapsed(cleaned_at -> now) >= 600 seconds HLD contact (ERR_STEP_DURATION_TOO_SHORT)"
        side_effects:
          - "if hld_concentration_ppm < 300: request rejected with ERR_HLD_CONCENTRATION_TOO_LOW AND cycle -> FAILED, scope -> AWAITING_REPROCESS (awaiting_reprocess_since = now)"
          - "otherwise: hld_solution_lot, hld_concentration_ppm stored; disinfected_at = now; version += 1"
      - from: DISINFECTED
        to: DRIED
        trigger: "POST /endoscopy/reprocessing-cycles/{id}/steps/advance { to_step: DRIED }"
        actor: ReprocessingTechnician
        preconditions:
          - "step order (ERR_CYCLE_STEP_OUT_OF_ORDER)"
          - "elapsed(disinfected_at -> now) >= 10 minutes (ERR_STEP_DURATION_TOO_SHORT)"
        side_effects:
          - "dried_at = now; version += 1"
      - from: DRIED
        to: COMPLETE
        trigger: "POST /endoscopy/reprocessing-cycles/{id}/steps/advance { to_step: COMPLETE }"
        actor: ReprocessingTechnician
        preconditions:
          - "step order (ERR_CYCLE_STEP_OUT_OF_ORDER)"
        side_effects:
          - "completed_at = now; version += 1"
          - "scope: if QUARANTINED -> stays QUARANTINED (REPROCESSING -> QUARANTINED), else -> AVAILABLE; storage_expires_at = dried_at + 72h (scope_storage_expiry)"
      - from: CLEANED
        to: FAILED
        trigger: "system (DISINFECTED step submitted with hld_concentration_ppm < 300)"
        actor: system
        preconditions: []
        side_effects:
          - "scope -> AWAITING_REPROCESS (awaiting_reprocess_since = now); version += 1"

  - entity: ScopeCultureTest
    initial_state: PENDING
    terminal_states: [RESULTED]
    transitions:
      - from: PENDING
        to: RESULTED
        trigger: "POST /endoscopy/culture-tests/{id}/result"
        actor: InfectionControlNurse
        preconditions:
          - "status == PENDING (ERR_CULTURE_ALREADY_RESULTED)"
          - "result POSITIVE requires organism and cfu_count (ERR_INVALID_REQUEST)"
        side_effects:
          - "result, organism, cfu_count, resulted_at stored; version += 1"
          - "if result == POSITIVE and scope.status != OUT_OF_SERVICE: scope -> QUARANTINED; QuarantineCase created OPEN (exposure window per culture_exposure_window); in-window ScopeUsages exposure_flagged = true; their bookings notification_flag = true"
          - "if result == POSITIVE and scope.status == OUT_OF_SERVICE: QuarantineCase created directly in SCOPE_RETIRED (no scope transition possible)"

  - entity: QuarantineCase
    initial_state: OPEN
    terminal_states: [RELEASED, SCOPE_RETIRED]
    transitions:
      - from: OPEN
        to: RECULTURING
        trigger: "system (reprocessing cycle created on the quarantined scope)"
        actor: system
        preconditions: []
        side_effects:
          - "reculture_cycle_id set to the new cycle; version += 1"
      - from: RECULTURING
        to: RELEASED
        trigger: "POST /endoscopy/scopes/{scopeId}/release-quarantine"
        actor: InfectionControlNurse
        preconditions:
          - "release preconditions per Scope QUARANTINED -> AVAILABLE transition"
        side_effects:
          - "released_by = X-User-ID; resolved_at = now; version += 1"
      - from: OPEN
        to: SCOPE_RETIRED
        trigger: "system (scope retired while case open)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_at = now; version += 1"
      - from: RECULTURING
        to: SCOPE_RETIRED
        trigger: "system (scope retired while case open)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_at = now; version += 1"

  - entity: Specimen
    initial_state: COLLECTED
    terminal_states: [RESULTED, REJECTED_BY_LAB]
    transitions:
      - from: COLLECTED
        to: LABELED
        trigger: "POST /endoscopy/specimens/{id}/label"
        actor: Endoscopist | PathologyStaff
        preconditions:
          - "now <= collected_at + 15 minutes (ERR_LABEL_WINDOW_EXCEEDED)"
        side_effects:
          - "labeled_at = now; labeled_by = X-User-ID; version += 1"
      - from: LABELED
        to: IN_TRANSIT
        trigger: "POST /endoscopy/specimens/{id}/handoff"
        actor: PathologyStaff
        preconditions:
          - "status == LABELED (ERR_SPECIMEN_NOT_LABELED)"
        side_effects:
          - "handed_off_at = now; handed_off_by = X-User-ID; courier_id stored; version += 1"
      - from: IN_TRANSIT
        to: RECEIVED_BY_LAB
        trigger: "POST /endoscopy/specimens/{id}/receive"
        actor: PathologyStaff
        preconditions:
          - "status == IN_TRANSIT (ERR_SPECIMEN_NOT_IN_TRANSIT)"
          - "now <= collected_at + 120 minutes (ERR_TRANSPORT_WINDOW_EXCEEDED)"
        side_effects:
          - "received_at = now; received_by = X-User-ID; version += 1"
      - from: RECEIVED_BY_LAB
        to: RESULTED
        trigger: "POST /endoscopy/specimens/{id}/result"
        actor: PathologyStaff
        preconditions:
          - "status == RECEIVED_BY_LAB (ERR_SPECIMEN_NOT_RECEIVED)"
        side_effects:
          - "adenoma_confirmed stored; resulted_at = now; version += 1"
      - from: LABELED
        to: REJECTED_BY_LAB
        trigger: "POST /endoscopy/specimens/{id}/reject"
        actor: PathologyStaff
        preconditions:
          - "status IN {LABELED, IN_TRANSIT} (ERR_SPECIMEN_TERMINAL)"
        side_effects:
          - "reject_reason stored; version += 1"
      - from: IN_TRANSIT
        to: REJECTED_BY_LAB
        trigger: "POST /endoscopy/specimens/{id}/reject"
        actor: PathologyStaff
        preconditions:
          - "status IN {LABELED, IN_TRANSIT} (ERR_SPECIMEN_TERMINAL)"
        side_effects:
          - "reject_reason stored; version += 1"

  - entity: AnesthesiaAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /endoscopy/anesthesia-assignments/{id}/confirm"
        actor: AnesthesiaProvider
        preconditions:
          - "caller X-User-ID == assignment.anesthesia_provider_id (ERR_ANESTHESIA_OWNERSHIP_MISMATCH)"
          - "status == ASSIGNED (ERR_ASSIGNMENT_STATE_INVALID)"
        side_effects:
          - "version += 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (booking completes)"
        actor: system
        preconditions: []
        side_effects:
          - "AnesthesiaProvider.scheduled_minutes -= minutes (anesthesia_minutes_ledger); version += 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /endoscopy/anesthesia-assignments/{id}/cancel OR system (booking cancel / no-show / abort / reschedule / anesthesia_type -> NONE)"
        actor: SchedulingCoordinator | AnesthesiaProvider | system
        preconditions:
          - "status IN {ASSIGNED, CONFIRMED} (ERR_ASSIGNMENT_STATE_INVALID)"
        side_effects:
          - "cancel_reason stored when explicit; AnesthesiaProvider.scheduled_minutes -= minutes; version += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /endoscopy/anesthesia-assignments/{id}/cancel OR system cascade"
        actor: SchedulingCoordinator | AnesthesiaProvider | system
        preconditions:
          - "status IN {ASSIGNED, CONFIRMED} (ERR_ASSIGNMENT_STATE_INVALID)"
        side_effects:
          - "cancel_reason stored when explicit; AnesthesiaProvider.scheduled_minutes -= minutes; version += 1"

  - entity: Provider
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /endoscopy/providers/{id} { credential_status: SUSPENDED }"
        actor: UnitAdmin
        preconditions: []
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /endoscopy/providers/{id} { credential_status: ACTIVE }"
        actor: UnitAdmin
        preconditions: []
        side_effects: ["version += 1"]

  - entity: AnesthesiaProvider
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /endoscopy/anesthesia-providers/{id} { credential_status: SUSPENDED }"
        actor: UnitAdmin
        preconditions: []
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /endoscopy/anesthesia-providers/{id} { credential_status: ACTIVE }"
        actor: UnitAdmin
        preconditions: []
        side_effects: ["version += 1"]

  - entity: Room
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "PATCH /endoscopy/rooms/{id} { status: OUT_OF_SERVICE }"
        actor: UnitAdmin
        preconditions: []
        side_effects: ["version += 1"]
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "PATCH /endoscopy/rooms/{id} { status: ACTIVE }"
        actor: UnitAdmin
        preconditions: []
        side_effects: ["version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-patch-stale-version
    parent_entity: ProcedureBooking
    write_endpoint: "PATCH /endoscopy/bookings/{id}"
    occ_field: "expected_booking_version"
    description: |
      A PATCH whose expected_booking_version no longer matches the booking's
      current version is rejected. This captures the case where another writer
      has mutated the booking (notes, anesthesia_type, prep confirmation,
      check-in) since the client last observed it, so the client's patch would
      be applied to a stale view of the record.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
  - rule_id: booking-reschedule-stale-version
    parent_entity: ProcedureBooking
    write_endpoint: "POST /endoscopy/bookings/{id}/reschedule"
    occ_field: "expected_booking_version"
    description: |
      A reschedule whose expected_booking_version no longer matches the
      booking's current version is rejected. Rescheduling supersedes the
      booking and must be based on the client's latest observed state; any
      intervening mutation (e.g., a prep confirmation or note amendment that
      advanced the version) makes the client's view stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
  - rule_id: scope-release-stale-version
    parent_entity: Scope
    write_endpoint: "POST /endoscopy/scopes/{id}/release-quarantine"
    occ_field: "expected_scope_version"
    description: |
      A quarantine release whose expected_scope_version no longer matches the
      scope's current version is rejected. Release decisions must be based on
      the latest observed scope state; any intervening mutation (e.g., the
      reculture cycle completing, which advances the version) makes the
      client's view stale.
    error_id: ERR_STALE_SCOPE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: procedure_occupancy_minutes
    trigger: "booking creation; PATCH /bookings changing anesthesia_type (recompute); completion/abort (actual variant)"
    algorithm: forward_looking
    formula: |
      age(patient) = full calendar years between patient.date_of_birth and scheduled_start (UTC);
                     a patient whose birthday falls on the scheduled date counts as turned (>=)
      scheduled variant:
        procedure_minutes = base_duration_minutes
                          + ANESTHESIA_ADDON[anesthesia_type]
                          + (AGE_ADDON_MIN if age >= AGE_THRESHOLD_YEARS else 0)
        scheduled_end     = scheduled_start + procedure_minutes minutes
      actual variant (at complete/abort):
        actual_duration_minutes = floor((actual_end - actual_start) in seconds / 60)
    input_set: "the booking, its Patient.date_of_birth, its ProcedureType.base_duration_minutes"
    constants:
      AGE_THRESHOLD_YEARS: 65
      AGE_ADDON_MIN: 5
    precision: "integer minutes; durations truncated to whole minutes"
    variants:
      - name: scheduled_window
        when: "at creation and after anesthesia_type PATCH"
        difference: "forward-looking estimate from configuration inputs; stored as procedure_minutes"
      - name: actual_measured
        when: "at complete/abort"
        difference: "chronological measurement from actual timestamps; stored as actual_duration_minutes; identical inputs routinely yield a different number than scheduled_window"

  - name: room_block_window
    trigger: "booking creation; PATCH /bookings changing anesthesia_type; reschedule (evaluated for the new slot)"
    algorithm: interval_merge
    formula: |
      room_block_end = scheduled_end + TURNOVER[room.room_class] minutes
      overlap predicate vs candidate booking c (same room, c.status IN
      {SCHEDULED, CHECKED_IN, IN_PROGRESS, COMPLETED, ABORTED_PREP_INADEQUATE}):
        conflict IFF new.scheduled_start < c.room_block_end AND new.room_block_end > c.scheduled_start
        (half-open intervals: adjacency where new.scheduled_start == c.room_block_end is NOT a conflict)
      day-capacity rule (same candidate set, same UTC date as new.scheduled_start):
        sum(room_block_minutes of candidates) + new room_block_minutes <= ROOM_DAY_CAPACITY_MINUTES
        where room_block_minutes = minutes between scheduled_start and room_block_end
    input_set: "all bookings of the room in the non-released status set; room class"
    constants:
      TURNOVER_STANDARD_MIN: 15
      TURNOVER_ERCP_CAPABLE_MIN: 25
      ROOM_DAY_CAPACITY_MINUTES: 480
    precision: "integer minutes"
    note: "overlap is evaluated before capacity; both are business_constraint priority"

  - name: bowel_prep_adequacy
    trigger: "POST /bookings/{id}/record-prep-assessment"
    algorithm: threshold
    formula: |
      total = bbps_left + bbps_right + bbps_transverse   (each 0..3)
      adequate IFF total >= 6 AND min(bbps_left, bbps_right, bbps_transverse) >= 2
      adequate -> prep_status PREP_ADEQUATE; else PREP_INADEQUATE
    input_set: "the three segment scores of this assessment"
    constants:
      BBPS_TOTAL_MIN: 6
      BBPS_SEGMENT_MIN: 2
      BBPS_SEGMENT_MAX: 3
    precision: "integer scores"

  - name: reprocessing_step_windows
    trigger: "POST /reprocessing-cycles (preclean deadline); POST /reprocessing-cycles/{id}/steps/advance (step minimums)"
    algorithm: threshold
    formula: |
      preclean deadline (at cycle creation):
        requires_extended_soak = (now - scope.awaiting_reprocess_since) > PRECLEAN_DEADLINE_MIN minutes
        (exactly 60 minutes is NOT extended: comparison is strict >)
      manual clean minimum (PRECLEANED -> CLEANED):
        min = EXTENDED_MANUAL_CLEAN_MIN (20) if requires_extended_soak else MANUAL_CLEAN_MIN (5)
        elapsed(precleaned_at -> now) >= min, else ERR_STEP_DURATION_TOO_SHORT
      HLD contact minimum (CLEANED -> DISINFECTED):
        elapsed(cleaned_at -> now) >= HLD_MIN_CONTACT_SECONDS (600), else ERR_STEP_DURATION_TOO_SHORT
        hld_concentration_ppm >= HLD_MIN_CONCENTRATION_PPM (300), else ERR_HLD_CONCENTRATION_TOO_LOW + cycle FAILED
      drying minimum (DISINFECTED -> DRIED):
        elapsed(disinfected_at -> now) >= DRY_MIN_MINUTES (10), else ERR_STEP_DURATION_TOO_SHORT
    input_set: "the cycle's step timestamps and the scope's awaiting_reprocess_since"
    constants:
      PRECLEAN_DEADLINE_MIN: 60
      MANUAL_CLEAN_MIN: 5
      EXTENDED_MANUAL_CLEAN_MIN: 20
      HLD_MIN_CONTACT_SECONDS: 600
      HLD_MIN_CONCENTRATION_PPM: 300
      DRY_MIN_MINUTES: 10
    precision: "second-resolution elapsed comparisons (inclusive >=)"

  - name: scope_storage_expiry
    trigger: "cycle COMPLETE step (sets); booking start / scope_selection (evaluates)"
    algorithm: threshold
    formula: |
      on cycle COMPLETE: scope.storage_expires_at = cycle.dried_at + HANG_TIME_HOURS hours
      is_storage_current = (storage_expires_at IS NULL) OR (now < storage_expires_at)
      boundary: at now == storage_expires_at the scope is EXPIRED (strict <)
    input_set: "the scope"
    constants:
      HANG_TIME_HOURS: 72
    precision: "second-resolution comparison"

  - name: room_utilization_report
    trigger: "GET /endoscopy/reports/room-utilization?date=YYYY-MM-DD"
    algorithm: aggregation
    formula: |
      for each Room (any status):
        occupied_minutes = sum of room_block_minutes over bookings with
          status IN {SCHEDULED, CHECKED_IN, IN_PROGRESS, COMPLETED, ABORTED_PREP_INADEQUATE}
          whose scheduled_start falls on `date` (UTC)
          (CANCELLED, NO_SHOW, RESCHEDULED bookings are excluded)
        room_pct = round_half_up(100 * occupied_minutes / ROOM_OPEN_MINUTES_PER_DAY, 1)
      PINNED ROUNDING ORDER (normative):
        unit_utilization_pct = round_half_up( average(room_pct over all rooms), 1 )
        -- round each room FIRST, then average, then round once more.
        -- The alternative (sum minutes / (480 * n_rooms)) is a different, non-conformant algorithm.
      empty room set (no rooms exist): rooms = [], unit_utilization_pct = null
    input_set: "all rooms; all bookings of those rooms on the date"
    constants:
      ROOM_OPEN_MINUTES_PER_DAY: 480
    precision: "1 decimal, round_half_up; per-room round precedes unit average"

  - name: adenoma_detection_rate
    trigger: "POST /endoscopy/quality-reports (computed once into the immutable snapshot)"
    algorithm: aggregation
    formula: |
      candidate set: bookings of provider with status == COMPLETED,
        procedure_type.adr_relevant == true,
        actual_end IN [period_start, period_end] (both bounds inclusive)
      STRICT variant denominator adds ALL of:
        indication == SCREENING
        age(patient at scheduled_start) >= ADR_MIN_AGE (45)
        cecum_intubated == true
        prep_status == PREP_ADEQUATE
      EXPANDED variant denominator: the full candidate set (no further filters)
      numerator: denominator rows with adenomas_detected >= 1
      adenoma_detection_rate = null when denominator == 0
                             else round_half_up(100 * numerator / denominator, 1)
    input_set: "COMPLETED bookings of the provider in the period; patient dob; procedure type flags"
    constants:
      ADR_MIN_AGE: 45
    precision: "1 decimal percent, round_half_up"
    variants:
      - name: STRICT
        when: "metric_variant == STRICT"
        difference: "screening-only, age>=45, cecum intubated, adequate prep — the auditing denominator"
      - name: EXPANDED
        when: "metric_variant == EXPANDED"
        difference: "all completed adr_relevant procedures — the operational denominator; identical underlying data yields a different rate"

  - name: withdrawal_time_average
    trigger: "POST /endoscopy/quality-reports"
    algorithm: aggregation
    formula: |
      inclusion set (variant-invariant): bookings of provider with
        status == COMPLETED
        procedure_type.colonoscopy_family == true
        actual_end IN [period_start, period_end] (inclusive)
        cecum_intubated == true
        adenomas_detected == 0
        zero Specimen rows linked via booking_id (any specimen status counts as taken)
      withdrawal_time_avg_seconds = null when set empty
                                  else round_half_up(mean(withdrawal_time_seconds), 1)
      withdrawal_sample_size = |inclusion set|
    input_set: "COMPLETED bookings of the provider in the period; their Specimen rows"
    precision: "1 decimal seconds, round_half_up"

  - name: cecal_intubation_and_prep_rates
    trigger: "POST /endoscopy/quality-reports"
    algorithm: aggregation
    formula: |
      CIR denominator: COMPLETED bookings of provider, colonoscopy_family, actual_end in period
      CIR numerator: denominator rows with cecum_intubated == true
      cecal_intubation_rate = null when denominator 0 else round_half_up(100 * n/d, 1)
      prep denominator: bookings of provider, actual_end in period,
        prep_status IN {PREP_ADEQUATE, PREP_INADEQUATE} (i.e., assessed)
      prep_adequacy_rate = null when denominator 0
                         else round_half_up(100 * PREP_ADEQUATE count / denominator, 1)
    input_set: "bookings of the provider in the period"
    precision: "1 decimal percent, round_half_up"

  - name: culture_exposure_window
    trigger: "ScopeCultureTest result recorded POSITIVE"
    algorithm: chronological
    formula: |
      let T_pos = triggering culture.sampled_at
      let C_neg = NEGATIVE cultures on the same scope with sampled_at strictly < T_pos
      exposure_window_start = max(C_neg.sampled_at)  (tie-break: later created_at wins; never id)
                            = null when C_neg is empty (unbounded past)
      exposure set = ScopeUsage rows of the scope, status ANY (VOID included for traceability),
        with booking.actual_end IN (exposure_window_start, T_pos]
        -- left-exclusive, right-inclusive: a usage ending exactly at the last negative sample
        -- is excluded; one ending exactly at T_pos is included
      side effects per exposure: exposure_flagged = true, then booking.notification_flag = true
    input_set: "all ScopeCultureTest rows of the scope; all ScopeUsage rows of the scope with their bookings"
    precision: "second-resolution comparisons"

  - name: scope_selection
    trigger: "POST /bookings/{id}/start when scope_id is omitted"
    algorithm: constraint_propagation
    formula: |
      eligibility filter: scope_type == procedure_type.required_scope_type
        AND status == AVAILABLE
        AND is_storage_current (now < storage_expires_at OR storage_expires_at IS NULL)
      ranking: use_count ASC (least-worn first)
      tie-break 1: storage_expires_at ASC, NULLS LAST (expiring soonest is preferred; never-expiring last)
      tie-break 2: created_at ASC
      empty candidate set -> ERR_NO_COMPATIBLE_SCOPE (409)
    input_set: "all Scope rows"
    precision: "n/a"

  - name: anesthesia_minutes_ledger
    trigger: "assignment create/confirm-complete/cancel (explicit or cascade)"
    algorithm: aggregation
    formula: |
      AnesthesiaProvider.scheduled_minutes =
        sum(assignment.minutes) over assignments of the provider with status IN {ASSIGNED, CONFIRMED}
      INVARIANT (compensating pair): create(+) and cancel(-) of the same assignment leave
        scheduled_minutes unchanged; minutes is a creation-time snapshot of booking.procedure_minutes
        and is NOT recomputed when the booking is later PATCHed
    input_set: "AnesthesiaAssignment rows of the provider"
    precision: "integer minutes"

  - name: scope_use_ledger
    trigger: "booking start (usage created); POST /scope-usages/{id}/void (compensation)"
    algorithm: aggregation
    formula: |
      Scope.use_count = count(ScopeUsage rows with scope_id = scope.id AND status != VOID)
      INVARIANT (compensating pair): procedure start (+1 via creation) and usage void (-1 via VOID)
        leave use_count unchanged; void also returns the scope IN_USE -> AVAILABLE
    input_set: "ScopeUsage rows of the scope"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# a single request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path template ids resolve, validated left-to-right; body-referenced FK ids (patient_id, provider_id, procedure_type_id, room_id, booking_id, scope_id, reprocessing_cycle_id, anesthesia_provider_id) exist"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_PROCEDURE_TYPE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_ANESTHESIA_PROVIDER_NOT_FOUND | ERR_SCOPE_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_SCOPE_USAGE_NOT_FOUND | ERR_REPROCESSING_CYCLE_NOT_FOUND | ERR_CULTURE_TEST_NOT_FOUND | ERR_QUARANTINE_CASE_NOT_FOUND | ERR_SPECIMEN_NOT_FOUND | ERR_QUALITY_REPORT_NOT_FOUND | ERR_ANESTHESIA_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: existence
    check: "Request-body schema: required fields present, types valid, enum values in range, integer ranges honored (bbps 0..3, container_count >= 1, base_duration_minutes > 0, withdrawal_time_seconds >= 0, adenomas_detected >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version (checked before any business rule once the resource exists)"
    error_id: "ERR_STALE_BOOKING_VERSION | ERR_STALE_SCOPE_VERSION"
    http_status: 412
    applies_to: "PATCH /bookings/{id}, POST /bookings/{id}/reschedule, POST /scopes/{id}/release-quarantine"
  - priority: 6
    category: auth
    check: "Ownership / segregation: Endoscopist may act only on own bookings (provider_id == X-User-ID); AnesthesiaProvider may confirm only own assignments; quarantine releaser X-User-ID must differ from reculture cycle.technician_id"
    error_id: "ERR_PROVIDER_OWNERSHIP_MISMATCH | ERR_ANESTHESIA_OWNERSHIP_MISMATCH | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "start/record-prep-assessment/complete/abort/specimen collect; assignment confirm; release-quarantine"
  - priority: 7
    category: state
    check: "Target entity in a legal from-state for the requested transition (booking axis, prep axis, scope status, cycle step order, culture PENDING, specimen custody order, assignment status)"
    error_id: "ERR_BOOKING_NOT_SCHEDULED | ERR_BOOKING_NOT_CHECKED_IN | ERR_BOOKING_NOT_IN_PROGRESS | ERR_BOOKING_NOT_CANCELLABLE | ERR_PREP_NOT_CONFIRMED | ERR_PREP_ALREADY_ASSESSED | ERR_PREP_NOT_ASSESSED | ERR_PREP_NOT_INADEQUATE | ERR_SCOPE_NOT_AVAILABLE | ERR_SCOPE_NOT_REPROCESSABLE | ERR_SCOPE_NOT_RETIRABLE | ERR_CYCLE_STEP_OUT_OF_ORDER | ERR_CYCLE_NOT_ADVANCABLE | ERR_CULTURE_ALREADY_RESULTED | ERR_NO_OPEN_QUARANTINE | ERR_SPECIMEN_NOT_LABELED | ERR_SPECIMEN_NOT_IN_TRANSIT | ERR_SPECIMEN_NOT_RECEIVED | ERR_SPECIMEN_TERMINAL | ERR_ASSIGNMENT_STATE_INVALID | ERR_SCOPE_USAGE_NOT_VOIDABLE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Compliance gates: provider/anesthesia-provider not SUSPENDED; anesthesia CONFIRMED when anesthesia_type != NONE; explicit scope storage-current; HLD concentration >= 300 ppm; reprocessing step minimum durations; specimen label <= 15 min and transport <= 120 min windows"
    error_id: "ERR_PROVIDER_SUSPENDED | ERR_ANESTHESIA_PROVIDER_SUSPENDED | ERR_ANESTHESIA_NOT_CONFIRMED | ERR_SCOPE_STORAGE_EXPIRED | ERR_HLD_CONCENTRATION_TOO_LOW | ERR_STEP_DURATION_TOO_SHORT | ERR_LABEL_WINDOW_EXCEEDED | ERR_TRANSPORT_WINDOW_EXCEEDED"
    http_status: 422
    applies_to: "booking create/start, assignment create, cycle advance, specimen label/receive"
    note: "ERR_PROVIDER_SUSPENDED, ERR_ANESTHESIA_NOT_CONFIRMED, ERR_SCOPE_STORAGE_EXPIRED surface as 409 on state-adjacent endpoints per error catalog; category ordering is what matters"
  - priority: 9
    category: business_temporal
    check: "Booking temporal gates: scheduled_start strictly in the future (ERR_SCHEDULED_START_IN_PAST); prep lead time — SPLIT_DOSE >= 24h, CLEAR_LIQUIDS >= 8h, NONE >= 0h (ERR_PREP_LEAD_TIME_INSUFFICIENT); check-in window [start-60min, start+30min] (ERR_CHECKIN_WINDOW_CLOSED); no-show only after start+30min (ERR_NO_SHOW_WINDOW_NOT_REACHED); quality report period_start <= period_end (ERR_INVALID_PERIOD); logical clock strictly increasing (ERR_CLOCK_REGRESSION)"
    error_id: "ERR_SCHEDULED_START_IN_PAST | ERR_PREP_LEAD_TIME_INSUFFICIENT | ERR_CHECKIN_WINDOW_CLOSED | ERR_NO_SHOW_WINDOW_NOT_REACHED | ERR_INVALID_PERIOD | ERR_CLOCK_REGRESSION"
    http_status: 422
    applies_to: "booking create/reschedule/PATCH anesthesia_type, check-in, mark-no-show, quality-reports create, clock set"
  - priority: 10
    category: business_constraint
    check: "Capacity and uniqueness: room half-open overlap with turnover buffer (ERR_ROOM_TIME_CONFLICT); room day capacity <= 480 committed block-minutes (ERR_ROOM_DAY_CAPACITY_EXCEEDED); anesthesia provider closed-interval overlap — touching endpoints conflict (ERR_ANESTHESIA_TIME_CONFLICT); room ACTIVE for new bookings (ERR_ROOM_NOT_IN_SERVICE); assignment only when anesthesia_type != NONE (ERR_ANESTHESIA_TYPE_NONE); auto-selector pool non-empty (ERR_NO_COMPATIBLE_SCOPE); mrn/serial_number/code uniqueness (ERR_PATIENT_MRN_EXISTS | ERR_SERIAL_NUMBER_EXISTS | ERR_PROCEDURE_TYPE_CODE_EXISTS)"
    error_id: "ERR_ROOM_TIME_CONFLICT | ERR_ROOM_DAY_CAPACITY_EXCEEDED | ERR_ANESTHESIA_TIME_CONFLICT | ERR_ROOM_NOT_IN_SERVICE | ERR_ANESTHESIA_TYPE_NONE | ERR_NO_COMPATIBLE_SCOPE | ERR_PATIENT_MRN_EXISTS | ERR_SERIAL_NUMBER_EXISTS | ERR_PROCEDURE_TYPE_CODE_EXISTS"
    http_status: 409
    applies_to: "booking create/reschedule/PATCH anesthesia_type, assignment create, patient/scope/procedure-type create, start (auto-select)"
  - priority: 11
    category: business_referential
    check: "Cross-entity consistency: explicit scope.scope_type == procedure_type.required_scope_type (ERR_SCOPE_TYPE_MISMATCH); culture test's reprocessing_cycle_id belongs to scope_id (ERR_CULTURE_SCOPE_MISMATCH); referenced reprocessing cycle is COMPLETE for culture creation (ERR_CYCLE_NOT_COMPLETE); anesthesia assignment's booking has anesthesia_type != NONE at creation"
    error_id: "ERR_SCOPE_TYPE_MISMATCH | ERR_CULTURE_SCOPE_MISMATCH | ERR_CYCLE_NOT_COMPLETE"
    http_status: 422
    applies_to: "booking start (explicit scope), culture create"
    note: "ERR_CYCLE_NOT_COMPLETE is 409 per catalog; ERR_ANESTHESIA_TYPE_NONE enforced at priority 10"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint; last-resort rung per §1.5 ladder) ---
  - method: POST
    path: "/endoscopy/_clock/set_current_utc"
    description: "Set the logical clock used for every 'now' in the system (step minimums, expiry, windows, report periods). Server startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the clock reads this default and never falls back to wall-clock time. The target must be strictly later than the current logical time (ERR_CLOCK_REGRESSION)."
    roles: [UnitAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutated"]

  # --- Patients ---
  - method: POST
    path: "/endoscopy/patients"
    description: "Register a patient"
    roles: [SchedulingCoordinator, UnitAdmin]
    code: 201
    input: [mrn, full_name, date_of_birth, "contact_phone?"]
    output: Patient
    side_effects: ["version = 1"]
  - method: GET
    path: "/endoscopy/patients"
    description: "List patients (paginated)"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["mrn?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/patients/{id}"
    description: "Get one patient"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- Providers (endoscopists) ---
  - method: POST
    path: "/endoscopy/providers"
    description: "Create an endoscopist"
    roles: [UnitAdmin]
    code: 201
    input: [full_name, specialty]
    output: Provider
    side_effects: ["credential_status = ACTIVE; version = 1"]
  - method: GET
    path: "/endoscopy/providers"
    description: "List providers"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["credential_status?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/providers/{id}"
    description: "Get one provider"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: PATCH
    path: "/endoscopy/providers/{id}"
    description: "Update provider (credential suspend/reinstate)"
    roles: [UnitAdmin]
    code: 200
    input: ["full_name?", "credential_status?"]
    output: Provider
    side_effects: ["increments Provider.version by 1"]

  # --- Procedure types ---
  - method: POST
    path: "/endoscopy/procedure-types"
    description: "Create a procedure type (code unique)"
    roles: [UnitAdmin]
    code: 201
    input: [code, display_name, base_duration_minutes, prep_protocol, colonoscopy_family, adr_relevant, required_scope_type]
    output: ProcedureType
    side_effects: ["version = 1"]
  - method: GET
    path: "/endoscopy/procedure-types"
    description: "List procedure types"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProcedureType[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/procedure-types/{id}"
    description: "Get one procedure type"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: ProcedureType
    side_effects: []

  # --- Rooms ---
  - method: POST
    path: "/endoscopy/rooms"
    description: "Create a procedure room"
    roles: [UnitAdmin]
    code: 201
    input: [name, room_class, supports_anesthesia]
    output: Room
    side_effects: ["status = ACTIVE; version = 1"]
  - method: GET
    path: "/endoscopy/rooms"
    description: "List rooms"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Room[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/rooms/{id}"
    description: "Get one room"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: PATCH
    path: "/endoscopy/rooms/{id}"
    description: "Update room (take out of service / return)"
    roles: [UnitAdmin]
    code: 200
    input: ["name?", "status?"]
    output: Room
    side_effects: ["increments Room.version by 1"]

  # --- Anesthesia providers ---
  - method: POST
    path: "/endoscopy/anesthesia-providers"
    description: "Create an anesthesia provider"
    roles: [UnitAdmin]
    code: 201
    input: [full_name]
    output: AnesthesiaProvider
    side_effects: ["credential_status = ACTIVE; scheduled_minutes = 0; version = 1"]
  - method: GET
    path: "/endoscopy/anesthesia-providers"
    description: "List anesthesia providers"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["credential_status?", "limit?", "offset?"]
    output: "AnesthesiaProvider[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/anesthesia-providers/{id}"
    description: "Get one anesthesia provider (includes computed scheduled_minutes)"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: AnesthesiaProvider
    side_effects: []
  - method: PATCH
    path: "/endoscopy/anesthesia-providers/{id}"
    description: "Update anesthesia provider (credential suspend/reinstate)"
    roles: [UnitAdmin]
    code: 200
    input: ["full_name?", "credential_status?"]
    output: AnesthesiaProvider
    side_effects: ["increments AnesthesiaProvider.version by 1"]

  # --- Scopes ---
  - method: POST
    path: "/endoscopy/scopes"
    description: "Register an endoscope (serial_number unique)"
    roles: [UnitAdmin]
    code: 201
    input: [serial_number, scope_type]
    output: Scope
    side_effects: ["status = AVAILABLE; use_count = 0; storage_expires_at = null; version = 1"]
  - method: GET
    path: "/endoscopy/scopes"
    description: "List scopes"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["scope_type?", "status?", "limit?", "offset?"]
    output: "Scope[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/scopes/{id}"
    description: "Get one scope"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: Scope
    side_effects: []
  - method: POST
    path: "/endoscopy/scopes/{id}/send-to-reprocessing"
    description: "Manually send an AVAILABLE scope (e.g., hang-time expired or touch-contaminated) to reprocessing"
    roles: [ReprocessingTechnician, UnitAdmin]
    code: 200
    input: []
    output: Scope
    side_effects: ["scope -> AWAITING_REPROCESS; awaiting_reprocess_since = now; increments Scope.version by 1"]
  - method: POST
    path: "/endoscopy/scopes/{id}/retire"
    description: "Retire a scope (not while IN_USE or REPROCESSING)"
    roles: [UnitAdmin]
    code: 200
    input: []
    output: Scope
    side_effects: ["scope -> OUT_OF_SERVICE; open QuarantineCase -> SCOPE_RETIRED; increments Scope.version by 1"]
  - method: POST
    path: "/endoscopy/scopes/{id}/release-quarantine"
    description: "Release a quarantined scope after a negative reculture; OCC-guarded; releaser must differ from reculture technician"
    roles: [InfectionControlNurse]
    code: 200
    input: [expected_scope_version]
    output: Scope
    side_effects: ["scope QUARANTINED -> AVAILABLE; QuarantineCase -> RELEASED (released_by, resolved_at); increments Scope.version by 1"]

  # --- Procedure bookings ---
  - method: POST
    path: "/endoscopy/bookings"
    description: "Book a procedure; computes procedure_minutes / scheduled_end / room_block_end; validates lead time, room overlap (half-open + turnover), room day capacity, provider and room status"
    roles: [SchedulingCoordinator]
    code: 201
    input: [patient_id, provider_id, procedure_type_id, room_id, scheduled_start, indication, anesthesia_type, "notes?"]
    output: ProcedureBooking
    side_effects: ["status = SCHEDULED; prep_status = PREP_PENDING; computed window fields (procedure_occupancy_minutes scheduled variant, room_block_window); version = 1"]
  - method: GET
    path: "/endoscopy/bookings"
    description: "List bookings with filters (paginated)"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["patient_id?", "provider_id?", "room_id?", "procedure_type_id?", "rescheduled_from_id?", "status?", "prep_status?", "date?", "limit?", "offset?"]
    output: "ProcedureBooking[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/bookings/{id}"
    description: "Get one booking"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: []
  - method: PATCH
    path: "/endoscopy/bookings/{id}"
    description: "Amend a SCHEDULED booking (notes, anesthesia_type); OCC-guarded; changing anesthesia_type recomputes the window and re-validates overlap/capacity; setting anesthesia_type to NONE cancels active assignments"
    roles: [SchedulingCoordinator]
    code: 200
    input: [expected_booking_version, "anesthesia_type?", "notes?"]
    output: ProcedureBooking
    side_effects: ["increments ProcedureBooking.version by 1", "window recomputed when anesthesia_type changes (procedure_occupancy_minutes, room_block_window)", "anesthesia_type -> NONE cascades active AnesthesiaAssignment -> CANCELLED (minutes released)"]
  - method: POST
    path: "/endoscopy/bookings/{id}/confirm-prep"
    description: "Record patient attestation that prep was taken (prep axis PREP_PENDING -> PREP_CONFIRMED)"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["prep_status -> PREP_CONFIRMED; increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/check-in"
    description: "Check in a patient (SCHEDULED -> CHECKED_IN) inside [start-60min, start+30min]; requires PREP_CONFIRMED"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["status -> CHECKED_IN; increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/start"
    description: "Start the procedure (CHECKED_IN -> IN_PROGRESS); assigns scope (explicit scope_id or scope_selection); creates ScopeUsage"
    roles: [Endoscopist]
    code: 200
    input: ["scope_id?"]
    output: ProcedureBooking
    side_effects: ["status -> IN_PROGRESS; actual_start = now; ScopeUsage created; scope -> IN_USE and use_count += 1 (scope_use_ledger); increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/record-prep-assessment"
    description: "Record intra-procedure BBPS scores; sets prep axis ADEQUATE/INADEQUATE (single-shot)"
    roles: [Endoscopist]
    code: 200
    input: [bbps_left, bbps_right, bbps_transverse]
    output: ProcedureBooking
    side_effects: ["prep_status -> PREP_ADEQUATE | PREP_INADEQUATE (bowel_prep_adequacy); bbps_* stored; increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/complete"
    description: "Complete the procedure; records quality fields; frees room and scope"
    roles: [Endoscopist]
    code: 200
    input: [cecum_intubated, withdrawal_time_seconds, adenomas_detected]
    output: ProcedureBooking
    side_effects: ["status -> COMPLETED; actual_end = now; actual_duration_minutes computed; scope -> AWAITING_REPROCESS when ACTIVE usage exists; CONFIRMED AnesthesiaAssignment -> COMPLETED (minutes released); increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/abort"
    description: "Abort an in-progress procedure for inadequate prep"
    roles: [Endoscopist]
    code: 200
    input: [reason]
    output: ProcedureBooking
    side_effects: ["status -> ABORTED_PREP_INADEQUATE; actual_end = now; scope -> AWAITING_REPROCESS when ACTIVE usage exists; active AnesthesiaAssignment -> CANCELLED (minutes released); increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/cancel"
    description: "Cancel a SCHEDULED or CHECKED_IN booking; prep axis left untouched"
    roles: [SchedulingCoordinator]
    code: 200
    input: ["reason?"]
    output: ProcedureBooking
    side_effects: ["status -> CANCELLED; active AnesthesiaAssignment -> CANCELLED (minutes released); increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/mark-no-show"
    description: "Mark no-show after the grace window (now > scheduled_start + 30min)"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["status -> NO_SHOW; active AnesthesiaAssignment -> CANCELLED (minutes released); increments ProcedureBooking.version by 1"]
  - method: POST
    path: "/endoscopy/bookings/{id}/reschedule"
    description: "Supersede this booking with a new booking at a new time (and optionally room); OCC-guarded; returns the NEW booking"
    roles: [SchedulingCoordinator]
    code: 201
    input: [expected_booking_version, new_scheduled_start, "new_room_id?"]
    output: ProcedureBooking
    side_effects: ["old booking -> RESCHEDULED and version += 1", "new booking created: rescheduled_from_id = old id, status SCHEDULED, prep_status PREP_PENDING, version = 1", "old booking's active AnesthesiaAssignment -> CANCELLED (minutes released)", "new slot fully re-validated (lead time, overlap, capacity)"]

  # --- Anesthesia assignments ---
  - method: POST
    path: "/endoscopy/anesthesia-assignments"
    description: "Assign an anesthesia provider to a booking (closed-interval overlap, touching endpoints conflict)"
    roles: [SchedulingCoordinator]
    code: 201
    input: [booking_id, anesthesia_provider_id]
    output: AnesthesiaAssignment
    side_effects: ["status = ASSIGNED; minutes = booking.procedure_minutes snapshot; AnesthesiaProvider.scheduled_minutes += minutes (anesthesia_minutes_ledger); version = 1"]
  - method: GET
    path: "/endoscopy/anesthesia-assignments"
    description: "List anesthesia assignments"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["booking_id?", "anesthesia_provider_id?", "status?", "limit?", "offset?"]
    output: "AnesthesiaAssignment[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/anesthesia-assignments/{id}"
    description: "Get one assignment"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: AnesthesiaAssignment
    side_effects: []
  - method: POST
    path: "/endoscopy/anesthesia-assignments/{id}/confirm"
    description: "Anesthesia provider confirms own assignment (ASSIGNED -> CONFIRMED)"
    roles: [AnesthesiaProvider]
    code: 200
    input: []
    output: AnesthesiaAssignment
    side_effects: ["status -> CONFIRMED; increments AnesthesiaAssignment.version by 1"]
  - method: POST
    path: "/endoscopy/anesthesia-assignments/{id}/cancel"
    description: "Cancel an active assignment; releases scheduled minutes"
    roles: [SchedulingCoordinator, AnesthesiaProvider]
    code: 200
    input: ["reason?"]
    output: AnesthesiaAssignment
    side_effects: ["status -> CANCELLED; AnesthesiaProvider.scheduled_minutes -= minutes; increments AnesthesiaAssignment.version by 1"]

  # --- Scope usages (traceability junction) ---
  - method: GET
    path: "/endoscopy/scope-usages"
    description: "List scope usages (scope-to-patient traceability)"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["booking_id?", "scope_id?", "patient_id?", "status?", "exposure_flagged?", "limit?", "offset?"]
    output: "ScopeUsage[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/scope-usages/{id}"
    description: "Get one scope usage"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: ScopeUsage
    side_effects: []
  - method: POST
    path: "/endoscopy/scope-usages/{id}/void"
    description: "Void a usage recorded in error (booking must still be IN_PROGRESS); compensates scope_use_ledger"
    roles: [Endoscopist]
    code: 200
    input: [reason]
    output: ScopeUsage
    side_effects: ["usage -> VOID (void_reason set); scope.use_count -= 1; scope IN_USE -> AVAILABLE; increments ScopeUsage.version by 1"]

  # --- Reprocessing cycles ---
  - method: POST
    path: "/endoscopy/reprocessing-cycles"
    description: "Open a reprocessing cycle on an AWAITING_REPROCESS or QUARANTINED scope; computes requires_extended_soak from the 60-minute preclean deadline"
    roles: [ReprocessingTechnician]
    code: 201
    input: [scope_id, "booking_id?"]
    output: ReprocessingCycle
    side_effects: ["scope -> REPROCESSING", "technician_id = X-User-ID", "requires_extended_soak computed (reprocessing_step_windows)", "if scope QUARANTINED: is_reculture = true and open QuarantineCase -> RECULTURING with reculture_cycle_id set", "version = 1"]
  - method: GET
    path: "/endoscopy/reprocessing-cycles"
    description: "List reprocessing cycles"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["scope_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: "ReprocessingCycle[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/reprocessing-cycles/{id}"
    description: "Get one reprocessing cycle"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: ReprocessingCycle
    side_effects: []
  - method: POST
    path: "/endoscopy/reprocessing-cycles/{id}/steps/advance"
    description: "Advance exactly one step (INITIATED -> PRECLEANED -> CLEANED -> DISINFECTED -> DRIED -> COMPLETE); enforces step minimum durations and the HLD concentration gate; COMPLETE sets scope storage_expires_at = dried_at + 72h"
    roles: [ReprocessingTechnician]
    code: 200
    input: [to_step, "hld_solution_lot?", "hld_concentration_ppm?"]
    output: ReprocessingCycle
    side_effects: ["step timestamp recorded; increments ReprocessingCycle.version by 1", "on DISINFECTED with hld_concentration_ppm < 300: rejected AND cycle -> FAILED, scope -> AWAITING_REPROCESS", "on COMPLETE: scope -> AVAILABLE (or stays QUARANTINED); storage_expires_at = dried_at + 72h (scope_storage_expiry)"]

  # --- Culture surveillance ---
  - method: POST
    path: "/endoscopy/culture-tests"
    description: "Create a surveillance culture test against a COMPLETE reprocessing cycle of the scope"
    roles: [InfectionControlNurse]
    code: 201
    input: [scope_id, reprocessing_cycle_id]
    output: ScopeCultureTest
    side_effects: ["status = PENDING; sampled_at = now; recorded_by = X-User-ID; version = 1"]
  - method: GET
    path: "/endoscopy/culture-tests"
    description: "List culture tests"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["scope_id?", "reprocessing_cycle_id?", "status?", "limit?", "offset?"]
    output: "ScopeCultureTest[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/culture-tests/{id}"
    description: "Get one culture test"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: ScopeCultureTest
    side_effects: []
  - method: POST
    path: "/endoscopy/culture-tests/{id}/result"
    description: "Record the culture result; POSITIVE quarantines the scope and opens a QuarantineCase with the exposure window cascade"
    roles: [InfectionControlNurse]
    code: 200
    input: [result, "organism?", "cfu_count?"]
    output: ScopeCultureTest
    side_effects: ["status -> RESULTED; result/organism/cfu_count/resulted_at stored", "POSITIVE: scope -> QUARANTINED (unless OUT_OF_SERVICE), QuarantineCase created OPEN (culture_exposure_window), in-window ScopeUsages exposure_flagged = true, their bookings notification_flag = true", "POSITIVE on retired scope: QuarantineCase created directly SCOPE_RETIRED", "increments ScopeCultureTest.version by 1"]

  # --- Quarantine cases ---
  - method: GET
    path: "/endoscopy/quarantine-cases"
    description: "List quarantine cases"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["scope_id?", "status?", "triggering_culture_id?", "reculture_cycle_id?", "limit?", "offset?"]
    output: "QuarantineCase[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/quarantine-cases/{id}"
    description: "Get one quarantine case"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: QuarantineCase
    side_effects: []
  - method: GET
    path: "/endoscopy/quarantine-cases/{id}/exposures"
    description: "Computed read: ScopeUsage rows inside the case exposure window (left-exclusive, right-inclusive)"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScopeUsage[]"
    side_effects: []

  # --- Pathology specimens ---
  - method: POST
    path: "/endoscopy/specimens"
    description: "Collect a specimen during an IN_PROGRESS booking (chain-of-custody start)"
    roles: [Endoscopist]
    code: 201
    input: [booking_id, specimen_type, container_count]
    output: Specimen
    side_effects: ["status = COLLECTED; collected_at = now; patient_id denormalized from booking; version = 1"]
  - method: GET
    path: "/endoscopy/specimens"
    description: "List specimens"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["booking_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "Specimen[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/specimens/{id}"
    description: "Get one specimen"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: Specimen
    side_effects: []
  - method: POST
    path: "/endoscopy/specimens/{id}/label"
    description: "Label a collected specimen within 15 minutes of collection"
    roles: [Endoscopist, PathologyStaff]
    code: 200
    input: []
    output: Specimen
    side_effects: ["status -> LABELED; labeled_at/labeled_by set; increments Specimen.version by 1"]
  - method: POST
    path: "/endoscopy/specimens/{id}/handoff"
    description: "Hand a labeled specimen to a courier (chain-of-custody transfer)"
    roles: [PathologyStaff]
    code: 200
    input: [courier_id]
    output: Specimen
    side_effects: ["status -> IN_TRANSIT; handed_off_at/handed_off_by/courier_id set; increments Specimen.version by 1"]
  - method: POST
    path: "/endoscopy/specimens/{id}/receive"
    description: "Lab receives an in-transit specimen; transport window (collected_at + 120min) enforced"
    roles: [PathologyStaff]
    code: 200
    input: []
    output: Specimen
    side_effects: ["status -> RECEIVED_BY_LAB; received_at/received_by set; increments Specimen.version by 1"]
  - method: POST
    path: "/endoscopy/specimens/{id}/reject"
    description: "Reject a LABELED or IN_TRANSIT specimen (e.g., QNS, transport exceeded)"
    roles: [PathologyStaff]
    code: 200
    input: [reason]
    output: Specimen
    side_effects: ["status -> REJECTED_BY_LAB; reject_reason set; increments Specimen.version by 1"]
  - method: POST
    path: "/endoscopy/specimens/{id}/result"
    description: "Record pathology result for a received specimen"
    roles: [PathologyStaff]
    code: 200
    input: [adenoma_confirmed]
    output: Specimen
    side_effects: ["status -> RESULTED; adenoma_confirmed/resulted_at set; increments Specimen.version by 1"]

  # --- Quality metrics ---
  - method: POST
    path: "/endoscopy/quality-reports"
    description: "Create an immutable quality-metric snapshot for a provider and period; metric_variant selects the ADR denominator (STRICT vs EXPANDED); withdrawal/CIR/prep rates are variant-invariant"
    roles: [QualityOfficer]
    code: 201
    input: [provider_id, period_start, period_end, metric_variant]
    output: QualityMetricReport
    side_effects: ["computes adenoma_detection_rate, withdrawal_time_average, cecal_intubation_and_prep_rates once; snapshot never changes afterwards"]
  - method: GET
    path: "/endoscopy/quality-reports"
    description: "List quality reports"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: ["provider_id?", "metric_variant?", "limit?", "offset?"]
    output: "QualityMetricReport[]"
    side_effects: []
  - method: GET
    path: "/endoscopy/quality-reports/{id}"
    description: "Get one quality report"
    roles: [UnitAdmin, SchedulingCoordinator, Endoscopist, AnesthesiaProvider, ReprocessingTechnician, InfectionControlNurse, PathologyStaff, QualityOfficer]
    code: 200
    input: []
    output: QualityMetricReport
    side_effects: []
  - method: GET
    path: "/endoscopy/reports/room-utilization"
    description: "Computed read: per-room and unit utilization for a UTC date; rounding pinned per-room first, then averaged (room_utilization_report)"
    roles: [QualityOfficer, UnitAdmin]
    code: 200
    input: [date]
    output: { date: string, open_minutes_per_room: integer, unit_utilization_pct: number, rooms: array }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_PROVIDER_OWNERSHIP_MISMATCH, http: 403, condition: "Endoscopist X-User-ID != booking.provider_id" }
  - { id: ERR_ANESTHESIA_OWNERSHIP_MISMATCH, http: 403, condition: "AnesthesiaProvider X-User-ID != assignment.anesthesia_provider_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Quarantine releaser X-User-ID equals the reculture cycle's technician_id" }
  # --- existence ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patient_id does not resolve" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "provider_id does not resolve" }
  - { id: ERR_PROCEDURE_TYPE_NOT_FOUND, http: 404, condition: "procedure_type_id does not resolve" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "room_id (or new_room_id) does not resolve" }
  - { id: ERR_ANESTHESIA_PROVIDER_NOT_FOUND, http: 404, condition: "anesthesia_provider_id does not resolve" }
  - { id: ERR_SCOPE_NOT_FOUND, http: 404, condition: "scope_id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id does not resolve" }
  - { id: ERR_SCOPE_USAGE_NOT_FOUND, http: 404, condition: "scope usage id does not resolve" }
  - { id: ERR_REPROCESSING_CYCLE_NOT_FOUND, http: 404, condition: "reprocessing cycle id does not resolve" }
  - { id: ERR_CULTURE_TEST_NOT_FOUND, http: 404, condition: "culture test id does not resolve" }
  - { id: ERR_QUARANTINE_CASE_NOT_FOUND, http: 404, condition: "quarantine case id does not resolve" }
  - { id: ERR_SPECIMEN_NOT_FOUND, http: 404, condition: "specimen id does not resolve" }
  - { id: ERR_QUALITY_REPORT_NOT_FOUND, http: 404, condition: "quality report id does not resolve" }
  - { id: ERR_ANESTHESIA_ASSIGNMENT_NOT_FOUND, http: 404, condition: "anesthesia assignment id does not resolve" }
  # --- input/schema ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, numeric range violated (bbps 0..3, container_count >= 1, base_duration_minutes > 0, withdrawal_time_seconds >= 0, adenomas_detected >= 0), POSITIVE culture without organism/cfu_count" }
  # --- OCC ---
  - { id: ERR_STALE_BOOKING_VERSION, http: 412, condition: "expected_booking_version != current ProcedureBooking.version" }
  - { id: ERR_STALE_SCOPE_VERSION, http: 412, condition: "expected_scope_version != current Scope.version" }
  # --- state ---
  - { id: ERR_BOOKING_NOT_SCHEDULED, http: 409, condition: "Booking axis must be SCHEDULED (confirm-prep, PATCH, reschedule, mark-no-show)" }
  - { id: ERR_BOOKING_NOT_CHECKED_IN, http: 409, condition: "Booking axis must be CHECKED_IN to start" }
  - { id: ERR_BOOKING_NOT_IN_PROGRESS, http: 409, condition: "Booking axis must be IN_PROGRESS (assessment, complete, abort, specimen collect)" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Booking axis not in {SCHEDULED, CHECKED_IN} for cancel" }
  - { id: ERR_PREP_NOT_CONFIRMED, http: 409, condition: "Check-in requires prep_status == PREP_CONFIRMED" }
  - { id: ERR_PREP_ALREADY_ASSESSED, http: 409, condition: "BBPS assessment is single-shot" }
  - { id: ERR_PREP_NOT_ASSESSED, http: 409, condition: "Complete requires prep_status IN {PREP_ADEQUATE, PREP_INADEQUATE}" }
  - { id: ERR_PREP_NOT_INADEQUATE, http: 409, condition: "Abort requires prep_status == PREP_INADEQUATE" }
  - { id: ERR_SCOPE_NOT_AVAILABLE, http: 409, condition: "Explicit scope not AVAILABLE (or culture create on OUT_OF_SERVICE scope)" }
  - { id: ERR_SCOPE_NOT_REPROCESSABLE, http: 409, condition: "Cycle create or send-to-reprocessing requires scope status AWAITING_REPROCESS or QUARANTINED (send: AVAILABLE only)" }
  - { id: ERR_SCOPE_NOT_RETIRABLE, http: 409, condition: "Retire requires scope status IN {AVAILABLE, AWAITING_REPROCESS, QUARANTINED}" }
  - { id: ERR_CYCLE_STEP_OUT_OF_ORDER, http: 409, condition: "to_step is not exactly the next step of the cycle" }
  - { id: ERR_CYCLE_NOT_ADVANCABLE, http: 409, condition: "Cycle is terminal (COMPLETE or FAILED)" }
  - { id: ERR_CULTURE_ALREADY_RESULTED, http: 409, condition: "Culture test already RESULTED" }
  - { id: ERR_NO_OPEN_QUARANTINE, http: 409, condition: "No OPEN/RECULTURING QuarantineCase exists for the scope" }
  - { id: ERR_SPECIMEN_NOT_LABELED, http: 409, condition: "Handoff requires status LABELED" }
  - { id: ERR_SPECIMEN_NOT_IN_TRANSIT, http: 409, condition: "Receive requires status IN_TRANSIT" }
  - { id: ERR_SPECIMEN_NOT_RECEIVED, http: 409, condition: "Result requires status RECEIVED_BY_LAB" }
  - { id: ERR_SPECIMEN_TERMINAL, http: 409, condition: "Reject requires status IN {LABELED, IN_TRANSIT}" }
  - { id: ERR_ASSIGNMENT_STATE_INVALID, http: 409, condition: "Confirm requires ASSIGNED; cancel requires ASSIGNED or CONFIRMED" }
  - { id: ERR_SCOPE_USAGE_NOT_VOIDABLE, http: 409, condition: "Usage already VOID or booking no longer IN_PROGRESS" }
  # --- business safety ---
  - { id: ERR_PROVIDER_SUSPENDED, http: 409, condition: "Provider credential_status == SUSPENDED at booking create or start" }
  - { id: ERR_ANESTHESIA_PROVIDER_SUSPENDED, http: 409, condition: "AnesthesiaProvider credential_status == SUSPENDED at assignment create" }
  - { id: ERR_ANESTHESIA_NOT_CONFIRMED, http: 409, condition: "anesthesia_type != NONE but no CONFIRMED assignment for the booking at start" }
  - { id: ERR_SCOPE_STORAGE_EXPIRED, http: 409, condition: "Explicit scope fails is_storage_current (now >= storage_expires_at) at start" }
  - { id: ERR_HLD_CONCENTRATION_TOO_LOW, http: 422, condition: "hld_concentration_ppm < 300 at DISINFECTED step; cycle -> FAILED, scope -> AWAITING_REPROCESS" }
  - { id: ERR_STEP_DURATION_TOO_SHORT, http: 422, condition: "Elapsed time below the step minimum (manual clean 5/20 min, HLD contact 600 s, drying 10 min)" }
  - { id: ERR_LABEL_WINDOW_EXCEEDED, http: 422, condition: "now > collected_at + 15 minutes at label" }
  - { id: ERR_TRANSPORT_WINDOW_EXCEEDED, http: 422, condition: "now > collected_at + 120 minutes at receive" }
  # --- business temporal ---
  - { id: ERR_SCHEDULED_START_IN_PAST, http: 422, condition: "scheduled_start <= now at create/reschedule" }
  - { id: ERR_PREP_LEAD_TIME_INSUFFICIENT, http: 422, condition: "scheduled_start < now + lead time (SPLIT_DOSE 24h, CLEAR_LIQUIDS 8h, NONE 0h)" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 422, condition: "now outside [scheduled_start - 60min, scheduled_start + 30min] at check-in" }
  - { id: ERR_NO_SHOW_WINDOW_NOT_REACHED, http: 422, condition: "now <= scheduled_start + 30min at mark-no-show" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "period_start > period_end at quality report creation" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc target not strictly later than current logical time" }
  # --- business constraint ---
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "Half-open interval overlap with a non-released booking in the same room (turnover buffer included; exact adjacency allowed)" }
  - { id: ERR_ROOM_DAY_CAPACITY_EXCEEDED, http: 409, condition: "Sum of committed room-block minutes for the date would exceed 480" }
  - { id: ERR_ANESTHESIA_TIME_CONFLICT, http: 409, condition: "Closed-interval overlap with an ASSIGNED/CONFIRMED assignment of the same anesthesia provider (touching endpoints conflict)" }
  - { id: ERR_ROOM_NOT_IN_SERVICE, http: 409, condition: "Room status == OUT_OF_SERVICE at booking create or start" }
  - { id: ERR_ANESTHESIA_TYPE_NONE, http: 409, condition: "Assignment creation requires booking anesthesia_type != NONE" }
  - { id: ERR_NO_COMPATIBLE_SCOPE, http: 409, condition: "Auto-selection found no eligible scope (type match, AVAILABLE, storage-current)" }
  - { id: ERR_PATIENT_MRN_EXISTS, http: 409, condition: "Duplicate patient mrn" }
  - { id: ERR_SERIAL_NUMBER_EXISTS, http: 409, condition: "Duplicate scope serial_number" }
  - { id: ERR_PROCEDURE_TYPE_CODE_EXISTS, http: 409, condition: "Duplicate procedure type code" }
  # --- business referential ---
  - { id: ERR_SCOPE_TYPE_MISMATCH, http: 422, condition: "Explicit scope.scope_type != procedure_type.required_scope_type" }
  - { id: ERR_CULTURE_SCOPE_MISMATCH, http: 400, condition: "Culture test's reprocessing_cycle_id belongs to a different scope" }
  - { id: ERR_CYCLE_NOT_COMPLETE, http: 409, condition: "Culture test references a cycle not yet COMPLETE" }
  - { id: ERR_RECULTURE_NOT_NEGATIVE, http: 409, condition: "No NEGATIVE culture exists on the quarantine case's reculture cycle" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UnitAdmin
    description: "Unit administrator; owns configuration entities, scope registry, retirement, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /endoscopy/_clock/set_current_utc"
      - "POST /endoscopy/providers, PATCH /endoscopy/providers/{id}"
      - "POST /endoscopy/procedure-types"
      - "POST /endoscopy/rooms, PATCH /endoscopy/rooms/{id}"
      - "POST /endoscopy/anesthesia-providers, PATCH /endoscopy/anesthesia-providers/{id}"
      - "POST /endoscopy/scopes"
      - "POST /endoscopy/scopes/{id}/retire"
      - "GET /endoscopy/reports/room-utilization (shared with QualityOfficer)"
    shared_operations:
      - "POST /endoscopy/patients (with SchedulingCoordinator)"
      - "POST /endoscopy/scopes/{id}/send-to-reprocessing (with ReprocessingTechnician)"
      - "all GET list/detail endpoints"
  - name: SchedulingCoordinator
    description: "Front-desk scheduler; owns patients, bookings, check-in, cancellations, rescheduling, anesthesia assignment logistics"
    identity: opaque
    exclusive_operations:
      - "POST /endoscopy/bookings, PATCH /endoscopy/bookings/{id}"
      - "POST /endoscopy/bookings/{id}/confirm-prep | check-in | cancel | mark-no-show | reschedule"
      - "POST /endoscopy/anesthesia-assignments"
    shared_operations:
      - "POST /endoscopy/patients (with UnitAdmin)"
      - "POST /endoscopy/anesthesia-assignments/{id}/cancel (with AnesthesiaProvider)"
      - "all GET list/detail endpoints"
  - name: Endoscopist
    description: "Physician performing procedures; acts only on own bookings (X-User-ID == booking.provider_id)"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /endoscopy/bookings/{id}/start | record-prep-assessment | complete | abort"
      - "POST /endoscopy/specimens"
      - "POST /endoscopy/scope-usages/{id}/void"
    shared_operations:
      - "POST /endoscopy/specimens/{id}/label (with PathologyStaff)"
      - "all GET list/detail endpoints"
  - name: AnesthesiaProvider
    description: "Anesthesia clinician; confirms own assignments (X-User-ID == assignment.anesthesia_provider_id)"
    identity: "entity_backed:AnesthesiaProvider"
    exclusive_operations:
      - "POST /endoscopy/anesthesia-assignments/{id}/confirm"
    shared_operations:
      - "POST /endoscopy/anesthesia-assignments/{id}/cancel (with SchedulingCoordinator)"
      - "all GET list/detail endpoints"
  - name: ReprocessingTechnician
    description: "Scope reprocessing technician; performs and documents reprocessing cycles (HLD evidence)"
    identity: opaque
    exclusive_operations:
      - "POST /endoscopy/reprocessing-cycles"
      - "POST /endoscopy/reprocessing-cycles/{id}/steps/advance"
    shared_operations:
      - "POST /endoscopy/scopes/{id}/send-to-reprocessing (with UnitAdmin)"
      - "all GET list/detail endpoints"
  - name: InfectionControlNurse
    description: "Infection prevention; records surveillance cultures and releases quarantined scopes; may NOT release a scope whose reculture cycle they themselves performed (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /endoscopy/culture-tests"
      - "POST /endoscopy/culture-tests/{id}/result"
      - "POST /endoscopy/scopes/{id}/release-quarantine"
    shared_operations:
      - "all GET list/detail endpoints"
  - name: PathologyStaff
    description: "Pathology laboratory staff; owns specimen custody after collection"
    identity: opaque
    exclusive_operations:
      - "POST /endoscopy/specimens/{id}/handoff | receive | reject | result"
    shared_operations:
      - "POST /endoscopy/specimens/{id}/label (with Endoscopist)"
      - "all GET list/detail endpoints"
  - name: QualityOfficer
    description: "Quality and compliance reporting; creates immutable quality-metric snapshots"
    identity: opaque
    exclusive_operations:
      - "POST /endoscopy/quality-reports"
    shared_operations:
      - "GET /endoscopy/reports/room-utilization (with UnitAdmin)"
      - "all GET list/detail endpoints"
