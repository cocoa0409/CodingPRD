  - rule_id: transitive_cascade
    instances:
      - name: finalize_supersedes_visit_then_releases_allocation_then_credits_pool
        grounds:
          - state_machines.ConditionAssessment.SUBMITTED_to_FINALIZED
          - state_machines.Artwork.MONITORED_to_TREATMENT_REQUIRED
          - state_machines.MaintenanceVisit.SCHEDULED_to_ABORTED
          - state_machines.FundingAllocation.RESERVED_to_RELEASED
          - calculations.pool_draw_available_cents
        distinguishing_aspect: |
          CASCADE A, trigger POST /public-art/condition-assessments/{id}/finalize, depth 4:
          assessment FINALIZED -> Artwork.conservation_status TREATMENT_REQUIRED (index 44.8 < 55.0)
          -> the SCHEDULED non-conservator MaintenanceVisit becomes ABORTED/SUPERSEDED_BY_TREATMENT
          -> its RESERVED FundingAllocation becomes RELEASED/VISIT_ABORTED
          -> FundingPool.available_cents climbs back from 20277500 to 20527500. No hop is triggered
          by the deaccession path, so the trigger differs from the second instance.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "BRONZE LANDMARK artwork of footprint 6 at an URBAN site, custody ON_VIEW, conservation_status MONITORED"
            - "a WASH protocol with requires_conservator false and a SCHEDULED MaintenanceVisit in window 2026-08-10..2026-08-12"
            - "an ENDOWMENT pool with available_cents 20527500 and a RESERVED MAINTENANCE allocation of 250000 linked to that visit, leaving available_cents 20277500"
            - "a SUBMITTED ConditionAssessment with three photos and subscores 3/2/2/1/2"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
