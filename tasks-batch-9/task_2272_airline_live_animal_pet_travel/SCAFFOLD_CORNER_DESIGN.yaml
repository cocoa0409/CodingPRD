      - name: flight_leg_version_increments_on_every_write
        claim_type: version_semantics
        grounds:
          - concurrency_rules.assignment-create-stale-leg
          - entities.FlightLeg.fields.version
        distinguishing_aspect: "Every mutating verb on the leg bumps version by exactly one, including the schedule verbs that do not touch bookings: create 1, forecast 2, delay 3, restore-schedule 4, while a detail read leaves it untouched."
