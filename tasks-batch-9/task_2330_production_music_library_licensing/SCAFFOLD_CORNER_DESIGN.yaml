            - "Call 6 → 200 with License.${lic1}.status \"ACTIVE\" (the clock has reached term_start exactly)"
            - "Call 7 → 422 with data.error_id == \"ERR_CLOCK_REWIND\" and the clock stays at 2026-10-01T00:00:00.000Z"
            - "Call 8 → status \"ACTIVE\" and term_end == \"2027-10-01T00:00:00.000Z\""

      - name: quote_priority_conflict_licensable_over_business_terms
        claim_type: priority_ordering
        grounds:
          - validations[priority=14].composition_licensable
          - validations[priority=28].term_within_tier_range
        distinguishing_aspect: |
          A quote whose request violates both the cross-entity licensability rule and the tier term range
          must return the cross-entity error, proving the ladder is walked in priority order rather than
          in the order the rule bodies happen to be evaluated.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / quote_cross_entity_licensable_outranks_business_term_range"
          rationale: |
            §1.8 already drives this exact pair (priority 14 against priority 28 on the same quote call)
            with both single-violation controls, so a §1.9 duplicate would add no distinct coverage.

      - name: issuance_occ_outranks_quote_expiry
        claim_type: priority_ordering
        grounds:
          - validations[priority=8].occ_composition_version
          - validations[priority=16].quote_freshness
        distinguishing_aspect: |
          When the composition has been mutated AND the quote has lapsed, issuance must answer with the
          412 concurrency error rather than the 409 staleness error.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / issuance_occ_conflict_outranks_temporal_quote_expiry"
          rationale: |
            §1.8 constructs the doubly-violated issuance call (stale expected_composition_version plus an
            expired quote) and asserts ERR_COMPOSITION_VERSION_CONFLICT, which is precisely this claim.

      - name: exclusive_holdback_window_blocks_next_license
        claim_type: temporal_validation
        grounds:
          - validations[priority=17].exclusivity_window_free
          - errors[ERR_EXCLUSIVE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          The block is inclusive of exclusive_block_until itself, so a term starting exactly on the block
          day is refused while the following day is allowed.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / exclusive_holdback_block_day_inclusive_on_composition"
          rationale: |
            §1.8 already pins the inclusive boundary day-by-day (block day refused, block day + 1 issued)
            on the same composition, which subsumes any breadth-level restatement.

      - name: blanket_coverage_adjacency_allowed
        claim_type: temporal_validation
        grounds:
          - validations[priority=20].blanket_coverage_no_overlap
          - errors[ERR_BLANKET_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Coverage intervals are half-open, so a second blanket whose coverage_start equals the first's
          coverage_end is accepted while one starting a day earlier is refused.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / blanket_coverage_half_open_adjacency_on_licensee"
          rationale: |
            §1.8 tests the touching-endpoint case and the one-day-overlap case on the same licensee, so a
            §1.9 instance would repeat the identical setup and assertions.

