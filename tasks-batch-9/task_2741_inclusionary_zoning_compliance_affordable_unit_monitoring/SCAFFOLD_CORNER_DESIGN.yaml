            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Withdraw Walk", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-WD-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "WD-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u1_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "WD-102", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u2_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u1_id}/withdraw", payload: { reason: "Structural redesign removed the stack" }, as: Developer, as_user_id: "dev-1" }
            - { call: "GET /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "SUBSTITUTION" }, as: ProgramAdministrator, captures: { sub_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /iz-compliance/affordable-units/${u1_id}/withdraw", payload: { reason: "Second attempt at the same withdrawal" }, as: Developer, as_user_id: "dev-1", captures: { err_wd: $.data.error_id } }
            - { call: "POST /iz-compliance/affordable-units/${u2_id}/reinstate", payload: {}, as: Developer, as_user_id: "dev-1", captures: { err_ri: $.data.error_id } }
            - { call: "POST /iz-compliance/in-lieu-fees/${sub_id}/payments", payload: { amount_cents: 1000000 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/affordable-units/${u1_id}/reinstate", payload: {}, as: Developer, as_user_id: "dev-1", captures: { err_paid: $.data.error_id } }
            - { call: "POST /iz-compliance/in-lieu-fees/${sub_id}/payments", payload: { amount_cents: 23467400 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/affordable-units/${u1_id}/reinstate", payload: {}, as: Developer, as_user_id: "dev-1", captures: { err_nosub: $.data.error_id } }
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: ProgramAdministrator, captures: { p_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "FULL", expected_project_version: "${p_v}" }, as: ProgramAdministrator, captures: { err_noobl: $.data.error_id } }
          assert:
            - "withdrawing ${u1_id} a second time returns 409 ERR_UNIT_OCCUPANCY_STATE_INVALID and no second SUBSTITUTION assessment is created — GET in-lieu-fees with basis SUBSTITUTION still returns total_count 1"
            - "reinstating ${u2_id} returns 409 ERR_UNIT_OCCUPANCY_STATE_INVALID because its occupancy_status is PLANNED, not WITHDRAWN — priority 12 fires before the substitution-fee rules are consulted at all"
            - "after the 1000000 payment InLieuFee.${sub_id}.state == PARTIALLY_PAID, and reinstating ${u1_id} returns 422 ERR_SUBSTITUTION_FEE_PAID with the unit still WITHDRAWN"
            - "after the 23467400 balance payment InLieuFee.${sub_id}.state == PAID with paid_amount_cents 24467400, and reinstating ${u1_id} now returns 422 ERR_NO_SUBSTITUTION_FEE — the same call changes error id because the assessment left the open set"
            - "the two reinstate failures are distinguishable only by payment history; an implementation that keys off 'has any payment' alone would return ERR_SUBSTITUTION_FEE_PAID both times"
            - "Project.${p_id} now reports onsite_unit_equivalents_bps 10000 and fee_covered_equivalents_bps 10000 against total_obligation_bps 20000"
            - "the FULL assessment returns 422 ERR_NO_REMAINING_OBLIGATION, NOT 412: ${p_v} is the live version, so the OCC guard at priority 8 passes and the fiscal rule at 42 is what refuses it"

      - name: lottery_window_guards_reject_early_late_empty_and_post_certification_calls
        claim_type: violation_to_error
        grounds:
          - validations.priority_30
          - validations.priority_32
          - validations.priority_34
          - validations.priority_55
          - validations.priority_56
          - errors[ERR_INVALID_MARKETING_WINDOW]
          - errors[ERR_APPLICATION_WINDOW_CLOSED]
          - errors[ERR_APPLICATION_WINDOW_OPEN]
          - errors[ERR_EMPTY_ELIGIBLE_POOL]
          - errors[ERR_REDRAW_AFTER_CERTIFICATION]
        distinguishing_aspect: |
          The lottery track is guarded by two clock rules that point in OPPOSITE directions
          against the same half-open window: applying requires open <= now < close, so the
          instant equal to lottery_close_at is already closed, while drawing requires
          now >= close, so the instant one moment earlier is still open. One clock value
          therefore cannot satisfy both, and each rule rejects exactly what the other needs.
          Two further rules bracket the draw itself: an event whose applicants are all outside
          the income limit yields ERR_EMPTY_ELIGIBLE_POOL rather than an empty selection, and a
          redraw is refused once ANY household selected by the round has reached CERTIFIED —
          probed with units_offered 2 and only one of the two selections certified, so a
          per-event flag rather than a per-household scan cannot pass by accident.
