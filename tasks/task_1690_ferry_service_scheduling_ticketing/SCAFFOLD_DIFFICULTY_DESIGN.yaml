# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# Ferry Service Scheduling & Ticketing
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fare_quote_peak_vs_off_peak
        grounds:
          - calculations.booking_fare_quote
          - entities.Booking.fields.quoted_fare_cents
        distinguishing_aspect: |
          Same booking inputs (STANDARD customer, 2 passengers, 18 ft vehicle)
          quoted against identical fare rates produce different quoted_fare_cents
          purely from Sailing.season: PEAK applies the 1.25 vehicle multiplier,
          OFF_PEAK does not. Entity domain: Booking fare.
        test_recipe:
          setup:
            - "Route R (crossing 35 min, turnaround 15 min), Vessel V (deck 200 ft, pax 600, MEDIUM)"
            - "FareSchedule FS for OFF_PEAK and PEAK windows, both EFFECTIVE at their sailings' departure times"
            - "Rates: std pax 1000, resident 800, commuter 600, veh_std 2000, veh_over 4000, over_per_ft 100, fuel index 350 -> surcharge 100"
            - "Two sailings: S_OFF departs 2026-09-01T10:00:00Z season OFF_PEAK; S_PEAK departs 2026-07-01T10:00:00Z season PEAK (peak window 2026-06-01..2026-08-01 via a second schedule)"
            - "Both sailings crewed to manning_ok and OPEN_FOR_BOOKING"
            - "Customer C (STANDARD)"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_off_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_off_id}/submit"
              payload: { fuel_price_index_cents: 350 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_off_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "PEAK", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v} + 1" }
              as: SchedulerAdmin
              captures: { fs_peak_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_peak_id}/submit"
              payload: { fuel_price_index_cents: 350 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_peak_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap B", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck C", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck3_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck D", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck4_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng B", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng2_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_off_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-07-01T10:00:00Z", season: "PEAK" }
              as: SchedulerAdmin
              captures: { s_peak_id: $.data.id }
            - call: "POST /ferry/sailings/${s_off_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_off_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_off_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_off_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_peak_id}/crew-assignments"
              payload: { crew_member_id: "${cap2_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_peak_id}/crew-assignments"
              payload: { crew_member_id: "${deck3_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_peak_id}/crew-assignments"
              payload: { crew_member_id: "${deck4_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_peak_id}/crew-assignments"
              payload: { crew_member_id: "${eng2_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_peak_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_peak_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 2, has_vehicle: true, vehicle_length_feet: 18 }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_peak_fare: $.data.quoted_fare_cents }
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_off_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
          trigger:
            - call: "POST /ferry/sailings/${s_off_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 2, has_vehicle: true, vehicle_length_feet: 18 }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_off_fare: $.data.quoted_fare_cents }
          assert:
            - "Booking on ${s_off_id}.quoted_fare_cents == 4200  # 2*1000 + 2000 + 100*2"
            - "Booking on ${s_peak_id}.quoted_fare_cents == 4700  # 2*1000 + round_half_up(2000*1.25)=2500 + 100*2"
            - "${b_peak_fare} != ${b_off_fare}"

      - name: deck_allocation_reserved_first_vs_dynamic_ratio
        grounds:
          - calculations.vehicle_deck_allocation
          - entities.Sailing.fields.reserved_deck_allotment_feet
        distinguishing_aspect: |
          Same vessel deck (200 ft) and same season (OFF_PEAK): the pinned
          reserved_first variant freezes reserved_deck_allotment_feet at 120 at
          open-booking, while the dynamic_ratio variant via deck-projection with
          ratio 0.50 returns 100 for identical inputs. Entity domain: Sailing
          deck split (different domain from Booking fare in instance 1).
        test_recipe:
          setup:
            - "Route R, Vessel V (deck 200 ft), OFF_PEAK FareSchedule EFFECTIVE covering 2026-09-01T10:00:00Z"
            - "Sailing S crewed to manning_ok, OPEN_FOR_BOOKING"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
              captures: { s_reserved: $.data.reserved_deck_allotment_feet }
          trigger:
            - call: "GET /ferry/sailings/${s_id}/deck-projection"
              payload: { ratio: 0.50 }
              as: SchedulerAdmin
              captures: { proj_reserved: $.data.reserved_deck_allotment_feet, proj_standby: $.data.standby_pool_feet }
          assert:
            - "Sailing.${s_id}.reserved_deck_allotment_feet == 120  # pinned: floor(200*0.60)=120, min(120, 160)=120, max(20,120)=120"
            - "deck-projection ratio=0.50 -> reserved_deck_allotment_feet == 100  # floor(200*0.50)=100"
            - "deck-projection ratio=0.50 -> standby_pool_feet == 100"
            - "${s_reserved} != ${proj_reserved}"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fare_quote_peak_rounding_order_pinned
        grounds:
          - calculations.booking_fare_quote
        distinguishing_aspect: |
          Mode (b) nested rounding: with vehicle_oversize_base_cents=4005 and a
          24 ft vehicle on a PEAK sailing, the pinned order rounds the whole
          vehicle component after multiplying (round_half_up((4005+3*100)*1.25)
          = round_half_up(4305*1.25) = round_half_up(5381.25) = 5381); rounding
          the per-foot surcharge first would yield 5382+... and is forbidden.
        test_recipe:
          setup:
            - "Route R, Vessel V (deck 200 ft, pax 600, MEDIUM), crewed sailing S_PEAK OPEN_FOR_BOOKING, departure 2026-07-01T10:00:00Z season PEAK"
            - "PEAK FareSchedule EFFECTIVE: std pax 1000, resident 800, commuter 600, veh_std 2000, veh_over 4005, over_per_ft 100, fuel index 200 -> surcharge 0"
            - "Customer C (STANDARD)"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "PEAK", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4005, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-07-01T10:00:00Z", season: "PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-07-01T08:00:00Z", shift_end: "2026-07-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /ferry/sailings/${s_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 1, has_vehicle: true, vehicle_length_feet: 24 }
              as: Customer
              as_user_id: ${cust_id}
          assert:
            - "Booking.quoted_fare_cents == 6381  # pax 1000 + vehicle round_half_up(4305*1.25)=round_half_up(5381.25)=5381 + surcharge 0"

      - name: deck_allocation_floor_clamps
        grounds:
          - calculations.vehicle_deck_allocation
        distinguishing_aspect: |
          Mode (a) nested min/max with >=3 inputs: for deck D=50 OFF_PEAK,
          raw_reserved=floor(50*0.60)=30, D-F=10, min(30,10)=10, then
          max(20,10)=20 — the RESERVED_FLOOR_FEET clamp overrides the standby
          floor, yielding reserved=20/standby=30 (a different clamp branch than
          the D=200 happy path). Different mode from the rounding instance.
        test_recipe:
          setup:
            - "Route R; small Vessel V (deck 50 ft, pax 100, crew_class SMALL: 1 CAPTAIN + 1 DECK)"
            - "OFF_PEAK FareSchedule EFFECTIVE; sailing S crewed and opened"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "PT-TR", origin_terminal: "Port Townsend", destination_terminal: "Coupeville", crossing_minutes: 30, turnaround_minutes: 10 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Chetzemoka", vehicle_deck_linear_feet: 50, passenger_capacity: 100, crew_class: "SMALL" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
              captures: { s_reserved: $.data.reserved_deck_allotment_feet }
          trigger:
            - call: "GET /ferry/sailings/${s_id}"
              payload: {}
              as: SchedulerAdmin
          assert:
            - "Sailing.${s_id}.reserved_deck_allotment_feet == 20  # max(20, min(30, 50-40)) = max(20,10) = 20"
            - "standby pool implied == 30  # 50 - 20"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: fare_schedule_revision_loop
        grounds:
          - state_machines.FareSchedule.SUBMITTED_to_DRAFT
          - state_machines.FareSchedule.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          FareSchedule carries a revision cycle: DRAFT -> SUBMITTED ->
          return-for-revision -> DRAFT -> SUBMITTED -> APPROVED. The loop is
          legal (non-linear), while a REJECTED schedule cannot re-enter.
        test_recipe:
          setup:
            - "Route R created"
            - "FareSchedule FS in DRAFT"
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 350 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/return-for-revision"
              payload: {}
              as: SchedulerAdmin
              captures: { fs_status_loop: $.data.status }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 550 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
              captures: { fs_status_final: $.data.status, fs_surcharge: $.data.fuel_surcharge_cents }
          assert:
            - "after return-for-revision: FareSchedule.status == DRAFT"
            - "after resubmit+approve: FareSchedule.status == APPROVED"
            - "resubmit re-pinned fuel_surcharge_cents == 250  # index 550 >= 500"

      - name: booking_modify_loop
        grounds:
          - state_machines.Booking.CONFIRMED_to_MODIFIED
          - state_machines.Booking.MODIFIED_to_CONFIRMED
        distinguishing_aspect: |
          Booking carries a modify cycle: CONFIRMED -> MODIFIED -> CONFIRMED is
          legal repeatedly while the sailing is OPEN_FOR_BOOKING; the cycle
          re-quotes the fare. Different entity from FareSchedule (instance 1).
        test_recipe:
          setup:
            - "Full base setup: route, vessel (200 ft), OFF_PEAK schedule EFFECTIVE, crewed sailing OPEN_FOR_BOOKING, CUSTOMER STANDARD"
            - "Booking B CONFIRMED with 1 passenger, 18 ft vehicle"
