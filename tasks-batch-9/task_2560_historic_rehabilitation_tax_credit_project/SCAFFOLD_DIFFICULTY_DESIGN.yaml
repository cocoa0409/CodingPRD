            - "Project.${proj_id}.credit_recaptured_cents == 2000001"
            - "Project.${proj_id}.recapture_balance_cents == 0"
            - "RecaptureEvent.${re1_id}.status == SETTLED"
            - "Project.${proj_id}.compliance_status == IN_SERVICE_MONITORING"

  - rule_id: non_linear_state_machine
    instances:
      - name: part_application_revision_cycle_returns_to_shpo_review
        grounds:
          - state_machines.PartApplication.REVISION_REQUIRED_to_SHPO_REVIEW
          - state_machines.PartApplication.NPS_REVIEW_to_REVISION_REQUIRED
          - entities.PartApplication.fields.review_round
          - entities.PartApplication.fields.shpo_recommendation
          - entities.PartApplication.fields.determination
        distinguishing_aspect: |
          Cycle on the PartApplication entity: SHPO_REVIEW -> NPS_REVIEW ->
          REVISION_REQUIRED -> SHPO_REVIEW returns the row to a state it already
          occupied, with review_round advanced to 2 and both prior decisions reset to
          NONE — a linear pipeline cannot re-enter SHPO_REVIEW at all.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; Part 1 approved so the property is CERTIFIED_HISTORIC."
            - "Part 2 application submitted, recommended by SHPO, then DENIED by NPS so it sits in REVISION_REQUIRED with review_round == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
