              payload: { reporting_entity_id: "${ent_f}", plant_code: "EST-901", species: "CATTLE", annual_head_history: { "2021": 200000, "2022": 200000, "2023": 200000, "2024": 200000, "2025": 200000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500, status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_e}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_e: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_f}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_f: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_e}/determine"
              payload: {}
              as: ProgramAdmin
              captures: { e_hist: $.data.error_id }
            - call: "POST /registrations/${reg_f}/determine"
              payload: {}
              as: ProgramAdmin
              captures: { e_noplant: $.data.error_id }
          assert:
            - "${e_hist} == ERR_INCOMPLETE_SLAUGHTER_HISTORY with HTTP 422"
            - "${e_noplant} == ERR_NO_ELIGIBLE_PLANTS with HTTP 409 (the CLOSED plant's complete history is irrelevant)"
            - "Both registrations remain in DRAFT with measured_head == null, threshold_head == null and determination_outcome == null"

      - name: correction_limit_then_closed_deadline_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_41_ERR_RESUBMISSION_LIMIT_REACHED
          - validations.priority_24_ERR_CORRECTION_WINDOW_CLOSED
        distinguishing_aspect: |
          The two ceilings on the correction cycle and their relative order. After
          two completed correction rounds (resubmission_count 2 == the limit) a
          third open-correction inside the deadline yields
          ERR_RESUBMISSION_LIMIT_REACHED; once the logical clock passes
          correction_deadline_utc the identical call violates BOTH rules and
          returns ERR_CORRECTION_WINDOW_CLOSED, because the temporal rule sits at
          priority 24 and the count rule at 41.
        test_recipe:
          setup:
            - "Alpha Packing (ACTIVE 2026 registration) has one ACCEPTED filing of 100 head at 280.00 / 8.00 cwt in a window whose correction_deadline_utc is 2026-08-18T15:00:00Z; two full open-correction / resubmit / accept rounds have already been completed."
          setup_api_calls:
            - call: "POST /reporting-entities"
