# =============================================================================
# Task 1111: Showing Appointment & Access Coordination (ShowingTime-style)
# Scaffold seed tables — §1.0–§1.7
# =============================================================================

scenario: |
  generate task hard than expert level! 1111. Showing Appointment & Access Coordination (ShowingTime style service): showing request intake & occupant approval workflow, overlapping request conflict & buffer rules, agent identity verification & confirmation, feedback request automation after showing, vacant vs occupied access instructions, lockbox/code issuance & expiration, no-show & cancellation tracking, showing activity report to seller

domain_name: showing-access-coordination
api_prefix: /showing-desk

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: approval_chain
  consistency_model: immediate
  difficulty_target: beyond_expert
  entity_count: 10
  state_machine_count: 7
  calculation_count: 7
  endpoint_count: 42
  error_code_count: 40
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Seller (owner/occupant) full name" }
      - { name: contact_email, type: string, source: input, description: "Seller contact email" }
      - { name: approval_timeout_minutes, type: integer, source: input, default: 240, description: "Minutes a showing request may await occupant approval before it can expire", constraints: "1..10080" }
      - { name: auto_approve, type: boolean, source: input, default: false, description: "When true, requests on VACANT listings of this seller skip occupant approval (auto-approve); OCCUPIED listings always require explicit approval" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Agent full name" }
      - { name: license_number, type: string, source: input, description: "Real-estate license number", constraints: "unique across all agents" }
      - { name: brokerage_name, type: string, source: input, description: "Brokerage name" }
      - { name: verification_status, type: enum, source: computed, description: "UNVERIFIED | VERIFIED; VERIFIED iff the agent has at least one VerificationCase in APPROVED" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | RESTRICTED | SUSPENDED; derived by calc_agent_standing from active strike points" }
      - { name: active_strike_points, type: integer, source: computed, description: "Sum of weights of this agent's StrikeRecords in ACTIVE status (NO_SHOW=25, LATE_CANCEL=10)" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; owning seller/occupant" }
      - { name: address, type: string, source: input, description: "Property street address" }
      - { name: occupancy_type, type: enum, source: input, description: "VACANT | OCCUPIED", constraints: "immutable after creation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | WITHDRAWN (see state machine)" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Buffer applied around every showing window for overlap checks and OCCUPIED credential expiry", constraints: "0..240" }
      - { name: max_showings_per_day, type: integer, source: input, default: 5, description: "Maximum number of requests in {PENDING_APPROVAL, APPROVED, CONFIRMED} sharing one UTC calendar day of start_at", constraints: "1..20" }
      - { name: min_notice_minutes, type: integer, source: input, default: 120, description: "Minimum lead time between request creation and start_at", constraints: "0..4320" }
      - { name: confirmed_showing_count, type: integer, source: computed, description: "Number of this listing's ShowingRequests currently in CONFIRMED (invariant INV-1)" }
      - { name: avg_feedback_score, type: number, source: computed, description: "calc_feedback_score_rollup over SUBMITTED FeedbackRequests of this listing; 0.0 when none" }

  - name: VerificationCase
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent being verified" }
      - { name: license_document_ref, type: string, source: input, description: "Document reference for the license proof" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED (REJECTED -> SUBMITTED resubmit cycle allowed)" }
      - { name: review_notes, type: string, source: system, description: "Reviewer notes recorded at review" }
      - { name: reviewed_at, type: datetime, source: system, description: "Logical-clock time of last review decision; null until reviewed" }
      - { name: resubmission_count, type: integer, source: system, description: "Number of REJECTED -> SUBMITTED resubmits; starts 0" }

  - name: BlackoutWindow
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: start_at, type: datetime, source: input, description: "Blackout start (inclusive; closed interval)" }
      - { name: end_at, type: datetime, source: input, description: "Blackout end (inclusive; closed interval)" }
      - { name: reason, type: string, source: input, description: "Optional reason text" }

  - name: ShowingRequest
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: buyer_agent_id, type: string, source: system, description: "FK -> Agent.id; taken from X-User-ID of the BuyerAgent caller at creation" }
      - { name: start_at, type: datetime, source: input, description: "Showing window start (half-open)" }
      - { name: end_at, type: datetime, source: input, description: "Showing window end (exclusive); must be > start_at and duration <= 120 minutes" }
      - { name: buyer_name, type: string, source: input, description: "Optional buyer display name" }
      - { name: note, type: string, source: input, description: "Optional note to occupant" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | CONFIRMED | DECLINED | COMPLETED | NO_SHOW | CANCELLED | EXPIRED" }
      - { name: approval_deadline, type: datetime, source: computed, description: "calc_approval_deadline at creation; recomputed on reschedule" }
      - { name: confirm_by_deadline, type: datetime, source: computed, description: "start_at - 60 minutes; recomputed on reschedule" }
      - { name: decline_reason, type: string, source: system, description: "Reason recorded at decline; null otherwise" }
      - { name: cancel_actor, type: enum, source: system, description: "BUYER_AGENT | SYSTEM; who cancelled; null unless CANCELLED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock time of cancellation; null unless CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time of completion; null unless COMPLETED" }
      - { name: reschedule_count, type: integer, source: system, description: "Number of DECLINED -> PENDING_APPROVAL/APPROVED reschedules; starts 0" }

  - name: AccessCredential
    parent: null
    common_fields: true
    fields:
      - { name: showing_request_id, type: string, source: system, description: "FK -> ShowingRequest.id; set at issuance" }
      - { name: credential_type, type: enum, source: input, description: "LOCKBOX_CODE | DOOR_CODE | SMART_LOCK" }
      - { name: access_code, type: string, source: system, description: "Server-generated 6-digit numeric code string" }
      - { name: instructions_text, type: string, source: computed, description: "VACANT: 'Vacant property: self-access with lockbox/code anytime inside the access window.' OCCUPIED: 'Occupied property: occupant-approved access; arrive no earlier than 15 minutes before start.'" }
      - { name: active_from, type: datetime, source: computed, description: "calc_access_window; redeemable only when now >= active_from" }
      - { name: expires_at, type: datetime, source: computed, description: "calc_access_window; redeemable only when now < expires_at (exclusive boundary)" }
      - { name: status, type: enum, source: system, description: "ISSUED | USED | EXPIRED | REVOKED" }
      - { name: redeemed_at, type: datetime, source: system, description: "Logical-clock time of redemption; null unless USED" }

  - name: FeedbackRequest
    parent: null
    common_fields: true
    fields:
      - { name: showing_request_id, type: string, source: system, description: "FK -> ShowingRequest.id; created automatically (status SCHEDULED) when a showing enters CONFIRMED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SENT | SUBMITTED | EXPIRED | CANCELLED" }
      - { name: sent_at, type: datetime, source: system, description: "Set when sweep flips SCHEDULED -> SENT upon showing completion" }
      - { name: due_at, type: datetime, source: system, description: "sent_at + 72 hours; SENT -> EXPIRED when now >= due_at" }
      - { name: q1, type: integer, source: input, description: "Overall impression rating 1..5", constraints: "1..5" }
      - { name: q2, type: integer, source: input, description: "Condition rating 1..5", constraints: "1..5" }
      - { name: q3, type: integer, source: input, description: "Price-fit rating 1..5", constraints: "1..5" }
      - { name: q4, type: integer, source: input, description: "Location rating 1..5", constraints: "1..5" }
      - { name: q5, type: integer, source: input, description: "Likelihood-to-offer rating 1..5", constraints: "1..5" }
      - { name: comment, type: string, source: input, description: "Optional free-text comment" }
      - { name: overall_score, type: number, source: computed, description: "calc_feedback_score_rollup per-feedback score; null until SUBMITTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock time of submission; null unless SUBMITTED" }

  - name: StrikeRecord
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; penalized buyer agent" }
      - { name: showing_request_id, type: string, source: system, description: "FK -> ShowingRequest.id; originating request" }
      - { name: strike_type, type: enum, source: system, description: "NO_SHOW | LATE_CANCEL" }
      - { name: weight, type: integer, source: computed, description: "NO_SHOW=25, LATE_CANCEL=10" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FORGIVEN | EXPIRED" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + 90 days; sweep flips ACTIVE -> EXPIRED when now >= expires_at" }

  - name: ActivityEvent
    parent: null
    common_fields: false
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id" }
      - { name: showing_request_id, type: string, source: system, description: "FK -> ShowingRequest.id; null for listing-level events" }
      - { name: event_type, type: enum, source: system, description: "REQUEST_CREATED | APPROVED | DECLINED | RESCHEDULED | CONFIRMED | CANCELLED | EXPIRED | COMPLETED | NO_SHOW | CREDENTIAL_ISSUED | CREDENTIAL_REDEEMED | CREDENTIAL_REVOKED | CREDENTIAL_EXPIRED | FEEDBACK_SENT | FEEDBACK_SUBMITTED | STRIKE_ISSUED | LISTING_PAUSED | LISTING_RESUMED | LISTING_WITHDRAWN" }
      - { name: actor_role, type: enum, source: system, description: "BuyerAgent | Seller | ListingAgent | PlatformAdmin | SYSTEM" }
      - { name: detail, type: string, source: system, description: "Human-readable detail line" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /showing-desk/listings/{id}/pause"
        actor: ListingAgent
        preconditions: ["listing.status == ACTIVE", "caller agent id == listing.listing_agent_id"]
        side_effects: ["ActivityEvent LISTING_PAUSED appended", "listing.version + 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /showing-desk/listings/{id}/resume"
        actor: ListingAgent
        preconditions: ["listing.status == PAUSED", "caller agent id == listing.listing_agent_id"]
        side_effects: ["ActivityEvent LISTING_RESUMED appended", "listing.version + 1"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /showing-desk/listings/{id}/withdraw"
        actor: ListingAgent
        preconditions: ["listing.status in {ACTIVE, PAUSED}", "caller agent id == listing.listing_agent_id"]
        side_effects:
          - "CASCADE A hop 1: every ShowingRequest of this listing in {PENDING_APPROVAL, APPROVED, CONFIRMED} -> CANCELLED with cancel_actor=SYSTEM, cancelled_at=now"
          - "CASCADE A hop 2 (caused by each hop-1 cancellation from CONFIRMED): that request's AccessCredential in ISSUED -> REVOKED; listing.confirmed_showing_count decremented per CONFIRMED cancellation"
          - "CASCADE A hop 3 (caused by each hop-2 revocation / hop-1 cancellation): the request's FeedbackRequest in SCHEDULED -> CANCELLED; ActivityEvents CREDENTIAL_REVOKED and CANCELLED appended per request"
          - "ActivityEvent LISTING_WITHDRAWN appended"
          - "listing.version + 1"
      - from: PAUSED
        to: WITHDRAWN
        trigger: "POST /showing-desk/listings/{id}/withdraw"
        actor: ListingAgent
        preconditions: ["listing.status in {ACTIVE, PAUSED}"]
        side_effects: ["same CASCADE A as ACTIVE->WITHDRAWN"]

  - entity: ShowingRequest
    initial_state: "PENDING_APPROVAL (or APPROVED when listing.occupancy_type == VACANT and seller.auto_approve == true at creation)"
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /showing-desk/showing-requests/{id}/approve"
        actor: Seller
        preconditions: ["request.status == PENDING_APPROVAL", "caller seller id == listing.seller_id", "now < request.approval_deadline (else ERR_APPROVAL_DEADLINE_PASSED)"]
        side_effects: ["ActivityEvent APPROVED appended", "request.version + 1"]
      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /showing-desk/showing-requests/{id}/decline"
        actor: Seller
        preconditions: ["request.status == PENDING_APPROVAL", "caller seller id == listing.seller_id"]
        side_effects: ["decline_reason set from payload", "ActivityEvent DECLINED appended", "request.version + 1"]
      - from: DECLINED
        to: PENDING_APPROVAL
        trigger: "POST /showing-desk/showing-requests/{id}/reschedule"
        actor: BuyerAgent
        preconditions: ["request.status == DECLINED", "caller agent id == request.buyer_agent_id", "listing.status == ACTIVE", "new window passes lead-time/overlap/blackout/daily-cap revalidation", "when listing is VACANT and seller.auto_approve, target state is APPROVED instead"]
        side_effects: ["start_at/end_at replaced", "approval_deadline and confirm_by_deadline recomputed", "reschedule_count + 1", "ActivityEvent RESCHEDULED appended", "request.version + 1"]
      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /showing-desk/showing-requests/{id}/confirm"
        actor: BuyerAgent
        preconditions: ["request.status == APPROVED", "caller agent id == request.buyer_agent_id", "agent.verification_status == VERIFIED", "agent.standing != SUSPENDED", "now < request.confirm_by_deadline (else ERR_CONFIRM_DEADLINE_PASSED)"]
        side_effects:
          - "listing.confirmed_showing_count + 1 (INV-1 forward leg)"
          - "FeedbackRequest created for this request in SCHEDULED (feedback automation)"
          - "ActivityEvent CONFIRMED appended"
          - "request.version + 1"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /showing-desk/showing-requests/{id}/cancel"
        actor: BuyerAgent
        preconditions: ["request.status in {PENDING_APPROVAL, APPROVED, CONFIRMED}", "caller agent id == request.buyer_agent_id"]
        side_effects: ["cancel_actor=BUYER_AGENT", "cancelled_at=now", "ActivityEvent CANCELLED appended", "request.version + 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /showing-desk/showing-requests/{id}/cancel"
        actor: BuyerAgent
        preconditions: ["same as PENDING_APPROVAL -> CANCELLED"]
        side_effects: ["same as PENDING_APPROVAL -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /showing-desk/showing-requests/{id}/cancel"
        actor: BuyerAgent
        preconditions: ["request.status == CONFIRMED", "caller agent id == request.buyer_agent_id"]
        side_effects:
          - "listing.confirmed_showing_count - 1 (INV-1 compensating leg)"
          - "this request's AccessCredential in ISSUED -> REVOKED + ActivityEvent CREDENTIAL_REVOKED"
          - "this request's FeedbackRequest in SCHEDULED -> CANCELLED"
          - "if start_at - now < 24 hours: StrikeRecord LATE_CANCEL (weight 10) created for buyer agent -> calc_agent_standing recompute (may cascade standing change)"
          - "cancel_actor=BUYER_AGENT"
          - "cancelled_at=now"
          - "ActivityEvent CANCELLED appended"
          - "request.version + 1"
      - from: PENDING_APPROVAL
        to: EXPIRED
        trigger: "system (POST /showing-desk/_ops/run_expiration_sweep when now >= approval_deadline)"
        actor: system
        preconditions: ["request.status == PENDING_APPROVAL", "now >= request.approval_deadline"]
        side_effects: ["ActivityEvent EXPIRED appended", "request.version + 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (sweep when now >= confirm_by_deadline)"
        actor: system
        preconditions: ["request.status == APPROVED", "now >= request.confirm_by_deadline"]
        side_effects: ["ActivityEvent EXPIRED appended", "request.version + 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (sweep when now > end_at and this request's AccessCredential status == USED)"
        actor: system
        preconditions: ["request.status == CONFIRMED", "now > request.end_at", "a credential for this request is USED"]
        side_effects: ["completed_at=now", "listing.confirmed_showing_count - 1", "this request's FeedbackRequest in SCHEDULED -> SENT (sent_at=now, due_at=now+72h) + ActivityEvent FEEDBACK_SENT", "ActivityEvent COMPLETED appended", "request.version + 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /showing-desk/showing-requests/{id}/declare-no-show"
        actor: ListingAgent
        preconditions: ["request.status == CONFIRMED", "caller agent id == listing.listing_agent_id", "now > request.end_at (else ERR_NO_SHOW_TOO_EARLY)", "no credential of this request is USED (else ERR_NO_SHOW_NOT_DECLARABLE)"]
        side_effects:
          - "CASCADE B hop 1: StrikeRecord NO_SHOW (weight 25) created for buyer agent + ActivityEvent STRIKE_ISSUED"
          - "CASCADE B hop 2 (caused by hop-1 strike): calc_agent_standing recompute on that agent; if points cross >= 30, standing -> SUSPENDED"
          - "CASCADE B hop 3 (caused by hop-2 transition INTO SUSPENDED): every other ShowingRequest with buyer_agent_id == that agent, status in {PENDING_APPROVAL, APPROVED, CONFIRMED} and start_at > now -> CANCELLED with cancel_actor=SYSTEM"
          - "CASCADE B hop 4 (caused by hop-3 CONFIRMED cancellations): those requests' AccessCredentials in ISSUED -> REVOKED, FeedbackRequests in SCHEDULED -> CANCELLED, confirmed_showing_count of their listings decremented"
          - "listing.confirmed_showing_count - 1 (this request)"
          - "ActivityEvent NO_SHOW appended"
          - "request.version + 1"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "system cascade (listing withdrawn or agent suspended)"
        actor: system
        preconditions: ["originating cascade condition"]
        side_effects: ["cancel_actor=SYSTEM", "cancelled_at=now", "ActivityEvent CANCELLED appended"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system cascade (listing withdrawn or agent suspended)"
        actor: system
        preconditions: ["originating cascade condition"]
        side_effects: ["cancel_actor=SYSTEM", "cancelled_at=now", "ActivityEvent CANCELLED appended"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system cascade (listing withdrawn or agent suspended)"
        actor: system
        preconditions: ["originating cascade condition"]
        side_effects: ["cancel_actor=SYSTEM", "credential ISSUED -> REVOKED", "FeedbackRequest SCHEDULED -> CANCELLED", "listing.confirmed_showing_count - 1", "ActivityEvent CANCELLED appended"]

  - entity: AccessCredential
    initial_state: ISSUED
    terminal_states: [USED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: USED
        trigger: "POST /showing-desk/access-credentials/{credential_id}/redeem"
        actor: BuyerAgent
        preconditions: ["credential.status == ISSUED (else ERR_CREDENTIAL_NOT_REDEEMABLE)", "caller agent id == showing_request.buyer_agent_id", "showing_request.status == CONFIRMED", "now >= active_from (else ERR_CREDENTIAL_NOT_YET_ACTIVE)", "now < expires_at (else ERR_CREDENTIAL_EXPIRED)"]
        side_effects: ["redeemed_at=now", "ActivityEvent CREDENTIAL_REDEEMED appended", "credential.version + 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (sweep when now >= expires_at)"
        actor: system
        preconditions: ["credential.status == ISSUED", "now >= credential.expires_at"]
        side_effects: ["ActivityEvent CREDENTIAL_EXPIRED appended", "credential.version + 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /showing-desk/access-credentials/{credential_id}/revoke OR system cascade"
        actor: ListingAgent
        preconditions: ["credential.status == ISSUED", "manual: caller agent id == listing.listing_agent_id"]
        side_effects: ["ActivityEvent CREDENTIAL_REVOKED appended", "credential.version + 1"]

  - entity: FeedbackRequest
    initial_state: SCHEDULED
    terminal_states: [SUBMITTED, EXPIRED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "system (sweep step 3, when parent showing CONFIRMED -> COMPLETED)"
        actor: system
        preconditions: ["showing completed this sweep"]
        side_effects: ["sent_at=now", "due_at=now+72h", "ActivityEvent FEEDBACK_SENT appended", "feedback.version + 1"]
      - from: SENT
        to: SUBMITTED
        trigger: "POST /showing-desk/feedback-requests/{feedback_id}/submit"
        actor: BuyerAgent
        preconditions: ["feedback.status == SENT (SCHEDULED/EXPIRED/CANCELLED -> ERR_FEEDBACK_NOT_AVAILABLE; SUBMITTED -> ERR_FEEDBACK_ALREADY_SUBMITTED)", "caller agent id == showing_request.buyer_agent_id", "q1..q5 each in 1..5 (else ERR_RATING_OUT_OF_RANGE)"]
        side_effects: ["overall_score computed via calc_feedback_score_rollup (per-feedback leg)", "listing.avg_feedback_score recomputed (rollup leg)", "submitted_at=now", "ActivityEvent FEEDBACK_SUBMITTED appended", "feedback.version + 1"]
      - from: SENT
        to: EXPIRED
        trigger: "system (sweep when now >= due_at)"
        actor: system
        preconditions: ["feedback.status == SENT", "now >= due_at"]
        side_effects: ["feedback.version + 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade (parent showing cancelled before completion)"
        actor: system
        preconditions: ["parent showing transitioned to CANCELLED"]
        side_effects: ["feedback.version + 1"]

  - entity: VerificationCase
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /showing-desk/verification-cases/{case_id}/review with decision=APPROVE"
        actor: PlatformAdmin
        preconditions: ["case.status == SUBMITTED (else ERR_CASE_NOT_SUBMITTED)"]
        side_effects: ["reviewed_at=now", "review_notes set", "agent.verification_status recomputed (becomes VERIFIED)", "case.version + 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /showing-desk/verification-cases/{case_id}/review with decision=REJECT"
        actor: PlatformAdmin
        preconditions: ["case.status == SUBMITTED"]
        side_effects: ["reviewed_at=now", "review_notes set", "case.version + 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /showing-desk/verification-cases/{case_id}/resubmit"
        actor: ListingAgent
        preconditions: ["case.status == REJECTED (else ERR_CASE_NOT_REJECTED)", "caller agent id == case.agent_id"]
        side_effects: ["license_document_ref replaced", "resubmission_count + 1", "case.version + 1"]

  - entity: Agent_standing
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: RESTRICTED
        trigger: "calc_agent_standing recompute (strike created/forgiven/expired)"
        actor: system
        preconditions: ["active_strike_points >= 15 and < 30"]
        side_effects: ["agent.version + 1"]
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "calc_agent_standing recompute"
        actor: system
        preconditions: ["active_strike_points >= 30"]
        side_effects: ["CASCADE B hop 3 fires on transition INTO SUSPENDED (cancel agent's future requests)", "agent.version + 1"]
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "calc_agent_standing recompute"
        actor: system
        preconditions: ["active_strike_points jumps from < 15 to >= 30"]
        side_effects: ["CASCADE B hop 3 fires", "agent.version + 1"]
      - from: RESTRICTED
        to: GOOD_STANDING
        trigger: "calc_agent_standing recompute"
        actor: system
        preconditions: ["active_strike_points < 15"]
        side_effects: ["agent.version + 1"]
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "calc_agent_standing recompute"
        actor: system
        preconditions: ["15 <= active_strike_points < 30"]
        side_effects: ["agent.version + 1"]
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "calc_agent_standing recompute"
        actor: system
        preconditions: ["active_strike_points < 15"]
        side_effects: ["agent.version + 1"]

  - entity: StrikeRecord
    initial_state: ACTIVE
    terminal_states: [FORGIVEN, EXPIRED]
    transitions:
      - from: ACTIVE
        to: FORGIVEN
        trigger: "POST /showing-desk/strikes/{strike_id}/forgive"
        actor: PlatformAdmin
        preconditions: ["strike.status == ACTIVE (else ERR_STRIKE_NOT_ACTIVE)"]
        side_effects: ["calc_agent_standing recompute on the agent (INV-2 compensating leg)", "strike.version + 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (sweep when now >= expires_at)"
        actor: system
        preconditions: ["strike.status == ACTIVE", "now >= strike.expires_at"]
        side_effects: ["calc_agent_standing recompute on the agent", "strike.version + 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: listing-policy-update-occ
    parent_entity: Listing
    write_endpoint: "PATCH /showing-desk/listings/{id}/policy"
    occ_field: "expected_listing_version"
    description: |
      Updating a listing's scheduling policy (buffer_minutes, max_showings_per_day,
      min_notice_minutes) against a version of the Listing that has advanced since
      the caller last observed it is rejected; the caller's view of the policy is
      stale and must be re-read before reapplying.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
  - rule_id: seller-approval-settings-occ
    parent_entity: Seller
    write_endpoint: "PATCH /showing-desk/sellers/{id}/approval-settings"
    occ_field: "expected_seller_version"
    description: |
      Updating a seller's approval settings (approval_timeout_minutes, auto_approve)
      against a Seller version that has advanced since the caller last observed it
      is rejected as a stale write.
    error_id: ERR_STALE_SELLER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_approval_deadline
    trigger: "ShowingRequest creation and reschedule"
    algorithm: threshold
    formula: |
      if listing.occupancy_type == "VACANT" and seller.auto_approve == true:
          approval_deadline = request.created_at        # request enters APPROVED immediately
      else:
          approval_deadline = max(
              request.created_at + MIN_REVIEW_WINDOW_MINUTES,
              min(request.created_at + seller.approval_timeout_minutes,
                  request.start_at - listing.min_notice_minutes))
      # nested min/max + occupancy/auto-approve branch: 5 inputs, non-linear
    input_set: "the new ShowingRequest, its Listing, and the listing's Seller"
    constants:
      MIN_REVIEW_WINDOW_MINUTES: 30
    precision: "minute precision, ISO8601 UTC"
    variants:
      - name: vacant_auto_approve
        when: "listing VACANT and seller.auto_approve true"
        difference: "deadline collapses to created_at and the request is born APPROVED, not PENDING_APPROVAL"
      - name: occupant_manual
        when: "otherwise"
        difference: "deadline is the clamped min of seller timeout and latest permissible approval time"

  - name: calc_access_window
    trigger: "AccessCredential issuance (POST .../access-credentials)"
    algorithm: interval_merge
    formula: |
      if listing.occupancy_type == "VACANT":
          active_from = showing.start_at - 60 minutes
          expires_at  = showing.end_at   + 60 minutes
      else:  # OCCUPIED
          active_from = showing.start_at - 15 minutes
          expires_at  = showing.end_at   + listing.buffer_minutes
      # redeemable iff active_from <= now < expires_at (expires_at exclusive)
    input_set: "the CONFIRMED ShowingRequest and its Listing"
    constants:
      VACANT_EARLY_ENTRY_MINUTES: 60
      VACANT_EXIT_GRACE_MINUTES: 60
      OCCUPIED_EARLY_ENTRY_MINUTES: 15
    precision: "minute precision, ISO8601 UTC"
    variants:
      - name: vacant_window
        when: "listing.occupancy_type == VACANT"
        difference: "wider window keyed to fixed 60-minute margins; instructions_text is the vacant self-access text"
      - name: occupied_window
        when: "listing.occupancy_type == OCCUPIED"
        difference: "tighter 15-minute early entry; expiry rides listing.buffer_minutes; instructions_text is the occupant-approved text"

  - name: calc_agent_standing
    trigger: "StrikeRecord created (no-show or late cancel), strike forgiven, strike expired by sweep"
    algorithm: threshold
    formula: |
      points = sum(weight of StrikeRecord where agent_id == agent.id and status == ACTIVE)
      standing = SUSPENDED  if points >= SUSPEND_POINTS      # 30
                 RESTRICTED if points >= RESTRICT_POINTS     # 15
                 else GOOD_STANDING
      # boundary is >= : exactly 30 is SUSPENDED, exactly 15 is RESTRICTED
    input_set: "StrikeRecords of the agent in ACTIVE status only (FORGIVEN and EXPIRED excluded)"
    constants:
      NO_SHOW_WEIGHT: 25
      LATE_CANCEL_WEIGHT: 10
      RESTRICT_POINTS: 15
      SUSPEND_POINTS: 30
      STRIKE_TTL_DAYS: 90
    precision: "integer points"
    variants:
      - name: escalation
        when: "points increased"
        difference: "transition INTO SUSPENDED fans out CASCADE B hop 3 (cancels the agent's future requests)"
      - name: deescalation
        when: "points decreased (forgive/expiry)"
        difference: "standing relaxes downward; no request resurrection — cancelled requests stay CANCELLED"

  - name: calc_feedback_score_rollup
    trigger: "FeedbackRequest submit (per-feedback leg) and Listing.avg_feedback_score recompute (rollup leg)"
    algorithm: weighted_scoring
    formula: |
      # ROUNDING ORDER IS PINNED: round each per-feedback score FIRST, then average.
      per_feedback score_i = round_half_up(0.30*q1 + 0.25*q2 + 0.20*q3 + 0.15*q4 + 0.10*q5, 1)
      listing avg_feedback_score = round_half_up(mean(score_i over all SUBMITTED FeedbackRequests of the listing), 1)
      avg_feedback_score = 0.0 when the listing has no SUBMITTED feedback
      # Aggregate-first order (round(mean(raw weighted sums),1)) is FORBIDDEN and yields
      # different results, e.g. raws {4.25, 4.25, 4.20}: pinned 4.3 vs aggregate-first 4.2.
    input_set: "FeedbackRequests of the listing in SUBMITTED status only"
    constants:
      W_Q1: 0.30
      W_Q2: 0.25
      W_Q3: 0.20
      W_Q4: 0.15
      W_Q5: 0.10
    precision: "1 decimal place, round_half_up, per-feedback round precedes aggregate round"
    variants:
      - name: per_feedback_leg
        when: "on submit"
        difference: "produces FeedbackRequest.overall_score"
      - name: listing_rollup_leg
        when: "on submit (same request)"
        difference: "re-averages the pinned per-feedback scores onto Listing.avg_feedback_score"

  - name: calc_daily_showing_count
    trigger: "ShowingRequest creation and reschedule"
    algorithm: aggregation
    formula: |
      count = number of ShowingRequests R where R.listing_id == listing.id
              and R.status in {PENDING_APPROVAL, APPROVED, CONFIRMED}
              and UTC calendar date of R.start_at == UTC calendar date of new start_at
      creation allowed iff count < listing.max_showings_per_day
      # at exactly max_showings_per_day the request is rejected (ERR_DAILY_SHOWING_LIMIT)
    input_set: "same-listing requests in the three occupancy states sharing the UTC date"
    constants: {}
    precision: "integer count; UTC date boundary"
    variants: []

  - name: calc_buffered_overlap
    trigger: "ShowingRequest creation and reschedule"
    algorithm: interval_merge
    formula: |
      # half-open buffered intervals; touching at the buffered boundary is ALLOWED
      for each existing R on listing L with R.status in {PENDING_APPROVAL, APPROVED, CONFIRMED}, R.id != self:
          conflict iff new.start_at < R.end_at + L.buffer_minutes
                   and R.start_at - L.buffer_minutes < new.end_at
      # blackout check is a SEPARATE closed-interval intersection with NO buffer:
      for each BlackoutWindow B on L:
          conflict iff new.start_at <= B.end_at and B.start_at <= new.end_at
    input_set: "non-terminal occupancy-state requests and all BlackoutWindows of the listing"
    constants: {}
    precision: "minute precision; strict < for buffered overlap, <= for closed blackout intersection"
    variants: []

  - name: calc_seller_report_metrics
    trigger: "GET /showing-desk/listings/{id}/activity-report"
    algorithm: aggregation
    formula: |
      terminal counts: completed_count, no_show_count, cancelled_count (any cancel_actor),
                       expired_count, declined_count over all requests of the listing
      pipeline counts: pending_approval_count, approved_count, confirmed_count
      terminal_total = completed + no_show + cancelled + expired + declined
      FINAL.completion_rate = round_half_up(completed_count / terminal_total, 2); 0.00 when terminal_total == 0
      PROVISIONAL.provisional_completion_rate =
          round_half_up(completed_count / max(completed_count + no_show_count + confirmed_count, 1), 2)
      avg_feedback_score per calc_feedback_score_rollup (0.0 when none)
    input_set: "all ShowingRequests of the listing regardless of status; feedback per rollup input set"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final
        when: "mode=FINAL (default end-of-period seller report)"
        difference: "rates over terminal states only; provisional_completion_rate is null"
      - name: provisional
        when: "mode=PROVISIONAL (mid-period pipeline view)"
        difference: "adds provisional_completion_rate that counts CONFIRMED as will-complete, diverging from FINAL.completion_rate for identical data"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "request body shape: required fields present, types correct, enum values valid; unknown fields rejected; rating fields q1..q5 must be integers in 1..5", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "path ids exist, validated left-to-right; body FK ids (seller_id, listing_id) exist", error_id: ERR_SELLER_NOT_FOUND, http_status: 404, applies_to: "all (per-resource: ERR_AGENT_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_SHOWING_REQUEST_NOT_FOUND, ERR_VERIFICATION_CASE_NOT_FOUND, ERR_BLACKOUT_WINDOW_NOT_FOUND, ERR_ACCESS_CREDENTIAL_NOT_FOUND, ERR_FEEDBACK_REQUEST_NOT_FOUND, ERR_STRIKE_NOT_FOUND)" }
  - { priority: 5, category: auth, check: "entity-backed caller owns the resource (seller owns listing; listing agent owns listing; buyer agent owns request/credential/feedback)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "all owner-scoped endpoints" }
  - { priority: 6, category: business_constraint, check: "OCC: expected_<parent>_version equals current parent version", error_id: ERR_STALE_LISTING_VERSION, http_status: 412, applies_to: "PATCH /showing-desk/listings/{id}/policy, PATCH /showing-desk/sellers/{id}/approval-settings (ERR_STALE_SELLER_VERSION)" }
  - { priority: 7, category: state, check: "target resource in the required state (listing ACTIVE; request in from-state; credential ISSUED; feedback SENT; case SUBMITTED/REJECTED; strike ACTIVE)", error_id: ERR_LISTING_NOT_ACTIVE, http_status: 409, applies_to: "all state-machine endpoints (per-state errors: ERR_LISTING_ALREADY_WITHDRAWN, ERR_SHOWING_NOT_PENDING_APPROVAL, ERR_SHOWING_NOT_APPROVED, ERR_SHOWING_NOT_CONFIRMED, ERR_SHOWING_NOT_DECLINED, ERR_SHOWING_ALREADY_TERMINAL, ERR_CASE_NOT_SUBMITTED, ERR_CASE_NOT_REJECTED, ERR_STRIKE_NOT_ACTIVE, ERR_CREDENTIAL_NOT_REDEEMABLE, ERR_FEEDBACK_NOT_AVAILABLE, ERR_FEEDBACK_ALREADY_SUBMITTED)" }
  - { priority: 8, category: business_safety, check: "buyer agent verification_status == VERIFIED and standing != SUSPENDED", error_id: ERR_AGENT_NOT_VERIFIED, http_status: 403, applies_to: "POST /showing-desk/showing-requests, POST .../confirm (ERR_AGENT_SUSPENDED when standing == SUSPENDED)" }
  - { priority: 9, category: business_temporal, check: "end_at > start_at and duration <= 120 minutes", error_id: ERR_INVALID_TIME_RANGE, http_status: 422, applies_to: "POST /showing-desk/showing-requests, POST .../reschedule, POST .../blackout-windows" }
  - { priority: 10, category: business_temporal, check: "start_at - now >= listing.min_notice_minutes", error_id: ERR_INSUFFICIENT_LEAD_TIME, http_status: 422, applies_to: "POST /showing-desk/showing-requests, POST .../reschedule" }
  - { priority: 11, category: business_temporal, check: "calc_buffered_overlap: no conflict with occupancy-state requests (buffered half-open)", error_id: ERR_SHOWING_OVERLAP_CONFLICT, http_status: 409, applies_to: "POST /showing-desk/showing-requests, POST .../reschedule" }
  - { priority: 12, category: business_temporal, check: "no closed-interval intersection with any BlackoutWindow of the listing", error_id: ERR_BLACKOUT_CONFLICT, http_status: 409, applies_to: "POST /showing-desk/showing-requests, POST .../reschedule" }
  - { priority: 13, category: business_temporal, check: "action before its deadline: approve before approval_deadline; confirm before confirm_by_deadline; no-show only after end_at; redeem within [active_from, expires_at)", error_id: ERR_APPROVAL_DEADLINE_PASSED, http_status: 422, applies_to: "approve/confirm/declare-no-show/redeem (per-action: ERR_CONFIRM_DEADLINE_PASSED, ERR_NO_SHOW_TOO_EARLY, ERR_CREDENTIAL_NOT_YET_ACTIVE, ERR_CREDENTIAL_EXPIRED)" }
  - { priority: 14, category: business_constraint, check: "calc_daily_showing_count < listing.max_showings_per_day", error_id: ERR_DAILY_SHOWING_LIMIT, http_status: 409, applies_to: "POST /showing-desk/showing-requests, POST .../reschedule" }
  - { priority: 15, category: business_constraint, check: "no existing ISSUED/USED credential for the showing at issuance", error_id: ERR_CREDENTIAL_ALREADY_ISSUED, http_status: 409, applies_to: "POST /showing-desk/showing-requests/{id}/access-credentials" }
  - { priority: 16, category: business_referential, check: "no other VerificationCase of the agent in SUBMITTED", error_id: ERR_VERIFICATION_CASE_OPEN, http_status: 409, applies_to: "POST /showing-desk/agents/{id}/verification-cases" }
  - { priority: 17, category: business_referential, check: "no credential of the request is USED when declaring no-show", error_id: ERR_NO_SHOW_NOT_DECLARABLE, http_status: 409, applies_to: "POST .../declare-no-show" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/showing-desk/sellers", description: "Create a seller", roles: [PlatformAdmin], code: 201, input: [full_name, contact_email, "approval_timeout_minutes?", "auto_approve?"], output: Seller, side_effects: [] }
  - { method: GET, path: "/showing-desk/sellers/{id}", description: "Get a seller", roles: [PlatformAdmin, Seller], code: 200, input: [], output: Seller, side_effects: [] }
  - { method: PATCH, path: "/showing-desk/sellers/{id}/approval-settings", description: "Update seller approval settings (OCC on Seller.version)", roles: [Seller], code: 200, input: ["approval_timeout_minutes?", "auto_approve?", expected_seller_version], output: Seller, side_effects: ["increments Seller.version by 1"] }
  - { method: POST, path: "/showing-desk/agents", description: "Register an agent (verification_status UNVERIFIED, standing GOOD_STANDING)", roles: [Anonymous], code: 201, input: [full_name, license_number, brokerage_name], output: Agent, side_effects: [] }
  - { method: GET, path: "/showing-desk/agents/{id}", description: "Get an agent", roles: [PlatformAdmin, ListingAgent, BuyerAgent], code: 200, input: [], output: Agent, side_effects: [] }
  - { method: POST, path: "/showing-desk/agents/{id}/verification-cases", description: "Submit an identity-verification case for the agent (self)", roles: [ListingAgent, BuyerAgent], code: 201, input: [license_document_ref], output: VerificationCase, side_effects: [] }
  - { method: GET, path: "/showing-desk/agents/{id}/verification-cases", description: "List an agent's verification cases", roles: [PlatformAdmin, ListingAgent, BuyerAgent], code: 200, input: ["limit?", "offset?"], output: "VerificationCase[]", side_effects: [] }
  - { method: POST, path: "/showing-desk/verification-cases/{case_id}/review", description: "Approve or reject a SUBMITTED verification case", roles: [PlatformAdmin], code: 200, input: [decision, "review_notes?"], output: VerificationCase, side_effects: ["on APPROVE: agent.verification_status recomputed to VERIFIED"] }
  - { method: POST, path: "/showing-desk/verification-cases/{case_id}/resubmit", description: "Resubmit a REJECTED case (cycle back to SUBMITTED)", roles: [ListingAgent, BuyerAgent], code: 200, input: [license_document_ref], output: VerificationCase, side_effects: ["resubmission_count + 1"] }
  - { method: GET, path: "/showing-desk/agents/{id}/strikes", description: "List an agent's strike records", roles: [PlatformAdmin, ListingAgent, BuyerAgent], code: 200, input: ["limit?", "offset?"], output: "StrikeRecord[]", side_effects: [] }
  - { method: POST, path: "/showing-desk/strikes/{strike_id}/forgive", description: "Forgive an ACTIVE strike (compensating leg of INV-2)", roles: [PlatformAdmin], code: 200, input: ["reason?"], output: StrikeRecord, side_effects: ["calc_agent_standing recompute"] }
  - { method: POST, path: "/showing-desk/listings", description: "Create a listing (status ACTIVE); caller ListingAgent becomes listing_agent_id", roles: [ListingAgent], code: 201, input: [seller_id, address, occupancy_type, "buffer_minutes?", "max_showings_per_day?", "min_notice_minutes?"], output: Listing, side_effects: [] }
  - { method: GET, path: "/showing-desk/listings/{id}", description: "Get a listing", roles: [PlatformAdmin, Seller, ListingAgent, BuyerAgent], code: 200, input: [], output: Listing, side_effects: [] }
  - { method: GET, path: "/showing-desk/listings", description: "List listings with optional filters", roles: [PlatformAdmin, Seller, ListingAgent, BuyerAgent], code: 200, input: ["seller_id?", "listing_agent_id?", "status?", "limit?", "offset?"], output: "Listing[]", side_effects: [] }
  - { method: PATCH, path: "/showing-desk/listings/{id}/policy", description: "Update scheduling policy (OCC on Listing.version)", roles: [ListingAgent], code: 200, input: ["buffer_minutes?", "max_showings_per_day?", "min_notice_minutes?", expected_listing_version], output: Listing, side_effects: ["increments Listing.version by 1"] }
  - { method: POST, path: "/showing-desk/listings/{id}/pause", description: "ACTIVE -> PAUSED", roles: [ListingAgent], code: 200, input: [], output: Listing, side_effects: ["ActivityEvent LISTING_PAUSED"] }
  - { method: POST, path: "/showing-desk/listings/{id}/resume", description: "PAUSED -> ACTIVE", roles: [ListingAgent], code: 200, input: [], output: Listing, side_effects: ["ActivityEvent LISTING_RESUMED"] }
  - { method: POST, path: "/showing-desk/listings/{id}/withdraw", description: "ACTIVE|PAUSED -> WITHDRAWN with CASCADE A", roles: [ListingAgent], code: 200, input: [], output: Listing, side_effects: ["CASCADE A (cancel requests -> revoke credentials -> cancel feedback requests)", "ActivityEvent LISTING_WITHDRAWN"] }
  - { method: POST, path: "/showing-desk/listings/{id}/blackout-windows", description: "Create a closed-interval blackout window on the listing", roles: [Seller], code: 201, input: [start_at, end_at, "reason?"], output: BlackoutWindow, side_effects: [] }
  - { method: GET, path: "/showing-desk/listings/{id}/blackout-windows", description: "List blackout windows of a listing", roles: [Seller, ListingAgent], code: 200, input: ["limit?", "offset?"], output: "BlackoutWindow[]", side_effects: [] }
  - { method: DELETE, path: "/showing-desk/blackout-windows/{window_id}", description: "Delete a blackout window", roles: [Seller], code: 204, input: [], output: null, side_effects: [] }
  - { method: POST, path: "/showing-desk/showing-requests", description: "Create a showing request; buyer_agent_id taken from X-User-ID; auto-approves when VACANT + seller.auto_approve", roles: [BuyerAgent], code: 201, input: [listing_id, start_at, end_at, "buyer_name?", "note?"], output: ShowingRequest, side_effects: ["approval_deadline and confirm_by_deadline computed", "ActivityEvent REQUEST_CREATED"] }
  - { method: GET, path: "/showing-desk/showing-requests/{id}", description: "Get a showing request", roles: [PlatformAdmin, Seller, ListingAgent, BuyerAgent], code: 200, input: [], output: ShowingRequest, side_effects: [] }
  - { method: GET, path: "/showing-desk/showing-requests", description: "List showing requests with optional filters", roles: [PlatformAdmin, Seller, ListingAgent, BuyerAgent], code: 200, input: ["listing_id?", "buyer_agent_id?", "status?", "limit?", "offset?"], output: "ShowingRequest[]", side_effects: [] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/approve", description: "Occupant approves a PENDING_APPROVAL request", roles: [Seller], code: 200, input: [], output: ShowingRequest, side_effects: ["ActivityEvent APPROVED"] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/decline", description: "Occupant declines a PENDING_APPROVAL request", roles: [Seller], code: 200, input: ["reason?"], output: ShowingRequest, side_effects: ["ActivityEvent DECLINED"] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/confirm", description: "Buyer agent confirms an APPROVED request (re-checks verification/standing)", roles: [BuyerAgent], code: 200, input: [], output: ShowingRequest, side_effects: ["confirmed_showing_count + 1", "FeedbackRequest SCHEDULED created", "ActivityEvent CONFIRMED"] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/cancel", description: "Buyer agent cancels; late cancel from CONFIRMED (<24h to start) issues LATE_CANCEL strike", roles: [BuyerAgent], code: 200, input: ["reason?"], output: ShowingRequest, side_effects: ["compensation side effects per state machine", "ActivityEvent CANCELLED"] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/reschedule", description: "Reschedule a DECLINED request with a new window (full revalidation)", roles: [BuyerAgent], code: 200, input: [start_at, end_at], output: ShowingRequest, side_effects: ["deadlines recomputed", "reschedule_count + 1", "ActivityEvent RESCHEDULED"] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/declare-no-show", description: "Listing agent declares no-show after window end; issues NO_SHOW strike (CASCADE B)", roles: [ListingAgent], code: 200, input: [], output: ShowingRequest, side_effects: ["CASCADE B (strike -> standing -> cancel future requests -> revoke credentials)", "ActivityEvent NO_SHOW"] }
  - { method: POST, path: "/showing-desk/showing-requests/{id}/access-credentials", description: "Issue lockbox/door credential for a CONFIRMED showing; window per calc_access_window", roles: [ListingAgent], code: 201, input: [credential_type], output: AccessCredential, side_effects: ["ActivityEvent CREDENTIAL_ISSUED"] }
  - { method: GET, path: "/showing-desk/showing-requests/{id}/access-credentials", description: "List credentials of a showing request", roles: [ListingAgent, BuyerAgent], code: 200, input: ["limit?", "offset?"], output: "AccessCredential[]", side_effects: [] }
  - { method: GET, path: "/showing-desk/showing-requests/{id}/strikes", description: "List strikes originating from a showing request", roles: [PlatformAdmin, Seller, ListingAgent], code: 200, input: ["limit?", "offset?"], output: "StrikeRecord[]", side_effects: [] }
  - { method: GET, path: "/showing-desk/showing-requests/{id}/feedback-request", description: "Get the (0-1) feedback request of a showing", roles: [Seller, ListingAgent, BuyerAgent], code: 200, input: [], output: "FeedbackRequest[]", side_effects: [] }
  - { method: POST, path: "/showing-desk/access-credentials/{credential_id}/redeem", description: "Buyer agent redeems a credential inside its window; ISSUED -> USED", roles: [BuyerAgent], code: 200, input: [], output: AccessCredential, side_effects: ["ActivityEvent CREDENTIAL_REDEEMED"] }
  - { method: POST, path: "/showing-desk/access-credentials/{credential_id}/revoke", description: "Listing agent revokes an ISSUED credential", roles: [ListingAgent], code: 200, input: [], output: AccessCredential, side_effects: ["ActivityEvent CREDENTIAL_REVOKED"] }
  - { method: POST, path: "/showing-desk/feedback-requests/{feedback_id}/submit", description: "Buyer agent submits feedback answers for a SENT feedback request", roles: [BuyerAgent], code: 200, input: [q1, q2, q3, q4, q5, "comment?"], output: FeedbackRequest, side_effects: ["overall_score computed", "listing.avg_feedback_score recomputed", "ActivityEvent FEEDBACK_SUBMITTED"] }
  - { method: GET, path: "/showing-desk/listings/{id}/activity-events", description: "List the append-only activity log of a listing", roles: [Seller, ListingAgent], code: 200, input: ["event_type?", "limit?", "offset?"], output: "ActivityEvent[]", side_effects: [] }
  - { method: GET, path: "/showing-desk/showing-requests/{id}/activity-events", description: "List activity events tied to a specific showing request", roles: [Seller, ListingAgent], code: 200, input: ["event_type?", "limit?", "offset?"], output: "ActivityEvent[]", side_effects: [] }
  - { method: GET, path: "/showing-desk/listings/{id}/activity-report", description: "Computed seller activity report; mode=FINAL (default) or PROVISIONAL per calc_seller_report_metrics", roles: [Seller, ListingAgent], code: 200, input: ["mode?"], output: { mode: string, pending_approval_count: integer, approved_count: integer, confirmed_count: integer, completed_count: integer, no_show_count: integer, cancelled_count: integer, expired_count: integer, declined_count: integer, completion_rate: number, provisional_completion_rate: number, avg_feedback_score: number }, side_effects: [] }
  - { method: POST, path: "/showing-desk/_clock/set_current_utc", description: "Set the logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly that default and never wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/showing-desk/_ops/run_expiration_sweep", description: "Ops checkpoint; applies time-based transitions in pinned order: (1) PENDING_APPROVAL past approval_deadline -> EXPIRED, (2) APPROVED past confirm_by_deadline -> EXPIRED, (3) CONFIRMED past end_at with USED credential -> COMPLETED and its feedback SCHEDULED -> SENT, (4) credentials ISSUED past expires_at -> EXPIRED, (5) feedback SENT past due_at -> EXPIRED, (6) strikes ACTIVE past expires_at -> EXPIRED with standing recompute", roles: [PlatformAdmin], code: 200, input: [], output: { requests_expired_count: integer, requests_completed_count: integer, credentials_expired_count: integer, feedback_sent_count: integer, feedback_expired_count: integer, strikes_expired_count: integer }, side_effects: ["sweep steps 1-6 in order"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown field, or invalid enum value" }
  - { id: ERR_RATING_OUT_OF_RANGE, http: 400, condition: "q1..q5 not integers in 1..5" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "caller role not in endpoint roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity-backed caller does not own the target resource" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "seller id does not exist" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "agent id does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listing id does not exist" }
  - { id: ERR_SHOWING_REQUEST_NOT_FOUND, http: 404, condition: "showing request id does not exist" }
  - { id: ERR_VERIFICATION_CASE_NOT_FOUND, http: 404, condition: "verification case id does not exist" }
  - { id: ERR_BLACKOUT_WINDOW_NOT_FOUND, http: 404, condition: "blackout window id does not exist" }
  - { id: ERR_ACCESS_CREDENTIAL_NOT_FOUND, http: 404, condition: "access credential id does not exist" }
  - { id: ERR_FEEDBACK_REQUEST_NOT_FOUND, http: 404, condition: "feedback request id does not exist" }
  - { id: ERR_STRIKE_NOT_FOUND, http: 404, condition: "strike id does not exist" }
  - { id: ERR_STALE_LISTING_VERSION, http: 412, condition: "expected_listing_version != listing.version" }
  - { id: ERR_STALE_SELLER_VERSION, http: 412, condition: "expected_seller_version != seller.version" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "listing not ACTIVE where required (create/reschedule showing)" }
  - { id: ERR_LISTING_ALREADY_WITHDRAWN, http: 409, condition: "listing WITHDRAWN; no further lifecycle actions" }
  - { id: ERR_SHOWING_NOT_PENDING_APPROVAL, http: 409, condition: "approve/decline on a request not in PENDING_APPROVAL" }
  - { id: ERR_SHOWING_NOT_APPROVED, http: 409, condition: "confirm on a request not in APPROVED" }
  - { id: ERR_SHOWING_NOT_CONFIRMED, http: 409, condition: "credential issuance or completion-gated action on a request not in CONFIRMED" }
  - { id: ERR_SHOWING_NOT_DECLINED, http: 409, condition: "reschedule on a request not in DECLINED" }
  - { id: ERR_SHOWING_ALREADY_TERMINAL, http: 409, condition: "action on a request in COMPLETED/NO_SHOW/CANCELLED/EXPIRED" }
  - { id: ERR_CASE_NOT_SUBMITTED, http: 409, condition: "review on a case not in SUBMITTED" }
  - { id: ERR_CASE_NOT_REJECTED, http: 409, condition: "resubmit on a case not in REJECTED" }
  - { id: ERR_STRIKE_NOT_ACTIVE, http: 409, condition: "forgive on a strike not in ACTIVE" }
  - { id: ERR_CREDENTIAL_NOT_REDEEMABLE, http: 409, condition: "redeem/revoke on a credential not in ISSUED" }
  - { id: ERR_FEEDBACK_NOT_AVAILABLE, http: 409, condition: "submit on feedback in SCHEDULED/EXPIRED/CANCELLED" }
  - { id: ERR_FEEDBACK_ALREADY_SUBMITTED, http: 409, condition: "submit on feedback already SUBMITTED" }
  - { id: ERR_AGENT_NOT_VERIFIED, http: 403, condition: "buyer agent verification_status != VERIFIED for create/confirm" }
  - { id: ERR_AGENT_SUSPENDED, http: 403, condition: "buyer agent standing == SUSPENDED for create/confirm" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end_at <= start_at or duration > 120 minutes" }
  - { id: ERR_INSUFFICIENT_LEAD_TIME, http: 422, condition: "start_at - now < listing.min_notice_minutes" }
  - { id: ERR_SHOWING_OVERLAP_CONFLICT, http: 409, condition: "calc_buffered_overlap conflict with an occupancy-state request" }
  - { id: ERR_BLACKOUT_CONFLICT, http: 409, condition: "closed-interval intersection with a BlackoutWindow" }
  - { id: ERR_DAILY_SHOWING_LIMIT, http: 409, condition: "calc_daily_showing_count == listing.max_showings_per_day" }
  - { id: ERR_APPROVAL_DEADLINE_PASSED, http: 422, condition: "approve attempted at now >= approval_deadline" }
  - { id: ERR_CONFIRM_DEADLINE_PASSED, http: 422, condition: "confirm attempted at now >= confirm_by_deadline" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 422, condition: "declare-no-show attempted at now <= end_at" }
  - { id: ERR_NO_SHOW_NOT_DECLARABLE, http: 409, condition: "a credential of the request is already USED" }
  - { id: ERR_CREDENTIAL_ALREADY_ISSUED, http: 409, condition: "an ISSUED/USED credential already exists for the request" }
  - { id: ERR_CREDENTIAL_NOT_YET_ACTIVE, http: 422, condition: "redeem attempted at now < active_from" }
  - { id: ERR_CREDENTIAL_EXPIRED, http: 422, condition: "redeem attempted at now >= expires_at" }
  - { id: ERR_VERIFICATION_CASE_OPEN, http: 409, condition: "another case of the agent is SUBMITTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as an agent"
    identity: opaque
    exclusive_operations: ["POST /showing-desk/agents"]
    shared_operations: []
  - name: PlatformAdmin
    description: "Platform operator; seller onboarding, verification review, strike forgiveness, clock and sweep"
    identity: opaque
    exclusive_operations: ["POST /showing-desk/sellers", "POST /showing-desk/verification-cases/{case_id}/review", "POST /showing-desk/strikes/{strike_id}/forgive", "POST /showing-desk/_clock/set_current_utc", "POST /showing-desk/_ops/run_expiration_sweep"]
    shared_operations: ["GET reads on agents, verification cases, strikes, listings, showing requests"]
  - name: Seller
    description: "Owner/occupant; approval workflow and availability management"
    identity: "entity_backed:Seller"
    exclusive_operations: ["PATCH approval-settings", "approve", "decline", "blackout-window create/delete"]
    shared_operations: ["GET sellers/{id}, listings, showing-requests, blackout-windows, feedback-request, activity-events, activity-report"]
  - name: ListingAgent
    description: "Agent managing the listing; policy, lifecycle, credential issuance, no-show declaration"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /showing-desk/listings", "pause/resume/withdraw", "PATCH policy", "issue/revoke credential", "declare-no-show"]
    shared_operations: ["verification-case submit/resubmit", "GET reads on listings, showing-requests, credentials, strikes, activity"]
  - name: BuyerAgent
    description: "Agent representing the buyer; request intake, confirmation, redemption, feedback"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /showing-desk/showing-requests", "confirm", "cancel", "reschedule", "redeem credential", "submit feedback"]
    shared_operations: ["verification-case submit/resubmit", "GET reads on listings, showing-requests, credentials, feedback-request"]
