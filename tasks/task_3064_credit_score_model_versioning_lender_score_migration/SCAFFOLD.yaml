    description: "Void a migration step; the compensating action re-consumes the credited delta"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MigrationEvent
    side_effects:
      - "voided_at stamped"
      - "the credited reset-window delta is re-consumed, restoring the outcome-mixture ratio to its pre-event value"

