scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: appearance_fee_estimate_vs_actual_on_assignment
        grounds:
          - calculations.compute_appearance_fee
          - state_machines.Job.IN_SESSION_to_ADJOURNED
          - entities.Assignment.fields.appearance_fee_cents
          - endpoints["GET /jobs/{id}/appearance-estimate"]
        distinguishing_aspect: |
          The estimate variant uses (scheduled_end - scheduled_start) while the actual
          variant uses (actual_end - actual_start); for a job scheduled 3h but adjourned
          after 90 min the estimate yields 30000 cents and the frozen actual yields 20000
          cents on the same REPORTER Assignment — divergence is on the Assignment entity domain.
        test_recipe:
          setup:
            - "An attorney, a case, and a non-realtime REPORTER resource @10000 cents/hr exist."
            - "A job scheduled 2026-06-01T09:00:00Z..12:00:00Z (3h) with a single ACTIVE REPORTER assignment, CONFIRMED."
            - "Clock advanced to 09:00, job started; clock advanced to 10:30, job adjourned (90-min actual session)."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A One", firm_name: "One LLP", bar_state: "CA", email: "a1@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Doe v Acme", docket_number: "D-1001", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep R", kind: "REPORTER", certifications: ["CSR_CA"], realtime_capable: false, hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "Assignment.${asg_id}.appearance_fee_cents == 20000"
            - "Assignment.${asg_id}.status == COMPLETED"

      - name: page_charge_provisional_quote_vs_final_billed_on_transcript
        grounds:
          - calculations.compute_page_charge
          - state_machines.TranscriptOrder.ROUGH_DELIVERED_to_CERTIFIED
          - endpoints["GET /transcript-orders/{id}/quote"]
          - entities.Invoice.fields.page_subtotal_cents
        distinguishing_aspect: |
          The provisional_quote variant prices estimated_pages=40 (STATE_CA, EXPEDITE_14,
          certified) at 18750 cents while final_billed prices final_pages=60 at 26475 cents
          on the Invoice — divergence is on the TranscriptOrder/Invoice domain, a different
          entity domain than the Assignment appearance-fee dual variant.
        test_recipe:
          setup:
            - "An adjourned job in STATE_CA exists with a COMPLETED reporter assignment."
            - "A transcript order ORDERED with turnaround_tier=EXPEDITE_14, certified_copy=true, estimated_pages=40."
            - "Reporter delivers rough, then certifies with final_pages=60 (final differs from estimate)."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Two", firm_name: "Two LLP", bar_state: "CA", email: "a2@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Roe v Beta", docket_number: "D-1002", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep S", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 12000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness X", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "EXPEDITE_14", certified_copy: true, estimated_pages: 40 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
            - call: "POST /transcript-orders/${to_id}/deliver-rough"
              payload: {}
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/certify"
              payload: { final_pages: 60 }
              as: Reporter
              as_user_id: "${rep_id}"
          trigger:
            - call: "GET /transcript-orders/${to_id}/quote"
              payload: {}
              as: BillingClerk
          assert:
            - "quote.provisional_page_cents == 18750"
            - "TranscriptOrder.${to_id}.final_pages == 60"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: page_charge_tiered_then_multiplier_then_flat_mode_c
        grounds:
          - calculations.compute_page_charge
          - entities.TranscriptOrder.fields.turnaround_tier
          - entities.Case.fields.jurisdiction
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: per-tier marginal rate is rounded BEFORE
          multiplying by tier page count, tier products are summed, THEN the expedite
          multiplier is applied, THEN the certification flat fee is ADDED (not multiplied).
          For STATE_CA 200 pages EXPEDITE_7 certified the only correct ordering yields 90325 cents.
        test_recipe:
          setup:
            - "An adjourned STATE_CA job with a certified transcript order at EXPEDITE_7."
            - "Reporter certifies final_pages=200; transcript signed and delivered; invoice created."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Three", firm_name: "Three LLP", bar_state: "CA", email: "a3@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Smith v Gamma", docket_number: "D-1003", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep T", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness Y", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "EXPEDITE_7", certified_copy: true, estimated_pages: 200 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
            - call: "POST /transcript-orders/${to_id}/deliver-rough"
              payload: {}
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/certify"
              payload: { final_pages: 200 }
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/sign"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /transcript-orders/${to_id}/deliver"
              payload: {}
              as: ScheduleCoordinator
            - call: "POST /invoices"
              payload: { job_id: "${job_id}", transcript_order_id: "${to_id}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice.${inv_id}.page_subtotal_cents == 90325"

      - name: appearance_fee_nonlinear_min_ceil_surcharge_mode_a
        grounds:
          - calculations.compute_appearance_fee
          - entities.Job.fields.requires_realtime
          - entities.Resource.fields.hourly_appearance_cents
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — billable_hours =
          max(2, ceil(raw_minutes/60)) nests max-over-ceil, then a conditional 1.20 realtime
          surcharge branches on Assignment.role==REPORTER AND Job.requires_realtime. For a
          30-min realtime reporter session @15000 the result is max(2,1)=2h then *1.20 = 36000.
        test_recipe:
          setup:
            - "A realtime job with a realtime_capable REPORTER @15000, started and adjourned 30 minutes later."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Four", firm_name: "Four LLP", bar_state: "CA", email: "a4@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Liu v Delta", docket_number: "D-1004", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep U", kind: "REPORTER", certifications: ["CSR_CA","RMR"], realtime_capable: true, hourly_appearance_cents: 15000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness Z", scheduled_start: "2026-06-04T09:00:00Z", scheduled_end: "2026-06-04T13:00:00Z", requires_realtime: true }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: BillingClerk
          assert:
            - "Assignment.${asg_id}.appearance_fee_cents == 36000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transcript_read_sign_errata_cycle_multiple_rounds
        grounds:
          - state_machines.TranscriptOrder.READ_SIGN_OPEN_to_ERRATA_FILED
          - state_machines.TranscriptOrder.ERRATA_FILED_to_READ_SIGN_OPEN
          - entities.TranscriptOrder.fields.errata_round
        distinguishing_aspect: |
          TranscriptOrder is cyclic: READ_SIGN_OPEN -> ERRATA_FILED -> READ_SIGN_OPEN can
          loop, incrementing errata_round each pass (1 then 2), proving a true cycle on the
          TranscriptOrder entity rather than a linear pipeline.
        test_recipe:
          setup:
            - "A certified transcript whose read-sign window is OPEN, clock well before the 30-day deadline."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Five", firm_name: "Five LLP", bar_state: "CA", email: "a5@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Park v Epsilon", docket_number: "D-1005", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep V", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness P", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "STANDARD", certified_copy: true, estimated_pages: 30 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
            - call: "POST /transcript-orders/${to_id}/deliver-rough"
              payload: {}
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/certify"
              payload: { final_pages: 30 }
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/open-read-sign"
              payload: {}
              as: ScheduleCoordinator
            - call: "POST /transcript-orders/${to_id}/errata"
              payload: { corrections: [{ page: 4, line: 12, from_text: "fife", to_text: "five" }], reason: "transcription error round 1" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /transcript-orders/${to_id}/open-read-sign"
              payload: {}
              as: ScheduleCoordinator
          trigger:
            - call: "POST /transcript-orders/${to_id}/errata"
              payload: { corrections: [{ page: 7, line: 3, from_text: "to", to_text: "two" }], reason: "transcription error round 2" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "GET /transcript-orders/${to_id}"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "TranscriptOrder.${to_id}.errata_round == 2"
            - "TranscriptOrder.${to_id}.status == ERRATA_FILED"

      - name: job_branching_cancel_vs_session_path_diverge
        grounds:
          - state_machines.Job.NOTICED_to_CANCELLED
          - state_machines.Job.CONFIRMED_to_IN_SESSION
          - state_machines.Job.IN_SESSION_to_ADJOURNED
        distinguishing_aspect: |
          Job branches from CONFIRMED into two divergent side-effect sets: the cancel branch
          RELEASES all active assignments (no appearance fee), while the start->adjourn branch
          COMPLETES them and computes appearance fees — branching fork with divergent side
          effects on the Job entity, a different entity than the cyclic TranscriptOrder.
        test_recipe:
          setup:
            - "A CONFIRMED job with one ACTIVE reporter assignment exists."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Six", firm_name: "Six LLP", bar_state: "CA", email: "a6@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Kim v Zeta", docket_number: "D-1006", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep W", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness Q", scheduled_start: "2026-06-06T09:00:00Z", scheduled_end: "2026-06-06T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "Job.${job_id}.status == CANCELLED"
            - "Assignment.${asg_id}.status == RELEASED"
            - "Assignment.${asg_id}.appearance_fee_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adjourn_cascade_completes_assignment_then_computes_fee_depth3
        grounds:
          - state_machines.Job.IN_SESSION_to_ADJOURNED
          - state_machines.Assignment.ACTIVE_to_COMPLETED
          - calculations.compute_appearance_fee
          - entities.Assignment.fields.appearance_fee_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by adjourn: (A) Job IN_SESSION->ADJOURNED sets actual_end,
          which (B) flips each ACTIVE Assignment to COMPLETED, which (C) triggers
          compute_appearance_fee writing appearance_fee_cents on that assignment. Each hop is
          caused by the prior hop, not directly by the adjourn call.
        test_recipe:
          setup:
            - "An IN_SESSION job with a single REPORTER assignment @10000, actual_start 09:00."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Seven", firm_name: "Seven LLP", bar_state: "CA", email: "a7@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Ng v Eta", docket_number: "D-1007", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep X", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness R", scheduled_start: "2026-06-07T09:00:00Z", scheduled_end: "2026-06-07T13:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_id: $.data.id }
            - call: "GET /jobs/${job_id}"
