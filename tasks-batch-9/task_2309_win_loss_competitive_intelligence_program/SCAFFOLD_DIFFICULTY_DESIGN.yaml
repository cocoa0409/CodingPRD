            - "INCLUDE_PROVISIONAL response: data.attribution_count == 2"
            - "INCLUDE_PROVISIONAL response: data.segments has exactly 1 element with segment == ENTERPRISE and segment_total == 2.00"
            - "INCLUDE_PROVISIONAL response: that segment's rows has exactly 2 elements, root_reason_code FEATURE_GAP and PRICE, each with weighted_total == 1.00 and share == 0.5000"
            - "LossAttribution.${att1_id}.status == RATIFIED and LossAttribution.${att1_id}.confidence_score == 0.60"
            - "LossAttribution.${att2_id}.status == PROVISIONAL and LossAttribution.${att2_id}.confidence_score == 0.60"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deal_research_and_attribution_dimensions_advance_independently
        grounds:
          - state_machines.Deal.research_status
          - state_machines.Deal.attribution_status
          - entities.Deal.fields.research_status
          - entities.Deal.fields.attribution_status
          - entities.LossAttribution.fields.confidence_score
        distinguishing_aspect: |
          Non-linearity here is parallelism on ONE entity: Deal carries two
          independent state dimensions. Completing the interview advances
          research_status SELECTED -> INTERVIEWED while attribution_status stays at
          UNATTRIBUTED, and authoring the attribution advances attribution_status
          UNATTRIBUTED -> PROVISIONAL while research_status stays at INTERVIEWED.
          A single-dimension implementation cannot produce the observed
          (INTERVIEWED, UNATTRIBUTED) intermediate pair.
        test_recipe:
          setup:
            - "Program ACTIVE (budget 10000.00, cap 500.00, min_deal_value 50000.00); ACTIVE leaf loss reason PRICE."
            - "ENTERPRISE LOST deal CRM-1001 drawn into a SEALED frame (research_status SELECTED, attribution_status UNATTRIBUTED)."
            - "Consented ECONOMIC_BUYER contact; interview scheduled 2026-08-10T14:00Z -> 15:00Z with all three guide topics recorded."
          setup_api_calls:
