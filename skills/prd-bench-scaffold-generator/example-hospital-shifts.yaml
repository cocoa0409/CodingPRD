# =============================================================================
# 示例：hospital-shifts benchmark 的种子表还原
# 此文件展示了 hospital-shifts v1 的完整种子表
# 供创建新 benchmark 时参考
# =============================================================================

scenario: |
  医院排班调度系统。管理治疗计划的完整生命周期：从预算规划、轮班排程、
  手术操作定义，到医疗资源分配、成本核算和最终结算。
  需要考虑：角色权限、预算控制、患者安全评分、设备认证、
  消毒时间协议、感染风险配对、高生物风险双倍计费。

domain_name: hospital-shifts
api_prefix: /treatment-plans

# =============================================================================
# 表 1: 实体关系表
# =============================================================================
entities:
  - name: TreatmentPlan
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: plan_name, type: string, source: input, description: 计划名称 }
      - { name: total_budget, type: number, source: input, description: 总预算 }
      - { name: cost_balance, type: number, source: computed, description: "剩余预算余额，初始值=total_budget，随assignment增减" }
      - { name: patient_safety_score, type: number, source: computed, description: "安全分数，初始值=0，越低越好" }
      - { name: status, type: enum, source: system, description: "PLANNING → ACTIVE → FINAL_REVIEW_PENDING → COMPLETED" }

  - name: WardRotation
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: 关联的治疗计划ID }
      - { name: name, type: string, source: input, description: 轮班名称 }
      - { name: start_minute, type: integer, source: input, description: "开始时刻（非负整数，时间偏移量）" }
      - { name: end_minute, type: integer, source: input, description: "结束时刻（必须 > start_minute）" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_ASSIGNMENT / COMPLETED / CANCELLED" }

  - name: Procedure
    parent: WardRotation
    common_fields: true
    fields:
      - { name: rotation_id, type: string, source: system, description: 关联的轮班ID }
      - { name: plan_id, type: string, source: system, description: 关联的治疗计划ID }
      - { name: procedure_type, type: string, source: input, description: 手术类型 }
      - { name: required_certification, type: enum, source: input, default: "NONE", description: "BSL-3_CERTIFIED | CARDIAC_CATHETERIZATION_LAB | NONE" }
      - { name: start_minute, type: integer, source: input, description: 开始时刻 }
      - { name: end_minute, type: integer, source: input, description: 结束时刻 }
      - { name: duration_minutes, type: integer, source: computed, description: "只读字段，= end_minute - start_minute" }
      - { name: status, type: enum, source: system, description: "PENDING → SCHEDULED / ASSIGNED / COMPLETED / CANCELLED" }

  - name: MedicalResource
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: 关联的治疗计划ID }
      - { name: resource_name, type: string, source: input, description: 资源名称 }
      - { name: resource_model, type: string, source: input, description: 资源型号 }
      - { name: operating_cost_per_minute, type: number, source: input, description: 每分钟运行成本 }
      - { name: resource_certifications, type: array, source: system, description: "认证列表，每项含 id, name, applied_date" }

  - name: Assignment
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: 关联的治疗计划ID }
      - { name: procedure_id, type: string, source: input, description: 关联的手术ID }
      - { name: resource_id, type: string, source: input, description: 关联的资源ID }
      - { name: override_protocol_check, type: boolean, source: input, default: false, description: "是否绕过安全评分阈值检查" }
      - { name: protocol_override_penalty_applied, type: boolean, source: computed, description: "是否实际施加了override惩罚（+100分）" }
      - { name: is_high_biorisk, type: boolean, source: computed, description: "是否触发高生物风险（资源累计使用>6000分钟）" }
      - { name: provisional_cost, type: number, source: computed, description: "临时成本（前瞻性计算）" }
      - { name: final_cost, type: number, source: computed, description: "最终成本（按时间顺序计算，finalize时填入）" }
      - { name: status, type: enum, source: system, description: "PENDING_SCHEDULE → PROTOCOL_APPROVED → SCHEDULED → COMPLETED / REJECTED / CANCELLED" }

  - name: InfectionRiskPairing
    parent: TreatmentPlan
    common_fields: false  # 只有 id 和 created_at，没有 updated_at 和 version
    fields:
      - { name: plan_id, type: string, source: system, description: 关联的治疗计划ID }
      - { name: resource_id_1, type: string, source: input, description: 配对资源1 }
      - { name: resource_id_2, type: string, source: input, description: 配对资源2 }
      - { name: reason, type: string, source: input, required: false, description: 配对原因 }

# =============================================================================
# 表 2: 状态机表
# =============================================================================
state_machines:
  - entity: TreatmentPlan
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: POST /treatment-plans/{planId}/activate
        actor: ChargeNurse
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: FINAL_REVIEW_PENDING
        trigger: POST /treatment-plans/{planId}/initiate-final-review
        actor: ChargeNurse
        preconditions:
          - 不存在未解决的assignments（非终态：PENDING_SCHEDULE, PROTOCOL_APPROVED）
        side_effects: []

      - from: FINAL_REVIEW_PENDING
        to: COMPLETED
        trigger: POST /treatment-plans/{planId}/finalize-plan
        actor: HospitalAdministrator
        preconditions:
          - "final_cost总和不超过total_budget（否则ERR_FINALIZATION_EXCEEDS_BUDGET）"
        side_effects:
          - 所有SCHEDULED assignments计算final_cost并转COMPLETED
          - 所有READY_FOR_ASSIGNMENT rotations转COMPLETED
          - cost_balance更新为 total_budget - sum(final_costs)

  - entity: WardRotation
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_ASSIGNMENT
        trigger: PUT /treatment-plans/{planId}/ward-rotations/{rotationId}
        actor: ChargeNurse
        preconditions:
          - 治疗计划状态为ACTIVE
          - 所有procedures必须为ASSIGNED状态（否则ERR_PROCEDURES_NOT_ASSIGNED）
        side_effects: []

      - from: READY_FOR_ASSIGNMENT
        to: COMPLETED
        trigger: system (finalize-plan时自动)
        actor: system
        preconditions:
          - 所有procedures已到终态（COMPLETED或CANCELLED）
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /treatment-plans/{planId}/ward-rotations/{rotationId}
        actor: ChargeNurse
        preconditions:
          - 治疗计划状态为ACTIVE
        side_effects:
          - 所有PENDING procedures → CANCELLED
          - 所有关联的非终态assignments → cascade取消并退款

      - from: READY_FOR_ASSIGNMENT
        to: CANCELLED
        trigger: PUT /treatment-plans/{planId}/ward-rotations/{rotationId}
        actor: ChargeNurse
        preconditions:
          - 治疗计划状态为ACTIVE
        side_effects:
          - 同上

  - entity: Procedure
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: system (assignment proposal时自动)
        actor: system
        preconditions: []
        side_effects: []
        note: "当一个assignment被创建，关联的procedure从PENDING变为SCHEDULED"

      - from: SCHEDULED
        to: ASSIGNED
        trigger: system (assignment schedule时自动)
        actor: system
        preconditions: []
        side_effects: []
        note: "当关联的assignment从PROTOCOL_APPROVED变为SCHEDULED，procedure变为ASSIGNED"

      - from: SCHEDULED
        to: PENDING
        trigger: system (assignment reject/cancel时自动回退)
        actor: system
        preconditions: []
        side_effects: []
        note: "当PENDING_SCHEDULE的assignment被reject/cancel，procedure回退到PENDING"

      - from: ASSIGNED
        to: PENDING
        trigger: system (SCHEDULED assignment cancel时自动回退)
        actor: system
        preconditions: []
        side_effects: []
        note: "当SCHEDULED的assignment被cancel，procedure回退到PENDING"

      - from: ASSIGNED
        to: COMPLETED
        trigger: system (finalize-plan时自动)
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: POST .../procedures/{procedureId}/cancel
        actor: AttendingPhysician
        preconditions:
          - procedure必须在PENDING状态（否则ERR_PROCEDURE_NOT_PENDING_FOR_CANCEL）
        side_effects: []

  - entity: Assignment
    initial_state: PENDING_SCHEDULE
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_SCHEDULE
        to: PROTOCOL_APPROVED
        trigger: POST .../assignments/{assignmentId}/protocol-approve
        actor: ChargeNurse
        preconditions: []
        side_effects: []

      - from: PENDING_SCHEDULE
        to: REJECTED
        trigger: POST .../assignments/{assignmentId}/reject
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - procedure回退到PENDING
          - 退还provisional_cost到cost_balance
          - 退还safety_score（bio-risk惩罚 + override惩罚）

      - from: PENDING_SCHEDULE
        to: CANCELLED
        trigger: POST .../assignments/{assignmentId}/cancel
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - 同REJECTED的side_effects

      - from: PROTOCOL_APPROVED
        to: SCHEDULED
        trigger: POST .../assignments/{assignmentId}/schedule
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - procedure变为ASSIGNED
          - 重新计算provisional_cost（仅看start_minute之前已确认的assignments）
          - 更新cost_balance（退旧扣新）
          - 更新safety_score（如bio-risk状态变化）

      - from: PROTOCOL_APPROVED
        to: CANCELLED
        trigger: POST .../assignments/{assignmentId}/cancel
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - procedure回退到PENDING
          - 退还provisional_cost到cost_balance
          - 退还safety_score

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST .../assignments/{assignmentId}/cancel
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - procedure回退到PENDING
          - 退还provisional_cost到cost_balance
          - 退还safety_score

      - from: SCHEDULED
        to: COMPLETED
        trigger: system (finalize-plan时自动)
        actor: system
        preconditions: []
        side_effects:
          - 计算final_cost（按时间顺序）
          - cost_balance最终调整

# =============================================================================
# 表 3: 计算规则表
# =============================================================================
calculations:
  - name: provisional_cost
    trigger: "assignment proposal（创建时）和 scheduling（确认时）"
    algorithm: forward_looking
    formula: |
      1. 确定该资源的"相关assignments集合"
         - proposal时: 所有非终态(non-terminal)的assignments
         - scheduling时: 所有 start_minute < 当前procedure.start_minute 的SCHEDULED assignments
      2. total_usage = sum(相关assignments的duration_minutes) + 当前procedure的duration
      3. 判断是否超过THRESHOLD:
         if total_usage > THRESHOLD:
           excess = total_usage - THRESHOLD
           if excess >= duration:
             cost = duration * rate * MULTIPLIER   # 全部双倍
           else:
             normal_part = duration - excess
             cost = normal_part * rate + excess * rate * MULTIPLIER
         else:
           cost = duration * rate
    constants:
      THRESHOLD: 6000    # 100小时 = 6000分钟
      MULTIPLIER: 2      # 超阈值双倍费率
    precision: "2 decimal places, round_half_up"
    note: "proposal和scheduling对同一assignment可能算出不同的provisional_cost"

  - name: is_high_biorisk
    trigger: 与provisional_cost同步计算
    algorithm: threshold
    formula: |
      与provisional_cost计算使用相同的"相关assignments集合"
      if total_usage > THRESHOLD:
        is_high_biorisk = true
      else:
        is_high_biorisk = false
    constants:
      THRESHOLD: 6000

  - name: final_cost
    trigger: plan finalization
    algorithm: chronological
    formula: |
      1. 收集该资源所有SCHEDULED assignments
      2. 按 procedure.start_minute 升序排列
      3. running_total = 0
      4. for each assignment in sorted order:
           running_total += duration
           if running_total > THRESHOLD:
             excess = running_total - THRESHOLD
             if excess >= duration:
               final_cost = duration * rate * MULTIPLIER
             else:
               normal_part = duration - excess
               final_cost = normal_part * rate + excess * rate * MULTIPLIER
           else:
             final_cost = duration * rate
    constants:
      THRESHOLD: 6000
      MULTIPLIER: 2
    precision: "2 decimal places, round_half_up"
    key_insight: |
      provisional_cost（前瞻性、包含所有未解决的）和 final_cost（按时间顺序、
      只看已确认的）对同一组数据可能产生不同结果——这是核心测试难点。

  - name: cost_balance_update
    trigger: assignment创建、schedule、reject、cancel、finalize
    algorithm: aggregation
    formula: |
      创建assignment: cost_balance -= provisional_cost
      schedule: cost_balance += old_provisional - new_provisional  (退旧扣新)
      reject/cancel: cost_balance += provisional_cost  (退款)
      finalize: cost_balance = total_budget - sum(all final_costs)
    note: "plan.updated_at 和 plan.version 随每次 cost_balance 变化而递增"

  - name: patient_safety_score
    trigger: assignment创建、schedule、reject、cancel
    algorithm: aggregation
    formula: |
      创建assignment:
        if is_high_biorisk: safety_score += BIORISK_PENALTY
        if override_protocol_check AND safety_score已达threshold: safety_score += OVERRIDE_PENALTY
      schedule: 重新计算bio-risk状态
        if 原来非high-biorisk现在变成high-biorisk: safety_score += BIORISK_PENALTY
        if 原来high-biorisk现在变成非high-biorisk: safety_score -= BIORISK_PENALTY
      reject/cancel: 退还之前加的所有罚分
      floor: max(0, score)  # 永不为负
    constants:
      BIORISK_PENALTY: 50
      OVERRIDE_PENALTY: 100
      THRESHOLD: 500  # 达到此值则阻止新assignment（除非override）
    note: "验证优先级：先检查safety_score是否会超threshold，再检查budget是否充足"

  - name: sterilization_check
    trigger: assignment proposal
    algorithm: time_gap
    formula: |
      对于同一资源上的两个不同procedure_type的procedures:
        gap = later.start_minute - earlier.end_minute
        if gap < STERILIZATION_GAP:
          reject with ERR_STERILIZATION_TIME_VIOLATION
      同一procedure_type的procedures不需要消毒间隔
    constants:
      STERILIZATION_GAP: 30  # 分钟

  - name: double_booking_check
    trigger: assignment proposal
    algorithm: overlap
    formula: |
      同一资源不能同时被分配到时间重叠的procedures
      overlap = procA.start < procB.end AND procB.start < procA.end

  - name: infection_risk_check
    trigger: assignment proposal
    algorithm: pairing
    formula: |
      如果两个资源被标记为感染风险配对:
        且其中一个资源已有committed（非终态）assignment在某个rotation中
        则另一个资源不能被分配到同一个rotation中的procedure

# =============================================================================
# 表 4: 验证规则表（按优先级排序）
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID 和 X-User-Role headers 必须存在且有效"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "角色是否有权限执行此操作"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "路径中的资源ID是否存在（从左到右依次验证）"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (按资源类型)"
    http_status: 404
    applies_to: all nested resource endpoints
    note: "先验planId，再验rotationId，再验procedureId，第一个不存在即返回"

  - priority: 4
    category: state
    check: "父治疗计划是否为ACTIVE状态"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "创建子资源、修改子资源状态的所有端点"

  - priority: 5
    category: state
    check: "目标资源是否在正确的状态可执行当前操作"
    error_id: "varies (ERR_PROCEDURE_NOT_PENDING, ERR_ASSIGNMENT_NOT_PENDING_SCHEDULE, etc.)"
    http_status: 409
    applies_to: "状态转换端点"

  - priority: 6
    category: business_safety
    check: "资源认证匹配procedure的required_certification"
    error_id: ERR_CERTIFICATION_MISMATCH
    http_status: 400
    applies_to: "POST /assignments (proposal)"

  - priority: 7
    category: business_safety
    check: "消毒时间间隔（不同type的procedures之间≥30分钟）"
    error_id: ERR_STERILIZATION_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /assignments (proposal)"

  - priority: 8
    category: business_safety
    check: "感染风险配对检查（配对资源不能在同一rotation）"
    error_id: ERR_INFECTION_RISK
    http_status: 409
    applies_to: "POST /assignments (proposal)"

  - priority: 9
    category: business_safety
    check: "患者安全评分是否会达到/超过阈值500（且未设置override）"
    error_id: ERR_SAFETY_SCORE_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /assignments (proposal)"

  - priority: 10
    category: business_fiscal
    check: "预算是否充足（provisional_cost ≤ cost_balance）"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 402
    applies_to: "POST /assignments (proposal)"

# =============================================================================
# 表 5: API 端点表（完整 29 个端点）
# =============================================================================
endpoints:
  # --- TreatmentPlan ---
  - method: POST
    path: "/treatment-plans"
    description: "Create a new Treatment Plan"
    roles: [ChargeNurse]
    code: 201
    input: [plan_name, total_budget]
    output: TreatmentPlan
    side_effects: ["cost_balance初始化为total_budget, patient_safety_score初始化为0"]

  - method: GET
    path: "/treatment-plans"
    description: "List all Treatment Plans"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}"
    description: "Get a specific Treatment Plan"
    roles: [Any]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/activate"
    description: "Activate a plan"
    roles: [ChargeNurse]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status → ACTIVE"]

  # --- WardRotation ---
  - method: POST
    path: "/treatment-plans/{planId}/ward-rotations"
    description: "Create a new Ward Rotation within a Plan"
    roles: [AttendingPhysician]
    code: 201
    input: [name, start_minute, end_minute]
    output: WardRotation
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations"
    description: "List Ward Rotations for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "WardRotation[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}"
    description: "Get a specific Ward Rotation"
    roles: [Any]
    code: 200
    input: []
    output: WardRotation
    side_effects: []

  - method: PUT
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}"
    description: "Update a Ward Rotation's status"
    roles: [ChargeNurse]
    code: 200
    input: ["status, version?"]
    output: WardRotation
    side_effects: ["状态转换 + 可能的cascade取消"]

  # --- Procedure ---
  - method: POST
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures"
    description: "Create a new Procedure for a Rotation"
    roles: [AttendingPhysician]
    code: 201
    input: ["procedure_type, required_certification?, start_minute, end_minute"]
    output: Procedure
    side_effects: ["duration_minutes自动计算"]

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures"
    description: "List Procedures for a Rotation"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Procedure[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures/{procedureId}"
    description: "Get a specific Procedure"
    roles: [Any]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures/{procedureId}/cancel"
    description: "Cancel a specific Procedure"
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: Procedure
    side_effects: ["status → CANCELLED（仅PENDING状态可取消）"]

  # --- Assignment ---
  - method: POST
    path: "/treatment-plans/{planId}/assignments"
    description: "Propose a new MedicalResource assignment for a Procedure"
    roles: [AttendingPhysician]
    code: 201
    input: ["procedure_id, resource_id, override_protocol_check?"]
    output: Assignment
    side_effects:
      - "计算provisional_cost（前瞻性）"
      - "扣减cost_balance"
      - "计算is_high_biorisk"
      - "更新patient_safety_score"
      - "procedure状态 → SCHEDULED"
      - "触发完整验证链（认证、消毒、感染、安全评分、预算）"

  - method: GET
    path: "/treatment-plans/{planId}/assignments"
    description: "List all Assignments for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/assignments/{assignmentId}"
    description: "Get a specific Assignment"
    roles: [Any]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/reject"
    description: "Reject a proposed Assignment"
    roles: [ChargeNurse]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → REJECTED"
      - "procedure回退到PENDING"
      - "退还provisional_cost到cost_balance"
      - "退还safety_score罚分"

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/cancel"
    description: "Cancel an Assignment"
    roles: [ChargeNurse]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → CANCELLED"
      - "procedure回退到PENDING（如果是从SCHEDULED cancel则从ASSIGNED回退）"
      - "退还provisional_cost到cost_balance"
      - "退还safety_score罚分"

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/protocol-approve"
    description: "Protocol Approve a proposed Assignment"
    roles: [ChargeNurse]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → PROTOCOL_APPROVED"]

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/schedule"
    description: "Schedule a Protocol Approved Procedure"
    roles: [ChargeNurse]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → SCHEDULED"
      - "procedure状态 → ASSIGNED"
      - "重新计算provisional_cost（按chronological视角，只看start_minute之前的SCHEDULED assignments）"
      - "cost_balance调整（退旧provisional + 扣新provisional）"
      - "is_high_biorisk可能变化"
      - "patient_safety_score可能调整"

  # --- MedicalResource ---
  - method: POST
    path: "/treatment-plans/{planId}/medical-resources"
    description: "Create a new Medical Resource profile for a Plan"
    roles: [AttendingPhysician]
    code: 201
    input: [resource_name, resource_model, operating_cost_per_minute]
    output: MedicalResource
    side_effects: ["resource_certifications初始化为空数组"]

  - method: GET
    path: "/treatment-plans/{planId}/medical-resources"
    description: "List Medical Resource profiles for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "MedicalResource[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/medical-resources/{resourceId}"
    description: "Get a specific Medical Resource profile"
    roles: [Any]
    code: 200
    input: []
    output: MedicalResource
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/medical-resources/{resourceId}/certifications"
    description: "Add a certification to a Medical Resource"
    roles: [AttendingPhysician]
    code: 200
    input: ["name (BSL-3_CERTIFIED | CARDIAC_CATHETERIZATION_LAB), applied_date"]
    output: MedicalResource
    side_effects: ["认证添加到resource_certifications数组"]

  # --- InfectionRiskPairing ---
  - method: POST
    path: "/treatment-plans/{planId}/infection-risk-pairings"
    description: "Create an Infection Risk Pairing within a Plan"
    roles: [ChargeNurse]
    code: 201
    input: ["resource_id_1, resource_id_2, reason?"]
    output: InfectionRiskPairing
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/infection-risk-pairings"
    description: "List Infection Risk Pairings for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "InfectionRiskPairing[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/infection-risk-pairings/{pairingId}"
    description: "Get a specific Infection Risk Pairing"
    roles: [Any]
    code: 200
    input: []
    output: InfectionRiskPairing
    side_effects: []

  # --- Plan Lifecycle ---
  - method: POST
    path: "/treatment-plans/{planId}/initiate-final-review"
    description: "Move a plan to the final review pending state"
    roles: [ChargeNurse]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "status → FINAL_REVIEW_PENDING"
      - "前提：无未解决的assignments（ERR_UNRESOLVED_ASSIGNMENTS_EXIST）"

  - method: POST
    path: "/treatment-plans/{planId}/finalize-plan"
    description: "Finalize costs and complete the plan"
    roles: [HospitalAdministrator]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "status → COMPLETED"
      - "所有SCHEDULED assignments → 计算final_cost → COMPLETED"
      - "所有ASSIGNED procedures → COMPLETED"
      - "所有READY_FOR_ASSIGNMENT rotations → COMPLETED"
      - "cost_balance最终结算"
      - "前提：sum(final_costs) ≤ total_budget（ERR_FINALIZATION_EXCEEDS_BUDGET）"

# =============================================================================
# 表 6: 错误码目录（完整 32 个错误码）
# =============================================================================
errors:
  # --- 认证与权限 ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID 或 X-User-Role header 缺失或无效"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "当前角色无权执行此操作"

  # --- 资源不存在 ---
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "planId 对应的治疗计划不存在"

  - id: ERR_ROTATION_NOT_FOUND
    http: 404
    condition: "rotationId 对应的轮班不存在"

  - id: ERR_PROCEDURE_NOT_FOUND
    http: 404
    condition: "procedureId 对应的手术不存在"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "resourceId 对应的医疗资源不存在"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId 对应的分配不存在"

  - id: ERR_PAIRING_NOT_FOUND
    http: 404
    condition: "pairingId 对应的感染风险配对不存在"

  # --- 状态约束 ---
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "操作要求治疗计划处于ACTIVE状态，但当前不是"

  - id: ERR_PLAN_NOT_IN_PLANNING
    http: 409
    condition: "操作要求治疗计划处于PLANNING状态（如activate），但当前不是"

  - id: ERR_PLAN_NOT_READY_FOR_FINALIZATION
    http: 409
    condition: "finalize-plan要求plan处于FINAL_REVIEW_PENDING状态"

  - id: ERR_PROCEDURE_NOT_PENDING
    http: 409
    condition: "创建assignment时procedure必须为PENDING状态"

  - id: ERR_PROCEDURE_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "取消procedure时必须为PENDING状态"

  - id: ERR_PROCEDURE_NOT_SCHEDULED
    http: 409
    condition: "某些操作要求procedure处于SCHEDULED状态"

  - id: ERR_ASSIGNMENT_NOT_PENDING_SCHEDULE
    http: 409
    condition: "protocol-approve/reject要求assignment处于PENDING_SCHEDULE状态"

  - id: ERR_ASSIGNMENT_NOT_PROTOCOL_APPROVED
    http: 409
    condition: "schedule要求assignment处于PROTOCOL_APPROVED状态"

  - id: ERR_ASSIGNMENT_NOT_CANCELLABLE
    http: 409
    condition: "cancel要求assignment处于可取消状态（非终态）"

  - id: ERR_ILLEGAL_ROTATION_STATE_TRANSITION
    http: 409
    condition: "轮班状态转换不合法（如从COMPLETED转到其他状态）"

  # --- 业务验证 ---
  - id: ERR_INVALID_ROTATION_MINUTES
    http: 400
    condition: "轮班的时间参数无效（非整数、end ≤ start、负数等）"

  - id: ERR_INVALID_PROCEDURE_MINUTES
    http: 400
    condition: "手术的时间参数无效（非整数、end ≤ start、负数等）"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "通用请求格式错误（缺少必填字段、类型不匹配等）"

  - id: ERR_CERTIFICATION_MISMATCH
    http: 400
    condition: "资源不具备procedure要求的认证"

  - id: ERR_STERILIZATION_TIME_VIOLATION
    http: 409
    condition: "同一资源上不同类型的procedures之间消毒间隔不足30分钟"

  - id: ERR_INFECTION_RISK
    http: 409
    condition: "已配对的两个资源不能同时出现在同一rotation中（其中一个已有committed assignment）"

  - id: ERR_SELF_PAIRING
    http: 400
    condition: "尝试将资源与自身配对（resource_id_1 == resource_id_2）"

  - id: ERR_DUPLICATE_PAIRING
    http: 409
    condition: "同一plan中已存在相同资源对的配对（无序：{A,B} == {B,A}）"

  # --- 安全与财务 ---
  - id: ERR_SAFETY_SCORE_THRESHOLD_BREACHED
    http: 403
    condition: "新assignment会使patient_safety_score达到/超过500阈值，且未设置override_protocol_check"

  - id: ERR_INSUFFICIENT_BUDGET
    http: 402
    condition: "provisional_cost超过当前cost_balance"

  - id: ERR_FINALIZATION_EXCEEDS_BUDGET
    http: 402
    condition: "finalize时所有final_cost总和超过total_budget"

  # --- 并发控制 ---
  - id: ERR_STALE_DATA
    http: 409
    condition: "请求中的version与服务器当前version不匹配（乐观并发控制）"

  # --- 业务逻辑约束 ---
  - id: ERR_PROCEDURES_NOT_ASSIGNED
    http: 409
    condition: "轮班转READY_FOR_ASSIGNMENT时，并非所有procedures都已ASSIGNED"

  - id: ERR_UNRESOLVED_ASSIGNMENTS_EXIST
    http: 409
    condition: "initiate-final-review时存在未解决的assignments（PENDING_SCHEDULE或PROTOCOL_APPROVED）"

# =============================================================================
# RBAC 角色权限矩阵
# =============================================================================
roles:
  - name: ChargeNurse
    description: "护士长，负责计划管理和流程审批"
    exclusive_operations:
      - "POST /treatment-plans — 创建治疗计划"
      - "POST .../activate — 激活计划"
      - "PUT .../ward-rotations/{id} — 更新轮班状态（含取消）"
      - "POST .../assignments/{id}/protocol-approve — 协议审批"
      - "POST .../assignments/{id}/schedule — 排程确认"
      - "POST .../assignments/{id}/reject — 拒绝分配"
      - "POST .../assignments/{id}/cancel — 取消分配"
      - "POST .../infection-risk-pairings — 创建感染风险配对"
      - "POST .../initiate-final-review — 发起最终审查"

  - name: AttendingPhysician
    description: "主治医师，负责临床资源定义和分配提案"
    exclusive_operations:
      - "POST .../ward-rotations — 创建轮班"
      - "POST .../procedures — 创建手术"
      - "POST .../procedures/{id}/cancel — 取消手术"
      - "POST .../medical-resources — 创建医疗资源"
      - "POST .../medical-resources/{id}/certifications — 添加认证"
      - "POST .../assignments — 提出分配提案"

  - name: HospitalAdministrator
    description: "医院管理员，负责最终结算"
    exclusive_operations:
      - "POST .../finalize-plan — 最终结算计划"

  - name: Any
    description: "所有角色共享"
    shared_operations:
      - "GET /treatment-plans — 查看计划列表"
      - "GET /treatment-plans/{planId} — 查看计划详情"
      - "GET .../ward-rotations — 查看轮班列表"
      - "GET .../ward-rotations/{id} — 查看轮班详情"
      - "GET .../procedures — 查看手术列表"
      - "GET .../procedures/{id} — 查看手术详情"
      - "GET .../assignments — 查看分配列表"
      - "GET .../assignments/{id} — 查看分配详情"
      - "GET .../medical-resources — 查看资源列表"
      - "GET .../medical-resources/{id} — 查看资源详情"
      - "GET .../infection-risk-pairings — 查看配对列表"
      - "GET .../infection-risk-pairings/{id} — 查看配对详情"
