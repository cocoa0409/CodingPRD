            - { call: "POST /grants/conflicts", payload: { panelist_id: "${tpl2}", application_id: "${appB}", relationship_type: SAME_INSTITUTION, disclosure_note: "We teach in the same department." }, as: Panelist, as_user_id: "${tpl2}", captures: { tcf: "$.data.id" } }
            - { call: "POST /grants/conflicts/${tcf}/screen", payload: { disposition: BLOCKING }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${tcyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { rcyc_v: "$.data.version" } }
            - { call: "POST /grants/recommendation-slots/${slotA}/board-action", payload: { action: APPROVE, expected_cycle_version: "${rcyc_v}" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - { call: "POST /grants/conflicts/${tcf}/waive-override", payload: { override_justification: "Shared department only; no supervisory relationship exists." }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${tcyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { rcyc_v2: "$.data.version" } }
            - { call: "POST /grants/recommendation-slots/${slotA}/board-action", payload: { action: APPROVE, expected_cycle_version: "${rcyc_v2}" }, as: CouncilBoardMember, as_user_id: "board-1" }
          assert:
            - "The declaration reads severity \"DISCRETIONARY\"; the BLOCKING screening returns 200 and voids appB's slot"
            - "The first cycle read shows blocking_conflict_count == 1 and posture \"RESTRICTED\""
            - "The first board action returns 409 ERR_CYCLE_POSTURE_RESTRICTED and the rank-1 slot stays \"PROPOSED\" with awarded_amount_cents null"
            - "The waive-override returns 200 with status \"WAIVED\"; the panelist returns to \"SEATED\""
            - "The second cycle read shows blocking_conflict_count == 0 and posture \"OPEN\""
            - "The second board action returns 200 with status \"BOARD_APPROVED\" and awarded_amount_cents == 1500000"

      - name: second_review_for_the_same_round_is_refused_as_duplicate
        claim_type: violation_error
        grounds:
          - validations[error_id=ERR_DUPLICATE_REVIEW]
          - entities.Review.fields.round_number
        distinguishing_aspect: |
          The (application_id, panelist_id, round_number) triple is unique, so a
          second DRAFT review by the same panelist in round 1 is refused with
          ERR_DUPLICATE_REVIEW while a different panelist's review is accepted.
          An implementation keyed only on (application_id, panelist_id) would
          also refuse a legitimate round-2 review, and one with no uniqueness
          check returns 201 and double-counts the panelist at close-round.
        test_recipe:
          setup:
            - "CornerMain panel in SCORING with one DRAFT review by the chair"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
