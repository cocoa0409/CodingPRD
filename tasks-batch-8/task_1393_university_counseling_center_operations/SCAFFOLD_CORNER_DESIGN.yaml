scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation, defaults, computed fields, not-found,
  # type constraints, immutability
  # =====================================================================
  - section: entities
    instances:
      - name: student_creation_defaults_applied
        claim_type: creation_defaults
        grounds:
          - entities.Student.fields.booking_posture
          - entities.Student.fields.no_show_strike_count
        distinguishing_aspect: "Omitting academic_record_flags yields default empty; booking_posture starts CLEAR and strike count 0; system fields id/created_at present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /ucc/students"
              payload: { student_number: "E100", full_name: "Default Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { e1_id: $.data.id, e1_posture: $.data.booking_posture, e1_strikes: $.data.no_show_strike_count, e1_ver: $.data.version }
          trigger: []
          assert:
            - "response code 201; booking_posture == CLEAR; no_show_strike_count == 0; version == 1"
            - "academic_record_flags defaults to empty array"

      - name: student_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - "endpoints[GET /ucc/students/{id}]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ucc/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FrontDesk
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: student_duplicate_student_number_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second POST with the same student_number violates the uniqueness constraint -> ERR_DUPLICATE 409."
        test_recipe:
          setup: ["one student with student_number DUP1"]
          setup_api_calls:
            - call: "POST /ucc/students"
              payload: { student_number: "DUP1", full_name: "First", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
          trigger:
            - call: "POST /ucc/students"
              payload: { student_number: "DUP1", full_name: "Second", enrollment_status: "ENROLLED", funding_model: "INSURANCE" }
              as: FrontDesk
              captures: { err_dup: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE and http status 409"

      - name: intake_assessment_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.IntakeAssessment
        distinguishing_aspect: "IntakeAssessment declares common_fields: false and has no PATCH/PUT endpoint; computed risk fields are set once at creation."
        test_recipe:
          setup: ["one student, one counselor"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-E4", full_name: "Coun E4", specialties: ["TRIAGE"], weekly_individual_capacity: 10, max_caseload_risk_points: 500 }
              as: ClinicalDirector
              captures: { e4_c: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "E400", full_name: "Immut Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { e4_s: $.data.id }
          trigger:
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${e4_s}", screener_id: "${e4_c}", phq9_score: 5, gad7_score: 5, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${e4_c}"
              captures: { e4_ia: $.data.id, e4_pts: $.data.risk_points }
          assert:
            - "risk_points == 10 and no version field exists on the response (common_fields false)"
            - "the API surface exposes no PATCH or PUT route for /ucc/intake-assessments/{id}"

      - name: intake_phq9_out_of_range_rejected
        claim_type: type_constraint
        grounds:
          - entities.IntakeAssessment.fields.phq9_score
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "phq9_score 28 exceeds the 0..27 range -> ERR_INVALID_REQUEST 400 at validation priority 4."
        test_recipe:
          setup: ["one student, one counselor"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-E5", full_name: "Coun E5", specialties: ["TRIAGE"], weekly_individual_capacity: 10, max_caseload_risk_points: 500 }
              as: ClinicalDirector
              captures: { e5_c: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "E500", full_name: "Range Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { e5_s: $.data.id }
          trigger:
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${e5_s}", screener_id: "${e5_c}", phq9_score: 28, gad7_score: 5, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${e5_c}"
              captures: { err_range: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: student_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /ucc/students without funding_model -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ucc/students"
              payload: { student_number: "E600", full_name: "Missing Field", enrollment_status: "ENROLLED" }
              as: FrontDesk
              captures: { err_req: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: student_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - "endpoints[GET /ucc/students]"
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["three students exist"]
          setup_api_calls:
            - call: "POST /ucc/students"
              payload: { student_number: "E701", full_name: "P1", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
            - call: "POST /ucc/students"
              payload: { student_number: "E702", full_name: "P2", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
            - call: "POST /ucc/students"
              payload: { student_number: "E703", full_name: "P3", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
          trigger:
            - call: "GET /ucc/students"
              payload: { limit: 2, offset: 0 }
              as: FrontDesk
          assert:
            - "response envelope contains meta.api_request_id, response_type == 'array', data is a 2-element array"
            - "pagination block reports total_count == 3 and has_more == true"

  # =====================================================================
  # Section: state_machines — valid transitions, invalid-from rejection,
  # terminal lockdown, initial state, guarded transitions
  # =====================================================================
  - section: state_machines
    instances:
      - name: session_double_complete_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Session
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second completion of a COMPLETED (terminal) session -> ERR_INVALID_STATE; terminal-state lockdown."
        test_recipe:
          setup: ["student with OPEN episode; one past session completed once"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-S1", full_name: "Coun S1", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { s1_c: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { s1_pol: $.data.id }
            - call: "POST /ucc/policies/${s1_pol}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "SS100", full_name: "Dbl Comp", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s1_s: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s1_s}", screener_id: "${s1_c}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${s1_c}"
              captures: { s1_ia: $.data.id }
            - call: "POST /ucc/intake-assessments/${s1_ia}/complete"
              payload: { primary_counselor_id: "${s1_c}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${s1_c}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s1_s}" }
              as: Counselor
              as_user_id: "${s1_c}"
              captures: { s1_ep: "$.data[0].id", s1_epv: "$.data[0].version" }
            - call: "POST /ucc/episodes/${s1_ep}/sessions"
              payload: { counselor_id: "${s1_c}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${s1_epv}" }
              as: FrontDesk
              captures: { s1_ses: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /ucc/sessions/${s1_ses}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${s1_c}"
          trigger:
            - call: "POST /ucc/sessions/${s1_ses}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${s1_c}"
              captures: { err_dbl: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and http status 409"
            - "episode.sessions_consumed remains 1 (no double count)"

      - name: group_enrollment_waitlist_promotion_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.GroupEnrollment.ENROLLED_to_DROPPED
          - calculations.group_waitlist_order
        distinguishing_aspect: "Dropping the head enrollee promotes the WAITLISTED entry with earliest created_at; ordering uses created_at and never id."
        test_recipe:
          setup: ["OPEN program capacity 1; students A enrolled, B waitlisted (created later)"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-S2", full_name: "Coun S2", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { s2_c: $.data.id }
            - call: "POST /ucc/group-programs"
              payload: { title: "Tiny Group", facilitator_id: "${s2_c}", capacity: 1, meeting_day: "WED", starts_at: "2026-09-01T17:00:00Z", weeks: 6, risk_band_ceiling: "HIGH" }
              as: Counselor
              as_user_id: "${s2_c}"
              captures: { s2_g: $.data.id }
            - call: "POST /ucc/group-programs/${s2_g}/publish"
              payload: {}
              as: Counselor
              as_user_id: "${s2_c}"
            - call: "POST /ucc/students"
              payload: { student_number: "SG101", full_name: "Stud A", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s2_sa: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "SG102", full_name: "Stud B", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s2_sb: $.data.id }
            - call: "POST /ucc/group-programs/${s2_g}/enrollments"
              payload: { student_id: "${s2_sa}" }
              as: FrontDesk
              captures: { s2_enra: $.data.id, s2_enra_st: $.data.status }
            - call: "POST /ucc/group-programs/${s2_g}/enrollments"
              payload: { student_id: "${s2_sb}" }
              as: FrontDesk
              captures: { s2_enrb: $.data.id, s2_enrb_st: $.data.status }
          trigger:
            - call: "POST /ucc/group-enrollments/${s2_enra}/drop"
              payload: {}
              as: Student
              as_user_id: "${s2_sa}"
            - call: "GET /ucc/group-enrollments"
              payload: { program_id: "${s2_g}" }
              as: FrontDesk
          assert:
            - "first enrollment ENROLLED, second WAITLISTED at creation (capacity 1)"
            - "after drop: enrollment A == DROPPED, enrollment B == ENROLLED (earliest created_at promoted)"

      - name: policy_second_publish_same_term_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SemesterPolicy.DRAFT_to_PUBLISHED
          - errors[ERR_POLICY_CONFLICT]
        distinguishing_aspect: "Publishing a second DRAFT policy for a term that already has a PUBLISHED one -> ERR_POLICY_CONFLICT."
        test_recipe:
          setup: ["one PUBLISHED policy for 2026-FALL; one DRAFT policy for the same term"]
          setup_api_calls:
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { s3_p1: $.data.id }
            - call: "POST /ucc/policies/${s3_p1}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 10, no_show_strike_limit: 4, late_cancel_window_hours: 12 }
              as: ClinicalDirector
              captures: { s3_p2: $.data.id }
          trigger:
            - call: "POST /ucc/policies/${s3_p2}/publish"
              payload: {}
              as: ClinicalDirector
              captures: { err_pol: $.data.error_id }
          assert:
            - "error_id == ERR_POLICY_CONFLICT and http status 409"

      - name: policy_retire_requires_draft_replacement
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SemesterPolicy.PUBLISHED_to_RETIRED
          - errors[ERR_POLICY_CONFLICT]
        distinguishing_aspect: "Retiring a PUBLISHED policy with no DRAFT replacement for the term -> ERR_POLICY_CONFLICT."
        test_recipe:
          setup: ["one PUBLISHED policy for 2026-FALL, no DRAFT"]
          setup_api_calls:
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { s4_p1: $.data.id }
            - call: "POST /ucc/policies/${s4_p1}/publish"
              payload: {}
              as: ClinicalDirector
          trigger:
            - call: "POST /ucc/policies/${s4_p1}/retire"
              payload: {}
              as: ClinicalDirector
              captures: { err_ret: $.data.error_id }
          assert:
            - "error_id == ERR_POLICY_CONFLICT and http status 409"

      - name: episode_reopen_creates_child_episode_with_prior_link
        claim_type: valid_transition
        grounds:
          - state_machines.CareEpisode.CLOSED_to_REOPENED
          - entities.CareEpisode.fields.prior_episode_id
        distinguishing_aspect: "Reopen on a CLOSED episode consumes a still-PENDING fresher intake (band LOW/MODERATE), completes it as SHORT_TERM_CARE, and spawns a NEW OPEN episode whose prior_episode_id points at the closed one; sessions_consumed restarts at 0."
        test_recipe:
          setup: ["student with episode closed (no scheduled sessions); a second MODERATE intake created AFTER closure and left PENDING"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-S5", full_name: "Coun S5", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { s5_c: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { s5_pol: $.data.id }
            - call: "POST /ucc/policies/${s5_pol}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "SS500", full_name: "Reopen Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s5_s: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s5_s}", screener_id: "${s5_c}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${s5_c}"
              captures: { s5_ia1: $.data.id }
            - call: "POST /ucc/intake-assessments/${s5_ia1}/complete"
              payload: { primary_counselor_id: "${s5_c}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${s5_c}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s5_s}" }
              as: Counselor
              as_user_id: "${s5_c}"
              captures: { s5_ep1: "$.data[0].id" }
            - call: "POST /ucc/episodes/${s5_ep1}/close"
              payload: {}
              as: Counselor
              as_user_id: "${s5_c}"
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s5_s}", screener_id: "${s5_c}", phq9_score: 12, gad7_score: 6, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${s5_c}"
              captures: { s5_ia2: $.data.id }
          trigger:
            # ia2 stays PENDING (never completed); reopen consumes it and completes it as SHORT_TERM_CARE
            - call: "POST /ucc/episodes/${s5_ep1}/reopen"
              payload: { intake_assessment_id: "${s5_ia2}", academic_term: "2026-FALL" }
              as: Counselor
              as_user_id: "${s5_c}"
              captures: { s5_ep2: $.data.id, s5_ep2_prior: $.data.prior_episode_id, s5_ep2_consumed: $.data.sessions_consumed, s5_ep2_st: $.data.status }
          assert:
            - "new episode status == OPEN and sessions_consumed == 0"
            - "new episode.prior_episode_id == the closed episode's id (self-referential link)"
            - "old episode transitions CLOSED -> REOPENED (terminal) and remains readable via GET"

      - name: crisis_visit_room_second_visit_blocked
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=10]
          - errors[ERR_ROOM_OCCUPIED]
        distinguishing_aspect: "Two QUEUED visits on one shift: rooming the second while the first is IN_ROOM -> ERR_ROOM_OCCUPIED (single-room serialization)."
        test_recipe:
          setup: ["claimed shift; two QUEUED visits V1 V2; V1 roomed"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-S6", full_name: "Coun S6", specialties: ["CRISIS"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { s6_c: $.data.id }
            - call: "POST /ucc/crisis-shifts"
              payload: { coverage_date: "2026-08-01", shift_kind: "WALK_IN", starts_at: "2026-08-01T08:00:00Z", ends_at: "2026-08-01T20:00:00Z" }
              as: ClinicalDirector
              captures: { s6_sh: $.data.id, s6_shv: $.data.version }
            - call: "POST /ucc/crisis-shifts/${s6_sh}/claim"
              payload: { expected_crisis_shift_version: "${s6_shv}" }
              as: Counselor
              as_user_id: "${s6_c}"
            - call: "POST /ucc/students"
              payload: { student_number: "SS601", full_name: "V1 Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s6_sa: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "SS602", full_name: "V2 Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s6_sb: $.data.id }
            - call: "POST /ucc/crisis-visits"
              payload: { student_id: "${s6_sa}", shift_id: "${s6_sh}", presenting_risk_band: "HIGH" }
              as: TriageScreener
              as_user_id: "${s6_c}"
              captures: { s6_v1: $.data.id }
            - call: "POST /ucc/crisis-visits"
              payload: { student_id: "${s6_sb}", shift_id: "${s6_sh}", presenting_risk_band: "MODERATE" }
              as: TriageScreener
              as_user_id: "${s6_c}"
              captures: { s6_v2: $.data.id }
            - call: "POST /ucc/crisis-visits/${s6_v1}/room"
              payload: {}
              as: Counselor
              as_user_id: "${s6_c}"
          trigger:
            - call: "POST /ucc/crisis-visits/${s6_v2}/room"
              payload: {}
              as: Counselor
              as_user_id: "${s6_c}"
              captures: { err_room2: $.data.error_id }
          assert:
            - "error_id == ERR_ROOM_OCCUPIED and http status 409"
            - "V2 remains QUEUED"

      - name: referral_lapse_after_window
        claim_type: valid_transition
        grounds:
          - state_machines.CommunityReferral.PENDING_to_LAPSED
        distinguishing_aspect: "A referral left PENDING past REFERRAL_LAPSE_DAYS auto-lapses when the clock advances; system-triggered transition observable after clock set."
        test_recipe:
          setup: ["HIGH-band student -> PENDING referral; clock advanced 31 days"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-S7", full_name: "Coun S7", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { s7_c: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "SS700", full_name: "Lapse Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s7_s: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s7_s}", screener_id: "${s7_c}", phq9_score: 20, gad7_score: 20, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${s7_c}"
              captures: { s7_ia: $.data.id }
            - call: "POST /ucc/intake-assessments/${s7_ia}/complete"
              payload: {}
              as: TriageScreener
              as_user_id: "${s7_c}"
            - call: "GET /ucc/referrals"
              payload: { student_id: "${s7_s}" }
              as: ReferralCoordinator
              captures: { s7_r: "$.data[0].id", s7_r_st: "$.data[0].status" }
          trigger:
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ClinicalDirector
            - call: "GET /ucc/referrals/${s7_r}"
              payload: {}
              as: ReferralCoordinator
              captures: { s7_r_end: $.data.status }
          assert:
            - "referral status == PENDING before clock advance"
