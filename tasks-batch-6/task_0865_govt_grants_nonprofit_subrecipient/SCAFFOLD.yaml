    side_effects: ["set reimbursable_cents=0", "credit subaward.obligated_cents back"]
  - method: POST
    path: "/drawdowns/{id}/resubmit"
    description: "Resubmit a returned drawdown (RETURNED->SUBMITTED); re-debits obligation."
    roles: [Subrecipient]
    code: 200
    input: []
    output: Drawdown
    side_effects: ["recompute provisional_reimbursable_cents", "re-debit subaward.obligated_cents"]
  - method: POST
    path: "/drawdowns/{id}/pay"
    description: "Disburse an approved drawdown (APPROVED->PAID)."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Drawdown
    side_effects: ["add reimbursable_cents to subaward.disbursed_cents", "recompute nonprofit.cumulative_federal_expenditures_cents"]

  - method: POST
    path: "/subawards/{id}/risk-assessments"
    description: "Run a risk assessment on a subaward (weighted scoring + tier)."
    roles: [GrantsManager]
    code: 201
    input: []
    output: RiskAssessment
    side_effects: ["compute risk_score and risk_tier", "update nonprofit.latest_risk_tier"]
  - method: GET
    path: "/subawards/{id}/risk-assessments"
    description: "List a subaward's risk assessments (reverse reachability for RiskAssessment.subaward_id)."
    roles: [ProgramOfficer, GrantsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  - method: POST
    path: "/subawards/{id}/monitoring-visits"
    description: "Schedule a monitoring visit; rejects windows overlapping another visit by the same monitor."
    roles: [GrantsManager]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: MonitoringVisit
    side_effects: ["set monitor_user_id = X-User-ID"]
  - method: POST
    path: "/monitoring-visits/{id}/conduct"
    description: "Conduct a scheduled visit (SCHEDULED->CONDUCTED); may raise a Finding and cascade a suspension."
    roles: [GrantsManager]
    code: 200
    input: [outcome, "finding_severity?"]
    output: MonitoringVisit
    side_effects: ["set outcome", "optionally create Finding", "if CRITICAL: cascade suspend subaward"]
  - method: GET
    path: "/subawards/{id}/monitoring-visits"
    description: "List a subaward's monitoring visits (reverse reachability for MonitoringVisit.subaward_id)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MonitoringVisit[]
    side_effects: []

  - method: POST
    path: "/subawards/{id}/performance-reports"
    description: "Submit a performance/outcome report for a subaward."
    roles: [Subrecipient]
    code: 201
    input: [reporting_period_start, reporting_period_end, metric_target, metric_actual, "outcome_narrative?"]
    output: PerformanceReport
    side_effects: ["compute on_track"]
  - method: GET
    path: "/subawards/{id}/performance-reports"
    description: "List a subaward's performance reports (reverse reachability for PerformanceReport.subaward_id)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceReport[]
    side_effects: []

  - method: POST
    path: "/nonprofits/{id}/single-audits"
    description: "Submit a single audit for a nonprofit; computes audit_required from the threshold."
    roles: [Subrecipient]
    code: 201
    input: [fiscal_year, total_federal_expenditures_cents, material_weakness, reported_finding_count]
    output: SingleAudit
    side_effects: ["compute audit_required"]
  - method: POST
    path: "/single-audits/{id}/accept"
    description: "Accept a submitted single audit (SUBMITTED->ACCEPTED); if material_weakness, raise a Finding on the selected active subaward."
    roles: [GrantsManager]
    code: 200
    input: []
    output: SingleAudit
    side_effects: ["if material_weakness: create Finding on selected ACTIVE subaward"]

  - method: GET
    path: "/subawards/{id}/findings"
    description: "List a subaward's findings (reverse reachability for Finding.subaward_id)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []
  - method: POST
    path: "/findings/{id}/submit-cap"
    description: "Submit a corrective action plan (OPEN->CAP_SUBMITTED)."
    roles: [Subrecipient]
    code: 200
    input: [corrective_action_plan, "cap_due_date?"]
    output: Finding
    side_effects: ["store corrective_action_plan"]
  - method: POST
    path: "/findings/{id}/accept-cap"
    description: "Accept a corrective action plan (CAP_SUBMITTED->CAP_ACCEPTED)."
    roles: [GrantsManager]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: POST
    path: "/findings/{id}/reject-cap"
    description: "Reject a corrective action plan (CAP_SUBMITTED->OPEN)."
    roles: [GrantsManager]
    code: 200
    input: ["reason?"]
    output: Finding
    side_effects: ["clear corrective_action_plan"]
  - method: POST
    path: "/findings/{id}/resolve"
    description: "Resolve a finding (CAP_ACCEPTED->RESOLVED)."
    roles: [GrantsManager]
    code: 200
    input: []
    output: Finding
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting Subrecipient's X-User-ID is not the owning nonprofit of the target resource."
  - id: ERR_SOD_CONFLICT
    http: 403
    condition: "GrantsManager approving a drawdown authored a RiskAssessment on the same subaward (four-eyes)."
  - id: ERR_NONPROFIT_NOT_FOUND
    http: 404
    condition: "Nonprofit id does not exist."
  - id: ERR_NOFO_NOT_FOUND
    http: 404
    condition: "NOFO id does not exist."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Application id does not exist."
  - id: ERR_SUBAWARD_NOT_FOUND
    http: 404
    condition: "Subaward id does not exist."
  - id: ERR_DRAWDOWN_NOT_FOUND
    http: 404
    condition: "Drawdown id does not exist."
  - id: ERR_MONITORING_VISIT_NOT_FOUND
    http: 404
    condition: "MonitoringVisit id does not exist."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "Finding id does not exist."
  - id: ERR_SINGLE_AUDIT_NOT_FOUND
    http: 404
    condition: "SingleAudit id does not exist."
  - id: ERR_INTAKE_CLOSED
    http: 409
    condition: "Submitting a new (DRAFT) application after the NOFO intake is CLOSED."
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "Application transition attempted from a state that does not allow it."
  - id: ERR_APPLICATION_NOT_SCORED
    http: 409
    condition: "Award/reject attempted on an application not in SCORED."
  - id: ERR_DUPLICATE_REVIEW
    http: 409
    condition: "Panelist already reviewed this application."
  - id: ERR_INVALID_SUBAWARD_STATE
    http: 409
    condition: "Subaward transition attempted from a state that does not allow it."
  - id: ERR_SUBAWARD_NOT_ACTIVE
    http: 409
    condition: "Drawdown create/resubmit against a subaward not in ACTIVE."
  - id: ERR_NO_BUDGET_LINES
    http: 409
    condition: "Activation attempted with zero budget lines."
  - id: ERR_INDIRECT_RATE_REQUIRED
    http: 409
    condition: "NEGOTIATED indirect method without a negotiated_indirect_rate at activation."
  - id: ERR_BUDGET_NOT_BALANCED
    http: 409
    condition: "direct_sum + indirect != total_budget_cents at activation."
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "Monitoring visit window overlaps another visit by the same monitor (half-open)."
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "Awarded subaward period overlaps another non-terminal subaward of the same nonprofit under the same NOFO within the gap buffer."
  - id: ERR_OPEN_FINDINGS
    http: 409
    condition: "Closeout attempted while a Finding on the subaward is not RESOLVED."
  - id: ERR_MAX_AWARD_EXCEEDED
    http: 409
    condition: "Award amount exceeds NOFO.max_award_cents."
  - id: ERR_POOL_EXCEEDED
    http: 409
    condition: "Award amount exceeds NOFO.remaining_pool_cents."
  - id: ERR_INSUFFICIENT_BUDGET
    http: 409
    condition: "Drawdown requested amount exceeds subaward available (total_budget - obligated)."
  - id: ERR_INVALID_DRAWDOWN_STATE
    http: 409
    condition: "Drawdown transition attempted from a state that does not allow it."
  - id: ERR_INVALID_FINDING_STATE
    http: 409
    condition: "Finding transition attempted from a state that does not allow it."
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "Monitoring visit conduct attempted from a non-SCHEDULED state."
  - id: ERR_INVALID_AUDIT_STATE
    http: 409
    condition: "Single audit accept attempted from a non-SUBMITTED state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_subaward_version does not match the current Subaward.version on drawdown create."
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, invalid enum, or malformed body."
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "period_end / proposed_period_end not strictly after its start."
  - id: ERR_AMOUNT_NOT_POSITIVE
    http: 422
    condition: "A required money amount is <= 0."
  - id: ERR_INDIRECT_RATE_OVER_CAP
    http: 422
    condition: "negotiated_indirect_rate exceeds NOFO.indirect_cost_cap_pct at application submit."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ProgramOfficer
    description: "Agency grants program officer: runs NOFOs, awards, subaward setup/activation, closeout, and disbursement."
    identity: "opaque"
    exclusive_operations:
      - "POST /nofos, POST /nofos/{id}/close-intake"
      - "POST /applications/{id}/start-review, request-revision, award, reject"
      - "POST /nonprofits"
      - "POST /subawards/{id}/budget-lines, activate, terminate, initiate-closeout, close"
      - "POST /drawdowns/{id}/pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
  - name: Panelist
    description: "Independent review panelist who scores applications. X-User-ID identifies the panelist for duplicate-review uniqueness."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/reviews"
    shared_operations:
      - "GET /applications, GET /applications/{id}, GET /applications/{id}/reviews, GET /nofos/{id}, GET /nonprofits/{id}, GET /subawards, GET /subawards/{id}"
  - name: GrantsManager
    description: "Post-award manager: risk assessment, monitoring, drawdown review, single-audit acceptance, findings. X-User-ID is the four-eyes SoD basis vs risk assessment."
    identity: "opaque"
    exclusive_operations:
      - "POST /subawards/{id}/risk-assessments, suspend, reinstate"
      - "POST /subawards/{id}/monitoring-visits, POST /monitoring-visits/{id}/conduct"
      - "POST /drawdowns/{id}/approve, return"
      - "POST /single-audits/{id}/accept"
      - "POST /findings/{id}/accept-cap, reject-cap, resolve"
    shared_operations:
      - "GET endpoints"
  - name: Subrecipient
    description: "Nonprofit grantee acting on its own applications, subawards, drawdowns, reports, audits, and CAPs."
    identity: "entity_backed:Nonprofit"
    exclusive_operations:
      - "POST /nofos/{id}/applications, POST /applications/{id}/submit"
      - "POST /subawards/{id}/drawdowns, POST /drawdowns/{id}/resubmit"
      - "POST /subawards/{id}/performance-reports"
      - "POST /nonprofits/{id}/single-audits"
      - "POST /findings/{id}/submit-cap"
    shared_operations:
      - "GET endpoints scoped to owned resources"

constants_global:
  MIN_PANEL_REVIEWS: 3
  SUBAWARD_PERIOD_GAP_DAYS: 30
  SINGLE_AUDIT_THRESHOLD_CENTS: 75000000
  DE_MINIMIS_INDIRECT_RATE: 0.10
  MTDC_SUBAWARD_CAP_CENTS: 2500000
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
