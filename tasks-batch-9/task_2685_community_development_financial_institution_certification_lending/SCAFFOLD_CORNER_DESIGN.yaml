# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe for
# task_2685 Community Development Financial Institution Certification & Lending.
# Every instance is authored against SCAFFOLD.yaml's own §1.1-§1.7 declarations;
# `excluded_because:` stubs point at the §1.8 instance that already asserts the corner.
# The logical clock defaults to 2026-08-01T00:00:00Z; recipes that depend on a
# different instant set it explicitly through POST /cdfi/_clock/set_current_utc.
scaffold_corner_design:
  - section: entities
    instances:
      - name: institution_creation_returns_declared_defaults_and_zeroed_ledgers
        claim_type: creation
        grounds:
          - entities.Institution
          - endpoints[POST /cdfi/institutions]
          - entities.Institution.fields.loss_reserve_balance_cents
        distinguishing_aspect: |
          A brand-new Institution must come back with version 1, certification_state
          UNCERTIFIED, compliance_posture COMPLIANT and reserve_coverage_ratio 1.0000 - the
          empty-book pin, NOT 0.0000 - while every impact and portfolio counter is 0 and the
          omitted loss_reserve_balance_cents takes its declared default of 0.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000001", entity_type: "CREDIT_UNION", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS" }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id, created_status: $.status }
          assert:
            - "${created_status} == 201"
            - "Institution.${inst_id}.legal_name == Harborline Community Fund"
            - "Institution.${inst_id}.ein == 210000001"
            - "Institution.${inst_id}.entity_type == CREDIT_UNION"
            - "Institution.${inst_id}.asset_size_cents == 250000000"
            - "Institution.${inst_id}.loss_reserve_balance_cents == 0"
            - "Institution.${inst_id}.certification_state == UNCERTIFIED"
            - "Institution.${inst_id}.compliance_posture == COMPLIANT"
            - "Institution.${inst_id}.reserve_coverage_ratio == 1.0000"
            - "Institution.${inst_id}.loss_reserve_required_cents == 0"
            - "Institution.${inst_id}.accountability_score == 0.0000"
            - "Institution.${inst_id}.accountability_satisfied == false"
            - "Institution.${inst_id}.governing_seats_active == 0"
            - "Institution.${inst_id}.target_market_lending_pct == 0.00"
            - "Institution.${inst_id}.jobs_created_total == 0"
            - "Institution.${inst_id}.certified_at == null"
            - "Institution.${inst_id}.version == 1"
      - name: loan_retrieval_returns_the_stored_pricing_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /cdfi/loans/{loan_id}]
          - entities.Loan
        distinguishing_aspect: |
          GET /cdfi/loans/{loan_id} must echo the exact persisted pricing row written at
          underwriting (dti_pct 12.42, grade A, final_rate_bps 900, monthly_payment_cents
          24167) rather than recomputing anything on read; the two state dimensions read back
          independently as UNDERWRITING and NOT_DISBURSED.
        test_recipe:
          setup:
            - "One institution with one product and one GEOCODED borrower."
            - "One loan for 1,000,000 cents underwritten with verified income 1,000,000 and existing debt 100,000 at credit score 740."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000002", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /cdfi/loans/${loan_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
          trigger:
            - call: "GET /cdfi/loans/${loan_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { read_status: $.status, read_dti: $.data.dti_pct, read_grade: $.data.risk_grade, read_payment: $.data.monthly_payment_cents, read_uw: $.data.underwriting_state, read_sv: $.data.servicing_state }
          assert:
            - "${read_status} == 200"
            - "${read_dti} == 12.42"
            - "${read_grade} == A"
            - "${read_payment} == 24167"
            - "${read_uw} == UNDERWRITING"
            - "${read_sv} == NOT_DISBURSED"
            - "Loan.${loan_id}.provisional_monthly_payment_cents == 24167"
            - "Loan.${loan_id}.risk_spread_bps == 0"
            - "Loan.${loan_id}.final_rate_bps == 900"
            - "Loan.${loan_id}.principal_outstanding_cents == 0"
      - name: institution_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cdfi/institutions]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three institutions on file, limit=2&offset=0 must return two rows with
          total_count 3 and has_more true, while offset=2 returns the single remaining row with
          has_more false - total_count counts the whole filtered set, not the returned page.
        test_recipe:
          setup:
            - "Three institutions created back to back, all in certification_state UNCERTIFIED."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000003", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Riverbend Loan Fund", ein: "210000004", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 150000000, reserve_method: "STATIC_POOL", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Foothill Credit Union", ein: "210000005", entity_type: "CREDIT_UNION", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 900000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
          trigger:
            - call: "GET /cdfi/institutions?limit=2&offset=0"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { p1_count: $.meta.total_count, p1_has_more: $.meta.has_more }
            - call: "GET /cdfi/institutions?limit=2&offset=2"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { p2_count: $.meta.total_count, p2_has_more: $.meta.has_more }
            - call: "GET /cdfi/institutions?certification_state=CERTIFIED"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { filtered_count: $.meta.total_count, filtered_has_more: $.meta.has_more }
          assert:
            - "${p1_count} == 3"
            - "${p1_has_more} == true"
            - "count(GET /cdfi/institutions?limit=2&offset=0) == 2"
            - "${p2_count} == 3"
            - "${p2_has_more} == false"
            - "count(GET /cdfi/institutions?limit=2&offset=2) == 1"
            - "${filtered_count} == 0"
            - "${filtered_has_more} == false"
            - "count(GET /cdfi/institutions?certification_state=CERTIFIED) == 0"
      - name: loan_product_creation_missing_term_months_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=35]
          - endpoints[POST /cdfi/institutions/{institution_id}/loan-products]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          term_months carries no default, so omitting it is a 400 ERR_INVALID_REQUEST at the
          request-shape rung (priority 35) - it must not fall through to a business rule or be
          silently defaulted to any value; no LoanProduct row is created.
        test_recipe:
          setup:
            - "One institution and no loan products."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000006", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Incomplete Product", base_rate_bps: 900, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: [], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { rej_status: $.status, rej_code: $.data.error_id }
          assert:
            - "${rej_status} == 400"
            - "${rej_code} == ERR_INVALID_REQUEST"
            - "count(GET /cdfi/institutions/${inst_id}/loan-products) == 0"
      - name: target_market_defaults_to_draft_with_an_empty_tract_list
        claim_type: defaults
        grounds:
          - entities.TargetMarket.fields.census_tract_codes
          - entities.TargetMarket.fields.state
          - validations[priority=35]
        distinguishing_aspect: |
          A LOW_INCOME_TARGETED_POPULATION market legitimately omits census_tract_codes, which
          must default to the empty array rather than null, and the row starts in DRAFT with
          approved_at null - the paired conditional-shape rule (tracts required only for
          INVESTMENT_AREA) is what makes the omission legal here.
        test_recipe:
          setup:
            - "One institution with no target markets."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000007", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "LOW_INCOME_TARGETED_POPULATION", name: "Households at or below 80 percent AMI", ami_threshold_pct: 80.00 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { tm_status: $.status, tm_id: $.data.id }
          assert:
            - "${tm_status} == 201"
            - "TargetMarket.${tm_id}.census_tract_codes == []"
            - "TargetMarket.${tm_id}.ami_threshold_pct == 80.00"
            - "TargetMarket.${tm_id}.state == DRAFT"
            - "TargetMarket.${tm_id}.approved_at == null"
            - "TargetMarket.${tm_id}.version == 1"
            - "Institution.${inst_id}.accountability_score == 0.0000"
      - name: borrower_income_pct_ami_is_computed_at_creation_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.target_market_attribution
          - entities.Borrower.fields.income_pct_ami
          - endpoints[POST /cdfi/institutions/{institution_id}/borrowers]
        distinguishing_aspect: |
          income_pct_ami is not an input at all: the endpoint accepts only the two money fields
          and the server derives round_half_up(100 * 4,200,000 / 7,000,000, 2) = 60.00 at
          creation. The attribution fields that depend on geocoding stay empty - in_target_market
          is false and matched_target_market_type is null - even though the income already
          qualifies as low income, because no geocode has run yet.
        test_recipe:
          setup:
            - "One institution with no borrowers."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000008", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b_status: $.status, b1_id: $.data.id }
          assert:
            - "${b_status} == 201"
            - "Borrower.${b1_id}.income_pct_ami == 60.00"
            - "Borrower.${b1_id}.in_target_market == false"
            - "Borrower.${b1_id}.geocode_state == UNGEOCODED"
            - "Borrower.${b1_id}.geocode_attempts == 0"
            - "Borrower.${b1_id}.census_tract_code == null"
            - "Borrower.${b1_id}.matched_target_market_type == null"
            - "Borrower.${b1_id}.ta_hours_total == 0.00"
      - name: institution_system_fields_are_server_minted_on_creation
        claim_type: system_fields
        grounds:
          - entities.Institution.fields.certification_state
          - entities.Institution.fields.version
          - endpoints[POST /cdfi/institutions]
        distinguishing_aspect: |
          None of id, version, certification_state, certified_at or recertification_due_at is an
          input on this endpoint: the minimal legal registration body must come back with a
          server-minted id, version exactly 1, certification_state UNCERTIFIED and both
          certification dates null, so no lender can register itself pre-certified.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000009", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS" }
              as: InstitutionOfficer
              captures: { ins_status: $.status, inst_id: $.data.id }
          assert:
            - "${ins_status} == 201"
            - "Institution.${inst_id}.loss_reserve_balance_cents == 0"
            - "Institution.${inst_id}.version == 1"
            - "Institution.${inst_id}.certification_state == UNCERTIFIED"
            - "Institution.${inst_id}.certified_at == null"
            - "Institution.${inst_id}.recertification_due_at == null"
      - name: borrower_credit_score_above_the_declared_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.Borrower.fields.credit_score
          - validations[priority=35]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          credit_score is declared null-or-300-to-850 inclusive, so 900 is a shape violation
          (400) and not an underwriting-tier failure (422): the range is enforced at request
          parse time, before any business rule reads the score.
        test_recipe:
          setup:
            - "One institution with no borrowers."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000010", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Out Of Range", street_address: "1 Test Way", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 900 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { s1: $.status, c1: $.data.error_id }
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "METRO_AREA", name: "Bad Enum Market" }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { s2: $.status, c2: $.data.error_id }
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "INVESTMENT_AREA", name: "Tractless Investment Area", census_tract_codes: [] }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { s3: $.status, c3: $.data.error_id }
          assert:
            - "${s1} == 400"
            - "${c1} == ERR_INVALID_REQUEST"
            - "${s2} == 400"
            - "${c2} == ERR_INVALID_REQUEST"
            - "${s3} == 400"
            - "${c3} == ERR_INVALID_REQUEST"
            - "count(GET /cdfi/institutions/${inst_id}/borrowers) == 0"
            - "count(GET /cdfi/institutions/${inst_id}/target-markets) == 0"
      - name: loan_creation_rejects_a_borrower_owned_by_another_institution
        claim_type: parent_relationships
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - errors.ERR_BORROWER_NOT_FOUND
          - errors.ERR_LOAN_PRODUCT_NOT_FOUND
          - endpoints[POST /cdfi/loans]
        distinguishing_aspect: |
          POST /cdfi/loans carries three cross-aggregate references in its body, and the
          existence rung resolves each one WITHIN the addressed institution: a borrower or
          product that exists but belongs to institution B is a 404 for institution A, not a
          403 and not a successful loan. This is the graph-topology integrity claim the
          hierarchical URL form cannot express.
        test_recipe:
          setup:
            - "Institution A with product PA and no borrowers of its own."
            - "Institution B with borrower BB and product PB."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Alpha Community Fund", ein: "210000011", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { a_id: $.data.id }
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Beta Community Fund", ein: "210000012", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { b_id: $.data.id }
            - call: "POST /cdfi/institutions/${a_id}/loan-products"
              payload: { name: "Alpha Product", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: [], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${a_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /cdfi/institutions/${b_id}/loan-products"
              payload: { name: "Beta Product", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: [], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${b_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /cdfi/institutions/${b_id}/borrowers"
              payload: { full_name: "Beta Borrower", street_address: "9 Beta Street", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${b_id}"
              captures: { bb_id: $.data.id }
          trigger:
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${a_id}", borrower_id: "${bb_id}", product_id: "${pa_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${a_id}"
              captures: { s_borrower: $.status, c_borrower: $.data.error_id }
            - call: "POST /cdfi/institutions/${a_id}/borrowers"
              payload: { full_name: "Alpha Borrower", street_address: "1 Alpha Street", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${a_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${a_id}", borrower_id: "${ba_id}", product_id: "${pb_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${a_id}"
              captures: { s_product: $.status, c_product: $.data.error_id }
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${a_id}", borrower_id: "${ba_id}", product_id: "${pa_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${a_id}"
              captures: { s_ok: $.status, loan_id: $.data.id }
          assert:
            - "${s_borrower} == 404"
            - "${c_borrower} == ERR_BORROWER_NOT_FOUND"
            - "${s_product} == 404"
            - "${c_product} == ERR_LOAN_PRODUCT_NOT_FOUND"
            - "${s_ok} == 201"
            - "Loan.${loan_id}.underwriting_state == SCREENING"
            - "Loan.${loan_id}.servicing_state == NOT_DISBURSED"
            - "count(GET /cdfi/loans?institution_id=${a_id}) == 1"
            - "count(GET /cdfi/loans?institution_id=${b_id}) == 0"
  - section: state_machines
    instances:
      - name: target_market_approval_stamps_approved_at_and_rescores_accountability
        claim_type: valid_transition
        grounds:
          - state_machines.TargetMarket.DRAFT_to_APPROVED
          - calculations.accountability_representation_score
          - entities.TargetMarket.fields.approved_at
        distinguishing_aspect: |
          Approval is not a status flip: it stamps approved_at from the logical clock AND
          re-runs the accountability score, because a representing seat only counts once the
          market it points at is APPROVED. The score therefore jumps 0.0000 -> 1.0000 on a
          request that touches no BoardSeat row at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One institution with one DRAFT INVESTMENT_AREA market and two ACTIVE GOVERNING_BOARD seats, both flagged represents_target_market with target_market_id pointing at that DRAFT market."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
