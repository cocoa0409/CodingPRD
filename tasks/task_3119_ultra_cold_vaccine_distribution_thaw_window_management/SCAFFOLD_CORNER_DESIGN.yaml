  - section: consistency_model
    instances:

      - name: every_side_effect_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/site-orders/{id}/accept
          - entities.AllocationEntitlement.fields.held_cartons
        distinguishing_aspect: "The acceptance response itself already carries the recomputed carton quantity and rounding fields, and a subsequent read of the entitlement shows the new held count with no second request needed."
        test_recipe:
          setup:
            - "The anchored base fixture with one submitted order."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - *x_win
            - *x_open
            - *x_ent
            - *x_site
            - *x_verify
            - *x_order
            - call: "POST /vaccine-distribution/site-orders/${order_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
              captures: { same_response_accepted: "$.data.accepted_doses", same_response_shortfall: "$.data.min_order_shortfall_cartons" }
            - call: "GET /vaccine-distribution/allocation-entitlements/${ent_id}"
              payload: {}
              as: DistributionPlanner
              captures: { held_after: "$.data.held_cartons", available_after: "$.data.available_cartons" }
          assert:
            - "same_response_accepted == 2340 and same_response_shortfall == 0 inside the acceptance response itself"
            - "held_after == 2 and available_after == 8 on the very next read"
            - "AllocationWindow.${win_id}.accepted_cartons == 2"
            - "no second write request was needed to observe any of these values"
