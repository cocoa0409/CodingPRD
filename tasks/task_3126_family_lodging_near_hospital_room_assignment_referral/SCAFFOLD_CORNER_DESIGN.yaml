              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id, sr_v_pre: $.data.version }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v_post: $.data.version }
          trigger:
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v_pre}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v_post}" }
