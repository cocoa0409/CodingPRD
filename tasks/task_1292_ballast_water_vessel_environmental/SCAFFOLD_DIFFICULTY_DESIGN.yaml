# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Derived from SCAFFOLD.yaml §1.1–§1.7. Nine Difficulty Rules (§0.5), ≥2 instances each.
# Fixture conventions used throughout (all literals pinned):
#   clock default 2026-08-01T00:00:00Z; vessel capacity 30000 m3; plan rev1 exchange_distance_nm 200;
#   voyages depart 2026-07-28T00:00:00Z; ballast events late July 2026 (<= clock, inside voyage window).
scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — dual_variant_calc (two variants, different entity domains)
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: determination_provisional_vs_final_variant_divergence
        grounds:
          - calculations.exchange_vs_treatment_determination
          - state_machines.Voyage.PENDING_to_IN_PROGRESS
          - state_machines.Voyage.IN_PROGRESS_to_COMPLIANT
        distinguishing_aspect: |
          On the Voyage/ComplianceDetermination entity domain, the provisional_at_departure variant
          (trigger_reason=VOYAGE_DEPARTURE, zero DISCHARGE events) yields INSUFFICIENT_DATA, while the
          final_at_arrival variant over the identical event stream yields TREATMENT_COMPLIANT with
          treatment_compliant_volume_m3 == 500.0 — same data, two valid variants, different results.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; vessel MV Aurora (TREATMENT_USCG_TYPE_APPROVED) with plan rev1 APPROVED (exchange_distance_nm=200)"
            - "Voyage V1001 departed 2026-07-28T00:00:00Z; provisional determination exists with basis INSUFFICIENT_DATA"
            - "Tank T1: UPTAKE 500 m3, TREATMENT_COMPLETE 500 m3, DISCHARGE 500 m3 at 250 nm offshore"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000001", vessel_name: "MV Aurora", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 50000, keel_laid_date: "2010-06-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V1001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}/determinations"
              as: FlagSurveyor
              captures: { prov_basis: "$.data[0].determination_basis" }
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 500, salinity_ppt: 32.5, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: TREATMENT_COMPLETE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 500, expected_voyage_version: "${w2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T1", volume_m3: 500, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w3}" }
              as: VesselMaster
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/arrive"
              payload: { arrived_at: "2026-08-10T00:00:00Z" }
              as: VesselMaster
              captures: { final_status: "$.data.compliance_status" }
            - call: "GET /vessels/${v}/voyages/${vy}/determinations"
              as: FlagSurveyor
              captures: { final_basis: "$.data[0].determination_basis", final_treat: "$.data[0].treatment_compliant_volume_m3", final_exch: "$.data[0].exchange_compliant_volume_m3", final_total: "$.data[0].total_discharged_volume_m3" }
          assert:
            - "${prov_basis} == INSUFFICIENT_DATA (provisional_at_departure variant: zero discharge events)"
            - "${final_basis} == TREATMENT_COMPLIANT (final_at_arrival variant on identical event stream)"
            - "${prov_basis} != ${final_basis}"
            - "${final_treat} == 500.0 AND ${final_exch} == 0.0 AND ${final_total} == 500.0"
            - "${final_status} == COMPLIANT"

      - name: sampling_statutory_vs_internal_threshold_variants
        grounds:
          - calculations.sampling_exceedance_threshold
          - state_machines.SamplingInspection.RECORDED_to_EVALUATED
        distinguishing_aspect: |
          On the SamplingInspection entity domain (water-quality threshold domain, distinct from the
          voyage-determination domain of the sibling instance), identical measurements organism=7 / tss=30
          yield exceeded=false under the statutory_limit variant (FLAG_STATE, limits 10/50) but
          exceeded=true under the internal_stricter variant (COMPANY_INTERNAL, limits 5/25).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V1002 IN_PROGRESS"
            - "Two inspections with identical measurements (organism 7.0, tss 30.0): I1 FLAG_STATE, I2 COMPANY_INTERNAL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000002", vessel_name: "MV Boreal", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 42000, keel_laid_date: "2012-03-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V1002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: FLAG_STATE, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: FLAG_SURVEYOR, indicator_organism_concentration: 7.0, tss_mg_per_l: 30.0, findings: [] }
              as: FlagSurveyor
              as_user_id: "fs-rec-1"
              captures: { i1: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: COMPANY_INTERNAL, sampled_at: "2026-07-29T06:00:00Z", sampled_by_role: COMPANY_AUDITOR, indicator_organism_concentration: 7.0, tss_mg_per_l: 30.0, findings: [] }
              as: FlagSurveyor
              as_user_id: "fs-rec-1"
              captures: { i2: "$.data.id" }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-1"
              captures: { ex1: "$.data.exceeded" }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i2}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-1"
              captures: { ex2: "$.data.exceeded" }
            - call: "GET /vessels/${v}/voyages/${vy}/noncompliance"
              as: FlagSurveyor
              captures: { nc_sev: "$.data[0].severity", nc_src: "$.data[0].source_type" }
          assert:
            - "${ex1} == false (statutory limits 10/50: 7.0 < 10 AND 30.0 < 50)"
            - "${ex2} == true (internal_stricter limits 5/25: 7.0 >= 5)"
            - "Exactly one NoncomplianceRecord exists for the voyage (from I2 only)"
            - "${nc_src} == SAMPLING_EXCEEDANCE AND ${nc_sev} == MAJOR (score 40, posture OPEN at detection)"

  # ============================================================
  # Rule 2 — combinatorial_formula (three instances, modes (a), (b), (c))
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sulfur_scrubber_nested_branch_selection
        grounds:
          - calculations.sulfur_compliance_evaluation
          - state_machines.EmissionsFuelRecord.PENDING_EVAL_to_EXEMPT_SCRUBBER
          - state_machines.EmissionsFuelRecord.PENDING_EVAL_to_COMPLIANT
        distinguishing_aspect: |
          Mode (a) — >=3 inputs (scrubber_installed, inside_eca_hours, sulfur_content_pct) with nested
          conditional branches: scrubber=true with inside_eca_hours=12 yields EXEMPT_SCRUBBER even at
          sulfur 4.9%, while scrubber=true with inside_eca_hours=0 falls through the nested
          `inside_eca_hours > 0` branch to COMPLIANT at sulfur 0.08%.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V2001 IN_PROGRESS"
            - "Emissions R1: VLSFO sulfur 4.9, scrubber=true, inside_eca_hours=12, outside=6"
            - "Emissions R2: MGO sulfur 0.08, scrubber=true, inside_eca_hours=0, outside=30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000003", vessel_name: "MV Corral", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 38000, keel_laid_date: "2011-05-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V2001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/emissions"
              payload: { fuel_type: VLSFO, sulfur_content_pct: 4.9, consumed_volume_mt: 800, inside_eca_hours: 12, outside_eca_hours: 6, scrubber_installed: true }
              as: VesselMaster
              captures: { e1: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/emissions"
              payload: { fuel_type: MGO, sulfur_content_pct: 0.08, consumed_volume_mt: 500, inside_eca_hours: 0, outside_eca_hours: 30, scrubber_installed: true }
              as: VesselMaster
              captures: { e2: "$.data.id" }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/emissions/${e1}/evaluate"
              as: ShoreComplianceOfficer
              captures: { s1: "$.data.compliance_status" }
            - call: "POST /vessels/${v}/voyages/${vy}/emissions/${e2}/evaluate"
              as: ShoreComplianceOfficer
              captures: { s2: "$.data.compliance_status" }
          assert:
            - "${s1} == EXEMPT_SCRUBBER (scrubber branch, inside_eca_hours 12 > 0 exempts 4.9% sulfur)"
            - "${s2} == COMPLIANT (scrubber branch with inside_eca_hours == 0 degrades to COMPLIANT, NOT EXEMPT_SCRUBBER)"

      - name: determination_per_event_rounding_before_summation
        grounds:
          - calculations.exchange_vs_treatment_determination
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, pinned by precision "volumes to 3 decimal
          places, round_half_up" applied per attributed discharge before bucket summation: two discharges
          of 100.0005 m3 each round to 100.001 per event and sum to 200.002; the alternative order
          (sum 200.001 then round) would yield 200.001. Asserted literal is 200.002.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V2002 IN_PROGRESS"
            - "Tank T9: UPTAKE 300.0; TREATMENT_COMPLETE 300.0; two DISCHARGEs of 100.0005 m3 each"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000004", vessel_name: "MV Delfin", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 51000, keel_laid_date: "2009-09-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V2002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T9", volume_m3: 300.0, salinity_ppt: 33.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: TREATMENT_COMPLETE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T9", volume_m3: 300.0, expected_voyage_version: "${w2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T9", volume_m3: 100.0005, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w3}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w4: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T08:00:00Z", tank_id: "T9", volume_m3: 100.0005, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w4}" }
              as: VesselMaster
          trigger:
            - call: "GET /vessels/${v}/voyages/${vy}/determinations"
              as: FlagSurveyor
              captures: { d_basis: "$.data[0].determination_basis", d_treat: "$.data[0].treatment_compliant_volume_m3", d_total: "$.data[0].total_discharged_volume_m3", d_exch: "$.data[0].exchange_compliant_volume_m3" }
          assert:
            - "${d_treat} == 200.002 (round_half_up(100.0005,3)=100.001 per discharge, then sum: 100.001+100.001)"
            - "${d_total} == 200.002"
            - "${d_exch} == 0.0"
            - "${d_basis} == TREATMENT_COMPLIANT"

      - name: severity_derivation_samples_posture_before_self_reference
        grounds:
          - calculations.noncompliance_severity_derivation
          - calculations.voyage_compliance_posture_rollup
          - state_machines.Voyage.IN_PROGRESS_to_NONCOMPLIANT
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: severity derivation reads
          vessel.compliance_posture (which the posture rollup itself derives from NoncomplianceRecords).
          The scaffold pins "posture == RESTRICTED at detection time": with a P1 deficiency holding the
          vessel RESTRICTED, a new DETERMINATION_NONCOMPLIANT record scores 25 + 15 = 40 -> MAJOR (exactly
          at MAJOR_THRESHOLD, >=), where the same source under OPEN posture scores 25 -> MINOR (see corner
          instance voyage_arrive_noncompliant_creates_minor_record).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan"
            - "Voyage A (V3001) IN_PROGRESS with PSC inspection exceeded -> P1 deficiency OPEN, vessel.compliance_posture == RESTRICTED"
            - "Voyage B (V3002) IN_PROGRESS; tank T1 UPTAKE 400 then DISCHARGE 400 with no treatment/exchange"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000005", vessel_name: "MV Eider", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 47000, keel_laid_date: "2008-02-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V3001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vyA: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vyA}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vyA}/inspections"
              payload: { inspection_kind: PORT_STATE_CONTROL, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: PSC_OFFICER, indicator_organism_concentration: 12.0, tss_mg_per_l: 20.0, findings: ["BWMS-01"] }
              as: PSCOfficer
              as_user_id: "psc-1"
              captures: { iA: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vyA}/inspections/${iA}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-1"
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { posture_mid: "$.data.compliance_posture" }
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V3002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vyB: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vyB}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vyB}"
              as: VesselMaster
              captures: { w1: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vyB}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 400, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vyB}"
              as: VesselMaster
              captures: { w2: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vyB}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 400, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w2}" }
              as: VesselMaster
          trigger:
            - call: "POST /vessels/${v}/voyages/${vyB}/arrive"
              payload: { arrived_at: "2026-08-10T00:00:00Z" }
              as: VesselMaster
              captures: { vyB_status: "$.data.compliance_status" }
            - call: "GET /vessels/${v}/voyages/${vyB}/noncompliance"
              as: FlagSurveyor
              captures: { nc_sev: "$.data[0].severity", nc_due: "$.data[0].response_due_at", nc_src: "$.data[0].source_type" }
          assert:
            - "${posture_mid} == RESTRICTED (P1 deficiency A15 OPEN after evaluate)"
            - "${vyB_status} == NONCOMPLIANT (basis NONCOMPLIANT_NO_METHOD)"
            - "${nc_src} == DETERMINATION_NONCOMPLIANT"
            - "${nc_sev} == MAJOR (score = 25 + 15 RESTRICTED-at-detection = 40 >= MAJOR_THRESHOLD)"
            - "${nc_due} == 2026-08-15T00:00:00Z (detected_at 2026-08-01T00:00:00Z + 14 days)"

  # ============================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: voyage_parallel_axes_drift_then_converge
        grounds:
          - state_machines.Voyage.NOT_DUE_to_DUE
          - state_machines.Voyage.DUE_to_OVERDUE
          - state_machines.Voyage.IN_PROGRESS_to_COMPLIANT
          - state_machines.Voyage.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Voyage carries parallel state dimensions: reporting_status flips DUE -> OVERDUE (clock past
          due_at) while compliance_status stays IN_PROGRESS; then arrival drives compliance to COMPLIANT
          while reporting is STILL OVERDUE; submission from OVERDUE and acknowledgement finally converge
          to the terminal pair COMPLIANT x ACKNOWLEDGED. Intermediate combined states are asserted at
          each step, proving the axes evolve independently.
        test_recipe:
          setup:
            - "Vessel with APPROVED plan; voyage V4001 departed 2026-07-28, arrived_at input 2026-08-10T00:00:00Z (PRE_ARRIVAL due_at = 2026-08-09T00:00:00Z)"
            - "Tank T1 treatment-compliant event set (UPTAKE 500, TREATMENT_COMPLETE 500, DISCHARGE 500 @250nm)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000006", vessel_name: "MV Fulmar", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 44000, keel_laid_date: "2010-01-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V4001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: "$.data.version", cs1: "$.data.compliance_status", rs1: "$.data.reporting_status" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 500, salinity_ppt: 32.5, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: TREATMENT_COMPLETE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 500, expected_voyage_version: "${w2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: "$.data.version" }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T1", volume_m3: 500, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w3}" }
              as: VesselMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { cs2: "$.data.compliance_status", rs2: "$.data.reporting_status" }
            - call: "POST /vessels/${v}/voyages/${vy}/arrive"
              payload: { arrived_at: "2026-08-10T00:00:00Z" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { cs3: "$.data.compliance_status", rs3: "$.data.reporting_status" }
            - call: "GET /vessels/${v}/voyages/${vy}/reports"
              payload: { report_type: PRE_ARRIVAL }
              as: VesselMaster
              captures: { rep: "$.data[0].id", rep_overdue: "$.data[0].is_overdue" }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/reports/${rep}/submit"
              payload: { payload_summary: { note: "pre-arrival late filing" } }
              as: VesselMaster
              captures: { rep_status: "$.data.status" }
            - call: "POST /vessels/${v}/voyages/${vy}/reports/${rep}/acknowledge"
              as: FlagSurveyor
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: FlagSurveyor
              captures: { cs4: "$.data.compliance_status", rs4: "$.data.reporting_status" }
          assert:
            - "${cs1} == IN_PROGRESS AND ${rs1} == DUE (immediately after depart)"
            - "${cs2} == IN_PROGRESS AND ${rs2} == OVERDUE (clock 2026-08-09T00:00:01Z > due_at 2026-08-09T00:00:00Z; compliance axis unmoved)"
            - "${rep_overdue} == true"
            - "${cs3} == COMPLIANT AND ${rs3} == OVERDUE (arrival commits compliance axis; reporting axis unchanged)"
            - "${rep_status} == SUBMITTED (submission allowed from OVERDUE per DUE-to-SUBMITTED precondition 'DUE or OVERDUE')"
            - "${cs4} == COMPLIANT AND ${rs4} == ACKNOWLEDGED (terminal pair converged)"

      - name: inspection_closed_reopen_cycle_restores_records
        grounds:
          - state_machines.SamplingInspection.CLOSED_to_REOPENED
          - state_machines.SamplingInspection.EVALUATED_to_CLOSED
          - state_machines.NoncomplianceRecord.OPEN_to_RESPONDED
          - state_machines.NoncomplianceRecord.RESPONDED_to_CLOSED
        distinguishing_aspect: |
          SamplingInspection has a cyclic revision loop (RECORDED -> EVALUATED -> CLOSED -> REOPENED);
          reopening within 90 days cascades backward: the previously CLOSED linked NoncomplianceRecord
          flips CLOSED -> OPEN, proving the loop re-arms downstream state rather than being a no-op.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V4002 IN_PROGRESS"
            - "FLAG_STATE inspection (organism 12.0, tss 10.0) evaluated -> MAJOR record; record RESPONDED then CLOSED; inspection CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000007", vessel_name: "MV Gannet", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 46000, keel_laid_date: "2010-04-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V4002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: FLAG_STATE, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: FLAG_SURVEYOR, indicator_organism_concentration: 12.0, tss_mg_per_l: 10.0, findings: ["BWMS-02"] }
              as: FlagSurveyor
              as_user_id: "fs-rec-2"
              captures: { i1: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-2"
            - call: "GET /vessels/${v}/voyages/${vy}/noncompliance"
              as: FlagSurveyor
              captures: { nc: "$.data[0].id", nc_st1: "$.data[0].response_status" }
            - call: "POST /vessels/${v}/voyages/${vy}/noncompliance/${nc}/respond"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/voyages/${vy}/noncompliance/${nc}/close"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/close"
              as: FlagSurveyor
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/reopen"
              as: FlagSurveyor
              captures: { i_status: "$.data.status" }
            - call: "GET /vessels/${v}/voyages/${vy}/noncompliance"
              as: FlagSurveyor
              captures: { nc_st2: "$.data[0].response_status" }
          assert:
            - "${nc_st1} == OPEN (MAJOR record created by evaluate)"
            - "${i_status} == REOPENED (cycle: CLOSED -> REOPENED within 90 days of sampled_at 2026-07-29)"
            - "${nc_st2} == OPEN (backward cascade: previously CLOSED record re-opened)"

      - name: report_reject_returns_reporting_axis_to_due
        grounds:
          - state_machines.Voyage.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          The reporting axis is branching with revert: report SUBMITTED -> REJECTED is terminal for the
          report, yet the voyage-level reporting_status loops SUBMITTED -> DUE (must resubmit), while
          compliance_status is untouched — a fork/revert shape distinct from the parallel-axis drift and
          the inspection cycle of the sibling instances.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V4003 IN_PROGRESS (arrived_at input 2026-08-10 -> report due 2026-08-09, still DUE at clock)"
            - "PRE_ARRIVAL report DRAFT; submitted once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000008", vessel_name: "MV Heron", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 41000, keel_laid_date: "2013-08-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V4003", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}/reports"
              payload: { report_type: PRE_ARRIVAL }
              as: VesselMaster
              captures: { rep: "$.data[0].id" }
            - call: "POST /vessels/${v}/voyages/${vy}/reports/${rep}/submit"
              payload: { payload_summary: { note: "pre-arrival" } }
              as: VesselMaster
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/reports/${rep}/reject"
              payload: { rejection_reason: "missing tank-level uptake rows" }
              as: FlagSurveyor
              captures: { rep_status: "$.data.status", rep_reason: "$.data.rejection_reason" }
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: FlagSurveyor
              captures: { cs: "$.data.compliance_status", rs: "$.data.reporting_status" }
          assert:
            - "${rep_status} == REJECTED (terminal for the report)"
            - "${rep_reason} == missing tank-level uptake rows"
            - "${rs} == DUE (reporting axis reverts SUBMITTED -> DUE; must resubmit)"
            - "${cs} == IN_PROGRESS (compliance axis untouched by report rejection)"

  # ============================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: overdue_escalation_cascade_record_to_case_to_vessel
        grounds:
          - state_machines.NoncomplianceRecord.OPEN_to_ESCALATED
          - state_machines.EnforcementCase
          - calculations.voyage_compliance_posture_rollup
          - entities.Vessel.fields.active_enforcement_case_id
        distinguishing_aspect: |
          Depth-3 chain triggered by the clock (not an API action): clock re-evaluation flips the MINOR
          REPORT_OVERDUE record OPEN -> ESCALATED (mutation 1); that escalation itself creates an ACTIVE
          EnforcementCase and stamps record.escalated_to_case_id (mutation 2, caused by 1); the new child
          EnforcementCase fires the posture rollup which sets vessel.active_enforcement_case_id and
          compliance_posture RESTRICTED (mutation 3, caused by 2 via the rollup's declared trigger).
        test_recipe:
          setup:
            - "Vessel with APPROVED plan; voyage V5001 departed, arrived_at input 2026-08-10 (PRE_ARRIVAL due 2026-08-09T00:00:00Z); report left DRAFT"
            - "Clock advanced to 2026-08-09T00:00:01Z -> report OVERDUE, MINOR record detected_at 2026-08-09T00:00:01Z, response_due_at 2026-09-08T00:00:01Z"
            - "Clock advanced to 2026-09-15T00:00:02Z (> response_due_at + 7 days = 2026-09-15T00:00:01Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000009", vessel_name: "MV Ibis", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 43000, keel_laid_date: "2011-11-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V5001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:02Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /vessels/${v}/voyages/${vy}/noncompliance"
              as: ShoreComplianceOfficer
              captures: { nc_status: "$.data[0].response_status", nc_due: "$.data[0].response_due_at", nc_case: "$.data[0].escalated_to_case_id" }
            - call: "GET /vessels/${v}/enforcement-cases"
              as: ShoreComplianceOfficer
              captures: { case_id: "$.data[0].id", case_status: "$.data[0].status" }
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { v_case: "$.data.active_enforcement_case_id", v_posture: "$.data.compliance_posture" }
          assert:
            - "${nc_status} == ESCALATED"
            - "${nc_due} == 2026-09-08T00:00:01Z (MINOR: detected_at 2026-08-09T00:00:01Z + 30 days)"
            - "${case_status} == ACTIVE"
            - "${nc_case} == ${case_id} (escalation created the case and linked it)"
            - "${v_case} == ${case_id} (mutation 3: vessel stamped by the case-creation side effect)"
            - "${v_posture} == RESTRICTED (escalation else-branch: case without hold_flag)"

      - name: deficiency_verify_lifts_posture_depth2
        grounds:
          - state_machines.PortStateControlDeficiency.RECTIFIED_to_VERIFIED
          - state_machines.SamplingInspection.RECORDED_to_EVALUATED
          - calculations.voyage_compliance_posture_rollup
          - concurrency_rules[rectification-stale-deficiency]
        distinguishing_aspect: |
          Depth-2 chain triggered by an API action (distinct from the clock-driven sibling): PSC verify
          mutates the deficiency RECTIFIED -> VERIFIED (mutation 1); that child mutation fires the
          posture rollup whose p1_open count drops to 0, lifting vessel.compliance_posture RESTRICTED ->
          OPEN (mutation 2, caused by 1). The full OPEN->RECTIFYING->RECTIFIED->VERIFIED path with OCC
          and segregation-of-duties discipline is exercised.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V5002 IN_PROGRESS"
            - "PSC inspection (organism 12.0) evaluated -> P1 deficiency (A15) OPEN, posture RESTRICTED"
            - "Master begins rectification and claims rectified with fresh deficiency version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
