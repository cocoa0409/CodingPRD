# =============================================================================
# Task 1998: Relocation Benefit Administration — §1.8 Test Targeting Index
# Nine Difficulty Rules, >= 2 instances each (R1 and R2 carry 3) = 20 instances.
# Every test_recipe replays from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Logical clock default (no set_current_utc call): 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: gross_up_flat_vs_marginal
        grounds:
          - calculations.tax_gross_up
          - entities.ExpenseClaim.fields.gross_up_cents
          - entities.RelocationPolicy.fields.gross_up_method
        distinguishing_aspect: |
          ExpenseClaim domain: identical 100000-cent taxable claim paid under a
          FLAT_SUPPLEMENTAL policy yields gross_up_cents 28205, while the same
          claim under a MARGINAL_AGGREGATE policy yields 33333 — the variant
          selected by policy.gross_up_method changes the money, and this domain
          (expense reimbursement) differs from the loss-on-sale and vendor-score
          domains used by the sibling instances.
        test_recipe:
          setup:
            - "Two cases in IN_PROGRESS: case F under a MANAGER/DOMESTIC/RENTER FLAT_SUPPLEMENTAL policy, case M under a DIRECTOR/DOMESTIC/RENTER MARGINAL_AGGREGATE policy (bracket threshold 100000, low 0.25, high 0.40)"
            - "Each case has one PAID REIMBURSEMENT claim of amount_cents 100000 (lines 60000 + 40000)"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Flat Erin", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_f: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_f}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_f: $.data.id }
            - call: "POST /relocation-cases/${case_f}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_f}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_f}", category: MEALS, payment_method: REIMBURSEMENT, lines: [{ description: "Meals wk1", amount_cents: 60000 }, { description: "Meals wk2", amount_cents: 40000 }] }
              as: Employee
              as_user_id: "${emp_f}"
              captures: { claim_f: $.data.id }
            - call: "GET /relocation-cases/${case_f}"
              as: MobilityCoordinator
              captures: { case_f_v: $.data.version }
            - call: "POST /expense-claims/${claim_f}/approve"
              payload: { expected_case_version: "${case_f_v}" }
              as: FinanceSpecialist
            - call: "POST /policies"
              payload: { job_level: DIRECTOR, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: MARGINAL_AGGREGATE, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Marg Erin", job_level: DIRECTOR, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_m: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_m}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_m: $.data.id }
            - call: "POST /relocation-cases/${case_m}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_m}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_m}", category: MEALS, payment_method: REIMBURSEMENT, lines: [{ description: "Meals wk1", amount_cents: 60000 }, { description: "Meals wk2", amount_cents: 40000 }] }
              as: Employee
              as_user_id: "${emp_m}"
              captures: { claim_m: $.data.id }
            - call: "GET /relocation-cases/${case_m}"
              as: MobilityCoordinator
              captures: { case_m_v: $.data.version }
            - call: "POST /expense-claims/${claim_m}/approve"
              payload: { expected_case_version: "${case_m_v}" }
              as: FinanceSpecialist
          trigger:
            - call: "POST /expense-claims/${claim_f}/pay"
              payload: {}
              as: FinanceSpecialist
            - call: "POST /expense-claims/${claim_m}/pay"
              payload: {}
              as: FinanceSpecialist
          assert:
            - "ExpenseClaim.${claim_f}.gross_up_cents == 28205"
            - "ExpenseClaim.${claim_f}.total_payment_cents == 128205"
            - "ExpenseClaim.${claim_m}.gross_up_cents == 33333"
            - "ExpenseClaim.${claim_m}.total_payment_cents == 133333"
            - "ExpenseClaim.${claim_f}.amount_cents == ExpenseClaim.${claim_m}.amount_cents == 100000 (identical inputs, variant-driven divergence)"

      - name: loss_on_sale_appraised_vs_purchase
        grounds:
          - calculations.loss_on_sale_benefit
          - entities.HomeSaleTransaction.fields.loss_basis_used
          - entities.RelocationPolicy.fields.loss_basis
        distinguishing_aspect: |
          HomeSaleTransaction domain: identical home data (appraised 50000000,
          purchase 48000000, sale 45000000, cap 4000000) yields
          capped_benefit_cents 4000000 under loss_basis APPRAISED but 3000000
          under PURCHASE_PRICE — a different entity domain from the gross-up
          (ExpenseClaim) and vendor-score (Vendor) instances.
        test_recipe:
          setup:
            - "Case A: EXECUTIVE/DOMESTIC/HOMEOWNER policy, loss_basis APPRAISED, loss_on_sale_cap_cents 4000000, home_sale_eligible true, case IN_PROGRESS"
            - "Case P: MANAGER/INTERNATIONAL/HOMEOWNER policy, loss_basis PURCHASE_PRICE, loss_on_sale_cap_cents 4000000, home_sale_eligible true, case IN_PROGRESS"
            - "Each case has a HomeSaleTransaction with identical appraised/purchase/list values"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: EXECUTIVE, move_scope: DOMESTIC, home_ownership: HOMEOWNER, hhg_cap_cents: 900000, temp_housing_cap_cents: 600000, temp_housing_max_nights: 60, travel_cap_cents: 200000, loss_on_sale_cap_cents: 4000000, misc_cap_cents: 300000, home_sale_eligible: true, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Ann Appr", job_level: EXECUTIVE, home_ownership: HOMEOWNER }
              as: MobilityCoordinator
              captures: { emp_a: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_a}", move_scope: DOMESTIC, origin_city: "Boston", destination_city: "Austin", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_a: $.data.id }
            - call: "POST /relocation-cases/${case_a}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_a}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /home-sales"
              payload: { case_id: "${case_a}", appraised_value_cents: 50000000, original_purchase_price_cents: 48000000, list_price_cents: 52000000 }
              as: MobilityCoordinator
              captures: { hs_a: $.data.id }
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: INTERNATIONAL, home_ownership: HOMEOWNER, hhg_cap_cents: 900000, temp_housing_cap_cents: 600000, temp_housing_max_nights: 60, travel_cap_cents: 200000, loss_on_sale_cap_cents: 4000000, misc_cap_cents: 300000, home_sale_eligible: true, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: PURCHASE_PRICE }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Pat Purch", job_level: MANAGER, home_ownership: HOMEOWNER }
              as: MobilityCoordinator
              captures: { emp_p: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_p}", move_scope: INTERNATIONAL, origin_city: "Boston", destination_city: "London", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_p: $.data.id }
            - call: "POST /relocation-cases/${case_p}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_p}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /home-sales"
              payload: { case_id: "${case_p}", appraised_value_cents: 50000000, original_purchase_price_cents: 48000000, list_price_cents: 52000000 }
              as: MobilityCoordinator
              captures: { hs_p: $.data.id }
          trigger:
            - call: "POST /home-sales/${hs_a}/record-sale"
              payload: { sale_price_cents: 45000000 }
              as: MobilityCoordinator
            - call: "POST /home-sales/${hs_p}/record-sale"
              payload: { sale_price_cents: 45000000 }
              as: MobilityCoordinator
          assert:
            - "HomeSaleTransaction.${hs_a}.gross_loss_cents == 5000000"
            - "HomeSaleTransaction.${hs_a}.capped_benefit_cents == 4000000 (min(5000000, 4000000) — cap binds)"
            - "HomeSaleTransaction.${hs_a}.loss_basis_used == APPRAISED"
            - "HomeSaleTransaction.${hs_p}.gross_loss_cents == 3000000"
            - "HomeSaleTransaction.${hs_p}.capped_benefit_cents == 3000000 (min(3000000, 4000000) — loss binds)"
            - "HomeSaleTransaction.${hs_p}.loss_basis_used == PURCHASE_PRICE"

      - name: vendor_score_rolling_vs_lifetime
        grounds:
          - calculations.vendor_performance_score
          - entities.Vendor.fields.avg_rating_lifetime
          - entities.Vendor.fields.avg_rating_rolling_12m
        distinguishing_aspect: |
          Vendor domain: the same two ratings (5, then 1 thirteen months later)
          yield avg_rating_lifetime 3.00 but avg_rating_rolling_12m 1.00 because
          the rolling variant drops the aged-out rating — a different entity
          domain from ExpenseClaim gross-up and HomeSaleTransaction loss.
        test_recipe:
          setup:
            - "Case IN_PROGRESS (MANAGER/DOMESTIC/RENTER FLAT policy); vendor V ACTIVE"
            - "Two MoveAssignments for vendor V, both PAID"
            - "First assignment rated 5 at the default clock 2026-08-01; clock then advanced 13 months; second assignment rated 1 at 2027-09-01"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Vic Rater", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /vendors"
              payload: { name: "Midwest Movers", service_regions: ["IL", "CO"] }
              as: MobilityCoordinator
              captures: { vendor_id: $.data.id }
            - call: "POST /move-assignments"
              payload: { case_id: "${case_id}", vendor_id: "${vendor_id}" }
              as: MobilityCoordinator
              captures: { ma1: $.data.id }
            - call: "POST /move-assignments/${ma1}/schedule-survey"
              payload: { survey_at: "2026-08-10T10:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma1}/submit-estimate"
              payload: { estimated_cents: 80000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v1: $.data.version }
            - call: "POST /move-assignments/${ma1}/approve-estimate"
              payload: { expected_case_version: "${case_v1}" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma1}/mark-delivered"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /move-assignments/${ma1}/submit-invoice"
              payload: { final_invoice_cents: 80000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /move-assignments/${ma1}/mark-paid"
              payload: {}
              as: FinanceSpecialist
            - call: "POST /move-assignments/${ma1}/rate"
              payload: { rating: 5 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /move-assignments"
              payload: { case_id: "${case_id}", vendor_id: "${vendor_id}" }
              as: MobilityCoordinator
              captures: { ma2: $.data.id }
            - call: "POST /move-assignments/${ma2}/schedule-survey"
              payload: { survey_at: "2026-08-10T14:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma2}/submit-estimate"
              payload: { estimated_cents: 80000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v2: $.data.version }
            - call: "POST /move-assignments/${ma2}/approve-estimate"
              payload: { expected_case_version: "${case_v2}" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma2}/mark-delivered"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /move-assignments/${ma2}/submit-invoice"
              payload: { final_invoice_cents: 80000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /move-assignments/${ma2}/mark-paid"
              payload: {}
              as: FinanceSpecialist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: MobilityCoordinator
          trigger:
            - call: "POST /move-assignments/${ma2}/rate"
              payload: { rating: 1 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /vendors/${vendor_id}"
              as: MobilityCoordinator
              captures: { v_life: $.data.avg_rating_lifetime, v_roll: $.data.avg_rating_rolling_12m, v_cnt: $.data.rating_count }
          assert:
            - "Vendor.${vendor_id}.rating_count == 2"
            - "Vendor.${vendor_id}.avg_rating_lifetime == 3.00"
            - "Vendor.${vendor_id}.avg_rating_rolling_12m == 1.00 (rating of 5 at 2026-08-01 is outside [clock-12mo = 2026-09-01, 2027-09-01])"
            - "captured: ${v_life} == 3.00 and ${v_roll} == 1.00 and ${v_cnt} == 2"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes a / b / c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: loss_on_sale_cap_min_interaction
        grounds:
          - calculations.loss_on_sale_benefit
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (appraised_value_cents, sale_price_cents,
          loss_on_sale_cap_cents, plus the loss_basis branch) with non-linear
          nested max(0, basis - sale) then min(loss, effective_cap) — here the
          outer min binds (gross 8000000 > cap 4000000), proving both layers of
          the nesting execute.
        test_recipe:
          setup:
            - "EXECUTIVE/DOMESTIC/HOMEOWNER policy (loss_basis APPRAISED, loss_on_sale_cap_cents 4000000, home_sale_eligible true); case IN_PROGRESS with a HomeSaleTransaction LISTED"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: EXECUTIVE, move_scope: DOMESTIC, home_ownership: HOMEOWNER, hhg_cap_cents: 900000, temp_housing_cap_cents: 600000, temp_housing_max_nights: 60, travel_cap_cents: 200000, loss_on_sale_cap_cents: 4000000, misc_cap_cents: 300000, home_sale_eligible: true, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Cap Cara", job_level: EXECUTIVE, home_ownership: HOMEOWNER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Boston", destination_city: "Austin", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /home-sales"
              payload: { case_id: "${case_id}", appraised_value_cents: 60000000, original_purchase_price_cents: 55000000, list_price_cents: 61000000 }
              as: MobilityCoordinator
              captures: { hs_id: $.data.id }
          trigger:
            - call: "POST /home-sales/${hs_id}/record-sale"
              payload: { sale_price_cents: 52000000 }
              as: MobilityCoordinator
          assert:
            - "HomeSaleTransaction.${hs_id}.gross_loss_cents == 8000000 (max(0, 60000000 - 52000000))"
            - "HomeSaleTransaction.${hs_id}.capped_benefit_cents == 4000000 (min(8000000, 4000000) — cap layer binds)"
            - "HomeSaleTransaction.${hs_id}.status == SOLD"

      - name: repayment_installment_floor_remainder
        grounds:
          - calculations.repayment_schedule
          - entities.RepaymentAgreement.fields.installment_cents
          - entities.RepaymentAgreement.fields.final_installment_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each of the 23 regular
          installments is floor(45750/24) = 1906 and the final installment
          absorbs the remainder 45750 - 23x1906 = 1912; sum-then-round
          (24 x 1906 = 45744) would lose 6 cents, so the order changes the money.
        test_recipe:
          setup:
            - "MANAGER/DOMESTIC/RENTER policy with repayment_window_months 24; case IN_PROGRESS with one COMPLETED TRAVEL booking of 61000 (total_paid_cents == 61000)"
            - "Case authorized at the default clock 2026-08-01; employee terminated at 2027-02-01, so months_remaining == 18 and total_owed == round_half_up(61000 x 18/24) == 45750"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Repay Raj", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /service-bookings"
              payload: { case_id: "${case_id}", kind: TRAVEL, start_date: "2026-08-15T00:00:00Z", amount_cents: 61000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /service-bookings/${sb_id}/confirm"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /service-bookings/${sb_id}/complete"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /employees/${emp_id}/terminate"
              payload: {}
              as: MobilityCoordinator
          trigger:
            - call: "POST /relocation-cases/${case_id}/terminate-early"
              payload: {}
              as: MobilityCoordinator
            - call: "GET /relocation-cases/${case_id}/repayment-agreements"
              as: MobilityCoordinator
              captures: { ra_id: "$.data[0].id", ra_owed: "$.data[0].total_owed_cents", ra_inst: "$.data[0].installment_cents", ra_final: "$.data[0].final_installment_cents" }
          assert:
            - "RepaymentAgreement.${ra_id}.total_owed_cents == 45750"
            - "RepaymentAgreement.${ra_id}.installments_count == 24"
            - "RepaymentAgreement.${ra_id}.installment_cents == 1906"
            - "RepaymentAgreement.${ra_id}.final_installment_cents == 1912"
            - "23 x 1906 + 1912 == 45750 (floor-then-remainder conserves the total)"

      - name: gross_up_circular_evaluation_order
        grounds:
          - calculations.tax_gross_up
        distinguishing_aspect: |
          Mode (c): tax is levied on the gross payment (gross = net + tax,
          tax = rate x gross), a circular-looking dependency the scaffold
          resolves algebraically — gross_up = round_half_up(net x r / (1 - r)).
          For net 50000 at r = 0.22 the pinned order yields 14103, whereas
          evaluating tax on the net (50000 x 0.22 = 11000) would give a
          materially different, wrong result.
        test_recipe:
          setup:
            - "ASSOCIATE/DOMESTIC/RENTER FLAT_SUPPLEMENTAL policy (flat_gross_up_rate 0.22); case IN_PROGRESS; one APPROVED REIMBURSEMENT claim of amount_cents 50000"
