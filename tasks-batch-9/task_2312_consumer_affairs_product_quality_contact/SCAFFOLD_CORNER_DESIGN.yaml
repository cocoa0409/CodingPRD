            - { call: "POST /sample-kits/${k1}/custody-events", as: QualityLead, as_user_id: "${ql1}", payload: { event_type: LAB_RECEIVED, occurred_at: "2026-08-06T00:00:00Z", actor_label: "Lab intake", seal_id_observed: "SEAL-701", expected_sample_kit_version: "${kv4}" } }
