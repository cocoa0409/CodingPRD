            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlatformAdmin }
