            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "GET /project-orders/${ord_id}", as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_v_now: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v_now} - 1" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION and http status 412 (OCC priority 7 beats the state check at priority 8)"

      - name: val_duplicate_phase_sequence_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "entities.InstallationPhase.fields.phase_sequence"
