  - method: POST
    path: "/om/fema-claims/{id}/withdraw"
    description: "SUBMITTED -> DRAFT (permanent=false, revision loop) or DRAFT/SUBMITTED -> WITHDRAWN (permanent=true, terminal)"
    roles: [ClaimsOfficer]
    code: 200
    input: ["permanent?"]
    output: FemaClaim
    side_effects: ["on revision loop: clears preparer_user_id and eligible_snapshot_cents", "increments version"]
  - method: POST
    path: "/om/fema-claims/{id}/obligate"
    description: "CERTIFIED -> OBLIGATED"
    roles: [Regulator]
    code: 200
    input: []
    output: FemaClaim
    side_effects: ["increments version"]
  - method: POST
    path: "/om/fema-claims/{id}/mark_paid"
    description: "OBLIGATED -> PAID (terminal)"
    roles: [Regulator]
    code: 200
    input: []
    output: FemaClaim
    side_effects: ["increments version"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Request / auth ---
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "X-User-Role is not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, or numeric constraint violated" }
  - { id: ERR_ASSIGNEE_AMBIGUOUS, http: 400, condition: "Work-order assign carries both crew_id and mutual_aid_crew_id" }
  # --- State machine / posture ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 400, condition: "The resource's own state does not permit the requested transition" }
  - { id: ERR_EVENT_NOT_ACTIVE, http: 400, condition: "Operation requires the storm event to be ACTIVE (clustering, mutual-aid arrival, switching execute)" }
  - { id: ERR_EVENT_NOT_DEMOBILIZING, http: 400, condition: "FEMA submit requires the event in DEMOBILIZING or CLOSED" }
  - { id: ERR_EVENT_CLOSED, http: 400, condition: "No mutation scoped to a CLOSED event is accepted" }
  - { id: ERR_EVENT_HAS_OPEN_WORK, http: 400, condition: "Demobilization/close precondition failed: open outages, in-field crews, non-terminal requisitions, un-released lodging blocks, or non-terminal switching orders remain" }
  - { id: ERR_LODGING_NOT_COMMITTED, http: 400, condition: "assign_lodging requires the block in COMMITTED status" }
  - { id: ERR_PING_OUTAGE_STATE, http: 400, condition: "METER_RESTORE_PING references an outage not in {WORKING, RESTORED}" }
  - { id: ERR_OUTAGE_WORK_OPEN, http: 400, condition: "report_restored/cancel blocked: non-terminal work orders remain on the outage (or none completed for restore)" }
  - { id: ERR_OUTAGE_CHILDREN_OPEN, http: 400, condition: "Outage verify blocked: a nested child outage is not VERIFIED/CANCELLED" }
  - { id: ERR_UNVERIFIED_WORK_REMAINS, http: 400, condition: "Outage verify blocked: a non-cancelled work order lacks VERIFY_PASSED" }
  - { id: ERR_RESTORE_PING_MISSING, http: 400, condition: "Outage verify blocked: no CLUSTERED METER_RESTORE_PING with occurred_at >= restoration_reported_at" }
  # --- Safety / SoD / ownership ---
  - { id: ERR_SWITCHING_NOT_EXECUTED, http: 422, condition: "Work-order start requires an EXECUTED switching order (requires_switching_order = true)" }
  - { id: ERR_FATIGUE_LIMIT_EXCEEDED, http: 422, condition: "Assignment would push the crew's projected continuous work past 960 minutes" }
  - { id: ERR_CREW_NOT_ON_SITE, http: 422, condition: "Work-order start requires the assigned internal crew ON_SITE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Switching-order approver equals issuer, or FEMA certifier equals preparer" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "FieldCrewLead acted on another crew's work order/assessment, or non-issuer tried to issue a switching order" }
  # --- OCC ---
  - { id: ERR_STALE_OUTAGE_VERSION, http: 412, condition: "expected_outage_version does not match the outage's current version (ETR revision or assessment accept)" }
  # --- Referential ---
  - { id: ERR_CROSS_EVENT_LINK, http: 422, condition: "Linked entities belong to different storm events (parent outage, merge target, lodging block vs crew)" }
  - { id: ERR_PARENT_OUTAGE_TERMINAL, http: 422, condition: "parent_outage_id references a VERIFIED or CANCELLED outage" }
  - { id: ERR_MERGE_CYCLE, http: 422, condition: "Merge target is the source itself or a transitive descendant of the source" }
  - { id: ERR_ASSESSMENT_REQUIRED, http: 422, condition: "Non-ASSESSMENT work order cannot go READY without an ACCEPTED damage assessment on the outage" }
  # --- Temporal ---
  - { id: ERR_ETR_IN_PAST, http: 422, condition: "published_etr is not after the logical now" }
  - { id: ERR_ETR_BACKWARD_FORBIDDEN, http: 422, condition: "Manual backward ETR revision without reason CORRECTION, or after the outage left CONFIRMED/ASSESSED, or while the ETR is missed" }
  - { id: ERR_ETR_LOCKED_HORIZON, http: 422, condition: "Revision inside the 30-minute public-commit lock horizon before the current ETR (only NESTED_DISCOVERED allowed)" }
  - { id: ERR_OUTSIDE_ENGAGEMENT_WINDOW, http: 422, condition: "Mutual-aid arrival or assignment outside [committed_window_start, committed_window_end)" }
  - { id: ERR_WINDOW_OUTSIDE_BLOCK, http: 422, condition: "Crew committed window is not contained within the lodging block window (containment semantics)" }
  - { id: ERR_LODGING_WINDOW_OVERLAP, http: 422, condition: "New lodging block overlaps an existing block for the same (storm_event_id, hotel_name) under half-open interval semantics" }
  - { id: ERR_SIGNAL_IN_FUTURE, http: 422, condition: "TroubleSignal occurred_at is after the logical now" }
  - { id: ERR_CERTIFICATION_WINDOW_PAST, http: 422, condition: "certified_through is not strictly after the logical now" }
  # --- Constraint ---
  - { id: ERR_ETR_EXTENSION_EXCEEDS_CAP, http: 422, condition: "Single manual ETR extension exceeds 360 minutes and reason is not DAMAGE_FOUND" }
  - { id: ERR_CREW_TYPE_MISMATCH, http: 422, condition: "Assignee crew_type differs from the work order's required_crew_type" }
  - { id: ERR_CREW_NOT_AVAILABLE, http: 422, condition: "Internal crew not AVAILABLE or mutual-aid crew ma_status not AVAILABLE" }
  - { id: ERR_DUPLICATE_STOCK, http: 409, condition: "(warehouse_code, material_sku) already exists" }
  - { id: ERR_NO_ELIGIBLE_WORK, http: 422, condition: "dispatch_next found no READY work order matching the crew type on this event" }
  # --- Fiscal / capacity ---
  - { id: ERR_NO_ROOMS_AVAILABLE, http: 422, condition: "rooms_allocated + roster_size would exceed block room_count" }
  - { id: ERR_INSUFFICIENT_MATERIAL, http: 422, condition: "Staged quantity exceeds stock quantity_available" }
  - { id: ERR_FEMA_THRESHOLD_NOT_MET, http: 422, condition: "eligible_cost_cents < threshold_cents at submit" }
  - { id: ERR_LODGING_HAS_ACTIVE_CREWS, http: 422, condition: "Lodging release blocked: rooms_allocated > 0" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: EmergencyDirector
    description: "Utility emergency operations director; owns event lifecycle, feeders, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /om/storm-events, /activate, /begin_demobilization, /close"
      - "POST /om/feeders"
      - "POST /om/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Dispatcher
    description: "Control-room dispatcher; runs clustering, manages outages/ETRs, dispatches crews and work orders, verifies restoration, manages the priority-customer registry"
    identity: opaque
    exclusive_operations:
      - "POST /om/storm-events/{id}/run_clustering, /dispatch_next"
      - "POST /om/outages and outage transitions (confirm/cancel/merge/report_restored/verify/etr-revisions)"
      - "POST /om/damage-assessments/{id}/return, /accept"
      - "POST /om/crews, /start_shift, /end_shift"
      - "POST /om/work-orders and /ready, /assign, /verify, /cancel"
      - "POST /om/priority-customers and /certify, /decertify"
    shared_operations: ["all GET endpoints", "POST /om/work-orders/{id}/arrive, /start, /complete (shared with FieldCrewLead)"]
  - name: TelemetryGateway
    description: "Automated metering/SCADA ingestion identity"
    identity: opaque
    exclusive_operations: ["POST /om/trouble-signals"]
    shared_operations: ["all GET endpoints"]
  - name: FieldCrewLead
    description: "Lead of an internal crew; X-User-ID equals the Crew.id they lead"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /om/damage-assessments and /submit (as the assessing crew)"
    shared_operations: ["all GET endpoints", "POST /om/work-orders/{id}/arrive, /start, /complete (own crew's work orders only — ERR_OWNERSHIP_MISMATCH otherwise)"]
  - name: SystemOperator
    description: "Switching authority; issues/approves/executes/aborts switching orders. Segregation of duties: approver X-User-ID must differ from issuer X-User-ID"
    identity: opaque
    exclusive_operations: ["POST /om/switching-orders and /issue, /approve, /execute, /abort"]
    shared_operations: ["all GET endpoints"]
  - name: MutualAidCoordinator
    description: "Mutual-aid liaison; engages external crews, manages lodging blocks"
    identity: opaque
    exclusive_operations:
      - "POST /om/mutual-aid-crews and /mark_arrived, /assign_lodging, /demobilize, /depart, /cancel"
      - "POST /om/lodging-blocks and /commit, /release"
    shared_operations: ["all GET endpoints"]
  - name: MaterialsManager
    description: "Warehouse/materials officer; manages stock pools and requisition lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /om/material-stocks"
      - "POST /om/material-requisitions and /stage, /issue, /return, /consume, /cancel"
    shared_operations: ["all GET endpoints"]
  - name: ClaimsOfficer
    description: "Finance officer preparing FEMA claims. Segregation of duties: certifier X-User-ID must differ from the submitting preparer"
    identity: opaque
    exclusive_operations: ["POST /om/fema-claims and /submit, /certify, /withdraw"]
    shared_operations: ["all GET endpoints"]
  - name: Regulator
    description: "External regulator; obligates and pays certified FEMA claims"
    identity: opaque
    exclusive_operations: ["POST /om/fema-claims/{id}/obligate, /mark_paid"]
    shared_operations: ["all GET endpoints"]
