  # ===========================================================================
  # Rule 6 — Boundary / precision checks in DIFFERENT numeric domains
  #   instance 1 → integer ceiling threshold with an inclusive comparison
  #   instance 2 → division-by-zero guard plus 1-decimal half-up percentage
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_ceiling_threshold_is_inclusive_at_exactly_three_of_four
        grounds:
          - calculations.committee_quorum_resolution
          - entities.RankList.fields.status
          - entities.RankList.fields.approved_at
          - endpoints.POST_/rank-lists/{id}/votes
        boundary_values:
          - "eligible_voters 4 → quorum_threshold = ceil(4 * 0.60) = ceil(2.4) = 3"
          - "approve_count 2 → 2 >= 3 is false → the list stays COMMITTEE_REVIEW (just below)"
          - "approve_count 3 → 3 >= 3 is true → the list becomes APPROVED (exactly at, inclusive)"
        distinguishing_aspect: |
          Two independent boundary traps in one number. Rounding 4 * 0.60 = 2.4 with round-half-up
          instead of ceil gives a threshold of 2, which would approve the list one ballot early;
          and using a strict > instead of the declared >= would refuse to approve at exactly 3.
          Only ceil plus an inclusive comparison reproduces the observed pair of outcomes.
        test_recipe:
          setup:
            - "one Program in RANKING with FOUR committee members f1..f4 and a separate program director"
            - "app1 is ADVANCED, interview COMPLETED, and carries two SUBMITTED score cards"
            - "one RankList in COMMITTEE_REVIEW at review_round 1 holding one entry at rank_position 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
