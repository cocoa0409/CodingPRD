            - "Trigger call 2: data.planned_coverage_pct_delta == 9.09, data.coverage_pct_delta == 0.00, data.status == \"PENDING_APPROVAL\", data.submitted_by_user_id == \"u_analyst_1\", data.return_count == 0."

