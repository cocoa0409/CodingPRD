  - rule_id: boundary_precision_check
    instances:
      - name: aux_electrical_load_exactly_at_chassis_ceiling_then_one_amp_over
        grounds:
          - calculations.aux_electrical_load
          - validations.priority_72_ERR_AUX_ELECTRICAL_LOAD_EXCEEDED
          - state_machines.ElectricalInterface.status.PROPOSED_to_APPROVED
          - entities.ChassisModel.fields.max_aux_amp_draw
        distinguishing_aspect: |
          The aux-load gate is inclusive (<=), and the fixture lands exactly on the ceiling: the
          F450 allows 40 A, the dump body draws 8 A and the hoist 5 A, so approving a 27 A
          body-controller interface makes the total precisely 40 A and MUST succeed. A second
          interface of just 1 A on a different signal source makes 41 A and MUST be rejected with
          ERR_AUX_ELECTRICAL_LOAD_EXCEEDED. An implementation using < instead of <= rejects the
          exact-ceiling case.
        test_recipe:
          setup:
            - "ChassisModel F450-SRW-60CA with max_aux_amp_draw 40 and a DISCRETE bus; chassis allocated so the ceiling is bound."
            - "BodySpec DUMP-12FT drawing 8 A and one DUMP-HOIST-10T installation drawing 5 A, both counted while PLANNED."
            - "Two PROPOSED BODY_BUILDER_MODULE interfaces on distinct signal sources: 27 A on BODY_CONTROLLER and 1 A on DISCRETE_CIRCUIT (distinct sources, so neither supersedes the other)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /upfit/chassis-models"
              payload: { code: "F450-SRW-60CA", make: "FORD", gvwr_lb: 14000, front_gawr_lb: 5000, rear_gawr_lb: 9450, wheelbase_in: 176, cab_to_axle_in: 60, curb_front_axle_lb: 4180, curb_rear_axle_lb: 2320, max_aux_amp_draw: 40, electrical_bus: "DISCRETE", pto_provision: "FULL", pto_max_flow_gpm: 14, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              captures: { cm_b: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "DUMP-12FT", body_type: "DUMP", weight_lb: 3400, cg_from_body_front_in: 78, cargo_cg_from_body_front_in: 84, length_in: 144, required_min_ca_in: 60, required_min_wheelbase_in: 176, aux_amp_draw: 8, requires_hydraulics: true, list_price_cents: 1120000 }
              as: PlantAdmin
              captures: { bs_dump: "$.data.id" }
