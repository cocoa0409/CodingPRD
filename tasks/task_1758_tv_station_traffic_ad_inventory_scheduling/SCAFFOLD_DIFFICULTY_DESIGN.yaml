scaffold_difficulty_design:
  # ======================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: discrepancy_credit_provisional_vs_final_on_spot
        grounds:
          - calculations.discrepancy_credit
          - state_machines.Spot.SCHEDULED_to_PREEMPTED
          - state_machines.LogDay.FINALIZED_to_RECONCILED
        distinguishing_aspect: |
          Same missed spot price produces a different credit depending on
          discovery context: manual preempt while the LogDay is DRAFT posts
          floor(20000 * 1.00) = 20000 cents (provisional variant), while
          reconcile discovering aired=false on a FINALIZED log posts
          floor(20000 * 1.25) = 25000 cents (final variant) — a strict
          5000-cent divergence on the Spot entity domain.
        test_recipe:
          setup:
            - "Advertiser A1 (RETAIL, credit 100000000), Program P (PRIME, weekday 6 = Saturday 2026-08-08, rating 5.0)"
            - "AvailWeek W (2026-08-03), AvailUnit U on P, air_date 2026-08-08, total 120s, reserve 0"
            - "Order O approved with one line L (30s, rate 20000c, guarantee 0, 1 week x 2 spots)"
            - "Second AvailUnit U_b on the same program/date (break_position 2, 120s) so the two same-category spots sit in different breaks"
            - "Copy CI RECEIVED 30s; s1 placed into U, s2 placed into U_b; LogDay LD for 2026-08-08 created (DRAFT)"
            - "Spot s1 manually preempted while LD is DRAFT (provisional credit 20000 posted)"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A1", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Sat Prime Movie", daypart_code: "PRIME", airs_weekday: 6, start_time_local: "20:00", duration_minutes: 120, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
              payload: { program_id: "${prog_id}", air_date: "2026-08-08", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit_id: "$.data.id",  unit_v0: "$.data.version"}
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
              payload: { program_id: "${prog_id}", air_date: "2026-08-08", break_position: 2, total_seconds: 120 }
              as: TrafficManager
              captures: { unitb_id: "$.data.id",  unitb_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 20000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v_sub: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v_sub}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot1_id: "$.data[0].id",  spot2_id: "$.data[1].id"}
            - call: "POST /traffic/spots/${spot1_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot2_id}/place"
              payload: { avail_unit_id: "${unitb_id}", expected_avail_unit_version: "${unitb_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week_id}/log-days"
              payload: { log_date: "2026-08-08" }
              as: TrafficManager
              captures: { log_id: "$.data.id"}
            - call: "POST /traffic/spots/${spot1_id}/preempt"
              payload: { preempt_reason: "NEWS_OVERRIDE" }
              as: TrafficManager
            - call: "POST /traffic/log-days/${log_id}/finalize"
              payload: {}
              as: TrafficManager
          trigger:
            - call: "POST /traffic/log-days/${log_id}/reconcile"
              payload: { entries: [ { spot_id: "${spot2_id}", aired: false } ] }
              as: BillingClerk
            - call: "GET /traffic/orders/${order_id}/post-buy"
              payload: {}
              as: BillingClerk
              captures: { total_credit: "$.data.discrepancy_credit_cents"}
          assert:
            - "Spot.${spot1_id}.status == PREEMPTED with preempt_reason == NEWS_OVERRIDE (manual preempt while log DRAFT)"
            - "Spot.${spot2_id}.status == PREEMPTED with preempt_reason == OVERSOLD (reconcile-discovered miss on FINALIZED log)"
            - "provisional variant on s1 posted 20000 cents (floor(20000 * 1.00)); final variant on s2 posted 25000 cents (floor(20000 * 1.25))"
            - "post-buy discrepancy_credit_cents == 45000 == 20000 + 25000 — the two variants diverge by exactly 5000 cents on identical gross_rate_cents"
      - name: audience_shortfall_per_spot_strict_vs_week_averaged
        grounds:
          - calculations.audience_delivery_shortfall
          - entities.OrderLine.fields.guaranteed_rating
        distinguishing_aspect: |
          Same aired ratings [3.0, 6.0] against guarantee 5.0 yield
          per_spot_strict deficit 2.0 points (no cross-spot offsetting) but
          week_averaged deficit 1.0 points (week avg 4.5, (5.0-4.5)*2 aired
          spots) — a dual-variant divergence on the OrderLine post-buy
          entity domain, distinct from the Spot-domain credit calculation.
        test_recipe:
          setup:
            - "Advertiser A2 (AUTOMOTIVE, credit 100000000), Program P2 (EARLY_NEWS, weekday 1 = Monday 2026-08-03, rating 5.0)"
            - "AvailWeek W2 (2026-08-03), AvailUnit U2 on P2 (air_date 2026-08-03, break 1, 120s) and AvailUnit U2b on P2 (air_date 2026-08-03, break 2, 120s) — separate breaks so same-category separation does not bind"
            - "Order O2 approved, line L2 (30s, rate 30000c, guaranteed_rating 5.0, 1 week x 2 spots), copy received, s21 placed in U2, s22 placed in U2b"
            - "LogDay LD2 for 2026-08-03 finalized, reconciled with actuals 3.0 and 6.0"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A2", product_category: "AUTOMOTIVE", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv2_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Mon Early News", daypart_code: "EARLY_NEWS", airs_weekday: 1, start_time_local: "17:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog2_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week2_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week2_id}/avail-units"
              payload: { program_id: "${prog2_id}", air_date: "2026-08-03", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit2_id: "$.data.id",  unit2_v0: "$.data.version"}
            - call: "POST /traffic/avail-weeks/${week2_id}/avail-units"
              payload: { program_id: "${prog2_id}", air_date: "2026-08-03", break_position: 2, total_seconds: 120 }
              as: TrafficManager
              captures: { unit2b_id: "$.data.id",  unit2b_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv2_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order2_id: "$.data.id"}
            - call: "POST /traffic/orders/${order2_id}/lines"
              payload: { program_id: "${prog2_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 30000, guaranteed_rating: 5.0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order2_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order2_id}"
              payload: {}
              as: SalesRep
              captures: { order2_v_sub: "$.data.version"}
            - call: "POST /traffic/orders/${order2_id}/approve"
              payload: { expected_order_version: "${order2_v_sub}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv2_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy2_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy2_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order2_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line2_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line2_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { s21_id: "$.data[0].id",  s22_id: "$.data[1].id"}
            - call: "POST /traffic/spots/${s21_id}/place"
              payload: { avail_unit_id: "${unit2_id}", expected_avail_unit_version: "${unit2_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${s22_id}/place"
              payload: { avail_unit_id: "${unit2b_id}", expected_avail_unit_version: "${unit2b_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week2_id}/log-days"
              payload: { log_date: "2026-08-03" }
              as: TrafficManager
              captures: { log2_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log2_id}/finalize"
              payload: {}
              as: TrafficManager
            - call: "POST /traffic/log-days/${log2_id}/reconcile"
              payload: { entries: [ { spot_id: "${s21_id}", aired: true, actual_rating: 3.0 }, { spot_id: "${s22_id}", aired: true, actual_rating: 6.0 } ] }
              as: BillingClerk
          trigger:
            - call: "GET /traffic/orders/${order2_id}/post-buy"
              payload: { method_variant: "per_spot_strict" }
              as: BillingClerk
              captures: { strict_shortfall: "$.data.shortfall_credit_cents"}
            - call: "GET /traffic/orders/${order2_id}/post-buy"
              payload: { method_variant: "week_averaged" }
              as: BillingClerk
              captures: { week_shortfall: "$.data.shortfall_credit_cents"}
          assert:
            - "per_spot_strict: deficits max(0, 5.0-3.0)=2.0 and max(0, 5.0-6.0)=0 -> 2.0 points -> shortfall_credit_cents == floor(2.0 * (30000/5.0)) == 12000"
            - "week_averaged: week avg (3.0+6.0)/2 == 4.5 -> (5.0-4.5) * 2 aired spots == 1.0 points -> shortfall_credit_cents == floor(1.0 * 6000) == 6000"
            - "strict_shortfall (12000) != week_shortfall (6000) for identical aired data — variant selection changes the number"

  # ======================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: avail_headroom_three_input_conditional_branch
        grounds:
          - calculations.avail_headroom_check
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with a conditional branch on entity state:
          commercial acceptance uses capacity (total_seconds -
          reserved_political_seconds) while political acceptance uses
          (total_seconds - booked_political - booked_commercial); the same
          60s unit with reserve 30 and 30s booked commercial accepts a 30s
          POLITICAL spot but rejects a 30s COMMERCIAL spot of identical
          length — the branch is keyed on Spot.spot_class, not on the
          numeric inputs alone.
        test_recipe:
          setup:
            - "Program P3 in political window (is_political_window true, weekday 2 = Tuesday 2026-08-04)"
            - "AvailWeek W3 (2026-08-03), AvailUnit U3 total 60s with reserved_political_seconds 30"
            - "Commercial advertiser A3c (RETAIL) with approved order line (30s x 2, guarantee 0); political advertiser A3p (POLITICAL) with approved line (30s x 1, guarantee 0)"
            - "First commercial spot placed into U3 (booked_commercial_seconds == 30)"
          setup_api_calls:
            - call: "POST /traffic/programs"
              payload: { title: "Tue News Special", daypart_code: "EARLY_NEWS", airs_weekday: 2, start_time_local: "18:00", duration_minutes: 30, rating_estimate: 4.0, is_political_window: true }
              as: TrafficManager
              captures: { prog3_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week3_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week3_id}/avail-units"
              payload: { program_id: "${prog3_id}", air_date: "2026-08-04", break_position: 1, total_seconds: 60, reserved_political_seconds: 30 }
              as: TrafficManager
              captures: { unit3_id: "$.data.id",  unit3_v0: "$.data.version"}
            - call: "POST /traffic/advertisers"
              payload: { name: "A3c", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv3c_id: "$.data.id"}
            - call: "POST /traffic/advertisers"
              payload: { name: "A3p", product_category: "POLITICAL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv3p_id: "$.data.id"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv3c_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order3c_id: "$.data.id"}
            - call: "POST /traffic/orders/${order3c_id}/lines"
              payload: { program_id: "${prog3_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 10000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order3c_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order3c_id}"
              payload: {}
              as: SalesRep
              captures: { order3c_v: "$.data.version"}
            - call: "POST /traffic/orders/${order3c_id}/approve"
              payload: { expected_order_version: "${order3c_v}" }
              as: TrafficManager
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv3p_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order3p_id: "$.data.id"}
            - call: "POST /traffic/orders/${order3p_id}/lines"
              payload: { program_id: "${prog3_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 10000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order3p_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order3p_id}"
              payload: {}
              as: SalesRep
              captures: { order3p_v: "$.data.version"}
            - call: "POST /traffic/orders/${order3p_id}/approve"
              payload: { expected_order_version: "${order3p_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order3c_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line3c_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line3c_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { c_spot1: "$.data[0].id",  c_spot2: "$.data[1].id"}
            - call: "GET /traffic/orders/${order3p_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line3p_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line3p_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { p_spot1: "$.data[0].id"}
            - call: "POST /traffic/spots/${c_spot1}/place"
              payload: { avail_unit_id: "${unit3_id}", expected_avail_unit_version: "${unit3_v0}" }
              as: TrafficManager
          trigger:
            - call: "POST /traffic/spots/${c_spot2}/place"
              payload: { avail_unit_id: "${unit3_id}", expected_avail_unit_version: "${unit3_v0} + 1" }
              as: TrafficManager
              captures: { commercial_err: "$.data.error_id"}
            - call: "POST /traffic/spots/${p_spot1}/place"
              payload: { avail_unit_id: "${unit3_id}", expected_avail_unit_version: "${unit3_v0} + 1" }
              as: TrafficManager
          assert:
            - "second COMMERCIAL 30s rejected: ${commercial_err} == ERR_POLITICAL_RESERVE — commercial capacity = 60 - 30 reserve = 30; booked 30 + 30 > 30"
            - "POLITICAL 30s accepted into the SAME unit: headroom = 60 - 0 - 30 = 30; 30 <= 30 -> Spot.${p_spot1}.status == SCHEDULED"
            - "identical duration, identical unit, identical remaining seconds: the spot_class branch alone decides acceptance"
      - name: post_buy_per_line_floor_rounding_order
        grounds:
          - calculations.post_buy_credit_value
          - calculations.audience_delivery_shortfall
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: pinned per-line
          floor gives floor(0.5 * (10000/3.0)) = 1666 cents per line, two
          lines -> 3332 total; the alternative sum-then-round order gives
          floor(1.0 * 3333.33) = 3333 — one cent apart. The scaffold pins
          per-line rounding, so the order credit MUST equal 3332, not 3333.
        test_recipe:
          setup:
            - "Advertiser A4 (FINANCE, credit 100000000), Program P4 (DAYTIME, weekday 3 = Wednesday 2026-08-05, rating 3.0)"
            - "AvailWeek W4, AvailUnit U4 (air_date 2026-08-05, break 1, 120s) and AvailUnit U5 (air_date 2026-08-05, break 2, 120s)"
            - "Order O4 approved with TWO lines L4a and L4b (each 30s x 1 spot, rate 10000c, guarantee 3.0) on P4; copy received"
            - "Spot of L4a placed into U4, spot of L4b placed into U5; LogDay finalized; both spots reconciled aired=true with actual_rating 2.5"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A4", product_category: "FINANCE", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv4_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Wed Daytime Block", daypart_code: "DAYTIME", airs_weekday: 3, start_time_local: "13:00", duration_minutes: 60, rating_estimate: 3.0 }
              as: TrafficManager
              captures: { prog4_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week4_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week4_id}/avail-units"
              payload: { program_id: "${prog4_id}", air_date: "2026-08-05", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit4_id: "$.data.id",  unit4_v0: "$.data.version"}
            - call: "POST /traffic/avail-weeks/${week4_id}/avail-units"
              payload: { program_id: "${prog4_id}", air_date: "2026-08-05", break_position: 2, total_seconds: 120 }
              as: TrafficManager
              captures: { unit5_id: "$.data.id",  unit5_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv4_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order4_id: "$.data.id"}
            - call: "POST /traffic/orders/${order4_id}/lines"
              payload: { program_id: "${prog4_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 10000, guaranteed_rating: 3.0 }
              as: SalesRep
              captures: { line4a_id: "$.data.id"}
            - call: "POST /traffic/orders/${order4_id}/lines"
              payload: { program_id: "${prog4_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 10000, guaranteed_rating: 3.0 }
              as: SalesRep
              captures: { line4b_id: "$.data.id"}
            - call: "POST /traffic/orders/${order4_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order4_id}"
              payload: {}
              as: SalesRep
              captures: { order4_v: "$.data.version"}
            - call: "POST /traffic/orders/${order4_id}/approve"
              payload: { expected_order_version: "${order4_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv4_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy4_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy4_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/order-lines/${line4a_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot4a_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line4b_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot4b_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot4a_id}/place"
              payload: { avail_unit_id: "${unit4_id}", expected_avail_unit_version: "${unit4_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot4b_id}/place"
              payload: { avail_unit_id: "${unit5_id}", expected_avail_unit_version: "${unit5_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week4_id}/log-days"
              payload: { log_date: "2026-08-05" }
              as: TrafficManager
              captures: { log4_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log4_id}/finalize"
              payload: {}
              as: TrafficManager
            - call: "POST /traffic/log-days/${log4_id}/reconcile"
              payload: { entries: [ { spot_id: "${spot4a_id}", aired: true, actual_rating: 2.5 }, { spot_id: "${spot4b_id}", aired: true, actual_rating: 2.5 } ] }
              as: BillingClerk
          trigger:
            - call: "GET /traffic/orders/${order4_id}/post-buy"
              payload: { method_variant: "per_spot_strict" }
              as: BillingClerk
          assert:
            - "per line: deficit max(0, 3.0-2.5) == 0.5 points; cpp == 10000/3.0 == 3333.33...; shortfall per line == floor(0.5 * 3333.33...) == 1666"
            - "order_credit_cents == 1666 + 1666 == 3332 under the pinned per-line floor order — NOT 3333 (the sum-then-round alternative)"
            - "shortfall_credit_cents == 3332 and discrepancy_credit_cents == 0 (all spots aired)"

  # ======================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_revision_loop_approved_revised_submitted
        grounds:
          - state_machines.Order.APPROVED_to_REVISED
          - state_machines.Order.REVISED_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Order exhibits the cycle APPROVED -> REVISED -> SUBMITTED ->
          APPROVED (revision loop with revision_no incrementing) — a
          non-linear machine on the Order entity, distinct from the Spot
          preemption cycle.
        test_recipe:
          setup:
            - "Advertiser A5 (RETAIL), Program P5 (PRIME weekday 4 = Thursday 2026-08-06, rating 5.0), week W5, unit U5 (2026-08-06, 120s)"
            - "Order O5 with one line (30s x 1, rate 15000c, guarantee 0) submitted and approved; 1 spot created PENDING_PLACEMENT"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A5", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv5_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Thu Prime", daypart_code: "PRIME", airs_weekday: 4, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog5_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week5_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week5_id}/avail-units"
              payload: { program_id: "${prog5_id}", air_date: "2026-08-06", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit5_id: "$.data.id"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv5_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order5_id: "$.data.id"}
            - call: "POST /traffic/orders/${order5_id}/lines"
              payload: { program_id: "${prog5_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 15000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order5_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order5_id}"
              payload: {}
              as: SalesRep
              captures: { order5_v1: "$.data.version"}
            - call: "POST /traffic/orders/${order5_id}/approve"
              payload: { expected_order_version: "${order5_v1}" }
              as: TrafficManager
          trigger:
            - call: "POST /traffic/orders/${order5_id}/revise"
              payload: {}
              as: SalesRep
            - call: "POST /traffic/orders/${order5_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order5_id}"
              payload: {}
              as: SalesRep
              captures: { order5_v2: "$.data.version",  order5_rev: "$.data.revision_no"}
            - call: "POST /traffic/orders/${order5_id}/approve"
              payload: { expected_order_version: "${order5_v2}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order5_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line5_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line5_id}/spots"
              payload: {}
              as: TrafficManager
          assert:
            - "after revise: Order.${order5_id}.revision_no == 1 and status was REVISED"
            - "after resubmit + second approve: Order.${order5_id}.status == APPROVED (cycle completed)"
            - "first-generation spot is CANCELLED; second-generation spots for the line number exactly 1 with status PENDING_PLACEMENT"
            - "revision_no stays 1 after the second approve (increments only on APPROVED -> REVISED)"
      - name: spot_preemption_makegood_cycle
        grounds:
          - state_machines.Spot.SCHEDULED_to_PREEMPTED
          - state_machines.Spot.PREEMPTED_to_MAKE_GOOD_OFFERED
          - state_machines.Spot.MAKE_GOOD_OFFERED_to_SCHEDULED
        distinguishing_aspect: |
          Spot exhibits the recovery loop SCHEDULED -> PREEMPTED ->
          MAKE_GOOD_OFFERED -> SCHEDULED, with the make-good row carrying
          make_good_of_spot_id back to the preempted original — a
          self-referential cycle on the Spot entity, a different entity
          than the Order revision loop.
        test_recipe:
          setup:
            - "Advertiser A6 (RETAIL), Program P6a (PRIME weekday 5 = Friday 2026-08-07, rating 5.0)"
            - "Week W6; unit U6a on P6a (break 1, 60s) and unit U6b on P6a (break 2, 60s) — same program so the make-good program-match and comparable-rating (5.0 >= 5.0) rules both pass"
            - "Order O6 approved, line on P6a (30s x 1, guarantee 0); spot s6 placed in U6a then preempted with OVERSOLD"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A6", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv6_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Fri Prime", daypart_code: "PRIME", airs_weekday: 5, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog6a_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week6_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week6_id}/avail-units"
              payload: { program_id: "${prog6a_id}", air_date: "2026-08-07", break_position: 1, total_seconds: 60 }
              as: TrafficManager
              captures: { unit6a_id: "$.data.id",  unit6a_v0: "$.data.version"}
            - call: "POST /traffic/avail-weeks/${week6_id}/avail-units"
              payload: { program_id: "${prog6a_id}", air_date: "2026-08-07", break_position: 2, total_seconds: 60 }
              as: TrafficManager
              captures: { unit6b_id: "$.data.id",  unit6b_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv6_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order6_id: "$.data.id"}
            - call: "POST /traffic/orders/${order6_id}/lines"
              payload: { program_id: "${prog6a_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 12000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order6_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order6_id}"
              payload: {}
              as: SalesRep
              captures: { order6_v: "$.data.version"}
            - call: "POST /traffic/orders/${order6_id}/approve"
              payload: { expected_order_version: "${order6_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order6_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line6_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line6_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot6_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot6_id}/place"
              payload: { avail_unit_id: "${unit6a_id}", expected_avail_unit_version: "${unit6a_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot6_id}/preempt"
              payload: { preempt_reason: "OVERSOLD" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot6_id}/offer-make-good"
              payload: {}
              as: TrafficManager
              captures: { mg6_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/spots/${mg6_id}/place"
              payload: { avail_unit_id: "${unit6b_id}", expected_avail_unit_version: "${unit6b_v0}" }
              as: TrafficManager
          assert:
            - "make-good Spot.${mg6_id}.status == SCHEDULED into U6b (same program, rating 5.0 >= 5.0 satisfies comparable-or-better)"
            - "Spot.${mg6_id}.make_good_of_spot_id == ${spot6_id} (self-referential back-link)"
            - "original Spot.${spot6_id}.status == PREEMPTED (the loop advances on the new row)"
            - "AvailUnit.${unit6a_id}.booked_commercial_seconds == 0 after preempt; AvailUnit.${unit6b_id}.booked_commercial_seconds == 30 after make-good placement"

  # ======================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_spot_copy_week_lock
        grounds:
          - state_machines.LogDay.DRAFT_to_FINALIZED
          - state_machines.AvailWeek.OPEN_to_LOCKED
          - calculations.copy_rotation_select
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /log-days/{id}/finalize: (1)
          LogDay DRAFT -> FINALIZED mutates (2) every scheduled Spot on the
          date (copy_instruction_id assigned by rotation), and the LogDay
          mutation itself forces (3) owning AvailWeek OPEN -> LOCKED, which
          then gates all further placement writes into any unit of the week.
        test_recipe:
          setup:
            - "Advertiser A7 (RESTAURANT), Program P7 (DAYTIME weekday 1 = Monday 2026-08-03, rating 2.0)"
            - "Week W7, unit U7 (2026-08-03, 120s); order approved, line (30s x 2, guarantee 0): spot s7a placed in U7, spot s7b left PENDING_PLACEMENT"
            - "Two RECEIVED copies C7a (weight 1, created first) and C7b (weight 1), both 30s"
            - "LogDay LD7 created for 2026-08-03 (DRAFT)"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A7", product_category: "RESTAURANT", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv7_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Mon Daytime", daypart_code: "DAYTIME", airs_weekday: 1, start_time_local: "14:00", duration_minutes: 60, rating_estimate: 2.0 }
              as: TrafficManager
              captures: { prog7_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week7_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week7_id}/avail-units"
              payload: { program_id: "${prog7_id}", air_date: "2026-08-03", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit7_id: "$.data.id",  unit7_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv7_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order7_id: "$.data.id"}
            - call: "POST /traffic/orders/${order7_id}/lines"
              payload: { program_id: "${prog7_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 8000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order7_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order7_id}"
              payload: {}
              as: SalesRep
              captures: { order7_v: "$.data.version"}
            - call: "POST /traffic/orders/${order7_id}/approve"
              payload: { expected_order_version: "${order7_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv7_id}", length_seconds: 30, rotation_weight: 1 }
              as: CopyCoordinator
              captures: { copy7a_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy7a_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv7_id}", length_seconds: 30, rotation_weight: 1 }
              as: CopyCoordinator
              captures: { copy7b_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy7b_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order7_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line7_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line7_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot7a_id: "$.data[0].id",  spot7b_id: "$.data[1].id"}
            - call: "POST /traffic/spots/${spot7a_id}/place"
              payload: { avail_unit_id: "${unit7_id}", expected_avail_unit_version: "${unit7_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week7_id}/log-days"
              payload: { log_date: "2026-08-03" }
              as: TrafficManager
              captures: { log7_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/log-days/${log7_id}/finalize"
              payload: {}
              as: TrafficManager
            - call: "GET /traffic/avail-units/${unit7_id}"
              payload: {}
              as: TrafficManager
              captures: { unit7_v_locked: "$.data.version"}
            - call: "POST /traffic/spots/${spot7b_id}/place"
              payload: { avail_unit_id: "${unit7_id}", expected_avail_unit_version: "${unit7_v_locked}" }
              as: TrafficManager
              captures: { gated_err: "$.data.error_id"}
          assert:
            - "hop 1: LogDay.${log7_id}.status == FINALIZED"
            - "hop 2: Spot.${spot7a_id}.copy_instruction_id == ${copy7a_id} (both copies unused at score 0; tie broken by created_at ASC -> earliest copy wins)"
            - "hop 3: AvailWeek.${week7_id}.status == LOCKED"
            - "gate: ${gated_err} == ERR_INVALID_STATE — the LOCKED week now rejects placement of s7b, proving the cascade's third hop gates child writes"
      - name: reconcile_cascade_spot_credit_week_close
        grounds:
          - state_machines.LogDay.FINALIZED_to_RECONCILED
          - state_machines.Spot.SCHEDULED_to_PREEMPTED
          - state_machines.AvailWeek.LOCKED_to_CLOSED
          - calculations.discrepancy_credit
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (POST
          /log-days/{id}/reconcile): (1) LogDay FINALIZED -> RECONCILED
          spawns AsRunEntry rows, whose aired=false entry drives (2) Spot
          SCHEDULED -> PREEMPTED with booked-second decrement and final-tier
          credit, and completion of the week's only LogDay drives (3)
          AvailWeek LOCKED -> CLOSED.
        test_recipe:
          setup:
            - "Advertiser A8 (PHARMA), Program P8 (LATE_FRINGE weekday 2 = Tuesday 2026-08-04, rating 1.5)"
            - "Week W8 with exactly one unit U8 (2026-08-04, 120s) and one LogDay LD8 (2026-08-04)"
            - "Order approved, line (30s x 1, rate 20000c, guarantee 0); copy received; spot placed in U8; LD8 finalized"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A8", product_category: "PHARMA", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv8_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Tue Late Fringe", daypart_code: "LATE_FRINGE", airs_weekday: 2, start_time_local: "23:30", duration_minutes: 60, rating_estimate: 1.5 }
              as: TrafficManager
              captures: { prog8_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week8_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week8_id}/avail-units"
              payload: { program_id: "${prog8_id}", air_date: "2026-08-04", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit8_id: "$.data.id",  unit8_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv8_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order8_id: "$.data.id"}
            - call: "POST /traffic/orders/${order8_id}/lines"
              payload: { program_id: "${prog8_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 20000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order8_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order8_id}"
              payload: {}
              as: SalesRep
              captures: { order8_v: "$.data.version"}
            - call: "POST /traffic/orders/${order8_id}/approve"
              payload: { expected_order_version: "${order8_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv8_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy8_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy8_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order8_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line8_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line8_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot8_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot8_id}/place"
              payload: { avail_unit_id: "${unit8_id}", expected_avail_unit_version: "${unit8_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week8_id}/log-days"
              payload: { log_date: "2026-08-04" }
              as: TrafficManager
              captures: { log8_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log8_id}/finalize"
              payload: {}
              as: TrafficManager
          trigger:
            - call: "POST /traffic/log-days/${log8_id}/reconcile"
              payload: { entries: [ { spot_id: "${spot8_id}", aired: false } ] }
              as: BillingClerk
            - call: "GET /traffic/orders/${order8_id}/post-buy"
              payload: {}
              as: BillingClerk
              captures: { credit8: "$.data.discrepancy_credit_cents"}
          assert:
            - "hop 1: LogDay.${log8_id}.status == RECONCILED and exactly 1 AsRunEntry exists under it"
            - "hop 2: Spot.${spot8_id}.status == PREEMPTED with preempt_reason == OVERSOLD; AvailUnit.${unit8_id}.booked_commercial_seconds == 0"
            - "hop 2 credit: ${credit8} == 25000 (floor(20000 * 1.25), final tier)"
            - "hop 3: AvailWeek.${week8_id}.status == CLOSED (its only LogDay reconciled)"

  # ======================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
