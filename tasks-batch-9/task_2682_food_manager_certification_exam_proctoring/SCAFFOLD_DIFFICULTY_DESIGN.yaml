  - rule_id: compensating_invariant
    instances:
      - name: assign_then_cancel_restores_access_code_inventory_conservation_with_release_residue
        grounds:
          - calculations.access_code_inventory_conservation
          - state_machines.AccessCode.ASSIGNED_to_AVAILABLE
          - state_machines.AccessCodeBatch.DEPLETED_to_ACTIVE
          - endpoints[POST /exam-sessions/{id}/cancellation]
          - entities.AccessCode.fields.assignment_release_count
        distinguishing_aspect: |
          Conserved quantity = access-code inventory:
          available_count + assigned_count + consumed_count + voided_count == quantity_purchased,
          which must hold after every single request. The perturbation (assignment) and its compensation
          (session cancellation) return available_count/assigned_count and the batch's own lifecycle
          state to exactly their pre-assignment values, and the ONLY permitted residue is the code's
          assignment_release_count, which increments once and is never reset — even when the freed code
          is immediately re-assigned to a different candidate. No money moves in either direction:
          cancellation returns inventory, not credit.
        test_recipe:
          setup:
            - "Baseline jurisdiction TX-TRAVIS / provider with 500000 credited / EN form / 2-seat site / REGISTERED proctor."
            - "Three candidates A, B, C and a 2-unit EXAM_ONLY batch (total_price_cents 7524, balance 492476, quantity_purchased 2)."
            - "Both codes assigned (one to A, one to B), so available_count 0, assigned_count 2 and the batch has already flipped ACTIVE -> DEPLETED; conservation reads 0 + 2 + 0 + 0 == 2."
            - "One SCHEDULED IN_PERSON sitting for candidate A on 2026-09-10T09:00:00Z holding A's code."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], accepts_remote_proctoring: true, requires_local_registration: true, posting_deadline_days: 30, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
