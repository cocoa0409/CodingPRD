      - name: well_visit_punctuality_at_both_window_boundaries
        grounds:
          - calculations.well_visit_punctuality
          - entities.WellVisit.fields.punctuality
          - entities.WellVisit.fields.window_open_date
          - entities.WellVisit.fields.window_close_date
          - state_machines.WellVisit.DUE_to_COMPLETED
        distinguishing_aspect: |
          Inclusive-boundary edge on POST /peds/well-visits/{id}/complete - a
          third distinct metric and endpoint. For a child born 2026-04-01,
          completing M2 on its window_open_date 2026-05-24 yields ON_SCHEDULE and
          completing M4 on its window_close_date 2026-08-15 also yields
          ON_SCHEDULE, while one day outside either edge yields EARLY (M6 on
          2026-09-22, opening 2026-09-23) and DELAYED (M9 on 2027-01-20, closing
          2027-01-15).
        test_recipe:
