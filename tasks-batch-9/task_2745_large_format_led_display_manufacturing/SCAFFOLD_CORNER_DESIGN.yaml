        grounds:
          - endpoints[POST /service-cases/{service_case_id}/fulfil]
          - calculations.spare_module_selector
        distinguishing_aspect: |
          Omitting replacement_module_id hands the choice to the server, and the
          fulfil-side ranking is NOT the reservation-side ranking: candidates are
          ordered by |color_bin_rank - outgoing rank| ASC first and only then by
          measured_brightness_nits DESC. With a B1 spare that is the BRIGHTEST in
          stock but two bins away, an A1 pair at 4850/4820 and an A2 at 4700, every
          plausible shortcut picks the wrong module — brightest-first picks the B1
          (which is not even eligible), created_at-first picks whatever was stocked
          earliest, and the reservation ordering (rank DESC) picks the A2. Only the
          declared two-key sort returns the 4850 A1.
