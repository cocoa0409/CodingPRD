      - name: single_receipt_ledger_cascade_resyncs_commission_tier_cap_before_distribution
        grounds:
          - calculations.sales_commission_accrual
          - calculations.waterfall_distribution
          - entities.WaterfallTier.fields.cap_usd
          - entities.SalesAgencyAgreement.fields.commission_earned_usd
          - entities.CollectionAccount.fields.balance_usd
          - entities.Film.fields.total_mg_collected_usd
          - "endpoints[POST /film-sales/payment-milestones/{id}/receipt]"
        distinguishing_aspect: |
          A LEDGER cascade rather than a state collapse, and ORDER-SENSITIVE: one receipt of
          900000.00 walks milestone -> contract collection_status -> Film.total_mg_collected_usd and
          SalesAgencyAgreement.commission_earned_usd -> the SALES_COMMISSION tier's cap_usd, which
          was authored as 1.00 and must be overwritten to exactly 90000.00. The next distribution of
          100000.00 then allocates 1250.00 to the collection fee and exactly 90000.00 (not the
          98750.00 the tier's pct_of_available alone would take) to commission, leaving residual
          8750.00. An implementation that resyncs the cap after the run, or never resyncs, cannot
          produce that pair of numbers.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; contract MG 2000000.00 EXECUTED; agreement commission_pct 0.10 with gross_collected_usd 0.00."
            - "OPEN collection account with two tiers created BEFORE any cash arrives: 1 COLLECTION_FEE 0.0125 cap 25000.00, 2 SALES_COMMISSION 1.00 cap 1.00 (a deliberately wrong authored cap)."
            - "No banking facility, so no BANK_DEBT tier participates."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
