          The handoff gate is a population check over the mission's InterventionEvents, so ARRIVE is 409
          ERR_TAKEOVER_REQUIRED while one event sits in ACTIVE and succeeds the moment that event reaches
          RELEASED; the release is what stamps control_seconds from the ASSUME instant, and the mission's
