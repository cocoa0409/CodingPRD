            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Lt Two", union_card_no: "U-1002", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t2: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 2 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { a1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t2}" }, as: ProductionManager, captures: { a2: $.data.id } }
            - { call: "POST /api/crew-assignments/${a1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-assignments/${a2}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t2}" }
            - { call: "POST /api/crew-assignments/${a1}/transition", payload: { to: WORKED, worked_hours: 8.00 }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-assignments/${a2}/transition", payload: { to: WORKED, worked_hours: 8.01 }, as: CrewChief, as_user_id: "${t2}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T18:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: COMPLETED }, as: ProductionManager }
            - { call: "GET /api/crew-assignments/${a1}", as: ProductionManager, captures: { a1_charge: $.data.labor_charge_cents } }
            - { call: "GET /api/crew-assignments/${a2}", as: ProductionManager, captures: { a2_charge: $.data.labor_charge_cents } }
          assert:
