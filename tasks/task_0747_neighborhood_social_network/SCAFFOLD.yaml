scenario: |
  Neighborhood Social & Safety Network (Nextdoor style): verified-resident onboarding
  & geofence, post/category & local feed, marketplace/recommendation, incident/safety
  alert & report, civic/agency notice, moderation & report/flag, business page & local
  ad, group/event.
domain_name: neighborhood-social-safety-network
api_prefix: /neighborhood

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions
    - derived_field_reconciliation

  entity_topology: graph
  # Residents, Businesses, Neighborhoods form a many-to-many verified-membership
  # graph. Content entities (Post, MarketplaceListing, Incident, CivicNotice, Group,
  # Event, LocalAd) fan out across Neighborhoods via a NeighborhoodPublication
  # junction. FlagReport and ModerationDecision reference content polymorphically
  # via (target_type, target_id).

  state_machine_shape: cyclic
  # VerificationRequest cycles REVIEW → RESUBMISSION_REQUIRED → REVIEW.
  # Post cycles PUBLISHED ↔ FLAGGED ↔ HIDDEN and can be RESTORED to PUBLISHED.
  # Neighborhood.safety_posture is compound (OPEN / ELEVATED / EMERGENCY),
  # derived from unresolved CRITICAL Incidents.

  relationship_patterns:
    - many_to_many              # Resident ↔ Neighborhood via ResidentMembership
    - polymorphic               # FlagReport.target_type ∈ {Post, MarketplaceListing, Incident, CivicNotice, Event}
    - cross_aggregate           # LocalAd references Business and targets Neighborhood[]

  role_model: peer_roles
  # Resident, BusinessOwner, Moderator (elevated Resident), AgencyOfficer (opaque),
  # PlatformAdmin (opaque). No approval chain — each role owns distinct actions.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: Neighborhood
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name (unique per state_code)
      - name: state_code
        type: string
        source: input
        description: 2-letter US state code
        constraints: "enum: {CA, NY, TX, WA, IL, MA, FL, OR}"
      - name: center_lat
        type: number
        source: input
        description: geofence center latitude, WGS84 decimal degrees
        constraints: "-90.0 <= center_lat <= 90.0"
      - name: center_lng
        type: number
        source: input
        description: geofence center longitude, WGS84 decimal degrees
        constraints: "-180.0 <= center_lng <= 180.0"
      - name: radius_meters
        type: integer
        source: input
        description: geofence radius in meters
        constraints: "100 <= radius_meters <= 5000"
      - name: safety_posture
        type: enum
        source: computed
        description: |
          Derived by calc `neighborhood_safety_posture` from unresolved
          CRITICAL Incidents older than the emergency threshold.
        default: OPEN
        constraints: "enum: {OPEN, ELEVATED, EMERGENCY}"
      - name: unresolved_critical_count
        type: integer
        source: computed
        description: cached count of Incidents with severity=CRITICAL AND status IN {OPEN, ACKNOWLEDGED}
        default: 0
      - name: verified_resident_count
        type: integer
        source: computed
        description: cached count of ResidentMembership rows with status=VERIFIED for this neighborhood

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: unique per Resident, lowercased
      - name: display_name
        type: string
        source: input
        description: public handle shown on posts
      - name: home_address_line
        type: string
        source: input
        description: street address for geofence check
      - name: home_lat
        type: number
        source: input
        description: home latitude for geofence containment check
      - name: home_lng
        type: number
        source: input
        description: home longitude
      - name: primary_neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; the neighborhood the Resident registered under (must contain home_lat/home_lng at register time)"
      - name: is_moderator
        type: boolean
        source: system
        description: elevated to true only via `POST /residents/{id}/promote-moderator` by PlatformAdmin
        default: false
      - name: trust_score
        type: integer
        source: computed
        description: |
          Weighted score computed by `resident_trust_score`; recomputed on every
          UPHELD/REVERSED ModerationDecision that names this Resident.
        default: 100
      - name: verification_status
        type: enum
        source: system
        description: mirror of the latest VerificationRequest.state for this Resident
        default: PENDING
        constraints: "enum: {PENDING, VERIFIED, REJECTED}"
      - name: is_suspended
        type: boolean
        source: system
        description: true when Resident's trust_score has fallen below the suspension floor; blocks new writes
        default: false

  - name: VerificationRequest
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; the neighborhood being verified into"
      - name: proof_type
        type: enum
        source: input
        description: kind of residence proof uploaded
        constraints: "enum: {UTILITY_BILL, LEASE, POSTCARD_CODE, GEOSTAMP_SELFIE}"
      - name: proof_reference
        type: string
        source: input
        description: opaque handle to the uploaded proof artifact
      - name: state
        type: enum
        source: system
        description: state machine per §1.2
        default: SUBMITTED
        constraints: "enum: {SUBMITTED, IN_REVIEW, RESUBMISSION_REQUIRED, APPROVED, REJECTED, EXPIRED}"
      - name: reviewer_moderator_id
        type: string
        source: system
        description: "FK -> Resident.id; moderator who reviewed (nullable until IN_REVIEW)"
      - name: submitted_at
        type: datetime
        source: system
        description: logical clock at SUBMITTED transition
      - name: expires_at
        type: datetime
        source: system
        description: submitted_at + 14 days; on expiry EXPIRED transition fires

  - name: ResidentMembership
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id"
      - name: status
        type: enum
        source: system
        description: mirrors the successful VerificationRequest outcome for the pair
        default: PENDING
        constraints: "enum: {PENDING, VERIFIED, REVOKED}"
      - name: verified_at
        type: datetime
        source: system
        description: set when status transitions PENDING -> VERIFIED
      - name: source_verification_id
        type: string
        source: system
        description: "FK -> VerificationRequest.id; the request that produced VERIFIED"

  - name: Post
    parent: null
    common_fields: true
    fields:
      - name: author_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; must be VERIFIED and not suspended"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; author must have VERIFIED ResidentMembership here"
      - name: category
        type: enum
        source: input
        description: post category
        constraints: "enum: {GENERAL, SAFETY, RECOMMENDATION, LOST_FOUND, FREE_ITEM, QUESTION, ANNOUNCEMENT}"
      - name: title
        type: string
        source: input
        description: post title
      - name: body
        type: string
        source: input
        description: post body (max 5000 chars)
      - name: state
        type: enum
        source: system
        description: state machine per §1.2
        default: PUBLISHED
        constraints: "enum: {PUBLISHED, FLAGGED, HIDDEN, REMOVED}"
      - name: flag_count
        type: integer
        source: computed
        description: count of FlagReports against this Post with status IN {OPEN, UPHELD}
        default: 0
      - name: local_relevance_score
        type: number
        source: computed
        description: |
          Feed ranking score; recomputed on every logical clock advance and on
          any FLAGGED/HIDDEN/RESTORED transition per calc `post_feed_score`.
        default: 0.0

  - name: MarketplaceListing
    parent: null
    common_fields: true
    fields:
      - name: seller_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; must be VERIFIED"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id"
      - name: title
        type: string
        source: input
        description: item title
      - name: price_cents
        type: integer
        source: input
        description: asking price in USD cents
        constraints: "0 <= price_cents <= 100000000"
      - name: kind
        type: enum
        source: input
        description: listing kind
        constraints: "enum: {FOR_SALE, FREE, WANTED, RECOMMENDATION}"
      - name: state
        type: enum
        source: system
        description: listing lifecycle
        default: ACTIVE
        constraints: "enum: {ACTIVE, RESERVED, SOLD, WITHDRAWN, SUSPENDED}"
      - name: reserved_for_resident_id
        type: string
        source: system
        description: "FK -> Resident.id; set on RESERVE, cleared on WITHDRAWN/SOLD-elsewhere"
      - name: reserved_until
        type: datetime
        source: system
        description: reservation expires at this logical clock; auto-releases to ACTIVE on expiry

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: reporter_resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; incident occurred inside this geofence"
      - name: incident_lat
        type: number
        source: input
        description: latitude of incident; MUST lie inside Neighborhood geofence
      - name: incident_lng
        type: number
        source: input
        description: longitude of incident
      - name: severity
        type: enum
        source: input
        description: reporter-declared severity
        constraints: "enum: {INFO, WARNING, CRITICAL}"
      - name: category
        type: enum
        source: input
        description: incident category
        constraints: "enum: {SUSPICIOUS_ACTIVITY, PROPERTY_CRIME, TRAFFIC_HAZARD, ENVIRONMENTAL, PERSON_MISSING, ANIMAL}"
      - name: description
        type: string
        source: input
        description: free text
      - name: status
        type: enum
        source: system
        description: incident status per §1.2
        default: OPEN
        constraints: "enum: {OPEN, ACKNOWLEDGED, RESOLVED, DISMISSED}"
      - name: acknowledged_by_officer_id
        type: string
        source: system
        description: opaque AgencyOfficer id who acknowledged
      - name: occurred_at
        type: datetime
        source: input
        description: when the incident occurred (must be <= current clock)
      - name: resolved_at
        type: datetime
        source: system
        description: set on RESOLVED or DISMISSED

  - name: CivicNotice
    parent: null
    common_fields: true
    fields:
      - name: agency_officer_id
        type: string
        source: input
        description: opaque X-User-ID of the AgencyOfficer publishing the notice
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; the notice targets this neighborhood"
      - name: title
        type: string
        source: input
        description: notice title
      - name: body
        type: string
        source: input
        description: notice body
      - name: notice_kind
        type: enum
        source: input
        description: kind of civic notice
        constraints: "enum: {POLICE, FIRE, PUBLIC_WORKS, HEALTH, ELECTION}"
      - name: effective_from
        type: datetime
        source: input
        description: notice publish time
      - name: effective_until
        type: datetime
        source: input
        description: notice expiration; MUST be strictly greater than effective_from
      - name: state
        type: enum
        source: system
        description: notice state
        default: SCHEDULED
        constraints: "enum: {SCHEDULED, ACTIVE, RETRACTED, EXPIRED}"

  - name: FlagReport
    parent: null
    common_fields: true
    fields:
      - name: reporter_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; must be VERIFIED"
      - name: target_type
        type: enum
        source: input
        description: polymorphic target kind
        constraints: "enum: {POST, MARKETPLACE_LISTING, INCIDENT, CIVIC_NOTICE, EVENT}"
      - name: target_id
        type: string
        source: input
        description: polymorphic id of target row (validated by target_type)
      - name: reason
        type: enum
        source: input
        description: flag reason
        constraints: "enum: {SPAM, HARASSMENT, MISINFORMATION, PROHIBITED, OFF_TOPIC, PRIVACY}"
      - name: status
        type: enum
        source: system
        description: flag lifecycle
        default: OPEN
        constraints: "enum: {OPEN, UPHELD, DISMISSED, REVERSED}"
      - name: linked_decision_id
        type: string
        source: system
        description: "FK -> ModerationDecision.id; set when a moderator rules"

  - name: ModerationDecision
    parent: null
    common_fields: true
    fields:
      - name: moderator_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; MUST have is_moderator=true"
      - name: flag_report_id
        type: string
        source: input
        description: "FK -> FlagReport.id; the report being ruled on"
      - name: decision
        type: enum
        source: input
        description: moderation ruling
        constraints: "enum: {UPHOLD, DISMISS, REVERSE}"
      - name: rationale
        type: string
        source: input
        description: required explanation
      - name: expected_target_version
        type: integer
        source: input
        description: OCC — the version of the flagged target as observed by the moderator
      - name: trust_delta_applied
        type: integer
        source: system
        description: signed integer added to author's trust_score per calc `resident_trust_score`

  - name: Business
    parent: null
    common_fields: true
    fields:
      - name: owner_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; MUST be VERIFIED at claim time"
      - name: name
        type: string
        source: input
        description: business display name
      - name: address_line
        type: string
        source: input
        description: street address
      - name: business_lat
        type: number
        source: input
        description: business latitude
      - name: business_lng
        type: number
        source: input
        description: business longitude
      - name: primary_neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; MUST contain business_lat/business_lng"
      - name: recommendation_count
        type: integer
        source: computed
        description: count of MarketplaceListing rows with kind=RECOMMENDATION targeting this business
        default: 0
      - name: state
        type: enum
        source: system
        description: business page state
        default: CLAIMED
        constraints: "enum: {CLAIMED, VERIFIED_BUSINESS, DISPUTED, DELISTED}"

  - name: LocalAd
    parent: null
    common_fields: true
    fields:
      - name: business_id
        type: string
        source: input
        description: "FK -> Business.id; MUST be VERIFIED_BUSINESS"
      - name: target_neighborhood_ids
        type: array
        source: input
        description: array of Neighborhood.id the ad targets
      - name: budget_cents
        type: integer
        source: input
        description: budget in USD cents
        constraints: "budget_cents >= 1000"
      - name: spend_cents
        type: integer
        source: system
        description: cumulative spend; MUST NOT exceed budget_cents
        default: 0
      - name: bid_cents_per_impression
        type: integer
        source: input
        description: bid per served impression
        constraints: "bid_cents_per_impression >= 1"
      - name: state
        type: enum
        source: system
        description: ad lifecycle per §1.2
        default: DRAFT
        constraints: "enum: {DRAFT, RUNNING, PAUSED, EXHAUSTED, ENDED}"
      - name: start_at
        type: datetime
        source: input
        description: earliest serve time
      - name: end_at
        type: datetime
        source: input
        description: latest serve time; end_at > start_at

  - name: Group
    parent: null
    common_fields: true
    fields:
      - name: creator_resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id"
      - name: name
        type: string
        source: input
        description: group name
      - name: is_private
        type: boolean
        source: input
        description: private groups require creator approval to join
        default: false

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: "FK -> Group.id; the group hosting the event"
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; MUST equal Group.neighborhood_id"
      - name: title
        type: string
        source: input
        description: event title
      - name: venue_lat
        type: number
        source: input
        description: venue latitude; MUST lie inside Neighborhood geofence
      - name: venue_lng
        type: number
        source: input
        description: venue longitude
      - name: starts_at
        type: datetime
        source: input
        description: event start; starts_at > current logical clock at creation
      - name: ends_at
        type: datetime
        source: input
        description: event end; ends_at > starts_at
      - name: capacity
        type: integer
        source: input
        description: max attendee count
        constraints: "1 <= capacity <= 500"
      - name: rsvp_count
        type: integer
        source: computed
        description: count of EventRSVP rows with event_id=this.id and rsvp_status=YES
        default: 0
      - name: state
        type: enum
        source: system
        description: event lifecycle
        default: SCHEDULED
        constraints: "enum: {SCHEDULED, CANCELLED, COMPLETED}"

  - name: EventRSVP
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: rsvp_status
        type: enum
        source: input
        description: RSVP status
        default: YES
        constraints: "enum: {YES, NO, MAYBE}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: VerificationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /verification-requests/{id}/claim"
        actor: Moderator
        preconditions:
          - "current logical clock < VerificationRequest.expires_at"
        side_effects:
          - "Set VerificationRequest.reviewer_moderator_id to the acting moderator id"
          - "Update Resident.verification_status = PENDING (unchanged)"
      - from: IN_REVIEW
        to: RESUBMISSION_REQUIRED
        trigger: "POST /verification-requests/{id}/request-resubmission"
        actor: Moderator
        preconditions:
          - "The acting moderator MUST equal reviewer_moderator_id"
        side_effects:
          - "Emit VerificationRequest.state=RESUBMISSION_REQUIRED"
        note: "cyclic — resident may resubmit and re-enter IN_REVIEW"
      - from: RESUBMISSION_REQUIRED
        to: IN_REVIEW
        trigger: "POST /verification-requests/{id}/resubmit"
        actor: Resident
        preconditions:
          - "The acting Resident MUST equal resident_id"
          - "current logical clock < VerificationRequest.expires_at"
        side_effects:
          - "Replace VerificationRequest.proof_reference with new value"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /verification-requests/{id}/approve"
        actor: Moderator
        preconditions:
          - "The acting moderator MUST equal reviewer_moderator_id"
        side_effects:
          - "Create or update ResidentMembership(resident_id, neighborhood_id) with status=VERIFIED, verified_at=now, source_verification_id=id"
          - "Update Resident.verification_status=VERIFIED"
          - "Increment Neighborhood.verified_resident_count by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /verification-requests/{id}/reject"
        actor: Moderator
        preconditions:
          - "The acting moderator MUST equal reviewer_moderator_id"
        side_effects:
          - "Update Resident.verification_status=REJECTED"
          - "Decrement Resident.trust_score by REJECTION_PENALTY (10 points)"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "System auto-transition at expires_at"
        actor: system
        preconditions:
          - "current logical clock >= VerificationRequest.expires_at"
        side_effects:
          - "Update Resident.verification_status=REJECTED"

  - entity: Post
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: FLAGGED
        trigger: "System: FlagReport.flag_count crosses FLAG_HIDE_THRESHOLD"
        actor: system
        preconditions:
          - "Post.flag_count >= FLAG_HIDE_THRESHOLD (3)"
        side_effects:
          - "Update Post.state=FLAGGED"
          - "Recompute Post.local_relevance_score with flag penalty"
      - from: FLAGGED
        to: HIDDEN
        trigger: "POST /moderation-decisions with decision=UPHOLD on a Post target"
        actor: Moderator
        preconditions:
          - "FlagReport.target_type=POST and FlagReport.status=OPEN"
        side_effects:
          - "Update Post.state=HIDDEN"
          - "Update ALL FlagReports against this Post from OPEN to UPHELD"
          - "Decrement Post.author_resident.trust_score by MOD_UPHOLD_PENALTY (25) — cascade step 1/2"
          - "If author's trust_score after decrement < SUSPENSION_FLOOR (60), set Resident.is_suspended=true — cascade step 2/2"
      - from: FLAGGED
        to: PUBLISHED
        trigger: "POST /moderation-decisions with decision=DISMISS on a Post target"
        actor: Moderator
        preconditions:
          - "FlagReport.status=OPEN"
        side_effects:
          - "Update FlagReport.status=DISMISSED"
          - "Update Post.state=PUBLISHED"
          - "Reset Post.flag_count to number of remaining OPEN FlagReports"
        note: "cyclic — a subsequent flag surge can re-enter FLAGGED"
      - from: HIDDEN
        to: PUBLISHED
        trigger: "POST /moderation-decisions with decision=REVERSE on a Post target"
        actor: Moderator
        preconditions:
          - "Post.state=HIDDEN"
          - "A prior UPHELD ModerationDecision on this Post exists"
        side_effects:
          - "Update Post.state=PUBLISHED"
          - "Update ALL UPHELD FlagReports against this Post to REVERSED"
          - "Restore Post.author_resident.trust_score by MOD_UPHOLD_PENALTY (25) — cascade step 1/2 — compensating"
          - "If Resident.trust_score after restore >= SUSPENSION_FLOOR (60), set Resident.is_suspended=false — cascade step 2/2 — compensating"
      - from: PUBLISHED
        to: REMOVED
        trigger: "DELETE /posts/{id}"
        actor: Resident | PlatformAdmin
        preconditions:
          - "Resident acting must equal Post.author_resident_id, OR actor is PlatformAdmin"
        side_effects:
          - "Update Post.state=REMOVED"
          - "Dismiss all OPEN FlagReports against this Post as DISMISSED"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /incidents/{id}/acknowledge"
        actor: AgencyOfficer
        preconditions:
          - "Incident.status=OPEN"
        side_effects:
          - "Set Incident.acknowledged_by_officer_id to the acting officer id"
          - "Recompute Neighborhood.safety_posture via `neighborhood_safety_posture`"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: AgencyOfficer
        preconditions:
          - "Incident.status=ACKNOWLEDGED"
          - "Acting officer id MUST equal Incident.acknowledged_by_officer_id"
        side_effects:
          - "Set Incident.resolved_at to current logical clock"
          - "Decrement Neighborhood.unresolved_critical_count by 1 IF Incident.severity=CRITICAL — cascade step 1/3"
          - "Recompute Neighborhood.safety_posture — cascade step 2/3"
          - "IF new safety_posture=OPEN, recompute Post.local_relevance_score for all PUBLISHED Posts in this Neighborhood — cascade step 3/3"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /incidents/{id}/dismiss"
        actor: AgencyOfficer | PlatformAdmin
        preconditions:
          - "Incident.status=OPEN"
        side_effects:
          - "Set Incident.resolved_at to current logical clock"
          - "IF Incident.severity=CRITICAL, decrement Neighborhood.unresolved_critical_count by 1 and recompute safety_posture"

  - entity: LocalAd
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: RUNNING
        trigger: "POST /local-ads/{id}/start"
        actor: BusinessOwner
        preconditions:
          - "current logical clock >= LocalAd.start_at"
          - "current logical clock < LocalAd.end_at"
          - "LocalAd.spend_cents < LocalAd.budget_cents"
        side_effects:
          - "Update LocalAd.state=RUNNING"
      - from: RUNNING
        to: PAUSED
        trigger: "POST /local-ads/{id}/pause"
        actor: BusinessOwner
        preconditions:
          - "LocalAd.state=RUNNING"
        side_effects:
          - "Update LocalAd.state=PAUSED"
        note: "cyclic — a paused ad may resume via /resume"
      - from: PAUSED
        to: RUNNING
        trigger: "POST /local-ads/{id}/resume"
        actor: BusinessOwner
        preconditions:
          - "LocalAd.state=PAUSED"
          - "current logical clock < LocalAd.end_at"
          - "LocalAd.spend_cents < LocalAd.budget_cents"
        side_effects:
          - "Update LocalAd.state=RUNNING"
      - from: RUNNING
        to: EXHAUSTED
        trigger: "System on impression that pushes spend_cents to budget_cents"
        actor: system
        preconditions:
          - "LocalAd.spend_cents + bid_cents_per_impression >= LocalAd.budget_cents"
        side_effects:
          - "Cap LocalAd.spend_cents at exactly LocalAd.budget_cents"
          - "Update LocalAd.state=EXHAUSTED"
      - from: RUNNING
        to: ENDED
        trigger: "System auto-transition at end_at"
        actor: system
        preconditions:
          - "current logical clock >= LocalAd.end_at"
        side_effects:
          - "Update LocalAd.state=ENDED"
      - from: PAUSED
        to: ENDED
        trigger: "System auto-transition at end_at"
        actor: system
        preconditions:
          - "current logical clock >= LocalAd.end_at"
        side_effects:
          - "Update LocalAd.state=ENDED"

  - entity: MarketplaceListing
    initial_state: ACTIVE
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: RESERVED
        trigger: "POST /marketplace-listings/{id}/reserve"
        actor: Resident
        preconditions:
          - "MarketplaceListing.state=ACTIVE"
          - "Acting Resident is NOT the seller_resident_id"
          - "Acting Resident has VERIFIED ResidentMembership in MarketplaceListing.neighborhood_id"
        side_effects:
          - "Set reserved_for_resident_id to acting Resident.id"
          - "Set reserved_until = current clock + RESERVATION_HOURS (48h)"
      - from: RESERVED
        to: ACTIVE
        trigger: "System auto-transition at reserved_until"
        actor: system
        preconditions:
          - "current logical clock >= MarketplaceListing.reserved_until"
        side_effects:
          - "Clear reserved_for_resident_id and reserved_until"
      - from: RESERVED
        to: SOLD
        trigger: "POST /marketplace-listings/{id}/confirm-sold"
        actor: Resident
        preconditions:
          - "Acting Resident MUST equal seller_resident_id"
        side_effects:
          - "Recompute Business.recommendation_count if kind=RECOMMENDATION"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /marketplace-listings/{id}/withdraw"
        actor: Resident
        preconditions:
          - "Acting Resident MUST equal seller_resident_id"
        side_effects:
          - "Clear reserved_for_resident_id if set"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /moderation-decisions with decision=UPHOLD on a MarketplaceListing target"
        actor: Moderator
        preconditions:
          - "FlagReport.target_type=MARKETPLACE_LISTING and FlagReport.status=OPEN"
        side_effects:
          - "Update MarketplaceListing.state=SUSPENDED"
          - "Decrement seller Resident.trust_score by MOD_UPHOLD_PENALTY (25)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /moderation-decisions with decision=REVERSE on a MarketplaceListing target"
        actor: Moderator
        preconditions:
          - "MarketplaceListing.state=SUSPENDED"
        side_effects:
          - "Restore seller Resident.trust_score by MOD_UPHOLD_PENALTY (25) — compensating"

  - entity: CivicNotice
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, RETRACTED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "System auto-transition at effective_from"
        actor: system
        preconditions:
          - "current logical clock >= CivicNotice.effective_from"
          - "current logical clock < CivicNotice.effective_until"
        side_effects:
          - "Update CivicNotice.state=ACTIVE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "System auto-transition at effective_until"
        actor: system
        preconditions:
          - "current logical clock >= CivicNotice.effective_until"
        side_effects:
          - "Update CivicNotice.state=EXPIRED"
      - from: SCHEDULED
        to: RETRACTED
        trigger: "POST /civic-notices/{id}/retract"
        actor: AgencyOfficer
        preconditions:
          - "Acting officer id MUST equal CivicNotice.agency_officer_id"
        side_effects: []
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /civic-notices/{id}/retract"
        actor: AgencyOfficer
        preconditions:
          - "Acting officer id MUST equal CivicNotice.agency_officer_id"
        side_effects: []

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Resident
        preconditions:
          - "Acting Resident MUST equal Group.creator_resident_id of Event.group_id"
        side_effects:
          - "Update Event.state=CANCELLED"
          - "Delete every EventRSVP row with event_id=Event.id (rsvp_count -> 0)"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "System auto-transition at ends_at"
        actor: system
        preconditions:
          - "current logical clock >= Event.ends_at"
        side_effects:
          - "Update Event.state=COMPLETED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------

concurrency_rules:
  - rule_id: moderation-decision-stale-target
    parent_entity: Post
    write_endpoint: "POST /moderation-decisions"
    occ_field: "expected_target_version"
    description: |
      When a moderator submits a ModerationDecision, expected_target_version
      MUST equal the flagged Post's current version. This captures the true
      race in which a second moderator's decision (which legitimately supersedes
      the prior state — e.g., FLAGGED→PUBLISHED via DISMISS) has already
      advanced Post.version; the current moderator's view is therefore stale
      and the second decision would otherwise flip the just-restored Post.
    error_id: ERR_STALE_TARGET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: resident_trust_score
    trigger: |
      Recomputed after every ModerationDecision (UPHOLD/DISMISS/REVERSE) on a
      Post or MarketplaceListing whose author/seller is this Resident, and
      after every VerificationRequest REJECTED transition on this Resident.
    algorithm: weighted_scoring
    formula: |
      # Base score is 100. Recompute from scratch each time using persisted
      # ModerationDecision rows keyed on Resident (deterministic replay).
      score = 100
      # Order rows by (created_at ASC, id ASC) — created_at fallback only,
      # id NEVER decides observable outcome.
      for decision in ModerationDecision rows where
          target's author/seller_resident_id == this.resident_id
          ordered by (created_at ASC):
        if decision.decision == UPHOLD:
          score = score - MOD_UPHOLD_PENALTY   # -25
        elif decision.decision == REVERSE and a prior UPHELD row exists for same target:
          score = score + MOD_UPHOLD_PENALTY   # +25 (compensating)
        elif decision.decision == DISMISS:
          pass                                  # no delta
      for verif in VerificationRequest rows where resident_id == this.id
          and state == REJECTED
          ordered by (created_at ASC):
        score = score - REJECTION_PENALTY      # -10
      # Clamp at floor 0.
      score = max(0, score)
    input_set: |
      All ModerationDecision rows whose flagged target's author/seller_resident_id
      matches this Resident.id, plus all VerificationRequest rows for this Resident
      with state=REJECTED. Rows in OPEN, PENDING, or DISMISSED states are excluded.
    constants:
      MOD_UPHOLD_PENALTY: 25
      REJECTION_PENALTY: 10
      SUSPENSION_FLOOR: 60
    precision: integer, no rounding
    variants: []

  - name: neighborhood_safety_posture
    trigger: |
      Recomputed on every Incident state transition into or out of {OPEN,
      ACKNOWLEDGED, RESOLVED, DISMISSED}, and on every clock-set that crosses
      the EMERGENCY threshold.
    algorithm: threshold
    formula: |
      # Two thresholds gate the enum. Evaluate against unresolved_critical_count
      # AND the age of the oldest OPEN critical incident. Both conditions use
      # `>=` (see BOUNDARY note below).
      unresolved_critical = count(Incident where
          neighborhood_id == this.id
          AND severity == CRITICAL
          AND status IN {OPEN, ACKNOWLEDGED})
      oldest_open_age_seconds = current_clock - min(occurred_at where
          neighborhood_id == this.id
          AND severity == CRITICAL
          AND status == OPEN) if any else 0

      if unresolved_critical >= EMERGENCY_INCIDENT_COUNT:  # >= 3
        posture = EMERGENCY
      elif unresolved_critical >= ELEVATED_INCIDENT_COUNT: # >= 1
        posture = ELEVATED
      elif oldest_open_age_seconds >= ELEVATED_AGE_SECONDS:  # >= 3600 (1h)
        posture = ELEVATED
      else:
        posture = OPEN
    input_set: |
      Incidents scoped to this Neighborhood in {OPEN, ACKNOWLEDGED}.
      RESOLVED and DISMISSED incidents are excluded.
    constants:
      EMERGENCY_INCIDENT_COUNT: 3
      ELEVATED_INCIDENT_COUNT: 1
      ELEVATED_AGE_SECONDS: 3600
    precision: enum, no rounding
    variants: []

  - name: post_feed_score
    trigger: |
      Recomputed on every Post write, on every Neighborhood.safety_posture
      transition, and on every logical-clock advance that crosses the recency
      decay boundary.
    algorithm: weighted_scoring
    formula: |
      # Multi-factor weighted score; two rounding modes matter (see note).
      # ORDER OF OPERATIONS IS PINNED: (1) compute per-component scores at
      # full precision; (2) sum; (3) round-half-up to 2 decimal places at
      # the FINAL step. NOT per-component-then-sum.
      age_hours = (current_clock - post.created_at) / 3600
      recency = max(0.0, 1.0 - age_hours / RECENCY_HALF_LIFE_HOURS)
      category_weight = {
        SAFETY: 1.5, ANNOUNCEMENT: 1.3, LOST_FOUND: 1.2,
        RECOMMENDATION: 1.0, QUESTION: 0.9, FREE_ITEM: 0.9, GENERAL: 0.8
      }[post.category]
      posture_multiplier = 2.0 if Neighborhood.safety_posture == EMERGENCY and post.category == SAFETY
                          else 1.5 if Neighborhood.safety_posture == ELEVATED and post.category == SAFETY
                          else 1.0
      flag_penalty = -0.30 * post.flag_count
      # Sum at full precision, THEN round.
      raw = (RECENCY_WEIGHT * recency + CATEGORY_WEIGHT * category_weight
             + posture_multiplier + flag_penalty)
      score = round_half_up(raw, 2)
    input_set: |
      One row: the Post itself, plus the Neighborhood.safety_posture as of
      current clock. Only PUBLISHED and FLAGGED posts are ranked; HIDDEN,
      REMOVED, and posts whose author is_suspended=true are excluded from
      any list ranked by this score.
    constants:
      RECENCY_WEIGHT: 0.5
      CATEGORY_WEIGHT: 0.4
      RECENCY_HALF_LIFE_HOURS: 72
    precision: 2 decimal places, round_half_up, applied at FINAL sum only
    variants:
      - name: safety_boost
        when: "post.category == SAFETY AND Neighborhood.safety_posture IN {ELEVATED, EMERGENCY}"
        difference: "posture_multiplier > 1.0 further amplifies score"

  - name: ad_impression_charge
    trigger: |
      Runs on every LocalAd impression served against a Neighborhood in
      LocalAd.target_neighborhood_ids while state=RUNNING.
    algorithm: waterfall_allocation
    formula: |
      # Impression charge is capped at remaining budget — deliberate spend
      # cap and possible state transition to EXHAUSTED. Order of operations
      # is PINNED: (1) determine charge = min(bid, remaining); (2) increment
      # spend; (3) determine new state.
      remaining = LocalAd.budget_cents - LocalAd.spend_cents
      if remaining <= 0:
        raise ERR_AD_EXHAUSTED  # RUNNING→EXHAUSTED path already fired
      charge = min(LocalAd.bid_cents_per_impression, remaining)
      new_spend = LocalAd.spend_cents + charge
      LocalAd.spend_cents = new_spend
      if new_spend >= LocalAd.budget_cents:
        LocalAd.state = EXHAUSTED
    input_set: |
      LocalAd rows with state=RUNNING and current_clock in [start_at, end_at).
      DRAFT, PAUSED, EXHAUSTED, ENDED are excluded.
    constants: {}
    precision: integer cents, no rounding
    variants:
      - name: last_impression_underbid
        when: "remaining < bid_cents_per_impression"
        difference: "charge = remaining (not full bid); state transitions to EXHAUSTED same impression"

  - name: event_capacity_reservation
    trigger: |
      Runs on POST /events/{id}/rsvp when rsvp_status=YES.
    algorithm: threshold
    formula: |
      # Boundary is strict inequality: reject when rsvp_count == capacity.
      # A 500-capacity event MUST admit resident #500 (rsvp_count 499 -> 500)
      # and reject resident #501.
      if Event.rsvp_count >= Event.capacity:
        raise ERR_EVENT_FULL
      Event.rsvp_count = Event.rsvp_count + 1
    input_set: |
      Event rows with state=SCHEDULED. CANCELLED and COMPLETED events reject
      RSVP with ERR_INVALID_STATE (ordered before capacity check).
    constants: {}
    precision: integer, no rounding
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 30
    category: auth
    check: "For entity_backed roles, X-User-ID must match the id of an existing entity of that type"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 40
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 50
    category: existence
    check: "Every path-templated id resolves to a live row (left-to-right in the URL)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 60
    category: existence
    check: "Every foreign-key id in the request body resolves to a live row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /verification-requests, POST /posts, POST /marketplace-listings, POST /incidents, POST /civic-notices, POST /flag-reports, POST /moderation-decisions, POST /businesses, POST /local-ads, POST /groups, POST /events"
  - priority: 70
    category: state
    check: "Target entity's current state is a valid `from:` in §1.2 for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 80
    category: state
    check: "For OCC-guarded writes, expected_target_version equals the parent's current version"
    error_id: ERR_STALE_TARGET_VERSION
    http_status: 412
    applies_to: "POST /moderation-decisions"
  - priority: 90
    category: business_safety
    check: "Resident.is_suspended=true blocks new writes on POST /posts, POST /marketplace-listings, POST /incidents, POST /flag-reports"
    error_id: ERR_RESIDENT_SUSPENDED
    http_status: 403
    applies_to: "POST /posts, POST /marketplace-listings, POST /incidents, POST /flag-reports"
  - priority: 100
    category: business_referential
    check: "The acting Resident MUST have a ResidentMembership row with status=VERIFIED for the target Neighborhood (post/incident/listing/group/event/flag/business claim)"
    error_id: ERR_NOT_VERIFIED_IN_NEIGHBORHOOD
    http_status: 403
    applies_to: "POST /posts, POST /marketplace-listings, POST /incidents, POST /flag-reports, POST /businesses, POST /groups, POST /events"
  - priority: 110
    category: business_safety
    check: "Neighborhood.safety_posture=EMERGENCY blocks POST /local-ads/{id}/start and POST /marketplace-listings for the affected Neighborhood; safety-category Posts remain allowed"
    error_id: ERR_NEIGHBORHOOD_EMERGENCY_LOCKDOWN
    http_status: 409
    applies_to: "POST /local-ads/{id}/start, POST /marketplace-listings"
  - priority: 120
    category: business_temporal
    check: "For CivicNotice: effective_until MUST be strictly greater than effective_from"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /civic-notices"
  - priority: 121
    category: business_temporal
    check: "For CivicNotice: effective_from MUST be >= current logical clock"
    error_id: ERR_EFFECTIVE_FROM_IN_PAST
    http_status: 422
    applies_to: "POST /civic-notices"
  - priority: 122
    category: business_temporal
    check: "Event.starts_at > current logical clock AND Event.ends_at > Event.starts_at"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /events"
  - priority: 123
    category: business_temporal
    check: "LocalAd.end_at > LocalAd.start_at"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /local-ads"
  - priority: 130
    category: business_constraint
    check: "For CivicNotice POST: NO overlap with another ACTIVE or SCHEDULED CivicNotice on the same (neighborhood_id, notice_kind) — intervals are half-open [effective_from, effective_until). Touching endpoints (A.effective_until == B.effective_from) DO NOT overlap."
    error_id: ERR_NOTICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /civic-notices"
  - priority: 131
    category: business_constraint
    check: "For Event POST: aggregate rsvp_count across all SCHEDULED Events on the same (group_id) whose [starts_at, ends_at) intervals overlap MUST NOT exceed 3 concurrent events. Adjacency (A.ends_at == B.starts_at) is NOT overlap."
    error_id: ERR_GROUP_EVENT_CAPACITY
    http_status: 409
    applies_to: "POST /events"
  - priority: 140
    category: business_referential
    check: "Post.author_resident_id MUST equal X-User-ID for Resident-acted writes on /posts/{id}"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "DELETE /posts/{id}"
  - priority: 141
    category: business_referential
    check: "MarketplaceListing.seller_resident_id must equal X-User-ID for /confirm-sold and /withdraw"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /marketplace-listings/{id}/confirm-sold, POST /marketplace-listings/{id}/withdraw"
  - priority: 150
    category: business_safety
    check: "Incident.incident_lat/lng MUST lie inside Neighborhood.geofence circle (distance <= radius_meters); Event.venue_lat/lng likewise"
    error_id: ERR_LOCATION_OUTSIDE_GEOFENCE
    http_status: 422
    applies_to: "POST /incidents, POST /events"
  - priority: 151
    category: business_safety
    check: "Resident.home_lat/home_lng MUST lie inside primary_neighborhood_id geofence at registration; MUST match at claim of a Business too"
    error_id: ERR_LOCATION_OUTSIDE_GEOFENCE
    http_status: 422
    applies_to: "POST /residents, POST /businesses"
  - priority: 160
    category: business_fiscal
    check: "LocalAd.budget_cents >= 1000; LocalAd.bid_cents_per_impression >= 1"
    error_id: ERR_INVALID_BUDGET
    http_status: 422
    applies_to: "POST /local-ads"
  - priority: 161
    category: business_fiscal
    check: "MarketplaceListing.price_cents in [0, 100000000]"
    error_id: ERR_INVALID_PRICE
    http_status: 422
    applies_to: "POST /marketplace-listings"
  - priority: 170
    category: business_constraint
    check: "FlagReport (reporter_resident_id, target_type, target_id) MUST be unique across OPEN + UPHELD rows"
    error_id: ERR_DUPLICATE_FLAG
    http_status: 409
    applies_to: "POST /flag-reports"
  - priority: 171
    category: business_constraint
    check: "MarketplaceListing.reserved_for_resident_id may not equal seller_resident_id"
    error_id: ERR_CANNOT_RESERVE_OWN
    http_status: 409
    applies_to: "POST /marketplace-listings/{id}/reserve"
  - priority: 180
    category: business_constraint
    check: "Payload conforms to endpoint's input schema (types, enums, required fields)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================

endpoints:
  # ---- Neighborhoods ----
  - method: POST
    path: "/neighborhood/neighborhoods"
    description: "Create a neighborhood (PlatformAdmin only)."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "state_code", "center_lat", "center_lng", "radius_meters"]
    output: Neighborhood
    side_effects: []
  - method: GET
    path: "/neighborhood/neighborhoods/{id}"
    description: "Fetch a neighborhood (also returns computed safety_posture, unresolved_critical_count, verified_resident_count)."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Neighborhood
    side_effects: []
  - method: GET
    path: "/neighborhood/neighborhoods"
    description: "List neighborhoods filtered by state_code."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Neighborhood[]
    side_effects: []

  # ---- Residents ----
  - method: POST
    path: "/neighborhood/residents"
    description: "Register a Resident. Fails if home_lat/home_lng falls outside primary_neighborhood_id geofence."
    roles: [PlatformAdmin]
    code: 201
    input: ["email", "display_name", "home_address_line", "home_lat", "home_lng", "primary_neighborhood_id"]
    output: Resident
    side_effects:
      - "Auto-issue an initial VerificationRequest(resident_id, primary_neighborhood_id, proof_type=POSTCARD_CODE)"
  - method: GET
    path: "/neighborhood/residents/{id}"
    description: "Fetch a Resident, including trust_score and verification_status."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: GET
    path: "/neighborhood/residents"
    description: "List Residents optionally filtered by primary_neighborhood_id."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: ["primary_neighborhood_id?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []
  - method: POST
    path: "/neighborhood/residents/{id}/promote-moderator"
    description: "PlatformAdmin flips Resident.is_moderator to true."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Resident
    side_effects:
      - "Set Resident.is_moderator=true"

  # ---- Verification ----
  - method: POST
    path: "/neighborhood/verification-requests"
    description: |
      Resident submits a VerificationRequest (initial POSTCARD_CODE request is
      also auto-issued by POST /residents). expires_at is set to submitted_at
      + 14 days.
    roles: [Resident, PlatformAdmin]
    code: 201
    input: ["resident_id", "neighborhood_id", "proof_type", "proof_reference"]
    output: VerificationRequest
    side_effects:
      - "Set VerificationRequest.submitted_at to current logical clock"
      - "Set VerificationRequest.expires_at to submitted_at + 14 days"
  - method: GET
    path: "/neighborhood/verification-requests/{id}"
    description: "Fetch a VerificationRequest."
    roles: [Resident, Moderator, PlatformAdmin]
    code: 200
    input: []
    output: VerificationRequest
    side_effects: []
  - method: GET
    path: "/neighborhood/verification-requests"
    description: "List VerificationRequests filtered by resident_id or neighborhood_id."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: ["resident_id?", "neighborhood_id?", "reviewer_moderator_id?", "state?", "limit?", "offset?"]
    output: VerificationRequest[]
    side_effects: []
  - method: POST
    path: "/neighborhood/verification-requests/{id}/claim"
    description: "Moderator claims a SUBMITTED request; state -> IN_REVIEW."
    roles: [Moderator]
    code: 200
    input: []
    output: VerificationRequest
    side_effects:
      - "Set reviewer_moderator_id"
  - method: POST
    path: "/neighborhood/verification-requests/{id}/request-resubmission"
    description: "Moderator asks resident to resubmit; state IN_REVIEW -> RESUBMISSION_REQUIRED."
    roles: [Moderator]
    code: 200
    input: []
    output: VerificationRequest
    side_effects: []
  - method: POST
    path: "/neighborhood/verification-requests/{id}/resubmit"
    description: "Resident resubmits with new proof; state RESUBMISSION_REQUIRED -> IN_REVIEW."
    roles: [Resident]
    code: 200
    input: ["proof_reference", "proof_type?"]
    output: VerificationRequest
    side_effects: []
  - method: POST
    path: "/neighborhood/verification-requests/{id}/approve"
    description: "Moderator approves; state IN_REVIEW -> APPROVED. Creates/updates ResidentMembership."
    roles: [Moderator]
    code: 200
    input: []
    output: VerificationRequest
    side_effects:
      - "Create/update ResidentMembership(status=VERIFIED)"
      - "Update Resident.verification_status=VERIFIED"
      - "Increment Neighborhood.verified_resident_count"
  - method: POST
    path: "/neighborhood/verification-requests/{id}/reject"
    description: "Moderator rejects; state IN_REVIEW -> REJECTED. Applies trust penalty."
    roles: [Moderator]
    code: 200
    input: []
    output: VerificationRequest
    side_effects:
      - "Decrement Resident.trust_score by REJECTION_PENALTY (10)"
      - "Update Resident.verification_status=REJECTED"

  # ---- ResidentMembership ----
  - method: GET
    path: "/neighborhood/residents/{id}/memberships"
    description: "List ResidentMembership rows for a Resident (reverse-reachability for ResidentMembership.resident_id and .source_verification_id)."
    roles: [Resident, Moderator, PlatformAdmin]
    code: 200
    input: []
    output: ResidentMembership[]
    side_effects: []
  - method: GET
    path: "/neighborhood/neighborhoods/{id}/memberships"
    description: "List ResidentMembership rows for a Neighborhood (reverse-reachability for ResidentMembership.neighborhood_id)."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: ResidentMembership[]
    side_effects: []
  - method: GET
    path: "/neighborhood/verification-requests/{id}/memberships"
    description: "List ResidentMembership rows produced by this VerificationRequest (reverse-reachability for source_verification_id)."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: []
    output: ResidentMembership[]
    side_effects: []

  # ---- Posts ----
  - method: POST
    path: "/neighborhood/posts"
    description: "Create a Post. Author must be VERIFIED in target neighborhood and not suspended."
    roles: [Resident, Moderator]
    code: 201
    input: ["author_resident_id", "neighborhood_id", "category", "title", "body"]
    output: Post
    side_effects:
      - "Compute Post.local_relevance_score via `post_feed_score`"
  - method: GET
    path: "/neighborhood/posts/{id}"
    description: "Fetch a Post."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Post
    side_effects: []
  - method: GET
    path: "/neighborhood/posts"
    description: "Feed list — filterable by neighborhood_id and author_resident_id; sorted by local_relevance_score DESC, then created_at DESC. Excludes HIDDEN, REMOVED, and suspended-author posts."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["neighborhood_id?", "author_resident_id?", "category?", "limit?", "offset?"]
    output: Post[]
    side_effects: []
  - method: DELETE
    path: "/neighborhood/posts/{id}"
    description: "Author or PlatformAdmin removes a Post; state -> REMOVED."
    roles: [Resident, PlatformAdmin]
    code: 200
    input: []
    output: Post
    side_effects:
      - "Dismiss all OPEN FlagReports against this Post"

  # ---- Marketplace ----
  - method: POST
    path: "/neighborhood/marketplace-listings"
    description: "Create a marketplace listing. Neighborhood EMERGENCY posture blocks creation."
    roles: [Resident, BusinessOwner]
    code: 201
    input: ["seller_resident_id", "neighborhood_id", "title", "price_cents", "kind"]
    output: MarketplaceListing
    side_effects: []
  - method: GET
    path: "/neighborhood/marketplace-listings/{id}"
    description: "Fetch a listing."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: MarketplaceListing
    side_effects: []
  - method: GET
    path: "/neighborhood/marketplace-listings"
    description: "List listings — filter by neighborhood_id, seller_resident_id, state, kind."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["neighborhood_id?", "seller_resident_id?", "reserved_for_resident_id?", "state?", "kind?", "limit?", "offset?"]
    output: MarketplaceListing[]
    side_effects: []
  - method: POST
    path: "/neighborhood/marketplace-listings/{id}/reserve"
    description: "Resident reserves an ACTIVE listing for 48h."
    roles: [Resident]
    code: 200
    input: []
    output: MarketplaceListing
    side_effects:
      - "Set reserved_for_resident_id and reserved_until"
  - method: POST
    path: "/neighborhood/marketplace-listings/{id}/confirm-sold"
    description: "Seller confirms sale from RESERVED state."
    roles: [Resident, BusinessOwner]
    code: 200
    input: []
    output: MarketplaceListing
    side_effects: []
  - method: POST
    path: "/neighborhood/marketplace-listings/{id}/withdraw"
    description: "Seller withdraws an ACTIVE listing."
    roles: [Resident, BusinessOwner]
    code: 200
    input: []
    output: MarketplaceListing
    side_effects: []

  # ---- Incidents ----
  - method: POST
    path: "/neighborhood/incidents"
    description: "Report an incident. Location MUST lie inside neighborhood geofence."
    roles: [Resident, Moderator]
    code: 201
    input: ["reporter_resident_id", "neighborhood_id", "incident_lat", "incident_lng", "severity", "category", "description", "occurred_at"]
    output: Incident
    side_effects:
      - "If severity=CRITICAL, increment Neighborhood.unresolved_critical_count"
      - "Recompute Neighborhood.safety_posture via `neighborhood_safety_posture`"
  - method: GET
    path: "/neighborhood/incidents/{id}"
    description: "Fetch an incident."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/neighborhood/incidents"
    description: "List incidents — filter by neighborhood_id, reporter_resident_id, status, severity."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["neighborhood_id?", "reporter_resident_id?", "acknowledged_by_officer_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/neighborhood/incidents/{id}/acknowledge"
    description: "AgencyOfficer acknowledges; OPEN -> ACKNOWLEDGED."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "Set acknowledged_by_officer_id"
      - "Recompute Neighborhood.safety_posture"
  - method: POST
    path: "/neighborhood/incidents/{id}/resolve"
    description: "Same officer resolves ACKNOWLEDGED -> RESOLVED. Cascades safety_posture recompute, then per-Post feed-score recompute."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "Decrement Neighborhood.unresolved_critical_count if CRITICAL"
      - "Recompute Neighborhood.safety_posture"
      - "If posture becomes OPEN, recompute Post.local_relevance_score for every PUBLISHED Post in this Neighborhood"
  - method: POST
    path: "/neighborhood/incidents/{id}/dismiss"
    description: "AgencyOfficer or PlatformAdmin dismisses OPEN incident."
    roles: [AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "If CRITICAL, decrement Neighborhood.unresolved_critical_count and recompute safety_posture"

  # ---- Civic notices ----
  - method: POST
    path: "/neighborhood/civic-notices"
    description: "AgencyOfficer publishes a civic notice."
    roles: [AgencyOfficer]
    code: 201
    input: ["neighborhood_id", "title", "body", "notice_kind", "effective_from", "effective_until"]
    output: CivicNotice
    side_effects: []
  - method: GET
    path: "/neighborhood/civic-notices/{id}"
    description: "Fetch a civic notice."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CivicNotice
    side_effects: []
  - method: GET
    path: "/neighborhood/civic-notices"
    description: "List civic notices — filter by neighborhood_id, notice_kind, agency_officer_id, state."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["neighborhood_id?", "notice_kind?", "agency_officer_id?", "state?", "limit?", "offset?"]
    output: CivicNotice[]
    side_effects: []
  - method: POST
    path: "/neighborhood/civic-notices/{id}/retract"
    description: "Publishing officer retracts (SCHEDULED or ACTIVE -> RETRACTED)."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: CivicNotice
    side_effects: []

  # ---- Flag reports ----
  - method: POST
    path: "/neighborhood/flag-reports"
    description: "Resident flags a target for moderation review."
    roles: [Resident, Moderator]
    code: 201
    input: ["reporter_resident_id", "target_type", "target_id", "reason"]
    output: FlagReport
    side_effects:
      - "Recompute Post.flag_count if target_type=POST; if crossing FLAG_HIDE_THRESHOLD (3), auto-transition Post PUBLISHED->FLAGGED"
  - method: GET
    path: "/neighborhood/flag-reports/{id}"
    description: "Fetch a flag report."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: []
    output: FlagReport
    side_effects: []
  - method: GET
    path: "/neighborhood/flag-reports"
    description: "List flag reports — filter by target_type, target_id, reporter_resident_id, status, linked_decision_id."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: ["reporter_resident_id?", "target_type?", "target_id?", "status?", "linked_decision_id?", "limit?", "offset?"]
    output: FlagReport[]
    side_effects: []

  # ---- Moderation decisions ----
  - method: POST
    path: "/neighborhood/moderation-decisions"
    description: |
      Moderator rules on a FlagReport. UPHOLD hides/suspends the target and
      docks author trust; DISMISS restores state; REVERSE undoes a prior
      UPHOLD. OCC-guarded via expected_target_version.
    roles: [Moderator]
    code: 201
    input: ["moderator_resident_id", "flag_report_id", "decision", "rationale", "expected_target_version"]
    output: ModerationDecision
    side_effects:
      - "Update FlagReport.status and .linked_decision_id"
      - "Cascade Post or MarketplaceListing state transition per §1.2"
      - "Adjust author/seller Resident.trust_score by MOD_UPHOLD_PENALTY (25)"
      - "If trust_score < SUSPENSION_FLOOR, set Resident.is_suspended=true (or clear on REVERSE)"
      - "Increment flagged target's version by 1"
  - method: GET
    path: "/neighborhood/moderation-decisions/{id}"
    description: "Fetch a moderation decision."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: []
    output: ModerationDecision
    side_effects: []
  - method: GET
    path: "/neighborhood/moderation-decisions"
    description: "List moderation decisions — filter by moderator_resident_id, flag_report_id."
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: ["moderator_resident_id?", "flag_report_id?", "limit?", "offset?"]
    output: ModerationDecision[]
    side_effects: []

  # ---- Businesses ----
  - method: POST
    path: "/neighborhood/businesses"
    description: "Resident claims a Business page. Location MUST lie inside primary_neighborhood_id geofence."
    roles: [Resident, PlatformAdmin]
    code: 201
    input: ["owner_resident_id", "name", "address_line", "business_lat", "business_lng", "primary_neighborhood_id"]
    output: Business
    side_effects: []
  - method: GET
    path: "/neighborhood/businesses/{id}"
    description: "Fetch a business page."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Business
    side_effects: []
  - method: GET
    path: "/neighborhood/businesses"
    description: "List businesses — filter by primary_neighborhood_id, owner_resident_id, state."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["primary_neighborhood_id?", "owner_resident_id?", "state?", "limit?", "offset?"]
    output: Business[]
    side_effects: []
  - method: POST
    path: "/neighborhood/businesses/{id}/verify"
    description: "PlatformAdmin flips CLAIMED -> VERIFIED_BUSINESS."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Business
    side_effects: []

  # ---- Local ads ----
  - method: POST
    path: "/neighborhood/local-ads"
    description: "BusinessOwner creates a LocalAd in DRAFT."
    roles: [BusinessOwner]
    code: 201
    input: ["business_id", "target_neighborhood_ids", "budget_cents", "bid_cents_per_impression", "start_at", "end_at"]
    output: LocalAd
    side_effects: []
  - method: GET
    path: "/neighborhood/local-ads/{id}"
    description: "Fetch an ad."
    roles: [BusinessOwner, PlatformAdmin, Moderator]
    code: 200
    input: []
    output: LocalAd
    side_effects: []
  - method: GET
    path: "/neighborhood/local-ads"
    description: "List local ads — filter by business_id and state."
    roles: [BusinessOwner, PlatformAdmin, Moderator]
    code: 200
    input: ["business_id?", "state?", "limit?", "offset?"]
    output: LocalAd[]
    side_effects: []
  - method: POST
    path: "/neighborhood/local-ads/{id}/start"
    description: "DRAFT -> RUNNING. Blocked when Neighborhood.safety_posture=EMERGENCY on any target neighborhood."
    roles: [BusinessOwner]
    code: 200
    input: []
    output: LocalAd
    side_effects: []
  - method: POST
    path: "/neighborhood/local-ads/{id}/pause"
    description: "RUNNING -> PAUSED."
    roles: [BusinessOwner]
    code: 200
    input: []
    output: LocalAd
    side_effects: []
  - method: POST
    path: "/neighborhood/local-ads/{id}/resume"
    description: "PAUSED -> RUNNING."
    roles: [BusinessOwner]
    code: 200
    input: []
    output: LocalAd
    side_effects: []
  - method: POST
    path: "/neighborhood/local-ads/{id}/serve-impression"
    description: |
      System serves an impression against a target neighborhood. Applies
      `ad_impression_charge` (test-driving surface for the impression-serving
      pipeline). Only PlatformAdmin may drive it in tests.
    roles: [PlatformAdmin]
    code: 200
    input: ["neighborhood_id"]
    output: LocalAd
    side_effects:
      - "Increment spend_cents by min(bid, remaining)"
      - "If spend_cents >= budget_cents, transition RUNNING -> EXHAUSTED"

  # ---- Groups ----
  - method: POST
    path: "/neighborhood/groups"
    description: "Verified Resident creates a Group in a neighborhood they are verified in."
    roles: [Resident, Moderator]
    code: 201
    input: ["creator_resident_id", "neighborhood_id", "name", "is_private"]
    output: Group
    side_effects: []
  - method: GET
    path: "/neighborhood/groups/{id}"
    description: "Fetch a group."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Group
    side_effects: []
  - method: GET
    path: "/neighborhood/groups"
    description: "List groups — filter by neighborhood_id or creator_resident_id."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["neighborhood_id?", "creator_resident_id?", "is_private?", "limit?", "offset?"]
    output: Group[]
    side_effects: []

  # ---- Events ----
  - method: POST
    path: "/neighborhood/events"
    description: |
      Group creator schedules an event. venue_lat/lng MUST lie inside the
      Neighborhood geofence; starts_at must be in the future.
    roles: [Resident, Moderator]
    code: 201
    input: ["group_id", "neighborhood_id", "title", "venue_lat", "venue_lng", "starts_at", "ends_at", "capacity"]
    output: Event
    side_effects: []
  - method: GET
    path: "/neighborhood/events/{id}"
    description: "Fetch an event."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/neighborhood/events"
    description: "List events — filter by group_id, neighborhood_id, state."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: ["group_id?", "neighborhood_id?", "state?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: POST
    path: "/neighborhood/event-rsvps"
    description: |
      Create an EventRSVP row. YES enforces Event.capacity via
      `event_capacity_reservation`. If a prior EventRSVP for
      (event_id, resident_id) exists, updates its rsvp_status.
    roles: [Resident, Moderator]
    code: 201
    input: ["event_id", "resident_id", "rsvp_status"]
    output: EventRSVP
    side_effects:
      - "Increment Event.rsvp_count by 1 when going NO/MAYBE/absent -> YES"
      - "Decrement Event.rsvp_count by 1 when going YES -> NO/MAYBE"
  - method: GET
    path: "/neighborhood/event-rsvps/{id}"
    description: "Fetch an EventRSVP row."
    roles: [Resident, Moderator, PlatformAdmin]
    code: 200
    input: []
    output: EventRSVP
    side_effects: []
  - method: GET
    path: "/neighborhood/event-rsvps"
    description: "List EventRSVP rows — reverse-reachability for event_id and resident_id."
    roles: [Resident, Moderator, PlatformAdmin]
    code: 200
    input: ["event_id?", "resident_id?", "rsvp_status?", "limit?", "offset?"]
    output: EventRSVP[]
    side_effects: []
  - method: POST
    path: "/neighborhood/events/{id}/cancel"
    description: "Group creator cancels SCHEDULED event."
    roles: [Resident, Moderator]
    code: 200
    input: []
    output: Event
    side_effects:
      - "Delete every EventRSVP row with event_id=this.id (Event.rsvp_count -> 0)"

  # ---- Test-driving surface ----
  - method: POST
    path: "/neighborhood/_clock/set_current_utc"
    description: |
      Set the server's logical clock. Default startup time is
      `2026-03-01T00:00:00Z` before any /_clock/set_current_utc call — this
      default is fixed, does NOT fall back to wall-clock time, and MUST be
      inherited by PRD-, implementation-, and unit-test-generator downstream.
      A clock advance triggers auto-transitions: VerificationRequest SUBMITTED
      -> EXPIRED, Post neighborhood safety recompute, MarketplaceListing
      RESERVED -> ACTIVE, CivicNotice SCHEDULED->ACTIVE and ACTIVE->EXPIRED,
      LocalAd RUNNING/PAUSED -> ENDED, Event SCHEDULED -> COMPLETED.
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, applied_transitions: integer }
    side_effects:
      - "Fire auto-transitions for all state machines whose time-gated preconditions now hold"
  - method: GET
    path: "/neighborhood/_clock/now"
    description: "Read the current logical clock (test observability)."
    roles: [Resident, Moderator, BusinessOwner, AgencyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/malformed X-User-Role or X-User-ID; role is unknown; entity_backed X-User-ID does not match a live entity of that type"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is authenticated but not permitted for this endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated id does not resolve to a live row"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign-key id in the body does not resolve to a live row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload missing required fields, wrong types, unknown fields, or invalid enum values"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target's current state has no `from:` matching the requested transition in §1.2"
  - id: ERR_STALE_TARGET_VERSION
    http: 412
    condition: "OCC — expected_target_version does not equal the target's current version"
  - id: ERR_RESIDENT_SUSPENDED
    http: 403
    condition: "Acting Resident.is_suspended=true (blocks new writes)"
  - id: ERR_NOT_VERIFIED_IN_NEIGHBORHOOD
    http: 403
    condition: "Acting Resident lacks a VERIFIED ResidentMembership for the target neighborhood"
  - id: ERR_NEIGHBORHOOD_EMERGENCY_LOCKDOWN
    http: 409
    condition: "Neighborhood.safety_posture=EMERGENCY blocks creation of MarketplaceListing or start of LocalAd targeting that neighborhood"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Time window fails ordering constraint (ends before starts, or non-positive duration)"
  - id: ERR_EFFECTIVE_FROM_IN_PAST
    http: 422
    condition: "CivicNotice.effective_from < current logical clock at creation"
  - id: ERR_NOTICE_WINDOW_OVERLAP
    http: 409
    condition: "Proposed CivicNotice interval half-open-overlaps with an ACTIVE/SCHEDULED notice on same (neighborhood_id, notice_kind); adjacency does NOT count"
  - id: ERR_GROUP_EVENT_CAPACITY
    http: 409
    condition: "Adding this Event would cause more than 3 concurrent SCHEDULED events on the same group (open-interval overlap); adjacency does NOT count"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting Resident is not the resource owner (Post author, listing seller, group creator)"
  - id: ERR_LOCATION_OUTSIDE_GEOFENCE
    http: 422
    condition: "Provided lat/lng falls outside the target Neighborhood circle (Haversine distance > radius_meters)"
  - id: ERR_INVALID_BUDGET
    http: 422
    condition: "LocalAd budget_cents < 1000 or bid_cents_per_impression < 1"
  - id: ERR_INVALID_PRICE
    http: 422
    condition: "MarketplaceListing.price_cents outside [0, 100000000]"
  - id: ERR_DUPLICATE_FLAG
    http: 409
    condition: "Same reporter has an OPEN or UPHELD FlagReport against the same (target_type, target_id)"
  - id: ERR_CANNOT_RESERVE_OWN
    http: 409
    condition: "Resident tried to reserve their own MarketplaceListing"
  - id: ERR_EVENT_FULL
    http: 409
    condition: "Event.rsvp_count == Event.capacity on YES RSVP"
  - id: ERR_AD_EXHAUSTED
    http: 409
    condition: "LocalAd.spend_cents >= budget_cents at impression serve time"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: Resident
    description: "Verified neighbor; posts, reserves, reports incidents, flags, RSVPs."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /marketplace-listings/{id}/reserve"
      - "POST /verification-requests/{id}/resubmit"
      - "POST /businesses  (claim a business page for self)"
    shared_operations:
      - "POST /posts (shared with Moderator)"
      - "POST /marketplace-listings (shared with BusinessOwner)"
      - "POST /incidents (shared with Moderator)"
      - "POST /flag-reports (shared with Moderator)"
      - "POST /events, POST /events/{id}/rsvp, POST /events/{id}/cancel (shared with Moderator)"
      - "POST /groups (shared with Moderator)"
      - "DELETE /posts/{id} (shared with PlatformAdmin, own-only)"

  - name: Moderator
    description: "Elevated Resident (is_moderator=true); reviews VerificationRequests and rules on FlagReports."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /verification-requests/{id}/claim"
      - "POST /verification-requests/{id}/request-resubmission"
      - "POST /verification-requests/{id}/approve"
      - "POST /verification-requests/{id}/reject"
      - "POST /moderation-decisions"
    shared_operations:
      - "POST /posts, POST /incidents, POST /flag-reports, POST /groups, POST /events, POST /events/{id}/rsvp, POST /events/{id}/cancel (shared with Resident)"

  - name: BusinessOwner
    description: "Resident who owns one or more Businesses; manages business pages and LocalAds."
    identity: "entity_backed:Business"
    exclusive_operations:
      - "POST /local-ads"
      - "POST /local-ads/{id}/start"
      - "POST /local-ads/{id}/pause"
      - "POST /local-ads/{id}/resume"
    shared_operations:
      - "POST /marketplace-listings, POST /marketplace-listings/{id}/confirm-sold, POST /marketplace-listings/{id}/withdraw (shared with Resident)"

  - name: AgencyOfficer
    description: "Civic agency employee (police, fire, public works). Opaque — no persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /civic-notices"
      - "POST /civic-notices/{id}/retract"
      - "POST /incidents/{id}/acknowledge"
      - "POST /incidents/{id}/resolve"
    shared_operations:
      - "POST /incidents/{id}/dismiss (shared with PlatformAdmin)"

  - name: PlatformAdmin
    description: "System operator; onboards Neighborhoods and Residents, promotes moderators, drives clock and ad-serving test surfaces."
    identity: "opaque"
    exclusive_operations:
      - "POST /neighborhoods"
      - "POST /residents"
      - "POST /residents/{id}/promote-moderator"
      - "POST /businesses/{id}/verify"
      - "POST /_clock/set_current_utc"
      - "POST /local-ads/{id}/serve-impression"
    shared_operations:
      - "DELETE /posts/{id} (shared with Resident, any post)"
      - "POST /incidents/{id}/dismiss (shared with AgencyOfficer)"
      - "POST /businesses (may create on behalf of a Resident)"

  - name: Anonymous
    description: "Unauthenticated caller; reserved for future public reads. NOT accepted on any endpoint listed above (all endpoints require auth)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
