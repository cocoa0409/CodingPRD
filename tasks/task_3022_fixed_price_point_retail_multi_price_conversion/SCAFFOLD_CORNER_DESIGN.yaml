  # ===========================================================================
  - section: calculations
    instances:

      - name: shelf_allocation_strict_capacity_arm_caps_at_the_shelf
        claim_type: Constants Applied
        grounds:
          - calculations.shelf_allocation_waterfall
          - entities.Item.fields.shelf_package_capacity
          - constants.shelf_allocation_waterfall.base_deck_allowance_cases
        distinguishing_aspect: "With broken_case_allowance false the ceiling is unit_shelf_capacity with no base-deck allowance added, so a 150-unit request against a 40-unit shelf places exactly 40 and records 110 as overflow — the strict_capacity arm, which the difficulty design's broken_case arm never exercises."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents, one import vendor, one store, one RECEIVED container carrying only SKU 2101."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c2_pp125
              call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - &c2_vendor
              call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - &c2_store
              call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - &c2_item
              call: "POST /merchandise/items"
              payload: { sku: "2101", description: "Scrub Pad 4ct", unit_retail_cents: 125, commodity_class: "HOUSEHOLD", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i2101_id: $.data.id }
            - call: "POST /merchandise/items/${i2101_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - &c2_container
              call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 0 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
          trigger:
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i2101_id}", sequence: 1, requested_units: 150 }
              as: DistributionCenterOperator
              captures: { line_id: $.data.id }
          assert:
            - "AllocationLine.${line_id}.requested_units == 150 and allocated_units == 40 and overflow_units == 110"
            - "AllocationLine.${line_id}.remaining_units == 40 and status == ALLOCATED"
            - "Item.${i2101_id}.broken_case_allowance == false — 4 * 0.1 == 0.4 does not exceed the 4.0 shelf, so the strict arm fired"
            - "had broken_case_allowance been true the scaffold would have added units_per_case 4 to the ceiling; it did not, so allocated_units is 40 and not 44"
            - "the container's allocable total is 40, since the single non-REVERSED line placed 40"

      - name: freight_rate_is_one_floor_for_the_whole_container
        claim_type: Precision
        grounds:
          - calculations.freight_pass_through_apportionment
          - entities.Container.fields.total_freight_cents
          - entities.Item.fields.base_landed_cost_cents
        distinguishing_aspect: "1260 cents spread over 500 allocable units is floored once to 2 cents per unit, so EVERY item on the container adds exactly the same 2 cents regardless of how many units it placed — the base-deck variant that charges each item ceil-share-per-unit instead would give 3 cents and overcharge every item on the container."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents, one import vendor, one store, one RECEIVED container with two lines: SKU 3101 for 300 units at sequence 1 and SKU 3102 for 200 units at sequence 2, both placing their full request because each shelf holds the lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "3101", description: "Kitchen Towel 300ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 30.0, units_per_case: 100, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i3101_id: $.data.id }
            - call: "POST /merchandise/items/${i3101_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "3102", description: "Glass Cup 200ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 20.0, units_per_case: 100, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i3102_id: $.data.id }
            - call: "POST /merchandise/items/${i3102_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 1260 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i3101_id}", sequence: 1, requested_units: 300 }
              as: DistributionCenterOperator
              captures: { line_a: $.data.id }
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i3102_id}", sequence: 2, requested_units: 200 }
              as: DistributionCenterOperator
              captures: { line_b: $.data.id }
          trigger:
            - call: "POST /merchandise/items/${i3101_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 107, container_id: "${cont_id}" }
              as: MerchandiseBuyer
              captures: { h_a: $.data.id }
            - call: "POST /merchandise/items/${i3102_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 107, container_id: "${cont_id}" }
              as: MerchandiseBuyer
              captures: { h_b: $.data.id }
          assert:
            - "AllocationLine.${line_a}.allocated_units == 300 and AllocationLine.${line_b}.allocated_units == 200, so the container's allocable total is 500"
            - "LandedCostHistory.${h_a}.applied_amount_cents == 107 and LandedCostHistory.${h_b}.applied_amount_cents == 107 — both items paid the SAME 2 cents, because 1260 // 500 == 2 after a single floor"
            - "Item.${i3101_id}.landed_cost_cents + 5 == Item.${i3102_id}.landed_cost_cents — both equal 107, not 108"
            - "the per-item floor trap would have produced 3 cents per unit from ceil(1260 / 500) and both items would read 108; they do not"
            - "2 * 500 == 1000 <= 1260, so the invariant freight_rate * container_total_units <= Container.total_freight_cents holds with 260 cents of residual dropped, never redistributed"

      - name: landed_cost_target_ceiling_applies_the_buffer_constant
        claim_type: Constants Applied
        grounds:
          - calculations.landed_cost_target_ceiling
          - constants.landed_cost_target_ceiling.target_margin_buffer_pct
          - entities.ExclusivePackProgram.fields.target_landed_cost_cents
        distinguishing_aspect: "The ceiling applies target_margin_buffer_pct 0.12 on top of the price point's ratio, so a 300-cent shelf at ratio 0.40 yields 105 and not 120 — omitting the buffer is the trap, and the multiplication order is pinned to floor(shelf * ratio * (1 - buffer))."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE price point THREE_DOLLAR at 300 cents with target_landed_cost_ratio 0.40, one import vendor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp300_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
          trigger:
            - call: "POST /merchandise/exclusive-pack-programs"
              payload: { vendor_id: "${vendor_x_id}", price_point_id: "${pp300_id}", pack_qty: 6, case_pack_qty: 48, formulation_code: "LOW_SUDS_V3", quoted_landed_cost_cents: 105 }
              as: MerchandiseBuyer
              captures: { pack_id: $.data.id, ceiling_at_create: $.data.target_landed_cost_cents }
            - call: "PATCH /merchandise/exclusive-pack-programs/${pack_id}"
              payload: { status: "ACTIVE" }
              as: MerchandiseBuyer
              captures: { ceiling_at_activate: $.data.target_landed_cost_cents }
          assert:
            - "ceiling_at_create == 105 and ceiling_at_activate == 105 — floor(300 * 0.40 * 0.88) == floor(105.6) == 105"
