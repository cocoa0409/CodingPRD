            - "err_edit == ERR_CONTENT_EDIT_NOT_FOUND"
            - "err_panel == ERR_COMMITTEE_PANEL_NOT_FOUND"
            - "err_slot == ERR_PRESENTATION_SLOT_NOT_FOUND"
            - "err_proposal == ERR_PRICING_PROPOSAL_NOT_FOUND"
            - "err_order == ERR_DISTRICT_ORDER_NOT_FOUND"
            - "err_comment == ERR_PUBLIC_COMMENT_NOT_FOUND"
