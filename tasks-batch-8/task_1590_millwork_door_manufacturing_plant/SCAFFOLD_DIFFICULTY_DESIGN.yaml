            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 45 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-S", supported_species: ["PAINT_GRADE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 6, end_hour: 8 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-S" }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 8, cure_end_hour: 12 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 15 }, as: QAInspector }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-S", truck_capacity_leaves: 4, departure_date: "2026-10-02", site_arrival_date: "2026-10-04" }, as: PlantManager, captures: { trip_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator, captures: { err: $.data.error_id } }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator, captures: { committed: $.data.leaves_committed } }
          assert:
            - "captured ${err} == ERR_OPENING_NOT_STAGED"
            - "captured ${committed} == 1 and Opening.${op1}.ship_status == SCHEDULED (same request succeeds after STAGED)"

  # ==================================================================
  # Rule 8 — resource_temporal_overlap (machine exclusive+buffer vs booth aggregate capacity)
  # ==================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: moulder_slot_exclusive_overlap_and_changeover_buffer
        grounds:
          - calculations.slot_changeover_window
          - errors[ERR_MACHINE_SLOT_OVERLAP]
          - errors[ERR_CHANGEOVER_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Interval semantics A (exclusive half-open + species-family changeover
          buffer) on resource MoulderMachine: [11,13) vs booked [10,12)
          overlaps -> ERR_MACHINE_SLOT_OVERLAP; adjacent [12,14) same STAIN
          family books cleanly; [14,15) PAINT family gap 0 < 2 ->
          ERR_CHANGEOVER_BUFFER_VIOLATION; gap exactly 2 ([16,18)) succeeds.
        test_recipe:
          setup:
            - "Machine M supports OAK/MAPLE/PAINT_GRADE; three APPROVED orders (OAK, MAPLE, PAINT_GRADE) each with a CREATED program; OAK slot [10,12) BOOKED."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Slot Proj", site_address: "5 Shop Ct", contract_code: "C-9001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-X", supported_species: ["OAK", "MAPLE", "PAINT_GRADE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-OAK", species: "OAK", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_o: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_o}", opening_no: "1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_o}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_o}", as: Any, captures: { ord_o_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_o}", expected_order_version: "${ord_o_v}" }, as: Estimator, captures: { drw_o: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_o}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_o}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_o}", order_id: "${ord_o}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_o: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_o}", machine_id: "${mach_id}", start_hour: 10, end_hour: 12 }, as: ProductionLead, captures: { slot_o: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-MAP", species: "MAPLE", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_m: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_m}", opening_no: "1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_m}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_m}", as: Any, captures: { ord_m_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_m}", expected_order_version: "${ord_m_v}" }, as: Estimator, captures: { drw_m: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_m}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_m}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_m}", order_id: "${ord_m}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_m: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-PNT", species: "PAINT_GRADE", profile_code: "PR-1", finish_system: "PAINT", sheen_target: "MATTE", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_p: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_p}", opening_no: "1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_p}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_p}", as: Any, captures: { ord_p_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_p}", expected_order_version: "${ord_p_v}" }, as: Estimator, captures: { drw_p: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_p}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_p}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_p}", order_id: "${ord_p}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_p: $.data.id } }
          trigger:
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_m}", machine_id: "${mach_id}", start_hour: 11, end_hour: 13 }, as: ProductionLead, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_m}", machine_id: "${mach_id}", start_hour: 12, end_hour: 14 }, as: ProductionLead, captures: { slot_m: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_p}", machine_id: "${mach_id}", start_hour: 14, end_hour: 15 }, as: ProductionLead, captures: { err_buffer: $.data.error_id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_p}", machine_id: "${mach_id}", start_hour: 16, end_hour: 18 }, as: ProductionLead, captures: { slot_p: $.data.id } }
          assert:
            - "captured ${err_overlap} == ERR_MACHINE_SLOT_OVERLAP (11 < 12 against BOOKED [10,12))"
            - "MoulderSetupSlot.${slot_m}.status == BOOKED (adjacent same-family STAIN, gap 0 allowed)"
            - "captured ${err_buffer} == ERR_CHANGEOVER_BUFFER_VIOLATION (PAINT after STAIN with gap 0 < 2)"
            - "MoulderSetupSlot.${slot_p}.status == BOOKED (gap exactly 2 == CHANGEOVER_HOURS allowed)"
      - name: spray_booth_aggregate_capacity_and_purge
        grounds:
          - calculations.booth_load_window
          - errors[ERR_BOOTH_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics B (aggregate capacity — overlap is ALLOWED up to
          booth.capacity, unlike the exclusive machine rule) on resource
          SprayBooth: capacity 2 admits two overlapping batches (count ==
          capacity at the boundary) and rejects the third overlapping batch;
          an adjacent [16,22) window books cleanly.
        test_recipe:
          setup:
            - "Order (MAPLE, STAIN) in FINISHING with one MACHINED opening; booth K capacity 2; batches B1 [10,16) and B2 [12,18) already created (both MIXED, family CLEAR_STAIN)."
