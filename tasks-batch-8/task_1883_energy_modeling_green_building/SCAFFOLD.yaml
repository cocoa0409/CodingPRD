# =============================================================================
# Task 1883 — Energy Modeling & Green Building Certification (LEED consultant)
# =============================================================================
scenario: |
  1883. Energy Modeling & Green Building Certification (LEED consultant): baseline vs proposed model construction & compliance path, credit strategy selection & documentation ownership matrix, submittal of design & construction phase credits, review comments & clarification response, commissioning/testing prerequisite coordination, cost premium analysis & incentive stacking, certification award & plaque/marketing rights, performance period reporting for recertification

domain_name: energy-modeling-green-building
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — FK links in request bodies)
# All monetary values are integer cents unless noted. Percentages are numbers
# with 2 decimal places, round_half_up.
# =============================================================================
entities:
  - name: TeamMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Team member full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per member" }
      - { name: specialty, type: enum, source: input, description: "MANAGEMENT | MODELING | DOCUMENTATION | COMMISSIONING", constraints: "enum {MANAGEMENT, MODELING, DOCUMENTATION, COMMISSIONING}" }
      - { name: is_independent, type: boolean, source: input, default: false, description: "True only for commissioning-capable members with no design involvement; required for commissioning agents" }

  - name: CertificationProject
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Building project name" }
      - { name: rating_system, type: enum, source: input, description: "LEED_BD_C | LEED_ID_C | LEED_O_M", constraints: "enum {LEED_BD_C, LEED_ID_C, LEED_O_M}" }
      - { name: compliance_path, type: enum, source: input, description: "PRESCRIPTIVE | PERFORMANCE; PERFORMANCE path enforces the minimum energy-improvement gate at PROPOSED model lock", constraints: "enum {PRESCRIPTIVE, PERFORMANCE}" }
      - { name: gross_floor_area_sqft, type: integer, source: input, description: "Gross floor area; drives certification fee formula", constraints: "> 0" }
      - { name: target_level, type: enum, source: input, description: "CERTIFIED | SILVER | GOLD | PLATINUM", constraints: "enum {CERTIFIED, SILVER, GOLD, PLATINUM}" }
      - { name: fee_budget_cents, type: integer, source: input, description: "Registration fee budget funding phase submissions", constraints: ">= 0" }
      - { name: administrator_id, type: string, source: system, description: "FK -> TeamMember.id; set from X-User-ID at creation" }
      - { name: status, type: enum, source: system, description: "REGISTERED | STRATEGY_LOCKED | DESIGN_SUBMITTED | DESIGN_REVIEWED | CONSTRUCTION_SUBMITTED | CONSTRUCTION_REVIEWED | CERTIFIED | PERFORMANCE_REPORTING | RECERTIFICATION_REVIEW | LAPSED | DENIED" }
      - { name: fee_balance_cents, type: integer, source: computed, description: "= fee_budget_cents - sum of debited phase fees + sum of refunded phase fees (invariant: submit+withdraw restores balance)" }
      - { name: points_pursued_total, type: integer, source: computed, default: 0, description: "= sum of CreditAttempt.points_possible over attempts with status != DROPPED" }
      - { name: points_awarded_total, type: integer, source: computed, default: 0, description: "= sum of CreditAttempt.points_awarded over attempts with status == AWARDED" }
      - { name: projected_level, type: enum, source: computed, default: NONE, description: "Optimistic variant: level from optimistic_projected_points (attempts in SUBMITTED/UNDER_REVIEW/RESUBMITTED count at points_possible; AWARDED count at points_awarded). enum {NONE, CERTIFIED, SILVER, GOLD, PLATINUM}" }
      - { name: conservative_level, type: enum, source: computed, default: NONE, description: "Conservative variant: level from points_awarded_total only. enum {NONE, CERTIFIED, SILVER, GOLD, PLATINUM}" }
      - { name: prerequisites_satisfied, type: boolean, source: computed, default: false, description: "True when every CreditAttempt whose library entry has is_prerequisite=true and status != DROPPED has status == AWARDED" }
      - { name: certified_level, type: enum, source: system, description: "Level fixed at certification decision; null until CERTIFIED. enum {CERTIFIED, SILVER, GOLD, PLATINUM}", constraints: "nullable" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of CERTIFY decision; null until CERTIFIED", constraints: "nullable" }
      - { name: plaque_marketing_rights_granted, type: boolean, source: system, default: false, description: "Set true on CERTIFY decision; never revoked (LAPSED keeps historical plaque rights)" }

  - name: CreditLibraryEntry
    parent: null
    common_fields: true
    fields:
      - { name: credit_code, type: string, source: input, description: "Catalog code, e.g. EAp1, EAc1; unique", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Credit title" }
      - { name: category, type: enum, source: input, description: "ENERGY_ATMOSPHERE | MATERIALS | INDOOR_ENVIRONMENT | WATER | SUSTAINABLE_SITES | INTEGRATIVE", constraints: "enum {ENERGY_ATMOSPHERE, MATERIALS, INDOOR_ENVIRONMENT, WATER, SUSTAINABLE_SITES, INTEGRATIVE}" }
      - { name: points_possible, type: integer, source: input, description: "Maximum points awardable for this credit", constraints: ">= 0" }
      - { name: is_prerequisite, type: boolean, source: input, description: "Prerequisite credits must be AWARDED before certification and must be attempted before strategy lock" }
      - { name: phase_eligibility, type: enum, source: input, description: "DESIGN | CONSTRUCTION | BOTH", constraints: "enum {DESIGN, CONSTRUCTION, BOTH}" }
      - { name: requires_energy_model, type: boolean, source: input, description: "True for performance credits whose READY transition pins the LOCKED PROPOSED energy model" }

  - name: EnergyModel
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CertificationProject.id; owning project" }
      - { name: model_type, type: enum, source: input, description: "BASELINE | PROPOSED", constraints: "enum {BASELINE, PROPOSED}" }
      - { name: modeling_standard, type: enum, source: input, description: "ASHRAE_90_1_2016 | ASHRAE_90_1_2019", constraints: "enum {ASHRAE_90_1_2016, ASHRAE_90_1_2019}" }
      - { name: annual_energy_cost_modeled_cents, type: integer, source: input, description: "Modeled annual energy cost including all measures (confirmed + unconfirmed)", constraints: "> 0" }
      - { name: annual_energy_cost_confirmed_only_cents, type: integer, source: input, description: "Modeled annual energy cost with only confirmed efficiency measures", constraints: "> 0" }
      - { name: includes_unconfirmed_measures, type: boolean, source: input, default: false, description: "True when modeled cost reflects measures not yet confirmed" }
      - { name: version_index, type: integer, source: system, description: "Per-(project_id, model_type) sequence starting at 1; = max existing version_index + 1" }
      - { name: created_by, type: string, source: system, description: "FK -> TeamMember.id; set from X-User-ID of the creating EnergyModeler" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | SUPERSEDED; at most one LOCKED per (project_id, model_type)" }
      - { name: improvement_pct_provisional, type: number, source: computed, description: "PROPOSED only: (baseline.modeled - proposed.modeled)/baseline.modeled*100 vs project LOCKED BASELINE; null until LOCKED", constraints: "nullable; 2dp round_half_up" }
      - { name: improvement_pct_final, type: number, source: computed, description: "PROPOSED only: same ratio using *_confirmed_only_cents fields; null until LOCKED", constraints: "nullable; 2dp round_half_up" }

  - name: CreditAttempt
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CertificationProject.id; owning project" }
      - { name: credit_library_entry_id, type: string, source: input, description: "FK -> CreditLibraryEntry.id; catalog credit being attempted" }
      - { name: credit_code, type: string, source: system, description: "Snapshot of CreditLibraryEntry.credit_code at creation" }
      - { name: points_possible, type: integer, source: system, description: "Snapshot of CreditLibraryEntry.points_possible at creation (pinned; later catalog edits do not flow)" }
      - { name: is_prerequisite, type: boolean, source: system, description: "Snapshot of CreditLibraryEntry.is_prerequisite at creation" }
      - { name: phase, type: enum, source: input, description: "DESIGN | CONSTRUCTION; must be compatible with entry.phase_eligibility", constraints: "enum {DESIGN, CONSTRUCTION}" }
      - { name: documentation_owner_id, type: string, source: input, description: "FK -> TeamMember.id; must reference specialty=DOCUMENTATION member (documentation ownership matrix)" }
      - { name: pinned_proposed_model_id, type: string, source: system, description: "FK -> EnergyModel.id; set at mark-ready for requires_energy_model credits (version pinning); null otherwise", constraints: "nullable" }
      - { name: has_stale_model_pin, type: boolean, source: computed, default: false, description: "True when the pinned model was SUPERSEDED by a newer lock" }
      - { name: raw_points_earned, type: number, source: system, description: "Fractional points at award: reviewer-supplied or bucket-computed from pinned model improvement_pct_final; null until AWARDED", constraints: "nullable; 0 <= raw <= points_possible" }
      - { name: points_awarded, type: integer, source: computed, description: "= round_half_up(raw_points_earned) per attempt, computed BEFORE project summation; null until AWARDED", constraints: "nullable" }
      - { name: submission_round, type: integer, source: system, default: 0, description: "Increments on each SUBMITTED transition (initial submission and every resubmission into review)" }
      - { name: status, type: enum, source: system, description: "SELECTED | DOCUMENTATION_IN_PROGRESS | READY_FOR_SUBMITTAL | SUBMITTED | UNDER_REVIEW | CLARIFICATION_REQUESTED | RESUBMITTED | AWARDED | DENIED | APPEALED | DROPPED" }

  - name: ReviewComment
    parent: null
    common_fields: true
    fields:
      - { name: credit_attempt_id, type: string, source: input, description: "FK -> CreditAttempt.id; attempt under review" }
      - { name: round, type: integer, source: system, description: "Copied from CreditAttempt.submission_round at posting time" }
      - { name: severity, type: enum, source: input, description: "CLARIFICATION | DEFICIENCY", constraints: "enum {CLARIFICATION, DEFICIENCY}" }
      - { name: comment_text, type: string, source: input, description: "Reviewer comment body" }
      - { name: response_text, type: string, source: system, description: "Documentation owner response; null until responded", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | ADDRESSED | REOPENED | ACCEPTED" }

  - name: CommissioningTask
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CertificationProject.id; owning project" }
      - { name: task_type, type: enum, source: input, description: "OPR_DOCUMENT | CX_PLAN | FUNCTIONAL_TESTING | SYSTEMS_MANUAL | CX_REPORT", constraints: "enum {OPR_DOCUMENT, CX_PLAN, FUNCTIONAL_TESTING, SYSTEMS_MANUAL, CX_REPORT}" }
      - { name: agent_id, type: string, source: input, description: "FK -> TeamMember.id; must reference specialty=COMMISSIONING member with is_independent=true" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end (exclusive); must be > scheduled_start" }
      - { name: is_prerequisite_linked, type: boolean, source: input, description: "True when part of the fundamental commissioning prerequisite gating CONSTRUCTION submission" }
      - { name: outcome, type: enum, source: system, description: "PASSED | FAILED recorded at completion; null while SCHEDULED/IN_PROGRESS", constraints: "nullable" }
      - { name: result_notes, type: string, source: system, description: "Completion notes; null until completed", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | PASSED | FAILED" }

  - name: IncentiveProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Incentive program name; unique", constraints: "unique" }
      - { name: incentive_type, type: enum, source: input, description: "TAX_CREDIT | GRANT | UTILITY_REBATE", constraints: "enum {TAX_CREDIT, GRANT, UTILITY_REBATE}" }
      - { name: benefit_amount_cents, type: integer, source: input, description: "Fixed benefit granted on approval", constraints: "> 0" }
      - { name: minimum_certification_level, type: enum, source: input, description: "CERTIFIED | SILVER | GOLD | PLATINUM; project certified_level must be >= this at approval", constraints: "enum {CERTIFIED, SILVER, GOLD, PLATINUM}" }
      - { name: is_combinable, type: boolean, source: input, description: "Combinable programs sum; non-combinable programs contribute only the per-type max to the stacking total" }

  - name: ProjectIncentive
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CertificationProject.id; applying project" }
      - { name: incentive_program_id, type: string, source: input, description: "FK -> IncentiveProgram.id; program applied for" }
      - { name: claimed_amount_cents, type: integer, source: computed, default: 0, description: "= program.benefit_amount_cents once APPROVED; 0 while APPLIED" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | DISBURSED" }

  - name: CostPremiumAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CertificationProject.id; 1:1 with project (second create rejected)" }
      - { name: incremental_construction_cost_cents, type: integer, source: input, description: "Green cost premium over conventional construction; base of the incentive cap", constraints: "> 0" }
      - { name: annual_energy_savings_cents, type: integer, source: computed, description: "= baseline.confirmed_only - proposed.confirmed_only of the LOCKED models" }
      - { name: incentive_total_cents, type: integer, source: computed, description: "Stacking waterfall over APPROVED/DISBURSED incentives, capped at 40% of incremental cost" }
      - { name: net_cost_premium_cents, type: integer, source: computed, description: "= incremental_construction_cost_cents - incentive_total_cents" }
      - { name: simple_payback_years, type: number, source: computed, description: "= round_half_up(net_cost_premium_cents / annual_energy_savings_cents, 1dp) using the rounded operands" }
      - { name: analysis_version, type: integer, source: system, default: 1, description: "Increments on every recalculate" }

  - name: PerformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CertificationProject.id; reporting project" }
      - { name: period_start, type: datetime, source: input, description: "Closed interval start (inclusive day)" }
      - { name: period_end, type: datetime, source: input, description: "Closed interval end (inclusive day); must be > period_start" }
      - { name: actual_annual_energy_cost_cents, type: integer, source: input, description: "Measured annual energy cost for the period", constraints: "> 0" }
      - { name: performance_gap_pct, type: number, source: computed, description: "= (actual - proposed.confirmed_only)/proposed.confirmed_only*100 of the project LOCKED PROPOSED model; 2dp round_half_up" }
      - { name: within_tolerance, type: boolean, source: computed, description: "= abs(performance_gap_pct) <= 15.00 (inclusive boundary)" }
      - { name: rejection_reason, type: string, source: system, description: "Reviewer-supplied reason on REJECT; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CertificationProject
    initial_state: REGISTERED
    terminal_states: [LAPSED, DENIED]
    transitions:
      - from: REGISTERED
        to: STRATEGY_LOCKED
        trigger: "POST /certification-projects/{projectId}/lock-strategy"
        actor: ProjectAdministrator
        preconditions:
          - "OCC: expected_project_version == project.version (ERR_STALE_PROJECT_VERSION, priority 3.5)"
          - "At least one CreditAttempt with status != DROPPED exists (ERR_EMPTY_CREDIT_STRATEGY)"
          - "Every CreditLibraryEntry with is_prerequisite=true has a CreditAttempt with status != DROPPED on this project (ERR_PREREQUISITE_CREDIT_MISSING)"
        side_effects:
          - "project.version += 1"
      - from: STRATEGY_LOCKED
        to: DESIGN_SUBMITTED
        trigger: "POST /certification-projects/{projectId}/submit-phase {phase: DESIGN}"
        actor: ProjectAdministrator
        preconditions:
          - "At least one CreditAttempt with phase=DESIGN and status=READY_FOR_SUBMITTAL (ERR_EMPTY_SUBMISSION_PACKAGE, zero-count boundary)"
          - "If project.compliance_path == PERFORMANCE: a LOCKED PROPOSED EnergyModel exists (ERR_PROPOSED_MODEL_NOT_LOCKED)"
          - "Segregation of duties: X-User-ID != documentation_owner_id of every included attempt (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "fee_balance_cents >= certification_fee(DESIGN, gross_floor_area_sqft) (ERR_INSUFFICIENT_SUBMISSION_FUNDS)"
        side_effects:
          - "Every DESIGN CreditAttempt in READY_FOR_SUBMITTAL -> SUBMITTED; submission_round += 1"
          - "fee_balance_cents -= certification_fee(DESIGN)"
          - "projected_level / conservative_level recomputed (input-set change)"
          - "project.version += 1"
      - from: DESIGN_REVIEWED
        to: CONSTRUCTION_SUBMITTED
        trigger: "POST /certification-projects/{projectId}/submit-phase {phase: CONSTRUCTION}"
        actor: ProjectAdministrator
        preconditions:
          - "At least one CreditAttempt with phase=CONSTRUCTION and status=READY_FOR_SUBMITTAL (ERR_EMPTY_SUBMISSION_PACKAGE)"
          - "Every CommissioningTask with is_prerequisite_linked=true on this project has status == PASSED (ERR_COMMISSIONING_INCOMPLETE)"
          - "Segregation of duties: X-User-ID != documentation_owner_id of every included attempt (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "fee_balance_cents >= certification_fee(CONSTRUCTION) (ERR_INSUFFICIENT_SUBMISSION_FUNDS)"
        side_effects:
          - "Every CONSTRUCTION CreditAttempt in READY_FOR_SUBMITTAL -> SUBMITTED; submission_round += 1"
          - "fee_balance_cents -= certification_fee(CONSTRUCTION)"
          - "projected_level recomputed"
          - "project.version += 1"
      - from: DESIGN_SUBMITTED
        to: STRATEGY_LOCKED
        trigger: "POST /certification-projects/{projectId}/withdraw-phase {phase: DESIGN}"
        actor: ProjectAdministrator
        preconditions:
          - "No ReviewComment exists on any SUBMITTED DESIGN attempt of this project (ERR_REVIEW_ALREADY_STARTED)"
        side_effects:
          - "Every DESIGN CreditAttempt in SUBMITTED -> READY_FOR_SUBMITTAL"
          - "fee_balance_cents += certification_fee(DESIGN) (compensating refund; submit+withdraw leaves fee_balance_cents unchanged)"
          - "projected_level recomputed"
          - "project.version += 1"
      - from: CONSTRUCTION_SUBMITTED
        to: DESIGN_REVIEWED
        trigger: "POST /certification-projects/{projectId}/withdraw-phase {phase: CONSTRUCTION}"
        actor: ProjectAdministrator
        preconditions:
          - "No ReviewComment exists on any SUBMITTED CONSTRUCTION attempt of this project (ERR_REVIEW_ALREADY_STARTED)"
        side_effects:
          - "Every CONSTRUCTION CreditAttempt in SUBMITTED -> READY_FOR_SUBMITTAL"
          - "fee_balance_cents += certification_fee(CONSTRUCTION)"
          - "projected_level recomputed"
          - "project.version += 1"
      - from: DESIGN_SUBMITTED
        to: DESIGN_REVIEWED
        trigger: "system (automatic bubble-up when every DESIGN CreditAttempt reaches a terminal state AWARDED|DENIED)"
        actor: system
        preconditions:
          - "No DESIGN CreditAttempt in SUBMITTED | UNDER_REVIEW | CLARIFICATION_REQUESTED | RESUBMITTED | APPEALED"
        side_effects:
          - "project.version += 1"
      - from: CONSTRUCTION_SUBMITTED
        to: CONSTRUCTION_REVIEWED
        trigger: "system (automatic bubble-up when every CONSTRUCTION CreditAttempt reaches a terminal state AWARDED|DENIED)"
        actor: system
        preconditions:
          - "No CONSTRUCTION CreditAttempt in SUBMITTED | UNDER_REVIEW | CLARIFICATION_REQUESTED | RESUBMITTED | APPEALED"
        side_effects:
          - "project.version += 1"
      - from: DESIGN_REVIEWED
        to: DESIGN_SUBMITTED
        trigger: "system (appeal reopens the phase: a DESIGN CreditAttempt transitions DENIED -> APPEALED)"
        actor: system
        preconditions: []
        side_effects:
          - "project.version += 1"
      - from: CONSTRUCTION_REVIEWED
        to: CONSTRUCTION_SUBMITTED
        trigger: "system (appeal reopens the phase: a CONSTRUCTION CreditAttempt transitions DENIED -> APPEALED)"
        actor: system
        preconditions: []
        side_effects:
          - "project.version += 1"
      - from: CONSTRUCTION_REVIEWED
        to: CERTIFIED
        trigger: "POST /certification-projects/{projectId}/issue-decision {decision: CERTIFY}"
        actor: CertificationReviewer
        preconditions:
          - "prerequisites_satisfied == true (ERR_PREREQUISITE_NOT_AWARDED)"
          - "points_awarded_total >= 40 (ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "certified_level = level_of(points_awarded_total); certified_at = logical clock now"
          - "plaque_marketing_rights_granted = true (plaque + marketing rights)"
          - "project.version += 1"
      - from: CONSTRUCTION_REVIEWED
        to: DENIED
        trigger: "POST /certification-projects/{projectId}/issue-decision {decision: DENY}"
        actor: CertificationReviewer
        preconditions: []
        side_effects:
          - "project.version += 1"
      - from: CERTIFIED
        to: PERFORMANCE_REPORTING
        trigger: "system (automatic on first PerformanceReport creation for this project)"
        actor: system
        preconditions: []
        side_effects:
          - "project.version += 1"
      - from: PERFORMANCE_REPORTING
        to: RECERTIFICATION_REVIEW
        trigger: "POST /certification-projects/{projectId}/submit-recertification"
        actor: ProjectAdministrator
        preconditions:
          - "At least 2 PerformanceReports with status == ACCEPTED exist (ERR_INSUFFICIENT_PERFORMANCE_REPORTS)"
        side_effects:
          - "project.version += 1"
      - from: RECERTIFICATION_REVIEW
        to: CERTIFIED
        trigger: "POST /certification-projects/{projectId}/confirm-recertification {outcome: RECERTIFY}"
        actor: CertificationReviewer
        preconditions: []
        side_effects:
          - "certified_at refreshed to logical clock now; reporting cycle restarts (cycle CERTIFIED -> PERFORMANCE_REPORTING -> RECERTIFICATION_REVIEW -> CERTIFIED)"
          - "project.version += 1"
      - from: RECERTIFICATION_REVIEW
        to: LAPSED
        trigger: "POST /certification-projects/{projectId}/confirm-recertification {outcome: LAPSE}"
        actor: CertificationReviewer
        preconditions: []
        side_effects:
          - "project.version += 1"

  - entity: CreditAttempt
    initial_state: SELECTED
    terminal_states: [AWARDED, DROPPED]
    transitions:
      - from: SELECTED
        to: DOCUMENTATION_IN_PROGRESS
        trigger: "POST /credit-attempts/{attemptId}/assign-owner"
        actor: ProjectAdministrator
        preconditions:
          - "New owner TeamMember.specialty == DOCUMENTATION (ERR_INVALID_TEAM_MEMBER_SPECIALTY)"
        side_effects: []
      - from: DOCUMENTATION_IN_PROGRESS
        to: DOCUMENTATION_IN_PROGRESS
        trigger: "POST /credit-attempts/{attemptId}/assign-owner (reassignment; status unchanged)"
        actor: ProjectAdministrator
        preconditions:
          - "New owner TeamMember.specialty == DOCUMENTATION (ERR_INVALID_TEAM_MEMBER_SPECIALTY)"
        side_effects: []
      - from: DOCUMENTATION_IN_PROGRESS
        to: READY_FOR_SUBMITTAL
        trigger: "POST /credit-attempts/{attemptId}/mark-ready"
        actor: DocumentationSpecialist
        preconditions:
          - "X-User-ID == documentation_owner_id (ERR_NOT_DOCUMENTATION_OWNER)"
          - "If entry.requires_energy_model: a LOCKED PROPOSED EnergyModel exists on the project (ERR_PROPOSED_MODEL_NOT_LOCKED)"
        side_effects:
          - "If requires_energy_model: pinned_proposed_model_id = id of the LOCKED PROPOSED model (version pin); has_stale_model_pin = false"
      - from: READY_FOR_SUBMITTAL
        to: SUBMITTED
        trigger: "system (via POST /certification-projects/{projectId}/submit-phase)"
        actor: system
        preconditions: []
        side_effects:
          - "submission_round += 1"
      - from: SUBMITTED
        to: READY_FOR_SUBMITTAL
        trigger: "system (via POST /certification-projects/{projectId}/withdraw-phase)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /credit-attempts/{attemptId}/begin-review"
        actor: CertificationReviewer
        preconditions:
          - "Project status in {DESIGN_SUBMITTED, CONSTRUCTION_SUBMITTED} (ERR_INVALID_PROJECT_STATE)"
        side_effects:
          - "projected_level recomputed (attempt remains in optimistic input set)"
      - from: UNDER_REVIEW
        to: CLARIFICATION_REQUESTED
        trigger: "system (via POST /review-comments)"
        actor: system
        preconditions: []
        side_effects:
          - "projected_level recomputed (attempt leaves optimistic input set) — cascade link 1 of review-comment cascade"
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /credit-attempts/{attemptId}/award"
        actor: CertificationReviewer
        preconditions:
          - "raw_points_earned (if supplied) within 0..points_possible (ERR_INVALID_REQUEST)"
        side_effects:
          - "raw_points_earned = payload value, or bucket-computed from pinned model improvement_pct_final when omitted (requires_energy_model credits)"
          - "points_awarded = round_half_up(raw_points_earned) — per-credit rounding BEFORE summation"
          - "CASCADE link 2: project.points_awarded_total recomputed = sum of points_awarded over AWARDED attempts; conservative_level recomputed"
          - "CASCADE link 3: project.prerequisites_satisfied recomputed (flips true when the last non-DROPPED prerequisite attempt is awarded)"
          - "If all phase attempts terminal: project bubble-up to *_REVIEWED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /credit-attempts/{attemptId}/deny"
        actor: CertificationReviewer
        preconditions: []
        side_effects:
          - "project.prerequisites_satisfied recomputed"
          - "If all phase attempts terminal: project bubble-up to *_REVIEWED"
      - from: DENIED
        to: APPEALED
        trigger: "POST /credit-attempts/{attemptId}/appeal"
        actor: ProjectAdministrator
        preconditions: []
        side_effects:
          - "If project already advanced to *_REVIEWED: project reverts to *_SUBMITTED (appeal reopens phase review)"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /credit-attempts/{attemptId}/begin-review"
        actor: CertificationReviewer
        preconditions:
          - "Project status in {DESIGN_SUBMITTED, CONSTRUCTION_SUBMITTED} (ERR_INVALID_PROJECT_STATE)"
        side_effects: []
      - from: CLARIFICATION_REQUESTED
        to: RESUBMITTED
        trigger: "POST /credit-attempts/{attemptId}/resubmit"
        actor: DocumentationSpecialist
        preconditions:
          - "X-User-ID == documentation_owner_id (ERR_NOT_DOCUMENTATION_OWNER)"
          - "Every ReviewComment on this attempt has status == ADDRESSED (ERR_UNRESOLVED_REVIEW_COMMENTS)"
        side_effects:
          - "submission_round += 1"
      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /credit-attempts/{attemptId}/begin-review"
        actor: CertificationReviewer
        preconditions:
          - "Every ReviewComment on this attempt has status == ACCEPTED (ERR_UNRESOLVED_REVIEW_COMMENTS)"
          - "Project status in {DESIGN_SUBMITTED, CONSTRUCTION_SUBMITTED} (ERR_INVALID_PROJECT_STATE)"
        side_effects:
          - "projected_level recomputed (attempt re-enters optimistic input set)"
      - from: READY_FOR_SUBMITTAL
        to: DOCUMENTATION_IN_PROGRESS
        trigger: "system (stale-pin cascade: the pinned PROPOSED model was SUPERSEDED by a newer lock)"
        actor: system
        preconditions:
          - "has_stale_model_pin == true"
        side_effects: []
      - from: SELECTED
        to: DROPPED
        trigger: "POST /credit-attempts/{attemptId}/drop"
        actor: ProjectAdministrator
        preconditions: []
        side_effects:
          - "project.points_pursued_total recomputed (compensating pair with create: create+drop restores points_pursued_total)"
          - "project.version += 1"
      - from: DOCUMENTATION_IN_PROGRESS
        to: DROPPED
        trigger: "POST /credit-attempts/{attemptId}/drop"
        actor: ProjectAdministrator
        preconditions: []
        side_effects:
          - "project.points_pursued_total recomputed"
          - "project.version += 1"
      - from: READY_FOR_SUBMITTAL
        to: DROPPED
        trigger: "POST /credit-attempts/{attemptId}/drop"
        actor: ProjectAdministrator
        preconditions: []
        side_effects:
          - "project.points_pursued_total recomputed"
          - "project.version += 1"

  - entity: EnergyModel
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /energy-models/{modelId}/lock"
        actor: EnergyModeler
        preconditions:
          - "For model_type == PROPOSED: a LOCKED BASELINE model exists on the project (ERR_BASELINE_MODEL_NOT_LOCKED)"
          - "For model_type == PROPOSED on a PERFORMANCE-path project: improvement_pct_final >= 5.00 (inclusive boundary; ERR_MINIMUM_IMPROVEMENT_NOT_MET)"
        side_effects:
          - "Compute improvement_pct_provisional and improvement_pct_final (PROPOSED only) against the LOCKED BASELINE"
          - "CASCADE link 1: previously LOCKED model of same (project_id, model_type) -> SUPERSEDED (version pinning)"
          - "CASCADE link 2: CreditAttempts with pinned_proposed_model_id == superseded id get has_stale_model_pin = true"
          - "CASCADE link 3: among those, attempts in READY_FOR_SUBMITTAL revert to DOCUMENTATION_IN_PROGRESS"

  - entity: ReviewComment
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: ADDRESSED
        trigger: "POST /review-comments/{commentId}/respond"
        actor: DocumentationSpecialist
        preconditions:
          - "X-User-ID == credit_attempt.documentation_owner_id (ERR_NOT_DOCUMENTATION_OWNER)"
        side_effects:
          - "response_text set"
      - from: REOPENED
        to: ADDRESSED
        trigger: "POST /review-comments/{commentId}/respond"
        actor: DocumentationSpecialist
        preconditions:
          - "X-User-ID == credit_attempt.documentation_owner_id (ERR_NOT_DOCUMENTATION_OWNER)"
        side_effects:
          - "response_text overwritten"
      - from: ADDRESSED
        to: ACCEPTED
        trigger: "POST /review-comments/{commentId}/accept"
        actor: CertificationReviewer
        preconditions:
          - "CreditAttempt status == RESUBMITTED (ERR_INVALID_COMMENT_STATE)"
        side_effects: []
      - from: ADDRESSED
        to: REOPENED
        trigger: "POST /review-comments/{commentId}/reopen"
        actor: CertificationReviewer
        preconditions:
          - "CreditAttempt status == RESUBMITTED (ERR_INVALID_COMMENT_STATE)"
        side_effects: []

  - entity: CommissioningTask
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /commissioning-tasks/{taskId}/start"
        actor: CommissioningAgent
        preconditions:
          - "X-User-ID == agent_id (ERR_NOT_ASSIGNED_COMMISSIONING_AGENT)"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /commissioning-tasks/{taskId}/complete {outcome: PASSED}"
        actor: CommissioningAgent
        preconditions:
          - "X-User-ID == agent_id (ERR_NOT_ASSIGNED_COMMISSIONING_AGENT)"
        side_effects: []
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /commissioning-tasks/{taskId}/complete {outcome: FAILED}"
        actor: CommissioningAgent
        preconditions:
          - "X-User-ID == agent_id (ERR_NOT_ASSIGNED_COMMISSIONING_AGENT)"
        side_effects:
          - "Retest is modeled as a NEW CommissioningTask; FAILED tasks do not block schedule overlap"

  - entity: ProjectIncentive
    initial_state: APPLIED
    terminal_states: [DISBURSED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /project-incentives/{projectIncentiveId}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Project status == CERTIFIED (ERR_PROJECT_NOT_CERTIFIED)"
          - "project.certified_level >= program.minimum_certification_level (ERR_CERTIFICATION_LEVEL_INSUFFICIENT)"
        side_effects:
          - "claimed_amount_cents = program.benefit_amount_cents"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /project-incentives/{projectIncentiveId}/disburse"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: PerformanceReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /performance-reports/{reportId}/submit"
        actor: ProjectAdministrator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /performance-reports/{reportId}/verify {outcome: ACCEPT}"
        actor: CertificationReviewer
        preconditions:
          - "within_tolerance == true (ERR_PERFORMANCE_GAP_EXCEEDED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /performance-reports/{reportId}/verify {outcome: REJECT}"
        actor: CertificationReviewer
        preconditions:
          - "rejection_reason supplied (ERR_INVALID_REQUEST)"
        side_effects:
          - "rejection_reason set"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /performance-reports/{reportId}/revise"
        actor: ProjectAdministrator
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on CertificationProject.version only)
# =============================================================================
concurrency_rules:
  - rule_id: strategy-lock-stale-project
    parent_entity: CertificationProject
    write_endpoint: "POST /certification-projects/{projectId}/lock-strategy"
    occ_field: expected_project_version
    description: |
      Locking the credit strategy of a CertificationProject whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has since amended the strategy (e.g., created
      or dropped a CreditAttempt, each of which bumps project.version) and the
      locking client's view of the strategy membership is therefore stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: energy-model-create-stale-project
    parent_entity: CertificationProject
    write_endpoint: "POST /energy-models"
    occ_field: expected_project_version
    description: |
      Creating an EnergyModel against a CertificationProject whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has since created a model (a create that
      legitimately supersedes the client's view of the model inventory) and the
      current writer's view of the project is therefore stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: energy_cost_improvement
    trigger: "POST /energy-models/{modelId}/lock on a PROPOSED model"
    algorithm: dual_variant_ratio
    formula: |
      Let B = the project's LOCKED BASELINE model, P = this PROPOSED model.
      improvement_pct_provisional = round_half_up(
        (B.annual_energy_cost_modeled_cents - P.annual_energy_cost_modeled_cents)
        / B.annual_energy_cost_modeled_cents * 100, 2dp)
      improvement_pct_final = round_half_up(
        (B.annual_energy_cost_confirmed_only_cents - P.annual_energy_cost_confirmed_only_cents)
        / B.annual_energy_cost_confirmed_only_cents * 100, 2dp)
    input_set: "The project's LOCKED BASELINE model and the PROPOSED model being locked; other models (DRAFT/SUPERSEDED) excluded"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Computed from annual_energy_cost_modeled_cents (includes unconfirmed measures); stored as improvement_pct_provisional"
        difference: "Uses modeled costs; diverges from final whenever includes_unconfirmed_measures == true"
      - name: final
        when: "Computed from annual_energy_cost_confirmed_only_cents; stored as improvement_pct_final and used by the 5.00% PERFORMANCE-path gate and the points bucket table"
        difference: "Uses confirmed-only costs; equals provisional when no unconfirmed measures are included"

  - name: certification_level_of_points
    trigger: "Any CreditAttempt status change or award (recomputes project.projected_level and project.conservative_level); issue-decision CERTIFY (fixes certified_level from points_awarded_total)"
    algorithm: threshold
    formula: |
      level_of(points) = PLATINUM if points >= 80
                         GOLD     if points >= 60
                         SILVER   if points >= 50
                         CERTIFIED if points >= 40
                         NONE     otherwise        (boundaries are inclusive >=)
      optimistic_projected_points = sum over attempts with status == AWARDED of points_awarded
                                  + sum over attempts with status in {SUBMITTED, UNDER_REVIEW, RESUBMITTED} of points_possible
      projected_level    = level_of(optimistic_projected_points)
      conservative_level = level_of(points_awarded_total)
      certified_level    = level_of(points_awarded_total)   (fixed at CERTIFY decision)
    input_set: "Optimistic variant: attempts in {SUBMITTED, UNDER_REVIEW, RESUBMITTED, AWARDED}; conservative variant: attempts in {AWARDED} only. DROPPED, SELECTED, DOCUMENTATION_IN_PROGRESS, READY_FOR_SUBMITTAL, CLARIFICATION_REQUESTED, DENIED, APPEALED are excluded from both."
    constants:
      CERTIFIED_MIN: 40
      SILVER_MIN: 50
      GOLD_MIN: 60
      PLATINUM_MIN: 80
    variants:
      - name: optimistic
        when: "project.projected_level — assumes everything currently in review is fully awarded"
        difference: "Counts in-review attempts at face value (points_possible); can differ from conservative_level for identical data"
      - name: conservative
        when: "project.conservative_level and certified_level — awarded points only"
        difference: "Counts AWARDED attempts only"

  - name: credit_points_rounding
    trigger: "POST /credit-attempts/{attemptId}/award"
    algorithm: nested_rounding
    formula: |
      Per-attempt rounding happens BEFORE summation (pinned order):
        attempt.points_awarded = round_half_up(attempt.raw_points_earned to integer)
        project.points_awarded_total = sum of points_awarded over AWARDED attempts
      Rounding only the project total (round_half_up(sum of raw_points_earned))
      is FORBIDDEN — e.g., raw 1.4 + 1.4 must yield 1 + 1 = 2, not round(2.8) = 3.
    input_set: "CreditAttempts with status == AWARDED on the project"
    precision: "raw_points_earned number; points_awarded integer, round_half_up per attempt"

  - name: energy_credit_points_bucket
    trigger: "POST /credit-attempts/{attemptId}/award with raw_points_earned omitted on a requires_energy_model credit"
    algorithm: threshold
    formula: |
      Let imp = pinned_proposed_model.improvement_pct_final.
      raw_points_earned = 10 if imp >= 18
                           8 if imp >= 14
                           6 if imp >= 10
                           4 if imp >= 8
                           2 if imp >= 5
                           0 otherwise     (boundaries inclusive >=)
    input_set: "The pinned LOCKED PROPOSED model of the attempt"
    constants:
      BUCKET_THRESHOLDS: "5->2, 8->4, 10->6, 14->8, 18->10"

  - name: incentive_stacking_waterfall
    trigger: "CostPremiumAnalysis create and recalculate"
    algorithm: waterfall_allocation
    formula: |
      eligible = ProjectIncentives of the project with status in {APPROVED, DISBURSED}
      combinable_sum = sum of claimed_amount_cents over eligible whose program.is_combinable == true
      non_combinable_sum = sum over each incentive_type T of
                           max(claimed_amount_cents among eligible non-combinable programs of type T, default 0)
      raw_total = combinable_sum + non_combinable_sum
      cap = floor(INCENTIVE_CAP_PCT * incremental_construction_cost_cents)
      incentive_total_cents = min(raw_total, cap)
    input_set: "ProjectIncentives with status in {APPROVED, DISBURSED}; APPLIED excluded"
    constants:
      INCENTIVE_CAP_PCT: 0.40
    precision: "integer cents; cap via floor"

  - name: cost_premium_net_and_payback
    trigger: "CostPremiumAnalysis create and recalculate"
    algorithm: pinned_evaluation_order
    formula: |
      Evaluation order is pinned (dependency chain, NOT circular):
        1. annual_energy_savings_cents = LOCKED BASELINE.annual_energy_cost_confirmed_only_cents
                                       - LOCKED PROPOSED.annual_energy_cost_confirmed_only_cents
        2. incentive_total_cents = incentive_stacking_waterfall with cap base =
                                   incremental_construction_cost_cents (PRE-incentive, never net)
        3. net_cost_premium_cents = incremental_construction_cost_cents - incentive_total_cents
        4. simple_payback_years = round_half_up(net_cost_premium_cents / annual_energy_savings_cents, 1dp)
      Computing the cap from net_cost_premium_cents instead of step 2's pre-incentive
      base is FORBIDDEN (that reading is circular); payback MUST use the stored
      integer-cent operands from steps 1-3.
    input_set: "The project's LOCKED BASELINE and PROPOSED models; APPROVED/DISBURSED ProjectIncentives"
    precision: "integer cents; payback 1 decimal place round_half_up"

  - name: certification_fee
    trigger: "submit-phase (debit) and withdraw-phase (refund of the same amount)"
    algorithm: tiered_pricing
    formula: |
      fee_cents(phase) = min(PHASE_BASE[phase] + FEE_PER_1000_SQFT_CENTS * ceil(gross_floor_area_sqft / 1000),
                             FEE_CAP_CENTS)
      submit-phase: fee_balance_cents -= fee_cents(phase)
      withdraw-phase: fee_balance_cents += fee_cents(phase)   (same formula, same inputs -> exact compensation)
    input_set: "The project's gross_floor_area_sqft and fee_budget_cents"
    constants:
      DESIGN_BASE_CENTS: 250000
      CONSTRUCTION_BASE_CENTS: 350000
      FEE_PER_1000_SQFT_CENTS: 5000
      FEE_CAP_CENTS: 2000000
    precision: "integer cents; ceil on sqft/1000 before multiplication"

  - name: performance_gap
    trigger: "PerformanceReport creation"
    algorithm: threshold
    formula: |
      Let M = the project's LOCKED PROPOSED model.
      performance_gap_pct = round_half_up(
        (actual_annual_energy_cost_cents - M.annual_energy_cost_confirmed_only_cents)
        / M.annual_energy_cost_confirmed_only_cents * 100, 2dp)
      within_tolerance = abs(performance_gap_pct) <= 15.00   (inclusive boundary)
    input_set: "The project's LOCKED PROPOSED model; the report's actual_annual_energy_cost_cents"
    constants:
      GAP_TOLERANCE_PCT: 15.00
    precision: "2 decimal places, round_half_up"

  - name: report_period_tiling
    trigger: "PerformanceReport creation"
    algorithm: interval_merge
    formula: |
      Periods are CLOSED-inclusive day intervals [period_start, period_end].
      anchor = the ACCEPTED report with the latest period_end (none if no ACCEPTED report).
      required_start = date(project.certified_at) if no anchor else anchor.period_end + 1 day.
      period_start < required_start  -> ERR_REPORT_PERIOD_OVERLAP (a shared day is a conflict)
      period_start > required_start  -> ERR_REPORT_PERIOD_GAP (untiled day(s) between periods)
      Also reject ERR_REPORT_PERIOD_OVERLAP when [period_start, period_end] intersects
      any existing report with status in {DRAFT, SUBMITTED, ACCEPTED} on any shared day.
      Tie-break for anchor selection is not needed: ACCEPTED periods never overlap by construction.
    input_set: "Project's PerformanceReports; anchor restricted to status == ACCEPTED"
    precision: "date granularity (UTC day)"

  - name: commissioning_schedule_overlap
    trigger: "POST /commissioning-tasks"
    algorithm: interval_merge
    formula: |
      Intervals are HALF-OPEN [scheduled_start, scheduled_end).
      Reject ERR_CX_SCHEDULE_OVERLAP when for any existing task T on the same project
      with T.status in {SCHEDULED, IN_PROGRESS}:
        new.scheduled_start < T.scheduled_end AND T.scheduled_start < new.scheduled_end
      Adjacency is allowed: new.scheduled_start == T.scheduled_end is NOT an overlap.
      Terminal tasks (PASSED, FAILED) never block.
    input_set: "CommissioningTasks on the same project with status in {SCHEDULED, IN_PROGRESS}"
    precision: "datetime comparison, half-open semantics"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 1.5
    category: existence
    check: "Request body conforms to the endpoint input schema (required fields present, types valid, enum members valid, datetime ordering valid)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints
  - priority: 2
    category: auth
    check: "X-User-Role must be permitted for this operation per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 2.5
    category: auth
    check: "Resource ownership: X-User-ID must equal the owning field (documentation_owner_id on owner-only actions; agent_id on commissioning actions)"
    error_id: "ERR_NOT_DOCUMENTATION_OWNER / ERR_NOT_ASSIGNED_COMMISSIONING_AGENT"
    http_status: 403
    applies_to: "mark-ready, resubmit, respond, commissioning start/complete"
  - priority: 3
    category: existence
    check: "Resource ids in path and FK ids in body must exist, validated left-to-right"
    error_id: "ERR_PROJECT_NOT_FOUND / ERR_TEAM_MEMBER_NOT_FOUND / ERR_CREDIT_ENTRY_NOT_FOUND / ERR_ENERGY_MODEL_NOT_FOUND / ERR_CREDIT_ATTEMPT_NOT_FOUND / ERR_REVIEW_COMMENT_NOT_FOUND / ERR_COMMISSIONING_TASK_NOT_FOUND / ERR_INCENTIVE_PROGRAM_NOT_FOUND / ERR_PROJECT_INCENTIVE_NOT_FOUND / ERR_PERFORMANCE_REPORT_NOT_FOUND / ERR_ANALYSIS_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 3.5
    category: state
    check: "OCC: expected_project_version must equal the project's current version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /certification-projects/{projectId}/lock-strategy, POST /energy-models"
  - priority: 4
    category: state
    check: "Target resource must be in a valid from-state for the requested transition"
    error_id: "ERR_INVALID_PROJECT_STATE / ERR_INVALID_CREDIT_ATTEMPT_STATE / ERR_INVALID_MODEL_STATE / ERR_INVALID_COMMENT_STATE / ERR_INVALID_TASK_STATE / ERR_INVALID_INCENTIVE_STATE / ERR_INVALID_REPORT_STATE"
    http_status: 409
    applies_to: all action endpoints
  - priority: 4.1
    category: state
    check: "Creation-time parent state gates: CreditAttempt creation requires project status in {REGISTERED, STRATEGY_LOCKED}; EnergyModel creation requires project status in {REGISTERED, STRATEGY_LOCKED, DESIGN_REVIEWED, CONSTRUCTION_REVIEWED}; PerformanceReport creation requires project status in {CERTIFIED, PERFORMANCE_REPORTING}"
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /credit-attempts, POST /energy-models, POST /performance-reports"
  - priority: 5
    category: business_safety
    check: "Compliance gates: segregation of duties on submit-phase (ERR_SEGREGATION_OF_DUTIES_VIOLATION); commissioning agent independence (ERR_CX_AGENT_NOT_INDEPENDENT); all prerequisites AWARDED before CERTIFY (ERR_PREREQUISITE_NOT_AWARDED); PERFORMANCE-path minimum improvement >= 5.00 at PROPOSED lock (ERR_MINIMUM_IMPROVEMENT_NOT_MET)"
    error_id: "ERR_SEGREGATION_OF_DUTIES_VIOLATION / ERR_CX_AGENT_NOT_INDEPENDENT / ERR_PREREQUISITE_NOT_AWARDED / ERR_MINIMUM_IMPROVEMENT_NOT_MET"
    http_status: "403 / 403 / 409 / 422"
    applies_to: "submit-phase, POST /commissioning-tasks, issue-decision, POST /energy-models/{id}/lock"
  - priority: 6
    category: business_referential
    check: "Referenced entities must carry the required attributes: documentation owner specialty == DOCUMENTATION; commissioning agent specialty == COMMISSIONING; attempt phase compatible with entry phase_eligibility (ERR_INVALID_TEAM_MEMBER_SPECIALTY / ERR_INVALID_REQUEST)"
    error_id: "ERR_INVALID_TEAM_MEMBER_SPECIALTY / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /credit-attempts, assign-owner, POST /commissioning-tasks"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and structural constraints: one non-DROPPED attempt per credit_code per project (ERR_DUPLICATE_CREDIT_ATTEMPT); one live application per program per project (ERR_DUPLICATE_INCENTIVE_APPLICATION); one analysis per project (ERR_ANALYSIS_EXISTS); commissioning half-open overlap (ERR_CX_SCHEDULE_OVERLAP); report closed-interval tiling (ERR_REPORT_PERIOD_OVERLAP / ERR_REPORT_PERIOD_GAP); non-empty submission package (ERR_EMPTY_SUBMISSION_PACKAGE); no withdraw after review starts (ERR_REVIEW_ALREADY_STARTED); strategy completeness at lock (ERR_EMPTY_CREDIT_STRATEGY / ERR_PREREQUISITE_CREDIT_MISSING); resubmit/begin-review comment gates (ERR_UNRESOLVED_REVIEW_COMMENTS); recertification report count (ERR_INSUFFICIENT_PERFORMANCE_REPORTS); performance tolerance (ERR_PERFORMANCE_GAP_EXCEEDED); model lock order (ERR_BASELINE_MODEL_NOT_LOCKED); CERTIFY points floor (ERR_INSUFFICIENT_POINTS)"
    error_id: "ERR_DUPLICATE_CREDIT_ATTEMPT / ERR_DUPLICATE_INCENTIVE_APPLICATION / ERR_ANALYSIS_EXISTS / ERR_CX_SCHEDULE_OVERLAP / ERR_REPORT_PERIOD_OVERLAP / ERR_REPORT_PERIOD_GAP / ERR_EMPTY_SUBMISSION_PACKAGE / ERR_REVIEW_ALREADY_STARTED / ERR_EMPTY_CREDIT_STRATEGY / ERR_PREREQUISITE_CREDIT_MISSING / ERR_UNRESOLVED_REVIEW_COMMENTS / ERR_INSUFFICIENT_PERFORMANCE_REPORTS / ERR_PERFORMANCE_GAP_EXCEEDED / ERR_BASELINE_MODEL_NOT_LOCKED / ERR_INSUFFICIENT_POINTS"
    http_status: "409 (422 for ERR_EMPTY_SUBMISSION_PACKAGE, ERR_PERFORMANCE_GAP_EXCEEDED, ERR_INSUFFICIENT_POINTS)"
    applies_to: "per-error endpoints"
  - priority: 8
    category: business_fiscal
    check: "Funds and certification-gated money: fee_balance_cents covers the phase fee (ERR_INSUFFICIENT_SUBMISSION_FUNDS); incentive approval requires CERTIFIED project (ERR_PROJECT_NOT_CERTIFIED) at sufficient level (ERR_CERTIFICATION_LEVEL_INSUFFICIENT)"
    error_id: "ERR_INSUFFICIENT_SUBMISSION_FUNDS / ERR_PROJECT_NOT_CERTIFIED / ERR_CERTIFICATION_LEVEL_INSUFFICIENT"
    http_status: "402 / 409 / 422"
    applies_to: "submit-phase, POST /project-incentives/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table (flat routes)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

  # --- TeamMember ---
  - method: POST
    path: "/team-members"
    description: "Register a team member (entity backing for consultant-side roles)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, specialty, "is_independent?"]
    output: TeamMember
    side_effects: []
  - method: GET
    path: "/team-members"
    description: "List team members"
    roles: [Any]
    code: 200
    input: ["specialty?", "is_independent?"]
    output: "TeamMember[]"
    side_effects: []
  - method: GET
    path: "/team-members/{memberId}"
    description: "Get a team member"
    roles: [Any]
    code: 200
    input: []
    output: TeamMember
    side_effects: []

  # --- CreditLibraryEntry ---
  - method: POST
    path: "/credit-library-entries"
    description: "Create a credit catalog entry"
    roles: [ProgramAdmin]
    code: 201
    input: [credit_code, title, category, points_possible, is_prerequisite, phase_eligibility, requires_energy_model]
    output: CreditLibraryEntry
    side_effects: []
  - method: GET
    path: "/credit-library-entries"
    description: "List credit catalog entries"
    roles: [Any]
    code: 200
    input: ["category?", "phase_eligibility?", "is_prerequisite?"]
    output: "CreditLibraryEntry[]"
    side_effects: []
  - method: GET
    path: "/credit-library-entries/{entryId}"
    description: "Get a credit catalog entry"
    roles: [Any]
    code: 200
    input: []
    output: CreditLibraryEntry
    side_effects: []

  # --- CertificationProject ---
  - method: POST
    path: "/certification-projects"
    description: "Register a certification project"
    roles: [ProjectAdministrator]
    code: 201
    input: [project_name, rating_system, compliance_path, gross_floor_area_sqft, target_level, fee_budget_cents]
    output: CertificationProject
    side_effects: ["status = REGISTERED", "administrator_id = X-User-ID", "fee_balance_cents = fee_budget_cents"]
  - method: GET
    path: "/certification-projects"
    description: "List certification projects"
    roles: [Any]
    code: 200
    input: ["status?", "administrator_id?"]
    output: "CertificationProject[]"
    side_effects: []
  - method: GET
    path: "/certification-projects/{projectId}"
    description: "Get a certification project (all computed fields)"
    roles: [Any]
    code: 200
    input: []
    output: CertificationProject
    side_effects: []
  - method: POST
    path: "/certification-projects/{projectId}/lock-strategy"
    description: "Lock the credit strategy (OCC-guarded)"
    roles: [ProjectAdministrator]
    code: 200
    input: [expected_project_version]
    output: CertificationProject
    side_effects: ["status -> STRATEGY_LOCKED", "increments CertificationProject.version by 1"]
  - method: POST
    path: "/certification-projects/{projectId}/submit-phase"
    description: "Submit all READY_FOR_SUBMITTAL attempts of a phase as one review package; debits the phase fee"
    roles: [ProjectAdministrator]
    code: 200
    input: [phase]
    output: CertificationProject
    side_effects: ["READY attempts of phase -> SUBMITTED (submission_round += 1)", "fee_balance_cents -= certification_fee(phase)", "status -> DESIGN_SUBMITTED | CONSTRUCTION_SUBMITTED", "increments CertificationProject.version by 1"]
  - method: POST
    path: "/certification-projects/{projectId}/withdraw-phase"
    description: "Withdraw a submitted phase before review starts; refunds the phase fee"
    roles: [ProjectAdministrator]
    code: 200
    input: [phase]
    output: CertificationProject
    side_effects: ["SUBMITTED attempts of phase -> READY_FOR_SUBMITTAL", "fee_balance_cents += certification_fee(phase)", "status reverts to STRATEGY_LOCKED | DESIGN_REVIEWED", "increments CertificationProject.version by 1"]
  - method: POST
    path: "/certification-projects/{projectId}/issue-decision"
    description: "Certification decision from CONSTRUCTION_REVIEWED; CERTIFY fixes certified_level and grants plaque/marketing rights"
    roles: [CertificationReviewer]
    code: 200
    input: [decision]
    output: CertificationProject
    side_effects: ["CERTIFY: certified_level = level_of(points_awarded_total), certified_at = clock now, plaque_marketing_rights_granted = true", "status -> CERTIFIED | DENIED", "increments CertificationProject.version by 1"]
  - method: POST
    path: "/certification-projects/{projectId}/submit-recertification"
    description: "Enter recertification review after the performance period"
    roles: [ProjectAdministrator]
    code: 200
    input: []
    output: CertificationProject
    side_effects: ["status -> RECERTIFICATION_REVIEW", "increments CertificationProject.version by 1"]
  - method: POST
    path: "/certification-projects/{projectId}/confirm-recertification"
    description: "Reviewer confirms recertification (cycle back to CERTIFIED) or lapses the certification"
    roles: [CertificationReviewer]
    code: 200
    input: [outcome]
    output: CertificationProject
    side_effects: ["RECERTIFY: status -> CERTIFIED, certified_at refreshed", "LAPSE: status -> LAPSED", "increments CertificationProject.version by 1"]
  - method: GET
    path: "/certification-projects/{id}/performance-reports"
    description: "List performance reports of a project (sub-resource)"
    roles: [Any]
    code: 200
    input: []
    output: "PerformanceReport[]"
    side_effects: []
  - method: GET
    path: "/certification-projects/{id}/cost-premium-analysis"
    description: "Get the project's cost premium analysis (sub-resource; 1:1 returns array of 0-1)"
    roles: [Any]
    code: 200
    input: []
    output: "CostPremiumAnalysis[]"
    side_effects: []

  # --- EnergyModel ---
  - method: POST
    path: "/energy-models"
    description: "Create a BASELINE or PROPOSED energy model (OCC-guarded on project version)"
    roles: [EnergyModeler]
    code: 201
    input: [project_id, model_type, modeling_standard, annual_energy_cost_modeled_cents, annual_energy_cost_confirmed_only_cents, "includes_unconfirmed_measures?", expected_project_version]
    output: EnergyModel
    side_effects: ["status = DRAFT", "version_index = max existing for (project_id, model_type) + 1", "created_by = X-User-ID", "increments CertificationProject.version by 1"]
  - method: GET
    path: "/energy-models"
    description: "List energy models"
    roles: [Any]
    code: 200
    input: ["project_id?", "model_type?", "status?", "created_by?"]
    output: "EnergyModel[]"
    side_effects: []
  - method: GET
    path: "/energy-models/{modelId}"
    description: "Get an energy model"
    roles: [Any]
    code: 200
    input: []
    output: EnergyModel
    side_effects: []
  - method: POST
    path: "/energy-models/{modelId}/lock"
    description: "Lock a DRAFT model; supersedes the previously LOCKED model of same type and flags stale credit pins"
    roles: [EnergyModeler]
    code: 200
    input: []
    output: EnergyModel
    side_effects: ["status -> LOCKED; PROPOSED: improvement variants computed", "previous LOCKED same-type model -> SUPERSEDED", "pinned CreditAttempts -> has_stale_model_pin = true; READY ones revert to DOCUMENTATION_IN_PROGRESS"]

  # --- CreditAttempt ---
  - method: POST
    path: "/credit-attempts"
    description: "Select a credit into the project strategy (documentation ownership matrix row)"
    roles: [ProjectAdministrator]
    code: 201
    input: [project_id, credit_library_entry_id, phase, documentation_owner_id]
    output: CreditAttempt
    side_effects: ["status = SELECTED", "snapshots credit_code/points_possible/is_prerequisite from the entry", "project.points_pursued_total recomputed", "increments CertificationProject.version by 1"]
  - method: GET
    path: "/credit-attempts"
    description: "List credit attempts"
    roles: [Any]
    code: 200
    input: ["project_id?", "credit_library_entry_id?", "documentation_owner_id?", "pinned_proposed_model_id?", "status?", "phase?"]
    output: "CreditAttempt[]"
    side_effects: []
  - method: GET
    path: "/credit-attempts/{attemptId}"
    description: "Get a credit attempt"
    roles: [Any]
    code: 200
    input: []
    output: CreditAttempt
    side_effects: []
  - method: POST
    path: "/credit-attempts/{attemptId}/assign-owner"
    description: "Assign/reassign the documentation owner; from SELECTED starts documentation work"
    roles: [ProjectAdministrator]
    code: 200
    input: [documentation_owner_id]
    output: CreditAttempt
    side_effects: ["SELECTED -> DOCUMENTATION_IN_PROGRESS; in DOCUMENTATION_IN_PROGRESS only the owner field changes"]
  - method: POST
    path: "/credit-attempts/{attemptId}/mark-ready"
    description: "Owner marks documentation complete; requires_energy_model credits pin the LOCKED PROPOSED model"
    roles: [DocumentationSpecialist]
    code: 200
    input: []
    output: CreditAttempt
    side_effects: ["DOCUMENTATION_IN_PROGRESS -> READY_FOR_SUBMITTAL", "pin pinned_proposed_model_id when requires_energy_model"]
  - method: POST
    path: "/credit-attempts/{attemptId}/drop"
    description: "Drop a not-yet-submitted attempt from the strategy"
    roles: [ProjectAdministrator]
    code: 200
    input: []
    output: CreditAttempt
    side_effects: ["-> DROPPED", "project.points_pursued_total recomputed", "increments CertificationProject.version by 1"]
  - method: POST
    path: "/credit-attempts/{attemptId}/begin-review"
    description: "Reviewer opens review on a SUBMITTED attempt, resumes a RESUBMITTED one, or reopens an APPEALED one"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: CreditAttempt
    side_effects: ["-> UNDER_REVIEW", "projected_level recomputed"]
  - method: POST
    path: "/credit-attempts/{attemptId}/resubmit"
    description: "Owner resubmits after addressing all review comments"
    roles: [DocumentationSpecialist]
    code: 200
    input: []
    output: CreditAttempt
    side_effects: ["CLARIFICATION_REQUESTED -> RESUBMITTED", "submission_round += 1"]
  - method: POST
    path: "/credit-attempts/{attemptId}/award"
    description: "Reviewer awards points (explicit raw_points_earned or bucket-computed for model-linked credits)"
    roles: [CertificationReviewer]
    code: 200
    input: ["raw_points_earned?"]
    output: CreditAttempt
    side_effects: ["UNDER_REVIEW -> AWARDED", "points_awarded = per-credit round_half_up", "project totals + prerequisites_satisfied recomputed", "phase bubble-up to *_REVIEWED when all phase attempts terminal"]
  - method: POST
    path: "/credit-attempts/{attemptId}/deny"
    description: "Reviewer denies the credit"
    roles: [CertificationReviewer]
    code: 200
    input: ["reason?"]
    output: CreditAttempt
    side_effects: ["UNDER_REVIEW -> DENIED", "prerequisites_satisfied recomputed", "phase bubble-up when all phase attempts terminal"]
  - method: POST
    path: "/credit-attempts/{attemptId}/appeal"
    description: "Appeal a denied credit; reopens the phase review"
    roles: [ProjectAdministrator]
    code: 200
    input: [appeal_justification]
    output: CreditAttempt
    side_effects: ["DENIED -> APPEALED", "project reverts *_REVIEWED -> *_SUBMITTED"]
  - method: GET
    path: "/credit-attempts/{id}/review-comments"
    description: "List review comments on an attempt (sub-resource)"
    roles: [Any]
    code: 200
    input: []
    output: "ReviewComment[]"
    side_effects: []

  # --- ReviewComment ---
  - method: POST
    path: "/review-comments"
    description: "Reviewer posts a comment on an attempt UNDER_REVIEW; moves the attempt to CLARIFICATION_REQUESTED"
    roles: [CertificationReviewer]
    code: 201
    input: [credit_attempt_id, severity, comment_text]
    output: ReviewComment
    side_effects: ["status = OPEN", "round = attempt.submission_round", "attempt UNDER_REVIEW -> CLARIFICATION_REQUESTED", "projected_level recomputed"]
  - method: POST
    path: "/review-comments/{commentId}/respond"
    description: "Documentation owner responds to an OPEN or REOPENED comment"
    roles: [DocumentationSpecialist]
    code: 200
    input: [response_text]
    output: ReviewComment
    side_effects: ["OPEN|REOPENED -> ADDRESSED", "response_text set"]
  - method: POST
    path: "/review-comments/{commentId}/accept"
    description: "Reviewer accepts a response (attempt must be RESUBMITTED)"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: ReviewComment
    side_effects: ["ADDRESSED -> ACCEPTED"]
  - method: POST
    path: "/review-comments/{commentId}/reopen"
    description: "Reviewer reopens an ADDRESSED comment (attempt must be RESUBMITTED)"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: ReviewComment
    side_effects: ["ADDRESSED -> REOPENED"]

  # --- CommissioningTask ---
  - method: POST
    path: "/commissioning-tasks"
    description: "Schedule a commissioning task (half-open overlap check, independence gate)"
    roles: [ProjectAdministrator]
    code: 201
    input: [project_id, task_type, agent_id, scheduled_start, scheduled_end, is_prerequisite_linked]
    output: CommissioningTask
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/commissioning-tasks"
    description: "List commissioning tasks"
    roles: [Any]
    code: 200
    input: ["project_id?", "agent_id?", "status?"]
    output: "CommissioningTask[]"
    side_effects: []
  - method: GET
    path: "/commissioning-tasks/{taskId}"
    description: "Get a commissioning task"
    roles: [Any]
    code: 200
    input: []
    output: CommissioningTask
    side_effects: []
  - method: POST
    path: "/commissioning-tasks/{taskId}/start"
    description: "Assigned agent starts the task"
    roles: [CommissioningAgent]
    code: 200
    input: []
    output: CommissioningTask
    side_effects: ["SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/commissioning-tasks/{taskId}/complete"
    description: "Assigned agent records the outcome"
    roles: [CommissioningAgent]
    code: 200
    input: [outcome, "result_notes?"]
    output: CommissioningTask
    side_effects: ["IN_PROGRESS -> PASSED | FAILED"]

  # --- IncentiveProgram ---
  - method: POST
    path: "/incentive-programs"
    description: "Create an incentive program"
    roles: [ProgramAdmin]
    code: 201
    input: [program_name, incentive_type, benefit_amount_cents, minimum_certification_level, is_combinable]
    output: IncentiveProgram
    side_effects: []
  - method: GET
    path: "/incentive-programs"
    description: "List incentive programs"
    roles: [Any]
    code: 200
    input: ["incentive_type?"]
    output: "IncentiveProgram[]"
    side_effects: []
  - method: GET
    path: "/incentive-programs/{programId}"
    description: "Get an incentive program"
    roles: [Any]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []

  # --- ProjectIncentive ---
  - method: POST
    path: "/project-incentives"
    description: "Apply a project to an incentive program"
    roles: [ProjectAdministrator]
    code: 201
    input: [project_id, incentive_program_id]
    output: ProjectIncentive
    side_effects: ["status = APPLIED", "claimed_amount_cents = 0"]
  - method: GET
    path: "/project-incentives"
    description: "List project incentive applications"
    roles: [Any]
    code: 200
    input: ["project_id?", "incentive_program_id?", "status?"]
    output: "ProjectIncentive[]"
    side_effects: []
  - method: GET
    path: "/project-incentives/{projectIncentiveId}"
    description: "Get a project incentive application"
    roles: [Any]
    code: 200
    input: []
    output: ProjectIncentive
    side_effects: []
  - method: POST
    path: "/project-incentives/{projectIncentiveId}/approve"
    description: "Approve an application (requires CERTIFIED project at sufficient level)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProjectIncentive
    side_effects: ["APPLIED -> APPROVED", "claimed_amount_cents = program.benefit_amount_cents"]
  - method: POST
    path: "/project-incentives/{projectIncentiveId}/disburse"
    description: "Disburse an approved incentive"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProjectIncentive
    side_effects: ["APPROVED -> DISBURSED"]

  # --- CostPremiumAnalysis ---
  - method: POST
    path: "/cost-premium-analyses"
    description: "Create the project's cost premium analysis (1:1); requires LOCKED BASELINE and PROPOSED models"
    roles: [ProjectAdministrator]
    code: 201
    input: [project_id, incremental_construction_cost_cents]
    output: CostPremiumAnalysis
    side_effects: ["computes annual_energy_savings_cents, incentive_total_cents, net_cost_premium_cents, simple_payback_years per pinned evaluation order", "analysis_version = 1"]
  - method: GET
    path: "/cost-premium-analyses/{analysisId}"
    description: "Get a cost premium analysis"
    roles: [Any]
    code: 200
    input: []
    output: CostPremiumAnalysis
    side_effects: []
  - method: POST
    path: "/cost-premium-analyses/{analysisId}/recalculate"
    description: "Recompute savings/incentive total/net/payback after incentive approvals or model re-locks"
    roles: [ProjectAdministrator]
    code: 200
    input: []
    output: CostPremiumAnalysis
    side_effects: ["recomputes all computed fields", "analysis_version += 1"]

  # --- PerformanceReport ---
  - method: POST
    path: "/performance-reports"
    description: "Create a performance period report (closed-interval tiling vs ACCEPTED anchor; first period starts on date(certified_at))"
    roles: [ProjectAdministrator]
    code: 201
    input: [project_id, period_start, period_end, actual_annual_energy_cost_cents]
    output: PerformanceReport
    side_effects: ["status = DRAFT", "performance_gap_pct and within_tolerance computed", "if project CERTIFIED: project -> PERFORMANCE_REPORTING"]
  - method: GET
    path: "/performance-reports/{reportId}"
    description: "Get a performance report"
    roles: [Any]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: []
  - method: POST
    path: "/performance-reports/{reportId}/submit"
    description: "Submit a DRAFT report for verification"
    roles: [ProjectAdministrator]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: ["DRAFT -> SUBMITTED"]
  - method: POST
    path: "/performance-reports/{reportId}/verify"
    description: "Reviewer accepts (requires within_tolerance) or rejects (requires rejection_reason)"
    roles: [CertificationReviewer]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: PerformanceReport
    side_effects: ["SUBMITTED -> ACCEPTED | REJECTED"]
  - method: POST
    path: "/performance-reports/{reportId}/revise"
    description: "Send a REJECTED report back to DRAFT for correction"
    roles: [ProjectAdministrator]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: ["REJECTED -> DRAFT"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, scheduled_end <= scheduled_start, period_end <= period_start, raw_points_earned out of 0..points_possible, REJECT without rejection_reason" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_DOCUMENTATION_OWNER, http: 403, condition: "X-User-ID != CreditAttempt.documentation_owner_id on owner-only actions" }
  - { id: ERR_NOT_ASSIGNED_COMMISSIONING_AGENT, http: 403, condition: "X-User-ID != CommissioningTask.agent_id on start/complete" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "CertificationProject id does not exist" }
  - { id: ERR_TEAM_MEMBER_NOT_FOUND, http: 404, condition: "TeamMember id does not exist" }
  - { id: ERR_CREDIT_ENTRY_NOT_FOUND, http: 404, condition: "CreditLibraryEntry id does not exist" }
  - { id: ERR_ENERGY_MODEL_NOT_FOUND, http: 404, condition: "EnergyModel id does not exist" }
  - { id: ERR_CREDIT_ATTEMPT_NOT_FOUND, http: 404, condition: "CreditAttempt id does not exist" }
  - { id: ERR_REVIEW_COMMENT_NOT_FOUND, http: 404, condition: "ReviewComment id does not exist" }
  - { id: ERR_COMMISSIONING_TASK_NOT_FOUND, http: 404, condition: "CommissioningTask id does not exist" }
  - { id: ERR_INCENTIVE_PROGRAM_NOT_FOUND, http: 404, condition: "IncentiveProgram id does not exist" }
  - { id: ERR_PROJECT_INCENTIVE_NOT_FOUND, http: 404, condition: "ProjectIncentive id does not exist" }
  - { id: ERR_ANALYSIS_NOT_FOUND, http: 404, condition: "CostPremiumAnalysis id does not exist" }
  - { id: ERR_PERFORMANCE_REPORT_NOT_FOUND, http: 404, condition: "PerformanceReport id does not exist" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version != current project.version (OCC)" }
  - { id: ERR_INVALID_PROJECT_STATE, http: 409, condition: "Project not in a valid from-state for the requested transition" }
  - { id: ERR_INVALID_CREDIT_ATTEMPT_STATE, http: 409, condition: "CreditAttempt not in a valid from-state for the requested transition" }
  - { id: ERR_INVALID_MODEL_STATE, http: 409, condition: "EnergyModel not DRAFT on lock" }
  - { id: ERR_INVALID_COMMENT_STATE, http: 409, condition: "ReviewComment not in a valid from-state, or attempt not RESUBMITTED for accept/reopen" }
  - { id: ERR_INVALID_TASK_STATE, http: 409, condition: "CommissioningTask not in a valid from-state (start requires SCHEDULED; complete requires IN_PROGRESS)" }
  - { id: ERR_INVALID_INCENTIVE_STATE, http: 409, condition: "ProjectIncentive not in a valid from-state (approve requires APPLIED; disburse requires APPROVED)" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "PerformanceReport not in a valid from-state (submit requires DRAFT; verify requires SUBMITTED; revise requires REJECTED)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Submitter of a phase is documentation_owner of an included attempt" }
  - { id: ERR_COMMISSIONING_INCOMPLETE, http: 409, condition: "submit-phase CONSTRUCTION while an is_prerequisite_linked CommissioningTask on the project is not PASSED" }
  - { id: ERR_CX_AGENT_NOT_INDEPENDENT, http: 403, condition: "Commissioning agent lacks is_independent=true or is the creator of the project's LOCKED PROPOSED model" }
  - { id: ERR_PREREQUISITE_NOT_AWARDED, http: 409, condition: "CERTIFY decision while a non-DROPPED prerequisite attempt is not AWARDED" }
  - { id: ERR_MINIMUM_IMPROVEMENT_NOT_MET, http: 422, condition: "PERFORMANCE-path PROPOSED lock with improvement_pct_final < 5.00" }
  - { id: ERR_INVALID_TEAM_MEMBER_SPECIALTY, http: 422, condition: "Documentation owner not specialty=DOCUMENTATION, or commissioning agent not specialty=COMMISSIONING" }
  - { id: ERR_DUPLICATE_CREDIT_ATTEMPT, http: 409, condition: "A non-DROPPED attempt for the same credit_code already exists on the project" }
  - { id: ERR_DUPLICATE_INCENTIVE_APPLICATION, http: 409, condition: "An APPLIED/APPROVED/DISBURSED application for the same program already exists on the project" }
  - { id: ERR_ANALYSIS_EXISTS, http: 409, condition: "A CostPremiumAnalysis already exists for the project (1:1)" }
  - { id: ERR_CX_SCHEDULE_OVERLAP, http: 409, condition: "Half-open overlap with an existing SCHEDULED/IN_PROGRESS task on the same project" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period shares a day with the ACCEPTED anchor window or any DRAFT/SUBMITTED/ACCEPTED report" }
  - { id: ERR_REPORT_PERIOD_GAP, http: 409, condition: "Report period_start is later than anchor.period_end + 1 day (untiled gap)" }
  - { id: ERR_EMPTY_SUBMISSION_PACKAGE, http: 422, condition: "submit-phase with zero READY_FOR_SUBMITTAL attempts for the phase" }
  - { id: ERR_REVIEW_ALREADY_STARTED, http: 409, condition: "withdraw-phase after a ReviewComment exists on any SUBMITTED attempt of the phase" }
  - { id: ERR_EMPTY_CREDIT_STRATEGY, http: 422, condition: "lock-strategy with zero non-DROPPED attempts" }
  - { id: ERR_PREREQUISITE_CREDIT_MISSING, http: 409, condition: "lock-strategy while a prerequisite library entry has no non-DROPPED attempt on the project" }
  - { id: ERR_UNRESOLVED_REVIEW_COMMENTS, http: 409, condition: "resubmit while a comment is OPEN/REOPENED; begin-review on RESUBMITTED while a comment is not ACCEPTED" }
  - { id: ERR_INSUFFICIENT_PERFORMANCE_REPORTS, http: 409, condition: "submit-recertification with fewer than 2 ACCEPTED reports" }
  - { id: ERR_PERFORMANCE_GAP_EXCEEDED, http: 422, condition: "verify ACCEPT while abs(performance_gap_pct) > 15.00" }
  - { id: ERR_BASELINE_MODEL_NOT_LOCKED, http: 409, condition: "Locking a PROPOSED model without a LOCKED BASELINE on the project" }
  - { id: ERR_PROPOSED_MODEL_NOT_LOCKED, http: 409, condition: "mark-ready on a requires_energy_model credit without a LOCKED PROPOSED model, or PERFORMANCE-path submit-phase without one, or analysis creation without locked models" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "CERTIFY decision with points_awarded_total < 40" }
  - { id: ERR_INSUFFICIENT_SUBMISSION_FUNDS, http: 402, condition: "fee_balance_cents below the phase certification fee at submit-phase" }
  - { id: ERR_PROJECT_NOT_CERTIFIED, http: 409, condition: "Incentive approve while project status != CERTIFIED" }
  - { id: ERR_CERTIFICATION_LEVEL_INSUFFICIENT, http: 422, condition: "project.certified_level below program.minimum_certification_level at approve" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Platform operator: credit catalog, incentive programs, incentive approval/disbursement, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /team-members"
      - "POST /credit-library-entries"
      - "POST /incentive-programs"
      - "POST /project-incentives/{id}/approve"
      - "POST /project-incentives/{id}/disburse"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: ProjectAdministrator
    description: "LEED consultant administering the project: strategy, phase submissions, credit attempts, commissioning scheduling, incentives, cost premium analysis, performance reports"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /certification-projects and all /certification-projects/{id}/* project actions (lock-strategy, submit-phase, withdraw-phase, submit-recertification)"
      - "POST /credit-attempts, assign-owner, drop, appeal"
      - "POST /commissioning-tasks"
      - "POST /project-incentives"
      - "POST /cost-premium-analyses, recalculate"
      - "POST /performance-reports, submit, revise"
    shared_operations: ["all GET endpoints"]
  - name: EnergyModeler
    description: "Builds and locks baseline/proposed energy models; may NOT administer projects or perform commissioning on own models"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /energy-models"
      - "POST /energy-models/{id}/lock"
    shared_operations: ["all GET endpoints"]
  - name: DocumentationSpecialist
    description: "Prepares credit documentation; owner-only actions mark-ready, resubmit, respond; may NOT submit the phase package containing own work (segregation of duties)"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /credit-attempts/{id}/mark-ready (as owner)"
      - "POST /credit-attempts/{id}/resubmit (as owner)"
      - "POST /review-comments/{id}/respond (as owner)"
    shared_operations: ["all GET endpoints"]
  - name: CommissioningAgent
    description: "Independent commissioning authority; starts and completes assigned commissioning tasks"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /commissioning-tasks/{id}/start (as assigned agent)"
      - "POST /commissioning-tasks/{id}/complete (as assigned agent)"
    shared_operations: ["all GET endpoints"]
  - name: CertificationReviewer
    description: "Green-building certification reviewer (GBCI): review comments, credit award/deny, certification decisions, report verification, recertification confirmation"
    identity: opaque
    exclusive_operations:
      - "POST /review-comments, accept, reopen"
      - "POST /credit-attempts/{id}/begin-review, award, deny"
      - "POST /certification-projects/{id}/issue-decision, confirm-recertification"
      - "POST /performance-reports/{id}/verify"
    shared_operations: ["all GET endpoints"]
  - name: Any
    description: "Any authenticated context may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
