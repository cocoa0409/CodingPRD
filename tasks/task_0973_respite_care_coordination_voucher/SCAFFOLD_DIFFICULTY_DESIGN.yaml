  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: voucher_issue_exactly_available_hours_boundary
        grounds:
          - "validations[priority=21]"
          - entities.Allocation.fields.available_hours
        distinguishing_aspect: |
          Metric = allocation hours (2dp): a voucher for exactly
          available_hours (80.00) succeeds and drains available to 0.00 (>=
          semantics — equal passes); a follow-up voucher for the minimum 1.00
          fails with ERR_INSUFFICIENT_HOURS. Endpoint: POST /respite/vouchers.
        test_recipe:
          setup:
            - "Caregiver ACTIVE with fresh Q2 allocation: granted 80.00, available 80.00, quarterly cap 80 (80 exactly equals the cap and passes)"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
          trigger:
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 80 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "GET /respite/allocations/${alloc}", as: Coordinator, captures: { avail: $.data.available_hours, res: $.data.reserved_hours } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 1 }, as: Caregiver, as_user_id: "${cg}", captures: { err: $.data.error_id } }
          assert:
            - "Voucher.${vch}.authorized_hours == 80.00"
            - "Allocation.${alloc}.available_hours == 0.00"
            - "Allocation.${alloc}.reserved_hours == 80.00"
            - "error_id == ERR_INSUFFICIENT_HOURS"

      - name: booking_overlap_count_at_capacity_boundary
        grounds:
          - "validations[priority=14]"
          - entities.AvailabilityWindow.fields.capacity
        distinguishing_aspect: |
          Metric = integer overlap count on a different endpoint (POST
          /respite/bookings): with capacity 1 a second booking whose interval
          overlaps the existing one is rejected (count 1 == capacity is NOT <
          capacity), while a third booking starting exactly 30 minutes after the
          first ends (zero overlap, buffer exactly met) succeeds.
        test_recipe:
          setup:
