              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION"

      - name: occ_fresh_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-post-stale-loan]", entities.CreditBuilderLoan.fields.version]
        distinguishing_aspect: "Re-reading the loan version after the first payment and posting with the fresh expected_loan_version succeeds; loan.version increments by 1 per posted payment."
        test_recipe:
          setup: ["CA loan P=60000 apr0 funded ACTIVE; one payment posted; loan re-read for fresh version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "cc2@x.com", full_name: "CC Two", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              captures: { loan_v2: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan_v3: $.data.version }
          trigger:
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_v3}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { pay2: $.data.id }
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan_v4: $.data.version }
          assert:
            - "Second payment HTTP 201; CreditBuilderLoan.${loan}.principal_paid_cents == 10000"
            - "loan_v4 == loan_v3 + 1 (version increments by exactly one per posted payment)"

      - name: occ_stale_card_version_on_deposit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deposit-post-stale-card]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Posting a second deposit with the pre-first-deposit expected_card_version (now stale) -> 412 ERR_STALE_VERSION; this is the SecuredCard OCC parent, distinct from the loan OCC."
        test_recipe:
          setup: ["CA account ELIGIBLE; SECURED_CARD acknowledged; card with one POSTED deposit of 30000 (card.version advanced)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "cc3@x.com", full_name: "CC Three", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 30000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 20000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION"

      - name: rate_threshold_dpd_30_at_grace_boundary
        claim_type: rate_threshold_triggers
        grounds: [state_machines.CreditBuilderLoan.CURRENT_to_DPD_30, calculations.compute_late_fee_assessment, entities.CreditBuilderLoan.fields.delinquency_status]
        distinguishing_aspect: "An installment exactly at due_date + GRACE_DAYS (5) is still CURRENT; one day past grace (6 days past due) crosses to DPD_30 and assesses the first 1500 late fee."
        test_recipe:
          setup: ["CA loan P=60000 apr0 funded 2026-02-01; period-1 due 2026-03-01; sweep at 2026-03-06 (exactly grace boundary, 5 days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "cc4@x.com", full_name: "CC Four", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/run-delinquency-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { delq_at_grace: $.data.delinquency_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/run-delinquency-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { delq_after: $.data.delinquency_status }
          assert:
            - "At 2026-03-06 (exactly due+GRACE 5): CreditBuilderLoan.${loan}.delinquency_status == CURRENT"
            - "At 2026-03-07 (6 days past due, > grace): delinquency_status == DPD_30"

      - name: excluded_cascade_payoff
        claim_type: cascading_side_effects
        grounds: [state_machines.CreditBuilderLoan.ACTIVE_to_PAID_OFF]
        excluded_because:
          difficulty_instance: transitive_cascade / early_payoff_release_cascade_depth3
          rationale: "The multi-hop payoff->release cascade is asserted end-to-end by the named §1.8 instance."

      - name: excluded_cascade_release
        claim_type: cascading_side_effects
        grounds: [state_machines.SecuredCard.ACTIVE_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / release_deposit_wallet_cascade_depth3
          rationale: "The release-deposit wallet cascade is asserted end-to-end by the named §1.8 instance."

  # =========================================================================
