          - entities.QueueEntry.fields.exit_ts
          - state_machines.Vehicle.status
        distinguishing_aspect: |
          Gap/buffer interval semantics on the Vehicle staging timeline (a DIFFERENT resource
          from CurbZone, and a DIFFERENT geometry): re-entry is rejected unless
