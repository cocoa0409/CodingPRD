  - section: validations
    instances:
      - name: request_below_min_trust_returns_trust_too_low
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", entities.HomeListing.fields.min_trust_score, "errors[ERR_TRUST_TOO_LOW]"]
        distinguishing_aspect: "Listing min_trust_score=60 while requester trust_score=50 (a new member) yields ERR_TRUST_TOO_LOW (403); membership active and points sufficient so no earlier check fires."
        test_recipe:
          setup: ["Guest PLUS ACTIVE with 1000 points (trust 50); host verified with an ACTIVE listing whose min_trust_score is 60."]
