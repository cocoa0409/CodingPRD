            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Dragon Tales", list_price_cents: 1000, line_type: FRONTLIST, qty_committed: 600 }, as: Organizer, captures: { line_id: "$.data.id" } }
            - { call: "POST /stock-lines/${line_id}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_id}/deliver", payload: { qty_delivered: 600 }, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /sales", payload: { fair_id: "${fair_id}", lines: [{ stock_line_id: "${line_id}", qty: 500 }] }, as: Cashier, captures: { sale_id: "$.data.id" } }
            - { call: "POST /sales/${sale_id}/tender", payload: { tendered_amount_cents: 500000 }, as: Cashier }
            - { call: "POST /fairs/${fair_id}/close-sales", payload: {}, as: Organizer, as_user_id: "org_lead_1" }
            - { call: "GET /reconciliations", payload: { fair_id: "${fair_id}" }, as: Organizer, captures: { recon_id: "$.data[0].id", recon_v: "$.data[0].version" } }
            - { call: "POST /reconciliations/${recon_id}/counts", payload: { lines: [{ stock_line_id: "${line_id}", qty_on_hand: 100 }], expected_reconciliation_version: "${recon_v}" }, as: Organizer }
            - { call: "POST /reconciliations/${recon_id}/submit-review", payload: {}, as: Organizer }
            - { call: "POST /reconciliations/${recon_id}/approve", payload: {}, as: Organizer, as_user_id: "org_lead_2" }
