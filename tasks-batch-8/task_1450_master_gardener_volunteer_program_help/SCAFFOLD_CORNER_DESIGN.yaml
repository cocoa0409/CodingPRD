  # ---------------------------------------------------------------------------
  # Cross-Cutting Complexity Layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: cycle_update_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cycle-config-stale-update]"]
        distinguishing_aspect: "PUT /program-cycles/{id} requires expected_cycle_version: a writer replaying the version it read before another permitted update is rejected 412 while the fresh writer succeeds."
        test_recipe:
          setup: ["cycle 2026 DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
          trigger:
            - { call: "PUT /program-cycles/${cyc}", payload: { expected_cycle_version: "${cyc_v}", hour_requirement: 36.0 }, as: ProgramCoordinator, captures: { v2: $.data.version } }
            - { call: "PUT /program-cycles/${cyc}", payload: { expected_cycle_version: "${cyc_v}", ce_requirement: 8.0 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /program-cycles/${cyc}", as: ProgramCoordinator, captures: { v_now: $.data.version, hr: $.data.hour_requirement, ce: $.data.ce_requirement } }
          assert:
            - "captured v2 == 2   (first update advanced the version)"
            - "captured err == ERR_STALE_CYCLE_VERSION and http status == 412"
            - "captured v_now == 2 and hr == 36.0 and ce == 10.0   (loser's write left no trace)"

      - name: project_amend_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[project-amend-stale-version]"]
        distinguishing_aspect: "PUT /projects/{id} on a DRAFT project: the first amend advances version 1 -> 2; a second amend carrying the stale version is rejected 412."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE; project DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /projects", payload: { cycle_id: "${cyc}", organizer_volunteer_id: "${vol}", title: "Seed Library", description: "v1", estimated_hours_per_volunteer: 8.0 }, as: Volunteer, as_user_id: "${vol}", captures: { proj: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "PUT /projects/${proj}", payload: { expected_project_version: "${pv}", title: "Seed Library v2" }, as: Volunteer, as_user_id: "${vol}", captures: { v2: $.data.version } }
            - { call: "PUT /projects/${proj}", payload: { expected_project_version: "${pv}", title: "Seed Library v3" }, as: Volunteer, as_user_id: "${vol}", captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2"
            - "captured err == ERR_STALE_PROJECT_VERSION and http status == 412"
            - "CommunityProject.${proj}.title == Seed Library v2   (stale write dropped)"

      - name: specialist_patch_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[specialist-update-stale-version]"]
        distinguishing_aspect: "PATCH /specialists/{id}: a capacity update carrying a superseded version is rejected 412 and max_concurrent_referrals stays at the winner's value."
        test_recipe:
          setup: ["specialist S at version 1 with capacity 3"]
          setup_api_calls:
            - { call: "POST /specialists", payload: { name: "Dr. Pest", specialty: "PEST", max_concurrent_referrals: 3 }, as: ProgramCoordinator, captures: { spec: $.data.id, sv: $.data.version } }
          trigger:
            - { call: "PATCH /specialists/${spec}", payload: { expected_specialist_version: "${sv}", max_concurrent_referrals: 5 }, as: ProgramCoordinator, captures: { v2: $.data.version } }
            - { call: "PATCH /specialists/${spec}", payload: { expected_specialist_version: "${sv}", max_concurrent_referrals: 1 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2"
            - "captured err == ERR_STALE_SPECIALIST_VERSION and http status == 412"
            - "Specialist.${spec}.max_concurrent_referrals == 5"

      - name: waitlist_promotion_tie_breaks_by_created_at
        claim_type: selector_policy
        grounds: [calculations.waitlist_promotion_order, state_machines.Application.WAITLISTED_to_ACCEPTED]
        distinguishing_aspect: "Two waitlisted applications with identical composite 95.0: the earlier-created one promotes first (created_at ASC tie-break), and the promotion cascades a TRAINEE volunteer."
        test_recipe:
          setup: ["cycle 2026 OPEN capacity 2; A1 ACCEPTED; A2 (95.0) WAITLISTED; A3 (95.0, created after A2) WAITLISTED"]
          setup_api_calls:
