            - "TeacherPayout.${p_2}.net_payout_cents == 1500"
            - "The rejected posted selector would set TeacherPayout.${p_2}.gross_earnings_cents to 1500 (the net already disbursed on ${p_1}), so gross == 2000 discriminates the applied accrual selector from the rejected posted selector"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (c) then (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discount_stacking_order_on_enrollment
        grounds:
          - calculations.enrollment_discounted_price_cents
          - entities.Enrollment.fields.subscription_discount_cents
          - entities.Enrollment.fields.coupon_discount_cents
          - entities.Enrollment.fields.discounted_price_cents
        distinguishing_aspect: |
          The pinned subscription-first stacking order yields discounted_price_cents 2550 for a
          3333-cent listing with a PLUS plan and the SPRING15 coupon, while the rejected
          coupon-first order yields 2551 — the two orders differ by exactly one cent, so the
          asserted value discriminates the pinned evaluation order from the swapped one.
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; a ONE_TIME listing priced 3333 is POLICY_APPROVED and PUBLISHED with an open section"
            - "Learner ln_1 (parent p_1) is on the PLUS subscription tier, whose discount is 0.10"
            - "The logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/teacher-applications"
              payload: { applicant_user_id: "u_ada", applicant_email: "ada@example.com", display_name: "Ada Lovelace", teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
