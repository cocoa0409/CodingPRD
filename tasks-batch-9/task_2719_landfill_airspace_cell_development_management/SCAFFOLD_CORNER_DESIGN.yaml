            - "every load's gate_charge_amount is left in place alongside final_charge_amount, and all three rows report billing_status 'FINALIZED'"

      - name: remaining_life_projection_matches_its_formula_for_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.remaining_life_projection
        excluded_because:
          difficulty_instance: remaining_life_survey_based_vs_ledger_based_divergence   # §1.8 rule: dual_variant_calc
          rationale: "That §1.8 instance computes the projection from pinned inputs under both variants (ledger 3.00 versus survey-derived 1.94) and asserts each literal, which is the correct-result claim for this rule."

      - name: cell_full_fraction_constant_is_applied_at_its_exact_value
        claim_type: constants_applied
        grounds:
          - calculations.daily_airspace_consumption
        excluded_because:
          difficulty_instance: cell_full_at_exactly_98_00_percent_and_not_at_97_94   # §1.8 rule: boundary_precision_check
          rationale: "That §1.8 instance pins CELL_FULL_FRACTION 0.98 by landing on 98.00 percent exactly and on 97.94 percent, proving the declared constant (and its inclusive comparison) is the one in force."

      - name: per_cell_rounding_precision_is_honoured_before_summing
        claim_type: precision
        grounds:
          - calculations.closure_and_post_closure_cost
        excluded_because:
          difficulty_instance: closure_cost_rounds_per_cell_before_summing   # §1.8 rule: combinatorial_formula
          rationale: "That §1.8 instance contrasts the pinned per-cell rounding result 306078.72 against the forbidden sum-then-round result 306078.71, which is the precision claim."

      - name: fill_threshold_crossing_splits_the_cell_lifecycle
        claim_type: threshold
        grounds:
          - calculations.daily_airspace_consumption
        excluded_because:
          difficulty_instance: cell_full_at_exactly_98_00_percent_and_not_at_97_94   # §1.8 rule: boundary_precision_check
          rationale: "That §1.8 instance tests the value just under the threshold, exactly at it, and the resulting state split (ACTIVE versus FULL plus site suspension), covering the threshold boundary triple."

      - name: projection_looks_forward_over_forecast_tonnage
        claim_type: forward_looking
        grounds:
          - calculations.remaining_life_projection
        excluded_because:
          difficulty_instance: remaining_life_survey_based_vs_ledger_based_divergence   # §1.8 rule: dual_variant_calc
          rationale: "That §1.8 instance re-reads the projection after a new survey is recorded and after airspace is consumed, showing the forward-looking value is re-evaluated from the current remaining airspace and forecast rather than cached."

      - name: approval_tonnage_running_total_survives_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.special_waste_tonnage_ledger
        excluded_because:
          difficulty_instance: amend_rebases_special_waste_tonnage_and_reverses_exhaustion   # §1.8 rule: compensating_invariant
          rationale: "That §1.8 instance asserts consumed_tons after manifest-based accrual, after the certified rebase at day close, and after the amend reversal, which is the running-total-after-add-and-reversal claim."

      - name: surcharge_tier_boundaries_are_each_exercised
        claim_type: tiered_pricing
        grounds:
          - calculations.leachate_disposal_invoice
        excluded_because:
          difficulty_instance: leachate_surcharge_tier_keyed_on_pre_surcharge_subtotal   # §1.8 rule: combinatorial_formula
          rationale: "That §1.8 instance walks the 500.00 and 1200.00 tier ceilings on the pre-surcharge subtotal and contrasts 1250.80 with the forbidden total-keyed 1298.00, covering every tier boundary."

      - name: royalty_tier_one_fills_before_tier_two_receives_anything
        claim_type: waterfall_allocation
        grounds:
          - calculations.host_community_royalty_waterfall
        excluded_because:
          difficulty_instance: tipping_charge_gate_rate_vs_certified_scale_divergence   # §1.8 rule: dual_variant_calc
          rationale: "That §1.8 instance drives a load across the monthly tier-1 ceiling and asserts the split components, so the first-bucket-fills-first and overflow behaviour is already covered."

      - name: survey_coverage_intervals_merge_and_abut_correctly
        claim_type: interval_merge
        grounds:
          - validations[priority=17]
        excluded_because:
          difficulty_instance: survey_coverage_closed_intervals_plus_ninety_day_spacing_buffer   # §1.8 rule: resource_temporal_overlap
          rationale: "That §1.8 instance tests touching, overlapping and disjoint coverage periods against the closed-interval rule plus the 90-day spacing buffer."

      - name: qa_weighted_components_do_not_drift_when_re_scored
        claim_type: weighted_scoring
        grounds:
          - calculations.qa_conformance_score
        excluded_because:
          difficulty_instance: qa_score_and_defect_penalty_boundaries   # §1.8 rule: boundary_precision_check
          rationale: "That §1.8 instance exercises the seam-density and defect-penalty components at their boundaries and re-scores on resubmission, covering weight composition and drift."

      - name: the_projection_variant_is_selected_by_survey_availability
        claim_type: variant_selection
        grounds:
          - calculations.remaining_life_projection
        excluded_because:
          difficulty_instance: survey_void_restores_prior_survey_or_falls_back_to_the_ledger   # §1.8 rule: compensating_invariant
          rationale: "That §1.8 instance flips the variant in both directions — survey_based while a RECORDED survey exists, ledger_based once the candidate set empties — which is the variant-selection claim."

      - name: the_billing_variant_switch_reconciles_the_load_ledger
        claim_type: reconciliation
        grounds:
          - calculations.load_tipping_charge
        excluded_because:
          difficulty_instance: day_amend_reverses_airspace_billing_and_posture_with_no_drift   # §1.8 rule: compensating_invariant
          rationale: "That §1.8 instance walks PROVISIONAL -> FINALIZED -> PROVISIONAL and asserts the final/royalty fields are written and then reset while gate_charge_amount is retained, i.e. the variant-switch delta on the ledger."

  - section: validations
    instances:

      - name: construction_over_a_still_open_parent_cell_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_PIGGYBACK_PARENT_NOT_CLOSED]
          - entities.Cell.fields.piggyback_over_cell_id
        distinguishing_aspect: "The piggyback check is not evaluated at cell creation — the reference is accepted there — but at begin-construction, and it demands the parent be CLOSED specifically, not merely FULL."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 in DESIGN and Cell C-2 created with piggyback_over_cell_id pointing at C-1."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-2", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-08-01T00:00:00Z", construction_end_date: "2026-09-01T00:00:00Z", piggyback_over_cell_id: "${c1_id}" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c2_id: $.data.id, c2_piggy: $.data.piggyback_over_cell_id }
          trigger:
            - call: "POST /cells/${c2_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "GET /cells/${c2_id}"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c2_state: $.data.status }
            - call: "GET /cells"
              payload: { piggyback_over_cell_id: "${c1_id}" }
              as: SiteOperator
              as_user_id: "${lf_id}"
          assert:
            - "${c2_piggy} == '${c1_id}' — the reference itself was accepted at creation time"
            - "${err1} == 'ERR_PIGGYBACK_PARENT_NOT_CLOSED' with HTTP 409"
            - "${c2_state} == 'DESIGN' — the failed transition left the row untouched"
            - "trigger 3 returns total_count 1, so the piggyback filter finds the blocked child"

      - name: the_same_cell_code_in_two_landfills_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_CELL_CODE]
        distinguishing_aspect: "Cell code uniqueness is scoped PER LANDFILL, so the identical code that collides inside one site must be accepted in another; the positive case and the negative case differ only in the landfill_id."
        test_recipe:
          setup:
            - "Landfill LF-A with Cell C-1 and Landfill LF-B with no cells."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lfa_id: $.data.id }
            - call: "POST /landfills"
              payload: { name: "Eastbank MSW", permit_number: "MSW-9902", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lfb_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lfa_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lfa_id}"
              captures: { a_c1_id: $.data.id }
          trigger:
            - call: "POST /cells"
              payload: { landfill_id: "${lfb_id}", cell_code: "C-1", design_airspace_cy: 500, design_area_sf: 45001, liner_type: "GCL_ONLY", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-25T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lfb_id}"
              captures: { b_c1_id: $.data.id, b_c1_code: $.data.cell_code }
          assert:
            - "HTTP 201 — the cross-site duplicate is legal because the uniqueness scope is the landfill"
            - "${b_c1_code} == 'C-1' and ${b_c1_id} != '${a_c1_id}'"
            - "GET /cells with cell_code across both sites shows two distinct rows, one per landfill"

