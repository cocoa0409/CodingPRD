            - call: "POST /folios/${f1}/post"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
            - call: "POST /opt-out-requests/${oo1}/grant"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
            - call: "GET /folios/${f1}"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
              captures: { f1_posted_at_1: $.data.posted_at, f1_v_adjusted: $.data.version }
          trigger:
            - call: "POST /folios/${f1}/post"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
          assert:
            - "before the trigger: Folio.${f1}.status == ADJUSTED, line_count == 5, charges_subtotal_cents == 137150, credits_total_cents == 5980, tax_total_cents == 17202 and folio_total_cents == 148372; ${f1_posted_at_1} == 2026-09-14T00:00:00.000Z from the first posting"
            - "the trigger returns HTTP 200 with data.status == POSTED — a state the folio already occupied once, which is what makes this machine cyclic"
            - "data.posted_at is re-stamped to the current logical clock and data.version == ${f1_v_adjusted} + 1"
            - "every money aggregate is byte-identical to the pre-trigger values: 137150 / 5980 / 17202 / 148372, and line_count is still 5 — re-posting appends no line"
            - "the cycle is repeatable: revoking the opt-out drives POSTED -> ADJUSTED again (line_count 6, total 155152) and a third POST returns 200 with status POSTED"
            - "POST /folios/${f1}/close from ADJUSTED is rejected with ERR_INVALID_STATE — the only legal close is from POSTED, which is why the re-post edge must exist"

      - name: folio_post_cannot_precede_check_out
        claim_type: guarded_transitions
        grounds:
          - state_machines.Folio.ITEMIZED_to_POSTED
          - state_machines.Booking
        excluded_because:
          difficulty_instance: folio_post_requires_booking_checked_out_while_itemize_accepts_in_house
          rationale: "That §1.8 cross_entity_state_dependency instance already drives the guarded edge from both sides — it asserts that itemize succeeds while the booking is IN_HOUSE, that post is rejected with ERR_BOOKING_NOT_CHECKED_OUT in that same state, and that the identical post succeeds after check-out — so a separate §1.9 guarded-transition instance would be a strict subset of it."

      - name: require_remediation_cascades_down_to_non_terminal_bookings
        claim_type: cascade_down
        grounds:
          - state_machines.RegulatorInquiry.RESPONSE_SUBMITTED_to_REMEDIATION_REQUIRED
          - state_machines.ChannelDisclosureProfile.DEPLOYED_to_FLAGGED
          - state_machines.Booking
        excluded_because:
          difficulty_instance: require_remediation_cascades_inquiry_to_profile_to_property_to_bookings
          rationale: "The §1.8 transitive_cascade instance walks the full four-level chain with pre-computed literals at every level (min score 0, posture NON_COMPLIANT, both QUOTED bookings DISPUTED, aggregate 23124, exposure 5572, obligation count 4) and explicitly asserts that terminal-side bookings are left alone, which is exactly the cascade-down claim."

      - name: revoking_a_granted_opt_out_compensates_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.OptOutRequest.GRANTED_to_REVOKED
          - calculations.guest_out_of_pocket_conservation
        excluded_because:
          difficulty_instance: opt_out_grant_then_revoke_restores_guest_out_of_pocket_to_the_cent
          rationale: "That §1.8 compensating_invariant instance already asserts the three-checkpoint arc 155152 -> 148372 -> 155152, the mirror FEE_REBILL line at sequence_no 6, the reset of credit_cents / tax_credit_cents / credit_line_sequence_no, and that the original MANDATORY_FEE line was never mutated — no drift is left for a separate corner instance to catch."

  - section: calculations
