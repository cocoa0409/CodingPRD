          setup:
            - "ENROLLED provider (current_tier null, so effective_tier 1) with an ACTIVE STATE_BASE allocation for coach_1 of 10.0 hours over 2026-08-03..2026-08-31 and one SCHEDULED session 2026-08-10T09:00:00Z-12:00:00Z (3.0 h, iso_week_key 2026-W33); clock 2026-08-03."
