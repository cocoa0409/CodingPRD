            - call: "POST /delivery-loads/${load_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-c8"
            - call: "POST /delivery-loads/${load_id}/deliver"
              payload: { actual_net_cubic_yards: 20.0, driveway_protection_used: false, spillage_cubic_yards: 0.0 }
              as: DispatchPlanner
              as_user_id: "planner-c8"
            - call: "POST /material-orders/${ord_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "POST /claim-cases"
              payload: { material_order_id: "${ord_id}", claim_type: "SPILLAGE", claimed_amount_cents: 55000, description: "Aggregate spilled across the sidewalk and gutter; street sweeper hired.", delivery_load_id: "${load_id}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { claim_id: $.data.id }
