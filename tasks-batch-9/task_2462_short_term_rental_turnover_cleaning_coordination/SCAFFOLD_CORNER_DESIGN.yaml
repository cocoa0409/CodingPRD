              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
              captures: { acc_status: "$.data.status", acc_at: "$.data.accepted_at" }
            - call: "GET /pay-lines"
              payload: { turnover_id: "${t1}" }
              as: Coordinator
              captures: { pl_net: "$.data[0].net_cents", pl_variant: "$.data[0].variant" }
            - call: "GET /cleaners/${cc}"
              payload: {}
              as: Coordinator
              captures: { pend1: "$.data.pending_payout_cents" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t1_status1: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "GET /turnovers/${t1}/checklist-tasks"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
              captures: { k4: "$.data[3].id" }
            - call: "POST /checklist-tasks/${k4}/submit"
              payload: { photo_uri: "https://cdn.example.com/k4.jpg", restock_entries: [{ supply_line_id: "${sl1}", qty_used: 1 }, { supply_line_id: "${sl2}", qty_used: 1 }] }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /checklist-tasks/${k4}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
              captures: { rv_status: "$.data.status", rv_charge: "$.data.restock_charge_cents" }
            - call: "GET /supply-lines/${sl1}"
              payload: {}
              as: Coordinator
              captures: { sl1_qty: "$.data.on_hand_qty", sl1_par: "$.data.below_par" }
            - call: "GET /supply-lines/${sl2}"
              payload: {}
              as: Coordinator
              captures: { sl2_qty: "$.data.on_hand_qty" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t1_charge: "$.data.restock_chargeback_cents", t1_status2: "$.data.status" }
            - call: "GET /stock-movements"
              payload: { checklist_task_id: "${k4}" }
              as: Coordinator
              captures: { m0_reason: "$.data[0].reason", m0_delta: "$.data[0].delta_qty", m0_charge: "$.data[0].charge_cents" }
          assert:
            - "${pend0} == 0 (declared default)"
            - "${acc_status} == ACCEPTED and ${acc_at} == 2026-08-01T00:00:00Z"
            - "${pl_variant} == PROVISIONAL and ${pl_net} == 12554 on the very next read - the pay line exists already"
            - "${pend1} == 12554 - the cleaner's payout counter moved inside the accept transaction"
            - "${t1_status1} == SCHEDULED immediately after the accept"
            - "${rv_status} == VERIFIED and ${rv_charge} == 474 (280 + 194) returned by the review call itself"
            - "${sl1_qty} == 5, ${sl2_qty} == 7 and ${t1_charge} == 474 on the next reads - stock and the parent total moved in the same request"
            - "${sl1_par} == false (5 > reorder_point 0)"
            - "${m0_reason} == RESTOCK_USE with ${m0_delta} == -1 and ${m0_charge} == 280 - the ledger row is already there"
            - "${t1_status2} == IN_PROGRESS - three of four rows are still PENDING, so the compound re-derivation did not jump ahead"
