              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Mint Hall", city: "Denver", climate_controlled: true, max_gallery_sqm: 400, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 2000, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 100000, sponsorship_credit_cents: 0 }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SIGN" }
              as: VenueRegistrar
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_INSTALL" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_INSURANCE_COVERAGE"
            - "TourStop.${stop_id}.status == CONTRACTED  # unchanged"

      - name: contract_sign_transitions_stop_tentative_to_contracted
        grounds:
          - state_machines.ParticipationContract.SENT_to_SIGNED
          - state_machines.TourStop.TENTATIVE_to_CONTRACTED
        distinguishing_aspect: |
          Pair (ParticipationContract, TourStop): SIGN on the contract flips
          the stop TENTATIVE -> CONTRACTED; conversely stop transitions depend
          on contract state (REOPEN requires contract not FINALIZED).
        test_recipe:
          setup:
            - "Stop TENTATIVE with contract SENT"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Maps", exhibit_code: "MAPS-2026", crate_count: 1, declared_value_cents: 600000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
