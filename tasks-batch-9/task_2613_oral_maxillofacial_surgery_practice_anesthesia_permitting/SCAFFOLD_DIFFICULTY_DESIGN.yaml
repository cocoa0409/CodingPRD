          assert:
            - "after trigger[0]: ImplantReservation.${res_id}.lot_id == ${lotA_id} (the +0.5 mm / +2.0 mm lot is inside the inclusive tolerance)"
            - "after trigger[0]: ImplantReservation.${res_id}.selection_mode == AUTO_SIZED and status == HELD and quantity == 1"
            - "after trigger[0]: ImplantReservation.${res_id}.line_subtotal_cents == 20000, restocking_fee_cents == 3000 (15% tier), consignment_credit_cents == 0, consignment_liability_cents == 20000"
            - "after trigger[0]: ImplantLot.${lotA_id}.quantity_reserved == 1 and available_quantity == 2; ImplantLot.${lotB_id} and ImplantLot.${lotC_id} are untouched with quantity_reserved == 0"
            - "after trigger[0]: Practice.${prac_id}.consignment_committed_cents == 20000"
            - "trigger[1] fails with HTTP 409 ERR_NO_ELIGIBLE_IMPLANT_LOT (4.3 mm is 1.3 mm from the nearest lot, outside the 0.5 mm tolerance) and no reservation row is created"

      - name: npo_minutes_exactly_at_the_480_and_120_floors
        grounds:
          - calculations.pre_anesthesia_risk_score
          - entities.PreAnesthesiaEvaluation.fields.npo_solids_minutes
          - validations[priority=62]
          - endpoints["POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"]
        metric: "npo_solids_minutes against the 480-minute floor and npo_clears_minutes against the 120-minute floor, measured back from planned_start"
        endpoint: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
        distinguishing_aspect: |
          A third metric on a third endpoint. One minute of fasting decides both the gate and the
          score: solids at 05:01Z against a 13:00Z start is 479 minutes and is refused, while 05:00Z
          is exactly 480 and passes. Because the +15 fasting penalty is applied only strictly below
          the floor, the accepted call leaves final_risk_score identical to provisional_risk_score
          (23.0, band LOW) - at 479 minutes the same evaluation would have scored 38.0 and landed in
          ELEVATED, which is exactly why the boundary has to be exact rather than approximate.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z, then 2026-09-14T12:00:00Z"
            - "one practice, one surgeon, one certified monitor as author, one certified monitor as verifier"
            - "patient born 1980-03-15 (age 46), weight 80 kg"
            - "MODERATE_SEDATION IMPLANT case planned 2026-09-14T13:00Z-14:00Z with a SIGNED evaluation recording asa 2, airway 2 and comorbidity_count 1 -> provisional 23.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Npo", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, dental_plan_active: true }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${author_id}", planned_anesthesia_level: "MODERATE_SEDATION", procedure_category: "IMPLANT", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 200000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 1, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T12:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T05:01:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T05:00:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
          assert:
            - "setup baseline: PreAnesthesiaEvaluation.${eval_id}.provisional_risk_score == 23.0 and risk_band == LOW"
            - "trigger[0] fails with HTTP 409 ERR_FASTING_REQUIREMENT_UNMET (479 minutes is one short of the 480 floor) and the evaluation is still SIGNED with final_risk_score null"
            - "after trigger[1]: PreAnesthesiaEvaluation.${eval_id}.npo_solids_minutes == 480 and npo_clears_minutes == 120"
            - "after trigger[1]: PreAnesthesiaEvaluation.${eval_id}.final_risk_score == 23.0 (identical to provisional - the 15-point fasting penalty is NOT applied at exactly 480) and risk_band == LOW"
            - "after trigger[1]: PreAnesthesiaEvaluation.${eval_id}.final_risk_score != 38.0 and status == VERIFIED, SurgicalCase.${case_id}.clearance_status == CLEARED"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_confirmation_depends_on_practice_privilege_state
        entity_pair: [SurgicalCase, Practice]
        grounds:
          - validations[priority=50]
          - errors.ERR_SEDATION_PRIVILEGE_UNAVAILABLE
          - state_machines.AnesthesiaPermit.SUSPENDED_to_ACTIVE
          - entities.Practice.fields.sedation_privilege_state
        distinguishing_aspect: |
          The SurgicalCase row is impeccable - CLEARED, staffed, inside its block, no prerequisite -
          and yet confirmation is refused purely because a THIRD entity's derived state
          (Practice.sedation_privilege_state, itself derived from the permit) is SUSPENDED. Passing a
          fresh inspection flips the practice back to PERMITTED and the byte-identical confirm call
          then succeeds, which proves the dependency is read live at confirmation time rather than
          snapshotted when the case was drafted.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z -> 2026-09-12T10:00:00Z -> 2026-09-13T10:00:00Z -> 2026-09-14T12:00:00Z"
            - "ACTIVE MODERATE_SEDATION permit (four drills, inspection 0/0/0)"
            - "MODERATE_SEDATION IMPLANT case 2026-09-14T13:00Z-14:00Z holding an OR-1 block"
            - "a second inspection recorded with one critical deficiency AFTER the block was held, so the permit is SUSPENDED while the case is only BLOCK_HELD and therefore untouched by the reversion cascade"
            - "the evaluation is then signed and verified, so clearance_status is CLEARED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
