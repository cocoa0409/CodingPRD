      - name: two_breached_windows_deactivate_the_node_and_only_a_deactivated_node_reactivates
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STORE_NODE_DEACTIVATED
          - errors.ERR_STORE_NOT_DEACTIVATED
          - validations.priority 16
          - validations.priority 17
          - calculations.node_performance_metrics
          - endpoints.POST /fulfillment-network/stores/{store_id}/reactivate
        distinguishing_aspect: "Reaching MAX_CONSECUTIVE_BREACH_WINDOWS takes two separate ops-runs whose breaches must be consecutive, and the two deactivation-state codes are exact mirrors: scheduling a pickup is refused only while DEACTIVATED, and reactivation is refused only while not DEACTIVATED - the same node produces both codes minutes apart."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z and never advanced, so no assignment is ever reaped by ops-run step 1 (every pick_deadline_utc is 13:00:00Z)."
            - "Node S1 is the only node. Epoch 1: one committed A x 2 assignment whose order is then cancelled by CustomerCare, so the window closes with cancellation_rate 1.0000 and the node lands on PROBATION. Epoch 2 repeats the pattern, which is the second consecutive breach."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_a: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-G001", customer_ref: "C-930", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders/${o1}/cancel"
              payload: { cancel_reason_code: "CUSTOMER_REQUEST" }
              as: CustomerCare
            - call: "POST /fulfillment-network/performance-windows/close"
              payload: {}
              as: NetworkPlanner
              captures: { w1: "$.data[0].id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-G002", customer_ref: "C-931", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o2: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o2}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o2}"
              payload: {}
              as: NetworkPlanner
              captures: { o2_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o2}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o2_v}" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders/${o2}/cancel"
              payload: { cancel_reason_code: "CUSTOMER_REQUEST" }
              as: CustomerCare
          trigger:
            - call: "POST /fulfillment-network/performance-windows/close"
              payload: {}
              as: NetworkPlanner
              captures: { w2: "$.data[0].id" }
            - call: "GET /fulfillment-network/stores/${s1}"
              payload: {}
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "UPS", window_start_utc: "2026-08-03T15:00:00Z", window_end_utc: "2026-08-03T16:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { e_deact: "$.data.error_id" }
            - call: "POST /fulfillment-network/stores/${s1}/reactivate"
              payload: {}
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores/${s1}/reactivate"
              payload: {}
              as: NetworkPlanner
              captures: { e_not_deact: "$.data.error_id" }
            - call: "GET /fulfillment-network/performance-windows"
              payload: { store_id: "${s1}", status: "OPEN" }
              as: NetworkPlanner
          assert:
            - "the epoch-1 window NodePerformanceWindow.${w1} closes with assignments_created 1, assignments_cancelled 1, cancellation_rate 1.0000, breach_flags == [CANCELLATION_RATE] (no FILL_RATE or CYCLE_TIME flag because assignments_shipped == 0), breached == true, node_action PROBATION and Store.${s1}.consecutive_breach_windows == 1"
            - "the epoch-2 window NodePerformanceWindow.${w2} closes with the same metrics but node_action DEACTIVATION, because consecutive_breach_windows + 1 == 2 >= MAX_CONSECUTIVE_BREACH_WINDOWS 2 makes the PROBATION branch unreachable"
            - "Store.${s1}.node_status == DEACTIVATED with deactivated_at_epoch == 2, consecutive_breach_windows == 2 and reactivation_count == 0 after the second ops-run"
            - "step 5 opens no successor window for the deactivated node: the ops-run response for the second close contains exactly one window and GET /performance-windows?store_id=${s1}&status=OPEN is empty at that point"
            - "${e_deact} == ERR_STORE_NODE_DEACTIVATED with HTTP 409: the priority-16 rule requires node_status IN {ELIGIBLE, PROBATION} and no CarrierPickup row is created"
            - "the reactivate returns HTTP 200 with Store.${s1}.node_status == ELIGIBLE, consecutive_breach_windows == 0, deactivated_at_epoch == null and reactivation_count == 1"
            - "reactivation re-opens the node's window at epoch 3 == max(network current epoch 3, this store's highest existing epoch 2 + 1), so the final OPEN listing returns exactly one window with epoch 3 and status OPEN"
            - "${e_not_deact} == ERR_STORE_NOT_DEACTIVATED with HTTP 409 for the second reactivate, and it leaves reactivation_count at 1 rather than 2"
            - "the inventory row is whole again after both cancellations: StoreInventory.${inv_a}.reserved_units == 0 and available_to_promise_units == 10"

      - name: the_ops_run_on_a_network_with_no_open_window_is_refused
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_OPEN_WINDOW
          - validations.priority 18
          - endpoints.POST /fulfillment-network/performance-windows/close
        distinguishing_aspect: "The ops-run is guarded network-wide rather than per node: with no Store rows at all there is no OPEN window anywhere and the run is a 409, while the very same call one store later closes that store's epoch-1 window."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z. No Store exists, therefore no NodePerformanceWindow exists."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/performance-windows/close"
              payload: {}
              as: NetworkPlanner
              captures: { e_nowindow: "$.data.error_id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/performance-windows/close"
              payload: {}
              as: NetworkPlanner
              captures: { w1: "$.data[0].id" }
          assert:
            - "${e_nowindow} == ERR_NO_OPEN_WINDOW with HTTP 409, and the empty ops-run is not a 200 with an empty array"
            - "creating the node also creates its epoch-1 OPEN window, which is the only state change between the two identical calls"
            - "the second ops-run returns HTTP 200 with response_type array holding exactly one window: NodePerformanceWindow.${w1}.store_id == ${s3}, epoch == 1, status == CLOSED and closed_at_utc == 2026-08-03T09:00:00Z"
            - "the closed window is inert: assignments_created == 0, fill_rate == 1.0000, cancellation_rate == 0.0000, avg_cycle_time_minutes == 0.00, breach_flags == [], node_action NONE and Store.${s3}.consecutive_breach_windows == 0"
            - "step 5 still runs: Store.${s3} is ELIGIBLE so a fresh OPEN window at epoch 2 exists after the successful run, which is why a third identical call would succeed rather than 409"

  - section: rbac
    instances:
      - name: network_planner_runs_every_configuration_and_engine_operation
        claim_type: permitted
        grounds:
          - roles.NetworkPlanner.exclusive_operations
          - roles.NetworkPlanner.shared_operations
        distinguishing_aspect: "The planner's own eight write routes plus its four shared routes all answer 2xx in one uninterrupted sweep, including the two routes it shares with other roles (carrier pickup scheduling with CarrierCoordinator, inventory adjustment and packaging restock with StoreAssociate) and the cost-comparison read it shares with CustomerCare."
