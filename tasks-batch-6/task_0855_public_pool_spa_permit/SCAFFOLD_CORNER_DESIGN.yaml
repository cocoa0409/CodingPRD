            - "Facility.${fac_id}.max_bather_load == 30 and lifeguard_required == false (CLASS_C is never lifeguard-gated)"

      - name: inspection_with_no_findings_scores_one_hundred_and_passes
        claim_type: Correct Result
        grounds: [calculations.inspection_score_and_result, state_machines.Inspection.SUBMITTED_to_FINALIZED]
        distinguishing_aspect: "The empty-violation-set edge: both demerit sums are 0, score is exactly INSPECTION_SCORE_MAX, result is PASS, reinspection_due_on stays null and no enforcement notice is auto-issued."
