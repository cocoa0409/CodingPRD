            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk }
            - { call: "POST /events/${ev}/judges", payload: { name: "J1", email: "j1@example.com", assigned_class_ids: ["${cl}"] }, as: Organizer, captures: { j1: $.data.id } }
