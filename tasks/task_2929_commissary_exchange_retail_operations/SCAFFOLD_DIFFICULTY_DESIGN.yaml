# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Commissary & Exchange Retail Operations — 9 rule_ids, 20 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only; deleting this file
# leaves the declared behaviour identical.
# Money literals below were computed against the §1.3 formulas and constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allowance_provisional_vs_settled_diverge_when_clock_passes_promo_window
        grounds:
          - calculations.vendor_promotional_allowance
          - entities.Sale.fields.provisional_allowance_cents
          - entities.Sale.fields.settled_allowance_cents
          - entities.Sale.fields.allowance_variance_cents
          - state_machines.Sale.OPEN_to_TENDERED
        distinguishing_aspect: |
          The two variants of vendor_promotional_allowance are keyed on DIFFERENT
          instants over the same sale — PROVISIONAL tests the half-open promo
          window against Sale.business_date, SETTLED tests it against the tender
          instant — so with the clock advanced past promo_window_end between the
          line add and the tender the same lines yield 450 provisional and 0
          settled, and only the settled figure reaches the DIVIDEND fund.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, exchange_markup_bp 0, surcharge_rate_bp 500."
            - "One GENERAL_MERCHANDISE product at unit_cost_cents 1000."
            - "One ACTIVE DSD assortment for that (store, product) with promo_allowance_bp 1500 and promo window [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z)."
            - "One ACTIVE_DUTY patron with card_status VALID."
            - "One OPEN sale stamped business_date 2026-08-02T00:00:00Z carrying one line of quantity 3 (extended_cents 3000)."
            - "The logical clock has since been moved to 2026-08-07T00:00:00Z, i.e. after promo_window_end."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Bliss Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-DSD-001", name: "Sports Drink 12pk", category: "GENERAL_MERCHANDISE", unit_cost_cents: 1000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "A1", facings: 4, supply_mode: "DSD", vendor_name: "Sideline Beverage Co", promo_allowance_bp: 1500, promo_window_start: "2026-08-01T00:00:00Z", promo_window_end: "2026-08-05T00:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SGT A Reyes", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { line_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          assert:
            - "Sale.${sale_id}.provisional_allowance_cents == 450"
            - "Sale.${sale_id}.settled_allowance_cents == 0"
            - "Sale.${sale_id}.allowance_variance_cents == -450"
            - "Sale.${sale_id}.merchandise_cents == 3000"
            - "Sale.${sale_id}.surcharge_total_cents == 150"
            - "Sale.${sale_id}.total_due_cents == 3150"
            - "Store.${store_id}.dividend_fund_balance_cents == 0"
            - "Store.${store_id}.surcharge_fund_balance_cents == 150"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 1, and data[0].entry_type == SURCHARGE_COLLECTION with amount_cents == 150 — no ALLOWANCE_CREDIT entry was written"

      - name: patron_risk_rolling30d_and_last5_diverge_on_aged_restricted_sale
        grounds:
          - calculations.patron_resale_risk_score
          - entities.Patron.fields.resale_risk_score
          - entities.Patron.fields.recent_sales_risk_score
          - entities.Patron.fields.restricted_units_30d
        distinguishing_aspect: |
          This dual variant lives on a different entity domain and metric than
          the allowance pair — risk scoring on Patron, not money on Sale — and
          the two variants differ by FILTER KIND rather than by instant:
          ROLLING_30D filters the input set by age (dropping the 2026-06-15 sale
          when the clock reads 2026-08-02) while LAST_5_SALES filters by rank
          (keeping it), so the same patron scores 12 and 60 simultaneously.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500."
            - "One TOBACCO product, unit_cost_cents 500, resale_restricted true, quantity_limit_per_visit null."
            - "One ACTIVE WAREHOUSE assortment covering 2026-06-01 through 2026-12-31 (closed window)."
            - "One ACTIVE_DUTY patron, manual_strike_count 0."
            - "One TENDERED sale with business_date 2026-06-15T00:00:00Z carrying 4 restricted units."
            - "One OPEN sale with business_date 2026-08-02T00:00:00Z, still empty; the clock reads 2026-08-02T00:00:00Z so the 2026-06-15 sale is 48 days old."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Hood Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-TOB-010", name: "Cigarette Carton", category: "TOBACCO", unit_cost_cents: 500, resale_restricted: true }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "B2", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "CPL B Nunez", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_old_id: $.data.id }
            - call: "POST /sales/${sale_old_id}/lines"
              payload: { product_id: "${product_id}", quantity: 4 }
              as: StoreCashier
            - call: "POST /sales/${sale_old_id}/tender"
              payload: {}
              as: StoreCashier
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_new_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_new_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
          assert:
            - "Patron.${patron_id}.resale_risk_score == 12"
            - "Patron.${patron_id}.recent_sales_risk_score == 60"
            - "Patron.${patron_id}.restricted_units_30d == 1"
            - "Patron.${patron_id}.resale_watch_status == CLEAR"
            - "Patron.${patron_id}.card_status == VALID"
            - "Patron.${patron_id}.flagged_sale_count_30d == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: surcharge_rounded_per_line_then_summed_not_summed_then_rated
        grounds:
          - calculations.sale_surcharge_rollup
          - entities.SaleLine.fields.line_surcharge_cents
          - entities.Sale.fields.surcharge_total_cents
          - entities.Sale.fields.total_due_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER decides the cent total. Two
          lines each of extended_cents 1050 at 500 bp each round to 53
          (round_half_up(52.5)), so the pinned per-line-then-sum order yields
          surcharge_total_cents 106, while the forbidden sum-then-rate order
          would yield round_half_up(2100 * 500 / 10000) == 105.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, exchange_markup_bp 0."
            - "One GROCERY_STAPLE product at unit_cost_cents 350 with quantity_limit_per_visit null."
            - "One ACTIVE WAREHOUSE assortment covering 2026-08-01 through 2026-08-31."
            - "Logical clock at 2026-08-03T00:00:00Z."
            - "One OPEN sale already carrying one line of quantity 3 (extended_cents 1050, line_surcharge_cents 53)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Camp Lejeune Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-350", name: "Long Grain Rice 5lb", category: "GROCERY_STAPLE", unit_cost_cents: 350 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "C3", facings: 8, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "PFC C Ortiz", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { line_a_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { line_b_id: $.data.id }
          assert:
            - "SaleLine.${line_a_id}.extended_cents == 1050 and SaleLine.${line_a_id}.line_surcharge_cents == 53"
            - "SaleLine.${line_b_id}.extended_cents == 1050 and SaleLine.${line_b_id}.line_surcharge_cents == 53"
            - "Sale.${sale_id}.line_count == 2"
            - "Sale.${sale_id}.merchandise_cents == 2100"
            - "Sale.${sale_id}.markup_total_cents == 0"
            - "Sale.${sale_id}.surcharge_total_cents == 106"
            - "Sale.${sale_id}.tax_cents == 0"
            - "Sale.${sale_id}.total_due_cents == 2206"

      - name: contingency_tier_selected_from_request_amount_not_from_obligation
        grounds:
          - calculations.capital_contingency_obligation
          - entities.CapitalProject.fields.contingency_bp
          - entities.CapitalProject.fields.contingency_cents
          - entities.CapitalProject.fields.obligation_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order is
          pinned. requested_amount_cents 495000 sits just under TIER_1_CEILING
          500000, so the contingency-free amount selects TIER_1_BP 1000 and
          obligation_cents becomes 544500; re-reading the tier from the
          contingency-inclusive obligation (544500 >= 500000) would select 700 bp
          and produce 529650 instead.
        test_recipe:
          setup:
            - "One EXCHANGE / OVERSEAS store with an empty surcharge fund (fund_posture FROZEN)."
            - "No capital project exists yet."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Yokota Exchange", channel: "EXCHANGE", region: "OVERSEAS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Checkout lane rebuild", requested_amount_cents: 495000 }
              as: SurchargeFundController
              as_user_id: "sfc-002"
              captures: { project_id: $.data.id }
          assert:
            - "CapitalProject.${project_id}.contingency_bp == 1000"
            - "CapitalProject.${project_id}.contingency_cents == 49500"
            - "CapitalProject.${project_id}.obligation_cents == 544500"
            - "CapitalProject.${project_id}.state == DRAFT"
            - "CapitalProject.${project_id}.outlay_cents == null"
            - "Store.${store_id}.surcharge_obligated_cents == 0 — a DRAFT project reserves nothing"

      - name: shipping_allowance_nested_min_max_clamped_by_cap
        grounds:
          - calculations.special_order_shipping_allowance
          - entities.SpecialOrder.fields.billable_weight_kg
          - entities.SpecialOrder.fields.gross_ship_cents
          - entities.SpecialOrder.fields.patron_share_cents
          - entities.SpecialOrder.fields.shipping_allowance_cents
          - state_machines.SpecialOrder.SUBMITTED_to_OVERSEAS_SHIP_PENDING
        distinguishing_aspect: |
          Mode (a) — four interacting inputs (unit_weight_grams, quantity,
          region rate, PATRON_SHARE_BP) feeding a nested min/max. 6000 g x 10
          ceils to 60 kg, x 340 (DEPLOYED) gives 20400, the 2500 bp patron share
          is 5100, and the residual 15300 is clamped by ALLOWANCE_CAP_CENTS to
          15000 — the outer min binds, which no tiered-rate formula exercises.
        test_recipe:
          setup:
            - "One EXCHANGE / DEPLOYED store (ship rate 340 cents per kg)."
            - "One GENERAL_MERCHANDISE product at unit_weight_grams 6000."
            - "One ACTIVE WAREHOUSE assortment for that (store, product) covering 2026-08-01 through 2026-08-31."
            - "One ACTIVE_DUTY patron with card_status VALID (eligible in a DEPLOYED region and at an EXCHANGE)."
            - "One SpecialOrder in state SUBMITTED for quantity 10, route null, shipping money fields 0."
            - "Store.shipping_allowance_committed_cents == 0."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Camp Arifjan Exchange", channel: "EXCHANGE", region: "DEPLOYED" }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GEN-600", name: "Field Locker", category: "GENERAL_MERCHANDISE", unit_cost_cents: 8000, unit_weight_grams: 6000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "D4", facings: 2, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SSG D Pike", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: SystemOperator
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 10 }
              as: StoreCashier
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "OVERSEAS_SHIP" }
              as: StoreCashier
          assert:
            - "SpecialOrder.${order_id}.billable_weight_kg == 60"
            - "SpecialOrder.${order_id}.gross_ship_cents == 20400"
            - "SpecialOrder.${order_id}.patron_share_cents == 5100"
            - "SpecialOrder.${order_id}.shipping_allowance_cents == 15000"
            - "SpecialOrder.${order_id}.state == OVERSEAS_SHIP_PENDING and route == OVERSEAS_SHIP"
            - "Store.${store_id}.shipping_allowance_committed_cents == 15000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: capital_project_revision_cycle_increments_revision_count
        grounds:
          - state_machines.CapitalProject.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.CapitalProject.RETURNED_FOR_REVISION_to_SUBMITTED
          - entities.CapitalProject.fields.revision_count
          - entities.CapitalProject.fields.submitted_by_user_id
        distinguishing_aspect: |
          CapitalProject is CYCLIC: DRAFT -> SUBMITTED -> RETURNED_FOR_REVISION ->
          SUBMITTED re-enters a state it already left, and only the re-entry
          increments revision_count (1 after one round trip, not 2), while RETURN
          clears submitted_by_user_id and the re-submit re-stamps it.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store with an empty surcharge fund."
            - "One CapitalProject with requested_amount_cents 100000, obligation_cents 110000, first submitted by X-User-ID sfc-001 and then RETURNED by MwrBoardOfficer mwr-001, so state == RETURNED_FOR_REVISION, revision_count == 0 and submitted_by_user_id == null."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Norfolk Exchange", channel: "EXCHANGE", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Deli counter refresh", requested_amount_cents: 100000 }
              as: SurchargeFundController
              as_user_id: "sfc-001"
              captures: { project_id: $.data.id }
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-001"
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "RETURN", note: "Scope statement incomplete" }
              as: MwrBoardOfficer
              as_user_id: "mwr-001"
          trigger:
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-001"
          assert:
            - "CapitalProject.${project_id}.state == SUBMITTED"
            - "CapitalProject.${project_id}.revision_count == 1"
            - "CapitalProject.${project_id}.submitted_by_user_id == sfc-001"
            - "CapitalProject.${project_id}.decided_by_user_id == mwr-001"
            - "CapitalProject.${project_id}.obligation_cents == 110000 and contingency_cents == 10000 — the cycle never re-runs the contingency calculation"
            - "Store.${store_id}.surcharge_obligated_cents == 0"

      - name: special_order_fork_join_local_fill_vs_overseas_ship
        grounds:
          - state_machines.SpecialOrder.SUBMITTED_to_LOCAL_FILL_PENDING
          - state_machines.SpecialOrder.SUBMITTED_to_OVERSEAS_SHIP_PENDING
          - state_machines.SpecialOrder.LOCAL_FILL_PENDING_to_FULFILLED
          - state_machines.SpecialOrder.OVERSEAS_SHIP_PENDING_to_FULFILLED
          - entities.Store.fields.shipping_allowance_committed_cents
        distinguishing_aspect: |
          SpecialOrder — a different entity from CapitalProject — is FORK-JOIN:
          one trigger (route) forks into two states with divergent side-effect
          sets (LOCAL_FILL commits 0, OVERSEAS_SHIP commits 1260 to the store),
          and the close-period checkpoint joins both branches at FULFILLED while
          leaving the committed total at 1260.
        test_recipe:
          setup:
            - "One EXCHANGE / OVERSEAS store (ship rate 210 cents per kg), shipping_allowance_committed_cents 0."
            - "One GENERAL_MERCHANDISE product at unit_weight_grams 900."
            - "One ACTIVE WAREHOUSE assortment for that (store, product) covering 2026-08-01 through 2026-08-31."
            - "One ACTIVE_DUTY patron with card_status VALID."
            - "Two SpecialOrders of quantity 8 for that (store, product), both in state SUBMITTED with route null."
            - "Logical clock at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Kadena Exchange", channel: "EXCHANGE", region: "OVERSEAS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GEN-900", name: "Rice Cooker 5.5 cup", category: "GENERAL_MERCHANDISE", unit_cost_cents: 4000, unit_weight_grams: 900 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "E5", facings: 3, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "PO2 E Nakamura", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemOperator
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 8 }
              as: StoreCashier
              captures: { order_local_id: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 8 }
              as: StoreCashier
              captures: { order_ship_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${order_local_id}/route"
              payload: { route: "LOCAL_FILL" }
              as: StoreCashier
            - call: "POST /special-orders/${order_ship_id}/route"
              payload: { route: "OVERSEAS_SHIP" }
              as: StoreCashier
            - call: "POST /stores/${store_id}/close-period"
              payload: {}
              as: SurchargeFundController
          assert:
            - "SpecialOrder.${order_local_id}.route == LOCAL_FILL, billable_weight_kg == 8, gross_ship_cents == 0, patron_share_cents == 0, shipping_allowance_cents == 0"
            - "SpecialOrder.${order_ship_id}.route == OVERSEAS_SHIP, billable_weight_kg == 8, gross_ship_cents == 1680, patron_share_cents == 420, shipping_allowance_cents == 1260"
            - "SpecialOrder.${order_local_id}.state == FULFILLED and SpecialOrder.${order_ship_id}.state == FULFILLED — both branches joined"
            - "Store.${store_id}.shipping_allowance_committed_cents == 1260 — the join does not release the commitment"
            - "Store.${store_id}.period_close_index == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sponsor_suspension_cascades_three_hops_to_open_sale_flag
        grounds:
          - state_machines.Patron.VALID_to_SUSPENDED
          - state_machines.ShopperDelegation.ACTIVE_to_SUSPENDED_BY_SPONSOR
          - state_machines.Sale.CLEARED_to_FLAGGED
          - entities.Patron.fields.suspension_reason
        distinguishing_aspect: |
          Depth 3 from the card-status trigger, and each hop is caused by the
          previous one, not by the trigger: suspending the SPONSOR suspends the
          DEPENDENT (hop 1); the dependent's suspension suspends the delegation
          in which the dependent is the DELEGATE (hop 2); that delegation's
          suspension flags the OPEN sale acting under it (hop 3). The
          delegation's own sponsor patron is never touched, which is what
          separates a transitive chain from a fan-out.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with an ACTIVE WAREHOUSE assortment for a GROCERY_STAPLE product covering 2026-08-01 through 2026-08-31."
            - "Patron SPONSOR (ACTIVE_DUTY, card VALID); Patron DEPENDENT whose sponsor_patron_id is SPONSOR (card VALID); Patron OTHER (ACTIVE_DUTY, card VALID)."
            - "One ACTIVE ShopperDelegation granted by OTHER to DEPENDENT for [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with per_sale_spend_cap_cents 50000."
            - "One OPEN sale at business_date 2026-08-06T00:00:00Z with patron_id OTHER and acting_delegation_id that delegation, carrying one line of quantity 2, compliance_state CLEARED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Bragg Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-200", name: "Toasted Oat Cereal", category: "GROCERY_STAPLE", unit_cost_cents: 400 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "F6", facings: 5, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "MSG F Lane", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Dana Lane", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { dependent_id: $.data.id, dependent_v0: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "SFC G Moss", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { other_sponsor_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: SystemOperator
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${other_sponsor_id}", delegate_patron_id: "${dependent_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 50000, expected_delegate_patron_version: "${dependent_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${other_sponsor_id}", acting_delegation_id: "${delegation_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
          trigger:
            - call: "POST /patrons/${sponsor_id}/card-status"
              payload: { action: "SUSPEND" }
              as: ComplianceOfficer
          assert:
            - "Patron.${sponsor_id}.card_status == SUSPENDED and Patron.${sponsor_id}.suspension_reason == ADMIN_ACTION"
            - "Patron.${dependent_id}.card_status == SUSPENDED and Patron.${dependent_id}.suspension_reason == SPONSOR_SUSPENDED (hop 1)"
            - "ShopperDelegation.${delegation_id}.status == SUSPENDED_BY_SPONSOR (hop 2)"
            - "Sale.${sale_id}.compliance_state == FLAGGED and Sale.${sale_id}.tender_state == OPEN (hop 3)"
            - "Patron.${other_sponsor_id}.card_status == VALID — the delegation's sponsor is outside the chain"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"

      - name: tender_cascades_four_hops_into_awaiting_funds_project_approval
        grounds:
          - state_machines.Sale.OPEN_to_TENDERED
          - state_machines.CapitalProject.AWAITING_FUNDS_to_APPROVED
          - entities.Store.fields.surcharge_fund_balance_cents
          - entities.Store.fields.fund_posture
          - entities.Store.fields.surcharge_obligated_cents
          - calculations.sale_surcharge_rollup
        distinguishing_aspect: |
          Depth 4 from a different triggering transition (tender, not card
          status): the SURCHARGE_COLLECTION ledger entry moves the store balance
          (hop 1), the balance re-derives fund_posture to UNRESTRICTED (hop 2),
          the new posture auto-approves the parked AWAITING_FUNDS project and
          books its 440000 obligation (hop 3), and the booking re-derives posture
          once more (hop 4, still UNRESTRICTED at 560000 available).
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 1000, all fund balances 0, fund_posture FROZEN."
            - "One GROCERY_STAPLE product at unit_cost_cents 100000, quantity_limit_per_visit null."
            - "One ACTIVE WAREHOUSE assortment covering 2026-08-01 through 2026-08-31."
            - "One CapitalProject with requested_amount_cents 400000 (obligation_cents 440000) submitted by sfc-010 and APPROVE-decided by mwr-010 while the posture was FROZEN, so it parked in AWAITING_FUNDS with no obligation booked."
            - "One ACTIVE_DUTY patron with an OPEN sale at business_date 2026-08-07T00:00:00Z carrying one line of quantity 100 (extended_cents 10000000)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Pearl Harbor Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 1000 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-1000", name: "Bulk Coffee Case", category: "GROCERY_STAPLE", unit_cost_cents: 100000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "G7", facings: 10, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "CPO H Kalani", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Walk-in freezer replacement", requested_amount_cents: 400000 }
              as: SurchargeFundController
              as_user_id: "sfc-010"
              captures: { project_id: $.data.id }
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-010"
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "APPROVE" }
              as: MwrBoardOfficer
              as_user_id: "mwr-010"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 100 }
              as: StoreCashier
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          assert:
            - "Sale.${sale_id}.merchandise_cents == 10000000, surcharge_total_cents == 1000000, total_due_cents == 11000000"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 1 with data[0].entry_type == SURCHARGE_COLLECTION, amount_cents == 1000000, balance_after_cents == 1000000 (hop 1)"
            - "Store.${store_id}.surcharge_fund_balance_cents == 1000000 (hop 1)"
            - "CapitalProject.${project_id}.state == APPROVED (hop 3)"
            - "Store.${store_id}.surcharge_obligated_cents == 440000 (hop 3)"
            - "Store.${store_id}.fund_posture == UNRESTRICTED — available 560000 (hop 4)"
            - "CapitalProject.${project_id}.contingency_bp == 1000, contingency_cents == 40000, obligation_cents == 440000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: quantity_limit_safety_outranks_assortment_referential_check
        grounds:
          - validations[priority=34]
          - validations[priority=38]
          - errors[ERR_QUANTITY_LIMIT_EXCEEDED]
          - errors[ERR_ITEM_NOT_IN_ASSORTMENT]
        distinguishing_aspect: |
          Category pair business_safety (priority 34) versus business_referential
          (priority 38): the same POST /sales/{id}/lines call violates BOTH — the
          aggregate quantity would reach 4 against a limit of 2, and the governing
          assortment was retired after the first line — and the response must be
          ERR_QUANTITY_LIMIT_EXCEEDED, never ERR_ITEM_NOT_IN_ASSORTMENT.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500."
            - "One INFANT_FORMULA product at unit_cost_cents 350 with quantity_limit_per_visit 2 and resale_restricted false."
            - "One assortment for that (store, product) that has been RETIRED, so no ACTIVE assortment covers the sale's business_date any more."
            - "One ACTIVE_DUTY patron, card VALID, resale_watch_status CLEAR."
            - "One OPEN sale at business_date 2026-08-08T00:00:00Z already carrying one line of quantity 2 (merchandise_cents 700, surcharge_total_cents 35)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Quantico Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-FOR-002", name: "Infant Formula 24oz", category: "INFANT_FORMULA", unit_cost_cents: 350, resale_restricted: false, quantity_limit_per_visit: 2 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "H8", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "LCPL I Vega", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
              captures: { line_a_id: $.data.id }
            - call: "POST /assortments/${assortment_id}/retire"
              payload: {}
              as: AssortmentPlanner
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_QUANTITY_LIMIT_EXCEEDED"
            - "data.error_id != ERR_ITEM_NOT_IN_ASSORTMENT — priority 34 outranks priority 38"
            - "Sale.${sale_id}.line_count == 1"
            - "Sale.${sale_id}.merchandise_cents == 700 and surcharge_total_cents == 35 and total_due_cents == 735"
            - "Assortment.${assortment_id}.status == RETIRED — the referential violation really was present"

      - name: project_state_check_outranks_outlay_ceiling_on_close
        grounds:
          - validations[priority=22]
          - validations[priority=46]
          - errors[ERR_PROJECT_NOT_APPROVED]
          - errors[ERR_OUTLAY_EXCEEDS_OBLIGATION]
        distinguishing_aspect: |
          A different category pair than the quantity/assortment conflict: state
          (priority 22) versus business_fiscal (priority 46). Closing a DRAFT
          project with outlay_cents 200000 against obligation_cents 110000
          violates both, and the answer must be ERR_PROJECT_NOT_APPROVED.
        test_recipe:
          setup:
            - "One EXCHANGE / OVERSEAS store with an empty surcharge fund."
            - "One CapitalProject in state DRAFT, never submitted, requested_amount_cents 100000 and obligation_cents 110000, submitted_by_user_id null."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Rota Exchange", channel: "EXCHANGE", region: "OVERSEAS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Food court HVAC", requested_amount_cents: 100000 }
              as: SurchargeFundController
              as_user_id: "sfc-020"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /capital-projects/${project_id}/close"
              payload: { outlay_cents: 200000 }
              as: SurchargeFundController
              as_user_id: "sfc-021"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_PROJECT_NOT_APPROVED"
            - "data.error_id != ERR_OUTLAY_EXCEEDS_OBLIGATION — priority 22 outranks priority 46"
            - "CapitalProject.${project_id}.obligation_cents == 110000, so 200000 genuinely exceeded the ceiling"
            - "CapitalProject.${project_id}.state == DRAFT, outlay_cents == null, closed_by_user_id == null"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: shelf_facings_exactly_at_capacity_is_accepted
        grounds:
          - validations[priority=41]
          - entities.Store.fields.shelf_block_capacity_facings
          - entities.Assortment.fields.facings
          - concurrency_rules[assortment-create-stale-store]
        distinguishing_aspect: |
          Metric: aggregate shelf facings on a (store, shelf_block) resource,
          reached through POST /assortments. 16 existing plus 8 incoming equals
          exactly shelf_block_capacity_facings 24, and because the rule is `<=`
          the create must succeed with 201 — one more facing would fail.
        test_recipe:
          setup:
            - "One COMMISSARY / OVERSEAS store with shelf_block_capacity_facings 24."
            - "Two GROCERY_STAPLE products."
            - "One ACTIVE assortment on shelf_block J9 with facings 16 over the closed window 2026-08-01 through 2026-08-15."
            - "The store's current version has been re-read after that create, so the OCC input is fresh."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ansbach Commissary", channel: "COMMISSARY", region: "OVERSEAS", surcharge_rate_bp: 500, shelf_block_capacity_facings: 24 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-A01", name: "Wheat Flour 5lb", category: "GROCERY_STAPLE", unit_cost_cents: 300 }
              as: AssortmentPlanner
              captures: { product_a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-B01", name: "Granulated Sugar 4lb", category: "GROCERY_STAPLE", unit_cost_cents: 280 }
              as: AssortmentPlanner
              captures: { product_b_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_a_id}", shelf_block: "J9", facings: 16, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-15T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_a_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v1: $.data.version }
          trigger:
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_b_id}", shelf_block: "J9", facings: 8, supply_mode: "WAREHOUSE", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", expected_store_version: "${store_v1}" }
              as: AssortmentPlanner
              captures: { assortment_b_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Assortment.${assortment_b_id}.status == ACTIVE and facings == 8"
            - "Assortment.${assortment_a_id}.status == ACTIVE and facings == 16 — the aggregate over the overlapping instants is exactly 24"
            - "GET /assortments with store_id == ${store_id} and shelf_block == J9 returns total_count == 2"
            - "Store.${store_id}.version is exactly one greater than ${store_v1}"

      - name: watch_threshold_at_exactly_sixty_moves_patron_to_watch
        grounds:
          - calculations.patron_resale_risk_score
          - state_machines.Patron.CLEAR_to_WATCH
          - entities.Patron.fields.resale_watch_status
          - entities.SaleLine.fields.restricted_units
        distinguishing_aspect: |
          A different metric on a different endpoint: the weighted resale risk
          score reached through POST /sales/{id}/lines. Five restricted units at
          RESTRICTED_UNIT_WEIGHT 12 give exactly 60 == WATCH_THRESHOLD, and
          because the threshold is inclusive the watch axis must move to WATCH
          while the card axis stays VALID (60 < CARD_SUSPEND_THRESHOLD 80).
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500."
            - "One ALCOHOL product at unit_cost_cents 900 with resale_restricted true and quantity_limit_per_visit null."
            - "One ACTIVE WAREHOUSE assortment covering 2026-08-01 through 2026-08-31."
            - "One ACTIVE_DUTY patron with manual_strike_count 0, resale_risk_score 0, resale_watch_status CLEAR and card_status VALID."
            - "One empty OPEN sale at business_date 2026-08-09T00:00:00Z."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Schofield Barracks Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-ALC-005", name: "Table Wine 6pk", category: "ALCOHOL", unit_cost_cents: 900, resale_restricted: true }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "K1", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SPC J Ruiz", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 5 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          assert:
            - "SaleLine.${line_id}.restricted_units == 5 and extended_cents == 4500 and line_surcharge_cents == 225"
            - "Patron.${patron_id}.resale_risk_score == 60"
            - "Patron.${patron_id}.resale_watch_status == WATCH"
            - "Patron.${patron_id}.recent_sales_risk_score == 60 and card_status == VALID"
            - "Patron.${patron_id}.restricted_units_30d == 5"
            - "Sale.${sale_id}.merchandise_cents == 4500 and surcharge_total_cents == 225"

      - name: dividend_waterfall_with_no_eligible_programs_retains_balance
        grounds:
          - calculations.dividend_waterfall_distribution
          - entities.Store.fields.dividend_fund_balance_cents
          - entities.MwrProgram.fields.status
          - entities.MwrProgram.fields.ytd_funded_cents
        distinguishing_aspect: |
          The empty-collection edge on a third endpoint, POST
          /stores/{id}/close-period: the only MWR program is SUSPENDED so the
          waterfall's candidate set is empty, and the 300-cent dividend balance
          must simply stay in the fund — zero DIVIDEND_TRANSFER entries, no
          error, and period_close_index still advances.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, surcharge_rate_bp 500, exchange_markup_bp 0."
            - "One ACTIVE DSD assortment with promo_allowance_bp 1500 over the promo window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
            - "One TENDERED sale of 2 units at unit_cost_cents 1000, settled inside the promo window, so an ALLOWANCE_CREDIT of 300 sits in the DIVIDEND fund and a SURCHARGE_COLLECTION of 100 in the SURCHARGE fund."
            - "One MwrProgram for the store with priority_rank 1, funding_ceiling_cents 500000 and status SUSPENDED."
            - "Store.dividend_fund_balance_cents == 300, period_close_index == 0."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Lackland Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-DSD-020", name: "Energy Bar Box", category: "GENERAL_MERCHANDISE", unit_cost_cents: 1000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "L1", facings: 4, supply_mode: "DSD", vendor_name: "Trailhead Foods", promo_allowance_bp: 1500, promo_window_start: "2026-08-01T00:00:00Z", promo_window_end: "2026-09-01T00:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /mwr-programs"
              payload: { store_id: "${store_id}", name: "Youth Sports League", priority_rank: 1, funding_ceiling_cents: 500000, status: "SUSPENDED" }
              as: MwrBoardOfficer
              captures: { program_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "A1C K Doyle", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
