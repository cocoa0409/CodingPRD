        excluded_because:
          difficulty_instance: order_payment_and_fulfillment_dimensions_advance_independently
          rationale: "The §1.8 instance already drives payment_status and fulfillment_status through every combination and proves SHIP is gated on payment while DELIVER is not."

      - name: enrollment_rollup_is_derived_from_its_three_dimensions
        claim_type: compound shape
        grounds: ["complexity_profile.state_machine_shape", "state_machines.EnrollmentApplication.transitions"]
        excluded_because:
          difficulty_instance: enrollment_three_dimensions_advance_independently_with_identity_retry_cycle
          rationale: "The §1.8 instance re-derives the READY_FOR_APPROVAL rollup after each dimension write in every order, which is exactly the compound-shape claim."

      - name: compliance_case_loops_through_appeal_and_re_review
        claim_type: cyclic shape
        grounds: ["complexity_profile.state_machine_shape", "state_machines.ComplianceCase.transitions"]
        excluded_because:
          difficulty_instance: compliance_case_sanction_appeal_review_cycle_returns_consultant_to_active
          rationale: "The §1.8 instance walks OPEN to UNDER_REVIEW to SANCTIONED to APPEALED and back to UNDER_REVIEW, including the loop-termination guard on appeal_count."

      - name: run_approval_is_guarded_by_a_foreign_entity_state
        claim_type: guarded transitions
        grounds: ["complexity_profile.state_machine_shape", "state_machines.CommissionRun.transitions"]
        excluded_because:
          difficulty_instance: run_approval_blocked_while_a_downline_earner_is_suspended
          rationale: "The §1.8 instance proves CALCULATED to APPROVED is legal only while no earner on the run holds Consultant.status SUSPENDED."

      - name: termination_cascades_down_the_genealogy
        claim_type: Cascade down
        grounds: ["state_machines.Consultant.transitions", "entities.Consultant"]
        excluded_because:
          difficulty_instance: root_termination_cascades_sponsor_rewrite_to_upline_paths_to_group_volume
          rationale: "The §1.8 instance verifies sponsor rewrite, whole-subtree upline_path and genealogy_depth recomputation and group-volume repair at depth 3."

      - name: buyback_refund_adjusts_foreign_entities
        claim_type: Cross-entity
        grounds: ["state_machines.BuybackRequest.transitions", "entities.ProductOrder", "entities.PeriodQualification"]
        excluded_because:
          difficulty_instance: buyback_refund_cascades_order_to_qualification_to_period_to_run_to_disclosure
          rationale: "The §1.8 instance follows one refund across five entities and asserts the state and fields of each."

      - name: refund_only_touches_non_terminal_dependents
        claim_type: Conditional cascade
        grounds: ["state_machines.BuybackRequest.transitions", "state_machines.IncomeDisclosureStatement.transitions"]
        excluded_because:
          difficulty_instance: buyback_refund_cascades_order_to_qualification_to_period_to_run_to_disclosure
          rationale: "The same §1.8 instance shows the cascade supersedes only the PUBLISHED disclosure and flags only the PAID run, leaving already-terminal rows alone."

      - name: reversal_reconciles_the_consultant_ledger
        claim_type: Ledger sync
        grounds: ["state_machines.CommissionRun.transitions", "entities.Consultant"]
        excluded_because:
          difficulty_instance: reversal_conserves_commission_cents_between_lifetime_paid_and_clawback
          rationale: "The §1.8 instance reconciles lifetime_commission_paid_cents, clawback_balance_cents and the run's reversed_total_cents before and after the reversal."

      - name: reversal_undoes_every_original_side_effect
        claim_type: Compensation
        grounds: ["state_machines.CommissionRun.transitions", "entities.CommissionStatement"]
        excluded_because:
          difficulty_instance: reversal_conserves_commission_cents_between_lifetime_paid_and_clawback
          rationale: "The same §1.8 instance asserts statement VOIDED, carry_forward release, payout_hold and the zero-drift identity, which is the compensation claim in full."

