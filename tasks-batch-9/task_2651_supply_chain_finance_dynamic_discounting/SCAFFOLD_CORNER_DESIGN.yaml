            - "the refused call wrote nothing: GET /discount-offers with invoice_id=${invoice_id} returns meta.total_count == 1 immediately after the 412, and Invoice.${invoice_id}.version is still v_after_first"
            - "the replay with the refreshed version returns HTTP 201 with DiscountOffer.${offer_2}.status == NAMED and offered_apr_bps == 850"
            - "offer_1_status == SUPERSEDED and Invoice.${invoice_id}.version == v_before + 2"

      - name: stale_expected_offer_version_on_payment_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.payment-create-stale-offer
          - errors.ERR_STALE_OFFER_VERSION
          - endpoints[POST /early-payments]
          - state_machines.DiscountOffer[NAMED -> ACCEPTED]
        distinguishing_aspect: |
          The treasury client reads the offer version at naming time and only reserves funds after
          the buyer accepts, so the version it holds is one behind. The acceptance state check passes
          (the offer really is ACCEPTED), which means the request can only be stopped by the OCC
          check - proving the OCC field is compared against the offer's live version rather than
          being ignored once the state precondition is satisfied. No capital is encumbered by the
          refusal.
