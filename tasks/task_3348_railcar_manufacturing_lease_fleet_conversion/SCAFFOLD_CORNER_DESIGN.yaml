        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-200
          car_class: BOXCAR
          build_hours: 30
          regulatory_life_years: 25
          line_count_family: LINE-B
        as: ProductionPlanner
        captures:
          ct_box_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-210
          component_class: WHEELSET
          unit_cost_cents: 18000
          lead_time_days: 30
          on_hand_qty: 40
        as: SupplyChainCoordinator
        captures:
          ws210_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-210
          component_class: CASTING
          unit_cost_cents: 40000
          lead_time_days: 45
          on_hand_qty: 20
        as: SupplyChainCoordinator
        captures:
          cs210_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-210
          component_class: COATING
          unit_cost_cents: 12500
          lead_time_days: 20
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          ct210_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${ws210_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${cs210_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${ct210_id}
          qty_per_car: 3
        as: ProductionPlanner
      - call: POST /api/v1/lessees
        payload:
          legal_name: Capital Rail Co
          credit_tier: A
          utilization_threshold_pct: 70
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 5000
