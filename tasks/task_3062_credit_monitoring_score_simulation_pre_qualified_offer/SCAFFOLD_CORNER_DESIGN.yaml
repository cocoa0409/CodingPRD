              as: BureauConnector
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - call: "POST /credit/consumers/${cl_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${cl_id}"
              captures: { cl_dec: $.data.id }
            - call: "POST /credit/pre-qualification-decisions/${cl_dec}/qualify"
              payload: {}
              as: Referee
            - call: "POST /credit/consumers/${cl_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/consumers/${cl_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "corner-close-rollup" }
              as: PlatformAdmin
            - call: "POST /credit/pre-qualification-decisions/${cl_dec}/present"
              payload: { channel: "WEB" }
              as: Consumer
              as_user_id: "${cl_id}"
              captures: { cl_offer: $.data.id }
            - call: "POST /credit/offers/${cl_offer}/render"
              payload: {}
              as: Consumer
              as_user_id: "${cl_id}"
            - call: "GET /credit/consumers/${cl_id}"
              payload: {}
