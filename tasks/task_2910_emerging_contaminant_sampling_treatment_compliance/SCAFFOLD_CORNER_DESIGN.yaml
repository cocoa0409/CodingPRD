              as: SamplingTechnician
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q1", collected_at: "2026-02-13T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-B2" }
              as: SamplingTechnician
              captures: { s2_id: "$.data.id" }
            - call: "POST /samples/${s2_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-B3" }
              as: SamplingTechnician
              captures: { s3_id: "$.data.id" }
            - call: "POST /samples/${s3_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
          trigger:
            - call: "POST /samples/${s1_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 2.00 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /samples/${s2_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 2.00 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /samples/${s3_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 2.00 }
