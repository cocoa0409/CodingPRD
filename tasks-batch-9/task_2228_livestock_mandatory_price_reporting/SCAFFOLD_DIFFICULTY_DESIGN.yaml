              as: ProgramAdmin
              captures: { plant_hi: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_fl}", plant_code: "EST-904", species: "CATTLE", annual_head_history: { "2021": 125000, "2022": 125000, "2023": 125000, "2024": 125000, "2025": 125002 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 1000 }
              as: ProgramAdmin
              captures: { plant_fl: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_lo}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_lo: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_eq}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_eq: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_hi}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_hi: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_fl}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_fl: $.data.id }
          trigger:
