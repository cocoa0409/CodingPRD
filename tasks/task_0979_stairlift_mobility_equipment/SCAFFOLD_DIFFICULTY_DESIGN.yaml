        distinguishing_aspect: |
          Numeric threshold boundary: Agreement transitions to FUNDED exactly when
          sum(approved_cents) >= list_price_cents. At list=502000: 501999 → still
          PENDING_FUNDING; 502000 → FUNDED. Endpoint: POST /funding-applications/{id}/decide.
