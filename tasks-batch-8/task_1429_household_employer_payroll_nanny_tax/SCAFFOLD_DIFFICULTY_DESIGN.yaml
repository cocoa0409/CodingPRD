  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: timesheet_approve_requires_worker_active
        grounds:
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Timesheet -> DomesticWorker: approval of a SUBMITTED
          timesheet for a worker still in CLASSIFIED (never activated) is
          rejected with ERR_INVALID_STATE even though the timesheet's own
          from-state is valid.
        test_recipe:
          setup:
            - "Employer AA (NEW_HIRE registration not even required), worker classified EMPLOYEE, status CLASSIFIED (activate never called)"
            - "Agreement ACTIVE from 2026-01-01; timesheet 2026-02-02..2026-02-09 (1 x 480) SUBMITTED"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam X", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Xena X", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-02-02", period_end: "2026-02-09", entries: [ { work_date: "2026-02-02", worked_minutes: 480 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}" }
          trigger:
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /household-payroll/timesheets/${ts_id}", as: PayrollAdmin, captures: { ts_st: "$.data.status" } }
          assert:
            - "approve fails with ERR_INVALID_STATE because DomesticWorker.status == CLASSIFIED (not ACTIVE)"
            - "Timesheet.status remains SUBMITTED (no partial side effects)"
      - name: year_end_finalize_requires_accepted_filings
        grounds:
          - state_machines.YearEndPackage.DRAFT_to_FINALIZED
          - errors[ERR_FILINGS_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair YearEndPackage -> QuarterlyFiling (different pair from
          the timesheet/worker instance): finalize of a DRAFT package fails
          with ERR_FILINGS_INCOMPLETE when the four quarterly filings do not
          all exist in ACCEPTED.
        test_recipe:
          setup:
            - "Employer AA exists; no quarterly filings created at all"
            - "YearEndPackage for tax_year 2026 created (DRAFT)"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Y", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /household-payroll/employers/${e_id}/year-end-packages", payload: { tax_year: 2026 }, as: PayrollAdmin, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/year-end-packages/${p_id}/finalize", as: ComplianceOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "finalize returns ERR_FILINGS_INCOMPLETE"
            - "YearEndPackage.status remains DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: timesheet_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.Timesheet.fields.period_end
          - errors[ERR_TIMESHEET_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the Timesheet resource: a period
          starting exactly at another's exclusive end is ADJACENT and allowed;
          one starting a day earlier collides. Adjacent-allowed +
          overlap-rejected on the same worker.
        test_recipe:
          setup:
            - "Employer AA, worker ACTIVE (agreement from 2026-01-01)"
            - "Timesheet T1 [2026-01-05, 2026-01-12) created"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Z", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Zoe Z", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 480 } ] }, as: Worker, as_user_id: "${w_id}", captures: { t1_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-12", period_end: "2026-01-19", entries: [ { work_date: "2026-01-12", worked_minutes: 480 } ] }, as: Worker, as_user_id: "${w_id}", captures: { t2_id: "$.data.id" } }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-11", period_end: "2026-01-18", entries: [ { work_date: "2026-01-11", worked_minutes: 480 } ] }, as: Worker, as_user_id: "${w_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "T2 [01-12, 01-19) succeeds with 201: start == T1.period_end is adjacency under half-open semantics"
            - "T3 [01-11, 01-18) fails with ERR_TIMESHEET_OVERLAP: it contains 01-11 which lies inside T1's [01-05, 01-12)"
      - name: leave_closed_interval_adjacency
        grounds:
          - validations[priority=8]
          - entities.LeaveRequest.fields.end_date
          - errors[ERR_LEAVE_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the LeaveRequest resource (different
          entity and different interval arithmetic from the half-open
          timesheet rule): back-to-back leave (other.end + 1 day == start) is
          allowed, but sharing a single calendar day collides.
        test_recipe:
          setup:
            - "Employer AA, worker ACTIVE; two approved timesheets of 2700 minutes each -> accrued_leave_minutes 180"
            - "L1 [2026-03-02, 2026-03-03] 60 min APPROVED (used 60)"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam W", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
