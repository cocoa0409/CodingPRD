# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3085_endorsement_based_zero_interest_microloan_crowdfunding
#
# Breadth probe: every testable claim §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners covered
# by §1.8 appear as excluded_because stubs with no test_recipe.
# Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: borrower_register_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Borrower
          - endpoints.POST_/borrowers
        distinguishing_aspect: "Registering with only required fields returns 201 with status REGISTERED, social_underwriting_score 0, underwriting_variant NONE, counters 0, restricted_since null, and system-stamped id/created_at/updated_at/version=1."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /borrowers"
              payload: { legal_name: "Ana Ruiz", business_name: "Ruiz Bakery", email: "ana@example.com", business_tenure_months: 24 }
              as: Anonymous
              captures: { borrower_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Borrower.${borrower_id}.status == REGISTERED and prior_repaid_loans_count == 0 (default applied)"
            - "Borrower.${borrower_id}.social_underwriting_score == 0 and underwriting_variant == NONE"
            - "Borrower.${borrower_id}.version == 1 and id/created_at/updated_at are non-null"

      - name: lender_register_and_get_round_trip
        claim_type: Retrieval
        grounds:
          - entities.Lender
          - endpoints.GET_/lenders/{id}
        distinguishing_aspect: "A registered lender round-trips through GET with lending_balance_cents 0, total_deposited_cents 0, lifetime_lent_cents 0, lifetime_repaid_cents 0."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lenders"
              payload: { display_name: "Ola P", email: "op@example.com" }
              as: Anonymous
              captures: { lender_id: $.data.id }
          trigger:
            - call: "GET /lenders/${lender_id}"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
          assert:
            - "Lender.${lender_id}.lending_balance_cents == 0 and total_deposited_cents == 0"
            - "Lender.${lender_id}.lifetime_lent_cents == 0 and lifetime_repaid_cents == 0"

      - name: loan_applications_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/loan-applications
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two applications, limit=1 returns one row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Two borrowers each with one DRAFT application."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "P1", business_name: "B1", email: "p1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "P2", business_name: "B2", email: "p2@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b2: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 3, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b2}", requested_amount_cents: 100000, term_months: 3, business_purpose: "y" }
              as: Borrower
              as_user_id: "${b2}"
          trigger:
            - call: "GET /loan-applications"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response data has 1 row, total_count == 2, has_more == true"

      - name: get_missing_borrower_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/borrowers/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /borrowers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND and http status 404"

      - name: application_missing_term_months_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/loan-applications
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /loan-applications without term_months returns 400 ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. One borrower."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "Q1", business_name: "B3", email: "q1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST and http status 400"

      - name: term_months_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LoanApplication.fields.term_months
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "term_months 2 (below minimum 3) and 37 (above maximum 36) are both rejected with ERR_INVALID_REQUEST; 3 and 36 are accepted."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. One borrower."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "R1", business_name: "B4", email: "r1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 2, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { err_low: $.data.error_id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 37, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { err_high: $.data.error_id }
          assert:
            - "err_low == ERR_INVALID_REQUEST and err_high == ERR_INVALID_REQUEST"

      - name: computed_fields_ignore_client_input
        grounds:
          - entities.LoanApplication.fields.private_total_cents
          - endpoints.POST_/loan-applications
        claim_type: Computed Fields
        distinguishing_aspect: "Client-supplied private_total_cents / distinct_endorser_count / funded_total_cents on application creation are ignored; the response carries server-computed zeros."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. One borrower."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "S1", business_name: "B5", email: "s1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 3, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { app_id: $.data.id }
          assert:
            - "LoanApplication.${app_id}.private_total_cents == 0, public_total_cents == 0, funded_total_cents == 0, distinct_endorser_count == 0"

      - name: underwriting_invite_immutability_no_update_endpoint
        grounds:
          - entities.UnderwritingInvite
        claim_type: Immutability
        distinguishing_aspect: "UnderwritingInvite and Payment have common_fields false — no version/updated_at fields and no PATCH endpoint exists for either; only accept/decline transitions exist for invites."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "T1", business_name: "B6", email: "t1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "w1@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { inv: $.data }
          assert:
            - "The invite response carries id and created_at but no version field"

      - name: fk_reverse_reachability_lists
        grounds:
          - entities.Endorsement.fields.loan_application_id
          - entities.Contribution.fields.loan_application_id
          - endpoints.GET_/loan-applications/{id}/endorsements
          - endpoints.GET_/loan-applications/{id}/contributions
        claim_type: Parent Relationships
        distinguishing_aspect: "Every FK declared in §1.1 has a reverse GET: endorsers of an application list via /loan-applications/{id}/endorsements and contributions via /loan-applications/{id}/contributions, both returning arrays."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Borrower with DRAFT application; one lender with balance."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "U1", business_name: "B7", email: "u1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 3, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /loan-applications/${app_id}/endorsements"
              payload: {}
              as: PlatformAdmin
            - call: "GET /loan-applications/${app_id}/contributions"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Both responses are 200 with response_type array and empty data (nothing lent yet)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_from_draft_returns_invalid_state
        grounds:
          - state_machines.LoanApplication
          - errors[ERR_INVALID_STATE]
        claim_type: invalid_transition
        distinguishing_aspect: "POST /loan-applications/{id}/approve on a DRAFT application returns 409 ERR_INVALID_STATE; only IN_REVIEW is a valid source."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Borrower with DRAFT application."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "V1", business_name: "B8", email: "v1@example.com", business_tenure_months: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 3, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE and LoanApplication.${app_id}.status remains DRAFT"

      - name: withdraw_from_rejected_returns_invalid_state
        grounds:
          - state_machines.LoanApplication
          - errors[ERR_INVALID_STATE]
        claim_type: invalid_transition
        distinguishing_aspect: "Withdraw is only valid from DRAFT/IN_REVIEW/APPROVED_PENDING_FUNDRAISE/PRIVATE_FUNDRAISING; a REJECTED (terminal) application returns ERR_INVALID_STATE on withdraw."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Application submitted and rejected."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "W1", business_name: "B9", email: "w1@example.com", business_tenure_months: 24, prior_repaid_loans_count: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "w1i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { wi1: $.data.invite_token }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "w2i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { wi2: $.data.invite_token }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "w3i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { wi3: $.data.invite_token }
            - call: "POST /underwriting-invites/${wi1}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /underwriting-invites/${wi2}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /underwriting-invites/${wi3}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 3, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /loan-applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v}" }
              as: Borrower
              as_user_id: "${b1}"
            - call: "POST /loan-applications/${app_id}/reject"
              payload: { notes: "No" }
              as: PlatformAdmin
          trigger:
            - call: "POST /loan-applications/${app_id}/withdraw"
              payload: {}
              as: Borrower
              as_user_id: "${b1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE; REJECTED is terminal and stays REJECTED"

      - name: disburse_before_funded_returns_invalid_state
        grounds:
          - state_machines.LoanApplication
          - errors[ERR_APPLICATION_NOT_FUNDED]
        claim_type: invalid_transition
        distinguishing_aspect: "Disbursing a PUBLIC_FUNDRAISING application that has not reached FUNDED returns ERR_APPLICATION_NOT_FUNDED (domain-specific, not generic ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Application in PUBLIC_FUNDRAISING with partial funding."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trustees"
              payload: { org_name: "G Trust", endorsement_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { trustee_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "X1", business_name: "B10", email: "x1@example.com", business_tenure_months: 24, prior_repaid_loans_count: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "x1i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { xi1: $.data.invite_token }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "x2i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { xi2: $.data.invite_token }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "x3i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { xi3: $.data.invite_token }
            - call: "POST /underwriting-invites/${xi1}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /underwriting-invites/${xi2}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /underwriting-invites/${xi3}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 300000, term_months: 3, business_purpose: "x" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /loan-applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v}", trustee_id: "${trustee_id}" }
              as: Borrower
              as_user_id: "${b1}"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loan-applications/${app_id}/open-private"
              payload: {}
              as: Borrower
              as_user_id: "${b1}"
            - call: "POST /lenders"
              payload: { display_name: "Zed Q", email: "zq@example.com" }
              as: Anonymous
              captures: { l1: $.data.id }
            - call: "POST /lenders/${l1}/deposits"
              payload: { amount_cents: 500000 }
              as: Lender
              as_user_id: "${l1}"
            - call: "POST /lenders"
              payload: { display_name: "Yan R", email: "yr@example.com" }
              as: Anonymous
              captures: { l2: $.data.id }
            - call: "POST /lenders/${l2}/deposits"
              payload: { amount_cents: 500000 }
              as: Lender
              as_user_id: "${l2}"
            - call: "POST /lenders"
              payload: { display_name: "Xim S", email: "xs@example.com" }
              as: Anonymous
              captures: { l3: $.data.id }
            - call: "POST /lenders/${l3}/deposits"
              payload: { amount_cents: 500000 }
              as: Lender
              as_user_id: "${l3}"
            - call: "POST /lenders"
              payload: { display_name: "Wyn T", email: "wt@example.com" }
              as: Anonymous
              captures: { l4: $.data.id }
            - call: "POST /lenders/${l4}/deposits"
              payload: { amount_cents: 500000 }
              as: Lender
              as_user_id: "${l4}"
            - call: "POST /trustees/${trustee_id}/endorsements"
              payload: { loan_application_id: "${app_id}", amount_cents: 50000 }
              as: Trustee
              as_user_id: "${trustee_id}"
            - call: "POST /loan-applications/${app_id}/endorsements"
              payload: { lender_id: "${l1}", amount_cents: 25000 }
              as: Lender
              as_user_id: "${l1}"
            - call: "POST /loan-applications/${app_id}/endorsements"
              payload: { lender_id: "${l2}", amount_cents: 25000 }
              as: Lender
              as_user_id: "${l2}"
            - call: "POST /loan-applications/${app_id}/endorsements"
              payload: { lender_id: "${l3}", amount_cents: 25000 }
              as: Lender
              as_user_id: "${l3}"
            - call: "POST /loan-applications/${app_id}/endorsements"
              payload: { lender_id: "${l4}", amount_cents: 25000 }
              as: Lender
              as_user_id: "${l4}"
            - call: "POST /loan-applications/${app_id}/open-public"
              payload: {}
              as: Borrower
              as_user_id: "${b1}"
              captures: { app_v_pub: $.data.version }
          trigger:
            - call: "POST /loan-applications/${app_id}/disburse"
              payload: { expected_application_version: "${app_v_pub}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_APPLICATION_NOT_FUNDED (funded_total 150000 < requested 300000, status PUBLIC_FUNDRAISING)"

      - name: paid_off_loan_is_terminal
        grounds:
          - state_machines.Loan
        claim_type: Terminal State Lockdown
        distinguishing_aspect: "A PAID_OFF loan rejects further payments with ERR_INVALID_STATE and no installment can leave PAID."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Disbursed 100000/1-month loan fully paid."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trustees"
              payload: { org_name: "H Trust", endorsement_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { trustee_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "Y1", business_name: "B11", email: "y1@example.com", business_tenure_months: 24, prior_repaid_loans_count: 1 }
              as: Anonymous
              captures: { b1: $.data.id }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "y1i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { yi1: $.data.invite_token }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "y2i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { yi2: $.data.invite_token }
            - call: "POST /borrowers/${b1}/underwriting-invites"
              payload: { invitee_email: "y3i@x.com" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { yi3: $.data.invite_token }
            - call: "POST /underwriting-invites/${yi1}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /underwriting-invites/${yi2}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /underwriting-invites/${yi3}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1}", requested_amount_cents: 100000, term_months: 1, business_purpose: "x" }
