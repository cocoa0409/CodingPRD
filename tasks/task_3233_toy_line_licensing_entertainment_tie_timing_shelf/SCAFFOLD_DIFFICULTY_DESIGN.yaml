          assert:
            - "Property.${p1}.release_date == 2027-06-01 and shift_count == 1"
            - "ToyLine.${l1}.target_street_date == 2027-06-01"
            - "Shipment.${sh1}.street_date == 2027-06-01"
            - "AssortmentCommitment.${c1}.status == AT_RISK  # new release 2027-06-01 > window_start 2026-09-15"
      - name: enter_closeout_cascades_to_commitments_and_reviews
        grounds:
          - state_machines.ToyLine.COMMITTED_to_CLOSEOUT
          - state_machines.AssortmentCommitment
          - calculations.shelf_slots_used_recompute
