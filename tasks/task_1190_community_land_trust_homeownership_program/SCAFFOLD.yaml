    side_effects: ["status → FORECLOSED; Unit.occupancy_status → FORECLOSED; Household.eligibility_status → SUSPENDED; OPEN DefaultNotice rows → ESCALATED; PENDING LeaseFee rows → DEFAULTED; increments GroundLease.version by 1 AND increments Unit.version by 1"]

