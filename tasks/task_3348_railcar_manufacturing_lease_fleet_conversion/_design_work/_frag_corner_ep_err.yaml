            - call: "POST /api/v1/components"
              payload: { part_number: "WS-N2", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
          trigger:
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "00000000-0000-0000-0000-0000000000d2", qty_ordered: 10, unit_cost_cents: 1000, order_date: "2026-09-01", expected_receipt_date: "2026-09-21" }
              as: SupplyChainCoordinator
              captures: { err_fk: $.data.error_id }
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ws_id}", qty_ordered: 10, unit_cost_cents: 1000, order_date: "2026-09-01", expected_receipt_date: "2026-09-21" }
              as: SupplyChainCoordinator
              captures: { ok_id: $.data.id, ok_status: $.data.status }
            - call: "GET /api/v1/component-purchase-orders"
              payload: {}
