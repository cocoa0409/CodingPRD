  - rule_id: non_linear_state_machine
    instances:
      - name: records_request_reopen_cycle
        grounds:
          - state_machines.RecordsRequest.ASSEMBLING_to_READY_FOR_RELEASE
          - state_machines.RecordsRequest.READY_FOR_RELEASE_to_ASSEMBLING
          - state_machines.FileComponent.CERTIFIED_to_EXCLUDED
          - state_machines.FileComponent.EXCLUDED_to_COLLECTED
          - entities.RecordsRequest.fields.reopen_count
          - entities.RecordsRequest.fields.packet_status
          - concurrency_rules.packet-snapshot-stale-cumulative-file
        distinguishing_aspect: |
          RecordsRequest traverses ASSEMBLING -> READY_FOR_RELEASE -> ASSEMBLING twice, so the same
          state is entered three times and reopen_count reaches exactly 2 while packet_status
          flips SNAPSHOT -> VOID -> SNAPSHOT -> VOID -> SNAPSHOT; a linear implementation either
          refuses the second mark-ready or leaves reopen_count at 1. The cycling entity is
          RecordsRequest driven by an external component exclusion, unlike the AmendmentRequest
          self-loop instance.
        test_recipe:
          setup:
            - "CA rule (responding) and TX rule (requesting) exist; SEND01 in CA, RECV01 in TX."
            - "One student with has_iep false whose three required components are COLLECTED then CERTIFIED with (120,0), (34,4), (18,2)."
            - "One RecordsRequest validated into ASSEMBLING, marked ready once (packet SNAPSHOT, 166 pages)."
            - "The DISCIPLINE component is excluded (reopen 1), reinstated and re-certified, marked ready again, then excluded a second time (reopen 2), reinstated and re-certified."
            - "Each mark-ready reads a freshly captured CumulativeFile.version, because every component PATCH bumps it."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
