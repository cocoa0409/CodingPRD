            - { call: "POST /licensing/inspections/${insp_id}/complete", payload: { category_scores: [ { category: "BEVERAGE_QUALITY", score: 60 }, { category: "FOOD_SAFETY", score: 90 }, { category: "BRAND_PRESENTATION", score: 90 }, { category: "SERVICE_SPEED", score: 90 } ], critical_fail: false }, as: BrandInspector, as_user_id: "insp-A" }
            - { call: "GET /licensing/stores/${store_id}", payload: {}, as: BrandProgramAdmin, captures: { st_op: $.data.operating_status, st_pos1: $.data.compliance_posture } }
