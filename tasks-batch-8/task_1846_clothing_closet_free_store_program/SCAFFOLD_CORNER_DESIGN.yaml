  - section: validations
    instances:
      - name: checkin_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role / X-User-ID are rejected ERR_UNAUTHENTICATED (401) before any role or existence check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (trigger sends no X-User-Role/X-User-ID headers)"

      - name: season_incompatible_stocking
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_SEASON_INCOMPATIBLE]"]
        distinguishing_aspect: "A WINTER item cannot stock into a SUMMER-policy zone (ERR_SEASON_INCOMPATIBLE); the same item stocks into an ALL_SEASON zone."
        test_recipe:
          setup: ["SUMMER zone and ALL_SEASON zone; 1 WINTER GOOD item PENDING_STOCK"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZSUM", season_policy: SUMMER, capacity_items: 5 }, as: ProgramAdmin, captures: { zs: $.data.id } }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZALL", season_policy: ALL_SEASON, capacity_items: 5 }, as: ProgramAdmin, captures: { za: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: COATS, season: WINTER, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${zs}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${za}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ist: $.data.status } }
          assert:
            - "err == ERR_SEASON_INCOMPATIBLE"
            - "ist == STOCKED (ALL_SEASON zone accepts any season)"

      - name: zone_patch_capacity_below_stock
        claim_type: aggregate_validation
        grounds: ["validations[priority=29]", "errors[ERR_CAPACITY_BELOW_STOCK]"]
        distinguishing_aspect: "Shrinking capacity_items below live current_stock (2) is rejected ERR_CAPACITY_BELOW_STOCK even though the new value alone (1) is a valid range."
        test_recipe:
          setup: ["zone capacity 3 holding 2 stocked items"]
