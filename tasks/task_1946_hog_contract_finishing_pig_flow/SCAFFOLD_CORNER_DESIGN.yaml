      - name: manure_application_december_window_rejected
        claim_type: violation_to_error
        grounds: [ "validations[priority=9]", "errors[ERR_APPLICATION_OUTSIDE_WINDOW]"]
        distinguishing_aspect: "Regulatory temporal window: applied_at 2026-12-10 is outside [2026-03-01, 2026-11-30] for plan_year 2026 — rejected even with budgets available."
        test_recipe:
          setup: ["plan APPROVED for 2026; clock 2026-12-15"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
