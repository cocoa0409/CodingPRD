            - call: "POST /v1/dispatches"
              payload: { job_id: "${jobA_id}", technician_id: "${tech_id}", window_start: "2026-07-11T09:00:00Z", window_end: "2026-07-11T10:00:00Z", expected_job_version: "${jobA_vacc}" }
              as: Dispatcher
