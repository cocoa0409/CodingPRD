        distinguishing_aspect: "Revoking an asset with no usages is the degenerate cascade: it must still flip status, store the reason and bump version to 2 while touching nothing else; a second revoke is ERR_INVALID_STATE and an unknown asset id is ERR_LIBRARY_ASSET_NOT_FOUND (404)."
        test_recipe:
          setup:
