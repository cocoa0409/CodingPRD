              as: PlayerAgent
              as_user_id: "${pA_id}"
              captures: { cA_id: $.data.id }
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pB_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 10, tax_residency_code: "US-CA", signing_bonus_cents: 0, buyout_multiplier_bp: 5000 }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { oB_id: $.data.id }
