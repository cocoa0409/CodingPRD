  # ===========================================================================
  # Rule 5: Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_early_start
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_VISIT_TOO_EARLY]
        distinguishing_aspect: |
          Pair (state vs business_temporal): calling visit /start while the
          visit is still SCHEDULED (batch not yet published) AND before
          scheduled_start must return ERR_INVALID_STATE (priority 5), not
          ERR_VISIT_TOO_EARLY (priority 7) — state preconditions outrank
          temporal business rules.
        test_recipe:
          setup:
            - "Property with vacant unit, asset, template, adopted plan; DRAFT batch containing one SCHEDULED visit at 2026-08-10T09:00; clock left at default 2026-08-01 (before scheduled_start, so temporal rule would also fail if reached)"
