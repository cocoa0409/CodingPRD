  - section: complexity_layers
    instances:
      - name: a_stale_expected_configuration_version_blocks_the_design_create_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[design-create-stale-configuration]
          - validations[priority=6, error_id=ERR_STALE_CONFIGURATION_VERSION]
        distinguishing_aspect: "The lock bumps BuildingConfiguration.version, so the version a client read while the configuration was still DRAFT is already stale by the time a design may legally be created: POST /engineering-designs with it is 412 ERR_STALE_CONFIGURATION_VERSION, and the same body with the post-lock version is 201."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder; cfg1 created (version captured while DRAFT) and then LOCKED (version captured again)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id, cfg1_v_draft: $.data.version }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
          trigger:
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_draft}" }
              as: Engineer
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d1_id: $.data.id }
          assert:
            - "${cfg1_v_locked} == ${cfg1_v_draft} + 1 — the lock is a write and bumps the version"
            - "the create carrying ${cfg1_v_draft} returns 412 with data.error_id == ERR_STALE_CONFIGURATION_VERSION"
            - "the refused create is not ERR_CONFIGURATION_NOT_LOCKED: the configuration is LOCKED, only the version is behind"
            - "no EngineeringDesign row exists after the refusal, and BuildingConfiguration.${cfg1_id}.version is still ${cfg1_v_locked} — a rejected write bumps nothing"
            - "the identical body carrying ${cfg1_v_locked} returns 201 as ${d1_id} with status DRAFT and revision_count 0"

