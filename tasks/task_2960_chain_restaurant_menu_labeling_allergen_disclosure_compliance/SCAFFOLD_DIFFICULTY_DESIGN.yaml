            - "An EnforcementAction citing CALORIES_NOT_DECLARED - a citation code that maps to no requirement_code - has been responded to as DISPUTED, put through one REQUEST_INFO round, responded to again, and then ESCALATED."
            - "Both money ledgers read 0 before the assessment: Establishment.outstanding_penalty_cents == 0 and Jurisdiction.assessed_penalty_cents_total == 0."
