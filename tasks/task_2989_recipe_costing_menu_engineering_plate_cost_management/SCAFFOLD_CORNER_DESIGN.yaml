# ===========================================================================
# §1.9 Scaffold Corner Design — task_2989 (Recipe Costing, Menu Engineering &
# Plate Cost Management)
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7: every testable claim the declared
# surface makes that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already
# assert. Sections and claim_type values come from
# references/claim-extraction-guide.md; corners already covered by a §1.8
# instance appear as `excluded_because:` stubs naming that instance.
#
# Shared vocabulary used by the chains below (all figures verified by integer
# arithmetic against §1.3):
#   CHEDDAR-BLOCK  pack_base_units 2268, trim 10000 bps, shrink 0 bps
#                  (net_yield_bps 10000), allergen_mask 1 (MILK),
#                  kcal_per_base_unit_micros 4000000, sodium_mcg_per_base_unit 6200,
#                  MW pack_cost_micros 22000000 PUBLISHED from 2026-07-01
#   PEANUT-OIL     pack_base_units 946, trim 10000, shrink 0, allergen_mask 8,
#                  kcal_per_base_unit_micros 8000000, sodium 0,
#                  MW pack_cost_micros 12000000
#   "GRILL WORLD"  Recipe PLATE-GRILL (PLATED, EACH, batch_yield 4, portions 4)
#                  with one CHEDDAR-BLOCK component at ep 400 -> ap 400,
#                  extended 3880071, batch 3880071, portion 970018,
#                  allergen_mask 1, kcal_per_portion 400000000, sodium 620000;
#                  MenuItem MI-GRILL-MW (MW, price 400, target 3000 bps,
#                  declared_allergen_mask 1) -> plate_cost_micros 1004259,
#                  plate_cost_cents 100, food_cost_bps 2500, contribution 300
#   The logical clock reads 2026-08-01T00:00:00.000Z until a test moves it.
# ===========================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: ingredient_creation_persists_catalogue_fields_and_computes_net_yield
        claim_type: creation
        grounds:
          - entities.Ingredient
          - endpoints[POST /culinary/ingredients]
          - entities.Ingredient.fields.net_yield_bps
        distinguishing_aspect: "A single POST with every required field returns 201 and echoes all of them, and net_yield_bps is the floor of trim_yield_bps * (10000 - cook_shrink_bps) / 10000 — 8550 for trim 9000 and shrink 500, not 8500 and not 9000."
        test_recipe:
          setup:
            - "Empty database. No other ingredient exists, so the sku uniqueness gate at priority 36 cannot fire."
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/ingredients"
              payload: { sku: "BEEF-CHUCK", name: "Beef Chuck", base_uom: "GRAM", pack_base_units: 4536, trim_yield_bps: 9000, cook_shrink_bps: 500, allergen_mask: 0, kcal_per_base_unit_micros: 2500000, sodium_mcg_per_base_unit: 700 }
              as: RecipeDeveloper
              captures: { ing_id: $.data.id, net: $.data.net_yield_bps, st: $.data.status, ret: $.data.retired_at, v: $.data.version }
          assert:
            - "HTTP 201 with the success envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == object"
            - "${net} == 8550 == floor(9000 * (10000 - 500) / 10000) — the floor, computed from both yield factors"
            - "${st} == ACTIVE and ${ret} is null — the declared defaults for a fresh ingredient"
            - "${v} == 1 and ${ing_id} is a non-empty id; created_at and updated_at are present"
            - "sku == BEEF-CHUCK, name == Beef Chuck, base_uom == GRAM, pack_base_units == 4536, trim_yield_bps == 9000, cook_shrink_bps == 500, allergen_mask == 0, kcal_per_base_unit_micros == 2500000 and sodium_mcg_per_base_unit == 700 are echoed unchanged"

      - name: recipe_retrieval_returns_the_persisted_costing_snapshot
        claim_type: retrieval
        grounds:
          - endpoints[GET /culinary/recipes/{recipe_id}]
          - entities.Recipe
        distinguishing_aspect: "A plain GET after a roll-up returns every stored costing field of GRILL WORLD (batch 3880071, portion 970018, basis LATEST_PUBLISHED, cost_state FRESH, depth 0, component_count 1) rather than recomputing anything."
        test_recipe:
          setup:
            - "GRILL WORLD's recipe only: CHEDDAR-BLOCK priced in MW and PLATE-GRILL rolled up once under LATEST_PUBLISHED. The recipe is left in DRAFT — retrieval is not gated on status."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
          trigger:
            - call: "GET /culinary/recipes/${grill_id}"
              as: CostAnalyst
              captures: { batch: $.data.batch_cost_micros, portion: $.data.portion_cost_micros, basis: $.data.cost_basis, state: $.data.cost_state, depth: $.data.depth, cnt: $.data.component_count, mask: $.data.allergen_mask }
          assert:
            - "${batch} == 3880071 and ${portion} == 970018 — the figures the roll-up persisted, byte-identical on re-read"
            - "${basis} == LATEST_PUBLISHED and ${state} == FRESH"
            - "${depth} == 0 (no SUB_RECIPE component) and ${cnt} == 1"
            - "${mask} == 1, kcal_per_portion_micros == 400000000 and sodium_mcg_per_portion == 620000"
            - "status == DRAFT and open_spec_change_count == 0 — retrieval works from any status and reports the counters untouched"

      - name: menu_item_listing_filters_by_region_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /culinary/menu-items]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three items across two regions: the MW filter narrows the candidate set to 2 BEFORE the limit/offset window is applied, so total_count is 2 (not 3), the single returned row is the second MW item in created_at ASC order, and has_more is false at offset 1."
        test_recipe:
          setup:
            - "One DRAFT PLATED recipe with no components (listing is not gated on the recipe's state) and three DRAFT menu items on it: MI-A-MW and MI-B-MW in region MW created in that order, and MI-C-NE in region NE."
          setup_api_calls:
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-LIST", name: "List Fixture Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { rec_id: $.data.id }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-A-MW", name: "Item A", recipe_id: "${rec_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 0 }
              as: RecipeDeveloper
              captures: { mi_a: $.data.id }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-B-MW", name: "Item B", recipe_id: "${rec_id}", region_code: "MW", current_price_cents: 500, target_food_cost_bps: 3000, declared_allergen_mask: 0 }
              as: RecipeDeveloper
              captures: { mi_b: $.data.id }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-C-NE", name: "Item C", recipe_id: "${rec_id}", region_code: "NE", current_price_cents: 600, target_food_cost_bps: 3000, declared_allergen_mask: 0 }
              as: RecipeDeveloper
              captures: { mi_c: $.data.id }
          trigger:
            - call: "GET /culinary/menu-items"
              payload: { region_code: "MW", limit: 1, offset: 0 }
              as: CostAnalyst
              captures: { page1_first: "$.data[0].id", page1: "$.data" }
            - call: "GET /culinary/menu-items"
              payload: { region_code: "MW", limit: 1, offset: 1 }
              as: CostAnalyst
              captures: { page2_first: "$.data[0].id", page2_code: "$.data[0].code" }
            - call: "GET /culinary/menu-items"
              payload: { limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { all_first: "$.data[0].id" }
          assert:
            - "the first response is an array of exactly 1 row with response_type == array; ${page1_first} == ${mi_a} — created_at ASC order"
            - "the first response's pagination fields report limit 1, offset 0, total_count 2 and has_more true — total_count counts the FILTERED set, so MI-C-NE is excluded"
            - "${page2_first} == ${mi_b} and ${page2_code} == MI-B-MW; that response reports offset 1, total_count 2 and has_more false"
            - "the unfiltered third response returns 3 rows with total_count 3 and has_more false, and ${all_first} == ${mi_a}"
            - "every returned row carries plate_cost_cents 0, plate_cost_state STALE and margin_class UNCLASSIFIED — no listing side effect"

      - name: ingredient_get_with_unknown_id_returns_ingredient_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_INGREDIENT_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: "A well-formed but unused UUID on the ingredient GET returns ERR_INGREDIENT_NOT_FOUND 404 — the path-id existence gate at priority 5, not the generic ERR_INVALID_REQUEST 400 of priority 3."
        test_recipe:
          setup:
            - "One unrelated ingredient exists so the table is non-empty; the id used in the trigger belongs to no row."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
          trigger:
            - call: "GET /culinary/ingredients/00000000-0000-4000-8000-000000000000"
              as: CostAnalyst
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${err} == ERR_INGREDIENT_NOT_FOUND with HTTP 404"
            - "the response uses the error envelope: response_type == error and ${msg} is a non-empty string"
            - "the existing ingredient ${ched_id} is untouched and still retrievable"

      - name: count_line_missing_required_counted_base_units_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /culinary/menu-period-reviews/{period_review_id}/count-lines]
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "counted_base_units has source input with no declared default, so omitting it is ERR_INVALID_REQUEST 400 at priority 3 — before the review-status gate at 23 and before any usage arithmetic; no CountSheetLine row is created."
        test_recipe:
          setup:
            - "One Unit and one OPEN MenuPeriodReview on it under SALES_MIX_BASED, plus CHEDDAR-BLOCK. No count line exists yet."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 500, received_base_units: 0 }
              as: CostAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /culinary/menu-period-reviews/${rev_id}/count-lines returns 0 rows with total_count 0"
            - "MenuPeriodReview.${rev_id}.status is still OPEN and its version did not change — a rejected write fires no side effect"

      - name: menu_item_creation_applies_declared_defaults_for_kids_menu_and_margin_class
        claim_type: defaults
        grounds:
          - entities.MenuItem.fields.is_kids_menu
          - entities.MenuItem.fields.margin_class
          - entities.MenuItem.fields.plate_cost_state
          - endpoints[POST /culinary/menu-items]
        distinguishing_aspect: "is_kids_menu is the only optional input on the menu-item create; omitting it yields false, and the create writes no costing figure at all (plate_cost_micros 0, plate_cost_state STALE, margin_class UNCLASSIFIED, open_lto_count 0, is_lto false) even though the backing recipe already has a FRESH cost."
        test_recipe:
          setup:
            - "GRILL WORLD's recipe rolled up to batch 3880071 / portion 970018 and left in DRAFT; no menu item exists yet."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
          trigger:
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id, kids: $.data.is_kids_menu, mc: $.data.margin_class, pstate: $.data.plate_cost_state, pmicros: $.data.plate_cost_micros, lto: $.data.is_lto, opencnt: $.data.open_lto_count, basis: $.data.cost_basis, lpc: $.data.last_price_change_at }
          assert:
            - "${kids} == false — the declared default for the only optional input"
            - "${mc} == UNCLASSIFIED and ${pstate} == STALE"
            - "${pmicros} == 0, plate_cost_cents == 0, food_cost_bps == 0, contribution_margin_cents == 0, allergen_mask == 0 and sodium_mcg_per_portion == 0 — the create copies nothing from the FRESH recipe"
            - "${basis} is null and ${lpc} is null"
            - "${lto} == false, ${opencnt} == 0, status == DRAFT and version == 1"
            - "Recipe.${grill_id}.cost_state is still FRESH with batch_cost_micros 3880071 — creating a menu item does not disturb the recipe"

      - name: recipe_component_ap_quantity_computed_from_ingredient_net_yield
        claim_type: computed_fields
        grounds:
          - endpoints[POST /culinary/recipes/{recipe_id}/components]
          - entities.RecipeComponent.fields.ap_quantity_base_units
          - calculations.recipe_cost_rollup
        distinguishing_aspect: "ap_quantity_base_units is the CEILING of ep * 10000 / net_yield_bps, so an ingredient with trim 8500 and shrink 1000 (net_yield_bps 7650) turns ep 1000 into 1308 — never 1307 (the truncation) and never 1000 (the EP quantity); the cost fields stay 0 until a roll-up runs."
        test_recipe:
          setup:
            - "One ingredient TOMATO-WHOLE with pack_base_units 3000, trim_yield_bps 8500 and cook_shrink_bps 1000, so net_yield_bps == floor(8500 * 9000 / 10000) == 7650. One DRAFT recipe SUB-SAUCE with batch_yield 2000 and portions 20. No price feed is published, so no roll-up is possible or attempted."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "TOMATO-WHOLE", name: "Whole Tomatoes", base_uom: "GRAM", pack_base_units: 3000, trim_yield_bps: 8500, cook_shrink_bps: 1000, allergen_mask: 0, kcal_per_base_unit_micros: 180000, sodium_mcg_per_base_unit: 90 }
              as: RecipeDeveloper
              captures: { tom_id: $.data.id, net: $.data.net_yield_bps }
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-SAUCE", name: "Tomato Sauce", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 2000, portions_per_batch: 20 }
              as: RecipeDeveloper
              captures: { sauce_id: $.data.id, sauce_v0: $.data.version }
          trigger:
            - call: "POST /culinary/recipes/${sauce_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${tom_id}", ep_quantity_base_units: 1000, sequence_no: 1, expected_recipe_version: "${sauce_v0}" }
              as: RecipeDeveloper
              captures: { comp_id: $.data.id, ap: $.data.ap_quantity_base_units, unit_used: $.data.unit_cost_micros_used, ext: $.data.extended_cost_micros, cstatus: $.data.status }
          assert:
            - "${net} == 7650 on the ingredient"
            - "${ap} == 1308 == ceil(1000 * 10000 / 7650); 1307 is the truncated value and is wrong"
            - "${unit_used} == 0 and ${ext} == 0 — the component add never prices anything"
            - "${cstatus} == ACTIVE, ep_quantity_base_units == 1000, sequence_no == 1 and recipe_id == ${sauce_id}"
            - "Recipe.${sauce_id}.component_count == 1, cost_state == STALE and version == ${sauce_v0} + 1"

      - name: price_feed_line_copies_feed_scope_and_freezes_pack_base_units_snapshot
        claim_type: system_fields
        grounds:
          - entities.IngredientPrice.fields.pack_base_units_snapshot
          - entities.IngredientPrice.fields.region_code
          - endpoints[POST /culinary/price-feeds/{price_feed_id}/lines]
        distinguishing_aspect: "region_code, distributor_code, price_feed_id and status are system-sourced on a price line: they come from the parent feed and the fixed default PENDING, and pack_base_units_snapshot is frozen from the ingredient (2268) at line time rather than resolved when the roll-up later reads the row."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK with pack_base_units 2268 and one DRAFT PriceFeed for distributor PROTEIN in region WEST."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "PROTEIN", region_code: "WEST", feed_date: "2026-07-05T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_id: $.data.id, lc0: $.data.line_count, fst: $.data.status }
          trigger:
            - call: "POST /culinary/price-feeds/${feed_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 24000000, effective_from: "2026-07-05T00:00:00.000Z" }
              as: CostAnalyst
              captures: { line_id: $.data.id, rc: $.data.region_code, dc: $.data.distributor_code, snap: $.data.pack_base_units_snapshot, lst: $.data.status, pf: $.data.price_feed_id, eto: $.data.effective_to }
            - call: "GET /culinary/price-feeds/${feed_id}"
              as: CostAnalyst
              captures: { lc1: $.data.line_count, sup: $.data.superseded_price_count, ar: $.data.affected_recipe_count, am: $.data.affected_menu_item_count }
          assert:
            - "${fst} == DRAFT and ${lc0} == 0 on the freshly opened feed"
            - "${rc} == WEST and ${dc} == PROTEIN — copied from the feed, not supplied by the caller"
            - "${snap} == 2268 — frozen from Ingredient.pack_base_units at line time"
            - "${lst} == PENDING, ${pf} == ${feed_id} and ${eto} is null (the omitted optional bound means an open-ended window)"
            - "${lc1} == 1 while ${sup} == 0, ${ar} == 0 and ${am} == 0 — the cascade counters stay zero until publication"

      - name: ingredient_creation_with_trim_yield_bps_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Ingredient.fields.trim_yield_bps
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "trim_yield_bps is constrained to 1..10000, so 0 is rejected with ERR_INVALID_REQUEST 400 — the range gate fires before the net_yield_bps computation that would otherwise divide by a zero yield."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/ingredients"
              payload: { sku: "BAD-YIELD", name: "Zero Yield Item", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 0, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 0, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { err: $.data.error_id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "BAD-UOM", name: "Bad Uom Item", base_uom: "OUNCE", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 0, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { err2: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400 — 0 is below the declared minimum of 1"
            - "${err2} == ERR_INVALID_REQUEST with HTTP 400 — OUNCE is not a member of {GRAM, MILLILITER, EACH}"
            - "GET /culinary/ingredients for either sku is impossible because no row was created; the ingredient table is still empty"

      - name: period_review_with_period_start_after_period_end_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority 3]
          - endpoints[POST /culinary/menu-period-reviews]
        distinguishing_aspect: "Priority 3 explicitly requires period_start < period_end; a window whose start is AFTER its end is ERR_INVALID_REQUEST 400 even though both instants are well-formed and the Unit exists, and an equal start and end is rejected too because the comparison is strict."
        test_recipe:
          setup:
            - "One Unit STORE-001 in region MW."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-07-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-07-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400 (start after end)"
            - "${err2} == ERR_INVALID_REQUEST with HTTP 400 (start equal to end — the rule is strict)"
            - "GET /culinary/menu-period-reviews with unit_id ${unit_id} returns 0 rows with total_count 0"

      - name: menu_item_creation_with_unknown_recipe_returns_recipe_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority 7]
          - errors[ERR_RECIPE_NOT_FOUND]
          - endpoints[POST /culinary/menu-items]
        distinguishing_aspect: "recipe_id is a body FK on the menu-item create, so an unknown value is ERR_RECIPE_NOT_FOUND 404 from priority 7 — the body FK is checked exactly like a path id, and the duplicate-code gate at priority 37 never gets to see the request."
        test_recipe:
          setup:
            - "One real DRAFT recipe exists so the recipe table is non-empty; the recipe_id in the trigger belongs to no row."
          setup_api_calls:
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-REAL", name: "Real Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { real_id: $.data.id }
          trigger:
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-ORPHAN", name: "Orphan Item", recipe_id: "00000000-0000-4000-8000-000000000001", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 0 }
              as: RecipeDeveloper
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RECIPE_NOT_FOUND with HTTP 404"
            - "GET /culinary/menu-items with recipe_id ${real_id} returns 0 rows — no orphan row was written anywhere"

      - name: recipe_component_junction_links_one_ingredient_into_two_recipes
        claim_type: graph
        grounds:
          - endpoints[GET /culinary/recipe-components]
          - entities.RecipeComponent.fields.ingredient_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "RecipeComponent is the many-to-many junction of the recipe graph: the same ingredient row backs components in two different recipes, and the flat list endpoint resolves the junction from either side — by ingredient_id (2 rows across recipes) or by recipe_id (1 row each), with independently computed ap quantities."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK (net_yield_bps 10000) and two DRAFT recipes: PLATE-GRILL (batch_yield 4, portions 4) and SUB-CHEESE (batch_yield 2000, portions 20). Each gets one cheddar component, at ep 400 and ep 500 respectively."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-CHEESE", name: "Cheese Sauce", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 2000, portions_per_batch: 20 }
              as: RecipeDeveloper
              captures: { cheese_id: $.data.id, cheese_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
              captures: { comp_grill: $.data.id }
            - call: "POST /culinary/recipes/${cheese_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${cheese_v0}" }
              as: RecipeDeveloper
              captures: { comp_cheese: $.data.id }
          trigger:
            - call: "GET /culinary/recipe-components"
              payload: { ingredient_id: "${ched_id}", status: "ACTIVE", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { by_ing_first: "$.data[0].recipe_id" }
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${cheese_id}", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { by_rec_first: "$.data[0].id", by_rec_ep: "$.data[0].ep_quantity_base_units" }
          assert:
            - "the ingredient-scoped response returns exactly 2 rows with total_count 2 — ids ${comp_grill} and ${comp_cheese} — and ${by_ing_first} == ${grill_id} in created_at ASC order"
            - "the recipe-scoped response returns exactly 1 row with total_count 1, ${by_rec_first} == ${comp_cheese} and ${by_rec_ep} == 500"
            - "both rows report ap_quantity_base_units equal to their ep (400 and 500) because net_yield_bps is 10000, proving the two components are costed independently rather than shared"
            - "Recipe.${grill_id}.component_count == 1 and Recipe.${cheese_id}.component_count == 1 — one shared ingredient, two separate junction rows"

      - name: recipe_and_menu_item_are_never_immutable_entities
        claim_type: immutability
        grounds:
          - entities.Recipe
          - entities.MenuItem
        excluded_because:
          difficulty_instance: component_extended_costs_rounded_then_summed_on_plate_melt_rollup
          rationale: "No entity in §1.1 declares common_fields: false, so the immutability row of the extraction guide has no subject in this scaffold; the version-bearing write behaviour of every entity is instead exercised by the OCC corners and by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: recipe_created_starts_in_draft_with_stale_cost
        claim_type: initial_state
        grounds:
          - state_machines[Recipe].initial_state
          - endpoints[POST /culinary/recipes]
        distinguishing_aspect: "A fresh Recipe is DRAFT with cost_state STALE and every costing field at its zero value — cost_basis and last_rollup_at null — so the first roll-up is mandatory rather than an optimisation."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { rid: $.data.id, st: $.data.status, cs: $.data.cost_state, cb: $.data.cost_basis, lr: $.data.last_rollup_at, batch: $.data.batch_cost_micros, cnt: $.data.component_count, v: $.data.version }
          assert:
            - "HTTP 201; ${st} == DRAFT and ${cs} == STALE"
            - "${cb} is null and ${lr} is null — nothing has been priced yet"
            - "${batch} == 0, portion_cost_micros == 0, allergen_mask == 0, kcal_per_portion_micros == 0, sodium_mcg_per_portion == 0"
            - "${cnt} == 0, depth == 0, open_spec_change_count == 0 and ${v} == 1"
            - "GET /culinary/recipes/${rid} returns exactly the same field values"

      - name: recipe_draft_to_under_review_requires_a_component_and_a_fresh_cost
        claim_type: precondition_enforcement
        grounds:
          - state_machines[Recipe] DRAFT -> UNDER_REVIEW
          - validations[priority 18]
          - validations[priority 26]
        distinguishing_aspect: "Four submit-review attempts walk the two preconditions in priority order: an empty component set is ERR_RECIPE_INVALID_STATE (priority 18) even after a zero-component roll-up has made the cost FRESH, and only once a component exists does the failure become ERR_COST_STALE (priority 26) — the state gate outranks the freshness gate, so the two errors cannot be swapped."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK priced at 22000000 micros in MW from 2026-07-01 (feed PUBLISHED) and a DRAFT PLATE-GRILL recipe (batch_yield 4, portions 4) with no components yet."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
          trigger:
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
              captures: { e1: $.data.error_id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { cs1: $.data.cost_state, b1: $.data.batch_cost_micros }
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
              captures: { e2: $.data.error_id }
            - call: "GET /culinary/recipes/${grill_id}"
              as: RecipeDeveloper
              captures: { grill_v1: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v1}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
              captures: { e3: $.data.error_id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { b2: $.data.batch_cost_micros }
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
              captures: { fst: $.data.status, fv: $.data.version, fcs: $.data.cost_state }
          assert:
            - "${e1} == ERR_RECIPE_INVALID_STATE with HTTP 409 — component_count 0 and cost STALE, and the priority-18 gate reports first"
            - "${cs1} == FRESH and ${b1} == 0 — a zero-component roll-up legitimately succeeds at zero"
            - "${e2} == ERR_RECIPE_INVALID_STATE with HTTP 409 — a FRESH cost does not make an empty specification reviewable"
            - "${e3} == ERR_COST_STALE with HTTP 409 — the component add reset cost_state, so the freshness gate is now the first one violated"
            - "${b2} == 3880071 == round_half_up(400 * 22000000 / 2268)"
            - "the final call returns HTTP 200 with ${fst} == UNDER_REVIEW, ${fcs} == FRESH and ${fv} == ${grill_v1} + 3 (component add, roll-up, submit-review)"

      - name: recipe_activation_mints_prep_guide_revision_one_only_on_first_activation
        claim_type: side_effect_execution
        grounds:
          - state_machines[Recipe] UNDER_REVIEW -> ACTIVE
          - entities.PrepGuide
          - endpoints[GET /culinary/recipes/{recipe_id}/prep-guides]
        distinguishing_aspect: "The prep guide is minted on the FIRST activation only: a second lap through ACTIVE -> UNDER_REVIEW -> ACTIVE leaves revision_no at 1, leaves sync_state CURRENT and leaves synced_spec_version at the version stamped by the first activation, so the guide is now demonstrably behind the recipe without anyone having propagated anything."
        test_recipe:
          setup:
            - "GRILL WORLD through the first roll-up: CHEDDAR-BLOCK priced in MW, PLATE-GRILL (batch_yield 4, portions 4) with one cheddar component at ep 400, rolled up to batch 3880071. Recipe versions so far: 1 create, 2 component add, 3 roll-up."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
          trigger:
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
              captures: { st1: $.data.status, v1: $.data.version }
            - call: "GET /culinary/recipes/${grill_id}/prep-guides"
              payload: { limit: 10, offset: 0 }
              as: RecipeDeveloper
              captures: { pg_id: "$.data[0].id", pg_rev: "$.data[0].revision_no", pg_sync: "$.data[0].sync_state", pg_ver: "$.data[0].synced_spec_version", pg_cnt: "$.data[0].component_count_snapshot", pg_by: "$.data[0].batch_yield_base_units_snapshot" }
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
              captures: { st2: $.data.status, v2: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
              captures: { st3: $.data.status, v3: $.data.version }
            - call: "GET /culinary/recipes/${grill_id}/prep-guides"
              payload: { limit: 10, offset: 0 }
              as: RecipeDeveloper
              captures: { pg2_id: "$.data[0].id", pg2_rev: "$.data[0].revision_no", pg2_sync: "$.data[0].sync_state", pg2_ver: "$.data[0].synced_spec_version" }
          assert:
            - "${st1} == ACTIVE and ${v1} == 5 (create 1, component 2, roll-up 3, submit-review 4, activate 5)"
            - "${pg_rev} == 1, ${pg_sync} == CURRENT and ${pg_ver} == 5 — synced_spec_version is the version AFTER the activation increment, not 4"
            - "${pg_cnt} == 1 and ${pg_by} == 4 — the snapshots are copied from the recipe, and portions_per_batch_snapshot == 4"
            - "${st2} == UNDER_REVIEW with ${v2} == 6, and ${st3} == ACTIVE with ${v3} == 7 — the ACTIVE -> UNDER_REVIEW -> ACTIVE lap needs no new roll-up because cost_state stayed FRESH"
            - "the second listing still returns exactly 1 row with total_count 1 and ${pg2_id} == ${pg_id}"
            - "${pg2_rev} == 1 (not 2), ${pg2_sync} == CURRENT (re-activation never re-syncs) and ${pg2_ver} == 5 — the guide now lags the recipe's version 7 with no flag raised"

      - name: recipe_activation_with_a_draft_sub_recipe_child_is_rejected_then_succeeds
        claim_type: guarded_transitions
        grounds:
          - validations[priority 30]
          - errors[ERR_SUBRECIPE_NOT_ACTIVE]
          - state_machines[Recipe] UNDER_REVIEW -> ACTIVE
        distinguishing_aspect: "The parent's activation is guarded by a DIFFERENT entity's status: with a FRESH cost, a live component and a depth of 1, PLATE-CHEESE still cannot activate while its SUB-CHEESE child is DRAFT, and activating the child (which touches no cost figure) is enough to unblock it — the parent needs no second roll-up."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK priced at 22000000 in MW. Child SUB-CHEESE (SUB_RECIPE, GRAM, batch_yield 2000, portions 20) with cheddar at ep 500 -> ap 500, rolled up to batch round_half_up(500*22000000/2268) == 4850088 and portion 242504. Parent PLATE-CHEESE (PLATED, EACH, batch_yield 5, portions 5) with one SUB_RECIPE component at ep 500, rolled up to batch round_half_up(500*4850088/2000) == 1212522 and portion 242504 at depth 1, then sent UNDER_REVIEW. The child is deliberately left in DRAFT."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-CHEESE", name: "Cheese Sauce", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 2000, portions_per_batch: 20 }
              as: RecipeDeveloper
              captures: { child_id: $.data.id, child_v0: $.data.version }
            - call: "POST /culinary/recipes/${child_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${child_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${child_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { child_batch: $.data.batch_cost_micros, child_portion: $.data.portion_cost_micros }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-CHEESE", name: "Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 5, portions_per_batch: 5 }
              as: RecipeDeveloper
              captures: { parent_id: $.data.id, parent_v0: $.data.version }
            - call: "POST /culinary/recipes/${parent_id}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${child_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${parent_v0}" }
              as: RecipeDeveloper
              captures: { pcomp_id: $.data.id, pcomp_ap: $.data.ap_quantity_base_units }
            - call: "POST /culinary/recipes/${parent_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { parent_batch: $.data.batch_cost_micros, parent_portion: $.data.portion_cost_micros, parent_depth: $.data.depth }
            - call: "POST /culinary/recipes/${parent_id}/submit-review"
              as: RecipeDeveloper
          trigger:
            - call: "POST /culinary/recipes/${parent_id}/activate"
              as: CulinaryDirector
              captures: { err: $.data.error_id }
            - call: "POST /culinary/recipes/${child_id}/submit-review"
              as: RecipeDeveloper
              captures: { cst1: $.data.status }
            - call: "POST /culinary/recipes/${child_id}/activate"
              as: CulinaryDirector
              captures: { cst2: $.data.status, ccs: $.data.cost_state, cbatch: $.data.batch_cost_micros }
            - call: "POST /culinary/recipes/${parent_id}/activate"
              as: CulinaryDirector
              captures: { pst: $.data.status, pcs: $.data.cost_state, pbatch: $.data.batch_cost_micros }
          assert:
            - "${child_batch} == 4850088 and ${child_portion} == 242504"
            - "${pcomp_ap} == 500 — a SUB_RECIPE component copies ep into ap with no trim or shrink of its own"
            - "${parent_batch} == 1212522 == round_half_up(500 * 4850088 / 2000), ${parent_portion} == 242504 and ${parent_depth} == 1"
            - "${err} == ERR_SUBRECIPE_NOT_ACTIVE with HTTP 409 while the child is DRAFT; the parent stays UNDER_REVIEW and mints no prep guide (GET /culinary/recipes/${parent_id}/prep-guides returns 0 rows)"
            - "${cst1} == UNDER_REVIEW and ${cst2} == ACTIVE, with ${ccs} == FRESH and ${cbatch} == 4850088 — the child's own two transitions rewrite no cost figure"
            - "the final call returns HTTP 200 with ${pst} == ACTIVE, ${pcs} == FRESH and ${pbatch} == 1212522 — no second roll-up was needed"
            - "each recipe now has exactly one PrepGuide at revision_no 1 with sync_state CURRENT"

      - name: ingredient_retire_sets_retired_at_and_leaves_every_cost_state_untouched
        claim_type: side_effect_execution
        grounds:
          - state_machines[Ingredient] ACTIVE -> RETIRED
          - endpoints[POST /culinary/ingredients/{ingredient_id}/retire]
        distinguishing_aspect: "Retirement is a purchasing decision, not a specification change: retired_at is stamped with the logical clock and the version bumps, but the FRESH recipe cost, the FRESH plate cost, the published price row and the prep guide are all left exactly as they were — the one cascade this domain deliberately does NOT fire."
        test_recipe:
          setup:
            - "GRILL WORLD complete: recipe ACTIVE with batch 3880071 / portion 970018 FRESH, MenuItem MI-GRILL-MW (MW, price 400, declared_allergen_mask 1) ACTIVE with plate_cost_micros 1004259, plate_cost_cents 100, food_cost_bps 2500 and plate_cost_state FRESH. The clock still reads 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id, iv0: $.data.version }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
