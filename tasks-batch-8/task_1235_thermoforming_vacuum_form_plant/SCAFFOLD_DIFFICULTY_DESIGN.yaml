            - { call: "POST /tools", payload: { tool_code: "TI", part_number: "P-I", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1200.00 }, as: ToolingEngineer, captures: { tool_i: $.data.id } }
            - { call: "POST /tools/${tool_i}/complete-prototype", as: ToolingEngineer }
