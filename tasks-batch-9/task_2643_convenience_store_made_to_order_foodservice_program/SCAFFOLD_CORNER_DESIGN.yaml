        distinguishing_aspect: |
          StoreTerminal has an EMPTY exclusive_operations list, so every order-capture endpoint it uses is
          shared with Customer and neither role may be hard-coded as the only order writer. The two orders
          are built through the identical four-call sequence under different role headers and must reach the
