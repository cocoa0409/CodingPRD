scenario: |
  568. Grease-Trap & Kitchen-Hood Cleaning (FOG compliance): customer/site & equipment profile,
  scheduled service frequency, pump-out volume & manifest, hood-cleaning certificate & sticker
  (NFPA 96), FOG-compliance reporting to municipality, route dispatch, emergency call, recurring
  billing

domain_name: fog-compliance-service
api_prefix: "/"

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting of business identity in URL paths.
  # Reverse-reachability provided via sub-resource GETs and filtered list GETs.

  state_machine_shape: cyclic
  # WorkOrder (DISPATCHED->SCHEDULED recall loop) and ComplianceReport
  # (REJECTED->DRAFT revision loop) are both cyclic on different entities.

  relationship_patterns:
    - one_to_many        # Customer->Site, Site->Equipment, WorkOrder->PumpOutManifest
    - cross_aggregate    # ComplianceReport aggregates PumpOutManifest volume across a Site

  role_model: peer_roles
  # Admin owns account/asset setup; Dispatcher owns WorkOrder routing; Technician (entity-backed)
  # owns field artifacts; ComplianceOfficer owns municipal reports; BillingClerk owns invoices.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: business_name, type: string, source: input, description: "Food service establishment account name" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: credit_limit_cents, type: integer, source: input, default: 500000, description: "Maximum outstanding balance permitted before invoice issue is blocked" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED. SUSPENDED is a compliance hold set/lifted by cascade; CLOSED is terminal, set by Admin." }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "sum(Invoice.total_amount_cents WHERE status=ISSUED) - sum(Invoice.amount_paid_cents WHERE status IN {ISSUED}). Conserved-quantity target of compensating invariant invoice_void_conserves_balance." }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: address, type: string, source: input, description: "Physical site address" }
      - { name: municipality_code, type: string, source: input, description: "Jurisdiction code the site reports FOG compliance to" }
      - { name: permit_number, type: string, source: input, description: "Municipal FOG discharge permit number" }
      - { name: compliance_status, type: enum, source: computed, description: "COMPLIANT | AT_RISK | NON_COMPLIANT — as-of (chronological) derivation; see calculation site_compliance_grade" }
      - { name: projected_compliance_status, type: enum, source: computed, description: "COMPLIANT | AT_RISK | NON_COMPLIANT — forward-looking (30-day horizon) variant of site_compliance_grade" }
      - { name: last_certified_at, type: datetime, source: computed, description: "decision timestamp of the most recent ACCEPTED ComplianceReport for this site; null if none" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: equipment_type, type: enum, source: input, description: "GREASE_TRAP | HOOD" }
      - { name: capacity_gallons, type: number, source: input, description: "Grease trap capacity (gallons); informational for HOOD" }
      - { name: nominal_frequency_days, type: integer, source: input, description: "Scheduled service interval in days" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECOMMISSIONED. DECOMMISSIONED is terminal." }
      - { name: last_service_at, type: datetime, source: computed, description: "completed_at of the most recent COMPLETED WorkOrder for this equipment; null if never serviced" }
      - { name: next_service_due_at, type: datetime, source: computed, description: "last_service_at + nominal_frequency_days; null (treated as overdue) if never serviced" }
      - { name: service_state, type: enum, source: computed, description: "CURRENT | DUE_SOON | OVERDUE relative to logical clock; see equipment_service_schedule" }
      - { name: lifetime_pumped_gallons, type: number, source: computed, description: "sum(PumpOutManifest.volume_gallons) over this equipment's WorkOrders WHERE manifest.status=RECORDED. Conserved-quantity target of compensating invariant manifest_void_conserves_gallons." }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: billing_cycle, type: enum, source: input, description: "MONTHLY | QUARTERLY" }
      - { name: base_rate_cents, type: integer, source: input, description: "Recurring base fee per billing period, in cents" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Tax rate in basis points (e.g. 825 = 8.25%)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> SUSPENDED <-> ACTIVE -> CANCELLED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certification_level, type: enum, source: input, description: "BASIC | NFPA96_CERTIFIED. Only NFPA96_CERTIFIED may complete HOOD work and file HoodCertificates." }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | INACTIVE" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; nullable for EMERGENCY orders", default: null }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; assigned on dispatch, null while SCHEDULED", default: null }
      - { name: service_type, type: enum, source: input, description: "SCHEDULED | EMERGENCY" }
      - { name: priority, type: enum, source: input, default: ROUTINE, description: "ROUTINE | URGENT" }
      - { name: planned_start, type: datetime, source: input, description: "Service window start (ISO 8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Service window end (ISO 8601 UTC); must be > planned_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> DISPATCHED -> IN_PROGRESS -> COMPLETED; DISPATCHED -> SCHEDULED (recall); SCHEDULED|DISPATCHED -> CANCELLED" }
      - { name: actual_hours, type: number, source: input, default: null, description: "Labor hours reported at completion" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Base billable fee by equipment_type: GREASE_TRAP=12500, HOOD=17500 (constants)" }
      - { name: emergency_surcharge_cents, type: integer, source: computed, description: "8000 if service_type=EMERGENCY else 0" }
      - { name: completed_at, type: datetime, source: computed, description: "logical-clock timestamp when status became COMPLETED; null otherwise" }

  - name: PumpOutManifest
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id (must reference a GREASE_TRAP equipment work order)" }
      - { name: disposal_facility_name, type: string, source: input, description: "Receiving disposal facility name" }
      - { name: disposal_facility_permit, type: string, source: input, description: "Facility permit; must be non-empty and start with 'FAC-' to be valid" }
      - { name: hazmat_certified, type: boolean, source: input, description: "Whether the facility is hazmat-certified (adds a flat handling fee)" }
      - { name: volume_gallons, type: number, source: input, description: "Pumped-out volume in gallons" }
      - { name: fog_percentage, type: number, source: input, description: "Fats/oils/grease layer percentage measured; >= 25.0 breaches the 25% rule" }
      - { name: manifest_number, type: string, source: system, description: "Server-minted manifest tracking number" }
      - { name: compliance_flag, type: enum, source: computed, description: "COMPLIANT if fog_percentage < 25.0 else NON_COMPLIANT (25% rule boundary)" }
      - { name: disposal_fee_cents, type: integer, source: computed, description: "Tiered disposal fee; see calculation pump_out_disposal_fee" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VOIDED" }

  - name: HoodCertificate
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id (must reference a HOOD equipment work order)" }
      - { name: cleanliness_grade, type: enum, source: input, description: "BARE_METAL_CLEAN | ACCEPTABLE | FAILING (NFPA 96 inspection result)" }
      - { name: sticker_number, type: string, source: system, description: "Server-minted NFPA 96 sticker number" }
      - { name: issued_at, type: datetime, source: computed, description: "logical-clock timestamp at issuance" }
      - { name: valid_until, type: datetime, source: computed, description: "issued_at + equipment.nominal_frequency_days" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: municipality_code, type: string, source: input, description: "Jurisdiction the report is filed to" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> ACCEPTED | REJECTED; REJECTED -> DRAFT (revise); DRAFT -> CANCELLED" }
      - { name: pumped_gallons_total, type: number, source: computed, description: "sum(PumpOutManifest.volume_gallons) over the site's RECORDED manifests with completed_at in [period_start, period_end)" }
      - { name: included_manifest_count, type: integer, source: computed, description: "count of RECORDED manifests in the period" }
      - { name: decision_note, type: string, source: input, default: null, description: "Municipal decision note, set when recording ACCEPTED/REJECTED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; supplies base_rate and tax_rate", default: null }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ISSUED -> PAID; ISSUED -> VOID" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Forward-looking estimate at DRAFT (includes SCHEDULED/DISPATCHED/IN_PROGRESS/COMPLETED work orders); see calculation invoice_amount variant provisional" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Final subtotal at ISSUE: base_rate line + COMPLETED work-order lines" }
      - { name: tax_cents, type: integer, source: computed, description: "Sum of per-line rounded tax (round per line THEN sum)" }
      - { name: total_amount_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents; the finalized amount at ISSUE" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Amount recorded via record-payment" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade when a Site owned by this customer becomes NON_COMPLIANT"
        actor: system
        preconditions: ["at least one owned Site.compliance_status == NON_COMPLIANT"]
        side_effects: ["account_status = SUSPENDED"]
        note: "Set only by cascade, never by a direct endpoint."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: cascade when all owned Sites are no longer NON_COMPLIANT"
        actor: system
        preconditions: ["no owned Site.compliance_status == NON_COMPLIANT"]
        side_effects: ["account_status = ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /customers/{id}/close"
        actor: Admin
        preconditions: ["outstanding_balance_cents == 0 (ERR_INVALID_STATE otherwise)"]
        side_effects: ["account_status = CLOSED"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /customers/{id}/close"
        actor: Admin
        preconditions: ["outstanding_balance_cents == 0"]
        side_effects: ["account_status = CLOSED"]

  - entity: Equipment
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /equipment/{id}/decommission"
        actor: Admin
        preconditions: ["no non-terminal WorkOrder (status IN {SCHEDULED,DISPATCHED,IN_PROGRESS}) references this equipment (ERR_INVALID_STATE)"]
        side_effects: ["status = DECOMMISSIONED"]

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-contracts/{id}/transition {to_status: ACTIVE}"
        actor: Admin
        preconditions: []
        side_effects: ["status = ACTIVE"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-contracts/{id}/transition {to_status: SUSPENDED}"
        actor: Admin
        preconditions: []
        side_effects: ["status = SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-contracts/{id}/transition {to_status: ACTIVE}"
        actor: Admin
        preconditions: []
        side_effects: ["status = ACTIVE"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /service-contracts/{id}/transition {to_status: CANCELLED}"
        actor: Admin
        preconditions: []
        side_effects: ["status = CANCELLED"]

  - entity: WorkOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/transition {to_status: DISPATCHED, technician_id}"
        actor: Dispatcher
        preconditions:
          - "Equipment.status == ACTIVE (ERR_EQUIPMENT_DECOMMISSIONED) [cross-entity WorkOrder->Equipment]"
          - "referenced Technician exists and, for HOOD equipment, Technician.certification_level == NFPA96_CERTIFIED (ERR_TECHNICIAN_NOT_CERTIFIED) [business_safety]"
          - "the assigned technician has no other DISPATCHED/IN_PROGRESS WorkOrder whose [planned_start, planned_end) overlaps this one; touching at an endpoint (gap == 0) is allowed (ERR_TECHNICIAN_SCHEDULE_CONFLICT) [business_temporal, half-open]"
        side_effects: ["status = DISPATCHED", "technician_id set"]
      - from: DISPATCHED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/transition {to_status: SCHEDULED}"
        actor: Dispatcher
        preconditions: []
        side_effects: ["status = SCHEDULED", "technician_id cleared to null"]
        note: "Recall/unassign — cyclic edge that makes WorkOrder non-linear."
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/transition {to_status: IN_PROGRESS}"
        actor: Technician
        preconditions: ["acting Technician owns this order (WorkOrder.technician_id == X-User-ID)"]
        side_effects: ["status = IN_PROGRESS"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete {actual_hours}"
        actor: Technician
        preconditions:
          - "acting Technician owns this order (WorkOrder.technician_id == X-User-ID)"
          - "for GREASE_TRAP equipment: a RECORDED PumpOutManifest referencing this order exists (ERR_MANIFEST_REQUIRED) [business_constraint]"
          - "for HOOD equipment: a HoodCertificate referencing this order exists AND its cleanliness_grade != FAILING (ERR_CERTIFICATE_REQUIRED if missing; ERR_CLEANLINESS_FAILED if FAILING) [business_safety]"
        side_effects:
          - "status = COMPLETED; completed_at = logical clock now"
          - "CASCADE L1: Equipment.last_service_at = completed_at; Equipment.next_service_due_at recomputed (equipment_service_schedule)"
          - "CASCADE L2 (caused by the Equipment service update): Equipment.service_state recomputed; Site.compliance_status and Site.projected_compliance_status recomputed (site_compliance_grade)"
          - "CASCADE L3 (caused by the Site.compliance_status change): if the owning Customer is SUSPENDED and now has no NON_COMPLIANT site, Customer.account_status = ACTIVE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/transition {to_status: CANCELLED}"
        actor: Dispatcher
        preconditions: []
        side_effects: ["status = CANCELLED"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/transition {to_status: CANCELLED}"
        actor: Dispatcher
        preconditions: []
        side_effects: ["status = CANCELLED", "technician_id cleared"]

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Site.compliance_status != NON_COMPLIANT (ERR_INVALID_STATE) [cross-entity ComplianceReport->Site]"
        side_effects: ["status = SUBMITTED", "pumped_gallons_total and included_manifest_count frozen at submit time"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance-reports/{id}/record-decision {decision: ACCEPTED, decision_note?}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "status = ACCEPTED"
          - "CASCADE L1: Site.last_certified_at = logical clock now; Site.compliance_status recomputed"
          - "CASCADE L2 (caused by the Site.compliance_status change): if owning Customer is SUSPENDED and now has no NON_COMPLIANT site, Customer.account_status = ACTIVE"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance-reports/{id}/record-decision {decision: REJECTED, decision_note?}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["status = REJECTED"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /compliance-reports/{id}/revise"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["status = DRAFT"]
        note: "Revision loop — cyclic edge that makes ComplianceReport non-linear."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /compliance-reports/{id}/transition {to_status: CANCELLED}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["status = CANCELLED"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Customer.account_status != CLOSED (ERR_CUSTOMER_CLOSED) [cross-entity Invoice->Customer]"
          - "outstanding_balance_cents + total_amount_cents <= Customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED) [business_fiscal]"
        side_effects:
          - "status = ISSUED; final subtotal_cents/tax_cents/total_amount_cents frozen (invoice_amount variant final)"
          - "Customer.outstanding_balance_cents += total_amount_cents; Customer.version += 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/record-payment {amount_cents}"
        actor: BillingClerk
        preconditions: ["amount_cents == total_amount_cents (ERR_VALIDATION otherwise)"]
        side_effects:
          - "status = PAID; amount_paid_cents = amount_cents"
          - "Customer.outstanding_balance_cents -= total_amount_cents; Customer.version += 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "status = VOID"
          - "Customer.outstanding_balance_cents -= total_amount_cents (exactly reverses the ISSUE debit); Customer.version += 1"
        note: "Compensating action for the ISSUE debit — conserves Customer.outstanding_balance_cents."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /invoices"
    occ_field: "expected_customer_version"
    description: |
      Creating an Invoice for a customer whose version has advanced since the client last
      observed it is rejected. A newly created invoice supersedes any prior DRAFT invoice for
      the same billing period (the prior DRAFT is auto-VOID'd), so this captures the case where
      another writer has already created/superseded an invoice and advanced the customer's
      version, leaving the current writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pump_out_disposal_fee
    trigger: "POST /pump-out-manifests (manifest creation)"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered gallons cost (cents), 3 inputs: volume_gallons, fog_percentage, hazmat_certified
      g = volume_gallons
      gallons_cost = ( min(g,500) * 40
                     + max(0, min(g,1500) - 500) * 35
                     + max(0, g - 1500) * 30 )            # cents (per-gallon rates)
      fog_surcharge = round_half_up(gallons_cost * 0.20)  if fog_percentage >= 25.0 else 0
      hazmat_flat   = 5000 if hazmat_certified == true else 0
      disposal_fee_cents = gallons_cost + fog_surcharge + hazmat_flat
      # Example: g=2000, fog=25.0, hazmat=true ->
      #   gallons_cost = 500*40 + 1000*35 + 500*30 = 70000
      #   fog_surcharge = round(14000.0) = 14000 ; hazmat_flat = 5000 -> 89000
    input_set: "single manifest's own inputs; no aggregation"
    constants: { TIER1_MAX_GAL: 500, TIER2_MAX_GAL: 1500, RATE1_CENTS_PER_GAL: 40, RATE2_CENTS_PER_GAL: 35, RATE3_CENTS_PER_GAL: 30, FOG_SURCHARGE_PCT: 0.20, FOG_RULE_THRESHOLD: 25.0, HAZMAT_FLAT_CENTS: 5000 }
    precision: "integer cents; round_half_up on the fog_surcharge multiplication only"

  - name: fog_compliance_flag
    trigger: "POST /pump-out-manifests (manifest creation)"
    algorithm: threshold
    formula: |
      compliance_flag = COMPLIANT if fog_percentage < 25.0 else NON_COMPLIANT
      # boundary: 24.99 -> COMPLIANT ; 25.00 -> NON_COMPLIANT  (>= is the breach test)
    input_set: "single manifest fog_percentage"
    constants: { FOG_RULE_THRESHOLD: 25.0 }
    precision: "compare on raw decimal; threshold is inclusive (>=) for the breach"

  - name: invoice_amount
    trigger: "POST /invoices (provisional) and POST /invoices/{id}/issue (final)"
    algorithm: aggregation
    formula: |
      # A 'line' is: the contract base_rate (only if contract ACTIVE and base_rate_cents > 0),
      # plus one line per included WorkOrder with amount = service_fee_cents + emergency_surcharge_cents.
      # Rounding order is PINNED: round each line's tax first, THEN sum. (round-per-line, not sum-then-round.)
      tax_rate = contract.tax_rate_bps / 10000
      line_tax(a) = round_half_up(a * tax_rate)
      subtotal = sum(line_amounts)
      tax      = sum(line_tax(a) for each line a)         # round per line THEN sum
      total    = subtotal + tax
      # Example (round-per-line divergence): lines [12500, 12500], tax_rate_bps=825 ->
      #   line_tax(12500) = round(1031.25) = 1031 each ; tax = 2062 ; subtotal = 25000 ; total = 27062
      #   (sum-then-round would give round(2062.5)=2063 -> the pinned per-line order yields 2062)
    input_set: "WorkOrders for the invoice's customer with planned window / completed_at inside [period_start, period_end)"
    constants: { GREASE_TRAP_FEE_CENTS: 12500, HOOD_FEE_CENTS: 17500, EMERGENCY_SURCHARGE_CENTS: 8000 }
    precision: "integer cents; round_half_up per line, then sum"
    variants:
      - name: provisional
        when: "computed at DRAFT creation (provisional_total_cents)"
        difference: "includes WorkOrders with status IN {SCHEDULED, DISPATCHED, IN_PROGRESS, COMPLETED} in the period (forward-looking / projected)"
      - name: final
        when: "computed and frozen at ISSUE (subtotal_cents/tax_cents/total_amount_cents)"
        difference: "includes only WorkOrders with status == COMPLETED whose completed_at is in [period_start, period_end) (chronological / actual)"

  - name: site_compliance_grade
    trigger: "recomputed on WorkOrder completion, ComplianceReport acceptance, PumpOutManifest create/void, and Equipment service changes"
    algorithm: threshold
    formula: |
      now = logical clock
      overdue  = count(Equipment e at site WHERE e.status=ACTIVE AND (e.next_service_due_at IS NULL OR e.next_service_due_at < now))
      due_soon(horizon) = count(Equipment e at site WHERE e.status=ACTIVE AND now <= e.next_service_due_at < now + horizon)
      # as-of variant uses horizon = 7 days; projected variant uses horizon = 30 days
      grade(horizon):
        NON_COMPLIANT if overdue > 0
        else AT_RISK  if due_soon(horizon) > 0
        else COMPLIANT
      compliance_status            = grade(7 days)
      projected_compliance_status  = grade(30 days)
    input_set: "ACTIVE equipment at the site; excludes DECOMMISSIONED"
    constants: { AS_OF_HORIZON_DAYS: 7, PROJECTED_HORIZON_DAYS: 30 }
    precision: "day-granular datetime comparison against the logical clock"
    variants:
      - name: as_of
        when: "Site.compliance_status"
        difference: "7-day AT_RISK horizon (chronological, near-term)"
      - name: projected
        when: "Site.projected_compliance_status"
        difference: "30-day AT_RISK horizon (forward-looking); equipment due in 8-30 days is AT_RISK here but COMPLIANT under as_of"

  - name: equipment_service_schedule
    trigger: "WorkOrder completion for the equipment; recompute of service_state on clock advance"
    algorithm: threshold
    formula: |
      last_service_at    = completed_at of most recent COMPLETED WorkOrder for the equipment (null if none)
      next_service_due_at = last_service_at + nominal_frequency_days (null -> treated as overdue)
      service_state:
        OVERDUE   if next_service_due_at IS NULL OR next_service_due_at < now
        DUE_SOON  elif next_service_due_at < now + 7 days
        CURRENT   else
    input_set: "the equipment's COMPLETED WorkOrders"
    constants: { DUE_SOON_HORIZON_DAYS: 7 }
    precision: "datetime arithmetic in days"

  - name: customer_outstanding_balance
    trigger: "Invoice ISSUE (debit), VOID (credit), record-payment (credit)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(Invoice.total_amount_cents WHERE status == ISSUED)
      # ISSUE: += total_amount_cents ; PAID: invoice leaves ISSUED set so balance -= total ; VOID: -= total
      # Invariant: for any single invoice, ISSUE followed by VOID leaves outstanding_balance_cents unchanged.
    input_set: "Invoices in status ISSUED for the customer"
    constants: {}
    precision: "integer cents; exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix; entity-backed Technician must own the WorkOrder for start/complete"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and body FK references exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body shape valid: required fields present, enums in range, planned_end > planned_start, period_end > period_start, pagination limit in [1,100]"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST; pagination on all list GET"

  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity type/reference integrity: manifest work order must be GREASE_TRAP; certificate work order must be HOOD; disposal_facility_permit must start with 'FAC-'"
    error_id: ERR_EQUIPMENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /pump-out-manifests, POST /hood-certificates"

  - priority: 7
    category: business_safety
    check: "NFPA 96: only NFPA96_CERTIFIED technician may be dispatched to / complete a HOOD order; a HOOD order cannot complete when its certificate grade is FAILING"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /work-orders/{id}/transition (dispatch), POST /work-orders/{id}/complete"

  - priority: 8
    category: business_temporal
    check: "Equipment service buffer: a new WorkOrder window must be >= 24h from any other non-CANCELLED WorkOrder on the same equipment (buffered, adjacency forbidden)"
    error_id: ERR_EQUIPMENT_SERVICE_TOO_SOON
    http_status: 409
    applies_to: "POST /work-orders"

  - priority: 9
    category: business_temporal
    check: "Technician schedule: assigned technician's [planned_start, planned_end) must not overlap another DISPATCHED/IN_PROGRESS order (half-open; gap==0 allowed)"
    error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/transition (dispatch)"

  - priority: 10
    category: business_constraint
    check: "Equipment cross-state: WorkOrder dispatch requires Equipment.status == ACTIVE"
    error_id: ERR_EQUIPMENT_DECOMMISSIONED
    http_status: 409
    applies_to: "POST /work-orders/{id}/transition (dispatch)"

  - priority: 11
    category: business_constraint
    check: "Completion artifacts: GREASE_TRAP order needs a RECORDED manifest; HOOD order needs a certificate (not FAILING)"
    error_id: ERR_MANIFEST_REQUIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/complete"

  - priority: 12
    category: business_fiscal
    check: "Invoice must have >= 1 billable line for the final variant; zero completed work and no positive base rate -> no billable activity"
    error_id: ERR_NO_BILLABLE_ACTIVITY
    http_status: 422
    applies_to: "POST /invoices/{id}/issue"

  - priority: 13
    category: business_fiscal
    check: "Invoice issue: Customer not CLOSED, and outstanding + total <= credit_limit"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /invoices/{id}/issue"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_customer_version must equal the customer's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /invoices"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a Customer (account) — account_status defaults to ACTIVE, outstanding_balance_cents to 0"
    roles: [Admin]
    code: 201
    input: [business_name, billing_email, "credit_limit_cents?"]
    output: Customer
    side_effects: ["account_status=ACTIVE", "version=1"]

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a Customer (read current version for OCC)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer, BillingClerk]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/sites"
    description: "List Sites owned by a Customer (reverse of Site.customer_id)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/contracts"
    description: "List ServiceContracts owned by a Customer (reverse of ServiceContract.customer_id)"
    roles: [Admin, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/close"
    description: "Close a Customer account (requires zero outstanding balance)"
    roles: [Admin]
    code: 200
    input: []
    output: Customer
    side_effects: ["account_status=CLOSED"]

  # --- Site ---
  - method: POST
    path: "/sites"
    description: "Create a Site under a Customer"
    roles: [Admin]
    code: 201
    input: [customer_id, address, municipality_code, permit_number]
    output: Site
    side_effects: ["compliance_status=COMPLIANT (no equipment yet)"]

  - method: GET
    path: "/sites/{id}"
    description: "Fetch a Site (includes computed compliance_status / projected_compliance_status)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer, BillingClerk]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/sites/{id}/equipment"
    description: "List Equipment at a Site (reverse of Equipment.site_id)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Equipment[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/compliance-reports"
    description: "List ComplianceReports for a Site (reverse of ComplianceReport.site_id)"
    roles: [Admin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceReport[]
    side_effects: []

  # --- Equipment ---
  - method: POST
    path: "/equipment"
    description: "Create Equipment (grease trap or hood) at a Site"
    roles: [Admin]
    code: 201
    input: [site_id, equipment_type, capacity_gallons, nominal_frequency_days]
    output: Equipment
    side_effects: ["status=ACTIVE", "service_state=OVERDUE (never serviced)", "site compliance recomputed"]

  - method: GET
    path: "/equipment/{id}"
    description: "Fetch Equipment (includes last_service_at, next_service_due_at, lifetime_pumped_gallons)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer, BillingClerk]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: GET
    path: "/equipment/{id}/work-orders"
    description: "List WorkOrders for a piece of Equipment (reverse of WorkOrder.equipment_id)"
    roles: [Admin, Dispatcher, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/equipment/{id}/decommission"
    description: "Decommission Equipment (no open work orders allowed)"
    roles: [Admin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["status=DECOMMISSIONED"]

  # --- ServiceContract ---
  - method: POST
    path: "/service-contracts"
    description: "Create a ServiceContract for a Customer (status DRAFT)"
    roles: [Admin]
    code: 201
    input: [customer_id, billing_cycle, base_rate_cents, tax_rate_bps]
    output: ServiceContract
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/service-contracts/{id}"
    description: "Fetch a ServiceContract"
    roles: [Admin, BillingClerk]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: POST
    path: "/service-contracts/{id}/transition"
    description: "Transition a ServiceContract (ACTIVE / SUSPENDED / CANCELLED)"
    roles: [Admin]
    code: 200
    input: [to_status]
    output: ServiceContract
    side_effects: ["status updated"]

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Create a Technician (role identity for entity_backed Technician role)"
    roles: [Admin]
    code: 201
    input: [full_name, certification_level]
    output: Technician
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/technicians/{id}"
    description: "Fetch a Technician"
    roles: [Admin, Dispatcher, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Create a WorkOrder (SCHEDULED). Enforces the equipment 24h service buffer."
    roles: [Dispatcher]
    code: 201
    input: [site_id, equipment_id, service_type, planned_start, planned_end, "contract_id?", "priority?"]
    output: WorkOrder
    side_effects: ["status=SCHEDULED", "service_fee_cents/emergency_surcharge_cents computed"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a WorkOrder"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer, BillingClerk]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List WorkOrders (filtered). Reverse-reachability for site_id, equipment_id, technician_id, contract_id."
    roles: [Admin, Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["site_id?", "equipment_id?", "technician_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/pump-out-manifests"
    description: "List PumpOutManifests for a WorkOrder (reverse of PumpOutManifest.work_order_id)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PumpOutManifest[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/hood-certificates"
    description: "List HoodCertificates for a WorkOrder (reverse of HoodCertificate.work_order_id)"
    roles: [Admin, Dispatcher, Technician, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: HoodCertificate[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/transition"
    description: "Transition a WorkOrder: DISPATCHED (with technician_id) / SCHEDULED (recall) / IN_PROGRESS / CANCELLED"
    roles: [Dispatcher, Technician]
    code: 200
    input: [to_status, "technician_id?"]
    output: WorkOrder
    side_effects: ["status updated; technician assignment/clearing; schedule + safety + equipment-state checks on dispatch"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete an IN_PROGRESS WorkOrder (Technician owner). Triggers the equipment->site->customer cascade."
    roles: [Technician]
    code: 200
    input: [actual_hours]
    output: WorkOrder
    side_effects:
      - "status=COMPLETED; completed_at set"
      - "Equipment.last_service_at/next_service_due_at recomputed -> Site compliance recomputed -> Customer suspension possibly lifted"

  # --- PumpOutManifest ---
  - method: POST
    path: "/pump-out-manifests"
    description: "File a pump-out manifest against a GREASE_TRAP work order. Computes disposal_fee_cents and compliance_flag."
    roles: [Technician]
    code: 201
    input: [work_order_id, disposal_facility_name, disposal_facility_permit, hazmat_certified, volume_gallons, fog_percentage]
    output: PumpOutManifest
    side_effects: ["status=RECORDED", "Equipment.lifetime_pumped_gallons += volume_gallons", "site compliance recomputed"]

  - method: POST
    path: "/pump-out-manifests/{id}/void"
    description: "Void a RECORDED manifest (compensating action; restores Equipment.lifetime_pumped_gallons)"
    roles: [Technician, ComplianceOfficer]
    code: 200
    input: []
    output: PumpOutManifest
    side_effects: ["status=VOIDED", "Equipment.lifetime_pumped_gallons -= volume_gallons"]

  # --- HoodCertificate ---
  - method: POST
    path: "/hood-certificates"
    description: "Issue an NFPA 96 hood-cleaning certificate & sticker for a HOOD work order (Technician must be NFPA96_CERTIFIED)"
    roles: [Technician]
    code: 201
    input: [work_order_id, cleanliness_grade]
    output: HoodCertificate
    side_effects: ["sticker_number minted", "issued_at/valid_until computed"]

  # --- ComplianceReport ---
  - method: POST
    path: "/compliance-reports"
    description: "Draft a FOG-compliance report for a Site + municipality + period"
    roles: [ComplianceOfficer]
    code: 201
    input: [site_id, municipality_code, period_start, period_end]
    output: ComplianceReport
    side_effects: ["status=DRAFT", "pumped_gallons_total/included_manifest_count computed"]

  - method: POST
    path: "/compliance-reports/{id}/submit"
    description: "Submit a DRAFT report to the municipality (requires Site not NON_COMPLIANT)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status=SUBMITTED"]

  - method: POST
    path: "/compliance-reports/{id}/record-decision"
    description: "Record the municipality's decision (ACCEPTED or REJECTED). ACCEPTED triggers site->customer cascade."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: ComplianceReport
    side_effects: ["status=ACCEPTED|REJECTED", "on ACCEPTED: Site.last_certified_at set; compliance recomputed; customer suspension possibly lifted"]

  - method: POST
    path: "/compliance-reports/{id}/revise"
    description: "Return a REJECTED report to DRAFT for revision (cyclic)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/compliance-reports/{id}/transition"
    description: "Cancel a DRAFT ComplianceReport"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: ComplianceReport
    side_effects: ["status=CANCELLED"]

  # --- Invoice ---
  - method: POST
    path: "/invoices"
    description: "Create a DRAFT invoice for a Customer+period. OCC on Customer.version; supersedes any prior DRAFT for the same period."
    roles: [BillingClerk]
    code: 201
    input: [customer_id, period_start, period_end, expected_customer_version, "contract_id?"]
    output: Invoice
    side_effects: ["status=DRAFT", "provisional_total_cents computed", "increments Customer.version by 1", "prior DRAFT invoice for same period auto-VOID"]

  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an Invoice"
    roles: [Admin, BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List Invoices (filtered). Reverse-reachability for customer_id and contract_id."
    roles: [Admin, BillingClerk]
    code: 200
    input: ["customer_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice (freezes final amount; debits customer balance)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=ISSUED", "final amount frozen", "Customer.outstanding_balance_cents += total; Customer.version += 1"]

  - method: POST
    path: "/invoices/{id}/record-payment"
    description: "Record full payment on an ISSUED invoice"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["status=PAID", "Customer.outstanding_balance_cents -= total; Customer.version += 1"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an ISSUED invoice (compensating action; reverses the balance debit)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=VOID", "Customer.outstanding_balance_cents -= total; Customer.version += 1"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (drives next_service_due comparisons, completed_at, valid_until). Server startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; equipment service_state and site compliance recomputed on read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or Technician acting on a WorkOrder it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, out-of-range enum, planned_end<=planned_start, period_end<=period_start, or payment amount mismatch" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal-state lockdown, submit blocked by NON_COMPLIANT site, close with non-zero balance)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_customer_version does not match the customer's current version" }
  - { id: ERR_VERSION_REQUIRED, http: 400, condition: "expected_customer_version missing on invoice create" }
  - { id: ERR_EQUIPMENT_DECOMMISSIONED, http: 409, condition: "WorkOrder dispatch attempted against DECOMMISSIONED equipment" }
  - { id: ERR_CUSTOMER_CLOSED, http: 409, condition: "Invoice issue attempted for a CLOSED customer" }
  - { id: ERR_TECHNICIAN_NOT_CERTIFIED, http: 422, condition: "Non-NFPA96_CERTIFIED technician dispatched to / completing a HOOD order" }
  - { id: ERR_CLEANLINESS_FAILED, http: 422, condition: "HOOD order completion blocked because its certificate cleanliness_grade is FAILING" }
  - { id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http: 409, condition: "Assigned technician's window overlaps another DISPATCHED/IN_PROGRESS order (half-open overlap)" }
  - { id: ERR_EQUIPMENT_SERVICE_TOO_SOON, http: 409, condition: "New WorkOrder window within the 24h buffer of another non-CANCELLED order on the same equipment" }
  - { id: ERR_MANIFEST_REQUIRED, http: 422, condition: "GREASE_TRAP order completion with no RECORDED manifest" }
  - { id: ERR_CERTIFICATE_REQUIRED, http: 422, condition: "HOOD order completion with no HoodCertificate" }
  - { id: ERR_EQUIPMENT_TYPE_MISMATCH, http: 422, condition: "Manifest filed on a non-GREASE_TRAP order, or certificate on a non-HOOD order" }
  - { id: ERR_DISPOSAL_FACILITY_INVALID, http: 422, condition: "disposal_facility_permit missing or not prefixed 'FAC-'" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Invoice issue would push outstanding balance above the customer credit limit" }
  - { id: ERR_NO_BILLABLE_ACTIVITY, http: 422, condition: "Invoice issue with zero billable lines (no completed work and no positive base rate)" }
  - { id: ERR_MANIFEST_ALREADY_VOIDED, http: 409, condition: "Void attempted on an already-VOIDED manifest" }
  - { id: ERR_REPORT_PERIOD_INVALID, http: 422, condition: "ComplianceReport/Invoice period_end <= period_start" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit outside [1,100] or offset < 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Operator managing accounts, sites, equipment, contracts, technicians, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers — create customer"
      - "POST /customers/{id}/close — close account"
      - "POST /sites — create site"
      - "POST /equipment — create equipment"
      - "POST /equipment/{id}/decommission — decommission equipment"
      - "POST /service-contracts — create contract"
      - "POST /service-contracts/{id}/transition — contract lifecycle"
      - "POST /technicians — create technician"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads across resources"

  - name: Dispatcher
    description: "Routes and dispatches work orders to technicians"
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders — create work order"
      - "POST /work-orders/{id}/transition — dispatch/recall/cancel (SCHEDULED/DISPATCHED transitions)"
    shared_operations:
      - "POST /work-orders/{id}/transition — IN_PROGRESS shared with Technician (server enforces from-state + role)"
      - "GET work-order reads"

  - name: Technician
    description: "Field technician performing services and filing manifests/certificates; acts only on owned work orders"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /work-orders/{id}/complete — complete owned order"
      - "POST /pump-out-manifests — file manifest"
      - "POST /hood-certificates — issue NFPA 96 certificate"
      - "POST /pump-out-manifests/{id}/void — void manifest"
    shared_operations:
