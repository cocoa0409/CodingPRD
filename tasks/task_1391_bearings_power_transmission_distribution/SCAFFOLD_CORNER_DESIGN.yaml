            - "err == ERR_INSUFFICIENT_PERMISSIONS (403); consumption remains REPORTED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_price_file_publish_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[price-file-publish-stale-product]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Second publish carrying the pre-first-publish Product.version is rejected 412; re-reading the product and resubmitting with the fresh version succeeds and supersedes PF1."
        test_recipe:
          setup: ["product v1; PF1 published with expected_product_version 1 (product now v2)"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6050", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id, p_v1: $.data.version }
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 1500, effective_at: "2026-08-10T00:00:00Z", expected_product_version: "${p_v1}" }
              as: PricingAnalyst
              captures: { pf1_id: $.data.id }
          trigger:
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 1600, effective_at: "2026-08-12T00:00:00Z", expected_product_version: "${p_v1}" }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /motion/products/${p_id}"
              payload: {}
              as: Any
              captures: { p_v2: $.data.version }
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 1600, effective_at: "2026-08-12T00:00:00Z", expected_product_version: "${p_v2}" }
              as: PricingAnalyst
              captures: { pf2_id: $.data.id }
          assert:
            - "Stale publish: err == ERR_STALE_VERSION (HTTP 412); no second PENDING file created"
            - "Fresh publish succeeds: PriceFileVersion.${pf2_id}.status == PENDING"
            - "PriceFileVersion.${pf1_id}.status == SUPERSEDED"

      - name: occ_order_reprice_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[order-reprice-stale-version]"
          - "errors[ERR_STALE_VERSION]"
          - "calculations.contract_lag_unit_price"
        distinguishing_aspect: "Reprice with the creation-time version after confirm advanced the order fails 412; the re-based reprice succeeds and picks up a newly ACTIVE 10% contract (unit 10000 -> 9000), proving OCC guards real repricing semantics."
        test_recipe:
          setup: ["order confirmed at unit 10000 (version 1 at create, advanced by line-add and confirm); contract 10% LIST_LESS activated afterwards"]
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6051", description: "b", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "OCC-35", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "OCC Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id, o_v1: $.data.version }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "GET /motion/orders/${o_id}"
              payload: {}
              as: Any
              captures: { o_v_now: $.data.version }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.10, lag_protection_days: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { ct_id: $.data.id }
            - call: "POST /motion/contracts/${ct_id}/activate"
              payload: {}
              as: ContractAdministrator
          trigger:
            - call: "POST /motion/orders/${o_id}/reprice"
              payload: { expected_order_version: "${o_v1}" }
              as: CounterSalesRep
              captures: { err: $.data.error_id }
            - call: "POST /motion/orders/${o_id}/reprice"
              payload: { expected_order_version: "${o_v_now}" }
              as: CounterSalesRep
              captures: { tot: $.data.total_cents }
          assert:
            - "Stale reprice: err == ERR_STALE_VERSION (HTTP 412)"
            - "Re-based reprice succeeds: tot == 9000 (newly ACTIVE 10% LIST_LESS contract applied to the 2026-08-01 anchor)"
            - "OrderLine.${l_id}.unit_price_cents == 9000"

      - name: occ_agreement_amend_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[agreement-amend-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A consumption report silently advances the agreement's version; an amendment carrying the pre-consumption version fails 412, and the re-based amendment adjusts branch stock by the delta (10 -> 12 pulls 2 more units off the shelf)."
        test_recipe:
          setup: ["stock on_hand 20; agreement consigned 10 (on_hand 10, version 1); consumption qty 4 reported (version now 2)"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6052", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "OCA-36", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "OCC Consign Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 20, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${p_id}", consigned_qty: 10 }
              as: ContractAdministrator
              captures: { a_id: $.data.id, a_v1: $.data.version }
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 4 }
              as: CustomerPlant
              as_user_id: "${c_id}"
          trigger:
            - call: "PATCH /motion/consignment-agreements/${a_id}"
              payload: { consigned_qty: 12, expected_agreement_version: "${a_v1}" }
              as: ContractAdministrator
              captures: { err: $.data.error_id }
            - call: "GET /motion/consignment-agreements/${a_id}"
              payload: {}
              as: Any
              captures: { a_v2: $.data.version }
            - call: "PATCH /motion/consignment-agreements/${a_id}"
              payload: { consigned_qty: 12, expected_agreement_version: "${a_v2}" }
              as: ContractAdministrator
              captures: { cq: $.data.consigned_qty, rq: $.data.remaining_qty }
          assert:
            - "Stale amend: err == ERR_STALE_VERSION (HTTP 412); consigned_qty unchanged"
            - "Re-based amend: cq == 12 and rq == 8 (12 - 4 consumed)"
            - "BranchStock.${bs_id}.on_hand_qty == 8 (delta +2 pulled from shelf: 20 - 10 - 2)"

      - name: scheduled_reservation_expiry_exact_boundary
        claim_type: scheduled_actions
        grounds:
          - "state_machines.StockReservation.ACTIVE_to_EXPIRED"
          - "entities.StockReservation.fields.expires_at"
        distinguishing_aspect: "Expiry uses strict-greater semantics: at clock == expires_at the reservation is still ACTIVE; one second later it is EXPIRED with the full line/order revert cascade."
        test_recipe:
          setup: ["confirmed order line qty 2 reserved at 2026-08-01T10:00:00Z (expires 2026-08-04T10:00:00Z)"]
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6053", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "EXP-37", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Expiry Reservation Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 5, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 2 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 2 }
              as: CounterSalesRep
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00Z" }
              as: SystemAdmin
            - call: "GET /motion/stock-reservations/${r_id}"
              payload: {}
              as: Any
              captures: { st_at: $.data.status }
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:01Z" }
              as: SystemAdmin
            - call: "GET /motion/stock-reservations/${r_id}"
              payload: {}
              as: Any
              captures: { st_past: $.data.status }
          assert:
            - "st_at == ACTIVE (clock == expires_at is not yet expired: strict > semantics)"
            - "st_past == EXPIRED one second later, with line reverted to PENDING_SOURCING"

      - name: derived_open_receivables_multi_source_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.open_receivables_reconciliation"
          - "entities.CustomerAccount.fields.open_receivables_cents"
        distinguishing_aspect: "The derived field reconciles heterogeneous sources eagerly: order invoice (+10000), partial payment (-2500), consignment invoice (+2000), consumption credit (-2000) — each mutation's resulting balance is pinned."
        test_recipe:
