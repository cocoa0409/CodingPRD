        distinguishing_aspect: "AgentStatement and StatementAdjustment are the two machines nobody creates directly: the statement is auto-upserted by the posting cascade and starts DRAFT/UNSETTLED on BOTH dimensions with issued_at, paid_on and hold_reason null, and an adjustment proposed against it starts PROPOSED with approved_by_user_id and info_request_note null."
        test_recipe:
          setup: ["CORNER-BASE: program P1 (NET_REVENUE_SPLIT, NO_MINIMUM), agent A1 (split 0.50, no parent), ACTIVE merchant M1 (equipment 1000), one 2026-07 line, normalized and posted."]
