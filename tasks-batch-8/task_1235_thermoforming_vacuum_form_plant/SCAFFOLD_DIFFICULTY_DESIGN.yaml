            - { call: "POST /tools", payload: { tool_code: "TPK", part_number: "P-PK", tool_type: MATCHED_SET, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1200.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-P", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-P", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OP", part_number: "P-PK", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /packaging-specs/${spec_id}/decide", payload: { decision: REJECTED }, as: PlantManager }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 28, shots_planned: 100 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 100, scrap_weight_kg: 0.000, actual_end: "2026-05-02T11:00:00Z" }, as: ProductionScheduler }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", booth_id: "${booth_id}", inspection_type: FINAL, scheduled_start: "2026-05-02T12:00:00Z", scheduled_end: "2026-05-02T12:30:00Z", wall_measurements_mm: [1.240, 1.250] }, as: QualityInspector, as_user_id: qi-1, captures: { insp_id: $.data.id } }
            - { call: "POST /quality-inspections/${insp_id}/disposition", payload: { disposition: PASS }, as: QualityInspector, as_user_id: qi-2 }
            - { call: "POST /assembly-tasks", payload: { production_order_id: "${order_id}", task_type: TRIM, sequence_no: 1 }, as: ProductionScheduler, captures: { task_trim: $.data.id } }
            - { call: "POST /assembly-tasks", payload: { production_order_id: "${order_id}", task_type: PACK, sequence_no: 2 }, as: ProductionScheduler, captures: { task_pack: $.data.id } }
            - { call: "POST /assembly-tasks/${task_trim}/complete", as: ProductionScheduler }
          trigger:
            - { call: "POST /assembly-tasks/${task_pack}/complete", as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "GET /assembly-tasks/${task_pack}", as: Any, captures: { pack_st: $.data.status } }
          assert:
            - "error_id == ERR_PACK_SPEC_NOT_APPROVED (captured ${err}) — spec ${spec_id} is REJECTED"
            - "AssemblyTask.${task_pack}.status == PENDING (captured ${pack_st}) — no transition"
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_half_open_adjacency_vs_overlap
        grounds:
          - calculations.station_window_overlap
          - errors[ERR_STATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource FormingStation with pure half-open interval semantics:
          [10:00,11:00) then [11:00,12:00) is allowed (adjacency touches but
          does not intersect), while [10:30,11:30) strictly intersects and is
          rejected. No buffer exists in this semantic.
        test_recipe:
          setup:
            - "RUNNING INDUSTRIAL order O-S on station ST-H"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LS", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TS", part_number: "P-S", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1200.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-S", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-H", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OS", part_number: "P-S", resin_type: PETG, ordered_qty: 150, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 9.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
          trigger:
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 100 }, as: ProductionScheduler, captures: { run1: $.data.id } }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T11:00:00Z", planned_end: "2026-05-02T12:00:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 100 }, as: ProductionScheduler, captures: { run2: $.data.id } }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:30:00Z", planned_end: "2026-05-02T11:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 100 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "Run 1 [10:00,11:00) created (id ${run1}) and run 2 [11:00,12:00) created (id ${run2}) — adjacency allowed under half-open semantics"
            - "Run 3 [10:30,11:30) rejected: error == ERR_STATION_WINDOW_OVERLAP (captured ${err})"
      - name: booth_industrial_turnover_buffer
        grounds:
          - calculations.booth_window_schedule
          - errors[ERR_BOOTH_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Resource InspectionBooth with a grade-dependent turnover buffer — a
          different interval semantic from the station's bare half-open rule:
          after an INDUSTRIAL-grade session ending 11:00, a FOOD session at
          11:15 is rejected (needs >= 30 min) while one at exactly 11:30 is
          allowed (inclusive buffer boundary).
        test_recipe:
          setup:
            - "INDUSTRIAL order O-I and FOOD order O-F both RUNNING, each with one COMPLETED run; booth B-G (MEDICAL) hosts O-I's RECORDED inspection 10:00-11:00"
