      - name: audit_assessment_cascade_depth_three_liability_to_writeoff_to_reservation_release
        grounds:
          - state_machines.CustomsAudit.SUBMITTED_to_CLOSED_ASSESSED
          - state_machines.PreOrder.RESERVED_to_RELEASED
          - calculations.unaccounted_goods_duty_assessment
          - calculations.bonded_duty_suspended_value
          - entities.Terminal.fields.unaccounted_duty_liability_cents
        distinguishing_aspect: |
          Depth 3, triggered by POST /customs-audits/{audit_id}/close — a different trigger and a
          different chain from the pickup cascade: the 130560-cent duty liability booked on the
          Terminal (L1) causes the SHRINKAGE_WRITE_OFF that drops on_hand_qty 100 -> 30 (L2),
          which in turn forces the 60-unit RESERVED pre-order to RELEASED because reserved_qty
          now exceeds on_hand_qty (L3).
