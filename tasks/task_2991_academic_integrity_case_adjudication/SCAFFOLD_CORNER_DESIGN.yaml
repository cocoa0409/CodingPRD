          rationale: "The SCHEDULED->CONVENED transition's guard on a sibling entity's state is the named §1.8 instance."

      - name: informal_decline_flips_the_pathway_and_re_derives_severity_corner_stub
        claim_type: Conditional cascade
        grounds:
