            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct-2026", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/illustrations", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, as_user_id: "officer-1", captures: { ill_id: $.data.id } }
            - { call: "POST /giving/illustrations/${ill_id}/book", payload: {}, as: GiftOfficer, as_user_id: "officer-1", captures: { ag_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "RETIRE" }, as: ComplianceOfficer }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag_id}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
            - { call: "GET /giving/gift-agreements/${ag_id}", payload: {}, as: GiftAdministrator, captures: { st: $.data.status } }
          assert:
            - "execute returns ${err} == ERR_RATE_TABLE_NOT_ACTIVE (409)"
            - "GiftAgreement.${ag_id}.status remains DRAFT (${st})"
            - "The safety gates would have passed (deduction 3768895 >= 10% of 10000000), isolating the cross-entity rate-table dependency as the sole failure"

  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_table_half_open_window_adjacency
        grounds:
          - validations[priority=17]
          - entities.RateTable.fields.effective_to
        distinguishing_aspect: |
          Resource RateTable registry, HALF-OPEN interval semantics
          [effective_from, effective_to): a table starting exactly at another's
          effective_to is accepted (adjacency is not overlap), while a one-month
          intersection or an open-ended (null effective_to = +infinity) overlap is
          rejected ERR_RATE_WINDOW_OVERLAP.
        test_recipe:
          setup: ["Empty rate-table registry"]
          setup_api_calls:
            - { call: "POST /giving/rate-tables", payload: { label: "H1-2026", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }, as: ComplianceOfficer, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /giving/rate-tables", payload: { label: "overlap-June", discount_rate_bps: 520, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /giving/rate-tables", payload: { label: "H2-2026", discount_rate_bps: 520, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { t3: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "open-ended", discount_rate_bps: 540, effective_from: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer, captures: { err_inf: $.data.error_id } }
          assert:
            - "Intersecting window rejected: ${err_overlap} == ERR_RATE_WINDOW_OVERLAP (409)"
            - "Adjacent window (from == prior to) accepted: table ${t3} created in DRAFT — half-open semantics"
            - "Open-ended window overlapping H2-2026 rejected: ${err_inf} == ERR_RATE_WINDOW_OVERLAP (409) — null effective_to reads as +infinity"

      - name: valuation_run_closed_interval_touch_rejected
        grounds:
          - validations[priority=19]
          - state_machines.ValuationRun.DRAFT_to_POSTED
        distinguishing_aspect: |
          Resource ValuationRun fiscal calendar, CLOSED interval semantics
          [coverage_start, coverage_end]: a second POSTED run whose window merely
          TOUCHES the first at a single shared date (2026-06-30) is rejected
          ERR_VALUATION_WINDOW_OVERLAP — opposite adjacency treatment from the
          half-open rate-table windows; a window starting the next day posts fine.
        test_recipe:
          setup:
            - "ACTIVE 5% rate table open-ended from 2026-01-01 (covers both valuation dates)"
            - "Run-1 coverage [2026-01-01, 2026-06-30], valuation_date 2026-03-01, POSTED (co-1 creates, co-2 posts)"
          setup_api_calls:
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/valuation-runs", payload: { coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z", valuation_date: "2026-03-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id } }
            - { call: "POST /giving/valuation-runs/${r1}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2", captures: { r1_status: $.data.status, r1_cnt: $.data.agreements_revalued_count } }
          trigger:
            - { call: "POST /giving/valuation-runs", payload: { coverage_start: "2026-06-30T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", valuation_date: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r2: $.data.id } }
            - { call: "POST /giving/valuation-runs/${r2}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2", captures: { err_touch: $.data.error_id } }
            - { call: "POST /giving/valuation-runs", payload: { coverage_start: "2026-07-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", valuation_date: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r3: $.data.id } }
            - { call: "POST /giving/valuation-runs/${r3}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2", captures: { r3_status: $.data.status } }
          assert:
            - "Run-1 posted: ${r1_status} == POSTED with agreements_revalued_count == 0 (${r1_cnt})"
            - "Run-2 sharing the single boundary date 2026-06-30 rejected: ${err_touch} == ERR_VALUATION_WINDOW_OVERLAP (409) — closed-interval touch IS overlap"
            - "Run-3 starting 2026-07-01 posts: ${r3_status} == POSTED"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_adjustment_contribution_withdrawal_neutral
        grounds:
          - concurrency_rules[reserve-adjust-stale-version]
          - entities.ReserveFund.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = reserve CASH balance: a CONTRIBUTION of 500000
          followed by a WITHDRAWAL of 500000 leaves ReserveFund.balance_cents
          bit-identical (7570148) and coverage/posture unchanged; each step is
          OCC-guarded so the pair is applied against current versions.
        test_recipe:
          setup:
            - "Donor D; 5% ACTIVE table; CGA (gift 10000000, 600bps, QUARTERLY, age 80) FUNDED; balance 7570148 == booked target (coverage 10000, SOLVENT)"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Invariant Cash", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { cga_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${cga_id}", slot: "PRIMARY_1", beneficiary_name: "Self", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { rf_v: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 7570148, expected_reserve_fund_version: "${rf_v}" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements/${cga_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${cga_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
          trigger:
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { bal0: $.data.balance_cents, v0: $.data.version, cov0: $.data.booked_coverage_bps } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 500000, expected_reserve_fund_version: "${v0}" }, as: ComplianceOfficer, captures: { bal1: $.data.balance_cents, v1: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "WITHDRAWAL", amount_cents: 500000, expected_reserve_fund_version: "${v1}" }, as: ComplianceOfficer, captures: { bal2: $.data.balance_cents, v2: $.data.version, cov2: $.data.booked_coverage_bps, post2: $.data.posture } }
          assert:
            - "balance before pair == 7570148 (${bal0}); after CONTRIBUTION == 9584789 (${bal1})"
            - "INVARIANT: after the compensating WITHDRAWAL, balance_cents == 7570148 (${bal2}) == ${bal0} exactly"
            - "coverage returns to 10000 (${cov2}) and posture == SOLVENT (${post2})"
            - "version advanced exactly twice: ${v2} == ${v0} + 2"

      - name: annuity_obligation_pay_lapse_conservation
        grounds:
          - entities.GiftAgreement.fields.total_scheduled_cents
          - entities.GiftAgreement.fields.total_paid_cents
          - entities.GiftAgreement.fields.liability_released_cents
          - state_machines.AnnuityPayment.DUE_to_PAID
        distinguishing_aspect: |
          Conserved quantity = scheduled OBLIGATION mass (distinct from cash):
          total_paid + sum(remaining SCHEDULED/DUE/DEFERRED) + liability_released
          == total_scheduled (199800) after a PAY and a LAPSE — paying or lapsing
          reallocates the mass without creating or destroying it.
        test_recipe:
          setup:
            - "CRAT (gift 1665017, 600bps, MONTHLY, age 98, funding_month 2026-08) ACTIVE: 24 payments @8325, total_scheduled 199800; clock at 2026-09-01 so payment 1 is DUE"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Invariant Obligation", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag_id}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag_id}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator, captures: { p1: "$.data[0].id" } }
          trigger:
            - { call: "POST /giving/annuity-payments/${p1}/transition", payload: { action: "PAY" }, as: GiftAdministrator }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "SCHEDULED" }, as: GiftAdministrator, captures: { p2: "$.data[0].id" } }
            - { call: "POST /giving/annuity-payments/${p2}/transition", payload: { action: "LAPSE" }, as: GiftAdministrator }
            - { call: "GET /giving/gift-agreements/${ag_id}", payload: {}, as: GiftAdministrator, captures: { paid: $.data.total_paid_cents, released: $.data.liability_released_cents, total: $.data.total_scheduled_cents } }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "SCHEDULED" }, as: GiftAdministrator }
          assert:
            - "total_paid_cents == 8325 (${paid}); liability_released_cents == 8325 (${released})"
            - "total_scheduled_cents == 199800 (${total}) — unchanged by PAY/LAPSE"
            - "INVARIANT: 8325 (paid) + 8325 (released) + 22 x 8325 (remaining) == 199800 == total_scheduled"
            - "Status census: PAID 1, LAPSED 1 (reason MANUAL), SCHEDULED 22"
