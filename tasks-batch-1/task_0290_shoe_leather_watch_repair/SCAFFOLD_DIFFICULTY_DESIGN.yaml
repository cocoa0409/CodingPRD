    instances:
      - name: cancel_cascade_parts_to_lines_to_estimate_depth3
        grounds:
          - state_machines.RepairTicket.AWAITING_APPROVAL_to_CANCELLED
          - state_machines.PartsOrder.ORDERED_to_CANCELLED
          - state_machines.ServiceLine.QUOTED_to_VOIDED
          - state_machines.Estimate.PRESENTED_to_REJECTED
        distinguishing_aspect: |
          Depth-3 transitive chain from ticket cancel: cancel -> PartsOrder ORDERED->CANCELLED
          (hop1) -> that PartsOrder's owning ServiceLine QUOTED->VOIDED (hop2) -> the open
          PRESENTED Estimate -> REJECTED (hop3). Each hop is caused by the prior hop's
          mutation, not by the cancel call directly. Trigger differs from instance 2 (warranty approve).
        test_recipe:
          setup:
            - "Ticket in AWAITING_APPROVAL with an estimate still PRESENTED (not yet approved) and one ORDERED part on its single QUOTED line."
            - "Cancelling here lets all three hops fire: the ORDERED part cancels, its line voids, and the PRESENTED estimate is rejected."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
