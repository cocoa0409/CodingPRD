          - entities.InspectionResult.fields.attempt_index
          - validations[priority=20]
          - calculations.reconditioning_reimbursement
        distinguishing_aspect: |
          The inspection loops IN_PROGRESS -> RECONDITIONING_REQUIRED -> IN_PROGRESS twice before
          passing, and the loop is where the non-linearity lives: attempt 2 re-fails S1 while B1 now
          passes, and the idempotent generation rule must produce no fourth ReconditioningItem and
          must not release B1's still-open row, so the count stays at exactly 2 across three attempts
