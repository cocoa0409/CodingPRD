  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: host_committed_sites_conserved_across_decline_and_counter_round
        grounds:
          - calculations.host_committed_sites
          - state_machines.StayRequest.REQUESTED_to_DECLINED
          - state_machines.StayRequest.DECLINED_to_REQUESTED
          - entities.HostBusiness.fields.committed_sites
        distinguishing_aspect: |
          Conserved quantity: the host's committed_sites occupancy. Confirming a
          request raises it, declining the same request returns it, and stepping
          the request to request_depth 2 subtracts it again, so the value must
          land back on the same integer after each compensating action.
