  - section: validations
    instances:
      - name: duplicate_employee_email_rejected_with_409
        claim_type: violation_to_error
        grounds:
          - validations[priority 6]
          - errors[ERR_DUPLICATE_EMAIL]
          - entities.Employee.fields.email
        distinguishing_aspect: "Employee.email is unique across all rows regardless of department or role, so a second create with the same address returns ERR_DUPLICATE_EMAIL (409) and no second row appears in the listing."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one employee already registered with email dup@corp.example."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "dup@corp.example", full_name: "First Dup", department: "HR", role_code: "IC", hire_date: "2020-01-01" }, as: ProgramAdmin, captures: { e1: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/employees", payload: { email: "dup@corp.example", full_name: "Second Dup", department: "SALES", role_code: "IC", hire_date: "2024-01-01" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees", payload: { department: "SALES" }, as: ProgramAdmin }
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_EMAIL"
            - "the SALES listing is empty: the duplicate create wrote nothing"
            - "Employee.${e1}.full_name is still First Dup and department is still HR"

      - name: duplicate_module_code_rejected_even_after_the_first_is_retired
        claim_type: violation_to_error
        grounds:
          - validations[priority 6]
          - errors[ERR_DUPLICATE_MODULE_CODE]
          - state_machines.TrainingModule
        distinguishing_aspect: "TrainingModule.code uniqueness spans every row, not just live ones: retiring the holder of a code does not free it, so re-using it still returns ERR_DUPLICATE_MODULE_CODE (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A module with code SEC-101 is created, published and then retired."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules", payload: { code: "SEC-101", title: "Security Basics", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules/${m}/retire", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/training-modules", payload: { code: "SEC-101", title: "Security Basics v2", module_type: "ANNUAL" }, as: ProgramAdmin }
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_MODULE_CODE"
            - "TrainingModule.${m}.status == RETIRED and title is unchanged"
            - "a create with code SEC-102 succeeds with HTTP 201, proving only the code collided"

      - name: campaign_tier_exceeding_template_tier_returns_422
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 16]
          - errors[ERR_CAMPAIGN_TIER_EXCEEDS_TEMPLATE]
          - entities.PhishingCampaign.fields.difficulty_tier
        distinguishing_aspect: "The tier ceiling is a rank comparison against the referenced template, so a TIER_3_SPEAR campaign built on a TIER_1_BASIC template is refused with ERR_CAMPAIGN_TIER_EXCEEDS_TEMPLATE (422) at creation, before any review step can see it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One APPROVED_FOR_USE template at TIER_1_BASIC and one ACTIVE employee in ENGINEERING."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "tier.probe@corp.example", full_name: "Tia Tier", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2019-09-09" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Basic Tier Template", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
          trigger:
            - { call: "POST /awareness/campaigns", payload: { name: "Spear On Basic", template_id: "${tpl}", difficulty_tier: "TIER_3_SPEAR", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1" }
          assert:
            - "HTTP 422 with error_id ERR_CAMPAIGN_TIER_EXCEEDS_TEMPLATE"
            - "no PhishingCampaign row was created: the campaign listing for template ${tpl} is empty"
            - "PhishingTemplate.${tpl}.review_state is still APPROVED_FOR_USE"

      - name: campaign_tier_equal_to_template_tier_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 16]
          - entities.PhishingCampaign.fields.difficulty_tier
        distinguishing_aspect: "The comparison is <=, not <: a campaign whose tier exactly equals the template's TIER_2_TARGETED is created successfully in DRAFT, which distinguishes the boundary from the rejection case."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One APPROVED_FOR_USE template at TIER_2_TARGETED."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Targeted Tier Template", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["AUTHORITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
          trigger:
            - { call: "POST /awareness/campaigns", payload: { name: "Equal Tier Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
          assert:
            - "HTTP 201 with PhishingCampaign.${c}.state == DRAFT"
            - "PhishingCampaign.${c}.difficulty_tier == TIER_2_TARGETED and template_id == ${tpl}"
            - "PhishingCampaign.${c}.author_user_id == author-1 (taken from X-User-ID, never from the body)"
            - "PhishingCampaign.${c}.target_departments == [] (omitted target means org-wide)"

      - name: role_eligibility_rejects_assignment_for_an_uncovered_role_code
        claim_type: conditional_validation
        grounds:
          - validations[priority 19]
          - errors[ERR_ROLE_NOT_ELIGIBLE_FOR_MODULE]
          - entities.TrainingModule.fields.applies_to_role_codes
        distinguishing_aspect: "The eligibility rule only bites when applies_to_role_codes is non-empty: the same employee is rejected for a FINANCE_APPROVER-only module with ERR_ROLE_NOT_ELIGIBLE_FOR_MODULE (422) but accepted for a module whose list is the empty default."
        test_recipe:
          setup:
