- section: errors
  instances:
  - name: duplicate_code_and_external_ref_conflicts
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE_CODE]
    - errors[ERR_DUPLICATE_EXTERNAL_REF]
    - validations[priority=7]
    distinguishing_aspect: 'Uniqueness constraints fire on their own fields: reusing a term code yields ERR_DUPLICATE_CODE; reusing a student external_ref yields ERR_DUPLICATE_EXTERNAL_REF (both 409).'
    test_recipe:
      setup:
      - One term FALL-26 and one student S-DUP exist
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
