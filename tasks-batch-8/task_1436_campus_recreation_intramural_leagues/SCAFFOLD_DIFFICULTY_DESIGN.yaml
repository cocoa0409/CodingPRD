            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${mM_id}" }, as: Member, as_user_id: "${mM_id}", captures: { rM_id: "$.data.id", rM_st: "$.data.status" } }
            - { call: "POST /v1/members", payload: { email: "ww@x.edu", full_name: "Mem W", affiliation: "STUDENT" }, as: RecAdmin, captures: { mW_id: "$.data.id", mW_v: "$.data.version" } }
            - { call: "POST /v1/members/${mW_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mW_id}", captures: { mW_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mW_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mW_v2}" }, as: Member, as_user_id: "${mW_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${mW_id}" }, as: Member, as_user_id: "${mW_id}", captures: { rW_id: "$.data.id", rW_st: "$.data.status" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/injury-reports", payload: { member_id: "${mM_id}", severity: "SEVERE", description: "ACL tear" }, as: FacilityManager, captures: { ir_id: "$.data.id" } }
            - { call: "GET /v1/members/${mM_id}", payload: {}, as: FacilityManager, captures: { mM_status: "$.data.status" } }
            - { call: "GET /v1/class-registrations/${rM_id}", payload: {}, as: FacilityManager, captures: { rM_after: "$.data.status" } }
            - { call: "GET /v1/class-registrations/${rW_id}", payload: {}, as: FacilityManager, captures: { rW_after: "$.data.status" } }
            - { call: "GET /v1/fitness-classes/${c_id}", payload: {}, as: FacilityManager, captures: { c_reg: "$.data.registered_count", c_wait: "$.data.waitlist_count" } }
          assert:
            - "setup sanity: rM was REGISTERED and rW was WAITLISTED (capacity 1)"
            - "hop 1: Member M status == SUSPENDED"
            - "hop 2: rM status == CANCELLED (future SCHEDULED class registration auto-cancelled)"
            - "hop 3: rW status == REGISTERED (promotion), and class registered_count == 1 with waitlist_count == 0 (seat conserved)"
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_checkout_precedence
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_MEMBER_SUSPENDED]
          - errors[ERR_OUTSTANDING_FINES]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the checkout request violates BOTH — member SUSPENDED (injury hold)
          and outstanding_fines_cents == 450 > 0. State (priority 6) precedes fiscal (priority 12), so the response MUST
          be ERR_MEMBER_SUSPENDED/409, never ERR_OUTSTANDING_FINES/402.
        test_recipe:
          setup:
            - "Eligible member M checks out 1 unit due 2026-10-01T17:00:00Z; returns it at 2026-10-03T17:00:01Z (2d+1s -> 3 days -> fine 3*150*1 = 450); then a MODERATE injury report suspends M"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}" }
            - { call: "POST /v1/equipment-pools", payload: { item_type: "BASKETBALL", total_qty: 5, daily_late_fee_cents: 150, unit_replacement_cents: 900 }, as: RecAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 1, due_at: "2026-10-01T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { co_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-03T17:00:01Z" }, as: RecAdmin }
            - { call: "POST /v1/equipment-checkouts/${co_id}/return", payload: {}, as: FacilityManager, captures: { co_fee: "$.data.late_fee_cents" } }
            - { call: "POST /v1/injury-reports", payload: { member_id: "${mM_id}", severity: "MODERATE", description: "sprain" }, as: FacilityManager }
          trigger:
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 1, due_at: "2026-10-10T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/members/${mM_id}", payload: {}, as: FacilityManager, captures: { mM_fines: "$.data.outstanding_fines_cents" } }
          assert:
            - "first return's late_fee_cents == 450 (ceil((2d 1s)/86400) = 3 days; 3 * 150 * 1)"
            - "rejected checkout returns error_id == ERR_MEMBER_SUSPENDED (priority 6), NOT ERR_OUTSTANDING_FINES (priority 12), despite both conditions holding"
            - "no mutation on rejection: outstanding_fines_cents still == 450 and no new checkout exists"
      - name: safety_vs_temporal_class_registration_precedence
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_WAIVER_INVALID]
          - errors[ERR_CLASS_TIME_CONFLICT]
          - calculations.waiver_academic_year_window
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal) — a different pair from the sibling: the registration
          violates BOTH the academic-year waiver rule (signed 2026-09-01, clock at 2027-08-01 = new AY) AND the member
          class-overlap rule (18:30-19:15 overlaps 18:00-19:00). Safety (priority 7) precedes temporal (priority 9):
          response MUST be ERR_WAIVER_INVALID/422, never ERR_CLASS_TIME_CONFLICT/409.
        test_recipe:
          setup:
            - "Member M: waiver signed 2026-09-01 (AY2026-27), SUMMER_2027 membership bought in advance (active through 2027-08-06)"
            - "Class C Mon 2027-08-02 18:00-19:00 with M REGISTERED (registered 2027-07-30 while waiver still valid)"
            - "Class B Mon 2027-08-02 18:30-19:15 at another facility (overlaps C); clock now 2027-08-01"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "SUMMER_2027", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}" }
            - { call: "POST /v1/facilities", payload: { name: "Studio 1", kind: "ROOM", operating_windows: [ { day_of_week: 0, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f1_id: "$.data.id" } }
            - { call: "POST /v1/facilities", payload: { name: "Studio 2", kind: "ROOM", operating_windows: [ { day_of_week: 0, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f2_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Instr I", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3000, certified_class_types: ["YOGA", "PILATES"] }, as: RecAdmin, captures: { i_id: "$.data.id" } }
            - { call: "POST /v1/fitness-classes", payload: { title: "Yoga C", class_type: "YOGA", instructor_staff_id: "${i_id}", facility_id: "${f1_id}", start_at: "2027-08-02T18:00:00Z", end_at: "2027-08-02T19:00:00Z", capacity: 6 }, as: RecAdmin, captures: { cC_id: "$.data.id" } }
            - { call: "POST /v1/fitness-classes", payload: { title: "Pilates B", class_type: "PILATES", instructor_staff_id: "${i_id}", facility_id: "${f2_id}", start_at: "2027-08-02T18:30:00Z", end_at: "2027-08-02T19:15:00Z", capacity: 6 }, as: RecAdmin, captures: { cB_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-07-30T09:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/fitness-classes/${cC_id}/registrations", payload: { member_id: "${mM_id}" }, as: Member, as_user_id: "${mM_id}", captures: { rC_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T09:00:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/fitness-classes/${cB_id}/registrations", payload: { member_id: "${mM_id}" }, as: Member, as_user_id: "${mM_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "at 2027-08-01 the 2026-09-01 waiver is stale (AY rolls Aug 1) AND class B overlaps class C 18:30 < 19:00"
            - "error_id == ERR_WAIVER_INVALID (priority 7), NOT ERR_CLASS_TIME_CONFLICT (priority 9)"
            - "no registration created for class B (GET /v1/class-registrations?member_id=M returns total_count == 1)"
