      - name: alias_chain_of_six_hops_is_refused_while_five_hops_is_admitted
        claim_type: topological
        grounds:
          - calculations.token_alias_resolution
          - validations[priority=20]
          - errors[ERR_TOKEN_ALIAS_DEPTH_EXCEEDED]
          - entities.TokenSet.fields.max_alias_depth
        distinguishing_aspect: |
          MAX_ALIAS_DEPTH is 5 hops and the bound is inclusive: a chain a0 (leaf) <- a1 <- ... <-
          a5 must be admitted with alias_depth 5 and TokenSet.max_alias_depth 5, while the very
          next link a6 must be refused with ERR_TOKEN_ALIAS_DEPTH_EXCEEDED at 422 with nothing
          written — token_count stays 6 and the token set's version does not advance.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "TokenSet `core`; leaf token a0 with raw_value #000000 and five successive aliases a1..a5"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
