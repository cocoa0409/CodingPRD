          rationale: "That 1.8 instance already drives ERR_FUNDING_AMOUNT_MISMATCH on a one-cent-off collected_amount_cents and proves priority 9 fires ahead of priority 37 while the window is still open."

      - name: rescission_period_active_blocks_funding
        excluded_because:
          difficulty_instance: funding_state_gate_precedes_fiscal_amount_mismatch
          rationale: "That 1.8 instance already shows funding refused with ERR_RESCISSION_PERIOD_ACTIVE before the sweep and admitted after rescission_status becomes EXPIRED."

      - name: presentation_not_cleared_gate_before_agreement_execution
        excluded_because:
          difficulty_instance: presentation_safety_gate_precedes_referential_trade_in_mismatch
