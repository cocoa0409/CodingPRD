            - "The second trigger call returns 422 with error_id ERR_INSUFFICIENT_CLAIM_HISTORY"
            - "The third trigger call returns 422 with error_id ERR_INSUFFICIENT_CLAIM_HISTORY"

      - name: reserve_posture_boundary_exactly_eighty_and_one_hundred_percent_of_cap
