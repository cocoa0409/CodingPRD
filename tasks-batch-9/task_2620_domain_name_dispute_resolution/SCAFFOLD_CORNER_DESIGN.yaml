          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9026; domain corr.example; complainant Corr Ltd (country_code GB); one FILED case with a first deficiency notice issued at 2026-08-01T00:00:00Z with correction_days 5, giving correction_deadline_at 2026-08-06T00:00:00Z."
