              captures: { lb_status: $.data.status, lb_shipped: $.data.shipped_qty }
          assert:
            - "submit: Order.status == PARTIALLY_BACKORDERED (captured ${st})"
            - "ship: Order.status == SHIPPED (captured ${st_ship})"
            - "line A: status == SHIPPED, shipped_qty == 4 (captured ${la_status}, ${la_shipped})"
            - "line B: status == BACKORDERED, shipped_qty == 0 (captured ${lb_status}, ${lb_shipped})"

  # ==================================================================
