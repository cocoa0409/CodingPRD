  - { method: POST, path: "/api/work-orders/{id}/ready-for-rts", description: "WORK_IN_PROGRESS -> READY_FOR_RTS", roles: [Mechanic], code: 200, input: [], output: WorkOrder, side_effects: ["Aircraft posture recomputed"] }
