      - A RETAINED order of 1 car completes on 2026-09-12 into HELD car K; lessee "Breakdown Rail Co"
        (credit_tier B, utilization_threshold_pct 0, credit_ceiling_cents 1000000) holds ACTIVE contract
        LC-C2b (FULL_SERVICE, per_diem_rate_cents 1000, liability_bearer LESSOR, term 2026-09-01..2027-09-01,
        fleet_car_cap 5).
      - Placement A1 [2026-09-01, 2026-10-01) with mileage_allowance 1000 returns 2500 miles -> overage
        1500 * 12 == 18000 and is then SETTLED; the car is settled back to HELD.
      - Placement A2 [2026-10-03, 2026-11-02) starts two days after A1's end_date (clearing the one-day
        buffer) with the same allowance and returns 4500 miles -> overage 3500 * 12 == 42000, left PENDING.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
