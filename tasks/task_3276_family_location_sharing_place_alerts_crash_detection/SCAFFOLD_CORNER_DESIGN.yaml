              captures: { mid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${mid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${mid}"
            - call: "GET /api/circles/${cid}"
              payload: {}
              as: Member
              as_user_id: "${mid}"
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /api/circles/${cid}/subscription/change-tier"
              payload: { to_tier: "PROTECT", expected_circle_version: "${cv}" }
              as: Member
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN"

      - name: place_config_radius_out_of_range
        claim_type: ViolationToError
        grounds:
          - validations[priority=10]
          - errors.ERR_PLACE_CONFIG_INVALID
        distinguishing_aspect: "radius_m below 50 or above 5000 is rejected 422."
        test_recipe:
          setup: ["Circle exists."]
          setup_api_calls:
            - *clock_set
            - *circle_create
          trigger:
            - call: "POST /api/circles/${cid}/places"
