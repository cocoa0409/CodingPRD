          (state, ERR_CASE_NOT_CLEARED, 409) beats priority 48 (business_safety,
          ERR_ANTIBIOTIC_NOT_ADMINISTERED, 422). The two violations differ in
          category AND in HTTP status, so an implementation that evaluates safety
          checks before state checks returns 422 instead of 409 and is caught by
          the status alone. The readiness projection is asserted alongside to prove
