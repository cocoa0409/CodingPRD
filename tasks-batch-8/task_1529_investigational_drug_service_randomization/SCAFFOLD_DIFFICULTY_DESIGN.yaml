scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_includes_pipeline_fees_final_excludes
        grounds:
          - calculations.site_invoice_compute
        distinguishing_aspect: |
          Dual-variant divergence in the FISCAL domain: identical site activity,
          but the PROVISIONAL variant counts SCHEDULED monitor visits (scheduled
          minutes) and APPROVED-not-executed unblinding requests, while FINAL
          counts neither — producing provably different totals.
        test_recipe:
          setup:
            - "Study P-INV-1 ACTIVE with APPROVED fee schedule (setup 100000, dispensing 5000/3000 tier@2, monitoring 10000/hr, storage 100/kit-month, unblinding 25000, overhead 10%)"
            - "Site S1 ACTIVE (activated_at 2026-08-01T00:00:00Z); six kits K-1..K-6 AVAILABLE; four STANDARD slots seq 1-4 mapping K-1..K-4"
            - "SUB-A randomized with dispenses at visit 1 (2026-08-01, qty 2), visit 2 (2026-08-29, qty 2), visit 3 (2026-09-26, qty 2); SUB-B randomized with one dispense (2026-09-26, qty 2)"
            - "Two CLOSED monitor visits of 25 actual minutes each; one SCHEDULED 60-minute visit (2026-09-10) never started; one unblinding request APPROVED but not EXECUTED (2026-09-27)"
            - "Kits K-5, K-6 remain AVAILABLE (storage count 2)"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-INV-1", title: "Invoice Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 100000, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 10 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin, captures: { study_v3: $.data.version } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-INV-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Unbl A", license_number: "L-INV-3", is_unblinded: true }, as: SponsorAdmin, captures: { up1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-INV-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-1", "K-2", "K-3", "K-4", "K-5", "K-6"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id", k2: "$.data[1].id", k3: "$.data[2].id", k4: "$.data[3].id", k5: "$.data[4].id", k6: "$.data[5].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k3}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k3}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k4}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k4}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k5}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k5}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k6}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k6}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-1", arm_code: "TRT-A" }, { sequence_number: 2, stratum: "STANDARD", kit_number: "K-2", arm_code: "PBO" }, { sequence_number: 3, stratum: "STANDARD", kit_number: "K-3", arm_code: "TRT-A" }, { sequence_number: 4, stratum: "STANDARD", kit_number: "K-4", arm_code: "PBO" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-A", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { subA: $.data.id } }
            - { call: "POST /api/subjects/${subA}/randomize", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/dispensing-records", payload: { subject_id: "${subA}", kit_id: "${k1}", visit_number: 1, quantity_dispensed: 2 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA Jo", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T17:00:00Z" }, as: Monitor, captures: { mv1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/monitor-visits/${mv1}/start", as: Monitor }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:25:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/monitor-visits/${mv1}/close", payload: { counts: [ { kit_id: "${k2}", physical_units: 10 }, { kit_id: "${k3}", physical_units: 10 }, { kit_id: "${k4}", physical_units: 10 }, { kit_id: "${k5}", physical_units: 10 }, { kit_id: "${k6}", physical_units: 10 } ] }, as: Monitor }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA Jo", scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T17:00:00Z" }, as: Monitor, captures: { mv2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/monitor-visits/${mv2}/start", as: Monitor }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:25:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/monitor-visits/${mv2}/close", payload: { counts: [ { kit_id: "${k2}", physical_units: 10 }, { kit_id: "${k3}", physical_units: 10 }, { kit_id: "${k4}", physical_units: 10 }, { kit_id: "${k5}", physical_units: 10 }, { kit_id: "${k6}", physical_units: 10 } ] }, as: Monitor }
            - { call: "POST /api/subjects/${subA}/allocate-kit", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-29T00:00:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/dispensing-records", payload: { subject_id: "${subA}", kit_id: "${k2}", visit_number: 2, quantity_dispensed: 2 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/subjects/${subA}/allocate-kit", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-26T00:00:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/dispensing-records", payload: { subject_id: "${subA}", kit_id: "${k3}", visit_number: 3, quantity_dispensed: 2 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-B", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { subB: $.data.id } }
            - { call: "POST /api/subjects/${subB}/randomize", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/dispensing-records", payload: { subject_id: "${subB}", kit_id: "${k4}", visit_number: 1, quantity_dispensed: 2 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA Jo", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z" }, as: Monitor }
            - { call: "POST /api/unblinding-requests", payload: { subject_id: "${subA}", reason: "Suspected SAE" }, as: Investigator, captures: { ub: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-27T00:00:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/unblinding-requests/${ub}/decide", payload: { decision: "APPROVED" }, as: UnblindedPharmacist, as_user_id: "${up1}" }
          trigger:
            - { call: "GET /api/sites/${site}/invoice", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", variant: "FINAL" }, as: SponsorAdmin, captures: { fin_total: $.data.total_cents, fin_mon: $.data.monitoring_fees_cents, fin_unb: $.data.unblinding_fees_cents } }
            - { call: "GET /api/sites/${site}/invoice", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", variant: "PROVISIONAL" }, as: SponsorAdmin, captures: { prov_total: $.data.total_cents, prov_mon: $.data.monitoring_fees_cents, prov_unb: $.data.unblinding_fees_cents } }
          assert:
            - "FINAL invoice: monitoring_fees_cents == 8334 (two closed 25-min visits at 10000 cents/hr, per-line round_half_up(4166.67)=4167 each)"
            - "FINAL invoice: unblinding_fees_cents == 0 (APPROVED-but-unexecuted request excluded)"
            - "FINAL invoice: dispensing_fees_cents == 18000 (SUB-A 5000+5000+3000 tier crossing, SUB-B 5000), setup_fee_cents == 100000, storage_fees_cents == 200 (K-5,K-6 AVAILABLE), subtotal_cents == 126534, overhead_cents == 12653, total_cents == 139187"
            - "PROVISIONAL invoice: monitoring_fees_cents == 18334 (adds the SCHEDULED 60-minute visit at 10000), unblinding_fees_cents == 25000 (APPROVED request included)"
            - "PROVISIONAL invoice: subtotal_cents == 161534, overhead_cents == 16153, total_cents == 177687"
            - "PROVISIONAL total_cents (177687) != FINAL total_cents (139187) for identical site data"
      - name: kit_accountability_book_balance_vs_physical_count
        grounds:
          - calculations.kit_accountability_balance
          - state_machines.MonitorVisit.IN_PROGRESS_to_CLOSED_DISCREPANCY
        distinguishing_aspect: |
          Dual-variant divergence in the INVENTORY-ACCOUNTABILITY domain (distinct
          from the fiscal invoice instance): the book balance is a projection over
          the kit's dispense/return counters, while the monitor's physical count is
          authoritative — for identical counter data the two variants disagree (10
          vs 9) and the close books the signed delta into units_lost.
        test_recipe:
          setup:
            - "Study ACTIVE with fee schedule; site ACTIVE; one kit K-A (10 units) AVAILABLE; one STANDARD slot seq 1 -> K-A"
            - "SUB-R randomized; dispense visit 1 qty 4 of K-A (dose 200mg == cap, allowed); full return of 4 units recorded by pharmacist p1 and verified by p2"
            - "Kit book balance before close: on_hand = 10 - 4 + 4 - 0 - 0 = 10"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-ACC-1", title: "Accountability Study", phase: "PHASE_III", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 50 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin, captures: { study_v3: $.data.version } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-ACC-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm Two", license_number: "L-ACC-2" }, as: SponsorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-ACC-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-A"], units_per_kit: 10 }, as: SponsorAdmin, captures: { kA: "$.data[0].id" } }
            - { call: "POST /api/kits/${kA}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${kA}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-A", arm_code: "TRT-A" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-R", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { sub: $.data.id } }
            - { call: "POST /api/subjects/${sub}/randomize", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/dispensing-records", payload: { subject_id: "${sub}", kit_id: "${kA}", visit_number: 1, quantity_dispensed: 4 }, as: Pharmacist, as_user_id: "${p1}", captures: { disp: $.data.id } }
            - { call: "POST /api/returns", payload: { dispensing_record_id: "${disp}", quantity_returned: 4 }, as: Pharmacist, as_user_id: "${p1}", captures: { ret: $.data.id } }
            - { call: "POST /api/returns/${ret}/verify", as: Pharmacist, as_user_id: "${p2}" }
            - { call: "GET /api/kits/${kA}", as: Pharmacist, as_user_id: "${p1}", captures: { book_on_hand: $.data.on_hand_units } }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA Jo", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-02T00:00:00Z" }, as: Monitor, captures: { mv: $.data.id } }
            - { call: "POST /api/monitor-visits/${mv}/start", as: Monitor }
          trigger:
            - { call: "POST /api/monitor-visits/${mv}/close", payload: { counts: [ { kit_id: "${kA}", physical_units: 9 } ] }, as: Monitor, captures: { mv_status: $.data.status, mv_disc: $.data.discrepancy_count } }
          assert:
            - "book_on_hand captured before close == 10 (projection: 10 - 4 + 4 - 0 - 0)"
            - "physical count supplied == 9, so the two variants diverge by exactly 1 unit for identical counter data"
            - "Kit.${kA}.units_lost == 1 after close (signed adjustment = book 10 - physical 9)"
            - "Kit.${kA}.on_hand_units == 9 after close (physical variant now authoritative)"
            - "MonitorVisit.${mv}.status == CLOSED_DISCREPANCY and discrepancy_count == 1"
            - "DispensingRecord.${disp}.status == RECONCILED (return was VERIFIED)"
  - rule_id: combinatorial_formula
    instances:
      - name: excursion_severity_minutes_nested_multiplier
        grounds:
          - calculations.excursion_severity_minutes
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with nested min/max AND conditional
          branching on breach side: capped_duration (min vs 1440) x side multiplier
          (both=4 / below=3 / above=2) x degree band (max(1, ceil(dev/2))).
          With window 100 min, min_observed 1.0 (below by 1.0) and max_observed
          9.5 (above by 1.5) the result is exactly min(100,1440) * 4 * max(1, ceil(1.5/2)) = 400.
        test_recipe:
          setup:
            - "Study ACTIVE (fee schedule approved); site ACTIVE; lot range [2, 8], stability budget 600; two kits K-E1/K-E2 AVAILABLE"
            - "Logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-SEV-1", title: "Severity Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-SEV-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-SEV-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-E1", "K-E2"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id", k2: "$.data[1].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 9.5, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}", captures: { log1_exc: $.data.excursion_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:40:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 1.0, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}", captures: { log2_exc: $.data.excursion_id } }
          trigger:
            - { call: "POST /api/temperature-excursions/${log1_exc}/assess", payload: { outcome: "ACCEPTABLE", resolution_rationale: "Sponsor QA: product stable" }, as: SponsorAdmin, captures: { exc_sev: $.data.severity_minutes_charged, exc_status: $.data.status } }
          assert:
            - "log1_exc == log2_exc (second out-of-range reading extended the same OPEN excursion)"
            - "after the two logs, Kit.${k1}.status == QUARANTINED_EXCURSION and Kit.${k2}.status == QUARANTINED_EXCURSION"
            - "excursion window: 2026-08-01T00:00:00Z..2026-08-01T01:40:00Z = 100 minutes; min_observed 1.0, max_observed 9.5"
            - "severity_minutes_charged == 400 (min(100,1440) * both-sides 4 * max(1, ceil(1.5/2))=1)"
            - "Lot.${lot}.stability_minutes_consumed == 400 (charged once per distinct affected lot, not per kit)"
            - "400 < budget 600, so Kit.${k1}.status == AVAILABLE and Kit.${k2}.status == AVAILABLE (restored; excursion_id cleared)"
      - name: monitoring_fee_per_line_rounding_pinned
        grounds:
          - calculations.site_invoice_compute
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned: round_half_up EACH visit's
          monitoring fee to cents BEFORE summation. Two 25-minute visits at
          10000 cents/hr produce 4167 + 4167 = 8334 under the pinned order,
          while the unpinned sum-then-round order would produce 8333.
        test_recipe:
          setup:
            - "Study ACTIVE; fee schedule with monitoring_fee_cents_per_hour 10000 and all other fees 0; site ACTIVE (activated_at in period but setup_fee_cents == 0)"
            - "No kits at the site, so monitor-visit close accepts an empty counts array"
            - "Two monitor visits, each started at 10:00 and closed at 10:25 (25 actual minutes), closed with empty counts"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-RND-1", title: "Rounding Study", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 1000, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
