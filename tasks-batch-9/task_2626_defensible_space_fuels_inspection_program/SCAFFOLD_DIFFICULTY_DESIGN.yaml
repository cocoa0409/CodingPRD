            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", community_id: "${com}", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
