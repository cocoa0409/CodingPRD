  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsAsset
  side_effects:
  - status OPEN → PACKAGES_LOCKED
  - All DRAFT packages → OPEN_FOR_BIDS
- method: POST
  path: /rights-assets/{assetId}/close-awards
  description: Close awards after all packages resolved
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsAsset
  side_effects:
  - status → AWARD_CLOSED
- method: POST
  path: /rights-assets/{assetId}/retire
  description: Retire the asset
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsAsset
  side_effects:
  - status → RETIRED
- method: POST
  path: /broadcasters
  description: Register a broadcaster
  roles:
  - RightsManager
  code: 201
  input:
  - legal_name
  - home_territory
  - platform_classes
  - credit_rating
  output: Broadcaster
  side_effects:
  - status = REGISTERED
- method: GET
  path: /broadcasters
  description: List broadcasters
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - status?
  - credit_rating?
  output: Broadcaster[]
  side_effects: []
- method: GET
  path: /broadcasters/{broadcasterId}
  description: Get a broadcaster
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: Broadcaster
  side_effects: []
- method: POST
  path: /broadcasters/{broadcasterId}/accredit
  description: Accredit a registered broadcaster
  roles:
  - RightsManager
  code: 200
  input: []
  output: Broadcaster
  side_effects:
  - status → ACCREDITED
- method: POST
  path: /broadcasters/{broadcasterId}/suspend
  description: Suspend an accredited broadcaster
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: Broadcaster
  side_effects:
  - status → SUSPENDED
  - All OPEN bids on OPEN_FOR_BIDS packages → WITHDRAWN
  - All PENDING SublicenseRequests on deals where this is the broadcaster → REJECTED
- method: POST
  path: /broadcasters/{broadcasterId}/reinstate
  description: Reinstate a suspended broadcaster
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: Broadcaster
  side_effects:
  - status → ACCREDITED
- method: POST
  path: /broadcasters/{broadcasterId}/bar
  description: Bar a suspended broadcaster (terminal)
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: Broadcaster
  side_effects:
  - status → BARRED
  - All non-terminal deals with this broadcaster → TERMINATED_BREACH
- method: POST
  path: /packages
  description: Create a rights package under an asset
  roles:
  - RightsManager
  code: 201
  input:
  - asset_id
  - package_code
  - territory_code
  - platform_class
  - window_start
  - window_end
  - exclusivity_class
  - minimum_bid_cents
  - games_committed
  output: RightsPackage
  side_effects:
  - status = DRAFT
  - RightsAsset.active_package_count += 1
- method: GET
  path: /packages
  description: List packages for an asset
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - asset_id?
  - status?
  - territory_code?
  - platform_class?
  - awarded_bid_id?
  - awarded_deal_id?
  output: RightsPackage[]
  side_effects: []
- method: GET
  path: /packages/{packageId}
  description: Get a package
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: RightsPackage
  side_effects: []
- method: POST
  path: /packages/{packageId}/withdraw
  description: Withdraw a package
  roles:
  - RightsManager
  code: 200
  input: []
  output: RightsPackage
  side_effects:
  - status → WITHDRAWN
  - All non-terminal bids on this package → WITHDRAWN
- method: POST
  path: /packages/{packageId}/bids
  description: File a new bid on a package (DRAFT state)
  roles:
  - BidCoordinator
  code: 201
  input:
  - bidder_id
  - offered_fee_cents
  - upfront_pct
  - escalator_rate_pct
  - minimum_growth_pct
  - fee_cap_cents
  - production_commitment_games
  - audience_commitment_pct
  - exclusivity_request
  - parent_bid_id?
  output: Bid
  side_effects:
  - status = DRAFT
  - 'round_number = parent_bid_id ? parent.round_number + 1 : 1'
- method: GET
  path: /packages/{packageId}/bids
  description: List bids on a package
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - status?
  - bidder_id?
  - package_id?
  - parent_bid_id?
  output: Bid[]
  side_effects: []
- method: GET
  path: /packages/{packageId}/bids/{bidId}
  description: Get a bid
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: Bid
  side_effects: []
- method: POST
  path: /packages/{packageId}/bids/{bidId}/submit
  description: Submit a DRAFT bid
  roles:
  - BidCoordinator
  code: 200
  input: []
  output: Bid
  side_effects:
  - status DRAFT → SUBMITTED
  - Package OPEN_FOR_BIDS → UNDER_NEGOTIATION if this is first submission
- method: POST
  path: /packages/{packageId}/bids/{bidId}/start-review
  description: Start review on a SUBMITTED bid
  roles:
  - RightsManager
  code: 200
  input: []
  output: Bid
  side_effects:
  - status → UNDER_REVIEW
- method: POST
  path: /packages/{packageId}/bids/{bidId}/shortlist
  description: Shortlist a bid
  roles:
  - RightsManager
  code: 200
  input: []
  output: Bid
  side_effects:
  - status → SHORTLISTED
- method: POST
  path: /packages/{packageId}/bids/{bidId}/counter
  description: Counter a shortlisted bid
  roles:
  - RightsManager
  code: 200
  input: []
  output: Bid
  side_effects:
  - status SHORTLISTED → COUNTERED
- method: POST
  path: /packages/{packageId}/bids/{bidId}/reject
  description: Reject a bid
  roles:
  - RightsManager
  code: 200
  input: []
  output: Bid
  side_effects:
  - status → REJECTED
- method: POST
  path: /packages/{packageId}/bids/{bidId}/withdraw
  description: Withdraw a bid (bidder-initiated)
  roles:
  - BidCoordinator
  code: 200
  input: []
  output: Bid
  side_effects:
  - status → WITHDRAWN
- method: POST
  path: /packages/{packageId}/bids/{bidId}/accept
  description: Accept a shortlisted bid; awards the package and creates the Deal
  roles:
  - RightsManager
  code: 200
  input:
  - expected_package_version
  output: Deal
  side_effects:
  - Bid → ACCEPTED; all other non-terminal bids on package → REJECTED
  - Package → AWARDED; awarded_bid_id, awarded_deal_id populated
  - Deal auto-created with status DRAFT
  - Increments RightsPackage.version by 1
  - Exclusivity conflict scan runs (writes RightsConflict rows)
