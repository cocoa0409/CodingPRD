              as: MoveOpsAgent
              captures: { res_v3: $.data.version }
          trigger:
            - call: "POST /address-change-filings/${f_id}/submission"
              payload: {}
              as: MoveOpsAgent
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "WEB_PORTAL", consent_text_version: "v3", expected_resident_version: "${res_v3}" }
              as: MoveOpsAgent
              captures: { cs_util2_id: $.data.id }
            - call: "POST /address-change-filings/${f_id}/submission"
              payload: {}
              as: MoveOpsAgent
          assert:
            - "before the trigger: AddressChangeFiling.${f_id}.status == DRAFT and ConsentRecord.${cs_usps_id}.state == GRANTED (the filing's own state and its own scope of consent are both fine)"
            - "before the trigger: MoveRecord.${mv_id}.consent_gate == BLOCKED with blocked_reason == CONSENT_REVOKED"
            - "trigger call 1 returns HTTP 409 with error_id == ERR_CONSENT_REVOKED"
            - "after trigger call 1: AddressChangeFiling.${f_id}.status == DRAFT and submitted_by_user_id == null"
            - "trigger call 2 returns HTTP 201 with ConsentRecord.${cs_util2_id}.state == GRANTED, and MoveRecord.${mv_id}.consent_gate flips back to OPEN with blocked_reason NONE"
            - "trigger call 3 returns HTTP 200 with AddressChangeFiling.${f_id}.status == SUBMITTED and resubmit_count == 0"
