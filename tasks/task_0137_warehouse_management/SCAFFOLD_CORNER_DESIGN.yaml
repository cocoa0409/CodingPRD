scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_sku_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.Sku"
          - "endpoints"
        distinguishing_aspect: "POST /skus with all required fields returns 201 and a Sku whose sku_code/abc_class/min_qty/max_qty echo input, with on_hand_qty=0, available_qty=0, cycle_count_due=true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-NEW", description: "fresh", abc_class: "C", each_volume_cm3: 2.5, min_qty: 3, max_qty: 30 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Sku.${sid}.abc_class == C"
            - "Sku.${sid}.on_hand_qty == 0"
            - "Sku.${sid}.available_qty == 0"
            - "Sku.${sid}.cycle_count_due == true"

      - name: get_sku_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Sku"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /skus/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /warehouse/skus/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_sku_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - "entities.Sku.fields.abc_class"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /skus missing abc_class returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-BAD", description: "no class", each_volume_cm3: 1, min_qty: 1, max_qty: 10 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_sku_invalid_enum_abc_class_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.Sku.fields.abc_class"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /skus with abc_class='Z' (outside {A,B,C}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-ENUM", description: "bad enum", abc_class: "Z", each_volume_cm3: 1, min_qty: 1, max_qty: 10 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_location_default_status_available
        claim_type: Defaults
        grounds:
          - "entities.Location.fields.status"
        distinguishing_aspect: "POST /locations omitting status applies the default AVAILABLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-DEF", zone: "RESERVE", max_volume_cm3: 100 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Location.${lid}.status == AVAILABLE"
            - "Location.${lid}.used_volume_cm3 == 0"

      - name: order_default_priority_applied
        claim_type: Defaults
        grounds:
          - "entities.OutboundOrder.fields.priority"
        distinguishing_aspect: "POST /outbound-orders omitting priority applies the default 5."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-DEF" }
              as: WavePlanner
              captures: { oid: "$.data.id" }
          assert:
            - "response.status == 201"
            - "OutboundOrder.${oid}.priority == 5"
            - "OutboundOrder.${oid}.status == OPEN"

      - name: lpn_computed_onhand_ignores_input
        claim_type: Computed Fields
        grounds:
          - "entities.Sku.fields.on_hand_qty"
          - "calculations.sku_on_hand"
        distinguishing_aspect: "Sku.on_hand_qty is computed from STORED/ALLOCATED/PICKED_STAGED LPNs; after one putaway of qty 7 the field reads 7 regardless of any client-supplied value."
        test_recipe:
          setup: ["A SKU with one putaway-complete LPN of qty 7 STORED."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-CMP", description: "c", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-CMP", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-CMP", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 7 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 7 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { pid: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "GET /warehouse/skus/${sid}"
              payload: {}
              as: InventoryController
              captures: { oh: "$.data.on_hand_qty" }
          assert:
            - "Sku.${sid}.on_hand_qty == 7"

      - name: list_skus_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.Sku"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /skus returns response_type=array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two SKUs exist."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-L1", description: "a", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 10 }
              as: PlatformAdmin
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-L2", description: "b", abc_class: "B", each_volume_cm3: 1, min_qty: 1, max_qty: 10 }
              as: PlatformAdmin
          trigger:
            - call: "GET /warehouse/skus"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: putaway_assign_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.PutawayTask.CREATED_to_ASSIGNED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Assigning a PutawayTask that is already COMPLETED returns ERR_INVALID_STATE (409); no second target is set."
        test_recipe:
          setup: ["A COMPLETED putaway task."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-SM1", description: "s", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-SM1", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-SM1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 3 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 3 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { pid: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "PutawayTask.${pid}.status == COMPLETED"

      - name: asn_cancel_after_receiving_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.InboundAsn.ANNOUNCED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling an ASN that is already RECEIVING (a receipt was posted) returns ERR_INVALID_STATE; cancel is only valid from ANNOUNCED."
        test_recipe:
          setup: ["A RECEIVING ASN (one receipt posted)."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-SM2", description: "s", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-SM2", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
          trigger:
            - call: "POST /warehouse/inbound-asns/${aid}/cancel"
              payload: {}
              as: ReceivingClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "InboundAsn.${aid}.status == RECEIVING"

      - name: crossdock_close_lands_lpn_stored_in_crossdock_zone
        claim_type: Valid Transition
        grounds:
          - "state_machines.InboundAsn.RECEIVING_to_CROSS_DOCKED"
          - "calculations.crossdock_location_select"
          - "state_machines.LicensePlate.PUTAWAY_PENDING_to_STORED"
        distinguishing_aspect: "Closing a CROSS_DOCK ASN moves its received LPN directly to a CROSS_DOCK-zone location (STORED) with NO PutawayTask created; ASN status becomes CROSS_DOCKED."
        test_recipe:
          setup: ["A CROSS_DOCK ASN received with one LPN qty 5; a CROSS_DOCK-zone location exists."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-XD1", description: "x", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "XD-1", zone: "CROSS_DOCK", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { xd: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-XD1", supplier_name: "Acme", handling_mode: "CROSS_DOCK" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
          trigger:
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
          assert:
            - "InboundAsn.${aid}.status == CROSS_DOCKED"
            - "LicensePlate.${lpnid}.disposition == STORED"
            - "LicensePlate.${lpnid}.location_id == ${xd}"

      - name: short_pick_releases_allocation_reverts_lpn
        claim_type: Compensation
        grounds:
          - "state_machines.PickTask.IN_PROGRESS_to_SHORT"
          - "state_machines.InventoryAllocation.RESERVED_to_RELEASED"
          - "state_machines.LicensePlate.ALLOCATED_to_STORED"
        distinguishing_aspect: "Short-picking an IN_PROGRESS pick releases its RESERVED allocation (RELEASED) and reverts the LPN ALLOCATED->STORED; OrderLine.allocated_qty drops to 0."
        test_recipe:
          setup: ["A picking wave with one IN_PROGRESS pick task on a fully-reserved LPN."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-SH1", description: "sh", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-SH1", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-SH1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { pid: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-SH1", priority: 5 }
              as: WavePlanner
              captures: { oid: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${oid}/lines"
              payload: { sku_id: "${sid}", ordered_qty: 5 }
              as: WavePlanner
              captures: { olid: "$.data.id" }
            - call: "POST /warehouse/waves"
              payload: { wave_label: "WAVE-SH1" }
              as: WavePlanner
              captures: { wid: "$.data.id", wv: "$.data.version" }
            - call: "POST /warehouse/waves/${wid}/add-order"
              payload: { order_id: "${oid}" }
              as: WavePlanner
              captures: { wv2: "$.data.version" }
            - call: "POST /warehouse/waves/${wid}/release"
              payload: { expected_wave_version: "${wv2}" }
              as: WavePlanner
            - call: "POST /warehouse/waves/${wid}/start-picking"
              payload: {}
              as: WavePlanner
            - call: "GET /warehouse/waves/${wid}/pick-tasks"
              payload: {}
              as: Picker
              captures: { ptid: "$.data[0].id" }
            - call: "POST /warehouse/pick-tasks/${ptid}/start"
              payload: {}
              as: Picker
          trigger:
            - call: "POST /warehouse/pick-tasks/${ptid}/short"
              payload: {}
              as: Picker
          assert:
            - "PickTask.${ptid}.status == SHORT"
            - "LicensePlate.${lpnid}.disposition == STORED"
            - "OrderLine.${olid}.allocated_qty == 0"

      - name: terminal_shipped_order_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.OutboundOrder.OPEN_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a SHIPPED order returns ERR_INVALID_STATE; cancel is only valid from OPEN, and SHIPPED is terminal."
        test_recipe:
          setup: ["A fully shipped order."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-TL1", description: "tl", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-TL1", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-TL1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 4 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { pid: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-TL1", priority: 5 }
              as: WavePlanner
              captures: { oid: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${oid}/lines"
              payload: { sku_id: "${sid}", ordered_qty: 4 }
              as: WavePlanner
              captures: { olid: "$.data.id" }
            - call: "POST /warehouse/waves"
              payload: { wave_label: "WAVE-TL1" }
              as: WavePlanner
              captures: { wid: "$.data.id" }
            - call: "POST /warehouse/waves/${wid}/add-order"
              payload: { order_id: "${oid}" }
              as: WavePlanner
              captures: { wv2: "$.data.version" }
            - call: "POST /warehouse/waves/${wid}/release"
              payload: { expected_wave_version: "${wv2}" }
              as: WavePlanner
            - call: "POST /warehouse/waves/${wid}/start-picking"
              payload: {}
              as: WavePlanner
            - call: "GET /warehouse/waves/${wid}/pick-tasks"
              payload: {}
              as: Picker
              captures: { ptid: "$.data[0].id" }
            - call: "POST /warehouse/pick-tasks/${ptid}/start"
              payload: {}
              as: Picker
            - call: "POST /warehouse/pick-tasks/${ptid}/confirm"
              payload: { light_confirmed: true }
              as: Picker
            - call: "POST /warehouse/outbound-orders/${oid}/ship"
              payload: {}
              as: Picker
          trigger:
            - call: "POST /warehouse/outbound-orders/${oid}/cancel"
              payload: {}
              as: WavePlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "OutboundOrder.${oid}.status == SHIPPED"

      - name: lpn_initial_disposition_putaway_pending
        claim_type: Initial State
        grounds:
          - "state_machines.LicensePlate"
          - "entities.LicensePlate.fields.disposition"
        distinguishing_aspect: "An LPN minted by a receipt starts in disposition PUTAWAY_PENDING with location_id null."
        test_recipe:
          setup: ["An ASN with one receipt posted."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-INI", description: "i", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-INI", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
          trigger:
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
          assert:
            - "LicensePlate.${lpnid}.disposition == PUTAWAY_PENDING"
            - "LicensePlate.${lpnid}.location_id == null"

      - name: stale_lpn_version_conflict_on_manual_allocation
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[allocation-create-stale-lpn]"
          - "errors[ERR_STALE_LPN_VERSION]"
        distinguishing_aspect: "A second manual allocation carrying the LPN version observed BEFORE the first allocation bumped it (expressed as ${lpn_v} from the pre-first-allocation read) is rejected with ERR_STALE_LPN_VERSION (412)."
        test_recipe:
          setup: ["A STORED LPN qty 10 and an order line ordered_qty 10; one allocation of 4 already posted, bumping LPN version."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
