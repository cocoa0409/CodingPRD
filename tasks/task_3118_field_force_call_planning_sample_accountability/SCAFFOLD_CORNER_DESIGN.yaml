              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0213", brand_name: "Actol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
