scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: client_creation_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with all required fields returns 201, status defaults ONBOARDING, outstanding_fee_cents defaults 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { legal_name: "New Co", entity_type: "S_CORP", marginal_tax_rate: 0.30 }, as: StudyManager, captures: { cli: "$.data.id" } }
          assert:
            - "Client.${cli}.status == ONBOARDING"
            - "Client.${cli}.outstanding_fee_cents == 0"
            - "Client.${cli}.version == 1"

      - name: get_study_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Study, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /studies/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /studies/00000000-0000-0000-0000-000000000000", payload: {}, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: property_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Property, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /properties omitting purchase_price_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["ACTIVE client"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "P Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
          trigger:
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "x", building_type: "COMMERCIAL", land_value_cents: 10000, placed_in_service_date: "2024-01-01T00:00:00.000Z" }, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: study_is_look_back_defaults_false
        claim_type: Defaults
        grounds: [entities.Study.fields.is_look_back]
        distinguishing_aspect: "POST /studies without is_look_back leaves is_look_back == false."
        test_recipe:
          setup: ["ACTIVE client"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "D Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
          trigger:
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
          assert:
            - "Study.${st}.is_look_back == false"
            - "Study.${st}.status == DRAFT"

      - name: property_depreciable_basis_computed
        claim_type: Computed Fields
        grounds: [entities.Property.fields.depreciable_basis_cents]
        distinguishing_aspect: "depreciable_basis_cents = purchase_price_cents - land_value_cents = 120000000 - 20000000 = 100000000, ignoring any client-supplied value."
        test_recipe:
          setup: ["ACTIVE client"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "B Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
          trigger:
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "y", building_type: "INDUSTRIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-01-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
          assert:
            - "Property.${prop}.depreciable_basis_cents == 100000000"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: allocate_from_excluded_component_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AssetComponent.PROPOSED_to_EXCLUDED, state_machines.AssetComponent.PROPOSED_to_ALLOCATED]
        distinguishing_aspect: "Allocating a component already EXCLUDED (terminal) returns ERR_INVALID_STATE; no ledger change."
        test_recipe:
          setup: ["COST_SEGREGATION study in ENGINEERING with a PROPOSED then EXCLUDED component"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "SM Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e1@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "z", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-01-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "c", asset_class: "FIVE_YEAR", allocated_cost_cents: 1000000 }, as: Engineer, as_user_id: "${eng}", captures: { c: "$.data.id" } }
            - { call: "POST /asset-components/${c}/exclude", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /asset-components/${c}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_already_cancelled_study_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Study.DRAFT_to_CANCELLED]
        distinguishing_aspect: "Cancelling a study already in terminal CANCELLED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE client; DRAFT study cancelled once"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "TC Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/cancel", payload: {}, as: StudyManager }
          trigger:
            - { call: "POST /studies/${st}/cancel", payload: {}, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: pay_already_paid_invoice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.FeeInvoice.ISSUED_to_PAID]
        distinguishing_aspect: "Paying a FeeInvoice already PAID returns ERR_INVALID_STATE; outstanding not double-decremented."
        test_recipe:
          setup: ["A FINALIZED cost-seg study with an ISSUED FeeInvoice that was paid once"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Pay Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e2@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "R", email: "r2@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "p", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 500000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}" }
            - { call: "GET /studies/${st}/fee-invoices", payload: {}, as: StudyManager, captures: { inv: "$.data[0].id" } }
            - { call: "POST /fee-invoices/${inv}/pay", payload: {}, as: StudyManager }
          trigger:
            - { call: "POST /fee-invoices/${inv}/pay", payload: {}, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: study_review_cycle_covered_by_difficulty
        claim_type: valid_transition
        grounds: [state_machines.Study.IN_REVIEW_to_ENGINEERING]
        excluded_because:
          difficulty_instance: non_linear_state_machine / study_review_engineering_cycle
          rationale: "The reject/re-submit cycle is exercised by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: contract_research_qualified_amount_capped_at_65
        claim_type: Correct Result
        grounds: [calculations.qre_qualified_amount, entities.QreLineItem.fields.qualified_amount_cents]
        distinguishing_aspect: "CONTRACT_RESEARCH gross 3000000 at qualified_percent 0.80 is capped to 0.65 → qualified_amount_cents = round(3000000*0.65) = 1950000."
        test_recipe:
          setup: ["RD_CREDIT study in ENGINEERING with a DRAFT CONTRACT_RESEARCH line"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "CR Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e3@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, credit_method: "ASC" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "CONTRACT_RESEARCH", gross_amount_cents: 3000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q: "$.data.id" } }
          trigger:
            - { call: "POST /qre-line-items/${q}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { qa: "$.data.qualified_amount_cents" } }
          assert:
            - "QreLineItem.${q}.qualified_amount_cents == 1950000"
            - "QreLineItem.${q}.status == QUALIFIED"

      - name: asc_startup_rate_when_no_prior_qre
        claim_type: Variant Selection
        grounds: [calculations.rd_credit, entities.Study.fields.rd_credit_asc_cents]
        distinguishing_aspect: "With priors all 0 (avg_prior==0) the ASC branch uses ASC_STARTUP_RATE 0.06: current_qre 7950000 → rd_credit_asc_cents = round(0.06*7950000) = 477000."
        test_recipe:
          setup: ["RD_CREDIT study ASC, priors 0/0/0, engineer assigned; three QUALIFIED lines totalling current_qre 7950000"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "SU Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e4@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, credit_method: "ASC", prior_qre_year1_cents: 0, prior_qre_year2_cents: 0, prior_qre_year3_cents: 0 }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "WAGES", gross_amount_cents: 5000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q1: "$.data.id" } }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "SUPPLIES", gross_amount_cents: 2000000, qualified_percent: 1.00 }, as: Engineer, as_user_id: "${eng}", captures: { q2: "$.data.id" } }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "CONTRACT_RESEARCH", gross_amount_cents: 3000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q3: "$.data.id" } }
            - { call: "POST /qre-line-items/${q1}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /qre-line-items/${q2}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /qre-line-items/${q3}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { asc: "$.data.rd_credit_asc_cents" } }
          assert:
            - "Study.${st}.rd_credit_asc_cents == 477000"

      - name: study_fee_fixed_amount_used_verbatim
        claim_type: Correct Result
        grounds: [calculations.study_fee, entities.FeeInvoice.fields.amount_cents]
        distinguishing_aspect: "A FIXED fee study produces a FeeInvoice with amount_cents == fee_fixed_amount_cents (500000) and fee_basis == FIXED, independent of benefit."
        test_recipe:
          setup: ["FINALIZED cost-seg study with FIXED fee 500000"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "FF Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e5@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "R", email: "r5@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "f", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 500000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}" }
          trigger:
            - { call: "GET /studies/${st}/fee-invoices", payload: {}, as: StudyManager, captures: { amt: "$.data[0].amount_cents", basis: "$.data[0].fee_basis" } }
          assert:
            - "FeeInvoice for study ${st} has amount_cents == 500000"
            - "FeeInvoice for study ${st} has fee_basis == FIXED"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: allocation_exceeds_basis_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_ALLOCATION_EXCEEDS_BASIS]"]
        distinguishing_aspect: "Allocating a component whose cost pushes total_allocated above depreciable_basis (100000000) returns ERR_ALLOCATION_EXCEEDS_BASIS."
        test_recipe:
          setup: ["COST_SEGREGATION study ENGINEERING; a PROPOSED component of 100000001 (> basis 100000000)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "AX Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e6@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "ax", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "big", asset_class: "THIRTY_NINE_YEAR", allocated_cost_cents: 100000001 }, as: Engineer, as_user_id: "${eng}", captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /asset-components/${c}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ALLOCATION_EXCEEDS_BASIS"
            - "http status == 409"

      - name: amend_window_expired_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_AMEND_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Filing an amended return for amended_tax_year 2020 at default clock year 2026 (2020+3=2023 < 2026) returns ERR_AMEND_WINDOW_EXPIRED."
        test_recipe:
          setup: ["A DELIVERED look-back cost-seg study with a DRAFT amended return for amended_tax_year 2020"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "AW Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e7@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "R", email: "r7@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "aw", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2019-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2020, is_look_back: true }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}" }
            - { call: "POST /studies/${st}/deliver", payload: {}, as: CPA, captures: { sv: "$.data.version" } }
            - { call: "POST /studies/${st}/amended-returns", payload: { amended_tax_year: 2020, expected_study_version: "${sv}" }, as: StudyManager, captures: { am: "$.data.id" } }
          trigger:
            - { call: "POST /amended-returns/${am}/file", payload: {}, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_AMEND_WINDOW_EXPIRED"
            - "http status == 409"

      - name: scope_fixed_missing_fee_terms_rejected
        claim_type: Violation → Error
        grounds: ["errors[ERR_MISSING_FEE_TERMS]", state_machines.Study.DRAFT_to_SCOPING]
        distinguishing_aspect: "Scoping with fee_type FIXED but no fee_fixed_amount_cents returns ERR_MISSING_FEE_TERMS (422)."
        test_recipe:
          setup: ["ACTIVE client; property; DRAFT cost-seg study"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "MT Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "mt", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
