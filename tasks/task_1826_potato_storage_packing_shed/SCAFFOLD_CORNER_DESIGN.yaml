            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DV" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer Z", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 75.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
