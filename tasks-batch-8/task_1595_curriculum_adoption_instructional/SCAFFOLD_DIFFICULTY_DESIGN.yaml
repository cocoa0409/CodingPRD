        distinguishing_aspect: |
          Percent metric on the cycle-transitions endpoint: coverage of exactly 85.00 (17 FULL of
          20 required standards) must PASS the >= gate, while 82.50 (16 FULL + 1 PARTIAL) must FAIL
          with ERR_ALIGNMENT_COVERAGE_BELOW_THRESHOLD. Distinct metric and endpoint from
          participation_floor_inclusive_at_board (ratio metric on board-decision).
