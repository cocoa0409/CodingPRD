  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_adverse_closure_freezes_agency_declines_letter_and_spawns_successor
        grounds:
          - state_machines.EscrowAudit.UNDER_REVIEW_to_CLOSED_ADVERSE
          - calculations.agency_defalcation_score
          - calculations.agency_oversight_posture
          - entities.EscrowAccount.fields.status
          - entities.ClosingProtectionLetter.fields.status
          - entities.EscrowAudit.fields.follow_up_of_audit_id
        distinguishing_aspect: |
          Trigger is an escrow audit closure (POST
          /escrow-audits/{id}/state -> CLOSED_ADVERSE) and the chain runs five
          hops deep: the closure recomputes defalcation_score to 83 (hop 1),
          which drives escrow_standing to DEFALCATION_RISK (hop 2), which drives
          oversight_posture to FROZEN (hop 3), which restricts the escrow account
          and declines the outstanding letter (hop 4), which is followed by the
          auto-created successor SURPRISE audit (hop 5). Each hop is caused by
          the value produced by the previous one — score 60 is the gate for hop 2
          and FROZEN is the gate for hop 4.
        test_recipe:
          setup:
            - "APPOINTED agency in CA, posture OPEN at the moment its letter is requested, so ClosingProtectionLetter CPL-1 lands on REQUESTED (30000000 requested, below both the 60000000 state referral threshold and the 50000000 authority limit)."
            - "Escrow account ESCROW-1 snapshotted as book 10000000, bank 10000000, outstanding 0, trial 4000000, so the SCHEDULED audit's BANK_TO_TRIAL variance is 6000000 and its auto-raised THREE_WAY_VARIANCE finding is CRITICAL."
            - "Two manually raised COMMINGLING findings (always CRITICAL) on the same audit, giving three CRITICAL findings in total."
            - "The audit sits in UNDER_REVIEW with the THREE_WAY_VARIANCE finding ESCALATED, which is the precondition for CLOSED_ADVERSE."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
