# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3356_full_time_service_corps_placement_schools_stipend
# Breadth probe over §1.1–§1.7 claims that SCAFFOLD_DIFFICULTY_DESIGN.yaml does
# not already exercise; covered corners appear as excluded_because stubs.
# Anchors (&c_*) are defined at first use and referenced afterwards.
# Canonical world literals match the difficulty file: service year
# 2026-09-01..2027-06-15, stipend 1300000, school team_size 3 / cost 400000,
# member DOB 2003-05-20.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: site_create_defaults_and_tight_posture
        claim_type: Creation
        grounds:
          - entities.Site
          - endpoints.POST_/corps/sites
          - calculations.site_funding_posture
        distinguishing_aspect: "A Site created with only the required fields comes back 201 in SETUP with version 1, every computed funding/cost-share field at 0, headroom 0 and posture TIGHT (0 <= 0 < 500000) — committed channels default 0 and status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
          trigger:
            - &c_site
              call: "POST /corps/sites"
              payload: { name: "Riverton Site", city: "Riverton", service_year_start: "2026-09-01", service_year_end: "2027-06-15", annual_stipend_cents: 1300000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { site_id: $.data.id, site_status: $.data.status, site_v: $.data.version, site_posture: $.data.funding_posture, site_head: $.data.funding_headroom_cents, site_cs1: $.data.cost_share_installment_1_cents }
          assert:
            - "the response status is 201 and response_type is object"
            - "${site_status} == SETUP and ${site_v} == 1"
            - "${site_posture} == TIGHT and ${site_head} == 0 (no funding, no obligations)"
            - "${site_cs1} == 0 (no schools in the cost-share input set)"
            - "Site.${site_id} carries non-null id, created_at, updated_at and district/philanthropy/federal committed+received all 0"

      - name: school_create_roundtrip
        claim_type: Retrieval
        grounds:
          - entities.School
          - endpoints.POST_/corps/schools
          - endpoints.GET_/corps/schools/{id}
        distinguishing_aspect: "Every School field round-trips through GET exactly as posted; both state dimensions initialize to DRAFT and the POSTed status field is not accepted (not in the input schema)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site exists."
          setup_api_calls:
            - *c_clock
            - *c_site
          trigger:
            - &c_school
              call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "Riverton Elementary", district_name: "Riverton USD", team_size: 3, service_scope: ["ATTENDANCE_SUPPORT", "MATH_TUTORING"], annual_cost_share_cents: 400000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_id: $.data.id }
            - call: "GET /corps/schools/${school_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { sch_agr: $.data.agreement_status, sch_ds: $.data.data_sharing_status, sch_ts: $.data.team_size, sch_cost: $.data.annual_cost_share_cents, sch_scope: $.data.service_scope }
          assert:
            - "${sch_agr} == DRAFT and ${sch_ds} == DRAFT"
            - "${sch_ts} == 3 and ${sch_cost} == 400000"
            - "${sch_scope} == [ATTENDANCE_SUPPORT, MATH_TUTORING]"

      - name: member_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/corps/members/{id}
          - errors[ERR_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: "GET with a well-formed but non-existent member UUID returns the fixed error envelope: response_type error with data.error_id ERR_NOT_FOUND and a message."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /corps/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "${nf_err} == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: hour_entry_create_extra_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.ServiceHourEntry
          - entities.CorpsMember.fields.verified_hours_total
        distinguishing_aspect: "A client-supplied verified_hours_total on the create payload is ignored: the entry is created PENDING and the member's computed totals stay 0."
        test_recipe:
          setup:
            - "Site ACTIVE. Member ACTIVE. (This instance defines the &c_app..&c_activate member-chain anchors reused by all later instances.)"
          setup_api_calls:
            - *c_clock
            - *c_site
            - &c_site_on
              call: "POST /corps/sites/${site_id}/state"
              payload: { to_status: "ACTIVE" }
              as: SiteDirector
              as_user_id: "sd-1"
            - &c_app
              call: "POST /corps/applications"
              payload: { site_id: "${site_id}", full_name: "Jordan Rivers", date_of_birth: "2003-05-20", education_level: "BACHELORS_PLUS", citizenship_status: "US_CITIZEN", prior_service_terms: 0, prior_full_awards_received: 0 }
              as: Applicant
              as_user_id: "app-jordan"
              captures: { app_id: $.data.id }
            - &c_screen
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "SCREEN" }
              as: ProgramManager
              as_user_id: "pm-1"
            - &c_interview
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "INTERVIEWED" }
              as: ProgramManager
              as_user_id: "pm-1"
            - &c_offer
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "OFFERED" }
              as: ProgramManager
              as_user_id: "pm-1"
            - &c_accept
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: Applicant
              as_user_id: "app-jordan"
            - &c_enroll
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "ENROLLED" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { member_id: $.data.enrolled_member_id }
            - &c_activate
              call: "POST /corps/members/${member_id}/state"
              payload: { to_status: "ACTIVE", dimension: "SERVICE" }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 4.0, category: "TRAINING", verified_hours_total: 999 }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he_id: $.data.id, he_status: $.data.status }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tot: $.data.verified_hours_total }
          assert:
            - "the create succeeds (201) and ${he_status} == PENDING"
            - "ServiceHourEntry.${he_id} carries no verified_hours_total field"
            - "${tot} == 0.0 (the injected 999 never reached the computed ledger)"

      - name: hour_entry_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ServiceHourEntry
        distinguishing_aspect: "ServiceHourEntry declares common_fields: false — its responses carry id and created_at but no version and no updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Site ACTIVE; member ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
          trigger:
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 2.5, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he_id: $.data.id }
          assert:
            - "the response data has non-null id and created_at"
            - "the response data has NO version key and NO updated_at key"
            - "ServiceHourEntry.${he_id}.status == PENDING"

      - name: schools_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/corps/sites/{id}/schools
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three schools on file, limit=2&offset=0 returns 2 rows reporting total_count 3 and has_more true; offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site exists with three schools."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_school
            - call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "East Middle", district_name: "Riverton USD", team_size: 4, service_scope: ["LITERACY_TUTORING"], annual_cost_share_cents: 250000 }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "West High", district_name: "Riverton USD", team_size: 5, service_scope: ["WHOLE_SCHOOL_EVENTS"], annual_cost_share_cents: 300000 }
              as: SiteDirector
              as_user_id: "sd-1"
          trigger:
            - call: "GET /corps/sites/${site_id}/schools"
              payload: { limit: 2, offset: 0 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /corps/sites/${site_id}/schools"
              payload: { limit: 2, offset: 2 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "page 1 returns exactly 2 rows and reports total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 row and reports total_count == 3 and has_more == false"
            - "${page1_first} != ${page2_first} (disjoint pages)"

      - name: application_create_initial_state_and_envelope
        claim_type: Creation
        grounds:
          - entities.CorpsMemberApplication
          - state_machines.CorpsMemberApplication
          - response_envelope.success
        distinguishing_aspect: "A fresh application is SUBMITTED at version 1 with null rejection_reason and null enrolled_member_id; the success envelope carries meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site exists."
          setup_api_calls:
            - *c_clock
            - *c_site
          trigger:
            - call: "POST /corps/applications"
              payload: { site_id: "${site_id}", full_name: "Sam Ortega", date_of_birth: "2002-01-15", education_level: "ASSOCIATES", citizenship_status: "US_NATIONAL", prior_service_terms: 1, prior_full_awards_received: 0 }
              as: Applicant
              as_user_id: "app-sam"
              captures: { probe_app: $.data.id, probe_status: $.data.status, probe_v: $.data.version, probe_reason: $.data.rejection_reason }
          assert:
            - "${probe_status} == SUBMITTED and ${probe_v} == 1 and ${probe_reason} is null"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: school_terminated_lockdown_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.School.agreement_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "TERMINATED is terminal: a further agreement transition on the terminated school is rejected and mutates nothing. (This instance defines the &c_ds_sign / &c_agr_sign / &c_agr_active anchors.)"
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE. School carried DRAFT -> (data sharing SIGNED) -> SIGNED -> ACTIVE -> TERMINATED."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - &c_ds_sign
              call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "DATA_SHARING" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - &c_agr_sign
              call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - &c_agr_active
              call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_v: $.data.version }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "TERMINATED", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { term_st: $.data.agreement_status }
          trigger:
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SUSPENDED", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { lock_err: $.data.error_id }
          assert:
            - "${term_st} == TERMINATED"
            - "${lock_err} == ERR_INVALID_STATE (no transitions leave a terminal state)"

      - name: application_submitted_to_offered_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CorpsMemberApplication
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The recruitment pipeline is branching but ordered: SUBMITTED cannot jump straight to OFFERED — the screening and interview branches must be traversed first."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site exists. Application SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_app
          trigger:
            - call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "OFFERED" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { jump_err: $.data.error_id }
          assert:
            - "${jump_err} == ERR_INVALID_STATE"
            - "The application remains SUBMITTED (rejection mutated nothing)"

      - name: stipend_scheduled_to_paid_skips_approve_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.StipendPayment.status
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_stipend_pay
          rationale: "The SCHEDULED -> PAID jump is exactly the dual-failure trigger of the named §1.8 instance, which asserts ERR_INVALID_STATE wins; no separate corner needed."

      - name: hour_entry_reject_then_verify_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceHourEntry.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REJECTED is terminal for an hour entry: a later VERIFY on the same entry is rejected, and the member's totals never move."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE, member ACTIVE. Entry (3.0 TRAINING, 2026-09-01) created then REJECTED with a reason."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 3.0, category: "TRAINING" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he_id: $.data.id }
            - call: "POST /corps/hour-entries/${he_id}/review"
              payload: { decision: "REJECT", reason: "unverifiable activity" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { he_st: $.data.status }
          trigger:
            - call: "POST /corps/hour-entries/${he_id}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { ver_err: $.data.error_id }
          assert:
            - "${he_st} == REJECTED"
            - "${ver_err} == ERR_INVALID_STATE (terminal lockdown on REJECTED)"
            - "Member.${member_id}.verified_hours_total == 0.0 (a rejected entry never enters the ledger)"

      - name: report_returned_resubmit_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.EvaluationReport.status
        distinguishing_aspect: "The report machine has a revision loop: SUBMITTED -> RETURNED -> SUBMITTED -> ACCEPTED, with return_reason cleared on resubmission and the school liaison as the only reviewer."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE, school ACTIVE with data sharing SIGNED. DRAFT report for period 2026-09-01..2026-10-31. Clock advanced to 2026-11-15 (inside the submission window: period_end + 45 = 2026-12-15)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - call: "POST /corps/evaluation-reports"
              payload: { school_id: "${school_id}", period_start: "2026-09-01", period_end: "2026-10-31" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rep_id: $.data.id }
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/evaluation-reports/${rep_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /corps/evaluation-reports/${rep_id}/state"
              payload: { to_status: "RETURNED", return_reason: "missing dosage narrative" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { rep_st1: $.data.status, rep_reason1: $.data.return_reason }
            - call: "POST /corps/evaluation-reports/${rep_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rep_st2: $.data.status, rep_reason2: $.data.return_reason }
            - call: "POST /corps/evaluation-reports/${rep_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { rep_st3: $.data.status }
          assert:
            - "${rep_st1} == RETURNED and ${rep_reason1} == missing dosage narrative"
            - "${rep_st2} == SUBMITTED and ${rep_reason2} is null (resubmission clears the return reason)"
            - "${rep_st3} == ACCEPTED (terminal)"

      - name: student_caseload_reassign_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Student.caseload_status
        distinguishing_aspect: "The caseload dimension is cyclic: UNASSIGNED -> ASSIGNED -> UNASSIGNED -> ASSIGNED again, with assigned_start_date rewritten each cycle. (Defines the &c_team / &c_assign / &c_deploy anchors.)"
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full world: school ACTIVE, Team Alpha DEPLOYED with the member's ACTIVE assignment. Student S01 exists."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - &c_team
              call: "POST /corps/teams"
              payload: { school_id: "${school_id}", name: "Team Alpha", backfill_deadline: "2027-01-15", backfill_limit: 2 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { team_id: $.data.id, team_v: $.data.version }
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - &c_assign
              call: "POST /corps/teams/${team_id}/assignments"
              payload: { corps_member_id: "${member_id}", start_date: "2026-09-01", expected_team_version: "${team_v}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg_id: $.data.id }
            - &c_deploy
              call: "POST /corps/teams/${team_id}/state"
              payload: { to_status: "DEPLOYED" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/students"
              payload: { school_id: "${school_id}", external_student_ref: "S01", grade_level: 5, focus_list_type: "LITERACY", baseline_attendance_pct: 91.0 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { stu1: $.data.id }
          trigger:
            - call: "POST /corps/students/${stu1}/caseload"
              payload: { action: "ASSIGN", corps_member_id: "${member_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cl1: $.data.caseload_status, cl1_start: $.data.assigned_start_date }
            - call: "POST /corps/students/${stu1}/caseload"
              payload: { action: "UNASSIGN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cl2: $.data.caseload_status, cl2_end: $.data.assigned_end_date, cl2_member: $.data.assigned_member_id }
            - call: "POST /corps/students/${stu1}/caseload"
              payload: { action: "ASSIGN", corps_member_id: "${member_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cl3: $.data.caseload_status, cl3_member: $.data.assigned_member_id }
          assert:
            - "${cl1} == ASSIGNED and ${cl1_start} == 2026-09-01"
            - "${cl2} == UNASSIGNED and ${cl2_end} == 2026-09-01 and ${cl2_member} is null"
            - "${cl3} == ASSIGNED and ${cl3_member} == ${member_id} (re-assignment after UNASSIGN closes the cycle)"

      - name: team_understaffed_backfill_recovers_deployed
        claim_type: side_effect
        grounds:
          - state_machines.Team.status
          - entities.TeamAssignment.fields.is_backfill
          - entities.Team.fields.backfill_count
        distinguishing_aspect: "Ending the only assignment of a DEPLOYED team auto-demotes it to UNDERSTAFFED; a backfill assignment (is_backfill true, backfill_count 1) auto-restores DEPLOYED once min staffing is met again — both transitions are system-driven."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full world: Team Alpha DEPLOYED with member 1's ACTIVE assignment. Member 2 (Riley Brooks) ACTIVE with no assignment."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - *c_team
            - *c_app
            - *c_screen
