          - entities.Department.fields.shelf_life_days_default
        distinguishing_aspect: |
          Two lots of the same production_date 2026-08-10 in one department diverge by which
          shelf life applies: the item declaring shelf_life_days 3 gets
          2026-08-13T00:00:00.000Z, the item declaring none falls back to the department's 10 and
          gets 2026-08-20T00:00:00.000Z. Both are midnight UTC of the production date plus days.
