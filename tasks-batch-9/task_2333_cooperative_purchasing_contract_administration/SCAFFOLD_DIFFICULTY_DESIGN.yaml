        distinguishing_aspect: |
          Retracting ONE already-swept usage has to walk three hops backwards: the member and contract
          ledgers are debited back, the SUBMITTED report is re-swept (swept_usage_count 3 -> 2,
          reported_chargeable 27045 -> 18030 and reported_fee 541 -> 361, which is NOT 541 minus 180
          because the REPORTED variant rounds the new aggregate afresh) and the posture is re-derived.
          The retracted row's usage_report_id must also be cleared, so a re-submit cannot pick it up
          again. An implementation that merely subtracts the usage's own fee from the report lands on
          360 rather than 361.
