        distinguishing_aspect: "One INSTALL_COMPLETE project with balance_due_cents 144714 triggers three codes that no cheaper fixture can reach: a one-cent-off balance payment is ERR_BALANCE_AMOUNT_MISMATCH, a second payment once balance_due_cents is 0 is the same code again, closing while permit_status is ISSUED in an inspection-required jurisdiction is ERR_INSPECTION_NOT_PASSED, and a warranty claim filed before closure is ERR_WARRANTY_EXPIRED for both claim types."
