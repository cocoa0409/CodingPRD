  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: offer_decline_conserves_instock_count
        grounds:
          - state_machines.Watch.IN_STOCK_to_OFFERED
          - state_machines.Watch.OFFERED_to_IN_STOCK
          - state_machines.WaitlistEntry.OFFERED_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity = COUNT(Watch WHERE model_id==M AND status==IN_STOCK). Forward offer
          (IN_STOCK->OFFERED) drops it 1->0; compensating decline (OFFERED->IN_STOCK) restores it
          0->1, exactly equal to the pre-offer value. Quantity type = inventory count.
        test_recipe:
          setup:
            - "allocation_controlled model M with exactly one authenticated IN_STOCK watch and one WAITING entry that gets offered the watch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Ova Pi", email: "ova@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "AP", reference_number: "15500", display_name: "Royal Oak", msrp_cents: 3000000, allocation_controlled: true }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "AP-1", condition_grade: "NEW", list_price_cents: 3000000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /waitlist-entries"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", priority_tier: "VIP", deposit_cents: 100000 }
              as: Associate
              captures: { wl_id: $.data.id }
            - call: "POST /watches/${watch_id}/offer"
              payload: {}
              as: Associate
              captures: { offered_status: $.data.status }
          trigger:
            - call: "POST /waitlist-entries/${wl_id}/decline"
              payload: {}
              as: Client
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "Before offer: COUNT(Watch model_id==M, status==IN_STOCK) == 1"
            - "After offer: that count == 0 and Watch.${watch_id}.status == OFFERED"
            - "After decline: WaitlistEntry.${wl_id}.status == DECLINED and Watch.${watch_id}.status == IN_STOCK, so COUNT == 1 (restored to the pre-offer value)"

      - name: tradein_settle_flag_conserves_store_credit
        grounds:
          - state_machines.TradeInOffer.ACCEPTED_to_SETTLED
          - state_machines.TradeInOffer.SETTLED_to_REVERSED
          - state_machines.Watch.AUTHENTICATED_to_FLAGGED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.store_credit_cents (money). Forward TRADE_IN settle credits
          +665280; compensating flag-inauthentic of the minted watch reverses the offer and debits
          -665280, restoring the balance to its pre-settle value 0. Quantity type = money (distinct
          from the inventory-count invariant).
        test_recipe:
          setup:
            - "Customer with store_credit_cents=0; an ACCEPTED TRADE_IN offer (est 1000000, EXCELLENT, box) that settles and mints an inventory watch."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fay Wu", email: "fay@x.com" }
              as: Associate
              captures: { f_id: $.data.id }
            - call: "POST /trade-in-offers"
              payload: { customer_id: "${f_id}", incoming_brand: "Rolex", incoming_reference: "126610LN", serial_number: "REV-1", est_model_msrp_cents: 1000000, condition_grade: "EXCELLENT", disposition: "TRADE_IN", has_box_papers: true }
              as: Associate
              captures: { offer_id: $.data.id, credit: $.data.quoted_credit_cents }
            - call: "POST /trade-in-offers/${offer_id}/accept"
              payload: {}
              as: Associate
            - call: "POST /trade-in-offers/${offer_id}/settle"
              payload: {}
              as: Associate
              captures: { rw_id: $.data.resulting_watch_id }
          trigger:
            - call: "POST /watches/${rw_id}/flag-inauthentic"
              payload: { reason: "post-intake authentication failure" }
              as: Associate
              captures: { auth: $.data.authentication_status }
          assert:
            - "Pre-settle Customer.${f_id}.store_credit_cents == 0"
            - "TradeInOffer.quoted_credit_cents == 665280"
            - "After settle Customer.${f_id}.store_credit_cents == 665280"
            - "After flag: TradeInOffer.${offer_id}.status == REVERSED and Customer.${f_id}.store_credit_cents == 0 (restored to the pre-settle value; store credit conserved)"
