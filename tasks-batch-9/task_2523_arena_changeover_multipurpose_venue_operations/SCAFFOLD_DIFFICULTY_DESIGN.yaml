          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered with PROFILE ICE declared."
            - "Anchor tenant Lakeside Hockey Club at TIER_2 with 5 guaranteed holds; anchor tenant Riverton Athletics at TIER_1 with 5 guaranteed holds and 2 challenge credits."
