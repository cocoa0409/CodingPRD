    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_UNAUTHORIZED]
    distinguishing_aspect: 'Entity-backed ownership: a Landowner whose X-User-ID differs from the order''s landowner_id is rejected with 403 ERR_UNAUTHORIZED.'
