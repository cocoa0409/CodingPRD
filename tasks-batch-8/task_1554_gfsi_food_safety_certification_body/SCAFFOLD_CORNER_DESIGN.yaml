# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — GFSI Food Safety Certification Body
# §1.9 Coverage Index: enumerative, non-difficulty testable claims of
# SCAFFOLD.yaml §1.1–§1.7, organized by the claim-extraction-guide sections.
# Corners already covered by §1.8 appear as excluded_because stubs.
#
# Pinned scheme constants (SQF): deadlines 7/28/84, pass 70, every_n 3,
# windows 60/30, gap 30, validity 1095d, witness 365d, appeal 14d,
# max_cap_rejections 3, rotation_limit 2, fees 2000.00/333.33/1000.00/0.10/1.5.
# Logical clock default: 2026-08-01T00:00:00Z.
# Default INITIAL audit window after accept at default clock:
#   [2026-08-15T00:00:00Z, 2026-09-14T00:00:00Z].
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: scheme_creation_stores_all_rule_constants
        claim_type: creation
        grounds: [entities.Scheme]
        distinguishing_aspect: "POST /schemes with all 21 rule constants returns 201 and the stored entity echoes them with system fields present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id, code: $.data.code }
          assert:
            - "http 201; Scheme.code == SQF; critical_nc_days == 7; pass_score == 70; unannounced_every_n == 3"
            - "Scheme.${scheme_id}.id is a server-minted UUID; created_at == 2026-08-01T00:00:00Z logical default; version == 1"

      - name: client_creation_success
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "POST /clients with valid input returns 201 with all input fields stored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
          assert:
            - "http 201; Client.${client_id}.name == 'Acme Baking Co'; contact_email == 'qa@acme.test'; country == 'US'; version == 1"

      - name: application_creation_missing_scope_text_returns_400
        claim_type: required_fields
        grounds: [entities.Application.fields.scope_text, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field scope_text on application create is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["SQF scheme and client exist"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }] }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 400 with error_id == ERR_INVALID_REQUEST (missing scope_text)"

      - name: application_rejects_invalid_risk_tier_returns_400
        claim_type: type_constraints
        grounds: [entities.Application.fields.product_categories, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A product_categories entry with risk_tier outside {STANDARD, HIGH} is a malformed enum -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["SQF scheme and client exist"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "EXTREME" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 400 with error_id == ERR_INVALID_REQUEST (risk_tier EXTREME not in {STANDARD, HIGH})"

      - name: auditor_defaults_calibration_lapsed_and_zero_active
        claim_type: defaults
        grounds: [entities.Auditor.fields.calibration_status, entities.Auditor.fields.active_audit_count, entities.Auditor.fields.conflicted_client_ids]
        distinguishing_aspect: "A freshly registered auditor has calibration_status LAPSED (no PASS witness audit), active_audit_count 0, and conflicted_client_ids defaulting to [] when omitted."
        test_recipe:
          setup: ["SQF scheme exists (witness validity window references it)"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
          trigger:
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY"] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
          assert:
            - "Auditor.${auditor_id}.calibration_status == LAPSED; active_audit_count == 0; conflicted_client_ids == []"
            - "Auditor.${auditor_id}.last_witnessed_on == null"

      - name: audit_sequence_number_and_window_system_assigned
        claim_type: system_fields
        grounds: [entities.Audit.fields.sequence_number, entities.Audit.fields.window_start, calculations.next_audit_sequence_and_type]
        distinguishing_aspect: "The INITIAL audit auto-created on application acceptance carries sequence_number 1, audit_type INITIAL, status SCHEDULED, and the system-computed window [accept+14d, accept+14d+30d]."
        test_recipe:
          setup: ["SQF scheme, client, application submitted"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id", seq: "$.data[0].sequence_number", wstart: "$.data[0].window_start" }
          assert:
            - "Audit.${audit_id}.sequence_number == 1; audit_type == INITIAL; status == SCHEDULED; auditor_id == null"
            - "Audit.${audit_id}.window_start == 2026-08-15T00:00:00Z and window_end == 2026-09-14T00:00:00Z (reviewed at 2026-08-01T00:00:00Z + 14d, +30d)"

      - name: certificate_number_minted_on_issuance
        claim_type: system_fields
        grounds: [entities.Certificate.fields.certificate_number]
        distinguishing_aspect: "The first certificate issued in a fresh system carries the system-minted number CERT-000001 (global issuance sequence, zero-padded)."
        test_recipe:
          setup: ["SQF scheme; client; witnessed auditor; decision maker; accepted application; assigned audit started at 2026-08-15T09:00:00Z; report submitted with actual_days=1"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 1 }
              as: Auditor
              as_user_id: "${auditor_id}"
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
            - call: "GET /certification-body/audits/${audit_id}/certificate"
              as: SchemeAdmin
              captures: { cert_number: "$.data[0].certificate_number" }
          assert:
            - "certificate_number == 'CERT-000001'"
            - "valid_from == 2026-08-15T09:00:00Z; valid_to == 2029-08-14T09:00:00Z (valid_from + 1095 days)"

      - name: get_nonexistent_client_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /clients/{random uuid} -> 404 ERR_CLIENT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/clients/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_CLIENT_NOT_FOUND"

      - name: get_nonexistent_scheme_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SCHEME_NOT_FOUND]"]
        distinguishing_aspect: "GET /schemes/{random uuid} -> 404 ERR_SCHEME_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/schemes/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_SCHEME_NOT_FOUND"

      - name: get_nonexistent_auditor_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AUDITOR_NOT_FOUND]"]
        distinguishing_aspect: "GET /auditors/{random uuid} -> 404 ERR_AUDITOR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/auditors/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_AUDITOR_NOT_FOUND"

      - name: get_nonexistent_decision_maker_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_DECISION_MAKER_NOT_FOUND]"]
        distinguishing_aspect: "GET /decision-makers/{random uuid} -> 404 ERR_DECISION_MAKER_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/decision-makers/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_DECISION_MAKER_NOT_FOUND"

      - name: get_nonexistent_application_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /applications/{random uuid} -> 404 ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/applications/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_APPLICATION_NOT_FOUND"

      - name: get_nonexistent_audit_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AUDIT_NOT_FOUND]"]
        distinguishing_aspect: "GET /audits/{random uuid} -> 404 ERR_AUDIT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/audits/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_AUDIT_NOT_FOUND"

      - name: get_nonexistent_nonconformity_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NC_NOT_FOUND]"]
        distinguishing_aspect: "GET /nonconformities/{random uuid} -> 404 ERR_NC_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/nonconformities/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_NC_NOT_FOUND"

      - name: get_nonexistent_certificate_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CERTIFICATE_NOT_FOUND]"]
        distinguishing_aspect: "GET /certificates/{random uuid} -> 404 ERR_CERTIFICATE_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /certification-body/certificates/11111111-2222-4333-8444-555555555555"
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_CERTIFICATE_NOT_FOUND"

      - name: decide_nonexistent_scope_change_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SCOPE_CHANGE_NOT_FOUND]"]
        distinguishing_aspect: "POST /scope-changes/{random uuid}/decision -> 404 ERR_SCOPE_CHANGE_NOT_FOUND."
        test_recipe:
          setup: ["a decision maker exists so the caller identity is valid"]
          setup_api_calls:
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
          trigger:
            - call: "POST /certification-body/scope-changes/11111111-2222-4333-8444-555555555555/decision"
              payload: { outcome: "APPROVED" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_SCOPE_CHANGE_NOT_FOUND"

      - name: decide_nonexistent_appeal_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_APPEAL_NOT_FOUND]"]
        distinguishing_aspect: "POST /appeals/{random uuid}/decide -> 404 ERR_APPEAL_NOT_FOUND."
        test_recipe:
          setup: ["a decision maker exists"]
          setup_api_calls:
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
          trigger:
            - call: "POST /certification-body/appeals/11111111-2222-4333-8444-555555555555/decide"
              payload: { outcome: "UPHELD" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_APPEAL_NOT_FOUND"

      - name: list_applications_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "GET /applications honors limit/offset with total_count and has_more per the fixed envelope: 2 applications, limit=1 -> 1 item, has_more true; offset=1 -> the second item, has_more false."
        test_recipe:
          setup: ["SQF and BRC schemes; one client with one application per scheme (both DRAFT)"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/schemes"
              payload: { code: "BRC", name: "BRCGS Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { brc_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${brc_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "baked goods (BRC)" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app2_id: $.data.id }
          trigger:
            - call: "GET /certification-body/applications?limit=1&offset=0"
              as: SchemeAdmin
            - call: "GET /certification-body/applications?limit=1&offset=1"
              as: SchemeAdmin
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true, item is the first-created application ${app1_id} (created_at ASC)"
            - "page 2: exactly 1 item, total_count == 2, has_more == false, item == ${app2_id}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_created_in_draft_initial_state
        claim_type: initial_state
        grounds: [state_machines.Application]
        distinguishing_aspect: "A newly created application starts in DRAFT with provisional_fee_quote null."
        test_recipe:
          setup: ["SQF scheme and client exist"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id, status: $.data.status }
          assert:
            - "Application.${app_id}.status == DRAFT; provisional_fee_quote == null; submitted_at == null"

      - name: application_submit_moves_draft_to_submitted
        claim_type: valid_transition
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting a DRAFT application moves it to SUBMITTED and stamps submitted_at with the current logical time."
        test_recipe:
          setup: ["SQF scheme; client; DRAFT application"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { status: $.data.status }
          assert:
            - "Application.${app_id}.status == SUBMITTED; submitted_at == 2026-08-01T00:00:00Z (logical clock default); version == 2"

      - name: application_resubmit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "Submit is not idempotent: a second submit on a SUBMITTED application fails with ERR_INVALID_APPLICATION_STATE."
        test_recipe:
          setup: ["SQF scheme; client; application already SUBMITTED"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_INVALID_APPLICATION_STATE; status remains SUBMITTED"

      - name: application_review_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application.SUBMITTED_to_ACCEPTED, "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "Scope review is only valid from SUBMITTED; reviewing a DRAFT application fails with ERR_INVALID_APPLICATION_STATE."
        test_recipe:
          setup: ["SQF scheme; client; DRAFT application (never submitted)"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_INVALID_APPLICATION_STATE; no audit created (GET /applications/{id}/audits returns empty array)"

      - name: rejected_application_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application]
        distinguishing_aspect: "REJECTED is terminal: after a REJECTED review, submit and further review both fail with ERR_INVALID_APPLICATION_STATE."
        test_recipe:
          setup: ["SQF scheme; client; application REJECTED at review"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "REJECTED", rejection_reason: "scope not certifiable" }
              as: SchemeAdmin
          trigger:
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "submit on REJECTED: http 409 ERR_INVALID_APPLICATION_STATE"
            - "review on REJECTED: http 409 ERR_INVALID_APPLICATION_STATE; status remains REJECTED"

      - name: audit_start_happy_path_in_window
        claim_type: valid_transition
        grounds: [state_machines.Audit.SCHEDULED_to_IN_PROGRESS]
        distinguishing_aspect: "Assigned auditor starts the audit inside its window: SCHEDULED -> IN_PROGRESS with started_at stamped."
        test_recipe:
          setup: ["SQF scheme; client; witnessed auditor; accepted application; audit assigned; clock at 2026-08-15T09:00:00Z (inside window)"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { status: $.data.status }
          assert:
            - "Audit.${audit_id}.status == IN_PROGRESS; started_at == 2026-08-15T09:00:00Z"

      - name: start_unassigned_audit_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_AUDIT_UNASSIGNED]"]
        distinguishing_aspect: "Starting an audit with no assigned auditor fails with ERR_AUDIT_UNASSIGNED (the null assignee falls through ownership to the constraint check)."
        test_recipe:
          setup: ["SQF scheme; client; auditor exists but is NOT assigned; accepted application; clock inside window 2026-08-15T09:00:00Z"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 422 with error_id == ERR_AUDIT_UNASSIGNED; audit remains SCHEDULED"

      - name: audit_start_before_window_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_OUTSIDE_AUDIT_WINDOW]"]
        distinguishing_aspect: "Starting before window_start fails with ERR_OUTSIDE_AUDIT_WINDOW: at 2026-08-10T00:00:00Z the window [2026-08-15, 2026-09-14] has not opened."
        test_recipe:
          setup: ["SQF scheme; client; witnessed auditor; accepted application; audit assigned; clock at 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SchemeAdmin
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http 422 with error_id == ERR_OUTSIDE_AUDIT_WINDOW; audit remains SCHEDULED"

      - name: audit_cancel_from_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Audit.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_AUDIT_STATE]"]
        distinguishing_aspect: "Cancel is only valid from SCHEDULED; cancelling an IN_PROGRESS audit fails with ERR_INVALID_AUDIT_STATE."
        test_recipe:
          setup: ["SQF scheme; accepted application; audit assigned and STARTED at 2026-08-15T09:00:00Z"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
