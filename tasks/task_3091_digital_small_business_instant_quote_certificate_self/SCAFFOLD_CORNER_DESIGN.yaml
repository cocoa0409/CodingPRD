              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
