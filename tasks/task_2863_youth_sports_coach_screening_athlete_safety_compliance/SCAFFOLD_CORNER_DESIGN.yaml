      - name: parallel_screening_and_membership_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Member.screening
          - state_machines.Member.membership
        excluded_because:
          difficulty_instance: non_linear_state_machine / member_screening_and_membership_dimensions_advance_independently
          rationale: "That instance walks both dimensions of the same Member row and asserts the screening dimension reaching CLEARED while the membership dimension is still PENDING."
      - name: membership_bubbles_to_active_only_when_both_gates_close
        claim_type: bubble_up
        grounds:
          - state_machines.Member.membership.PENDING_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / member_screening_and_membership_dimensions_advance_independently
          rationale: "The same instance asserts that the bubble-up fires only on the later of the adjudication and the training completion."
      - name: interim_measure_cascade_reaches_assignment_and_club_counters
        claim_type: cascade_down
        grounds:
          - endpoints[POST /safesport/cases/{case_id}/interim-measures].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / interim_measure_four_hop_restriction_cascade
          rationale: "All four hops of the imposition are asserted end-to-end there; this file covers the inverse lift in lifting_a_measure_restores_the_suspended_membership_and_assignment."
      - name: routed_and_administrative_closures_are_disjoint_branches
        claim_type: branching
        grounds:
