              payload: {}
              as: RiskManager
              as_user_id: "risk-56"
              captures: { bal_after: $.data.current_balance_cents, loaded_after: $.data.total_loaded_cents, redeemed_after: $.data.total_redeemed_cents, ratio_after: $.data.drawdown_ratio, merch_after: $.data.distinct_merchant_count, recent_after: $.data.recent_redemption_count }
          assert:
            - "${bal_before} == 12000, ${loaded_before} == 20000, ${redeemed_before} == 8000"
            - "${ratio_before} == 0.40, ${merch_before} == 2, ${recent_before} == 3"
            - "HTTP status == 201 for the reverse"
            - "${rev_type} == REDEMPTION_REVERSAL, ${rev_signed} == 4000, ${rev_target} == ${ev2}"
            - "${bal_after} == 16000 — 20000 - 3000 - 4000 - 1000 + 4000"
            - "${loaded_after} == 24000 — ACTIVATION_LOAD 20000 plus the REDEMPTION_REVERSAL credit of 4000"
            - "${redeemed_after} == 4000 — only the two unreversed REDEMPTIONs"
            - "${ratio_after} == 0.17 — round_half_up(4000 / 24000, 2), NOT 0.20"
            - "${merch_after} == 1 — store2's only redemption is reversed, so it leaves the merchant set"
            - "${recent_after} == 2"
            - "LedgerEvent.${ev2}.amount_cents == 4000 and signed_amount_cents == -4000 — the original row is untouched"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 5"
            - "GET /ledger-events?reverses_event_id=${ev2} returns total_count == 1"
            - "GiftCard.${card_id}.activation_state == ACTIVE and available_balance_cents == 16000"

      - name: net_funded_liability_counts_only_active_and_depleted_cards
