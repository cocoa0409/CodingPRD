        claim_type: scheduled_actions
        grounds: [entities.ServiceRequest.fields.deadline_utc, endpoints]
        distinguishing_aspect: "With the default clock 2026-01-01T00:00:00Z, a RUSH request submitted has deadline_utc == 2026-01-03T00:00:00Z (created_at + 48h)."
