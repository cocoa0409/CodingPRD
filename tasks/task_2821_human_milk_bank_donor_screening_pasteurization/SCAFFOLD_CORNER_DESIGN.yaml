      - name: reimbursement_variant_divergence_on_the_same_cooler
        claim_type: variant_divergence
        grounds:
          - calculations.shipment_reimbursement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shipment_reimbursement_provisional_vs_final_divergence
          rationale: "The named §1.8 instance runs both variants over one cooler and asserts the full 3540 vs 1416 delta."

      - name: reimbursement_variant_selection_and_ledger_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.shipment_reimbursement.variants
          - entities.Donor.fields.reimbursement_balance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / shipment_reimbursement_provisional_vs_final_divergence
          rationale: "The named §1.8 instance asserts that PROVISIONAL_AT_DISPATCH is stored at creation, FINAL_AT_RECEIPT replaces it at receipt, and only the final figure reaches the donor ledger."

      - name: risk_variant_selection_and_decay_curve
        claim_type: variant_selection
        grounds:
          - calculations.donor_risk_score.variants
          - calculations.donor_risk_score.constants.DECAY_HALF_LIFE_DAYS
        excluded_because:
          difficulty_instance: dual_variant_calc / donor_risk_screening_vs_surveillance_divergence
          rationale: "The named §1.8 instance asserts which variant each context uses (SCREENING_WORST_CASE on questionnaire submission, SURVEILLANCE_DECAYED at qualification) and exercises the 180-day half-life decay term."

      - name: culture_threshold_at_ten_cfu
        claim_type: threshold
        grounds:
          - state_machines.PasteurizationRun.COMPLETED_to_COMPLETED
          - endpoints[POST /milk-bank/pasteurization-runs/{id}/culture]
        excluded_because:
          difficulty_instance: transitive_cascade / failed_culture_four_hop_destruction
          rationale: "The named §1.8 instance records a culture at or above CULTURE_FAIL_CFU and asserts the FAILED branch together with its downstream cascade."

      - name: milk_volume_aggregate_conservation
        claim_type: aggregation
        grounds:
          - entities.Donation.fields.remaining_ml
          - entities.Pool.fields.total_volume_ml
        excluded_because:
          difficulty_instance: compensating_invariant / milk_volume_conservation_across_pool_scrap_and_reallocation
          rationale: "The named §1.8 instance asserts the running millilitre total after add, after scrap and after reallocation with no drift."

