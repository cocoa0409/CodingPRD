# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Payer Contract Modeling & Underpayment
# §1.9 Coverage Index: every testable claim of §1.1–§1.7 not covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: ent_payer_creation_applies_default_appeal_deadline
        claim_type: defaults
        grounds: [entities.Payer.fields.appeal_deadline_days, entities.Payer.fields.status]
        distinguishing_aspect: "Omitting appeal_deadline_days on create applies the default 45 and system-sets status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/payers"
              payload: { name: "Payer DEF", payer_type: "COMMERCIAL" }
              as: ContractManager
              captures: { pid: "$.data.id", dl: "$.data.appeal_deadline_days", st: "$.data.status" }
          assert:
            - "Payer.${pid}.appeal_deadline_days == 45 (${dl})"
            - "Payer.${pid}.status == ACTIVE (${st})"
            - "Payer.${pid}.version == 1"

      - name: ent_claim_creation_sets_system_fields
        claim_type: system_fields
        grounds: [entities.Claim.fields.pricing_status, entities.Claim.fields.remittance_status, entities.Claim.fields.network_flag, entities.Claim.fields.expected_reimbursement_cents]
        distinguishing_aspect: "A freshly ingested claim is UNPRICED / AWAITING_REMITTANCE / NONE with null pricing outputs and version 1, all server-set."
        test_recipe:
          setup: ["payer P ACTIVE"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SF", payer_type: "MEDICAID_MCO", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
          trigger:
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-SF1", patient_account_number: "PA-SF1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100 }
              as: RevenueIntegrityAnalyst
              captures: { cid: "$.data.id", ps: "$.data.pricing_status", rs: "$.data.remittance_status", nf: "$.data.network_flag", exp: "$.data.expected_reimbursement_cents", ver: "$.data.version" }
          assert:
            - "Claim.${cid}.pricing_status == UNPRICED (${ps})"
            - "Claim.${cid}.remittance_status == AWAITING_REMITTANCE (${rs})"
            - "Claim.${cid}.network_flag == NONE (${nf})"
            - "Claim.${cid}.expected_reimbursement_cents is null (${exp}) and original_expected_cents is null"
            - "Claim.${cid}.version == 1 (${ver}); id and created_at are server-minted"

      - name: ent_contract_open_underpayment_derived_at_read
        claim_type: computed_fields
        grounds: [entities.PayerContract.fields.open_underpayment_cents]
        distinguishing_aspect: "open_underpayment_cents is derived at read from non-terminal cases (50000 here) and the read does not bump the contract's version."
        test_recipe:
          setup:
            - "payer P; contract C ACTIVE CASE_RATE INPATIENT_MEDICAL 200000"
            - "claim priced 200000; remittance 150000 -> QUEUED case outstanding 50000 with contract_id = C"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer OU", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "OU-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "CASE_RATE", base_rate_cents: 200000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: "$.data.version" }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-OU1", patient_account_number: "PA-OU1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-02", total_billed_charges_cents: 300000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: "$.data.id" }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 300000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 150000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "GET /api/payer-contracts/${contract_id}"
              as: Auditor
              captures: { ou: "$.data.open_underpayment_cents", cv2: "$.data.version" }
          assert:
            - "PayerContract.${contract_id}.open_underpayment_cents == 50000 (${ou}) — sum over non-terminal cases only"
            - "PayerContract.${contract_id}.version == ${cv} (${cv2}) — derivation at read never bumps version"

      - name: ent_create_payer_missing_name_rejected
        claim_type: required_fields
        grounds: [entities.Payer.fields.name, "errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "POST /api/payers without required name is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/payers"
              payload: { payer_type: "COMMERCIAL" }
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 400 with ${err} == ERR_INVALID_REQUEST"

      - name: ent_create_payer_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Payer.fields.payer_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "payer_type outside {COMMERCIAL, MEDICARE_ADVANTAGE, MEDICAID_MCO, WORKERS_COMP} is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/payers"
              payload: { name: "Payer X", payer_type: "LLOYDS" }
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 400 with ${err} == ERR_INVALID_REQUEST"

      - name: ent_create_contract_unknown_field_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An unknown body field on contract creation is rejected ERR_INVALID_REQUEST (strict request shape)."
        test_recipe:
          setup: ["payer P ACTIVE"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer UF", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
          trigger:
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "UF-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31", region: "WEST" }
              as: ContractAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 400 with ${err} == ERR_INVALID_REQUEST"

      - name: ent_claim_future_discharge_rejected
        claim_type: type_constraints
        grounds: [entities.Claim.fields.discharge_date, "errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "discharge_date after today (2026-08-01 at the default clock) is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["payer P ACTIVE"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer FD", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
          trigger:
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-FD1", patient_account_number: "PA-FD1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-09-01", total_billed_charges_cents: 100 }
              as: RevenueIntegrityAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 400 with ${err} == ERR_INVALID_REQUEST (future discharge_date)"

      - name: ent_get_nonexistent_contract_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but absent contract id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/payer-contracts/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 404 with ${err} == ERR_NOT_FOUND"

      - name: ent_list_claims_filter_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints[GET /api/claims]
        distinguishing_aspect: "List endpoint honors limit/offset with the fixed envelope: page 1 of 3 claims at limit=2 returns 2 items, total_count 3, has_more true; page 2 returns 1 item, has_more false; payer_id filter narrows the set."
        test_recipe:
          setup: ["payer P with three claims CL-PG1..CL-PG3 (no contract needed)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PG", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PG1", patient_account_number: "PA-PG1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PG2", patient_account_number: "PA-PG2", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PG3", patient_account_number: "PA-PG3", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "GET /api/claims?payer_id=${payer_id}&limit=2&offset=0"
              as: Auditor
            - call: "GET /api/claims?payer_id=${payer_id}&limit=2&offset=2"
              as: Auditor
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"
            - "every returned claim has payer_id == ${payer_id}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_payer_deactivate_blocks_contract_activation
        claim_type: precondition_enforcement
        grounds: ["state_machines.Payer.ACTIVE_to_INACTIVE", "state_machines.PayerContract.DRAFT_to_ACTIVE", "errors[ERR_PAYER_INACTIVE]"]
        distinguishing_aspect: "Guarded cross-entity transition: activating a DRAFT contract whose payer was deactivated is rejected with ERR_PAYER_INACTIVE."
        test_recipe:
          setup: ["payer P ACTIVE; contract C DRAFT (2026-01-01..2026-12-31) under P"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PI", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "PI-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/payers/${payer_id}/deactivate"
              as: ContractManager
          trigger:
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 409 with ${err} == ERR_PAYER_INACTIVE"
            - "PayerContract.${contract_id}.status still == DRAFT"

      - name: sm_terminated_contract_rejects_suspend
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PayerContract.ACTIVE_to_TERMINATED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "TERMINATED is terminal: suspend on a terminated contract is rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["payer P; contract C ACTIVE then TERMINATED"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer TL", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "TL-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/payer-contracts/${contract_id}/terminate"
              as: ContractManager
          trigger:
            - call: "POST /api/payer-contracts/${contract_id}/suspend"
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "PayerContract.${contract_id}.status still == TERMINATED"

      - name: sm_remittance_against_unpriced_claim_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Claim.AWAITING_REMITTANCE_to_REMITTANCE_POSTED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A remittance on an UNPRICED claim is rejected ERR_INVALID_STATE_TRANSITION; no payment or variance state changes."
        test_recipe:
          setup: ["payer P; claim CL-RU1 ingested (UNPRICED)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer RU", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-RU1", patient_account_number: "PA-RU1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 1000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 500, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "Claim.${claim_id}.remittance_status still == AWAITING_REMITTANCE and paid_amount_cents is null/0 (no POSTED remittance exists)"

      - name: sm_line_addition_after_pricing_rejected
        claim_type: invalid_transition
        grounds: ["endpoints[POST /api/claims/{id}/lines]", "state_machines.Claim.UNPRICED_to_PRICED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Lines are only addable while UNPRICED; adding a line to a PRICED claim is rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["payer P; contract C ACTIVE PER_DIEM INPATIENT_MEDICAL 100000; claim CL-LP1 priced"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer LP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "LP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-LP1", patient_account_number: "PA-LP1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-02", total_billed_charges_cents: 300000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: "$.data.id" }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 300000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0101", service_date: "2026-06-02", charge_cents: 5000, units: 1 }
              as: RevenueIntegrityAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "Claim.${claim_id} still has exactly 1 line"

      - name: sm_voided_amendment_rejects_second_void
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RateAmendment.DRAFT_to_VOIDED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "VOIDED is terminal for amendments: a second void is rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term; DRAFT amendment A created then voided"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer VA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "VA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: "$.data.version" }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { amendment_id: "$.data.id" }
            - call: "POST /api/rate-amendments/${amendment_id}/void"
              as: ContractManager
          trigger:
            - call: "POST /api/rate-amendments/${amendment_id}/void"
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "RateAmendment.${amendment_id}.status still == VOIDED"

      - name: sm_filed_appeal_refiling_rejected
        claim_type: idempotency
        grounds: ["state_machines.Appeal.DRAFT_to_FILED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "The same trigger twice: filing an already-FILED appeal is rejected ERR_INVALID_STATE_TRANSITION (no idempotent replay)."
        test_recipe:
          setup: ["case with a level-1 appeal already FILED (chain: priced claim 200000, remittance 100000, pick_up, appeal, file)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer FI", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "FI-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-FI1", patient_account_number: "PA-FI1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: "$.data.id" }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 1 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { appeal_id: "$.data.id" }
            - call: "POST /api/appeals/${appeal_id}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /api/appeals/${appeal_id}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "Appeal.${appeal_id}.status still == FILED with a single unchanged filed_date 2026-08-01"

      - name: sm_withdrawn_case_rejects_pick_up
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.UnderpaymentCase.QUEUED_to_WITHDRAWN", "state_machines.UnderpaymentCase.QUEUED_to_UNDER_REVIEW", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "WITHDRAWN is terminal: pick_up on a withdrawn case is rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["case QUEUED then WITHDRAWN (claim priced 200000, remittance 100000)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer WD", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
