            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-INV3-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-INV-3", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
