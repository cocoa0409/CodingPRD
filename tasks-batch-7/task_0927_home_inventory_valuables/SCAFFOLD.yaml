    code: 200
    input: [void_reason]
    output: Appraisal
    side_effects:
      - "runs the five-hop void cascade on state_machines.Appraisal.status CERTIFIED -> VOIDED"
      - "the consumed appraisal credit is NOT refunded"

  - method: POST
    path: "/vault/policies"
    description: "Registers the household's insurance policy with its deductible and scheduling allowance."
