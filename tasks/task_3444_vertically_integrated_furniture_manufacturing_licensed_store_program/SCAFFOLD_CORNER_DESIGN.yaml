              captures: { cA: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${lS}", allocation_cycle_id: "${cA}", product_line_id: "${pl1}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${lS}"
              captures: { oS0: $.data.id }
            - call: "POST /api/orders/${oS0}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${lS}"
            - call: "POST /api/allocation-cycles/${cA}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/orders/${oS0}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oS0}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oS0}/transition"
