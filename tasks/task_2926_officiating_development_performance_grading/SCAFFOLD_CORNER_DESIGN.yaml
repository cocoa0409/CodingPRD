            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_station
            - &k_clock_replay
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:00:00Z" }
              as: OfficiatingDirector
            - &k_review
              call: "POST /replay-reviews"
              payload: { game_id: "${g_id}", station_id: "${st_id}", play_ref: "Q1-P12", category: "SCORING_PLAY" }
              as: ReplayOfficial
              captures: { rv_id: $.data.id, rv_open: $.data.window_open_utc }
          trigger:
            - *k_clock_grade
            - call: "POST /games/${g_id}/mark-played"
              payload: {}
              as: OfficiatingDirector
              captures: { g_status_played: $.data.status, g_posture_played: $.data.crew_posture }
            - call: "GET /crew-assignments/${ad_id}"
              payload: {}
              as: CrewScheduler
              captures: { ad_status_played: $.data.status }
            - call: "GET /replay-reviews/${rv_id}"
              payload: {}
              as: ReplayOfficial
              captures: { rv_status_played: $.data.status, rv_decision_played: $.data.decision, rv_elapsed_played: $.data.elapsed_seconds }
            - call: "GET /replay-stations/${st_id}"
              payload: {}
              as: ReplayOfficial
              captures: { st_active_played: $.data.active_review_count }
          assert:
            - "${g_status_played} == PLAYED and ${g_posture_played} == LOCKED (posture is frozen from kickoff onward)"
            - "${ad_status_played} == COMPLETED — the CONFIRMED assignment was swept by the transition, not by a separate call"
            - "${rv_open} == 2026-09-13T18:00:00Z, ${rv_status_played} == EXPIRED and ${rv_decision_played} == null"
            - "${rv_elapsed_played} == 12600 — whole seconds from 18:00:00Z to the mark-played clock 21:30:00Z"
