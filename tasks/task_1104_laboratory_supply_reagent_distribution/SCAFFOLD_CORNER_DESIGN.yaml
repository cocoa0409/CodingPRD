      - name: cold_chain_uncertified_customer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_COLD_CHAIN_NOT_CERTIFIED]"]
        distinguishing_aspect: "An order containing a requires_cold_chain product submitted by a customer with cold_chain_certified false fails with 403 ERR_COLD_CHAIN_NOT_CERTIFIED."
        test_recipe:
          setup: ["warehouse, REFRIGERATED zone, cold-chain product, lot of 10; customer cold_chain_certified false; DRAFT order"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
