        claim_type: violation_to_error
        grounds: ["errors[ERR_FLEET_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: fleet_capacity_per_day_aggregate
          rationale: "Trigger and adjacent-window control asserted in the named §1.8 instance."

      - name: error_cap_exhausted_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DURATION_CAP_EXHAUSTED]"]
        excluded_because:
          difficulty_instance: extension_grant_at_cap_exactly
          rationale: "Cap boundary success and exhaustion failure asserted in the named §1.8 instance."

