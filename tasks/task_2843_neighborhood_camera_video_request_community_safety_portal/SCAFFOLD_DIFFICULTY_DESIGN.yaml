            - "Area P (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z is LOCKED with eligible_device_count 3 and effective_min_devices 3; its VideoRequest VR1 is justified and SUBMITTED, so Agency.open_request_count is 1 — the configured maximum."
            - "Area Q (5000,5000) radius 500 over the same footage window is LOCKED with eligible_device_count 3; its VideoRequest VR2 is created but deliberately NOT justified, so VR2.compliance_state is JUSTIFICATION_PENDING."
