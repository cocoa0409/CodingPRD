            - call: "POST /consultant-invoices"
              payload: { subcontract_id: "${sc_free}", amount: 30000.00, invoice_date: "2026-05-21", backup_attached: true }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ci_free: $.data.id }
            - call: "POST /consultant-invoices/${ci_free}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
          trigger:
            - call: "POST /consultant-invoices/${ci_pwp}/release-payment"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /consultant-invoices/${ci_free}/release-payment"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /projects/${p_id}"
              payload: {}
