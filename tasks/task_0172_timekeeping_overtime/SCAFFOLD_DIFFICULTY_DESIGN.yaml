scaffold_difficulty_design:

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 1: dual_variant_calc — two calcs across different entity domains,
  # each with two valid approaches producing different results.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: workweek_engine_fed_vs_ca
        grounds:
          - calculations.workweek_pay_engine
          - calculations.workweek_pay_engine.variants.federal_only
          - calculations.workweek_pay_engine.variants.california_daily
          - entities.Employee.fields.jurisdiction
          - entities.Workweek.fields.gross_pay_cents
        distinguishing_aspect: |
          Same per-day worked hours [13,8,8,8,8] (sum=45h) at base 2000 cents/hr produce
          Workweek.gross_pay_cents = 95000 under jurisdiction=FED (40 reg + 5 OT at 1.5x)
          but 96000 under jurisdiction=CA (40 reg + 4 OT + 1 DT at 2x). The two variants
          operate on the Workweek entity domain via two valid jurisdiction-driven algorithms.
        test_recipe:
          setup:
            - "POST /timekeeping/_clock/set to a fixed Sunday 00:00:00.000Z (the workweek anchor)."
            - "POST /timekeeping/employees → E_FED with jurisdiction=FED, classification=NON_EXEMPT, base_hourly_rate_cents=2000."
            - "POST /timekeeping/employees → E_CA  with jurisdiction=CA,  classification=NON_EXEMPT, base_hourly_rate_cents=2000."
            - "For each employee schedule 5 shifts: Mon 13h, Tue 8h, Wed 8h, Thu 8h, Fri 8h."
            - "For each shift: advance clock to scheduled_start; POST IN punch; advance to scheduled_end; POST OUT punch."
          trigger:
            - "For each of the 10 shifts (5 per employee): POST /timekeeping/shifts/{id}/finalize as PayrollAdmin."
          assert:
            - "Workweek of E_FED has total_hours == 45.0, regular_hours == 40.0, overtime_hours == 5.0, double_time_hours == 0.0."
            - "Workweek of E_FED has gross_pay_cents == 95000."
            - "Workweek of E_CA  has total_hours == 45.0, regular_hours == 40.0, overtime_hours == 4.0, double_time_hours == 1.0."
            - "Workweek of E_CA  has gross_pay_cents == 96000."
            - "E_CA.gross_pay_cents - E_FED.gross_pay_cents == 1000  (CA-DT premium net of swapped OT)."
      - name: tip_credit_per_line_vs_sum_then_round
        grounds:
          - calculations.tip_credit_shortfall
          - calculations.tip_credit_shortfall.variants.per_line_rounding
          - calculations.tip_credit_shortfall.variants.sum_then_round
          - entities.TipDeclaration.fields.shortfall_topup_cents
          - entities.Employee.fields.tipped_role
        distinguishing_aspect: |
          On TipDeclaration (different entity domain from Workweek), the rounding-order
          choice is what makes the calc dual-variant. For worked_hours=4.0,
          tipped_cash_rate_cents=213, applicable_minimum_wage_cents=1500,
          declared_tips_cents=2000 the per_line_rounding variant yields
          cash_wage_cents=852, min_wage_required=6000, tip_credit_applied=2000,
          shortfall_topup_cents=3148 (the pinned answer). Non-integer worked_hours
          (see combinatorial_formula.tip_credit_per_line_rounding_order) is where
          per_line vs sum-then-round actually diverge by ±1¢; the integer-hour case
          here is the canonical correctness check that the per-line ordering is
          implemented and the tip-credit cap (min) is honored.
        test_recipe:
          setup:
            - "POST /timekeeping/_clock/set to Sun 00:00:00.000Z."
            - "POST /timekeeping/employees: tipped E with tipped_role=true, tipped_cash_rate_cents=213, applicable_minimum_wage_cents=1500, base_hourly_rate_cents=213, jurisdiction=FED, classification=NON_EXEMPT."
            - "POST /timekeeping/shifts: 4h shift (scheduled_start..scheduled_end span = 4 hours exactly)."
            - "Advance clock; POST IN; advance 4h; POST OUT (no meal break since worked_hours <= 5)."
            - "POST /timekeeping/shifts/{id}/tip-declaration with declared_tips_cents=2000."
          trigger:
            - "POST /timekeeping/shifts/{id}/finalize."
          assert:
            - "TipDeclaration.tip_credit_applied_cents == 2000  (= min(2000, 6000-852))."
            - "TipDeclaration.shortfall_topup_cents == 3148    (= 6000 - 852 - 2000)."
            - "Workweek.gross_pay_cents == 852 + 0 + 0 + 0 + 3148 == 4000."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 2: combinatorial_formula — two instances in DIFFERENT modes from
  # {(a) ≥3-input non-linear, (b) nested rounding order, (c) pinned eval order}.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: ca_daily_then_weekly_eval_order
        grounds:
          - calculations.workweek_pay_engine
          - calculations.workweek_pay_engine.variants.california_daily
          - entities.Workweek.fields.overtime_hours
          - entities.Workweek.fields.double_time_hours
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order: CA daily buckets are computed FIRST
          (carve OT 8..12, DT >12 per day), THEN the federal weekly >40 rule is
          applied ONLY to the residual ca_regular bucket. If a naive implementation
          applies federal weekly OT to total per_day hours before daily carving,
          the same 13/8/8/8/8 inputs yield a different (overtime_hours, double_time_hours)
          tuple. The scaffold pins daily-first; this is the order under test.
        test_recipe:
          setup:
            - "Same as dual_variant_calc.workweek_engine_fed_vs_ca (E_CA only)."
          trigger:
            - "Finalize all 5 CA shifts."
          assert:
            - "Workweek of E_CA.overtime_hours == 4.0 (Mon's 4 daily-OT hours, never re-classified)."
            - "Workweek of E_CA.double_time_hours == 1.0 (Mon's 1 daily-DT hour)."
            - "Workweek of E_CA.regular_hours == 40.0 (federal weekly OT not triggered because ca_regular cumulative never exceeds 40)."
      - name: tip_credit_per_line_rounding_order
        grounds:
          - calculations.tip_credit_shortfall
          - calculations.tip_credit_shortfall.precision
          - calculations.tip_credit_shortfall.variants.per_line_rounding
          - entities.TipDeclaration.fields.shortfall_topup_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding: cash_wage_cents and min_wage_required must
          each be rounded round_half_up to whole cents BEFORE subtraction. For
          non-integer worked_hours (e.g., 3.5h: cash=round(3.5*213)=746,
          min=round(3.5*1500)=5250, shortfall=5250-746-tip), the per-line variant
          and sum-then-round variant yield different last-cent values. The
          scaffold pins per_line_rounding as authoritative.
        test_recipe:
          setup:
            - "POST /timekeeping/_clock/set Sun 00:00:00.000Z."
            - "POST /timekeeping/employees: tipped E (tipped_cash_rate_cents=213, applicable_minimum_wage_cents=1500, base_hourly_rate_cents=213, classification=NON_EXEMPT, jurisdiction=FED)."
            - "Schedule a shift with scheduled_end - scheduled_start = 3.5h."
            - "Punch IN at scheduled_start; advance 3.5h (12600s); punch OUT."
            - "POST tip-declaration: declared_tips_cents=4000."
          trigger:
            - "POST /timekeeping/shifts/{id}/finalize."
          assert:
            - "TipDeclaration.tip_credit_applied_cents == min(4000, 5250-746) == 4000."
            - "TipDeclaration.shortfall_topup_cents == 5250 - 746 - 4000 == 504."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 3: non_linear_state_machine — two non-linear shapes on DIFFERENT entities.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: shift_revert_cycle_finalized_to_closed
        grounds:
          - state_machines.Shift
          - state_machines.Shift.transitions.SCHEDULED_to_OPEN
          - state_machines.Shift.transitions.CLOSED_to_FINALIZED
          - state_machines.Shift.transitions.FINALIZED_to_CLOSED
          - state_machines.TimeEdit.transitions.PENDING_to_APPROVED
        distinguishing_aspect: |
          The Shift state machine is CYCLIC on entity Shift: FINALIZED→CLOSED→FINALIZED
          via approval of a clerical TimeEdit on a finalized shift. A purely linear
          SCHEDULED→OPEN→CLOSED→FINALIZED machine cannot represent this revert path.
        test_recipe:
          setup:
            - "Create a NON_EXEMPT FED employee, base=2000."
            - "Schedule shift; punch IN at scheduled_start; advance 8h; punch OUT."
            - "Finalize the shift (Shift CLOSED→FINALIZED). Workweek transitions OPEN→POSTED."
          trigger:
            - "POST /timekeeping/time-edits with reason_code=CLERICAL, proposed_punched_at adjusting the OUT punch by -10 minutes (Supervisor)."
            - "POST /timekeeping/time-edits/{id}/approve as PayrollAdmin (different user_id from requester)."
          assert:
            - "Shift.state transitions from FINALIZED back to CLOSED."
            - "Workweek.payroll_status transitions from POSTED back to OPEN."
            - "Punch row marked superseded_by_edit_id; EDIT punch created with source=EDIT."
      - name: workweek_posted_open_cycle
        grounds:
          - state_machines.Workweek
          - state_machines.Workweek.transitions.OPEN_to_POSTED
          - state_machines.Workweek.transitions.POSTED_to_OPEN
          - state_machines.TimeEdit.transitions.APPROVED_to_REVERTED
        distinguishing_aspect: |
          On a DIFFERENT entity (Workweek), the state machine is CYCLIC:
          OPEN→POSTED→OPEN, driven by approval of a TimeEdit on a finalized shift
          or by revert of a previously-approved edit. This cycle is on a separate
          entity from Shift's cycle, satisfying the rule's "different entity" clause.
        test_recipe:
          setup:
            - "Same as shift_revert_cycle_finalized_to_closed, up through Workweek POSTED."
          trigger:
            - "Submit and approve a CLERICAL TimeEdit on the finalized shift."
            - "POST /timekeeping/time-edits/{id}/revert as PayrollAdmin."
          assert:
            - "After approve: Workweek.payroll_status == OPEN."
            - "After revert: Workweek.payroll_status flips OPEN→POSTED again (since shift is FINALIZED again)."
            - "AuditEntry chain shows WORKWEEK_LOCKED is absent and POSTED↔OPEN flipped twice."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 4: transitive_cascade — two cascades from DIFFERENT triggers,
  # at least one of depth ≥ 3.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: out_punch_triggers_detention_then_workweek
        grounds:
          - state_machines.Shift.transitions.OPEN_to_CLOSED
          - calculations.detention_minutes
          - calculations.meal_break_premium
          - state_machines.Shift.transitions.CLOSED_to_FINALIZED
          - calculations.workweek_pay_engine
          - state_machines.Workweek.transitions.OPEN_to_POSTED
        distinguishing_aspect: |
          Depth-≥3 cascade triggered by POST OUT punch:
            (A) OUT punch → Shift OPEN→CLOSED
            (B) The CLOSED transition itself runs detention_minutes which
                writes Shift.detention_minutes and creates/updates DetentionEvent
            (C) Finalize action → workweek_pay_engine reads Shift.detention_minutes
                AND DetentionEvent.premium_owed_cents into Workweek.gross_pay_cents
            (D) When last sibling finalizes, Workweek auto-transitions OPEN→POSTED
          Each link is caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "Single non-exempt CA employee, base=2000, single shift scheduled 8h."
            - "Clock set to scheduled_start; punch IN."
            - "Advance clock by 8h + 65 minutes (i.e., shift runs 65 min past scheduled_end)."
          trigger:
            - "POST /timekeeping/shifts/{id}/punches type=OUT."
            - "POST /timekeeping/shifts/{id}/finalize."
          assert:
            - "After OUT: Shift.state == CLOSED; Shift.detention_minutes == 65; DetentionEvent.tier == TIER_2; DetentionEvent.premium_owed_cents == 2000."
            - "After finalize: Workweek.gross_pay_cents includes the 2000-cent detention premium added to base pay."
            - "Workweek.payroll_status == POSTED."
      - name: timeedit_approve_triggers_recompute_then_workweek_revert
        grounds:
          - state_machines.TimeEdit.transitions.PENDING_to_APPROVED
          - state_machines.Shift.transitions.FINALIZED_to_CLOSED
          - calculations.detention_minutes
          - calculations.workweek_pay_engine
          - state_machines.Workweek.transitions.POSTED_to_OPEN
        distinguishing_aspect: |
          Different trigger (TimeEdit approve, not OUT punch): the cascade
          chain is APPROVE → Punch superseded + EDIT punch inserted →
          recompute detention_minutes/meal_break_premium on Shift →
          Shift FINALIZED→CLOSED → Workweek POSTED→OPEN. Each hop is caused
          by the previous, not by the original APPROVE call itself.
        test_recipe:
          setup:
            - "Reach Workweek.payroll_status=POSTED with one shift whose detention_minutes=65 (from prior cascade)."
          trigger:
            - "POST /timekeeping/time-edits to adjust the OUT punch BACK to scheduled_end (eliminating detention)."
            - "POST /timekeeping/time-edits/{id}/approve as PayrollAdmin (separate user from requester)."
          assert:
            - "Shift.detention_minutes == 0 after approve."
            - "DetentionEvent.tier == NONE; premium_owed_cents == 0."
            - "Shift.state == CLOSED (reverted from FINALIZED)."
            - "Workweek.payroll_status == OPEN (reverted from POSTED)."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 5: priority_pair_validation_conflict — two priority conflicts across
  # DIFFERENT error-category pairs.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_TIME_EDIT_NOT_PENDING
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Category pair: state (priority 7) vs business_safety (priority 9).
          When a non-PENDING TimeEdit is approved by the same user who submitted
          it, the state check (priority 7) fires FIRST and the response carries
          ERR_TIME_EDIT_NOT_PENDING — NOT ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Create employee, shift, IN+OUT punches (Shift CLOSED)."
            - "Submit TimeEdit by user U1; approve by user U2 (Supervisor) — TimeEdit now APPROVED."
          trigger:
            - "POST /timekeeping/time-edits/{id}/approve again, this time as user U1 (the original requester)."
          assert:
            - "Response status 409."
            - "Response error_id == 'ERR_TIME_EDIT_NOT_PENDING' (priority 7 wins over priority 9)."
      - name: business_safety_vs_business_referential_meal_punch_order
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors.ERR_EXEMPT_NOT_ELIGIBLE
          - errors.ERR_PUNCH_OUT_OF_ORDER
        distinguishing_aspect: |
          Different category pair: business_safety (priority 11, EXEMPT) vs
          business_referential (priority 12, punch order). For an EXEMPT
          employee attempting a MEAL_IN punch before any IN punch on a shift,
          the EXEMPT check at priority 11 wins; ERR_EXEMPT_NOT_ELIGIBLE returns,
          not ERR_PUNCH_OUT_OF_ORDER.
        test_recipe:
          setup:
            - "Create an EXEMPT employee E_X (classification=EXEMPT)."
            - "PayrollAdmin attempts POST /timekeeping/shifts for E_X."
          trigger:
            - "POST /timekeeping/shifts with employee_id=E_X.id."
          assert:
            - "Response status 422."
            - "Response error_id == 'ERR_EXEMPT_NOT_ELIGIBLE'."
            - "No Shift row created."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 6: boundary_precision_check — two boundaries on DIFFERENT metrics,
  # reachable through DIFFERENT endpoints.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: boundary_precision_check
    instances:
      - name: weekly_overtime_threshold_at_exactly_40
        grounds:
          - calculations.workweek_pay_engine
          - calculations.workweek_pay_engine.constants.WEEKLY_OT_THRESHOLD_HOURS
          - entities.Workweek.fields.overtime_hours
        distinguishing_aspect: |
          Metric: weekly hour total against a numeric threshold (40.0).
          At exactly 40.0 hours, overtime_hours MUST equal 0.0 (not 0.000001
          and not >0). The boundary is `> 40` triggers OT, `<= 40` does not.
          Reachable through POST /timekeeping/shifts/{id}/finalize.
        test_recipe:
          setup:
            - "Create NON_EXEMPT FED employee, base=2000."
            - "Schedule five 8.0-hour shifts (sum exactly 40.0h)."
            - "Punch IN/OUT at exact scheduled_start/end for each."
          trigger:
            - "Finalize all 5 shifts."
          assert:
            - "Workweek.total_hours == 40.0 (float-exact)."
            - "Workweek.overtime_hours == 0.0."
            - "Workweek.gross_pay_cents == 40 * 2000 == 80000."
      - name: meal_break_required_at_exactly_five_hours
        grounds:
          - calculations.meal_break_premium
          - entities.Shift.fields.requires_meal_break
          - validations[priority=13]
        distinguishing_aspect: |
          Different metric: worked_hours boundary (5.0h) for meal-break premium.
          Reachable through a DIFFERENT endpoint: POST /timekeeping/shifts/{id}/punches
          (OUT). At exactly worked_hours == 5.0 (no meal break), premium MUST be 0
          (rule is `worked_hours > 5.0`, not `>=`). At 5.0+1 second of worked time,
          premium fires.
        test_recipe:
          setup:
            - "Create NON_EXEMPT CA employee, base=2000."
            - "Schedule shift 5.0h long."
            - "Clock to scheduled_start; punch IN."
            - "Advance clock exactly 5h × 3600 = 18000 seconds; punch OUT (no meal break taken)."
          trigger:
            - "POST /timekeeping/shifts/{id}/punches type=OUT."
          assert:
            - "Shift.meal_break_premium_owed_cents == 0  (worked_hours <= 5.0 exactly)."
            - "Repeat with 18001 seconds: Shift.meal_break_premium_owed_cents == 2000 (one hour at base 2000)."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 7: cross_entity_state_dependency — two dependencies across DIFFERENT
  # entity pairs.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shift_finalize_blocked_by_pending_timeedit
        grounds:
          - state_machines.Shift.transitions.CLOSED_to_FINALIZED
          - state_machines.TimeEdit
          - validations[priority=6]
          - errors.ERR_SHIFT_INVALID_STATE
        distinguishing_aspect: |
          Entity pair: Shift ↔ TimeEdit. Shift cannot finalize while a
          TimeEdit on it is in state PENDING — even though Shift itself
          is in CLOSED. This is a precondition on a SIBLING entity's state.
        test_recipe:
          setup:
            - "Create NON_EXEMPT FED employee, base=2000; schedule + punch IN/OUT (Shift = CLOSED)."
            - "Submit TimeEdit by Supervisor U1 with reason_code=CLERICAL."
          trigger:
            - "POST /timekeeping/shifts/{id}/finalize as PayrollAdmin."
          assert:
            - "Response status 409."
            - "Response error_id == 'ERR_SHIFT_INVALID_STATE' (Shift is DISPUTED due to PENDING TimeEdit)."
            - "Shift.state remains DISPUTED until edit is resolved."
      - name: timeedit_approve_blocked_by_locked_workweek
        grounds:
          - state_machines.TimeEdit.transitions.PENDING_to_APPROVED
          - state_machines.Workweek
          - validations[priority=8]
          - errors.ERR_WORKWEEK_LOCKED
        distinguishing_aspect: |
          DIFFERENT entity pair: TimeEdit ↔ Workweek. Approving a TimeEdit
          on a shift whose Workweek.payroll_status == LOCKED is rejected.
          The blocking entity (Workweek) is not the target of the
          operation but governs it.
        test_recipe:
          setup:
            - "Reach Workweek.payroll_status=POSTED (all shifts FINALIZED)."
            - "POST /timekeeping/workweeks/{id}/lock — Workweek now LOCKED."
            - "Submit TimeEdit by U1 (since Shift is FINALIZED, this should fail at creation OR succeed depending on order)."
          trigger:
            - "POST /timekeeping/time-edits/{id}/approve OR the submit itself."
          assert:
            - "Response status 409."
            - "Response error_id == 'ERR_WORKWEEK_LOCKED'."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 8: resource_temporal_overlap — two overlap rules with DIFFERENT
  # interval semantics, on DIFFERENT resource entities.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_punch_window_open_closed_semantics
        grounds:
          - validations[priority=14]
          - entities.Shift.fields.scheduled_start
          - entities.Shift.fields.scheduled_end
          - errors.ERR_PUNCH_OUTSIDE_WINDOW
        distinguishing_aspect: |
          Resource: Shift. Interval semantics: CLOSED interval
          [scheduled_start - 60m, scheduled_end + 60m] — both endpoints
          inclusive. An IN punch at exactly scheduled_start - 60m IS
          allowed; at scheduled_start - 60m - 1s is rejected. (Half-open
          treatment of the lower bound would change this.)
        test_recipe:
          setup:
            - "Create NON_EXEMPT employee; schedule a shift; clock set to scheduled_start - 60 minutes."
          trigger:
            - "POST /timekeeping/shifts/{id}/punches type=IN."
            - "Then with clock set 1 second earlier: another POST IN attempt against a NEW shift."
          assert:
            - "First call: 201, Shift.state == OPEN."
            - "Second call: 422 with error_id == 'ERR_PUNCH_OUTSIDE_WINDOW'."
      - name: timeedit_proposed_time_buffered_envelope
        grounds:
          - validations[priority=15]
          - entities.TimeEdit.fields.proposed_punched_at
          - errors.ERR_TIME_EDIT_OUT_OF_RANGE
        distinguishing_aspect: |
          DIFFERENT resource: TimeEdit. Interval semantics: an ASYMMETRIC
          buffered envelope [scheduled_start - 4h, scheduled_end + 6h],
          NOT a symmetric ±60m punch window. Different geometric treatment
          (asymmetric buffer; broader range; centered on scheduled times of
          the parent shift). This contrasts with the symmetric punch window
          and the closed/open semantics there.
        test_recipe:
          setup:
            - "Create NON_EXEMPT employee, schedule a shift (e.g., 09:00–17:00 UTC)."
            - "Punch IN at 09:00, advance 8h, punch OUT (Shift CLOSED)."
          trigger:
            - "Submit a TimeEdit with proposed_punched_at = scheduled_end + 6h exactly (e.g., 23:00) — valid."
            - "Submit another TimeEdit with proposed_punched_at = scheduled_end + 6h + 1s (e.g., 23:00:01) — invalid."
          assert:
            - "First TimeEdit: 201, state=PENDING."
            - "Second TimeEdit: 422 with error_id == 'ERR_TIME_EDIT_OUT_OF_RANGE'."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 9: compensating_invariant — two invariants on DIFFERENT conserved
  # quantities, forward action + compensating action leave a named quantity
  # unchanged.
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: timeedit_approve_then_revert_preserves_gross_pay
        grounds:
          - state_machines.TimeEdit.transitions.PENDING_to_APPROVED
          - state_machines.TimeEdit.transitions.APPROVED_to_REVERTED
          - calculations.workweek_pay_engine
          - entities.Workweek.fields.gross_pay_cents
        distinguishing_aspect: |
          Conserved quantity: Workweek.gross_pay_cents (monetary, cents).
          Invariant: gross_pay_cents AFTER (approve TimeEdit T) THEN (revert T)
          MUST equal gross_pay_cents BEFORE the approve, byte-for-byte. The
          compensating action is /revert; the conserved field is cents-precise.
        test_recipe:
          setup:
            - "Create NON_EXEMPT CA employee, base=2000. Schedule + punch one 8h shift; finalize. Workweek POSTED, gross G0."
            - "Capture G0 := Workweek.gross_pay_cents."
            - "Submit CLERICAL TimeEdit by Supervisor U1; approve by PayrollAdmin U2."
            - "Workweek now OPEN; refinalize shift (CLOSED → FINALIZED)."
            - "Capture G_mid := Workweek.gross_pay_cents (may differ from G0)."
          trigger:
            - "POST /timekeeping/time-edits/{id}/revert as PayrollAdmin."
            - "Refinalize the shift back to FINALIZED."
          assert:
            - "After revert+refinalize: Workweek.gross_pay_cents == G0  (cent-precise equality)."
            - "AuditEntry chain shows TIME_EDIT_APPROVED followed by TIME_EDIT_REVERTED for the same time-edit id."
      - name: timeedit_approve_then_revert_preserves_detention_minutes
        grounds:
          - calculations.detention_minutes
          - state_machines.TimeEdit.transitions.PENDING_to_APPROVED
          - state_machines.TimeEdit.transitions.APPROVED_to_REVERTED
          - entities.Shift.fields.detention_minutes
        distinguishing_aspect: |
          DIFFERENT conserved quantity: Shift.detention_minutes (integer minutes,
          not currency). Invariant: detention_minutes AFTER (approve T) THEN
          (revert T) equals detention_minutes BEFORE approve. This is a
          different "type" of conserved quantity (time-units vs cents-units),
          satisfying the rule's "different conserved quantities" clause.
        test_recipe:
          setup:
            - "Create NON_EXEMPT FED employee, base=2000; schedule 8h shift; punch IN; advance 8h+65m; punch OUT."
            - "Capture D0 := Shift.detention_minutes (== 65)."
            - "Submit TimeEdit moving OUT back to scheduled_end; approve."
          trigger:
            - "POST /timekeeping/time-edits/{id}/revert."
          assert:
            - "After revert: Shift.detention_minutes == D0 == 65 (integer-exact)."
            - "DetentionEvent.tier == TIER_2 again; premium_owed_cents == 2000."
