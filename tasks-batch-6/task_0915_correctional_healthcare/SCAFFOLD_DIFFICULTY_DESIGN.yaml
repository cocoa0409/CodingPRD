              payload: {}
              as: HealthServicesAdmin
            - call: "POST /release-plans/${plan}/finalize"
              payload: {}
              as: HealthServicesAdmin
            - call: "POST /inmates/${inm}/release"
              payload: {}
              as: HealthServicesAdmin
          assert:
            - "The first trigger call returns 409 with error_id ERR_INVALID_STATE"
            - "The third trigger call returns 200"
            - "ReleasePlan.${plan}.bridge_supply_total_days == 11"
            - "ReleasePlan.${plan}.reentry_referral_required == true"
            - "ReleasePlan.${plan}.status == EXECUTED"
            - "ReleasePlan.${plan}.records_packet_ready == true"
            - "Inmate.${inm}.custody_status == RELEASED"
            - "MedicationOrder.${ord1}.status == COMPLETED and MedicationOrder.${ord2}.status == COMPLETED"
            - "ChronicCareEnrollment.${enr}.status == RESOLVED"

  - rule_id: resource_temporal_overlap
    instances:

      - name: medication_order_closed_date_span_collision
        grounds:
          - calculations.medication_schedule_overlap
          - "validations[priority=35]"
          - "errors[ERR_SCHEDULE_CONFLICT]"
        distinguishing_aspect: |
          CLOSED calendar-date interval semantics on the MedicationOrder resource: a new
          same-drug_class order whose start_date equals the existing order's end_date DOES
          collide, and moving the start one day later clears it.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One ACTIVE CHRONIC_MAINTENANCE order Lisinopril spanning 2026-05-01 through 2026-05-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1200", full_name: "Yuri Zane", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Lisinopril", drug_class: "CHRONIC_MAINTENANCE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord1: $.data.id }
            - call: "GET /inmates/${inm}"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { inm_v2: $.data.version }
          trigger:
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Amlodipine", drug_class: "CHRONIC_MAINTENANCE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-10T00:00:00Z", end_date: "2026-05-20T00:00:00Z", expected_inmate_version: "${inm_v2}" }
              as: Provider
              as_user_id: "u-prov-1"
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Amlodipine", drug_class: "CHRONIC_MAINTENANCE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-11T00:00:00Z", end_date: "2026-05-20T00:00:00Z", expected_inmate_version: "${inm_v2}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord2: $.data.id }
          assert:
            - "The first trigger call returns 409 with error_id ERR_SCHEDULE_CONFLICT because the spans share the single date 2026-05-10"
            - "The second trigger call returns 201"
            - "MedicationOrder.${ord1}.status == ACTIVE"
            - "MedicationOrder.${ord2}.status == ACTIVE"
            - "MedicationOrder.${ord2}.start_date == 2026-05-11T00:00:00.000Z"

      - name: transport_slot_half_open_adjacency_is_legal
        grounds:
          - calculations.transport_slot_overlap
          - "validations[priority=36]"
          - "errors[ERR_SCHEDULE_CONFLICT]"
        distinguishing_aspect: |
          HALF-OPEN minute-interval semantics on a DIFFERENT resource, the inmate's transport
          slot: a trip starting one minute before the incumbent slot ends collides, while a
          trip starting exactly TRANSPORT_SLOT_MINUTES after the incumbent start is legal
          adjacency - the opposite adjacency verdict from the CLOSED medication-date rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A MEDIUM-custody inmate with TWO AUTHORIZED ROUTINE referrals."
            - "A DRAFT trip on the first referral for 2026-05-05T08:00:00Z, occupying the half-open slot [08:00, 12:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1210", full_name: "Zia Ames", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /specialty-referrals"
              payload: { inmate_id: "${inm}", specialty: "CARDIOLOGY", urgency: "ROUTINE" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ref1: $.data.id }
            - call: "POST /specialty-referrals/${ref1}/submit-for-review"
              payload: { retrospective: false }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ur1: $.data.id }
            - call: "POST /utilization-reviews/${ur1}/decide"
              payload: { decision: "APPROVE" }
              as: UtilizationReviewer
              as_user_id: "u-ur-1"
            - call: "POST /specialty-referrals"
              payload: { inmate_id: "${inm}", specialty: "OPHTHALMOLOGY", urgency: "ROUTINE" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ref2: $.data.id }
            - call: "POST /specialty-referrals/${ref2}/submit-for-review"
              payload: { retrospective: false }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ur2: $.data.id }
            - call: "POST /utilization-reviews/${ur2}/decide"
              payload: { decision: "APPROVE" }
              as: UtilizationReviewer
              as_user_id: "u-ur-1"
            - call: "GET /specialty-referrals/${ref1}"
              payload: {}
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { ref1_v: $.data.version }
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref1}", appointment_at: "2026-05-05T08:00:00Z", expected_referral_version: "${ref1_v}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { trip1: $.data.id }
            - call: "GET /specialty-referrals/${ref2}"
              payload: {}
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { ref2_v: $.data.version }
          trigger:
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref2}", appointment_at: "2026-05-05T11:59:00Z", expected_referral_version: "${ref2_v}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref2}", appointment_at: "2026-05-05T12:00:00Z", expected_referral_version: "${ref2_v}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { trip2: $.data.id }
          assert:
            - "The first trigger call returns 409 with error_id ERR_SCHEDULE_CONFLICT"
            - "The second trigger call returns 201"
            - "TransportOrder.${trip1}.status == DRAFT"
            - "TransportOrder.${trip2}.status == DRAFT"
            - "TransportOrder.${trip2}.appointment_at == 2026-05-05T12:00:00.000Z"

  - rule_id: compensating_invariant
    instances:

      - name: copay_reversal_conserves_trust_account_balance
        grounds:
          - calculations.inmate_account_balance
          - calculations.copay_amount
          - state_machines.Grievance.UNDER_REVIEW_to_DECIDED
          - entities.LedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          Conserved quantity 1 - MONEY. The forward action is the sick-call co-pay posting
          and its compensating action is the grievance-granted reversal; afterwards
          sum(LedgerEntry.amount_cents) == Inmate.account_balance_cents == 1000, exactly the
          pre-charge value, with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One inmate with a 1000-cent DEPOSIT, so account_balance_cents is 1000 and the inmate is not indigent."
            - "A sick-call request triaged URGENT, scheduled, and seen, which posts a FUNDED 500-cent SICK_CALL charge and leaves the balance at 500."
            - "A billing grievance naming that charge, accepted for review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1220", full_name: "Ada Byrne", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, memo: "commissary deposit" }
              as: HealthServicesAdmin
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "persistent cough", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { sc: $.data.id }
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "URGENT" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /sick-call-requests/${sc}/schedule"
              payload: {}
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /sick-call-requests/${sc}/see"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { chg: $.data.copay_charge_id }
            - call: "POST /inmates/${inm}/grievances"
              payload: { grievance_text: "this visit was staff initiated", grieved_event_at: "2026-05-01T00:00:00Z", subject_copay_charge_id: "${chg}" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { grv: $.data.id }
            - call: "POST /grievances/${grv}/accept"
              payload: {}
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
          trigger:
            - call: "POST /grievances/${grv}/decide"
              payload: { outcome: "GRANTED" }
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
          assert:
            - "CopayCharge.${chg}.charge_variant == FUNDED and CopayCharge.${chg}.amount_cents == 500"
            - "CopayCharge.${chg}.status == REVERSED"
            - "Inmate.${inm}.account_balance_cents == 1000"
            - "GET /ledger-entries with inmate_id ${inm} returns exactly 3 rows whose amount_cents are 1000, -500 and 500 in created_at order"
            - "The chronologically last LedgerEntry for ${inm} has balance_after_cents == 1000"
            - "SickCallRequest.${sc}.status == SEEN"

      - name: hold_resume_conserves_dose_partition_and_counters
        grounds:
          - calculations.dose_partition_conservation
          - state_machines.MedicationOrder.ACTIVE_to_HELD
          - state_machines.MedicationOrder.HELD_to_ACTIVE
          - entities.MedicationOrder.fields.consecutive_refused_count
          - entities.MedicationOrder.fields.consecutive_missed_count
        distinguishing_aspect: |
          Conserved quantity 2 - DOSE COUNTS, a different type of quantity from money. The
          hold/resume compensating pair must leave the five-way outcome partition
          (1 ADMINISTERED, 1 REFUSED, 1 MISSED, 1 SCHEDULED, 0 VOIDED) and both consecutive
          counters byte-identical, and adherence_pct still 33.33.
        test_recipe:
          setup:
            - "Logical clock advanced from 2026-05-01T00:00:00Z to 2026-05-03T08:00:00Z."
            - "One ACTIVE DOT order with four scheduled doses; the first recorded ADMINISTERED ON_TIME, the second REFUSED, the third MISSED, the fourth left SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1230", full_name: "Bo Chen", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-01T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d1: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-02T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d2: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-03T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d3: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-04T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d4: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${d1}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${d2}/record"
              payload: { outcome: "REFUSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${d3}/record"
              payload: { outcome: "MISSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
          trigger:
            - call: "POST /medication-orders/${ord}/hold-status"
              payload: { held: true }
              as: Provider
              as_user_id: "u-prov-1"
            - call: "POST /medication-orders/${ord}/hold-status"
              payload: { held: false }
              as: Provider
              as_user_id: "u-prov-1"
          assert:
            - "MedicationOrder.${ord}.status == ACTIVE"
            - "MedicationAdministration.${d1}.outcome == ADMINISTERED"
            - "MedicationAdministration.${d2}.outcome == REFUSED"
            - "MedicationAdministration.${d3}.outcome == MISSED"
            - "MedicationAdministration.${d4}.outcome == SCHEDULED"
            - "GET /medication-orders/${ord}/administrations returns exactly 4 rows and none has outcome VOIDED"
            - "MedicationOrder.${ord}.consecutive_refused_count == 1"
            - "MedicationOrder.${ord}.consecutive_missed_count == 1"
            - "MedicationOrder.${ord}.adherence_pct == 33.33"
            - "MedicationOrder.${ord}.escalated_to_prescriber == false"
