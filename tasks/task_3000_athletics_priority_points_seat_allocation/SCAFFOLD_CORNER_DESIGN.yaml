        distinguishing_aspect: |
          §1.5 declares this list's DEFAULT order as slot_index ASC with no sort
          parameter available, so the ordering must hold without being asked for,
          and it must survive pagination: limit=2 returns slot_index 0 and 1 with
          has_more true, and offset=1 returns 1 and 2 with has_more false while
