# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_2507_false_alarm_reduction_alarm_permit_program
# Domain: false-alarm-reduction-permit-program   api_prefix: /false-alarm-program
#
# Breadth sweep of the declared surface (15 entities, 11 state machines,
# 16 calculations, 59 validations, 75 endpoints, 74 error codes, 8 roles,
# 4 complexity layers, immediate consistency), organised by the nine sections
# of references/claim-extraction-guide.md. Depth (§1.8) lives in the sibling
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; nothing here is a stub.
#
# Conventions used throughout
#   * Every `call:` path is absolute and carries the /false-alarm-program prefix.
#   * Opaque roles act under fixed literal ids: pa-01 (ProgramAdministrator),
#     pc-07 (PermitClerk), pds-05 (PoliceDispatchSupervisor),
#     faro-11 (FalseAlarmReviewOfficer), ho-03 (HearingOfficer),
#     bc-02 (BillingClerk); dual-07 is used where one human must occupy two
#     seats to provoke ERR_SEGREGATION_OF_DUTIES.
#   * Entity-backed roles bind X-User-ID to the entity id: AlarmCompanyOperator
#     -> "${company_id}", AlarmUser -> "${site_id}".
#   * The logical clock starts at 2026-08-01T00:00:00Z. Because a first permit
#     issued on 2026-08-01 carries new_installation_grace_through =
#     2026-08-31T00:00:00Z, every chargeable incident in this file occurs on or
#     after 2026-09-15 with the clock parked at 2026-09-20T00:00:00Z.
#   * YAML anchors (&k_*) reuse the long fixture chains; every alias appears
#     after its anchor in document order.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. ENTITIES — one instance per claim_type row of the guide's Table 1, plus
  #    the `flat` entity_topology extras (FK validation, cross-reference
  #    integrity through the filtered list endpoints).
  # ===========================================================================
  - section: entities
    instances:

      - name: fee_schedule_create_returns_draft_status_with_every_program_constant
        claim_type: Creation
        grounds:
          - entities.FeeSchedule
          - endpoints.POST_/false-alarm-program/fee-schedules
        distinguishing_aspect: "All 33 declared program constants round-trip on a 201 and the row lands in status DRAFT with version 1 and superseded_at null — status is system-sourced and never client-supplied, and a DRAFT schedule prices nothing."
        test_recipe:
          setup:
            - "Empty database. Logical clock pinned to its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - &k_clock
              call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
          trigger:
            - &k_sched
              call: "POST /false-alarm-program/fee-schedules"
              as: ProgramAdministrator
              as_user_id: "pa-01"
              payload:
                schedule_code: "FS-2026-A"
                effective_from: "2026-01-01T00:00:00Z"
                counting_window_mode: "ROLLING_365"
                free_alarm_allowance: 2
                fee_tiers:
                  - { from_index: 1, to_index: 2, base_fee_cents: 0 }
                  - { from_index: 3, to_index: 3, base_fee_cents: 10000 }
                  - { from_index: 4, to_index: 4, base_fee_cents: 25000 }
                  - { from_index: 5, to_index: 5, base_fee_cents: 40000 }
                  - { from_index: 6, to_index: null, base_fee_cents: 75000 }
                occupancy_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.50, SCHOOL: 1.25, FINANCIAL: 2.00, GOVERNMENT: 1.00 }
                non_ecv_surcharge_pct: 0.20
                unpermitted_multiplier: 2.00
                suspension_period_aggravation_cents: 50000
                per_incident_fee_cap_cents: 100000
                probation_threshold_count: 4
                suspension_threshold_count: 6
                appeal_filing_days: 20
                permit_term_days: 365
                renewal_grace_days: 30
                new_installation_grace_days: 30
                permit_issue_fee_cents: 5000
                permit_renewal_fee_cents: 3000
                late_renewal_tiers:
                  - { max_days_late: 15, fee_cents: 1500 }
                  - { max_days_late: 30, fee_cents: 3000 }
                  - { max_days_late: null, fee_cents: 6000 }
                unpermitted_operation_penalty_cents: 20000
                reinstatement_base_fee_cents: 60000
                reinstatement_escalation_pct: 0.50
                admin_fee_pct: 0.05
                admin_fee_min_cents: 500
                admin_fee_max_cents: 5000
                invoice_due_days: 30
                late_penalty_pct: 0.10
                delinquency_days: 90
                collections_referral_threshold_cents: 25000
                delinquent_balance_block_cents: 50000
                exempt_cause_codes: [SEVERE_WEATHER, UTILITY_POWER_FAILURE, TELEPHONE_LINE_FAILURE, AUTHORIZED_TEST_WITH_NOTICE, CRIMINAL_OFFENSE_CONFIRMED, NEW_INSTALLATION_GRACE]
                company_probation_score_threshold: 0.70
                company_suspension_score_threshold: 0.50
              captures: { sched_id: $.data.id, sched_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "FeeSchedule.${sched_id}.status == DRAFT"
            - "FeeSchedule.${sched_id}.version == 1"
            - "FeeSchedule.${sched_id}.superseded_at is null"
            - "FeeSchedule.${sched_id}.free_alarm_allowance == 2 and per_incident_fee_cap_cents == 100000 and suspension_period_aggravation_cents == 50000"
            - "FeeSchedule.${sched_id}.occupancy_multipliers.COMMERCIAL == 1.50 and occupancy_multipliers.FINANCIAL == 2.00"
            - "FeeSchedule.${sched_id}.fee_tiers has 5 entries and the last entry has to_index null with base_fee_cents 75000"
            - "FeeSchedule.${sched_id}.id, created_at and updated_at are all present and non-null"

      - name: alarm_site_get_by_id_returns_the_stored_premises_record
        claim_type: Retrieval
        grounds:
          - entities.AlarmSite
          - endpoints.GET_/false-alarm-program/alarm-sites/{siteId}
        distinguishing_aspect: "GET /alarm-sites/{siteId} echoes exactly what POST stored — normalized address_key, occupancy_class COMMERCIAL, police_beat — and additionally exposes the version value clients must later pass as expected_alarm_site_version."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one premises created and nothing else."
          setup_api_calls:
            - *k_clock
            - &k_site
              call: "POST /false-alarm-program/alarm-sites"
              payload: { address_key: "1200-MAIN-ST-75201", street_address: "1200 Main St", city: "Dallas", zip_code: "75201", occupancy_class: "COMMERCIAL", police_beat: "B-114" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { site_id: $.data.id, site_v: $.data.version }
          trigger:
            - call: "GET /false-alarm-program/alarm-sites/${site_id}"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { read_v: $.data.version }
          assert:
            - "the response status is 200 and response_type is object"
            - "AlarmSite.${site_id}.address_key == \"1200-MAIN-ST-75201\" and city == \"Dallas\" and zip_code == \"75201\""
            - "AlarmSite.${site_id}.occupancy_class == COMMERCIAL and police_beat == \"B-114\""
            - "AlarmSite.${site_id}.status == ACTIVE and response_status == RESPONSE_ACTIVE"
            - "the returned version equals 1, the same value POST returned"

      - name: alarm_permit_issuance_computes_term_end_grace_and_new_installation_grace
        claim_type: Computed Fields
        grounds:
          - entities.AlarmPermit
          - calculations.permit_renewal_fee
          - endpoints.POST_/false-alarm-program/alarm-systems/{systemId}/approve-registration
        distinguishing_aspect: "First issuance at 2026-08-01T00:00:00Z under permit_term_days 365 / renewal_grace_days 30 / new_installation_grace_days 30 derives term_end_at 2027-08-01, grace_through_at 2027-08-31 and new_installation_grace_through 2026-08-31 — the third field is populated only on a first issuance and is what exempts early incidents."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTIVE fee schedule; one monitoring company; one COMMERCIAL premises with two ECV-callable contacts; one SUBMITTED alarm system."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - &k_sched_on
              call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-01"
            - &k_co
              call: "POST /false-alarm-program/alarm-companies"
              payload: { legal_name: "Guardian Signal Monitoring LLC", license_number: "TXALM-44120", contact_email: "ops@guardiansignal.example", contact_phone: "+12145550101", score_mode: "VOLUME_WEIGHTED" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { company_id: $.data.id }
            - *k_site
            - &k_c1
              call: "POST /false-alarm-program/site-contacts"
              payload: { alarm_site_id: "${site_id}", full_name: "Rosa Villarreal", phone_number: "+12145550111", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { contact1_id: $.data.id }
            - &k_c2
              call: "POST /false-alarm-program/site-contacts"
              payload: { alarm_site_id: "${site_id}", full_name: "Dev Anand", phone_number: "+12145550112", relationship: "MANAGER", contact_priority: 2, is_ecv_callable: true }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { contact2_id: $.data.id }
            - &k_sys1
              call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 8, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-07-25T14:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { system1_id: $.data.id, system1_v: $.data.version }
          trigger:
            - &k_app1
              call: "POST /false-alarm-program/alarm-systems/${system1_id}/approve-registration"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { permit1_id: $.data.id, permit1_v: $.data.version, permit1_number: $.data.permit_number }
          assert:
            - "the response status is 201 and response_type is object"
            - "AlarmPermit.${permit1_id}.status == ACTIVE and term_start_at == 2026-08-01T00:00:00Z"
            - "AlarmPermit.${permit1_id}.term_end_at == 2027-08-01T00:00:00Z"
            - "AlarmPermit.${permit1_id}.grace_through_at == 2027-08-31T00:00:00Z"
            - "AlarmPermit.${permit1_id}.new_installation_grace_through == 2026-08-31T00:00:00Z"
            - "AlarmPermit.${permit1_id}.permit_number == \"AP-000001\" and renewal_count == 0 and last_renewed_at is null"
            - "AlarmPermit.${permit1_id}.issued_by_user_id == \"pc-07\" and alarm_site_id == ${site_id}"
            - "AlarmSystem.${system1_id}.status == PERMITTED with permitted_at == 2026-08-01T00:00:00Z"
            - "AlarmSite.${site_id}.governing_fee_schedule_id == ${sched_id}"

      - name: alarm_sites_list_page_two_reports_total_count_limit_offset_and_has_more
        claim_type: Listing
        grounds:
          - entities.AlarmSite
          - endpoints.GET_/false-alarm-program/alarm-sites
        distinguishing_aspect: "With three premises and per_page 2, page 1 returns 2 rows with has_more true and page 2 returns exactly 1 row with has_more false, while total_count stays 3 on both pages and the envelope reports limit 2 / offset 2 on the second page."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; exactly three AlarmSite rows."
          setup_api_calls:
            - *k_clock
            - *k_site
            - &k_site2
              call: "POST /false-alarm-program/alarm-sites"
              payload: { address_key: "88-ELM-AVE-75204", street_address: "88 Elm Ave", city: "Dallas", zip_code: "75204", occupancy_class: "RESIDENTIAL", police_beat: "B-207" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { site2_id: $.data.id, site2_v: $.data.version }
            - &k_site3
              call: "POST /false-alarm-program/alarm-sites"
              payload: { address_key: "4-CIVIC-PLZ-75202", street_address: "4 Civic Plaza", city: "Dallas", zip_code: "75202", occupancy_class: "GOVERNMENT", police_beat: "B-101" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { site3_id: $.data.id }
          trigger:
            - call: "GET /false-alarm-program/alarm-sites"
              payload: { page: 1, per_page: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { first_row_id: "$.data[0].id" }
            - call: "GET /false-alarm-program/alarm-sites"
              payload: { page: 2, per_page: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { page2_row_id: "$.data[0].id" }
          assert:
            - "both responses have status 200 and response_type array"
            - "page 1 returns 2 items with meta/pagination limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page 2 returns 1 item with limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the union of the two pages is exactly {${site_id}, ${site2_id}, ${site3_id}} with no row repeated"

      - name: alarm_permit_get_with_unknown_uuid_returns_permit_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_ALARM_PERMIT_NOT_FOUND
          - validations.priority_6_ERR_RESOURCE_NOT_FOUND
          - endpoints.GET_/false-alarm-program/alarm-permits/{permitId}
        distinguishing_aspect: "A syntactically valid but unused UUID in the permit path yields the entity-specific 404 ERR_ALARM_PERMIT_NOT_FOUND, not the generic ERR_RESOURCE_NOT_FOUND and not a 200 with null data."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no AlarmPermit rows exist at all."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /false-alarm-program/alarm-permits/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "data.error_id == ERR_ALARM_PERMIT_NOT_FOUND"
            - "data.message is a non-empty string and no AlarmPermit row is created"

      - name: alarm_system_create_without_zone_count_returns_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.AlarmSystem
          - validations.priority_4_ERR_MISSING_REQUIRED_FIELD
          - endpoints.POST_/false-alarm-program/alarm-systems
        distinguishing_aspect: "zone_count carries source: input with no default, so omitting it is a priority-4 ERR_MISSING_REQUIRED_FIELD (422) reported before any FK existence check on alarm_site_id or monitoring_company_id."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTIVE schedule, one company, one premises."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
          trigger:
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-07-25T14:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and response_type is error"
            - "data.error_id == ERR_MISSING_REQUIRED_FIELD"
            - "GET /false-alarm-program/alarm-systems?alarm_site_id=${site_id} returns total_count == 0"

      - name: alarm_company_create_starts_active_with_default_compliance_score
        claim_type: Defaults
        grounds:
          - entities.AlarmCompany
          - endpoints.POST_/false-alarm-program/alarm-companies
        distinguishing_aspect: "A company created with only its five input fields defaults status to ACTIVE, reporting_compliance_score to 1.00 and every counter (monitored_system_count, dispatch_request_count_lifetime, consecutive_flagged_report_count) to 0, with probation_started_at and last_status_action_at null."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no companies exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /false-alarm-program/alarm-companies"
              payload: { legal_name: "Northside Alarm Response Inc", license_number: "TXALM-90311", contact_email: "ops@northside.example", contact_phone: "+12145550190", score_mode: "PERIOD_EQUAL" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { co_default_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "AlarmCompany.${co_default_id}.status == ACTIVE and version == 1"
            - "AlarmCompany.${co_default_id}.reporting_compliance_score == 1.00"
            - "AlarmCompany.${co_default_id}.monitored_system_count == 0 and dispatch_request_count_lifetime == 0 and consecutive_flagged_report_count == 0"
            - "AlarmCompany.${co_default_id}.probation_started_at is null and last_status_action_at is null and status_reason is null"
            - "AlarmCompany.${co_default_id}.score_mode == PERIOD_EQUAL (the supplied variant selector is honoured, not defaulted to VOLUME_WEIGHTED)"

      - name: hearing_docket_create_omitting_capacity_defaults_to_four_seats
        claim_type: Defaults
        grounds:
          - entities.HearingDocket
          - endpoints.POST_/false-alarm-program/hearing-dockets
        distinguishing_aspect: "capacity is the only optional input on POST /hearing-dockets; omitting it applies the declared default 4 (not the 1..8 bounds and not null), and the docket opens with scheduled_appeal_count 0 in status OPEN."
        test_recipe:
          setup:
            - "Clock 2026-09-20T00:00:00Z so the session lies in the future; no dockets exist."
          setup_api_calls:
            - &k_clock_sep
              call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
          trigger:
            - call: "POST /false-alarm-program/hearing-dockets"
              payload: { hearing_officer_user_id: "ho-03", session_start: "2026-10-05T14:00:00Z", session_end: "2026-10-05T16:00:00Z", location: "City Hall Room 210" }
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { docket_def_id: $.data.id, docket_def_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "HearingDocket.${docket_def_id}.capacity == 4"
            - "HearingDocket.${docket_def_id}.status == OPEN and scheduled_appeal_count == 0 and held_at is null"
            - "HearingDocket.${docket_def_id}.version == 1"

      - name: alarm_site_create_initializes_every_derived_counter_to_zero
        claim_type: Computed Fields
        grounds:
          - entities.AlarmSite
          - calculations.site_response_posture
          - calculations.site_balance_rollup
          - endpoints.POST_/false-alarm-program/alarm-sites
        distinguishing_aspect: "A brand-new premises has both counting variants and every money field at 0 and renewal_block_active false — the computed fields are derived from an empty incident/invoice set rather than left null, and governing_fee_schedule_id stays null until the first permit issuance pins it."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z with an ACTIVE fee schedule already present, to prove pinning happens at issuance and not at site creation."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
          trigger:
            - call: "POST /false-alarm-program/alarm-sites"
              payload: { address_key: "77-OAK-LN-75210", street_address: "77 Oak Ln", city: "Dallas", zip_code: "75210", occupancy_class: "SCHOOL", police_beat: "B-330" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { fresh_site_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "AlarmSite.${fresh_site_id}.chargeable_count_rolling_365 == 0 and chargeable_count_permit_year == 0 and chargeable_count_window == 0"
            - "AlarmSite.${fresh_site_id}.lifetime_assessed_cents == 0 and outstanding_balance_cents == 0 and credit_balance_cents == 0"
            - "AlarmSite.${fresh_site_id}.unpermitted_system_count == 0 and lifted_suspension_count == 0 and ecv_callable_contact_count == 0"
            - "AlarmSite.${fresh_site_id}.renewal_block_active == false and response_status == RESPONSE_ACTIVE"
            - "AlarmSite.${fresh_site_id}.governing_fee_schedule_id is null even though FeeSchedule ${sched_id} is ACTIVE"

      - name: site_contact_create_client_supplied_status_extra_field_ignored
        claim_type: System Fields
        grounds:
          - entities.SiteContact
          - endpoints.POST_/false-alarm-program/site-contacts
        distinguishing_aspect: "status, removed_at, id, created_at, updated_at and version are all source: system on SiteContact; a client that posts status REMOVED and removed_at alongside the legitimate inputs still gets an ACTIVE contact with system-generated timestamps, and the site's ecv_callable_contact_count rises to 1."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one premises with an empty contact roster."
          setup_api_calls:
            - *k_clock
            - *k_site
          trigger:
            - call: "POST /false-alarm-program/site-contacts"
              payload: { alarm_site_id: "${site_id}", full_name: "Ingrid Sato", phone_number: "+12145550133", relationship: "KEYHOLDER", contact_priority: 3, is_ecv_callable: true, status: "REMOVED", removed_at: "2026-07-01T00:00:00Z" }
              as: AlarmUser
              as_user_id: "${site_id}"
              captures: { sys_contact_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "SiteContact.${sys_contact_id}.status == ACTIVE and removed_at is null — both client-supplied system fields were ignored"
            - "SiteContact.${sys_contact_id}.created_at == 2026-08-01T00:00:00Z and version == 1"
            - "GET /false-alarm-program/alarm-sites/${site_id} reports ecv_callable_contact_count == 1 and version == 2 (the contact write bumped the site)"

      - name: alarm_system_create_rejects_zone_count_below_one
        claim_type: Type Constraints
        grounds:
          - entities.AlarmSystem
          - validations.priority_5_ERR_INVALID_FIELD_VALUE
          - endpoints.POST_/false-alarm-program/alarm-systems
        distinguishing_aspect: "zone_count declares constraint >= 1, so 0 is rejected at priority 5 with ERR_INVALID_FIELD_VALUE (422) even though every other field is well formed and every FK resolves."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTIVE schedule, one company, one premises."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
          trigger:
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "COMBINATION", zone_count: 0, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-07-25T14:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and response_type is error"
            - "data.error_id == ERR_INVALID_FIELD_VALUE"
            - "no AlarmSystem row exists for ${site_id}"

      - name: alarm_system_create_rejects_invalid_enum_verified_response_mode
        claim_type: Type Constraints
        grounds:
          - entities.AlarmSystem
          - validations.priority_5_ERR_INVALID_FIELD_VALUE
          - endpoints.POST_/false-alarm-program/alarm-systems
        distinguishing_aspect: "verified_response_mode admits only NONE, AUDIO_VIDEO_REQUIRED and GUARD_REQUIRED; the plausible-looking value GUARD_RESPONSE (which is a legal DispatchRequest.verification_method, not a system mode) is rejected with ERR_INVALID_FIELD_VALUE rather than silently coerced to the NONE default."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTIVE schedule, one company, one premises."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
          trigger:
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "GUARD_RESPONSE", installed_at: "2026-07-25T14:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and response_type is error"
            - "data.error_id == ERR_INVALID_FIELD_VALUE"
            - "no AlarmSystem row is created and AlarmSite.${site_id}.version is unchanged at 1"

      - name: site_contact_create_rejects_contact_priority_above_five
        claim_type: Type Constraints
        grounds:
          - entities.SiteContact
          - validations.priority_5_ERR_INVALID_FIELD_VALUE
          - endpoints.POST_/false-alarm-program/site-contacts
        distinguishing_aspect: "contact_priority is bounded 1..5; priority 6 is a range violation caught at priority 5 (ERR_INVALID_FIELD_VALUE), which is a different failure from ERR_DUPLICATE_CONTACT_PRIORITY — the roster is empty, so nothing collides."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one premises with an empty roster."
          setup_api_calls:
            - *k_clock
            - *k_site
          trigger:
            - call: "POST /false-alarm-program/site-contacts"
              payload: { alarm_site_id: "${site_id}", full_name: "Out Of Range", phone_number: "+12145550166", relationship: "KEYHOLDER", contact_priority: 6, is_ecv_callable: true }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and response_type is error"
            - "data.error_id == ERR_INVALID_FIELD_VALUE and NOT ERR_DUPLICATE_CONTACT_PRIORITY"
            - "GET /false-alarm-program/site-contacts?alarm_site_id=${site_id} returns total_count == 0"

      - name: payment_allocation_row_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PaymentAllocation
          - endpoints.GET_/false-alarm-program/payment-allocations/{allocationId}
          - endpoints.GET_/false-alarm-program/payment-allocations
        distinguishing_aspect: "PaymentAllocation declares common_fields: false, so its rows expose only id and created_at — no updated_at, no version — and §1.5 offers no POST/PATCH/DELETE for the collection: allocations exist only as a cascade of POST /payment-records and are reversed, never edited."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; permit AP-000001 issued, which raises a PERMIT_ISSUE_FEE invoice of 5000 + 500 admin = 5500 cents; a 5500-cent card payment settles it."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - &k_inv1
              call: "GET /false-alarm-program/penalty-invoices"
              payload: { alarm_site_id: "${site_id}", kind: "PERMIT_ISSUE_FEE" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { inv1_id: "$.data[0].id", inv1_v: "$.data[0].version", inv1_outstanding: "$.data[0].outstanding_cents" }
            - &k_site_v
              call: "GET /false-alarm-program/alarm-sites/${site_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { site_v_now: $.data.version }
            - &k_pay1
              call: "POST /false-alarm-program/payment-records"
              payload: { alarm_site_id: "${site_id}", amount_cents: 5500, tendered_on: "2026-08-01", method: "CARD", allocation_mode: "AUTO_WATERFALL", expected_alarm_site_version: "${site_v_now}" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { pay1_id: $.data.id, pay1_receipt: $.data.receipt_number }
          trigger:
            - call: "GET /false-alarm-program/payment-allocations"
              payload: { payment_record_id: "${pay1_id}" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { alloc1_id: "$.data[0].id" }
            - call: "GET /false-alarm-program/payment-allocations/${alloc1_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { alloc1_amount: $.data.amount_cents }
          assert:
            - "both responses have status 200"
            - "the allocation list returns total_count == 1 with sequence_index == 0 and penalty_invoice_id == ${inv1_id}"
            - "PaymentAllocation.${alloc1_id}.amount_cents == 5500 and status == APPLIED"
            - "the allocation payload contains id and created_at but no version and no updated_at key at all"
            - "§1.5 declares no POST, PATCH or DELETE under /false-alarm-program/payment-allocations, so the row can only be superseded by voiding ${pay1_id}"

      - name: alarm_system_create_with_unknown_alarm_site_id_returns_site_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.AlarmSystem
          - validations.priority_7_ERR_RESOURCE_NOT_FOUND
          - errors.ERR_ALARM_SITE_NOT_FOUND
          - endpoints.POST_/false-alarm-program/alarm-systems
        distinguishing_aspect: "AlarmSystem's parent is AlarmSite and the FK arrives in the body, so an unused site UUID is caught by the priority-7 body-FK check and emits ERR_ALARM_SITE_NOT_FOUND — leftmost-first, so the site FK is reported even though monitoring_company_id is also checked."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTIVE schedule and one real company exist; the referenced site does not."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
          trigger:
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "00000000-0000-4000-8000-0000000000aa", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 6, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-07-25T14:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "data.error_id == ERR_ALARM_SITE_NOT_FOUND"
            - "AlarmCompany.${company_id}.monitored_system_count stays 0"

      - name: dispatch_request_rejects_system_monitored_by_a_different_company
        claim_type: Cross-reference integrity (flat topology)
        grounds:
          - complexity_profile.entity_topology_flat
          - errors.ERR_COMPANY_NOT_SYSTEM_MONITOR
          - endpoints.POST_/false-alarm-program/dispatch-requests
        distinguishing_aspect: "In a flat topology the company-to-system link is a plain FK rather than a URL nesting, so it must be re-validated on every dispatch: operator of company B lodging a request for a system monitored by company A fails with ERR_COMPANY_NOT_SYSTEM_MONITOR (409), not a 404 and not a 403."
        test_recipe:
          setup:
            - "Clock 2026-09-20T00:00:00Z; permitted system ${system1_id} is monitored by company ${company_id}; a second registered company acts as the caller."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - &k_co2
              call: "POST /false-alarm-program/alarm-companies"
              payload: { legal_name: "Rival Central Station Co", license_number: "TXALM-77002", contact_email: "ops@rivalcentral.example", contact_phone: "+12145550222", score_mode: "VOLUME_WEIGHTED" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { company2_id: $.data.id }
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
          trigger:
            - call: "POST /false-alarm-program/dispatch-requests"
              payload: { alarm_system_id: "${system1_id}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{ site_contact_id: "${contact1_id}", attempted_at: "2026-09-15T03:10:00Z", outcome: "NO_ANSWER" }, { site_contact_id: "${contact2_id}", attempted_at: "2026-09-15T03:11:00Z", outcome: "NO_ANSWER" }], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-09-15T03:09:00Z", idempotency_key: "rival-001" }
              as: AlarmCompanyOperator
              as_user_id: "${company2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and response_type is error"
            - "data.error_id == ERR_COMPANY_NOT_SYSTEM_MONITOR"
            - "no DispatchRequest row exists for ${system1_id} and AlarmCompany.${company2_id}.dispatch_request_count_lifetime stays 0"

      - name: penalty_invoices_list_filter_reaches_the_cascade_created_permit_invoice
        claim_type: Foreign key reverse-reachability (flat topology)
        grounds:
          - complexity_profile.entity_topology_flat
          - entities.PenaltyInvoice
          - endpoints.GET_/false-alarm-program/penalty-invoices
        distinguishing_aspect: "The PERMIT_ISSUE_FEE invoice is created only as a side effect of approve-registration and is never returned by that call, so its polymorphic FKs must be discoverable through the filtered list: alarm_permit_id and kind together retrieve exactly the one row, with false_alarm_incident_id and suspension_order_id null."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; permit AP-000001 issued for ${system1_id}, raising one PERMIT_ISSUE_FEE invoice."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
          trigger:
            - call: "GET /false-alarm-program/penalty-invoices"
              payload: { alarm_permit_id: "${permit1_id}", kind: "PERMIT_ISSUE_FEE" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { found_inv_id: "$.data[0].id", found_inv_assessed: "$.data[0].assessed_cents" }
          assert:
            - "the response status is 200 and response_type is array with total_count == 1"
            - "PenaltyInvoice.${found_inv_id}.invoice_number == \"INV-000001\" and alarm_site_id == ${site_id}"
            - "PenaltyInvoice.${found_inv_id}.subtotal_cents == 5000, admin_fee_cents == 500, assessed_cents == 5500, outstanding_cents == 5500"
            - "PenaltyInvoice.${found_inv_id}.false_alarm_incident_id is null and suspension_order_id is null (polymorphic parent is the permit)"
            - "PenaltyInvoice.${found_inv_id}.payment_status == UNPAID and collections_stage == CURRENT"

  # ===========================================================================
  # 2. STATE MACHINES — Valid Transition / Precondition Enforcement / Side
  #    Effect Execution / Invalid Transitions / Initial State / Terminal State
  #    Lockdown / Idempotency across the 11 declared machines, plus the
  #    `cyclic` shape extras and the cascade / cross-entity / ledger-sync
  #    side-effect patterns.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: alarm_system_registration_starts_in_submitted_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.AlarmSystem.initial_state_SUBMITTED
          - endpoints.POST_/false-alarm-program/alarm-systems
        distinguishing_aspect: "A freshly registered system is SUBMITTED — not PERMITTED — with permitted_at, unpermitted_since, rejection_reason and decommissioned_at all null, and no AlarmPermit row exists for it yet."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ACTIVE schedule, one company, one premises with two contacts."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
          trigger:
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "COMBINATION", zone_count: 12, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-07-30T09:00:00Z" }
              as: AlarmUser
              as_user_id: "${site_id}"
              captures: { init_sys_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "AlarmSystem.${init_sys_id}.status == SUBMITTED and version == 1"
            - "AlarmSystem.${init_sys_id}.permitted_at, unpermitted_since, rejection_reason and decommissioned_at are all null"
            - "GET /false-alarm-program/alarm-permits?alarm_system_id=${init_sys_id} returns total_count == 0"
            - "AlarmCompany.${company_id}.monitored_system_count == 1 (SUBMITTED already counts as monitored)"

      - name: dispatch_request_submission_starts_in_submitted_with_frozen_findings
        claim_type: Initial State
        grounds:
          - state_machines.DispatchRequest.initial_state_SUBMITTED
          - calculations.ecv_verification_sufficiency
          - endpoints.POST_/false-alarm-program/dispatch-requests
        distinguishing_aspect: "Submission freezes three computed findings on the row at creation time — distinct_ecv_contact_count 2 from two distinct ACTIVE ECV-callable contacts, ecv_sufficient true for TWO_CALL_ECV, and system_permitted_at_occurrence true — and the row starts SUBMITTED with validated_at / dispatched_at / refusal_reason null."
        test_recipe:
          setup:
            - "Permit chain issued at 2026-08-01T00:00:00Z, then the clock moves to 2026-09-20T00:00:00Z so the signal at 2026-09-15 sits past new_installation_grace_through 2026-08-31."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
          trigger:
            - &k_dr1
              call: "POST /false-alarm-program/dispatch-requests"
              payload: { alarm_system_id: "${system1_id}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{ site_contact_id: "${contact1_id}", attempted_at: "2026-09-15T03:10:00Z", outcome: "NO_ANSWER" }, { site_contact_id: "${contact2_id}", attempted_at: "2026-09-15T03:11:00Z", outcome: "NO_ANSWER" }], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-09-15T03:09:00Z", idempotency_key: "gsm-0915-a" }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { dr1_id: $.data.id, dr1_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "DispatchRequest.${dr1_id}.status == SUBMITTED and version == 1"
            - "DispatchRequest.${dr1_id}.distinct_ecv_contact_count == 2 and ecv_sufficient == true"
            - "DispatchRequest.${dr1_id}.system_permitted_at_occurrence == true"
            - "DispatchRequest.${dr1_id}.alarm_site_id == ${site_id} and monitoring_company_id == ${company_id} (both denormalized from the system)"
            - "DispatchRequest.${dr1_id}.validated_at, validated_by_user_id, dispatched_at and refusal_reason are all null"

      - name: dispatch_request_submitted_to_validated_stamps_validating_supervisor
        claim_type: Valid Transition
        grounds:
          - state_machines.DispatchRequest.SUBMITTED_to_VALIDATED
          - endpoints.POST_/false-alarm-program/dispatch-requests/{requestId}/validate
        distinguishing_aspect: "Validation moves SUBMITTED -> VALIDATED and stamps validated_at from the logical clock plus validated_by_user_id from X-User-ID — the identity later barred from determining the resulting incident by segregation of duties."
        test_recipe:
          setup:
            - "Clock 2026-09-20T00:00:00Z with dispatch request ${dr1_id} SUBMITTED and ecv_sufficient true."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
          trigger:
            - &k_dr1_val
              call: "POST /false-alarm-program/dispatch-requests/${dr1_id}/validate"
              payload: {}
              as: PoliceDispatchSupervisor
              as_user_id: "pds-05"
              captures: { dr1_v2: $.data.version }
          assert:
            - "the response status is 200 and response_type is object"
            - "DispatchRequest.${dr1_id}.status == VALIDATED"
            - "DispatchRequest.${dr1_id}.validated_at == 2026-09-20T00:00:00Z"
            - "DispatchRequest.${dr1_id}.validated_by_user_id == \"pds-05\""
            - "DispatchRequest.${dr1_id}.dispatched_at is still null"

      - name: dispatch_request_validated_to_dispatched_stamps_dispatched_at
        claim_type: Valid Transition
        grounds:
          - state_machines.DispatchRequest.VALIDATED_to_DISPATCHED
          - endpoints.POST_/false-alarm-program/dispatch-requests/{requestId}/record-dispatch
        distinguishing_aspect: "record-dispatch is a second, separate transition: it stamps dispatched_at at the clock while leaving validated_at at its earlier value, and only from DISPATCHED can a false alarm incident or a CLOSED_VALID closure follow."
        test_recipe:
          setup:
            - "Dispatch request ${dr1_id} VALIDATED at 2026-09-20T00:00:00Z; the clock then advances to 2026-09-20T01:00:00Z before units roll."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - &k_clock_sep_1h
              call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T01:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
          trigger:
            - &k_dr1_disp
              call: "POST /false-alarm-program/dispatch-requests/${dr1_id}/record-dispatch"
              payload: {}
              as: PoliceDispatchSupervisor
              as_user_id: "pds-05"
              captures: { dr1_v3: $.data.version }
          assert:
            - "the response status is 200 and response_type is object"
            - "DispatchRequest.${dr1_id}.status == DISPATCHED"
            - "DispatchRequest.${dr1_id}.dispatched_at == 2026-09-20T01:00:00Z"
            - "DispatchRequest.${dr1_id}.validated_at is unchanged at 2026-09-20T00:00:00Z"
            - "AlarmSite.${site_id}.chargeable_count_window is still 0 — dispatching alone counts nothing"

      - name: false_alarm_incident_creation_leaves_the_request_in_dispatched_self_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.DispatchRequest.DISPATCHED_to_DISPATCHED
          - state_machines.FalseAlarmIncident.initial_state_REPORTED
          - endpoints.POST_/false-alarm-program/false-alarm-incidents
        distinguishing_aspect: "The only self-loop in the scaffold: opening an incident bumps DispatchRequest.version from 3 to 4 while its status stays DISPATCHED, and the new incident starts REPORTED with occurrence_index null and assessed_fee_cents 0 — creating the incident charges nothing on its own."
        test_recipe:
          setup:
            - "Dispatch request ${dr1_id} in DISPATCHED at clock 2026-09-20T01:00:00Z with no incident referencing it."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
          trigger:
            - &k_inc1
              call: "POST /false-alarm-program/false-alarm-incidents"
              payload: { dispatch_request_id: "${dr1_id}", cause_code: "OPERATOR_ERROR", narrative: "Closing employee armed the panel and re-entered through zone 4." }
              as: PoliceDispatchSupervisor
              as_user_id: "pds-05"
              captures: { inc1_id: $.data.id, inc1_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "DispatchRequest.${dr1_id}.status is still DISPATCHED and its version rose from 3 to 4"
            - "FalseAlarmIncident.${inc1_id}.status == REPORTED and version == 1"
            - "FalseAlarmIncident.${inc1_id}.occurrence_index is null, assessed_fee_cents == 0, determination is null"
            - "FalseAlarmIncident.${inc1_id}.occurred_at == 2026-09-15T03:09:00Z, alarm_site_id == ${site_id}, alarm_system_id == ${system1_id}"
            - "AlarmSite.${site_id}.chargeable_count_window is still 0"

      - name: false_alarm_incident_first_counted_occurrence_runs_the_declared_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FalseAlarmIncident.UNDER_REVIEW_to_COUNTED
          - calculations.false_alarm_occurrence_index
          - calculations.escalating_false_alarm_fee
          - endpoints.POST_/false-alarm-program/false-alarm-incidents/{incidentId}/determination
        distinguishing_aspect: "The row passes REPORTED -> UNDER_REVIEW -> COUNTED inside one request. occurrence_index 1 falls inside free_alarm_allowance 2, so tier_base_cents is 0 and assessed_fee_cents is 0 — and because the subtotal would be 0 the declared side effect explicitly issues NO FALSE_ALARM_FEE invoice, while the site counters still rise to 1."
        test_recipe:
          setup:
            - "Incident ${inc1_id} REPORTED with cause_code OPERATOR_ERROR (not an exempt code) at a COMMERCIAL site governed by FS-2026-A; clock 2026-09-20T01:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
          trigger:
            - &k_inc1_counted
              call: "POST /false-alarm-program/false-alarm-incidents/${inc1_id}/determination"
              payload: { determination: "COUNTED", review_notes: "Operator error confirmed on the audio log." }
              as: FalseAlarmReviewOfficer
              as_user_id: "faro-11"
              captures: { inc1_v2: $.data.version, inc1_idx: $.data.occurrence_index, inc1_fee: $.data.assessed_fee_cents }
          assert:
            - "the response status is 200 and response_type is object"
            - "FalseAlarmIncident.${inc1_id}.status == COUNTED and determination == COUNTED"
            - "FalseAlarmIncident.${inc1_id}.determined_at == 2026-09-20T01:00:00Z and determined_by_user_id == \"faro-11\""
            - "FalseAlarmIncident.${inc1_id}.occurrence_index == 1 and counted_window_mode == ROLLING_365"
            - "FalseAlarmIncident.${inc1_id}.assessed_fee_cents == 0 and fee_basis.tier_base_cents == 0 and fee_basis.cap_applied == false"
            - "GET /false-alarm-program/penalty-invoices?alarm_site_id=${site_id}&kind=FALSE_ALARM_FEE returns total_count == 0"
            - "AlarmSite.${site_id}.chargeable_count_rolling_365 == 1, chargeable_count_permit_year == 1, chargeable_count_window == 1"
            - "AlarmSite.${site_id}.lifetime_assessed_cents == 0 and response_status == RESPONSE_ACTIVE (1 < probation_threshold_count 4)"

