        distinguishing_aspect: "POST /quotes/{id}/accept as ServiceManager (a Customer-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A SENT quote."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mg Racc", email: "mgracc@x.com", service_address: "27 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "response status == 403"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_reservation_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-job]", entities.Job.fields.version]
        distinguishing_aspect: "POST /part-reservations with the current expected_job_version succeeds (201) and increments Job.version by 1."
        test_recipe:
          setup: ["An accepted job (no PART lines), a stocked part, and the freshly read job version."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ok Ver", email: "okver@x.com", service_address: "28 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SEN-2", category: "SENSOR", unit_price_cents: 3000, on_hand_qty: 10 }
              as: ServiceManager
              captures: { part_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id", job_v: "$.data[0].version" }
          trigger:
            - call: "POST /part-reservations"
              payload: { job_id: "${job_id}", part_id: "${part_id}", qty: 1, expected_job_version: "${job_v}" }
              as: Dispatcher
              captures: { resv_id: $.data.id, st: $.data.status }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ServiceManager
              captures: { new_v: $.data.version }
          assert:
            - "response status == 201"
            - "PartReservation.${resv_id}.status == HELD"
            - "Job.${job_id}.version == ${job_v} + 1"

      - name: occ_reservation_create_stale_job_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-job]", entities.Job.fields.version, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one POST /part-reservations bumps Job.version, a second create still carrying the pre-bump expected_job_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "An accepted SERVICE_CALL job (no PART lines so no auto-reservations); part stocked; client reads the job version then creates one reservation."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Oc Cstale", email: "occ@x.com", service_address: "30 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SEN-1", category: "SENSOR", unit_price_cents: 3000, on_hand_qty: 10 }
              as: ServiceManager
              captures: { sensor_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id", job_v: "$.data[0].version" }
            - call: "POST /part-reservations"
              payload: { job_id: "${job_id}", part_id: "${sensor_id}", qty: 1, expected_job_version: "${job_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /part-reservations"
              payload: { job_id: "${job_id}", part_id: "${sensor_id}", qty: 1, expected_job_version: "${job_v}" }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response status == 412"

      - name: occ_quote_revise_stale_quote_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-revise-stale-quote]", entities.Quote.fields.version, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one POST /quotes/{id}/revise bumps Quote.version, a second revise carrying the pre-bump expected_quote_version is rejected with ERR_STALE_VERSION (412) — different parent entity than the reservation OCC."
        test_recipe:
          setup:
            - "A SENT quote; client captures version v1, revises once (version advances), then retries revise with v1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Qu Stale", email: "qstale@x.com", service_address: "31 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
              captures: { v1: $.data.version }
            - call: "POST /quotes/${quote_id}/revise"
              payload: { expected_quote_version: "${v1}" }
              as: ServiceManager
          trigger:
            - call: "POST /quotes/${quote_id}/revise"
              payload: { expected_quote_version: "${v1}" }
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response status == 412"

      - name: derived_reservation_consume_decrements_on_hand
        claim_type: derived_field_reconciliation
        grounds: [state_machines.PartReservation.status.HELD_to_CONSUMED, entities.Part.fields.on_hand_qty, entities.Part.fields.reserved_qty, entities.Part.fields.available_qty]
        distinguishing_aspect: "Consuming a HELD reservation (qty 2) drops on_hand 10->8 and reserved 2->0, leaving available 8 (derived fields reconcile after consume)."
        test_recipe:
          setup: ["An ON_SITE job with a HELD reservation qty 2 against a part on_hand 10 (reserved 2, available 8)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "De Riv", email: "deriv@x.com", service_address: "29 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Abe", skill_level: "CERTIFIED" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SPR-5", category: "SPRING", unit_price_cents: 10000, on_hand_qty: 10 }
              as: ServiceManager
              captures: { part_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${part_id}", qty: 2, unit_price_cents: 10000 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /part-reservations"
              payload: { job_id: "${job_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { resv_id: "$.data[0].id" }
          trigger:
            - call: "POST /part-reservations/${resv_id}/consume"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /parts/${part_id}"
              payload: {}
              as: ServiceManager
              captures: { oh: $.data.on_hand_qty, rq: $.data.reserved_qty, aq: $.data.available_qty }
          assert:
            - "Part.${part_id}.on_hand_qty == 8"
            - "Part.${part_id}.reserved_qty == 0"
            - "Part.${part_id}.available_qty == 8"

      - name: rate_threshold_overnight_rate_clamped_at_max
        claim_type: rate_threshold_triggers
        grounds: [calculations.job_emergency_surcharge, entities.Job.fields.emergency_surcharge_cents]
        distinguishing_aspect: "OVERNIGHT band (rate 0.50) on a large base would compute 36000 surcharge; here base 72000 -> raw 36000 within [5000,40000], so surcharge==36000 (different band than the §1.8 after-hours instance)."
        excluded_because:
          difficulty_instance: combinatorial_formula / cf_emergency_surcharge_tier_and_cap
          rationale: "Band selection + clamp on emergency surcharge is the body of the named §1.8 combinatorial instance; the overnight band is the same mechanism."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_accept_job_visible_via_list
        claim_type: immediate
        grounds: [state_machines.Quote.status.SENT_to_ACCEPTED, endpoints]
        distinguishing_aspect: "Immediate consistency: the Job created by /accept is queryable via GET /jobs?quote_id within the same flow (no lag)."
        excluded_because:
          difficulty_instance: transitive_cascade / tc_quote_accept_job_reservation_part_depth3
          rationale: "The accept-creates-job cascade and its immediate visibility are exercised by the named §1.8 cascade instance, which reads the job and reservations right after accept."
