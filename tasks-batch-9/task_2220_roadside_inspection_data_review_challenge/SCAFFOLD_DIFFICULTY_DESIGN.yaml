scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: basic_score_provisional_vs_certified_diverge_while_challenge_open
        grounds:
          - calculations.basic_measure_recompute
          - entities.BasicScore.fields.provisional_measure
          - entities.BasicScore.fields.certified_measure
          - entities.BasicScore.fields.challenged_time_weighted_severity
          - state_machines.DataChallenge.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The divergence lives in the BasicScore numerator: provisional_measure keeps the challenged
          violation's time_weighted_severity while certified_measure subtracts it, so one SUBMITTED
          challenge makes provisional_measure 1.000 and certified_measure 0.500 on the same row, and
          only the certified branch feeds percentile, alert_status, intervention posture and ISS.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (DOT 1000001, 20 power units, 1,600,000 annual VMT) -> segment MEDIUM, utilization_factor 1.5, power_unit_exposure 30.0, challenge_quota_limit 3."
            - "UNSAFE_DRIVING violation code with severity_weight 5; UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0 effective 2026-01-01."
            - "One SCORED report dated 2026-07-01 (age 31 days -> time_weight 3) carrying two UNSAFE_DRIVING violations, each time_weighted_severity 15.0, report total 30.0."
            - "A DRAFT VIOLATION_NOT_SUPPORTED challenge on the second violation with one evidence row attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { th_ud_id: $.data.id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070101", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00001", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v2_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /inspection-reports/${r1_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /data-challenges"
              payload: { report_id: "${r1_id}", challenge_type: "VIOLATION_NOT_SUPPORTED", narrative: "Second speeding entry is not supported by the officer narrative.", target_violation_id: "${v2_id}" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { ch1_id: $.data.id }
            - call: "POST /data-challenges/${ch1_id}/evidence"
              payload: { evidence_type: "ELD_RECORD", document_uri: "s3://dataqs/c1/eld-0701.json", description: "ELD trace for the inspection window" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /data-challenges/${ch1_id}/submit"
              payload: {}
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
            - call: "GET /basic-scores"
              payload: { carrier_id: "${c1_id}", basic_category: "UNSAFE_DRIVING" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { bs_ud_provisional: "$.data[0].provisional_measure", bs_ud_certified: "$.data[0].certified_measure" }
            - call: "GET /carriers/${c1_id}"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
          assert:
            - "DataChallenge.${ch1_id}.status == SUBMITTED"
            - "Violation.${v2_id}.under_challenge == true"
            - "Violation.${v1_id}.under_challenge == false"
            - "Violation.${v2_id}.time_weighted_severity == 15.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).total_time_weighted_severity == 30.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).challenged_time_weighted_severity == 15.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).included_violation_count == 2"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).denominator_value == 30.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).provisional_measure == 1.000"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).certified_measure == 0.500"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).percentile == 50.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).alert_status == MONITOR"
            - "Carrier.${c1_id}.open_alert_count == 0"
            - "Carrier.${c1_id}.intervention_status == NONE"
            - "Carrier.${c1_id}.iss_pre_credit_value == 17.5"
            - "Carrier.${c1_id}.data_quality_credit_pct == 0.0"
            - "Carrier.${c1_id}.iss_value == 17.5"
            - "Carrier.${c1_id}.selection_band == PASS"
            - "Carrier.${c1_id}.challenge_quota_used == 1"

      - name: driver_strict_vs_adjudicated_diverge_on_dismissal
        grounds:
          - calculations.driver_attribution_scores
          - entities.Driver.fields.strict_attribution_score
          - entities.Driver.fields.adjudicated_attribution_score
          - entities.CitationAdjudication.fields.severity_factor
          - state_machines.CitationAdjudication.PENDING_to_DISMISSED
        distinguishing_aspect: |
          The divergence lives in the Driver attribution ledger, not in the BasicScore ledger:
          recording a DISMISSED court result sets severity_factor 0.0, so strict_attribution_score
          stays 39.00 (raw sum of both violations) while adjudicated_attribution_score drops to
          24.00, and the violation itself remains ACTIVE with time_weighted_severity 15.0 because
          record_update_status is still NOT_APPLIED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (20 power units, 1,600,000 VMT) -> MEDIUM, power_unit_exposure 30.0; ACTIVE driver d1."
            - "UNSAFE_DRIVING code severity_weight 8 and HOURS_OF_SERVICE code severity_weight 5; thresholds UNSAFE_DRIVING/MEDIUM 0.5/1.0/2.0 and HOURS_OF_SERVICE/MEDIUM 7.0/10.75/21.5."
            - "One SCORED report dated 2026-07-01 (time_weight 3) with two DRIVER-unit violations attributed to d1: UNSAFE_DRIVING 24.0 and HOURS_OF_SERVICE 15.0; strict_attribution_score 39.00, coaching_required true."
            - "A PENDING CitationAdjudication on the HOURS_OF_SERVICE violation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /drivers"
              payload: { carrier_id: "${c1_id}", cdl_number: "OH-D-99001", full_name: "Dana Reyes", employment_status: "ACTIVE" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2R", description: "Reckless driving", basic_category: "UNSAFE_DRIVING", severity_weight: 8, driver_attributable: true }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud8_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "395.8E", description: "False record of duty status", basic_category: "HOURS_OF_SERVICE", severity_weight: 5, driver_attributable: true }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_hos5_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "HOURS_OF_SERVICE", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 7.0, measure_at_p65: 10.75, measure_at_p80: 21.5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070102", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00002", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud8_id}", unit_type: "DRIVER", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v_ud_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_hos5_id}", unit_type: "DRIVER", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v_hos_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /inspection-reports/${r1_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "GET /violations/${v_hos_id}"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v_hos_version: $.data.version }
            - call: "POST /citation-adjudications"
              payload: { violation_id: "${v_hos_id}", citation_number: "OH-CIT-77001", court_date: "2026-07-20T00:00:00Z", expected_violation_version: "${v_hos_version}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /citation-adjudications/${adj_id}/court-result"
              payload: { court_status: "DISMISSED", court_note: "Franklin County dismissed the citation for lack of evidence." }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "GET /drivers/${d1_id}/attribution-summary"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { strict_after: $.data.strict_attribution_score, adjudicated_after: $.data.adjudicated_attribution_score }
          assert:
            - "CitationAdjudication.${adj_id}.court_status == DISMISSED"
            - "CitationAdjudication.${adj_id}.severity_factor == 0.0"
            - "CitationAdjudication.${adj_id}.record_update_status == NOT_APPLIED"
            - "Violation.${v_hos_id}.status == ACTIVE"
            - "Violation.${v_hos_id}.time_weighted_severity == 15.0"
            - "Driver.${d1_id}.attributed_violation_count == 2"
            - "Driver.${d1_id}.strict_attribution_score == 39.00"
            - "Driver.${d1_id}.adjudicated_attribution_score == 24.00"
            - "Driver.${d1_id}.coaching_required == true"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).certified_measure == 0.800"
            - "BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).percentile == 59.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=HOURS_OF_SERVICE).denominator_value == 2.0"
            - "BasicScore(carrier_id=${c1_id}, basic_category=HOURS_OF_SERVICE).certified_measure == 7.500"
            - "BasicScore(carrier_id=${c1_id}, basic_category=HOURS_OF_SERVICE).percentile == 52.0"

  - rule_id: combinatorial_formula
    instances:
      - name: basic_measure_utilization_tier_times_category_denominator_matrix
        grounds:
          - calculations.basic_measure_recompute
          - calculations.intervention_posture
          - calculations.screening_risk_recompute
          - entities.Carrier.fields.utilization_factor
          - entities.BasicScore.fields.denominator_value
        distinguishing_aspect: |
          Mode (a) - two independent input dimensions multiply: the utilization tier selected by
          vmt_per_pu (120000 -> 1.8, power_unit_exposure 18.0) crosses the three-way category
          denominator branch, so one carrier carries, in the same snapshot, denominator_value 18.0
          (UNSAFE_DRIVING and DRIVER_FITNESS), 2.0 (VEHICLE_MAINTENANCE = inspection count) and
          4.0 (HOURS_OF_SERVICE = min(exposure, inspections * 2.0)) from identical numerators.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c4 (DOT 1000004, 10 power units, 1,200,000 annual VMT) -> segment SMALL, vmt_per_pu 120000, utilization_factor 1.8, power_unit_exposure 18.0."
            - "One ACTIVE driver d4 at c4."
            - "Four violation codes: UNSAFE_DRIVING weight 5, HOURS_OF_SERVICE weight 5, VEHICLE_MAINTENANCE weight 2, DRIVER_FITNESS weight 4."
            - "Four SMALL-segment thresholds, one per category, all 1.0 / 2.0 / 4.0 effective 2026-01-01."
            - "Two SCORED reports dated 2026-07-01 (time_weight 3): report A carries the UNSAFE_DRIVING (15.0) and HOURS_OF_SERVICE (15.0) violations, report B carries the VEHICLE_MAINTENANCE (6.0) and DRIVER_FITNESS (12.0) violations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000004", legal_name: "Cascade Hauling Inc", average_power_units: 10, annual_vmt: 1200000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c4_id: $.data.id }
            - call: "POST /drivers"
              payload: { carrier_id: "${c4_id}", cdl_number: "WA-D-40001", full_name: "Kai Osborne", employment_status: "ACTIVE" }
              as: CarrierSafetyManager
              as_user_id: "${c4_id}"
              captures: { d4_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5, driver_attributable: true }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "395.3A1", description: "Driving beyond 11 hour limit", basic_category: "HOURS_OF_SERVICE", severity_weight: 5, driver_attributable: true }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_hos5_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "393.9TS", description: "Inoperative tail lamp", basic_category: "VEHICLE_MAINTENANCE", severity_weight: 2 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_vm2_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "391.11B5", description: "Driver lacking valid medical certificate", basic_category: "DRIVER_FITNESS", severity_weight: 4, driver_attributable: true }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_df4_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "SMALL", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 1.0, measure_at_p65: 2.0, measure_at_p80: 4.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "HOURS_OF_SERVICE", carrier_segment: "SMALL", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 1.0, measure_at_p65: 2.0, measure_at_p80: 4.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "VEHICLE_MAINTENANCE", carrier_segment: "SMALL", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 1.0, measure_at_p65: 2.0, measure_at_p80: 4.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "DRIVER_FITNESS", carrier_segment: "SMALL", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 1.0, measure_at_p65: 2.0, measure_at_p80: 4.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "WA20260701A", inspection_state: "WA", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK04001", attributed_carrier_id: "${c4_id}", selection_source: "RANDOM", driver_id: "${d4_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
              captures: { rA_id: $.data.id }
            - call: "POST /inspection-reports/${rA_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "DRIVER", driver_id: "${d4_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
              captures: { vA_ud_id: $.data.id }
            - call: "POST /inspection-reports/${rA_id}/violations"
              payload: { violation_code_id: "${vc_hos5_id}", unit_type: "DRIVER", driver_id: "${d4_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
              captures: { vA_hos_id: $.data.id }
            - call: "POST /inspection-reports/${rA_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
            - call: "POST /inspection-reports"
              payload: { report_number: "WA20260701B", inspection_state: "WA", inspection_level: 1, inspection_start: "2026-07-01T18:00:00Z", inspection_end: "2026-07-01T19:00:00Z", vehicle_vin: "1FUJA6CK21LK04002", attributed_carrier_id: "${c4_id}", selection_source: "WEIGH_STATION", driver_id: "${d4_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
              captures: { rB_id: $.data.id }
            - call: "POST /inspection-reports/${rB_id}/violations"
              payload: { violation_code_id: "${vc_vm2_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
              captures: { vB_vm_id: $.data.id }
            - call: "POST /inspection-reports/${rB_id}/violations"
              payload: { violation_code_id: "${vc_df4_id}", unit_type: "DRIVER", driver_id: "${d4_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
              captures: { vB_df_id: $.data.id }
            - call: "POST /inspection-reports/${rB_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
            - call: "POST /inspection-reports/${rA_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
          trigger:
            - call: "POST /inspection-reports/${rB_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_wa_1"
            - call: "GET /basic-scores"
              payload: { carrier_id: "${c4_id}" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "GET /carriers/${c4_id}/screening-risk"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { iss_after: $.data.iss_value, band_after: $.data.selection_band }
          assert:
            - "Carrier.${c4_id}.carrier_segment == SMALL"
            - "Carrier.${c4_id}.utilization_factor == 1.8"
            - "BasicScore(carrier_id=${c4_id}, basic_category=UNSAFE_DRIVING).denominator_value == 18.0"
            - "BasicScore(carrier_id=${c4_id}, basic_category=DRIVER_FITNESS).denominator_value == 18.0"
            - "BasicScore(carrier_id=${c4_id}, basic_category=VEHICLE_MAINTENANCE).denominator_value == 2.0"
            - "BasicScore(carrier_id=${c4_id}, basic_category=HOURS_OF_SERVICE).denominator_value == 4.0"
            - "BasicScore(carrier_id=${c4_id}, basic_category=UNSAFE_DRIVING).certified_measure == 0.833"
            - "BasicScore(carrier_id=${c4_id}, basic_category=HOURS_OF_SERVICE).certified_measure == 3.750"
            - "BasicScore(carrier_id=${c4_id}, basic_category=VEHICLE_MAINTENANCE).certified_measure == 3.000"
