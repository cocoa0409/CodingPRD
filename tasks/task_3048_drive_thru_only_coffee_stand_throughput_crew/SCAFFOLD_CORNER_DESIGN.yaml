              payload: { name: "Keg 5000", channel: "CORE", base_price_cents: 5000, base_build_seconds: 120, temperature_class: "HOT" }
              as: PlatformAdmin
              captures: { keg_id: $.data.id }
            - call: "POST /recipe-distributions"
              payload: { recipe_id: "${keg_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_k: $.data.id }
            - call: "POST /recipe-distributions/${dist_k}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - *k_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${keg_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /orders/${order_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/refunds"
              payload: { amount_cents: 5000 }
              as: ShiftLead
              as_user_id: "${lead_id}"
