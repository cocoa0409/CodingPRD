          - calculations.hospital_timeliness_posture.variants[incremental_lifetime]
        distinguishing_aspect: |
          The persisted lifetime denominator has no filter at all: a non-ventilated referral and a
          referral later RULED_OUT both stay in referral_count, giving 2/3 -> 66.67, and with only
          three referrals the posture is still GOOD_STANDING because the sample floor has not been
          reached - a low rate alone does not demote a hospital.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T08:00:00Z, hospital window 60 minutes."
            - "Three referrals for one hospital: ventilated TIMELY, non-ventilated UNTIMELY, ventilated TIMELY then ruled out."
          setup_api_calls:
