        grounds:
          - validations[priority=40]
          - validations[priority=41]
          - errors[ERR_QUEUE_ORDER_VIOLATION]
        distinguishing_aspect: |
          A rooming request that BOTH skips the front of line (P40
          business_constraint) AND targets a STANDARD room for an airborne entry
          (P41 business_safety) returns ERR_QUEUE_ORDER_VIOLATION (P40 wins, lower
          priority number). Error-category pair business_constraint vs business_safety.
        test_recipe:
          setup:
            - "Two READY_FOR_PROVIDER entries: front-of-line F (ESI 1, created first) and back entry B (ESI 1, created later) flagged airborne_precaution=true."
