          - calculations.inspection_compliance_score
          - endpoints.POST /licensing/inspections/{inspection_id}/finalize
        distinguishing_aspect: "Two violations cited at the same instant get deadlines 35 days apart because CORRECTION_DAYS is keyed on effective_severity, not on assessed points: the 8-point SERIOUS gets 2026-08-15T09:00:00Z and the 1-point MINOR gets 2026-09-19T09:00:00Z."
        test_recipe:
          setup:
            - "One ANNUAL inspection cited at clock 2026-08-05T09:00:00Z with a SERIOUS RA-201 and a MINOR NU-501 finding, both on PRESCHOOL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
