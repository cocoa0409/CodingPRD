              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /rating-submissions?market_plan_id=${mp_jp}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { only_round: "$.data[0].submission_round", only_status: "$.data[0].status" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { mp_v_fresh: "$.data.version" }
            - call: "POST /rating-submissions"
              payload: { market_plan_id: "${mp_jp}", disclosed_content_codes: ["BLOOD"], footage_asset_count: 1, target_rating: "TEEN_12", expected_market_plan_version: "${mp_v_fresh}" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { sub_2: "$.data.id", round_2: "$.data.submission_round" }
            - call: "GET /rating-submissions/${sub_1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { sub_1_status: "$.data.status" }
          assert:
            - "the first create returns HTTP 201 with submission_round == 1 and increments MarketPlan.version, so ${mp_v_stale} is now one behind"
            - "the second create with the same expected_market_plan_version returns HTTP 412 with error_id == ERR_STALE_MARKET_PLAN_VERSION"
            - "after the refusal the market still has exactly one submission - round 1, status DRAFT - so the destructive supersede did not run"
            - "re-reading the plan yields ${mp_v_fresh} == ${mp_v_stale} + 1 and the same create then returns HTTP 201 with submission_round == 2"
            - "the successful round-2 create system-withdraws round 1: RatingSubmission.${sub_1}.status == WITHDRAWN"
            - "priority 38 sits above the 40s, so this 412 is returned even though the payload, the roles and every state precondition were valid"

      - name: stale_talent_version_is_refused_before_the_prior_contract_is_terminated
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-create-stale-talent]
          - errors[ERR_STALE_TALENT_VERSION]
          - endpoints[POST /talent-contracts]
        distinguishing_aspect: "The second OCC rule guards a different parent (VoiceTalent) with a different code, and the parent's version is bumped by the child's own creation - not by any write to the talent row. Signing the first contract must NOT bump the talent, so the version captured after the first create is still fresh."
        test_recipe:
          setup:
            - "Title NOVA-87 and one JA talent; version captured immediately after the talent is created."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-87", name: "Nova Drift 87", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Miki Sato", language_code: "JA", union_flag: false, max_daily_recording_minutes: 240 }
              as: LocalizationProducer
              captures: { talent_id: "$.data.id", talent_v0: "$.data.version" }
          trigger:
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_id}", territory_scope: ["JP"], media_scope: "IN_GAME_AND_TRAILER", buyout_fee_cents: 400000, per_line_rate_cents: 200, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_v0}" }
              as: LocalizationProducer
              captures: { contract_1: "$.data.id", c1_status: "$.data.status" }
            - call: "POST /talent-contracts/${contract_1}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c1_signed: "$.data.status" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_id}", territory_scope: ["JP", "KR"], media_scope: "IN_GAME_AND_TRAILER", buyout_fee_cents: 500000, per_line_rate_cents: 250, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_v0}" }
              as: LocalizationProducer
              captures: { e_stale_talent: "$.data.error_id" }
            - call: "GET /voice-talents/${talent_id}"
              payload: {}
              as: LocalizationProducer
              captures: { talent_v1: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_id}", territory_scope: ["JP", "KR"], media_scope: "IN_GAME_AND_TRAILER", buyout_fee_cents: 500000, per_line_rate_cents: 250, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_v1}" }
              as: LocalizationProducer
              captures: { contract_2: "$.data.id" }
            - call: "GET /talent-contracts/${contract_1}"
              payload: {}
              as: LocalizationProducer
              captures: { c1_final: "$.data.status" }
          assert:
            - "the first create returns HTTP 201 in status DRAFT with committed_fee_cents == 0 and increments VoiceTalent.version"
            - "signing returns status == SIGNED and does NOT change VoiceTalent.version - only POST /talent-contracts bumps the parent"
            - "the replacement create carrying ${talent_v0} returns HTTP 412 with error_id == ERR_STALE_TALENT_VERSION - a different code from the market-plan rule"
            - "after the refusal TalentContract.${contract_1} is still SIGNED: the supersede-by-termination did not run"
            - "${talent_v1} == ${talent_v0} + 1, and the retried create returns HTTP 201; TalentContract.${contract_1}.status is then TERMINATED because the new contract supersedes it for the same (voice_talent_id, title_id)"

      - name: version_increments_once_per_successful_write_and_never_on_a_read_or_a_refusal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[submission-create-stale-market-plan]
          - state_machines.MarketPlan
          - state_machines[TranslationUnit.translation_status]
        distinguishing_aspect: "The version counter must move exactly once per accepted write and stay put on GETs and on rejected writes - including the child write that bumps its parent (deliver increments BOTH TranslationUnit.version and MarketPlan.version) and the child write that does not (PUT bumps only the unit)."
        test_recipe:
          setup:
            - "Title NOVA-88 with one MENU key and a JP plan; every version read is taken from a response, never assumed."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-88", name: "Nova Drift 88", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id", mp_v_create: "$.data.version" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_after_read: "$.data.version" }
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_scoped: "$.data.version" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_started: "$.data.version" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
              captures: { e_repeat: "$.data.error_id" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_after_refusal: "$.data.version" }
            - call: "GET /translation-units?market_plan_id=${mp_jp}"
              payload: {}
              as: TranslationVendor
              captures: { u_jp: "$.data[0].id", u_v_created: "$.data[0].version" }
            - call: "PUT /translation-units/${u_jp}"
              payload: { target_text: "ゲームを始める", target_char_count: 90, applied_tm_match_pct: 96 }
              as: TranslationVendor
              captures: { u_v_drafted: "$.data.version" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_after_put: "$.data.version" }
            - call: "POST /translation-units/${u_jp}/deliver"
              payload: {}
              as: TranslationVendor
              captures: { u_v_delivered: "$.data.version" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_after_deliver: "$.data.version" }
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
              captures: { mp_v_lqa: "$.data.version" }
          assert:
            - "MarketPlan.version is 1 at creation and unchanged by the GET (mp_v_after_read == mp_v_create)"
            - "scope makes it 2 and start-localization makes it 3 - one increment per accepted transition"
            - "the repeated start-localization returns HTTP 409 ERR_MARKET_PLAN_STATE_INVALID and leaves the version at 3: a refused write never consumes a version"
            - "the cascade-created TranslationUnit starts at version 1; the PUT makes it 2 and leaves MarketPlan.version at 3 - PUT touches no parent"
            - "deliver makes the unit version 3 AND MarketPlan.version 4, because delivered_unit_count is a parent-side derived field"
            - "enter-lqa makes MarketPlan.version 5, so the OCC field for a later POST /rating-submissions must be 5 and nothing else"

      - name: content_edit_apply_propagates_through_six_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: content_edit_apply_six_hop_cascade_to_title_and_qa_passes
          rationale: "That §1.8 instance verifies the whole chain end-to-end (unit revert, key retirement, plan revert, pass reopen, bug regression, title revert) plus the ordering sensitivity of hop 2b before hop 3."

      - name: voice_session_cancel_reverses_its_downstream_effects
        claim_type: cascading_side_effects
