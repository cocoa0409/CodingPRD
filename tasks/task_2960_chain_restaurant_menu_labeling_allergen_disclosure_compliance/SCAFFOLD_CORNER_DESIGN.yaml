              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Sandwich as served", role: "BASE", grams: 100, calories_per_100g: 100, sodium_mg_per_100g: 200, added_sugar_g_per_100g: 0, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Database values verified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "GET /menu-items/${item}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 20, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "ID-B" }
              as: PlatformAdmin
            - call: "GET /brands/${brand}/compliance-summary"
              payload: {}
              as: StateRegulator
              as_user_id: "${juris}"
          assert:
            - "trigger[0] response data.status == CERTIFIED with declared_calorie_min == 100, declared_calorie_max == 100 and declared_sodium_mg == 200 - the cascade result is in the writing call's own response"
            - "trigger[1] response data.labeling_status == DECLARED, declared_calorie_min == 100 and declared_calorie_max == 100 - the read immediately afterwards agrees with trigger[0]"
            - "trigger[2] response data.created_count == 20, data.brand_coverage_status == COVERED and data.brand_counted_unit_count == 20 - the coverage flip caused by the batch is reported by the batch itself"
            - "trigger[3] response data.coverage_status == COVERED, data.coverage_reason == COVERED_BY_UNIT_COUNT, data.counted_unit_count == 20, data.standard_item_count == 1 and data.compliance_posture == COMPLIANT"
            - "no assertion in this instance requires a re-read or a delay to observe a correct value"
