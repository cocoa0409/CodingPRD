  # Corners already covered by §1.8 difficulty instances — stubs only.
  # ---------------------------------------------------------------------------
  - section: state_machines_covered_by_difficulty
    instances:
      - name: corner_cancel_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Flight.SCHEDULED_to_CANCELLED]
        excluded_because:
