              as: Customer
              as_user_id: "${cub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "the same payload with as_user_id == ${cua_id} would pass the ownership gate (customer A ordering own commitment)"

      - name: complex_manager_cannot_batch_another_complex
        claim_type: ownership_scope
        grounds:
          - roles.ComplexManager
          - validations[priority=3]
        distinguishing_aspect: "ComplexManager identity is the complex itself: a feed-batch create whose path complex differs from X-User-ID fails 403 ERR_FORBIDDEN, while the matching pair succeeds."
