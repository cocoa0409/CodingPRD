        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PLAN_START_IN_PAST]"]
        distinguishing_aspect: "Isolated temporal violation (no overlap present): start_date before the current date is rejected with ERR_PLAN_START_IN_PAST."
        test_recipe:
          setup: ["ACTIVE rep; default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "PP Branch", region: "E" }
              as: FirmAdmin
              captures: { pp_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "930001", full_name: "PP Rep", branch_id: "${pp_br}", hire_date: "2021-01-01" }
