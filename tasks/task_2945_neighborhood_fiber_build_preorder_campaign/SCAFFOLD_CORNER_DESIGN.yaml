              captures: { o1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "12 Quarry Rd", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 900 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "14 Quarry Rd", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 950 }
              as: ProgramManager
              captures: { a2: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "NOT_SERVICEABLE", not_serviceable_reason: "EXCESSIVE_DISTANCE" }
              as: ProgramManager
            - call: "POST /service-addresses/${a2}/serviceability-determination"
              payload: { serviceability: "NOT_SERVICEABLE", not_serviceable_reason: "EXCESSIVE_DISTANCE" }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "REQUEST", exception_reason: "Beyond reach." }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "GRANT" }
              as: ProgramManager
            - call: "POST /service-addresses/${a2}/unserved-exception"
              payload: { action: "REQUEST", exception_reason: "Beyond reach." }
              as: ProgramManager
            - call: "POST /service-addresses/${a2}/unserved-exception"
              payload: { action: "GRANT" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Cass Doyle", email: "cass@example.com", phone: "+13035550103", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "POST /service-addresses/${a1}/fallback-offers"
              payload: { account_id: "${acct1}", expires_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { of1: $.data.id }
            - call: "POST /fallback-offers/${of1}/response"
              payload: { response: "DECLINE" }
              as: Subscriber
