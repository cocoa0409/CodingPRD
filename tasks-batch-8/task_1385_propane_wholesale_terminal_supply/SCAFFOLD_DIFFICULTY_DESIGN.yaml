              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord: $.data.id }
            - { call: "GET /trucks/${tk1}", as: Dispatcher, captures: { min0: $.data.weekly_committed_minutes } }
            - { call: "GET /terminals/${term}/inventory-summary", as: SupplyPlanner, captures: { res0: $.data.reserved_gal } }
          trigger:
            - { call: "POST /delivery-orders/${ord}/schedule", payload: { truck_id: "${tk1}", planned_load_start: "2026-08-03T08:00:00Z", planned_load_end: "2026-08-03T10:00:00Z" }, as: Dispatcher }
