              as: SedationRN
              as_user_id: "${rn_id}"
            - call: "POST /procedures/${proc_id}/recovery-observations"
              payload: { observed_at: "2026-08-01T14:25:00Z", aldrete_score: 9, on_room_air: true }
              as: SedationRN
              as_user_id: "${rn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:30:00Z" }
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/discharge"
              payload: {}
              as: SedationRN
              as_user_id: "${rn_id}"
            - call: "POST /procedures/${proc_id}/codes"
              payload: { hcpcs_code: "36905", code_family: "ANGIOPLASTY", base_allowed_cents: 180050, rank: 1, modifier: "NONE" }
              as: Coder
              as_user_id: "${coder_id}"
              captures: { code1_id: $.data.id }
            - call: "POST /procedures/${proc_id}/codes"
              payload: { hcpcs_code: "36907", code_family: "ANGIOPLASTY", base_allowed_cents: 45075, rank: 2, modifier: "NONE" }
              as: Coder
              as_user_id: "${coder_id}"
              captures: { code2_id: $.data.id }
            - call: "POST /procedures/${proc_id}/codes"
              payload: { hcpcs_code: "75791", code_family: "IMAGING", base_allowed_cents: 90050, rank: 3, modifier: "NONE" }
              as: Coder
              as_user_id: "${coder_id}"
              captures: { code3_id: $.data.id }
          trigger:
            - call: "GET /procedures/${proc_id}/reimbursement-preview"
              payload: {}
              as: Coder
              as_user_id: "${coder_id}"
          assert:
            - "response.data.applicable_variant == FEE_FOR_SERVICE"
            - "response.data.fee_for_service_total_cents == 225101"
            - "response.data.bundled_esrd_total_cents == 180050"
            - "response.data.variant_delta_cents == 45051"
            - "Procedure.${proc_id}.reimbursement_variant == FEE_FOR_SERVICE"
            - "Procedure.${proc_id}.allowed_amount_cents == 225101"
            - "ProcedureCode.${code2_id}.is_bundled == false"
            - "ProcedureCode.${code3_id}.is_bundled == false"
            - "the preview persists nothing: Procedure.${proc_id}.allowed_amount_cents is still 225101 and Procedure.${proc_id}.billed_amount_cents is still 0 after the call"

  - rule_id: combinatorial_formula
    instances:
      - name: sedation_capacity_nested_min_max_with_hour_gated_surge_term
        grounds:
          - calculations.sedation_staffing_capacity
          - validations.priority_19_ERR_ROOM_DAILY_CAP_REACHED
          - entities.ProcedureRoom.fields.daily_case_cap
          - entities.Referral.fields.urgency
        distinguishing_aspect: |
          effective_capacity = max(0, min(room_headroom, rn_headroom, bay_headroom)) where
          room_headroom itself carries a conditional surge term gated on THREE simultaneous
          predicates (referral urgency SAME_DAY, room_type ANGIO_SUITE, start hour < 15 UTC).
          A room with daily_case_cap 1 therefore accepts a SECOND case at 14:30 and rejects an
          otherwise-identical case at 15:30 - the same room, the same day, the same RN, the same
          SAME_DAY urgency, differing only in the hour of the start timestamp.
        test_recipe:
          setup:
            - "one ANGIO_SUITE room with daily_case_cap 1, turnover_buffer_min 0 and recovery_bay_count 3, so the room cap is the only binding headroom"
            - "one RN with max_concurrent_sedation_cases 2 so rn_headroom never binds"
            - "three SAME_DAY referrals (score 79) on one access, all triaged on 2026-08-01"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Riverbend Dialysis", facility_code: "RVB-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Bo Ferris", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Ines Rao", clinician_role: "INTERVENTIONALIST", npi: "1000000001", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { op_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "RN Pia Holm", clinician_role: "SEDATION_RN", npi: "1000000002", credential_expires_on: "2027-01-31", moderate_sedation_credentialed: true, max_concurrent_sedation_cases: 2 }
              as: CenterAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /procedure-rooms"
              payload: { room_code: "ANGIO-2", room_type: "ANGIO_SUITE", turnover_buffer_min: 0, daily_case_cap: 1, recovery_bay_count: 3 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-20T08:00:00Z", access_flow_ml_min: 1000, venous_pressure_mmhg: 120, recirculation_pct: 4.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 160, recirculation_pct: 12.0, kind: "URGENT" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "case one", missed_treatment_count: 1 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "case two", missed_treatment_count: 1 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "case three", missed_treatment_count: 1 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref3_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref1_v: $.data.version }
            - call: "POST /referrals/${ref2_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref2_v: $.data.version }
            - call: "POST /referrals/${ref3_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref3_v: $.data.version }
            - call: "POST /procedures"
              payload: { referral_id: "${ref1_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", sedation_rn_id: "${rn_id}", procedure_type: "ANGIOPLASTY", sedation_level: "MODERATE", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T14:00:00Z", expected_referral_version: "${ref1_v}" }
              as: AccessCoordinator
              captures: { proc1_id: $.data.id }
          trigger:
            - call: "POST /procedures"
              payload: { referral_id: "${ref2_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", sedation_rn_id: "${rn_id}", procedure_type: "ANGIOPLASTY", sedation_level: "MODERATE", scheduled_start: "2026-08-01T15:30:00Z", scheduled_end: "2026-08-01T16:30:00Z", expected_referral_version: "${ref2_v}" }
              as: AccessCoordinator
            - call: "POST /procedures"
              payload: { referral_id: "${ref3_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", sedation_rn_id: "${rn_id}", procedure_type: "ANGIOPLASTY", sedation_level: "MODERATE", scheduled_start: "2026-08-01T14:30:00Z", scheduled_end: "2026-08-01T15:30:00Z", expected_referral_version: "${ref3_v}" }
              as: AccessCoordinator
          assert:
            - "the 15:30 booking returns 409 ERR_ROOM_DAILY_CAP_REACHED: hour_utc 15 is not < SURGE_CUTOFF_HOUR_UTC 15, so surge is 0 and room_headroom = 1 + 0 - 1 = 0"
            - "the rejected call leaves Referral.${ref2_id}.status == TRIAGED and Referral.${ref2_id}.version unchanged at ${ref2_v}"
            - "the 14:30 booking returns 201: hour_utc 14 < 15 with a SAME_DAY referral in an ANGIO_SUITE, so surge is 1 and room_headroom = 1 + 1 - 1 = 1"
            - "Referral.${ref3_id}.status == SCHEDULED after the accepted call"
            - "GET /procedures?room_id=${room_id} returns total_count 2, proving the room ran two cases against a daily_case_cap of 1"
            - "ERR_ROOM_OCCUPIED is NOT returned for either candidate: with turnover_buffer_min 0 neither [15:30,16:30) nor [14:30,15:30) intersects the existing [13:00,14:00)"
            - "ERR_RECOVERY_BAY_UNAVAILABLE is NOT returned for the 14:30 candidate even though its closed bay window [15:30,17:00] touches the existing [14:00,15:30]: bay_headroom = floor(3/1) - 1 = 2"
            - "DialysisFacility.${fac_id}.partnership_score == 88 and contract_status == ACTIVE, so no posture cascade interferes"

      - name: allowed_amount_rounds_each_line_before_summation_with_modifier_and_bundling
        grounds:
          - calculations.procedure_allowed_amount
          - entities.ProcedureCode.fields.allowed_cents
          - entities.ProcedureCode.fields.reduction_factor_pct
          - entities.ProcedureCode.fields.is_bundled
          - entities.Procedure.fields.allowed_amount_cents
        distinguishing_aspect: |
          allowed_cents composes THREE multiplicative factors (base x mod_factor x
          position_factor) under a three-predicate bundling gate (i > 1 AND modifier != M59 AND
          family matches primary or is IMAGING), and round_half_up is pinned to each line BEFORE
          summation. Four BUNDLED_ESRD lines of 300000/45075/90050/45076 with modifiers
          NONE/NONE/M59/M52 yield per-line [300000, 0, 22513, 5635] = 328148 cents, while the
          rejected sum-then-round order yields 328147 - a one-cent fingerprint that no other
          instance reproduces.
        test_recipe:
          setup:
            - "one BUNDLED_ESRD patient, one IN_USE AVG access with one reading"
            - "one procedure taken to the ABORTED terminal clinical state (sedation_level NONE, so no RN and no recovery are involved) which is a legal coding entry point"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Northgate Dialysis", facility_code: "NGT-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0003", full_name: "Cyd Marlow", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "BUNDLED_ESRD" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Ines Rao", clinician_role: "INTERVENTIONALIST", npi: "1000000001", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { op_id: $.data.id }
            - call: "POST /clinicians"
