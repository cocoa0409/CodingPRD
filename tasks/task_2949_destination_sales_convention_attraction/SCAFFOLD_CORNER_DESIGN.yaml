          - errors[ERR_INVALID_OPPORTUNITY_STAGE]
        distinguishing_aspect: "ServicingOrder creation is guarded by another entity's state: a QUALIFIED opportunity - even one with a live hold and a full citywide block - cannot open a housing order, so the call fails 409 ERR_INVALID_OPPORTUNITY_STAGE."
        test_recipe:
          setup:
