        distinguishing_aspect: |
          Mode (a) - weighting / operation order: three eligible cleaners are scored by
          0.50*quality/100 + 0.30*zone_match_factor + 0.20*skill_headroom, and the cleaner with the
          HIGHEST quality_score (98, score 0.6600) loses to a 84-quality home-zone cleaner
