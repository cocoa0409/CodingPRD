# =============================================================================
# Example: marketplace-platform benchmark seed tables (v1)
# Gig Marketplace Fulfillment API
# =============================================================================

scenario: |
  Multi-tenant gig marketplace fulfillment system. Manages tenants with payout budgets,
  listings with categories and surge pricing, orders through fulfillment lifecycle,
  workers with skills/certifications and capacity limits, assignments with earnings
  reservations, payouts with debt recovery and proration, disputes with financial
  penalties, and ratings with moderation. Considerations: deterministic period clock,
  tenant-scoped sequence numbers (created_seq) for FIFO ordering, financial conservation
  laws (budget = consumed + reserved + available), worker debt tracking, hybrid risk
  scoring (chronic + acute), automated risk governance (risk hold at 70, deactivation
  at 90), tenant aggregate risk and auto-suspension, earnings adequacy and surplus
  release, multi-worker earnings distribution with share percentages, payout proration
  under budget scarcity, dispute eligibility windows, and idempotent payout creation.

domain_name: marketplace-platform
api_prefix: /tenants

# =============================================================================
# Table 1: Complexity Profile
# =============================================================================
complexity_profile:
  entity_count: 8
  state_machine_count: 7
  calculation_count: 12
  validation_layers: 6
  endpoint_count: 51
  error_code_count: 63
  role_count: 7

# =============================================================================
# Table 2: Entity Relationship Table
# =============================================================================
entities:
  - name: MarketplaceTenant
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique tenant identifier" }
      - { name: name, type: string, source: input, description: "Tenant name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: current_period_index, type: integer, source: system, description: "Deterministic clock, starts at 0" }
      - { name: payout_credit_limit_cents, type: integer, source: input, description: "Payout budget ceiling" }
      - { name: payout_consumed_cents, type: integer, source: computed, description: "Budget consumed by cleared payouts" }
      - { name: payout_reserved_cents, type: integer, source: computed, description: "Budget reserved for active assignments" }
      - { name: payout_available_cents, type: integer, source: computed, description: "Remaining budget capacity, never negative" }
      - { name: recovered_clawbacks_cents, type: integer, source: computed, description: "Cumulative recovered clawbacks from disputes" }
      - { name: is_payout_critical, type: boolean, source: computed, description: "True when available < 5% of limit" }
      - { name: is_payout_exhausted, type: boolean, source: computed, description: "True when available = 0" }
      - { name: aggregate_risk_score, type: number, source: computed, description: "Weighted average risk of non-deactivated workers" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped monotonic sequence" }

  - name: Listing
    parent: MarketplaceTenant
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique listing identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: title, type: string, source: input, description: "Listing title" }
      - { name: category, type: enum, source: input, description: "DELIVERY | HOME_SERVICE | RIDESHARE | TASK" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price" }
      - { name: surge_multiplier, type: number, source: input, description: "Minimum 1.0" }
      - { name: customer_sla_periods, type: integer, source: input, description: "SLA deadline in periods" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | PAUSED | ARCHIVED" }
      - { name: priority_tier, type: integer, source: computed, description: "Derived from category + created_seq; lower = higher priority" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

  - name: Order
    parent: MarketplaceTenant
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique order identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: listing_id, type: string, source: input, description: "Associated listing" }
      - { name: external_customer_id, type: string, source: input, description: "External customer reference" }
      - { name: status, type: enum, source: system, description: "CREATED | PENDING_MATCHING | ASSIGNED | IN_PROGRESS | COMPLETED | CANCELLED_BY_CUSTOMER | CANCELLED_BY_WORKER | DISPUTED | REFUNDED | CLOSED" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "base_price * surge_multiplier (floor)" }
      - { name: worker_earnings_cap_cents, type: integer, source: computed, description: "Portion available for worker payouts" }
      - { name: created_period_index, type: integer, source: system, description: "Tenant clock at creation" }
      - { name: expected_completion_period_index, type: integer, source: computed, description: "created_period_index + customer_sla_periods" }
      - { name: completion_period_index, type: integer, source: system, description: "Period when completed/cancelled" }
      - { name: is_late, type: boolean, source: computed, description: "True if completion_period > expected + 1" }
      - { name: is_sla_breached, type: boolean, source: computed, description: "Same as is_late" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Assignments in ACCEPTED or IN_PROGRESS" }
      - { name: dispute_count, type: integer, source: computed, description: "Number of disputes filed" }
      - { name: can_dispute, type: boolean, source: computed, description: "Eligible for new dispute" }
      - { name: order_completion_reference_period_index, type: integer, source: system, description: "Reference for dispute window" }
      - { name: rating_count, type: integer, source: computed, description: "Number of ratings" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

  - name: Worker
    parent: MarketplaceTenant
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique worker identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: name, type: string, source: input, description: "Worker name" }
      - { name: skills, type: array, source: input, description: "Array of skill strings" }
      - { name: certifications, type: array, source: input, description: "Array of {type, certified_period_index, expiry_period_index}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RISK_HOLD | SUSPENDED | DEACTIVATED" }
      - { name: max_active_assignments, type: integer, source: input, default: 10, description: "Capacity limit" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Current ACCEPTED + IN_PROGRESS assignments" }
      - { name: is_at_capacity, type: boolean, source: computed, description: "active_count >= max limit" }
      - { name: signup_bonus_debt_cents, type: integer, source: input, default: 0, description: "Initial debt from signup bonus (max 100000)" }
      - { name: debt_repaid_cents, type: integer, source: computed, description: "Cumulative debt repaid" }
      - { name: debt_remaining_cents, type: integer, source: computed, description: "Outstanding debt" }
      - { name: debt_satisfied, type: boolean, source: computed, description: "True when debt_remaining = 0" }
      - { name: risk_score, type: number, source: computed, description: "0-100, hybrid chronic + acute" }
      - { name: lifetime_orders_completed, type: integer, source: computed, description: "Total completed assignments" }
      - { name: late_order_count, type: integer, source: computed, description: "Late completed assignments" }
      - { name: cancellation_count, type: integer, source: computed, description: "Worker-cancelled assignments" }
      - { name: rating_count, type: integer, source: computed, description: "Number of published ratings" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

  - name: Assignment
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique assignment identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: order_id, type: string, source: system, description: "Parent order" }
      - { name: worker_id, type: string, source: input, description: "Assigned worker" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | IN_PROGRESS | COMPLETED | CANCELLED_BY_WORKER | CANCELLED_BY_SYSTEM" }
      - { name: reserved_earnings_initial_cents, type: integer, source: input, description: "Initial budget reservation" }
      - { name: reserved_earnings_current_cents, type: integer, source: computed, description: "Current reservation after releases" }
      - { name: released_earnings_cents, type: integer, source: computed, description: "Cumulative released back to budget" }
      - { name: payout_cleared_cents, type: integer, source: computed, description: "Cumulative cleared payouts" }
      - { name: expected_earnings_cents, type: integer, source: computed, description: "Share of order earnings cap" }
      - { name: remaining_entitlement_cents, type: integer, source: computed, description: "expected_earnings - payout_cleared" }
      - { name: earnings_adequacy_ratio, type: number, source: computed, description: "reserved_current / (expected * 1.1)" }
      - { name: requires_adjustment, type: boolean, source: computed, description: "True when adequacy_ratio <= 0.8" }
      - { name: is_surplus_release_eligible, type: boolean, source: computed, description: "True when adequacy_ratio > 1.5" }
      - { name: suggested_release_amount_cents, type: integer, source: computed, description: "Max releasable while maintaining 110%" }
      - { name: share_percentage, type: integer, source: input, required: false, description: "1-100, null for implicit equal split" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

  - name: Payout
    parent: Worker
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique payout identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: worker_id, type: string, source: system, description: "Associated worker" }
      - { name: assignment_id, type: string, source: input, description: "Associated assignment" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | SENT | CLEARED | CANCELLED | FAILED | HELD" }
      - { name: payout_type, type: enum, source: input, description: "NORMAL | INSTANT | ADJUSTMENT | FINAL" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested amount (min 100)" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "After entitlement, budget, proration" }
      - { name: budget_draw_amount_cents, type: integer, source: computed, description: "Draw against assignment reservation (= cash_portion)" }
      - { name: debt_repayment_portion_cents, type: integer, source: computed, description: "Amount applied to debt" }
      - { name: cash_portion_cents, type: integer, source: computed, description: "Amount distributed to worker" }
      - { name: instant_payout_fee_cents, type: integer, source: computed, description: "3% fee on cash_portion for INSTANT type" }
      - { name: net_payout_cents, type: integer, source: computed, description: "Final amount after all deductions" }
      - { name: is_prorated, type: boolean, source: computed, description: "True if proration was applied" }
      - { name: proration_factor, type: number, source: computed, description: "Applied proration factor (1.0 if none)" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

  - name: Dispute
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique dispute identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: assignment_id, type: string, source: input, required: false, description: "Optional linked assignment" }
      - { name: raised_by, type: enum, source: input, description: "CUSTOMER | WORKER" }
      - { name: reason, type: string, source: input, description: "Description of dispute" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RESOLVED_CUSTOMER | RESOLVED_WORKER | CANCELLED | EXPIRED" }
      - { name: dispute_sequence, type: integer, source: system, description: "1 or 2 (max 2 per order)" }
      - { name: original_order_status, type: enum, source: system, description: "Order status at time of filing" }
      - { name: refund_amount_cents, type: integer, source: input, description: "For RESOLVED_CUSTOMER outcome" }
      - { name: worker_penalty_cents, type: integer, source: input, required: false, description: "Clawback from worker" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

  - name: Rating
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique rating identifier" }
      - { name: tenant_id, type: string, source: system, description: "Parent tenant" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: worker_id, type: string, source: input, description: "Worker being rated" }
      - { name: rating_value, type: integer, source: input, description: "1-5 scale" }
      - { name: comment, type: string, source: input, required: false, description: "Optional comment" }
      - { name: status, type: enum, source: system, description: "PENDING_MODERATION | PUBLISHED | HIDDEN | REMOVED" }
      - { name: created_seq, type: integer, source: system, description: "Tenant-scoped sequence" }

# =============================================================================
# Table 3: State Machine Table
# =============================================================================
state_machines:
  - entity: MarketplaceTenant
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tenants/{tenantId}/suspend or system (aggregate_risk_score >= 90)"
        actor: "PlatformAdmin or system"
        preconditions: []
        side_effects:
          - "Blocks new orders, assignments, payout requests"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tenants/{tenantId}/reinstate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "system (terminal)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Listing
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST .../listings/{listingId}/publish"
        actor: TenantManager
        preconditions: []
        side_effects: []

      - from: PUBLISHED
        to: PAUSED
        trigger: "POST .../listings/{listingId}/pause"
        actor: TenantManager
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: PUBLISHED
        trigger: "POST .../listings/{listingId}/resume"
        actor: TenantManager
        preconditions: []
        side_effects: []

      - from: [DRAFT, PUBLISHED, PAUSED]
        to: ARCHIVED
        trigger: "POST .../listings/{listingId}/archive"
        actor: TenantManager
        preconditions: []
        side_effects: ["Listing becomes immutable"]

  - entity: Order
    field: status
    initial_state: CREATED
    terminal_states: [CLOSED]
    transitions:
      - from: CREATED
        to: PENDING_MATCHING
        trigger: "system (automatic on creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_MATCHING
        to: ASSIGNED
        trigger: "system (assignment accepted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "system (assignment started)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST .../orders/{orderId}/mark-completed"
        actor: WorkerApp
        preconditions: []
        side_effects:
          - "Records completion_period_index"
          - "Evaluates SLA breach"

      - from: [CREATED, PENDING_MATCHING, ASSIGNED, IN_PROGRESS]
        to: CANCELLED_BY_CUSTOMER
        trigger: "POST .../orders/{orderId}/cancel with cancelled_by=CUSTOMER"
        actor: "Dispatcher, TenantManager"
        preconditions: []
        side_effects:
          - "Active assignments → CANCELLED_BY_SYSTEM"
          - "Assignment reservations released"

      - from: [CREATED, PENDING_MATCHING, ASSIGNED, IN_PROGRESS]
        to: CANCELLED_BY_WORKER
        trigger: "POST .../orders/{orderId}/cancel with cancelled_by=SYSTEM"
        actor: "Dispatcher, TenantManager"
        preconditions: []
        side_effects: []

      - from: COMPLETED
        to: DISPUTED
        trigger: "system (dispute filed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: REFUNDED
        trigger: "system (dispute resolved in customer favor)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: COMPLETED
        trigger: "system (dispute resolved in worker favor, no other open disputes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [COMPLETED, CANCELLED_BY_CUSTOMER, CANCELLED_BY_WORKER, REFUNDED]
        to: CLOSED
        trigger: "POST .../orders/{orderId}/close"
        actor: "TenantManager, CustomerSupport"
        preconditions:
          - "All assignments finalized"
          - "All payouts finalized"
          - "No open disputes"
        side_effects: []

  - entity: Assignment
    field: status
    initial_state: OFFERED
    terminal_states: [COMPLETED, CANCELLED_BY_WORKER, CANCELLED_BY_SYSTEM]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST .../assignments/{assignmentId}/accept"
        actor: WorkerApp
        preconditions:
          - "Worker is ACTIVE"
          - "Worker not at capacity"
          - "Order has no other active assignment"
          - "Skills/certifications valid"
        side_effects:
          - "Order → ASSIGNED"
          - "Worker active_assignment_count increments"

      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST .../assignments/{assignmentId}/start"
        actor: WorkerApp
        preconditions: []
        side_effects:
          - "Order → IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST .../assignments/{assignmentId}/complete"
        actor: WorkerApp
        preconditions: []
        side_effects:
          - "Worker active_assignment_count decrements"
          - "Worker lifetime_orders_completed increments"
          - "Risk score recalculated"

      - from: [OFFERED, ACCEPTED, IN_PROGRESS]
        to: CANCELLED_BY_WORKER
        trigger: "POST .../assignments/{assignmentId}/cancel"
        actor: WorkerApp
        preconditions: []
        side_effects:
          - "Worker cancellation_count increments"
          - "Worker active_assignment_count decrements (if was ACCEPTED/IN_PROGRESS)"
          - "Reservation released to budget"
          - "Risk score recalculated"

      - from: [OFFERED, ACCEPTED, IN_PROGRESS]
        to: CANCELLED_BY_SYSTEM
        trigger: "system (parent order cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Reservation released to budget"

  - entity: Payout
    field: status
    initial_state: REQUESTED
    terminal_states: [CLEARED, FAILED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST .../payouts/{payoutId}/approve"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "approved_amount calculated (entitlement, budget, proration)"
          - "Debt recovery split computed"

      - from: REQUESTED
        to: HELD
        trigger: "system (worker enters RISK_HOLD)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HELD
        to: REQUESTED
        trigger: "system (risk hold cleared)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SENT
        trigger: "POST .../payouts/{payoutId}/send"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

      - from: SENT
        to: CLEARED
        trigger: "POST .../payouts/{payoutId}/confirm-cleared"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Provisional reservation released"
          - "Consumed budget updated"
          - "Worker debt updated"
          - "Assignment payout_cleared updated"

      - from: SENT
        to: FAILED
        trigger: "POST .../payouts/{payoutId}/fail"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Debt repayment reversed if applicable"

      - from: [REQUESTED, APPROVED, HELD]
        to: CANCELLED
        trigger: "POST .../payouts/{payoutId}/cancel or system (worker deactivated)"
        actor: "FinanceOfficer or system"
        preconditions: []
        side_effects:
          - "Debt repayment reversed if applicable"

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_CUSTOMER, RESOLVED_WORKER, CANCELLED, EXPIRED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST .../disputes/{disputeId}/start-review"
        actor: CustomerSupport
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED_CUSTOMER
        trigger: "POST .../disputes/{disputeId}/resolve-customer"
        actor: CustomerSupport
        preconditions: []
        side_effects:
          - "Order → REFUNDED"
          - "Worker acute risk penalty +25 (if linked to assignment)"
          - "Tenant budget credited (refund - penalty if positive)"
          - "Worker penalty added to debt"
          - "Risk governance checks triggered"

      - from: UNDER_REVIEW
        to: RESOLVED_WORKER
        trigger: "POST .../disputes/{disputeId}/resolve-worker"
        actor: CustomerSupport
        preconditions: []
        side_effects:
          - "If no other open disputes, order returns to prior state"

      - from: [FILED, UNDER_REVIEW]
        to: CANCELLED
        trigger: "POST .../disputes/{disputeId}/withdraw"
        actor: CustomerSupport
        preconditions: []
        side_effects:
          - "If no other open disputes, order returns to prior state"

  - entity: Rating
    field: status
    initial_state: PENDING_MODERATION
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING_MODERATION
        to: PUBLISHED
        trigger: "POST .../ratings/{ratingId}/moderate with action=PUBLISH"
        actor: TenantManager
        preconditions: []
        side_effects:
          - "First publish records rating to worker's performance ledger"
          - "Worker rating_count increments (on first publish only)"

      - from: PENDING_MODERATION
        to: HIDDEN
        trigger: "POST .../ratings/{ratingId}/moderate with action=HIDE"
        actor: TenantManager
        preconditions: []
        side_effects: []

      - from: PENDING_MODERATION
        to: REMOVED
        trigger: "POST .../ratings/{ratingId}/moderate with action=REMOVE"
        actor: TenantManager
        preconditions: []
        side_effects: []

      - from: PUBLISHED
        to: HIDDEN
        trigger: "POST .../ratings/{ratingId}/moderate with action=HIDE"
        actor: TenantManager
        preconditions: []
        side_effects:
          - "Does not alter worker's performance ledger"

      - from: PUBLISHED
        to: REMOVED
        trigger: "POST .../ratings/{ratingId}/moderate with action=REMOVE"
        actor: TenantManager
        preconditions: []
        side_effects:
          - "Does not alter worker's performance ledger"

      - from: HIDDEN
        to: PUBLISHED
        trigger: "POST .../ratings/{ratingId}/moderate with action=PUBLISH"
        actor: TenantManager
        preconditions: []
        side_effects:
          - "Does not alter worker's performance ledger (already recorded on first publish)"

      - from: HIDDEN
        to: REMOVED
        trigger: "POST .../ratings/{ratingId}/moderate with action=REMOVE"
        actor: TenantManager
        preconditions: []
        side_effects: []

# =============================================================================
# Table 4: Calculation Rules Table
# =============================================================================
calculations:
  - name: quoted_price_cents
    trigger: "order creation"
    algorithm: multiplication
    formula: |
      quoted_price_cents = floor(listing.base_price_cents * listing.surge_multiplier)
    precision: "IEEE-754 double, floor truncation to integer cents"

  - name: priority_tier
    trigger: "listing creation"
    algorithm: derived
    formula: |
      Category hierarchy (lower number = higher priority):
        HOME_SERVICE = 1, RIDESHARE = 2, DELIVERY = 3, TASK = 4
      Within same category, earlier created_seq = higher priority.
      Implementation: numeric tier reflects category rank, then created_seq for tie-breaking.

  - name: budget_conservation
    trigger: "assignment create, release, payout clear, cancel, dispute resolve"
    algorithm: conservation_law
    formula: |
      payout_consumed_cents + payout_reserved_cents + payout_available_cents
        = payout_credit_limit_cents + recovered_clawbacks_cents
      payout_available_cents >= 0 always

  - name: is_payout_critical
    trigger: "budget change"
    algorithm: threshold
    formula: |
      is_payout_critical = (payout_available_cents < 0.05 * payout_credit_limit_cents)
    constants:
      CRITICAL_THRESHOLD: 0.05  # 5%

  - name: proration
    trigger: "payout approval when budget critical and consumed >= 90% of limit"
    algorithm: proportional
    formula: |
      Trigger: is_payout_critical AND payout_consumed_cents >= 0.90 * payout_credit_limit_cents
      proration_factor = payout_available_cents / sum(unprorated amounts of pending payouts)
      Unprorated amount per payout = min(requested, remaining_entitlement, budget_available)
      If factor < 1.0: approved_amount = floor(unprorated * factor), is_prorated=true
      If factor >= 1.0: no reduction, proration_factor=1.0
    constants:
      HIGH_CONSUMPTION_THRESHOLD: 0.90  # 90%
    precision: "floor truncation"

  - name: expected_earnings_cents
    trigger: "assignment creation"
    algorithm: share_distribution
    formula: |
      If explicit shares: expected_earnings = floor(order.worker_earnings_cap * share_percentage / 100)
      If implicit split: equal split; remainder to earliest created_seq assignments.
      Total shares across all assignments <= 100%.

  - name: earnings_adequacy_ratio
    trigger: "reservation change, payout clear"
    algorithm: ratio
    formula: |
      required_reservation = expected_earnings_cents * 1.1
      earnings_adequacy_ratio = reserved_earnings_current_cents / required_reservation
      requires_adjustment = (ratio <= 0.8)
      is_surplus_release_eligible = (ratio > 1.5)
      For zero-expected-earnings: always healthy (both flags false).
    constants:
      MINIMUM_FACTOR: 1.1  # 110%
      LOW_THRESHOLD: 0.8
      HIGH_THRESHOLD: 1.5

  - name: risk_score
    trigger: "assignment complete, cancel, dispute resolve"
    algorithm: hybrid
    formula: |
      Chronic risk (weighted average):
        late_rate = late_order_count / lifetime_orders_completed (0 if no completions)
        cancel_rate = cancellation_count / (lifetime_orders_completed + cancellation_count) (0 if zero)
        avg_rating_deficit = (5 - avg_published_rating) / 4 (0 if no ratings)
        raw_chronic = late_rate * 0.40 + cancel_rate * 0.30 + avg_rating_deficit * 0.30
        raw_chronic_score = raw_chronic * 100

      Stabilization (< 5 data points):
        data_points = lifetime_orders_completed + cancellation_count
        if data_points < 5:
          stabilized = raw_chronic_score * (data_points / 5) + 0 * ((5 - data_points) / 5)
        else:
          stabilized = raw_chronic_score

      Acute penalties:
        acute = dispute_losses * 25

      risk_score = min(stabilized + acute, 100)
    constants:
      LATE_WEIGHT: 0.40
      CANCEL_WEIGHT: 0.30
      RATING_WEIGHT: 0.30
      STABILIZATION_THRESHOLD: 5
      ACUTE_PENALTY: 25
      MAX_SCORE: 100

  - name: aggregate_risk_score
    trigger: "any worker risk_score change"
    algorithm: weighted_average
    formula: |
      For all non-deactivated workers:
        weight = max(1, worker.lifetime_orders_completed)
        aggregate = sum(worker.risk_score * weight) / sum(weight)
      If aggregate >= 90: tenant → SUSPENDED
    constants:
      AUTO_SUSPEND_THRESHOLD: 90

  - name: debt_recovery
    trigger: "payout approval"
    algorithm: split
    formula: |
      If worker.debt_remaining_cents > 0:
        debt_repayment_portion = min(approved_amount, debt_remaining)
        cash_portion = approved_amount - debt_repayment
      Else:
        debt_repayment_portion = 0
        cash_portion = approved_amount
      FIFO by created_seq for debt repayment order.

  - name: instant_payout_fee
    trigger: "payout creation with type=INSTANT"
    algorithm: percentage
    formula: |
      instant_payout_fee_cents = floor(cash_portion_cents * 0.03)
      net_payout_cents = cash_portion_cents - instant_payout_fee_cents
    constants:
      FEE_RATE: 0.03  # 3%
    precision: "floor truncation"

  - name: sla_breach
    trigger: "order completion"
    algorithm: comparison
    formula: |
      is_late = (completion_period_index > expected_completion_period_index + 1)
      is_sla_breached = is_late
    constants:
      GRACE_PERIODS: 1

# =============================================================================
# Table 5: Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for this operation"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 403
    applies_to: all endpoints
    note: "403 for authorization failures"

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (tenant first, then child); cross-tenant → 404"
    error_id: "ERR_TENANT_NOT_FOUND / ERR_LISTING_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_WORKER_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Tenant/resource must be in correct state for operation"
    error_id: "ERR_TENANT_SUSPENDED / ERR_TENANT_NOT_ACTIVE / varies"
    http_status: "403 or 409"
    applies_to: state-dependent operations

  - priority: 5
    category: business
    check: "Business rule conflicts (capacity, skills, certifications, duplicate assignments, shares)"
    error_id: varies
    http_status: 409
    applies_to: assignment, payout, order operations

  - priority: 6
    category: financial
    check: "Financial constraints (budget, entitlement, reservation)"
    error_id: "ERR_INSUFFICIENT_PAYOUT_BUDGET / ERR_EXCEEDS_ASSIGNMENT_ENTITLEMENT / ERR_INSUFFICIENT_ASSIGNMENT_RESERVATION"
    http_status: 402
    applies_to: assignment creation, payout operations

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 6: API Endpoint Table (36 endpoints)
# =============================================================================
endpoints:
  # --- Tenants ---
  - method: POST
    path: "/tenants"
    description: "Create tenant"
    roles: [PlatformAdmin]
    code: 201
    input: [name, payout_credit_limit_cents]
    output: MarketplaceTenant
    side_effects: ["status=ACTIVE, current_period_index=0"]

  - method: GET
    path: "/tenants"
    description: "List tenants"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "MarketplaceTenant[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tenantId}"
    description: "Get tenant"
    roles: [Any]
    code: 200
    input: []
    output: MarketplaceTenant
    side_effects: []

  - method: PUT
    path: "/tenants/{tenantId}"
    description: "Update tenant (credit limit)"
    roles: [PlatformAdmin]
    code: 200
    input: [payout_credit_limit_cents]
    output: MarketplaceTenant
    side_effects: ["Cannot reduce below consumed + reserved (ERR_CANNOT_REDUCE_BELOW_CONSUMED)"]

  - method: POST
    path: "/tenants/{tenantId}/clock/advance"
    description: "Advance period clock"
    roles: [TenantManager, PlatformAdmin]
    code: 200
    input: [by_periods]
    output: MarketplaceTenant
    side_effects: ["current_period_index += by_periods (min 1, max 365)"]

  - method: POST
    path: "/tenants/{tenantId}/suspend"
    description: "Suspend tenant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MarketplaceTenant
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/tenants/{tenantId}/reinstate"
    description: "Reinstate tenant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MarketplaceTenant
    side_effects: ["status → ACTIVE"]

  # --- Listings ---
  - method: POST
    path: "/tenants/{tenantId}/listings"
    description: "Create listing"
    roles: [TenantManager]
    code: 201
    input: [title, category, base_price_cents, surge_multiplier, customer_sla_periods]
    output: Listing
    side_effects: ["status=DRAFT, priority_tier computed"]

  - method: GET
    path: "/tenants/{tenantId}/listings"
    description: "List listings"
    roles: [Any]
    code: 200
    input: []
    output: "Listing[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tenantId}/listings/{listingId}"
    description: "Get listing"
    roles: [Any]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: PUT
    path: "/tenants/{tenantId}/listings/{listingId}"
    description: "Update listing"
    roles: [TenantManager]
    code: 200
    input: ["title?, base_price_cents?, surge_multiplier?, customer_sla_periods?"]
    output: Listing
    side_effects: ["Archived listings reject update (ERR_LISTING_NOT_EDITABLE)"]

  - method: POST
    path: "/tenants/{tenantId}/listings/{listingId}/publish"
    description: "Publish listing"
    roles: [TenantManager]
    code: 200
    input: []
    output: Listing
    side_effects: ["status → PUBLISHED"]

  - method: POST
    path: "/tenants/{tenantId}/listings/{listingId}/pause"
    description: "Pause listing"
    roles: [TenantManager]
    code: 200
    input: []
    output: Listing
    side_effects: ["status → PAUSED"]

  - method: POST
    path: "/tenants/{tenantId}/listings/{listingId}/resume"
    description: "Resume listing"
    roles: [TenantManager]
    code: 200
    input: []
    output: Listing
    side_effects: ["status → PUBLISHED"]

  - method: POST
    path: "/tenants/{tenantId}/listings/{listingId}/archive"
    description: "Archive listing"
    roles: [TenantManager]
    code: 200
    input: []
    output: Listing
    side_effects: ["status → ARCHIVED"]

  # --- Orders ---
  - method: POST
    path: "/tenants/{tenantId}/orders"
    description: "Create order"
    roles: [Dispatcher, TenantManager]
    code: 201
    input: [listing_id, external_customer_id]
    output: Order
    side_effects: ["status=CREATED → PENDING_MATCHING, quoted_price computed"]

  - method: GET
    path: "/tenants/{tenantId}/orders"
    description: "List orders"
    roles: [Any]
    code: 200
    input: []
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tenantId}/orders/{orderId}"
    description: "Get order"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/cancel"
    description: "Cancel order"
    roles: [Dispatcher, TenantManager]
    code: 200
    input: [cancelled_by, "reason?"]
    output: Order
    side_effects: ["status → CANCELLED_BY_CUSTOMER or CANCELLED_BY_WORKER, active assignments cancelled"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/mark-completed"
    description: "Mark order completed"
    roles: [WorkerApp]
    code: 200
    input: []
    output: Order
    side_effects: ["status → COMPLETED, SLA evaluated"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/close"
    description: "Close order"
    roles: [TenantManager, CustomerSupport]
    code: 200
    input: []
    output: Order
    side_effects: ["status → CLOSED"]

  # --- Workers ---
  - method: POST
    path: "/tenants/{tenantId}/workers"
    description: "Create worker"
    roles: [TenantManager]
    code: 201
    input: [name, skills, certifications, "signup_bonus_debt_cents?", "max_active_assignments?"]
    output: Worker
    side_effects: ["status=ACTIVE, risk_score=0"]

  - method: GET
    path: "/tenants/{tenantId}/workers"
    description: "List workers"
    roles: [Any]
    code: 200
    input: []
    output: "Worker[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tenantId}/workers/{workerId}"
    description: "Get worker"
    roles: [Any]
    code: 200
    input: []
    output: Worker
    side_effects: []

  - method: PUT
    path: "/tenants/{tenantId}/workers/{workerId}"
    description: "Update worker (skills, capacity)"
    roles: [TenantManager]
    code: 200
    input: ["skills?, max_active_assignments?, certifications?"]
    output: Worker
    side_effects: ["Capacity cannot reduce below active count"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/suspend"
    description: "Suspend worker"
    roles: [TenantManager]
    code: 200
    input: []
    output: Worker
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/risk-hold/clear"
    description: "Clear risk hold"
    roles: [TenantManager]
    code: 200
    input: []
    output: Worker
    side_effects: ["status → ACTIVE, held payouts released"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/reinstate"
    description: "Reinstate worker"
    roles: [TenantManager]
    code: 200
    input: []
    output: Worker
    side_effects: ["status → ACTIVE"]

  # --- Assignments ---
  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/assignments"
    description: "Create assignment (offer)"
    roles: [Dispatcher, TenantManager]
    code: 201
    input: [worker_id, reserved_earnings_initial_cents, "share_percentage?"]
    output: Assignment
    side_effects: ["status=OFFERED, budget reservation placed"]

  - method: GET
    path: "/tenants/{tenantId}/orders/{orderId}/assignments"
    description: "List assignments for order"
    roles: [Any]
    code: 200
    input: []
    output: "Assignment[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/assignments/{assignmentId}/accept"
    description: "Accept assignment"
    roles: [WorkerApp]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → ACCEPTED, order → ASSIGNED"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/assignments/{assignmentId}/start"
    description: "Start assignment"
    roles: [WorkerApp]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → IN_PROGRESS, order → IN_PROGRESS"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/assignments/{assignmentId}/complete"
    description: "Complete assignment"
    roles: [WorkerApp]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → COMPLETED"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/assignments/{assignmentId}/cancel"
    description: "Cancel assignment (worker)"
    roles: [WorkerApp]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → CANCELLED_BY_WORKER, reservation released"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/assignments/{assignmentId}/release-surplus"
    description: "Release surplus reservation"
    roles: [TenantManager]
    code: 200
    input: [release_amount_cents]
    output: Assignment
    side_effects: ["Surplus returned to budget"]

  # --- Payouts ---
  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/payouts"
    description: "Request payout"
    roles: [FinanceOfficer]
    code: 201
    input: [assignment_id, requested_amount_cents, payout_type]
    output: Payout
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/tenants/{tenantId}/workers/{workerId}/payouts"
    description: "List payouts"
    roles: [FinanceOfficer, TenantManager]
    code: 200
    input: []
    output: "Payout[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/payouts/{payoutId}/approve"
    description: "Approve payout"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status → APPROVED, amount calculated with proration/debt"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/payouts/{payoutId}/send"
    description: "Send payout"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status → SENT"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/payouts/{payoutId}/confirm-cleared"
    description: "Confirm payout cleared"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status → CLEARED, budget consumed, debt updated"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/payouts/{payoutId}/fail"
    description: "Mark payout failed"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status → FAILED, debt repayment reversed"]

  - method: POST
    path: "/tenants/{tenantId}/workers/{workerId}/payouts/{payoutId}/cancel"
    description: "Cancel payout"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status → CANCELLED, debt repayment reversed"]

  # --- Disputes ---
  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/disputes"
    description: "File dispute"
    roles: [CustomerSupport, TenantManager]
    code: 201
    input: [raised_by, reason, "assignment_id?"]
    output: Dispute
    side_effects: ["status=FILED, order → DISPUTED"]

  - method: GET
    path: "/tenants/{tenantId}/orders/{orderId}/disputes"
