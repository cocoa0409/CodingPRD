            - "CustomsRecordation.${rec_id}.status == EXPIRED and recordation_number == CBP-0001"
            - "DiversionInvestigation.${inv_id}.status == OPEN immediately after the sweep, and its version is unchanged by the sweep"
            - "DiversionInvestigation.${inv_id}.detention_notice_at == 2026-08-05T08:00:00Z and response_due_at == 2026-08-14T08:00:00Z"
            - "the submit-evidence call returns HTTP 200 with status EVIDENCE_SUBMITTED and suspected_distributor_ref DIST-9"

      - name: diversion_confirmed_cannot_skip_evidence_submitted_while_release_can
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DiversionInvestigation.OPEN_to_RELEASED
          - state_machines.DiversionInvestigation.EVIDENCE_SUBMITTED_to_DIVERSION_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The two conclude outcomes have different reachability from OPEN: DIVERSION_CONFIRMED may not skip EVIDENCE_SUBMITTED (409, and no strike is attributed) while RELEASED may be reached straight from OPEN — after which the row is terminal."
        test_recipe:
          setup:
            - "An OPEN BORDER_SEIZURE investigation naming a suspected seller, so the only thing missing for a confirmation is the EVIDENCE_SUBMITTED state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/brands"
