  # ==========================================================================
  # RULE 3 - non_linear_state_machine
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: membership_two_axes_diverge_through_rejection_and_refiling
        grounds:
          - state_machines.Membership.PENDING_REMITTANCE_to_UNSANCTIONED
          - state_machines.Membership.INVOICED_to_REFUNDED
          - state_machines.Membership.REFUNDED_to_INVOICED
          - state_machines.FeeRemittance.REJECTED_to_SUBMITTED
          - entities.Membership.fields.sanction_status
          - entities.Membership.fields.remittance_status
        distinguishing_aspect: |
          Membership carries two independent state axes on one row: a national REJECT returns
          axis 1 to UNSANCTIONED while axis 2 advances to REFUNDED, producing the pair
          (UNSANCTIONED, REFUNDED) that no creation path can reach - creation always yields
          (UNSANCTIONED, UNPAID) - and the re-filing loop then drives the same row back through
          (PENDING_REMITTANCE, INVOICED) to (SANCTIONED, REMITTED).
        test_recipe:
          setup:
            - "One league on CONFIG-B with two teams and four adult memberships, all at (sanction_status UNSANCTIONED, remittance_status UNPAID) when created."
            - "One remittance lists all four memberships with declared_amount_cents 12400 and is SUBMITTED, which moves every row to (PENDING_REMITTANCE, INVOICED)."
            - "Logical clock at 2026-08-05T00:00:00Z, the same instant bylaws were adopted, so no late penalty applies to either submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
              payload: { full_name: "Ann Secretary", email: "sec@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { sec_id: "$.data.id" }
