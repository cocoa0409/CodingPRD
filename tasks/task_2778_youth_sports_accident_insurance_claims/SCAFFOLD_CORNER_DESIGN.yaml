              payload: { enrollment_id: "${enr1_id}", sanctioned_activity_id: "${act_id}", injury_datetime: "2026-07-11T19:00:00Z", body_part: "HIP_GROIN", injury_description: "groin strain stealing third", severity_tier: "MODERATE" }
              as: LeagueAdministrator
