              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 20000, donor_name: "Foster Lane Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-071" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
