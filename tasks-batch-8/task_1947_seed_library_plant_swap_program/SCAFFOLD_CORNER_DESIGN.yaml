  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_variety_update_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[variety-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential PATCHes: the first with the observed version succeeds and bumps version 1->2; the second replaying stale version 1 is rejected 412 ERR_STALE_VERSION. OCC on SeedVariety.version is the only mechanism involved."
        test_recipe:
          setup: ["variety V at version 1"]
          setup_api_calls:
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
          trigger:
            - call: "PATCH /api/seed-varieties/${v_id}"
              payload: { expected_seed_variety_version: "${v_ver}", rarity_flag: true }
              as: ProgramAdmin
              captures: { v_ver2: "$.data.version" }
            - call: "PATCH /api/seed-varieties/${v_id}"
              payload: { expected_seed_variety_version: "${v_ver}", invasive_flag: true }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "v_ver2 == 2                     # first patch advanced the watermark"
            - "err == ERR_STALE_VERSION        # replay of version 1 rejected (412)"

      - name: occ_swap_event_reschedule_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[swap-event-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on a different parent: reschedule PATCH on SwapEvent with a stale expected_swap_event_version (after publish bumped the version) is rejected 412; a PATCH carrying the post-publish version succeeds."
        test_recipe:
          setup: ["event E created (version 1), then published (version 2)"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2027-02-06T10:00:00Z", end_at: "2027-02-06T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id", e_ver1: "$.data.version" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { e_ver2: "$.data.version" }
          trigger:
            - call: "PATCH /api/swap-events/${e_id}"
              payload: { expected_swap_event_version: "${e_ver1}", title: "stale edit" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "PATCH /api/swap-events/${e_id}"
              payload: { expected_swap_event_version: "${e_ver2}", title: "fresh edit" }
              as: ProgramAdmin
              captures: { ok_title: "$.data.title", e_ver3: "$.data.version" }
          assert:
            - "e_ver2 == 2                      # publish bumped the version"
            - "err == ERR_STALE_VERSION        # pre-publish view is stale"
            - "ok_title == 'fresh edit' and e_ver3 == 3"

      - name: layer_derived_field_member_active_count_reconciled
        claim_type: derived_field_reconciliation
        grounds: ["entities.Member.fields.active_checkout_count"]
        distinguishing_aspect: "active_checkout_count increments on create (0->1), stays 1 after return (RETURNED still non-terminal), drops to 0 on verify-return — the derived counter tracks the lifecycle exactly."
