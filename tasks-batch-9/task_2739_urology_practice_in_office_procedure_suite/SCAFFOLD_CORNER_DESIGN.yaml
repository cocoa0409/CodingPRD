      - name: rbac_segregation_of_duties_rejected
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority 16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines[ReprocessingLog.log_status]
        distinguishing_aspect: "Closing a reprocessing log needs two distinct technicians and the attester must be the caller. Self-attestation by the performer is refused, and so is naming a third technician as attester while a different technician holds the header — both at priority 16, before the stage and outcome are even considered. The same call succeeds when the second technician both holds the header and is named."
        test_recipe:
          setup:
            - "three techs: Omar (performs), Rue (attests), Tal (named but never acting), all hld_certified true"
            - "scope SN-C AVAILABLE; one OPEN PRECLEAN log performed by Omar"
