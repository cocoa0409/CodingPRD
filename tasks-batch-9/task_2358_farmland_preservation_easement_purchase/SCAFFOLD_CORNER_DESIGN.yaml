          setup:
            - "Program P1 and the three canonical sources exist; round R1 is OPEN; landowner LO-A owns parcels PA1 (160.00 acres) and PT (40.00 acres)."
            - "Applications AP1 (total program cost 160,364,925) and APT (total program cost 25,500,000) are both ranked, certified, offered and FUNDED. Neither has been accepted."
