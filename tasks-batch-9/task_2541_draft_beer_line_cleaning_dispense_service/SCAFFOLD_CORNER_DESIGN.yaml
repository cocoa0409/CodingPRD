        claim_type: Initial State
        grounds:
          - state_machines.ServiceVisit.work_status.ABSENT_to_SCHEDULED
          - state_machines.ServiceVisit.verification_status
          - entities.ServiceVisit.fields.work_status
          - entities.ServiceVisit.fields.verification_status
          - entities.ServiceVisit.fields.settlement_state
          - entities.ServiceVisit.fields.abandon_reason
