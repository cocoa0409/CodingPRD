          setup:
            - "CERTIFIED FY2027 cycle: certified_recurring 1588916273, certified_total 1600916273, so required_reserve_cents 79445814 and cap_cents 160091627 for a 1000 bps fund."
            - "Two GROWTH_ABOVE_TREND funds created with opening_balance_cents 0 BEFORE certification, so each received the same 21958137 certification deposit."
            - "Manual-deposit headroom for each fund is 138133490, comfortably above both trigger amounts, so priority 55 does not fire."
