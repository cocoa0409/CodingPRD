            - "before trigger[0]: ${v1_v_fresh} == ${v1_v_stale} + 1 (the driver attribution bumped the violation)"
            - "before trigger[0]: Violation.${v1_id}.driver_id == ${d1_id} and time_weighted_severity == 15.0"
            - "trigger[0] -> 412 ERR_STALE_VIOLATION_VERSION"
            - "after trigger[0]: GET /citation-adjudications?violation_id=${v1_id} returns total_count 0"
            - "after trigger[0]: Violation.${v1_id}.version == ${v1_v_fresh}"
