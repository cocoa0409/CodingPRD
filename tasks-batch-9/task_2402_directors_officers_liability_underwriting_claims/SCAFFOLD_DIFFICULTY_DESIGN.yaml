      - name: retention_credit_step_at_exact_block_multiple
        grounds:
          - calculations.net_premium_quotation
          - entities.Quote.fields.net_premium_usd
          - entities.Quote.fields.gross_premium_usd
          - entities.Submission.fields.requested_retention_usd
        distinguishing_aspect: |
          The retention credit is a STEP function of floor(retention / 250,000) x 0.05, so the
          premium is flat across a whole block and drops only at the exact multiple. Probing at
          249,999.99 / 250,000.00 and at 499,999.99 / 500,000.00 catches both an off-by-one-cent
          boundary and a linear (non-stepped) reading of the same credit: a linear credit would price
