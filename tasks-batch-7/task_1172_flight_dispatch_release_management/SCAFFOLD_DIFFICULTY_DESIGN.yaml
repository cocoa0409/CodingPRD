          trigger:
            - { call: "POST /dispatch/weather-packages/${wxb}/replace", payload: { valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 100, visibility_m: 400, expected_station_version: "${stb_v}" }, as: DispatchSupervisor, captures: { wxb2: $.data.id, wxb2_status: $.data.status } }
            - { call: "GET /dispatch/weather-packages/${wxb}", as: DispatchSupervisor, captures: { wxb_old_status: $.data.status } }
            - { call: "GET /dispatch/plans/${plan1}", as: Dispatcher, as_user_id: "${d1}", captures: { plan1_status: $.data.status } }
            - { call: "GET /dispatch/releases/${rel1}", as: Dispatcher, as_user_id: "${d1}", captures: { rel1_status: $.data.status, rel1_cycle: $.data.cycle_seq } }
          assert:
            - "wxb2_status == ACTIVE and wxb_old_status == SUPERSEDED (hop 1: package pair mutated)"
            - "plan1_status == COMPUTED (hop 2: LOCKED plan auto-dropped because ceiling 100 < minima 200)"
            - "rel1_status == UNDER_AMENDMENT and rel1_cycle == 2 (hop 3: release auto-amended, signatures stale)"
            - "GET /dispatch/legs/${leg1}/control-records contains RELEASE_AUTO_AMENDED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sign_conflict_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_RELEASE_NOT_PENDING]
          - errors[ERR_MEL_ITEM_EXPIRED]
        distinguishing_aspect: |
          Category pair state (p5) vs business_safety (p6): signing a DRAFT
          release while an EXPIRED MEL item sits on the aircraft violates both
          the sign from-state rule and the MEL safety rule; the state-category
          error ERR_RELEASE_NOT_PENDING must win over ERR_MEL_ITEM_EXPIRED.
        test_recipe:
          setup:
            - "Standard chain through release creation (release stays DRAFT — never submitted)"
            - "MEL item on AC1, deferral_category A, repair_deadline 2026-05-01T09:00:00Z (within 1 day of creation clock 08:00), no penalties"
            - "Clock advanced to 2026-05-01T10:00:00Z -> mel_expiry_sweep flips the item to EXPIRED"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
