        payload: {}
        as: GeneralCounsel
        as_user_id: ${gc_id}
      - call: POST /litigation/matters/${matter_id}/engagements
        payload:
          firm_id: ${firm_id}
          role_type: SPECIALIST
          fee_arrangement: HOURLY
          proposed_rate_cents: 80000
          engagement_letter_executed: false
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          eng_id: $.data.id
      - call: POST /litigation/engagements/${eng_id}/approve
        payload: {}
        as: DeputyGeneralCounsel
        as_user_id: ${dgc_id}
      trigger:
      - call: POST /litigation/engagements/${eng_id}/activate
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          err: $.data.error_id
      - call: PATCH /litigation/engagements/${eng_id}
        payload:
          engagement_letter_executed: true
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/engagements/${eng_id}/activate
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          eng_status: $.data.status
      assert:
      - err == ERR_ENGAGEMENT_LETTER_REQUIRED
      - eng_status == ACTIVE after letter executed
