# =============================================================================
# Scaffold: Utility Mutual-Aid Crew Mobilization (EEI mutual assistance program)
# Difficulty target: HARDER THAN EXPERT (dense cross-entity coupling, 12 entities,
# 8 interlocking workflow areas, 3 dual-variant calculation domains, cyclic +
# parallel state dimensions, OCC on schedule supersede, segregation of duties).
# =============================================================================

scenario: |
  1114. Utility Mutual-Aid Crew Mobilization (EEI mutual assistance program):
  request for assistance & resource typing, crew roster/equipment inventory &
  travel, lodging/meals logistics & per-diem, timekeeping across companies &
  billing rate schedule, safety briefing & host-utility rules, release &
  demobilization, invoice reconciliation & dispute, event after-action reporting

domain_name: utility-mutual-aid
api_prefix: /mutual-aid

complexity_profile:
  primary_archetype: ledger_reconciliation        # invoice reconciliation: provisional vs certified totals diverge on identical raw rows
  secondary_archetype: compliance_audit           # safety briefing gating, segregation of duties, after-action audit trail
  complexity_layers:
    - dual_variant_calculation                    # invoice provisional-vs-final; per-diem STANDARD-vs-ACTUAL; AAR as-billed-vs-as-certified
    - cascading_side_effects                      # safety-hold cascade (depth 3); demobilization cascade (depth 2)
    - version_pinning_on_approval                 # timesheet certification pins the effective BillingRateSchedule; supersede forces recertification
    - optimistic_concurrency                      # OCC on the superseded schedule's version at publish time

  entity_topology: flat                           # peer entities linked by FK references; no nested URL ownership
  state_machine_shape: cyclic                     # negotiation cycle SUBMITTED->COUNTERED->SUBMITTED; Crew carries two independent status dimensions; invoice dispute cycle
  relationship_patterns:
    - one_to_many
    - self_referential                            # BillingRateSchedule.supersedes_schedule_id
    - cross_aggregate                             # timesheet -> crew -> request -> event chains; invoice pins schedule
  role_model: segregation_of_duties               # certifier != submitter; briefing conductor != acknowledger; invoice approver != any covered certifier
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all linkage via FK fields)
# =============================================================================
entities:
  - name: UtilityCompany
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal company name" }
      - { name: company_code, type: string, source: input, description: "Unique program company code (e.g. 'HELCO')", constraints: "unique across all UtilityCompany rows" }
      - { name: role_capability, type: enum, source: input, description: "HOST | RESPONDING | BOTH — which side(s) of mutual aid this company may act on" }
      - { name: home_region, type: string, source: input, description: "Free-form home service territory" }

  - name: MutualAidEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_name, type: string, source: input, description: "Event name (e.g. 'Hurricane Idalia')" }
      - { name: host_utility_id, type: string, source: input, description: "FK -> UtilityCompany.id; the host utility requesting aid" }
      - { name: event_type, type: enum, source: input, description: "STORM | WILDFIRE | ICE | FLOOD" }
      - { name: declared_start_date, type: string, source: input, description: "ISO date the event period starts" }
      - { name: premium_window_start, type: string, source: input, description: "ISO date; WORK days on/after this earn storm premium" }
      - { name: premium_window_end, type: string, source: input, description: "ISO date; WORK days on/before this earn storm premium (inclusive)" }
      - { name: mobilization_deadline, type: datetime, source: input, description: "ISO datetime; crews must be ARRIVED before this instant" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> ACTIVE -> DEMOBILIZING -> CLOSED" }
      - { name: demobilized_at, type: datetime, source: system, default: null, description: "Set when begin_demobilization fires; anchors the 30-day invoice window" }
      - { name: open_request_count, type: integer, source: computed, description: "Count of AssistanceRequest rows with status in {SUBMITTED, COUNTERED} for this event" }
      - { name: total_certified_direct_cents, type: integer, source: computed, description: "Sum of CERTIFIED TimeSheet.certified_amount_cents + APPROVED PerDiemClaim.amount_cents across all requests of this event" }
      - { name: total_invoiced_cents, type: integer, source: computed, description: "Sum of Invoice.final_total_cents for invoices with status in {SUBMITTED, DISPUTED, CREDIT_PROPOSED, ESCALATED, APPROVED, PAID}" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of Invoice.amount_paid_cents for PAID invoices" }
      - { name: intake_posture, type: enum, source: computed, description: "ACCEPTING | RESTRICTED | SEALED — derived: SEALED when status in {DEMOBILIZING, CLOSED}; else RESTRICTED when open_request_count >= 3; else ACCEPTING", constraints: "RESTRICTED/SEALED block new AssistanceRequest creation" }

  - name: BillingRateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> MutualAidEvent.id; event this rate card applies to" }
      - { name: responding_utility_id, type: string, source: system, description: "FK -> UtilityCompany.id; set from the caller's X-User-ID (RespondingCoordinator identity) at creation" }
      - { name: supersedes_schedule_id, type: string, source: input, default: null, description: "FK -> BillingRateSchedule.id; optional self-reference — publishing this schedule supersedes the named one" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date, inclusive lower bound of coverage window" }
      - { name: effective_end_date, type: string, source: input, description: "ISO date, INCLUSIVE upper bound of coverage window (closed-interval semantics)" }
      - { name: rate_lines, type: array, source: input, description: "List of { crew_type, hourly_rate_cents } — one entry per Crew.crew_type enum value" }
      - { name: ot_multiplier_bps, type: integer, source: input, default: 15000, description: "Overtime multiplier in basis points (15000 = 1.5x)" }
      - { name: dt_multiplier_bps, type: integer, source: input, default: 20000, description: "Double-time multiplier in basis points (20000 = 2.0x)" }
      - { name: ot_threshold_minutes, type: integer, source: input, default: 480, description: "Minutes per WORK day billed at straight time before OT starts (boundary: exactly this many minutes = zero OT)" }
      - { name: dt_threshold_minutes, type: integer, source: input, default: 960, description: "Minutes per WORK day beyond which double-time applies" }
      - { name: storm_premium_bps, type: integer, source: input, description: "Premium in basis points applied to WORK-day labor inside the event premium window (1000 = 10%)" }
      - { name: per_diem_rate_cents, type: integer, source: input, description: "Per-member per-day meals & incidentals rate" }
      - { name: per_diem_method, type: enum, source: input, description: "STANDARD | ACTUAL — selects the per_diem_claim_amount variant for claims of this utility's crews" }
      - { name: mobilization_fee_tiers, type: array, source: input, description: "Ordered list of { min_subtotal_cents, fee_bps }; fee bracket selected by invoice direct subtotal (NOT by post-fee total)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED -> LOCKED ; PUBLISHED -> SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Set on publish" }

  - name: AssistanceRequest
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> MutualAidEvent.id" }
      - { name: responding_utility_id, type: string, source: input, description: "FK -> UtilityCompany.id; company the request is addressed to" }
      - { name: requested_crews, type: array, source: input, description: "Resource typing: list of { crew_type, count }" }
      - { name: required_minimum_crews, type: integer, source: input, description: "Minimum deployable crews for FULFILLED" }
      - { name: earliest_start_date, type: string, source: input, description: "ISO date; deployment window lower bound" }
      - { name: latest_end_date, type: string, source: input, description: "ISO date; deployment window upper bound" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | COUNTERED | ACCEPTED | DECLINED | CANCELLED | IN_PROGRESS | FULFILLED | RELEASED | CLOSED" }
      - { name: amendment_round, type: integer, source: system, default: 0, description: "Increments on every COUNTERED -> SUBMITTED resubmission" }
      - { name: counter_terms, type: object, source: system, default: null, description: "{ counter_crews, counter_note } recorded by the most recent counter action" }
      - { name: committed_crew_count, type: integer, source: computed, description: "Count of Crew rows with request_id = this and mobility_status in {COMMITTED, ARRIVED, DEMOBILIZING}" }
      - { name: deployable_crew_count, type: integer, source: computed, description: "Count of Crew rows with request_id = this and mobility_status = ARRIVED and readiness_status = CLEARED_TO_WORK" }
      - { name: certified_direct_cents, type: integer, source: computed, description: "CERTIFIED timesheet amounts + APPROVED per-diem amounts for this request's crews" }
      - { name: invoiced_total_cents, type: integer, source: computed, description: "final_total_cents of the non-DRAFT non-VOID invoice for this request (0 if none)" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> AssistanceRequest.id" }
      - { name: owning_utility_id, type: string, source: system, description: "FK -> UtilityCompany.id; set from caller X-User-ID; must equal request.responding_utility_id" }
      - { name: crew_type, type: enum, source: input, description: "LINE | TREE | DAMAGE_ASSESS | SUBSTATION | SUPPORT" }
      - { name: home_base, type: string, source: input, description: "Home depot free text" }
      - { name: roster, type: array, source: input, description: "Crew roster: list of { member_ref, member_role }; must be non-empty" }
      - { name: roster_size, type: integer, source: computed, description: "len(roster)" }
      - { name: equipment_units, type: array, source: input, description: "Equipment inventory: list of { unit_type, unit_ref, daily_rate_cents }; may be empty" }
      - { name: equipment_daily_total_cents, type: integer, source: computed, description: "Sum of equipment_units.daily_rate_cents" }
      - { name: mobility_status, type: enum, source: system, default: COMMITTED, description: "COMMITTED -> ARRIVED -> DEMOBILIZING -> RETURNED ; COMMITTED -> WITHDRAWN" }
      - { name: readiness_status, type: enum, source: system, default: AWAITING_BRIEFING, description: "AWAITING_BRIEFING -> BRIEFED -> CLEARED_TO_WORK -> SAFETY_HOLD -> BRIEFED -> ... ; terminal: RELEASED (set by crew release). Independent dimension from mobility_status." }
      - { name: last_suspended_at, type: datetime, source: system, default: null, description: "Set by suspend; a briefing conducted after this instant is required to leave SAFETY_HOLD" }
      - { name: arrived_at, type: datetime, source: system, default: null, description: "Set on confirm_arrival" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Set on release" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Set on complete_return" }

  - name: SafetyBriefing
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: event_id, type: string, source: input, description: "FK -> MutualAidEvent.id; must equal crew.request.event_id" }
      - { name: conductor_operator_ref, type: string, source: input, description: "Operator id of the HostSafetyOfficer conducting the briefing" }
      - { name: host_rules_version, type: string, source: input, description: "Host utility rulebook version acknowledged" }
      - { name: topics, type: array, source: input, description: "List of topic strings; must be non-empty" }
      - { name: conducted_at, type: datetime, source: system, description: "Set to current logical clock at creation (briefing is CONDUCTED on creation)" }
      - { name: supervisor_operator_ref, type: string, source: system, default: null, description: "Operator id recorded at acknowledgment; MUST differ from conductor_operator_ref" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Set on acknowledge" }
      - { name: status, type: enum, source: system, default: CONDUCTED, description: "CONDUCTED -> ACKNOWLEDGED" }

  - name: TimeSheet
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: work_date, type: string, source: input, description: "ISO date the time was worked", constraints: "unique per (crew_id, work_date)" }
      - { name: day_classification, type: enum, source: input, description: "TRAVEL | WORK | STANDBY | REST" }
      - { name: reported_work_minutes, type: integer, source: input, default: 0, description: "Minutes worked (WORK days)" }
      - { name: reported_travel_minutes, type: integer, source: input, default: 0, description: "Minutes in travel status (TRAVEL days)" }
      - { name: submitted_by_operator_ref, type: string, source: system, default: null, description: "Operator id recorded at submit" }
      - { name: certified_by_operator_ref, type: string, source: system, default: null, description: "Operator id recorded at certify/recertify; MUST differ from submitted_by_operator_ref" }
      - { name: certified_schedule_id, type: string, source: system, default: null, description: "FK -> BillingRateSchedule.id; pinned at certification via the effective-schedule selector" }
      - { name: certified_amount_cents, type: integer, source: computed, default: null, description: "crew_daily_billing result computed at certification" }
      - { name: billed_invoice_id, type: string, source: system, default: null, description: "FK -> Invoice.id; set when a submitted invoice sweeps this timesheet; cleared if that invoice is voided" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> CERTIFIED ; SUBMITTED -> REJECTED -> DRAFT ; SUBMITTED -> HELD -> SUBMITTED (safety cascade)" }

  - name: LodgingBlock
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> MutualAidEvent.id" }
      - { name: hotel_name, type: string, source: input, description: "Hotel name" }
      - { name: block_code, type: string, source: input, description: "Hotel block confirmation code" }
      - { name: total_rooms, type: integer, source: input, description: "Rooms under block control (capacity)" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Negotiated nightly rate per room" }
      - { name: assigned_rooms, type: integer, source: computed, description: "Sum of room_count over assignments with status in {RESERVED, OCCUPIED}" }

  - name: LodgingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> LodgingBlock.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: room_count, type: integer, source: input, description: "Rooms allocated to this crew" }
      - { name: check_in_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: check_out_date, type: string, source: input, description: "ISO date, EXCLUSIVE (half-open stay interval [check_in, check_out))" }
      - { name: actual_check_out_date, type: string, source: system, default: null, description: "Set to the release date by the demobilization cascade" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED -> OCCUPIED -> CHECKED_OUT ; RESERVED -> CANCELLED" }

  - name: PerDiemClaim
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: claim_date, type: string, source: input, description: "ISO date claimed", constraints: "unique per (crew_id, claim_date)" }
      - { name: member_count, type: integer, source: input, description: "Members claimed; 1 <= member_count <= crew.roster_size" }
      - { name: meals_provided_count, type: integer, source: input, description: "0..3 host-provided meals that day" }
      - { name: day_factor_type, type: enum, source: input, description: "FULL | TRAVEL (TRAVEL = 0.75 factor)" }
      - { name: receipts_total_cents, type: integer, source: input, default: null, description: "Receipted amount; required when the effective schedule's per_diem_method is ACTUAL" }
      - { name: method_applied, type: enum, source: computed, description: "STANDARD | ACTUAL — copied from the effective schedule at creation" }
      - { name: lodging_covered, type: boolean, source: computed, description: "True when the crew has a non-cancelled LodgingAssignment covering claim_date" }
      - { name: amount_cents, type: integer, source: computed, description: "per_diem_claim_amount result (per-day rounded, round_half_up)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED | REJECTED ; SUBMITTED -> HELD -> SUBMITTED (safety cascade)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> AssistanceRequest.id" }
      - { name: rate_schedule_id, type: string, source: input, description: "FK -> BillingRateSchedule.id; pinned billing basis" }
      - { name: billing_period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: billing_period_end, type: string, source: input, description: "ISO date, inclusive" }
      - { name: provisional_subtotal_cents, type: integer, source: computed, description: "DRAFT-time estimate: CERTIFIED + SUBMITTED timesheet amounts (provisional formula) + APPROVED + SUBMITTED per-diem amounts in period" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "mobilization_fee applied to provisional_subtotal_cents" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "provisional_subtotal_cents + provisional_fee_cents" }
      - { name: labor_subtotal_cents, type: integer, source: computed, default: null, description: "Submit-time: sum of newly swept CERTIFIED timesheet amounts in period" }
      - { name: per_diem_subtotal_cents, type: integer, source: computed, default: null, description: "Submit-time: sum of newly swept APPROVED per-diem amounts in period" }
      - { name: mobilization_fee_cents, type: integer, source: computed, default: null, description: "Submit-time fee from schedule tiers" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "labor_subtotal + per_diem_subtotal + mobilization_fee" }
      - { name: dispute_reason, type: enum, source: system, default: null, description: "RATE_MISMATCH | HOURS_MISMATCH | PER_DIEM_MISMATCH | DUPLICATE | OTHER" }
      - { name: disputed_amount_cents, type: integer, source: system, default: null, description: "Amount under dispute (set by dispute action)" }
      - { name: proposed_credit_cents, type: integer, source: system, default: null, description: "Credit offered by responding utility (CREDIT_PROPOSED)" }
      - { name: applied_credit_total_cents, type: integer, source: system, default: 0, description: "Sum of credits applied via accept_credit / arbitrate" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Set by mark_paid" }
      - { name: outstanding_cents, type: integer, source: computed, description: "final_total_cents - applied_credit_total_cents - amount_paid_cents" }
      - { name: approved_by_operator_ref, type: string, source: system, default: null, description: "Recorded at approve; MUST differ from every covered timesheet's certified_by_operator_ref" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED -> PAID ; SUBMITTED -> DISPUTED -> CREDIT_PROPOSED -> SUBMITTED | ESCALATED -> SUBMITTED ; DRAFT|SUBMITTED -> VOID" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Set on submit" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Set on mark_paid" }

  - name: AfterActionReport
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> MutualAidEvent.id", constraints: "unique — one report per event" }
      - { name: summary, type: string, source: input, description: "Narrative summary" }
      - { name: lessons_learned, type: string, source: input, default: null, description: "Optional narrative" }
      - { name: total_crew_days, type: integer, source: computed, description: "Count of CERTIFIED timesheets with day_classification WORK across the event" }
      - { name: as_certified_total_cents, type: integer, source: computed, description: "As-certified cost view: CERTIFIED timesheet amounts + APPROVED per-diem amounts (no mobilization fee)" }
      - { name: as_billed_total_cents, type: integer, source: computed, description: "As-billed cost view: final_total_cents of invoices in {APPROVED, PAID} (fee included)" }
      - { name: variance_cents, type: integer, source: computed, description: "as_billed_total_cents - as_certified_total_cents" }
      - { name: status, type: enum, source: system, default: DRAFTING, description: "DRAFTING -> SUBMITTED -> ACCEPTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MutualAidEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACTIVE
        trigger: "POST /mutual-aid/events/{id}/activate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["intake_posture recomputed (stays ACCEPTING/RESTRICTED per open_request_count)"]

      - from: ACTIVE
        to: DEMOBILIZING
        trigger: "POST /mutual-aid/events/{id}/begin_demobilization"
        actor: HostCoordinator
        preconditions:
          - "Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"
        side_effects:
          - "demobilized_at = current logical clock (anchors the 30-day invoice submission window)"
          - "intake_posture -> SEALED (new AssistanceRequest creation now blocked)"

      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /mutual-aid/events/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "An AfterActionReport for this event exists with status ACCEPTED (ERR_EVENT_CLOSE_BLOCKED)"
          - "Every Invoice on the event's requests is in {PAID, VOID} (ERR_EVENT_CLOSE_BLOCKED)"
        side_effects: []

  - entity: BillingRateSchedule
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /mutual-aid/billing-rate-schedules/{id}/publish"
        actor: RespondingCoordinator
        preconditions:
          - "Event status is OPEN or ACTIVE (ERR_EVENT_NOT_DEMOBILIZING is NOT used here; use ERR_INVALID_STATE_TRANSITION when event is DEMOBILIZING/CLOSED)"
          - "Closed-interval overlap check: no other schedule for the same (event_id, responding_utility_id) with status in {PUBLISHED, LOCKED} has effective window intersecting this one; windows are INCLUSIVE both ends, so an existing window ending 2026-05-31 conflicts with a new window starting 2026-05-31 (ERR_SCHEDULE_WINDOW_OVERLAP). The schedule named by supersedes_schedule_id is exempt from this check."
          - "If supersedes_schedule_id is set: expected_superseded_schedule_version must equal that schedule's current version (ERR_STALE_SCHEDULE_VERSION, 412)"
        side_effects:
          - "published_at = current logical clock"
          - "If supersedes_schedule_id set: that schedule's status -> SUPERSEDED and its version increments by 1 (this is the OCC bump)"

      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /mutual-aid/billing-rate-schedules/{id}/lock"
        actor: HostFinance
        preconditions:
          - "Caller X-User-ID == schedule event's host_utility_id (ERR_SCOPE_MISMATCH)"
        side_effects: []

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (side effect of publishing a successor schedule)"
        actor: system
        preconditions: []
        side_effects: ["version increments by 1"]

  - entity: AssistanceRequest
    initial_state: DRAFT
    terminal_states: [DECLINED, CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mutual-aid/assistance-requests/{id}/submit"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["event.open_request_count recomputed; intake_posture may flip ACCEPTING -> RESTRICTED at threshold 3"]

      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /mutual-aid/assistance-requests/{id}/counter"
        actor: RespondingCoordinator
        preconditions: ["Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["counter_terms = { counter_crews, counter_note }"]

      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /mutual-aid/assistance-requests/{id}/submit (resubmission requires amended_crews)"
        actor: HostCoordinator
        preconditions:
          - "Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"
          - "amended_crews MUST be present in the payload when resubmitting from COUNTERED (ERR_INVALID_REQUEST)"
        side_effects: ["amendment_round += 1", "requested_crews replaced by amended_crews; required_minimum_crews replaced when amended_required_minimum present"]
        note: "Negotiation cycle SUBMITTED -> COUNTERED -> SUBMITTED may repeat without bound; amendment_round tracks rounds"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mutual-aid/assistance-requests/{id}/accept"
        actor: RespondingCoordinator
        preconditions:
          - "Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"
          - "A BillingRateSchedule for (event_id, responding_utility_id) exists with status in {PUBLISHED, LOCKED} (ERR_SCHEDULE_NOT_PUBLISHED)"
        side_effects: ["event.open_request_count recomputed; intake_posture may flip RESTRICTED -> ACCEPTING"]

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /mutual-aid/assistance-requests/{id}/decline"
        actor: RespondingCoordinator
        preconditions: ["Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["event.open_request_count recomputed"]

      - from: COUNTERED
        to: DECLINED
        trigger: "POST /mutual-aid/assistance-requests/{id}/decline"
        actor: RespondingCoordinator
        preconditions: ["Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["event.open_request_count recomputed"]

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mutual-aid/assistance-requests/{id}/cancel"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /mutual-aid/assistance-requests/{id}/cancel"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["event.open_request_count recomputed"]

      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /mutual-aid/assistance-requests/{id}/cancel"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["event.open_request_count recomputed"]

      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "system (first crew of this request reaches ARRIVED via confirm_arrival)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system (deployable_crew_count recompute observes deployable_crew_count >= required_minimum_crews)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FULFILLED
        to: IN_PROGRESS
        trigger: "system (deployable_crew_count recompute observes deployable_crew_count < required_minimum_crews — e.g. third hop of the safety-hold cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: RELEASED
        trigger: "system (every Crew of this request reaches a terminal mobility_status in {RETURNED, WITHDRAWN} via complete_return/withdraw)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FULFILLED
        to: RELEASED
        trigger: "system (every Crew of this request reaches a terminal mobility_status in {RETURNED, WITHDRAWN})"
        actor: system
        preconditions: []
        side_effects: []

      - from: RELEASED
        to: CLOSED
        trigger: "system (linked Invoice reaches PAID via mark_paid)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Crew
    initial_state: "mobility_status=COMMITTED, readiness_status=AWAITING_BRIEFING"
    terminal_states: ["mobility_status in {RETURNED, WITHDRAWN}"]
    note: "Two independent status dimensions: mobility_status (travel/demob) and readiness_status (safety). Both are recorded on the same row and evolve independently except that release forces readiness_status -> RELEASED."
    transitions:
      - from: COMMITTED
        to: ARRIVED
        trigger: "POST /mutual-aid/crews/{id}/confirm_arrival"
        actor: HostCoordinator
        preconditions:
          - "Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"
          - "request.status in {ACCEPTED, IN_PROGRESS, FULFILLED} (ERR_INVALID_STATE_TRANSITION) — cross-entity dependency Crew -> AssistanceRequest"
          - "Current logical clock <= event.mobilization_deadline (ERR_MOBILIZATION_DEADLINE_PASSED)"
        side_effects:
          - "arrived_at = current logical clock"
          - "Crew's LodgingAssignment rows in RESERVED -> OCCUPIED (arrival cascade link 1)"
          - "request deployable_crew_count recomputed (arrival cascade link 2: depends on readiness too)"
          - "If request was ACCEPTED: request -> IN_PROGRESS; if deployable_crew_count >= required_minimum_crews: request -> FULFILLED (arrival cascade link 3)"

      - from: ARRIVED
        to: DEMOBILIZING
        trigger: "POST /mutual-aid/crews/{id}/release"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects:
          - "released_at = current logical clock; readiness_status -> RELEASED (terminal; certification closed for this crew)"
          - "Demobilization cascade link 1: crew's LodgingAssignment rows in OCCUPIED -> CHECKED_OUT with actual_check_out_date = current date; block.assigned_rooms recomputed"
          - "Demobilization cascade link 2: request deployable_crew_count recomputed; FULFILLED -> IN_PROGRESS if it drops below required_minimum_crews"

      - from: DEMOBILIZING
        to: RETURNED
        trigger: "POST /mutual-aid/crews/{id}/complete_return"
        actor: RespondingCoordinator
        preconditions: ["Caller X-User-ID == crew.owning_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects:
          - "returned_at = current logical clock"
          - "Return cascade link 1: if every crew of the request is now in {RETURNED, WITHDRAWN}, request IN_PROGRESS|FULFILLED -> RELEASED (mutation on AssistanceRequest caused by this crew mutation)"
          - "Return cascade link 2: request release re-derives event-level totals used by after-action reporting"

      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /mutual-aid/crews/{id}/withdraw"
        actor: RespondingCoordinator
        preconditions: ["Caller X-User-ID == crew.owning_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects:
          - "request committed_crew_count recomputed (create-then-withdraw leaves committed_crew_count unchanged — compensating invariant)"
          - "request deployable_crew_count recomputed; if request was FULFILLED and deployable_crew_count < required_minimum_crews: request -> IN_PROGRESS"

      - from: CLEARED_TO_WORK
        to: SAFETY_HOLD
        trigger: "POST /mutual-aid/crews/{id}/suspend (readiness dimension)"
        actor: HostSafetyOfficer
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects:
          - "last_suspended_at = current logical clock"
          - "Safety cascade link 1: this crew's readiness_status CLEARED_TO_WORK -> SAFETY_HOLD"
          - "Safety cascade link 2 (caused by link 1): this crew's TimeSheet rows in SUBMITTED -> HELD and PerDiemClaim rows in SUBMITTED -> HELD"
          - "Safety cascade link 3 (caused by link 2's crew-state mutation): request deployable_crew_count recomputed; if request was FULFILLED and deployable_crew_count drops below required_minimum_crews, request -> IN_PROGRESS"

      - from: SAFETY_HOLD
        to: BRIEFED
        trigger: "system (a SafetyBriefing for this crew with conducted_at > crew.last_suspended_at is created)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_BRIEFING
        to: BRIEFED
        trigger: "system (SafetyBriefing created for this crew)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BRIEFED
        to: CLEARED_TO_WORK
        trigger: "system (the briefing that produced BRIEFED is acknowledged)"
        actor: system
        preconditions: []
        side_effects:
          - "Crew's TimeSheet rows in HELD -> SUBMITTED and PerDiemClaim rows in HELD -> SUBMITTED (hold-release cascade)"
          - "request deployable_crew_count recomputed; if request was IN_PROGRESS and deployable_crew_count >= required_minimum_crews: request -> FULFILLED"

  - entity: SafetyBriefing
    initial_state: CONDUCTED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: CONDUCTED
        to: ACKNOWLEDGED
        trigger: "POST /mutual-aid/safety-briefings/{id}/acknowledge"
        actor: CrewSupervisor
        preconditions:
          - "Caller X-User-ID == briefing.crew_id (ERR_SCOPE_MISMATCH)"
          - "supervisor_operator_ref != briefing.conductor_operator_ref (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "acknowledged_at = current logical clock; supervisor_operator_ref recorded"
          - "Crew readiness BRIEFED -> CLEARED_TO_WORK (hold-release cascade fires when returning from SAFETY_HOLD)"

  - entity: TimeSheet
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mutual-aid/timesheets/{id}/submit"
        actor: CrewSupervisor
        preconditions: ["Caller X-User-ID == timesheet.crew_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["submitted_by_operator_ref recorded"]

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /mutual-aid/timesheets/{id}/certify"
        actor: HostCoordinator
        preconditions:
          - "Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"
          - "crew.readiness_status == CLEARED_TO_WORK (ERR_CREW_NOT_CLEARED) — cross-entity dependency TimeSheet -> Crew; SAFETY beats temporal on conflict"
          - "current date <= work_date + 14 days (ERR_CERTIFICATION_WINDOW_CLOSED)"
          - "certifier_operator_ref != submitted_by_operator_ref (ERR_SEGREGATION_OF_DUTIES)"
          - "Effective-schedule selector non-empty (ERR_NO_EFFECTIVE_SCHEDULE)"
        side_effects:
          - "certified_schedule_id = selector result; certified_amount_cents = crew_daily_billing(...); certified_by_operator_ref recorded"
          - "request.certified_direct_cents and event.total_certified_direct_cents recomputed (ledger sync)"

      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /mutual-aid/timesheets/{id}/recertify"
        actor: HostCoordinator
        preconditions:
          - "certified_schedule.status == SUPERSEDED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "certifier_operator_ref != submitted_by_operator_ref (ERR_SEGREGATION_OF_DUTIES)"
          - "current date <= work_date + 14 days (ERR_CERTIFICATION_WINDOW_CLOSED)"
        side_effects:
          - "certified_schedule_id re-resolved to the current effective schedule; certified_amount_cents recomputed; version increments"
          - "request.certified_direct_cents and event totals recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mutual-aid/timesheets/{id}/reject"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /mutual-aid/timesheets/{id}/revise"
        actor: CrewSupervisor
        preconditions: ["Caller X-User-ID == timesheet.crew_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["Optional payload fields replace prior values"]

      - from: SUBMITTED
        to: HELD
        trigger: "system (safety cascade link 2 from crew suspend)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HELD
        to: SUBMITTED
        trigger: "system (hold-release cascade when crew returns to CLEARED_TO_WORK)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LodgingAssignment
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "system (arrival cascade link 1 from crew confirm_arrival)"
        actor: system
        preconditions: []
        side_effects: ["block.assigned_rooms unchanged (still counted)"]

      - from: OCCUPIED
        to: CHECKED_OUT
        trigger: "system (demobilization cascade link 1 from crew release)"
        actor: system
        preconditions: []
        side_effects: ["actual_check_out_date = current date; block.assigned_rooms recomputed (drops by room_count)"]

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /mutual-aid/lodging-assignments/{id}/cancel"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == block event's host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["block.assigned_rooms recomputed (drops by room_count)"]

  - entity: PerDiemClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mutual-aid/per-diem-claims/{id}/approve"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["request.certified_direct_cents and event.total_certified_direct_cents recomputed (ledger sync)"]

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mutual-aid/per-diem-claims/{id}/reject"
        actor: HostCoordinator
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: []

      - from: SUBMITTED
        to: HELD
        trigger: "system (safety cascade link 2 from crew suspend)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HELD
        to: SUBMITTED
        trigger: "system (hold-release cascade when crew returns to CLEARED_TO_WORK)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mutual-aid/invoices/{id}/submit"
        actor: RespondingFinance
        preconditions:
          - "Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"
          - "Event status == DEMOBILIZING (ERR_EVENT_NOT_DEMOBILIZING) — cross-entity dependency Invoice -> MutualAidEvent"
          - "current datetime <= event.demobilized_at + 30 days (ERR_INVOICE_WINDOW_CLOSED)"
          - "Every covered CERTIFIED timesheet's certified_schedule.status != SUPERSEDED (ERR_SUPERSEDED_SCHEDULE) — cross-entity dependency Invoice -> BillingRateSchedule"
          - "Computed final_total_cents > 0 (ERR_EMPTY_INVOICE)"
        side_effects:
          - "Compute labor_subtotal_cents / per_diem_subtotal_cents / mobilization_fee_cents / final_total_cents per invoice_totals (final variant)"
          - "Swept timesheets get billed_invoice_id = this invoice; swept per-diem claims are locked to this invoice"
          - "outstanding_cents = final_total_cents; submitted_at set; event.total_invoiced_cents and request.invoiced_total_cents recomputed"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mutual-aid/invoices/{id}/approve"
        actor: HostFinance
        preconditions:
          - "Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"
          - "approver_operator_ref != certified_by_operator_ref of EVERY covered timesheet (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_operator_ref recorded"]

      - from: APPROVED
        to: PAID
        trigger: "POST /mutual-aid/invoices/{id}/mark_paid"
        actor: HostFinance
        preconditions:
          - "Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"
          - "amount_cents == outstanding_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH); amount_cents > 0 (ERR_INVALID_AMOUNT)"
        side_effects:
          - "amount_paid_cents = amount_cents; paid_at set; outstanding_cents -> 0 (boundary: exact zero crossing flips status)"
          - "event.total_paid_cents recomputed"
          - "If request.status == RELEASED: request -> CLOSED (settlement cascade)"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /mutual-aid/invoices/{id}/dispute"
        actor: HostFinance
        preconditions:
          - "Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"
          - "1 <= disputed_amount_cents <= outstanding_cents (ERR_DISPUTE_AMOUNT_INVALID)"
        side_effects: ["dispute_reason and disputed_amount_cents recorded"]

      - from: DISPUTED
        to: CREDIT_PROPOSED
        trigger: "POST /mutual-aid/invoices/{id}/propose_credit"
        actor: RespondingFinance
        preconditions:
          - "Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"
          - "1 <= credit_cents <= disputed_amount_cents (ERR_CREDIT_EXCEEDS_DISPUTED)"
        side_effects: ["proposed_credit_cents recorded"]

      - from: CREDIT_PROPOSED
        to: SUBMITTED
        trigger: "POST /mutual-aid/invoices/{id}/accept_credit"
        actor: HostFinance
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects:
          - "applied_credit_total_cents += proposed_credit_cents; outstanding_cents recomputed; disputed_amount_cents/proposed_credit_cents cleared"
          - "event.total_invoiced_cents unchanged (final_total_cents immutable); outstanding shrinks by the credit"

      - from: CREDIT_PROPOSED
        to: ESCALATED
        trigger: "POST /mutual-aid/invoices/{id}/reject_credit"
        actor: HostFinance
        preconditions: ["Caller X-User-ID == request.event host_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: []

      - from: ESCALATED
        to: SUBMITTED
        trigger: "POST /mutual-aid/invoices/{id}/arbitrate"
        actor: ProgramAdmin
        preconditions: ["0 <= final_credit_cents <= disputed_amount_cents (ERR_CREDIT_EXCEEDS_DISPUTED)"]
        side_effects: ["applied_credit_total_cents += final_credit_cents; outstanding_cents recomputed; dispute fields cleared"]

      - from: DRAFT
        to: VOID
        trigger: "POST /mutual-aid/invoices/{id}/void"
        actor: RespondingFinance
        preconditions: ["Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects: ["provisional figures discarded"]

      - from: SUBMITTED
        to: VOID
        trigger: "POST /mutual-aid/invoices/{id}/void"
        actor: RespondingFinance
        preconditions: ["Caller X-User-ID == request.responding_utility_id (ERR_SCOPE_MISMATCH)"]
        side_effects:
          - "Swept timesheets' billed_invoice_id cleared (compensating action)"
          - "event.total_invoiced_cents and request.invoiced_total_cents recomputed — submit-then-void leaves both unchanged (compensating invariant)"

  - entity: AfterActionReport
    initial_state: DRAFTING
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFTING
        to: SUBMITTED
        trigger: "POST /mutual-aid/after-action-reports/{id}/submit"
        actor: HostCoordinator
        preconditions:
          - "Caller X-User-ID == event.host_utility_id (ERR_SCOPE_MISMATCH)"
          - "Every crew on the event's requests is in terminal mobility {RETURNED, WITHDRAWN} (ERR_EVENT_NOT_FULLY_DEMOBILIZED) — cross-entity dependency AfterActionReport -> Crew"
        side_effects: ["Compute total_crew_days, as_certified_total_cents, as_billed_total_cents, variance_cents per aar_cost_variance"]

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mutual-aid/after-action-reports/{id}/accept"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["Event close precondition now satisfiable"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-publish-stale-supersede
    parent_entity: BillingRateSchedule
    write_endpoint: "POST /mutual-aid/billing-rate-schedules/{id}/publish"
    occ_field: expected_superseded_schedule_version
    description: |
      Publishing a schedule whose supersedes_schedule_id points at a schedule
      whose version has advanced since the client last read it is rejected.
      This captures the case where another writer has just published a
      different successor (which legitimately supersedes the same predecessor
      under the replacement rule and bumps its version), so the current
      writer's view of the predecessor is stale.
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: crew_daily_billing
    trigger: "TimeSheet certify / recertify; also evaluated provisionally at Invoice creation for uncertified rows"
    algorithm: tiered_pricing
    formula: |
      schedule = the pinned/effective BillingRateSchedule
      rate_line = schedule.rate_lines entry matching crew.crew_type
      base = rate_line.hourly_rate_cents  (integer cents per hour)
      if day_classification == REST: amount = 0
      elif day_classification == TRAVEL:
        # travel minutes at straight base rate; NO overtime, NO storm premium, NO equipment
        labor = round_half_up(reported_travel_minutes * base / 60)
        amount = labor
      elif day_classification == STANDBY:
        # flat 8 hours at base; equipment bills; NO premium, reported minutes ignored
        labor = round_half_up(480 * base / 60)
        amount = labor + crew.equipment_daily_total_cents
      else:  # WORK
        m = reported_work_minutes
        reg = min(m, schedule.ot_threshold_minutes)
        ot  = min(max(m - schedule.ot_threshold_minutes, 0),
                  schedule.dt_threshold_minutes - schedule.ot_threshold_minutes)
        dt  = max(m - schedule.dt_threshold_minutes, 0)
        # boundary: m == ot_threshold_minutes => ot == 0 (strictly-beyond semantics)
        labor = round_half_up(reg * base / 60)
              + round_half_up(ot * base * schedule.ot_multiplier_bps / (60 * 10000))
              + round_half_up(dt * base * schedule.dt_multiplier_bps / (60 * 10000))
        if event.premium_window_start <= work_date <= event.premium_window_end:
          labor = round_half_up(labor * (10000 + schedule.storm_premium_bps) / 10000)
        amount = labor + crew.equipment_daily_total_cents
      # rounding order (pinned): each component rounds to whole cents with
      # round_half_up at the points shown; the premium multiplier applies to the
      # already-rounded labor subtotal; equipment is added last, unrounded.
    input_set: "The single TimeSheet being certified; its Crew (crew_type, equipment_daily_total_cents); the event premium window"
    constants:
      STANDBY_FLAT_MINUTES: 480
      DEFAULT_OT_THRESHOLD_MINUTES: 480
      DEFAULT_DT_THRESHOLD_MINUTES: 960
    precision: "whole cents, round_half_up at each pinned rounding point"

  - name: per_diem_claim_amount
    trigger: "PerDiemClaim creation"
    algorithm: weighted_scoring
    formula: |
      schedule = effective BillingRateSchedule for (crew's event, crew's owning utility) covering claim_date
      method = schedule.per_diem_method   # copied onto claim.method_applied
      day_factor = 1.0 if day_factor_type == FULL else 0.75   # TRAVEL
      meal_factor = (3 - meals_provided_count) / 3
      STANDARD: raw = member_count * schedule.per_diem_rate_cents * day_factor * meal_factor
      ACTUAL:   raw = min(receipts_total_cents,
                          round_half_up(member_count * schedule.per_diem_rate_cents * 1.5))
      # rounding order (pinned): amount_cents = round_half_up(raw) computed PER
      # CLAIM-DAY; downstream sums add already-rounded claim amounts. Summing raw
      # values first and rounding once is FORBIDDEN (it can differ by cents).
      amount_cents = round_half_up(raw)
    input_set: "The new PerDiemClaim; the effective schedule; crew.roster_size (member_count validation)"
    constants:
      TRAVEL_DAY_FACTOR: 0.75
      ACTUAL_CAP_MULTIPLIER: 1.5
    precision: "whole cents, round_half_up per claim-day before any summation"
    variants:
      - name: STANDARD
        when: "schedule.per_diem_method == STANDARD"
        difference: "Formula-based; ignores receipts_total_cents even if provided"
      - name: ACTUAL
        when: "schedule.per_diem_method == ACTUAL"
        difference: "Receipts-based with a per-member cap of 1.5x the standard rate; receipts_total_cents required (ERR_INVALID_REQUEST when absent)"

  - name: invoice_totals
    trigger: "Invoice creation (provisional variant) and Invoice submit (final variant)"
    algorithm: aggregation
    formula: |
      period = [billing_period_start, billing_period_end] (both inclusive, by work_date / claim_date)
      FINAL variant (submit):
        labor_subtotal_cents  = sum of certified_amount_cents over TimeSheets of the
                                request's crews with status CERTIFIED, work_date in
                                period, billed_invoice_id IS NULL
        per_diem_subtotal_cents = sum of amount_cents over PerDiemClaims of the
                                request's crews with status APPROVED, claim_date in
                                period, not yet swept by a non-VOID invoice
        # rounding order (pinned): both inputs are sums of already-rounded
        # integers; no further rounding occurs at the invoice level.
      PROVISIONAL variant (creation):
        provisional labor part  = FINAL labor sum PLUS crew_daily_billing evaluated
                                  on reported minutes for timesheets in SUBMITTED
                                  status (uncertified rows estimated)
        provisional per-diem part = FINAL per-diem sum PLUS claims in SUBMITTED status
      subtotal = labor + per_diem   (variant-dependent)
      fee = mobilization_fee(subtotal)
      total = subtotal + fee
    input_set: "TimeSheets/PerDiemClaims of the request's crews filtered by status and period; the invoice's pinned rate_schedule for the fee tiers and provisional pricing"
    precision: "whole cents; inputs pre-rounded"
    variants:
      - name: provisional
        when: "Invoice creation (DRAFT)"
        difference: "Includes SUBMITTED-but-uncertified timesheets (priced by crew_daily_billing on reported minutes) and SUBMITTED per-diem claims — an estimate that legitimately diverges from the final figure on identical raw rows"
      - name: final
        when: "Invoice submit"
        difference: "CERTIFIED timesheets and APPROVED claims only; sweeps and locks rows via billed_invoice_id"

  - name: mobilization_fee
    trigger: "invoice_totals (both variants)"
    algorithm: threshold
    formula: |
      # Circular-looking dependency, pinned evaluation order:
      #   (1) compute direct subtotal S (labor + per-diem, pre-fee)
      #   (2) select fee tier: the LAST tier t with t.min_subtotal_cents <= S
      #   (3) fee = round_half_up(S * t.fee_bps / 10000)
      #   (4) total = S + fee
      # The tier is keyed on the PRE-FEE subtotal S, never on the post-fee
      # total — this is what makes the value well-defined.
      tiers = schedule.mobilization_fee_tiers sorted by min_subtotal_cents ASC
      t = last tier with min_subtotal_cents <= S   (tiers[0].min MUST be 0)
      fee = round_half_up(S * t.fee_bps / 10000)
    input_set: "The direct subtotal S and the pinned schedule's tier table"
    precision: "whole cents, round_half_up"

  - name: crew_count_derivation
    trigger: "Crew create / withdraw / confirm_arrival / release / suspend / briefing acknowledge (any crew status change)"
    algorithm: aggregation
    formula: |
      committed_crew_count = count of Crew rows with request_id = R and
                             mobility_status in {COMMITTED, ARRIVED, DEMOBILIZING}
      deployable_crew_count = count of Crew rows with request_id = R and
                             mobility_status = ARRIVED and readiness_status = CLEARED_TO_WORK
      # tie-break / ordering: counts only — no ordering inputs; UUIDs never used
    input_set: "All Crew rows of the request, any status"
    precision: "integers"

  - name: lodging_occupancy
    trigger: "LodgingAssignment create / cancel / demobilization checkout"
    algorithm: aggregation
    formula: |
      assigned_rooms = sum of room_count over assignments of the block with
                       status in {RESERVED, OCCUPIED}
      create check: assigned_rooms + new.room_count <= total_rooms
      # boundary: equality is ALLOWED (<=); exceeding by any amount rejected
    input_set: "All LodgingAssignment rows of the block in {RESERVED, OCCUPIED}"
    precision: "integers"

  - name: lodging_overlap_check
    trigger: "LodgingAssignment create"
    algorithm: interval_merge
    formula: |
      # Half-open stay semantics: assignment occupies [check_in_date, check_out_date)
      For the SAME crew, a new assignment conflicts with an existing
      non-cancelled assignment iff:
        new.check_in_date < existing.check_out_date
        AND existing.check_in_date < new.check_out_date
      # adjacency is allowed: new.check_in_date == existing.check_out_date does NOT conflict
    input_set: "Existing non-cancelled LodgingAssignments of the crew"
    precision: "ISO dates, day granularity"

  - name: intake_posture
    trigger: "AssistanceRequest create / submit / accept / decline / cancel; event activate / begin_demobilization"
    algorithm: threshold
    formula: |
      if event.status in {DEMOBILIZING, CLOSED}: SEALED
      elif event.open_request_count >= 3: RESTRICTED   # boundary: exactly 3 flips to RESTRICTED
      else: ACCEPTING
      open_request_count = count of requests with status in {SUBMITTED, COUNTERED}
    input_set: "The event's AssistanceRequest rows"
    constants:
      OPEN_REQUEST_RESTRICTION_THRESHOLD: 3
    precision: "integers"

  - name: aar_cost_variance
    trigger: "AfterActionReport submit"
    algorithm: aggregation
    formula: |
      as_certified_total_cents = sum over the event's requests of
                                 (CERTIFIED timesheet amounts + APPROVED per-diem amounts)
                                 # direct cost view; mobilization fee excluded
      as_billed_total_cents    = sum of final_total_cents over invoices in {APPROVED, PAID}
                                 # billed view; fee included; disputed-but-unresolved excluded
      variance_cents = as_billed_total_cents - as_certified_total_cents
      total_crew_days = count of CERTIFIED timesheets with day_classification == WORK
    input_set: "All requests/timesheets/claims/invoices of the event in the pinned statuses"
    precision: "whole cents"
    variants:
      - name: as_certified
        when: "Audit view of event cost"
        difference: "Grounded in certified field data; excludes mobilization fee and any unresolved billing"
      - name: as_billed
        when: "Contractual view of event cost"
        difference: "Grounded in approved invoices; includes mobilization fee — the two views legitimately differ on identical underlying data"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership scope: entity-backed caller's X-User-ID matches the resource's owning scope (host utility for host actions; responding utility for responding actions; crew id for CrewSupervisor)"
    error_id: ERR_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right (path first, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource's current state permits the requested transition, including event/request posture states that act as preconditions"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Safety gating: crew readiness must be CLEARED_TO_WORK for timesheet certification; safety-hold side effects must have settled"
    error_id: ERR_CREW_NOT_CLEARED
    http_status: 409
    applies_to: ["POST /mutual-aid/timesheets/{id}/certify", "POST /mutual-aid/timesheets/{id}/recertify"]

  - priority: 7
    category: business_temporal
    check: "Time windows vs logical clock: mobilization deadline (arrival), 14-day certification window, 30-day invoice submission window"
    error_id: "ERR_MOBILIZATION_DEADLINE_PASSED | ERR_CERTIFICATION_WINDOW_CLOSED | ERR_INVOICE_WINDOW_CLOSED"
    http_status: 409
    applies_to: ["POST /mutual-aid/crews/{id}/confirm_arrival", "POST /mutual-aid/timesheets/{id}/certify", "POST /mutual-aid/timesheets/{id}/recertify", "POST /mutual-aid/invoices/{id}/submit"]

  - priority: 8
    category: business_referential
    check: "Cross-references are mutually consistent: schedule belongs to (event, responding utility); lodging block belongs to the crew's event; briefing event matches crew's event; invoice schedule matches request's (event, utility)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 409
    applies_to: ["POST /mutual-aid/crews", "POST /mutual-aid/safety-briefings", "POST /mutual-aid/lodging-assignments", "POST /mutual-aid/invoices"]

  - priority: 9
    category: business_constraint
    check: "Uniqueness, capacity, overlap, posture, selector and segregation constraints; OCC stale-version check on schedule publish"
    error_id: "ERR_EVENT_NOT_ACCEPTING_REQUESTS | ERR_SCHEDULE_WINDOW_OVERLAP | ERR_STALE_SCHEDULE_VERSION | ERR_SCHEDULE_NOT_PUBLISHED | ERR_NO_EFFECTIVE_SCHEDULE | ERR_SUPERSEDED_SCHEDULE | ERR_LODGING_CAPACITY_EXCEEDED | ERR_LODGING_OVERLAP | ERR_DUPLICATE_TIMESHEET | ERR_DUPLICATE_CLAIM | ERR_INVOICE_EXISTS | ERR_AAR_EXISTS | ERR_SEGREGATION_OF_DUTIES"
    http_status: "409 (412 for ERR_STALE_SCHEDULE_VERSION)"
    applies_to: "create and transition endpoints as wired in §1.5/§1.2"

  - priority: 10
    category: business_fiscal
    check: "Amount sanity and sufficiency: positive amounts, payment exactly equals outstanding, dispute within outstanding, credit within disputed amount, invoice non-empty"
    error_id: "ERR_INVALID_AMOUNT | ERR_PAYMENT_AMOUNT_MISMATCH | ERR_DISPUTE_AMOUNT_INVALID | ERR_CREDIT_EXCEEDS_DISPUTED | ERR_EMPTY_INVOICE"
    http_status: "400 for ERR_INVALID_AMOUNT; 409 otherwise"
    applies_to: ["POST /mutual-aid/invoices/{id}/mark_paid", "POST /mutual-aid/invoices/{id}/dispute", "POST /mutual-aid/invoices/{id}/propose_credit", "POST /mutual-aid/invoices/{id}/arbitrate", "POST /mutual-aid/invoices/{id}/submit"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/mutual-aid/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default (before any call): 2026-05-01T00:00:00Z exactly; the clock never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no other mutation"]

  # --- UtilityCompany ---
  - method: POST
    path: "/mutual-aid/utility-companies"
    description: "Register a participating utility company"
    roles: [ProgramAdmin]
    code: 201
    input: [name, company_code, role_capability, home_region]
    output: UtilityCompany
    side_effects: ["ERR_INVALID_REQUEST on duplicate company_code"]

  - method: GET
    path: "/mutual-aid/utility-companies/{id}"
    description: "Get one company"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: UtilityCompany
    side_effects: []

  # --- MutualAidEvent ---
  - method: POST
    path: "/mutual-aid/events"
    description: "Declare a mutual-aid event"
    roles: [ProgramAdmin]
    code: 201
    input: [event_name, host_utility_id, event_type, declared_start_date, premium_window_start, premium_window_end, mobilization_deadline]
    output: MutualAidEvent
    side_effects: ["status=OPEN; intake_posture=ACCEPTING"]

  - method: GET
    path: "/mutual-aid/events/{id}"
    description: "Get one event"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: MutualAidEvent
    side_effects: []

  - method: GET
    path: "/mutual-aid/events"
    description: "List events"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["host_utility_id?", "status?"]
    output: "MutualAidEvent[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/events/{id}/activate"
    description: "OPEN -> ACTIVE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MutualAidEvent
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/mutual-aid/events/{id}/begin_demobilization"
    description: "ACTIVE -> DEMOBILIZING; anchors the 30-day invoice window and seals intake"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: MutualAidEvent
    side_effects: ["status -> DEMOBILIZING; demobilized_at set; intake_posture -> SEALED; increments MutualAidEvent.version by 1"]

  - method: POST
    path: "/mutual-aid/events/{id}/close"
    description: "DEMOBILIZING -> CLOSED; requires ACCEPTED after-action report and all invoices in {PAID, VOID}"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MutualAidEvent
    side_effects: ["status -> CLOSED; ERR_EVENT_CLOSE_BLOCKED otherwise"]

  # --- BillingRateSchedule ---
  - method: POST
    path: "/mutual-aid/billing-rate-schedules"
    description: "Create a rate schedule for (event, caller's responding utility); responding_utility_id is set from X-User-ID"
    roles: [RespondingCoordinator]
    code: 201
    input: [event_id, effective_start_date, effective_end_date, rate_lines, storm_premium_bps, per_diem_rate_cents, per_diem_method, mobilization_fee_tiers, "ot_multiplier_bps?", "dt_multiplier_bps?", "ot_threshold_minutes?", "dt_threshold_minutes?", "supersedes_schedule_id?"]
    output: BillingRateSchedule
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/mutual-aid/billing-rate-schedules/{id}"
    description: "Get one schedule"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: BillingRateSchedule
    side_effects: []

  - method: GET
    path: "/mutual-aid/billing-rate-schedules"
    description: "List schedules"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["event_id?", "responding_utility_id?", "supersedes_schedule_id?", "status?"]
    output: "BillingRateSchedule[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/billing-rate-schedules/{id}/publish"
    description: "DRAFT -> PUBLISHED; optional supersede with OCC on the superseded schedule's version"
    roles: [RespondingCoordinator]
    code: 200
    input: ["expected_superseded_schedule_version?"]
    output: BillingRateSchedule
    side_effects: ["status -> PUBLISHED; published_at set; if supersedes_schedule_id set: predecessor -> SUPERSEDED and BillingRateSchedule(predecessor).version increments by 1; closed-interval overlap check vs non-superseded {PUBLISHED, LOCKED} schedules"]

  - method: POST
    path: "/mutual-aid/billing-rate-schedules/{id}/lock"
    description: "PUBLISHED -> LOCKED (host locks the billing basis before invoicing)"
    roles: [HostFinance]
    code: 200
    input: []
    output: BillingRateSchedule
    side_effects: ["status -> LOCKED"]

  # --- AssistanceRequest ---
  - method: POST
    path: "/mutual-aid/assistance-requests"
    description: "Host creates a resource-typed request to a responding utility"
    roles: [HostCoordinator]
    code: 201
    input: [event_id, responding_utility_id, requested_crews, required_minimum_crews, earliest_start_date, latest_end_date]
    output: AssistanceRequest
    side_effects: ["status=DRAFT; ERR_EVENT_NOT_ACCEPTING_REQUESTS unless event.intake_posture == ACCEPTING; ERR_INVALID_REQUEST when earliest_start_date > latest_end_date"]

  - method: GET
    path: "/mutual-aid/assistance-requests/{id}"
    description: "Get one request"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: []

  - method: GET
    path: "/mutual-aid/assistance-requests"
    description: "List requests"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["event_id?", "responding_utility_id?", "status?"]
    output: "AssistanceRequest[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/assistance-requests/{id}/submit"
    description: "DRAFT -> SUBMITTED; from COUNTERED acts as amended resubmission (amended_crews required) and bumps amendment_round"
    roles: [HostCoordinator]
    code: 200
    input: ["amended_crews?", "amended_required_minimum?"]
    output: AssistanceRequest
    side_effects: ["status -> SUBMITTED; from COUNTERED: amendment_round += 1 and terms replaced; event.open_request_count and intake_posture recomputed"]

  - method: POST
    path: "/mutual-aid/assistance-requests/{id}/counter"
    description: "SUBMITTED -> COUNTERED with counter-terms"
    roles: [RespondingCoordinator]
    code: 200
    input: [counter_crews, "counter_note?"]
    output: AssistanceRequest
    side_effects: ["status -> COUNTERED; counter_terms recorded"]

  - method: POST
    path: "/mutual-aid/assistance-requests/{id}/accept"
    description: "SUBMITTED -> ACCEPTED; requires a PUBLISHED or LOCKED schedule for (event, responding utility)"
    roles: [RespondingCoordinator]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: ["status -> ACCEPTED; open_request_count/intake_posture recomputed; ERR_SCHEDULE_NOT_PUBLISHED when no published/locked schedule"]

  - method: POST
    path: "/mutual-aid/assistance-requests/{id}/decline"
    description: "SUBMITTED|COUNTERED -> DECLINED"
    roles: [RespondingCoordinator]
    code: 200
    input: ["reason?"]
    output: AssistanceRequest
    side_effects: ["status -> DECLINED; open_request_count/intake_posture recomputed"]

  - method: POST
    path: "/mutual-aid/assistance-requests/{id}/cancel"
    description: "DRAFT|SUBMITTED|COUNTERED -> CANCELLED"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: ["status -> CANCELLED; open_request_count/intake_posture recomputed"]

  # --- Crew ---
  - method: POST
    path: "/mutual-aid/crews"
    description: "Responding utility commits a crew (roster + equipment inventory) to a request"
    roles: [RespondingCoordinator]
    code: 201
    input: [request_id, crew_type, home_base, roster, equipment_units]
    output: Crew
    side_effects: ["mobility_status=COMMITTED; readiness_status=AWAITING_BRIEFING; owning_utility_id from X-User-ID; request must be ACCEPTED/IN_PROGRESS/FULFILLED; request.committed_crew_count recomputed; ERR_INVALID_REQUEST on empty roster"]

  - method: GET
    path: "/mutual-aid/crews/{id}"
    description: "Get one crew"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: GET
    path: "/mutual-aid/crews"
    description: "List crews"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["request_id?", "owning_utility_id?", "mobility_status?", "readiness_status?"]
    output: "Crew[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/crews/{id}/confirm_arrival"
    description: "Host confirms crew arrival (COMMITTED -> ARRIVED); fires arrival cascade"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: Crew
    side_effects: ["arrived_at set; RESERVED lodging assignments -> OCCUPIED; request may go ACCEPTED->IN_PROGRESS and/or IN_PROGRESS->FULFILLED; ERR_MOBILIZATION_DEADLINE_PASSED after event.mobilization_deadline"]

  - method: POST
    path: "/mutual-aid/crews/{id}/release"
    description: "Host releases crew (ARRIVED -> DEMOBILIZING); fires demobilization cascade"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: Crew
    side_effects: ["released_at set; readiness -> RELEASED; OCCUPIED lodging -> CHECKED_OUT with actual_check_out_date; block.assigned_rooms and request deployable_crew_count recomputed"]

  - method: POST
    path: "/mutual-aid/crews/{id}/complete_return"
    description: "Responding utility confirms return (DEMOBILIZING -> RETURNED); last crew out releases the request"
    roles: [RespondingCoordinator]
    code: 200
    input: []
    output: Crew
    side_effects: ["returned_at set; when all request crews terminal: request -> RELEASED"]

  - method: POST
    path: "/mutual-aid/crews/{id}/withdraw"
    description: "COMMITTED -> WITHDRAWN (pre-arrival pull-back)"
    roles: [RespondingCoordinator]
    code: 200
    input: []
    output: Crew
    side_effects: ["request committed/deployable counts recomputed; possible FULFILLED -> IN_PROGRESS demotion"]

  - method: POST
    path: "/mutual-aid/crews/{id}/suspend"
    description: "Safety suspension (readiness CLEARED_TO_WORK -> SAFETY_HOLD); fires depth-3 safety cascade"
    roles: [HostSafetyOfficer]
    code: 200
    input: ["reason?"]
    output: Crew
    side_effects: ["last_suspended_at set; crew's SUBMITTED timesheets and per-diem claims -> HELD; request deployable recompute and possible FULFILLED -> IN_PROGRESS demotion"]

  # --- SafetyBriefing ---
  - method: POST
    path: "/mutual-aid/safety-briefings"
    description: "Conduct a host-rules safety briefing for a crew (created in CONDUCTED)"
    roles: [HostSafetyOfficer]
    code: 201
    input: [crew_id, event_id, conductor_operator_ref, host_rules_version, topics]
    output: SafetyBriefing
    side_effects: ["conducted_at = clock; crew readiness AWAITING_BRIEFING|SAFETY_HOLD -> BRIEFED; ERR_REFERENTIAL_INTEGRITY when event_id != crew's event"]

  - method: GET
    path: "/mutual-aid/safety-briefings/{id}"
    description: "Get one briefing"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: SafetyBriefing
    side_effects: []

  - method: GET
    path: "/mutual-aid/safety-briefings"
    description: "List briefings"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["crew_id?", "event_id?", "status?"]
    output: "SafetyBriefing[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/safety-briefings/{id}/acknowledge"
    description: "Crew supervisor acknowledges briefing (CONDUCTED -> ACKNOWLEDGED); crew BRIEFED -> CLEARED_TO_WORK"
    roles: [CrewSupervisor]
    code: 200
    input: [supervisor_operator_ref]
    output: SafetyBriefing
    side_effects: ["acknowledged_at set; crew readiness -> CLEARED_TO_WORK; hold-release cascade when returning from SAFETY_HOLD; ERR_SEGREGATION_OF_DUTIES when supervisor_operator_ref == conductor_operator_ref"]

  # --- TimeSheet ---
  - method: POST
    path: "/mutual-aid/timesheets"
    description: "Crew supervisor drafts a daily timesheet"
    roles: [CrewSupervisor]
    code: 201
    input: [crew_id, work_date, day_classification, "reported_work_minutes?", "reported_travel_minutes?"]
    output: TimeSheet
    side_effects: ["status=DRAFT; ERR_DUPLICATE_TIMESHEET on (crew_id, work_date) reuse"]

