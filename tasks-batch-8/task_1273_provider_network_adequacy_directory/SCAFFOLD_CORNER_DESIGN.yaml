scaffold_corner_design:
  # =================================================================
  # Section: entities — creation, defaults, computed/system fields, 404s
  # =================================================================
  - section: entities
    instances:
      - name: region_creation_persists_all_fields
        claim_type: creation
        grounds: [entities.ServiceRegion]
        distinguishing_aspect: "POST /network/regions returns 201 with every input field echoed plus system id/created_at/version=1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/regions", payload: { county_fips: "06045", name: "Orange", geo_class: "SUBURBAN", enrolled_member_count: 777 }, as: NetworkManager, captures: { reg: "$.data.id", reg_v: "$.data.version" } }
          assert:
            - "response 201; data.county_fips == '06045', geo_class == 'SUBURBAN', enrolled_member_count == 777"
            - "data.version == 1 and data.id is a server-minted UUID"
            - "GET /network/regions/${reg} returns identical field values"

      - name: location_panel_status_defaults_to_open
        claim_type: defaults
        grounds: [entities.PracticeLocation.fields.panel_status]
        distinguishing_aspect: "Omitting optional panel_status on location creation applies the declared default OPEN."
        test_recipe:
          setup: ["region + provider exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06047", name: "Placer", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000031", legal_name: "P31", specialty: "PRIMARY_CARE", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
          trigger:
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "31 First St", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { loc_ps: "$.data.panel_status" } }
          assert:
            - "created location has panel_status == OPEN (default applied)"

      - name: provider_future_effective_date_starts_pending_load
        claim_type: initial_state
        grounds: [entities.Provider.fields.status, state_machines.Provider]
        distinguishing_aspect: "contract_effective_date after the logical clock yields initial status PENDING_LOAD; on/before yields EFFECTIVE — new-provider effective-date management."
        test_recipe:
          setup: ["clock at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/providers", payload: { npi: "1000000033", legal_name: "Future P", specialty: "PRIMARY_CARE", contract_effective_date: "2026-09-01" }, as: NetworkManager, captures: { p_future: "$.data.status" } }
            - { call: "POST /network/providers", payload: { npi: "1000000034", legal_name: "Now P", specialty: "PRIMARY_CARE", contract_effective_date: "2026-05-01" }, as: NetworkManager, captures: { p_now: "$.data.status" } }
          assert:
            - "future-dated provider status == PENDING_LOAD"
            - "same-day provider status == EFFECTIVE (clock date >= contract_effective_date, inclusive boundary)"

      - name: listing_computed_fields_initialized_on_create
        claim_type: computed_fields
        grounds: [entities.DirectoryListing.fields.ghost_strike_count, entities.DirectoryListing.fields.suppress_reason]
        distinguishing_aspect: "New listing starts DRAFT with ghost_strike_count == 0, suppress_reason == NONE, has_confirmed_data_error == false; client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["region + EFFECTIVE provider + location exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06049", name: "Plumas", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000035", legal_name: "P35", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "35 Second St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { loc: "$.data.id" } }
          trigger:
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "L35", phone: "555-0135", accepts_new_patients: true }, as: NetworkManager, captures: { l_st: "$.data.status", l_g: "$.data.ghost_strike_count", l_sr: "$.data.suppress_reason" } }
          assert:
            - "status == DRAFT, ghost_strike_count == 0, suppress_reason == NONE, has_confirmed_data_error == false"

      - name: listing_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_LISTING_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_LISTING_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "GET /network/listings/00000000-0000-4000-8000-000000000000", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "404 with error_id == ERR_LISTING_NOT_FOUND"

      - name: region_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_REGION_NOT_FOUND]"]
        distinguishing_aspect: "Same not-found behavior on the regions collection."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "GET /network/regions/00000000-0000-4000-8000-000000000001", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "404 with error_id == ERR_REGION_NOT_FOUND"

      - name: deficiency_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_DEFICIENCY_NOT_FOUND]"]
        distinguishing_aspect: "Same not-found behavior on the deficiencies collection."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "GET /network/deficiencies/00000000-0000-4000-8000-000000000002", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "404 with error_id == ERR_DEFICIENCY_NOT_FOUND"

      - name: correction_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CORRECTION_NOT_FOUND]"]
        distinguishing_aspect: "Same not-found behavior on the corrections collection."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "GET /network/corrections/00000000-0000-4000-8000-000000000003", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "404 with error_id == ERR_CORRECTION_NOT_FOUND"

      - name: result_rows_are_immutable_snapshots
        claim_type: immutability
        grounds: [entities.RegionSpecialtyResult]
        distinguishing_aspect: "RegionSpecialtyResult (common_fields: false) has no update endpoint and no version field; mutating the network after finalize does not alter the stored snapshot."
        test_recipe:
          setup:
            - "Region enrolled 2400, CARDIOLOGY std 1200, 1 provider/location/listing LISTED; E1 finalized (ratio 2400 DEFICIENT); then a second provider published"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06051", name: "Riverside", geo_class: "URBAN", enrolled_member_count: 2400 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000037", legal_name: "P37", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { p1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${p1}", region_id: "${reg}", address_line: "37 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { l1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${p1}", location_id: "${l1}", specialty: "CARDIOLOGY", display_name: "L37", phone: "555-0137", accepts_new_patients: true }, as: NetworkManager, captures: { s1: "$.data.id" } }
            - { call: "POST /network/listings/${s1}/publish", as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "SNAP", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000038", legal_name: "P38", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { p2: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${p2}", region_id: "${reg}", address_line: "38 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { l2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${p2}", location_id: "${l2}", specialty: "CARDIOLOGY", display_name: "L38", phone: "555-0138", accepts_new_patients: true }, as: NetworkManager, captures: { s2: "$.data.id" } }
            - { call: "POST /network/listings/${s2}/publish", as: NetworkManager }
          trigger:
            - { call: "GET /network/results", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { r_pc: "$.data[0].provider_count", r_overall: "$.data[0].overall_status" } }
          assert:
            - "snapshot still reads provider_count == 1 and overall_status == DEFICIENT after the second provider went live"
            - "RegionSpecialtyResult exposes no version field and no PUT/PATCH endpoint exists for it"

      - name: fk_reverse_listings_filtered_by_provider
        claim_type: parent_relationships
        grounds: [entities.DirectoryListing.fields.provider_id, endpoints]
        distinguishing_aspect: "GET /network/listings?provider_id returns exactly that provider's listings (filtered-list FK reverse channel)."
        test_recipe:
          setup: ["two providers each with one listing"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06053", name: "Solano", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000039", legal_name: "P39", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { p1: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000040", legal_name: "P40", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { p2: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${p1}", region_id: "${reg}", address_line: "39 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { l1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${p2}", region_id: "${reg}", address_line: "40 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { l2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${p1}", location_id: "${l1}", specialty: "CARDIOLOGY", display_name: "L39", phone: "555-0139", accepts_new_patients: true }, as: NetworkManager, captures: { s1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${p2}", location_id: "${l2}", specialty: "CARDIOLOGY", display_name: "L40", phone: "555-0140", accepts_new_patients: true }, as: NetworkManager, captures: { s2: "$.data.id" } }
          trigger:
            - { call: "GET /network/listings", payload: { provider_id: "${p1}" }, as: NetworkManager, captures: { got: "$.data[0].id" } }
          assert:
            - "exactly one row returned and its id == ${s1} (no leakage of ${p2}'s listing)"

  # =================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, cascades
  # =================================================================
  - section: state_machines
    instances:
      - name: terminated_provider_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Provider, "errors[ERR_PROVIDER_INVALID_TRANSITION]"]
        distinguishing_aspect: "From terminal TERMINATED, every PATCH to_status is rejected with ERR_PROVIDER_INVALID_TRANSITION and no cascade fires."
        test_recipe:
          setup: ["provider TERMINATED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000041", legal_name: "P41", specialty: "PRIMARY_CARE", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "TERMINATED" }, as: NetworkManager }
          trigger:
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "SUSPENDED" }, as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "409 ERR_PROVIDER_INVALID_TRANSITION; provider remains TERMINATED"

      - name: publish_on_already_listed_listing_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DirectoryListing, "errors[ERR_LISTING_INVALID_TRANSITION]"]
        distinguishing_aspect: "Idempotency guard: publish is only valid from DRAFT; a second publish on a LISTED listing fails with ERR_LISTING_INVALID_TRANSITION."
        test_recipe:
          setup: ["one LISTED listing"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06055", name: "Sonoma", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000043", legal_name: "P43", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "43 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "L43", phone: "555-0143", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager }
          trigger:
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "409 ERR_LISTING_INVALID_TRANSITION on second publish"

      - name: cycle_advance_from_closed_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AttestationCycle, "errors[ERR_CYCLE_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal for cycles: a fourth advance fails ERR_CYCLE_INVALID_STATE."
        test_recipe:
          setup: ["cycle advanced OPEN -> OUTREACH -> CLOSED (no listings, so sweep touches nothing)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "T1", open_date: "2026-05-01", due_date: "2026-05-10", outreach_close_date: "2026-05-20" }, as: NetworkManager, captures: { cyc: "$.data.id" } }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager, captures: { c_st: "$.data.status" } }
          trigger:
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "cycle reached CLOSED; fourth advance rejected 409 ERR_CYCLE_INVALID_STATE"

      - name: cycle_close_sweep_suppresses_nonresponsive_listings
        claim_type: side_effect_execution
        grounds: [state_machines.AttestationCycle.OUTREACH_to_CLOSED, state_machines.AttestationRecord.PENDING_to_NON_RESPONSIVE]
        distinguishing_aspect: "Conditional cascade: only still-LISTED listings of PENDING records are SUPPRESSED with ATTESTATION_FAILURE; the listing whose provider attested stays LISTED; outreach_attempts incremented exactly once by the OPEN->OUTREACH hop."
        test_recipe:
          setup:
            - "Two LISTED listings (providers PA, PB); cycle opened -> 2 PENDING records; PA attests (record ATTESTED); advance to OUTREACH at due date (PB record outreach_attempts 0 -> 1); advance to CLOSED at outreach_close"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06057", name: "Stanislaus", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000045", legal_name: "PA", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { pa: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000046", legal_name: "PB", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { pb: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${pa}", region_id: "${reg}", address_line: "45 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { la: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${pb}", region_id: "${reg}", address_line: "46 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { lb: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${pa}", location_id: "${la}", specialty: "CARDIOLOGY", display_name: "LA", phone: "555-0145", accepts_new_patients: true }, as: NetworkManager, captures: { sa: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${pb}", location_id: "${lb}", specialty: "CARDIOLOGY", display_name: "LB", phone: "555-0146", accepts_new_patients: true }, as: NetworkManager, captures: { sb: "$.data.id" } }
            - { call: "POST /network/listings/${sa}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${sb}/publish", as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "T2", open_date: "2026-05-01", due_date: "2026-05-10", outreach_close_date: "2026-05-20" }, as: NetworkManager, captures: { cyc: "$.data.id" } }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager }
            - { call: "GET /network/attestation-records", payload: { cycle_id: "${cyc}", listing_id: "${sa}" }, as: NetworkManager, captures: { reca: "$.data[0].id" } }
            - { call: "GET /network/attestation-records", payload: { cycle_id: "${cyc}", listing_id: "${sb}" }, as: NetworkManager, captures: { recb: "$.data[0].id" } }
            - { call: "POST /network/attestation-records/${reca}/respond", payload: { data_accurate: true }, as: ProviderRep, as_user_id: "${pa}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager }
            - { call: "GET /network/attestation-records/${recb}", as: NetworkManager, captures: { recb_att: "$.data.outreach_attempts" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager, captures: { c_st: "$.data.status", c_nonr: "$.data.non_responsive_count", c_pend: "$.data.pending_count" } }
            - { call: "GET /network/listings/${sb}", as: NetworkManager, captures: { sb_st: "$.data.status", sb_sr: "$.data.suppress_reason" } }
            - { call: "GET /network/listings/${sa}", as: NetworkManager, captures: { sa_st: "$.data.status" } }
          assert:
            - "PB record outreach_attempts == 1 after the OUTREACH hop"
            - "after close: cycle CLOSED, non_responsive_count == 1, pending_count == 0"
            - "PB listing SUPPRESSED with suppress_reason == ATTESTATION_FAILURE"
            - "PA listing (attested) remains LISTED — conditional cascade skipped it"

      - name: late_attestation_then_reinstate_after_cycle_close
        claim_type: valid_transition
        grounds: [state_machines.AttestationRecord.NON_RESPONSIVE_to_ATTESTED, state_machines.DirectoryListing.SUPPRESSED_to_LISTED]
        distinguishing_aspect: "Provider outreach continues past cycle close: a NON_RESPONSIVE record accepts a late response (cycle CLOSED), which then satisfies the ATTESTATION_FAILURE reinstate guard (responded_at > suppressed_at)."
        test_recipe:
          setup:
