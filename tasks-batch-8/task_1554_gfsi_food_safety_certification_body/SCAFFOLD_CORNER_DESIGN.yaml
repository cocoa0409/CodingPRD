              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 1 }
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
            - call: "GET /certification-body/audits/${audit_id}/certificate"
              as: SchemeAdmin
              captures: { cert_id: "$.data[0].id", cert_v: "$.data[0].version" }
            - call: "POST /certification-body/certificates/${cert_id}/scope-changes"
              payload: { requested_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }, { category_code: "DAIRY", risk_tier: "HIGH" }], reason: "adding dairy line", expected_certificate_version: "${cert_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /certification-body/scope-changes/${sc_id}/decision"
              payload: { outcome: "APPROVED" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
            - call: "GET /certification-body/certificates/${cert_id}"
              as: SchemeAdmin
              captures: { cert_v_after: $.data.version }
            - call: "GET /certification-body/certificates/${cert_id}/directory-listing"
              as: SchemeAdmin
              captures: { scope_summary: "$.data[0].scope_summary" }
          assert:
            - "ScopeChange.${sc_id}.status == APPROVED; decided_by == ${dm_id}"
            - "Certificate.${cert_id}.product_categories == [BAKERY/STANDARD, DAIRY/HIGH]; version == 3 (1 at issuance, +1 at scope-change create, +1 at approval)"
            - "DirectoryListing.scope_summary == 'BAKERY,DAIRY' (category codes sorted ASC, comma-joined) — derived field reconciled with the new source"

      - name: filter_applications_by_status
        claim_type: pagination_with_filtering
        grounds: [endpoints.GET_/certification-body/applications]
        distinguishing_aspect: "Filter + pagination interact: with one SUBMITTED (SQF) and one DRAFT (BRC) application, ?status=DRAFT returns only the BRC one and ?status=SUBMITTED only the SQF one; total_count reflects the filter, not the table size."
        test_recipe:
          setup: ["SQF and BRC schemes; one client with an application per scheme; the SQF application SUBMITTED, the BRC application left DRAFT"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/schemes"
              payload: { code: "BRC", name: "BRCGS Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { brc_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /certification-body/applications/${app1_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${brc_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "baked goods (BRC)" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app2_id: $.data.id }
          trigger:
            - call: "GET /certification-body/applications?status=SUBMITTED"
              as: SchemeAdmin
            - call: "GET /certification-body/applications?status=DRAFT"
              as: SchemeAdmin
          assert:
            - "?status=SUBMITTED: total_count == 1, single item == ${app1_id}"
            - "?status=DRAFT: total_count == 1, single item == ${app2_id}"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: certificate_visible_immediately_after_decision
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/certification-body/audits/{id}/decision"]
        distinguishing_aspect: "Immediate consistency: the GRANT decision's cascade (certificate + listing + next audit) is fully visible in the very next reads — no eventual-consistency lag."
        test_recipe:
          setup: ["SQF scheme; accepted application; audit assigned, started, report submitted"]
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "POST /certification-body/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: SchemeAdmin
            - call: "POST /certification-body/audits/${audit_id}/start"
              as: Auditor
              as_user_id: "${auditor_id}"
            - call: "POST /certification-body/audits/${audit_id}/submit-report"
              payload: { actual_days: 1 }
              as: Auditor
              as_user_id: "${auditor_id}"
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/decision"
              payload: { outcome: "GRANT" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
            - call: "GET /certification-body/audits/${audit_id}/certificate"
              as: SchemeAdmin
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /certification-body/certificates/${cert_id}/directory-listing"
              as: SchemeAdmin
              captures: { listing_status: "$.data[0].status" }
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
          assert:
            - "the decision response itself carries status DECIDED, resolved_score 100, decision_outcome GRANT"
            - "immediately after: GET /audits/{id}/certificate returns 1 certificate ACTIVE; its directory-listing is LISTED; GET /applications/{id}/audits returns 2 audits (the SURVEILLANCE successor exists)"

  # ===========================================================================
  # Excluded stubs — already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: nc_overdue_sweep_transition
        claim_type: side_effect_execution
        grounds: [state_machines.Nonconformity.OPEN_to_OVERDUE]
        excluded_because:
          difficulty_instance: overdue_nc_suspends_certificate_unlists_directory
          rationale: "The OVERDUE transition and its full cascade are asserted hop-by-hop in the named §1.8 instance."

      - name: certificate_reinstate_after_nc_closure
        claim_type: valid_transition
        grounds: [state_machines.Certificate.SUSPENDED_to_ACTIVE]
        excluded_because:
          difficulty_instance: certificate_reinstate_requires_all_nonconformities_closed
          rationale: "The guarded reinstate (both failure and success polarity) is the named §1.8 instance."

      - name: appeal_on_active_certificate_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Appeal, "errors[ERR_INVALID_CERTIFICATE_STATE]"]
        excluded_because:
          difficulty_instance: appeal_filing_requires_suspended_or_withdrawn_certificate
          rationale: "Filing against an ACTIVE certificate is the negative polarity of the named §1.8 instance."

      - name: appeal_overturn_reinstatement_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Appeal.FILED_to_OVERTURNED]
        excluded_because:
          difficulty_instance: appeal_overturn_reinstates_certificate_relists_directory
          rationale: "OVERTURNED cascade to certificate + listing is asserted in the named §1.8 instance."

  - section: validations
    instances:
      - name: auditor_window_overlap_on_assign
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDITOR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: auditor_window_intersection_rejected_adjacency_allowed
          rationale: "The overlap error and its adjacency boundary are the named §1.8 instance."

      - name: audit_window_gap_violation_on_reschedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_WINDOW_TOO_CLOSE]"]
        excluded_because:
          difficulty_instance: client_scheme_minimum_gap_buffer_enforced
          rationale: "The 29-day vs 30-day gap boundary is the named §1.8 instance."

      - name: conflict_plus_overlap_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: assign_conflicted_auditor_with_overlapping_window_safety_wins
          rationale: "Safety-over-temporal priority is exactly the named §1.8 instance."

      - name: state_plus_constraint_priority_on_assign
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: assign_in_progress_audit_with_incompetent_auditor_state_wins
          rationale: "State-over-constraint priority is exactly the named §1.8 instance."

  - section: calculations
    instances:
      - name: audit_score_reported_and_resolved_variants
        claim_type: correct_result
        grounds: [calculations.audit_score]
        excluded_because:
          difficulty_instance: audit_score_reported_vs_resolved_divergence
          rationale: "Both variants and their divergence are asserted with literal values in the named §1.8 instance."

      - name: certification_fee_quote_and_invoice_variants
        claim_type: correct_result
        grounds: [calculations.certification_fee]
        excluded_because:
          difficulty_instance: certification_fee_quote_vs_invoice_divergence
          rationale: "Quote and invoice variants are asserted with literal values in the named §1.8 instance; rounding order is pinned in certification_fee_round_per_line_then_sum."
