              captures: { boa_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/assign-administrator"
              payload: { administrator_id: "${boa_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_id}/open"
