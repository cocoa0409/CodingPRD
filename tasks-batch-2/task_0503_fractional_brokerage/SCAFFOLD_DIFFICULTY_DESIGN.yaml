            - "Account.${acc_pdt}.pdt_flagged == false (equity exactly 2500000 is NOT < 2500000)"

      # ---- Boundary 2: instant-credit cap headroom (== headroom allowed) ----
      - name: instant_credit_exactly_at_cap_then_one_over_rejected
        grounds:
          - calculations.instant_credit
          - entities.Deposit.fields.instant_credit_granted_cents
          - validations[priority=17]
          - errors[ERR_INSTANT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          A first instant deposit of exactly INSTANT_CAP_CENTS (10000000) is granted in full (requested ==
          headroom is allowed), but a subsequent instant deposit of even 1 cent is rejected with
          ERR_INSTANT_LIMIT_EXCEEDED — a cumulative-cap headroom boundary reached through POST
          /accounts/{id}/deposits, a different metric and endpoint than the PDT equity boundary.
        test_recipe:
          setup:
            - "Fresh CASH account A_CAP with zero outstanding instant credit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "cap@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_cap: $.data.id }
            - call: "POST /accounts/${acc_cap}/deposits"
