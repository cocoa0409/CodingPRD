            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_h}", model_line_id: "${l4_id}", run_id: "${run4_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_h_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_h}"
              captures: { o_h1: $.data.id }
            - call: "POST /wholesale/orders/${o_h1}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_h1}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/carriers"
              payload: { code: "CAR4", name: "Carrier Four", weekly_capacity: 5 }
              as: LogisticsCoordinator
              captures: { car4: $.data.id }
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_h1}", carrier_id: "${car4}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { sh_h1: $.data.id }
            - call: "POST /wholesale/shipments/${sh_h1}/pickup"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /wholesale/incentive-programs"
              payload: { code: "AG1", model_line_id: "${l4_id}", kind: "AGED_INVENTORY_CREDIT", params: { age_threshold_days: 45, credit_per_unit_cents: 10000, tier2_age_days: 60, tier2_credit_per_unit_cents: 25000 }, window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { prog_ag1: $.data.id }
          trigger:
            - call: "POST /wholesale/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegionalAllocator
            - call: "POST /wholesale/shipments/${sh_h1}/deliver"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "Shipment.state == DELIVERED (link 1)"
            - "VehicleOrder(o_h1).state == DELIVERED and delivered_at == shipment.delivered_at (link 2)"
            - "DealerModelLine(d_h, l4).reported_sales_units == 1 (link 3a)"
            - "provisional incentive accrual for d_h on AG1 == 0 cents: age_days = floor((2026-11-01 - scheduled_at) days) < 45 (link 3b, boundary: scheduled 2026-W36, delivered Nov 1 = under threshold)"

      - name: commodity_resolve_cascades_restriction_expiry_and_unblocks_retrofit
        grounds:
          - state_machines.Commodity.CONSTRAINED_to_RESOLVED
          - state_machines.CommodityRestriction.ACTIVE_to_EXPIRED
          - state_machines.VehicleOrderBuildRetrofit.PENDING_RETROFIT_to_RETROFITTED
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /commodities/{id}/resolve: Commodity
          CONSTRAINED -> RESOLVED (link 1) causes every ACTIVE
          CommodityRestriction on it to become EXPIRED (link 2, caused by the
          commodity flip), which itself unblocks ERR_RETROFIT_BLOCKED so a
          PENDING_RETROFIT order can complete. Different trigger than
          instance 1 (commodity resolve vs shipment deliver).
        test_recipe:
          setup:
            - "Dealer E fixture: order o_p2 built WITHOUT_FEATURE (build_state PENDING_RETROFIT); restriction ACTIVE; commodity CONSTRAINED"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R2b", name: "Region Two B" }
              as: RegionalAllocator
              captures: { r2b_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r2b_id}", dealer_code: "D-E2", name: "Dealer E2", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_e2: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L2b", name: "Line Two B" }
              as: RegionalAllocator
              captures: { l2b_id: $.data.id }
            - call: "POST /wholesale/commodities"
              payload: { code: "ROOF2", name: "Roof Two" }
              as: CommodityManager
              captures: { c_roof2: $.data.id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_roof2}", model_line_id: "${l2b_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: null, install_rate_pct: 50, allow_partial_build: true }
              as: CommodityManager
              captures: { cr2: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l2b_id}", base_units: 4, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run2b_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run2b_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run2b_id}/dealer-allocations"
              payload: { dealer_id: "${d_e2}" }
              as: RegionalAllocator
              captures: { da_e2_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_e2}", model_line_id: "${l2b_id}", run_id: "${run2b_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_e2_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_e2}"
            - call: "GET /wholesale/allocation-runs/${run2b_id}/dealer-allocations"
              payload: { dealer_id: "${d_e2}" }
              as: RegionalAllocator
              captures: { da_e2_v2: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_e2}", model_line_id: "${l2b_id}", run_id: "${run2b_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_e2_v2}", configuration: { trim: "XLT", commodity_codes: ["ROOF2"] } }
              as: Dealer
              as_user_id: "${d_e2}"
              captures: { o_e2b: $.data.id }
            - call: "POST /wholesale/orders/${o_e2b}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_e2b}/build"
              payload: { build_mode: "WITHOUT_FEATURE" }
              as: ProductionScheduler
          trigger:
            - call: "POST /wholesale/commodities/${c_roof2}/resolve"
              payload: {}
              as: CommodityManager
            - call: "POST /wholesale/orders/${o_e2b}/retrofit"
              payload: {}
              as: ProductionScheduler
          assert:
            - "Commodity.status == RESOLVED (link 1)"
            - "CommodityRestriction(cr2).status == EXPIRED (link 2, caused by link 1's cascade, not by a direct call)"
            - "retrofit now succeeds: order build_state == RETROFITTED; a child order with retrofit_of_order_id == o_e2b exists (link 3, enabled by link 2)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_gate_beats_commodity_cap_on_order_entry
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PARENT_NOT_ACTIVE]
          - errors[ERR_COMMODITY_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 6) vs business_constraint (priority 8):
          an order whose commodity cap WOULD fail (rate 0 restriction) but
          whose run is DRAFT (not PUBLISHED) must return
          ERR_PARENT_NOT_ACTIVE, not ERR_COMMODITY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Dealer E2-style fixture with a rate-0 restriction on the line; run created but left in DRAFT"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R5", name: "Region Five" }
              as: RegionalAllocator
              captures: { r5_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r5_id}", dealer_code: "D-I", name: "Dealer I", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_i: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L5", name: "Line Five" }
              as: RegionalAllocator
              captures: { l5_id: $.data.id }
            - call: "POST /wholesale/commodities"
              payload: { code: "NAV", name: "Navigation" }
              as: CommodityManager
              captures: { c_nav: $.data.id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_nav}", model_line_id: "${l5_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: null, install_rate_pct: 0, allow_partial_build: false }
              as: CommodityManager
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l5_id}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run5_id: $.data.id }
            - call: "GET /wholesale/allocation-runs/${run5_id}/dealer-allocations"
              payload: { dealer_id: "${d_i}" }
              as: RegionalAllocator
              captures: { da_i_v: "$.data[0].version "}
          trigger:
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_i}", model_line_id: "${l5_id}", run_id: "${run5_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_i_v}", configuration: { trim: "XLT", commodity_codes: ["NAV"] } }
              as: Dealer
              as_user_id: "${d_i}"
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_PARENT_NOT_ACTIVE (state priority 6 beats commodity cap priority 8), HTTP 409"

      - name: commodity_cap_beats_allocation_exhausted_on_order_entry
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_COMMODITY_CAP_EXCEEDED]
          - errors[ERR_ALLOCATION_EXHAUSTED]
        distinguishing_aspect: |
          Different category pair than instance 1: business_constraint
          (priority 8, commodity cap) vs business_fiscal (priority 9, pool).
          An order that BOTH exceeds the feature cap AND lands on an exhausted
          allocation must return ERR_COMMODITY_CAP_EXCEEDED, not
          ERR_ALLOCATION_EXHAUSTED.
        test_recipe:
          setup:
            - "Dealer with a published run whose pool is fully consumed (consumed == final) and a rate-50 restriction such that the next feature order violates the cap"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R6", name: "Region Six" }
              as: RegionalAllocator
              captures: { r6_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r6_id}", dealer_code: "D-J", name: "Dealer J", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_j: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L6", name: "Line Six" }
              as: RegionalAllocator
              captures: { l6_id: $.data.id }
            - call: "POST /wholesale/commodities"
              payload: { code: "TOW", name: "Tow Package" }
              as: CommodityManager
              captures: { c_tow: $.data.id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_tow}", model_line_id: "${l6_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: null, install_rate_pct: 50, allow_partial_build: false }
              as: CommodityManager
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l6_id}", base_units: 2, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run6_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run6_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run6_id}/dealer-allocations"
              payload: { dealer_id: "${d_j}" }
              as: RegionalAllocator
              captures: { da_j_v: "$.data[0].version", da_j_final: "$.data[0].final_units "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_j}", model_line_id: "${l6_id}", run_id: "${run6_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_j_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_j}"
            - call: "GET /wholesale/allocation-runs/${run6_id}/dealer-allocations"
              payload: { dealer_id: "${d_j}" }
              as: RegionalAllocator
              captures: { da_j_v2: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_j}", model_line_id: "${l6_id}", run_id: "${run6_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_j_v2}", configuration: { trim: "XLT", commodity_codes: ["TOW"] } }
              as: Dealer
              as_user_id: "${d_j}"
            - call: "GET /wholesale/allocation-runs/${run6_id}/dealer-allocations"
              payload: { dealer_id: "${d_j}" }
              as: RegionalAllocator
              captures: { da_j_v3: "$.data[0].version "}
          trigger:
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_j}", model_line_id: "${l6_id}", run_id: "${run6_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_j_v3}", configuration: { trim: "XLT", commodity_codes: ["TOW"] } }
              as: Dealer
              as_user_id: "${d_j}"
              captures: { err2: $.data.error_id }
          assert:
            - "pool is now exhausted (2 consumed of final 2) AND this third order carrying TOW violates the cap (A=2, F=1, rate 50: 1+1 <= floor(3*50/100)=1 false)"
            - "error_id == ERR_COMMODITY_CAP_EXCEEDED (priority 8 beats priority 9), HTTP 422"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: new_point_floor_strict_age_boundary
        grounds:
          - calculations.new_point_floor
          - state_machines.AllocationRun.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Metric: dealer age in months vs NEW_POINT_MONTHS (6), boundary is
          STRICT (<): a dealer opened exactly 6 months before publish gets NO
          floor, one opened 1 second later gets the floor of 2 units. Endpoint:
          POST /allocation-runs/{id}/publish.
        test_recipe:
          setup:
            - "Two dealers: OLD opened exactly 2026-03-01T00:00:00Z, NEW opened 2026-03-01T00:00:01Z; run published at 2026-09-01T00:00:00Z with a tiny pool so base is small"
          setup_api_calls:
            - call: "POST /wholesale/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalAllocator
            - call: "POST /wholesale/regions"
              payload: { code: "R7", name: "Region Seven" }
              as: RegionalAllocator
              captures: { r7_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r7_id}", dealer_code: "D-OLD", name: "Old Dealer", opened_on: "2026-03-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_old: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r7_id}", dealer_code: "D-NEW", name: "New Dealer", opened_on: "2026-03-01T00:00:01Z" }
              as: RegionalAllocator
              captures: { d_new: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L7", name: "Line Seven" }
              as: RegionalAllocator
              captures: { l7_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l7_id}", base_units: 2, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run7_id: $.data.id }
          trigger:
            - call: "POST /wholesale/allocation-runs/${run7_id}/publish"
              payload: {}
              as: RegionalAllocator
          assert:
            - "DealerAllocation(OLD).final_units == base_units (no floor): age at publish is exactly 6 months -> ineligible"
            - "DealerAllocation(NEW).final_units == 2 (floor applied): age is 1 second under 6 months -> eligible, max(base, 2)"

      - name: carrier_capacity_strict_less_than_boundary
        grounds:
          - calculations.carrier_capacity
        distinguishing_aspect: |
          Different metric (integer count vs weekly_capacity) and different
          endpoint (POST /shipments) than instance 1: boundary is STRICT <.
          A carrier with weekly_capacity 1 accepts the first shipment for a
          week and rejects the second with ERR_CARRIER_CAPACITY (at capacity,
          count == capacity is NOT < capacity).
        test_recipe:
          setup:
            - "Carrier capacity 1; two BUILT orders scheduled week 2026-W36"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R8", name: "Region Eight" }
              as: RegionalAllocator
              captures: { r8_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r8_id}", dealer_code: "D-K", name: "Dealer K", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_k: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L8", name: "Line Eight" }
              as: RegionalAllocator
              captures: { l8_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l8_id}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run8_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run8_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run8_id}/dealer-allocations"
              payload: { dealer_id: "${d_k}" }
              as: RegionalAllocator
              captures: { da_k_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_k}", model_line_id: "${l8_id}", run_id: "${run8_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_k_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_k}"
              captures: { o_k1: $.data.id }
            - call: "GET /wholesale/allocation-runs/${run8_id}/dealer-allocations"
              payload: { dealer_id: "${d_k}" }
              as: RegionalAllocator
              captures: { da_k_v2: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_k}", model_line_id: "${l8_id}", run_id: "${run8_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_k_v2}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_k}"
              captures: { o_k2: $.data.id }
            - call: "POST /wholesale/orders/${o_k1}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_k1}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_k2}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_k2}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/carriers"
              payload: { code: "CAR8", name: "Carrier Eight", weekly_capacity: 1 }
              as: LogisticsCoordinator
              captures: { car8: $.data.id }
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_k1}", carrier_id: "${car8}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { sh_k1: $.data.id }
          trigger:
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_k2}", carrier_id: "${car8}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { err3: $.data.error_id }
          assert:
            - "first shipment succeeded (count 0 < capacity 1)"
            - "second shipment rejected ERR_CARRIER_CAPACITY (count 1 is NOT < capacity 1): HTTP 422"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_lock_gated_by_children_and_appeals
        grounds:
          - state_machines.AllocationRun.PUBLISHED_to_LOCKED
          - state_machines.DealerAllocation.OPEN_to_LOCKED
          - state_machines.Appeal
        distinguishing_aspect: |
          AllocationRun's PUBLISHED -> LOCKED transition depends on TWO other
          entities' states: every child DealerAllocation must be LOCKED
          (ERR_CHILDREN_NOT_LOCKED) and no Appeal may be FILED/UNDER_REVIEW
          (ERR_APPEALS_OPEN). Entity pairs: AllocationRun x DealerAllocation
          and AllocationRun x Appeal.
        test_recipe:
          setup:
            - "Published run with two dealer allocations; one appeal FILED"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R10", name: "Region Ten" }
              as: RegionalAllocator
              captures: { r10_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r10_id}", dealer_code: "D-L", name: "Dealer L", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_l: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r10_id}", dealer_code: "D-M", name: "Dealer M", opened_on: "2026-06-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_m: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L10", name: "Line Ten" }
              as: RegionalAllocator
