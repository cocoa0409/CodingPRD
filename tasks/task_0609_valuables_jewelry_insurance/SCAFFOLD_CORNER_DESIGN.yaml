  - section: cross-cutting complexity layers
    instances:
      # --- OCC stale-version negative test on endorsement apply (Policy.version) ---
      - name: occ_endorsement_apply_stale_policy_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[endorsement-apply-stale-policy]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Applying an endorsement with expected_policy_version one less than the live version (a prior payment bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE policy; a DRAFT ADD_ITEM endorsement; the client holds a Policy.version captured BEFORE a subsequent mutation advanced it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "occ1@x.com", full_name: "Occ1", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
            - call: "POST /policies/${pol}/bind"
              payload: {}
              as: Underwriter
              captures: { pol_v_bind: $.data.version }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Ring 2", category: "RING", location_zip: "10001", scheduled_value_cents: 800000 }
              as: Underwriter
              captures: { it2: $.data.id }
            - call: "POST /policies/${pol}/endorsements"
              payload: { endorsement_type: "ADD_ITEM", target_item_id: "${it2}" }
              as: Underwriter
              captures: { end: $.data.id }
            - call: "POST /policies/${pol}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph}"
          trigger:
            - call: "POST /policies/${pol}/endorsements/${end}/apply"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_STALE_VERSION"
            - "response status == 412"

