# SCAFFOLD_CORNER_DESIGN.yaml — task 2360 Pavement Management & Resurfacing Program
# Section 1.9 of the prd-bench scaffold: a BREADTH walk of the claim-extraction
# guide. One group per guide section; every instance is either a concrete corner
# test recipe or an explicit exclusion pointing at the §1.8 instance that already
# pins the same claim with literals.
#
# Reproducibility contract for every recipe below:
#   * starts from an EMPTY database; the logical clock is set explicitly first
#   * every id used in a later call is captured from an earlier response
#   * every expected_*_version is a ${captured} placeholder, never a literal
#   * every numeric expectation is a pre-computed literal, never a formula

scaffold_corner_design:

  # entities — creation, retrieval, listing, defaults, computed and system fields
  - section: entities
    instances:
      - name: segment_creation_computes_area_and_seeds_model_projected_index
        claim_type: creation
        grounds: ["entities.NetworkSegment", "endpoints.POST /pavement/segments", "calculations.segment_area_sy", "calculations.model_projected_condition_index"]
        distinguishing_aspect: "A single POST with the nine required inventory fields returns 201 and a row on which EVERY computed field is already populated: area_sy 3333.33, decay_coefficient 1.4, decay_knee_coefficient 1.0, condition_index 76.0 with condition_index_source MODEL_PROJECTED and condition_band GOOD, and all three lifecycle counters at their zero/null defaults."
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "One LOCAL segment 1000.00 ft x 30.00 ft, baseline_condition_index 92.0, last_treatment_date 2016-08-01 — exactly 10 whole years of age, 2 of them past the 8-year knee."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
          assert:
            - "HTTP 201."
            - "data.area_sy == 3333.33 (1000.00 * 30.00 / 9 = 3333.333... rounds half-up to 2 dp)."
            - "data.decay_coefficient == 1.4 and data.decay_knee_coefficient == 1.0 (DECAY_TABLE[LOCAL])."
            - "data.condition_index == 76.0 (92.0 - 1.4*10 - 1.0*2)."
            - "data.condition_index_source == 'MODEL_PROJECTED'."
            - "data.condition_band == 'GOOD' (76.0 >= 70.0)."
            - "data.last_treatment_type == 'NONE' and data.moratorium_until == null."
            - "data.active_project_count == 0 and data.open_service_request_count == 0."
            - "data.version == 1 and data.id / data.created_at are present."

      - name: segment_retrieval_returns_stored_inventory_and_counters
        claim_type: retrieval
        grounds: ["entities.NetworkSegment", "endpoints.GET /pavement/segments/{id}"]
        distinguishing_aspect: "The GET echoes back exactly what the create response published — area_sy 3333.33 and condition_index 76.0 — proving the computed values are PERSISTED on the row rather than recomputed per-read against a moved clock: the read happens at logical clock 2027-08-01, one year later, and condition_index is still 76.0, not 75.0."
        test_recipe:
          setup:
            - "Empty database."
            - "One segment created at logical clock 2026-08-01 (condition_index 76.0, area_sy 3333.33)."
            - "The logical clock is then moved forward one full year to 2027-08-01 WITHOUT any survey or treatment touching the segment."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { r_area: "$.data.area_sy", r_pci: "$.data.condition_index", r_src: "$.data.condition_index_source", r_band: "$.data.condition_band" }
          assert:
            - "HTTP 200."
            - "data.area_sy == 3333.33 and data.condition_index == 76.0 — unchanged by the clock move (the model runs at write time, not at read time)."
            - "data.condition_index_source == 'MODEL_PROJECTED' and data.condition_band == 'GOOD'."
            - "data.street_name == 'Maple St', data.geo_zone == 'Z1', data.functional_class == 'LOCAL', data.length_ft == 1000.00, data.width_ft == 30.00."
            - "data.version == 1 (a read never bumps the version)."

      - name: segment_listing_filters_by_condition_band_with_limit_and_offset
        claim_type: listing
        grounds: ["entities.NetworkSegment", "endpoints.GET /pavement/segments", "response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "Filter and pagination compose rather than fight: of four segments (three GOOD, one POOR at 44.0), the geo_zone=Z1 + condition_band=GOOD filter narrows the candidate set to exactly 2, and limit=1&offset=1 returns the SECOND of those two with total_count 2 (the pre-pagination count) and has_more false — the POOR segment and the Z3 segment never appear."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Four segments: Maple St (Z1, LOCAL, baseline 92.0 -> condition_index 76.0, GOOD), Oak St (Z1, LOCAL, baseline 92.0 -> 76.0, GOOD), Birch St (Z1, LOCAL, baseline 60.0 -> 44.0, POOR), Elm St (Z3, LOCAL, baseline 92.0 -> 76.0, GOOD)."
            - "Only Maple St and Oak St satisfy geo_zone == Z1 AND condition_band == GOOD."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Oak St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 3517.5, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg3: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Birch St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 60.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { segP: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Elm St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z3", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1001.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg4: "$.data.id" }
          trigger:
            - call: "GET /pavement/segments"
              payload: { geo_zone: "Z1", condition_band: "GOOD", limit: 1, offset: 1 }
              as: PavementEngineer
              captures: { lst_id: "$.data[0].id", lst_band: "$.data[0].condition_band" }
          assert:
            - "HTTP 200 and response_type == 'array'."
            - "len(data) == 1 (limit 1 applied AFTER the two filters)."
            - "meta.total_count == 2 — the count of rows matching the filter, NOT the 4 rows in the table."
            - "meta.has_more == false (offset 1 + limit 1 exhausts the 2 matches)."
            - "data[0].condition_band == 'GOOD' and data[0].geo_zone == 'Z1'."
            - "No returned row has condition_band == 'POOR' and no returned row has geo_zone == 'Z3'."

      - name: segment_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["entities.NetworkSegment", "endpoints.GET /pavement/segments/{id}", "validations.priority_40_path_id_resolution", "errors.ERR_SEGMENT_NOT_FOUND"]
        distinguishing_aspect: "A well-formed UUID that names no row yields the entity-specific ERR_SEGMENT_NOT_FOUND (404) rather than a generic 404 or a 400 — and it does so on an empty database, proving the check is a lookup miss and not a shape complaint."
        test_recipe:
          setup:
            - "Empty database (no segment has ever been created)."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "GET /pavement/segments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PavementEngineer
              captures: { e_id: "$.data.error_id", e_msg: "$.data.message" }
          assert:
            - "HTTP 404."
            - "data.error_id == 'ERR_SEGMENT_NOT_FOUND'."
            - "response_type == 'error'."

      - name: observation_create_without_iri_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.DistressObservation", "endpoints.POST /pavement/distress-observations", "validations.priority_30_request_shape", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "iri_in_per_mi has source: input and no default, so omitting it is a 400 ERR_INVALID_REQUEST at priority 30 — it is NOT silently defaulted to 0.0 (which would have produced a perfectly plausible deduct of 30.90 - 4.80 = 26.10 and PCI 73.9) and it is NOT deferred to the priority-42 parent lookup even though both parents in the payload are valid."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One LOCAL segment (Maple St) and one OPEN 2026 survey both exist, so every FK in the payload resolves."
            - "The payload carries seven of the eight required measurement fields; iri_in_per_mi is absent."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
          trigger:
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
          assert:
            - "HTTP 400."
            - "data.error_id == 'ERR_INVALID_REQUEST'."
            - "GET /pavement/distress-observations?survey_id={sv} returns meta.total_count == 0 — no partial row was written."
            - "GET /pavement/condition-surveys/{sv} still shows observation_count == 0 and accepted_observation_count == 0."

      - name: segment_create_omitting_last_treatment_date_anchors_the_decay_on_created_at
        claim_type: defaults
        grounds: ["entities.NetworkSegment.fields.last_treatment_date", "calculations.model_projected_condition_index", "endpoints.POST /pavement/segments"]
        distinguishing_aspect: "The documented default is not merely 'null in the response': because the decay anchor falls back to created_at when last_treatment_date is null, age_years is 0 and condition_index comes back as the untouched baseline 92.0 — 16.0 points above the 76.0 the SAME segment would publish with last_treatment_date 2016-08-01."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Two identical LOCAL segments 1000.00 ft x 30.00 ft with baseline_condition_index 92.0."
            - "Maple St supplies last_treatment_date 2016-08-01 (age 10); Cedar St omits the optional field entirely."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { aged_pci: "$.data.condition_index" }
          trigger:
            - call: "POST /pavement/segments"
              payload: { street_name: "Cedar St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0 }
              as: PavementEngineer
              captures: { seg_d: "$.data.id", d_ltd: "$.data.last_treatment_date", d_ltt: "$.data.last_treatment_type", d_pci: "$.data.condition_index" }
          assert:
            - "HTTP 201."
            - "data.last_treatment_date == null (the declared default)."
            - "data.last_treatment_type == 'NONE' (the declared default)."
            - "data.condition_index == 92.0 — anchor_date fell back to created_at, so age_years == 0 and no decay was subtracted."
            - "data.condition_band == 'GOOD' and data.condition_index_source == 'MODEL_PROJECTED'."
            - "${aged_pci} == 76.0 for the sibling segment that DID supply last_treatment_date — a 16.0-point spread from the same baseline."

      - name: observation_computed_fields_ignore_client_supplied_extra_field
        claim_type: computed_fields
        grounds: ["entities.DistressObservation.fields.deduct_total", "entities.DistressObservation.fields.measured_condition_index", "calculations.survey_measured_condition_index"]
        distinguishing_aspect: "deduct_total and measured_condition_index carry source: computed, so a client that posts measured_condition_index: 99.9 alongside the real measurements is ignored outright: the row comes back with deduct_total 30.90 and measured_condition_index 69.1 derived from the five distress inputs and the coverage factor — the injected 99.9 appears nowhere."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One LOCAL segment (Maple St, 1000.00 x 30.00) and one OPEN 2026 survey."
            - "The observation payload carries the eight declared inputs PLUS an undeclared measured_condition_index: 99.9 and deduct_total: 0.0."
            - "Measurements: alligator 3000 sqft (10.00%), longitudinal 500 lf (50.00%), rutting 0.55 in, patching 1500 sqft (5.00%), IRI 155 (60 over the 95 threshold), coverage 100%."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
          trigger:
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0, measured_condition_index: 99.9, deduct_total: 0.0 }
              as: PavementEngineer
              captures: { o_id: "$.data.id", o_ded: "$.data.deduct_total", o_pci: "$.data.measured_condition_index", o_qc: "$.data.qc_status" }
          assert:
            - "HTTP 201 (undeclared body fields are ignored, not rejected)."
            - "data.deduct_total == 30.90 (0.45*10.00 + 0.18*50.00 + 40*0.30 + 0.12*5.00 + 0.08*60 = 30.9000, coverage factor 1.0000)."
            - "data.measured_condition_index == 69.1 — NOT the 99.9 that was posted."
            - "data.qc_status == 'PENDING' (system default; the client cannot pre-accept its own reading)."
            - "GET /pavement/segments/{seg1} still shows condition_index == 76.0 / condition_index_source == 'MODEL_PROJECTED' — an unsealed observation does not publish."

      - name: survey_system_fields_are_generated_not_accepted_from_the_client
        claim_type: system_fields
        grounds: ["entities.ConditionSurvey", "endpoints.POST /pavement/condition-surveys", "state_machines.ConditionSurvey.initial_state"]
        distinguishing_aspect: "A survey create takes exactly two inputs, yet returns eight populated fields: id, created_at, version and the system/computed set (survey_status OPEN, observation_count 0, accepted_observation_count 0, network_condition_index null, sealed_at null) — every one of which the client never supplied and cannot supply."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "No segments and no observations exist yet."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id", sv_status: "$.data.survey_status", sv_created: "$.data.created_at", sv_v: "$.data.version" }
          assert:
            - "HTTP 201."
            - "data.id is a server-generated identifier and data.created_at is present."
            - "data.version == 1."
            - "data.survey_status == 'OPEN' (the declared initial_state)."
            - "data.observation_count == 0 and data.accepted_observation_count == 0."
            - "data.network_condition_index == null and data.sealed_at == null."
            - "data.survey_year == 2026 and data.collection_method == 'AUTOMATED_LCMS' (the only two client-supplied values)."

      - name: scenario_create_with_horizon_years_twenty_one_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.BudgetScenario.fields.horizon_years", "validations.priority_30_request_shape", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "horizon_years is bounded to [1, 20]; 21 is one step outside and is rejected 400 at priority 30 — before the priority-42 survey lookup and before the projection ever runs, so no scenario row and no DRAFT state is created."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "A sealed 2026 survey with one accepted observation exists, so survey_id resolves and the only defect in the request is the out-of-range horizon."
            - "funding_cents 20000000 and strategy WORST_FIRST are both valid."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/budget-scenarios"
              payload: { survey_id: "${sv}", scenario_name: "FY27 program", funding_cents: 20000000, strategy: "WORST_FIRST", horizon_years: 21 }
              as: BudgetOfficer
              captures: { e_id: "$.data.error_id" }
          assert:
            - "HTTP 400."
            - "data.error_id == 'ERR_INVALID_REQUEST'."
            - "GET /pavement/budget-scenarios?survey_id={sv} returns meta.total_count == 0."
            - "A follow-up create identical except horizon_years == 20 returns HTTP 201 with data.horizon_years == 20, proving 20 is inside the bound and 21 is outside it."

      - name: observation_create_with_unknown_segment_returns_segment_not_found
        claim_type: parent_relationships
        grounds: ["entities.DistressObservation.parent", "validations.priority_42_body_fk_resolution", "errors.ERR_SEGMENT_NOT_FOUND"]
        distinguishing_aspect: "A DistressObservation names TWO parents. With a valid survey_id and a syntactically perfect but non-existent segment_id, the priority-42 body-FK check answers with the SEGMENT's error code (ERR_SEGMENT_NOT_FOUND, 404) — not the survey's, and not the priority-30 shape error, because the shape is flawless."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One OPEN 2026 survey exists; NO segment has ever been created."
            - "All eight measurement inputs are present and in range."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
          trigger:
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "00000000-0000-4000-8000-000000000000", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
          assert:
            - "HTTP 404."
