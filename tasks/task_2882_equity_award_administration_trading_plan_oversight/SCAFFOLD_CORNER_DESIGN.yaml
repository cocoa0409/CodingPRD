              payload: { name: "Corner Plan Uniform", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01", fungible_ratio_full_value_bps: 15000 }
              as: PlanAdministrator
