scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: account_owner_creation_returns_201_and_initializes_rmd_posture
        claim_type: creation
        grounds:
          - entities.AccountOwner
          - endpoints[POST /ira/owners]
        distinguishing_aspect: "POST /ira/owners with the four required fields returns 201 and AccountOwner.rmd_posture initialized to NOT_REQUIRED."
        test_recipe:
          setup:
            - "Empty DB, clock at 2026-06-01"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /ira/owners"
              payload: { full_name: "Aaron", date_of_birth: "1980-01-01", tax_id_last4: "1111", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { aaron_id: $.data.id, aaron_posture: $.data.rmd_posture, aaron_version: $.data.version }
          assert:
            - "HTTP status == 201"
            - "aaron_posture == NOT_REQUIRED"
            - "aaron_version == 1"
            - "AccountOwner.${aaron_id}.created_at is non-null"

      - name: account_owner_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /ira/owners/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /ira/owners/{id} with a non-existent UUID returns 404 / ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /ira/owners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: contribution_missing_required_field_returns_invalid_request
        claim_type: required_field
        grounds:
          - entities.Contribution
          - endpoints[POST /ira/contributions]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /ira/contributions missing contribution_kind (required, no default) -> ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Owner Aaron with one ACTIVE TRADITIONAL account"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Aaron", date_of_birth: "1980-01-01", tax_id_last4: "1111", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { aaron_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${aaron_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { aaron_trad_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions"
              payload: { account_id: "${aaron_trad_id}", tax_year: 2026, amount_cents: 100000 }
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: form_1099_r_is_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.Form1099R
        distinguishing_aspect: "Form1099R has common_fields:false; only id and created_at; no update endpoint exists; the only path that mutates a Form1099R is the void-on-distribution-reverse side effect described in §1.2."
        excluded_because:
          difficulty_instance: compensating_invariant / distribution_confirm_then_reverse_conserves_rmd_satisfaction
          rationale: "The §1.8 distribution reverse instance exercises the only Form1099R mutation path (void on distribution reverse), so the immutability claim is implicitly covered."

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: contribution_reject_from_pending_terminates_no_balance_change
        claim_type: valid_transition
        grounds:
          - state_machines.Contribution.PENDING_to_REJECTED
          - entities.IRAAccount.fields.cash_balance_cents
        distinguishing_aspect: "POST /contributions/{id}/reject from PENDING moves status to REJECTED with no balance change."
        test_recipe:
          setup:
            - "Owner Aaron, TRADITIONAL account, one PENDING PRETAX contribution 100000"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Aaron", date_of_birth: "1980-01-01", tax_id_last4: "1111", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { aaron_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${aaron_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { aaron_trad_id: $.data.id, pre_cash: $.data.cash_balance_cents }
            - call: "POST /ira/contributions"
              payload: { account_id: "${aaron_trad_id}", tax_year: 2026, amount_cents: 100000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${c_id}/reject"
              payload: {}
              as: PlanAdministrator
              captures: { reject_status: $.data.status }
            - call: "GET /ira/accounts/${aaron_trad_id}"
              payload: {}
              as: PlanAdministrator
              captures: { post_cash: $.data.cash_balance_cents }
          assert:
            - "reject_status == REJECTED"
            - "pre_cash == 0"
            - "post_cash == 0"
            - "Contribution.${c_id}.status == REJECTED"

      - name: ira_account_close_active_with_nonzero_balance_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.IRAAccount.ACTIVE_to_CLOSED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACTIVE -> CLOSED requires cash_balance_cents == 0; account with positive balance returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Owner with TRADITIONAL account holding cash 100000 (one CONFIRMED PRETAX 100000)"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Aaron", date_of_birth: "1980-01-01", tax_id_last4: "1111", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { aaron_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${aaron_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { aaron_trad_id: $.data.id, aaron_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${aaron_trad_id}", tax_year: 2026, amount_cents: 100000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { c_id: $.data.id }
            - call: "POST /ira/contributions/${c_id}/confirm"
              payload: { expected_account_version: "${aaron_trad_v0}" }
              as: AccountOwner
              as_user_id: "${aaron_id}"
            - call: "GET /ira/accounts/${aaron_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { aaron_trad_v1: $.data.version }
          trigger:
            - call: "POST /ira/accounts/${aaron_trad_id}/close"
              payload: { expected_account_version: "${aaron_trad_v1}" }
              as: PlanAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "IRAAccount.${aaron_trad_id}.status == ACTIVE"

      - name: contribution_idempotency_double_confirm_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Contribution.PENDING_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second confirm on the same already-CONFIRMED contribution returns ERR_INVALID_STATE (status not PENDING)."
        test_recipe:
          setup:
            - "Owner Aaron, TRADITIONAL account, PRETAX contribution 100000 already CONFIRMED"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Aaron", date_of_birth: "1980-01-01", tax_id_last4: "1111", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { aaron_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${aaron_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { aaron_trad_id: $.data.id, aaron_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${aaron_trad_id}", tax_year: 2026, amount_cents: 100000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { c_id: $.data.id }
            - call: "POST /ira/contributions/${c_id}/confirm"
              payload: { expected_account_version: "${aaron_trad_v0}" }
              as: AccountOwner
              as_user_id: "${aaron_id}"
            - call: "GET /ira/accounts/${aaron_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { aaron_trad_v1: $.data.version }
          trigger:
            - call: "POST /ira/contributions/${c_id}/confirm"
              payload: { expected_account_version: "${aaron_trad_v1}" }
              as: AccountOwner
              as_user_id: "${aaron_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: closed_account_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.IRAAccount.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once IRAAccount reaches CLOSED, freeze/unfreeze/conversion-initiate all return ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Owner Aaron with TRADITIONAL account that has been CLOSED (cash 0)"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Aaron", date_of_birth: "1980-01-01", tax_id_last4: "1111", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { aaron_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${aaron_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { aaron_trad_id: $.data.id, aaron_trad_v0: $.data.version }
            - call: "POST /ira/accounts/${aaron_trad_id}/close"
              payload: { expected_account_version: "${aaron_trad_v0}" }
              as: PlanAdministrator
              captures: { aaron_trad_v1: $.data.version }
          trigger:
            - call: "POST /ira/accounts/${aaron_trad_id}/freeze"
              payload: { expected_account_version: "${aaron_trad_v1}" }
              as: PlanAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "IRAAccount.${aaron_trad_id}.status == CLOSED"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: catch_up_contribution_limit_kicks_in_at_age_50_exact
        claim_type: correct_result
        grounds:
          - calculations.contribution_limit
          - entities.AccountOwner.fields.date_of_birth
        distinguishing_aspect: "Owner whose age-at-EOY 2026 is exactly 50 gets contribution_limit base+catch_up = 750000+110000 = 860000. Owner age 49 at EOY gets 750000 only."
        test_recipe:
          setup:
            - "Owner Tom (DOB 1976-12-31 -> turns 50 on 2026-12-31, age-at-EOY=50) and owner Una (DOB 1977-01-01 -> age-at-EOY=49)"
            - "Each owns one TRADITIONAL account"
            - "Tom attempts to CONFIRM a PRETAX 860000 contribution (boundary test at base+catch_up)"
            - "Una attempts to CONFIRM a PRETAX 750001 contribution (one cent over her cap, no catch_up)"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Tom", date_of_birth: "1976-12-31", tax_id_last4: "2020", filing_status: "SINGLE", modified_agi_cents: 5000000 }
              as: PlanAdministrator
              captures: { tom_id: $.data.id }
            - call: "POST /ira/owners"
              payload: { full_name: "Una", date_of_birth: "1977-01-01", tax_id_last4: "2121", filing_status: "SINGLE", modified_agi_cents: 5000000 }
              as: PlanAdministrator
              captures: { una_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${tom_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { tom_trad_id: $.data.id, tom_trad_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${una_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { una_trad_id: $.data.id, una_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${tom_trad_id}", tax_year: 2026, amount_cents: 860000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${tom_id}"
              captures: { tom_c_id: $.data.id }
            - call: "POST /ira/contributions"
              payload: { account_id: "${una_trad_id}", tax_year: 2026, amount_cents: 750001, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${una_id}"
              captures: { una_c_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${tom_c_id}/confirm"
              payload: { expected_account_version: "${tom_trad_v0}" }
              as: AccountOwner
              as_user_id: "${tom_id}"
              captures: { tom_status: $.data.status }
            - call: "POST /ira/contributions/${una_c_id}/confirm"
              payload: { expected_account_version: "${una_trad_v0}" }
              as: AccountOwner
              as_user_id: "${una_id}"
              captures: { una_err: $.data.error_id }
          assert:
            - "tom_status == CONFIRMED"
            - "una_err == ERR_CONTRIBUTION_CAP_EXCEEDED"
            - "IRAAccount.${tom_trad_id}.ytd_contribution_cents == 860000"
            - "IRAAccount.${una_trad_id}.ytd_contribution_cents == 0"

      - name: roth_phaseout_at_ceiling_returns_zero_eligibility
        claim_type: boundary_edge
        grounds:
          - calculations.roth_eligibility
          - validations[priority=11]
          - errors[ERR_CONTRIBUTION_CAP_EXCEEDED]
        distinguishing_aspect: "Owner SINGLE 2026 with modified_agi_cents == 16900000 (ceiling, inclusive) -> roth_eligibility headroom = 0; any positive ROTH contribution confirmation fails ERR_CONTRIBUTION_CAP_EXCEEDED."
        test_recipe:
          setup:
            - "Owner Victor (SINGLE 2026 AGI 16900000 - exactly ceiling) with one ROTH account"
            - "PENDING ROTH contribution amount_cents=1 tax_year=2026"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Victor", date_of_birth: "1981-02-02", tax_id_last4: "2222", filing_status: "SINGLE", modified_agi_cents: 16900000 }
              as: PlanAdministrator
              captures: { victor_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${victor_id}", account_type: "ROTH" }
              as: PlanAdministrator
              captures: { victor_roth_id: $.data.id, victor_roth_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${victor_roth_id}", tax_year: 2026, amount_cents: 1, contribution_kind: "ROTH" }
              as: AccountOwner
              as_user_id: "${victor_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${c_id}/confirm"
              payload: { expected_account_version: "${victor_roth_v0}" }
              as: AccountOwner
              as_user_id: "${victor_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_CONTRIBUTION_CAP_EXCEEDED"

      - name: pro_rata_with_zero_aftertax_basis_makes_conversion_fully_taxable
        claim_type: boundary_edge
        grounds:
          - calculations.backdoor_roth_pro_rata
        distinguishing_aspect: "Source TRADITIONAL with pretax 200000 and aftertax 0 (boundary: aft=0). pro-rata yields nontaxable = 200000 * 0 // 200000 = 0; taxable = 200000. Distinct from the dual-variant comparison in §1.8 which uses non-zero aftertax basis."
        test_recipe:
          setup:
            - "Owner Will (SINGLE age 45 2026 AGI 12000000) with one TRADITIONAL (pretax 200000, aftertax 0) and one ROTH target"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Will", date_of_birth: "1981-03-03", tax_id_last4: "2323", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { will_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${will_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { will_trad_id: $.data.id, will_trad_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${will_id}", account_type: "ROTH" }
              as: PlanAdministrator
              captures: { will_roth_id: $.data.id }
            - call: "POST /ira/contributions"
              payload: { account_id: "${will_trad_id}", tax_year: 2026, amount_cents: 200000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${will_id}"
              captures: { will_c_id: $.data.id }
            - call: "POST /ira/contributions/${will_c_id}/confirm"
              payload: { expected_account_version: "${will_trad_v0}" }
              as: AccountOwner
              as_user_id: "${will_id}"
            - call: "POST /ira/conversions"
              payload: { source_account_id: "${will_trad_id}", target_account_id: "${will_roth_id}", gross_amount_cents: 200000 }
              as: AccountOwner
              as_user_id: "${will_id}"
              captures: { will_conv_id: $.data.id }
            - call: "GET /ira/accounts/${will_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${will_id}"
              captures: { will_trad_v_pre: $.data.version }
          trigger:
            - call: "POST /ira/conversions/${will_conv_id}/complete"
              payload: { expected_source_account_version: "${will_trad_v_pre}" }
              as: AccountOwner
              as_user_id: "${will_id}"
              captures: { tax: $.data.taxable_amount_cents, nontax: $.data.nontaxable_amount_cents }
          assert:
            - "tax == 200000"
            - "nontax == 0"
            - "Conversion.${will_conv_id}.status == COMPLETED"
            - "IRAAccount.${will_roth_id}.cash_balance_cents == 200000"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_x_user_role_header_returns_missing_auth
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH]
        distinguishing_aspect: "Any endpoint called without X-User-Role returns ERR_MISSING_AUTH (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /ira/owners"
              payload: {}
              as: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "$.data.error_id == ERR_MISSING_AUTH"

      - name: beneficiary_shares_sum_must_equal_10000_on_activate
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_BENEFICIARY_SHARES_INVALID]
        distinguishing_aspect: "Activating a PENDING BeneficiaryDesignation whose activation would leave the sum of ACTIVE percentage_bps != 10000 returns ERR_BENEFICIARY_SHARES_INVALID. Concretely: a single PENDING beneficiary with percentage_bps=5000, no other ACTIVE designations, activation fails."
        test_recipe:
          setup:
            - "Owner Xena with one TRADITIONAL account and one PENDING beneficiary at percentage_bps=5000"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Xena", date_of_birth: "1981-04-04", tax_id_last4: "2424", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { xena_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${xena_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { xena_trad_id: $.data.id }
            - call: "POST /ira/beneficiary-designations"
              payload: { account_id: "${xena_trad_id}", beneficiary_full_name: "Half Heir", relationship: "SPOUSE", percentage_bps: 5000 }
              as: AccountOwner
              as_user_id: "${xena_id}"
              captures: { bene_id: $.data.id }
          trigger:
            - call: "POST /ira/beneficiary-designations/${bene_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${xena_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_BENEFICIARY_SHARES_INVALID"

      - name: invalid_conversion_pair_owner_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_CONVERSION_PAIR]
        distinguishing_aspect: "Conversion source owned by Owner A but target ROTH owned by Owner B -> ERR_INVALID_CONVERSION_PAIR (cross-owner conversion rejected)."
        test_recipe:
          setup:
            - "Owner Yara with TRADITIONAL source funded aftertax 100000; Owner Zach with ROTH target"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Yara", date_of_birth: "1981-05-05", tax_id_last4: "2525", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { yara_id: $.data.id }
            - call: "POST /ira/owners"
