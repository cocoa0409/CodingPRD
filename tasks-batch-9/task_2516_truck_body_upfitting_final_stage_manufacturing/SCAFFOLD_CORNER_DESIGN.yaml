              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "LIFTGATE-2500", equipment_class: "LIFTGATE", weight_lb: 780, requires_pto: false, required_flow_gpm: 0, aux_amp_draw: 30, duty_priority: 3, mount_zone: "REAR_OVERHANG", requires_can_gateway: false, list_price_cents: 320000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { es_lift: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "CRANE-6000", equipment_class: "CRANE", weight_lb: 1250, requires_pto: true, required_flow_gpm: 8, aux_amp_draw: 10, duty_priority: 1, mount_zone: "BEHIND_CAB", requires_can_gateway: false, list_price_cents: 780000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { es_crane: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5018", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${es_lift}", mount_cg_from_front_axle_in: 320, hydraulic_circuit: "NONE" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ei_lift: "$.data.id" }
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${es_crane}", mount_cg_from_front_axle_in: 208, hydraulic_circuit: "PRIMARY" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ei_crane: "$.data.id" }
            - call: "POST /upfit/equipment-installations/${ei_crane}/remove"
              payload: { reason: "customer dropped the crane from the spec" }
              as: InstallTechnician
              as_user_id: "tech-1"
            - call: "POST /upfit/electrical-interfaces"
              payload: { upfit_order_id: "${uo}", interface_method: "DIRECT_SPLICE", circuit_amp_draw: 25, signal_source: "DISCRETE_CIRCUIT", customer_warranty_waiver_ack: true }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { if1: "$.data.id" }
          trigger:
            - call: "POST /upfit/electrical-interfaces/${if1}/reject"
              payload: { reason: "splice into the discrete circuit is not acceptable on this build" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP 200 and ElectricalInterface.${if1}.status == \"REJECTED\""
            - "UpfitOrder.${uo}.committed_aux_amp_draw == 42 (body 12 + liftgate 30 only)"
