  - rule_id: compensating_invariant
    instances:
      - name: deposit_escrow_conservation_holds_across_license_issue_and_termination
        grounds:
          - calculations.contracted_rental_charge
          - state_machines.LicenseAgreement.ISSUED_to_EXECUTED
          - state_machines.LicenseAgreement.EXECUTED_to_TERMINATED
          - entities.Client.fields.credit_balance_cents
          - entities.Client.fields.total_deposits_paid_cents
          - entities.LicenseAgreement.fields.deposit_held_cents
        distinguishing_aspect: |
          The conserved quantity is MONETARY. Across the whole cycle the identity
          credit_balance_cents + sum(LicenseAgreement.deposit_held_cents)
          + sum(EventSettlement.deposit_applied_cents) == total_deposits_paid_cents must hold
          at every step: 8000000 = 8000000 + 0 before issue, 8000000 = 1700000 + 6300000 + 0
          while the licence escrows the deposit, and 8000000 = 8000000 + 0 + 0 after
          termination refunds it. An implementation that debits credit on issue but forgets to
          credit it back on terminate loses 6300000 cents without breaking any state machine.
        test_recipe:
          setup:
            - "Hall A has daily_base_rate_cents 4800000 and the CITYWIDE_CONVENTION window has rental_discount_pct 0.25"
            - "National Widget Association has paid 8000000 of deposits, so credit_balance_cents is 8000000 and total_deposits_paid_cents is 8000000"
            - "its booking runs 2028-05-10 through 2028-05-19, so contracted_rental_cents is 25200000 and deposit_required_cents is 6300000"
            - "the licence has been issued and countersigned, leaving credit_balance_cents at 1700000 and deposit_held_cents at 6300000"
            - "no EventSettlement exists for the booking"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CITYWIDE_CONVENTION", priority_rank: 1, open_months_before: 60, close_months_before: 18, max_holds_per_booking: 3, challenge_response_hours: 120, rental_discount_pct: 0.25, max_challenge_rounds: 2 }
