# =============================================================================
# task_1054 — Gift-Card Program & Distribution Platform (B2B)
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_merchant_returns_201_defaults_and_system_fields
        claim_type: Creation
        grounds: [entities.Merchant.fields.status, entities.Merchant.fields.settlement_currency]
        distinguishing_aspect: "POST /merchants with only legal_name returns 201, status PENDING, settlement_currency default USD, version 1, aggregates 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
          assert:
            - "Merchant.${m_id}.status == PENDING"
            - "Merchant.${m_id}.settlement_currency == USD"
            - "Merchant.${m_id}.version == 1"
            - "Merchant.${m_id}.unsettled_redemptions_cents == 0"

      - name: get_merchant_not_found_returns_404
        claim_type: Not Found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /merchants/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /merchants/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_program_missing_name_returns_validation
        claim_type: Required Fields
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /card-programs omitting the required name returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Merchant created."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: program_defaults_applied_on_create
        claim_type: Defaults
        grounds: [entities.CardProgram.fields.breakage_method, entities.CardProgram.fields.expiry_months, entities.CardProgram.fields.max_balance_cents, entities.CardProgram.fields.min_load_cents]
        distinguishing_aspect: "POST /card-programs with only merchant_id+name applies defaults: breakage_method REMITTANCE, expiry_months 12, max_balance_cents 100000, min_load_cents 500."
        test_recipe:
          setup: ["Merchant created."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
          assert:
            - "CardProgram.${p_id}.breakage_method == REMITTANCE"
            - "CardProgram.${p_id}.expiry_months == 12"
            - "CardProgram.${p_id}.max_balance_cents == 100000"
            - "CardProgram.${p_id}.min_load_cents == 500"

      - name: create_batch_invalid_channel_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.CardBatch.fields.channel, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /card-batches with channel outside {DIGITAL,PHYSICAL} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "MAGSTRIPE", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_batch_zero_card_count_returns_validation
        claim_type: Type Constraints
        grounds: [entities.CardBatch.fields.card_count, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /card-batches with card_count 0 returns ERR_VALIDATION (400) (card_count must be >= 1)."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 0, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: minted_card_starts_inactive_zero_balance
        claim_type: System Fields
        grounds: [entities.GiftCard.fields.status, entities.GiftCard.fields.balance_cents, entities.GiftCard.fields.card_number]
        distinguishing_aspect: "A card minted by batch commit starts INACTIVE with balance 0 and a system-minted card_number."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE; batch committed (1 card)."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "PHYSICAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
          assert:
            - "GiftCard.${c_id}.status == INACTIVE"
            - "GiftCard.${c_id}.balance_cents == 0"

      - name: card_balance_equals_activation_load
        claim_type: Computed Fields
        grounds: [calculations.card_balance, entities.GiftCard.fields.balance_cents]
        distinguishing_aspect: "Activating a card posts ACTIVATION_LOAD = initial_load_cents; balance_cents equals the load (5000)."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE; batch committed (1 card, unit_load 5000)."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
          assert:
            - "GiftCard.${c_id}.status == ACTIVE"
            - "GiftCard.${c_id}.balance_cents == 5000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: reactivate_pending_merchant_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Merchant.SUSPENDED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /merchants/{id}/reactivate on a PENDING merchant returns ERR_INVALID_STATE (reactivate is only valid from SUSPENDED)."
        test_recipe:
          setup: ["Merchant created (PENDING)."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /merchants/${m_id}/reactivate", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: activate_retired_program_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CardProgram.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: POST /card-programs/{id}/activate on a RETIRED program returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE then RETIRED."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-programs/${p_id}/retire", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: commit_already_committed_batch_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.CardBatch.DRAFT_to_COMMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Committing an already-COMMITTED batch returns ERR_INVALID_STATE (commit is not idempotent)."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE; batch COMMITTED."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: commit_batch_program_not_active_returns_program_not_active
        claim_type: guarded transitions
        grounds: [state_machines.CardBatch.DRAFT_to_COMMITTED, "errors[ERR_PROGRAM_NOT_ACTIVE]"]
        distinguishing_aspect: "Committing a batch whose CardProgram is still DRAFT returns ERR_PROGRAM_NOT_ACTIVE (cross-entity guard: CardBatch commit requires program ACTIVE)."
        test_recipe:
          setup: ["Merchant ACTIVE; program DRAFT (never activated); DRAFT batch created."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PROGRAM_NOT_ACTIVE"

      - name: redeem_inactive_card_returns_card_not_active
        claim_type: Invalid Transitions
        grounds: ["validations[priority=7]", "errors[ERR_CARD_NOT_ACTIVE]"]
        distinguishing_aspect: "Redeeming an INACTIVE (never-activated) card returns ERR_CARD_NOT_ACTIVE."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE; card minted (INACTIVE)."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 1000 }, as: POSTerminal, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CARD_NOT_ACTIVE"

      - name: escheat_remit_transitions_expired_card_to_escheated
        claim_type: Side Effect Execution
        grounds: [state_machines.EscheatReport.DRAFT_to_REMITTED, state_machines.GiftCard.EXPIRED_to_ESCHEATED, calculations.escheat_amount]
        distinguishing_aspect: "On an ESTIMATED program a card that EXPIRED holding balance 30000 is captured by an escheat report (escheat_total 30000, card_count 1); remit transitions it to ESCHEATED."
        test_recipe:
          setup: ["Merchant ACTIVE; ESTIMATED program ACTIVE; card activated 2026-07-01 (balance 30000), clock advanced to 2027-07-05, run-maintenance expired it (balance retained under ESTIMATED). Escheat report [2027-07-01,2027-07-03) created capturing it."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", breakage_method: "ESTIMATED", expiry_months: 12 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 30000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /card-programs/${p_id}/run-maintenance", payload: {}, as: PlatformAdmin }
            - { call: "POST /escheat-reports", payload: { merchant_id: "${m_id}", jurisdiction: "CA", period_start: "2027-07-01T00:00:00Z", period_end: "2027-07-03T00:00:00Z" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /escheat-reports/${e_id}/remit", payload: {}, as: SettlementOfficer, as_user_id: "officer-1" }
          assert:
            - "EscheatReport.${e_id}.escheat_total_cents == 30000"
            - "EscheatReport.${e_id}.card_count == 1"
            - "EscheatReport.${e_id}.status == REMITTED"
            - "GiftCard.${c_id}.status == ESCHEATED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: reload_with_running_campaign_adds_incentive_bonus
        claim_type: Correct Result
        grounds: [entities.IncentiveCampaign.fields.bonus_bps, entities.GiftCard.fields.incentive_campaign_id, entities.GiftCard.fields.balance_cents]
        distinguishing_aspect: "A reload of 10000 while a campaign (bonus_bps 1000) is RUNNING posts RELOAD 10000 + INCENTIVE_BONUS 1000; card balance goes 5000 -> 16000 and incentive_campaign_id is set."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE with a campaign [2026-06-01,2026-08-01] (RUNNING at the default clock 2026-07-01, bonus 1000 bps); card ACTIVE balance 5000."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /incentive-campaigns", payload: { card_program_id: "${p_id}", name: "Summer", bonus_bps: 1000, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-08-01T00:00:00Z" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { camp_id: "$.data.id" } }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
          trigger:
            - { call: "POST /gift-cards/${c_id}/reload", payload: { amount_cents: 10000 }, as: POSTerminal }
          assert:
            - "GiftCard.${c_id}.balance_cents == 16000"
            - "GiftCard.${c_id}.incentive_campaign_id == ${camp_id}"

      - name: dormancy_fee_accrues_at_threshold
        claim_type: Correct Result
        grounds: [calculations.dormancy_fee, entities.GiftCard.fields.balance_cents]
        distinguishing_aspect: "A card with no activity for exactly 365 days accrues a DORMANCY_FEE of 200 on run-maintenance; balance 10000 -> 9800 (inclusive boundary, and program expiry_months 60 so it has not expired)."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE (expiry_months 60); card ACTIVE loaded 10000 at 2026-07-01; clock advanced to 2027-07-01 (365 days)."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 60 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 10000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /card-programs/${p_id}/run-maintenance", payload: {}, as: PlatformAdmin }
          assert:
            - "GiftCard.${c_id}.status == ACTIVE"
            - "GiftCard.${c_id}.balance_cents == 9800"

      - name: redeem_to_zero_auto_closes_card
        claim_type: Correct Result
        grounds: [state_machines.GiftCard.ACTIVE_to_CLOSED, calculations.card_balance]
        distinguishing_aspect: "A redemption bringing balance to exactly 0 auto-closes the card (ACTIVE->CLOSED); balance 0."
        test_recipe:
          setup: ["Merchant ACTIVE; program ACTIVE; card ACTIVE balance 5000."]
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
