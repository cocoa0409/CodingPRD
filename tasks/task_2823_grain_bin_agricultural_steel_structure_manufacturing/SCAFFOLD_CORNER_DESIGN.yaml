          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD) whose computed sheet_gauge_mm is 1.6."
            - "One DealerOrder on D1 (OFFSEASON, NONE/GRAVITY), left in production_status DRAFT."
            - "RollFormingLine LINE_LOW with max_gauge_mm 1.3 and LINE_A with max_gauge_mm 3.0."
            - "CoilLot CL_THICK at gauge 2.0 and CL_MATCH at gauge 1.6, both G115 with received_kg 20000.0."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
