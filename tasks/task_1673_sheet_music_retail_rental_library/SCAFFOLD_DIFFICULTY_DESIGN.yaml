          assert:
            - "wrong role AND same person: error_id == ERR_INSUFFICIENT_PERMISSIONS (priority 2 auth beats priority 5 SoD)"
            - "right role, same person: error_id == ERR_SEGREGATION_OF_DUTIES (priority 5 now the top violated rule)"
            - "right role, different person: DamageInvoice.${inv1}.status == ISSUED"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_exact_boundary_on_reserve
        grounds:
          - validations[priority=14]
          - calculations.account_exposure
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Numeric threshold boundary on the credit metric via the reserve endpoint: settled
          exposure 20000 + new estimate 50000 == limit 70000 is allowed (<= semantics), while
          one cent more (limit 69999) is rejected — exact >=/>= precision on a money metric.
        test_recipe:
          setup:
            - "Account STANDARD limit 70000; existing DISPATCHED order (settled exposure 20000: 4 copies BAND base 8000... pinned to CHAMBER 4 copies x 10000 x 1 period = 40000... pinned: 2 copies CHAMBER base 10000 = 20000)"
            - "Second order 5 copies CHAMBER est 50000 attempted at exactly the boundary, then limit lowered by 1 cent and retried"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Eleven" }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Preludes", catalog_number: "P11-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${work_id}", set_code: "SET-901", copy_count: 30, replacement_value_cents: 240000 }
              as: LibraryAdmin
              captures: { set_id: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Valley HS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 70000 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 2, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o1}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 5, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${o2}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { o2_status: $.data.status }
            - call: "GET /library/customer-accounts/${acct_id}"
              as: BillingManager
              captures: { acct_v2: $.data.version }
            - call: "POST /library/customer-accounts/${acct_id}/credit-adjustments"
              payload: { new_credit_limit_cents: 69999, expected_customer_account_version: "${acct_v2}" }
              as: BillingManager
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 5, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o3: $.data.id }
            - call: "POST /library/rental-orders/${o3}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { err: $.data.error_id }
          assert:
            - "first reserve at exactly 70000 (20000 + 50000): RentalOrder.${o2}.status == RESERVED (<= passes)"
            - "after limit lowered to 69999: reserve rejected with error_id == ERR_CREDIT_LIMIT_EXCEEDED (402)"
      - name: po_valid_until_date_threshold_boundary
        grounds:
          - state_machines.PurchaseOrder.APPROVED_to_EXPIRED
          - entities.PurchaseOrder.fields.valid_until
        distinguishing_aspect: |
          Date-threshold boundary (different metric than instance 1's money sum, reached via
          the sweep endpoint rather than reserve): the PO expiry rule fires only when
          now > valid_until — at exactly valid_until (2026-08-31) the sweep leaves the PO
          APPROVED; one day later (2026-09-01, with no open orders) it flips to EXPIRED.
        test_recipe:
          setup:
            - "SCHOOL account; PO authorized 50000, window [2026-08-01, 2026-08-31], APPROVED, no referencing orders"
          setup_api_calls:
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Boundary HS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
