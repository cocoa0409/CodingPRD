      - name: billing_month_window_and_uniqueness_rules_reject
        claim_type: violation_to_error
        grounds:
          - validations[priority=79]
          - validations[priority=80]
          - validations[priority=81]
          - validations[priority=97]
        distinguishing_aspect: |
          The postable window is closed on both ends and both ends are inclusive: the month must be
          at least first_service_month and at most the logical clock's month, so on the very first
          day of service exactly one month is postable. Uniqueness is checked against posted_months,
          which is reversible, so a reversal reopens a month that was closed a moment earlier — and
          the last rule shows that a contract can be IN_SERVICE, ACCRUING and still unbillable once a
          TIER_1 malfunction has emptied its allowable.
        test_recipe:
          setup:
            - "One contract driven to IN_SERVICE on 2026-08-01 with a single PRIMARY_STATIONARY concentrator, cap_month_limit 36 and pricing_basis COMPETITIVE_BID_SINGLE_PAYMENT."
            - "first_service_month is therefore 2026-08 and monthly_allowable_cents is 5590."
