  # ===========================================================================
  # RULE 8 — resource/temporal overlap with DIFFERENT interval semantics on
  #          DIFFERENT resource entities
  #   instance 1 : Program treaty period per (cedent, line_of_business) — HALF-OPEN, unbuffered
  #   instance 2 : Reinsurer capacity aggregation window                — CLOSED, 30-day buffered
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: adjacent_treaty_periods_coexist_but_an_overlapping_one_is_refused
        grounds:
          - validations[priority=50]
          - errors.ERR_OVERLAPPING_TREATY_PERIOD
          - entities.Program.fields.inception_date
          - entities.Program.fields.expiry_date
        distinguishing_aspect: |
          Resource: the (cedent_id, line_of_business) treaty slot. Interval semantics: HALF-OPEN
          [inception_date, expiry_date) with NO buffer, so a program incepting at the exact
          instant another expires is legal, while one incepting a single day inside the incumbent
          period is refused. Instance 2 guards a different resource (a market's capacity) under
          closed, buffered semantics.
        test_recipe:
          setup:
            - "One cedent with an incumbent PROPERTY program covering [2026-01-01T00:00:00.000Z, 2027-01-01T00:00:00.000Z) in placement_status DRAFT — placement status is irrelevant to the check as long as it is not WITHDRAWN."
            - "A MARINE program covering exactly the same period exists too, proving the slot is keyed on line_of_business as well as cedent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { incumbent: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Marine 2026", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 500000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { other_lob: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2027", line_of_business: "PROPERTY", underwriting_year: 2027, inception_date: "2027-01-01T00:00:00.000Z", expiry_date: "2028-01-01T00:00:00.000Z", estimated_premium_income_minor: 2100000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { adjacent: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026 Mid-Term", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-06-01T00:00:00.000Z", expiry_date: "2027-06-01T00:00:00.000Z", estimated_premium_income_minor: 900000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent program is created — HTTP 201 — because 2027-01-01T00:00:00.000Z is the excluded end of the incumbent interval"
            - "Program.${adjacent}.inception_date == 2027-01-01T00:00:00.000Z and Program.${adjacent}.placement_status == DRAFT"
            - "the mid-term program returns HTTP 409 with ${err} == ERR_OVERLAPPING_TREATY_PERIOD"
            - "GET /cedents/${ced_id}/programs?line_of_business=PROPERTY returns exactly 2 rows"
            - "Program.${other_lob}.line_of_business == MARINE  # same period, different slot, never in conflict"

      - name: buffered_capacity_window_counts_a_line_from_a_program_incepting_exactly_on_the_boundary
        grounds:
          - calculations.reinsurer_aggregate_capacity
          - validations[priority=67]
          - entities.Reinsurer.fields.committed_capacity_minor
          - entities.Reinsurer.fields.available_capacity_minor
          - state_machines.Quote.transitions.QUOTED_to_FIRM_ORDER
        distinguishing_aspect: |
          Resource: India Re's capacity_limit_minor. Interval semantics: the aggregation window is
          CLOSED at both ends and widened by AGGREGATION_BUFFER_DAYS (30) — window(P) for a
          program incepting 2026-02-01 and expiring 2027-02-01 is
          [2026-01-02, 2027-03-03] — so an earlier program incepting EXACTLY on the lower
          boundary 2026-01-02 still consumes capacity. The two lines then total exactly
          500000000 against a 500000000 limit, and equality passes while one unit more would not.
          Instance 1 guards a different resource under half-open, unbuffered semantics.
        test_recipe:
          setup:
            - "One cedent and one market India Re with capacity_limit_minor 500000000 and max_line_pct 100.0000."
            - "Program Q (MARINE) covers [2026-01-02T00:00:00.000Z, 2027-01-02T00:00:00.000Z) and India Re already holds a 100.0000 PROVISIONAL line on Q's 200000000 layer, so its LIFETIME_TOTAL committed_capacity_minor is 200000000."
            - "Program P (PROPERTY) covers [2026-02-01T00:00:00.000Z, 2027-02-01T00:00:00.000Z) and is IN_MARKET with a 300000000 layer quoted at 100.0000 by India Re."
            - "Q's inception 2026-01-02 is exactly P.inception_date - 30 days, i.e. the inclusive lower edge of window(P)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "India Re", security_rating: "A", capacity_limit_minor: 500000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { india_id: $.data.id }
            # ---- program Q, the earlier treaty sitting on the window edge ----------
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Marine 2026", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-01-02T00:00:00.000Z", expiry_date: "2027-01-02T00:00:00.000Z", estimated_premium_income_minor: 400000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_q: $.data.id }
            - call: "POST /programs/${prog_q}/exposure-submissions"
              payload: { package_label: "NW-MAR-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_q: $.data.id }
            - call: "POST /programs/${prog_q}/layers"
              payload: { layer_label: "MAR XOL 200M xs 300M", layer_type: "EXCESS_OF_LOSS", attachment_minor: 300000000, limit_minor: 200000000, base_rate_pct: 6.0000, subject_premium_base_minor: 200000000, expected_loss_cost_minor: 8000000, reinstatements_total: 0, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_q: $.data.id }
            - call: "POST /exposure-submissions/${sub_q}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_q}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_q}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_q}/market-submissions"
              payload: { reinsurer_id: "${india_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_q: $.data.id }
            - call: "POST /market-submissions/${ms_q}/quotes"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 6.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 0, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${india_id}"
              captures: { q_quote: $.data.id }
            - call: "GET /layers/${layer_q}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lvq: $.data.version }
            - call: "POST /quotes/${q_quote}/firm-order"
              payload: { accepted_line_pct: 100.0000, expected_layer_version: "${lvq}" }
              as: BrokerPlacementLead
              captures: { sl_q: $.data.id }
            # ---- program P, the treaty whose window is being tested ----------------
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-02-01T00:00:00.000Z", expiry_date: "2027-02-01T00:00:00.000Z", estimated_premium_income_minor: 900000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_p: $.data.id }
            - call: "POST /programs/${prog_p}/exposure-submissions"
              payload: { package_label: "NW-PROP-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_p: $.data.id }
            - call: "POST /programs/${prog_p}/layers"
              payload: { layer_label: "PROP XOL 300M xs 700M", layer_type: "EXCESS_OF_LOSS", attachment_minor: 700000000, limit_minor: 300000000, base_rate_pct: 6.0000, subject_premium_base_minor: 300000000, expected_loss_cost_minor: 12000000, reinstatements_total: 0, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_p: $.data.id }
            - call: "POST /exposure-submissions/${sub_p}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_p}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_p}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_p}/market-submissions"
              payload: { reinsurer_id: "${india_id}", response_deadline: "2026-02-05T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_p: $.data.id }
            - call: "POST /market-submissions/${ms_p}/quotes"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 6.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 0, sublimit_minor: 0, expires_at: "2026-02-20T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${india_id}"
