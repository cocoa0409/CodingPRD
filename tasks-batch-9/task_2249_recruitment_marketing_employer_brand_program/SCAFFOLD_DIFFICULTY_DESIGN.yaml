scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 - dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: attribution_linear_vs_position_based_on_identical_touch_set
        grounds:
          - calculations.application_touch_credit
          - entities.Program.fields.attribution_model
          - entities.Application.fields.attribution_model_applied
          - entities.Touchpoint.fields.credit_bp
          - state_machines.Application.SCREENED_to_QUALIFIED
          - endpoints["PATCH /programs/{programId}"]
        distinguishing_aspect: |
          The two declared variants of application_touch_credit are exercised on two applications
          that carry byte-identical three-touch sets on the same three channels; LINEAR splits
          3334/3333/3333 (remainder lands on the earliest touch) while POSITION_BASED splits
          4000/2000/4000, so the middle channel receives 3333 bp under one variant and 2000 bp
          under the other from identical evidence - the divergence is caused only by
          Program.attribution_model, nothing else in the fixture changes.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program with attribution_model LINEAR and pool_job_board_cents 2000000."
            - "One JobFamily (code SWE, cpqa_target_cents 15000) with an APPROVED CandidatePersona."
            - "Three Channels of the same program: Board A (JOB_BOARD), Social B (SOCIAL), Prog C (PROGRAMMATIC), created in that order."
            - "One JobPosting of that family, content_status PUBLISHED and compliance_status CLEARED, optimization_score 100."
            - "Two Applications on that posting, both SCREENED, each with exactly three Touchpoints - one per channel - whose occurred_at values are 2026-07-28T09:00:00Z, 2026-07-29T09:00:00Z and 2026-07-30T09:00:00Z, all inside the (submitted_at - 30d, submitted_at] lookback window."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 2000000, send_quota_total: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Social B", channel_type: "SOCIAL", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch2_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Prog C", channel_type: "PROGRAMMATIC", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch3_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "research is current" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "EEO statement present, no superlatives" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "linear@example.com" }
              as: Anonymous
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/submit"
              as: Anonymous
            - call: "POST /touchpoints"
              payload: { application_id: "${app1_id}", channel_id: "${ch1_id}", touch_type: "IMPRESSION", occurred_at: "2026-07-28T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a1_tp1_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app1_id}", channel_id: "${ch2_id}", touch_type: "CLICK", occurred_at: "2026-07-29T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a1_tp2_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app1_id}", channel_id: "${ch3_id}", touch_type: "CLICK", occurred_at: "2026-07-30T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a1_tp3_id: $.data.id }
            - call: "POST /applications/${app1_id}/screen"
              as: RecruitingOps
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "position@example.com" }
              as: Anonymous
              captures: { app2_id: $.data.id }
            - call: "POST /applications/${app2_id}/submit"
              as: Anonymous
            - call: "POST /touchpoints"
              payload: { application_id: "${app2_id}", channel_id: "${ch1_id}", touch_type: "IMPRESSION", occurred_at: "2026-07-28T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a2_tp1_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app2_id}", channel_id: "${ch2_id}", touch_type: "CLICK", occurred_at: "2026-07-29T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a2_tp2_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app2_id}", channel_id: "${ch3_id}", touch_type: "CLICK", occurred_at: "2026-07-30T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a2_tp3_id: $.data.id }
            - call: "POST /applications/${app2_id}/screen"
              as: RecruitingOps
          trigger:
            - call: "POST /applications/${app1_id}/decide"
              payload: { outcome: "QUALIFIED" }
              as: RecruitingOps
            - call: "PATCH /programs/${program_id}"
              payload: { attribution_model: "POSITION_BASED" }
              as: BrandProgramLead
            - call: "POST /applications/${app2_id}/decide"
              payload: { outcome: "QUALIFIED" }
              as: RecruitingOps
          assert:
            - "Application.${app1_id}.attribution_model_applied == LINEAR"
            - "Application.${app1_id}.eligible_touch_count == 3 and attributed_credit_bp_total == 10000"
            - "Touchpoint.${a1_tp1_id}.credit_bp == 3334"
            - "Touchpoint.${a1_tp2_id}.credit_bp == 3333"
            - "Touchpoint.${a1_tp3_id}.credit_bp == 3333"
            - "Application.${app2_id}.attribution_model_applied == POSITION_BASED"
            - "Application.${app2_id}.eligible_touch_count == 3 and attributed_credit_bp_total == 10000"
            - "Touchpoint.${a2_tp1_id}.credit_bp == 4000"
            - "Touchpoint.${a2_tp2_id}.credit_bp == 2000"
            - "Touchpoint.${a2_tp3_id}.credit_bp == 4000"
            - "Channel.${ch1_id}.credited_qualified_bp == 7334"
            - "Channel.${ch2_id}.credited_qualified_bp == 5333"
            - "Channel.${ch3_id}.credited_qualified_bp == 7333"
            - "Channel.${ch2_id}.blended_target_cents == 15000 and cpqa_cents == 0 and pacing_status == ON_TARGET"

      - name: persona_mix_survey_weighted_vs_engagement_weighted_on_identical_signals
        grounds:
          - calculations.persona_channel_mix
          - entities.CandidatePersona.fields.mix_method
          - entities.CandidatePersona.fields.channel_mix
          - entities.CandidatePersona.fields.mix_confidence_pct
          - entities.ChannelPreferenceSignal.fields.engagement_events
          - state_machines.CandidatePersona.DRAFT_to_IN_REVIEW
        distinguishing_aspect: |
          Two personas of the same job family receive byte-identical signal pairs; the
          SURVEY_WEIGHTED variant weights by sample_size and produces 8571/1429 bp, while the
          ENGAGEMENT_WEIGHTED variant weights engagement_events by the 10-percent-per-30-days
          step decay (the 90-day-old signal keeps 70 percent) and inverts the ranking to
          3636/6364 bp - a different conserved-total split of the same 10000 bp from the same rows.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program and one JobFamily."
            - "Two Channels created in order: Board A (JOB_BOARD) then Social B (SOCIAL)."
            - "Two DRAFT CandidatePersona rows of that family with research_window_days 180: persona S with mix_method SURVEY_WEIGHTED and persona E with mix_method ENGAGEMENT_WEIGHTED."
            - "Each persona owns the same two signals: Board A with preference_score 80, sample_size 300, engagement_events 100, collected_at 2026-07-31T00:00:00Z (age 1 day, decay 100 percent); Social B with preference_score 40, sample_size 100, engagement_events 500, collected_at 2026-05-03T00:00:00Z (age exactly 90 days, decay 70 percent)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR" }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Social B", channel_type: "SOCIAL", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch2_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Survey Persona", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_s_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Engagement Persona", mix_method: "ENGAGEMENT_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_e_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_s_id}", channel_id: "${ch1_id}", preference_score: 80, sample_size: 300, engagement_events: 100, collected_at: "2026-07-31T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_s_id}", channel_id: "${ch2_id}", preference_score: 40, sample_size: 100, engagement_events: 500, collected_at: "2026-05-03T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_e_id}", channel_id: "${ch1_id}", preference_score: 80, sample_size: 300, engagement_events: 100, collected_at: "2026-07-31T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_e_id}", channel_id: "${ch2_id}", preference_score: 40, sample_size: 100, engagement_events: 500, collected_at: "2026-05-03T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
          trigger:
            - call: "POST /candidate-personas/${persona_s_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_e_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
          assert:
            - "CandidatePersona.${persona_s_id}.state == IN_REVIEW and signal_count == 2"
            - "CandidatePersona.${persona_s_id}.channel_mix == [{channel_id: ${ch1_id}, share_bp: 8571}, {channel_id: ${ch2_id}, share_bp: 1429}]"
            - "CandidatePersona.${persona_s_id}.mix_confidence_pct == 40"
            - "CandidatePersona.${persona_e_id}.state == IN_REVIEW and signal_count == 2"
            - "CandidatePersona.${persona_e_id}.channel_mix == [{channel_id: ${ch2_id}, share_bp: 6364}, {channel_id: ${ch1_id}, share_bp: 3636}]"
            - "CandidatePersona.${persona_e_id}.mix_confidence_pct == 40"
            - "The two share_bp lists sum to exactly 10000 each, and the ENGAGEMENT_WEIGHTED ranking is the reverse of the SURVEY_WEIGHTED ranking."

  # =========================================================================
  # Rule 2 - combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: flight_pricing_pins_tier_from_base_gross_and_fee_on_net_mode_c
        grounds:
          - calculations.flight_gross_cost
          - entities.MediaFlight.fields.cost_tier
          - entities.MediaFlight.fields.volume_discount_cents
          - entities.MediaFlight.fields.platform_fee_cents
          - entities.MediaFlight.fields.total_cost_cents
          - state_machines.MediaFlight.null_to_RESERVED
        distinguishing_aspect: |
          Mode (c) - operation-order sensitivity: a SOCIAL flight of 65000 cents x 8 days sits at
          base_gross_cents 520000, just above TIER_2_FLOOR_CENTS, and the 5 percent volume discount
          pushes the net (494000) back below that floor; only the pinned order (tier fixed from
          base_gross, fee charged on net) yields total_cost_cents 518700, while re-deriving the
          tier from the net gives 523640 and charging the fee on base_gross gives 520000.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program with pool_social_cents 1000000 and flex_reserve_cents 0."
            - "One JobFamily with dedicated_budget_cents 0, so the whole flight is funded from POOL_SOCIAL."
            - "One SOCIAL Channel named Social B with daily_capacity_cents 100000 and min_flight_days 1."
            - "One JobPosting of that family in content_status DRAFT - reservation does not require publication."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_social_cents: 1000000, flex_reserve_cents: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Social B", channel_type: "SOCIAL", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch_social_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { program_version: $.data.version }
          trigger:
            - call: "POST /media-flights"
              payload: { channel_id: "${ch_social_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-09", daily_cap_cents: 65000, expected_program_version: "${program_version}" }
              as: MediaBuyer
              captures: { flight_id: $.data.id }
          assert:
            - "MediaFlight.${flight_id}.flight_days == 8"
            - "MediaFlight.${flight_id}.base_gross_cents == 520000"
            - "MediaFlight.${flight_id}.cost_tier == TIER_2"
            - "MediaFlight.${flight_id}.volume_discount_cents == 26000"
            - "MediaFlight.${flight_id}.platform_fee_cents == 24700"
            - "MediaFlight.${flight_id}.total_cost_cents == 518700"
            - "MediaFlight.${flight_id}.reserved_cents == 518700 and state == RESERVED"
            - "Exactly one BudgetLedgerEntry exists for the flight: bucket POOL_SOCIAL, entry_type RESERVE, delta_cents 518700"
            - "Program.${program_id}.committed_budget_cents == 518700"
            - "total_cost_cents is neither 523640 (tier re-derived from the net) nor 520000 (fee charged on base_gross)"
      - name: linear_attribution_remainder_uses_floor_then_largest_remainder_mode_b
        grounds:
          - calculations.application_touch_credit
          - entities.Touchpoint.fields.credit_bp
          - entities.Application.fields.attributed_credit_bp_total
          - entities.Application.fields.eligible_touch_count
          - state_machines.Application.SCREENED_to_QUALIFIED
        distinguishing_aspect: |
          Mode (b) - rounding-mode sensitivity: seven eligible touches make the LINEAR share
          10000/7 = 1428.5714..., which round-half-up would turn into 1429 for every touch and
          break conservation at 10003; the declared floor-then-largest-remainder rule instead
          hands 1429 to the four earliest touches and 1428 to the remaining three, so the total
          is exactly 10000. Only a 4/3 split is correct - 7x1429, 7x1428 (9996) and any
          nearest-even variant all fail.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program with attribution_model LINEAR."
            - "One JobFamily with an APPROVED CandidatePersona and one PUBLISHED, CLEARED JobPosting."
            - "One SCREENED Application carrying seven Touchpoints on the same JOB_BOARD channel, occurred_at 2026-07-25T00:00:00Z through 2026-07-31T00:00:00Z (one per day, all inside the lookback window)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR" }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "research is current" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "seven@example.com" }
              as: Anonymous
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              as: Anonymous
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "IMPRESSION", occurred_at: "2026-07-25T00:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { tp1_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "IMPRESSION", occurred_at: "2026-07-26T00:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { tp2_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "IMPRESSION", occurred_at: "2026-07-27T00:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { tp3_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "CLICK", occurred_at: "2026-07-28T00:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { tp4_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "CLICK", occurred_at: "2026-07-29T00:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { tp5_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "CLICK", occurred_at: "2026-07-30T00:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { tp6_id: $.data.id }
            - call: "POST /touchpoints"
