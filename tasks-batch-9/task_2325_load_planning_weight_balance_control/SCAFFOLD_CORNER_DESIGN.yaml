      - name: post_departure_amendment_is_conditional_on_the_flight_having_departed
        claim_type: conditional_action
        grounds:
          - endpoints[POST /load-sheets/{id}/amend]
          - validations[priority=8]
          - state_machines.LoadSheet.transitions.ACCEPTED_to_AMENDED
        distinguishing_aspect: |
          The same call on the same accepted sheet is refused before departure
          and allowed after it: while the flight is LOAD_CONTROLLED the
          amendment is 409 ERR_FLIGHT_INVALID_STATE, and once
          POST /flights/{id}/depart has run the identical call answers 200 and
          moves the sheet to AMENDED. The captain's acceptance is preserved
          through the amendment, and the final figures stay at the accepted
          values because no change was recorded.
        test_recipe:
          setup:
            - "Fixture FX-A computed and issued (issued_takeoff_weight_kg 58200.00, issued_index_tow 87.26, lmc_allowance_kg 500.00), accepted by captain cpt-01 so the flight is LOAD_CONTROLLED with load_release_state RELEASED."
