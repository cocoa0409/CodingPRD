  # =========================================================================
  # RULE 8 of 9 -- resource_temporal_overlap (3 instances)
  # Resource ClubMember  : HALF-OPEN windows, pure pairwise test, touching is legal.
  # Resource MarkBoat    : windows WIDENED by a buffer at both ends, AGGREGATE
  #                        capacity test against concurrent_assignment_limit.
  # Resource start line  : CLOSED prestart windows plus a mandatory 3-minute gap
  #                        between consecutive windows.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: member_duty_windows_touch_allowed_overlap_rejected
        resource_entity: ClubMember
        interval_semantics: "half-open [start, end); pairwise; two windows that touch at a single instant do NOT collide; capacity is 1"
        grounds:
          - validations.priority_34_ERR_MEMBER_DUTY_OVERLAP
          - endpoints.POST_duty_assignments
          - entities.DutyAssignment.fields.window_start_utc
          - entities.ClubMember.fields.assigned_duty_minutes
        distinguishing_aspect: |
          Pure half-open pairwise arithmetic on a person: the volunteer may hand over at the exact
          instant one duty ends and the next begins, because the first interval excludes its own end
          point. The second trigger overlaps the standing 14:00-16:00 duty by one hour and is refused.
          An implementation using closed intervals rejects the legal 14:00 handover; one using a buffer
          (the MarkBoat semantics) rejects it as well. The minute ledger is the witness: it reads 240
          after two accepted duties and does not move on the refusal.
        test_recipe:
          setup:
            - "Two club members: the regatta chair and one volunteer."
            - "A regatta with an NOR and an SI published, so it is SI_PUBLISHED; duty assignment is not phase-guarded."
            - "The volunteer already holds one PROPOSED TIMEKEEPER duty over the half-open window [12:00, 14:00) on 2026-08-05, worth 120 minutes."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Tom Isley", email: "tom.isley@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_v1: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Duty Window Regatta", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v1}", position: "TIMEKEEPER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T14:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_1: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v1}", position: "SIGNALS", window_start_utc: "2026-08-05T14:00:00Z", window_end_utc: "2026-08-05T16:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_2: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v1}", position: "SIGNALS", window_start_utc: "2026-08-05T15:00:00Z", window_end_utc: "2026-08-05T17:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 201: the touching window [14:00, 16:00) does not collide with [12:00, 14:00) because the first interval excludes 14:00"
            - "DutyAssignment.${d_2}.duty_minutes == 120 and status PROPOSED"
            - "trigger call 2 returns HTTP 409 with error_id ERR_MEMBER_DUTY_OVERLAP: [15:00, 17:00) overlaps the accepted [14:00, 16:00) by 60 minutes"
            - "ClubMember.${m_v1}.assigned_duty_minutes == 240, exactly 120 + 120, so the refused window added nothing"
            - "GET /regatta-ops/duty-assignments?member_id=${m_v1} returns total_count 2, only ${d_1} and ${d_2}"
            - "ClubMember.${m_v1}.version == 3: one increment per accepted duty create and none for the refusal"

      - name: mark_boat_buffer_widened_aggregate_limit_rejects_third_window
        resource_entity: MarkBoat
        interval_semantics: "each EXISTING window is widened by turnaround_buffer_minutes at BOTH ends before intersection, and the test is an AGGREGATE count against concurrent_assignment_limit rather than a pairwise veto"
        grounds:
          - validations.priority_35_ERR_MARK_BOAT_OVERBOOKED
          - entities.MarkBoat.fields.turnaround_buffer_minutes
          - entities.MarkBoat.fields.concurrent_assignment_limit
          - entities.MarkBoat.fields.committed_minutes
          - endpoints.POST_mark_boats
        distinguishing_aspect: |
          Completely different interval geometry from the member rule on a different resource entity: the
          collision test widens the stored windows by 20 minutes at each end and then counts how many of
          the widened windows the candidate touches, rejecting only when that count reaches the limit of
          2. The refused candidate [14:15, 14:45) overlaps NEITHER stored window in raw time -- there is a
          clean 60-minute hole between 14:00 and 15:00 -- so an implementation doing raw pairwise overlap
          accepts it. The accepted candidate [14:25, 14:35) sits inside the 20-minute dead band between
          the two widened windows and touches none of them, which shows the limit is aggregate and not a
          blanket ban on the hole.
        test_recipe:
          setup:
            - "Four club members: the chair and three mark boat drivers, so no member rule can interfere."
            - "A regatta in status SI_PUBLISHED chartering one mark boat with concurrent_assignment_limit 2 and turnaround_buffer_minutes 20."
            - "Two PROPOSED MARK_BOAT_DRIVER duties on that boat: driver one over [13:00, 14:00) and driver two over [15:00, 16:00), 60 minutes each, so committed_minutes is 120."
            - "Widened by the buffer these occupy [12:40, 14:20) and [14:40, 16:20), leaving a 20-minute dead band from 14:20 to 14:40."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Kit Marsh", email: "kit.marsh@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_v1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Ada Nunn", email: "ada.nunn@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_v2: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Gus Pratt", email: "gus.pratt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_v3: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Mark Boat Buffer Regatta", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/mark-boats", payload: { regatta_id: "${reg}", call_sign: "MB-ALFA", crew_capacity: 4, concurrent_assignment_limit: 2, turnaround_buffer_minutes: 20 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { mb: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v1}", mark_boat_id: "${mb}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T13:00:00Z", window_end_utc: "2026-08-05T14:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_1: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v2}", mark_boat_id: "${mb}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T15:00:00Z", window_end_utc: "2026-08-05T16:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_2: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v3}", mark_boat_id: "${mb}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T14:15:00Z", window_end_utc: "2026-08-05T14:45:00Z" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v3}", mark_boat_id: "${mb}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T14:25:00Z", window_end_utc: "2026-08-05T14:35:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_3: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_MARK_BOAT_OVERBOOKED: [14:15, 14:45) touches both widened windows, so the count 2 is not below concurrent_assignment_limit 2, even though it overlaps neither raw window"
            - "trigger call 2 returns HTTP 201: [14:25, 14:35) lies wholly inside the 14:20-to-14:40 dead band, so the widened-intersection count is 0"
            - "DutyAssignment.${d_3}.duty_minutes == 10 and status PROPOSED with mark_boat_id ${mb}"
            - "MarkBoat.${mb}.committed_minutes == 130, exactly 60 + 60 + 10, so the refused 30-minute window contributed nothing"
            - "GET /regatta-ops/duty-assignments?mark_boat_id=${mb} returns total_count 3"
            - "ClubMember.${m_v3}.assigned_duty_minutes == 10, and ClubMember.${m_v1}.assigned_duty_minutes == 60"

      - name: race_prestart_window_needs_three_minute_gap
        resource_entity: "the regatta start line, occupied through Race.scheduled_start_utc"
        interval_semantics: "CLOSED prestart interval [start - 5 min, start] plus a mandatory 3-minute gap between one window end and the next window start, so rejection can happen with no overlap at all"
        grounds:
          - validations.priority_33_ERR_START_LINE_WINDOW_CONFLICT
          - endpoints.POST_races
          - entities.Race.fields.scheduled_start_utc
        distinguishing_aspect: |
          A third geometry on a third resource: the interval is CLOSED at both ends and, on top of
          overlap, a separation constraint applies, so a candidate that is provably disjoint from every
          existing window can still be refused. Race 1 at 14:00 occupies [13:55, 14:00]. A race at 14:03
          overlaps and is refused; a race at 14:07 occupies [14:02, 14:07], which is disjoint yet leaves
          only a 2-minute gap and is refused as well; a race at 14:08 leaves exactly 3 minutes and is
          accepted, so the separation bound is inclusive. Neither the half-open member rule nor the
          buffer-widened mark boat rule would produce this trio of outcomes.
        test_recipe:
          setup:
            - "Two club members: the regatta chair and the principal race officer."
            - "A regatta in status SI_PUBLISHED; race scheduling is not phase-guarded."
            - "Race 1 is scheduled at 2026-08-05T14:00:00Z, so it occupies the closed prestart window [13:55, 14:00]."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Start Line Window Regatta", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 1, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 2, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:03:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 3, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:07:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 4, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:08:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { r4: $.data.id } }
            - { call: "GET /regatta-ops/races?regatta_id=${reg}", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_START_LINE_WINDOW_CONFLICT: the window [13:58, 14:03] overlaps [13:55, 14:00]"
            - "trigger call 2 returns HTTP 409 with the same error_id even though [14:02, 14:07] is disjoint from [13:55, 14:00]: the gap is only 2 minutes"
            - "trigger call 3 returns HTTP 201: [14:03, 14:08] leaves exactly a 3-minute gap after 14:00, and the bound is inclusive"
            - "Race.${r4}.start_status == PENDING, scoring_status == NOT_SCORED and start_blocked_reason == null, because the regatta holds no division with assigned entries"
            - "trigger call 4 returns total_count 2 with race_number values 1 and 4 only, so neither refusal created a Race row"
            - "Race.${r1}.scheduled_start_utc == 2026-08-05T14:00:00Z, untouched"

  # =========================================================================
  # RULE 9 of 9 -- compensating_invariant (2 instances)
  # Quantity 1: series points, a FLOAT scoring quantity conserved between
  #             entry-side grosses and race-side pools.
  # Quantity 2: volunteer minutes, an INTEGER capacity quantity conserved on two
  #             independent ledgers (a person and a vessel) at once.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: abandon_restores_series_points_conservation
        conserved_quantity: "sum over ACCEPTED entries of series_points_gross == sum over races with scoring_status FINAL and start_status != ABANDONED of points_pool_total, per calculations.series_points_conservation"
        forward_action: "POST /races/{id}/score on race 2, which adds one term to each side of the identity"
        compensating_action: "POST /races/{id}/abandon on race 2, which must remove exactly that term from both sides"
        grounds:
          - calculations.series_points_conservation
          - state_machines.Race.start_status.STARTED_to_ABANDONED
          - endpoints.POST_races_id_abandon
          - entities.Entry.fields.series_points_gross
          - entities.Race.fields.points_pool_total
        distinguishing_aspect: |
          The conserved quantity is a fractional scoring total that lives on BOTH sides of an identity
          spanning two entity types, so drift can hide on either side: an implementation that voids the
          results and zeroes points_pool_total but forgets to re-run the series aggregation leaves the
          entry side at 6.0 against a race side of 3.0. The abandon also has to drop the race out of
          Regatta.final_race_count, and it must not disturb race 1, whose 3.0 pool is the only surviving
          term. Every number here is a literal: 6.0 before, 3.0 after, and 0.0 in the abandoned pool.
        test_recipe:
          setup:
            - "Nine club members and two ISSUED TOD_PHRF certificates A 171.3 and B 218.8."
            - "A LOW_POINT regatta with discard_policy NONE and planned_race_count 6, division A CONFIRMED with both entries ACCEPTED, status RACING, three CONFIRMED whole-regatta duties."
            - "Races 1 at 14:00 and 2 at 14:10 are both STARTED, resulted with A beating B on corrected time, and SCORED to FINAL at clock 2026-08-05T18:00:00Z."
            - "Before the trigger the identity reads 2.0 + 4.0 == 3.0 + 3.0, that is 6.0 on both sides, and Regatta.final_race_count is 2."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Tom Isley", email: "tom.isley@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_tk: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Sara Quill", email: "sara.quill@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_sg: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Nils Brandt", email: "nils.brandt@yc.test", judge_certification_level: "REGIONAL" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_jc: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Ida Moss", email: "ida.moss@yc.test", judge_certification_level: "CLUB" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_j2: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
