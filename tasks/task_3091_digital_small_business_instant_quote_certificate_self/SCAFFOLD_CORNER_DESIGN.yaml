scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: business_account_creation_defaults_applied
        claim_type: creation
        grounds: [entities.BusinessAccount.fields.account_credit_cents, entities.BusinessAccount.fields.claims_free_flag]
        distinguishing_aspect: "A freshly onboarded account has computed defaults: credit 0, open claims 0, claims_free true; system fields are minted server-side."
        test_recipe:
          setup: ["No accounts exist."]
          setup_api_calls:
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Bakery LLC", contact_email: "cb@x.com", channel: "DIRECT" }
              as: Agent
              captures: { cb_id: $.data.id }
          trigger:
            - call: "GET /ins/business-accounts/${cb_id}"
              payload: {}
              as: Agent
          assert:
            - "BusinessAccount.${cb_id}.account_credit_cents == 0"
            - "BusinessAccount.${cb_id}.open_claim_count == 0"
            - "BusinessAccount.${cb_id}.claims_free_flag == true"
            - "BusinessAccount.${cb_id}.version == 1"

      - name: claim_evidence_has_no_version_field_immutable
        claim_type: immutability
        grounds: [entities.ClaimEvidence.common_fields]
        distinguishing_aspect: "ClaimEvidence (common_fields: false) responses contain no version or updated_at fields; the entity is append-only with no update endpoint."
        test_recipe:
          setup: ["One SUBMITTED claim on an ACTIVE policy exists."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
              captures: { cc_c_id: $.data.id }
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman repairs", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id }
            - call: "POST /ins/claims"
              payload: { policy_id: "${p_ch}", loss_occurred_at: "2026-09-01T00:00:00Z", description: "Ladder fell", claim_amount_cents: 150000 }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { cl_ch: $.data.id }
          trigger:
            - call: "POST /ins/claims/${cl_ch}/evidence"
              payload: { photo_ref: "ph://ev1", exif_taken_at: "2026-09-01T00:00:00Z", file_size_bytes: 2048 }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { ev1_id: $.data.id }
          assert:
            - "ClaimEvidence.${ev1_id} response body contains no version field"
            - "ClaimEvidence.${ev1_id} response body contains no updated_at field"
            - "Claim.${cl_ch}.evidence_count == 1"

      - name: class_code_risk_factor_out_of_range_rejected
        claim_type: type_constraint
        grounds: [entities.ClassCode.fields.risk_factor]
        distinguishing_aspect: "risk_factor 4.50 exceeds the declared 0.25..4.00 constraint and is rejected at creation."
        test_recipe:
          setup: ["No class codes needed."]
          setup_api_calls: []
          trigger:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_BAD", description: "Too risky", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 4.5, appetite_active: true }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 422 with error_id ERR_BUSINESS_CONSTRAINT_VIOLATION"

      - name: partner_channel_account_requires_partner_tenant
        claim_type: required_field
        grounds: [entities.BusinessAccount.fields.partner_tenant, "errors[ERR_CHANNEL_MISMATCH]"]
        distinguishing_aspect: "channel == PARTNER without partner_tenant violates the conditional field requirement at onboarding."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Embedded Co", contact_email: "ec@x.com", channel: "PARTNER" }
              as: PartnerPlatform
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 422 with error_id ERR_CHANNEL_MISMATCH"

      - name: computed_quote_fields_ignore_client_supplied_values
        claim_type: computed_field
        grounds: [entities.Quote.fields.risk_score, entities.Quote.fields.annual_premium_cents, entities.Quote.fields.class_code_id]
        distinguishing_aspect: "Client-supplied values for computed quote fields (risk_score, annual_premium_cents, class_code_id) are rejected as unknown fields — the server computes them from description and signals."
        test_recipe:
          setup: ["CC_C admitted for 'handyman'; one account."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
          trigger:
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {}, risk_score: 0, annual_premium_cents: 1, class_code_id: "spoof" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 400 with error_id ERR_VALIDATION"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: claim_terminal_paid_lockdown_triage_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Claim.PAID]
        distinguishing_aspect: "A PAID (terminal) claim rejects every further transition; triage on a PAID claim fails with a state error and no side effects fire."
        test_recipe:
          setup: ["One PAID claim exists (triage by adjuster adj-1, approve, payout by distinct finance fin-1)."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id }
            - call: "POST /ins/claims"
              payload: { policy_id: "${p_ch}", loss_occurred_at: "2026-09-01T00:00:00Z", description: "Ladder fell", claim_amount_cents: 150000 }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { cl_ch: $.data.id }
            - call: "POST /ins/claims/${cl_ch}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
            - call: "POST /ins/claims/${cl_ch}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
            - call: "POST /ins/claims/${cl_ch}/payout"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
          trigger:
            - call: "POST /ins/claims/${cl_ch}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 409 with error_id ERR_INVALID_STATE"
            - "Claim.${cl_ch}.status remains PAID"

      - name: endorsement_from_effective_cannot_transition_again
        claim_type: terminal_lockdown
        grounds: [state_machines.Endorsement]
        distinguishing_aspect: "Endorsements are DRAFT->EFFECTIVE within the creation call; a second mutation path does not exist, so the creation response already shows EFFECTIVE and repeated issuance against it is governed by its EFFECTIVE state, not DRAFT."
        test_recipe:
          setup: ["ACTIVE policy; one ADDITIONAL_INSURED endorsement created (EFFECTIVE)."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id, p_ch_v: $.data.version }
          trigger:
            - call: "POST /ins/policies/${p_ch}/endorsements"
              payload: { endorsement_type: "ADDITIONAL_INSURED", effective_at: "2026-09-01T00:00:00Z", expected_policy_version: "${p_ch_v}", ai_holder_name: "Landlord LP" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { en_ch: $.data.id }
          assert:
            - "Endorsement.${en_ch}.status == EFFECTIVE (created EFFECTIVE, never observable in DRAFT via API)"
            - "Policy.${p_ch}.version == ${p_ch_v} + 1"

      - name: policy_bound_to_active_auto_transition_on_clock
        claim_type: auto_transition
        grounds: [state_machines.Policy.BOUND_to_ACTIVE]
        distinguishing_aspect: "A policy bound with a future term_start sits in BOUND and auto-transitions to ACTIVE exactly when the clock reaches term_start."
        test_recipe:
          setup: ["Quote bound with requested_effective_at 2026-09-08 while clock is 2026-09-01."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-08T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id }
          trigger:
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ins/policies/${p_ch}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Policy.${p_ch}.status == ACTIVE"

      - name: referral_resolved_cannot_be_decided_twice
        claim_type: invalid_transition
        grounds: ["state_machines.Quote.REFERRED_to_QUOTED", "state_machines.Quote.REFERRED_to_DECLINED"]
        distinguishing_aspect: "A RESOLVED referral rejects a second decision: approving an already-approved referral fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["REFERRED quote with OPEN referral (CC_A base 20 + severity-80 signal 25 + two yes answers 20 = 65)."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_A", description: "Contractor", eligible_lines: ["GL", "PL", "TOOLS"], base_rates_cents: { GL: 12000, PL: 18000, TOOLS: 6000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "contractor", class_code: "CC_A", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner GC", contact_email: "gc@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_gc: $.data.id }
            - call: "POST /ins/risk-signals"
              payload: { business_account_id: "${ba_gc}", signal_type: "LOSS_HISTORY", severity: 80, detail: "Prior loss" }
              as: PlatformAdmin
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_gc}", raw_description: "contractor", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: { q1: "yes", q2: "yes" } }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { q_gc: $.data.id }
            - call: "GET /ins/quotes/${q_gc}/referral"
              payload: {}
              as: Underwriter
              captures: { ref_gc: $.data.0.id }
            - call: "POST /ins/referrals/${ref_gc}/approve"
              payload: {}
              as: Underwriter
              as_user_id: uw-1
          trigger:
            - call: "POST /ins/referrals/${ref_gc}/approve"
              payload: {}
              as: Underwriter
              as_user_id: uw-1
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 409 with error_id ERR_INVALID_STATE"
            - "UnderwriterReferral.${ref_gc}.decision remains APPROVED"

      - name: cancel_cascades_void_certificates_and_draft_endorsements
        claim_type: cascade_down
        grounds: [state_machines.Policy.transitions, state_machines.Certificate.ISSUED_to_VOIDED]
        distinguishing_aspect: "Cancellation cascades conditionally: ISSUED certificates become VOIDED and any residual DRAFT endorsements become VOID, while the EFFECTIVE additional-insured endorsement is retained as history."
        test_recipe:
          setup: ["ACTIVE policy with one EFFECTIVE ADDITIONAL_INSURED endorsement and one ISSUED certificate."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id, p_ch_v: $.data.version }
            - call: "POST /ins/policies/${p_ch}/endorsements"
              payload: { endorsement_type: "ADDITIONAL_INSURED", effective_at: "2026-09-01T00:00:00Z", expected_policy_version: "${p_ch_v}", ai_holder_name: "Landlord LP" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { en_ch: $.data.id }
            - call: "POST /ins/certificates"
              payload: { policy_id: "${p_ch}", endorsement_id: "${en_ch}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { cert_ch: $.data.id }
          trigger:
            - call: "POST /ins/policies/${p_ch}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_ch}"
            - call: "GET /ins/policies/${p_ch}/certificates"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Certificate.${cert_ch}.status == VOIDED"
            - "Endorsement.${en_ch}.status remains EFFECTIVE (cancellation voids DRAFT endorsements and ISSUED certificates only)"
            - "Policy.${p_ch}.status == CANCELLED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: claims_free_discount_applies_at_threshold_boundary
        claim_type: threshold_boundary
        grounds: [calculations.premium_calculation, calculations.claim_triage]
        distinguishing_aspect: "claims_free_flag gates the 5% discount with exact boolean semantics: a claim sitting IN_REVIEW (open but never PAID) still leaves claims_free true at quote time, so the provisional premium keeps the 5% discount."
        test_recipe:
          setup: ["CC_C policy with an IN_REVIEW claim (never PAID); the same account takes a fresh quote."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id }
            - call: "POST /ins/claims"
              payload: { policy_id: "${p_ch}", loss_occurred_at: "2026-09-01T00:00:00Z", description: "Ladder fell", claim_amount_cents: 150000 }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { cl_ch: $.data.id }
            - call: "POST /ins/claims/${cl_ch}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
          trigger:
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch2: $.data.id }
          assert:
            - "Quote.${q_ch2}.status == QUOTED (superseding the bound quote is impossible; new quote is for a fresh term)"
            - "Quote.${q_ch2}.annual_premium_cents == 142500 (claims_free still true: IN_REVIEW is not PAID)"

      - name: certificate_sequence_never_reuses_numbers_after_void
        claim_type: correct_result
        grounds: [calculations.certificate_sequence]
        distinguishing_aspect: "certificate_no counts all certificates ever created for the policy including VOIDED ones; voiding certificate n=1 then issuing again yields n=2, never a reused n=1."
        test_recipe:
          setup: ["ACTIVE policy with one EFFECTIVE AI endorsement and one ISSUED certificate; policy cancelled (cert VOIDED) then re-quoted and re-bound into a NEW policy is NOT needed — sequence is per policy, so instead use a second AI endorsement + second certificate on the live policy to show monotonic n, and a cancelled sibling policy to show its cert voided without renumbering."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
