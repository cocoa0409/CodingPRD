            - "AmendmentEvent.${ae_amend_id}.net_amount_cents == 800002"
            - "AmendmentEvent.${ae_amend_id}.landowner_share_cents == 200001"
            - "AmendmentEvent.${ae_rent_id}.share_bps_applied == 1250"
            - "AmendmentEvent.${ae_rent_id}.landowner_share_cents == 125000"
            - "AmendmentEvent.${ae_rent_id}.acquirer_share_cents == 875002"
            - "LeaseStream.${ls_id}.cumulative_revenue_share_landowner_cents == 575002"
            - "LeaseStream.${ls_id}.cumulative_revenue_share_acquirer_cents == 2225004"
  - rule_id: combinatorial_formula
    instances:
      - name: valuation_npv_composes_growth_compounding_discounting_and_renewal_haircut
        grounds:
          - calculations.stream_valuation_value
          - entities.StreamValuation.fields.growth_rate_bps
          - entities.StreamValuation.fields.value_cents
          - entities.LeaseStream.fields.escalator_type
        distinguishing_aspect: |
          Mode (a) of the formula: the 40-year NPV is a single expression that composes three
          independent inputs — the escalator's compounding growth numerator, the score-derived discount
          denominator and the 2000 bps renewal haircut applied only to years beyond the 15 contracted
          ones — plus the CPI cap that clips growth to 250 bps. Changing any one input alone moves the
          result: FIXED_PCT 300 bps yields 44627011, FIXED_PCT 400 bps yields 49734665, and CPI_CAPPED
          400 bps yields 42393442 because the cap overrides the stated escalator.
        test_recipe:
          setup:
            - "A tower company with three tower sites, each carrying one lease stream with annual rent 3600000 cents and 180 remaining months."
            - "Stream F3 escalates FIXED_PCT at 300 bps, stream F4 FIXED_PCT at 400 bps, stream C4 CPI_CAPPED at 400 bps."
            - "Each stream has exactly one ACTIVE INVESTMENT_GRADE ANCHOR tenancy, so every score is 40 and every base discount tier is 1000 bps."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-2001", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id_f3: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Owner _f3", entity_type: "LLC", contact_email: "owner_f3@x.example" }, as: AcquisitionAnalyst, captures: { lo_id_f3: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id_f3}", landowner_id: "${lo_id_f3}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id_f3: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id_f3}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id_f3: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id_f3}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v_f3: $.data.version } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-2002", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id_f4: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Owner _f4", entity_type: "LLC", contact_email: "owner_f4@x.example" }, as: AcquisitionAnalyst, captures: { lo_id_f4: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id_f4}", landowner_id: "${lo_id_f4}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 400, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id_f4: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id_f4}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id_f4: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id_f4}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v_f4: $.data.version } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-2003", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id_c4: $.data.id } }
