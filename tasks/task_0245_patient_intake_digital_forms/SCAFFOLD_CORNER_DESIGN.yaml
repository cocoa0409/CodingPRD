# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Patient Intake & Digital Forms — breadth probe over §1.1–§1.7.
# Each test_recipe is structured and §1.5-conformant; excluded_because stubs
# cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_clinic_minimal_required_fields
        claim_type: Creation
        grounds: [entities.Clinic, endpoints]
        distinguishing_aspect: "POST /clinics with only name -> 201; defaults applied (form_expiration_hours 72, copay_rounding PER_LINE_THEN_SUM, current_utc epoch, collected_copay_cents 0, active_queue_count 0)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "Solo Clinic" }
              as: ClinicAdmin
              captures: { cc: $.data.id }
          assert:
            - "response code == 201"
            - "Clinic.${cc}.form_expiration_hours == 72"
            - "Clinic.${cc}.copay_rounding == PER_LINE_THEN_SUM"
            - "Clinic.${cc}.collected_copay_cents == 0"
            - "Clinic.${cc}.active_queue_count == 0"
            - "Clinic.${cc}.version == 1"

      - name: create_appointment_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Appointment, endpoints]
        distinguishing_aspect: "POST /appointments omitting start_utc -> ERR_INVALID_REQUEST (400); start_utc is a required input field."
        test_recipe:
          setup: ["Clinic, provider, patient exist."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE1" }
              as: ClinicAdmin
              captures: { ce1: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce1}", full_name: "Dr Z", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { pz: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce1}", legal_name: "Pat Z", date_of_birth: "1990-01-01", phone: "555-9000" }
              as: FrontDeskStaff
              captures: { ptz: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { clinic_id: "${ce1}", provider_id: "${pz}", patient_id: "${ptz}", end_utc: "2026-07-01T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { e: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response code == 400"

      - name: get_nonexistent_intake_session_404
        claim_type: Not Found
        grounds:
          - "entities.IntakeSession"
          - "errors[ERR_SESSION_NOT_FOUND]"
        distinguishing_aspect: "GET /intake-sessions/{random-uuid} -> ERR_SESSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /intake-sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDeskStaff
              captures: { e: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_FOUND"
            - "response code == 404"

      - name: appointment_provisional_copay_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Appointment.fields.provisional_copay_cents, calculations.estimate_copay]
        distinguishing_aspect: "provisional_copay_cents is source: computed = plan_default_copay_cents=2500; it is not a client input and equals the estimate."
        test_recipe:
          setup: ["Clinic, provider, patient."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE2" }
              as: ClinicAdmin
              captures: { ce2: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce2}", full_name: "Dr Y", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { py: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce2}", legal_name: "Pat Y", date_of_birth: "1990-01-01", phone: "555-9100" }
              as: FrontDeskStaff
              captures: { pty: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { clinic_id: "${ce2}", provider_id: "${py}", patient_id: "${pty}", start_utc: "2026-07-02T10:00:00.000Z", end_utc: "2026-07-02T10:30:00.000Z", plan_default_copay_cents: 2500 }
              as: FrontDeskStaff
              captures: { ap: $.data.id }
          assert:
            - "Appointment.${ap}.provisional_copay_cents == 2500"
            - "Appointment.${ap}.status == SCHEDULED"

      - name: eligibility_check_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.EligibilityCheck]
        distinguishing_aspect: "EligibilityCheck has common_fields: false -> only id + created_at, no version/updated_at, no update endpoint; it is an append-only event."
        excluded_because:
          difficulty_instance: transitive_cascade / eligibility_ineligible_self_pay_cascade
          rationale: "EligibilityCheck records are produced and read only as a by-product of the eligibility cascade exercised there; immutability is structural (no mutation endpoint exists)."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sign_already_signed_consent_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ConsentDocument.PENDING_to_SIGNED"
          - "errors[ERR_CONSENT_NOT_PENDING]"
        distinguishing_aspect: "Signing a consent already SIGNED -> ERR_CONSENT_NOT_PENDING (409); no second signature side effect."
        test_recipe:
          setup: ["Provider requires [HIPAA_NPP]; session; consent created and signed once."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE3", form_expiration_hours: 72 }
              as: ClinicAdmin
              captures: { ce3: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce3}", full_name: "Dr X", required_consent_codes: ["HIPAA_NPP"], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { px: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce3}", legal_name: "Pat X", date_of_birth: "1990-01-01", phone: "555-9200" }
              as: FrontDeskStaff
              captures: { ptx: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce3}", provider_id: "${px}", patient_id: "${ptx}", start_utc: "2026-07-03T10:00:00.000Z", end_utc: "2026-07-03T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apx: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apx}" }
              as: FrontDeskStaff
              captures: { sx: $.data.id }
            - call: "POST /consent-documents"
              payload: { intake_session_id: "${sx}", consent_code: "HIPAA_NPP" }
              as: FrontDeskStaff
              captures: { cx: $.data.id }
            - call: "POST /consent-documents/${cx}/sign"
              payload: { signer_name: "Pat X" }
              as: Patient
          trigger:
            - call: "POST /consent-documents/${cx}/sign"
              payload: { signer_name: "Pat X" }
              as: Patient
              captures: { e: $.data.error_id }
          assert:
            - "response error_id == ERR_CONSENT_NOT_PENDING"
            - "response code == 409"

      - name: consent_code_not_required_by_provider
        claim_type: guarded transitions
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_CONSENT_CODE_NOT_REQUIRED]"
        distinguishing_aspect: "Creating a ConsentDocument with consent_code not in provider.required_consent_codes -> ERR_CONSENT_CODE_NOT_REQUIRED (409)."
        test_recipe:
          setup: ["Provider requires only [HIPAA_NPP]; session opened."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE4", form_expiration_hours: 72 }
              as: ClinicAdmin
              captures: { ce4: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce4}", full_name: "Dr W", required_consent_codes: ["HIPAA_NPP"], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { pw: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce4}", legal_name: "Pat W", date_of_birth: "1990-01-01", phone: "555-9300" }
              as: FrontDeskStaff
              captures: { ptw: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce4}", provider_id: "${pw}", patient_id: "${ptw}", start_utc: "2026-07-04T10:00:00.000Z", end_utc: "2026-07-04T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apw: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apw}" }
              as: FrontDeskStaff
              captures: { sw: $.data.id }
          trigger:
            - call: "POST /consent-documents"
              payload: { intake_session_id: "${sw}", consent_code: "FINANCIAL_POLICY" }
              as: FrontDeskStaff
              captures: { e: $.data.error_id }
          assert:
            - "response error_id == ERR_CONSENT_CODE_NOT_REQUIRED"
            - "response code == 409"

      - name: terminal_session_complete_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.IntakeSession.CHECKED_IN_to_COMPLETED"
          - "errors[ERR_SESSION_NOT_CANCELLABLE]"
        distinguishing_aspect: "Cancelling a COMPLETED session -> ERR_SESSION_NOT_CANCELLABLE (409): COMPLETED is terminal on the workflow dimension."
        test_recipe:
          setup: ["A session driven to COMPLETED: no required forms, INSURED -> READY; check-in; queue called/room-in/done; complete."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE5", form_expiration_hours: 72, facility_fee_cents: 0 }
              as: ClinicAdmin
              captures: { ce5: $.data.id }
            - call: "POST /exam-rooms"
              payload: { clinic_id: "${ce5}", label: "R" }
              as: ClinicAdmin
              captures: { rm5: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce5}", full_name: "Dr V", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { pv: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce5}", legal_name: "Pat V", date_of_birth: "1990-01-01", phone: "555-9400" }
              as: FrontDeskStaff
              captures: { ptv: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce5}", provider_id: "${pv}", patient_id: "${ptv}", start_utc: "2026-07-05T10:00:00.000Z", end_utc: "2026-07-05T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apv: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apv}" }
              as: FrontDeskStaff
              captures: { sv: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sv}", payer_name: "Acme", member_id: "MV", plan_copay_cents: 0, plan_coinsurance_pct: 0, facility_coinsurance_pct: 0, remaining_deductible_cents: 0, visit_allowed_amount_cents: 0 }
              as: FrontDeskStaff
              captures: { cv: $.data.id }
            - call: "POST /insurance-cards/${cv}/verify"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${cv}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
            - call: "POST /intake-sessions/${sv}/check-in"
              payload: {}
              as: FrontDeskStaff
            - call: "GET /queue-entries"
              payload: { intake_session_id: "${sv}" }
              as: FrontDeskStaff
              captures: { qv: $.data.0.id }
            - call: "POST /queue-entries/${qv}/call"
              payload: { exam_room_id: "${rm5}" }
              as: FrontDeskStaff
            - call: "POST /queue-entries/${qv}/room-in"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /queue-entries/${qv}/done"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /intake-sessions/${sv}/complete"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /intake-sessions/${sv}/cancel"
              payload: {}
              as: FrontDeskStaff
              captures: { e: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_CANCELLABLE"
            - "IntakeSession.${sv}.workflow_status == COMPLETED"

      - name: eligibility_needs_review_reverify_cycle
        claim_type: cyclic
        grounds: [state_machines.InsuranceCard.NEEDS_REVIEW_to_VERIFYING, state_machines.InsuranceCard.VERIFYING_to_NEEDS_REVIEW]
        distinguishing_aspect: "A card resolved NEEDS_REVIEW can be re-verified (NEEDS_REVIEW->VERIFYING) and re-resolved, forming a cycle; second resolve to ELIGIBLE sets final responsibility."
        test_recipe:
          setup: ["Clinic facility 0; provider no required forms; session; card allowed 0; verified then resolved NEEDS_REVIEW."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE6", facility_fee_cents: 0 }
              as: ClinicAdmin
              captures: { ce6: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce6}", full_name: "Dr U", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { pu: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce6}", legal_name: "Pat U", date_of_birth: "1990-01-01", phone: "555-9500" }
              as: FrontDeskStaff
              captures: { ptu: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce6}", provider_id: "${pu}", patient_id: "${ptu}", start_utc: "2026-07-06T10:00:00.000Z", end_utc: "2026-07-06T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apu: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apu}" }
              as: FrontDeskStaff
              captures: { su: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${su}", payer_name: "Acme", member_id: "MU", plan_copay_cents: 0, plan_coinsurance_pct: 0, facility_coinsurance_pct: 0, remaining_deductible_cents: 0, visit_allowed_amount_cents: 0 }
              as: FrontDeskStaff
              captures: { cu: $.data.id }
            - call: "POST /insurance-cards/${cu}/verify"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${cu}/resolve-eligibility"
              payload: { outcome: "NEEDS_REVIEW" }
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${cu}/verify"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /insurance-cards/${cu}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
          assert:
            - "InsuranceCard.${cu}.eligibility_status == ELIGIBLE"
            - "IntakeSession.${su}.financial_status == INSURED"

      - name: copay_void_path_no_ledger_change
        claim_type: Side Effect Execution
        grounds: [state_machines.CopayPayment.AUTHORIZED_to_VOIDED, entities.Clinic.fields.collected_copay_cents]
        distinguishing_aspect: "Voiding an AUTHORIZED (never captured) copay -> VOIDED with clinic.collected_copay_cents unchanged at 0 and session still COPAY_DUE."
        test_recipe:
          setup: ["Session COPAY_DUE final 9100; CopayPayment authorized 9100 (not captured)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE7", copay_rounding: "PER_LINE_THEN_SUM", facility_fee_cents: 500 }
              as: ClinicAdmin
              captures: { ce7: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce7}", full_name: "Dr T", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { pt: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce7}", legal_name: "Pat T", date_of_birth: "1990-01-01", phone: "555-9600" }
              as: FrontDeskStaff
              captures: { ptt: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce7}", provider_id: "${pt}", patient_id: "${ptt}", start_utc: "2026-07-07T10:00:00.000Z", end_utc: "2026-07-07T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apt: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apt}" }
              as: FrontDeskStaff
              captures: { st: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${st}", payer_name: "Acme", member_id: "MT", plan_copay_cents: 3000, plan_coinsurance_pct: 20, facility_coinsurance_pct: 0, remaining_deductible_cents: 5000, visit_allowed_amount_cents: 8000 }
              as: FrontDeskStaff
              captures: { ct: $.data.id }
            - call: "POST /insurance-cards/${ct}/verify"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${ct}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
            - call: "GET /intake-sessions/${st}"
              payload: {}
              as: BillingClerk
              captures: { st_v: $.data.version }
            - call: "POST /copay-payments"
              payload: { intake_session_id: "${st}", amount_cents: 9100, expected_intake_session_version: "${st_v}" }
              as: BillingClerk
              captures: { payt: $.data.id }
          trigger:
            - call: "POST /copay-payments/${payt}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "CopayPayment.${payt}.status == VOIDED"
            - "Clinic.${ce7}.collected_copay_cents == 0"
            - "IntakeSession.${st}.financial_status == COPAY_DUE"

      - name: clock_advance_expires_incomplete_session
        claim_type: Side Effect Execution
        grounds: [state_machines.IntakeSession.IN_PROGRESS_to_EXPIRED, state_machines.Reminder.SCHEDULED_to_SUPPRESSED, endpoints]
        distinguishing_aspect: "Advancing the clock to >= session.expires_at expires an IN_PROGRESS session and cascades its SCHEDULED reminders to SUPPRESSED."
        test_recipe:
          setup: ["Clinic form_expiration_hours 1; session created at epoch -> expires_at 1970-01-01T01:00:00Z; one consent created so session IN_PROGRESS; a reminder SCHEDULED before expiry."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE8", form_expiration_hours: 1, reminder_min_gap_minutes: 240, reminder_quiet_start_min: 1320, reminder_quiet_end_min: 420 }
              as: ClinicAdmin
              captures: { ce8: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce8}", full_name: "Dr S", required_consent_codes: ["HIPAA_NPP"], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { ps: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce8}", legal_name: "Pat S", date_of_birth: "1990-01-01", phone: "555-9700" }
              as: FrontDeskStaff
              captures: { pts: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce8}", provider_id: "${ps}", patient_id: "${pts}", start_utc: "1970-01-02T10:00:00.000Z", end_utc: "1970-01-02T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { aps: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${aps}" }
              as: FrontDeskStaff
              captures: { ss: $.data.id }
            - call: "POST /consent-documents"
              payload: { intake_session_id: "${ss}", consent_code: "HIPAA_NPP" }
              as: FrontDeskStaff
              captures: { cds: $.data.id }
            - call: "POST /reminders"
              payload: { intake_session_id: "${ss}", target_kind: "CONSENT", scheduled_utc: "1970-01-01T02:00:00.000Z", scheduled_local_min: 120 }
              as: FrontDeskStaff
              captures: { rs: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${ce8}", to_iso8601: "1970-01-01T01:00:00.000Z" }
              as: ClinicAdmin
          assert:
            - "IntakeSession.${ss}.workflow_status == EXPIRED"
            - "Reminder.${rs}.status == SUPPRESSED"

      - name: sign_on_expired_session_blocked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.ConsentDocument.PENDING_to_SIGNED"
          - "errors[ERR_SESSION_EXPIRED]"
        distinguishing_aspect: "After the session is EXPIRED by the clock, signing its PENDING consent -> ERR_SESSION_EXPIRED (409)."
        test_recipe:
          setup: ["Reuse the expiration setup: session EXPIRED with a PENDING HIPAA_NPP consent."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE9", form_expiration_hours: 1 }
              as: ClinicAdmin
              captures: { ce9: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${ce9}", full_name: "Dr R2", required_consent_codes: ["HIPAA_NPP"], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { pr2: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${ce9}", legal_name: "Pat R2", date_of_birth: "1990-01-01", phone: "555-9800" }
              as: FrontDeskStaff
              captures: { ptr2: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${ce9}", provider_id: "${pr2}", patient_id: "${ptr2}", start_utc: "1970-01-02T10:00:00.000Z", end_utc: "1970-01-02T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apr2: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apr2}" }
              as: FrontDeskStaff
              captures: { sr2: $.data.id }
            - call: "POST /consent-documents"
              payload: { intake_session_id: "${sr2}", consent_code: "HIPAA_NPP" }
              as: FrontDeskStaff
              captures: { cdr2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${ce9}", to_iso8601: "1970-01-01T01:00:00.000Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /consent-documents/${cdr2}/sign"
              payload: { signer_name: "Pat R2" }
              as: Patient
              captures: { e: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_EXPIRED"
            - "ConsentDocument.${cdr2}.status == PENDING"

      - name: ready_for_visit_enqueue_bubble_up
        claim_type: Bubble up
        grounds: [state_machines.IntakeSession.IN_PROGRESS_to_READY_FOR_VISIT]
        distinguishing_aspect: "Already covered: the depth-3 sign->READY->enqueue cascade demonstrates bubble-up of forms_complete into a parent auto-transition."
        excluded_because:
          difficulty_instance: transitive_cascade / sign_last_consent_ready_enqueues_queue
          rationale: "The bubble-up from child consent completion to the session READY_FOR_VISIT auto-transition is asserted there."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: provisional_responsibility_recorded_on_check
        claim_type: Variant Selection
        grounds: [calculations.finalize_patient_responsibility, entities.EligibilityCheck.fields.provisional_responsibility_cents]
        distinguishing_aspect: "On resolve ELIGIBLE the EligibilityCheck.provisional_responsibility_cents uses the deductible-unmet variant = min(3000,8000)+min(5000,8000)+0 facility = 8000, distinct from final 9100."
        test_recipe:
          setup: ["Clinic facility 0; provider no required forms; session; card copay 3000/coins 20/fac 0/deductible 5000/allowed 8000; verified."]
          setup_api_calls:
            - call: "POST /clinics"
