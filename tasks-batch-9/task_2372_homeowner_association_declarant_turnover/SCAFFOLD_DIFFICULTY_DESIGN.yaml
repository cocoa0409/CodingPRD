            - "TurnoverCase.${case_id}.turnover_posture == TRANSITION_RESTRICTED"

      - name: subsidy_reversal_four_hop_cascade_blocks_settlement
        grounds:
          - calculations.subsidy_receivable_balance
          - calculations.audit_unreconciled_delta
          - entities.SubsidyEntry.fields.reverses_entry_id
          - entities.AuditEngagement.fields.audited_receivable_snapshot_cents
          - entities.AuditEngagement.fields.unreconciled_delta_cents
          - entities.AuditEngagement.fields.finding_status
          - entities.TurnoverCase.fields.settlement_blocked
          - state_machines.AuditEngagement.ENGAGED_to_ISSUED
        distinguishing_aspect: |
          Depth-4 chain that crosses three entities and flips a gate the request never names: reversing a
          POSTED SubsidyEntry marks it REVERSED and mints the REVERSAL mirror (A) -> Association's
          subsidy_receivable_cents falls 1500000 -> 900000 (B) -> the already-ISSUED AuditEngagement
          re-derives unreconciled_delta_cents against its FROZEN snapshot 1500000, giving -600000 and
          flipping finding_status CLEAN -> EXCEPTION_NOTED (C) -> TurnoverCase.settlement_blocked becomes
          true (D). Chain ordering is observable because hop C compares against a frozen field: if hop C
          ran before hop B, or if the snapshot were re-derived, the delta would stay 0.
        test_recipe:
          setup:
            - "Association 'Ivywood' with a TurnoverCase (total_seats 5)."
            - "Two POSTED ACCRUAL SubsidyEntries by user declarant-1: 900000 for 2026-05 and 600000 for 2026-06, so subsidy_receivable_cents is 1500000."
            - "One AuditEngagement over 2026-05-01..2026-06-30, ISSUED by auditor-9 while the receivable was 1500000, so audited_receivable_snapshot_cents is 1500000, unreconciled_delta_cents is 0 and finding_status is CLEAN."
            - "TurnoverCase.settlement_blocked is false."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Ivywood", total_planned_lots: 20, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-04-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 500000, reserve_claim_pool_cents: 1000000, declarant_monthly_subsidy_cents: 150000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 900000, period_month: "2026-05" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry1_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 600000, period_month: "2026-06" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry2_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { audit_id: $.data.id }
            - call: "POST /hoa/audit-engagements/${audit_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
          trigger:
            - call: "POST /hoa/subsidy-entries/${entry2_id}/reverse"
              payload: { reason: "June accrual double-counted in the declarant ledger" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "GET /hoa/subsidy-entries"
              payload: { reverses_entry_id: "${entry2_id}" }
              as: Auditor
              as_user_id: "auditor-9"
          assert:
            - "before the trigger: AuditEngagement.${audit_id}.finding_status == CLEAN and unreconciled_delta_cents == 0"
            - "hop A: SubsidyEntry.${entry2_id}.status == REVERSED and the reverse call's response data.id == ${entry2_id}"
            - "hop A: the GET /hoa/subsidy-entries?reverses_entry_id=${entry2_id} list has total_count == 1 and its single row has direction == REVERSAL, amount_cents == 600000, period_month == 2026-06"
            - "hop B: Association.${assoc_id}.subsidy_receivable_cents == 900000"
            - "hop C: AuditEngagement.${audit_id}.audited_receivable_snapshot_cents == 1500000, unchanged by the reversal"
            - "hop C: AuditEngagement.${audit_id}.unreconciled_delta_cents == -600000"
            - "hop C: AuditEngagement.${audit_id}.finding_status == EXCEPTION_NOTED"
            - "hop D: TurnoverCase.${case_id}.settlement_blocked == true"
            - "SubsidyEntry.${entry1_id}.status == POSTED, untouched"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: claim_state_check_outranks_reserve_fiscal_shortfall
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - errors.ERR_CLAIM_STATE_INVALID
          - errors.ERR_CLAIM_RESERVE_INSUFFICIENT
          - calculations.defect_claim_reserve_amount
          - state_machines.DefectClaim.NOTICED_to_RESERVED
        distinguishing_aspect: |
          Category pair state (priority 9, 409) versus business_fiscal (priority 15, 422) on the same
          RESERVE call: the claim is still INVESTIGATING and the computed reserve 5450000 also exceeds
          reserve_claim_available_cents 100000, and the response MUST be ERR_CLAIM_STATE_INVALID (409),
          never ERR_CLAIM_RESERVE_INSUFFICIENT (422). The paired control call, made after the claim is
          NOTICED, isolates the fiscal rule and returns ERR_CLAIM_RESERVE_INSUFFICIENT (422).
        test_recipe:
          setup:
            - "Association 'Jasper Mill' with reserve_claim_pool_cents = 100000 and statute_of_repose_years = 8."
            - "One CommonAreaComponent COMPLETE with substantial_completion_date 2022-02-01T00:00:00Z and CONVEYED, so repose_deadline is 2030-02-01T00:00:00Z and the temporal rule is satisfied."
            - "One DefectClaim in INVESTIGATING with repair_cost_estimate_cents 5000000 (reserve would be 5000000 + 450000 = 5450000)."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Jasper Mill", total_planned_lots: 22, turnover_threshold_pct: 66.67, fixed_turnover_date: "2028-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 200000, reserve_claim_pool_cents: 100000, declarant_monthly_subsidy_cents: 50000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Bridge Deck", category: "STRUCTURE", replacement_cost_cents: 8000000, useful_life_years: 40, effective_age_years: 4, promised_completion_date: "2022-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2022-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Bridge deck spalling", repair_cost_estimate_cents: 5000000, diminution_value_cents: 3000000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call returns 409 with error_id ERR_CLAIM_STATE_INVALID"
            - "first trigger call does NOT return ERR_CLAIM_RESERVE_INSUFFICIENT even though the fiscal rule is also violated"
            - "third trigger call returns 422 with error_id ERR_CLAIM_RESERVE_INSUFFICIENT"
            - "DefectClaim.${claim_id}.status == NOTICED after all three calls"
            - "DefectClaim.${claim_id}.reserved_amount_cents == 0 and valuation_basis == null"
            - "Association.${assoc_id}.reserve_claim_committed_cents == 0 and reserve_claim_available_cents == 100000"

      - name: component_conveyance_referential_outranks_repose_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors.ERR_COMPONENT_NOT_CONVEYED
          - errors.ERR_REPOSE_PERIOD_EXPIRED
          - calculations.defect_repose_deadline
          - state_machines.DefectClaim.INVESTIGATING_to_NOTICED
        distinguishing_aspect: |
          Category pair business_referential (priority 10, 409) versus business_temporal (priority 11, 422)
          on the same NOTICE call: the component is only DEED_TENDERED and the repose deadline
          2024-01-10T00:00:00Z is already in the past at clock 2026-08-01T00:00:00Z, and the response MUST
          be ERR_COMPONENT_NOT_CONVEYED (409). The paired control, made after CONVEYANCE_ACCEPTED, isolates
          the temporal rule and returns ERR_REPOSE_PERIOD_EXPIRED (422) on the identical payload.
        test_recipe:
          setup:
            - "Association 'Kestrel Landing' with statute_of_repose_years = 8."
            - "One CommonAreaComponent with build_status COMPLETE, substantial_completion_date 2016-01-10T00:00:00Z, conveyance_status DEED_TENDERED (not CONVEYED)."
            - "One DefectClaim in INVESTIGATING on that component, with repose_deadline 2024-01-10T00:00:00Z."
            - "Logical clock at its default 2026-08-01T00:00:00Z, more than two years past the deadline."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Kestrel Landing", total_planned_lots: 14, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 300000, reserve_claim_pool_cents: 2000000, declarant_monthly_subsidy_cents: 40000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Community Dock", category: "AMENITY", replacement_cost_cents: 1800000, useful_life_years: 20, effective_age_years: 10, promised_completion_date: "2016-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2016-01-10T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Dock pile rot", repair_cost_estimate_cents: 600000, diminution_value_cents: 400000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_referential: $.data.error_id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "DefectClaim.${claim_id}.repose_deadline == 2024-01-10T00:00:00Z"
            - "first trigger call returns 409 with error_id ERR_COMPONENT_NOT_CONVEYED"
            - "first trigger call does NOT return ERR_REPOSE_PERIOD_EXPIRED even though the deadline has passed"
            - "second trigger call returns 200 with CommonAreaComponent.${comp_id}.conveyance_status == CONVEYED"
            - "third trigger call returns 422 with error_id ERR_REPOSE_PERIOD_EXPIRED"
            - "DefectClaim.${claim_id}.status == INVESTIGATING after all three calls"

      - name: role_discriminator_outranks_records_item_terminal_state
        grounds:
          - validations[priority=2]
          - validations[priority=9]
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_RECORDS_ITEM_STATE_INVALID
          - roles.TransitionCommittee
          - roles.Declarant
          - state_machines.RecordsTransferItem.DELIVERED_to_ACCEPTED
        distinguishing_aspect: |
          Category pair auth (priority 2, 403) versus state (priority 9, 409) on the shared dispatcher
          POST /hoa/records-items/{id}/transitions: the TransitionCommittee asks for DELIVER, an action
          reserved to the Declarant, on an item already in the terminal state ACCEPTED where DELIVER is
          also illegal, and the response MUST be ERR_ROLE_NOT_PERMITTED (403). The paired control, the
          Declarant asking for DELIVER on the same ACCEPTED item, isolates the state rule and returns
          ERR_RECORDS_ITEM_STATE_INVALID (409).
        test_recipe:
          setup:
            - "Association 'Larchmont Green' with a TurnoverCase (total_seats 5)."
            - "One required RecordsTransferItem of category FINANCIAL_RECORDS driven OUTSTANDING -> DELIVERED -> ACCEPTED, so it sits in its terminal state and records_transfer_completeness_pct is 100.00."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Larchmont Green", total_planned_lots: 11, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-02-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 100000, reserve_claim_pool_cents: 500000, declarant_monthly_subsidy_cents: 30000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "FINANCIAL_RECORDS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item_id: $.data.id }
            - call: "POST /hoa/records-items/${item_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/records-items/${item_id}/transitions"
              payload: { action: "ACCEPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/records-items/${item_id}/transitions"
              payload: { action: "DELIVER" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_auth: $.data.error_id }
            - call: "POST /hoa/records-items/${item_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
          assert:
            - "first trigger call returns 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "first trigger call does NOT return ERR_RECORDS_ITEM_STATE_INVALID even though DELIVER is illegal from ACCEPTED"
            - "second trigger call returns 409 with error_id ERR_RECORDS_ITEM_STATE_INVALID"
            - "RecordsTransferItem.${item_id}.status == ACCEPTED after both calls"
            - "RecordsTransferItem.${item_id}.delivered_at unchanged after both calls"
            - "TurnoverCase.${case_id}.records_transfer_completeness_pct == 100.00"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sold_lot_pct_rounds_half_up_exactly_onto_turnover_threshold
        grounds:
          - calculations.sold_lot_percentage
          - entities.Association.fields.sold_lot_pct
          - entities.Association.fields.turnover_threshold_pct
          - validations[priority=14]
          - errors.ERR_TURNOVER_THRESHOLD_NOT_MET
          - state_machines.TurnoverCase.DECLARANT_CONTROL_to_ELECTION_CALLED
        distinguishing_aspect: |
          Two-decimal round_half_up straddling an inclusive threshold: 2 of 3 lots closed gives the exact
          quotient 66.666..., which must be stored as sold_lot_pct 66.67 and therefore satisfies
          turnover_threshold_pct 66.67 under >=. An implementation that truncates to 66.66, or that
          compares the unrounded quotient, refuses the certification with ERR_TURNOVER_THRESHOLD_NOT_MET;
          the same call one lot earlier (33.33) must be refused, pinning both sides of the boundary.
        test_recipe:
          setup:
            - "Association 'Marlowe Court' with total_planned_lots 3, turnover_threshold_pct 66.67 and fixed_turnover_date 2030-01-01T00:00:00Z, so only the PERCENT_SOLD basis can fire."
            - "TurnoverCase with total_seats 5 in DECLARANT_CONTROL / SUBSIDY_ACTIVE."
            - "Three UNSOLD Lots M-001, M-002, M-003."
            - "Logical clock at its default 2026-08-01T00:00:00Z, far before the fixed turnover date."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Marlowe Court", total_planned_lots: 3, turnover_threshold_pct: 66.67, fixed_turnover_date: "2030-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 50000, reserve_claim_pool_cents: 200000, declarant_monthly_subsidy_cents: 20000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "M-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot1_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "M-002" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot2_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "M-003" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot3_id: $.data.id }
          trigger:
            - call: "POST /hoa/lots/${lot1_id}/close-sale"
              payload: { closing_date: "2026-03-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "PERCENT_SOLD" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_below: $.data.error_id }
            - call: "POST /hoa/lots/${lot2_id}/close-sale"
              payload: { closing_date: "2026-03-02T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "PERCENT_SOLD" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "after the first close-sale: Association.${assoc_id}.sold_lot_count == 1 and sold_lot_pct == 33.33"
            - "second trigger call returns 422 with error_id ERR_TURNOVER_THRESHOLD_NOT_MET"
            - "after the second close-sale: Association.${assoc_id}.sold_lot_count == 2 and sold_lot_pct == 66.67"
            - "Association.${assoc_id}.sold_lot_pct != 66.66"
            - "fourth trigger call returns 200 with TurnoverCase.${case_id}.governance_status == ELECTION_CALLED"
            - "TurnoverCase.${case_id}.trigger_basis == PERCENT_SOLD and owner_elected_seats_required == 4"
            - "Lot.${lot3_id}.sale_status == UNSOLD"

      - name: empty_conveyed_component_set_is_undetermined_only_under_full_funding
        grounds:
          - calculations.reserve_funding_adequacy
          - entities.ReserveStudy.fields.component_count
          - entities.ReserveStudy.fields.fully_funded_balance_cents
          - entities.ReserveStudy.fields.percent_funded
          - entities.ReserveStudy.fields.adequacy_verdict
          - validations[priority=9]
          - errors.ERR_ADEQUACY_NOT_EVALUATED
          - state_machines.ReserveStudy.DRAFT_to_ADOPTED
        distinguishing_aspect: |
          Empty-input-set boundary with a divide-by-zero guard whose blast radius is variant-specific: a
          COMPLETE but NOT_CONVEYED 5000000 component is filtered out, so component_count is 0 and
          fully_funded_balance_cents is 0; percent_funded must be exactly 0.00 (not an error, not 100.00),
          adequacy_verdict must be UNDETERMINED, and ADOPT must be refused with ERR_ADEQUACY_NOT_EVALUATED
          — yet the identical empty set under CASH_FLOW yields min_projected_balance_cents 1200000,
          ADEQUATE, and an ADOPT that succeeds.
        test_recipe:
          setup:
            - "Association 'Northbrook' with reserve_pool_cents = 1200000."
            - "One CommonAreaComponent with replacement_cost_cents 5000000, useful_life_years 25, effective_age_years 25, build_status COMPLETE, conveyance_status DEED_TENDERED — deliberately NOT conveyed."
            - "One ReserveStudy in DRAFT with planned_annual_contribution_cents 700000 and projected_annual_expenditure_cents 500000."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Northbrook", total_planned_lots: 26, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-05-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 400000, declarant_monthly_subsidy_cents: 45000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Trail Network", category: "INFRASTRUCTURE", replacement_cost_cents: 5000000, useful_life_years: 25, effective_age_years: 25, promised_completion_date: "2024-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-01-05T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "COMPONENT_FULL_FUNDING", planned_annual_contribution_cents: 700000, projected_annual_expenditure_cents: 500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "COMPONENT_FULL_FUNDING" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_adequacy: $.data.error_id }
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call: data.component_count == 0"
            - "first trigger call: data.fully_funded_balance_cents == 0"
            - "first trigger call: data.percent_funded == 0.00"
            - "first trigger call: data.adequacy_verdict == UNDETERMINED"
            - "first trigger call: data.recommended_annual_contribution_cents == 0"
            - "second trigger call returns 409 with error_id ERR_ADEQUACY_NOT_EVALUATED"
            - "third trigger call: data.adequacy_verdict == ADEQUATE and data.min_projected_balance_cents == 1200000 and data.recommended_annual_contribution_cents == 700000"
            - "fourth trigger call returns 200 with ReserveStudy.${study_id}.status == ADOPTED"

