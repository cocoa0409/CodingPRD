              as: BookingManager
              captures: { bk_a: $.data.id }
            - call: "POST /event-bookings/${bk_a}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v1: $.data.version }
            - call: "POST /event-bookings/${bk_a}/confirm"
