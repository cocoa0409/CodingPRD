scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: annual_escalation_compound_vs_simple_on_lease
        grounds:
          - calculations.annual_rent_escalation
          - entities.Airport.fields.escalation_policy
          - entities.Lease.fields.current_monthly_rate_cents
        distinguishing_aspect: |
          Same lease economics (base 100000 cents, 4% escalation) produce
          different rent after the second anniversary depending on the airport's
          escalation_policy: COMPOUND yields 108160 while SIMPLE yields 108000 —
          a dual-variant divergence on the Lease entity domain.
        test_recipe:
          setup:
            - "Two airports, one ANNIVERSARY_COMPOUND and one ANNIVERSARY_SIMPLE, both escalation_pct 0.04"
            - "Each airport has a hangar, an active rate schedule at 100000 cents/month effective from 2026-07-01 OPEN, and one lease started 2026-08-01T00:00:00Z"
            - "Clock advanced past the second anniversary (2028-08-01T00:00:00Z) to trigger two escalation steps"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KCPA", name: "Compound Field", escalation_pct: 0.04, escalation_policy: "ANNIVERSARY_COMPOUND", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_c: $.data.id }
            - call: "POST /airports"
              payload: { airport_code: "KSIM", name: "Simple Field", escalation_pct: 0.04, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_s: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_c}", size_class: "T_HANGAR", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_s}", size_class: "T_HANGAR", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_c}", hangar_code: "T-1", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_c: $.data.id, h_c_v: $.data.version }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_s}", hangar_code: "T-1", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_s: $.data.id, h_s_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_c}", applicant_name: "Amy Compound", applicant_contact: "amy@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N100CP", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_c: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_s}", applicant_name: "Sam Simple", applicant_contact: "sam@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N100SM", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_s: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_c}", hangar_id: "${h_c}", application_id: "${app_c}"  }
              as: AirportManager
              captures: { off_c: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_s}", hangar_id: "${h_s}", application_id: "${app_s}"  }
              as: AirportManager
              captures: { off_s: $.data.id }
            - call: "POST /offers/${off_c}/accept"
              payload: { expected_hangar_version: "${h_c_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-C1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-07-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N100CP", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_c}"
              captures: { lease_c: $.data.id }
            - call: "POST /offers/${off_s}/accept"
              payload: { expected_hangar_version: "${h_s_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-S1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-07-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N100SM", aircraft_make_model: "Piper PA-28" }
              as: Applicant
              as_user_id: "${app_s}"
              captures: { lease_s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-02T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "GET /leases/${lease_c}"
              as: AirportManager
            - call: "GET /leases/${lease_s}"
              as: AirportManager
          assert:
            - "Lease.${lease_c}.current_monthly_rate_cents == 108160"
            - "Lease.${lease_s}.current_monthly_rate_cents == 108000"
            - "Lease.${lease_c}.last_escalation_anniversary == 2"
            - "Lease.${lease_s}.last_escalation_anniversary == 2"
            - "Lease.${lease_c}.current_monthly_rate_cents != Lease.${lease_s}.current_monthly_rate_cents"

      - name: rate_schedule_selection_overlap_latest_effective_from_wins
        grounds:
          - calculations.rate_schedule_selection
          - entities.RateSchedule.fields.effective_from
          - entities.HangarOffer.fields.quoted_monthly_rate_cents
        distinguishing_aspect: |
          Rate-schedule selection (RateSchedule entity domain) has two valid
          readings of an overlapping-schedule instant — older-schedule vs
          latest-effective_from — and the scaffold pins the latter, so an offer
          pinned at an overlapped instant quotes 120000 (newer schedule), not
          100000 (older), a dual-variant divergence distinct from the Lease
          escalation domain.
        test_recipe:
          setup:
            - "Airport with two overlapping ACTIVE T_HANGAR schedules: S1 effective 2026-07-01T00:00Z rate 100000 OPEN; S2 created later, effective 2026-08-01T00:00Z rate 120000, OPEN"
            - "Note: creating S2 with effective_from 2026-08-01 (equal to the current clock) does NOT supersede S1 because S1.effective_to is OPEN; both cover the instant; selection rule picks latest effective_from"
            - "One AVAILABLE hangar + one QUEUED application"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KOVR", name: "Overlap Field", escalation_pct: 0.03, escalation_policy: "ANNIVERSARY_COMPOUND", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_o: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_o}", size_class: "T_HANGAR", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_o}", hangar_code: "B-1", size_class: "T_HANGAR", door_type: "BIFOLD"  }
              as: AirportManager
              captures: { h_o: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_o}", applicant_name: "Olive Overlap", applicant_contact: "olive@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N200OV", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_o: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_o}", size_class: "T_HANGAR", monthly_rate_cents: 120000, effective_from: "2026-08-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
          trigger:
            - call: "POST /offers"
              payload: { airport_id: "${ap_o}", hangar_id: "${h_o}", application_id: "${app_o}"  }
              as: AirportManager
              captures: { off_o: $.data.id, off_o_rate: $.data.quoted_monthly_rate_cents }
          assert:
            - "HangarOffer.${off_o}.quoted_monthly_rate_cents == 120000"
            - "HangarOffer.${off_o}.status == OPEN"

  # =====================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_daily_floor_cap_threshold_mode_a
        grounds:
          - calculations.late_fee_accrual
          - entities.RentCharge.fields.late_fee_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction
          (max() floor on daily fee, min() cap on accrual, conditional on grace
          window): a 10000-cent charge accrues the 500-cent floor daily and
          hits the 2500-cent cap (25% of base) at exactly 5 overdue days, so
          day 5 and day 6 both yield 2500.
        test_recipe:
          setup:
            - "Airport, late_fee_grace_days = 5; lease with a single small RentCharge (base 10000) created via pro-rated first period"
            - "Pro-rate: lease starts 2026-08-27T00:00Z → days_remaining in Aug = 31-27+1 = 5 → base = floor(62000*5/31) = 10000 exactly with rate 62000"
            - "First charge period Sept: full 62000. To isolate the small charge, sweep to 2026-09-12T00:00Z: the Aug partial charge (base 10000, due 2026-08-27, grace ends 2026-09-01) is 11 days overdue → capped at 2500; the Sept charge (due 2026-09-01, grace ends 2026-09-06) is 6 days overdue"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KLTE", name: "Late Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_l: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_l}", size_class: "BOX", monthly_rate_cents: 62000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_l}", hangar_code: "B-9", size_class: "BOX", door_type: "HYDRAULIC"  }
              as: AirportManager
              captures: { h_l: $.data.id, h_l_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_l}", applicant_name: "Larry Late", applicant_contact: "larry@x.com", size_class_requested: "BOX", aircraft_n_number: "N300LT", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_l: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_l}", hangar_id: "${h_l}", application_id: "${app_l}"  }
              as: AirportManager
              captures: { off_l: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: AirportManager
            - call: "POST /offers/${off_l}/accept"
              payload: { expected_hangar_version: "${h_l_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-L1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N300LT", aircraft_make_model: "Cirrus SR22" }
              as: Applicant
              as_user_id: "${app_l}"
              captures: { lease_l: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: AirportManager
            - call: "GET /leases/${lease_l}/rent-charges"
              as: AirportManager
              captures: { ch1_late: "$.data[0].late_fee_cents", ch1_base: "$.data[0].base_amount_cents", ch2_late: "$.data[1].late_fee_cents", ch2_base: "$.data[1].base_amount_cents" }
          assert:
            - "RentCharge[0].base_amount_cents == 10000"
            - "RentCharge[0].late_fee_cents == 2500"
            - "RentCharge[1].base_amount_cents == 62000"
            - "RentCharge[1].late_fee_cents == 3000"
            - "Lease.${lease_l}.status == DELINQUENT"

      - name: payment_waterfall_rounding_order_mode_b
        grounds:
          - calculations.payment_waterfall
          - calculations.monthly_rent_charge
          - entities.RentCharge.fields.balance_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: monthly_rent_charge
          pins pro-rate-then-floor at the daily level (floor(62000*5/31)=10000,
          NOT round(10000.0)=10000 by luck — the pinned floor is verified by
          54838 for a 17-day August start on a 100000 rate, where round-half-up
          would give 54839) and payment_waterfall pins fees-before-principal
          ordering; the two pinned orders together fix RentCharge balances.
        test_recipe:
          setup:
            - "Airport, escalation 0; lease starting 2026-08-15T00:00Z at rate 100000 → first charge base = floor(100000*17/31) = 54838"
            - "Sweep to 2026-09-10T00:00Z: charge1 (due 2026-08-15, grace ends 2026-08-20) 21 days overdue → min(500*21, round(54838*0.25)=13710) = 10500; charge2 Sept base 100000 (due 2026-09-01, grace ends 2026-09-06) 4 days overdue → 2000"
            - "Tenant pays 150000: waterfall pays charge1 late 10500, charge1 base 54838 (cumulative 65338), charge2 late 2000 (67338), charge2 base 82662 of 100000 → charge2 balance 17338 PARTIALLY_PAID"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KWFL", name: "Waterfall Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_w: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_w}", size_class: "EXECUTIVE", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_w}", hangar_code: "E-3", size_class: "EXECUTIVE", door_type: "HYDRAULIC"  }
              as: AirportManager
              captures: { h_w: $.data.id, h_w_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_w}", applicant_name: "Wanda Water", applicant_contact: "wanda@x.com", size_class_requested: "EXECUTIVE", aircraft_n_number: "N400WF", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_w: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_w}", hangar_id: "${h_w}", application_id: "${app_w}"  }
              as: AirportManager
              captures: { off_w: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: AirportManager
            - call: "POST /offers/${off_w}/accept"
              payload: { expected_hangar_version: "${h_w_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-W1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N400WF", aircraft_make_model: "Beech Bonanza" }
              as: Applicant
              as_user_id: "${app_w}"
              captures: { lease_w: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "POST /leases/${lease_w}/payments"
              payload: { amount_cents: 150000 }
              as: Tenant
              as_user_id: "${lease_w}"
            - call: "GET /leases/${lease_w}/rent-charges"
              as: AirportManager
              captures: { w_ch1_base: "$.data[0].base_amount_cents", w_ch1_late: "$.data[0].late_fee_cents", w_ch1_status: "$.data[0].status", w_ch2_bal: "$.data[1].balance_cents", w_ch2_status: "$.data[1].status" }
          assert:
            - "RentCharge[0].base_amount_cents == 54838"
            - "RentCharge[0].late_fee_cents == 10500"
            - "RentCharge[0].status == PAID"
            - "RentCharge[1].balance_cents == 17338"
            - "RentCharge[1].status == PARTIALLY_PAID"
            - "Lease.${lease_w}.status == DELINQUENT"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: waitlist_application_offered_to_queued_cycle
        grounds:
          - state_machines.WaitlistApplication.OFFERED_to_QUEUED
          - state_machines.WaitlistApplication.QUEUED_to_OFFERED
        distinguishing_aspect: |
          WaitlistApplication exhibits a cycle QUEUED → OFFERED → QUEUED via a
          first-time decline (return to queue without penalty), while the
          second decline on the next OFFERED loops to REJECTED — a cycle with a
          lifetime counter, on the WaitlistApplication entity.
        test_recipe:
          setup:
            - "Airport ACTIVE; two T_HANGAR hangars H1 and H2 both AVAILABLE; one application (created 2026-08-01, sole in queue)"
            - "Offer O1 on H1 extended and declined (free decline) → application back to QUEUED"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KCYC", name: "Cycle Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_cy: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_cy}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_cy}", hangar_code: "T-1", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_cy1: $.data.id }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_cy}", hangar_code: "T-2", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_cy2: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_cy}", applicant_name: "Cy Cyclist", applicant_contact: "cy@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N500CY", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_cy: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_cy}", hangar_id: "${h_cy1}", application_id: "${app_cy}"  }
              as: AirportManager
              captures: { off_cy1: $.data.id }
            - call: "POST /offers/${off_cy1}/decline"
              payload: {}
              as: Applicant
              as_user_id: "${app_cy}"
          trigger:
            - call: "GET /applications/${app_cy}"
              as: AirportManager
              captures: { app_cy_status: $.data.status }
            - call: "POST /offers"
              payload: { airport_id: "${ap_cy}", hangar_id: "${h_cy2}", application_id: "${app_cy}"  }
              as: AirportManager
              captures: { off_cy2: $.data.id }
            - call: "POST /offers/${off_cy2}/decline"
              payload: {}
              as: Applicant
              as_user_id: "${app_cy}"
          assert:
            - "WaitlistApplication.${app_cy}.status == QUEUED after first decline"
            - "WaitlistApplication.${app_cy}.status == REJECTED after second decline"
            - "HangarOffer.${off_cy1}.status == DECLINED"
            - "HangarOffer.${off_cy2}.status == DECLINED"

      - name: lease_active_cure_period_active_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_CURE_PERIOD
          - state_machines.Lease.CURE_PERIOD_to_ACTIVE
        distinguishing_aspect: |
          Lease exhibits a compliance cycle ACTIVE → CURE_PERIOD → ACTIVE (and
          potentially EVICTION_PENDING on failure) — a revision-loop shape on
          the Lease entity, distinct from the WaitlistApplication queue cycle.
        test_recipe:
          setup:
            - "Airport ACTIVE with cure_window_days 30; lease ACTIVE (started 2026-08-01, fully paid via zero-balance because first charge not yet overdue)"
            - "ComplianceOfficer files NON_AERONAUTICAL_USE finding at 2026-08-05T00:00Z → lease CURE_PERIOD; cure_deadline = 2026-09-04T00:00Z"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KCUR", name: "Cure Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_cu: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_cu}", size_class: "CORPORATE", monthly_rate_cents: 250000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_cu}", hangar_code: "C-1", size_class: "CORPORATE", door_type: "HYDRAULIC"  }
              as: AirportManager
              captures: { h_cu: $.data.id, h_cu_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_cu}", applicant_name: "Cora Cure", applicant_contact: "cora@x.com", size_class_requested: "CORPORATE", aircraft_n_number: "N600CU", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_cu: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_cu}", hangar_id: "${h_cu}", application_id: "${app_cu}"  }
              as: AirportManager
              captures: { off_cu: $.data.id }
            - call: "POST /offers/${off_cu}/accept"
              payload: { expected_hangar_version: "${h_cu_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-CU1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N600CU", aircraft_make_model: "King Air 350" }
              as: Applicant
              as_user_id: "${app_cu}"
              captures: { lease_cu: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AirportManager
            - call: "POST /leases/${lease_cu}/audit-findings"
              payload: { finding_type: "NON_AERONAUTICAL_USE" }
              as: ComplianceOfficer
              captures: { find_cu: $.data.id, find_cu_deadline: $.data.cure_deadline }
          trigger:
            - call: "GET /leases/${lease_cu}"
              as: AirportManager
              captures: { lease_cu_status_mid: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AirportManager
            - call: "POST /audit-findings/${find_cu}/cure"
              payload: {}
              as: Tenant
              as_user_id: "${lease_cu}"
            - call: "GET /leases/${lease_cu}"
              as: AirportManager
          assert:
            - "Lease.${lease_cu}.status == CURE_PERIOD after finding filed"
            - "UseAuditFinding.${find_cu}.cure_deadline == 2026-09-04T00:00:00Z"
            - "UseAuditFinding.${find_cu}.status == CURED after cure"
            - "Lease.${lease_cu}.status == ACTIVE after cure"

  # =====================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cure_deadline_expiry_escalates_to_eviction_case
        grounds:
          - state_machines.Lease.CURE_PERIOD_to_EVICTION_PENDING
          - state_machines.UseAuditFinding
          - entities.EvictionCase.fields.use_audit_finding_id
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock sweep: sweep crosses
          cure_deadline → UseAuditFinding flips ESCALATED_TO_EVICTION → that
          flip itself auto-creates an EvictionCase (FILED, UNCURED_AUDIT) → the
          case creation flips Lease to EVICTION_PENDING. Each link is caused by
          the previous link, not by the sweep directly.
        test_recipe:
          setup:
            - "Airport ACTIVE, cure_window_days 30; lease ACTIVE started 2026-08-01T00:00Z"
            - "Finding filed 2026-08-05T00:00Z (deadline 2026-09-04T00:00Z); tenant never cures"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KESC", name: "Escalation Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_e: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_e}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_e}", hangar_code: "T-8", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_e: $.data.id, h_e_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_e}", applicant_name: "Ed Escalate", applicant_contact: "ed@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N700ES", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_e: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_e}", hangar_id: "${h_e}", application_id: "${app_e}"  }
              as: AirportManager
              captures: { off_e: $.data.id }
            - call: "POST /offers/${off_e}/accept"
              payload: { expected_hangar_version: "${h_e_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-E1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N700ES", aircraft_make_model: "Cessna 182" }
              as: Applicant
              as_user_id: "${app_e}"
              captures: { lease_e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AirportManager
            - call: "POST /leases/${lease_e}/audit-findings"
              payload: { finding_type: "NON_AERONAUTICAL_USE" }
              as: ComplianceOfficer
              captures: { find_e: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: AirportManager
            - call: "GET /leases/${lease_e}/audit-findings"
              as: AirportManager
              captures: { find_e_status: "$.data[0].status" }
            - call: "GET /leases/${lease_e}/eviction-cases"
              as: AirportManager
              captures: { case_e_id: "$.data[0].id", case_e_status: "$.data[0].status", case_e_reason: "$.data[0].reason" }
            - call: "GET /leases/${lease_e}"
              as: AirportManager
              captures: { lease_e_status: $.data.status }
          assert:
            - "UseAuditFinding.${find_e}.status == ESCALATED_TO_EVICTION"
            - "EvictionCase[0].status == FILED"
            - "EvictionCase[0].reason == UNCURED_AUDIT"
            - "EvictionCase[0].use_audit_finding_id == ${find_e}"
            - "Lease.${lease_e}.status == EVICTION_PENDING"

      - name: airport_suspend_cancels_open_offer_and_frees_hangar
        grounds:
          - state_machines.Airport.ACTIVE_to_SUSPENDED
          - state_machines.WaitlistApplication.OFFERED_to_QUEUED
          - entities.Hangar.fields.posture
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (airport suspend, not the
          clock sweep): Airport ACTIVE→SUSPENDED directly cancels the OPEN
          HangarOffer, and the offer's cancellation itself recomputes the
          Hangar posture back to AVAILABLE — the second hop is caused by the
          offer mutation, not by the suspend action.
        test_recipe:
          setup:
            - "Airport ACTIVE; hangar AVAILABLE; application QUEUED; offer OPEN (hangar reserved)"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KSUS", name: "Suspend Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_su: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_su}", size_class: "BOX", monthly_rate_cents: 75000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_su}", hangar_code: "B-4", size_class: "BOX", door_type: "BIFOLD"  }
              as: AirportManager
              captures: { h_su: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_su}", applicant_name: "Su Suspend", applicant_contact: "su@x.com", size_class_requested: "BOX", aircraft_n_number: "N800SU", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_su: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_su}", hangar_id: "${h_su}", application_id: "${app_su}"  }
              as: AirportManager
              captures: { off_su: $.data.id }
          trigger:
            - call: "POST /airports/${ap_su}/suspend"
              payload: {}
              as: AirportManager
            - call: "GET /offers/${off_su}"
              as: AirportManager
              captures: { off_su_status: $.data.status }
            - call: "GET /hangars/${h_su}"
              as: AirportManager
              captures: { h_su_posture: $.data.posture }
          assert:
            - "Airport.${ap_su}.status == SUSPENDED"
            - "HangarOffer.${off_su}.status == CANCELLED"
            - "Hangar.${h_su}.posture == AVAILABLE"
            - "WaitlistApplication.${app_su}.status == OFFERED"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_expired_offer_accept
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_OFFER_NOT_OPEN]
          - errors[ERR_OFFER_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Pair (state vs business_temporal): accepting an offer that is BOTH
          no longer OPEN (already EXPIRED via sweep) AND past its window
          resolves to the state error ERR_OFFER_NOT_OPEN (priority 5) rather
          than the temporal error ERR_OFFER_WINDOW_EXPIRED (priority 6).
        test_recipe:
          setup:
            - "Airport ACTIVE, offer_acceptance_window_hours 72; offer created 2026-08-01T00:00Z (deadline 2026-08-04T00:00Z)"
            - "Clock advanced to 2026-08-05T00:00Z, sweep flips offer to EXPIRED (so offer is in a terminal state AND the window has passed)"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KPRI", name: "Priority Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_p: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_p}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_p}", hangar_code: "T-5", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_p: $.data.id, h_p_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_p}", applicant_name: "Pri Priority", applicant_contact: "pri@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N900PR", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_p: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_p}", hangar_id: "${h_p}", application_id: "${app_p}"  }
              as: AirportManager
              captures: { off_p: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "POST /offers/${off_p}/accept"
              payload: { expected_hangar_version: "${h_p_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-P1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N900PR", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_p}"
              captures: { err_p: $.data.error_id }
          assert:
            - "error_id == ERR_OFFER_NOT_OPEN"
            - "HangarOffer.${off_p}.status == EXPIRED"

      - name: business_constraint_vs_business_referential_on_sublease_finding
        grounds:
          - validations[priority=9]
          - validations[priority=5]
          - errors[ERR_LEASE_NOT_AUDITABLE]
          - errors[ERR_FINDING_NOT_APPLICABLE]
        distinguishing_aspect: |
          Pair (state vs business_referential): filing an UNAUTHORIZED_SUBLEASE
          finding on a lease that is BOTH in a non-auditable state (TERMINATED)
          AND has sublease_allowed=true resolves to the state error
          ERR_LEASE_NOT_AUDITABLE (priority 5) ahead of the referential error
          ERR_FINDING_NOT_APPLICABLE (priority 9).
        test_recipe:
          setup:
            - "Airport ACTIVE; lease created with sublease_allowed=true and zero balance, then voluntarily TERMINATED by tenant at 2026-08-10T00:00Z"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KPR2", name: "Priority Two Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_p2: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_p2}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_p2}", hangar_code: "T-6", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_p2: $.data.id, h_p2_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_p2}", applicant_name: "Pat Pair", applicant_contact: "pat@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N910PR", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_p2: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_p2}", hangar_id: "${h_p2}", application_id: "${app_p2}"  }
              as: AirportManager
              captures: { off_p2: $.data.id }
            - call: "POST /offers/${off_p2}/accept"
              payload: { expected_hangar_version: "${h_p2_v}", aeronautical_use_attested: true, sublease_allowed: true, insurance_policy_number: "POL-P2", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N910PR", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_p2}"
              captures: { lease_p2: $.data.id }
            - call: "POST /leases/${lease_p2}/payments"
              payload: { amount_cents: 90000 }
              as: Tenant
              as_user_id: "${lease_p2}"
            - call: "POST /leases/${lease_p2}/terminate"
              payload: {}
              as: Tenant
              as_user_id: "${lease_p2}"
          trigger:
            - call: "POST /leases/${lease_p2}/audit-findings"
              payload: { finding_type: "UNAUTHORIZED_SUBLEASE" }
              as: ComplianceOfficer
              captures: { err_p2: $.data.error_id }
          assert:
            - "error_id == ERR_LEASE_NOT_AUDITABLE"
            - "Lease.${lease_p2}.status == TERMINATED"

  # =====================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: offer_acceptance_deadline_exact_boundary_expired
        grounds:
          - calculations.offer_window_expiry
          - state_machines.WaitlistApplication.OFFERED_to_ACCEPTED
          - errors[ERR_OFFER_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Metric = wall-clock deadline on the accept endpoint: an offer with
          acceptance_deadline 2026-08-04T00:00:00Z is still acceptable at
          2026-08-03T23:59:59.999Z but rejects with ERR_OFFER_WINDOW_EXPIRED
          at exactly 2026-08-04T00:00:00Z (>= boundary, closed-expiry).
        test_recipe:
          setup:
            - "Airport ACTIVE, offer_acceptance_window_hours 72; two hangars H1, H2; two applications A1, A2; offers O1 on H1 and O2 on H2 both created at 2026-08-01T00:00Z"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KBND", name: "Boundary Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_b: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_b}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_b}", hangar_code: "T-11", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_b1: $.data.id, h_b1_v: $.data.version }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_b}", hangar_code: "T-12", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_b2: $.data.id, h_b2_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_b}", applicant_name: "Bo Boundary1", applicant_contact: "bo1@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N111BD", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_b1: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_b}", applicant_name: "Bo Boundary2", applicant_contact: "bo2@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N112BD", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_b2: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_b}", hangar_id: "${h_b1}", application_id: "${app_b1}", override_next_in_queue: true  }
              as: AirportManager
              captures: { off_b1: $.data.id, off_b1_deadline: $.data.acceptance_deadline }
            - call: "POST /offers"
              payload: { airport_id: "${ap_b}", hangar_id: "${h_b2}", application_id: "${app_b2}"  }
              as: AirportManager
              captures: { off_b2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T23:59:59.999Z" }
              as: AirportManager
            - call: "POST /offers/${off_b1}/accept"
              payload: { expected_hangar_version: "${h_b1_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-B1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N111BD", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_b1}"
              captures: { lease_b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "POST /offers/${off_b2}/accept"
              payload: { expected_hangar_version: "${h_b2_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-B2", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N112BD", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_b2}"
              captures: { err_b2: $.data.error_id }
          assert:
            - "HangarOffer.${off_b1}.acceptance_deadline == 2026-08-04T00:00:00Z"
            - "Lease.${lease_b1} created successfully (accept at deadline - 1ms)"
            - "error_id == ERR_OFFER_WINDOW_EXPIRED"
            - "HangarOffer.${off_b2}.status == OPEN"

      - name: zero_balance_termination_gate_boundary
        grounds:
          - validations[priority=11]
          - entities.Lease.fields.outstanding_balance_cents
          - errors[ERR_OUTSTANDING_BALANCE]
        distinguishing_aspect: |
          Metric = outstanding_balance_cents on the terminate endpoint: a
          balance of exactly 0 permits termination, while a 1-cent balance
          (smallest nonzero integer) rejects with ERR_OUTSTANDING_BALANCE —
          a zero-quantity boundary distinct from the time-window boundary.
        test_recipe:
          setup:
            - "Airport ACTIVE; lease started 2026-08-01T00:00Z rate 100000; first charge 100000 due 2026-08-01; tenant pays 99999 (leaves 1 cent), then attempts terminate; then pays 1 more cent and terminates"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KZB", name: "Zero Balance Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_z: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_z}", size_class: "T_HANGAR", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_z}", hangar_code: "T-20", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_z: $.data.id, h_z_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_z}", applicant_name: "Zed Zero", applicant_contact: "zed@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N120ZB", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_z: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_z}", hangar_id: "${h_z}", application_id: "${app_z}"  }
              as: AirportManager
              captures: { off_z: $.data.id }
            - call: "POST /offers/${off_z}/accept"
              payload: { expected_hangar_version: "${h_z_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-Z1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N120ZB", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_z}"
              captures: { lease_z: $.data.id }
            - call: "POST /leases/${lease_z}/payments"
              payload: { amount_cents: 99999 }
              as: Tenant
              as_user_id: "${lease_z}"
          trigger:
            - call: "POST /leases/${lease_z}/terminate"
              payload: {}
              as: Tenant
              as_user_id: "${lease_z}"
              captures: { err_z: $.data.error_id }
            - call: "POST /leases/${lease_z}/payments"
              payload: { amount_cents: 1 }
              as: Tenant
              as_user_id: "${lease_z}"
            - call: "POST /leases/${lease_z}/terminate"
              payload: {}
              as: Tenant
              as_user_id: "${lease_z}"
          assert:
            - "first terminate error_id == ERR_OUTSTANDING_BALANCE"
            - "Lease.${lease_z}.outstanding_balance_cents == 0 after 1-cent payment"
            - "Lease.${lease_z}.status == TERMINATED after second terminate"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_requires_hangar_posture_available
        grounds:
          - state_machines.WaitlistApplication.QUEUED_to_OFFERED
          - entities.Hangar.fields.posture
          - errors[ERR_HANGAR_NOT_AVAILABLE]
        distinguishing_aspect: |
          Pair (WaitlistApplication → Hangar): an application's QUEUED→OFFERED
          transition is gated by the Hangar's compound posture (AVAILABLE),
          which itself derives from OTHER leases and inspections on that hangar.
        test_recipe:
          setup:
            - "Airport ACTIVE; hangar H with an ACTIVE lease (posture LEASED) held by tenant A"
            - "Second application B QUEUED for the same size class"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KXSD", name: "Cross State Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_x: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_x}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_x}", hangar_code: "T-30", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_x: $.data.id, h_x_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_x}", applicant_name: "Alice A", applicant_contact: "alice@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N130XS", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_xa: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_x}", hangar_id: "${h_x}", application_id: "${app_xa}"  }
              as: AirportManager
              captures: { off_xa: $.data.id }
            - call: "POST /offers/${off_xa}/accept"
              payload: { expected_hangar_version: "${h_x_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-X1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N130XS", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_xa}"
              captures: { lease_xa: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_x}", applicant_name: "Bob B", applicant_contact: "bob@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N131XS", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_xb: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { airport_id: "${ap_x}", hangar_id: "${h_x}", application_id: "${app_xb}", override_next_in_queue: true  }
              as: AirportManager
              captures: { err_x: $.data.error_id }
          assert:
            - "error_id == ERR_HANGAR_NOT_AVAILABLE"
            - "Hangar.${h_x}.posture == LEASED"
            - "WaitlistApplication.${app_xb}.status == QUEUED"

      - name: audit_filing_gated_by_lease_state_and_sublease_flag
        grounds:
          - state_machines.Lease.ACTIVE_to_CURE_PERIOD
          - entities.Lease.fields.sublease_allowed
          - errors[ERR_FINDING_NOT_APPLICABLE]
        distinguishing_aspect: |
          Pair (UseAuditFinding → Lease): a UNAUTHORIZED_SUBLEASE finding's
          creation depends on the Lease entity's sublease_allowed flag being
          false — a cross-entity state/flag dependency on a different entity
          pair than WaitlistApplication→Hangar.
        test_recipe:
          setup:
            - "Airport ACTIVE; lease ACTIVE with sublease_allowed = true"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KXSF", name: "Cross Flag Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_xf: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_xf}", size_class: "BOX", monthly_rate_cents: 80000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_xf}", hangar_code: "B-31", size_class: "BOX", door_type: "BIFOLD"  }
              as: AirportManager
              captures: { h_xf: $.data.id, h_xf_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_xf}", applicant_name: "Xena Flag", applicant_contact: "xena@x.com", size_class_requested: "BOX", aircraft_n_number: "N140XF", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_xf: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_xf}", hangar_id: "${h_xf}", application_id: "${app_xf}"  }
              as: AirportManager
              captures: { off_xf: $.data.id }
            - call: "POST /offers/${off_xf}/accept"
              payload: { expected_hangar_version: "${h_xf_v}", aeronautical_use_attested: true, sublease_allowed: true, insurance_policy_number: "POL-XF1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N140XF", aircraft_make_model: "Cessna 206" }
              as: Applicant
              as_user_id: "${app_xf}"
              captures: { lease_xf: $.data.id }
          trigger:
            - call: "POST /leases/${lease_xf}/audit-findings"
              payload: { finding_type: "UNAUTHORIZED_SUBLEASE" }
              as: ComplianceOfficer
              captures: { err_xf: $.data.error_id }
          assert:
            - "error_id == ERR_FINDING_NOT_APPLICABLE"
            - "Lease.${lease_xf}.status == ACTIVE"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_half_open_interval_adjacency
        grounds:
          - calculations.rate_schedule_selection
          - entities.RateSchedule.fields.effective_to
        distinguishing_aspect: |
          Resource = RateSchedule, semantics = half-open [from, to) with
          zero-gap adjacency: schedule A (to=2026-08-10T00:00Z) and schedule B
          (from=2026-08-10T00:00Z) are adjacent, not overlapping; an offer at
          exactly 2026-08-10T00:00Z prices from B, not A.
        test_recipe:
          setup:
            - "Airport ACTIVE; T_HANGAR schedules A [2026-07-01, 2026-08-10) rate 90000 and B [2026-08-10, OPEN) rate 95000; hangar + application ready"
            - "Clock at exactly 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KHOP", name: "Half Open Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_ho: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_ho}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z"  }
              as: AirportManager
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_ho}", size_class: "T_HANGAR", monthly_rate_cents: 95000, effective_from: "2026-08-10T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_ho}", hangar_code: "T-40", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_ho: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_ho}", applicant_name: "Hal Open", applicant_contact: "hal@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N150HO", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_ho: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "POST /offers"
              payload: { airport_id: "${ap_ho}", hangar_id: "${h_ho}", application_id: "${app_ho}"  }
              as: AirportManager
              captures: { off_ho: $.data.id, off_ho_rate: $.data.quoted_monthly_rate_cents }
          assert:
            - "HangarOffer.${off_ho}.quoted_monthly_rate_cents == 95000"

      - name: n_number_aircraft_occupancy_overlap
        grounds:
          - validations[priority=9]
          - entities.LeaseAircraft.fields.n_number
          - errors[ERR_DUPLICATE_N_NUMBER]
        distinguishing_aspect: |
          Resource = aircraft occupancy at an airport, semantics = aggregate
          membership (not an interval): an n_number already BASED on any
          ACTIVE-phase lease blocks the same n_number on another lease —
          different from interval arithmetic on RateSchedule (set-membership
          vs half-open interval containment).
        test_recipe:
          setup:
            - "Airport ACTIVE; lease L1 ACTIVE with aircraft N160DP BASED; lease L2 ACTIVE on a second hangar (created with aircraft N161DP)"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KDUP", name: "Duplicate Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_d: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_d}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_d}", hangar_code: "T-50", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_d1: $.data.id, h_d1_v: $.data.version }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_d}", hangar_code: "T-51", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_d2: $.data.id, h_d2_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_d}", applicant_name: "Dan Dup1", applicant_contact: "dan1@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N160DP", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_d1: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_d}", applicant_name: "Dan Dup2", applicant_contact: "dan2@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N161DP", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_d2: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_d}", hangar_id: "${h_d1}", application_id: "${app_d1}", override_next_in_queue: true  }
              as: AirportManager
              captures: { off_d1: $.data.id }
            - call: "POST /offers/${off_d1}/accept"
              payload: { expected_hangar_version: "${h_d1_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-D1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N160DP", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_d1}"
              captures: { lease_d1: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_d}", hangar_id: "${h_d2}", application_id: "${app_d2}"  }
              as: AirportManager
              captures: { off_d2: $.data.id }
            - call: "POST /offers/${off_d2}/accept"
              payload: { expected_hangar_version: "${h_d2_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-D2", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N161DP", aircraft_make_model: "Piper PA-28" }
              as: Applicant
              as_user_id: "${app_d2}"
              captures: { lease_d2: $.data.id }
          trigger:
            - call: "POST /leases/${lease_d2}/aircraft"
              payload: { n_number: "N160DP", make_model: "Cessna 172", is_primary: false }
              as: Tenant
              as_user_id: "${lease_d2}"
              captures: { err_d: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_N_NUMBER"
            - "Lease.${lease_d1} unchanged with N160DP still BASED"

  # =====================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_waterfall_conserves_charge_total
        grounds:
          - calculations.payment_waterfall
          - entities.RentCharge.fields.balance_cents
          - entities.Lease.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money: for any lease, sum(RentCharge.balance_cents)
          + sum(RentCharge.paid_cents) == sum(base_amount_cents + late_fee_cents)
          before and after any payment; the forward action (payment) and its
          allocation leave the per-charge ledger identity intact to the cent.
        test_recipe:
          setup:
            - "Airport ACTIVE; lease started 2026-08-15T00:00Z at rate 100000 (first charge base 54838); sweep to 2026-09-10 (charge1 late 10500, charge2 base 100000 + late 2000)"
            - "Pre-payment totals: bases 154838, lates 12500, paid 0, balances 167338"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KINV", name: "Invariant Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_i: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_i}", size_class: "EXECUTIVE", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_i}", hangar_code: "E-60", size_class: "EXECUTIVE", door_type: "HYDRAULIC"  }
              as: AirportManager
              captures: { h_i: $.data.id, h_i_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_i}", applicant_name: "Ivy Invariant", applicant_contact: "ivy@x.com", size_class_requested: "EXECUTIVE", aircraft_n_number: "N170IV", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_i: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_i}", hangar_id: "${h_i}", application_id: "${app_i}"  }
              as: AirportManager
              captures: { off_i: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: AirportManager
            - call: "POST /offers/${off_i}/accept"
              payload: { expected_hangar_version: "${h_i_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-I1", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N170IV", aircraft_make_model: "Beech Bonanza" }
              as: Applicant
              as_user_id: "${app_i}"
              captures: { lease_i: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "POST /leases/${lease_i}/payments"
              payload: { amount_cents: 65338 }
              as: Tenant
              as_user_id: "${lease_i}"
            - call: "GET /leases/${lease_i}/rent-charges"
              as: AirportManager
              captures: { i_ch1_bal: "$.data[0].balance_cents", i_ch1_paid: "$.data[0].paid_cents", i_ch2_bal: "$.data[1].balance_cents", i_ch2_paid: "$.data[1].paid_cents" }
          assert:
            - "RentCharge[0].balance_cents == 0"
            - "RentCharge[0].paid_cents == 65338"
            - "RentCharge[0].balance_cents + RentCharge[0].paid_cents == 54838 + 10500"
            - "RentCharge[1].balance_cents + RentCharge[1].paid_cents == 100000 + 2000"
            - "Lease.${lease_i}.outstanding_balance_cents == 102000"

      - name: offer_accept_cancel_conserves_available_hangar_pool
        grounds:
          - state_machines.Hangar
          - state_machines.Airport.ACTIVE_to_SUSPENDED
          - entities.Hangar.fields.posture
        distinguishing_aspect: |
          Conserved quantity = the airport's AVAILABLE hangar count: offer
          creation decrements it by 1 (reservation), and its compensating
          actions (offer expiry, decline, or airport-suspend cancellation)
          each restore it by exactly 1 — the AVAILABLE pool count returns to
          its pre-offer value with no drift.
        test_recipe:
          setup:
            - "Airport ACTIVE with exactly 2 AVAILABLE T_HANGAR hangars; one application; offer created on H1 (pool: 1 AVAILABLE)"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KPOOL", name: "Pool Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_po: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_po}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_po}", hangar_code: "T-70", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_po1: $.data.id }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_po}", hangar_code: "T-71", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_po2: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_po}", applicant_name: "Polly Pool", applicant_contact: "polly@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N180PL", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_po: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_po}", hangar_id: "${h_po1}", application_id: "${app_po}"  }
              as: AirportManager
              captures: { off_po: $.data.id }
            - call: "GET /hangars"
              as: AirportManager
              captures: { pool_after_offer_1: "$.data[0].posture", pool_after_offer_2: "$.data[1].posture" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AirportManager
            - call: "GET /hangars"
              as: AirportManager
              captures: { pool_final_1: "$.data[0].posture", pool_final_2: "$.data[1].posture" }
          assert:
            - "count(Hangar.posture == AVAILABLE) == 1 while offer OPEN"
            - "HangarOffer.${off_po}.status == EXPIRED after sweep past deadline"
            - "count(Hangar.posture == AVAILABLE) == 2 after offer expiry"
            - "WaitlistApplication.${app_po}.status == EXPIRED_OFFER"
