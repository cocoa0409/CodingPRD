  - rule_id: transitive_cascade
    instances:
      - name: order_revoke_cascades_session_transport_account
        grounds:
          - state_machines.NephrologistOrder.ACTIVE_to_REVOKED
          - state_machines.TreatmentSession.BOOKED_to_CANCELLED
          - state_machines.TransportTrip.CONFIRMED_to_CANCELLED
          - entities.Patient.fields.account_balance_cents
        distinguishing_aspect: "Depth-3 chain: revoke ACTIVE order -> its BOOKED session -> CANCELLED; that cancel -> the session's CONFIRMED TransportTrip -> CANCELLED; that trip cancel -> patient.account_balance_cents -= fare_cents (2650 reversed). Each hop is caused by the prior hop."
