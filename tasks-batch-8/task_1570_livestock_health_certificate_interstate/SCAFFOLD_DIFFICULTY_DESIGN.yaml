            - call: "POST /api/test-records/${test_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 5, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 5, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/movement-records/${rec_id}/depart"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "GET /api/premises/${prem_id}"
              as: StateAuditor
              captures: { inv_mid: $.data.current_head_count }
            - call: "POST /api/movement-records/${rec_id}/cancel"
              as: AccreditedVet
              as_user_id: "${vet_id}"
