            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v_v2: $.data.version }
          trigger:
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_b_id}", venue_id: "${v_id}", service_date: "2026-08-10", meal_period: "LUNCH", seat_start_utc: "2026-08-10T13:10:00Z", party_size: 1, expected_venue_version: "${v_v2}" }
              as: DiningServicesManager
              captures: { overlap_error: $.data.error_id, overlap_message: $.data.message }
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_b_id}", venue_id: "${v_id}", service_date: "2026-08-10", meal_period: "LUNCH", seat_start_utc: "2026-08-10T13:20:00Z", party_size: 1, expected_venue_version: "${v_v2}" }
              as: DiningServicesManager
              captures: { res_b_id: $.data.id, res_b_status: $.data.status }
            - call: "GET /venues/${v_id}/seat-availability"
              payload: { service_date: "2026-08-10", meal_period: "LUNCH" }
              as: DiningServicesManager
              captures: { committed: $.data.committed_seats, open: $.data.open_seats }
          assert:
            - "${res_a_end} == 2026-08-10T13:00:00Z"
            - "${overlap_error} == ERR_VENUE_CAPACITY_EXCEEDED with HTTP 409 (13:10 lies inside the incumbent occupation [12:00, 13:20) and 2 + 1 > 2)"
            - "${res_b_status} == RESERVED (13:20 is the exclusive end of the buffered occupation, so it does not intersect)"
            - "${committed} == 3 and ${open} == 0 (the meal-period roll-up legitimately exceeds seat_capacity across two disjoint turns, and open_seats floors at 0)"
      - name: resident_closed_interval_symmetric_meal_gap
        resource_entity: Resident
        interval_semantics: "closed [start, end], symmetric 90-minute gap on both sides, capacity 1, venue-independent"
        grounds:
          - calculations.resident_meal_spacing_conflict
          - validations[priority=21]
          - errors[id=ERR_RESIDENT_MEAL_SPACING]
        distinguishing_aspect: |
          The resident is a different overlap resource with deliberately opposite geometry: closed
          intervals widened symmetrically by 90 minutes, capacity one, and the search crosses venues.
          A candidate touching the widened endpoint exactly conflicts, and one minute later clears —
          the mirror image of the venue instance's exclusive tail.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community with TWO venues, V1 (MAIN_DINING, seat_capacity 10) and V2 (BISTRO, seat_capacity 10)."
            - "Resident A is ACTIVE with an APPROVED, ACTIVE REGULAR/THIN diet order."
            - "Resident A holds a RESERVED LUNCH reservation at V1 from 2026-08-10T12:00:00Z to 13:00:00Z, so the widened window is [10:30, 14:30]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Fernbank", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Fernbank Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 10, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v1_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Fernbank Bistro", venue_kind: "BISTRO", seat_capacity: 10, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v2_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Sylvia Marchetti", care_level: "ASSISTED_LIVING", baseline_weight_kg: 67.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "GET /venues/${v1_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v1_v1: $.data.version }
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v1_id}", service_date: "2026-08-10", meal_period: "LUNCH", seat_start_utc: "2026-08-10T12:00:00Z", party_size: 1, expected_venue_version: "${v1_v1}" }
              as: DiningServicesManager
              captures: { res_1_id: $.data.id }
            - call: "GET /venues/${v2_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v2_v1: $.data.version }
          trigger:
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v2_id}", service_date: "2026-08-10", meal_period: "DINNER", seat_start_utc: "2026-08-10T14:30:00Z", party_size: 1, expected_venue_version: "${v2_v1}" }
              as: DiningServicesManager
              captures: { spacing_error: $.data.error_id, spacing_message: $.data.message }
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v2_id}", service_date: "2026-08-10", meal_period: "DINNER", seat_start_utc: "2026-08-10T14:31:00Z", party_size: 1, expected_venue_version: "${v2_v1}" }
              as: DiningServicesManager
              captures: { res_2_id: $.data.id, res_2_status: $.data.status, res_2_venue: $.data.venue_id }
          assert:
            - "${spacing_error} == ERR_RESIDENT_MEAL_SPACING with HTTP 409 (candidate [14:30, 15:30] touches the widened window's closed endpoint 14:30, and the conflict is found even though the venue differs)"
            - "${res_2_status} == RESERVED and ${res_2_venue} == ${v2_id} (one minute of clearance is enough)"
            - "the 14:30 attempt created no row: GET /seating-reservations?resident_id=${r_id} returns exactly 2 rows, ${res_1_id} and ${res_2_id}"
            - "V2 seat capacity was never the binding constraint: 1 + 1 <= 10 in both attempts"

  - rule_id: compensating_invariant
    instances:
      - name: venue_committed_seats_reserve_then_release
        conserved_quantity: "calculation venue_committed_seats for a (venue, service_date, meal_period), and the derived open_seats"
        grounds:
          - calculations.venue_committed_seats
          - state_machines.SeatingReservation.RESERVED_to_RELEASED
          - endpoints[GET /venues/{id}/seat-availability]
          - endpoints[POST /seating-reservations/{id}/release]
        distinguishing_aspect: |
          Conserves a seat-count quantity: reserving a party of 3 raises committed_seats by exactly 3
          and releasing it returns the figure to its pre-reservation value with no residue, so the
          release is a true inverse of the reserve rather than a state-only flag flip.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community, one MAIN_DINING venue with seat_capacity 10."
            - "One ACTIVE resident with an APPROVED, ACTIVE REGULAR/THIN diet order."
            - "No reservations exist yet for 2026-08-12 / LUNCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Rosewood", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Rosewood Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 10, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Tomas Iverson", care_level: "ASSISTED_LIVING", baseline_weight_kg: 81.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "GET /venues/${v_id}/seat-availability"
              payload: { service_date: "2026-08-12", meal_period: "LUNCH" }
              as: DiningServicesManager
              captures: { committed_before: $.data.committed_seats, open_before: $.data.open_seats }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v_v1: $.data.version }
          trigger:
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v_id}", service_date: "2026-08-12", meal_period: "LUNCH", seat_start_utc: "2026-08-12T12:00:00Z", party_size: 3, expected_venue_version: "${v_v1}" }
              as: DiningServicesManager
              captures: { res_id: $.data.id, res_status: $.data.status }
            - call: "GET /venues/${v_id}/seat-availability"
              payload: { service_date: "2026-08-12", meal_period: "LUNCH" }
              as: DiningServicesManager
              captures: { committed_mid: $.data.committed_seats, open_mid: $.data.open_seats }
            - call: "POST /seating-reservations/${res_id}/release"
              payload: { reason: "family took the resident out" }
              as: DiningServicesManager
              captures: { res_status_after: $.data.status }
            - call: "GET /venues/${v_id}/seat-availability"
              payload: { service_date: "2026-08-12", meal_period: "LUNCH" }
              as: DiningServicesManager
              captures: { committed_after: $.data.committed_seats, open_after: $.data.open_seats, blocking_after: $.data.blocking_reservation_ids }
          assert:
            - "${committed_before} == 0 and ${open_before} == 10"
            - "${res_status} == RESERVED, ${committed_mid} == 3 and ${open_mid} == 7"
            - "${res_status_after} == RELEASED"
            - "${committed_after} == 0 and ${open_after} == 10 — identical to the pre-reservation figures, no residue"
            - "${blocking_after} == [] (the released row leaves the conflict set entirely)"
            - "the SeatingReservation row still exists and is retrievable at GET /seating-reservations/${res_id}; conservation is achieved by state, not by deletion"
      - name: community_billable_cents_issue_then_void
        conserved_quantity: "calculation community_billable_cents for a community over a service-date period, together with Resident.guest_meal_charge_balance_cents"
        grounds:
          - calculations.community_billable_cents
          - calculations.ticket_billed_amount
          - calculations.meal_count_reconciliation
          - calculations.reconciliation_net_billable
          - state_machines.MealServiceTicket.SERVED_to_VOIDED
          - entities.Resident.fields.guest_meal_charge_balance_cents
        distinguishing_aspect: |
          Conserves a money quantity rather than a seat count, and does it across two entities: the
          void moves the full 1173 cents out of billed_amount_cents into voided_amount_cents, drops
          the community's billable total and the resident's sponsorship balance back to their starting
          values, and — because the ticket was never BILLED by a FINALIZED reconciliation — adds no
          chargeback credit, so the fee waterfall recomputes to exactly zero instead of going negative.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community (guest_meal_sponsor_cap_cents default 20000), one MAIN_DINING venue with seat_capacity 10, posture COMPLIANT."
            - "One ACTIVE resident with an APPROVED, ACTIVE REGULAR/THIN diet order and guest_meal_charge_balance_cents 0."
            - "One sponsored GUEST LUNCH ticket on 2026-08-10 issued and then SERVED; its billed_amount_cents is 1173 (base 1250, sponsor discount 156, taxable 1094, meals tax 79)."
            - "No reconciliation of the community has been FINALIZED, so the ticket has never been BILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Talloak", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id, cap: $.data.guest_meal_sponsor_cap_cents }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Talloak Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 10, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Ulla Berenson", care_level: "ASSISTED_LIVING", baseline_weight_kg: 59.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version, bal_before: $.data.guest_meal_charge_balance_cents }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: DiningServicesManager
              captures: { t_id: $.data.id, t_amount: $.data.billed_amount_cents }
            - call: "POST /meal-tickets/${t_id}/serve"
              payload: {}
              as: DiningServicesManager
              captures: { t_status_served: $.data.status }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ClinicalStaff
              captures: { bal_issued: $.data.guest_meal_charge_balance_cents }
            - call: "POST /reconciliations"
              payload: { community_id: "${c_id}", period_start_date: "2026-08-10", period_end_date: "2026-08-10" }
              as: BillingSpecialist
              captures: { rec1_id: $.data.id, rec1_ledger: $.data.ticket_ledger_total_cents, rec1_census: $.data.census_projection_total_cents, rec1_variance: $.data.variance_cents, rec1_base: $.data.pre_fee_base_cents, rec1_fee: $.data.administrative_fee_cents, rec1_net: $.data.net_billable_total_cents }
          trigger:
            - call: "POST /meal-tickets/${t_id}/void"
              payload: { void_reason: "guest never arrived" }
              as: BillingSpecialist
              captures: { t_status_void: $.data.status, t_billed_after: $.data.billed_amount_cents, t_voided_after: $.data.voided_amount_cents, t_rec_link: $.data.billed_reconciliation_id }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ClinicalStaff
              captures: { bal_after: $.data.guest_meal_charge_balance_cents }
            - call: "POST /reconciliations"
              payload: { community_id: "${c_id}", period_start_date: "2026-08-10", period_end_date: "2026-08-10" }
              as: BillingSpecialist
              captures: { rec2_ledger: $.data.ticket_ledger_total_cents, rec2_census: $.data.census_projection_total_cents, rec2_variance: $.data.variance_cents, rec2_void: $.data.void_credit_cents, rec2_base: $.data.pre_fee_base_cents, rec2_fee: $.data.administrative_fee_cents, rec2_net: $.data.net_billable_total_cents }
          assert:
            - "${cap} == 20000 and ${bal_before} == 0"
            - "${t_amount} == 1173 and ${t_status_served} == SERVED and ${bal_issued} == 1173"
            - "${rec1_ledger} == 1173, ${rec1_census} == 1173, ${rec1_variance} == 0, ${rec1_base} == 1173, ${rec1_fee} == 70, ${rec1_net} == 1243"
            - "${t_status_void} == VOIDED, ${t_billed_after} == 0, ${t_voided_after} == 1173 and ${t_rec_link} == null"
            - "${bal_after} == 0 — the sponsorship balance returns exactly to ${bal_before}"
            - "${rec2_ledger} == 0 and ${rec2_census} == 0 and ${rec2_variance} == 0"
            - "${rec2_void} == 0 (the ticket was never BILLED, so no chargeback credit is raised)"
            - "${rec2_base} == 0, ${rec2_fee} == 0 and ${rec2_net} == 0 — no negative residue anywhere"
            - "conservation identity: t_billed_after + t_voided_after == ${t_amount} == 1173 at every step"
