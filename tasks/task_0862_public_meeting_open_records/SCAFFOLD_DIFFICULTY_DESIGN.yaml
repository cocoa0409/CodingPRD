              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "L", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
