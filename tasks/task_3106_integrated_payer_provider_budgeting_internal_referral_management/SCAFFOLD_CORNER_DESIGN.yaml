# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3106_integrated_payer_provider_budgeting_internal_referral_management
#
# Breadth probe: every testable claim in §1.1-§1.7 that §1.8 does not already
# exercise. Corners covered by a §1.8 instance appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: region_create_returns_every_declared_field_and_starts_open
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/regions
        distinguishing_aspect: "A region created with name, state_codes and margin_target_pct comes back 201 with posture OPEN, capitation_index 1.0, and server-generated id / created_at / updated_at / version 1."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_region
              call: "POST /regions"
              payload: { name: "Test Region", state_codes: ["CA"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Region.${r1}.posture == OPEN and Region.${r1}.capitation_index == 1.0"
            - "Region.${r1}.premium_revenue_cents == 0 and Region.${r1}.operating_margin_cents == 0"
            - "Region.${r1}.version == 1 and Region.${r1}.member_count == 0"
            - "the response carries non-null id, created_at and updated_at, and meta.api_request_id is present"

      - name: member_get_returns_the_stored_capitation_and_region
        claim_type: Retrieval
        grounds:
          - entities.Member
          - endpoints.GET_/members/{id}
        distinguishing_aspect: "Every Member field round-trips through GET exactly as stored, including the computed capitation_rate_cents 84000 and the defaulted status ACTIVE."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and member with risk_score 1.0."
          setup_api_calls:
            - *c_clock
            - *c_region
            - &c_site
              call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Test Medical Office", site_type: "MEDICAL_OFFICE", licensed_beds: 0, staffing_fte_budget: 10.0, facility_investment_budget_cents: 2000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - &c_dept
              call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d1: $.data.id }
            - &c_prov
              call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Test", specialty: "PRIMARY_CARE", compensation_model: "SALARY", base_component_cents: 1250000, panel_size_target: 1000 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - &c_member
              call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-T-1", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id, m1_v: $.data.version }
          trigger:
            - call: "GET /members/${m1}"
              payload: {}
              as: RegionalFinanceOfficer
          assert:
            - "the response status is 200"
            - "Member.${m1}.member_ref == \"M-T-1\" and Member.${m1}.plan_product == COMMERCIAL_HMO"
            - "Member.${m1}.risk_score == 1.0 and Member.${m1}.capitation_rate_cents == 84000"
            - "Member.${m1}.region_id == ${r1} and Member.${m1}.attributed_provider_id == ${p1}"
            - "Member.${m1}.status == ACTIVE and Member.${m1}.benefit_tier == TIER_1"

      - name: members_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/regions/{id}/members
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three members on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and three members."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-T-2", attributed_provider_id: "${p1}", plan_product: "MEDICARE_ADVANTAGE", benefit_tier: "TIER_2", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m2: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-T-3", attributed_provider_id: "${p1}", plan_product: "MEDICAID_MANAGED", benefit_tier: "TIER_3", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m3: $.data.id }
          trigger:
            - call: "GET /regions/${r1}/members"
              payload: { limit: 2, offset: 0 }
              as: RegionalFinanceOfficer
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /regions/${r1}/members?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /regions/${r1}/members?plan_product=MEDICARE_ADVANTAGE returns exactly 1 row"
            - "GET /regions/${r1}/members with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: provider_get_with_an_unknown_id_returns_provider_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/providers/{id}
          - errors.ERR_PROVIDER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the path produces the entity-specific 404 ERR_PROVIDER_NOT_FOUND, not a generic 400."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /providers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PROVIDER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: member_create_missing_risk_score_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.risk_score
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "risk_score is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a computed capitation of 0."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department and provider."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
          trigger:
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-OMIT", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /regions/${r1}/members returns 0 rows"

      - name: care_site_create_omitting_staffing_fte_filled_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.CareSite.fields.staffing_fte_filled
          - entities.Region.fields.staffing_and_facility_cents
        distinguishing_aspect: "staffing_fte_filled and facility_investment_spent_cents are server-computed with no client value, so a newly opened CareSite stores 0 for both and contributes 0 to the region's staffing_and_facility_cents."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
            - *c_region
          trigger:
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Zero Staff Site", site_type: "MEDICAL_OFFICE", licensed_beds: 0, staffing_fte_budget: 8.0, facility_investment_budget_cents: 500000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
          assert:
            - "the response status is 201 and CareSite.${cs1}.staffing_fte_filled == 0"
            - "CareSite.${cs1}.facility_investment_spent_cents == 0"
            - "GET /regions/${r1} reports staffing_and_facility_cents == 0"
            - "CareSite.${cs1}.staffing_fte_budget == 8.0"

      - name: department_patch_ignores_client_supplied_slots_committed
        claim_type: Computed Fields
        grounds:
          - entities.Department.fields.appointment_slots_committed
          - endpoints.PATCH_/departments/{id}
        distinguishing_aspect: "appointment_slots_committed is source: computed, so a PATCH body naming status or wait_threshold_days never moves it and it stays at the derived count."
        test_recipe:
          setup:
            - "Logical clock default; one region, site and department."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
          trigger:
            - call: "PATCH /departments/${d1}"
              payload: { wait_threshold_days: 10, accepting_internal_referrals: false }
              as: AccessScheduler
          assert:
            - "the response status is 200 and Department.${d1}.wait_threshold_days == 10"
            - "Department.${d1}.accepting_internal_referrals == false"
            - "Department.${d1}.appointment_slots_committed == 0, unchanged and never client-supplied"
            - "Department.${d1}.appointment_slots_budgeted == 200"

      - name: entity_ids_and_timestamps_are_server_generated
        claim_type: System Fields
        grounds:
          - entities.Region
          - entities.Member
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted on Region and Member; the id carries no type prefix and version starts at exactly 1."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
            - *c_region
          trigger:
            - call: "GET /regions/${r1}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Region.${r1}.version == 1"
            - "Region.${r1}.id matches the UUID shape 8-4-4-4-12 with no type prefix"
            - "Region.${r1}.created_at equals Region.${r1}.updated_at on a freshly created row"
            - "Region.${r1}.created_at is an ISO 8601 UTC instant with three fractional digits"

      - name: referential_integration_create_rejects_unknown_enum
        claim_type: Type Constraints
        grounds:
          - entities.ReferentialIntegration.fields.integration_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "integration_type is an enum, so an out-of-set value is a 400 ERR_INVALID_REQUEST rather than a silently stored string."
        test_recipe:
          setup:
            - "Logical clock default; one region."
          setup_api_calls:
            - *c_clock
            - *c_region
          trigger:
            - call: "POST /regions/${r1}/referential-integrations"
              payload: { integration_type: "BAD_TYPE", risk_sharing_model: "CAPITATED", bound_effective_date: "2026-09-01T00:00:00Z", cost_reporting_basis_cents: 1000000, shared_savings_rate: 0.0, per_diem_days: 0, per_diem_rate_cents: 0, per_diem_cap_cents: 0, interim_claim_count: 0 }
              as: BudgetAppropriationsCommittee
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /regions/${r1}/referential-integrations returns 0 rows"

      - name: quality_metric_create_requires_an_existing_region_and_provider
        claim_type: Parent Relationships
        grounds:
          - entities.QualityMetric.fields.region_id
          - entities.QualityMetric.fields.accountable_provider_id
          - errors.ERR_REFERENCED_RESOURCE_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A body-supplied provider id that does not resolve is a 422 ERR_REFERENCED_RESOURCE_NOT_FOUND from the body-existence check, distinct from the 404 path-existence check."
        test_recipe:
          setup:
            - "Logical clock default; one region."
          setup_api_calls:
            - *c_clock
            - *c_region
          trigger:
            - call: "POST /regions/${r1}/quality-metrics"
              payload: { metric_code: "QUALITY_COMPOSITE", period: "2026-09", target_value: 80, accountable_provider_id: "00000000-0000-4000-8000-000000000000" }
              as: QualityReviewBoard
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"
            - "error_id != ERR_REGION_NOT_FOUND and error_id != ERR_PROVIDER_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: referral_deny_from_completed_returns_referral_not_decidable
        claim_type: invalid_transition
        grounds:
          - state_machines.Referral.SCHEDULED_to_COMPLETED
          - errors.ERR_REFERRAL_NOT_DECIDABLE
        distinguishing_aspect: "A COMPLETED referral is terminal, so a second decision is rejected with ERR_REFERRAL_NOT_DECIDABLE and no side effect fires."
        test_recipe:
          setup:
            - "Logical clock default; a referral driven to COMPLETED through authorization, booking and delivery."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id }
            - call: "POST /referrals/${ref1}/authorize"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", referral_id: "${ref1}", appointment_type: "SPECIALTY", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/complete"
              payload: {}
              as: CareTeamMember
          trigger:
            - call: "POST /referrals/${ref1}/deny"
              payload: {}
              as: UtilizationReviewer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REFERRAL_NOT_DECIDABLE"
            - "GET /referrals/${ref1} still reports status COMPLETED and appeal_rounds 0"

      - name: appointment_complete_from_requested_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Appointment.REQUESTED_to_SCHEDULED
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Completion requires fulfillment_status SCHEDULED, so completing a REQUESTED appointment is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "GET /appointments"
              payload: { member_id: "${m1}" }
              as: AccessScheduler
          assert:
            - "GET /appointments?member_id=${m1} returns an empty array, because booking and scheduling are the same POST and no appointment exists yet"
            - "an Appointment created by POST /appointments is already SCHEDULED, so a REQUESTED appointment never persists"
            - "POST /appointments/${m1}/complete returns 404 ERR_APPOINTMENT_NOT_FOUND because no appointment row exists to complete"

      - name: regional_budget_approve_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.RegionalBudget.SUBMITTED_to_APPROVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Approval is one-way from SUBMITTED, so a second approval on an already APPROVED budget is rejected with ERR_INVALID_STATE rather than succeeding idempotently."
        test_recipe:
          setup:
            - "Logical clock default; one region and a submitted budget."
          setup_api_calls:
            - *c_clock
            - *c_region
            - &c_budget
              call: "POST /regions/${r1}/regional-budgets"
              payload: { period: "2026-09", staffing_budget_cents: 20000000, outside_services_budget_cents: 20000000, facility_investment_cents: 2000000, system_deductible_cents: 0 }
              as: RegionalFinanceOfficer
              captures: { rb1: $.data.id }
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
          trigger:
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "GET /regional-budgets/${rb1} still reports status APPROVED"

      - name: capacity_plan_activate_from_planning_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CapacityPlan.PLANNING_to_UNDER_REVIEW
          - state_machines.CapacityPlan.UNDER_REVIEW_to_ACTIVE
          - errors.ERR_CAPACITY_PLAN_NOT_ACTIVATABLE
        distinguishing_aspect: "Activation requires UNDER_REVIEW, so activating a PLANNING plan is rejected with ERR_CAPACITY_PLAN_NOT_ACTIVATABLE."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department and a PLANNING capacity plan."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 100, panel_target: 3 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
          trigger:
            - call: "POST /capacity-plans/${cp1}/activate"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CAPACITY_PLAN_NOT_ACTIVATABLE"
            - "GET /regions/${r1}/capacity-plans reports the plan still in PLANNING"

      - name: member_transfer_complete_before_effective_date_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MemberTransfer.PENDING_EFFECTIVE_to_COMPLETED
          - errors.ERR_TRANSFER_EFFECTIVE_DATE_NOT_REACHED
          - validations[priority=10]
        distinguishing_aspect: "Completion requires the logical clock to be at or after effective_utc, so completing at 2026-09-01 when effective_utc is 2026-12-01 returns ERR_TRANSFER_EFFECTIVE_DATE_NOT_REACHED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01; two regions each with a member; a transfer with effective_utc 2026-12-01 accepted."
          setup_api_calls:
            - *c_clock
            - *c_region
            - call: "POST /regions"
              payload: { name: "Dest Region", state_codes: ["NV"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /member-transfers"
              payload: { member_id: "${m1}", from_region_id: "${r1}", to_region_id: "${r2}", effective_utc: "2026-12-01T00:00:00Z", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { tr1: $.data.id }
            - call: "POST /member-transfers/${tr1}/accept"
              payload: {}
              as: RegionalFinanceOfficer
          trigger:
            - call: "POST /member-transfers/${tr1}/complete"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TRANSFER_EFFECTIVE_DATE_NOT_REACHED"
            - "Member.${m1}.status == TRANSFER_PENDING and Member.${m1}.region_id == ${r1}"
            - "GET /member-transfers/${tr1} reports status PENDING_EFFECTIVE"
            - "the destination region's premium_revenue_cents excludes the member's capitation"

      - name: referral_held_returns_to_pending_triage_when_region_returns_open
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Referral.HELD_to_PENDING_TRIAGE
          - state_machines.Region.RESTRICTED_to_OPEN
        distinguishing_aspect: "The HELD -> PENDING_TRIAGE revival fires from the region's posture hop, not from any referral endpoint, so the referral's state depends on the region machine."
        test_recipe:
          setup:
            - "Logical clock default; a region driven RESTRICTED by an appointment-driven capacity breach, with one PENDING_TRIAGE referral held by that hop."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id }
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 1, panel_target: 1 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
            - call: "POST /capacity-plans/${cp1}/review"
              payload: {}
              as: AccessScheduler
            - call: "POST /capacity-plans/${cp1}/activate"
              payload: {}
              as: RegionalFinanceOfficer
          trigger:
            - call: "GET /referrals/${ref1}"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id }
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { posture_after: $.data.posture }
            - call: "GET /referrals/${ref1}"
              payload: {}
              as: UtilizationReviewer
          assert:
            - "the referral starts PENDING_TRIAGE because the region is still OPEN before the booking"
            - "Region.${r1}.posture == RESTRICTED after the booking overshoots the capacity budget"
            - "GET /referrals/${ref1} reports status HELD, caused by the region posture hop"
            - "the held referral carries no Appointment because a specialty hold blocks booking"

      - name: quality_metric_finalize_gated_on_logged_internal_referral_pct
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.QualityMetric.MEASURING_to_FINALIZED
          - calculations.internal_referral_rate
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Finalize requires logged_internal_referral_pct == 1.0, so a region with an unauthorized internal referral cannot finalize its metric even with a valid outcome value."
        test_recipe:
          setup:
            - "Logical clock default; one region with a provider, one member and a metric, plus one internal referral that has not been decided."
          setup_api_calls:
            - *c_clock
