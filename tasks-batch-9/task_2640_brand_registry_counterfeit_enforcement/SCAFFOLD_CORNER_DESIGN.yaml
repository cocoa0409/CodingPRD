          setup:
            - "A brand whose only registration is PENDING (POST /brand-protection/claims does not require an enforceable registration — only enrollment activation, takedown and recordation do)"
            - "A listing priced at 0 with a perfect matcher output, so match_score is exactly 1.0000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
