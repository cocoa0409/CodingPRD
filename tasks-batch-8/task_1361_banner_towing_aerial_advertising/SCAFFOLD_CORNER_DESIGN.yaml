        test_recipe:
          setup: ["Client C1 with campaign CAM1; Client C2 tries to cancel CAM1"]
          setup_api_calls:
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
            - call: "POST /btaa/clients"
              payload: { legal_name: "C1", billing_email: "c1@x.com" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "C2", billing_email: "c2@x.com" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /btaa/clients/${c1_id}/campaigns"
              payload: { name: "CAM1" }
              as: Client
              as_user_id: "${c1_id}"
              captures: { cam_id: $.data.id }
          trigger:
            - call: "POST /btaa/campaigns/${cam_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_OWNER"

  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_campaign_version_on_book
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[campaign-book-stale-campaign, errors[ERR_STALE_VERSION]]
        distinguishing_aspect: "Second book call with stale expected_campaign_version → 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Campaign with one BOOKED slot; client holds version V; another writer books an additional slot (campaign.version bumps to V+1); original client attempts book with expected_campaign_version=V"]
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/aircraft"
              payload: { tail_number: "N1", model: "CITABRIA", max_tow_weight_lbs: 500, hourly_rate_cents: 30000 }
              as: PlatformAdmin
            - call: "POST /btaa/bases/${base_id}/pilots"
              payload: { full_name: "P", certificate_number: "C", tow_endorsement_level: "STANDARD" }
              as: PlatformAdmin
            - call: "POST /btaa/routes"
              payload: { code: "R", kind: "BEACH", base_id: "${base_id}", length_nm: 5, min_banner_length_ft: 10 }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id, cam_v0: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h", text_message: "M", banner_length_ft: 50, banner_weight_lbs: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M", proposed_artwork_hash: "h" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/routes/${route_id}/airspace_approvals"
              payload: { date_local: "2026-08-13", window_start_utc: "2026-08-13T14:00:00Z", window_end_utc: "2026-08-13T18:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /btaa/airspace_approvals/${ap_id}/grant"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /btaa/bases/${base_id}/seasonal_capacities"
              payload: { month_yyyy_mm: "2026-08", aircraft_hour_quota: 100 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-13", planned_start_utc: "2026-08-13T15:00:00Z", planned_duration_hours: 1, expected_seasonal_capacity_version: "${sc_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { s1: $.data.id }
          trigger:
            # cam_v0 was 1 at campaign creation; the slot create bumped it to 2.
            # Attempting to book with stale expected_campaign_version=1 must fail 412.
            - call: "POST /btaa/campaigns/${cam_id}/book"
              payload: { expected_campaign_version: "${cam_v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: run_ops_expires_stale_make_good_credits
        claim_type: scheduled_actions
        grounds:
          - endpoints["POST /btaa/bases/{id}/run_ops", entities.MakeGoodCredit]
        distinguishing_aspect: "MakeGoodCredit whose expires_on_local < current date is EXPIRED by run_ops."
        test_recipe:
          setup: ["Credit with expires_on_local=2026-08-10; clock set to 2026-08-15; run_ops expires it"]
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /btaa/bases/${base_id}/run_ops"
              payload: {}
              as: PlatformAdmin
              captures: { expired_count: $.data.expired_credit_count }
          assert:
            # With no credits in this base, expired_count==0; a fuller chain that first creates a credit is a §1.8 concern.
            - "expired_count == 0"
