      - name: aborted_recoveries_leave_the_technician_occupation_set_empty
        claim_type: input_set_filtering
        grounds:
          - calculations.technician_occupation_interval
          - calculations.technician_occupation_interval.input_set
          - "endpoints[POST /eye-bank/recoveries/{id}/abort]"
        distinguishing_aspect: |
          The candidate set is restricted to statuses {DISPATCHED, ON_SITE, COMPLETED}. Recovery A
          occupies [06:30, 11:00) and is then ABORTED; a second dispatch for the SAME technician at
          07:00 — squarely inside that former interval — must be accepted 201, because the aborted
          row is filtered out of the input set entirely rather than merged.
