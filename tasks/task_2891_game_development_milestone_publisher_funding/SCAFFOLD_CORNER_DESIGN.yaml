# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2891_game_development_milestone_publisher_funding
# Breadth walk over references/claim-extraction-guide.md, section by section,
# against this scaffold's §1.1-§1.7. Corners already asserted by a §1.8
# instance appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_create_development_agreement_returns_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.DevelopmentAgreement
          - endpoints.POST_/development-agreements
          - entities.DevelopmentAgreement.fields.funding_pool_cents
          - entities.DevelopmentAgreement.fields.status
        distinguishing_aspect: "A freshly created agreement must answer 201 with status DRAFT, version 1, funding_pool_cents equal to advance_total_cents (12000000), committed_cents 0, available_funding_cents 12000000, funding_posture OPEN, recoupment_state PRE_RECOUP, post_launch_support_state PENDING, ship_date_current equal to ship_date_original and terminated_at null - an implementation that leaves the computed ledger fields absent or null fails."
        test_recipe:
          setup:
            - "One Studio, one Publisher and one FINANCE PublisherUser exist; no agreement exists yet."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
          trigger:
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Drift", advance_total_cents: 12000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 500000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "DevelopmentAgreement.${agreement_id}.status == DRAFT and version == 1"
            - "DevelopmentAgreement.${agreement_id}.funding_pool_cents == 12000000 and committed_cents == 0 and available_funding_cents == 12000000"
            - "DevelopmentAgreement.${agreement_id}.funding_posture == OPEN and recoupment_state == PRE_RECOUP"
            - "DevelopmentAgreement.${agreement_id}.post_launch_support_state == PENDING and live_ops_drawn_cents == 0"
            - "DevelopmentAgreement.${agreement_id}.ship_date_current == 2027-03-31 and schedule_slip_days == 0"
            - "DevelopmentAgreement.${agreement_id}.sequel_rights_holder == PUBLISHER and ip_reversion_state == NONE and terminated_at == null"

      - name: corner_get_milestone_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/milestones/{id}
          - entities.Milestone
        distinguishing_aspect: "GET /milestones/{id} must echo the stored row exactly, including the input acceptance_criteria array order and the DEFINED initial status of a milestone created against a DRAFT agreement."
        test_recipe:
          setup:
            - "A DRAFT agreement with one milestone (ALPHA, funded 3600000, contractor budget 800000, three acceptance criteria)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Drift", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 800000, acceptance_criteria: ["Core loop playable", "Two biomes complete", "Save and load"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /milestones/${m1_id}"
              payload: {}
              as: Developer
              as_user_id: "${studio_id}"
          assert:
            - "HTTP 200; Milestone.${m1_id}.agreement_id == ${agreement_id}"
            - "Milestone.${m1_id}.status == DEFINED and gate_profile == ALPHA and sequence_index == 1"
            - "Milestone.${m1_id}.funded_amount_cents == 3600000 and uplift_cents == 0 and contractor_budget_cents == 800000"
            - "Milestone.${m1_id}.acceptance_criteria == [\"Core loop playable\", \"Two biomes complete\", \"Save and load\"] (order preserved)"
            - "Milestone.${m1_id}.cure_count == 0, latest_build_number == 0, open_condition_indexes == [], content_threshold_relief_pct == 0.00, accepted_at == null"

      - name: corner_list_milestones_by_agreement_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/milestones
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three milestones on one agreement, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and limit=2&offset=2 returns the remaining 1 row with has_more false; total_count must count the whole filtered set, not the page."
        test_recipe:
          setup:
            - "A DRAFT agreement Aurora Drift with three milestones (sequence_index 1, 2, 3) and a second agreement with no milestones."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Drift", advance_total_cents: 12000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 500000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Side Project", advance_total_cents: 1000000, royalty_rate_bps: 2000, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2028-01-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { other_agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 800000, acceptance_criteria: ["Core loop playable"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 2, title: "Beta", gate_profile: "BETA", funded_amount_cents: 5400000, contractor_budget_cents: 600000, acceptance_criteria: ["Online co-op"], depends_on_milestone_id: "${m1_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 3, title: "Gold", gate_profile: "GOLD", funded_amount_cents: 3000000, contractor_budget_cents: 400000, acceptance_criteria: ["Zero blockers"], depends_on_milestone_id: "${m2_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /milestones"
              payload: { agreement_id: "${agreement_id}", limit: 2, offset: 0 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /milestones"
              payload: { agreement_id: "${agreement_id}", limit: 2, offset: 2 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { page2_first_id: "$.data[0].id" }
            - call: "GET /milestones"
              payload: { agreement_id: "${other_agreement_id}" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "trigger call 1 -> HTTP 200, response_type == array, 2 rows, meta total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger call 2 -> 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of the two pages is exactly {${m1_id}, ${m2_id}, ${m3_id}} with no duplicates"
            - "trigger call 3 -> 0 rows, total_count == 0, has_more == false (the agreement_id filter is honored)"

      - name: corner_get_development_agreement_with_unknown_id_returns_agreement_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors.ERR_AGREEMENT_NOT_FOUND
          - endpoints.GET_/development-agreements/{id}
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /development-agreements/{id} must answer 404 ERR_AGREEMENT_NOT_FOUND in the error envelope, not 200 with an empty body and not 500."
        test_recipe:
          setup:
            - "A registry exists so the acting FINANCE user resolves (priority 3 passes) but no agreement carries the probed id."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
          trigger:
            - call: "GET /development-agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { not_found_error_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_AGREEMENT_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: corner_create_milestone_without_gate_profile_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/milestones
          - entities.Milestone.fields.gate_profile
        distinguishing_aspect: "gate_profile has source input and no default, so omitting it must answer 400 ERR_INVALID_REQUEST and persist no Milestone; the agreement's committed_cents must stay 0."
        test_recipe:
          setup:
            - "A DRAFT agreement exists with no milestones."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Drift", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
          trigger:
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", funded_amount_cents: 3600000, contractor_budget_cents: 800000, acceptance_criteria: ["Core loop playable"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { missing_field_error_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /milestones?agreement_id=${agreement_id} returns 0 rows"
            - "DevelopmentAgreement.${agreement_id}.committed_cents == 0 and available_funding_cents == 3600000"

      - name: corner_agreement_optional_rate_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DevelopmentAgreement.fields.recoupable_cost_cap_bps
          - entities.DevelopmentAgreement.fields.platform_fee_bps
          - entities.DevelopmentAgreement.fields.live_ops_quarterly_funding_cents
          - endpoints.POST_/development-agreements
        distinguishing_aspect: "Omitting recoupable_cost_cap_bps, platform_fee_bps and live_ops_quarterly_funding_cents must persist 2000, 3000 and 0 respectively - the values the royalty settlement and live-ops allowance calculations then read - rather than null or a hardcoded copy of a supplied sibling field."
        test_recipe:
          setup:
            - "One Studio, one Publisher and one FINANCE PublisherUser exist."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
          trigger:
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Bare Bones Deal", advance_total_cents: 4000000, royalty_rate_bps: 1800, ship_date_original: "2027-12-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
          assert:
            - "HTTP 201; DevelopmentAgreement.${agreement_id}.recoupable_cost_cap_bps == 2000"
            - "DevelopmentAgreement.${agreement_id}.platform_fee_bps == 3000"
            - "DevelopmentAgreement.${agreement_id}.live_ops_quarterly_funding_cents == 0"
            - "DevelopmentAgreement.${agreement_id}.royalty_rate_bps == 1800 and advance_total_cents == 4000000"

      - name: corner_build_gate_state_and_readiness_score_are_server_computed
        claim_type: computed_fields
        grounds:
          - entities.MilestoneBuild.fields.readiness_score
          - entities.MilestoneBuild.fields.gate_state
          - entities.MilestoneBuild.fields.submitted_at
          - calculations.build_gate_evaluation
        distinguishing_aspect: "readiness_score and gate_state are declared source computed: a 92.00 / 96.50 / 61.00 ALPHA build must come back with readiness_score 87.38 and gate_state PASSED, and submitted_at must be the logical clock 2026-08-01T00:00:00.000Z rather than wall-clock time."
        test_recipe:
          setup:
            - "Agreement Aurora Solo: advance_total_cents 3600000, one ALPHA milestone funded 3600000, ACTIVE and IN_DEVELOPMENT."
            - "The logical clock is untouched, so it reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Solo", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 0, acceptance_criteria: ["Core loop playable", "Two biomes complete"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
          trigger:
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 7, feature_completeness_pct: 92.00, crash_free_sessions_pct: 96.50, content_completeness_pct: 61.00, known_blocker_count: 3, release_notes: "Alpha candidate" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
          assert:
            - "HTTP 201; MilestoneBuild.${b1_id}.readiness_score == 87.38"
            - "MilestoneBuild.${b1_id}.gate_state == PASSED"
            - "MilestoneBuild.${b1_id}.submitted_at == 2026-08-01T00:00:00.000Z"
            - "MilestoneBuild.${b1_id}.addressed_condition_indexes == [] (declared default)"
            - "Milestone.${m1_id}.latest_build_number == 7 and status == UNDER_REVIEW"

      - name: corner_system_fields_are_minted_and_version_increments_per_mutation
        claim_type: system_fields
        grounds:
          - entities.DevelopmentAgreement
          - state_machines.DevelopmentAgreement.DRAFT_to_ACTIVE
          - state_machines.DevelopmentAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "id / created_at / updated_at / version are server-minted: version must read 1 after create, 2 after activate and 3 after suspend, created_at must stay fixed while updated_at advances, and id must be a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "Agreement Ledgerline: advance_total_cents 2000000 with a single ALPHA milestone funded 2000000, created in DRAFT."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Ledgerline Studio", contact_email: "dev@ledgerline.example", country_code: "NL" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Ledgerline", advance_total_cents: 2000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id, created_version: $.data.version }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 2000000, contractor_budget_cents: 0, acceptance_criteria: ["Prototype loop"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /development-agreements/${agreement_id}/suspend"
              payload: { reason: "Cash-flow review" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "at create: DevelopmentAgreement.${agreement_id}.version == 1 and id is a 36-character UUID with no prefix"
            - "after trigger call 1: version == 2 and status == ACTIVE"
            - "after trigger call 2: version == 3 and status == SUSPENDED"
            - "created_at is identical across all three reads and is an ISO 8601 UTC instant with exactly three fractional digits"
            - "updated_at after trigger call 2 is >= updated_at after trigger call 1"

      - name: corner_unknown_gate_profile_enum_value_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - entities.Milestone.fields.gate_profile
        distinguishing_aspect: "gate_profile is constrained to {ALPHA, BETA, GOLD}; the value SILVER must answer 400 ERR_INVALID_REQUEST before any funding check runs, and no Milestone row may be persisted."
        test_recipe:
          setup:
            - "A DRAFT agreement with advance_total_cents 3600000 and no milestones."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Drift", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
          trigger:
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Silver Build", gate_profile: "SILVER", funded_amount_cents: 3600000, contractor_budget_cents: 0, acceptance_criteria: ["Core loop playable"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { enum_error_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /milestones?agreement_id=${agreement_id} returns 0 rows"

      - name: corner_publisher_review_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.PublisherReview
          - endpoints.GET_/publisher-reviews/{id}
          - endpoints.GET_/publisher-reviews
        distinguishing_aspect: "PublisherReview declares common_fields: false, so the persisted row exposes id and created_at but no version and no updated_at, and §1.5 offers no update or delete route for it - a second verdict on the same build is a new decision path, never an edit."
        test_recipe:
          setup:
            - "Agreement Stillwater: advance_total_cents 3600000, one ALPHA milestone funded 3600000, ACTIVE; build 1 (75.00 / 96.00 / 60.00 / 5) is UNDER_REVIEW."
            - "One REJECTED review is recorded on that build."
          setup_api_calls:
            - call: "POST /studios"
