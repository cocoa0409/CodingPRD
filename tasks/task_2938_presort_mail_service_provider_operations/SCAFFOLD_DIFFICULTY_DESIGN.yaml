  # ===========================================================================
  # Rule 5 — Priority-ordered validation conflicts, three different category pairs
  #   (1) state (13) beats business_fiscal (46)
  #   (2) business_safety (23) beats business_referential (25)
  #   (3) state (20) beats business_temporal (39)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precedes_fiscal_on_resubmitted_statement
        grounds:
          - validations[priority=13]
          - validations[priority=46]
          - errors.ERR_INVALID_STATEMENT_STATE
          - errors.ERR_INSUFFICIENT_POSTAGE_BALANCE
        distinguishing_aspect: |
          Pair: category state (priority 13, ERR_INVALID_STATEMENT_STATE, 409) against
          category business_fiscal (priority 46, ERR_INSUFFICIENT_POSTAGE_BALANCE, 402),
          the rule the scaffold pins to evaluate LAST. The permit is funded with exactly
          79152 c, so the first submit drains the balance to 0; a second submit violates
          BOTH rules at once (the statement is no longer DRAFT and there is no balance left
          to reserve). An implementation that checks funds early — the natural place, since
          money is the expensive lookup — returns 402 and fails. Correct answer is 409
          ERR_INVALID_STATEMENT_STATE.
        test_recipe:
          setup:
            - "The canonical two-client batch is sorted, giving declared_postage_cents 79152."
            - "The house permit account is funded with exactly 79152 c, so the successful submit leaves balance_cents 0 and reserved_cents 79152 — the equality boundary of validation 46 passes on the first submit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Acme Direct", client_code: "ACME", service_fee_rate_per_thousand_cents: 900 }
              as: BureauAdmin
              captures: { cl_a_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Borealis Mailers", client_code: "BORE", service_fee_rate_per_thousand_cents: 2200 }
              as: BureauAdmin
              captures: { cl_b_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Bureau House Account", client_code: "PSBUREAU", service_fee_rate_per_thousand_cents: 1, commingle_opt_in: false }
              as: BureauAdmin
              captures: { cl_h_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_a_id}", permit_number: "PI-100100", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_a_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_b_id}", permit_number: "PI-200200", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_b_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_h_id}", permit_number: "PI-900900", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_h_id: $.data.id, pa_h_v0: $.data.version }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_a_id}", permit_account_id: "${pa_a_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_a_id: $.data.id }
            - call: "POST /mail-jobs/${job_a_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_b_id}", permit_account_id: "${pa_b_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1850, declared_weight_oz_per_piece: 1.1 }
              as: PresortOperator
