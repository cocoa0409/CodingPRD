  - { id: ERR_REPORT_INVALID_TRANSITION, http: 409, condition: "DailyReport status does not allow this transition" }
  - { id: ERR_ENTRY_INVALID_TRANSITION, http: 409, condition: "Entry already VOIDED or not ACTIVE" }
  - { id: ERR_DELAY_INVALID_TRANSITION, http: 409, condition: "DelayEvent status does not allow this transition" }
  - { id: ERR_OBSERVATION_INVALID_TRANSITION, http: 409, condition: "SafetyObservation status does not allow this transition" }
  - { id: ERR_INCIDENT_INVALID_TRANSITION, http: 409, condition: "Incident status does not allow this transition/outcome" }
  - { id: ERR_DELIVERY_INVALID_TRANSITION, http: 409, condition: "MaterialDelivery status does not allow this inspection action" }
  - { id: ERR_TICKET_INVALID_TRANSITION, http: 409, condition: "TmTicket status does not allow this transition" }
  - { id: ERR_MEDIA_INVALID_TRANSITION, http: 409, condition: "MediaAttachment already PURGED" }
  - { id: ERR_DISTRIBUTION_INVALID_TRANSITION, http: 409, condition: "DistributionRecord status does not allow this transition" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "Parent report content_posture is SEALED (child mutation forbidden)" }
  - { id: ERR_INCIDENT_ON_LOCKED_REPORT, http: 409, condition: "Incident create/escalate against a LOCKED report" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # safety
  - { id: ERR_HIGH_RISK_OBSERVATION_REQUIRES_MEDIA, http: 422, condition: "risk_level HIGH without media_attachment_id" }
  - { id: ERR_INCIDENT_NARRATIVE_REQUIRED, http: 422, condition: "severity MEDICAL_TREATMENT/LOST_TIME/FATALITY with narrative < 50 chars" }
  - { id: ERR_INCIDENT_MEDIA_REQUIRED, http: 409, condition: "RECORDABLE close without an ACTIVE linked MediaAttachment" }
  - { id: ERR_OSHA_NOTIFICATION_REQUIRED, http: 409, condition: "RECORDABLE close of an incident whose deadline exists but osha_notified_at is null" }
  - { id: ERR_INCIDENT_RECORDABLE_MISMATCH, http: 422, condition: "close outcome conflicts with computed recordability" }
  - { id: ERR_OSHA_NOT_APPLICABLE, http: 409, condition: "notify-osha on a non-recordable incident" }
  # constraint
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user forbidden for paired duties (submit/approve, create/sign, create/verify-close, create/close, recall by non-submitter)" }
  - { id: ERR_SIGNATURE_ORDER, http: 409, condition: "Owner signature attempted before contractor signature" }
  - { id: ERR_DUPLICATE_CONTRACT_NUMBER, http: 409, condition: "Project contract_number already exists" }
  - { id: ERR_DUPLICATE_WORK_AREA_CODE, http: 409, condition: "WorkArea code already exists within project" }
  - { id: ERR_DUPLICATE_ZONE_CODE, http: 409, condition: "DeliveryZone zone_code already exists within project" }
  - { id: ERR_DUPLICATE_COST_CODE, http: 409, condition: "WorkItem cost_code already exists within project" }
  - { id: ERR_DUPLICATE_REPORT_DATE, http: 409, condition: "DailyReport already exists for (project_id, report_date)" }
  - { id: ERR_DUPLICATE_RECIPIENT, http: 409, condition: "DistributionRecord already exists for (report_id, recipient_email)" }
  - { id: ERR_EQUIPMENT_CAPACITY_EXCEEDED, http: 422, condition: "hours_used + hours_idle > 24 * unit_count" }
  - { id: ERR_MEDIA_LINK_CONSTRAINT, http: 422, condition: "Both linked_incident_id and linked_delivery_id set" }
  - { id: ERR_GPS_INCOMPLETE_PAIR, http: 422, condition: "Only one of gps_lat / gps_lng supplied" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different request body" }
  - { id: ERR_TICKET_EMPTY, http: 422, condition: "submit-for-signature with total_cents == 0" }
  - { id: ERR_INSPECTION_QTY_OVERFLOW, http: 422, condition: "inspection quantities negative or exceeding pending_recount_qty" }
  - { id: ERR_MEDIA_LINKED_TO_INCIDENT, http: 409, condition: "purge of media linked to an incident" }
  # temporal
  - { id: ERR_REPORT_DATE_FUTURE, http: 422, condition: "submit with report_date after the logical clock's current date" }
  - { id: ERR_WEATHER_OUTSIDE_REPORT_DATE, http: 422, condition: "observed_at outside report_date calendar day" }
  - { id: ERR_MEDIA_CAPTURED_OUTSIDE_REPORT_DATE, http: 422, condition: "captured_at outside report_date calendar day" }
  - { id: ERR_INCIDENT_OCCURRED_IN_FUTURE, http: 422, condition: "occurred_at after logical now" }
  - { id: ERR_DELAY_WINDOW_INVALID, http: 422, condition: "DelayEvent end_at <= start_at" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Delivery scheduled_window_end <= scheduled_window_start" }
  - { id: ERR_DELAY_OVERLAP_COMPENSABLE, http: 409, condition: "EXCUSABLE_COMPENSABLE window overlaps another EXCUSABLE_COMPENSABLE event on same work area (half-open; adjacency allowed)" }
  - { id: ERR_DELIVERY_WINDOW_OVERLAP, http: 409, condition: "Scheduled delivery window collides within zone buffer_minutes (closed intervals + buffer)" }
  # referential
  - { id: ERR_WORK_AREA_CLOSED, http: 409, condition: "New child entry references a CLOSED work area" }
  - { id: ERR_DELIVERY_ZONE_CLOSED, http: 409, condition: "New delivery references a CLOSED zone" }
  - { id: ERR_MEDIA_REPORT_MISMATCH, http: 422, condition: "Linked media/incident/delivery belongs to a different report" }
  - { id: ERR_WEATHER_MISSING, http: 409, condition: "submit without any WeatherObservation" }
  - { id: ERR_NO_WORK_RECORDED, http: 409, condition: "submit with zero ACTIVE crew entries and no_work_performed == false" }
  - { id: ERR_WORK_ENTRIES_CONFLICT, http: 409, condition: "submit with no_work_performed == true but ACTIVE crew entries exist" }
  - { id: ERR_DELIVERY_NOT_INSPECTED, http: 409, condition: "submit while a delivery is DELIVERED or PARTIAL" }
  - { id: ERR_DELAY_EVENT_UNCLASSIFIED, http: 409, condition: "submit while a delay event is RECORDED" }
  - { id: ERR_REPORT_NOT_APPROVED, http: 409, condition: "distribution create on a report not in {APPROVED, LOCKED}" }
  - { id: ERR_DISTRIBUTION_HOLD, http: 409, condition: "distribution create/send while report distribution_hold is true" }
  - { id: ERR_DISTRIBUTION_ALREADY_SENT, http: 409, condition: "delete of a SENT or ACKNOWLEDGED distribution record" }
  - { id: ERR_DELAY_FINALIZE_REQUIRES_SUBMITTED_REPORT, http: 409, condition: "finalize while report in DRAFT/REVISION_REQUESTED" }
  - { id: ERR_DELAY_LOCKED_REPORT, http: 409, condition: "classify while report APPROVED/LOCKED" }
  - { id: ERR_PROJECT_HAS_OPEN_REPORTS, http: 409, condition: "project close with any report not LOCKED" }
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "report submit while project not ACTIVE" }
  - { id: ERR_TICKET_REPORT_NOT_SUBMITTED, http: 409, condition: "T&M approve while report in DRAFT/REVISION_REQUESTED" }
  # fiscal
  - { id: ERR_TM_CEILING_EXCEEDED, http: 422, condition: "approve with total_cents > authorized_ceiling_cents" }

# =============================================================================
# Table 7: RBAC Matrix (all roles opaque; X-User-ID is a free-form operator id
# compared by segregation-of-duties rules)
# =============================================================================
roles:
  - name: SystemAdmin
    description: "GC platform administrator: project setup, areas, zones, budget lines, clock, report lock, distribution dispatch"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /projects and all /projects/{id}/activate|suspend|resume|close"
      - "POST /work-areas, /work-areas/{id}/close|reopen"
      - "POST /delivery-zones, /delivery-zones/{id}/close|reopen"
      - "POST /work-items"
      - "POST /daily-reports/{id}/lock"
      - "POST /distribution-records/{id}/send"
    shared_operations: ["all GET endpoints"]
  - name: Superintendent
    description: "Jobsite superintendent: owns daily report content — reports, crew/equipment/weather/delay/media/delivery/quantity/T&M entry"
    identity: opaque
    exclusive_operations:
      - "POST /daily-reports, PUT /daily-reports/{id}"
      - "POST /daily-reports/{id}/submit|return-to-draft|recall"
      - "POST /crew-entries, /equipment-entries, /weather-observations, /delay-events"
      - "POST /crew-entries/{id}/void, /equipment-entries/{id}/void, /quantity-entries/{id}/void"
      - "POST /deliveries, /deliveries/{id}/inspect, /deliveries/{id}/resolve-recount"
      - "POST /quantity-entries"
      - "POST /tm-tickets, PUT /tm-tickets/{id}, /tm-tickets/{id}/submit-for-signature|revise|void"
    shared_operations: ["POST /media-attachments, /media-attachments/{id}/purge (with SafetyOfficer)", "all GET endpoints"]
  - name: ProjectManager
    description: "GC project manager: report review/approval, delay classification, T&M approval, distribution setup"
    identity: opaque
    exclusive_operations:
      - "POST /daily-reports/{id}/start-review|approve|request-revision|reopen"
      - "POST /delay-events/{id}/classify|finalize"
      - "POST /tm-tickets/{id}/approve|reject"
      - "POST /distribution-records, DELETE /distribution-records/{id}"
    shared_operations: ["all GET endpoints"]
  - name: SafetyOfficer
    description: "Safety officer: observations, incidents, OSHA notification"
    identity: opaque
    exclusive_operations:
      - "POST /safety-observations, /safety-observations/{id}/mitigate|verify-close|reopen|escalate"
      - "POST /incidents, /incidents/{id}/begin-investigation|notify-osha|close"
    shared_operations: ["POST /media-attachments, /media-attachments/{id}/purge (with Superintendent)", "all GET endpoints"]
  - name: ContractorRep
    description: "Subcontractor representative: contractor-side T&M signature"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /tm-tickets/{id}/sign with signer_role=CONTRACTOR (with OwnerRep for OWNER)", "all GET endpoints"]
  - name: OwnerRep
    description: "Owner representative: owner-side T&M signature, delay disputes, distribution acknowledgement"
    identity: opaque
    exclusive_operations:
      - "POST /delay-events/{id}/dispute"
      - "POST /distribution-records/{id}/acknowledge"
    shared_operations: ["POST /tm-tickets/{id}/sign with signer_role=OWNER (with ContractorRep for CONTRACTOR)", "all GET endpoints"]
