          trigger:
            - call: "GET /work-orders/${wo_id}/cost-summary"
              payload: {}
              as: ProductionPlanner
              captures: { labor: $.data.labor_total_cents }
          assert:
            - "cost_summary.labor_total_cents == 63"

      - name: bom_standard_cost_excluded
        claim_type: Correct Result
        grounds: [calculations.bom_explosion_standard_cost]
        excluded_because:
          difficulty_instance: combinatorial_formula / bom_standard_round_per_component_then_sum
          rationale: "BOM standard cost round-per-component-then-sum is asserted by the named §1.8 instance."

