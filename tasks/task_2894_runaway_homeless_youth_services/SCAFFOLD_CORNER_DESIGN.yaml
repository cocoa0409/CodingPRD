        distinguishing_aspect: "Three distinct fiscal guards fire on one ledger: a 2000-cent withdrawal against a 1250-cent balance is ERR_SAVINGS_INSUFFICIENT_BALANCE, a 1500-cent reversal against 1000 cents of deposits is ERR_SAVINGS_REVERSAL_UNMATCHED (the match component is not reversible cash), and once a review writes PROBATION even an affordable 500-cent withdrawal is ERR_SAVINGS_WITHDRAWAL_BLOCKED."
