                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
            - call: "POST /api/production-lines"
              payload: { name: "L1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /api/material-lots"
              payload: { raw_material_id: "${rm_id}", supplier_name: "SuppCo", supplier_coa_ref: "COA-1", qty_received: 20000000 }
              as: ProductionOperator
              captures: { lot_id: $.data.id }
            - call: "POST /api/material-lots/${lot_id}/identity-tests"
              payload: { result: "PASS", coa_match: true }
              as: QAChemist
              as_user_id: "chem-1"
              captures: { it_id: $.data.id }
            - call: "POST /api/identity-tests/${it_id}/coa-review"
              payload: { review_outcome: "APPROVE" }
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/manufacturing-orders"
