      - name: cancel_accepted_order_releases_hold
        claim_type: Compensation
        grounds:
          - state_machines.DeliveryOrder.ACCEPTED_to_CANCELLED
        distinguishing_aspect: "Cancelling an ACCEPTED order is the compensating action for the accept hold: billing VOIDED and merchant balance restored by exactly quoted_fee_cents; cancelling a QUOTED order never touches the balance (no hold existed) — conditional compensation."
        test_recipe:
          setup:
            - "Base chain through o1 ACCEPTED (balance 99500) and o2 still QUOTED."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_quote1
            - *c_order1
            - *c_accept
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "11 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q2}", customer_reference: "CO-2", idempotency_key: "co-2" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${o1}/cancel"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o2}/cancel"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
