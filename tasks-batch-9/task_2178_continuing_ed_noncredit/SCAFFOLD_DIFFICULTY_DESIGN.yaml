  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: instructor_half_open_windows_allow_adjacency_reject_intersection
        grounds:
          - validations[priority=17]
          - state_machines.InstructorContract.OFFERED_to_SIGNED
          - errors[ERR_INSTRUCTOR_SCHEDULE_CONFLICT]
          - entities.Instructor.fields.active_contract_count
        distinguishing_aspect: |
          Resource entity Instructor, HALF-OPEN pairwise interval semantics: teaching
          windows are compared as [start_date, end_date), so a contract running
          2026-11-15 to 2027-01-15 may be signed alongside one running 2026-09-15 to
          2026-11-15 (they merely touch), while a third running 2026-10-01 to
          2026-12-01 genuinely intersects and is rejected. Rejection is pairwise -
          no capacity is aggregated.
        test_recipe:
          setup:
            - "Three DRAFT TERM offerings on EXT-101: FALL 2026-09-15 to 2026-11-15, WINTER 2026-11-15 to 2027-01-15, LAB 2026-10-01 to 2026-12-01."
            - "One SENIOR instructor holds three OFFERED contracts, one per offering."
            - "The FALL contract has already been signed, so the instructor has one SIGNED window [2026-09-15, 2026-11-15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_fall_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026WI", start_date: "2026-11-15T00:00:00Z", end_date: "2027-01-15T00:00:00Z", census_at: "2026-11-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_winter_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FB", start_date: "2026-10-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z", census_at: "2026-09-20T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_lab_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_fall_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_fall_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_winter_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_winter_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_lab_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
