  - section: cross_cutting_layers
    instances:
      - name: occ_jurisdiction_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[jurisdiction-update-stale-version]", "endpoints.PATCH /licensure/jurisdictions/{id}"]
        distinguishing_aspect: "PATCH with the version observed at creation (1) succeeds and bumps version to 2; replaying the same expected version is then rejected ERR_STALE_VERSION (412) while the current version succeeds."
        test_recipe:
          setup: ["jurisdiction J1 created (version 1)"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator, captures: { j1_id: $.data.id, j1_v: $.data.version } }
            - { call: "PATCH /licensure/jurisdictions/${j1_id}", payload: { expected_jurisdiction_version: "${j1_v}", min_total_experience_hours: 3800 }, as: NcarbAdministrator, captures: { j1_v2: $.data.version } }
          trigger:
            - { call: "PATCH /licensure/jurisdictions/${j1_id}", payload: { expected_jurisdiction_version: "${j1_v}", min_total_experience_hours: 3900 }, as: NcarbAdministrator, captures: { err: $.data.error_id } }
            - { call: "PATCH /licensure/jurisdictions/${j1_id}", payload: { expected_jurisdiction_version: "${j1_v2}", min_total_experience_hours: 3900 }, as: NcarbAdministrator }
          assert:
            - "first PATCH succeeded and returned version 2 (j1_v2 == 2)"
            - "stale replay with old version: err == ERR_STALE_VERSION (412); min_total_experience_hours stays 3800"
            - "retry with current version 2 succeeds: min_total_experience_hours == 3900, version == 3"
      - name: occ_supervisor_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[supervisor-update-stale-version]", "endpoints.PATCH /licensure/supervisors/{id}"]
        distinguishing_aspect: "Same OCC shape on a different parent entity: two sequential supervisor updates carrying the creation version - the first wins, the second is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["supervisor S created (version 1)"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "PATCH /licensure/supervisors/${sup_id}", payload: { expected_supervisor_version: "${sup_v}", full_name: "Sup One Sr" }, as: NcarbAdministrator }
          trigger:
            - { call: "PATCH /licensure/supervisors/${sup_id}", payload: { expected_supervisor_version: "${sup_v}", license_status: "INACTIVE" }, as: NcarbAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412); Supervisor.license_status stays ACTIVE and full_name stays Sup One Sr"
