          setup:
            - "The TX rule (27.000 L, ROLLING_12_MONTHS) and the NM rule (9.000 L, ROLLING_30_DAYS) both exist. Clock 2026-08-01."
            - "Consumer Ada is ID-verified; a second consumer Ben also exists."
            - "Five manual adjustments are on the ledger: Ada/TX 20.000 L at 2025-07-31T23:59:59Z, Ada/TX 3.000 L at 2025-08-01T00:00:00Z, Ada/TX 1.250 L at 2026-07-15, Ada/NM 5.000 L at 2026-07-20, and Ben/TX 8.000 L at 2026-07-15."
