  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_withdrawn_unpaid_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=28]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): confirming a WITHDRAWN and UNPAID
          registration violates both the lifecycle machine (priority 4) and the
          payment gate (priority 28); the state error ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Race REGISTRATION_OPEN; registration V1 REGISTERED/UNPAID then withdrawn (still UNPAID)"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Priority 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "111", participant_name: "V One", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_v1: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_v1}/withdraw", as: RegistrationClerk }
          trigger:
            - { call: "POST /race-timing/registrations/${reg_v1}/confirm", as: RegistrationClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 4) — not ERR_PAYMENT_REQUIRED (business_fiscal, priority 28)"
            - "Registration(reg_v1).lifecycle_status == WITHDRAWN and payment_status == UNPAID (unchanged)"

      - name: wave_create_spacing_beats_index_taken
        grounds:
          - validations[priority=10]
          - validations[priority=15]
        distinguishing_aspect: |
          Pair (business_temporal vs business_constraint): a wave create that
          both reuses wave_index 1 and sits 5 minutes from the existing wave
          fails on spacing (priority 10) before the uniqueness check
          (priority 15) — ERR_WAVE_SPACING_VIOLATION, not ERR_WAVE_INDEX_TAKEN.
        test_recipe:
          setup:
            - "Race with wave index 1 scheduled 2026-08-01T07:00:00Z"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Wave Prio 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
          trigger:
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:05:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WAVE_SPACING_VIOLATION (temporal, priority 10) — not ERR_WAVE_INDEX_TAKEN (constraint, priority 15)"

