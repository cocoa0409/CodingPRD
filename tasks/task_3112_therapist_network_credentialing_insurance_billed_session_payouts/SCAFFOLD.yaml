# =============================================================================
# PRD Benchmark Scaffold — task_3112
# Therapist Network Credentialing & Insurance-Billed Session Payouts (Headway)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Therapist Network Credentialing & Insurance-Billed Session Payouts (Headway): clinician onboarding with license verification, malpractice coverage and specialty tagging, group credentialing with payers under a delegated arrangement with effective dates gating billable sessions, patient benefit verification and cost-share estimation before the first session, session documentation capture sufficient for claim submission on the clinician's behalf, payout to clinicians on a fixed schedule independent of payer payment timing with reconciliation of denials, rate setting by payer, license type and geography with periodic changes, caseload and availability management driving patient matching, clinician offboarding and continuity of care obligations

domain_name: therapist-network-credentialing-payouts
api_prefix: /network

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga
  entity_count: 14
  state_machine_count: 12
  calculation_count: 14
  validation_layer_count: 8
  endpoint_count: 78
  error_code_count: 37
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Clinician legal name" }
      - { name: license_type, type: enum, source: input, description: "LCSW | LMFT | LPC | LMHC | PSY_D | PHD; drives rate resolution" }
      - { name: primary_state, type: string, source: input, description: "Two-letter geography anchor; drives rate resolution" }
      - { name: specialty_tags, type: array, source: input, description: "Specialty tags; drives patient matching eligibility" }
      - { name: weekly_caseload_target, type: integer, source: input, description: "Maximum number of assigned patients carried at one time", constraints: "must be >= 1" }
      - { name: availability_blocks, type: array, source: input, description: "Array of {weekday: 0-6 with 0=Sunday..6=Saturday in UTC, start_minute: 0-1439, end_minute: 1-1440} expressed in minutes since 00:00 UTC" }
      - { name: onboarded_at, type: datetime, source: system, description: "Set at creation from the logical clock; anchors the new-clinician differential" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | CREDENTIALING | ACTIVE | SUSPENDED | OFFBOARDING | OFFBOARDED" }
      - { name: billing_posture, type: computed, description: "BILLABLE | GATED | FROZEN; derived aggregate that gates every billable session operation" }
      - { name: active_patient_count, type: computed, description: "Count of PatientClient rows whose matched_clinician_id is this clinician and whose match is not released" }
      - { name: open_slot_count, type: computed, description: "Availability-block minutes remaining after subtracting the scheduled length of every Session of this clinician with slot_consumed == true" }
      - { name: enrolled_payer_count, type: computed, description: "Count of PayerEnrollment rows in EFFECTIVE status" }
      - { name: payout_balance_cents, type: computed, description: "Earned minus paid plus clawed back, over all PayoutLine rows" }
      - { name: offboarding_requested_on, type: datetime, source: computed, description: "Logical clock instant of the OFFBOARDING transition; null before" }
      - { name: continuity_plan_count, type: computed, description: "Count of ContinuityPlan rows not in COMPLETED status" }
      - { name: cash_basis_opt_in, type: boolean, source: input, description: "When true the clinician is paid on the cash-basis payout variant regardless of batch schedule", default: false }
      - { name: pending_clawback_residual_cents, type: integer, source: computed, description: "Shortfall carried forward when a clawback exceeded a PENDING line's gross and the line net was floored at zero; a positive magnitude, subtracted from the next batch's adjustment", default: 0 }

  - name: License
    parent: Clinician
    common_fields: true
    fields:
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; the credentialing clinician" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: license_type, type: enum, source: input, description: "LCSW | LMFT | LPC | LMHC | PSY_D | PHD" }
      - { name: issuing_state, type: string, source: input, description: "Two-letter issuing state" }
      - { name: expires_on, type: datetime, source: input, description: "License expiry instant" }
      - { name: telehealth_eligible, type: boolean, source: input, description: "Whether the license permits telehealth into the primary_state" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | EXPIRED | FAILED" }
      - { name: verified_at, type: datetime, source: computed, description: "Logical clock instant of the most recent successful verification" }
      - { name: verified_by_user_id, type: string, source: computed, description: "X-User-ID of the verifying ComplianceOfficer; null until VERIFIED" }
      - { name: verification_attempts, type: integer, source: computed, description: "Count of verify calls, successful or failed" }

  - name: MalpracticePolicy
    parent: Clinician
    common_fields: true
    fields:
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; the covered clinician" }
      - { name: carrier_name, type: string, source: input, description: "Carrier legal name" }
      - { name: coverage_cents, type: integer, source: input, description: "Per-occurrence coverage limit" }
      - { name: effective_on, type: datetime, source: input, description: "Coverage start instant" }
      - { name: expires_on, type: datetime, source: input, description: "Coverage end instant" }
      - { name: tail_coverage, type: boolean, source: input, description: "Whether a reporting-endorsement tail is in force" }
      - { name: policy_status, type: computed, description: "PENDING | ACTIVE | LAPSED, derived on read from the logical clock against effective_on / expires_on" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: payer_name, type: string, source: input, description: "Payer legal name" }
      - { name: payer_code, type: string, source: input, description: "Unique payer code", constraints: "unique across Payers" }
      - { name: delegated_credentialing, type: boolean, source: input, description: "Whether the payer delegates group credentialing to the network" }
      - { name: min_malpractice_coverage_cents, type: integer, source: input, description: "Minimum per-occurrence coverage required to bill this payer" }
      - { name: timely_filing_days, type: integer, source: input, description: "Days from session date within which a claim must be submitted", constraints: "must be >= 1" }
      - { name: credentialing_sla_days, type: integer, source: input, description: "Days from enrollment submission to the payer's credentialing decision" }
      - { name: allowed_cpt_codes, type: array, source: input, description: "CPT codes this payer reimburses; a claim whose cpt_code is absent is a business_referential failure" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED_AT_PAYER | TERMINATED" }

  - name: PayerEnrollment
    parent: Clinician
    common_fields: true
    fields:
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; the enrolled clinician" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; the payer this enrollment is with" }
      - { name: delegated, type: boolean, source: input, description: "Whether the enrollment rides the payer's delegated arrangement with the network" }
      - { name: effective_from, type: datetime, source: input, description: "First instant at which sessions on this payer are billable" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the billable window; null means open-ended", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | EFFECTIVE | SUSPENDED | TERMINATED | REJECTED" }
      - { name: effective_window_days, type: integer, source: computed, description: "Whole days between effective_from and effective_to; null when open-ended" }
      - { name: rate_set_version_pinned, type: integer, source: computed, description: "The highest PayerRate.rate_set_version for (payer, clinician.license_type, clinician.primary_state) whose window covers effective_from; null when no such row exists" }

  - name: PayerRate
    parent: Payer
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; the payer this rate schedule belongs to" }
      - { name: rate_set_version, type: integer, source: input, description: "Monotonic rate-schedule version; higher wins on overlap" }
      - { name: license_type, type: enum, source: input, description: "LCSW | LMFT | LPC | LMHC | PSY_D | PHD" }
      - { name: geography, type: string, source: input, description: "Two-letter state the rate applies to" }
      - { name: cpt_code, type: string, source: input, description: "Billed service code" }
      - { name: rate_cents, type: integer, source: input, description: "Contract rate for one unit of this cpt_code" }
      - { name: effective_from, type: datetime, source: input, description: "Rate validity start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Rate validity end, exclusive; null means open-ended", default: null }

  - name: PatientClient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: member_id, type: string, source: input, description: "Payer-issued member identifier", constraints: "unique within payer_id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; the patient's insurance payer" }
      - { name: plan_code, type: string, source: input, description: "Plan product code" }
      - { name: state_code, type: string, source: input, description: "Two-letter residence state; drives matching geography" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible" }
      - { name: coinsurance_rate, type: number, source: input, description: "Plan coinsurance fraction applied after deductible", constraints: "0.0 <= rate <= 1.0" }
      - { name: oop_max_cents, type: integer, source: input, description: "Annual out-of-pocket maximum" }
      - { name: oop_met_cents, type: integer, source: computed, description: "Accumulated patient responsibility consumed this plan year", default: 0 }
      - { name: benefit_status, type: computed, description: "UNVERIFIED | VERIFIED | STALE, derived from the newest BenefitVerification row" }
      - { name: matched_clinician_id, type: string, source: computed, description: "Clinician id produced by the last match run; null when unmatched" }
      - { name: swap_requested, type: boolean, source: system, description: "Set true when a ContinuityPlan for this patient escalates; cleared when the plan returns to PENDING" }
      - { name: visit_count_year, type: integer, source: computed, description: "Count of Sessions on this patient in COMPLETED status this plan year" }

  - name: BenefitVerification
    parent: PatientClient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> PatientClient.id; the verified patient" }
      - { name: payer_id, type: string, source: computed, description: "Payer id inherited from the patient at verification time" }
      - { name: deductible_remaining_cents, type: integer, source: input, description: "Deductible dollars still owed at the verification instant" }
      - { name: coinsurance_rate, type: number, source: input, description: "Coinsurance fraction confirmed by the payer" }
      - { name: copay_cents, type: integer, source: input, description: "Flat copay for the service" }
      - { name: oop_remaining_cents, type: integer, source: input, description: "Out-of-pocket dollars remaining at the verification instant" }
      - { name: status, type: enum, source: system, description: "VERIFIED | STALE | FAILED" }
      - { name: verified_at, type: datetime, source: computed, description: "Logical clock instant of the verification" }
      - { name: quoted_cost_share_cents, type: computed, description: "Provisional per-session patient cost share quoted from this snapshot" }

  - name: Session
    parent: Clinician
    common_fields: true
    fields:
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; the treating clinician and the scheduling resource" }
      - { name: patient_id, type: string, source: system, description: "FK -> PatientClient.id; the treated patient and the second scheduling resource" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start instant" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end instant" }
      - { name: cpt_code, type: string, source: input, description: "Billed service code" }
      - { name: modality, type: enum, source: input, description: "VIDEO | PHONE | IN_PERSON" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: billing_state, type: enum, source: computed, description: "UNBILLED | CLAIM_SUBMITTED | PAYER_PAID | DENIED | WRITTEN_OFF; second independent state axis on the same row" }
      - { name: quoted_cost_share_cents, type: integer, source: computed, description: "Patient cost share quoted at booking from the patient's newest VERIFIED BenefitVerification" }
      - { name: slot_consumed, type: boolean, source: computed, description: "True while the session occupies one clinician availability slot" }
      - { name: claim_id, type: string, source: computed, description: "Id of the newest Claim on this session; null until one is created" }

  - name: SessionNote
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id; the documented session" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10 diagnosis code" }
      - { name: duration_minutes, type: integer, source: input, description: "Documented session length; must match the scheduled length for claim eligibility", constraints: "must be >= 1" }
      - { name: cpt_code, type: string, source: input, description: "Billed service code recorded on the note" }
      - { name: narrative, type: string, source: input, description: "Clinical narrative" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | LOCKED" }
      - { name: signed_at, type: datetime, source: computed, description: "Logical clock instant of the signing transition" }
      - { name: signer_clinician_id, type: string, source: computed, description: "Clinician id whose X-User-ID signed the note" }
      - { name: note_version, type: integer, source: computed, description: "Supersession counter within the session, starts at 1" }

  - name: Claim
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id; the billed session" }
      - { name: payer_id, type: string, source: computed, description: "Payer id inherited from the patient at submission time" }
      - { name: clinician_id, type: string, source: computed, description: "Clinician id inherited from the session at submission time" }
      - { name: submitted_on, type: datetime, source: computed, description: "Logical clock instant of submission" }
      - { name: billed_cents, type: integer, source: computed, description: "Amount billed, from the resolved PayerRate for the service date" }
      - { name: allowed_cents, type: integer, source: computed, description: "Payer-allowed amount, set at adjudication" }
      - { name: patient_resp_cents, type: integer, source: computed, description: "Final patient responsibility, set at adjudication from the final_adjudicated variant", default: 0 }
      - { name: payer_paid_cents, type: integer, source: computed, description: "Amount the payer remits, set at adjudication as max(0, allowed_cents - patient_resp_cents)", default: 0 }
      - { name: claim_status, type: enum, source: system, description: "DRAFT | SUBMITTED | PAID | DENIED | REPROCESSING | WRITTEN_OFF" }
      - { name: denial_code, type: enum, source: computed, description: "null | TIMELY_FILING | NOT_COVERED | MISSING_DOCUMENTATION | AUTHORIZATION_REQUIRED | DUPLICATE" }
      - { name: recovery_deadline, type: datetime, source: computed, description: "Last instant at which a DENIED claim may be resubmitted" }
      - { name: resubmission_count, type: integer, source: computed, description: "Count of successful REPROCESSING -> SUBMITTED cycles" }
      - { name: assigned_payout_line_id, type: string, source: computed, description: "Id of the PayoutLine that carries this claim's earnings; null until assigned" }

  - name: PayoutBatch
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the payout period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the payout period" }
      - { name: schedule, type: enum, source: input, description: "WEEKLY | BIWEEKLY | SEMIMONTHLY" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | PAID | RECONCILED | SKIPPED" }
      - { name: total_gross_cents, type: computed, description: "Sum of gross_cents over all non-VOIDED lines" }
      - { name: total_adjustment_cents, type: computed, description: "Signed sum of adjustment_cents over all non-VOIDED lines" }
      - { name: total_net_cents, type: computed, description: "Sum of net_cents over all non-VOIDED lines" }
      - { name: line_count, type: computed, description: "Count of non-VOIDED lines" }
      - { name: created_by_user_id, type: string, source: computed, description: "X-User-ID that opened the batch" }
      - { name: supersedes_batch_id, type: string, source: computed, description: "Id of the OPEN batch that overlapped this period and was transitioned to SKIPPED" }

  - name: PayoutLine
    parent: PayoutBatch
    common_fields: true
    fields:
      - { name: payout_batch_id, type: string, source: system, description: "FK -> PayoutBatch.id; the batch this line pays out in" }
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; the paid clinician" }
      - { name: session_ids, type: array, source: computed, description: "Sessions whose earnings this line carries" }
      - { name: claim_ids, type: array, source: computed, description: "Claims whose earnings this line carries" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of per-session resolved rates, rounded per line" }
      - { name: adjustment_cents, type: integer, source: computed, description: "Signed clawback or recovery adjustment" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents + adjustment_cents, floored at zero only for PENDING lines" }
      - { name: line_status, type: enum, source: system, description: "PENDING | PAID | CLAWED_BACK | VOIDED; a PAID line whose adjustment_cents falls below zero becomes CLAWED_BACK, while a PENDING line keeps its status with its net floored at zero" }
      - { name: basis, type: computed, description: "SCHEDULED | CASH_BASIS; which payout variant produced this line" }
      - { name: rate_set_version_used, type: integer, source: computed, description: "PayerRate.rate_set_version resolved for the newest included session" }

  - name: ContinuityPlan
    parent: Clinician
    common_fields: true
    fields:
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; the departing clinician" }
      - { name: patient_id, type: string, source: system, description: "FK -> PatientClient.id; the patient requiring continuity" }
      - { name: successor_clinician_id, type: string, source: input, description: "Proposed receiving clinician for this patient" }
      - { name: reassignment_deadline, type: datetime, source: computed, description: "Departure instant plus the continuity grace window; DENY or unassigned past it escalates" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | ESCALATED | COMPLETED" }
      - { name: reason, type: enum, source: input, description: "OFFBOARDING | CASELOAD_REBALANCE | CLINICAL_CONFLICT" }

# =============================================================================
# §1.2 State Machine Table (11 machines; four are non-linear)
# =============================================================================
state_machines:
  # --- CLINICIAN.billing_posture : posture_driven, gates all billable operations
  - entity: Clinician
    field: billing_posture
    initial_state: GATED
    terminal_states: []
    note: |
      Posture is derived from child rows and from Clinician.status; it is never
      client-supplied. It is the single gate consulted by every billable session
      operation. Evaluation order is fixed: FROZEN overrides GATED, GATED
      overrides BILLABLE.
    transitions:
      - from: GATED
        to: BILLABLE
        trigger: "system (License.verification_status becomes VERIFIED)"
        actor: system
        preconditions:
          - "Evaluating clinician has at least one License row with verification_status == VERIFIED"
          - "Evaluating clinician has at least one MalpracticePolicy row whose policy_status is ACTIVE at the logical clock"
          - "Evaluating clinician.enrolled_payer_count >= 1"
      - from: BILLABLE
        to: GATED
        trigger: "system (malpractice policy lapses, or all licenses expire, or enrolled_payer_count drops to 0)"
        actor: system
        preconditions:
          - "At least one of: every License row for this clinician is EXPIRED; every MalpracticePolicy row reads policy_status != ACTIVE; enrolled_payer_count == 0"
        side_effects:
          - "Sessions already in COMPLETED status keep their billing_state; new claim submissions are rejected with ERR_CLINICIAN_NOT_BILLABLE"
      - from: [GATED, BILLABLE]
        to: FROZEN
        trigger: "system (Clinician.status becomes SUSPENDED or OFFBOARDED, or enrolled_payer_count drops to 0)"
        actor: system
        preconditions:
          - "Clinician.status IN {SUSPENDED, OFFBOARDED} OR enrolled_payer_count == 0"
        side_effects:
          - "Every Session of this clinician in status IN {REQUESTED, SCHEDULED} transitions to CANCELLED"
          - "Each such Session sets slot_consumed = false and re-derives its clinician open_slot_count"
          - "PatientClient.matched_clinician_id of every patient matched to this clinician is left unchanged; only the match run can clear it"
      - from: FROZEN
        to: GATED
        trigger: "system (Clinician.status returns to ACTIVE and enrolled_payer_count >= 1)"
        actor: system
        preconditions:
          - "Clinician.status == ACTIVE"
          - "enrolled_payer_count >= 1"
          - "At least one License row with verification_status == VERIFIED"
      - from: FROZEN
        to: BILLABLE
        trigger: "system (Clinician.status returns to ACTIVE with a live malpractice policy)"
        actor: system
        preconditions:
          - "Clinician.status == ACTIVE"
          - "At least one MalpracticePolicy row whose policy_status is ACTIVE"
          - "enrolled_payer_count >= 1"

  # --- CLINICIAN.status : cyclic (OFFBOARDING can be reverted)
  - entity: Clinician
    field: status
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: CREDENTIALING
        trigger: "POST /network/clinicians/{id}/submit-credentials"
        actor: ComplianceOfficer
        preconditions:
          - "At least one License row exists for this clinician"
          - "At least one MalpracticePolicy row exists for this clinician"
        side_effects:
          - "billing_posture re-evaluated (stays GATED)"
      - from: [ONBOARDING, CREDENTIALING]
        to: CREDENTIALING
        trigger: "POST /network/clinicians/{id}/licenses/{license_id}/reverify"
        actor: ComplianceOfficer
        preconditions:
          - "License row exists and belongs to this clinician"
        side_effects:
          - "License.verification_attempts increments by 1"
          - "On a successful re-verification: License.verification_status = VERIFIED, verified_at = logical clock, verified_by_user_id = acting X-User-ID"
          - "billing_posture re-evaluated below in declared order"
      - from: CREDENTIALING
        to: ACTIVE
        trigger: "system (billing_posture becomes BILLABLE)"
        actor: system
        preconditions:
          - "billing_posture == BILLABLE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/clinicians/{id}/suspend"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "billing_posture → FROZEN"
          - "Every Session IN {REQUESTED, SCHEDULED} of this clinician → CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/clinicians/{id}/reinstate"
        actor: OpsAdmin
        preconditions:
          - "At least one License row with verification_status == VERIFIED"
          - "enrolled_payer_count >= 1"
        side_effects:
          - "billing_posture re-evaluated: FROZEN → BILLABLE when a MalpracticePolicy row reads ACTIVE, else FROZEN → GATED"
      - from: ACTIVE
        to: OFFBOARDING
        trigger: "POST /network/clinicians/{id}/request-offboarding"
        actor: OpsAdmin
        preconditions:
          - "open_slot_count == 0"
          - "active_patient_count >= 1"
        side_effects:
          - "offboarding_requested_on = logical clock"
          - "billing_posture → GATED"
          - "One ContinuityPlan row is created per PatientClient whose matched_clinician_id is this clinician, in status PENDING with reason OFFBOARDING and successor_clinician_id null"
          - "continuity_plan_count re-derived"
      - from: OFFBOARDING
        to: ACTIVE
        trigger: "POST /network/clinicians/{id}/cancel-offboarding"
        actor: OpsAdmin
        preconditions:
          - "Every ContinuityPlan for this clinician is in status IN {PENDING, COMPLETED}"
        side_effects:
          - "offboarding_requested_on = null"
          - "continuity_plan_count recomputed"
          - "billing_posture re-evaluated: BILLABLE when a MalpracticePolicy row reads ACTIVE and enrolled_payer_count >= 1, else GATED"
      - from: OFFBOARDING
        to: OFFBOARDED
        trigger: "system (active_patient_count reaches 0), or POST /network/clinicians/{id}/complete-offboarding"
        actor: "OpsAdmin or system"
        preconditions:
          - "active_patient_count == 0"
        side_effects:
          - "billing_posture → FROZEN"
          - "Every ContinuityPlan for this clinician in status PENDING → ESCALATED"
          - "Every Session IN {REQUESTED, SCHEDULED} of this clinician → CANCELLED"
          - "Each ContinuityPlan that became ESCALATED sets PatientClient.swap_requested = true for its patient"

  # --- LICENSE.verification_status : cyclic (EXPIRED ↔ VERIFIED, FAILED → UNVERIFIED)
  - entity: License
    field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /network/clinicians/{id}/licenses/{license_id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "License.expires_on is strictly after the logical clock"
        side_effects:
          - "verified_at = logical clock"
          - "verified_by_user_id = acting X-User-ID"
          - "verification_attempts increments by 1"
          - "Owning clinician billing_posture re-evaluated (GATED → BILLABLE when malpractice is ACTIVE and enrolled_payer_count >= 1)"
      - from: UNVERIFIED
        to: FAILED
        trigger: "POST /network/clinicians/{id}/licenses/{license_id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "License.expires_on is at or before the logical clock"
        side_effects:
          - "verification_attempts increments by 1"
          - "Owning clinician billing_posture re-evaluated"
      - from: FAILED
        to: UNVERIFIED
        trigger: "POST /network/clinicians/{id}/licenses/{license_id}/reset-verification"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "verification_attempts is left unchanged"
          - "verified_at = null"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (logical clock reaches License.expires_on)"
        actor: system
        preconditions:
          - "logical clock >= License.expires_on"
        side_effects:
          - "Owning clinician billing_posture re-evaluated; the clinician drops to GATED when no other License row reads VERIFIED"
          - "Every PayerEnrollment for the owning clinician whose payer requires this license_type is re-evaluated"
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /network/clinicians/{id}/licenses/{license_id}/reverify"
        actor: ComplianceOfficer
        preconditions:
          - "A new expiry instant strictly after the logical clock has been accepted with the re-verification"
        side_effects:
          - "verified_at = logical clock"
          - "verified_by_user_id = acting X-User-ID"
          - "verification_attempts increments by 1"
          - "Owning clinician billing_posture re-evaluated"

  # --- PAYER.status : linear with an explicit revert
  - entity: Payer
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED_AT_PAYER
        trigger: "PATCH /network/payers/{id} with status=SUSPENDED_AT_PAYER"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Cascade A hop 1: every PayerEnrollment with this payer_id and status EFFECTIVE → SUSPENDED"
          - "Cascade A hop 2: each enrollment that became SUSPENDED re-derives its clinician's enrolled_payer_count and billing_posture; a clinician whose enrolled_payer_count reaches 0 → FROZEN"
          - "Cascade A hop 3: each clinician that became FROZEN has every Session in REQUESTED or SCHEDULED status → CANCELLED with slot_consumed = false"
      - from: SUSPENDED_AT_PAYER
        to: ACTIVE
        trigger: "PATCH /network/payers/{id} with status=ACTIVE"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "PayerEnrollment rows are NOT auto-restored; each enrollment stays SUSPENDED until POST /network/payer-enrollments/{id}/reinstate"
      - from: [ACTIVE, SUSPENDED_AT_PAYER]
        to: TERMINATED
        trigger: "PATCH /network/payers/{id} with status=TERMINATED"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Every PayerEnrollment with this payer_id in status IN {PENDING, EFFECTIVE, SUSPENDED} → TERMINATED"
          - "Every Claim with this payer_id in claim_status SUBMITTED → DENIED with denial_code NOT_COVERED"
          - "Each denied claim appends a clawback adjustment to its clinician's newest PayoutLine; a clinician with no PayoutLine in status IN {PENDING, PAID} gets a new PENDING line with gross_cents = 0; a PENDING line keeps its status with net_cents floored at zero, while a PAID line becomes CLAWED_BACK"

  # --- PAYERENROLLMENT.status : linear with effective-date gating
  - entity: PayerEnrollment
    field: status
    initial_state: PENDING
    terminal_states: [TERMINATED, REJECTED]
    transitions:
      - from: PENDING
        to: EFFECTIVE
        trigger: "POST /network/payer-enrollments/{id}/activate"
        actor: OpsAdmin
        preconditions:
          - "effective_from is at or before the logical clock"
          - "Owning clinician has at least one License row with verification_status == VERIFIED whose issuing_state equals clinician.primary_state"
          - "Payer.status == ACTIVE"
          - "Owning clinician has at least one MalpracticePolicy row with coverage_cents >= payer.min_malpractice_coverage_cents and policy_status == ACTIVE"
        side_effects:
          - "rate_set_version_pinned = the highest PayerRate.rate_set_version for (payer_id, clinician.license_type, clinician.primary_state) effective at effective_from; null when no rate row is effective"
          - "effective_window_days derived from effective_from and effective_to"
          - "Owning clinician enrolled_payer_count increments by 1 and billing_posture re-evaluated"
      - from: PENDING
        to: REJECTED
        trigger: "POST /network/payer-enrollments/{id}/reject"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Terminal; no clinician aggregate changes"
      - from: EFFECTIVE
        to: SUSPENDED
        trigger: "system (owning Payer becomes SUSPENDED_AT_PAYER or TERMINATED), or POST /network/payer-enrollments/{id}/suspend"
        actor: "OpsAdmin or system"
        preconditions: []
        side_effects:
          - "Owning clinician enrolled_payer_count decrements by 1 and billing_posture re-evaluated"
          - "Sessions already in COMPLETED status are unaffected"
      - from: SUSPENDED
        to: EFFECTIVE
        trigger: "POST /network/payer-enrollments/{id}/reinstate"
        actor: OpsAdmin
        preconditions:
          - "Payer.status == ACTIVE"
          - "effective_from is at or before the logical clock"
          - "effective_to is null or strictly after the logical clock"
        side_effects:
          - "Owning clinician enrolled_payer_count increments by 1 and billing_posture re-evaluated"
      - from: [PENDING, EFFECTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /network/payer-enrollments/{id}/terminate"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Owning clinician enrolled_payer_count recomputed and billing_posture re-evaluated"

  # --- SESSION.status : cyclic through CANCELLED
  - entity: Session
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /network/sessions/{id}/schedule"
        actor: "Clinician or OpsAdmin"
        preconditions:
          - "Scheduling clinician's billing_posture IN {BILLABLE, GATED}"
          - "Patient.benefit_status == VERIFIED at the booked instant"
          - "The clinician has a free availability slot covering the interval"
          - "Neither the clinician nor the patient has an overlapping non-terminal Session; sessions on the same clinician must be separated by a 15-minute buffer, so a session starting exactly 15 minutes after another ends is accepted while one starting exactly 14 minutes after is rejected"
        side_effects:
          - "slot_consumed = true"
          - "quoted_cost_share_cents set from the patient's newest VERIFIED BenefitVerification"
          - "Clinician.open_slot_count and PatientClient.visit_count_year re-derived"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /network/sessions/{id}/complete"
        actor: "Clinician or OpsAdmin"
        preconditions:
          - "patient_id is non-null"
          - "The Session has at least one SessionNote row in status SIGNED"
          - "The newest SessionNote row for this session reads SIGNED; when an older note is SIGNED but a newer row is still DRAFT, the operation is rejected with ERR_NOTE_SUPERSEDED"
          - "Every SessionNote row for this session has duration_minutes equal to the scheduled length in minutes"
          - "The scheduled start instant is not later than the logical clock"
          - "The owning clinician's status is not OFFBOARDED"
        side_effects:
          - "slot_consumed = false"
          - "Cascade B hop 1: the owning clinician's open_slot_count is re-derived and PatientClient.visit_count_year increments by 1"
          - "Cascade B hop 2: when the owning clinician's status IN {OFFBOARDING, OFFBOARDED}, the ContinuityPlan for (clinician_id, patient_id) in status PENDING → ESCALATED"
          - "Cascade B hop 3: an ESCALATED ContinuityPlan sets PatientClient.swap_requested = true for its patient"
          - "The session becomes claim-eligible; no Claim row is created by this transition"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /network/sessions/{id}/reopen"
        actor: OpsAdmin
        preconditions:
          - "Session.billing_state == UNBILLED"
          - "No Claim row exists for this session"
        side_effects:
          - "slot_consumed = true"
          - "Clinician.open_slot_count and PatientClient.visit_count_year re-derived"
          - "SessionNote rows are left in place; the newest SIGNED note blocks a second completion until it is superseded"
      - from: [REQUESTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /network/sessions/{id}/cancel, or system (clinician billing_posture → FROZEN, or session superseded by the (patient_id, scheduled_start) unique rule)"
        actor: "Clinician, OpsAdmin or system"
        preconditions:
          - "Manual cancellation: scheduled_start is strictly after the logical clock"
          - "System cancellation: no manual precondition"
        side_effects:
          - "slot_consumed = false"
          - "Clinician.open_slot_count re-derived"
          - "billing_state stays UNBILLED"
      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /network/sessions/{id}/reschedule"
        actor: "Clinician or OpsAdmin"
        preconditions:
          - "The replacement interval satisfies the same availability and overlap rules as SCHEDULE"
        side_effects:
          - "slot_consumed = true"
          - "quoted_cost_share_cents re-quoted from the patient's newest VERIFIED BenefitVerification"

  # --- SESSION.billing_state : parallel axis, independently guarded by posture
  - entity: Session
    field: billing_state
    initial_state: UNBILLED
    terminal_states: []
    note: "Parallel state dimension: it evolves independently of Session.status on the same row."
    transitions:
      - from: UNBILLED
        to: CLAIM_SUBMITTED
        trigger: "POST /network/claims"
        actor: OpsAdmin
        preconditions:
          - "Session.status == COMPLETED"
          - "Session.clinician billing_posture == BILLABLE at submission instant"
          - "Session has exactly one SessionNote row whose status is SIGNED and which is the newest note for the session; a newer DRAFT note over an older SIGNED one yields ERR_NOTE_SUPERSEDED rather than ERR_DOCUMENTATION_MISSING"
      - from: CLAIM_SUBMITTED
        to: PAYER_PAID
        trigger: "POST /network/claims/{id}/adjudicate with outcome=PAID"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "PatientClient.oop_met_cents increases by the claim's patient_resp_cents, capped at oop_max_cents"
      - from: CLAIM_SUBMITTED
        to: DENIED
        trigger: "POST /network/claims/{id}/adjudicate with outcome=DENIED"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "recovery_deadline = submitted_on + payer.timely_filing_days, exclusive of the deadline instant"
      - from: PAYER_PAID
        to: DENIED
        trigger: "POST /network/claims/{id}/adjudicate with outcome=DENIED (payer take-back)"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "The claim's earning stays on its line as a negative adjustment; nothing is un-paid"

      - from: DENIED
        to: CLAIM_SUBMITTED
        trigger: "POST /network/claims/{id}/resubmit"
        actor: OpsAdmin
        preconditions:
          - "logical clock is strictly before recovery_deadline"
          - "resubmission_count <= 1"
          - "Session.clinician billing_posture == BILLABLE at resubmission instant"
        side_effects:
          - "resubmission_count increments by 1"
          - "claim_status passes through REPROCESSING before returning to SUBMITTED"
      - from: DENIED
        to: WRITTEN_OFF
        trigger: "POST /network/claims/{id}/write-off"
        actor: OpsAdmin
        preconditions:
          - "logical clock is at or after recovery_deadline, OR resubmission_count == 2"
        side_effects:
          - "The claim's earning stays on its assigned PayoutLine as a permanent adjustment_cents delta"
      - from: CLAIM_SUBMITTED
        to: DENIED
        trigger: "system (owning Payer.status → TERMINATED)"
        actor: system
        preconditions:
          - "Payer.status == TERMINATED"
        side_effects:
          - "denial_code = NOT_COVERED"

  # --- SESSIONNOTE.status : cyclic (supersession loop)
  - entity: SessionNote
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /network/sessions/{session_id}/notes/{id}/sign"
        actor: Clinician
        preconditions:
          - "The acting X-User-ID equals Session.clinician_id"
          - "diagnosis_code is non-null"
          - "narrative is non-empty"
          - "duration_minutes is within 45 to 120 minutes inclusive"
        side_effects:
          - "signed_at = logical clock"
          - "signer_clinician_id = acting X-User-ID"
          - "Any earlier SessionNote row for the same session in status SIGNED → LOCKED"
          - "note_version = (highest note_version among all rows for this session) + 1"
      - from: [SIGNED, DRAFT]
        to: LOCKED
        trigger: "system (a newer SessionNote for the same session is signed)"
        actor: system
        preconditions:
          - "A different SessionNote row for the same session exists with a strictly higher note_version and status SIGNED"
        side_effects: []

  # --- CLAIM.claim_status : cyclic (DENIED ↔ SUBMITTED)
  - entity: Claim
    field: claim_status
    initial_state: DRAFT
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "system (immediately after POST /network/claims succeeds)"
        actor: system
        preconditions:
          - "Exactly one SessionNote row for the session reads SIGNED and is the newest for the session"
        side_effects:
          - "submitted_on = logical clock"
          - "billed_cents = resolved PayerRate for the session date; 0 when no rate row resolves"
          - "Session.billing_state → CLAIM_SUBMITTED"
          - "Session.claim_id = this claim's id"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /network/claims/{id}/adjudicate with outcome=PAID"
        actor: OpsAdmin
        preconditions:
          - "allowed_cents >= 0 at adjudication"
        side_effects:
          - "The claim's earning is committed to the clinician's newest PayoutLine"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /network/claims/{id}/adjudicate with outcome=DENIED"
        actor: OpsAdmin
        preconditions:
          - "denial_code is not null"
        side_effects:
          - "recovery_deadline = submitted_on + payer.timely_filing_days"
          - "Session.billing_state → DENIED"
      - from: DENIED
        to: REPROCESSING
        trigger: "POST /network/claims/{id}/resubmit"
        actor: OpsAdmin
        preconditions:
          - "logical clock strictly before recovery_deadline"
          - "resubmission_count <= 1"
        side_effects:
          - "resubmission_count increments by 1"
          - "denial_code cleared to null"
      - from: REPROCESSING
        to: SUBMITTED
        trigger: "POST /network/claims/{id}/decide-reprocessing with outcome=ACCEPTED"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Session.billing_state → CLAIM_SUBMITTED"
          - "submitted_on = logical clock"
      - from: REPROCESSING
        to: DENIED
        trigger: "POST /network/claims/{id}/decide-reprocessing with outcome=REJECTED"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "denial_code = DUPLICATE"
          - "recovery_deadline = submitted_on + payer.timely_filing_days"
      - from: PAID
        to: DENIED
        trigger: "POST /network/claims/{id}/adjudicate with outcome=DENIED (payer take-back after remittance)"
        actor: OpsAdmin
        preconditions:
          - "denial_code is not null"
        side_effects:
          - "denial_code records the take-back reason"
          - "recovery_deadline = submitted_on + payer.timely_filing_days"
          - "Session.billing_state → DENIED"
          - "denial_clawback_adjustment_cents applies to the line already carrying the earning: its adjustment_cents decreases by the session's resolved rate; a PENDING line keeps its status with net_cents floored at zero, while a PAID line becomes CLAWED_BACK"
          - "a line already PAID when the take-back lands keeps its gross_cents and shows the reversal as a negative adjustment rather than a rewritten gross"

      - from: [SUBMITTED, DENIED]
        to: WRITTEN_OFF
        trigger: "POST /network/claims/{id}/write-off"
        actor: OpsAdmin
        preconditions:
          - "logical clock at or after recovery_deadline, OR resubmission_count == 2"
        side_effects:
          - "Session.billing_state → WRITTEN_OFF"
          - "The clinician's newest PayoutLine receives a negative adjustment_cents delta equal to the claim's committed earning"

  # --- PAYOUTBATCH.status : linear with an explicit retire path
  - entity: PayoutBatch
    field: status
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /network/payout-batches/{id}/lock"
        actor: OpsAdmin
        preconditions:
          - "period_end is at or before the logical clock"
          - "At least one non-VOIDED PayoutLine exists on this batch"
        side_effects:
          - "total_gross_cents, total_adjustment_cents, total_net_cents and line_count frozen as a snapshot over non-VOIDED lines"
      - from: LOCKED
        to: PAID
        trigger: "POST /network/payout-batches/{id}/pay"
        actor: OpsAdmin
        preconditions:
          - "Every non-VOIDED line on this batch is in line_status PENDING or already PAID"
        side_effects:
          - "Every PENDING PayoutLine on this batch → PAID"
          - "Each paid line increments its clinician's payout_balance_cents by net_cents"
      - from: PAID
        to: RECONCILED
        trigger: "POST /network/payout-batches/{id}/reconcile"
        actor: OpsAdmin
        preconditions:
          - "Every non-VOIDED line on this batch is in line_status IN {PAID, CLAWED_BACK}"
        side_effects:
          - "Any post-payment denial adjustment is applied as an additional clawback and the batch closes"
      - from: OPEN
        to: SKIPPED
        trigger: "system (a newer PayoutBatch for an overlapping period and the same schedule is opened)"
        actor: system
        preconditions:
          - "A PayoutBatch row with the same schedule, a strictly higher created_at, and a period_start strictly before this batch's period_end and a period_end strictly after this batch's period_start exists in status OPEN"
        side_effects:
          - "Each non-VOIDED PayoutLine on this batch → VOIDED"
          - "The newer batch's supersedes_batch_id is set to this batch's id"

  # --- CONTINUITYPLAN.status : branching with revert and re-escalation
  - entity: ContinuityPlan
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /network/continuity-plans/{id}/accept"
        actor: Clinician
        preconditions:
          - "successor_clinician_id is non-null"
          - "The successor clinician's billing_posture == BILLABLE"
          - "The successor's active_patient_count is strictly less than its weekly_caseload_target"
          - "The acting X-User-ID equals successor_clinician_id"
        side_effects:
          - "PatientClient.matched_clinician_id → successor_clinician_id"
          - "The prior clinician's active_patient_count decrements by 1"
          - "The successor's active_patient_count increments by 1"
          - "PatientClient.swap_requested = false"
      - from: PENDING
        to: DECLINED
        trigger: "POST /network/continuity-plans/{id}/decline"
        actor: Clinician
        preconditions:
          - "The acting X-User-ID equals successor_clinician_id"
        side_effects: []
      - from: DECLINED
        to: PENDING
        trigger: "POST /network/continuity-plans/{id}/successor"
        actor: OpsAdmin
        preconditions:
          - "logical clock is strictly before reassignment_deadline"
        side_effects:
          - "successor_clinician_id replaced; status returns to PENDING"
      - from: DECLINED
        to: ESCALATED
        trigger: "system (logical clock reaches reassignment_deadline while DECLINED)"
        actor: system
        preconditions:
          - "logical clock >= reassignment_deadline"
        side_effects:
          - "PatientClient.swap_requested = true"
      - from: PENDING
        to: ESCALATED
        trigger: "system (a Session for this patient completes while the owning clinician is OFFBOARDING or OFFBOARDED; or the logical clock reaches reassignment_deadline)"
        actor: system
        preconditions:
          - "Owning clinician status IN {OFFBOARDING, OFFBOARDED} and a Session for (clinician_id, patient_id) has just completed, OR logical clock >= reassignment_deadline"
          - "Session completion is not blocked by the OFFBOARDED completeness gate, so escalation reaches PENDING plans while a plan is still reassignable"
        side_effects:
          - "PatientClient.swap_requested = true"
      - from: ESCALATED
        to: PENDING
        trigger: "POST /network/continuity-plans/{id}/successor"
        actor: OpsAdmin
        preconditions:
          - "successor_clinician_id is non-null"
          - "logical clock is strictly before reassignment_deadline + 7 days"
        side_effects:
          - "PatientClient.swap_requested = false"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /network/continuity-plans/{id}/complete"
        actor: OpsAdmin
        preconditions:
          - "PatientClient.matched_clinician_id == successor_clinician_id"
        side_effects:
          - "The owning clinician's continuity_plan_count decrements by 1"

  # --- MALPRACTICEPOLICY.policy_status : derived, line-derived on read
  - entity: MalpracticePolicy
    field: policy_status
    initial_state: PENDING
    terminal_states: [LAPSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (logical clock reaches effective_on)"
        actor: system
        preconditions:
          - "logical clock >= effective_on"
        side_effects:
          - "Owning clinician billing_posture re-evaluated (GATED → BILLABLE when a License row reads VERIFIED and enrolled_payer_count >= 1)"
      - from: ACTIVE
        to: LAPSED
        trigger: "system (logical clock reaches expires_on)"
        actor: system
        preconditions:
          - "logical clock >= expires_on"
        side_effects:
          - "Owning clinician billing_posture re-evaluated; the clinician drops to GATED when no other policy reads ACTIVE"
          - "tail_coverage == true suppresses the GATED drop only for sessions already in COMPLETED status"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version)
# =============================================================================
concurrency_rules:
  - rule_id: payout-batch-period-supersede
    parent_entity: PayoutBatch
    write_endpoint: "POST /network/payout-batches/{id}/supersede"
    occ_field: "expected_open_batch_version"
    description: |
      Retiring an OPEN PayoutBatch in favour of a reconstructed one for the same
      schedule is legitimate at any point before it is locked. A client whose
      observed version of that open batch predates the most recent write — which
      itself advanced the batch's version — is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: session-note-supersede
    parent_entity: Session
    write_endpoint: "POST /network/sessions/{session_id}/notes"
    occ_field: "expected_session_version"
    description: |
      Adding a SessionNote after an earlier note has already been recorded
      legitimately supersedes the prior note under §3.5. A client carrying a
      Session version observed before that earlier write is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: continuity-successor-swap
    parent_entity: ContinuityPlan
    write_endpoint: "POST /network/continuity-plans/{id}/successor"
    occ_field: "expected_plan_version"
    description: |
      Reassigning a continuity plan's successor clinician is legitimate at any
      point before the deadline. A client whose observed plan version predates
      the most recent successor assignment — which itself advanced the plan's
      version — is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (14 calculations)
# =============================================================================
calculations:
  # ---------------------------------------------------------------- rate resolution
  - name: resolved_session_rate_cents
    trigger: "session schedule, claim submission, payout line build"
    description: "Resolves the integer contract rate for one session from the payer's rate schedule, then applies the new-clinician and geography differentials in a pinned order."
    algorithm: tiered_pricing
    formula: |
      Step 1 (candidate selection, pinned order):
        candidates = PayerRate rows where
          payer_id == patient.payer_id
          AND license_type == clinician.license_type
          AND geography == clinician.primary_state
          AND cpt_code == session.cpt_code
          AND effective_from <= session.scheduled_start
          AND (effective_to is null OR session.scheduled_start < effective_to)
      Step 2 (overlap winner): chosen = the candidate with the highest
        rate_set_version; when two candidates share the highest rate_set_version,
        chosen = the one with the largest created_at. A tie on both keys cannot
        arise, because the ERR_DUPLICATE_RATE uniqueness rule forbids two rows
        with the same (payer_id, rate_set_version, license_type, geography,
        cpt_code, effective_from), so the winner is always unique without
        falling back to any identifier.
      Step 3 (geography fallback): when Step 1 yields no candidate, repeat Step 1
        with geography == patient.state_code.
      Step 4 (no-rate fallback): when Step 3 also yields no candidate, rate = 0.
      Step 5 (telehealth gate): when session.modality == VIDEO and the clinician's
        License row for cpt-eligible practice has telehealth_eligible == false,
        rate = 0 and Steps 6-7 are skipped.
      Step 6 (new-clinician differential): when session.scheduled_start is
        strictly before clinician.onboarded_at + 90 days, rate = floor(rate * 0.90).
        Step 6 is skipped, leaving the rate untouched, at and after that instant.
      Step 7 (geography differential, applies only at or after the activation
        instant): when session.scheduled_start >= 2026-07-01T00:00:00Z AND the
        chosen rate row's geography != patient.state_code, apply a branching
        step to the value Step 6 produced:
          if that value is >= 10000  -> rate = that value - 1000
          otherwise                  -> rate = floor(that value * 0.90)
      Evaluation order is fixed: Step 6 then Step 7, never the reverse. The
      branch test reads the value Step 6 produced, not the original rate, so
      swapping the two steps yields a different number for the same inputs.
      Floor means round toward negative infinity; there is no re-rounding after
      Step 7.
    input_set: "Only PayerRate rows with effective_from <= scheduled_start and (effective_to is null OR scheduled_start < effective_to). Effective_when boundaries are half-open: effective_from inclusive, effective_to exclusive."
    constants:
      NEW_CLINICIAN_DIFFERENTIAL_PCT: 0.90
      NEW_CLINICIAN_DIFFERENTIAL_WINDOW_DAYS: 90
      GEOGRAPHY_DIFFERENTIAL: 0.90
      GEOGRAPHY_DIFFERENTIAL_EFFECTIVE_FROM: "2026-01-01T00:00:00Z"
      NON_ELIGIBLE_RATE_CENTS: 0
      GEOGRAPHY_FLAT_BREAKPOINT_CENTS: 10000
      GEOGRAPHY_FLAT_REDUCTION_CENTS: 1000
    precision: "integer cents; floor (toward negative infinity) at Steps 6 and 7, applied per session"
    variants:
      - name: primary_state_rate
        when: "a PayerRate row exists for (payer_id, clinician.license_type, clinician.primary_state)"
        difference: "The base rate comes from the clinician's primary-state geography; the Step 7 differential is skipped because the chosen row's geography equals patient.state_code only when those agree."
      - name: patient_state_fallback_rate
        when: "no primary-state rate row is effective, but a rate row for patient.state_code is"
        difference: "The rate is sourced from the patient's state geography; the Step 7 differential applies because the chosen row's geography differs from the primary-state anchor whenever patient.state_code != clinician.primary_state."

  # ---------------------------------------------------------------- cost share
  - name: patient_cost_share_cents
    trigger: "booking quote, claim adjudication"
    description: "Two-variant price diverger: the provisional quote at booking and the final adjudicated amount are computed over the same shared body but with different deductible and out-of-pocket bases, so identical inputs produce different cents."
    algorithm: waterfall_allocation
    formula: |
      Shared body, parameters differ by variant:
        S = claim_allowed_cents envelope for the session (from
            claim_billed_and_allowed_cents); S = 0 when no rate row resolved
        d = min(S, max(0, REMAINING_DEDUCTIBLE))
        after_deductible = S - d
        coins = round_half_up(after_deductible * coinsurance_rate)
        raw = d + coins + copay_cents
        raw = raw - 500  ONLY when the variant carries the copay offset
        room = OOP_ROOM
        cost_share = max(0, min(raw, room))
        The 500 copay offset is applied at most once per session and is never
        applied when coins < 500. floor appears only at the final clamp.
    input_set: "Uses the patient's newest BenefitVerification row with status VERIFIED when the variant is provisional; uses the newest VERIFIED row at adjudication time when the variant is final. A patient with no VERIFIED row cannot reach this calculation (booking and adjudication both gate on it)."
    constants:
      COPAY_OFFSET_CENTS: 500
      COPAY_OFFSET_MIN_COINSURANCE_CENTS: 500
    precision: "integer cents; round_half_up at the coinsurance step; floor only at the OOP clamp"
    variants:
      - name: provisional_quote
        when: "at POST /network/sessions/{id}/schedule, and recomputed on POST /network/sessions/{id}/reschedule"
        difference: |
          Literal coin values: REMAINING_DEDUCTIBLE = BenefitVerification.deductible_remaining_cents of the snapshot
            in force at booking; OOP_ROOM = BenefitVerification.oop_remaining_cents of that same snapshot;
            coinsurance_rate and copay_cents are taken from that snapshot too.
          This variant always carries the copay offset.
      - name: final_adjudicated
        when: "at POST /network/claims/{id}/adjudicate"
        difference: |
          REMAINING_DEDUCTIBLE = max(0, patient.deductible_cents minus the sum of
            Claim.patient_resp_cents over this patient's claims whose claim_status is PAID in the
            current plan year, that sum taken in Claim.submitted_on ASC order).
          OOP_ROOM = max(0, patient.oop_max_cents - patient.oop_met_cents) using the live accumulator,
            not the snapshot field. This is why the provisional quote and the final amount diverge.
          coinsurance_rate and copay_cents are read from the newest VERIFIED row, but this
            variant NEVER carries the copay offset: the raw - 500 step is skipped entirely,
            so the divergence between the two variants is caused by three independent
            differences (deductible basis, OOP room basis, offset presence), not one.

  - name: claim_billed_and_allowed_cents
    trigger: "POST /network/claims succeeds"
    algorithm: forward_looking
    formula: |
      billed_cents = resolved_session_rate_cents(clinician, patient, session)
      allowed_cents = round_half_up(billed_cents * 0.80)
      patient_resp_cents = patient_cost_share_cents(final_adjudicated)
      payer_paid_cents = max(0, allowed_cents - patient_resp_cents)
      Evaluation order is pinned: allowed_cents is derived from billed_cents,
      then patient_resp_cents is derived from allowed_cents, then payer_paid_cents
      from the two. The 0.80 ratio is applied to the billed amount, not to the
      rate row's rate_cents directly — the two are equal only when no differential
      applied.
      Saturation rule, applied after the three values above are fixed: the claim
      being adjudicated is only clamped when oop_met_cents + patient_resp_cents
      is strictly GREATER than oop_max_cents. In that case patient_resp_cents is
      rewritten to max(0, oop_max_cents - oop_met_cents) and payer_paid_cents is
      recomputed as max(0, allowed_cents - patient_resp_cents), so the payer
      absorbs the written-off remainder. When the sum equals oop_max_cents
      exactly, no clamp occurs — the equality case is the boundary between the
      two behaviours.
    constants:
      PAYER_ALLOWED_RATIO: 0.80
    precision: "integer cents; round_half_up at the allowed step; floor at the payer_paid clamp"

  # ---------------------------------------------------------------- payout variants
  - name: clinician_payout_line_amount_cents
    trigger: "POST /network/payout-batches/{id}/lock, POST /network/payout-batches/{id}/pay"
    algorithm: aggregation
    formula: |
      gross_cents = sum over the line's included sessions of
        resolved_session_rate_cents(clinician, patient, session)
      Each session contributes its already-floored integer rate; the sum itself
      is never re-rounded, and a batch total is the sum of line grosses. Rounding order is pinned:
      each session's rate is floored to an integer under
      resolved_session_rate_cents, those integers are summed into gross_cents,
      and the batch total sums the line grosses. The tempting alternative —
      applying the geography differential once to a sum of raw rate rows, or
      scaling a batch total — produces a different number by up to one cent per
      affected line and is wrong.
      net_cents = gross_cents + adjustment_cents
      adjustment_cents = sum of denial_clawback_adjustment_cents over the line's
        claims, plus any pending_clawback_residual_cents carried in from the
        clinician's prior batch.
    input_set: "Scheduled variant: sessions with status COMPLETED and scheduled_end in [period_start, period_end) whose clinician_id is the line's clinician, regardless of Claim.claim_status. Cash-basis variant: sessions in that same window whose newest Claim has claim_status PAID."
    constants:
      SCHEDULED_BASIS_INCLUDES_UNPAID_CLAIMS: true
      DENIED_SESSIONS_INCLUDED_IN_SCHEDULED_BASIS: true
    precision: "integer cents; no rounding at the sum step"
    variants:
      - name: scheduled_basis
        when: "PayoutBatch.schedule is WEEKLY or BIWEEKLY, and the clinician has no cash_basis_opt_in flag"
        difference: |
          Earns on every COMPLETED session in the window with a signed note,
          even when the payer has paid nothing. gross_cents counts unpaid and
          denied sessions; adjustment_cents then carries the denials as
          clawbacks in a later batch.
      - name: cash_basis
        when: "the clinician carries cash_basis_opt_in == true, or PayoutBatch.schedule is SEMIMONTHLY"
        difference: |
          Earns only on sessions whose newest Claim reads PAID. gross_cents is
          strictly lower whenever any session in the window is unpaid or denied,
          and adjustment_cents carries no denial clawbacks because denied
          sessions were never included. Both variants are computed from the
          same window and the same rate resolution, so the divergence is caused
          solely by the inclusion filter.

  - name: payout_batch_totals
    trigger: "POST /network/payout-batches/{id}/lock"
    algorithm: aggregation
    formula: |
      included = PayoutLine rows on this batch with line_status != VOIDED
      total_gross_cents = sum(line.gross_cents for included)
      total_adjustment_cents = sum(line.adjustment_cents for included)
      total_net_cents = sum(line.net_cents for included)
      line_count = count(included)
      Rounding order is pinned: per-line values are computed and stored first,
      then summed. Recomputing by summing raw session rates and applying the
      geography differential once at the end is the tempting alternative and is
      wrong by up to one cent per affected line.
    input_set: "Excludes VOIDED lines entirely; a batch whose lines were all voided by supersession has line_count == 0 and all totals == 0"

  - name: clinician_payout_balance_cents
    trigger: "POST /network/payout-batches/{id}/pay, POST /network/claims/{id}/write-off, claim denial"
    algorithm: aggregation
    formula: |
      payout_balance_cents =
        sum(net_cents for this clinician's lines in line_status PAID)
        + sum(0 for lines in line_status PENDING)
        + sum(adjustment_cents for lines in line_status CLAWED_BACK)
      Floor asymmetry: net_cents is floored at 0 for PENDING lines only. A PAID
      line whose clawback exceeds its gross keeps a negative net_cents, and that
      negative value flows into the balance unchanged.
    input_set: "VOIDED lines contribute nothing, not even their adjustment"

  - name: denial_clawback_adjustment_cents
    trigger: "claim denial, claim write-off, payer termination"
    algorithm: ledger_sync
    formula: |
      If the claim's session is on no PayoutLine: adjustment = 0.
      If the claim's session is on a PENDING line: adjustment = -resolved_session_rate_cents;
        when gross_cents + adjustment would fall below 0, the line's net_cents is
        floored at 0 and the residual shortfall is stored on the clinician as
        pending_clawback_residual_cents for the next batch.
      If the claim's session is on a PAID line: adjustment = -resolved_session_rate_cents
        and net_cents may go negative (no floor).
    constants:
      PENDING_LINE_NET_FLOOR_CENTS: 0

  # ---------------------------------------------------------------- posture and gates
  - name: clinician_billing_posture_derived
    trigger: "any License, MalpracticePolicy, PayerEnrollment or Clinician write"
    algorithm: constraint_propagation
    formula: |
      Evaluate in this fixed precedence, stopping at the first match:
        FROZEN  when clinician.status IN {SUSPENDED, OFFBOARDED}
                OR enrolled_payer_count == 0
        GATED   when no License row for this clinician reads verification_status == VERIFIED
                OR no MalpracticePolicy row for this clinician reads policy_status == ACTIVE
        BILLABLE otherwise
      enrolled_payer_count counts PayerEnrollment rows in EFFECTIVE status only;
      PENDING, SUSPENDED and TERMINATED rows do not count.
    constants:
      BILLING_POSTURE_MIN_ENROLLMENTS: 1

  - name: licensure_verification_status_derived
    trigger: "read of any License row; any clock advance"
    algorithm: derived
    formula: |
      Precedence, first match wins:
        FAILED    when the most recent verify attempt carried expires_on <= logical clock
                  and no reset-verification has occurred since
        EXPIRED   when logical clock >= expires_on
        VERIFIED  when a successful verification exists and logical clock < expires_on
        UNVERIFIED otherwise
      A license expiring at exactly the clock instant reads EXPIRED, not VERIFIED.
    constants:
      EXPIRY_INCLUSIVE_AT_CLOCK: true

  - name: caseload_utilization_and_acceptance_capacity
    trigger: "patient match, continuity plan acceptance, caseload target change"
    algorithm: threshold
    formula: |
      utilization_pct = floor(100 * active_patient_count / weekly_caseload_target)
      acceptance_allowed = active_patient_count < weekly_caseload_target     (strict)
      waitlist_eligible  = utilization_pct >= 90                              (inclusive)
      The two predicates use opposite boundary senses on the same numbers: at
      active_patient_count == weekly_caseload_target, acceptance_allowed is
      false while waitlist_eligible is true.
    constants:
      WAITLIST_UTILIZATION_PCT: 90

  # ---------------------------------------------------------------- selector
  - name: patient_match_candidate_selection
    trigger: "POST /network/patients/{id}/match"
    algorithm: selector
    formula: |
      Rank tuple evaluated entirely within this run: active_patient_count is
        the value from one consistent read of the candidate rows taken before
        any match is written, so earlier assignments in the same request never
        shift a later candidate's rank.
      Eligibility filter (all must hold):
        (1) clinician.status == ACTIVE
        (2) clinician.billing_posture == BILLABLE
        (3) patient.payer_id is among the payer_ids of that clinician's
            PayerEnrollment rows with status EFFECTIVE
        (4) intersection(clinician.specialty_tags, request.specialty_tags) is non-empty
        (5) clinician.primary_state == patient.state_code
            OR some License row of the clinician has issuing_state == patient.state_code
               AND telehealth_eligible == true
        (6) clinician.active_patient_count < clinician.weekly_caseload_target
      Ranking, applied in order:
        (i)   descending count of matched specialty tags
        (ii)  ascending clinician.active_patient_count
        (iii) ascending clinician.created_at
      Tie-break ends at (iii). If two candidates remain tied on created_at the
      request is rejected with ERR_MATCH_TIE_UNRESOLVABLE; the server never
      falls back to id.
      Empty candidate set -> 422 ERR_NO_ELIGIBLE_CLINICIAN and no match is written.
    constants:
      RANK_ORDER: "specialty_tag_overlap DESC, active_patient_count ASC, created_at ASC"

  # ---------------------------------------------------------------- temporal
  - name: continuity_reassignment_deadline_utc
    trigger: "POST /network/clinicians/{id}/request-offboarding, POST /network/continuity-plans/{id}/successor"
    algorithm: scheduled_deferred
    formula: |
      reassignment_deadline = offboarding_requested_on + 30 days, computed on the
      logical clock. Reassignment is accepted while logical clock < reassignment_deadline
      (strict). Escalation fires when logical clock >= reassignment_deadline.
      A DECLINED or ESCALATED plan may be reassigned with POST /continuity-plans/{id}/successor
      while logical clock < reassignment_deadline + 7 days.
    constants:
      CONTINUITY_GRACE_DAYS: 30
      CONTINUITY_EXTENSION_DAYS: 7

  - name: enrollment_effective_window_days
    trigger: "PayerEnrollment activation"
    algorithm: calendar_arithmetic
    formula: |
      effective_window_days = (effective_to - effective_from) in whole days
        when effective_to is non-null
      effective_window_days = null when effective_to is null (open-ended)
      effective_to == effective_from is rejected at validation: the window is
      half-open, so a zero-length window is invalid, not empty.
    constants:
      WINDOW_MIN_DAYS: 1

  - name: claim_recovery_deadline_utc
    trigger: "claim denial, claim resubmission"
    algorithm: scheduled_deferred
    formula: |
      recovery_deadline = submitted_on + payer.timely_filing_days, computed on the
      logical clock, where submitted_on is the most recent submission instant
      (updated on each accepted reprocessing).
      Resubmission is allowed while logical clock < recovery_deadline (strict).
      Write-off is allowed when logical clock >= recovery_deadline, or when
      resubmission_count == 2 regardless of the clock.
      At logical clock == recovery_deadline exactly, resubmission is rejected
      and write-off is permitted — the two boundary senses are opposite.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; X-User-ID is non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The declared role is permitted on this endpoint, and for entity_backed roles X-User-ID equals the id of an existing instance of that role's entity"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all entity-scoped endpoints"

  - priority: 3
    category: existence
    check: "Referenced resources exist, checked left to right in the endpoint's declared input order; path resources checked before body resources"
    error_id: "ERR_CLINICIAN_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_PAYER_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_PATIENT_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_NOTE_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_CONTINUITY_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints taking a path id or a foreign key"

  - priority: 4
    category: state
    check: "The target resource is in a state from which the requested transition is declared; a transition not declared from the current state is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 5
    category: business_safety
    check: "Clinical safety gate: the session's clinician must hold billing_posture == BILLABLE at the submission or resubmission instant; a FROZEN or GATED posture blocks submission"
    error_id: ERR_CLINICIAN_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /network/claims, POST /network/claims/{id}/resubmit, POST /network/sessions/{id}/complete"

  - priority: 6
    category: business_referential
    check: "The payer is in status ACTIVE for the session's service date, the cpt_code appears in payer.allowed_cpt_codes, and an effected PayerEnrollment covers the service date for (clinician, payer)"
    error_id: ERR_SERVICE_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /network/claims, POST /network/patients/{id}/verification"

  - priority: 7
    category: business_temporal
    check: "Resource interval conflicts: clinician availability, patient double-booking, payout-period overlap, and enrollment window length are checked in this order and the first conflict wins"
    error_id: "ERR_CLINICIAN_SLOT_CONFLICT or ERR_PATIENT_DOUBLE_BOOKED or ERR_ENROLLMENT_WINDOW_INVALID"
    http_status: 409
    applies_to: "POST /network/sessions, POST /network/sessions/{id}/schedule, POST /network/sessions/{id}/reschedule, POST /network/payer-enrollments"

  - priority: 8
    category: business_fiscal
    check: "Fiscal gates: payout batch lock and pay preconditions, claim write-off eligibility, and caseload acceptance capacity"
    error_id: "ERR_BATCH_NOT_LOCKABLE or ERR_WRITE_OFF_NOT_ALLOWED or ERR_CASELOAD_FULL"
    http_status: 409
    applies_to: "POST /network/payout-batches/{id}/lock, POST /network/payout-batches/{id}/pay, POST /network/claims/{id}/write-off, POST /network/continuity-plans/{id}/accept, POST /network/patients/{id}/match"

# =============================================================================
# §1.5 API Endpoint Table (51 endpoints)
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- Clinician
  - method: POST
    path: "/network/clinicians"
    description: "Onboard a clinician; status ONBOARDING, billing_posture GATED, onboarded_at stamped from the logical clock"
    roles: [OpsAdmin]
    code: 201
    input: [full_name, license_type, primary_state, specialty_tags, weekly_caseload_target, "availability_blocks?"]
    output: Clinician
    side_effects: ["status=ONBOARDING", "billing_posture=GATED", "onboarded_at=logical clock", "active_patient_count=0", "open_slot_count derived from availability_blocks", "version=1"]

  - method: GET
    path: "/network/clinicians"
    description: "List clinicians; filterable by status, billing_posture, primary_state and license_type"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "billing_posture?", "primary_state?", "license_type?", "limit?", "offset?"]
    output: Clinician[]
    side_effects: []

  - method: GET
    path: "/network/clinicians/{id}"
    description: "Fetch one clinician with derived posture, counts and balance"
    roles: [OpsAdmin, ComplianceOfficer, Clinician, Patient]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: POST
    path: "/network/clinicians/{id}/submit-credentials"
    description: "Move a clinician from ONBOARDING to CREDENTIALING once a license and a malpractice policy are on file"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Clinician
    side_effects: ["status ONBOARDING -> CREDENTIALING", "billing_posture re-evaluated", "increments Clinician.version by 1"]

  - method: POST
    path: "/network/clinicians/{id}/suspend"
    description: "Suspend an active clinician; freezes billing posture and cancels every open session"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Clinician
    side_effects: ["status ACTIVE -> SUSPENDED", "billing_posture -> FROZEN", "every Session IN {REQUESTED, SCHEDULED} -> CANCELLED", "increments Clinician.version by 1"]

  - method: POST
    path: "/network/clinicians/{id}/reinstate"
    description: "Reinstate a suspended clinician when remaining licenses and enrollments permit"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Clinician
    side_effects: ["status SUSPENDED -> ACTIVE", "billing_posture re-derived FROZEN -> BILLABLE or GATED", "increments Clinician.version by 1"]

  - method: POST
    path: "/network/clinicians/{id}/request-offboarding"
    description: "Begin offboarding; requires zero open slots and at least one active patient; opens one continuity plan per matched patient"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Clinician
    side_effects:
      - "status ACTIVE -> OFFBOARDING"
      - "offboarding_requested_on = logical clock"
      - "billing_posture -> GATED"
      - "one ContinuityPlan created per PatientClient matched to this clinician, status PENDING, reason OFFBOARDING"
      - "increments Clinician.version by 1"

  - method: POST
    path: "/network/clinicians/{id}/cancel-offboarding"
    description: "Revert OFFBOARDING to ACTIVE when no continuity plan has been declined or escalated"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Clinician
    side_effects: ["status OFFBOARDING -> ACTIVE", "offboarding_requested_on = null", "billing_posture re-evaluated", "increments Clinician.version by 1"]

  - method: POST
    path: "/network/clinicians/{id}/complete-offboarding"
    description: "Finalize offboarding; requires every matched patient to have been reassigned"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Clinician
    side_effects:
      - "status OFFBOARDING -> OFFBOARDED"
      - "billing_posture -> FROZEN"
      - "every ContinuityPlan of this clinician in status PENDING -> ESCALATED"
      - "every Session IN {REQUESTED, SCHEDULED} of this clinician -> CANCELLED"
      - "increments Clinician.version by 1"

  - method: "PUT"
    path: "/network/clinicians/{id}"
    description: "Update caseload target, availability blocks, specialty tags or primary state; re-derives open_slot_count and posture"
    roles: [OpsAdmin]
    code: 200
    input: ["weekly_caseload_target?", "availability_blocks?", "specialty_tags?", "primary_state?", expected_clinician_version]
    output: Clinician
    side_effects: ["re-derives open_slot_count", "re-derives active_patient_count", "billing_posture re-evaluated", "increments Clinician.version by 1"]

  # ---------------------------------------------------------------- License
  - method: POST
    path: "/network/clinicians/{id}/licenses"
    description: "Record a state license for a clinician"
    roles: [OpsAdmin]
    code: 201
    input: [license_number, license_type, issuing_state, expires_on, telehealth_eligible]
    output: License
    side_effects: ["verification_status=UNVERIFIED", "verification_attempts=0", "verified_at=null", "verified_by_user_id=null"]

  - method: GET
    path: "/network/clinicians/{id}/licenses"
    description: "List licenses for a clinician; filterable by license_type, issuing_state and verification_status"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["license_type?", "issuing_state?", "verification_status?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/network/clinicians/{clinician_id}/licenses/{id}/verify"
    description: "Verify a license; succeeds to VERIFIED when expires_on is strictly after the logical clock, otherwise records FAILED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["verification_attempts += 1", "verification_status = VERIFIED or FAILED", "verified_at and verified_by_user_id set on success", "owning clinician billing_posture re-evaluated"]

  - method: POST
    path: "/network/clinicians/{clinician_id}/licenses/{id}/reverify"
    description: "Re-verify an EXPIRED license; accepts a replacement expiry and returns the license to VERIFIED"
    roles: [ComplianceOfficer]
    code: 200
    input: [replacement_expires_on]
    output: License
    side_effects: ["expires_on = replacement_expires_on", "verification_status -> VERIFIED", "verified_at = logical clock", "verification_attempts += 1", "owning clinician billing_posture re-evaluated"]

  - method: POST
    path: "/network/clinicians/{clinician_id}/licenses/{id}/reset-verification"
    description: "Return a FAILED license to UNVERIFIED so it can be attempted again"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["verification_status -> UNVERIFIED", "verified_at = null", "verification_attempts unchanged"]

  # ---------------------------------------------------------------- Malpractice
  - method: POST
    path: "/network/clinicians/{id}/malpractice-policies"
    description: "Record a malpractice coverage policy; policy_status is derived on read"
    roles: [OpsAdmin]
    code: 201
    input: [carrier_name, coverage_cents, effective_on, expires_on, tail_coverage]
    output: MalpracticePolicy
    side_effects: ["policy_status derived from the logical clock", "owning clinician billing_posture re-evaluated"]

  - method: GET
    path: "/network/clinicians/{id}/malpractice-policies"
    description: "List malpractice policies for a clinician; filterable by policy_status"
    roles: [OpsAdmin, ComplianceOfficer]
    code: 200
    input: ["policy_status?", "limit?", "offset?"]
    output: MalpracticePolicy[]
    side_effects: []

  # ---------------------------------------------------------------- Payer
  - method: POST
    path: "/network/payers"
    description: "Create a payer with delegated-credentialing posture and billing constraints"
    roles: [OpsAdmin]
    code: 201
    input: [payer_name, payer_code, delegated_credentialing, min_malpractice_coverage_cents, timely_filing_days, credentialing_sla_days, allowed_cpt_codes]
    output: Payer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/network/payers"
    description: "List payers; filterable by status and delegated_credentialing"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "delegated_credentialing?", "limit?", "offset?"]
    output: Payer[]
    side_effects: []

  - method: GET
    path: "/network/payers/{id}"
    description: "Fetch one payer"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: []
    output: Payer
    side_effects: []

  - method: PATCH
    path: "/network/payers/{id}"
    description: "Change payer status; SUSPENDED_AT_PAYER cascades through enrollments and can freeze clinicians"
    roles: [OpsAdmin]
    code: 200
    input: [status]
    output: Payer
    side_effects: ["ACTIVE -> SUSPENDED_AT_PAYER or SUSPENDED_AT_PAYER -> ACTIVE or any -> TERMINATED", "on SUSPENDED_AT_PAYER: every EFFECTIVE PayerEnrollment -> SUSPENDED, each clinician's enrolled_payer_count and billing_posture re-derived, each clinician that became FROZEN has open sessions CANCELLED", "on TERMINATED: enrollments -> TERMINATED, SUBMITTED claims -> DENIED with denial_code NOT_COVERED"]

  # ---------------------------------------------------------------- PayerRate
  - method: POST
    path: "/network/payers/{id}/rates"
    description: "Publish a rate row for a payer keyed by license type, geography and CPT code"
    roles: [OpsAdmin]
    code: 201
    input: [rate_set_version, license_type, geography, cpt_code, rate_cents, effective_from, "effective_to?"]
    output: PayerRate
    side_effects: ["no retroactive repricing; already-COMPLETED sessions keep the rate resolved at their own scheduled_start"]

  - method: GET
    path: "/network/payers/{id}/rates"
    description: "List a payer's rate rows; filterable by license_type, geography, cpt_code and rate_set_version"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["license_type?", "geography?", "cpt_code?", "rate_set_version?", "limit?", "offset?"]
    output: PayerRate[]
    side_effects: []

  # ---------------------------------------------------------------- PayerEnrollment
  - method: POST
    path: "/network/payer-enrollments"
    description: "Submit a clinician for credentialing with a payer; starts PENDING"
    roles: [OpsAdmin]
    code: 201
    input: [clinician_id, payer_id, delegated, effective_from, "effective_to?"]
    output: PayerEnrollment
    side_effects: ["status=PENDING", "rate_set_version_pinned=null"]

  - method: GET
    path: "/network/payer-enrollments"
    description: "List enrollments; filterable by clinician_id and payer_id"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["clinician_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: PayerEnrollment[]
    side_effects: []

  - method: GET
    path: "/network/payer-enrollments/{id}"
    description: "Fetch one enrollment"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []

  - method: POST
    path: "/network/payer-enrollments/{id}/activate"
    description: "Move an enrollment to EFFECTIVE; effective_from must not be in the future and the clinician must meet the payer's license and malpractice floors"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["status PENDING -> EFFECTIVE", "rate_set_version_pinned resolved at effective_from", "effective_window_days derived", "clinician enrolled_payer_count increments, billing_posture re-evaluated"]

  - method: POST
    path: "/network/payer-enrollments/{id}/reject"
    description: "Reject a pending enrollment terminally"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["status PENDING -> REJECTED"]

  - method: POST
    path: "/network/payer-enrollments/{id}/suspend"
    description: "Suspend an effective enrollment and re-derive the clinician's posture"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["status EFFECTIVE -> SUSPENDED", "clinician enrolled_payer_count decrements, billing_posture re-evaluated"]

  - method: POST
    path: "/network/payer-enrollments/{id}/reinstate"
    description: "Return a suspended enrollment to EFFECTIVE when the payer and window still permit"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["status SUSPENDED -> EFFECTIVE", "clinician enrolled_payer_count increments, billing_posture re-evaluated"]

  - method: POST
    path: "/network/payer-enrollments/{id}/terminate"
    description: "Terminate an enrollment terminally"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["status -> TERMINATED", "clinician enrolled_payer_count recomputed, billing_posture re-evaluated"]

  # ---------------------------------------------------------------- PatientClient
  - method: POST
    path: "/network/patients"
    description: "Register a patient with plan parameters and insurance identifiers"
    roles: [OpsAdmin]
    code: 201
    input: [full_name, member_id, payer_id, plan_code, state_code, deductible_cents, coinsurance_rate, oop_max_cents]
    output: PatientClient
    side_effects: ["benefit_status=UNVERIFIED", "oop_met_cents=0", "visit_count_year=0", "matched_clinician_id=null", "swap_requested=false"]

  - method: GET
    path: "/network/patients"
    description: "List patients; filterable by payer_id, state_code, benefit_status and matched_clinician_id"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["payer_id?", "state_code?", "benefit_status?", "matched_clinician_id?", "limit?", "offset?"]
    output: PatientClient[]
    side_effects: []

  - method: GET
    path: "/network/patients/{id}"
    description: "Fetch one patient with derived benefit status and accumulators"
    roles: [OpsAdmin, ComplianceOfficer, Clinician, Patient]
    code: 200
    input: []
    output: PatientClient
    side_effects: []

  - method: POST
    path: "/network/patients/{id}/match"
    description: "Select the best eligible clinician for a patient and assign the match; 422 when no candidate is eligible"
    roles: [OpsAdmin]
    code: 200
    input: [specialty_tags]
    output: PatientClient
    side_effects: ["matched_clinician_id set from the selector", "prior clinician active_patient_count decrements, successor's increments", "increments PatientClient.version by 1"]

  # ---------------------------------------------------------------- BenefitVerification
  - method: POST
    path: "/network/patients/{id}/verification"
    description: "Record a payer benefit verification snapshot and quote the provisional per-session cost share"
    roles: [OpsAdmin]
    code: 201
    input: [deductible_remaining_cents, coinsurance_rate, copay_cents, oop_remaining_cents]
    output: BenefitVerification
    side_effects: ["status=VERIFIED", "verified_at=logical clock", "quoted_cost_share_cents computed from the snapshot", "patient benefit_status recomputed"]

  - method: GET
    path: "/network/patients/{id}/verification"
    description: "List benefit verifications for a patient; filterable by status"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BenefitVerification[]
    side_effects: []

  # ---------------------------------------------------------------- Session
  - method: POST
    path: "/network/sessions"
    description: "Request a session; starts REQUESTED with billing_state UNBILLED"
    roles: [OpsAdmin]
    code: 201
    input: [clinician_id, patient_id, scheduled_start, scheduled_end, cpt_code, modality]
    output: Session
    side_effects: ["status=REQUESTED", "billing_state=UNBILLED", "slot_consumed=false", "quoted_cost_share_cents=null"]

  - method: GET
    path: "/network/sessions"
    description: "List sessions; filterable by clinician_id and patient_id"
    roles: [OpsAdmin, ComplianceOfficer, Clinician, Patient]
    code: 200
    input: ["clinician_id?", "patient_id?", "status?", "billing_state?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/network/sessions/{id}"
    description: "Fetch one session"
    roles: [OpsAdmin, ComplianceOfficer, Clinician, Patient]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/network/sessions/{id}/schedule"
    description: "Confirm a requested session; requires a VERIFIED benefit snapshot, a free availability slot and no overlapping session on either resource"
    roles: [Clinician, OpsAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["status REQUESTED -> SCHEDULED", "slot_consumed=true", "quoted_cost_share_cents quoted provisonally", "clinician open_slot_count re-derived", "increments Session.version by 1"]

  - method: POST
    path: "/network/sessions/{id}/complete"
    description: "Mark a scheduled session as delivered; requires a signed note whose documented duration matches the scheduled length"
    roles: [Clinician, OpsAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["status SCHEDULED -> COMPLETED", "slot_consumed=false", "clinician open_slot_count re-derived", "patient visit_count_year increments", "continuity plan for this (clinician, patient) escalates when the clinician is OFFBOARDING or OFFBOARDED", "increments Session.version by 1"]

  - method: POST
    path: "/network/sessions/{id}/reopen"
    description: "Return a completed but unbilled session to SCHEDULED so its note can be corrected"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["status COMPLETED -> SCHEDULED", "slot_consumed=true", "clinician open_slot_count and patient visit_count_year re-derived", "increments Session.version by 1"]

  - method: POST
    path: "/network/sessions/{id}/cancel"
    description: "Cancel a requested or scheduled session"
    roles: [Clinician, OpsAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["status -> CANCELLED", "slot_consumed=false", "clinician open_slot_count re-derived", "increments Session.version by 1"]

  - method: POST
    path: "/network/sessions/{id}/reschedule"
    description: "Move a cancelled session to a new interval, enforcing the same availability and overlap rules"
    roles: [Clinician, OpsAdmin]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: Session
    side_effects: ["status CANCELLED -> SCHEDULED", "slot_consumed=true", "quoted_cost_share_cents re-quoted", "increments Session.version by 1"]

  # ---------------------------------------------------------------- SessionNote
  - method: POST
    path: "/network/sessions/{id}/notes"
    description: "Attach a documentation note to a session; supersedes any earlier note per the OCC rule"
    roles: [Clinician]
    code: 201
    input: [diagnosis_code, duration_minutes, cpt_code, narrative, expected_session_version]
    output: SessionNote
    side_effects: ["status=DRAFT", "note_version = highest existing note_version for the session + 1", "increments Session.version by 1"]

  - method: GET
    path: "/network/sessions/{id}/notes"
    description: "List notes for a session; filterable by status"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SessionNote[]
    side_effects: []

  - method: POST
    path: "/network/sessions/{session_id}/notes/{id}/sign"
    description: "Sign a draft note; locks the prior signed note for the session"
    roles: [Clinician]
    code: 200
    input: []
    output: SessionNote
    side_effects: ["status DRAFT -> SIGNED", "signed_at=logical clock", "signer_clinician_id=acting X-User-ID", "any earlier SIGNED note on the session -> LOCKED", "increments SessionNote.version by 1"]

  # ---------------------------------------------------------------- Claim
  - method: POST
    path: "/network/claims"
    description: "Submit a claim on a completed session for billing on the clinician's behalf"
    roles: [OpsAdmin]
    code: 201
    input: [session_id]
    output: Claim
    side_effects: ["claim_status=DRAFT then SUBMITTED", "submitted_on=logical clock", "billed_cents resolved from PayerRate", "Session.billing_state -> CLAIM_SUBMITTED", "Session.claim_id set"]

  - method: GET
    path: "/network/claims"
    description: "List claims; filterable by session_id and claim_status"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["session_id?", "claim_status?", "payer_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/network/claims/{id}"
    description: "Fetch one claim with its derived deadline and resubmission counter"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/network/claims/{id}/adjudicate"
    description: "Record the payer's remittance advice; moves the claim to PAID or DENIED"
    roles: [OpsAdmin]
    code: 200
    input: [outcome, "denial_code?"]
    output: Claim
    side_effects: ["claim_status SUBMITTED -> PAID or DENIED", "patient oop_met_cents increases on PAID", "recovery_deadline set on DENIED", "Session.billing_state updated", "the claim's earning is committed to the clinician's newest PayoutLine"]

  - method: POST
    path: "/network/claims/{id}/resubmit"
    description: "Reprocess a denied claim; allowed only strictly before the recovery deadline and at most twice"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_status DENIED -> REPROCESSING with resubmission_count += 1", "denial_code cleared"]

  - method: POST
    path: "/network/claims/{id}/decide-reprocessing"
    description: "Settle the reprocessing outcome; ACCEPTED returns the claim to SUBMITTED, REJECTED returns it to DENIED as a duplicate"
    roles: [OpsAdmin]
    code: 200
    input: [outcome]
    output: Claim
    side_effects: ["REPROCESSING -> SUBMITTED or DENIED", "on REJECTED: denial_code=DUPLICATE", "Session.billing_state updated"]

  - method: POST
    path: "/network/claims/{id}/write-off"
    description: "Write a denied claim off as uncollectible"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_status -> WRITTEN_OFF", "Session.billing_state -> WRITTEN_OFF", "negative adjustment recorded against the clinician's newest PayoutLine"]

  # ---------------------------------------------------------------- PayoutBatch
  - method: POST
    path: "/network/payout-batches"
    description: "Open a payout batch for a period and schedule; requires no still-open batch to overlap the same schedule"
    roles: [OpsAdmin]
    code: 201
    input: [period_start, period_end, schedule]
    output: PayoutBatch
    side_effects:
      - "status=OPEN and created_by_user_id set to the acting X-User-ID"
      - "line_count == 0 at creation; lines are materialized at lock time"
      - "a still-OPEN batch with a strictly earlier created_at on the same schedule whose period overlaps this one transitions to SKIPPED and each of its non-VOIDED lines becomes VOIDED"
      - "supersedes_batch_id records the skipped batch's id"

  - method: GET
    path: "/network/payout-batches"
    description: "List payout batches; filterable by status and schedule"
    roles: [OpsAdmin, Clinician]
    code: 200
    input: ["status?", "schedule?", "limit?", "offset?"]
    output: PayoutBatch[]
    side_effects: []

  - method: GET
    path: "/network/payout-batches/{id}"
    description: "Fetch one payout batch with frozen totals when locked"
    roles: [OpsAdmin, Clinician]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

  - method: POST
    path: "/network/payout-batches/{id}/lock"
    description: "Freeze a batch's totals over its non-voided lines once the period has closed"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects:
      - "status OPEN -> LOCKED"
      - "one PayoutLine is created per clinician with at least one eligible session in the window, carrying that clinician's session_ids, claim_ids, gross_cents, adjustment_cents and net_cents under the active payout variant"
      - "total_gross_cents, total_adjustment_cents, total_net_cents and line_count are then snapshot over the non-VOIDED lines"

  - method: POST
    path: "/network/payout-batches/{id}/pay"
    description: "Pay a locked batch, independent of whether payers have remitted; lines already in CLAWED_BACK are left alone"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["status LOCKED -> PAID", "every PENDING line -> PAID", "each paid line increments its clinician's payout_balance_cents by net_cents"]

  - method: POST
    path: "/network/payout-batches/{id}/reconcile"
    description: "Close a paid batch after post-payment denials have been applied as clawbacks"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["status PAID -> RECONCILED", "post-payment denial adjustments applied as clawbacks"]

  - method: POST
    path: "/network/payout-batches/{id}/supersede"
    description: "Retire an open batch whose period should be rebuilt under a different schedule"
    roles: [OpsAdmin]
    code: 200
    input: [expected_open_batch_version]
    output: PayoutBatch
    side_effects: ["status OPEN -> SKIPPED", "every non-VOIDED line -> VOIDED", "increments PayoutBatch.version by 1"]

  - method: GET
    path: "/network/payout-batches/{id}/lines"
    description: "List the payout lines on a batch"
    roles: [OpsAdmin, Clinician]
    code: 200
    input: ["line_status?", "limit?", "offset?"]
    output: PayoutLine[]
    side_effects: []

  - method: GET
    path: "/network/clinicians/{id}/payout-lines"
    description: "List payout lines for a clinician across batches"
    roles: [OpsAdmin, Clinician]
    code: 200
    input: ["line_status?", "limit?", "offset?"]
    output: PayoutLine[]
    side_effects: []

  # ---------------------------------------------------------------- ContinuityPlan
  - method: POST
    path: "/network/continuity-plans"
    description: "Open a continuity plan for a patient of a departing clinician"
    roles: [OpsAdmin]
    code: 201
    input: [clinician_id, patient_id, reason, "successor_clinician_id?"]
    output: ContinuityPlan
    side_effects: ["status=PENDING", "reassignment_deadline derived from the clinician's offboarding instant, or from the clock when no offboarding is recorded"]

  - method: GET
    path: "/network/continuity-plans"
    description: "List continuity plans; filterable by clinician_id and patient_id"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["clinician_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: ContinuityPlan[]
    side_effects: []

  - method: GET
    path: "/network/continuity-plans/{id}"
    description: "Fetch one continuity plan"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: []
    output: ContinuityPlan
    side_effects: []

  - method: POST
    path: "/network/continuity-plans/{id}/successor"
    description: "Assign or replace the successor clinician; permitted before the deadline and for seven days past it"
    roles: [OpsAdmin]
    code: 200
    input: [successor_clinician_id, expected_plan_version]
    output: ContinuityPlan
    side_effects: ["successor_clinician_id replaced", "status DECLINED or ESCALATED -> PENDING", "patient swap_requested cleared", "increments ContinuityPlan.version by 1"]

  - method: POST
    path: "/network/continuity-plans/{id}/accept"
    description: "Successor accepts a continuity plan; transfers the patient match"
    roles: [Clinician]
    code: 200
    input: []
    output: ContinuityPlan
    side_effects: ["status PENDING -> ACCEPTED", "patient matched_clinician_id -> successor", "prior clinician active_patient_count decrements, successor's increments", "patient swap_requested cleared", "increments ContinuityPlan.version by 1"]

  - method: POST
    path: "/network/continuity-plans/{id}/decline"
    description: "Proposed successor declines the continuity plan"
    roles: [Clinician]
    code: 200
    input: []
    output: ContinuityPlan
    side_effects: ["status PENDING -> DECLINED", "increments ContinuityPlan.version by 1"]

  - method: POST
    path: "/network/continuity-plans/{id}/complete"
    description: "Close a continuity plan once the patient is confirmed with the successor"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: ContinuityPlan
    side_effects: ["status ACCEPTED -> COMPLETED", "clinician continuity_plan_count decrements", "increments ContinuityPlan.version by 1"]

  # ---------------------------------------------------------------- Reverse-reachability reads
  - method: GET
    path: "/network/claims/{id}/payout-line"
    description: "Fetch the payout line that carries this claim's earnings"
    roles: [OpsAdmin, Clinician]
    code: 200
    input: []
    output: PayoutLine[]
    side_effects: []

  - method: GET
    path: "/network/patients/{id}/sessions"
    description: "List sessions booked for a patient"
    roles: [OpsAdmin, ComplianceOfficer, Clinician, Patient]
    code: 200
    input: ["status?", "billing_state?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/network/clinicians/{id}/continuity-plans"
    description: "List continuity plans owned by a departing clinician"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContinuityPlan[]
    side_effects: []

  - method: GET
    path: "/network/patients/{id}/continuity-plans"
    description: "List continuity plans opened for a patient"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContinuityPlan[]
    side_effects: []

  - method: GET
    path: "/network/payers/{id}/payer-enrollments"
    description: "List the clinician enrollments filed with a payer"
    roles: [OpsAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayerEnrollment[]
    side_effects: []

  # ---------------------------------------------------------------- Test-driving
  - method: POST
    path: "/network/_clock/set_current_utc"
    description: "Set the logical clock. Server default is 2026-09-01T00:00:00Z before any call; the clock never falls back to real wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["re-derives License.verification_status, MalpracticePolicy.policy_status and PatientClient.benefit_status on next read", "fires due ContinuityPlan escalations", "re-evaluates Clinician.billing_posture"]

  - method: POST
    path: "/network/_inject/claim-outcome"
    description: "Deliver a synthetic payer remittance advice without waiting on a payer, so adjudication paths are reachable deterministically."
    roles: [OpsAdmin]
    code: 201
    input: [claim_id, outcome, "denial_code?"]
    output: Claim
    side_effects: ["identical to POST /network/claims/{id}/adjudicate"]

# =============================================================================
# §1.6 Error Code Catalog (29 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or naming an undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The caller's role is not permitted on this endpoint, or an entity_backed role's X-User-ID does not match the owned resource" }
  - { id: ERR_CLINICIAN_NOT_FOUND, http: 404, condition: "No Clinician exists with the given id, or a body-supplied clinician_id does not resolve" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "No License exists with the given id for the given clinician" }
  - { id: ERR_PAYER_NOT_FOUND, http: 404, condition: "No Payer exists with the given id" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "No PayerEnrollment exists with the given id" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "No PatientClient exists with the given id" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "No Session exists with the given id" }
  - { id: ERR_NOTE_NOT_FOUND, http: 404, condition: "No SessionNote exists with the given id for the given session" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No Claim exists with the given id" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "No PayoutBatch exists with the given id" }
  - { id: ERR_CONTINUITY_PLAN_NOT_FOUND, http: 404, condition: "No ContinuityPlan exists with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state from which the requested transition is declared" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "The target resource is in a terminal state and admits no further transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the parent's current version; the client's view is stale" }
  - { id: ERR_CLINICIAN_NOT_BILLABLE, http: 422, condition: "The clinician's billing_posture is GATED or FROZEN at claim submission, resubmission or session completion" }
  - { id: ERR_SERVICE_NOT_ENROLLED, http: 422, condition: "No EFFECTIVE PayerEnrollment for (clinician, payer) covers the service date, or the payer is not ACTIVE, or the cpt_code is absent from the payer's allowed set" }
  - { id: ERR_OUTSIDE_ENROLLMENT_WINDOW, http: 422, condition: "The session's scheduled_start falls before effective_from or at/after effective_to of the only covering enrollment" }
  - { id: ERR_TIMELY_FILING_EXPIRED, http: 422, condition: "The logical clock is at or after the claim's recovery_deadline when resubmission was requested" }
  - { id: ERR_RESUBMISSION_LIMIT_REACHED, http: 422, condition: "The claim's resubmission_count is already 2" }
  - { id: ERR_DOCUMENTATION_MISSING, http: 422, condition: "Session completion or claim submission was requested with no SIGNED SessionNote on the session" }
  - { id: ERR_DURATION_MISMATCH, http: 422, condition: "A SessionNote's duration_minutes differs from the session's scheduled length in minutes" }
  - { id: ERR_NOTE_SUPERSEDED, http: 422, condition: "The newest note for the session is LOCKED and the requested operation needed the newest note to be SIGNED" }
  - { id: ERR_BENEFIT_UNVERIFIED, http: 422, condition: "Session scheduling was requested for a patient whose benefit_status is not VERIFIED" }
  - { id: ERR_NO_ELIGIBLE_CLINICIAN, http: 422, condition: "The patient match produced an empty candidate set" }
  - { id: ERR_MATCH_TIE_UNRESOLVABLE, http: 422, condition: "Two eligible candidates remain tied on specialty overlap, active patient count and created_at" }
  - { id: ERR_CASELOAD_FULL, http: 409, condition: "Continuity acceptance or a match would push the clinician to or past weekly_caseload_target" }
  - { id: ERR_CLINICIAN_SLOT_CONFLICT, http: 409, condition: "The requested interval is not covered by any availability block, or overlaps another non-terminal session on the same clinician" }
  - { id: ERR_PATIENT_DOUBLE_BOOKED, http: 409, condition: "The requested interval overlaps another non-terminal session on the same patient" }
  - { id: ERR_ENROLLMENT_WINDOW_INVALID, http: 422, condition: "effective_to is at or before effective_from, including an exactly zero-length window" }
  - { id: ERR_BATCH_NOT_LOCKABLE, http: 409, condition: "Lock requested before period_end, or with zero non-VOIDED lines, or from a status other than OPEN" }
  - { id: ERR_BATCH_NOT_PAYABLE, http: 409, condition: "Pay requested while a non-VOIDED line is not PENDING or PAID, or from a status other than LOCKED" }
  - { id: ERR_WRITE_OFF_NOT_ALLOWED, http: 409, condition: "Write-off requested strictly before the recovery deadline while fewer than two resubmissions have occurred" }
  - { id: ERR_PAYER_SUSPENDED, http: 409, condition: "The operation requires a payer whose status is ACTIVE but it is SUSPENDED_AT_PAYER or TERMINATED" }
  - { id: ERR_CONTINUITY_DEADLINE_PASSED, http: 409, condition: "Successor assignment requested at or after reassignment_deadline + 7 days for a DECLINED or ESCALATED plan" }
  - { id: ERR_DUPLICATE_RATE, http: 409, condition: "A PayerRate row with the same (payer_id, rate_set_version, license_type, geography, cpt_code, effective_from) already exists" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required body field is missing, a field carries an out-of-enum value, a numeric field is out of range, or an unknown field is supplied" }

# =============================================================================
# §1.7 RBAC Matrix (6 roles; segregation of duties)
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Network operator: onboarding, credentialing administration, enrollment submission, claim submission on clinicians' behalf, payout batch administration, patient registration. Cannot verify a license."
    identity: opaque
    exclusive_operations:
      - "PUT /network/clinicians/{id}"
      - "POST /network/payers"
      - "PATCH /network/payers/{id}"
      - "POST /network/payers/{payer_id}/rates"
      - "POST /network/patients"
      - "POST /network/patients/{id}/match"
      - "POST /network/sessions"
      - "POST /network/sessions/{id}/reopen"
      - "POST /network/claims"
      - "POST /network/claims/{id}/adjudicate"
      - "POST /network/claims/{id}/resubmit"
      - "POST /network/claims/{id}/decide-reprocessing"
      - "POST /network/claims/{id}/write-off"
      - "POST /network/payout-batches"
      - "POST /network/payout-batches/{id}/lock"
      - "POST /network/payout-batches/{id}/pay"
      - "POST /network/payout-batches/{id}/reconcile"
      - "POST /network/payout-batches/{id}/supersede"
      - "POST /network/clinicians/{id}/suspend"
      - "POST /network/clinicians/{id}/reinstate"
      - "POST /network/clinicians/{id}/request-offboarding"
      - "POST /network/clinicians/{id}/cancel-offboarding"
      - "POST /network/clinicians/{id}/complete-offboarding"
      - "POST /network/clinicians/{clinician_id}/licenses"
      - "POST /network/clinicians/{clinician_id}/malpractice-policies"
      - "POST /network/payer-enrollments"
      - "POST /network/payer-enrollments/{id}/activate"
      - "POST /network/payer-enrollments/{id}/reject"
      - "POST /network/payer-enrollments/{id}/suspend"
      - "POST /network/payer-enrollments/{id}/reinstate"
      - "POST /network/payer-enrollments/{id}/terminate"
      - "POST /network/patients/{patient_id}/verification"
      - "POST /network/continuity-plans"
      - "POST /network/continuity-plans/{id}/successor"
      - "POST /network/continuity-plans/{id}/complete"
      - "POST /network/_clock/set_current_utc"
      - "POST /network/_inject/claim-outcome"
    shared_operations:
      - "GET /network/clinicians"
      - "GET /network/clinicians/{id}"
      - "GET /network/clinicians/{clinician_id}/licenses"
      - "GET /network/clinicians/{clinician_id}/malpractice-policies"
      - "GET /network/clinicians/{clinician_id}/continuity-plans"
      - "GET /network/clinicians/{clinician_id}/payout-lines"
      - "GET /network/payers"
      - "GET /network/payers/{id}"
      - "GET /network/payers/{payer_id}/rates"
      - "GET /network/payers/{payer_id}/payer-enrollments"
      - "GET /network/payer-enrollments"
      - "GET /network/payer-enrollments/{id}"
      - "GET /network/patients"
      - "GET /network/patients/{id}"
      - "GET /network/patients/{patient_id}/verification"
      - "GET /network/patients/{patient_id}/sessions"
      - "GET /network/patients/{patient_id}/continuity-plans"
      - "GET /network/sessions"
      - "GET /network/sessions/{id}"
      - "GET /network/sessions/{session_id}/notes"
      - "GET /network/claims"
      - "GET /network/claims/{id}"
      - "GET /network/claims/{id}/payout-line"
      - "GET /network/payout-batches"
      - "GET /network/payout-batches/{id}"
      - "GET /network/payout-batches/{id}/lines"
      - "GET /network/continuity-plans"
      - "GET /network/continuity-plans/{id}"

  - name: ComplianceOfficer
    description: "Credentialing reviewer. Verifies and re-verifies licenses. Excluded from every fiscal operation so that the reviewer and the payer of record are never the same role."
    identity: opaque
    exclusive_operations:
      - "POST /network/clinicians/{id}/submit-credentials"
      - "POST /network/clinicians/{clinician_id}/licenses/{id}/verify"
      - "POST /network/clinicians/{clinician_id}/licenses/{id}/reverify"
      - "POST /network/clinicians/{clinician_id}/licenses/{id}/reset-verification"
    shared_operations:
      - "GET /network/clinicians"
      - "GET /network/clinicians/{id}"
      - "GET /network/clinicians/{clinician_id}/licenses"
      - "GET /network/clinicians/{clinician_id}/malpractice-policies"
      - "GET /network/clinicians/{clinician_id}/continuity-plans"
      - "GET /network/payers"
      - "GET /network/payers/{id}"
      - "GET /network/payers/{payer_id}/rates"
      - "GET /network/payers/{payer_id}/payer-enrollments"
      - "GET /network/payer-enrollments"
      - "GET /network/payer-enrollments/{id}"
      - "GET /network/patients"
      - "GET /network/patients/{id}"
      - "GET /network/patients/{patient_id}/verification"
      - "GET /network/patients/{patient_id}/sessions"
      - "GET /network/patients/{patient_id}/continuity-plans"
      - "GET /network/sessions"
      - "GET /network/sessions/{id}"
      - "GET /network/sessions/{session_id}/notes"
      - "GET /network/claims"
      - "GET /network/claims/{id}"
      - "GET /network/claims/{id}/payout-line"
      - "GET /network/continuity-plans"
      - "GET /network/continuity-plans/{id}"

  - name: Clinician
    description: "Therapist acting on their own schedule and notes. X-User-ID equals the Clinician entity's id."
    identity: entity_backed:Clinician
    exclusive_operations:
      - "POST /network/sessions/{session_id}/notes"
      - "POST /network/sessions/{session_id}/notes/{id}/sign"
      - "POST /network/continuity-plans/{id}/accept"
      - "POST /network/continuity-plans/{id}/decline"
    shared_operations:
      - "POST /network/sessions/{id}/schedule"
      - "POST /network/sessions/{id}/complete"
      - "POST /network/sessions/{id}/cancel"
      - "POST /network/sessions/{id}/reschedule"
      - "GET /network/clinicians/{id}"
      - "GET /network/sessions"
      - "GET /network/sessions/{id}"
      - "GET /network/sessions/{session_id}/notes"
      - "GET /network/patients/{patient_id}/sessions"
      - "GET /network/patients/{patient_id}/continuity-plans"
      - "GET /network/claims/{id}/payout-line"
      - "GET /network/clinicians/{clinician_id}/continuity-plans"
      - "GET /network/clinicians/{clinician_id}/payout-lines"
      - "GET /network/payout-batches/{id}/lines"

  - name: Patient
    description: "The client receiving care. X-User-ID equals the PatientClient entity's id; may read only their own sessions and cost-share quotes."
    identity: entity_backed:PatientClient
    exclusive_operations: []
    shared_operations:
      - "GET /network/sessions"
      - "GET /network/sessions/{id}"
      - "GET /network/patients/{id}"
      - "GET /network/clinicians/{id}"

  - name: PayrollService
    description: "Downstream disbursement integration that executes the payout runs OpsAdmin has authorized. Cannot open, lock or reconcile a batch."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /network/payout-batches/{id}/pay"
      - "GET /network/payout-batches"
      - "GET /network/payout-batches/{id}"
      - "GET /network/payout-batches/{id}/lines"

  - name: Anonymous
    description: "Unauthenticated caller; reaches only the endpoints that exist to prove header handling."
    identity: opaque
    exclusive_operations: []
    shared_operations: []