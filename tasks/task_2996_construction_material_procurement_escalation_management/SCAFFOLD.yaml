scenario: |
  2996. Construction Material Procurement & Escalation Management (general contractor procurement
  group): long-lead item identification with release-for-fabrication dates tied to the schedule,
  escalation clause negotiation with index references, caps and sharing bands, price hold periods,
  quote expiration and early buyout with storage arrangements, material stored off-site with
  bailment, insurance and lien waiver documentation, substitution requests with engineer approval
  and cost/schedule impact, tariff and supply disruption contingency sourcing, buyout log tracking
  committed versus estimated cost, owner change order substantiation for documented escalation

domain_name: construction-material-procurement-escalation
api_prefix: "/procurement"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under /procurement;
  # parentage is expressed purely through FK fields in request bodies and through
  # filtered-list / sub-resource GETs. No entity id is nested inside another entity's
  # collection path except the two audit sub-resources (supplier disruption events,
  # storage-arrangement documents).

  state_machine_shape: cyclic
  # EscalationAgreement cycles PROPOSED -> COUNTERED -> PROPOSED (bounded negotiation rounds);
  # SubstitutionRequest cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED;
  # PurchaseCommitment carries two independent state axes (commitment_status x delivery_posture),
  # and the delivery axis itself cycles STORED_OFFSITE -> STORAGE_NONCOMPLIANT -> STORED_OFFSITE;
  # OffsiteStorageArrangement.status is compound (derived from its StorageDocument children).

  relationship_patterns:
    - one_to_many          # Project -> MaterialPackage -> Quote -> ...
    - self_referential     # Quote.supersedes_quote_id -> Quote.id (revision chain)
    - cross_aggregate      # PurchaseCommitment reads Supplier + IndexReading + MaterialPackage

  role_model: segregation_of_duties
  # The BuyoutManager who prepares an owner change order request may never be the
  # BuyoutManager who submits it to the owner; commitment execution and supplier
  # suspension sit with ProjectExecutive; substitution disposition sits with
  # DesignEngineer; owner disposition sits with OwnerRep.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Project
    parent: null
    common_fields: true
    note: |
      Money ledger hub. All five money/aggregate fields below are `source: computed` and are
      re-derived on every read from the current PurchaseCommitment / MaterialPackage /
      ChangeOrderRequest rows; a pure re-derivation NEVER increments Project.version.
      Project.version increments by exactly 1 only on the transitions whose `side_effects:`
      explicitly say "increments Project.version by 1" (commitment create, commitment commit,
      commitment cancel, and the two escalation-recognition posture transitions). This makes the
      OCC field `expected_project_version` observable and deterministic.
    fields:
      - name: name
        type: string
        source: input
        description: project display name
        constraints: 1..200 chars, non-blank
      - name: contract_number
        type: string
        source: input
        description: prime contract number
        constraints: 1..40 chars, non-blank
      - name: owner_name
        type: string
        source: input
        description: contracting owner's legal name
      - name: schedule_data_date
        type: datetime
        source: input
        description: baseline schedule data date (ISO 8601 UTC, three fractional digits)
      - name: escalation_contingency_budget
        type: number
        source: input
        description: dollars set aside to absorb contractor-borne material escalation
        constraints: "> 0, 2 decimal places"
      - name: estimated_total_cost
        type: number
        source: computed
        description: "sum of MaterialPackage.estimated_cost over every MaterialPackage with project_id == this Project.id (no status filter — all packages count)"
      - name: committed_total_cost
        type: number
        source: computed
        description: "sum of (PurchaseCommitment.committed_base_cost + PurchaseCommitment.escalation_accrued) over commitments whose material package belongs to this project AND commitment_status IN {COMMITTED, CLOSED}"
      - name: buyout_variance
        type: number
        source: computed
        description: "full_program variant of calculations.buyout_variance: estimated_total_cost - committed_total_cost"
      - name: bought_out_variance
        type: number
        source: computed
        description: "bought_out_scope_only variant of calculations.buyout_variance: (sum of estimated_cost over packages with status IN {BOUGHT_OUT, CLOSED}) - committed_total_cost"
      - name: escalation_contingency_committed
        type: number
        source: computed
        description: "sum of PurchaseCommitment.escalation_accrued over commitments whose material package belongs to this project AND commitment_status IN {COMMITTED, CLOSED}"
      - name: escalation_contingency_remaining
        type: number
        source: computed
        description: "escalation_contingency_budget - escalation_contingency_committed"
      - name: change_order_recovered_amount
        type: number
        source: computed
        description: "sum of ChangeOrderRequest.substantiated_amount over change orders on this project's commitments with status == OWNER_APPROVED"

  - name: MaterialPackage
    parent: null
    common_fields: true
    note: "Long-lead identification + schedule anchor. Resource entity with a lifecycle."
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the owning project"
      - name: scope_code
        type: string
        source: input
        description: procurement scope code
        constraints: "unique per project_id (case-sensitive), 1..40 chars"
      - name: description
        type: string
        source: input
        description: scope description
      - name: commodity_index_code
        type: enum
        source: input
        description: the published price index this commodity escalates against
        constraints: "one of {PPI_STEEL_MILL, PPI_COPPER_WIRE, PPI_LUMBER, PPI_CEMENT, PPI_SWITCHGEAR}"
      - name: estimated_cost
        type: number
        source: input
        description: current estimate of record for this package (mutated by applied substitutions)
        constraints: "> 0, 2 decimal places"
      - name: baseline_estimated_cost
        type: number
        source: system
        description: "estimated_cost captured at creation; never mutated afterwards. Anchors the money half of the substitution compensation invariant."
      - name: required_onsite_date
        type: datetime
        source: input
        description: date the material must be on site per the schedule (ISO 8601 UTC)
      - name: fabrication_duration_days
        type: integer
        source: input
        description: shop fabrication duration in calendar days (mutated by applied substitutions)
        constraints: ">= 0, <= 720"
      - name: baseline_fabrication_duration_days
        type: integer
        source: system
        description: "fabrication_duration_days captured at creation; never mutated afterwards. Anchors the schedule half of the substitution compensation invariant."
      - name: delivery_transit_days
        type: integer
        source: input
        description: transit duration in calendar days
        constraints: ">= 0, <= 365"
      - name: submittal_review_days
        type: integer
        source: input
        default: 21
        description: submittal + engineer review duration in calendar days
        constraints: ">= 0, <= 180"
      - name: lead_time_days
        type: integer
        source: computed
        description: "fabrication_duration_days + delivery_transit_days + submittal_review_days"
      - name: release_for_fabrication_date
        type: datetime
        source: computed
        description: "required_onsite_date minus lead_time_days calendar days (see calculations.release_for_fabrication_schedule)"
      - name: is_long_lead
        type: boolean
        source: computed
        description: "(fabrication_duration_days + delivery_transit_days) >= LONG_LEAD_THRESHOLD_DAYS (90). Note submittal_review_days is deliberately EXCLUDED from this test even though it IS included in lead_time_days."
      - name: float_days
        type: integer
        source: computed
        description: "floor((release_for_fabrication_date - current logical clock) / 1 day); may be negative"
      - name: rff_risk_band
        type: enum
        source: computed
        description: "CRITICAL when float_days <= 0; AT_RISK when 1 <= float_days <= 14; ON_TRACK when float_days >= 15"
        constraints: "one of {ON_TRACK, AT_RISK, CRITICAL}"
      - name: open_quote_count
        type: integer
        source: computed
        description: "count of Quote rows with material_package_id == this id AND status == OPEN"
      - name: status
        type: enum
        source: system
        default: IDENTIFIED
        description: "IDENTIFIED at creation; SOURCING on first quote; BOUGHT_OUT on commitment creation; SOURCING_STALLED when the last OPEN quote lapses; CLOSED when its commitment reaches delivery_posture DELIVERED"
        constraints: "one of {IDENTIFIED, SOURCING, BOUGHT_OUT, SOURCING_STALLED, CLOSED}"

  - name: Supplier
    parent: null
    common_fields: true
    note: "Counterparty and identity anchor for the SupplierRep role (X-User-ID == Supplier.id)."
    fields:
      - name: legal_name
        type: string
        source: input
        description: supplier legal name
        constraints: "globally unique (case-sensitive), 1..200 chars"
      - name: country_of_origin
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the producing plant
        constraints: "exactly 2 uppercase letters"
      - name: is_domestic
        type: boolean
        source: computed
        description: "country_of_origin == \"US\""
      - name: declared_tariff_rate_pct
        type: number
        source: input
        default: 0
        description: tariff rate the supplier declares on its imported content
        constraints: ">= 0, <= 100"
      - name: open_disruption_count
        type: integer
        source: computed
        description: "count of DisruptionEvent rows with supplier_id == this id AND status == OPEN AND effective_date <= current logical clock (the snapshot scope; see calculations.supplier_exposure_score)"
      - name: exposure_score_snapshot
        type: number
        source: computed
        description: "the snapshot_exposure variant of calculations.supplier_exposure_score (0..100)"
      - name: exposure_band_snapshot
        type: enum
        source: computed
        description: "HIGH when exposure_score_snapshot >= 60; ELEVATED when 30 <= score < 60; LOW when score < 30"
        constraints: "one of {LOW, ELEVATED, HIGH}"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE at creation; SUSPENDED via POST /procurement/suppliers/{id}/suspend"
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: reason recorded when the supplier was suspended; null while ACTIVE

  - name: Quote
    parent: null
    common_fields: true
    note: "Price hold instrument. Self-referential revision chain via supersedes_quote_id."
    fields:
      - name: material_package_id
        type: string
        source: input
        description: "FK -> MaterialPackage.id; the package being quoted"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the quoting supplier"
      - name: supersedes_quote_id
        type: string
        source: system
        default: null
        description: "FK -> Quote.id; set only by POST /procurement/quotes/{id}/revise, null for an original quote"
      - name: base_price
        type: number
        source: input
        description: quoted lump-sum material price before any escalation
        constraints: "> 0, 2 decimal places"
      - name: received_at
        type: datetime
        source: input
        description: instant the quote was received; must be <= current logical clock
      - name: price_hold_days
        type: integer
        source: input
        description: firm-price hold period in calendar days
        constraints: ">= 1, <= 120"
      - name: expires_at
        type: datetime
        source: computed
        description: "received_at + price_hold_days calendar days. The price-hold interval is HALF-OPEN [received_at, expires_at): the quote is holdable while clock < expires_at."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN at creation; EXPIRED by the clock sweep; SUPERSEDED by revise; CONVERTED when its commitment is committed; back to OPEN or EXPIRED when that commitment is cancelled"
        constraints: "one of {OPEN, EXPIRED, SUPERSEDED, CONVERTED}"

  - name: EscalationAgreement
    parent: null
    common_fields: true
    note: "Negotiated escalation clause attached to one Quote. Cyclic negotiation state machine."
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the quote whose price this clause escalates"
      - name: index_code
        type: enum
        source: input
        description: "published index the clause references; MUST equal the quote's package commodity_index_code"
        constraints: "one of {PPI_STEEL_MILL, PPI_COPPER_WIRE, PPI_LUMBER, PPI_CEMENT, PPI_SWITCHGEAR}"
      - name: baseline_index_period
        type: string
        source: input
        description: "the YYYY-MM period whose published reading is the escalation baseline"
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: baseline_index_value
        type: number
        source: system
        default: null
        description: "IndexReading.value for (index_code, baseline_index_period), frozen at EXECUTE time; null before execution"
      - name: deadband_pct
        type: number
        source: input
        default: 2.0
        description: "index movement below this percentage is absorbed by the supplier (no escalation)"
        constraints: ">= 0, <= 20, 1 decimal place"
      - name: cap_pct
        type: number
        source: input
        description: "maximum escalation percentage payable after the deadband"
        constraints: "> 0, <= 25, 1 decimal place"
      - name: contractor_share_pct
        type: number
        source: input
        description: "sharing band: percentage of the capped escalation borne by the contractor; the remainder (100 - contractor_share_pct) is the owner-borne portion that accrues on the commitment"
        constraints: ">= 0, <= 100, 1 decimal place"
      - name: price_hold_through
        type: datetime
        source: input
        description: "instant through which the supplier holds the base price firm; must be <= the quote's expires_at"
      - name: proposed_terms_note
        type: string
        source: input
        default: null
        description: free-text note recorded with the contractor's latest proposal
      - name: counter_note
        type: string
        source: system
        default: null
        description: free-text note recorded with the supplier's latest counter
      - name: round_number
        type: integer
        source: system
        default: 0
        description: "increments by 1 on every supplier counter; capped at MAX_NEGOTIATION_ROUNDS (3)"
      - name: executed_at
        type: datetime
        source: system
        default: null
        description: instant the clause was executed by the ProjectExecutive; null until EXECUTED
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT at creation; PROPOSED / COUNTERED during negotiation; EXECUTED terminal; LAPSED when the underlying quote expires before execution"
        constraints: "one of {DRAFT, PROPOSED, COUNTERED, EXECUTED, LAPSED}"

  - name: IndexReading
    parent: null
    common_fields: false
    note: "Append-only published index table (configuration/event entity). Only `id` and `created_at` are carried; there is no update or delete endpoint and no version field."
    fields:
      - name: index_code
        type: enum
        source: input
        description: which published index this reading belongs to
        constraints: "one of {PPI_STEEL_MILL, PPI_COPPER_WIRE, PPI_LUMBER, PPI_CEMENT, PPI_SWITCHGEAR}"
      - name: period
        type: string
        source: input
        description: "the calendar month the reading covers, YYYY-MM"
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$; (index_code, period) is globally unique"
      - name: value
        type: number
        source: input
        description: published index value
        constraints: "> 0, 2 decimal places"
      - name: published_at
        type: datetime
        source: input
        description: "instant the reading was published; recorded for audit only — no rule reads it, so readings for future periods may be loaded at any clock position"

  - name: PurchaseCommitment
    parent: null
    common_fields: true
    note: |
      The buyout record. Carries TWO independent state axes on the same row:
      `commitment_status` (contractual) and `delivery_posture` (physical). They advance through
      separate triggers and neither one's terminal value forces the other's.
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the quote being bought out"
      - name: material_package_id
        type: string
        source: system
        description: "FK -> MaterialPackage.id; copied from the quote at creation"
      - name: escalation_agreement_id
        type: string
        source: input
        default: null
        description: "FK -> EscalationAgreement.id; null when the PO carries no escalation clause. Retained for audit even after the clause LAPSES."
      - name: po_number
        type: string
        source: input
        description: purchase order number
        constraints: "globally unique (case-sensitive), 1..40 chars"
      - name: committed_base_cost
        type: number
        source: system
        description: "Quote.base_price snapshotted at creation; immune to any later quote revision"
      - name: is_early_buyout
        type: boolean
        source: input
        default: false
        description: "true when the PO is issued ahead of the schedule-driven need in order to lock the price"
      - name: requires_storage_arrangement
        type: boolean
        source: computed
        description: "equals is_early_buyout. When true, delivery_posture MUST pass through STORED_OFFSITE before DELIVERED."
      - name: commitment_status
        type: enum
        source: system
        default: PENDING
        description: "PENDING at creation; COMMITTED on commit; CLOSED when delivery_posture reaches DELIVERED; CANCELLED by ProjectExecutive; VOIDED by the lapsed-clause cascade"
        constraints: "one of {PENDING, COMMITTED, CLOSED, CANCELLED, VOIDED}"
      - name: delivery_posture
        type: enum
        source: system
        default: SCHEDULED
        description: "SCHEDULED -> RELEASED_FOR_FAB -> FABRICATING -> (STORED_OFFSITE <-> STORAGE_NONCOMPLIANT) -> DELIVERED; reset to SCHEDULED on cancel"
        constraints: "one of {SCHEDULED, RELEASED_FOR_FAB, FABRICATING, STORED_OFFSITE, STORAGE_NONCOMPLIANT, DELIVERED}"
      - name: released_for_fab_at
        type: datetime
        source: system
        default: null
        description: clock instant at which release-for-fabrication was issued; null before release and after cancel
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: clock instant at which the material was accepted on site
      - name: escalation_variant
        type: enum
        source: computed
        default: NONE
        description: "NONE while no clause escalation has been recognized (or after cancel); PROVISIONAL after release-for-fabrication; FINAL after delivery"
        constraints: "one of {NONE, PROVISIONAL, FINAL}"
      - name: escalation_accrued
        type: number
        source: computed
        default: 0
        description: "owner-borne escalation dollars recognized on this commitment per calculations.escalation_adjustment; 0 when escalation_variant == NONE"
      - name: escalation_index_period
        type: string
        source: computed
        default: null
        description: "the YYYY-MM period of the IndexReading actually used for the current escalation_accrued value; null when escalation_variant == NONE"
      - name: cancellation_reason
        type: string
        source: system
        default: null
        description: reason recorded on cancel; null otherwise

  - name: OffsiteStorageArrangement
    parent: null
    common_fields: true
    note: "Bailment / off-site storage record for one commitment. Its `status` is compound — derived from its StorageDocument children."
    fields:
      - name: purchase_commitment_id
        type: string
        source: input
        description: "FK -> PurchaseCommitment.id; the commitment whose material is stored"
      - name: warehouse_name
        type: string
        source: input
        description: "bailee warehouse name; the overlap resource key for calculations/validations that guard warehouse occupancy"
        constraints: "1..120 chars, non-blank, case-sensitive"
      - name: warehouse_address
        type: string
        source: input
        description: bailee warehouse street address
      - name: stored_value
        type: number
        source: input
        description: declared value of the stored material
        constraints: "> 0, 2 decimal places, <= the commitment's committed_base_cost"
      - name: monthly_storage_rate_pct
        type: number
        source: input
        description: monthly storage fee as a percentage of stored_value
        constraints: "> 0, <= 5, up to 4 decimal places"
      - name: stored_from
        type: datetime
        source: input
        description: first instant of the bailment occupancy interval (inclusive)
        constraints: ">= the commitment's released_for_fab_at"
      - name: planned_release_date
        type: datetime
        source: input
        description: last instant of the bailment occupancy interval (INCLUSIVE — the interval is closed)
        constraints: "> stored_from"
      - name: documentation_status
        type: enum
        source: computed
        default: INCOMPLETE
        description: "COMPLETE only when all three mandatory document types are on file and valid per calculations.documentation_completeness; INCOMPLETE otherwise"
        constraints: "one of {INCOMPLETE, COMPLETE}"
      - name: verified_doc_type_count
        type: integer
        source: computed
        description: "how many of the three mandatory doc types {BAILMENT_AGREEMENT, INSURANCE_CERTIFICATE, LIEN_WAIVER} currently have at least one valid document (0..3)"
      - name: carrying_cost_accrued
        type: number
        source: computed
        description: "per calculations.storage_carrying_cost, evaluated as of the carrying-cost as-of instant (frozen instant when set, otherwise the current logical clock)"
      - name: carrying_cost_frozen_at
        type: datetime
        source: system
        default: null
        description: "instant at which carrying-cost accrual stopped (set when the arrangement is RELEASED); null while accrual is live"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT at creation; auto ACTIVE when documentation_status becomes COMPLETE; auto SUSPENDED when it falls back to INCOMPLETE; RELEASED when the commitment is DELIVERED"
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, RELEASED}"

  - name: StorageDocument
    parent: null
    common_fields: true
    note: "Bailment / insurance / lien-waiver evidence. Append-and-revoke; never hard-deleted."
    fields:
      - name: storage_arrangement_id
        type: string
        source: system
        description: "FK -> OffsiteStorageArrangement.id; taken from the path of the creating call"
      - name: doc_type
        type: enum
        source: input
        description: document kind
        constraints: "one of {BAILMENT_AGREEMENT, INSURANCE_CERTIFICATE, LIEN_WAIVER, INVENTORY_TAG_PHOTO}"
      - name: reference_number
        type: string
        source: input
        description: document reference / policy number
        constraints: "1..60 chars, non-blank"
      - name: effective_date
        type: datetime
        source: input
        description: first instant the document is effective (inclusive)
      - name: expires_at
        type: datetime
        source: input
        description: "instant the document ceases to be effective (EXCLUSIVE — validity window is half-open [effective_date, expires_at))"
        constraints: "> effective_date"
      - name: coverage_amount
        type: number
        source: input
        default: 0
        description: "insured value; must be >= the arrangement's stored_value when doc_type == INSURANCE_CERTIFICATE"
        constraints: ">= 0, 2 decimal places"
      - name: verified
        type: boolean
        source: input
        default: false
        description: whether the procurement group has verified the document against the original
      - name: revoked
        type: boolean
        source: system
        default: false
        description: true once revoked; a revoked document never counts toward documentation_completeness
      - name: revoked_at
        type: datetime
        source: system
        default: null
        description: clock instant of revocation; null while not revoked
      - name: revocation_reason
        type: string
        source: system
        default: null
        description: reason recorded on revoke; null while not revoked

  - name: SubstitutionRequest
    parent: null
    common_fields: true
    note: "Engineer-approved product substitution, also the vehicle for tariff / supply-disruption contingency sourcing. Cyclic revision loop plus branching disposition."
    fields:
      - name: material_package_id
        type: string
        source: input
        description: "FK -> MaterialPackage.id; the package whose product is being substituted"
      - name: proposed_supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier of the proposed substitute"
      - name: disruption_event_id
        type: string
        source: input
        default: null
        description: "FK -> DisruptionEvent.id; REQUIRED when driver == DISRUPTION_CONTINGENCY, MUST be null otherwise"
      - name: driver
        type: enum
        source: input
        description: why the substitution is proposed
        constraints: "one of {VALUE_ENGINEERING, DISRUPTION_CONTINGENCY, AVAILABILITY}"
      - name: proposed_product
        type: string
        source: input
        description: proposed substitute product description
        constraints: "1..200 chars, non-blank"
      - name: cost_delta
        type: number
        source: input
        description: "signed dollar impact on the package estimate (negative = credit)"
        constraints: "2 decimal places, absolute value <= 5000000"
      - name: schedule_delta_days
        type: integer
        source: input
        description: "signed calendar-day impact on fabrication_duration_days (negative = recovery)"
        constraints: ">= -180, <= 180"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BuyoutManager who created (or last resubmitted) the request; opaque operator id, not an entity id"
      - name: engineer_conditions
        type: string
        source: system
        default: null
        description: "conditions recorded by the DesignEngineer; REQUIRED (non-blank) for the APPROVED_AS_NOTED branch"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "increments by 1 on every resubmit; capped at MAX_SUBSTITUTION_ROUNDS (2)"
      - name: applied_cost_delta
        type: number
        source: system
        default: 0
        description: "cost_delta actually applied to the package (0 until approved, 0 again after rescission)"
      - name: applied_schedule_delta_days
        type: integer
        source: system
        default: 0
        description: "schedule delta actually applied to the package (0 for the APPROVED_AS_NOTED branch, 0 again after rescission)"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "SUBMITTED at creation and after resubmit; APPROVED / APPROVED_AS_NOTED / REJECTED / REVISION_REQUESTED by engineer disposition; RESCINDED when an approval is withdrawn"
        constraints: "one of {SUBMITTED, APPROVED, APPROVED_AS_NOTED, REJECTED, REVISION_REQUESTED, RESCINDED}"

  - name: ChangeOrderRequest
    parent: null
    common_fields: true
    note: "Owner change order substantiating documented escalation. Segregation of duties: preparer != submitter."
    fields:
      - name: purchase_commitment_id
        type: string
        source: input
        description: "FK -> PurchaseCommitment.id; the commitment whose FINAL escalation is being substantiated"
      - name: claimed_amount
        type: number
        source: input
        description: dollars claimed from the owner
        constraints: "> 0, 2 decimal places"
      - name: narrative
        type: string
        source: input
        description: substantiation narrative
        constraints: "1..2000 chars, non-blank"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BuyoutManager who created the request; opaque operator id, not an entity id"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the BuyoutManager who submitted it to the owner; MUST differ from prepared_by_user_id"
      - name: gross_documented_amount
        type: number
        source: computed
        description: "the commitment's escalation_accrued at the instant the change order was created, frozen (see calculations.substantiated_escalation_amount)"
      - name: admin_fee_pct
        type: number
        source: computed
        description: "the fee tier percentage selected from gross_documented_amount (NOT from the running total)"
      - name: admin_fee_amount
        type: number
        source: computed
        description: "round(gross_documented_amount * admin_fee_pct, 2)"
      - name: substantiated_amount
        type: number
        source: computed
        description: "min(round(gross_documented_amount + admin_fee_amount, 2), claimed_amount)"
      - name: owner_note
        type: string
        source: system
        default: null
        description: note recorded by the OwnerRep at disposition
      - name: status
        type: enum
        source: system
        default: PREPARED
        description: "PREPARED at creation; SUBMITTED on submit; OWNER_APPROVED / OWNER_REJECTED at owner disposition"
        constraints: "one of {PREPARED, SUBMITTED, OWNER_APPROVED, OWNER_REJECTED}"

  - name: DisruptionEvent
    parent: null
    common_fields: true
    note: "Tariff / supply-disruption record against one supplier. Feeds both exposure variants."
    fields:
      - name: supplier_id
        type: string
        source: system
        description: "FK -> Supplier.id; taken from the path of the creating call"
      - name: event_type
        type: enum
        source: input
        description: disruption kind
        constraints: "one of {TARIFF_IMPOSED, PLANT_SHUTDOWN, PORT_CONGESTION, FORCE_MAJEURE}"
      - name: tariff_rate_pct
        type: number
        source: input
        default: 0
        description: "imposed tariff rate; only read when event_type == TARIFF_IMPOSED"
        constraints: ">= 0, <= 100"
      - name: effective_date
        type: datetime
        source: input
        description: "instant the disruption takes effect; MAY be in the future relative to the logical clock — this is exactly what separates the two exposure variants"
      - name: description
        type: string
        source: input
        description: disruption description
        constraints: "1..500 chars, non-blank"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN at creation; MITIGATED when a DISRUPTION_CONTINGENCY substitution referencing it is approved"
        constraints: "one of {OPEN, MITIGATED}"
      - name: mitigated_at
        type: datetime
        source: system
        default: null
        description: clock instant of mitigation; null while OPEN

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: MaterialPackage
    initial_state: IDENTIFIED
    terminal_states: [CLOSED]
    transitions:
      - from: IDENTIFIED
        to: SOURCING
        trigger: "POST /procurement/quotes (system side effect of the first quote landing on this package)"
        actor: system
        preconditions: ["MaterialPackage.status == IDENTIFIED"]
        side_effects:
          - "recomputes MaterialPackage.open_quote_count"
        note: "A quote landing on a package already in SOURCING leaves status untouched."
      - from: SOURCING_STALLED
        to: SOURCING
        trigger: "POST /procurement/quotes (a fresh OPEN quote revives a stalled package)"
        actor: system
        preconditions: ["MaterialPackage.status == SOURCING_STALLED"]
        side_effects:
          - "recomputes MaterialPackage.open_quote_count"
      - from: SOURCING
        to: BOUGHT_OUT
        trigger: "POST /procurement/purchase-commitments"
        actor: system
        preconditions:
          - "no other PurchaseCommitment on this package has commitment_status IN {PENDING, COMMITTED}"
        side_effects:
          - "recomputes Project.committed_total_cost / buyout_variance / bought_out_variance on read"
      - from: SOURCING_STALLED
        to: BOUGHT_OUT
        trigger: "POST /procurement/purchase-commitments"
        actor: system
        preconditions:
          - "no other PurchaseCommitment on this package has commitment_status IN {PENDING, COMMITTED}"
          - "the referenced Quote.status == OPEN (a stalled package can still be bought out from a quote created after the stall)"
        side_effects: ["recomputes Project.bought_out_variance on read"]
      - from: SOURCING
        to: SOURCING_STALLED
        trigger: "POST /procurement/_clock/set_current_utc (stall sweep, runs once after all four cascade hops)"
        actor: system
        preconditions: ["MaterialPackage.open_quote_count == 0 after the sweep"]
        side_effects: ["appends the package id to the clock response's stalled_package_ids"]
      - from: BOUGHT_OUT
        to: SOURCING
        trigger: "cascade hop 4 of the clock sweep, or POST /procurement/purchase-commitments/{id}/cancel"
        actor: system
        preconditions:
          - "the package's only PENDING/COMMITTED commitment just became VOIDED or CANCELLED"
          - "MaterialPackage.open_quote_count >= 1 after that hop"
        side_effects: ["recomputes Project.committed_total_cost / bought_out_variance on read"]
      - from: BOUGHT_OUT
        to: SOURCING_STALLED
        trigger: "cascade hop 4 of the clock sweep, or POST /procurement/purchase-commitments/{id}/cancel"
        actor: system
        preconditions:
          - "the package's only PENDING/COMMITTED commitment just became VOIDED or CANCELLED"
          - "MaterialPackage.open_quote_count == 0 after that hop"
        side_effects: ["recomputes Project.committed_total_cost / bought_out_variance on read"]
      - from: BOUGHT_OUT
        to: CLOSED
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == DELIVERED"
        actor: system
        preconditions: ["the commitment on this package reached delivery_posture DELIVERED"]
        side_effects:
          - "the package's estimated_cost is frozen for buyout_variance purposes (no further substitution may be applied — see validations priority 55)"

  - entity: Quote
    initial_state: OPEN
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: EXPIRED
        trigger: "POST /procurement/_clock/set_current_utc — cascade hop 1: every OPEN quote whose expires_at <= to_iso8601, processed in created_at ASC order"
        actor: system
        preconditions: ["Quote.status == OPEN", "to_iso8601 >= Quote.expires_at"]
        side_effects:
          - "cascade hop 2: every EscalationAgreement with quote_id == this quote and status IN {DRAFT, PROPOSED, COUNTERED} transitions to LAPSED"
          - "recomputes MaterialPackage.open_quote_count"
          - "appends the quote id to the clock response's expired_quote_ids"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /procurement/quotes/{id}/revise"
        actor: SupplierRep
        preconditions: ["Quote.status == OPEN", "X-User-ID == Quote.supplier_id"]
        side_effects:
          - "creates a new Quote with supersedes_quote_id == this quote's id, status OPEN, and its own received_at / price_hold_days / expires_at"
          - "the new quote is exempt from the price-hold overlap check against the quote it supersedes (validations priority 75)"
          - "recomputes MaterialPackage.open_quote_count"
      - from: OPEN
        to: CONVERTED
        trigger: "POST /procurement/purchase-commitments/{id}/commit"
        actor: system
        preconditions: ["Quote.status == OPEN", "current clock < Quote.expires_at"]
        side_effects:
          - "recomputes MaterialPackage.open_quote_count (a CONVERTED quote no longer counts as OPEN)"
      - from: CONVERTED
        to: OPEN
        trigger: "POST /procurement/purchase-commitments/{id}/cancel"
        actor: system
        preconditions: ["current clock < Quote.expires_at"]
        side_effects: ["recomputes MaterialPackage.open_quote_count"]
        note: "Conditional cascade: the quote returns to the market only while its price hold is still live."
      - from: CONVERTED
        to: EXPIRED
        trigger: "POST /procurement/purchase-commitments/{id}/cancel"
        actor: system
        preconditions: ["current clock >= Quote.expires_at"]
        side_effects: ["recomputes MaterialPackage.open_quote_count"]

  - entity: EscalationAgreement
    initial_state: DRAFT
    terminal_states: [EXECUTED, LAPSED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /procurement/escalation-agreements/{id}/propose"
        actor: BuyoutManager
        preconditions:
          - "EscalationAgreement.status == DRAFT"
          - "the underlying Quote.status == OPEN"
        side_effects:
          - "overwrites cap_pct / contractor_share_pct / deadband_pct / proposed_terms_note with any supplied values"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /procurement/escalation-agreements/{id}/counter"
        actor: SupplierRep
        preconditions:
          - "EscalationAgreement.status == PROPOSED"
          - "X-User-ID == the supplier_id of the agreement's Quote"
          - "round_number < MAX_NEGOTIATION_ROUNDS (3)"
          - "the counter is responsive: cap_pct > current cap_pct OR contractor_share_pct < current contractor_share_pct"
        side_effects:
          - "increments EscalationAgreement.round_number by 1"
          - "overwrites cap_pct / contractor_share_pct / deadband_pct / counter_note with the supplied values"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /procurement/escalation-agreements/{id}/propose"
        actor: BuyoutManager
        preconditions:
          - "EscalationAgreement.status == COUNTERED"
          - "the underlying Quote.status == OPEN"
        side_effects:
          - "overwrites cap_pct / contractor_share_pct / deadband_pct / proposed_terms_note with any supplied values"
        note: "This is the cycle: PROPOSED -> COUNTERED -> PROPOSED, bounded by round_number."
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /procurement/escalation-agreements/{id}/execute"
        actor: ProjectExecutive
        preconditions:
          - "EscalationAgreement.status == PROPOSED"
          - "the underlying Quote.status == OPEN (cross-entity gate)"
          - "an IndexReading exists for (index_code, baseline_index_period)"
        side_effects:
          - "freezes baseline_index_value from that IndexReading.value (version-pinning of the reference reading)"
          - "sets executed_at to the current logical clock"
      - from: DRAFT
        to: LAPSED
        trigger: "POST /procurement/_clock/set_current_utc — cascade hop 2, because the underlying quote just EXPIRED"
        actor: system
        preconditions: ["the agreement's Quote transitioned OPEN -> EXPIRED in cascade hop 1"]
        side_effects:
          - "cascade hop 3: every PurchaseCommitment with escalation_agreement_id == this agreement and commitment_status == PENDING transitions to VOIDED"
          - "appends the agreement id to the clock response's lapsed_agreement_ids"
      - from: PROPOSED
        to: LAPSED
        trigger: "POST /procurement/_clock/set_current_utc — cascade hop 2, because the underlying quote just EXPIRED"
        actor: system
        preconditions: ["the agreement's Quote transitioned OPEN -> EXPIRED in cascade hop 1"]
        side_effects:
          - "cascade hop 3: every PurchaseCommitment with escalation_agreement_id == this agreement and commitment_status == PENDING transitions to VOIDED"
          - "appends the agreement id to the clock response's lapsed_agreement_ids"
      - from: COUNTERED
        to: LAPSED
        trigger: "POST /procurement/_clock/set_current_utc — cascade hop 2, because the underlying quote just EXPIRED"
        actor: system
        preconditions: ["the agreement's Quote transitioned OPEN -> EXPIRED in cascade hop 1"]
        side_effects:
          - "cascade hop 3: every PurchaseCommitment with escalation_agreement_id == this agreement and commitment_status == PENDING transitions to VOIDED"
          - "appends the agreement id to the clock response's lapsed_agreement_ids"

  # PurchaseCommitment carries PARALLEL STATE DIMENSIONS: two independent axes on one row,
  # declared as two state_machines entries for the same entity. Axis A is the contractual axis
  # `commitment_status`; axis B is the physical axis `delivery_posture`. The two state-name sets
  # are disjoint, so a transition name is unambiguous across both entries. Axis B advances only
  # through POST .../delivery-posture plus the two system cascades; axis A advances only through
  # commit / cancel / the lapsed-clause cascade. Reaching a terminal value on axis A does NOT move
  # axis B, and vice versa — except for the two explicitly documented couplings (posture DELIVERED
  # closes axis A; cancel resets axis B to SCHEDULED).
  - entity: PurchaseCommitment
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED, VOIDED]
    note: "Axis A of two parallel dimensions — the contractual axis, persisted in PurchaseCommitment.commitment_status."
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "POST /procurement/purchase-commitments/{id}/commit"
        actor: ProjectExecutive
        preconditions:
          - "commitment_status == PENDING"
          - "the Quote.status == OPEN AND current clock < Quote.expires_at"
          - "when escalation_agreement_id is not null: that agreement's status == EXECUTED (cross-entity gate)"
          - "the Quote's Supplier.status == ACTIVE (cross-entity gate)"
        side_effects:
          - "Quote transitions OPEN -> CONVERTED"
          - "increments Project.version by 1"
          - "recomputes Project.committed_total_cost / buyout_variance / bought_out_variance on read"
      - from: COMMITTED
        to: CLOSED
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == DELIVERED"
        actor: system
        preconditions: ["delivery_posture reached DELIVERED"]
        side_effects:
          - "MaterialPackage transitions BOUGHT_OUT -> CLOSED"
          - "any OffsiteStorageArrangement on this commitment with status == ACTIVE transitions to RELEASED and its carrying_cost_frozen_at is set to the current clock"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /procurement/purchase-commitments/{id}/cancel"
        actor: ProjectExecutive
        preconditions: ["commitment_status == PENDING"]
        side_effects:
          - "records cancellation_reason"
          - "increments Project.version by 1"
          - "MaterialPackage leaves BOUGHT_OUT for SOURCING or SOURCING_STALLED per its open_quote_count"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /procurement/purchase-commitments/{id}/cancel"
        actor: ProjectExecutive
        preconditions:
          - "commitment_status == COMMITTED"
          - "delivery_posture IN {SCHEDULED, RELEASED_FOR_FAB} (material not yet in fabrication)"
        side_effects:
          - "COMPENSATION: escalation_accrued -> 0, escalation_variant -> NONE, escalation_index_period -> null, released_for_fab_at -> null, delivery_posture -> SCHEDULED"
          - "Quote transitions CONVERTED -> OPEN when clock < expires_at, else CONVERTED -> EXPIRED"
          - "increments Project.version by 1"
          - "restores Project.escalation_contingency_committed / escalation_contingency_remaining to their pre-release values (contingency conservation invariant)"
          - "MaterialPackage leaves BOUGHT_OUT for SOURCING or SOURCING_STALLED per its open_quote_count"
      - from: PENDING
        to: VOIDED
        trigger: "POST /procurement/_clock/set_current_utc — cascade hop 3, because the attached escalation clause just LAPSED"
        actor: system
        preconditions:
          - "commitment_status == PENDING"
          - "escalation_agreement_id is not null AND that agreement transitioned to LAPSED in cascade hop 2"
        side_effects:
          - "cascade hop 4: the MaterialPackage transitions BOUGHT_OUT -> SOURCING, or BOUGHT_OUT -> SOURCING_STALLED when the package has no OPEN quote left"
          - "escalation_agreement_id is retained for audit"
          - "appends the commitment id to the clock response's voided_commitment_ids"

  - entity: PurchaseCommitment
    initial_state: SCHEDULED
    terminal_states: [DELIVERED]
    note: "Axis B of two parallel dimensions — the physical axis, persisted in PurchaseCommitment.delivery_posture. Independent of axis A except for the two documented couplings."
    transitions:
      - from: SCHEDULED
        to: RELEASED_FOR_FAB
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == RELEASED_FOR_FAB"
        actor: BuyoutManager
        preconditions:
          - "commitment_status == COMMITTED"
          - "delivery_posture == SCHEDULED"
          - "when escalation_agreement_id is not null: an IndexReading exists for (agreement.index_code, period <= the YYYY-MM of the current clock)"
          - "the resulting provisional escalation must fit inside Project.escalation_contingency_remaining"
        side_effects:
          - "sets released_for_fab_at to the current logical clock"
          - "runs calculations.escalation_adjustment variant provisional_at_release: sets escalation_variant -> PROVISIONAL, escalation_accrued, escalation_index_period"
          - "increments Project.version by 1"
          - "recomputes Project.escalation_contingency_committed / escalation_contingency_remaining / committed_total_cost on read"
      - from: RELEASED_FOR_FAB
        to: FABRICATING
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == FABRICATING"
        actor: BuyoutManager
        preconditions: ["commitment_status == COMMITTED", "delivery_posture == RELEASED_FOR_FAB"]
        side_effects: ["refreshes updated_at only"]
      - from: FABRICATING
        to: STORED_OFFSITE
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == STORED_OFFSITE"
        actor: BuyoutManager
        preconditions:
          - "commitment_status == COMMITTED"
          - "delivery_posture == FABRICATING"
          - "an OffsiteStorageArrangement exists with purchase_commitment_id == this commitment, status == ACTIVE and documentation_status == COMPLETE (cross-entity gate)"
          - "current logical clock >= that arrangement's stored_from"
        side_effects: ["refreshes updated_at only"]
      - from: FABRICATING
        to: DELIVERED
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == DELIVERED"
        actor: BuyoutManager
        preconditions:
          - "commitment_status == COMMITTED"
          - "delivery_posture == FABRICATING"
          - "requires_storage_arrangement == false (an early-buyout PO may not skip the off-site storage step)"
          - "when escalation_agreement_id is not null: an IndexReading exists for (agreement.index_code, period == the YYYY-MM of the current clock)"
        side_effects:
          - "sets delivered_at to the current logical clock"
          - "runs calculations.escalation_adjustment variant final_at_delivery: sets escalation_variant -> FINAL and overwrites escalation_accrued / escalation_index_period"
          - "increments Project.version by 1"
          - "commitment_status COMMITTED -> CLOSED, MaterialPackage BOUGHT_OUT -> CLOSED"
      - from: STORED_OFFSITE
        to: DELIVERED
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == DELIVERED"
        actor: BuyoutManager
        preconditions:
          - "commitment_status == COMMITTED"
          - "delivery_posture == STORED_OFFSITE"
          - "when escalation_agreement_id is not null: an IndexReading exists for (agreement.index_code, period == the YYYY-MM of the current clock)"
        side_effects:
          - "sets delivered_at to the current logical clock"
          - "runs calculations.escalation_adjustment variant final_at_delivery: sets escalation_variant -> FINAL and overwrites escalation_accrued / escalation_index_period"
          - "increments Project.version by 1"
          - "commitment_status COMMITTED -> CLOSED, MaterialPackage BOUGHT_OUT -> CLOSED"
          - "the ACTIVE OffsiteStorageArrangement transitions to RELEASED, its carrying_cost_frozen_at is set to the current clock, and calculations.storage_carrying_cost is frozen at that instant"
      - from: STORED_OFFSITE
        to: STORAGE_NONCOMPLIANT
        trigger: "POST /procurement/storage-documents/{id}/revoke — cascade hop 3, because the arrangement just fell out of documentation compliance"
        actor: system
        preconditions:
          - "delivery_posture == STORED_OFFSITE"
          - "the arrangement transitioned ACTIVE -> SUSPENDED in cascade hop 2"
        side_effects:
          - "commitment_status is deliberately NOT touched — the contractual axis stays COMMITTED"
      - from: STORAGE_NONCOMPLIANT
        to: STORED_OFFSITE
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == STORED_OFFSITE"
        actor: BuyoutManager
        preconditions:
          - "commitment_status == COMMITTED"
          - "delivery_posture == STORAGE_NONCOMPLIANT"
          - "the arrangement is back to status == ACTIVE and documentation_status == COMPLETE"
        side_effects: ["refreshes updated_at only"]
        note: "Cycle on the delivery axis: STORED_OFFSITE -> STORAGE_NONCOMPLIANT -> STORED_OFFSITE."

  - entity: OffsiteStorageArrangement
    initial_state: DRAFT
    terminal_states: [RELEASED]
    note: "COMPOUND: status is a function of the arrangement's StorageDocument children via calculations.documentation_completeness."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /procurement/storage-arrangements/{id}/documents (bubble-up: the document that completes the mandatory set)"
        actor: system
        preconditions: ["calculations.documentation_completeness yields COMPLETE"]
        side_effects: ["sets documentation_status -> COMPLETE and verified_doc_type_count -> 3"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /procurement/storage-documents/{id}/revoke — cascade hop 2, because a mandatory document was just revoked"
        actor: system
        preconditions: ["calculations.documentation_completeness yields INCOMPLETE after the revocation"]
        side_effects:
          - "sets documentation_status -> INCOMPLETE and decrements verified_doc_type_count"
          - "cascade hop 3: the linked PurchaseCommitment with delivery_posture == STORED_OFFSITE transitions to STORAGE_NONCOMPLIANT"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /procurement/storage-arrangements/{id}/documents (a replacement document restores the mandatory set)"
        actor: system
        preconditions: ["calculations.documentation_completeness yields COMPLETE again"]
        side_effects: ["sets documentation_status -> COMPLETE and verified_doc_type_count -> 3"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /procurement/purchase-commitments/{id}/delivery-posture with to_posture == DELIVERED"
        actor: system
        preconditions: ["the linked commitment reached delivery_posture DELIVERED"]
        side_effects:
          - "sets carrying_cost_frozen_at to the current clock, freezing calculations.storage_carrying_cost"

  - entity: SubstitutionRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RESCINDED]
    note: "BRANCHING fork with divergent side-effect sets per branch, plus a revision cycle."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /procurement/substitution-requests/{id}/disposition with disposition == APPROVED"
        actor: DesignEngineer
        preconditions:
          - "SubstitutionRequest.status == SUBMITTED"
          - "the MaterialPackage.status != CLOSED"
          - "the proposed Supplier's forward_exposure band != HIGH (cross-entity gate on the FORWARD variant, not the snapshot field)"
        side_effects:
          - "sets applied_cost_delta = cost_delta and applied_schedule_delta_days = schedule_delta_days"
          - "cascade hop 2: MaterialPackage.estimated_cost += applied_cost_delta and fabrication_duration_days += applied_schedule_delta_days"
          - "cascade hop 3: MaterialPackage.lead_time_days / release_for_fabrication_date / float_days / rff_risk_band are re-derived from the mutated durations"
          - "when driver == DISRUPTION_CONTINGENCY: the referenced DisruptionEvent transitions OPEN -> MITIGATED"
          - "recomputes Project.estimated_total_cost / buyout_variance on read"
      - from: SUBMITTED
        to: APPROVED_AS_NOTED
        trigger: "POST /procurement/substitution-requests/{id}/disposition with disposition == APPROVED_AS_NOTED"
        actor: DesignEngineer
        preconditions:
          - "SubstitutionRequest.status == SUBMITTED"
          - "the MaterialPackage.status != CLOSED"
          - "engineer_conditions is supplied and non-blank"
          - "the proposed Supplier's forward_exposure band != HIGH"
        side_effects:
          - "DIVERGENT BRANCH: sets applied_cost_delta = cost_delta but applied_schedule_delta_days = 0 — the engineer's conditions forbid any schedule impact"
          - "cascade hop 2: MaterialPackage.estimated_cost += applied_cost_delta; fabrication_duration_days is left untouched"
          - "when driver == DISRUPTION_CONTINGENCY: the referenced DisruptionEvent transitions OPEN -> MITIGATED"
          - "recomputes Project.estimated_total_cost / buyout_variance on read"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /procurement/substitution-requests/{id}/disposition with disposition == REJECTED"
        actor: DesignEngineer
        preconditions: ["SubstitutionRequest.status == SUBMITTED"]
        side_effects:
          - "DIVERGENT BRANCH: applied_cost_delta and applied_schedule_delta_days both stay 0; the MaterialPackage and the DisruptionEvent are untouched"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /procurement/substitution-requests/{id}/disposition with disposition == REVISION_REQUESTED"
        actor: DesignEngineer
        preconditions:
          - "SubstitutionRequest.status == SUBMITTED"
          - "revision_round < MAX_SUBSTITUTION_ROUNDS (2)"
        side_effects:
          - "DIVERGENT BRANCH: records engineer_conditions when supplied; no package mutation"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /procurement/substitution-requests/{id}/resubmit"
        actor: BuyoutManager
        preconditions: ["SubstitutionRequest.status == REVISION_REQUESTED"]
        side_effects:
          - "increments revision_round by 1"
          - "overwrites proposed_product / cost_delta / schedule_delta_days and submitted_by_user_id"
        note: "This is the cycle: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /procurement/substitution-requests/{id}/rescind"
        actor: BuyoutManager
        preconditions:
          - "SubstitutionRequest.status == APPROVED"
          - "the MaterialPackage.status != CLOSED"
        side_effects:
          - "COMPENSATION: MaterialPackage.estimated_cost -= applied_cost_delta and fabrication_duration_days -= applied_schedule_delta_days"
          - "re-derives MaterialPackage.lead_time_days / release_for_fabrication_date / float_days / rff_risk_band"
          - "sets applied_cost_delta -> 0 and applied_schedule_delta_days -> 0"
          - "the schedule-days conservation invariant must hold exactly afterwards (see calculations.release_for_fabrication_schedule)"
      - from: APPROVED_AS_NOTED
        to: RESCINDED
        trigger: "POST /procurement/substitution-requests/{id}/rescind"
        actor: BuyoutManager
        preconditions:
          - "SubstitutionRequest.status == APPROVED_AS_NOTED"
          - "the MaterialPackage.status != CLOSED"
        side_effects:
          - "COMPENSATION: MaterialPackage.estimated_cost -= applied_cost_delta (applied_schedule_delta_days is already 0)"
          - "sets applied_cost_delta -> 0"

  - entity: ChangeOrderRequest
    initial_state: PREPARED
    terminal_states: [OWNER_APPROVED, OWNER_REJECTED]
    transitions:
      - from: PREPARED
        to: SUBMITTED
        trigger: "POST /procurement/change-order-requests/{id}/submit"
        actor: BuyoutManager
        preconditions:
          - "ChangeOrderRequest.status == PREPARED"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "the commitment's escalation_variant == FINAL and gross_documented_amount > 0"
        side_effects: ["records submitted_by_user_id"]
      - from: SUBMITTED
        to: OWNER_APPROVED
        trigger: "POST /procurement/change-order-requests/{id}/disposition with disposition == APPROVED"
        actor: OwnerRep
        preconditions: ["ChangeOrderRequest.status == SUBMITTED"]
        side_effects:
          - "records owner_note"
          - "recomputes Project.change_order_recovered_amount on read (Project.escalation_contingency_committed is deliberately NOT reduced — owner recovery and contractor contingency are separate ledgers)"
      - from: SUBMITTED
        to: OWNER_REJECTED
        trigger: "POST /procurement/change-order-requests/{id}/disposition with disposition == REJECTED"
        actor: OwnerRep
        preconditions: ["ChangeOrderRequest.status == SUBMITTED"]
        side_effects:
          - "records owner_note; Project.change_order_recovered_amount is unchanged"

  - entity: DisruptionEvent
    initial_state: OPEN
    terminal_states: [MITIGATED]
    transitions:
      - from: OPEN
        to: MITIGATED
        trigger: "POST /procurement/substitution-requests/{id}/disposition with disposition IN {APPROVED, APPROVED_AS_NOTED} on a request whose driver == DISRUPTION_CONTINGENCY"
        actor: system
        preconditions: ["DisruptionEvent.status == OPEN", "the approved request's disruption_event_id == this event's id"]
        side_effects:
          - "sets mitigated_at to the current logical clock"
          - "recomputes the supplier's open_disruption_count / exposure_score_snapshot / exposure_band_snapshot on read"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: commitment-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /procurement/purchase-commitments"
    occ_field: "expected_project_version"
    description: |
      Issuing a PurchaseCommitment against a Project whose version has advanced since the client
      last read it is rejected. A project legitimately carries many commitments, so the second
      create is not blocked by any state precondition — but each successful create consumes part
      of the shared escalation contingency and advances Project.version, so a client working from
      a stale view of the buyout log must re-read the project before committing more scope.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: release_for_fabrication_schedule
    trigger: |
      On POST /procurement/material-packages, on PATCH /procurement/material-packages/{id}, and as a
      side effect of the SubstitutionRequest transitions SUBMITTED -> APPROVED, SUBMITTED ->
      APPROVED_AS_NOTED and APPROVED|APPROVED_AS_NOTED -> RESCINDED (all of which mutate
      fabrication_duration_days and/or estimated_cost).
    algorithm: threshold
    formula: |
      lead_time_days = submittal_review_days + fabrication_duration_days + delivery_transit_days

      # Long-lead classification deliberately EXCLUDES submittal_review_days: only the
      # fabrication+transit span is treated as market lead time.
      is_long_lead = (fabrication_duration_days + delivery_transit_days) >= LONG_LEAD_THRESHOLD_DAYS

      release_for_fabrication_date = required_onsite_date - lead_time_days days
      float_days = whole_days_between(current_logical_clock, release_for_fabrication_date)
                   # = floor((release_for_fabrication_date - current_logical_clock) / 1 day)
                   # negative when the release date is already in the past

      rff_risk_band =
        CRITICAL  if float_days <= RFF_CRITICAL_FLOAT_DAYS            # <= 0
        AT_RISK   if RFF_CRITICAL_FLOAT_DAYS < float_days <= RFF_AT_RISK_FLOAT_DAYS   # 1..14
        ON_TRACK  otherwise                                            # >= 15
    input_set: |
      Single MaterialPackage row plus the current logical clock. No aggregation. `float_days` and
      `rff_risk_band` are recomputed on every read of the package (source: computed), so the same
      package reports a different band after POST /procurement/_clock/set_current_utc without any
      write to the package itself. `release_for_fabrication_date`, `lead_time_days` and
      `is_long_lead` are clock-independent.
    constants:
      LONG_LEAD_THRESHOLD_DAYS: 90
      RFF_CRITICAL_FLOAT_DAYS: 0
      RFF_AT_RISK_FLOAT_DAYS: 14
    precision: "whole days, floor toward negative infinity; dates rendered as ISO-8601 UTC instants with milliseconds"

  - name: escalation_adjustment
    trigger: |
      As a side effect of the PurchaseCommitment delivery_posture transitions
      SCHEDULED -> RELEASED_FOR_FAB (variant provisional_at_release) and
      FABRICATING|STORED_OFFSITE -> DELIVERED (variant final_at_delivery).
    algorithm: threshold
    formula: |
      # base_index_value is EscalationAgreement.baseline_index_value, frozen at execute time.
      # current_index_value is selected per variant (see variants below).
      index_delta_pct   = round((current_index_value - base_index_value) / base_index_value * 100, 4)
      eligible_delta_pct = max(0, index_delta_pct - deadband_pct)
      capped_delta_pct   = min(eligible_delta_pct, cap_pct)
      shared_delta_pct   = capped_delta_pct * (1 - contractor_share_pct / 100)
      escalation_accrued = round(committed_base_cost * shared_delta_pct / 100, 2)

      # COMBINATORIAL: four chained operations (ratio -> deadband subtraction -> cap clamp ->
      # share split) with ONE intermediate rounding, at index_delta_pct to 4 decimal places, and
      # ONE final rounding to 2. No other step rounds. Re-rounding eligible/capped/shared to 2 dp
      # produces a different final cent value and is WRONG.
    input_set: |
      The single PurchaseCommitment being transitioned, its EscalationAgreement (which must be
      status == EXECUTED, supplying baseline_index_value / cap_pct / contractor_share_pct /
      deadband_pct / index_code), and exactly one IndexReading chosen per variant. Commitments with
      escalation_agreement_id == null accrue 0.00 and escalation_variant stays NONE.
      IndexReading.published_at plays no part in selection — it is audit metadata only.
    constants:
      MIN_ESCALATION_AMOUNT: 0.00
    precision: "index_delta_pct: 4 decimal places, round_half_up. escalation_accrued: 2 decimal places, round_half_up. Never negative — a falling index yields 0.00, it does not credit the owner."
    variants:
      - name: provisional_at_release
        when: "delivery_posture SCHEDULED -> RELEASED_FOR_FAB"
        difference: |
          current_index_value is taken from the IndexReading for the agreement's index_code with the
          GREATEST period satisfying period <= the YYYY-MM of the current logical clock (a
          look-back: the newest published period that is not in the future). Ties are impossible —
          (index_code, period) is unique. When no such reading exists the transition is rejected
          with ERR_INDEX_READING_MISSING. Sets escalation_variant = PROVISIONAL and
          escalation_index_period to the selected reading's period.
      - name: final_at_delivery
        when: "delivery_posture FABRICATING|STORED_OFFSITE -> DELIVERED"
        difference: |
          current_index_value is taken from the IndexReading whose period EXACTLY equals the YYYY-MM
          of the current logical clock — no look-back. A missing reading for that exact month is
          rejected with ERR_INDEX_READING_MISSING (delivery cannot be posted into an unpublished
          month). Overwrites escalation_accrued, sets escalation_variant = FINAL, and the delta
          between the provisional and final amounts flows into
          Project.escalation_contingency_committed on the next read.

  - name: supplier_exposure_score
    trigger: |
      On every read of a Supplier (GET /procurement/suppliers/{id}) for the snapshot fields, and
      evaluated as a precondition inside POST /procurement/purchase-commitments (snapshot variant)
      and POST /procurement/substitution-requests/{id}/disposition (forward variant). Recomputed
      implicitly by POST /procurement/suppliers/{id}/disruption-events and by the DisruptionEvent
      OPEN -> MITIGATED transition.
    algorithm: weighted_scoring
    formula: |
      # effective_tariff_rate_pct = the GREATEST of declared_tariff_rate_pct and the
      # tariff_rate_pct of every in-scope DisruptionEvent with event_type == TARIFF_IMPOSED
      # (null tariff_rate_pct treated as 0).
      tariff_component = min(TARIFF_COMPONENT_CAP, TARIFF_WEIGHT * effective_tariff_rate_pct)
      event_component  = min(EVENT_COMPONENT_CAP,  EVENT_WEIGHT  * in_scope_open_event_count)
      geo_component    = 0 if country_of_origin == "US" else NON_DOMESTIC_PENALTY
      exposure_score   = round(tariff_component + event_component + geo_component, 2)

      exposure_band =
        HIGH     if exposure_score >= EXPOSURE_HIGH_THRESHOLD       # >= 60
        ELEVATED if exposure_score >= EXPOSURE_ELEVATED_THRESHOLD   # >= 30
        LOW      otherwise
    input_set: |
      One Supplier plus its DisruptionEvent children. "In scope" is defined per variant below; in
      both variants only events with status == OPEN participate (MITIGATED events are excluded
      entirely). Order is irrelevant (min/max/count only), so no tie-break is needed.
    constants:
      TARIFF_WEIGHT: 1.6
      TARIFF_COMPONENT_CAP: 40
      EVENT_WEIGHT: 20
      EVENT_COMPONENT_CAP: 40
      NON_DOMESTIC_PENALTY: 20
      EXPOSURE_HIGH_THRESHOLD: 60
      EXPOSURE_ELEVATED_THRESHOLD: 30
    precision: "2 decimal places, round_half_up; band thresholds are inclusive lower bounds (>=)"
    variants:
      - name: snapshot_exposure
        when: |
          Written to Supplier.exposure_score_snapshot / exposure_band_snapshot on read, and used as
          the gate inside POST /procurement/purchase-commitments (ERR_SUPPLIER_EXPOSURE_TOO_HIGH
          when the band is HIGH).
        difference: |
          In-scope events are those with status == OPEN AND effective_date <= the current logical
          clock. A disruption dated in the future is invisible to the snapshot, so a supplier can be
          committed to today and be HIGH tomorrow purely because the clock advanced.
      - name: forward_exposure
        when: |
          Used as the gate inside POST /procurement/substitution-requests/{id}/disposition for
          disposition IN {APPROVED, APPROVED_AS_NOTED} (ERR_SUBSTITUTE_SUPPLIER_EXPOSED when the
          band is HIGH).
        difference: |
          In-scope events are ALL events with status == OPEN regardless of effective_date — known
          future tariffs and announced disruptions count now. Identical stored data therefore yields
          a strictly greater-or-equal score than snapshot_exposure, and a supplier that is
          committable today can still be refused as a substitute.

  - name: buyout_variance
    trigger: "On every read of a Project (GET /procurement/projects/{id})."
    algorithm: aggregation
    formula: |
      # (a) source + status filter, (b) window, (c) tie-break — all pinned below.
      estimated_total_cost = sum of MaterialPackage.estimated_cost
                             over packages with project_id == this project
                             and status IN {IDENTIFIED, SOURCING, SOURCING_STALLED, BOUGHT_OUT, CLOSED}
                             (i.e. every package; there is no soft-delete)

      committed_total_cost = sum of (PurchaseCommitment.committed_base_cost
                                     + PurchaseCommitment.escalation_accrued)
                             over commitments whose MaterialPackage.project_id == this project
                             and commitment_status IN {COMMITTED, CLOSED}
                             (PENDING, CANCELLED and VOIDED commitments are excluded)

      escalation_contingency_committed = sum of PurchaseCommitment.escalation_accrued
                             over the same {COMMITTED, CLOSED} set
      escalation_contingency_remaining = round(escalation_contingency_budget
                                               - escalation_contingency_committed, 2)

      change_order_recovered_amount = sum of ChangeOrderRequest.substantiated_amount
                             over change orders whose PurchaseCommitment's MaterialPackage.project_id
                             == this project and status == OWNER_APPROVED

      buyout_variance = round(estimated_total_cost - committed_total_cost, 2)   # variant: see below
    input_set: |
      All MaterialPackage rows of the project, all PurchaseCommitment rows reachable through them,
      and all OWNER_APPROVED ChangeOrderRequest rows reachable through those commitments. Sums are
      order-insensitive; each addend is already rounded to 2 dp, so no rounding-order ambiguity
      exists. The window is "all time" — there is no as-of filter on this calculation.
    constants:
      MAX_BUYOUT_OVERRUN_PCT: 15
    precision: "2 decimal places, round_half_up; a negative buyout_variance means the buyout came in over the estimate"
    variants:
      - name: full_program
        when: "Written to Project.buyout_variance."
        difference: |
          estimated_total_cost spans EVERY package of the project, including packages still in
          IDENTIFIED / SOURCING / SOURCING_STALLED that have no commitment at all. The figure
          therefore reads as a large positive number early in the job simply because most scope is
          unbought.
      - name: bought_out_scope_only
        when: "Written to Project.bought_out_variance."
        difference: |
          estimated_total_cost is restricted to packages whose status IN {BOUGHT_OUT, CLOSED} — the
          apples-to-apples comparison. Same underlying rows, materially different number: for a
          project with one bought-out package (estimate 1200000.00, committed 1182941.98) and one
          package still SOURCING (estimate 300000.00), full_program reports 317058.02 while
          bought_out_scope_only reports 17058.02.

  - name: storage_carrying_cost
    trigger: |
      On every read of an OffsiteStorageArrangement (GET /procurement/storage-arrangements/{id} and
      the list endpoint). Frozen when the arrangement transitions ACTIVE -> RELEASED, which stamps
      carrying_cost_frozen_at.
    algorithm: chronological
    formula: |
      as_of = carrying_cost_frozen_at if it is set, else the current logical clock

      # Full elapsed storage months only; a partial month contributes nothing.
      full_months_stored = the count of integers k >= 1 such that
                           add_months(stored_from, k) <= as_of
                           where add_months clamps the day-of-month to the target month's length
                           (e.g. add_months(2026-01-31, 1) == 2026-02-28)

      # PINNED ROUNDING ORDER: round each of the two per-month components to 2 dp, sum them into a
      # per-month charge, THEN multiply by the month count. Summing unrounded monthly values and
      # rounding once at the end is WRONG and differs by cents.
      monthly_storage_charge   = round(stored_value * monthly_storage_rate_pct / 100, 2)
      monthly_insurance_charge = round(stored_value * INSURANCE_RATE_PCT / 100, 2)
      per_month_total          = monthly_storage_charge + monthly_insurance_charge
      storage_carrying_cost    = round(per_month_total * full_months_stored, 2)
                                 # persisted to OffsiteStorageArrangement.carrying_cost_accrued
    input_set: |
      One OffsiteStorageArrangement row plus the clock (or its frozen instant). Months elapsed are
      measured from stored_from inclusive; SUSPENDED periods are NOT deducted — the bailee charges
      for possession regardless of documentation compliance. Arrangements in status DRAFT report
      0.00 until stored_from is reached.
    constants:
      INSURANCE_RATE_PCT: 0.0175
      HANDLING_BUFFER_DAYS: 3
    precision: |
      2 decimal places, round_half_up, applied per component and again to the product. Worked
      example (stored_value 862500.00, monthly_storage_rate_pct 0.1875, 3 full months):
      round(1617.1875, 2) = 1617.19 plus round(150.9375, 2) = 150.94 gives 1768.13 per month,
      times 3 = 5304.39. The sum-then-round path would yield 5304.38.

  - name: substantiated_escalation_amount
    trigger: "On POST /procurement/change-order-requests and on every read of a ChangeOrderRequest."
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER — steps 1..5 in exactly this sequence. The order matters because
      # step 3's tier is keyed on the step-1 gross amount, NOT on the running total produced by
      # step 4. Keying the tier on the total is circular (a total of 49000.00 + fee lands in a
      # different tier than the total it was derived from, and the recursion has no fixed point).
      # 1
      gross_documented_amount = the commitment's escalation_accrued, and ONLY when
                                escalation_variant == FINAL; a PROVISIONAL or NONE commitment
                                yields gross 0.00 and the create is rejected
                                (ERR_CLAIM_NOT_SUBSTANTIATED)
      # 2
      admin_fee_rate_pct = SMALL_CLAIM_FEE_PCT  if gross_documented_amount <  TIER_1_CEILING
                           # persisted to ChangeOrderRequest.admin_fee_pct
                           MID_CLAIM_FEE_PCT    if TIER_1_CEILING <= gross_documented_amount < TIER_2_CEILING
                           LARGE_CLAIM_FEE_PCT  if gross_documented_amount >= TIER_2_CEILING
      # 3
      admin_fee_amount = round(gross_documented_amount * admin_fee_rate_pct / 100, 2)
      # 4
      running_total = gross_documented_amount + admin_fee_amount
      # 5
      substantiated_amount = round(min(running_total, claimed_amount), 2)
                             # the owner is never asked for more than the contractor claimed
    input_set: |
      One ChangeOrderRequest plus its PurchaseCommitment. Only that single commitment's
      escalation_accrued enters the claim — sibling commitments on the same package or project are
      excluded. A claimed_amount below the running total silently caps the claim; it is not an error.
    constants:
      SMALL_CLAIM_FEE_PCT: 5.0
      MID_CLAIM_FEE_PCT: 3.5
      LARGE_CLAIM_FEE_PCT: 2.0
      TIER_1_CEILING: 10000
      TIER_2_CEILING: 50000
    precision: |
      2 decimal places, round_half_up. Tier boundaries are inclusive lower bounds on the tier above.
      Worked examples: gross 55200.00 with claimed 60000.00 -> rate 2.0, fee 1104.00, substantiated
      56304.00. Gross 49000.00 with claimed 52000.00 -> rate 3.5, fee 1715.00, substantiated
      50715.00. Gross 49000.00 with claimed 45000.00 -> substantiated 45000.00 (claim cap binds).
  - name: documentation_completeness
    trigger: |
      As a side effect of POST /procurement/storage-arrangements/{id}/documents and
      POST /procurement/storage-documents/{id}/revoke, and on every read of an
      OffsiteStorageArrangement.
    algorithm: aggregation
    formula: |
      qualifying(doc) = doc.revoked == false
                        AND doc.verified == true
                        AND doc.effective_date <= current_logical_clock
                        AND current_logical_clock < doc.expires_at      # half-open window
                        AND (doc.doc_type != INSURANCE_CERTIFICATE
                             OR doc.coverage_amount >= arrangement.stored_value)

      verified_doc_type_count = count of DISTINCT doc_type values that are members of
                                MANDATORY_DOC_TYPES among the arrangement's StorageDocument
                                children where qualifying(doc) is true
                                (two qualifying LIEN_WAIVERs still count as one type, and a
                                qualifying INVENTORY_TAG_PHOTO is never counted at all because
                                it is not a member of MANDATORY_DOC_TYPES)

      documentation_status = COMPLETE   if verified_doc_type_count == 3
                                          (i.e. all of MANDATORY_DOC_TYPES are covered)
                             INCOMPLETE otherwise
    input_set: |
      All StorageDocument children of the arrangement (FK storage_arrangement_id), evaluated against
      the current logical clock. Documents are never hard-deleted; revocation is a flag. Order is
      irrelevant (a distinct-count), so no tie-break applies. Advancing the clock past a document's
      expires_at flips the arrangement to INCOMPLETE on the very next read without any write to the
      documents.
    constants:
      MANDATORY_DOC_TYPES: [BAILMENT_AGREEMENT, INSURANCE_CERTIFICATE, LIEN_WAIVER]
    precision: "exact integer count; no rounding"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID are both present and non-empty, and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: |
      Request body shape: every required field of the endpoint's input is present; every field has the
      declared JSON type; enum fields carry a declared member; monetary fields are >= 0 with at most 2
      decimal places; percentage fields are within 0..100; day-count fields are integers >= 0;
      datetime fields parse as ISO-8601 UTC instants; period fields match ^\d{4}-(0[1-9]|1[0-2])$;
      unknown fields are rejected. Blank-after-trim strings fail for required string fields.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 30
    category: existence
    check: "every path id resolves to an existing row, validated left-to-right along the path"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 35
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row (project_id, material_package_id, supplier_id, quote_id, escalation_agreement_id, purchase_commitment_id, proposed_supplier_id, disruption_event_id)"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a foreign key in the body"

  - priority: 40
    category: auth
    check: |
      Supplier scope: when X-User-Role == SupplierRep, X-User-ID MUST equal the Supplier.id the
      operation acts for — Quote.supplier_id on POST /procurement/quotes and
      POST /procurement/quotes/{id}/revise, and the supplier_id of the agreement's quote on
      POST /procurement/escalation-agreements/{id}/counter.
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /procurement/quotes, POST /procurement/quotes/{id}/revise, POST /procurement/escalation-agreements/{id}/counter, POST /procurement/storage-arrangements/{id}/documents"

  - priority: 45
    category: auth
    check: "Segregation of duties: on POST /procurement/change-order-requests/{id}/submit, X-User-ID MUST differ from ChangeOrderRequest.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /procurement/change-order-requests/{id}/submit"

  - priority: 50
    category: business_constraint
    check: "Optimistic concurrency: expected_project_version MUST equal the current Project.version of the package's project"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /procurement/purchase-commitments"

  - priority: 55
    category: state
    check: |
      Own-state legality of the target row: the requested transition must exist in §1.2 for the row's
      current state. Quote must be OPEN to be revised or committed against
      (ERR_QUOTE_NOT_OPEN); an agreement's propose/counter/execute must match its status
      (ERR_INVALID_STATE_TRANSITION); a commitment's commit/cancel must match commitment_status
      (ERR_INVALID_STATE_TRANSITION); a delivery-posture move must be an declared edge of the
      posture axis (ERR_INVALID_POSTURE_TRANSITION); an early-buyout commitment
      (requires_storage_arrangement == true) may not go FABRICATING -> DELIVERED
      (ERR_STORAGE_STEP_REQUIRED); a substitution disposition/resubmit/rescind must match its status,
      and no substitution may be dispositioned or rescinded against a CLOSED MaterialPackage
      (ERR_INVALID_STATE_TRANSITION); a change order's submit/disposition must match its status.
    error_id: "ERR_QUOTE_NOT_OPEN | ERR_INVALID_STATE_TRANSITION | ERR_INVALID_POSTURE_TRANSITION | ERR_STORAGE_STEP_REQUIRED"
    http_status: 409
    applies_to: "all transition endpoints, POST /procurement/purchase-commitments, POST /procurement/quotes/{id}/revise"

  - priority: 60
    category: state
    check: |
      Cross-entity state gates, evaluated after the row's own state is legal:
      execute requires the agreement's Quote.status == OPEN (ERR_QUOTE_NOT_OPEN);
      commit requires the attached agreement's status == EXECUTED (ERR_ESCALATION_NOT_EXECUTED) and
      the quote's Supplier.status == ACTIVE (ERR_SUPPLIER_NOT_ACTIVE);
      attaching an agreement at commitment-create requires that agreement's status IN
      {PROPOSED, COUNTERED, EXECUTED} (ERR_AGREEMENT_NOT_ATTACHABLE);
      posture -> STORED_OFFSITE requires an OffsiteStorageArrangement with status == ACTIVE and
      documentation_status == COMPLETE (ERR_STORAGE_NOT_DOCUMENTED);
      posture -> STORAGE_NONCOMPLIANT -> STORED_OFFSITE requires the arrangement back to ACTIVE
      (ERR_STORAGE_NOT_DOCUMENTED);
      creating a storage arrangement requires its commitment's commitment_status == COMMITTED and
      delivery_posture IN {RELEASED_FOR_FAB, FABRICATING} (ERR_INVALID_STATE_TRANSITION);
      change-order submit requires the commitment's escalation_variant == FINAL
      (ERR_CLAIM_NOT_SUBSTANTIATED).
    error_id: "ERR_QUOTE_NOT_OPEN | ERR_ESCALATION_NOT_EXECUTED | ERR_SUPPLIER_NOT_ACTIVE | ERR_AGREEMENT_NOT_ATTACHABLE | ERR_STORAGE_NOT_DOCUMENTED | ERR_INVALID_STATE_TRANSITION | ERR_CLAIM_NOT_SUBSTANTIATED"
    http_status: 409
    applies_to: "POST /procurement/escalation-agreements/{id}/execute, POST /procurement/purchase-commitments, POST /procurement/purchase-commitments/{id}/commit, POST /procurement/purchase-commitments/{id}/delivery-posture, POST /procurement/storage-arrangements, POST /procurement/change-order-requests/{id}/submit"

  - priority: 65
    category: business_referential
    check: |
      Referential coherence between rows that both exist:
      escalation_agreement_id supplied at commitment-create MUST have quote_id == the supplied
      quote_id (ERR_AGREEMENT_QUOTE_MISMATCH);
      an EscalationAgreement's index_code MUST equal the MaterialPackage.commodity_index_code of its
      quote's package, and baseline_index_period MUST have a published IndexReading
      (ERR_INDEX_CODE_MISMATCH / ERR_INDEX_READING_MISSING);
      a SubstitutionRequest's proposed_supplier_id MUST NOT equal the supplier_id of any
      {PENDING, COMMITTED} commitment on that package (ERR_INVALID_REQUEST);
      a SubstitutionRequest with driver == DISRUPTION_CONTINGENCY MUST supply a disruption_event_id
      whose event's supplier is the package's currently quoted or committed supplier
      (ERR_INVALID_REQUEST); with any other driver, disruption_event_id MUST be omitted.
    error_id: "ERR_AGREEMENT_QUOTE_MISMATCH | ERR_INDEX_CODE_MISMATCH | ERR_INDEX_READING_MISSING | ERR_INVALID_REQUEST"
    http_status: "422 | 409"
    applies_to: "POST /procurement/purchase-commitments, POST /procurement/escalation-agreements, POST /procurement/substitution-requests"

  - priority: 70
    category: business_safety
    check: |
      Bailment / insurance safety, evaluated before any temporal or fiscal check:
      an INSURANCE_CERTIFICATE document's coverage_amount MUST be >= the arrangement's stored_value
      (ERR_INSURANCE_COVERAGE_INSUFFICIENT);
      POST /procurement/purchase-commitments is refused when the quote's Supplier has
      exposure_band_snapshot == HIGH (ERR_SUPPLIER_EXPOSURE_TOO_HIGH);
      a substitution disposition of APPROVED or APPROVED_AS_NOTED is refused when the proposed
      Supplier's FORWARD exposure band == HIGH (ERR_SUBSTITUTE_SUPPLIER_EXPOSED).
    error_id: "ERR_INSURANCE_COVERAGE_INSUFFICIENT | ERR_SUPPLIER_EXPOSURE_TOO_HIGH | ERR_SUBSTITUTE_SUPPLIER_EXPOSED"
    http_status: "422 | 409"
    applies_to: "POST /procurement/storage-arrangements/{id}/documents, POST /procurement/purchase-commitments, POST /procurement/substitution-requests/{id}/disposition"

  - priority: 75
    category: business_temporal
    check: |
      Temporal windows:
      POST /procurement/_clock/set_current_utc rejects to_iso8601 < the current logical clock
      (ERR_CLOCK_REWIND);
      a Quote's received_at MUST be <= the current logical clock and price_hold_days >= 1
      (ERR_INVALID_REQUEST);
      an EscalationAgreement's price_hold_through MUST be <= the quote's expires_at
      (ERR_STORAGE_WINDOW_INVALID is NOT used here — this is ERR_INVALID_REQUEST);
      a storage arrangement's stored_from MUST be >= the commitment's released_for_fab_at and
      planned_release_date MUST be > stored_from (ERR_STORAGE_WINDOW_INVALID);
      a StorageDocument's expires_at MUST be > effective_date (ERR_INVALID_REQUEST).
    error_id: "ERR_CLOCK_REWIND | ERR_STORAGE_WINDOW_INVALID | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /procurement/_clock/set_current_utc, POST /procurement/quotes, POST /procurement/quotes/{id}/revise, POST /procurement/escalation-agreements, POST /procurement/storage-arrangements, POST /procurement/storage-arrangements/{id}/documents"

  - priority: 80
    category: business_constraint
    check: |
      Uniqueness and interval conflicts:
      MaterialPackage.scope_code is unique per project_id (ERR_DUPLICATE_SCOPE_CODE);
      PurchaseCommitment.po_number is globally unique (ERR_DUPLICATE_PO_NUMBER);
      IndexReading (index_code, period) is unique (ERR_DUPLICATE_INDEX_READING);
      a package may carry at most one commitment with commitment_status IN {PENDING, COMMITTED}
      (ERR_PACKAGE_ALREADY_COMMITTED);
      a new Quote's half-open price-hold interval [received_at, expires_at) MUST NOT overlap an
      existing quote for the same (material_package_id, supplier_id) whose status IN {OPEN,
      CONVERTED} — except the quote it directly supersedes (ERR_PRICE_HOLD_OVERLAP);
      a new OffsiteStorageArrangement's closed occupancy interval [stored_from,
      planned_release_date], inflated by HANDLING_BUFFER_DAYS (3) on both ends, MUST NOT overlap an
      existing arrangement in the same warehouse_name whose status IN {DRAFT, ACTIVE, SUSPENDED}
      (ERR_WAREHOUSE_WINDOW_CONFLICT);
      an EscalationAgreement counter beyond MAX_NEGOTIATION_ROUNDS (3) is refused with no mutation
      (ERR_NEGOTIATION_ROUNDS_EXHAUSTED);
      a counter MUST move at least one term in the supplier's favour (ERR_COUNTER_NOT_RESPONSIVE);
      a REVISION_REQUESTED disposition beyond MAX_SUBSTITUTION_ROUNDS (2) is refused
      (ERR_INVALID_STATE_TRANSITION);
      an APPROVED_AS_NOTED disposition without non-blank engineer_conditions is refused
      (ERR_ENGINEER_CONDITIONS_REQUIRED).
    error_id: "ERR_DUPLICATE_SCOPE_CODE | ERR_DUPLICATE_PO_NUMBER | ERR_DUPLICATE_INDEX_READING | ERR_PACKAGE_ALREADY_COMMITTED | ERR_PRICE_HOLD_OVERLAP | ERR_WAREHOUSE_WINDOW_CONFLICT | ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_COUNTER_NOT_RESPONSIVE | ERR_INVALID_STATE_TRANSITION | ERR_ENGINEER_CONDITIONS_REQUIRED"
    http_status: "409 | 422"
    applies_to: "POST /procurement/material-packages, POST /procurement/quotes, POST /procurement/quotes/{id}/revise, POST /procurement/index-readings, POST /procurement/purchase-commitments, POST /procurement/storage-arrangements, POST /procurement/escalation-agreements/{id}/counter, POST /procurement/substitution-requests/{id}/disposition"

  - priority: 90
    category: business_fiscal
    check: |
      Fiscal ceilings, evaluated last:
      a commitment's base_price MUST NOT exceed the package's estimated_cost by more than
      MAX_BUYOUT_OVERRUN_PCT (15) (ERR_BUYOUT_OVERRUN_EXCEEDED);
      the provisional escalation computed at RELEASED_FOR_FAB MUST fit inside
      Project.escalation_contingency_remaining (ERR_CONTINGENCY_EXCEEDED);
      an arrangement's stored_value MUST NOT exceed its commitment's committed_base_cost
      (ERR_STORED_VALUE_EXCEEDS_COMMITMENT);
      a ChangeOrderRequest requires the commitment's escalation_accrued > 0 with escalation_variant
      == FINAL, and claimed_amount > 0 (ERR_CLAIM_NOT_SUBSTANTIATED).
    error_id: "ERR_BUYOUT_OVERRUN_EXCEEDED | ERR_CONTINGENCY_EXCEEDED | ERR_STORED_VALUE_EXCEEDS_COMMITMENT | ERR_CLAIM_NOT_SUBSTANTIATED"
    http_status: "422 | 409"
    applies_to: "POST /procurement/purchase-commitments, POST /procurement/purchase-commitments/{id}/delivery-posture, POST /procurement/storage-arrangements, POST /procurement/change-order-requests"

  - priority: 95
    category: business_constraint
    check: |
      Documented priority conflicts (the two §0.5 Rule 5 pairs, stated explicitly so the winning
      error is unambiguous):
      (A) POST /procurement/purchase-commitments against an EXPIRED quote whose base_price ALSO
          exceeds estimated_cost * 1.15 -> the priority-55 state check wins: ERR_QUOTE_NOT_OPEN,
          never ERR_BUYOUT_OVERRUN_EXCEEDED.
      (B) POST /procurement/storage-arrangements whose stored_from precedes released_for_fab_at AND
          whose occupancy window also collides with another arrangement in the same warehouse ->
          the priority-75 temporal check wins: ERR_STORAGE_WINDOW_INVALID, never
          ERR_WAREHOUSE_WINDOW_CONFLICT.
    error_id: "ERR_QUOTE_NOT_OPEN | ERR_STORAGE_WINDOW_INVALID"
    http_status: "409 | 422"
    applies_to: "POST /procurement/purchase-commitments, POST /procurement/storage-arrangements"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Project -------------------------------------------------------------
  - method: POST
    path: "/procurement/projects"
    description: "Open a job with its owner contract data and its escalation contingency allowance."
    roles: [BuyoutManager, ProjectExecutive]
    code: 201
    input: [name, contract_number, owner_name, schedule_data_date, escalation_contingency_budget]
    output: Project
    side_effects:
      - "all six money roll-ups are computed on read and start at 0.00 except escalation_contingency_remaining, which equals escalation_contingency_budget"
      - "version starts at 1"

  - method: GET
    path: "/procurement/projects/{id}"
    description: "Read a project including the live buyout log roll-ups. The OwnerRep sees it; SupplierRep and DesignEngineer do not."
    roles: [BuyoutManager, ProjectExecutive, OwnerRep]
    code: 200
    input: []
    output: Project
    side_effects:
      - "recomputes calculations.buyout_variance (both variants) and the contingency ledger on every read"

  # --- MaterialPackage -----------------------------------------------------
  - method: POST
    path: "/procurement/material-packages"
    description: "Register a scope package with its schedule durations; long-lead classification and the release-for-fabrication date are derived here."
    roles: [BuyoutManager]
    code: 201
    input: [project_id, scope_code, description, commodity_index_code, estimated_cost, required_onsite_date, fabrication_duration_days, delivery_transit_days, "submittal_review_days?"]
    output: MaterialPackage
    side_effects:
      - "runs calculations.release_for_fabrication_schedule: sets lead_time_days, is_long_lead, release_for_fabrication_date, float_days, rff_risk_band"
      - "sets baseline_estimated_cost = estimated_cost and baseline_fabrication_duration_days = fabrication_duration_days"
      - "status starts at IDENTIFIED, open_quote_count at 0"

  - method: GET
    path: "/procurement/material-packages/{id}"
    description: "Read one scope package with its live float and risk band."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: MaterialPackage
    side_effects:
      - "re-derives float_days and rff_risk_band against the current logical clock"

  - method: GET
    path: "/procurement/material-packages"
    description: "Filtered, paginated package list — also the reverse-reachability channel for MaterialPackage.project_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["project_id?", "status?", "is_long_lead?", "rff_risk_band?", "limit?", "offset?"]
    output: MaterialPackage[]
    side_effects: []

  - method: PATCH
    path: "/procurement/material-packages/{id}"
    description: "Revise a package's schedule durations, need date or estimate as the design develops."
    roles: [BuyoutManager]
    code: 200
    input: ["required_onsite_date?", "fabrication_duration_days?", "delivery_transit_days?", "submittal_review_days?", "estimated_cost?"]
    output: MaterialPackage
    side_effects:
      - "re-runs calculations.release_for_fabrication_schedule over the new durations"
      - "rebaselines baseline_estimated_cost / baseline_fabrication_duration_days so the schedule-days conservation invariant continues to hold"

  # --- Supplier / DisruptionEvent ------------------------------------------
  - method: POST
    path: "/procurement/suppliers"
    description: "Register a fabricator or vendor with its country of origin and declared tariff rate."
    roles: [BuyoutManager]
    code: 201
    input: [legal_name, country_of_origin, "declared_tariff_rate_pct?"]
    output: Supplier
    side_effects:
      - "sets is_domestic = (country_of_origin == 'US'); status starts at ACTIVE"
      - "runs calculations.supplier_exposure_score variant snapshot_exposure"

  - method: GET
    path: "/procurement/suppliers/{id}"
    description: "Read a supplier with its snapshot exposure score and band."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: Supplier
    side_effects:
      - "recomputes open_disruption_count, exposure_score_snapshot and exposure_band_snapshot against the current logical clock"

  - method: GET
    path: "/procurement/suppliers"
    description: "Filtered, paginated supplier list."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["status?", "country_of_origin?", "exposure_band_snapshot?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  - method: POST
    path: "/procurement/suppliers/{id}/suspend"
    description: "Suspend a supplier so no further commitment may be issued against its quotes."
    roles: [ProjectExecutive]
    code: 200
    input: [reason]
    output: Supplier
    side_effects:
      - "sets status -> SUSPENDED and suspension_reason; existing commitments are untouched"

  - method: POST
    path: "/procurement/suppliers/{id}/disruption-events"
    description: "Log a tariff action, force-majeure event or allocation notice against a supplier."
    roles: [BuyoutManager]
    code: 201
    input: [event_type, effective_date, description, "tariff_rate_pct?"]
    output: DisruptionEvent
    side_effects:
      - "status starts at OPEN; the supplier's exposure recomputes on its next read"

  - method: GET
    path: "/procurement/suppliers/{id}/disruption-events"
    description: "Sub-resource list — the reverse-reachability channel for DisruptionEvent.supplier_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["status?", "event_type?", "limit?", "offset?"]
    output: DisruptionEvent[]
    side_effects: []

  # --- Quote ---------------------------------------------------------------
  - method: POST
    path: "/procurement/quotes"
    description: "A supplier submits a priced quote with a price-hold period; expires_at is derived."
    roles: [SupplierRep]
    code: 201
    input: [material_package_id, supplier_id, base_price, received_at, price_hold_days]
    output: Quote
    side_effects:
      - "sets expires_at = received_at + price_hold_days days; status starts at OPEN"
      - "MaterialPackage IDENTIFIED -> SOURCING (or SOURCING_STALLED -> SOURCING) and open_quote_count increments"

  - method: GET
    path: "/procurement/quotes/{id}"
    description: "Read one quote and its price-hold window."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/procurement/quotes"
    description: "Filtered, paginated quote list — reverse-reachability for Quote.material_package_id, Quote.supplier_id and Quote.supersedes_quote_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["material_package_id?", "supplier_id?", "supersedes_quote_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/procurement/quotes/{id}/revise"
    description: "The quoting supplier replaces its own quote; the old one is SUPERSEDED and a new OPEN quote is returned."
    roles: [SupplierRep]
    code: 201
    input: [base_price, received_at, price_hold_days]
    output: Quote
    side_effects:
      - "the path quote transitions OPEN -> SUPERSEDED"
      - "creates the returned Quote with supersedes_quote_id == the path quote's id"
      - "the superseded quote is exempted from the price-hold overlap check for this create"

  # --- EscalationAgreement -------------------------------------------------
  - method: POST
    path: "/procurement/escalation-agreements"
    description: "Draft an escalation clause against a quote: index reference, deadband, cap and contractor sharing band."
    roles: [BuyoutManager]
    code: 201
    input: [quote_id, index_code, baseline_index_period, cap_pct, contractor_share_pct, price_hold_through, "deadband_pct?", "proposed_terms_note?"]
    output: EscalationAgreement
    side_effects:
      - "status starts at DRAFT, round_number at 0, baseline_index_value stays null until execute"
      - "index_code is checked against the package's commodity_index_code"

  - method: GET
    path: "/procurement/escalation-agreements/{id}"
    description: "Read one escalation clause with its negotiated terms and frozen baseline."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: EscalationAgreement
    side_effects: []

  - method: GET
    path: "/procurement/escalation-agreements"
    description: "Filtered, paginated clause list — reverse-reachability for EscalationAgreement.quote_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["quote_id?", "status?", "index_code?", "limit?", "offset?"]
    output: EscalationAgreement[]
    side_effects: []

  - method: POST
    path: "/procurement/escalation-agreements/{id}/propose"
    description: "The buyout group puts terms on the table (from DRAFT or back from COUNTERED)."
    roles: [BuyoutManager]
    code: 200
    input: ["cap_pct?", "contractor_share_pct?", "deadband_pct?", "proposed_terms_note?"]
    output: EscalationAgreement
    side_effects:
      - "status DRAFT -> PROPOSED or COUNTERED -> PROPOSED; supplied terms overwrite the stored ones"

  - method: POST
    path: "/procurement/escalation-agreements/{id}/counter"
    description: "The supplier counters the proposed terms; the counter must move at least one term in the supplier's favour."
    roles: [SupplierRep]
    code: 200
    input: [cap_pct, contractor_share_pct, "deadband_pct?", "counter_note?"]
    output: EscalationAgreement
    side_effects:
      - "status PROPOSED -> COUNTERED and round_number increments by 1"
      - "a counter beyond MAX_NEGOTIATION_ROUNDS is rejected with no mutation at all"

  - method: POST
    path: "/procurement/escalation-agreements/{id}/execute"
    description: "Execute the clause, freezing the baseline index value from the published reading."
    roles: [ProjectExecutive]
    code: 200
    input: []
    output: EscalationAgreement
    side_effects:
      - "status PROPOSED -> EXECUTED; baseline_index_value frozen from IndexReading(index_code, baseline_index_period); executed_at stamped"

  # --- IndexReading --------------------------------------------------------
  - method: POST
    path: "/procurement/index-readings"
    description: "Publish a monthly commodity index reading. Immutable; (index_code, period) is unique."
    roles: [BuyoutManager]
    code: 201
    input: [index_code, period, value, published_at]
    output: IndexReading
    side_effects:
      - "no version field and no update endpoint — corrections are published as a new period, never edited"

  - method: GET
    path: "/procurement/index-readings"
    description: "Filtered, paginated reading list."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["index_code?", "period?", "limit?", "offset?"]
    output: IndexReading[]
    side_effects: []

  # --- PurchaseCommitment --------------------------------------------------
  - method: POST
    path: "/procurement/purchase-commitments"
    description: "Issue a purchase order against an OPEN quote, optionally attaching an escalation clause and flagging an early buyout that will need off-site storage. Carries the project OCC token."
    roles: [BuyoutManager]
    code: 201
    input: [quote_id, po_number, expected_project_version, "escalation_agreement_id?", "is_early_buyout?"]
    output: PurchaseCommitment
    side_effects:
      - "copies committed_base_cost from the quote's base_price and material_package_id from the quote"
      - "sets requires_storage_arrangement = is_early_buyout"
      - "commitment_status starts at PENDING and delivery_posture at SCHEDULED"
      - "MaterialPackage SOURCING|SOURCING_STALLED -> BOUGHT_OUT"
      - "increments Project.version by 1"

  - method: GET
    path: "/procurement/purchase-commitments/{id}"
    description: "Read one purchase order with both state axes and its accrued escalation."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: PurchaseCommitment
    side_effects: []

  - method: GET
    path: "/procurement/purchase-commitments"
    description: "Filtered, paginated PO list — reverse-reachability for PurchaseCommitment.quote_id, material_package_id and escalation_agreement_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["material_package_id?", "quote_id?", "escalation_agreement_id?", "commitment_status?", "delivery_posture?", "limit?", "offset?"]
    output: PurchaseCommitment[]
    side_effects: []

  - method: POST
    path: "/procurement/purchase-commitments/{id}/commit"
    description: "Countersign the PO: the quote is consumed and the commitment becomes contractually binding."
    roles: [ProjectExecutive]
    code: 200
    input: []
    output: PurchaseCommitment
    side_effects:
      - "commitment_status PENDING -> COMMITTED"
      - "Quote OPEN -> CONVERTED"
      - "increments Project.version by 1"

  - method: POST
    path: "/procurement/purchase-commitments/{id}/delivery-posture"
    description: "Advance (or restore) the delivery axis: release for fabrication, start fabricating, move into off-site storage, or deliver. Escalation is computed here."
    roles: [BuyoutManager]
    code: 200
    input: [to_posture]
    output: PurchaseCommitment
    side_effects:
      - "SCHEDULED -> RELEASED_FOR_FAB stamps released_for_fab_at and runs calculations.escalation_adjustment variant provisional_at_release, then increments Project.version by 1"
      - "RELEASED_FOR_FAB -> FABRICATING refreshes updated_at only"
      - "FABRICATING -> STORED_OFFSITE requires an ACTIVE, fully documented arrangement"
      - "-> DELIVERED stamps delivered_at, runs calculations.escalation_adjustment variant final_at_delivery, increments Project.version by 1, closes the commitment and the package, and RELEASES the arrangement (freezing calculations.storage_carrying_cost)"
      - "STORAGE_NONCOMPLIANT -> STORED_OFFSITE is allowed once documentation is restored"

  - method: POST
    path: "/procurement/purchase-commitments/{id}/cancel"
    description: "Cancel the PO. Escalation already accrued is reversed and the delivery axis is reset to SCHEDULED."
    roles: [ProjectExecutive]
    code: 200
    input: [cancellation_reason]
    output: PurchaseCommitment
    side_effects:
      - "commitment_status PENDING|COMMITTED -> CANCELLED"
      - "compensation: escalation_accrued -> 0, escalation_variant -> NONE, escalation_index_period -> null, released_for_fab_at -> null, delivery_posture -> SCHEDULED"
      - "Quote CONVERTED -> OPEN when the clock is still inside its hold, else CONVERTED -> EXPIRED"
      - "MaterialPackage BOUGHT_OUT -> SOURCING or SOURCING_STALLED"
      - "increments Project.version by 1 and restores the contingency ledger"

  # --- OffsiteStorageArrangement / StorageDocument --------------------------
  - method: POST
    path: "/procurement/storage-arrangements"
    description: "Arrange bailed off-site storage for early-bought material: warehouse, stored value, monthly rate and the occupancy window."
    roles: [BuyoutManager]
    code: 201
    input: [purchase_commitment_id, warehouse_name, warehouse_address, stored_value, monthly_storage_rate_pct, stored_from, planned_release_date]
    output: OffsiteStorageArrangement
    side_effects:
      - "status starts at DRAFT, documentation_status at INCOMPLETE, verified_doc_type_count at 0"
      - "the occupancy window is checked against other arrangements in the same warehouse with a 3-day handling buffer on both ends"

  - method: GET
    path: "/procurement/storage-arrangements/{id}"
    description: "Read one storage arrangement with its live carrying cost and documentation status."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: OffsiteStorageArrangement
    side_effects:
      - "recomputes calculations.documentation_completeness and calculations.storage_carrying_cost (frozen once carrying_cost_frozen_at is set)"

  - method: GET
    path: "/procurement/storage-arrangements"
    description: "Filtered, paginated arrangement list — reverse-reachability for OffsiteStorageArrangement.purchase_commitment_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["purchase_commitment_id?", "status?", "documentation_status?", "warehouse_name?", "limit?", "offset?"]
    output: OffsiteStorageArrangement[]
    side_effects: []

  - method: POST
    path: "/procurement/storage-arrangements/{id}/documents"
    description: "File a bailment agreement, insurance certificate or lien waiver against the arrangement."
    roles: [BuyoutManager, SupplierRep]
    code: 201
    input: [doc_type, reference_number, effective_date, expires_at, "coverage_amount?", "verified?"]
    output: StorageDocument
    side_effects:
      - "re-runs calculations.documentation_completeness; a completing document drives the arrangement DRAFT -> ACTIVE or SUSPENDED -> ACTIVE"
      - "an INSURANCE_CERTIFICATE whose coverage_amount is below stored_value is rejected outright"

  - method: GET
    path: "/procurement/storage-arrangements/{id}/documents"
    description: "Sub-resource list — the reverse-reachability channel for StorageDocument.storage_arrangement_id and the only way to discover document ids."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["doc_type?", "revoked?", "limit?", "offset?"]
    output: StorageDocument[]
    side_effects: []

  - method: POST
    path: "/procurement/storage-documents/{id}/revoke"
    description: "Revoke a filed document. Head of the documentation cascade: arrangement is suspended and the commitment's delivery posture goes non-compliant."
    roles: [BuyoutManager]
    code: 200
    input: [revocation_reason]
    output: StorageDocument
    side_effects:
      - "sets revoked = true, revoked_at and revocation_reason"
      - "cascade hop 2: the arrangement ACTIVE -> SUSPENDED with documentation_status -> INCOMPLETE"
      - "cascade hop 3: the commitment's delivery_posture STORED_OFFSITE -> STORAGE_NONCOMPLIANT while commitment_status stays COMMITTED"

  # --- SubstitutionRequest --------------------------------------------------
  - method: POST
    path: "/procurement/substitution-requests"
    description: "Request an engineered substitution — value engineering, an availability problem, or contingency sourcing around a logged disruption — with its cost and schedule impact."
    roles: [BuyoutManager]
    code: 201
    input: [material_package_id, proposed_supplier_id, driver, proposed_product, cost_delta, schedule_delta_days, "disruption_event_id?"]
    output: SubstitutionRequest
    side_effects:
      - "status starts at SUBMITTED, revision_round at 0, applied_cost_delta and applied_schedule_delta_days at 0"
      - "submitted_by_user_id records the caller's X-User-ID"

  - method: GET
    path: "/procurement/substitution-requests/{id}"
    description: "Read one substitution request with its proposed and applied deltas."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []

  - method: GET
    path: "/procurement/substitution-requests"
    description: "Filtered, paginated list — reverse-reachability for SubstitutionRequest.material_package_id, proposed_supplier_id and disruption_event_id."
    roles: [BuyoutManager, SupplierRep, ProjectExecutive, DesignEngineer, OwnerRep]
    code: 200
    input: ["material_package_id?", "proposed_supplier_id?", "disruption_event_id?", "status?", "limit?", "offset?"]
    output: SubstitutionRequest[]
    side_effects: []

  - method: POST
    path: "/procurement/substitution-requests/{id}/disposition"
    description: "The engineer of record approves, approves with conditions, rejects, or sends the substitution back for revision."
    roles: [DesignEngineer]
    code: 200
    input: [disposition, "engineer_conditions?"]
    output: SubstitutionRequest
    side_effects:
      - "APPROVED applies both deltas to the MaterialPackage and re-derives its release-for-fabrication schedule"
      - "APPROVED_AS_NOTED applies the cost delta only and requires non-blank engineer_conditions"
      - "REJECTED and REVISION_REQUESTED apply nothing to the package"
      - "an approval of a DISRUPTION_CONTINGENCY request moves the referenced DisruptionEvent OPEN -> MITIGATED"

  - method: POST
    path: "/procurement/substitution-requests/{id}/resubmit"
    description: "Resubmit a revised substitution after the engineer asked for changes."
    roles: [BuyoutManager]
    code: 200
    input: [proposed_product, cost_delta, schedule_delta_days]
    output: SubstitutionRequest
    side_effects:
      - "status REVISION_REQUESTED -> SUBMITTED and revision_round increments by 1"

  - method: POST
    path: "/procurement/substitution-requests/{id}/rescind"
    description: "Withdraw an approved substitution; every applied cost and schedule delta is backed out."
    roles: [BuyoutManager]
    code: 200
    input: [rescission_reason]
    output: SubstitutionRequest
    side_effects:
      - "status APPROVED|APPROVED_AS_NOTED -> RESCINDED"
      - "compensation: the package's estimated_cost and fabrication_duration_days return to their pre-approval values and the schedule is re-derived"

  # --- ChangeOrderRequest ---------------------------------------------------
  - method: POST
    path: "/procurement/change-order-requests"
    description: "Prepare an owner change order substantiating documented escalation on a delivered PO."
    roles: [BuyoutManager]
    code: 201
    input: [purchase_commitment_id, claimed_amount, narrative]
    output: ChangeOrderRequest
    side_effects:
      - "runs calculations.substantiated_escalation_amount: sets gross_documented_amount, admin_fee_pct, admin_fee_amount, substantiated_amount"
      - "status starts at PREPARED and prepared_by_user_id records the caller's X-User-ID"

  - method: GET
    path: "/procurement/change-order-requests/{id}"
    description: "Read one change order with its substantiation arithmetic."
    roles: [BuyoutManager, ProjectExecutive, OwnerRep]
    code: 200
    input: []
    output: ChangeOrderRequest
    side_effects: []

  - method: GET
    path: "/procurement/change-order-requests"
    description: "Filtered, paginated list — reverse-reachability for ChangeOrderRequest.purchase_commitment_id."
    roles: [BuyoutManager, ProjectExecutive, OwnerRep]
    code: 200
    input: ["purchase_commitment_id?", "status?", "limit?", "offset?"]
    output: ChangeOrderRequest[]
    side_effects: []

  - method: POST
    path: "/procurement/change-order-requests/{id}/submit"
    description: "Submit the change order to the owner. Segregation of duties: the submitter may not be the preparer."
    roles: [BuyoutManager]
    code: 200
    input: []
    output: ChangeOrderRequest
    side_effects:
      - "status PREPARED -> SUBMITTED and submitted_by_user_id records the caller's X-User-ID"

  - method: POST
    path: "/procurement/change-order-requests/{id}/disposition"
    description: "The owner's representative approves or rejects the substantiated claim."
    roles: [OwnerRep]
    code: 200
    input: [disposition, "owner_note?"]
    output: ChangeOrderRequest
    side_effects:
      - "status SUBMITTED -> OWNER_APPROVED or SUBMITTED -> OWNER_REJECTED"
      - "an approval feeds Project.change_order_recovered_amount on the next project read"

  # --- Test-driving endpoint (last rung of the §1.5 priority ladder) --------
  - method: POST
    path: "/procurement/_clock/set_current_utc"
    description: |
      Set the server's logical UTC clock, which every window, expiry, float and month-count rule
      reads. Before any call to this endpoint the logical clock reads exactly
      2026-08-01T00:00:00Z — the fixed startup default; it MUST NOT fall back to wall-clock time.
      Moving the clock backwards is rejected with ERR_CLOCK_REWIND. Advancing it runs the
      quote-expiry sweep and returns every id the four cascade hops touched, in created_at ASC
      order within each list.
    roles: [BuyoutManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_quote_ids: string[], lapsed_agreement_ids: string[], voided_commitment_ids: string[], stalled_package_ids: string[] }"
    side_effects:
      - "cascade hop 1: every OPEN Quote with expires_at <= to_iso8601 becomes EXPIRED (created_at ASC)"
      - "cascade hop 2: their DRAFT/PROPOSED/COUNTERED EscalationAgreements become LAPSED"
      - "cascade hop 3: PENDING PurchaseCommitments attached to those clauses become VOIDED"
      - "cascade hop 4: their MaterialPackages leave BOUGHT_OUT, then a single stall sweep sets SOURCING_STALLED for every package left with open_quote_count == 0"
      - "re-derives every package's float_days / rff_risk_band and every arrangement's documentation_status / carrying_cost_accrued on subsequent reads"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or X-User-Role not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed for the endpoint (e.g. a SupplierRep reading GET /procurement/projects/{id}, or a BuyoutManager calling execute)"
  - id: ERR_SUPPLIER_SCOPE_VIOLATION
    http: 403
    condition: "a SupplierRep acts for a Supplier other than the one identified by its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the change order's preparer attempts to submit it as well"

  # --- shape --------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong JSON type, unknown field, blank required string, out-of-range number, undeclared enum member, malformed ISO-8601 instant or YYYY-MM period, price_hold_days < 1, received_at after the logical clock, expires_at <= effective_date, price_hold_through after the quote's expires_at, a disruption_event_id supplied with a driver other than DISRUPTION_CONTINGENCY or omitted with it, or a substitution proposing the supplier already committed on the package"

  # --- existence ----------------------------------------------------------
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "the project id in the path or in project_id does not exist"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "the package id in the path or in material_package_id does not exist"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "the supplier id in the path, in supplier_id, or in proposed_supplier_id does not exist"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "the quote id in the path or in quote_id does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "the escalation agreement id in the path or in escalation_agreement_id does not exist"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "the purchase commitment id in the path or in purchase_commitment_id does not exist"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "the storage arrangement, storage document, substitution request, change order request or disruption event id does not exist"

  # --- concurrency --------------------------------------------------------
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version on POST /procurement/purchase-commitments does not match the project's current version"

  # --- state --------------------------------------------------------------
  - id: ERR_QUOTE_NOT_OPEN
    http: 409
    condition: "the quote is EXPIRED, SUPERSEDED or CONVERTED when a commitment, a revision or a clause execution requires it OPEN. Wins over ERR_BUYOUT_OVERRUN_EXCEEDED when both apply."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the row's current state — a second commit, a propose on an EXECUTED clause, a disposition on an already-dispositioned substitution, a REVISION_REQUESTED beyond MAX_SUBSTITUTION_ROUNDS, a rescind or disposition against a CLOSED package, a storage arrangement created against a commitment that is not COMMITTED and RELEASED_FOR_FAB/FABRICATING, or a submit on a SUBMITTED change order"
  - id: ERR_INVALID_POSTURE_TRANSITION
    http: 409
    condition: "to_posture is not a declared edge from the commitment's current delivery_posture (e.g. SCHEDULED -> STORED_OFFSITE, or any posture move on a CANCELLED/VOIDED/CLOSED commitment)"
  - id: ERR_STORAGE_STEP_REQUIRED
    http: 409
    condition: "an early-buyout commitment (requires_storage_arrangement == true) attempts FABRICATING -> DELIVERED without passing through STORED_OFFSITE"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock"
  - id: ERR_SUPPLIER_NOT_ACTIVE
    http: 409
    condition: "the quote's supplier is SUSPENDED at commit time"
  - id: ERR_ESCALATION_NOT_EXECUTED
    http: 409
    condition: "commit is attempted while the attached escalation clause is not EXECUTED"
  - id: ERR_AGREEMENT_NOT_ATTACHABLE
    http: 409
    condition: "escalation_agreement_id refers to a clause whose status is LAPSED (attachment requires PROPOSED, COUNTERED or EXECUTED)"
  - id: ERR_AGREEMENT_QUOTE_MISMATCH
    http: 422
    condition: "the attached clause's quote_id differs from the quote_id being bought out"
  - id: ERR_INDEX_CODE_MISMATCH
    http: 422
    condition: "the clause's index_code differs from the package's commodity_index_code"
  - id: ERR_INDEX_READING_MISSING
    http: 409
    condition: "no IndexReading exists for the required (index_code, period) — the baseline period at execute, any period at or before the clock month at release, or the exact clock month at delivery"
  - id: ERR_STORAGE_NOT_DOCUMENTED
    http: 409
    condition: "a move to STORED_OFFSITE finds no arrangement that is both status ACTIVE and documentation_status COMPLETE, or the clock has not yet reached stored_from"

  # --- safety / compliance -------------------------------------------------
  - id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http: 422
    condition: "an INSURANCE_CERTIFICATE is filed with coverage_amount below the arrangement's stored_value, or with coverage_amount omitted"
  - id: ERR_SUPPLIER_EXPOSURE_TOO_HIGH
    http: 409
    condition: "the quote's supplier has snapshot exposure_band HIGH at commitment-create time"
  - id: ERR_SUBSTITUTE_SUPPLIER_EXPOSED
    http: 409
    condition: "the proposed substitute supplier's FORWARD exposure band is HIGH at disposition time, even when its snapshot band is lower"

  # --- temporal / constraint ----------------------------------------------
  - id: ERR_STORAGE_WINDOW_INVALID
    http: 422
    condition: "stored_from precedes the commitment's released_for_fab_at, or planned_release_date is not strictly after stored_from. Wins over ERR_WAREHOUSE_WINDOW_CONFLICT when both apply."
  - id: ERR_PRICE_HOLD_OVERLAP
    http: 409
    condition: "a new quote's half-open price-hold interval [received_at, expires_at) overlaps an existing OPEN or CONVERTED quote for the same package and supplier; touching endpoints do not overlap"
  - id: ERR_WAREHOUSE_WINDOW_CONFLICT
    http: 409
    condition: "the buffered occupancy interval collides with another DRAFT/ACTIVE/SUSPENDED arrangement in the same warehouse"
  - id: ERR_DUPLICATE_PO_NUMBER
    http: 409
    condition: "po_number already exists"
  - id: ERR_DUPLICATE_SCOPE_CODE
    http: 409
    condition: "scope_code already exists on that project"
  - id: ERR_DUPLICATE_INDEX_READING
    http: 409
    condition: "(index_code, period) already published"
  - id: ERR_PACKAGE_ALREADY_COMMITTED
    http: 409
    condition: "the package already carries a PENDING or COMMITTED commitment"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "a counter is attempted once round_number has reached MAX_NEGOTIATION_ROUNDS (3); nothing is mutated"
  - id: ERR_COUNTER_NOT_RESPONSIVE
    http: 422
    condition: "a counter neither raises cap_pct nor lowers contractor_share_pct relative to the stored terms"
  - id: ERR_ENGINEER_CONDITIONS_REQUIRED
    http: 422
    condition: "disposition APPROVED_AS_NOTED without a non-blank engineer_conditions"

  # --- fiscal --------------------------------------------------------------
  - id: ERR_BUYOUT_OVERRUN_EXCEEDED
    http: 422
    condition: "the quote's base_price exceeds the package's estimated_cost by more than MAX_BUYOUT_OVERRUN_PCT (15)"
  - id: ERR_CONTINGENCY_EXCEEDED
    http: 409
    condition: "the provisional escalation computed at RELEASED_FOR_FAB exceeds Project.escalation_contingency_remaining"
  - id: ERR_STORED_VALUE_EXCEEDS_COMMITMENT
    http: 422
    condition: "stored_value exceeds the commitment's committed_base_cost"
  - id: ERR_CLAIM_NOT_SUBSTANTIATED
    http: 409
    condition: "a change order is prepared or submitted against a commitment whose escalation_variant is not FINAL or whose escalation_accrued is 0.00, or claimed_amount is not greater than 0"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: BuyoutManager
    description: "General contractor procurement buyer: packages, suppliers, index readings, POs, storage, substitutions, change-order preparation, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/material-packages"
      - "PATCH /procurement/material-packages/{id}"
      - "POST /procurement/suppliers"
      - "POST /procurement/suppliers/{id}/disruption-events"
      - "POST /procurement/escalation-agreements"
      - "POST /procurement/escalation-agreements/{id}/propose"
      - "POST /procurement/index-readings"
      - "POST /procurement/purchase-commitments"
      - "POST /procurement/purchase-commitments/{id}/delivery-posture"
      - "POST /procurement/storage-arrangements"
      - "POST /procurement/storage-documents/{id}/revoke"
      - "POST /procurement/substitution-requests"
      - "POST /procurement/substitution-requests/{id}/resubmit"
      - "POST /procurement/substitution-requests/{id}/rescind"
      - "POST /procurement/change-order-requests"
      - "POST /procurement/change-order-requests/{id}/submit"
      - "POST /procurement/_clock/set_current_utc"
    shared_operations:
      - "POST /procurement/projects (with ProjectExecutive)"
      - "POST /procurement/storage-arrangements/{id}/documents (with SupplierRep)"
      - "all GET endpoints"
    note: |
      Segregation of duties is enforced WITHIN this role by X-User-ID: the user who prepares a
      change order may not be the user who submits it. Both are BuyoutManagers.

  - name: SupplierRep
    description: "A fabricator's or vendor's representative: quotes, revisions, counters on escalation terms, and filing its own storage documents."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /procurement/quotes"
      - "POST /procurement/quotes/{id}/revise"
      - "POST /procurement/escalation-agreements/{id}/counter"
    shared_operations:
      - "POST /procurement/storage-arrangements/{id}/documents (with BuyoutManager)"
      - "all GET endpoints except the project and change-order reads"
    note: |
      X-User-ID MUST equal the Supplier.id being acted for; a mismatch is
      ERR_SUPPLIER_SCOPE_VIOLATION, not ERR_UNAUTHORIZED.

  - name: ProjectExecutive
    description: "Contractor officer with signing authority: executes escalation clauses, countersigns and cancels POs, suspends suppliers."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/escalation-agreements/{id}/execute"
      - "POST /procurement/purchase-commitments/{id}/commit"
      - "POST /procurement/purchase-commitments/{id}/cancel"
      - "POST /procurement/suppliers/{id}/suspend"
    shared_operations:
      - "POST /procurement/projects (with BuyoutManager)"
      - "all GET endpoints"
    note: |
      Deliberately NOT a hierarchical override — a ProjectExecutive cannot create a package, issue a
      PO, move the delivery posture, or move the clock. These are peer roles with disjoint
      authority over the same rows.

  - name: DesignEngineer
    description: "Engineer of record: the only role that may dispose of a substitution request."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/substitution-requests/{id}/disposition"
    shared_operations:
      - "all GET endpoints except the project and change-order reads"

  - name: OwnerRep
    description: "The owner's representative: reads the buyout log and disposes of substantiated change orders."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/change-order-requests/{id}/disposition"
    shared_operations:
      - "GET /procurement/projects/{id}"
      - "GET /procurement/change-order-requests/{id} and GET /procurement/change-order-requests"
      - "all other GET endpoints except none — the OwnerRep has full read access"
