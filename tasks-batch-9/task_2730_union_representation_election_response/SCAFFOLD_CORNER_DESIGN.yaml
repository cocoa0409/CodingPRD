      - name: a_new_voter_list_supersedes_the_draft_it_replaces
        claim_type: Conditional action
        grounds:
          - endpoints.POST_voter_lists
          - concurrency_rules.voter-list-create-stale-petition
          - entities.VoterList.fields.status
          - entities.VoterListEntry.fields.voter_list_id
        distinguishing_aspect: |
          Creation is conditional on the existing list's state: a DRAFT predecessor is silently SUPERSEDED
          and the second create succeeds, whereas a SUBMITTED one would be refused. The superseded list keeps
          its entries and its counters - the entries are NOT migrated - so the fresh list starts at
          total_entry_count 0, and each successful create bumps Petition.version by exactly one, which is
          why the second call needs a re-read version.
