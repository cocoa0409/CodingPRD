              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "51 Midway Ln", latitude_micro: 39094950, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_d_id: $.data.id }
          trigger:
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_d_id}", customer_name: "Dee", customer_phone: "555-0104", food_subtotal_cents: 2000, payment_method: "CARD", tip_cents: 0 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_d2_id: $.data.id }
          assert:
            - "ServiceAddress.${addr_d_id}.grid_miles == 6.33"
