          assert:
            - "second policy error_id == ERR_POLICY_ALREADY_EXISTS"

      - name: prescription_from_expired_intake_returns_intake_expired
        claim_type: Temporal validation
        grounds: ["validations[priority=12.5]", "errors[ERR_INTAKE_EXPIRED]"]
        distinguishing_aspect: "Writing a prescription when the intake was submitted more than 90 days before the current clock returns ERR_INTAKE_EXPIRED (intake CLEARED but stale)."
        test_recipe:
          setup: ["CLEARED intake submitted 2026-06-01; completed visit; clock advanced to 2026-09-15 (>90 days)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /patients"
              payload: { full_name: "Yui Fg", email: "yui@x.com", date_of_birth: "1969-09-19", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Jax", specialty: "GYNECOLOGY", npi: "2828282828", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 30, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 15000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "prescription create error_id == ERR_INTAKE_EXPIRED"

      - name: visit_with_draft_intake_returns_not_submitted
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9.5]", "errors[ERR_INTAKE_NOT_SUBMITTED]"]
        distinguishing_aspect: "Scheduling a visit against a DRAFT (never-submitted) intake returns ERR_INTAKE_NOT_SUBMITTED."
