              as: ShareAdmin
              as_user_id: "${acct_fz}"
              captures: { list_fz_b: $.data.id }
            - call: "POST /v1/listings/${list_fz_b}/publish"
              payload: {}
              as: ShareAdmin
              as_user_id: "${acct_fz}"
            - call: "GET /v1/listings/${list_fz_a}"
              payload: {}
              as: ShareAdmin
