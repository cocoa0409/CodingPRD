      - name: corner_calc_input_set_excludes_declined_and_draft_invitations
        claim_type: input_set_filtering
        grounds:
          - calculations.purse_and_budget_ledger
          - state_machines.Invitation.OFFERED_to_DECLINED
        distinguishing_aspect: >-
          The appearance ledger's input set is exactly the ACCEPTED invitations: a DECLINED one and a
          still-OFFERED one must each contribute 0, so committing 884,000 for the single acceptance
          is the whole ledger regardless of how many packages were offered.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with appearance_budget_cents 9,000,000 and three invitations offered identical 700,000 packages; athlete A accepts, athlete B declines, athlete C leaves the offer open."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
