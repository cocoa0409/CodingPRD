              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
