            - "Agreement AGR_V6 (quality_withhold_bps 700) with one ACTIVE physician holding a FINAL 2026 scorecard (7000/7000/7000 -> composite 7000, release 7500), one enrollee, a PROFESSIONAL 2026 pool funded 18600 with withheld_balance_cents 1400, no claims, driven to SETTLEMENT_PROPOSED."
