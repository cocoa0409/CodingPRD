      - name: analyst_assignment_half_open_window_adjacency
        grounds:
          - entities.AnalyticalTeamAssignment.fields.window_start
          - entities.AnalyticalTeamAssignment.fields.window_end
          - validations[priority=11]
          - errors.ERR_ANALYST_ASSIGNMENT_OVERLAP
        distinguishing_aspect: |
          Assignment occupancy is half-open [window_start, window_end): a new
          window whose start equals the previous window's end is admissible,
          while a window whose start precedes the previous end by one second is
          a collision — an adjacency-inclusive interval arithmetic.
