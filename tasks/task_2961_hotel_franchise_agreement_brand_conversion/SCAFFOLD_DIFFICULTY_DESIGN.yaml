              as: BrandStandardsDirector
              captures: { unit_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "COMPETITOR", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/impact-analysis"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /existing-units/${unit_id}/status"
              payload: { to_status: "SUSPENDED", reason: "Guestroom tower renovation." }
              as: BrandStandardsDirector
          trigger:
            - call: "POST /applications/${app_id}/encroachment-claims"
              payload: { existing_unit_id: "${unit_id}", claimed_revenue_loss_pct: 11.25, narrative: "Filed while the complaining hotel is suspended." }
              as: BrandStandardsDirector
            - call: "POST /existing-units/${unit_id}/status"
              payload: { to_status: "OPERATING", reason: "Renovation complete, hotel reopened." }
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/encroachment-claims"
              payload: { existing_unit_id: "${unit_id}", claimed_revenue_loss_pct: 11.25, narrative: "Refiled after the hotel reopened." }
              as: BrandStandardsDirector
              captures: { claim_id: $.data.id }
          assert:
            - "The first claim-filing call returns HTTP 422 with data.error_id == ERR_UNIT_NOT_OPERATING"
            - "GET /encroachment-claims?application_id=${app_id} returns total_count == 1 after the whole trigger sequence (only the refiled claim exists)"
            - "ExistingUnit.${unit_id}.status == OPERATING"
            - "Brand.${brand_id}.operating_unit_count == 1"
            - "EncroachmentClaim.${claim_id}.status == FILED"
            - "EncroachmentClaim.${claim_id}.existing_unit_id == ${unit_id}"
            - "EncroachmentClaim.${claim_id}.penalty_points_applied == 0.00"
            - "Application.${app_id}.status == UNDER_REVIEW"
            - "Application.${app_id}.impact_study_status == PRELIMINARY"
            - "Application.${app_id}.preliminary_impact_score == 32.73 and Application.${app_id}.impact_unit_count_preliminary == 1 (scored before the suspension)"
            - "Application.${app_id}.sustained_claim_count == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_term_closed_interval_conflicts_on_a_single_touching_day
        grounds:
          - validations[priority=27]
          - errors.ERR_TERRITORY_TERM_CONFLICT
          - entities.ExistingUnit.fields.territory_end_date
          - entities.Application.fields.requested_conversion_date
        distinguishing_aspect: |
          Resource entity: the ExistingUnit's protected territory. Interval semantics: both the unit's
          territory term and the requested license term are CLOSED intervals, so an overlap of a
          single day — the incumbent's territory ending on exactly the new hotel's conversion date —
          is a conflict, while ending one day earlier is not. The two candidate units are placed
          exactly 5.00 miles out so the impact score stays 0.00/CLEAR in both arms and the only
          difference between a 409 and a 200 is the one-day interval touch.
        test_recipe:
          setup:
            - "Two brands, each with one OPERATING 150-room unit exactly 5.00 miles from its applicant property, so both impact studies score 0.00 and end CLEAR."
            - "The SOLARIS incumbent holds territory through 2026-10-01, exactly the requested conversion date."
            - "The POLARIS incumbent holds territory through 2026-09-30, one day before its applicant's conversion date."
            - "One STRONG owner behind both applications; both requests are for a 20-year term from 2026-10-01, so the license interval is [2026-10-01, 2046-10-01]."
