      - name: safety_beats_referential_on_begin_examination
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.DocumentPackage.SUBMITTED_to_IN_EXAMINATION
        distinguishing_aspect: |
          Error-category pair business_safety(priority 7, submitter suspended) vs
          business_referential(priority 8, index completeness). A SUBMITTED package
          with only a GRANTOR (no GRANTEE → index incomplete) whose owner is also
          SUSPENDED violates both checks; begin-examination returns the higher-
          priority ERR_SUBMITTER_SUSPENDED, not ERR_INDEX_INCOMPLETE.
        test_recipe:
          setup:
