              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_READING_STATE (state priority 7 beats temporal priority 22, even though the attestation window is also expired)"
            - "MeterReading.${r1}.status unchanged == REJECTED"

      - name: safety_vs_fiscal_on_report_submit
        grounds:
          - validations[priority=18]
          - validations[priority=36]
          - errors[ERR_DOUBLE_COUNT]
