          - state_machines.Interview.SCHEDULED_to_CANCELLED
          - entities.JobPosting.fields.blocked_university_ids
        distinguishing_aspect: "Depth-4 cascade from decide=BLOCK: EmployerApproval BLOCKED -> JobPosting.blocked_university_ids gains the university -> INTERVIEWING Application AUTO_WITHDRAWN -> its SCHEDULED Interview CANCELLED; each hop is caused by the previous one, and the OFFER_EXTENDED sibling application is provably untouched (conditional cascade)."
