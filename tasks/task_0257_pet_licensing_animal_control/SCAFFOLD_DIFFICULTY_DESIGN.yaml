              as: Owner
              as_user_id: "${oe_id}"
              captures: { ve_id: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${oe_id}", pet_id: "${pe_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${oe_id}"
              captures: { le_id: $.data.id }
            - call: "POST /licenses/${le_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${oe_id}"
            - call: "POST /licenses/${le_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${le_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${le_id}/attach-vaccination"
              payload: { vaccination_record_id: "${ve_id}" }
              as: Owner
              as_user_id: "${oe_id}"
            - call: "POST /licenses/${le_id}/approve"
