            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "O Two", email: "o2@x.com" }, as: Manager }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "O Three", email: "o3@x.com" }, as: Manager }
          trigger:
            - { call: "GET /arc/associations/${assoc}/owners", payload: { limit: 2 }, as: Manager }
            - { call: "GET /arc/associations/${assoc}/owners", payload: { limit: 2, offset: 2 }, as: Manager }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): data length == 1, total_count == 3, has_more == false"

