          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The external Employer role has no write access to the scheduling surface: session create is 403 ERR_INSUFFICIENT_PERMISSIONS regardless of body validity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain ready for session creation."
          setup_api_calls:
