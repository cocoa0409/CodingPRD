              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-4301", member_external_id: "M-4301", tier: "DEPENDENT", effective_date: "2026-01-01" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { elig_id: $.data.id }
            - call: "POST /participants"
              payload: { employer_id: "${emp_id}", eligibility_record_id: "${elig_id}", display_name: "Attest Tester" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /health-assessments"
              payload: { participant_id: "${p_id}", source_type: "SELF_ATTESTED", measurement_date: "2026-06-01", bmi: 26.0, self_reported_tobacco: false }
              as: Participant
              as_user_id: "${p_id}"
              captures: { hra_id: $.data.id }
          assert:
            - "HTTP 201"
            - "HealthAssessment.${hra_id}.risk_points_raw == 4"
            - "HealthAssessment.${hra_id}.risk_points_total == 5"
            - "HealthAssessment.${hra_id}.risk_band == MODERATE"
            - "HealthAssessment.${hra_id}.outcome_standard_met == true"
            - "HealthAssessment.${hra_id}.outcome_credit_status == MET_DIRECT"
            - "HealthAssessment.${hra_id}.visit_id == null"

      - name: emergent_and_routine_sla_variants_diverge_from_one_base_instant
        claim_type: Variant Divergence
        grounds:
          - calculations.referral_sla_due_at
          - entities.Referral.fields.urgency
          - entities.Site.fields.closure_dates
        distinguishing_aspect: "From the identical base instant 2026-06-08T10:00:00Z the EMERGENT variant lands 4 calendar hours later at 2026-06-08T14:00:00.000Z, while the ROUTINE variant walks 10 site-open days around the 2026-06-12 closure and both weekends to 2026-06-23T17:00:00.000Z."
        test_recipe:
          setup: ["Site open Monday to Friday 08:00-17:00 with 2026-06-12 declared a closure date."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
