  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_slot_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_APPOINTMENT_SLOT_CONFLICT]
          - entities.Appointment.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics: half-open 60-minute slots on the
          CommunityProvider resource — [10:00,11:00) and [11:00,12:00) touch
          but do NOT overlap (adjacency allowed), while 10:30 collides with
          the first slot and is rejected. Different interval semantics than the
          sibling's closed calendar-day collision.
        test_recipe:
          setup:
            - "ACTIVE episode (3 visits, 60-day window) on a TPA-scheduled provider with no prior appointments"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 3, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap1: $.data.id, ap1_status: $.data.status }
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T11:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap2: $.data.id, ap2_status: $.data.status }
          trigger:
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:30:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${ap1}.status == SCHEDULED and Appointment.${ap2}.status == SCHEDULED — adjacent half-open slots coexist"
            - "10:30 booking rejected: error_id == ERR_APPOINTMENT_SLOT_CONFLICT (overlaps [10:00, 11:00))"
            - "GET /community-care/referral-authorizations/${ra_id}/appointments -> total_count == 2 after the rejection"

      - name: veteran_same_day_urgent_visit_closed_day_collision
        grounds:
          - validations[priority=7]
          - errors[ERR_SAME_DAY_URGENT_VISIT]
          - entities.UrgentCareVisit.fields.visit_date
        distinguishing_aspect: |
          Interval semantics: closed calendar-day granularity on the Veteran
          resource (not the sibling's half-open 60-minute slot arithmetic on
          CommunityProvider) — a second urgent care visit on the same calendar
          date collides regardless of clock time, and the very next day is
          clean again.
        test_recipe:
          setup:
            - "PG-2 veteran (LOW band); clock pinned at 2026-09-01T08:00:00Z; one urgent care visit already recorded that day"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Urgent", home_station_id: "${st_id}", priority_group: 2, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id }
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "QuickCare" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { u1: $.data.id, u1_copay: $.data.copay_cents }
          trigger:
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "OtherClinic" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "OtherClinic" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { u3: $.data.id, u3_status: $.data.status, u3_date: $.data.visit_date }
          assert:
            - "first visit: status == RECORDED, copay_cents == 0 (LOW band), visit_date == 2026-09-01"
            - "same-day second visit: error_id == ERR_SAME_DAY_URGENT_VISIT (closed day-level collision, time-of-day irrelevant)"
            - "next-day visit: status == RECORDED with visit_date == 2026-09-02 — the resource frees at midnight, not after 24h or 60 minutes"

  - rule_id: compensating_invariant
    instances:
      - name: visit_ledger_conserved_across_create_complete_cancel
        grounds:
          - calculations.remaining_visits_ledger
          - entities.ReferralAuthorization.fields.remaining_visits
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: visit count. Across create (reserve), complete
          (consume) and cancel (compensate, release), the ledger
          authorized_visits + extended_visits == completed + reserved +
          remaining holds at every read: 2 + 3 == {0+2+3, 1+1+3, 1+0+4} in
          sequence, with the cancel exactly undoing its reservation.
        test_recipe:
          setup:
            - "AUTHORIZED episode with authorized_visits 2 plus an APPROVED +3 extension (no documentation exists yet, so the docs gate passes); two appointments then scheduled"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
