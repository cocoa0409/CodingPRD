            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 36.0, fat_dry_basis_pct: 52.0, body_score: 9, flavor_score: 9 }, as: QAGrader, as_user_id: "qa_carol" }
            - { call: "POST /plant/cheese-batches/${batch_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/allocation-orders", payload: { cheese_batch_id: "${batch_id}", channel: "BRANDED", customer_name: "House Brand", wheels_requested: 10, priority: 1 }, as: SalesPlanner, captures: { order_ok: $.data.id } }
            - { call: "POST /plant/allocation-orders", payload: { cheese_batch_id: "${batch_id}", channel: "PRIVATE_LABEL", customer_name: "Acme", wheels_requested: 10, priority: 2 }, as: SalesPlanner, captures: { order_bad: $.data.id } }
