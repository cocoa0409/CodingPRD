              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /members"
              payload: { email: "d@x.com", full_name: "D Shopper" }
              as: Cashier
              as_user_id: "csh-1"
              captures: { member_id: $.data.id }
            - call: "POST /sales"
              payload: { member_id: "${member_id}" }
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 4 }
              as: Cashier
              as_user_id: "csh-1"
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { earned: $.data.points_earned }
            - call: "POST /sales/${sale_id}/pay"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/refund"
              payload: {}
              as: StoreManager
              as_user_id: "mgr-1"
          assert:
            - "SalesTransaction.${sale_id}.points_earned == 10"
            - "LoyaltyMember.${member_id}.points_balance == 0"
