  - rule_id: compensating_invariant
    instances:
      - name: inventory_reserve_release_conservation
        grounds:
          - calculations.inventory_position
          - entities.InventoryLot.fields.reserved_tons
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL TONS per product. Invariant pinned:
          sum(received_tons) == sum(on_hand_tons) + sum(shipped_tons) at all times;
          the forward action (book: reserved 0 -> 8.703) paired with its
          compensation (cancel: reserved -> 0) leaves on_hand/shipped untouched
          and restores available exactly.
