# =============================================================================
# Scaffold: Fence & Deck Installation contractor management (Expert tier)
# =============================================================================

scenario: |
  324. Fence & Deck Installation: material/style & linear-foot estimate, site
  measure & property-line note, permit & HOA approval, material order & delivery,
  crew scheduling, change order, deposit/progress draw, warranty

domain_name: fence-deck-installation
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # estimated (input qty) vs reconciled (measured qty)
    - cascading_side_effects          # change order apply -> re-price -> draw rebalance -> order delta
    - optimistic_concurrency          # OCC on Project.version for change-order create supersede
    - derived_field_reconciliation    # Project draw/contract balances reconciled from children
    - rate_threshold_triggers         # deposit cap, slope surcharge threshold, draw release gates

  entity_topology: hierarchical
  # Strict ownership tree under /projects; estimate line items nest under estimate;
  # all lifecycle children (measure, permit, hoa, order, crew booking, change order,
  # draw, warranty) hang off the Project aggregate root.

  state_machine_shape: branching
  # ChangeOrder fork-join (DRAFT->{APPLIED, REJECTED, WITHDRAWN}); Permit revision
  # loop (SUBMITTED->RETURNED->SUBMITTED); Draw branching (SCHEDULED->{INVOICED->PAID,
  # VOIDED}); Project gate machine derives readiness from children.

  relationship_patterns:
    - one_to_many        # Project -> {Estimate, Permit, HoaApproval, MaterialOrder, CrewBooking, ChangeOrder, Draw}
    - cross_aggregate    # ChangeOrder references LineItem across the estimate sub-tree; CrewBooking references crew pool

  role_model: peer_roles
  # Estimator owns estimates/line items; FieldTech owns site measures and crew bookings;
  # PermitClerk owns permits/HOA; ProjectManager owns change orders, draws, warranties,
  # and project creation; Customer is an entity-backed read/approve actor on their project.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the property owner this project is for" }
      - { name: site_address, type: string, source: input, description: "Free-text site street address" }
      - { name: job_type, type: enum, source: input, description: "FENCE | DECK | FENCE_AND_DECK" }
      - { name: status, type: enum, source: system, description: "DRAFT | ESTIMATED | MEASURED | APPROVED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED — workflow gate state" }
      - { name: active_estimate_id, type: string, source: computed, description: "id of the Estimate currently in ACCEPTED status (null if none)" }
      - { name: contract_total, type: number, source: computed, description: "Accepted estimate contract_total, overwritten by reconciled_total on site measure and by re-price on change-order apply; 0.00 until an estimate is accepted" }
      - { name: draws_paid_total, type: number, source: computed, description: "Sum of amount over Draw rows in PAID status for this project" }
      - { name: balance_due, type: number, source: computed, description: "contract_total - draws_paid_total" }
      - { name: permit_clearance, type: enum, source: computed, description: "PENDING | CLEARED | BLOCKED — derived by permit_clearance_derivation: BLOCKED if any Permit DENIED or any HoaApproval REJECTED; else CLEARED if at least one Permit ISSUED and (Customer.hoa_governed == false OR at least one HoaApproval APPROVED); else PENDING" }

  - name: Customer
    parent: null
    common_fields: false   # id, created_at only — immutable identity record
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: hoa_governed, type: boolean, source: input, description: "Whether the customer's property is in an HOA (drives whether HoaApproval is required)" }

  - name: Estimate
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: status, type: enum, source: system, description: "DRAFT | PRICED | ACCEPTED | SUPERSEDED — only one ACCEPTED estimate per project at a time" }
      - { name: tax_rate_pct, type: number, source: input, description: "Material tax rate percent applied per line, e.g. 7.25", default: 7.25 }
      - { name: material_subtotal, type: number, source: computed, description: "Sum of LineItem.line_material_cost (each already rounded) for this estimate" }
      - { name: labor_subtotal, type: number, source: computed, description: "round(sum of LineItem labor) + MOBILIZATION_FEE" }
      - { name: material_tax, type: number, source: computed, description: "Sum over line items of round(line_material_cost * tax_rate_pct/100) — rounded per line then summed" }
      - { name: contract_total, type: number, source: computed, description: "round(material_subtotal + labor_subtotal + material_tax)" }
      - { name: reconciled_total, type: number, source: computed, description: "Re-priced contract_total using measured quantities captured by an APPROVED SiteMeasure; null until site measure approved" }

  - name: LineItem
    parent: Estimate
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: system, description: "FK -> Estimate.id; owning estimate" }
      - { name: work_type, type: enum, source: input, description: "FENCE | DECK — selects labor rate" }
      - { name: material, type: enum, source: input, description: "CEDAR | VINYL | COMPOSITE | PT_PINE | ALUMINUM" }
      - { name: style, type: enum, source: input, description: "PRIVACY | PICKET | DECK_STANDARD | ORNAMENTAL — (material,style) selects the per-unit rate" }
      - { name: quantity_units, type: number, source: input, description: "Linear feet (fence) or square feet (deck) from the customer-supplied estimate" }
      - { name: accessory, type: enum, source: input, description: "NONE | SINGLE_GATE | DOUBLE_GATE | STAIR_SET — flat per-line adder", default: NONE }
      - { name: grade_slope_pct, type: number, source: input, description: "Terrain grade percent; >= 15 applies the 1.12 slope surcharge to line material", default: 0 }
      - { name: line_material_cost, type: number, source: computed, description: "round(rate(material,style)*quantity_units*slope_mult + accessory_adder)" }

  - name: SiteMeasure
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: status, type: enum, source: system, description: "RECORDED | APPROVED — recorded by field tech then approved by project manager" }
      - { name: measured_quantities, type: array, source: input, description: "List of { line_item_id, measured_units } overriding estimate quantities for reconciliation" }
      - { name: property_line_note, type: string, source: input, description: "Required surveyor/property-line note; setback distance and encroachment findings" }
      - { name: setback_ok, type: boolean, source: input, description: "Field-tech assertion that the planned build respects the recorded property-line setback" }

  - name: Permit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: permit_type, type: enum, source: input, description: "FENCE_PERMIT | DECK_PERMIT | ZONING_VARIANCE" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | ISSUED | DENIED — RETURNED loops back to SUBMITTED (revision)" }
      - { name: jurisdiction, type: string, source: input, description: "Permitting authority name" }
      - { name: return_reason, type: string, source: computed, description: "Reviewer note set when a submission is RETURNED; null otherwise" }

  - name: HoaApproval
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED" }
      - { name: architectural_packet_ref, type: string, source: input, description: "Reference id of the architectural review packet submitted to the HOA board" }

  - name: MaterialOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: status, type: enum, source: system, description: "PLACED | CONFIRMED | DELIVERED | CANCELLED" }
      - { name: supplier_name, type: string, source: input, description: "Material supplier" }
      - { name: waste_factor_pct, type: number, source: input, description: "Waste percent added to measured units before ordering, e.g. 10", default: 10 }
      - { name: ordered_lines, type: array, source: computed, description: "List of { line_item_id, ordered_units } where ordered_units = ceil(measured_units * (1 + waste_factor_pct/100))" }
      - { name: dock_id, type: string, source: input, description: "Opaque supplier loading-dock identifier; CONFIRMED orders on the same dock_id must keep a buffer between delivery windows" }
      - { name: delivery_window_start, type: datetime, source: input, description: "ISO 8601 UTC delivery window start (inclusive — closed interval)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "ISO 8601 UTC delivery window end (inclusive — closed interval)" }

  - name: CrewBooking
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: crew_id, type: string, source: input, description: "Opaque crew pool identifier; bookings on the same crew_id must not overlap" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC booking window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC booking window end (exclusive — half-open interval)" }

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id; the line item this change order revises" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPLIED | REJECTED | WITHDRAWN" }
      - { name: new_quantity_units, type: number, source: input, description: "Replacement quantity_units for the target line item", default: null }
      - { name: new_accessory, type: enum, source: input, description: "Replacement accessory for the target line item", default: null }
      - { name: expected_project_version, type: integer, source: input, description: "Project.version the requester last observed; OCC guard on DRAFT creation" }
      - { name: total_delta, type: number, source: computed, description: "reconciled/contract_total after apply minus before apply; null until APPLIED" }

  - name: Draw
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: milestone, type: enum, source: system, description: "DEPOSIT | DELIVERY | FRAMING | FINAL — fixed waterfall order" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | INVOICED | PAID | VOIDED" }
      - { name: pct, type: number, source: system, description: "Milestone percentage of contract_total: DEPOSIT 0.20, DELIVERY 0.30, FRAMING 0.30, FINAL 0.20" }
      - { name: amount, type: number, source: computed, description: "round(contract_total*pct), DEPOSIT clamped to DEPOSIT_CAP, FINAL absorbs the rounding/clamp remainder so the four amounts sum to contract_total" }

  - name: Warranty
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: status, type: enum, source: system, description: "ISSUED | CLAIMED | EXPIRED | VOIDED" }
      - { name: coverage_years, type: integer, source: input, description: "Warranty term in years", default: 5 }
      - { name: workmanship_only, type: boolean, source: input, description: "True = labor/workmanship only; False = labor + materials", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ESTIMATED
        trigger: "POST /projects/{id}/estimates/{estimate_id}/accept"
        actor: Customer
        preconditions:
          - "Estimate.status == PRICED (ERR_ESTIMATE_NOT_PRICED)"
          - "Acting Customer X-User-ID == Project.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "Estimate.status -> ACCEPTED; any other ACCEPTED estimate on the project -> SUPERSEDED"
          - "Project.active_estimate_id = this estimate id; Project.contract_total = Estimate.contract_total"
          - "Four Draw rows created (DEPOSIT/DELIVERY/FRAMING/FINAL) in SCHEDULED with amounts from draw_schedule"
          - "Project.balance_due recomputed"
      - from: ESTIMATED
        to: MEASURED
        trigger: "POST /projects/{id}/site-measures/{site_measure_id}/approve"
        actor: ProjectManager
        preconditions:
          - "SiteMeasure.status == RECORDED (ERR_INVALID_STATE)"
          - "SiteMeasure.setback_ok == true (ERR_SETBACK_VIOLATION)"
        side_effects:
          - "Estimate.reconciled_total computed from measured_quantities; Project.contract_total = reconciled_total"
          - "Draw amounts re-derived from new contract_total for all non-PAID draws (draw_rebalance)"
          - "Project.balance_due recomputed"
      - from: MEASURED
        to: APPROVED
        trigger: "system: Project.permit_clearance becomes CLEARED"
        actor: system
        preconditions:
          - "permit_clearance == CLEARED (every required Permit ISSUED and required HoaApproval APPROVED)"
        side_effects:
          - "Project.status -> APPROVED (gate opens for crew scheduling and material ordering)"
        note: "Auto-transition fired by the permit/HOA side-effect chain when the last clearance lands."
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /projects/{id}/crew-bookings/{crew_booking_id}/confirm"
        actor: FieldTech
        preconditions:
          - "CrewBooking.status == HELD (ERR_INVALID_STATE)"
          - "A MaterialOrder for this project is in CONFIRMED or DELIVERED (ERR_MATERIAL_NOT_READY)"
        side_effects:
          - "CrewBooking.status -> CONFIRMED"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /projects/{id}/draws/{draw_id}/pay (milestone=DEPOSIT)"
        actor: ProjectManager
        preconditions:
          - "Draw.milestone == DEPOSIT and Draw.status == INVOICED (ERR_INVALID_STATE)"
        side_effects:
          - "Draw.status -> PAID; Project.draws_paid_total and balance_due recomputed"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /projects/{id}/draws/{draw_id}/pay (milestone=FINAL)"
        actor: ProjectManager
        preconditions:
          - "Draw.milestone == FINAL and Draw.status == INVOICED (ERR_INVALID_STATE)"
          - "All non-FINAL, non-VOIDED draws are PAID (ERR_DRAW_SEQUENCE_VIOLATION)"
        side_effects:
          - "Draw.status -> PAID; Project.balance_due recomputed (must reach 0.00)"
          - "A Warranty in ISSUED is created for the project"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "All non-terminal CrewBooking rows -> CANCELLED; all SCHEDULED/INVOICED draws -> VOIDED"
      - from: ESTIMATED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "All non-terminal CrewBooking rows -> CANCELLED; all SCHEDULED/INVOICED draws -> VOIDED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "All non-terminal CrewBooking rows -> CANCELLED; all SCHEDULED/INVOICED draws -> VOIDED; any PLACED/CONFIRMED MaterialOrder -> CANCELLED"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /projects/{id}/estimates/{estimate_id}/price"
        actor: Estimator
        preconditions:
          - "Estimate has at least one LineItem (ERR_EMPTY_ESTIMATE)"
        side_effects:
          - "material_subtotal, labor_subtotal, material_tax, contract_total computed (line_item_estimate + estimate_rollup)"
      - from: PRICED
        to: ACCEPTED
        trigger: "POST /projects/{id}/estimates/{estimate_id}/accept"
        actor: Customer
        preconditions:
          - "No other Estimate on this project is ACCEPTED at a stale Project.version (handled by OCC on change-order path); Estimate.status == PRICED (ERR_ESTIMATE_NOT_PRICED)"
        side_effects:
          - "status -> ACCEPTED; bubbles up Project DRAFT->ESTIMATED"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: another estimate accepted, or change-order apply re-prices"
        actor: system
        preconditions: []
        side_effects:
          - "Estimate frozen; replaced as Project.active_estimate_id"

  - entity: SiteMeasure
    initial_state: RECORDED
    terminal_states: [APPROVED]
    transitions:
      - from: RECORDED
        to: APPROVED
        trigger: "POST /projects/{id}/site-measures/{site_measure_id}/approve"
        actor: ProjectManager
        preconditions:
          - "Project.status == ESTIMATED (ERR_INVALID_STATE)"
          - "setback_ok == true (ERR_SETBACK_VIOLATION)"
        side_effects:
          - "Triggers reconcile_estimate; bubbles up Project ESTIMATED->MEASURED"

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [ISSUED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /projects/{id}/permits/{permit_id}/submit"
        actor: PermitClerk
        preconditions:
          - "Project.status in {MEASURED, APPROVED} (ERR_PERMIT_TOO_EARLY)"
        side_effects: []
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /projects/{id}/permits/{permit_id}/decide (decision=RETURN)"
        actor: PermitClerk
        preconditions: []
        side_effects:
          - "return_reason set; permit must be resubmitted (revision loop)"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /projects/{id}/permits/{permit_id}/submit"
        actor: PermitClerk
        preconditions: []
        side_effects:
          - "return_reason cleared to null"
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /projects/{id}/permits/{permit_id}/decide (decision=ISSUE)"
        actor: PermitClerk
        preconditions: []
        side_effects:
          - "Recompute Project.permit_clearance; if CLEARED, bubble up Project MEASURED->APPROVED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /projects/{id}/permits/{permit_id}/decide (decision=DENY)"
        actor: PermitClerk
        preconditions: []
        side_effects:
          - "Project.permit_clearance -> BLOCKED"

  - entity: HoaApproval
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /projects/{id}/hoa-approvals/{hoa_approval_id}/decide (decision=APPROVE)"
        actor: PermitClerk
        preconditions: []
        side_effects:
          - "Recompute Project.permit_clearance; if CLEARED, bubble up Project MEASURED->APPROVED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /projects/{id}/hoa-approvals/{hoa_approval_id}/decide (decision=REJECT)"
        actor: PermitClerk
        preconditions: []
        side_effects:
          - "Project.permit_clearance -> BLOCKED"

  - entity: MaterialOrder
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /projects/{id}/material-orders/{material_order_id}/confirm"
        actor: ProjectManager
        preconditions:
          - "Project has an APPROVED SiteMeasure (ERR_MEASURE_REQUIRED)"
          - "No other CONFIRMED/DELIVERED MaterialOrder on the same dock_id has a delivery window within DOCK_BUFFER_HOURS of this order's closed [delivery_window_start, delivery_window_end] window (ERR_DOCK_WINDOW_CONFLICT)"
        side_effects:
          - "ordered_lines computed from measured units and waste_factor_pct (material_takeoff)"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /projects/{id}/material-orders/{material_order_id}/deliver"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "DELIVERY draw (if SCHEDULED) becomes INVOICED"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /projects/{id}/material-orders/{material_order_id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /projects/{id}/material-orders/{material_order_id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: CrewBooking
    initial_state: HELD
    terminal_states: [CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /projects/{id}/crew-bookings/{crew_booking_id}/confirm"
        actor: FieldTech
        preconditions:
          - "Project.status == APPROVED (ERR_INVALID_STATE)"
          - "A MaterialOrder is CONFIRMED or DELIVERED (ERR_MATERIAL_NOT_READY)"
          - "No CONFIRMED CrewBooking on the same crew_id overlaps [window_start, window_end) (ERR_CREW_DOUBLE_BOOKED)"
        side_effects:
          - "status -> CONFIRMED; bubbles up Project APPROVED->SCHEDULED"
      - from: HELD
        to: CANCELLED
        trigger: "POST /projects/{id}/crew-bookings/{crew_booking_id}/cancel"
        actor: FieldTech
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /projects/{id}/crew-bookings/{crew_booking_id}/cancel"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "Frees the [window_start, window_end) slot on crew_id"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /change-orders/{change_order_id}/apply"
        actor: ProjectManager
        preconditions:
          - "Project.status in {ESTIMATED, MEASURED, APPROVED} (ERR_CHANGE_ORDER_TOO_LATE)"
          - "Target LineItem belongs to the project's ACCEPTED estimate (ERR_INVALID_STATE)"
        side_effects:
          - "Target LineItem quantity_units/accessory replaced; line_material_cost recomputed (change_order_reprice)"
          - "Estimate totals + Project.contract_total recomputed; DEPOSIT-paid amount locked, remaining draws rebalanced (draw_rebalance)"
          - "total_delta set; Project.version incremented by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /change-orders/{change_order_id}/decide (decision=REJECT)"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /change-orders/{change_order_id}/withdraw"
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: Draw
    initial_state: SCHEDULED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: SCHEDULED
        to: INVOICED
        trigger: "POST /projects/{id}/draws/{draw_id}/invoice"
        actor: ProjectManager
        preconditions:
          - "Draw release gate satisfied for its milestone (ERR_DRAW_GATE_NOT_MET): DEPOSIT always; DELIVERY needs a DELIVERED MaterialOrder; FRAMING needs Project.status IN_PROGRESS; FINAL needs all prior non-VOIDED draws PAID"
        side_effects:
          - "status -> INVOICED"
      - from: INVOICED
        to: PAID
        trigger: "POST /projects/{id}/draws/{draw_id}/pay"
        actor: ProjectManager
        preconditions:
          - "Draw.status == INVOICED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> PAID; Project.draws_paid_total and balance_due recomputed; DEPOSIT pay bubbles Project SCHEDULED->IN_PROGRESS; FINAL pay bubbles IN_PROGRESS->COMPLETED and issues Warranty"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system: project cancelled"
        actor: system
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: VOIDED
        trigger: "system: project cancelled"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Warranty
    initial_state: ISSUED
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: ISSUED
        to: CLAIMED
        trigger: "POST /projects/{id}/warranties/{warranty_id}/claim"
        actor: Customer
        preconditions:
          - "Acting Customer X-User-ID == Project.customer_id (ERR_FORBIDDEN)"
          - "Project.status == COMPLETED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CLAIMED
        to: ISSUED
        trigger: "POST /projects/{id}/warranties/{warranty_id}/resolve (resolution=REPAIRED)"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "Claim closed; coverage continues (revision loop)"
      - from: CLAIMED
        to: VOIDED
        trigger: "POST /projects/{id}/warranties/{warranty_id}/resolve (resolution=DENIED)"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system: coverage term elapsed (clock-driven)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected. A prior change-order apply (or a
      site-measure reconciliation) has already re-priced the project and advanced
      its version, so the new change order — drafted against quantities the client
      believed current — would target a superseded line-item price. The stale
      expected_project_version is rejected rather than silently re-pricing against
      a moved baseline.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_item_estimate
    trigger: "Estimate DRAFT->PRICED (POST .../estimates/{id}/price); recomputed on change_order apply for the target line"
    algorithm: tiered_pricing
    formula: |
      rate = RATE_TABLE[(material, style)]            # dollars per linear/square foot
      slope_mult = 1.12 if grade_slope_pct >= 15 else 1.00
      line_material_cost = round(rate * quantity_units * slope_mult + ACCESSORY_ADDER[accessory], 2)
      # round_half_up, 2 dp, applied to the whole line (round-then-use downstream)
    input_set: "All LineItem rows under the estimate; each priced independently."
    constants:
      RATE_TABLE:
        CEDAR_PRIVACY: 42.50
        CEDAR_PICKET: 31.00
        VINYL_PRIVACY: 55.75
        COMPOSITE_DECK_STANDARD: 38.25
        PT_PINE_DECK_STANDARD: 24.80
        ALUMINUM_ORNAMENTAL: 48.90
      ACCESSORY_ADDER: { NONE: 0.00, SINGLE_GATE: 285.00, DOUBLE_GATE: 540.00, STAIR_SET: 420.00 }
      SLOPE_THRESHOLD_PCT: 15
      SLOPE_MULTIPLIER: 1.12
    precision: "2 decimal places, round_half_up"

  - name: estimate_rollup
    trigger: "Estimate DRAFT->PRICED; re-run after change_order_reprice"
    algorithm: aggregation
    formula: |
      material_subtotal = round(sum over lines of line_material_cost, 2)        # lines already rounded
      labor_subtotal    = round(sum over lines of LABOR_RATE[work_type]*quantity_units, 2) + MOBILIZATION_FEE
      # material_tax PINNED ORDER: round per line, then sum (NOT sum-then-round)
      material_tax      = sum over lines of round(line_material_cost * (tax_rate_pct/100), 2)
      contract_total    = round(material_subtotal + labor_subtotal + material_tax, 2)
    input_set: "Only LineItem rows belonging to this estimate; estimate status PRICED or being priced."
    constants:
      LABOR_RATE: { FENCE: 9.50, DECK: 22.00 }
      MOBILIZATION_FEE: 650.00
    precision: "2 decimal places, round_half_up; material_tax rounded PER LINE then summed"

  - name: reconcile_estimate
    trigger: "SiteMeasure RECORDED->APPROVED"
    algorithm: forward_looking
    formula: |
      For each measured_quantities entry { line_item_id, measured_units }:
        substitute quantity_units := measured_units for that line (accessory/material/style/slope unchanged)
      reconciled_total = estimate_rollup over the substituted quantities (same formula, round-per-line tax)
      Project.contract_total := reconciled_total
    input_set: "Estimate.contract_total (estimated, input quantities) vs reconciled_total (measured quantities)."
    precision: "2 decimal places, round_half_up"
    variants:
      - name: estimated
        when: "Estimate priced from customer-supplied quantity_units (before site measure approval)"
        difference: "Uses LineItem.quantity_units as the unit count; this is Project.contract_total until a SiteMeasure is APPROVED"
      - name: reconciled
        when: "After SiteMeasure RECORDED->APPROVED with measured_quantities"
        difference: "Uses measured_units in place of quantity_units; overwrites Project.contract_total and rebalances all non-PAID draws"

  - name: draw_schedule
    trigger: "Project DRAFT->ESTIMATED (estimate accept); re-derived by draw_rebalance"
    algorithm: waterfall_allocation
    formula: |
      DRAW_PCT = [(DEPOSIT,0.20),(DELIVERY,0.30),(FRAMING,0.30),(FINAL,0.20)]  # fixed order
      running = 0
      for (milestone, pct) in DRAW_PCT[:-1]:           # all but FINAL
        amt = round(contract_total * pct, 2)
        if milestone == DEPOSIT and amt > DEPOSIT_CAP:  # strict > ; == cap is allowed
          amt = DEPOSIT_CAP
        running += amt
      FINAL.amount = round(contract_total - running, 2)  # absorbs clamp + rounding remainder
    input_set: "Project.contract_total at the moment of allocation."
    constants:
      DEPOSIT_CAP: 10000.00
    precision: "2 decimal places, round_half_up; FINAL is the remainder so the four amounts sum exactly to contract_total"

  - name: draw_rebalance
    trigger: "reconcile_estimate (site measure approve) and change_order apply"
    algorithm: waterfall_allocation
    formula: |
      Re-run draw_schedule on the new contract_total, BUT any Draw already in PAID
      keeps its paid amount fixed (locked). Re-derive only non-PAID draws:
        locked = sum of amount over PAID draws
        remaining_total = contract_total - locked
        For non-PAID, non-VOIDED draws in [DEPOSIT,DELIVERY,FRAMING,FINAL] order,
        allocate by each draw's pct of contract_total (DEPOSIT cap still applies),
        FINAL (if non-PAID) absorbs the remainder so PAID + rebalanced == contract_total.
    input_set: "Draw rows for the project partitioned by PAID vs non-PAID; new contract_total."
    constants:
      DEPOSIT_CAP: 10000.00
    precision: "2 decimal places, round_half_up"

  - name: change_order_reprice
    trigger: "ChangeOrder DRAFT->APPLIED"
    algorithm: constraint_propagation
    formula: |
      1) target line: quantity_units := new_quantity_units (if provided);
                       accessory := new_accessory (if provided)
      2) line_item_estimate recomputed for the target line
      3) estimate_rollup recomputed -> new contract_total (or reconciled basis if a
         SiteMeasure is APPROVED, using measured units for untouched lines and the
         new value for the target line)
      4) total_delta = new contract_total - prior contract_total
      5) draw_rebalance runs; Project.version incremented by 1
    input_set: "Single target LineItem plus all sibling lines for the rollup."
    precision: "2 decimal places, round_half_up"
    variants:
      - name: estimate_basis_reprice
        when: "Change order applied while Project.status == ESTIMATED (no APPROVED SiteMeasure yet)"
        difference: "Untouched sibling lines keep their original quantity_units; rollup uses estimate quantities, so the new contract_total derives from the estimate basis"
      - name: measured_basis_reprice
        when: "Change order applied while Project.status == MEASURED or APPROVED (an APPROVED SiteMeasure exists)"
        difference: "Untouched sibling lines use measured_units from the APPROVED SiteMeasure; only the target line uses new_quantity_units, so the same change order yields a different new contract_total and total_delta than the estimate-basis variant"

  - name: material_takeoff
    trigger: "MaterialOrder PLACED->CONFIRMED"
    algorithm: aggregation
    formula: |
      For each line in the project's APPROVED SiteMeasure measured_quantities:
        ordered_units = ceil(measured_units * (1 + waste_factor_pct/100))   # integer ceiling
      ordered_lines = [ { line_item_id, ordered_units } ... ]
    input_set: "Measured units from the APPROVED SiteMeasure (not estimate quantities)."
    constants:
      DEFAULT_WASTE_FACTOR_PCT: 10
    precision: "integer units, round up (ceil)"

  - name: permit_clearance_derivation
    trigger: "Permit decide (ISSUE/RETURN/DENY) and HoaApproval decide (APPROVE/REJECT)"
    algorithm: aggregation
    formula: |
      Let P = all Permit rows for the project, H = all HoaApproval rows.
      if any p in P has status == DENIED OR any h in H has status == REJECTED:
          permit_clearance = BLOCKED
      elif (exists p in P with status == ISSUED)
           AND (Customer.hoa_governed == false OR exists h in H with status == APPROVED):
          permit_clearance = CLEARED
      else:
          permit_clearance = PENDING
      When permit_clearance transitions to CLEARED and Project.status == MEASURED,
      auto-transition Project MEASURED->APPROVED.
    input_set: "All Permit and HoaApproval rows for the project, plus Customer.hoa_governed."
    precision: "n/a (enum result)"

  - name: crew_overlap_check
    trigger: "CrewBooking HELD->CONFIRMED"
    algorithm: interval_merge
    formula: |
      candidate = [window_start, window_end)   # HALF-OPEN
      For each existing CONFIRMED CrewBooking E on the SAME crew_id (any project):
        conflict if (candidate.start < E.window_end) AND (E.window_start < candidate.end)
      # Half-open: candidate.start == E.window_end (back-to-back) is NOT a conflict.
      If any conflict -> ERR_CREW_DOUBLE_BOOKED.
    input_set: "All CrewBooking rows with status == CONFIRMED on the same crew_id; CANCELLED/HELD ignored."
    precision: "instant comparison; ties broken by created_at ASC if two candidates tie (deterministic, never by id)"

  - name: dock_overlap_check
    trigger: "MaterialOrder PLACED->CONFIRMED"
    algorithm: interval_merge
    formula: |
      buffer = DOCK_BUFFER_HOURS hours
      candidate = [delivery_window_start - buffer, delivery_window_end + buffer]   # CLOSED, buffer-expanded
      For each existing MaterialOrder E with status in {CONFIRMED, DELIVERED} on the SAME dock_id (any project):
        E_closed = [E.delivery_window_start, E.delivery_window_end]   # CLOSED, no buffer on the stored one
        conflict if (candidate.start <= E_closed.end) AND (E_closed.start <= candidate.end)
      # CLOSED + buffer: touching endpoints DO conflict, and any gap smaller than the buffer conflicts.
      If any conflict -> ERR_DOCK_WINDOW_CONFLICT.
    input_set: "All MaterialOrder rows with status in {CONFIRMED, DELIVERED} on the same dock_id; PLACED/CANCELLED ignored."
    constants:
      DOCK_BUFFER_HOURS: 4
    precision: "instant comparison; closed-interval inclusive endpoints; ties by created_at ASC (never by id)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (project before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body foreign keys resolve: Project.customer_id -> Customer; ChangeOrder.line_item_id -> LineItem of the project's ACCEPTED estimate"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /projects, POST .../change-orders"

  - priority: 4b
    category: business_referential
    check: "Semantic body validity: each site-measure measured_quantities entry must reference a LineItem on the project's ACCEPTED estimate and carry measured_units > 0; quantity_units/new_quantity_units must be > 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST .../site-measures, POST /line-items, POST .../change-orders"

  - priority: 5
    category: business_constraint
    check: "Required input fields present and enum values within declared domains (e.g. material, style, milestone)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 6
    category: business_constraint
    check: "On change-order create, expected_project_version equals current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /change-orders"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_safety
    check: "Site measure cannot be approved when setback_ok is false (property-line / setback safety gate)"
    error_id: ERR_SETBACK_VIOLATION
    http_status: 409
    applies_to: "POST .../site-measures/{id}/approve"

  - priority: 8b
    category: business_temporal
    check: "Confirming a material order must keep a DOCK_BUFFER_HOURS gap from any CONFIRMED/DELIVERED order on the same dock_id; closed-interval delivery windows expanded by the buffer must not intersect"
    error_id: ERR_DOCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../material-orders/{id}/confirm"

  - priority: 9
    category: business_temporal
    check: "Confirming a crew booking must not overlap an existing CONFIRMED booking on the same crew_id over [window_start, window_end) (half-open)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST .../crew-bookings/{id}/confirm"

  - priority: 10
    category: business_referential
    check: "Crew booking confirm requires a CONFIRMED or DELIVERED MaterialOrder on the project"
    error_id: ERR_MATERIAL_NOT_READY
    http_status: 409
    applies_to: "POST .../crew-bookings/{id}/confirm"

  - priority: 11
    category: business_constraint
    check: "Draw cannot be invoiced unless its milestone release gate is met (draw_schedule order)"
    error_id: ERR_DRAW_GATE_NOT_MET
    http_status: 409
    applies_to: "POST .../draws/{id}/invoice"

  - priority: 12
    category: business_fiscal
    check: "FINAL draw cannot be paid until every prior non-VOIDED draw is PAID"
    error_id: ERR_DRAW_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST .../draws/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer (property owner identity record)"
    roles: [ProjectManager]
    code: 201
    input: [full_name, email, hoa_governed]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a project"
    roles: [ProjectManager]
    code: 201
    input: [customer_id, site_address, job_type]
    output: Project
    side_effects: ["status=DRAFT; contract_total=0.00; permit_clearance=PENDING"]

  - method: GET
    path: "/projects/{id}"
    description: "Get a project (includes computed contract_total, draws_paid_total, balance_due, permit_clearance, version)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects (paginated; customer_id filter reverse-reaches Project from Customer.id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> CANCELLED; cascade non-terminal crew bookings -> CANCELLED; SCHEDULED/INVOICED draws -> VOIDED; PLACED/CONFIRMED material orders -> CANCELLED"]

  # --- Estimate (nested under project) ---
  - method: POST
    path: "/projects/{id}/estimates"
    description: "Create a draft estimate"
    roles: [Estimator]
    code: 201
    input: ["tax_rate_pct?"]
    output: Estimate
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/projects/{id}/estimates"
    description: "List estimates for a project (reverse-reachability for Estimate.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Estimate[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/estimates/{estimate_id}/price"
    description: "Price a DRAFT estimate (compute subtotals, tax, contract_total)"
    roles: [Estimator]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status -> PRICED; line_item_estimate + estimate_rollup computed"]

  - method: POST
    path: "/projects/{id}/estimates/{estimate_id}/accept"
    description: "Customer accepts a PRICED estimate"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status -> ACCEPTED; other ACCEPTED -> SUPERSEDED; Project -> ESTIMATED; contract_total set; four SCHEDULED draws created"]

  # --- LineItem (top-level collection, estimate_id in body) ---
  - method: POST
    path: "/line-items"
    description: "Add a line item to a DRAFT estimate"
    roles: [Estimator]
    code: 201
    input: [estimate_id, work_type, material, style, quantity_units, "accessory?", "grade_slope_pct?"]
    output: LineItem
    side_effects: []

  - method: GET
    path: "/line-items/{id}"
    description: "Get a line item"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: []
    output: LineItem
    side_effects: []

  - method: GET
    path: "/line-items"
    description: "List line items, filterable by estimate_id (reverse-reachability for LineItem.estimate_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["estimate_id?", "limit?", "offset?"]
    output: LineItem[]
    side_effects: []

  # --- SiteMeasure ---
  - method: POST
    path: "/projects/{id}/site-measures"
    description: "Record a site measure with property-line note and measured quantities"
    roles: [FieldTech]
    code: 201
    input: [measured_quantities, property_line_note, setback_ok]
    output: SiteMeasure
    side_effects: ["status=RECORDED"]

  - method: GET
    path: "/projects/{id}/site-measures"
    description: "List site measures for a project (reverse-reachability for SiteMeasure.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: SiteMeasure[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/site-measures/{site_measure_id}/approve"
    description: "Approve a RECORDED site measure (reconcile estimate)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: SiteMeasure
    side_effects: ["status -> APPROVED; reconcile_estimate; Project -> MEASURED; draw_rebalance"]

  # --- Permit ---
  - method: POST
    path: "/projects/{id}/permits"
    description: "Create a draft permit"
    roles: [PermitClerk]
    code: 201
    input: [permit_type, jurisdiction]
    output: Permit
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/projects/{id}/permits"
    description: "List permits for a project (reverse-reachability for Permit.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/permits/{permit_id}/submit"
    description: "Submit (or resubmit a RETURNED) permit"
    roles: [PermitClerk]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> SUBMITTED; clears return_reason on resubmit"]

  - method: POST
    path: "/projects/{id}/permits/{permit_id}/decide"
    description: "Permit authority decision (ISSUE | RETURN | DENY)"
    roles: [PermitClerk]
    code: 200
    input: [decision, "return_reason?"]
    output: Permit
    side_effects: ["status -> ISSUED|RETURNED|DENIED; recompute permit_clearance; ISSUE may bubble Project MEASURED->APPROVED"]

  # --- HoaApproval ---
  - method: POST
    path: "/projects/{id}/hoa-approvals"
    description: "Submit an HOA architectural approval"
    roles: [PermitClerk]
    code: 201
    input: [architectural_packet_ref]
    output: HoaApproval
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/projects/{id}/hoa-approvals"
    description: "List HOA approvals for a project (reverse-reachability for HoaApproval.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: HoaApproval[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/hoa-approvals/{hoa_approval_id}/decide"
    description: "HOA board decision (APPROVE | REJECT)"
    roles: [PermitClerk]
    code: 200
    input: [decision]
    output: HoaApproval
    side_effects: ["status -> APPROVED|REJECTED; recompute permit_clearance; APPROVE may bubble Project MEASURED->APPROVED"]

  # --- MaterialOrder ---
  - method: POST
    path: "/projects/{id}/material-orders"
    description: "Place a material order"
    roles: [ProjectManager]
    code: 201
    input: [supplier_name, dock_id, delivery_window_start, delivery_window_end, "waste_factor_pct?"]
    output: MaterialOrder
    side_effects: ["status=PLACED"]

  - method: GET
    path: "/projects/{id}/material-orders"
    description: "List material orders for a project (reverse-reachability for MaterialOrder.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/material-orders/{material_order_id}/confirm"
    description: "Confirm a placed order (compute material takeoff from measured units)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> CONFIRMED; material_takeoff -> ordered_lines"]

  - method: POST
    path: "/projects/{id}/material-orders/{material_order_id}/deliver"
    description: "Mark a confirmed order delivered"
    roles: [FieldTech]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> DELIVERED; SCHEDULED DELIVERY draw -> INVOICED"]

  - method: POST
    path: "/projects/{id}/material-orders/{material_order_id}/cancel"
    description: "Cancel a material order"
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> CANCELLED"]

  # --- CrewBooking ---
  - method: POST
    path: "/projects/{id}/crew-bookings"
    description: "Hold a crew booking window"
    roles: [FieldTech]
    code: 201
    input: [crew_id, window_start, window_end]
    output: CrewBooking
    side_effects: ["status=HELD"]

  - method: GET
    path: "/projects/{id}/crew-bookings"
    description: "List crew bookings for a project (reverse-reachability for CrewBooking.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewBooking[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/crew-bookings/{crew_booking_id}/confirm"
    description: "Confirm a held crew booking (overlap + material-readiness checks)"
    roles: [FieldTech]
    code: 200
    input: []
    output: CrewBooking
    side_effects: ["status -> CONFIRMED; Project APPROVED->SCHEDULED"]

  - method: POST
    path: "/projects/{id}/crew-bookings/{crew_booking_id}/cancel"
    description: "Cancel a crew booking (frees the slot)"
    roles: [FieldTech]
    code: 200
    input: []
    output: CrewBooking
    side_effects: ["status -> CANCELLED"]

  # --- ChangeOrder (top-level; project_id + line_item_id in body) ---
  - method: POST
    path: "/change-orders"
    description: "Draft a change order (OCC guard on project version)"
    roles: [ProjectManager]
    code: 201
    input: [project_id, line_item_id, expected_project_version, "new_quantity_units?", "new_accessory?"]
    output: ChangeOrder
    side_effects: ["status=DRAFT; increments Project.version by 1 (claims the pricing baseline so a later create carrying a stale expected_project_version is rejected)"]

  - method: GET
    path: "/change-orders/{id}"
    description: "Get a change order"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/change-orders"
    description: "List change orders, filterable by project_id or line_item_id (reverse-reachability for ChangeOrder.project_id and ChangeOrder.line_item_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["project_id?", "line_item_id?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/apply"
    description: "Apply a draft change order (re-price + draw rebalance, bumps project version)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> APPLIED; change_order_reprice; draw_rebalance; total_delta set; Project.version +1"]

  - method: POST
    path: "/change-orders/{id}/decide"
    description: "Reject a draft change order"
    roles: [ProjectManager]
    code: 200
    input: [decision]
    output: ChangeOrder
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/change-orders/{id}/withdraw"
    description: "Withdraw a draft change order"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> WITHDRAWN"]

  # --- Draw ---
  - method: GET
    path: "/projects/{id}/draws"
    description: "List draws for a project (reverse-reachability for Draw.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Draw[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/draws/{draw_id}/invoice"
    description: "Invoice a scheduled draw (release gate enforced)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Draw
    side_effects: ["status -> INVOICED"]

  - method: POST
    path: "/projects/{id}/draws/{draw_id}/pay"
    description: "Pay an invoiced draw (advances project gate; FINAL issues warranty)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Draw
    side_effects: ["status -> PAID; draws_paid_total/balance_due recomputed; DEPOSIT->IN_PROGRESS; FINAL->COMPLETED + Warranty issued"]

  # --- Warranty ---
  - method: GET
    path: "/projects/{id}/warranties"
    description: "List warranties for a project (reverse-reachability for Warranty.project_id)"
    roles: [ProjectManager, Estimator, FieldTech, PermitClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Warranty[]
    side_effects: []

  - method: PATCH
    path: "/projects/{id}/warranties/{warranty_id}"
    description: "Update warranty terms (coverage_years, workmanship_only) while ISSUED"
    roles: [ProjectManager]
    code: 200
    input: ["coverage_years?", "workmanship_only?"]
    output: Warranty
    side_effects: []

  - method: POST
    path: "/projects/{id}/warranties/{warranty_id}/claim"
    description: "Customer files a warranty claim"
    roles: [Customer]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status -> CLAIMED"]

  - method: POST
    path: "/projects/{id}/warranties/{warranty_id}/resolve"
    description: "Resolve a warranty claim (REPAIRED reopens coverage, DENIED voids)"
    roles: [ProjectManager]
    code: 200
    input: [resolution]
    output: Warranty
    side_effects: ["status -> ISSUED|VOIDED"]

  # --- Test-driving: clock control for warranty expiry ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; drives warranty term expiry)"
    roles: [ProjectManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock advanced; ISSUED warranties past their term -> EXPIRED on next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or Customer acting on a project that is not theirs" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource does not exist (project or child)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A body foreign key (customer_id, line_item_id) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or enum value out of declared domain" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which this transition is defined" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version on change-order create does not equal current Project.version" }
  - { id: ERR_ESTIMATE_NOT_PRICED, http: 409, condition: "Estimate must be PRICED before it can be accepted" }
  - { id: ERR_EMPTY_ESTIMATE, http: 409, condition: "Cannot price an estimate that has no line items" }
  - { id: ERR_SETBACK_VIOLATION, http: 409, condition: "Site measure approval blocked because setback_ok is false" }
  - { id: ERR_PERMIT_TOO_EARLY, http: 409, condition: "Permit cannot be submitted before the project is MEASURED" }
  - { id: ERR_MEASURE_REQUIRED, http: 409, condition: "Material order confirm requires an APPROVED site measure" }
  - { id: ERR_MATERIAL_NOT_READY, http: 409, condition: "Crew booking confirm requires a CONFIRMED or DELIVERED material order" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew booking overlaps an existing CONFIRMED booking on the same crew_id" }
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "Material order delivery window (closed + DOCK_BUFFER_HOURS buffer) intersects another CONFIRMED/DELIVERED order on the same dock_id" }
  - { id: ERR_CHANGE_ORDER_TOO_LATE, http: 409, condition: "Change order cannot be applied once the project is IN_PROGRESS, COMPLETED, or CANCELLED" }
  - { id: ERR_DRAW_GATE_NOT_MET, http: 409, condition: "Draw milestone release gate not satisfied for invoicing" }
  - { id: ERR_DRAW_SEQUENCE_VIOLATION, http: 409, condition: "FINAL draw cannot be paid before all prior non-VOIDED draws are PAID" }
  - { id: ERR_VALIDATION, http: 422, condition: "Body field present but semantically invalid (e.g. measured_quantities references a line not on the accepted estimate, negative quantity)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Owns project lifecycle: project create/cancel, customers, site-measure approval, material orders, change orders, draws, warranties."
    identity: opaque
    exclusive_operations:
      - "POST /customers — create customer"
      - "POST /projects — create project"
      - "POST /projects/{id}/cancel — cancel project"
      - "POST .../site-measures/{id}/approve — approve site measure"
      - "POST .../material-orders — place material order"
      - "POST .../material-orders/{id}/confirm — confirm order"
      - "POST .../material-orders/{id}/cancel — cancel order"
      - "POST .../change-orders — draft change order"
      - "POST .../change-orders/{id}/apply — apply change order"
      - "POST .../change-orders/{id}/decide — reject change order"
      - "POST .../change-orders/{id}/withdraw — withdraw change order"
      - "POST .../draws/{id}/invoice — invoice draw"
      - "POST .../draws/{id}/pay — pay draw"
      - "PATCH .../warranties/{id} — update warranty terms"
      - "POST .../warranties/{id}/resolve — resolve warranty claim"
      - "POST /_clock/set_current_utc — set clock (test-driving)"
    shared_operations:
      - "GET reads on projects and all sub-resources"

  - name: Estimator
    description: "Owns estimates and line items."
    identity: opaque
    exclusive_operations:
      - "POST .../estimates — create estimate"
      - "POST .../estimates/{id}/line-items — add line item"
      - "POST .../estimates/{id}/price — price estimate"
    shared_operations:
      - "GET reads on projects and all sub-resources"

  - name: FieldTech
    description: "Owns site measures, crew bookings, and material delivery."
    identity: opaque
    exclusive_operations:
      - "POST .../site-measures — record site measure"
      - "POST .../crew-bookings — hold crew booking"
      - "POST .../crew-bookings/{id}/confirm — confirm crew booking"
      - "POST .../crew-bookings/{id}/cancel — cancel crew booking"
      - "POST .../material-orders/{id}/deliver — mark delivered"
    shared_operations:
      - "GET reads on projects and all sub-resources"

  - name: PermitClerk
    description: "Owns permits and HOA approvals (acts as the permitting authority / HOA board surface)."
    identity: opaque
    exclusive_operations:
      - "POST .../permits — create permit"
      - "POST .../permits/{id}/submit — submit/resubmit permit"
      - "POST .../permits/{id}/decide — issue/return/deny permit"
      - "POST .../hoa-approvals — submit HOA approval"
      - "POST .../hoa-approvals/{id}/decide — approve/reject HOA approval"
    shared_operations:
      - "GET reads on projects and all sub-resources"

  - name: Customer
    description: "Property owner; accepts estimates and files warranty claims on their own project only."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST .../estimates/{id}/accept — accept estimate (own project)"
      - "POST .../warranties/{id}/claim — file warranty claim (own project)"
    shared_operations:
      - "GET reads on projects and all sub-resources"
