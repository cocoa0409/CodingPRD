  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: fifo_chronological_order_consumption
        claim_type: correct_result
        grounds: [calculations.lot_selection_and_gain]
        distinguishing_aspect: "FIFO consumes the earliest acquisition first: selling 15 sh against lots of 10 @ 1000/sh (Jan) and 10 @ 1200/sh (Feb) consumes all of lot1 and 5 of lot2; gain = 22500 - 16000 = 6500."
        test_recipe:
          setup: ["customer, account with lot1 10 sh basis 10000 (2025-01-05) and lot2 10 sh basis 12000 (2025-02-05)"]
          setup_api_calls:
            - call: "POST /firms"
