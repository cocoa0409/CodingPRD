  # ---------------------------------------------------------------------------
  # Rule 5: validation priority conflicts across DIFFERENT error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_issue
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.ScheduledPayment.PAYABLE_to_ISSUED
        distinguishing_aspect: |
          Category pair state-vs-business_safety: issuing a SCHEDULED (not yet due)
          payment to a minor payee with no guardianship violates both priority 4
          (ERR_PAYMENT_NOT_PAYABLE) and priority 5 (ERR_GUARDIANSHIP_REQUIRED);
          the state error must win.
        test_recipe:
          setup:
            - "CA profile (AOM 18); MINOR payee (DOB 2012-03-10, age 14 at default clock); NO guardianship case"
            - "funded agreement; ACTIVE schedule with payment 50000 due 2027-01-01 (esc 0)"
            - "logical clock at default 2026-08-01T00:00:00Z — payment still SCHEDULED (dual failure armed)"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Min Or", date_of_birth: "2012-03-10", tax_id: "888-99-0000", address_line1: "4 Juniper St", address_city: "Fresno", address_state_code: "CA", address_postal_code: "93702" }
              as: CaseManager
              captures: { payee_id: $.data.id, payee_minor: $.data.is_minor }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "PR-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-M", insurer_name: "LifeCo", premium_cents: 10000000, contract_discount_rate_bps: 500, commutation_rider: "DEATH_AND_HARDSHIP", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2027-01-01", base_amount_cents: 50000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
          trigger:
            - call: "POST /annuity/scheduled-payments/${p1_id}/issue"
              payload: { method: "CHECK" }
              as: OperationsSpecialist
              as_user_id: "ops-1"
              captures: { issue_err: $.data.error_id }
          assert:
            - "${payee_minor} == true (minor; safety violation armed)"
            - "${issue_err} == ERR_PAYMENT_NOT_PAYABLE (state, priority 4, beats ERR_GUARDIANSHIP_REQUIRED at priority 5)"
            - "ScheduledPayment.${p1_id}.status == SCHEDULED (unchanged)"

      - name: safety_beats_fiscal_on_file
        grounds:
          - validations[priority=8]
          - validations[priority=19]
          - state_machines.TransferPetition.DRAFT_to_FILED
        distinguishing_aspect: |
          Category pair business_safety-vs-business_fiscal (different pair than
          state-vs-safety): a petition whose IRR 900 bps exceeds the 700 cap AND
          whose price 175912 exceeds PV 175911 violates both rule 8 (rate cap) and
          rule 19 (price<=PV); the safety error must win.
        test_recipe:
          setup:
            - "CA profile (cap 700); adult payee; funded agreement with policy rate 900 bps (deliberately above the cap so price>PV and IRR>cap can co-occur)"
            - "payments 100000 due 2030-01-01 and 100000 due 2031-01-01 (esc 0); clock 2029-01-01"
            - "petition priced at 175912 (PV at 900 bps is exactly 175911; IRR rounds to 900 bps)"
