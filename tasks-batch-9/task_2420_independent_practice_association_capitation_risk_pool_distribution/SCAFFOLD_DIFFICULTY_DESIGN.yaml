              as: IpaAdmin
              captures: { agr_d: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_d}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_d}/physicians"
              payload: { npi: "8000000001", full_name: "Dae-Ho Lim", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_d: "$.data.id" }
            - call: "POST /ipa/physicians/${p_d}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_d}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_d}/risk-pools"
