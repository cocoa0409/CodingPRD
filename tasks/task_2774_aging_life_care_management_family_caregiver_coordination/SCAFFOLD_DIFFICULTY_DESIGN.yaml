        distinguishing_aspect: |
          Depth-4 cascade from a DIFFERENT triggering transition — PATCH
          /care/conference-decisions/{decisionId}/state to RESCINDED rather than an invoice void:
          hop 1 rescinds the decision, hop 2 terminates only the authorizations whose
          authorizing_decision_id names it, hop 3 recomputes authorized_coverage_hours down to 0 and
          flips the ACTIVE plan's coverage_gap_flag to true because those rows left the
          {AUTHORIZED, ACTIVE} set, and hop 4 re-derives risk_posture to ELEVATED because of the gap.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-09T09:00:00Z."
            - "Care manager Dana, supervisor Iris."
            - "Client Cornelia with retainer_floor_cents 0 and a deliberately low acuity (all six domains at 1, so acuity_score 20 keeps risk_posture off the acuity trigger)."
            - "Two family contacts: Alice (POA_HEALTHCARE, surrogate) and Ben (INTERESTED_FAMILY, not a surrogate)."
