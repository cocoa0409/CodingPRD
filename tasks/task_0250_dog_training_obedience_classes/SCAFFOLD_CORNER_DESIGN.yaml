# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Dog Training & Obedience Classes — EXPERT band
# Breadth probe across the claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_owner_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Owner, endpoints]
        distinguishing_aspect: "POST /owners with full_name/email/phone returns 201, server-minted id, version==1, created_at set."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { full_name: "New Owner", email: "new@x.com", phone: "101" }
              as: FrontDesk
              captures: { oid: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Owner.id is a non-empty server UUID"
            - "Owner.version == 1"

      - name: create_dog_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Dog.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dogs omitting required `name` → ERR_INVALID_REQUEST (400); no Dog created."
        test_recipe:
          setup: ["one owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Own", email: "own2@x.com", phone: "102" }
              as: FrontDesk
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_dog_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Dog, "errors[ERR_DOG_NOT_FOUND]"]
        distinguishing_aspect: "GET /dogs/{id} with a random UUID → ERR_DOG_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /dogs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_DOG_NOT_FOUND"

      - name: create_trainer_handles_private_default_true
        claim_type: Defaults
        grounds: [entities.Trainer.fields.handles_private]
        distinguishing_aspect: "POST /trainers omitting handles_private defaults it to true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /trainers"
              payload: { full_name: "Def T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id, hp: $.data.handles_private }
          assert:
            - "Trainer.handles_private == true"

      - name: dog_vaccination_posture_computed_compliant_after_three_vaccines
        claim_type: Computed Fields
        grounds: [entities.Dog.fields.vaccination_posture, calculations.vaccination_posture]
        distinguishing_aspect: "After adding RABIES+DHPP+BORDETELLA all valid at clock date, GET /dogs/{id}.vaccination_posture == COMPLIANT."
        test_recipe:
          setup: ["clock 2026-06-01; dog with all three current vaccines"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Vac Own", email: "vac@x.com", phone: "103" }
              as: FrontDesk
              captures: { oid: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", name: "Vax", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.id }
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "GET /dogs/${did}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { posture: $.data.vaccination_posture }
          assert:
            - "Dog.${did}.vaccination_posture == COMPLIANT"

      - name: intake_outcome_flagged_on_threshold
        claim_type: Computed Fields
        grounds: [entities.BehavioralIntake.fields.outcome, calculations.intake_outcome]
        distinguishing_aspect: "reactivity_score == 7 (== INTAKE_FLAG_THRESHOLD) yields outcome FLAGGED and requires_private_first true."
        test_recipe:
          setup: ["a dog exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "In Own", email: "in@x.com", phone: "104" }
              as: FrontDesk
              captures: { oid: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", name: "Snappy", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.id }
          trigger:
            - call: "POST /dogs/${did}/behavioral-intakes"
              payload: { reactivity_score: 7, bite_history: false, recommended_level: "BASIC" }
              as: Trainer
              as_user_id: "${oid}"
              captures: { outcome: $.data.outcome, rpf: $.data.requires_private_first }
          assert:
            - "BehavioralIntake.outcome == FLAGGED   # reactivity_score >= 7"
            - "BehavioralIntake.requires_private_first == true"

      - name: vaccination_record_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.VaccinationRecord]
        distinguishing_aspect: "VaccinationRecord has common_fields:false — no update endpoint, no version field; only create/void/read exist."
        test_recipe:
          setup: ["a vaccination record exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Imm Own", email: "imm@x.com", phone: "105" }
              as: FrontDesk
              captures: { oid: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", name: "Imm", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.id }
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
          trigger:
            - call: "GET /vaccinations/${vid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { voided: $.data.voided }
          assert:
            - "VaccinationRecord.${vid}.voided == false   # read-only record, no version/update surface"

      - name: dog_requires_existing_owner_parent
        claim_type: Parent Relationships
        grounds: [entities.Dog.fields.owner_id, "errors[ERR_OWNER_NOT_FOUND]"]
        distinguishing_aspect: "POST /dogs with a non-existent owner_id → ERR_OWNER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dogs"
              payload: { owner_id: "00000000-0000-4000-8000-000000000000", name: "Orphan", breed: "Lab", birth_date: "2024-01-01" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_OWNER_NOT_FOUND"

      - name: list_owners_paginated_envelope
        claim_type: Listing
        grounds: [entities.Owner, endpoints]
        distinguishing_aspect: "GET /owners returns array response_type with total_count and has_more pagination fields."
        test_recipe:
          setup: ["one owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "L Own", email: "l@x.com", phone: "106" }
              as: FrontDesk
          trigger:
            - call: "GET /owners"
              payload: { limit: 10, offset: 0 }
              as: FrontDesk
          assert:
            - "response.response_type == array"
            - "response meta includes total_count and has_more"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_series_before_sessions_exist_returns_sessions_incomplete
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSeries.DRAFT_to_OPEN, "errors[ERR_SESSIONS_INCOMPLETE]"]
        distinguishing_aspect: "Opening a 2-session series with 0 sessions created → ERR_SESSIONS_INCOMPLETE (422)."
        test_recipe:
          setup: ["a DRAFT series with session_count 2 and no sessions"]
          setup_api_calls:
            - call: "POST /class-series"
              payload: { title: "NoSess", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 2, list_price_cents: 12000, credit_cost: 2 }
              as: AdminManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /class-series/${sid}/open"
              payload: {}
              as: AdminManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SESSIONS_INCOMPLETE"

      - name: open_series_trainer_level_mismatch
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSeries.DRAFT_to_OPEN, "errors[ERR_TRAINER_LEVEL_MISMATCH]"]
        distinguishing_aspect: "Opening an ADVANCED series whose only session trainer is certified only for BASIC → ERR_TRAINER_LEVEL_MISMATCH (422)."
        test_recipe:
          setup: ["ADVANCED series with one session assigned to a BASIC-only trainer"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "Low T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Adv", level: "ADVANCED", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 20000, credit_cost: 3 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
          trigger:
            - call: "POST /class-series/${sid}/open"
              payload: {}
              as: AdminManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_TRAINER_LEVEL_MISMATCH"

      - name: open_private_series_capacity_not_one
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSeries.DRAFT_to_OPEN, "errors[ERR_INVALID_PRIVATE_CAPACITY]"]
        distinguishing_aspect: "Opening a PRIVATE series with capacity 3 → ERR_INVALID_PRIVATE_CAPACITY (422)."
        test_recipe:
          setup: ["PRIVATE series capacity 3 with one valid session"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "Pv T", certified_levels: ["BASIC"], handles_private: true }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "BadPriv", level: "BASIC", modality: "PRIVATE", capacity: 3, session_count: 1, list_price_cents: 30000, credit_cost: 4 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
          trigger:
            - call: "POST /class-series/${sid}/open"
              payload: {}
              as: AdminManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_PRIVATE_CAPACITY"

      - name: start_session_when_series_not_open
        claim_type: Invalid Transitions
        grounds: [state_machines.ClassSession.SCHEDULED_to_IN_PROGRESS, "errors[ERR_SERIES_NOT_OPEN]"]
        distinguishing_aspect: "Starting a session whose series is still DRAFT → ERR_SERIES_NOT_OPEN (409)."
        test_recipe:
          setup: ["DRAFT series with one session; trainer is the assigned one"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "St T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Dft", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 12000, credit_cost: 2 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${sess_id}/start"
              payload: {}
              as: Trainer
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SERIES_NOT_OPEN"

      - name: complete_session_with_unmarked_attendance
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSession.IN_PROGRESS_to_COMPLETED, "errors[ERR_ATTENDANCE_UNMARKED]"]
        distinguishing_aspect: "Completing an IN_PROGRESS session whose single attendance is still EXPECTED → ERR_ATTENDANCE_UNMARKED (409)."
        test_recipe:
          setup: ["OPEN series, one ACTIVE enrollment, session started but attendance unmarked"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Un Own", email: "un@x.com", phone: "107" }
              as: FrontDesk
              captures: { oid: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", name: "Un", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.id }
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /trainers"
              payload: { full_name: "Un T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Unm", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 12000, credit_cost: 2 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
              captures: { sess_id: $.data.id }
            - call: "POST /class-series/${sid}/open"
              payload: {}
              as: AdminManager
              captures: { sv: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${did}", series_id: "${sid}", payment_method: "CASH", expected_series_version: "${sv}" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /class-sessions/${sess_id}/start"
              payload: {}
              as: Trainer
              as_user_id: "${tid}"
          trigger:
            - call: "POST /class-sessions/${sess_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ATTENDANCE_UNMARKED"

      - name: cancel_already_cancelled_session_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ClassSession, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a session already in terminal CANCELLED → ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup: ["a SCHEDULED session that gets cancelled once"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "Cc T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Cc", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 12000, credit_cost: 2 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/cancel"
              payload: {}
              as: AdminManager
          trigger:
            - call: "POST /class-sessions/${sess_id}/cancel"
              payload: {}
              as: AdminManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: graduate_not_eligible_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.ACTIVE_to_GRADUATED, "errors[ERR_NOT_GRADUATION_ELIGIBLE]"]
        distinguishing_aspect: "Graduating an ACTIVE enrollment with sessions_attended 0 < session_count → ERR_NOT_GRADUATION_ELIGIBLE (409)."
        test_recipe:
          setup: ["OPEN series session_count 2, one ACTIVE enrollment with no attended sessions"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Gr Own", email: "gr@x.com", phone: "108" }
              as: FrontDesk
              captures: { oid: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", name: "Gr", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.id }
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /trainers"
              payload: { full_name: "Gr T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Gr", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 2, list_price_cents: 12000, credit_cost: 2 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 1, starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-sessions"
              payload: { series_id: "${sid}", trainer_id: "${tid}", sequence_index: 2, starts_at: "2026-07-02T09:00:00Z", ends_at: "2026-07-02T10:00:00Z" }
              as: AdminManager
            - call: "POST /class-series/${sid}/open"
              payload: {}
              as: AdminManager
              captures: { sv: $.data.version }
            - call: "POST /enrollments"
              payload: { dog_id: "${did}", series_id: "${sid}", payment_method: "CASH", expected_series_version: "${sv}" }
              as: Owner
              as_user_id: "${oid}"
              captures: { eid: $.data.id }
          trigger:
            - call: "POST /enrollments/${eid}/graduate"
              payload: {}
              as: AdminManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOT_GRADUATION_ELIGIBLE"

      - name: archive_series_with_live_enrollment_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSeries, "errors[ERR_SERIES_HAS_LIVE_ENROLLMENTS]"]
        distinguishing_aspect: "Archiving a CLOSED series that still has an ACTIVE enrollment → ERR_SERIES_HAS_LIVE_ENROLLMENTS (409)."
        test_recipe:
          setup: ["series opened, one ACTIVE enrollment, then closed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AdminManager
            - call: "POST /owners"
              payload: { full_name: "Ar Own", email: "ar@x.com", phone: "109" }
              as: FrontDesk
              captures: { oid: $.data.id }
            - call: "POST /dogs"
              payload: { owner_id: "${oid}", name: "Ar", breed: "Lab", birth_date: "2024-01-01" }
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.id }
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "RABIES", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "DHPP", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /dogs/${did}/vaccinations"
              payload: { vaccine_type: "BORDETELLA", administered_on: "2026-01-01", expires_on: "2027-01-01" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /trainers"
              payload: { full_name: "Ar T", certified_levels: ["BASIC"] }
              as: AdminManager
              captures: { tid: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Ar", level: "BASIC", modality: "GROUP", capacity: 5, session_count: 1, list_price_cents: 12000, credit_cost: 2 }
              as: AdminManager
              captures: { sid: $.data.id }
            - call: "POST /class-sessions"
