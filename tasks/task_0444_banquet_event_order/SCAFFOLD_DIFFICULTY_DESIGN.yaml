# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Banquet Event Order
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# >= 2 instances per rule. All literals pre-computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: charge_rollup_estimate_vs_actual_on_event
        grounds:
          - calculations.charge_rollup
          - calculations.billable_count
          - entities.Event.fields.estimated_total_cents
          - entities.Event.fields.actualized_total_cents
          - state_machines.Event.DEFINITE_to_CONFIRMED
          - state_machines.Event.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          On the Event cost domain, charge_rollup variant=ESTIMATE prices the single
          PER_PERSON line off oversetted guarantee (billable 126) yielding
          estimated_total_cents == 1883200, while variant=ACTUAL prices it off
          max(guarantee,actual)=140 yielding actualized_total_cents == 2068000 — same
          rows, different total because billable differs.
        test_recipe:
          setup:
            - "FunctionRoom THEATER-capable max_capacity 200, hourly_rental_cents 50000, buffer 60."
            - "Event setup_style=THEATER, expected_attendance=100, overset_pct=0.05, service_charge_pct=0.20, gratuity_pct=0.0, sales_tax_pct=0.10."
            - "One PER_PERSON menu line unit_price_cents=10000; one DEFINITE booking 18:00-22:00 (4h, rental 200000)."
            - "Deposit milestone seq1 amount_due 500000, settled by a 500000 payment; event reaches CONFIRMED then COMPLETED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /function-rooms"
              payload: { name: "Grand Ballroom", max_capacity: 200, turnover_buffer_minutes: 60, hourly_rental_cents: 50000 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Acme Gala", event_date: "2026-09-10", setup_style: "THEATER", expected_attendance: 100, overset_pct: 0.05, service_charge_pct: 0.20, gratuity_pct: 0.0, sales_tax_pct: 0.10 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/menu-lines"
              payload: { name: "Plated Filet", pricing_mode: "PER_PERSON", unit_price_cents: 10000 }
              as: SalesManager
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2026-09-10T18:00:00Z", end_utc: "2026-09-10T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2026-08-01", amount_due_cents: 500000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pre_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 500000, method: "WIRE", expected_event_version: "${ev_v_pre_pay}" }
              as: AccountingClerk
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 120 }
              as: BanquetCaptain
              captures: { est_total: $.data.estimated_total_cents }
          trigger:
            - call: "POST /events/${event_id}/actualize"
              payload: { actual_attendance: 140 }
              as: BanquetCaptain
              captures: { act_total: $.data.actualized_total_cents }
          assert:
            - "Event.${event_id}.billable_count == 140"
            - "Event.${event_id}.estimated_total_cents == 1883200"
            - "Event.${event_id}.actualized_total_cents == 2068000"
            - "Event.${event_id}.actualized_total_cents != Event.${event_id}.estimated_total_cents"

      - name: rooms_committed_reserved_vs_pickedup_on_block
        grounds:
          - calculations.rooms_committed
          - entities.HotelRoomBlock.fields.rooms_committed
          - entities.HotelRoomBlock.fields.rooms_available
          - state_machines.RoomBlockLink.RESERVED_to_PICKED_UP
        distinguishing_aspect: |
          On the HotelRoomBlock inventory domain (distinct from the Event cost domain),
          rooms_committed counts a link's rooms_reserved while RESERVED (8 -> available
          2) but switches to its rooms_picked_up once PICKED_UP (3 -> available 7); same
          link, different committed figure by status.
        test_recipe:
          setup:
            - "HotelRoomBlock total_rooms=10."
            - "Event in CONFIRMED status with one RoomBlockLink reserving 8 rooms over 2026-07-01..2026-07-03."
            - "Deposit settled so the event could reach CONFIRMED."
          setup_api_calls:
            - call: "POST /hotel-room-blocks"
              payload: { block_name: "Wedding Block", total_rooms: 10, nightly_rate_cents: 19900 }
              as: PlatformAdmin
              captures: { block_id: $.data.id }
            - call: "POST /function-rooms"
              payload: { name: "Salon A", max_capacity: 200, turnover_buffer_minutes: 60, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Beta Wedding", event_date: "2026-07-02", setup_style: "ROUNDS", expected_attendance: 50 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2026-07-02T18:00:00Z", end_utc: "2026-07-02T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2026-06-15", amount_due_cents: 100000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pre_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 100000, method: "CHECK", expected_event_version: "${ev_v_pre_pay}" }
              as: AccountingClerk
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 40 }
              as: BanquetCaptain
            - call: "POST /events/${event_id}/room-block-links"
              payload: { hotel_room_block_id: "${block_id}", rooms_reserved: 8, check_in_date: "2026-07-01", check_out_date: "2026-07-03" }
              as: AccountingClerk
              captures: { link_id: $.data.id }
            - call: "GET /hotel-room-blocks/${block_id}"
              payload: {}
              as: AccountingClerk
              captures: { committed_reserved: $.data.rooms_committed }
          trigger:
            - call: "POST /events/${event_id}/room-block-links/${link_id}/record-pickup"
              payload: { rooms_picked_up: 3 }
              as: AccountingClerk
          assert:
            - "HotelRoomBlock.${block_id}.rooms_committed == 3"
            - "HotelRoomBlock.${block_id}.rooms_available == 7"
            - "RoomBlockLink.${link_id}.link_status == PICKED_UP"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: billable_count_nested_conditional_mode_a
        grounds:
          - calculations.billable_count
          - entities.Event.fields.overset_pct
          - entities.Event.fields.guarantee_count
          - entities.Event.fields.actual_attendance
        distinguishing_aspect: |
          MODE (a): billable_count is a >=3-input non-linear formula — ceil(guarantee*(1+overset))
          at CONFIRMED vs max(guarantee,actual) at COMPLETED, with overset dropped on
          actualization; for guarantee=120 overset=0.05 actual=110 the estimate is
          ceil(126)=126 but the actual is max(120,110)=120, a non-monotone switch.
        test_recipe:
          setup:
            - "Event CONFIRMED with guarantee_count=120, overset_pct=0.05, one PER_PERSON line; deposit settled."
            - "actual_attendance recorded below guarantee (110) at actualize."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon B", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Gamma Conf", event_date: "2026-10-01", setup_style: "THEATER", expected_attendance: 100, overset_pct: 0.05, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/menu-lines"
              payload: { name: "Buffet", pricing_mode: "PER_PERSON", unit_price_cents: 5000 }
              as: SalesManager
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2026-10-01T17:00:00Z", end_utc: "2026-10-01T21:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2026-09-01", amount_due_cents: 100000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pre_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 100000, method: "ACH", expected_event_version: "${ev_v_pre_pay}" }
              as: AccountingClerk
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 120 }
              as: BanquetCaptain
              captures: { billable_estimate: $.data.billable_count }
          trigger:
            - call: "POST /events/${event_id}/actualize"
              payload: { actual_attendance: 110 }
              as: BanquetCaptain
              captures: { billable_actual: $.data.billable_count }
          assert:
            - "Event.${event_id}.billable_count == 120"
            - "billable_estimate == 126"

      - name: charge_rollup_per_component_rounding_order_mode_b
        grounds:
          - calculations.charge_rollup
          - entities.Event.fields.service_charge_pct
          - entities.Event.fields.gratuity_pct
          - entities.Event.fields.sales_tax_pct
          - state_machines.Event.TENTATIVE_to_DEFINITE
        distinguishing_aspect: |
          MODE (b): charge_rollup pins per-component round_half_up order — service_charge =
          rhu(4610*0.225)=1037 enters the taxable base BEFORE sales_tax = rhu((4610+1037)*0.08)=452;
          gratuity = rhu(4610*0.075)=346 is excluded from tax; estimated_total_cents == 6445.
          A sum-then-round-once or truncate reading yields 6443.
        test_recipe:
          setup:
            - "Event CLASSROOM, scp=0.225, gp=0.075, stp=0.08; one CONSUMPTION menu line (461 x 10 = 4610 fnb)."
            - "One DEFINITE booking on a room with hourly_rental_cents=0 so rental_subtotal is 0; event reaches DEFINITE via confirm-space."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon C", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Delta Dinner", event_date: "2026-11-05", setup_style: "CLASSROOM", expected_attendance: 30, service_charge_pct: 0.225, gratuity_pct: 0.075, sales_tax_pct: 0.08 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/menu-lines"
              payload: { name: "Open Bar", pricing_mode: "CONSUMPTION", unit_price_cents: 461, consumption_qty: 10 }
              as: SalesManager
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2026-11-05T18:00:00Z", end_utc: "2026-11-05T21:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
              captures: { est_total: $.data.estimated_total_cents }
          assert:
            - "Event.${event_id}.estimated_total_cents == 6445"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_revision_loop_definite_to_tentative
        grounds:
          - state_machines.Event.DEFINITE_to_TENTATIVE
          - state_machines.Event.TENTATIVE_to_DEFINITE
          - state_machines.FunctionRoomBooking.DEFINITE_to_HOLD
        distinguishing_aspect: |
          Event has a cycle: DEFINITE -> TENTATIVE (reopen) -> DEFINITE (confirm-space).
          Reopen reverts every DEFINITE booking to HOLD, and confirm-space requires them
          all re-flipped to DEFINITE — a genuine back-edge, not a forward pipeline.
        test_recipe:
          setup:
            - "Event in DEFINITE with one DEFINITE booking; guarantee not yet locked."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon D", max_capacity: 200, turnover_buffer_minutes: 60, hourly_rental_cents: 40000 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Epsilon Mtg", event_date: "2026-12-01", setup_style: "THEATER", expected_attendance: 80 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2026-12-01T09:00:00Z", end_utc: "2026-12-01T12:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/reopen"
              payload: {}
              as: SalesManager
          assert:
            - "Event.${event_id}.status == TENTATIVE"
            - "FunctionRoomBooking.${booking_id}.hold_status == HOLD"

      - name: booking_hold_definite_cycle
        grounds:
          - state_machines.FunctionRoomBooking.HOLD_to_DEFINITE
          - state_machines.FunctionRoomBooking.DEFINITE_to_HOLD
        distinguishing_aspect: |
          On a different entity (FunctionRoomBooking) hold_status cycles HOLD -> DEFINITE
          (make-definite) -> HOLD (soften) -> DEFINITE again, an A->B->A loop distinct from
          the Event revision loop.
        test_recipe:
          setup:
            - "Event TENTATIVE with one booking currently HOLD."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon E", max_capacity: 200, turnover_buffer_minutes: 30, hourly_rental_cents: 30000 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Zeta Lunch", event_date: "2027-01-15", setup_style: "ROUNDS", expected_attendance: 60 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-01-15T11:00:00Z", end_utc: "2027-01-15T14:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/soften"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
          assert:
            - "FunctionRoomBooking.${booking_id}.hold_status == DEFINITE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_event_releases_links_returns_block_rooms_depth3
        grounds:
          - state_machines.Event.INQUIRY_to_CANCELLED
          - state_machines.RoomBlockLink.RESERVED_to_RELEASED
          - calculations.rooms_committed
          - entities.HotelRoomBlock.fields.rooms_available
        distinguishing_aspect: |
          Depth-3 chain off the CANCEL trigger: cancel mutates Event -> each non-RELEASED
          RoomBlockLink flips to RELEASED -> each RELEASED link stops counting toward its
          HotelRoomBlock, so rooms_available climbs from 4 back to 10. Each hop is caused
          by the previous hop.
        test_recipe:
          setup:
            - "HotelRoomBlock total_rooms=10; Event TENTATIVE with one RESERVED link reserving 6 rooms over 2027-02-01..2027-02-03 (rooms_available=4)."
          setup_api_calls:
            - call: "POST /hotel-room-blocks"
              payload: { block_name: "Conf Block", total_rooms: 10, nightly_rate_cents: 15000 }
              as: PlatformAdmin
              captures: { block_id: $.data.id }
            - call: "POST /function-rooms"
              payload: { name: "Salon F", max_capacity: 200, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Eta Summit", event_date: "2027-02-02", setup_style: "THEATER", expected_attendance: 80 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-02-02T18:00:00Z", end_utc: "2027-02-02T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/room-block-links"
              payload: { hotel_room_block_id: "${block_id}", rooms_reserved: 6, check_in_date: "2027-02-01", check_out_date: "2027-02-03" }
              as: SalesManager
              captures: { link_id: $.data.id }
            - call: "GET /hotel-room-blocks/${block_id}"
              payload: {}
              as: SalesManager
              captures: { avail_before: $.data.rooms_available }
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: SalesManager
          assert:
            - "Event.${event_id}.status == CANCELLED"
            - "RoomBlockLink.${link_id}.link_status == RELEASED"
            - "HotelRoomBlock.${block_id}.rooms_available == 10"
            - "HotelRoomBlock.${block_id}.rooms_committed == 0"

      - name: actualize_recomputes_billable_menu_and_total_depth3
        grounds:
          - state_machines.Event.CONFIRMED_to_COMPLETED
          - calculations.billable_count
          - calculations.menu_line_extended
          - calculations.charge_rollup
          - entities.MenuLine.fields.extended_cents
          - entities.Event.fields.actualized_total_cents
        distinguishing_aspect: |
          Depth-3 chain off a DIFFERENT trigger (actualize): actualize mutates Event.actual_attendance
          -> billable_count recomputes to 140 -> each PER_PERSON MenuLine.extended_cents recomputes
          to 1400000 -> charge_rollup rolls those into actualized_total_cents == 2068000. Distinct
          propagation pattern from the cancel cascade.
        test_recipe:
          setup:
            - "Reuse the charge_rollup_estimate_vs_actual setup: CONFIRMED event, guarantee 120, one PER_PERSON line unit 10000, one DEFINITE booking rental 200000, scp 0.20 stp 0.10."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon G", max_capacity: 200, turnover_buffer_minutes: 60, hourly_rental_cents: 50000 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Theta Gala", event_date: "2027-03-10", setup_style: "THEATER", expected_attendance: 100, overset_pct: 0.05, service_charge_pct: 0.20, gratuity_pct: 0.0, sales_tax_pct: 0.10 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/menu-lines"
              payload: { name: "Plated Filet", pricing_mode: "PER_PERSON", unit_price_cents: 10000 }
              as: SalesManager
              captures: { menu_line_id: $.data.id }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-03-10T18:00:00Z", end_utc: "2027-03-10T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2027-02-01", amount_due_cents: 500000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pre_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 500000, method: "WIRE", expected_event_version: "${ev_v_pre_pay}" }
              as: AccountingClerk
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 120 }
              as: BanquetCaptain
          trigger:
            - call: "POST /events/${event_id}/actualize"
              payload: { actual_attendance: 140 }
              as: BanquetCaptain
          assert:
            - "Event.${event_id}.billable_count == 140"
            - "MenuLine.${menu_line_id}.extended_cents == 1400000"
            - "Event.${event_id}.actualized_total_cents == 2068000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: make_definite_temporal_beats_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_temporal (pri 7, ERR_ROOM_DOUBLE_BOOKED) vs
          business_constraint (pri 8, ERR_CAPACITY_EXCEEDED): on a TENTATIVE event (state
          passes) a make-definite that both buffer-overlaps a DEFINITE booking AND exceeds
          setup capacity returns ERR_ROOM_DOUBLE_BOOKED (the lower priority number wins).
        test_recipe:
          setup:
            - "Room max_capacity=10 (ROUNDS effective floor(10*0.6)=6); event B billable 100 (>6) so capacity would fail."
            - "An existing DEFINITE booking on the room 18:00-22:00 (event A); event B is TENTATIVE with a HOLD booking 21:00-23:00 that buffer-overlaps it."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Tiny Room", max_capacity: 10, turnover_buffer_minutes: 60, hourly_rental_cents: 0 }
              as: PlatformAdmin
