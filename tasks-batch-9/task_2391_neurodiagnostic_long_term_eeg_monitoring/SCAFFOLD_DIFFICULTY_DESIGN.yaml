      - name: discharge_settles_authorization_day_ledger
        grounds:
          - calculations.authorization_day_ledger
          - state_machines.Admission.ADMITTED_to_DISCHARGED
          - state_machines.TaperPlan.ACTIVE_to_ABORTED
          - entities.AuthorizationRequest.fields.days_consumed
          - entities.AuthorizationRequest.fields.days_available
        distinguishing_aspect: "A different conserved quantity in a different unit of account — authorized payer days, settled through a three-way waterfall rather than a single reversal: after admit reserves 2 and an extension reserves 2 more, discharge at elapsed 3.000 days consumes 3, returns the unused 1 to days_available and zeroes days_reserved, so consumed + reserved + available equals authorized_days (5) at every step."
        test_recipe:
          setup:
            - "Authorization APPROVED for 5 INPATIENT_VEEG days; admission admitted 2026-08-02T00:00:00Z with planned_days 2 -> days_reserved 2, days_available 3."
            - "TaperPlan total_steps 3 advanced once; study started 2026-08-02T00:00:00Z and paused 2026-08-03T00:00:00Z with two CLINICAL_SEIZURE markings adjudicated (weighted_event_count 2.000 against target 4)."
            - "At 2026-08-04T00:00:00Z an extension is GRANTED for 2 days -> days_reserved 4, days_available 1, planned_discharge_at 2026-08-06T00:00:00Z."
            - "At 2026-08-05T00:00:00Z the paused study is completed so the admission has no open study, and elapsed_monitored_days is exactly 3.000."
          setup_api_calls:
