          rationale: "ERR_CUSTOMS_HOLD_ACTIVE is asserted in the named §1.8 instance's trigger chain."
      - name: board_state_gate_covered
        claim_type: invalid_transition
        grounds:
          - state_machines.ManifestEntry.SCREENED_to_EMBARKED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / board_gated_by_call_and_customs"
          rationale: "board's call-state and customs-state rejections are both asserted there."

  # ============================================================= endpoints ====
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: "Success envelope carries meta.api_request_id + response_type object + data; error envelope carries response_type error + data.error_id/message."
        test_recipe:
          setup: ["one terminal exists"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
          trigger:
            - { call: "GET /port-ops/terminals/${term}", as: Harbormaster }
            - { call: "GET /port-ops/terminals/00000000-0000-0000-0000-000000000000", as: Harbormaster, captures: { err: $.data.error_id } }
          assert:
            - "Success: meta.api_request_id present, response_type == object, data.id == ${term}"
            - "Error: response_type == error, err == ERR_NOT_FOUND, data.message present"
      - name: screening_requirement_computed_read_satisfied_flag
        claim_type: computed_read
        grounds:
          - calculations.screening_staffing_requirement
        distinguishing_aspect: "The computed read composes required vs assigned: 2 of 3 -> satisfied false; 3 of 3 -> satisfied true."
        test_recipe:
          setup: ["Call booked_embark_pax 961 (required 3); lane L1 OPEN 2 officers; lane L2 created"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 961, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { l1: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${l1}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L2" }, as: PortAuthorityAdmin, captures: { l2: $.data.id } }
          trigger:
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pc}" }, as: TerminalOperator, captures: { req0: $.data.required_officers, asg0: $.data.assigned_officers, sat0: $.data.satisfied } }
            - { call: "POST /port-ops/screening-lanes/${l2}/open", payload: { officers_assigned: 1 }, as: TerminalOperator }
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pc}" }, as: TerminalOperator, captures: { asg1: $.data.assigned_officers, sat1: $.data.satisfied } }
          assert:
            - "req0 == 3 and asg0 == 2 and sat0 == false"
            - "asg1 == 3 and sat1 == true (aggregate across OPEN lanes; equality satisfies)"
      - name: manifest_list_filters_combine
        claim_type: standard_crud
        grounds:
          - entities.ManifestEntry.fields.direction
        distinguishing_aspect: "List filters compose: direction=EMBARK -> 2 rows; status=CHECKED_IN -> 1; direction=EMBARK+status=BOOKED -> 1."
        test_recipe:
          setup: ["Call with E1 EMBARK CHECKED_IN, E2 EMBARK BOOKED, D1 DEBARK ABOARD"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "E1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "E2", direction: "EMBARK", cabin_class: "PREMIUM" }, as: VesselAgent, as_user_id: "${ves}" }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "D1", direction: "DEBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}" }
            - { call: "POST /port-ops/manifest-entries/${e1}/check-in", as: TerminalOperator }
          trigger:
            - { call: "GET /port-ops/manifest-entries", payload: { port_call_id: "${pc}", direction: "EMBARK" }, as: TerminalOperator }
            - { call: "GET /port-ops/manifest-entries", payload: { port_call_id: "${pc}", status: "CHECKED_IN" }, as: TerminalOperator }
            - { call: "GET /port-ops/manifest-entries", payload: { port_call_id: "${pc}", direction: "EMBARK", status: "BOOKED" }, as: TerminalOperator }
          assert:
            - "direction=EMBARK -> total_count 2"
            - "status=CHECKED_IN -> total_count 1"
            - "direction=EMBARK + status=BOOKED -> total_count 1"

