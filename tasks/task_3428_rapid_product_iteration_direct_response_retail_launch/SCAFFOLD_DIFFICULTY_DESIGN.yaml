# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3428_rapid_product_iteration_direct_response_retail_launch
# 9 rules x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.6 (+ top-level constants/invariants blocks).
# Shared backbone anchors are defined on first use (each instance runs against
# a fresh empty DB; the anchors are per-instance reusable call templates).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: media_mer_provisional_vs_settled_diverge
        grounds:
          - calculations.media_efficiency_ratio
          - entities.MediaTest.fields.provisional_mer
          - entities.MediaTest.fields.settled_mer
        distinguishing_aspect: |
          Media-economics domain: for the SAME media spend (1000 cents), the
          provisional variant (gross projection, no commission) yields 1.5 while
          the settled variant (per-line commissioned net of cancels/returns)
          yields 8.504 — two valid algorithms over identical spend produce
          different numbers, and the SCALE decision binds to the settled one.
        test_recipe:
          setup:
            - "Clock at 2026-09-10. Season FW26 OPEN; category 'Cordless Vacuums' crowding_base 6 (CLEAR)."
            - "Concept ENGINEERING_LOCKED (momentum 50.0 at lock, round 1 scored 80)."
            - "Variant CV100-AMZ TOOLED at partner (capacity 500); claim study SUBSTANTIATED (margin 0.15, conducted by sci-anna, substantiated by sci-bob); clearance SUBSTANTIATED."
            - "MediaTest airing with spend 1000 and projected gross 1500."
          setup_api_calls:
            - &k_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_season
              call: "POST /launch-seasons"
              payload: { season_code: "FW26" }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - &k_cat
              call: "POST /categories"
              payload: { season_id: "${season_id}", name: "Cordless Vacuums", crowding_base: 6 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - &k_concept
              call: "POST /concepts"
              payload: { category_id: "${cat_id}", title: "Faster pet-hair pickup" }
              as: ProductLead
              captures: { concept_id: $.data.id }
            - &k_ins_a
              call: "POST /concepts/${concept_id}/insights"
              payload: { points: 40, observed_at: "2026-09-01T00:00:00Z" }
              as: ProductLead
            - &k_ins_b
              call: "POST /concepts/${concept_id}/insights"
              payload: { points: 16, observed_at: "2026-09-08T00:00:00Z" }
              as: ProductLead
            - &k_clock0910
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &k_advance
              call: "POST /concepts/${concept_id}/advance"
              payload: {}
              as: ProductLead
            - *k_advance
            - *k_advance
            - &k_round
              call: "POST /concepts/${concept_id}/rounds"
              payload: {}
              as: ProductLead
              captures: { round_id: $.data.id }
            - &k_round_pass
              call: "POST /prototype-rounds/${round_id}/complete"
              payload: { score: 80 }
              as: ProductLead
            - *k_advance
            - &k_partner
              call: "POST /factory-partners"
              payload: { name: "Shenzhen Precision", capacity_units_total: 500 }
              as: SourcingManager
              captures: { partner_id: $.data.id }
            - &k_variant
              call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV100-AMZ", channel: "AMAZON" }
              as: ProductLead
              captures: { variant_id: $.data.id }
            - &k_tool
              call: "POST /model-variants/${variant_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
            - &k_study
              call: "POST /claim-studies"
              payload: { variant_id: "${variant_id}", claim_text: "50% more suction than the leading competitor" }
              as: ClaimsScientist
              as_user_id: "sci-anna"
              captures: { study_id: $.data.id }
            - &k_complete
              call: "POST /claim-studies/${study_id}/complete"
              payload: { our_metric: 115, baseline_metric: 100, sample_size: 40 }
              as: ClaimsScientist
              as_user_id: "sci-anna"
            - &k_substantiate
              call: "POST /claim-studies/${study_id}/substantiate"
              payload: {}
              as: ClaimsScientist
              as_user_id: "sci-bob"
            - &k_media
              call: "POST /media-tests"
              payload: { variant_id: "${variant_id}", title: "Infomercial A", media_spend_cents: 1000 }
              as: MediaBuyer
              captures: { media_id: $.data.id }
            - &k_air
              call: "POST /media-tests/${media_id}/air"
              payload: { projected_gross_cents: 1500 }
              as: MediaBuyer
              captures: { prov_mer: $.data.provisional_mer }
          trigger:
            - call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "SCALE"
                order_lines:
                  - { revenue_cents: 3335, cancels_cents: 0, returns_cents: 0 }
                  - { revenue_cents: 3335, cancels_cents: 0, returns_cents: 0 }
                  - { revenue_cents: 3334, cancels_cents: 0, returns_cents: 0 }
              as: MediaBuyer
              captures: { settled_mer: $.data.settled_mer, media_status: $.data.status }
          assert:
            - "prov_mer == 1.5 (provisional variant: 1500 / 1000, no commission, no cancels)"
            - "settled_mer == 8.504 (settled variant: (2835 + 2835 + 2834) / 1000 after per-line commission rounding)"
            - "prov_mer != settled_mer — identical spend, two valid algorithms, different results"
            - "media_status == DECIDED_SCALE (8.504 >= MER_SCALE_MIN 2.0)"

      - name: litigation_reserve_provisional_vs_final
        grounds:
          - calculations.litigation_reserve
          - invariants.litigation_reserve_reconciliation
          - entities.Category.fields.active_reserve_cents
        distinguishing_aspect: |
          Legal domain (distinct from the media-economics instance): the same
          PatentCase carries a provisional reserve of 300000 cents (claim x 0.30
          prior) while FILED, and a final reserve of 450000 cents (the actual
          settlement) after settle — the category ledger swaps one variant for
          the other and the two diverge by 150000 for identical case data.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Season FW26 OPEN; category crowding_base 6."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-1001", claim_cents: 1000000, severity: "MED" }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { case_id: $.data.id, prov_reserve: $.data.provisional_reserve_cents }
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { reserve_before: $.data.active_reserve_cents }
          trigger:
            - call: "POST /patent-cases/${case_id}/settle"
              payload: { settlement_cents: 450000 }
              as: LegalCounsel
              as_user_id: "lc-john"
              captures: { final_amt: $.data.final_amount_cents, case_status: $.data.status }
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { reserve_after: $.data.active_reserve_cents }
          assert:
            - "prov_reserve == 300000 (provisional variant: round_half_up(1000000 * 0.30))"
            - "reserve_before == 300000 (ledger holds the provisional variant while FILED)"
            - "case_status == SETTLED and final_amt == 450000 (final variant: actual settlement)"
            - "reserve_after == 450000 (ledger replaced provisional by final; delta exactly +150000)"
            - "prov_reserve != final_amt — same claim_cents, two variants, different reserves"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: replenishment_quantity_five_input_clamp_then_round
        grounds:
          - calculations.replenishment_quantity
          - entities.ReplenishmentOrder.fields.quantity_units
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: weekly_velocity,
          on_hand_units, in_transit_units, case_pack_units, and partner free
          capacity flow through nested gates in pinned order (velocity threshold
          -> zero-clamp branch -> ceil to case pack -> capacity min-check).
          With velocity 120, on_hand 100, in_transit 60, case_pack 24:
          raw 200 -> 9 packs -> 216 units exactly.
        test_recipe:
          setup:
            - "Full pipeline: variant CV100-AMZ RETAIL_LIVE (agreement window [2026-10-01, 2027-01-01) SIGNED, commitment 300 units need_by 2026-10-15 FULFILLED by the 2026-10-16 review)."
            - "Partner capacity 500, allocated 0 after the review released the fulfilled commitment."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - *k_concept
            - *k_ins_a
            - *k_ins_b
            - *k_clock0910
            - *k_advance
            - *k_advance
            - *k_advance
            - *k_round
            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - *k_tool
            - *k_study
            - *k_complete
            - *k_substantiate
            - *k_media
            - *k_air
            - call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "SCALE"
                order_lines: [ { revenue_cents: 5000, cancels_cents: 0, returns_cents: 0 } ]
              as: MediaBuyer
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: true, window_start: "2026-10-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_id: $.data.id }
            - call: "POST /retail-agreements/${agr_id}/sign"
              payload: {}
              as: RetailExec
              captures: { agr_v: $.data.version }
            - call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 300, need_by_date: "2026-10-15T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { commitment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /launch-seasons/${season_id}/run-review"
              payload: {}
              as: PlatformAdmin
            - call: "GET /model-variants/${variant_id}"
              payload: {}
              as: RetailExec
              captures: { v_live: $.data.version, v_lifecycle: $.data.lifecycle }
          trigger:
            - call: "POST /replenishment-orders"
              payload: { variant_id: "${variant_id}", weekly_velocity: 120, on_hand_units: 100, in_transit_units: 60, case_pack_units: 24, expected_variant_version: "${v_live}" }
              as: RetailExec
              captures: { qty: $.data.quantity_units, repl_status: $.data.status }
            - call: "GET /factory-partners/${partner_id}"
              payload: {}
              as: SourcingManager
              captures: { alloc_after: $.data.allocated_units }
          assert:
            - "v_lifecycle == RETAIL_LIVE (review step 8 flipped DR_TESTING with a FULFILLED commitment)"
            - "qty == 216 (raw_need = 3*120 - 100 - 60 = 200; ceil(200/24) = 9 packs; 9 * 24 = 216 — clamp branch not taken, capacity 500 >= 216)"
            - "repl_status == OPEN"
            - "alloc_after == 216 (commitment's 300 released at fulfillment; replenishment's 216 allocated)"

      - name: media_settled_mer_per_line_rounding_order_pinned
        grounds:
          - calculations.media_efficiency_ratio
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct from the
          mode-(a) instance): settled MER rounds the 15% agency commission PER
          ORDER LINE to whole cents first, then sums. Lines 3335/3335/3334 at
          spend 2000 yield per-line 2835+2835+2834 = 8504 -> 4.252, while the
          rejected whole-sum order yields 8503 -> 4.2515. The scaffold pins
          per-line-first; both 4dp values are asserted.
        test_recipe:
          setup:
            - "Same backbone as media_mer_provisional_vs_settled_diverge except spend 2000 and projected gross 3000."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - *k_concept
            - *k_ins_a
            - *k_ins_b
            - *k_clock0910
            - *k_advance
            - *k_advance
            - *k_advance
            - *k_round
            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - *k_tool
            - *k_study
            - *k_complete
            - *k_substantiate
            - call: "POST /media-tests"
              payload: { variant_id: "${variant_id}", title: "Infomercial B", media_spend_cents: 2000 }
              as: MediaBuyer
              captures: { media_id: $.data.id }
            - call: "POST /media-tests/${media_id}/air"
              payload: { projected_gross_cents: 3000 }
              as: MediaBuyer
              captures: { prov_mer: $.data.provisional_mer }
          trigger:
            - call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "SCALE"
                order_lines:
                  - { revenue_cents: 3335, cancels_cents: 0, returns_cents: 0 }
                  - { revenue_cents: 3335, cancels_cents: 0, returns_cents: 0 }
                  - { revenue_cents: 3334, cancels_cents: 0, returns_cents: 0 }
              as: MediaBuyer
              captures: { settled_mer: $.data.settled_mer, media_status: $.data.status }
          assert:
            - "settled_mer == 4.252 (per-line rounding: round_half_up(3335*0.85)=2835 twice, round_half_up(3334*0.85)=2834; 8504/2000 = 4.252)"
            - "settled_mer != 4.2515 (the rejected whole-sum order: round_half_up(10004*0.85)=8503; 8503/2000 = 4.2515)"
            - "prov_mer == 1.5 (3000/2000)"
            - "media_status == DECIDED_SCALE"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_study_challenge_retest_cycle
        grounds:
          - state_machines.ClaimStudy.SUBSTANTIATED_to_CHALLENGED
          - state_machines.ClaimStudy.CHALLENGED_to_RUNNING
          - state_machines.ModelVariant.claim_clearance
        distinguishing_aspect: |
          Cyclic machine on ClaimStudy (RUNNING -> RESULTS_RECORDED ->
          SUBSTANTIATED -> CHALLENGED -> RUNNING -> ... -> SUBSTANTIATED): the
          entity revisits RUNNING after reaching SUBSTANTIATED, and the
          variant's parallel claim_clearance dimension tracks each hop.
        test_recipe:
          setup:
            - "Variant CV100-AMZ TOOLED with study SUBSTANTIATED (margin 0.15; conducted sci-anna, substantiated sci-bob); clearance SUBSTANTIATED."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - *k_concept
            - *k_ins_a
            - *k_ins_b
            - *k_clock0910
            - *k_advance
            - *k_advance
            - *k_advance
            - *k_round
            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - *k_tool
            - *k_study
            - *k_complete
            - *k_substantiate
          trigger:
            - call: "POST /claim-studies/${study_id}/challenge"
              payload: { reason: "Competitor dispute letter" }
              as: LegalCounsel
              captures: { st_challenged: $.data.status }
            - call: "GET /model-variants/${variant_id}"
              payload: {}
              as: ClaimsScientist
              captures: { clr_challenged: $.data.claim_clearance }
            - call: "POST /claim-studies/${study_id}/retest"
              payload: {}
              as: ClaimsScientist
              as_user_id: "sci-anna"
              captures: { st_retest: $.data.status, margin_after_retest: $.data.margin }
            - call: "POST /claim-studies/${study_id}/complete"
              payload: { our_metric: 120, baseline_metric: 100, sample_size: 35 }
              as: ClaimsScientist
              as_user_id: "sci-anna"
              captures: { margin2: $.data.margin }
            - call: "POST /claim-studies/${study_id}/substantiate"
              payload: {}
              as: ClaimsScientist
              as_user_id: "sci-bob"
              captures: { st_final: $.data.status, sub_by: $.data.substantiated_by_user_id }
            - call: "GET /model-variants/${variant_id}"
              payload: {}
              as: ClaimsScientist
              captures: { clr_final: $.data.claim_clearance }
          assert:
            - "st_challenged == CHALLENGED and clr_challenged == CHALLENGED (cycle hop 1)"
            - "st_retest == RUNNING and margin_after_retest is null (results cleared on cycle re-entry)"
            - "margin2 == 0.2 (retest re-records: (120-100)/100)"
            - "st_final == SUBSTANTIATED and sub_by == 'sci-bob' and clr_final == SUBSTANTIATED (cycle closed a second time)"

      - name: model_variant_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ModelVariant.lifecycle
          - state_machines.ModelVariant.claim_clearance
          - entities.ModelVariant.fields.lifecycle
          - entities.ModelVariant.fields.claim_clearance
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (distinct from the ClaimStudy
          cycle): a RETAIL_LIVE variant's claim_clearance can flip SUBSTANTIATED
          -> CHALLENGED without lifecycle moving, and clearance alone then gates
          a new media air even though lifecycle permits it.
        test_recipe:
          setup:
            - "Variant CV100-AMZ RETAIL_LIVE (commitment fulfilled path as in replenishment_quantity_five_input_clamp_then_round); claim study SUBSTANTIATED."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - *k_concept
            - *k_ins_a
            - *k_ins_b
            - *k_clock0910
            - *k_advance
            - *k_advance
            - *k_advance
            - *k_round
            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - *k_tool
            - *k_study
            - *k_complete
            - *k_substantiate
            - *k_media
            - *k_air
            - call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "SCALE"
                order_lines: [ { revenue_cents: 5000, cancels_cents: 0, returns_cents: 0 } ]
              as: MediaBuyer
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: true, window_start: "2026-10-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_id: $.data.id }
            - call: "POST /retail-agreements/${agr_id}/sign"
              payload: {}
              as: RetailExec
              captures: { agr_v: $.data.version }
            - call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 300, need_by_date: "2026-10-15T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /launch-seasons/${season_id}/run-review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claim-studies/${study_id}/challenge"
              payload: { reason: "Competitor ITC complaint" }
              as: LegalCounsel
            - call: "GET /model-variants/${variant_id}"
              payload: {}
              as: MediaBuyer
              captures: { lifecycle_now: $.data.lifecycle, clearance_now: $.data.claim_clearance }
            - call: "POST /media-tests"
              payload: { variant_id: "${variant_id}", title: "Post-launch flight", media_spend_cents: 800 }
              as: MediaBuyer
              captures: { media2_id: $.data.id, media2_status: $.data.status }
            - call: "POST /media-tests/${media2_id}/air"
              payload: { projected_gross_cents: 2000 }
              as: MediaBuyer
              captures: { air_err: $.data.error_id }
          assert:
            - "lifecycle_now == RETAIL_LIVE and clearance_now == CHALLENGED — the two dimensions moved independently"
            - "media2_status == EDITING (RETAIL_LIVE lifecycle permits creating a later flight)"
            - "air_err == ERR_CLAIM_NOT_SUBSTANTIATED (clearance dimension alone blocks the air; lifecycle state gate at priority 5 was already satisfied)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: adverse_judgment_cascades_case_to_category_to_season_posture
        grounds:
          - state_machines.PatentCase.ACTIVE_to_JUDGED_ADVERSE
          - state_machines.Category.exposure_level
          - state_machines.LaunchSeason.SEASON_OPEN_to_SEASON_GUARDED
          - calculations.patent_exposure_index
        distinguishing_aspect: |
          Depth-3 cascade originating at record-judgment: the judgment sets the
          case's final_amount (hop 1), which recomputes the category's
          exposure_index with the ADVERSE_WEIGHT_MULTIPLIER (hop 2: 6 + 9*3 =
          33), which flips exposure_level to SEVERE and drags the season's
          posture OPEN -> GUARDED (hop 3) — and the new posture then blocks a
          media air with ERR_SEASON_GUARDED (observable operational bite).
        test_recipe:
          setup:
            - "Clock 2026-09-10. Season OPEN; category base 6; variant TOOLED with SUBSTANTIATED clearance; a media test EDITING (air-ready)."
            - "Patent case PT-2001 (HIGH, claim 2000000) filed and activated by a run-review (exposure 6 + 9 = 15, ELEVATED; season still OPEN)."
            - "Season review_index == 1 after that review."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - *k_concept
            - *k_ins_a
            - *k_ins_b
            - *k_clock0910
            - *k_advance
            - *k_advance
            - *k_advance
            - *k_round
            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - *k_tool
            - *k_study
            - *k_complete
            - *k_substantiate
            - *k_media
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-2001", claim_cents: 2000000, severity: "HIGH" }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { case_id: $.data.id }
            - call: "POST /launch-seasons/${season_id}/run-review"
              payload: {}
              as: PlatformAdmin
              captures: { review_idx: $.data.review_index }
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { exposure_before: $.data.exposure_index, level_before: $.data.exposure_level }
          trigger:
            - call: "POST /patent-cases/${case_id}/record-judgment"
              payload: { outcome: "ADVERSE", award_cents: 800000 }
              as: LegalCounsel
              captures: { case_status: $.data.status, case_final: $.data.final_amount_cents }
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { exposure_after: $.data.exposure_index, level_after: $.data.exposure_level, reserve_after: $.data.active_reserve_cents }
            - call: "GET /launch-seasons/${season_id}"
              payload: {}
              as: PlatformAdmin
              captures: { posture_after: $.data.posture, guarded_since: $.data.guarded_since_review_index }
            - call: "POST /media-tests/${media_id}/air"
              payload: { projected_gross_cents: 2000 }
              as: MediaBuyer
              captures: { air_err: $.data.error_id }
          assert:
            - "case_status == JUDGED_ADVERSE and case_final == 800000 (hop 1: judgment mutates the case)"
            - "exposure_before == 15 and level_before == ELEVATED (6 + HIGH 9 while the case was FILED/ACTIVE)"
            - "exposure_after == 33 (hop 2: 6 + 9 * ADVERSE_WEIGHT_MULTIPLIER 3) and level_after == SEVERE and reserve_after == 800000"
            - "posture_after == SEASON_GUARDED and guarded_since == review_idx (hop 3: the category level change dragged the season)"
