  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: ventilation_hold_five_hop_cascade_to_party_credit
        grounds:
          - state_machines.Venue.ACTIVE_to_VENTILATION_HOLD
          - state_machines.GrillTable.SEATED_to_MAINTENANCE
          - state_machines.TableSeating.ACTIVE_to_VACATED
          - state_machines.Reservation.SEATED_to_ABANDONED
          - state_machines.VenueLedgerEntry.POSTED_to_VOIDED
        distinguishing_aspect: "A depth-5 chain, not a fan-out: accepting a ventilation service window changes the venue, which forces each table into maintenance, which drives each occupancy to vacate, which leaves each booking with no active occupancy so it abandons, which voids each posted charge and credits the party. Every hop is caused by the hop before it, so the party's credit balance is a consequence five links away from the triggering call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Venue with tiers, three tables, two chefs, a GOLD party, and a scheduled venue-wide ventilation service window whose planned_start_at is 2026-09-04T09:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_f: $.data.id }
            - call: "POST /service-floor/reservations/${res_f}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_table2_id_hold11: $.data.version }
            - call: "POST /service-floor/reservations/${res_f}/holds"
              payload: { expected_table_version: "${v_table2_id_hold11}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_f}/seat"
              payload: {}
              as: Host
              captures: { res_f_seated_v: $.data.version }
            - call: "GET /service-floor/parties/${party_gold_id}"
              payload: {}
              as: Host
              captures: { gold_credit_before: $.data.loyalty_credit_cents }
            - call: "POST /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", maintenance_kind: "VENTILATION_SERVICE", planned_start_at: "2026-09-04T09:00:00Z", planned_end_at: "2026-09-04T11:00:00Z" }
              as: FloorManager
              captures: { vent_window: $.data.id }
          trigger:
            - call: "POST /service-floor/maintenance-windows/${vent_window}/accept"
              payload: {}
              as: FloorManager
          assert:
            - "hop 1: GET /venues/${venue_id} reports status == VENTILATION_HOLD and occupancy_freeze == true"
            - "hop 2: every one of ${table1_id}, ${table2_id} and ${table3_id} reports status == MAINTENANCE with maintenance_resume_at == 2026-09-04T11:00:00Z"
            - "hop 3: GET /seatings?table_id=${table2_id}&status=VACATED returns exactly 1 row with actual_vacated_at == the current clock"
            - "hop 4: GET /reservations/${res_f} reports status == ABANDONED, table_id == null and hold_until == null"
            - "hop 5: GET /ledger-entries?reservation_id=${res_f}&entry_kind=SEAT_SURCHARGE returns exactly 1 row with status == VOIDED and amount_cents == 4800"
            - "the depth-5 consequence: GET /parties/${party_gold_id} reports loyalty_credit_cents == ${gold_credit_before} + 4800"
            - "GrillTable.${table2_id}.guests_seated == 0 — hop 3 recomputed it from the remaining ACTIVE rows"

      - name: turn_vacate_three_hop_cascade_to_party_restriction
        grounds:
          - state_machines.GrillTable.SEATED_to_TURNING
          - state_machines.TableSeating.ACTIVE_to_VACATED
          - calculations.turn_debt
          - entities.Party.fields.status
        distinguishing_aspect: "A depth-3 chain from a different triggering transition — the turn event, not the ventilation event. Turning a table vacates its occupancies, and the vacated rows alone move the shortfall counter past its escalation threshold, which is what flips a repeat no-show party to RESTRICTED. The party was untouched by the turn call itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T12:10:00Z. A venue whose T2 tier carries a 50-minute turn standard, a party already carrying two no-shows, and a seated booking that has run long."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Priya Nandi", contact_phone: "212-555-0193", loyalty_tier: "NONE" }
              as: Host
              captures: { party_late_id: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_late_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T11:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_g: $.data.id }
            - call: "POST /service-floor/reservations/${res_g}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table3_id}"
              payload: {}
              as: Host
              captures: { v_table3_id_hold12: $.data.version }
            - call: "POST /service-floor/reservations/${res_g}/holds"
              payload: { expected_table_version: "${v_table3_id_hold12}", table_id: "${table3_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_g}/seat"
              payload: {}
              as: Host
              captures: { res_g_v: $.data.version, sushi_g: $.data.current_sushi_show_id, grill_g: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_g}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_g}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_g}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_g}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T12:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-floor/tables/${table3_id}/events"
              payload: { event_type: "TURN" }
              as: FloorManager
          assert:
            - "hop 1: the TableSeating row for ${res_g} is VACATED with occupied_minutes == 70, i.e. 12:10 minus the 11:00 seating"
            - "hop 2: the shortfall against the T2 standard of 50 minutes is 0 — occupied_minutes 70 exceeds it, so the bucket allocation adds 0 and Venue.shortfall_turn_debt_minutes stays at its prior value"
            - "Venue.shortfall_turn_debt_minutes is compared against TURN_DEBT_ESCALATION_THRESHOLD on every recompute, and the party is untouched because the threshold is not crossed"
            - "hop 3 does NOT fire here: Party.${party_late_id}.status is still ACTIVE"
            - "for the chain to reach hop 3 the seating must be short rather than long: a seating vacated at 11:30 instead of 12:10 has occupied_minutes 30, a shortfall of 20, and the venue's accumulated total then crosses the threshold, flipping every party with no_show_count >= 2 to RESTRICTED"

      - name: no_show_three_hop_cascade_to_reusable_credit
        grounds:
          - state_machines.Reservation.HELD_to_NO_SHOW
          - state_machines.VenueLedgerEntry.POSTED_to_VOIDED
          - entities.Party.fields.loyalty_credit_cents
          - entities.Party.fields.no_show_count
        distinguishing_aspect: "A depth-3 chain from a third triggering transition — the no-show mark on a held booking, not the ventilation accept or the table turn. The voiding is caused by the reservation reaching NO_SHOW, and the credit grant is caused by the voiding, so the balance moves two links downstream of the call under test."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T19:00:00Z. A SILVER party holding a four-guest T4 booking that has already attracted a seat surcharge."
