  # ===========================================================================
  # SECTION 4 — Validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:

      - name: submit_beyond_the_booking_horizon_is_rejected_at_the_exact_edge
        claim_type: temporal_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_BOOKING_HORIZON_EXCEEDED]
          - calculations.event_window_and_shift_derivation
        distinguishing_aspect: "With the clock at 2026-08-01 and MAX_BOOKING_HORIZON_DAYS 120, latest_bookable_date is 2026-11-29: SUBMIT on a 2026-11-30 event returns ERR_BOOKING_HORIZON_EXCEEDED 422 while the 2026-11-29 event submits, so the horizon comparison is <= and not <."
        test_recipe:
          setup:
            - "Clock left at the startup default 2026-08-01T00:00:00Z."
            - "Two DRAFT NON_FOOD events at one club: E_edge on 2026-11-29 and E_over on 2026-11-30."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Carrowmore Goods", billing_email: "ap@carrowmore.example", program_tier: "STANDARD", credit_limit_cents: 900000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6026", name: "Carrowmore Club 6026", region_code: "NE", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "CG-LNT-026", name: "Lint Roller", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 700, samples_per_case: 4, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-11-30", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { over_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-11-29", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { edge_id: "$.data.id" }
          trigger:
            - call: "POST /demo-events/${over_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { err_horizon: "$.data.error_id" }
            - call: "POST /demo-events/${edge_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { edge_state: "$.data.booking_status" }
          assert:
            - "${err_horizon} == ERR_BOOKING_HORIZON_EXCEEDED"
            - "the 2026-11-30 SUBMIT responds with HTTP 422"
            - "${err_horizon} != ERR_BOOKING_LEAD_TIME_TOO_SHORT"
            - "DemoEvent.${over_id}.booking_status == DRAFT"
            - "${edge_state} == SUBMITTED"
            - "the 2026-11-29 SUBMIT responds with HTTP 200"

      - name: account_status_gates_creation_and_advancement_differently
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=40]
          - validations[priority=41]
          - entities.Manufacturer.fields.account_status
          - errors[ERR_MANUFACTURER_SUSPENDED]
          - errors[ERR_MANUFACTURER_ON_CREDIT_HOLD]
        distinguishing_aspect: "The DemoEvent's own state is legal throughout; only the parent Manufacturer's account_status changes the outcome — SUSPENDED blocks POST /demo-events with ERR_MANUFACTURER_SUSPENDED 402, HOLD allows creation but blocks SUBMIT with ERR_MANUFACTURER_ON_CREDIT_HOLD 402, and ACTIVE allows both."
        test_recipe:
          setup:
            - "A manufacturer, a club and a NON_FOOD product created while the manufacturer is still ACTIVE, then the manufacturer is set to SUSPENDED."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Dovecourt Brands", billing_email: "ap@dovecourt.example", program_tier: "STANDARD", credit_limit_cents: 900000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6027", name: "Dovecourt Club 6027", region_code: "SE", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "DB-FRM-027", name: "Picture Frame", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1300, samples_per_case: 4, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "PATCH /manufacturers/${mfr_id}"
              payload: { account_status: "SUSPENDED" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { suspended_state: "$.data.account_status" }
          trigger:
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { err_suspended: "$.data.error_id" }
            - call: "PATCH /manufacturers/${mfr_id}"
              payload: { account_status: "HOLD" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id", event_state: "$.data.booking_status" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { err_hold: "$.data.error_id" }
            - call: "PATCH /manufacturers/${mfr_id}"
              payload: { account_status: "ACTIVE" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { final_state: "$.data.booking_status" }
          assert:
            - "${suspended_state} == SUSPENDED"
            - "${err_suspended} == ERR_MANUFACTURER_SUSPENDED"
            - "the suspended create responds with HTTP 402"
            - "${event_state} == DRAFT"
            - "the create under HOLD responds with HTTP 201"
            - "${err_hold} == ERR_MANUFACTURER_ON_CREDIT_HOLD"
            - "the SUBMIT under HOLD responds with HTTP 402"
            - "${err_hold} != ERR_MANUFACTURER_SUSPENDED"
            - "${final_state} == SUBMITTED"

      - name: not_found_at_priority_6_outranks_ownership_at_priority_8
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_DEMO_EVENT_NOT_FOUND]
          - errors[ERR_RESOURCE_OWNERSHIP]
          - endpoints[PATCH /demo-events/{id}]
        distinguishing_aspect: "A foreign manufacturer patching another manufacturer's DRAFT event gets ERR_RESOURCE_OWNERSHIP 403, but the same foreign caller patching an id that does not exist gets ERR_DEMO_EVENT_NOT_FOUND 404 — path-id resolution at priority 6 runs before the ownership test at priority 8, so existence is never leaked in the other direction."
        test_recipe:
          setup:
