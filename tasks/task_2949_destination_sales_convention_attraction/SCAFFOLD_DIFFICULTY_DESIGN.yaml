              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /hotels"
              payload: { name: "Harborview Grand", committable_rooms: 600, walk_distance_blocks: 2 }
              as: BureauAdmin
              captures: { hotel_a_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_v_a: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_a_id}", rooms_peak_invited: 500, expected_opportunity_version: "${opp_v_a}" }
              as: SalesManager
              captures: { c_a_id: $.data.id }
            - call: "POST /room-block-commitments/${c_a_id}/offer"
              payload: { rooms_peak_offered: 500, rate_offered_amount: 214.33, cutoff_days_before_arrival: 30 }
              as: HotelPartner
              as_user_id: "${hotel_a_id}"
              captures: { c_a_status_offered: $.data.status, c_a_cutoff_date: $.data.cutoff_date }
            - call: "POST /hotels/${hotel_a_id}/participation"
              payload: { participation_status: "SUSPENDED" }
              as: BureauAdmin
              captures: { hotel_status_suspended: $.data.participation_status }
          trigger:
            - call: "POST /room-block-commitments/${c_a_id}/commit"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { coverage_during_suspension: $.data.block_coverage_pct }
            - call: "POST /hotels/${hotel_a_id}/participation"
              payload: { participation_status: "PARTICIPATING" }
              as: BureauAdmin
              captures: { hotel_status_back: $.data.participation_status }
            - call: "POST /room-block-commitments/${c_a_id}/commit"
              payload: {}
              as: SalesManager
              captures: { c_a_status_after: $.data.status, c_a_peak: $.data.rooms_peak_committed, c_a_nights: $.data.committed_room_nights }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { coverage_after: $.data.block_coverage_pct }
          assert:
            - "${c_a_status_offered} == OFFERED and ${c_a_cutoff_date} == 2028-03-11"
            - "${hotel_status_suspended} == SUSPENDED"
            - "the first commit returns HTTP 409 with ${err} == ERR_HOTEL_NOT_PARTICIPATING and the commitment is still OFFERED"
            - "${coverage_during_suspension} == 0.00 and Hotel.${hotel_a_id}.committed_peak_rooms == 0 - nothing was applied"
            - "${hotel_status_back} == PARTICIPATING"
            - "the identical second commit succeeds: ${c_a_status_after} == COMMITTED, ${c_a_peak} == 500, ${c_a_nights} == 1000"
            - "${coverage_after} == 50.00 and Hotel.${hotel_a_id}.committed_peak_rooms == 500"
            - "a fresh POST /room-block-commitments for a SUSPENDED hotel also fails with ERR_HOTEL_NOT_PARTICIPATING, so the rule guards invite, offer and commit alike"

  - rule_id: resource_temporal_overlap
    instances:
      - name: hotel_nightly_capacity_admits_touching_windows_and_rejects_a_shared_night
        grounds:
          - calculations.hotel_nightly_block_capacity
          - validations[priority 28 ERR_HOTEL_CAPACITY_EXCEEDED]
          - entities.Hotel.fields.committed_peak_rooms
          - state_machines.RoomBlockCommitment.OFFERED_to_COMMITTED
        distinguishing_aspect: |
          Room inventory is contended PER NIGHT over the half-open range [arrival_date, departure_date), not per
          event: Bayside Suites (400 rooms) can carry 300 rooms for 2028-04-10 -> 2028-04-12 AND 400 rooms for
          2028-04-12 -> 2028-04-14 because the departure night is not occupied, so the windows merely touch.
          Hotel.committed_peak_rooms is then the MAX over nights (400), never the sum (700). A third
          commitment for the single night 2028-04-11 fits at exactly 100 rooms (300 + 100 == 400) and is
          rejected at 101 (401 > 400).
