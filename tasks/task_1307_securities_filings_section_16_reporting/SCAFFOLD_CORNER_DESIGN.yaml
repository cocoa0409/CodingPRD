scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: create_issuer_defaults_applied
        claim_type: defaults
        grounds: [entities.Issuer.fields.holiday_dates, entities.Issuer.fields.next_earnings_filing_date]
        distinguishing_aspect: "Omitting optional fields applies defaults: holiday_dates == [] and next_earnings_filing_date == null; version starts at 1."
        test_recipe:
          setup: ["Nothing (empty DB)"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id, i_v: $.data.version }
          trigger:
            - call: "GET /issuers/${i_id}"
              as: ComplianceOfficer
          assert:
            - "holiday_dates == [] (default applied)"
            - "next_earnings_filing_date IS null"
            - "i_v == 1 (version starts at 1); id is a server-minted UUID; created_at has three fractional digits"

      - name: create_issuer_missing_required_cik_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Issuer.fields.cik, "validations[priority=3.5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /issuers without the required cik field is rejected with ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["Nothing (empty DB)"]
          setup_api_calls: []
          trigger:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_missing_person_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Nothing (empty DB)"]
          setup_api_calls: []
          trigger:
            - call: "GET /reporting-persons/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: position_change_is_immutable_event
        claim_type: immutability
        grounds: [entities.PositionChange]
        distinguishing_aspect: "PositionChange has common_fields: false — its GET response carries id and created_at but no version and no updated_at field, and no update endpoint exists."
        test_recipe:
          setup: ["Issuer I (shares_outstanding 1,000,000); holder H; one posted position"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /beneficial-holders"
              payload: { issuer_id: "${i_id}", holder_name: "Big Fund LP" }
              as: ComplianceOfficer
              captures: { h_id: $.data.id }
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 10000, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
              captures: { pc_id: $.data.id }
          trigger:
            - call: "GET /position-changes/${pc_id}"
              as: ComplianceOfficer
          assert:
            - "response contains id == pc_id and created_at; response contains NO version field and NO updated_at field"
            - "shares_delta == 10000 as posted"

      - name: filing_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /filings]"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more inside the fixed envelope with meta.api_request_id and response_type == array."
        test_recipe:
          setup:
            - "Issuer I; person P designated ACTIVE at clock 2026-08-03 (Form 3 draft) and one purchase dated 2026-08-03 confirmed (Form 4 draft) -> 2 filings for P"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-03", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", limit: 1, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "response envelope has meta.api_request_id and response_type == \"array\""
            - "data length == 1; total_count == 2; has_more == true; limit == 1; offset == 0"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: person_initial_state_proposed
        claim_type: initial_state
        grounds: [state_machines.ReportingPerson]
        distinguishing_aspect: "A newly created ReportingPerson starts in PROPOSED before any transition."
        test_recipe:
          setup: ["Issuer I exists"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_status: $.data.status }
          assert:
            - "p_status == PROPOSED"

      - name: designate_active_person_returns_person_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ReportingPerson.PROPOSED_to_ACTIVE, "errors[ERR_PERSON_INVALID_STATE]"]
        distinguishing_aspect: "DESIGNATE on an already-ACTIVE person is rejected with ERR_PERSON_INVALID_STATE; no duplicate Form 3 is created."
        test_recipe:
          setup: ["Issuer I; person P designated ACTIVE at the default clock"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERSON_INVALID_STATE"
            - "GET /filings?reporting_person_id=${p_id}&form_type=FORM_3 returns exactly 1 entry (no duplicate draft)"

      - name: void_reported_transaction_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SecurityTransaction, "errors[ERR_TRANSACTION_INVALID_STATE]"]
        distinguishing_aspect: "REPORTED is terminal: voiding a transaction whose filing was ACCEPTED is rejected with ERR_TRANSACTION_INVALID_STATE."
        test_recipe:
          setup:
            - "Issuer I (ccc CCC12345); agent_1 authorized; person P ACTIVE; purchase 2026-08-01 confirmed; auto Form 4 submitted and ACCEPTED at the default clock 2026-08-01 (timely, deadline 2026-08-04)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-01", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /filings/${f_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "POST /filings/${f_id}/record-edgar-result"
              payload: { outcome: "ACCEPTED", accession_number: "0000000001-26-000010" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { t_read: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/void"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TRANSACTION_INVALID_STATE (transaction already REPORTED; terminal lockdown)"

      - name: submit_draft_filing_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SecuritiesFiling.READY_to_SUBMITTED, "errors[ERR_FILING_INVALID_STATE]"]
        distinguishing_aspect: "Submit is only valid from READY; a DRAFT filing rejects submission with ERR_FILING_INVALID_STATE (state check fires before the agent-authorization check)."
        test_recipe:
          setup: ["Issuer I (ccc CCC12345); person P ACTIVE with its auto Form 3 still DRAFT"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_3", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f_id: "$.data[0].id" }
          trigger:
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FILING_INVALID_STATE"

      - name: run_completed_sweep_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AnnualSweep.OPEN_to_COMPLETED, "errors[ERR_SWEEP_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: running the same sweep twice fails the second time with ERR_SWEEP_INVALID_STATE."
        test_recipe:
          setup: ["Issuer I; sweep for FY2026 created and run once"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /annual-sweeps"
              payload: { issuer_id: "${i_id}", fiscal_year: 2026 }
              as: ComplianceOfficer
              captures: { sw_id: $.data.id }
            - call: "POST /annual-sweeps/${sw_id}/run"
              payload: {}
              as: ComplianceOfficer
              captures: { sw_status: $.data.status }
          trigger:
            - call: "POST /annual-sweeps/${sw_id}/run"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "sw_status == COMPLETED after the first run"
            - "err == ERR_SWEEP_INVALID_STATE"

      - name: revoke_revoked_authorization_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FilingAgentAuthorization.ACTIVE_to_REVOKED, "errors[ERR_AUTHORIZATION_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: a second revoke is rejected with ERR_AUTHORIZATION_INVALID_STATE."
        test_recipe:
          setup: ["Issuer I; authorization for agent_1 created and revoked"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
              captures: { auth_id: $.data.id }
            - call: "POST /filing-agent-authorizations/${auth_id}/revoke"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /filing-agent-authorizations/${auth_id}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AUTHORIZATION_INVALID_STATE"

      - name: terminated_plan_rejects_activate
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TradingPlan10b5_1, "errors[ERR_PLAN_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal: ACTIVATE on a terminated plan is rejected with ERR_PLAN_INVALID_STATE."
        test_recipe:
          setup: ["Issuer I; person P (10% owner); plan approved at clock 2026-08-03 then terminated"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Owner", person_cik: "0001000002", is_ten_pct_owner: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan A", first_trade_date: "2026-11-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "TERMINATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PLAN_INVALID_STATE"

      - name: form3_draft_auto_created_on_designation
        claim_type: side_effect_execution
        grounds: [state_machines.ReportingPerson.PROPOSED_to_ACTIVE, calculations.filing_deadline]
        distinguishing_aspect: "DESIGNATE creates exactly one DRAFT Form 3 with prepared_by_user_id == null and filing_deadline == designation_date + 10 calendar days."
        test_recipe:
          setup: ["Issuer I; person P; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_3", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f3_ddl: "$.data[0].filing_deadline", f3_preparer: "$.data[0].prepared_by_user_id" }
          assert:
            - "exactly one FORM_3 DRAFT exists for P"
            - "f3_ddl == \"2026-08-13\" (designation 2026-08-03 + 10 calendar days)"
            - "f3_preparer IS null (system-generated)"

      - name: amendment_acceptance_supersedes_original
        claim_type: side_effect_execution
        grounds: [state_machines.SecuritiesFiling.ACCEPTED_to_SUPERSEDED, "concurrency_rules[amendment-create-stale-filing]"]
        distinguishing_aspect: "When an amendment filing is ACCEPTED, the amended original filing transitions ACCEPTED -> SUPERSEDED while the amendment becomes ACCEPTED."
        test_recipe:
          setup:
            - "Issuer I (ccc CCC12345); agent_1 authorized; person P ACTIVE; purchase 2026-08-01 confirmed; its Form 4 submitted and ACCEPTED at the default clock (timely)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-01", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /filings/${f_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "POST /filings/${f_id}/record-edgar-result"
              payload: { outcome: "ACCEPTED", accession_number: "0000000001-26-000011" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "GET /filings/${f_id}"
              as: ComplianceOfficer
              captures: { f_v: $.data.version }
            - call: "POST /filings/${f_id}/amendments"
              payload: { expected_filing_version: "${f_v}" }
              as: FilingCoordinator
              as_user_id: "coord_1"
              captures: { am_id: $.data.id, am_target: $.data.amends_filing_id }
            - call: "POST /filings/${am_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filings/${am_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
          trigger:
            - call: "POST /filings/${am_id}/record-edgar-result"
              payload: { outcome: "ACCEPTED", accession_number: "0000000001-26-000012" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { am_status: $.data.status }
            - call: "GET /filings/${f_id}"
              as: ComplianceOfficer
              captures: { orig_status: $.data.status }
          assert:
            - "am_target == f_id (amendment references the original, self-referential FK)"
            - "am_status == ACCEPTED"
            - "orig_status == SUPERSEDED (system transition on amendment acceptance)"

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: form4_deadline_skips_weekend_and_holiday
        claim_type: correct_result
        grounds: [calculations.filing_deadline, entities.Issuer.fields.holiday_dates]
        distinguishing_aspect: "With 2026-08-10 (Monday) declared an issuer holiday, a Thursday 2026-08-06 transaction's Form 4 deadline moves from 2026-08-10 to 2026-08-11."
        test_recipe:
          setup: ["Issuer I with holiday_dates [\"2026-08-10\"]; person P ACTIVE (designated 2026-08-03); purchase dated 2026-08-06 confirmed at clock 2026-08-06"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345", holiday_dates: ["2026-08-10"] }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
