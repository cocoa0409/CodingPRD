              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 115000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
