            - { call: "POST /contracts/${c1}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-002", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c2: $.data.id } }
            - { call: "POST /contracts/${c2}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c1}" }, as: CarrierOps, captures: { ac1: $.data.id } }
            - { call: "POST /aircraft", payload: { tail_number: "N200AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c2}" }, as: CarrierOps, captures: { ac2: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c1}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p1: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac1}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_a1: $.data.id } }
            - { call: "POST /carding-inspections/${i_a1}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac2}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_a2: $.data.id } }
            - { call: "POST /carding-inspections/${i_a2}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
