              payload: { outcome: "SATISFACTORY", notes: "Second monitoring meeting held." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /intervention-plans/${plan_id}/close"
              payload: { closing_note: "Both check-ins met on time." }
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "the plan creation returned HTTP 201 with InterventionPlan.${plan_id}.status == DRAFT and EarlyInterventionAlert.${alert_id}.plan_count == 1"
            - "the activation moved EarlyInterventionAlert.${alert_id}.status to PLAN_ACTIVE and set InterventionPlan.${plan_id}.activated_at == 2026-08-01T00:00:00Z and end_date == 2026-08-31T00:00:00Z"
            - "the check-in list returned total_count == 2 with data[0].sequence_index == 1 and due_at == 2026-08-11T00:00:00Z, data[1].sequence_index == 2 and due_at == 2026-08-21T00:00:00Z (interval_days = 30 // 3 = 10)"
            - "MonitoringCheckIn.${ci1_id}.status == COMPLETED, outcome == SATISFACTORY, on_time == true (completed_at equals due_at and the test is non-strict)"
            - "MonitoringCheckIn.${ci2_id}.status == COMPLETED and on_time == true"
            - "InterventionPlan.${plan_id}.completed_checkin_count == 2, on_time_checkin_count == 2, concern_count == 0"
            - "the close call returned HTTP 200 with InterventionPlan.${plan_id}.status == CLOSED_SUCCESS, compliance_score == 100.00 and closed_at == 2026-08-21T00:00:00Z"
            - "EarlyInterventionAlert.${alert_id}.status == CLOSED_SUCCESS in the same request (the parent transition has no endpoint of its own)"
            - "Officer.${bell_id}.open_alert_count == 0 and intervention_escalation_count == 0 and eis_alert_level == ALERT (the risk dimension is not reset by a successful plan)"

      - name: officer_employment_and_risk_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Officer.transitions
          - entities.Officer.fields.eis_alert_level
        excluded_because:
          difficulty_instance: non_linear_state_machine / officer_employment_and_risk_dimensions_advance_independently
          rationale: "That §1.8 instance walks employment_status and eis_alert_level along their own axes and asserts the combined state after each move."

      - name: plan_activation_is_guarded_by_the_alert_state
        claim_type: guarded transitions
        grounds:
          - state_machines.InterventionPlan.transitions.DRAFT_to_ACTIVE
          - state_machines.EarlyInterventionAlert.transitions.OPEN_to_PLAN_REQUIRED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_creation_depends_on_the_alert_status_the_sweep_promotes
          rationale: "The cross-entity guard (a plan may only be created and activated once the sweep has promoted the alert to PLAN_REQUIRED) is that instance's whole subject."

      - name: appeal_decision_adjusts_the_officer_and_disclosure_rows
        claim_type: Cross-entity
        grounds:
          - state_machines.Discipline.transitions.APPEALED_to_OVERTURNED
          - state_machines.CredibilityDisclosure.transitions.ACTIVE_to_EXPUNGED
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_overturned_reverses_the_whole_cascade
          rationale: "Every cross-entity link of the OVERTURNED decision (Discipline, Allegation, Officer ledger, employment dimension, CredibilityDisclosure) is asserted there."

      - name: caseload_ledger_stays_in_step_with_investigation_states
        claim_type: Ledger sync
        grounds:
          - entities.Officer.fields.open_case_load
          - state_machines.Investigation.transitions.ASSIGNED_to_ASSIGNED
        excluded_because:
          difficulty_instance: compensating_invariant / open_case_load_is_conserved_across_assignment_reassignment_void_and_close
          rationale: "That instance reconciles open_case_load before and after assignment, reassignment, void and close, which is exactly the ledger-sync claim."

      - name: overturned_discipline_reverses_its_own_side_effects
        claim_type: Compensation
        grounds:
          - entities.Officer.fields.imposed_suspension_days_total
          - state_machines.Officer.transitions.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / suspension_day_ledger_returns_to_its_pre_appeal_value_before_the_employment_flip
          rationale: "The compensation claim (the day ledger returns to its pre-imposition value with no drift, and only then does the employment flip fire) is asserted there."

      - name: reclassification_cascade_fires_only_when_the_assignee_falls_short
        claim_type: Conditional cascade
        grounds:
          - state_machines.Complaint.transitions.CLASSIFIED_to_CLASSIFIED
          - calculations.investigation_window
        excluded_because:
          difficulty_instance: transitive_cascade / reclassification_forces_investigation_back_to_unassigned
          rationale: "The second cascade link is conditional on required_certification_level rising above the seated assignee's certification_level; that instance asserts the condition and the forced unassignment."

  # =========================================================================
  # Guide section 3 - Calculations (§1.3, 14 rules)
  # =========================================================================
  - section: calculations
    instances:
      - name: the_selector_walks_its_four_ranking_keys_and_rejects_an_empty_pool
        claim_type: Correct Result
        grounds:
          - calculations.investigator_selection
          - endpoints["POST /investigations/{id}/assignments"]
          - validations[priority=10]
          - entities.Officer.fields.open_case_load
        distinguishing_aspect: |
          When investigator_officer_id is omitted the selector must apply its keys in the
          declared order. Three assignments in a row expose all of them: the first is decided by
          badge_number ascending between two equally loaded, equally certified investigators
          (IA-101 beats IA-102), the second by certification_level descending between two
          zero-load candidates, and the third by open_case_load ascending — which hands the file
          to the least certified investigator, proving key 1 outranks key 2. A fourth complaint
          whose subject sits inside internal affairs empties the pool through eligibility
          conditions (5) and (6) and must return ERR_NO_ELIGIBLE_INVESTIGATOR (422).
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes plus investigators Ahn (IA-101, certification_level 3), Briggs (IA-102, certification_level 3) and Calder (IA-050, certification_level 2), each with max_case_load 3 and open_case_load 0."
            - "Patrol North holds Sergeant Doyle and Officer Vance."
            - "Four CLASS_II complaints A, B, C and D are UNDER_INVESTIGATION with one allegation each and an UNASSIGNED Investigation; A, B and C name Officer Vance as subject, D names Investigator Calder."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-102", full_name: "Investigator Briggs", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_A", hire_date: "2014-06-02T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_b_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-050", full_name: "Investigator Calder", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 10800000, demographic_code: "DG_C", hire_date: "2016-04-04T00:00:00Z", is_investigator: true, certification_level: 2, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_c_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
