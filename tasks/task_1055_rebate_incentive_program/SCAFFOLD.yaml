      - "POST /api/claims/{id}/submit"
      - "POST /api/claims/{id}/withdraw"
      - "POST /api/claims/{id}/appeal"
      - "POST /api/virtual-cards/{id}/activate"
      - "POST /api/virtual-cards/{id}/spend"
      - "GET /api/offers/{id}"
      - "GET /api/offers"
      - "GET /api/claimants/{id}"
      - "GET /api/claims/{id}"
      - "GET /api/claims"
      - "GET /api/claims/{id}/receipts"
      - "GET /api/receipts/{id}"
