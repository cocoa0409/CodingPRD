  # =====================================================================
  # RULE 6 - boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: safety_margin_exactly_ten_psi_is_adequate_and_nine_ninety_nine_is_marginal
        grounds:
          - calculations.water_supply_availability
          - entities.WaterSupplyEvaluation.fields.safety_margin_psi
          - entities.WaterSupplyEvaluation.fields.margin_verdict
          - entities.WaterSupplyEvaluation.fields.safety_margin_pct
        distinguishing_aspect: |
          Two hydrant tests are chosen so the safety margin lands on either side of the inclusive
          ADEQUATE_MARGIN_PSI 10.00 boundary by one hundredth of a psi: 80.0 / 64.0 / 2250.0 gives
          available 65.54 and a margin of exactly 10.00 (ADEQUATE), while 91.0 / 43.0 / 3000.0 gives
          available 65.53 and a margin of 9.99 (MARGINAL). The pair pins three things at once - that
          the comparison is >= and not >, that the Hazen-Williams supply curve is rounded to 2 dp
          before the subtraction rather than after, and that margin_pct is 1 dp over the AVAILABLE
          pressure (15.3 vs 15.2) rather than over the required pressure.
        test_recipe:
          setup:
            - "Project FP-2601, hazard area HA-1 -> EXTRA_1, hose 500.0; STANDPIPE_CLASS_I 2 risers -> 750.0"
            - "Calculation HC-1 driven to the supply connection: required_psi_at_base_of_riser 50.54, so required_psi_at_demand is 50.54 + 5.00 lead-in = 55.54"
            - "Project.total_system_demand_gpm 2130.0, which is the design_demand_gpm both evaluations use"
            - "A preliminary evaluation on H-14 exists before the supply-connection iteration so the chain can close CONVERGED; it is superseded by the first trigger call"
            - "Two flow tests on file: H-14 80.0 / 64.0 / 2250.0 and H-31 91.0 / 43.0 / 3000.0, both inside the validity window"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 3000.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 150.0, fitting_equivalent_ft: 40.0, flow_gpm: 110.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "4", length_ft: 90.0, fitting_equivalent_ft: 5.0, flow_gpm: 420.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0, tested_at: "2026-05-14T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_prelim: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "6", length_ft: 60.0, fitting_equivalent_ft: 5.0, flow_gpm: 880.0, elevation_change_ft: 8.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-31", static_psi: 91.0, residual_psi: 43.0, flow_gpm: 3000.0, tested_at: "2026-05-20T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft2: $.data.id }
          trigger:
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_a: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft2}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_b: $.data.id }
          assert:
            - "WaterSupplyEvaluation.${wse_a}.design_demand_gpm == 2130.0"
            - "WaterSupplyEvaluation.${wse_a}.required_psi_at_demand == 55.54"
            - "WaterSupplyEvaluation.${wse_a}.available_psi_at_demand == 65.54"
            - "WaterSupplyEvaluation.${wse_a}.safety_margin_psi == 10.00"
            - "WaterSupplyEvaluation.${wse_a}.margin_pct == 15.3"
            - "WaterSupplyEvaluation.${wse_a}.margin_verdict == ADEQUATE"
            - "WaterSupplyEvaluation.${wse_b}.available_psi_at_demand == 65.53"
            - "WaterSupplyEvaluation.${wse_b}.safety_margin_psi == 9.99"
            - "WaterSupplyEvaluation.${wse_b}.margin_pct == 15.2"
            - "WaterSupplyEvaluation.${wse_b}.margin_verdict == MARGINAL"
            - "WaterSupplyEvaluation.${wse_a}.state == SUPERSEDED"
            - "WaterSupplyEvaluation.${wse_b}.state == EVALUATED"
            - "WaterSupplyEvaluation.${wse_prelim}.state == SUPERSEDED"
            - "WaterSupplyEvaluation.${wse_a}.safety_margin_psi is still 10.00 after the second evaluation, so the superseded row is frozen and not re-derived"
            - "HydraulicCalculation.${hc1}.state == CONVERGED"
            - "Project.${p1}.pump_required_flag == false, because the newest verdict MARGINAL does not demand a pump"

      - name: velocity_limit_accepts_exactly_thirty_two_fps_and_rejects_thirty_two_point_zero_one
        grounds:
          - validations[priority=20]
          - calculations.pipe_sizing_chain
          - entities.PipeSizingIteration.fields.velocity_fps
          - errors.ERR_VELOCITY_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Two candidate iterations straddle VELOCITY_LIMIT_FPS by a tenth of a gallon per minute in a
          2 inch pipe: 334.7 gpm gives 0.4085 * 334.7 / 2.067^2 = 32.00 fps and is accepted, 334.8 gpm
          gives 32.01 fps and is refused. Because the velocity is rounded to 2 dp BEFORE the
          comparison and the comparison is <=, an implementation that truncates, that compares the
          unrounded value, or that uses < would flip one of the two. The rejected call must also leave
          no trace: iteration_count stays 1 and required_psi_at_base_of_riser stays 198.35.
        test_recipe:
          setup:
            - "Project FP-2604 with a LIGHT hazard area, no auxiliary systems"
            - "Calculation HC-4 in DRAFT with k_factor 25.2, iteration_count 0"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2604", building_name: "Guadalupe Street Retail", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "MERCANTILE", building_height_ft: 22.0, underground_lead_in_loss_psi: 0.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p4: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p4}", label: "Sales floor", hazard_class: "ORDINARY_1", commodity_class: "CLASS_II", storage_height_ft: 6.0, ceiling_height_ft: 16.0, area_sqft: 9000.0, sprinkler_system_type: "WET" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha4: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p4}", hazard_area_id: "${ha4}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc4: $.data.id }
          trigger:
            - call: "POST /hydraulic-calculations/${hc4}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 20.0, fitting_equivalent_ft: 5.0, flow_gpm: 334.7, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { it1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc4}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "2", length_ft: 20.0, fitting_equivalent_ft: 5.0, flow_gpm: 334.8, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
          assert:
            - "the first trigger call returns 201"
            - "PipeSizingIteration.${it1}.velocity_fps == 32.00"
            - "PipeSizingIteration.${it1}.friction_loss_psi == 21.95"
            - "PipeSizingIteration.${it1}.cumulative_psi_after == 198.35"
            - "HydraulicCalculation.${hc4}.end_head_psi == 176.40"
            - "HydraulicCalculation.${hc4}.required_psi_at_base_of_riser == 198.35"
            - "HydraulicCalculation.${hc4}.iteration_count == 1"
            - "the second trigger call returns 422 ERR_VELOCITY_LIMIT_EXCEEDED"
            - "HydraulicCalculation.${hc4}.iteration_count == 1 after the rejected call"
            - "HydraulicCalculation.${hc4}.required_psi_at_base_of_riser == 198.35 after the rejected call"
            - "HydraulicCalculation.${hc4}.state == ITERATING"
            - "GET /hydraulic-calculations/${hc4}/iterations returns exactly 1 row"

  # =====================================================================
  # RULE 7 - cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: seal_blocked_by_inadequate_evaluation_until_an_acceptable_fire_pump_references_it
        grounds:
          - validations[priority=21]
          - state_machines.HydraulicCalculation.QC_PASSED_to_SEALED
          - calculations.fire_pump_sizing
          - concurrency_rules[pump-size-stale-evaluation]
          - entities.FirePump.fields.sizing_verdict
          - entities.WaterSupplyEvaluation.fields.pump_sized
        distinguishing_aspect: |
          Whether the calculation may be sealed is decided entirely by rows of two other entities: the
          newest EVALUATED WaterSupplyEvaluation of the project and any FirePump referencing it.
          Nothing about the calculation changes between the refused seal and the granted one - the same
          request, same actor, same iteration chain - only the existence of a SIZED pump with
          sizing_verdict ACCEPTABLE against evaluation ${wse_bad}. The pump itself has to pass its own
          three-gate ladder (suction 32.25 psi at the 150 percent point, churn 106.0 psi, available
          58.25 psi at 150 percent against a 55.54 psi requirement) before it can unblock the seal, so
          a pump that merely exists is not enough.
        test_recipe:
          setup:
            - "Project FP-2601 with HC-1 driven to QC_PASSED (iteration_count 3, required_psi_at_base_of_riser 50.54, required_psi_at_demand 55.54) and Project.total_system_demand_gpm 2130.0"
            - "The QC pass was recorded by a second engineer, so segregation of duties is satisfied"
            - "A weak hydrant test H-52 50.0 / 30.0 / 4000.0 is then evaluated on the RAW_TEST basis, giving available 43.77, margin -11.77, margin_pct -26.9, verdict INADEQUATE_PUMP_REQUIRED - and this evaluation still reconciles with the calculation on all three parts of validations priority 23"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Sam Oyelaran", license_state: "TX", license_number: "PE-88431", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e2: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 3000.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 150.0, fitting_equivalent_ft: 40.0, flow_gpm: 110.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "4", length_ft: 90.0, fitting_equivalent_ft: 5.0, flow_gpm: 420.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0, tested_at: "2026-05-14T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "6", length_ft: 60.0, fitting_equivalent_ft: 5.0, flow_gpm: 880.0, elevation_change_ft: 8.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/qc-review"
              payload: { disposition: "PASS", review_note: "Independent check of the most demanding area" }
              as: QcReviewer
              as_user_id: "${e2}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-52", static_psi: 50.0, residual_psi: 30.0, flow_gpm: 4000.0, tested_at: "2026-06-02T14:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft_low: $.data.id }
            - call: "POST /water-supply-evaluations"
