          The dependency is on ONE SPECIFIC sibling row rather than on any row of a type: the
          BuildOrder is already TESTED because a first run was certified, so a package built on a
          second, merely EVALUATED run passes both the build-order state check at 40 and the
          run-to-order match at 45, yet must still fail release with ERR_TEST_RUN_NOT_CERTIFIED.
