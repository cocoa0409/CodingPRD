# =============================================================================
# Task 1216 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Logical clock default: 2026-05-01T00:00:00Z. All chains replay from empty-DB.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities ====
  - section: entities
    instances:
      - name: community_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.Community, response_envelope]
        distinguishing_aspect: "A fresh community is PLANNING / DECLARANT_CONTROL with zeroed counters, version 1, and the fixed success envelope (meta.api_request_id, response_type, data)."
        test_recipe:
          setup: ["empty database; clock unset (default 2026-05-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /mpc/communities"
              payload: { community_name: "Solstice Ranch", total_planned_units: 100 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id, c_status: $.data.status, c_stage: $.data.transition_stage, c_count: $.data.closed_unit_count, c_ver: $.data.version }
          assert:
            - "http 201; envelope has meta.api_request_id, meta.api_request_timestamp, response_type == object"
            - "${c_status} == PLANNING and ${c_stage} == DECLARANT_CONTROL and ${c_count} == 0 and ${c_ver} == 1"
            - "GET /mpc/communities/${c_id} returns the same stored fields (retrieval)"

      - name: community_create_missing_required_returns_validation
        claim_type: required_fields
        grounds: ["entities.Community", "errors[ERR_VALIDATION]", "validations[priority=3.5]"]
        distinguishing_aspect: "Omitting required total_planned_units yields ERR_VALIDATION (400), not a server default."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mpc/communities"
              payload: { community_name: "No Units" }
              as: DeclarantExecutive
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION (http 400)"

      - name: community_create_with_undeclared_field_returns_validation
        claim_type: computed_fields
        grounds: ["entities.Community.fields.closed_unit_count", "validations[priority=3.5]"]
        distinguishing_aspect: "Strict schema: sending the computed field closed_unit_count is an undeclared-field rejection (400), not silently ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mpc/communities"
              payload: { community_name: "Computed Trick", total_planned_units: 10, closed_unit_count: 5 }
              as: DeclarantExecutive
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION (http 400); computed/system fields cannot be client-injected"

      - name: not_found_sweep_sales_side
        claim_type: not_found
        grounds: ["errors[ERR_PHASE_NOT_FOUND]", "errors[ERR_AMENITY_NOT_FOUND]", "errors[ERR_BUILDER_NOT_FOUND]", "errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_TRANCHE_NOT_FOUND]", "errors[ERR_LOT_NOT_FOUND]", "errors[ERR_CLOSING_NOT_FOUND]"]
        distinguishing_aspect: "Every sales-side resource returns its own typed 404 for a well-formed but absent UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /mpc/phases/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_phase: $.data.error_id }
            - call: "GET /mpc/amenities/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_amenity: $.data.error_id }
            - call: "GET /mpc/builders/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_builder: $.data.error_id }
            - call: "GET /mpc/agreements/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_agreement: $.data.error_id }
            - call: "GET /mpc/tranches/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_tranche: $.data.error_id }
            - call: "GET /mpc/lots/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_lot: $.data.error_id }
            - call: "GET /mpc/closings/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_closing: $.data.error_id }
          assert:
            - "${e_phase} == ERR_PHASE_NOT_FOUND; ${e_amenity} == ERR_AMENITY_NOT_FOUND; ${e_builder} == ERR_BUILDER_NOT_FOUND; ${e_agreement} == ERR_AGREEMENT_NOT_FOUND; ${e_tranche} == ERR_TRANCHE_NOT_FOUND; ${e_lot} == ERR_LOT_NOT_FOUND; ${e_closing} == ERR_CLOSING_NOT_FOUND (all http 404)"

      - name: not_found_sweep_governance_side
        claim_type: not_found
        grounds: ["errors[ERR_BUDGET_NOT_FOUND]", "errors[ERR_LINE_ITEM_NOT_FOUND]", "errors[ERR_RATE_NOT_FOUND]", "errors[ERR_DISTRICT_NOT_FOUND]", "errors[ERR_ADVANCE_NOT_FOUND]", "errors[ERR_LEVY_NOT_FOUND]", "errors[ERR_PAYMENT_NOT_FOUND]", "errors[ERR_BOARD_SEAT_NOT_FOUND]"]
        distinguishing_aspect: "Every governance/finance resource returns its own typed 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /mpc/budgets/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_budget: $.data.error_id }
            - call: "GET /mpc/line-items/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_li: $.data.error_id }
            - call: "GET /mpc/assessment-rates/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_rate: $.data.error_id }
            - call: "GET /mpc/districts/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_district: $.data.error_id }
            - call: "GET /mpc/advances/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_adv: $.data.error_id }
            - call: "GET /mpc/levies/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_levy: $.data.error_id }
            - call: "GET /mpc/payments/00000000-0000-4000-8000-000000000000"
              as: DeclarantController
              captures: { e_pay: $.data.error_id }
            - call: "GET /mpc/board-seats/00000000-0000-4000-8000-000000000000"
              as: AssociationDirector
              captures: { e_seat: $.data.error_id }
          assert:
            - "${e_budget} == ERR_BUDGET_NOT_FOUND; ${e_li} == ERR_LINE_ITEM_NOT_FOUND; ${e_rate} == ERR_RATE_NOT_FOUND; ${e_district} == ERR_DISTRICT_NOT_FOUND; ${e_adv} == ERR_ADVANCE_NOT_FOUND; ${e_levy} == ERR_LEVY_NOT_FOUND; ${e_pay} == ERR_PAYMENT_NOT_FOUND; ${e_seat} == ERR_BOARD_SEAT_NOT_FOUND (all http 404)"

      - name: not_found_sweep_lifestyle_side
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]", "errors[ERR_VIOLATION_NOT_FOUND]", "errors[ERR_EVENT_NOT_FOUND]", "errors[ERR_RSVP_NOT_FOUND]", "errors[ERR_APPOINTMENT_NOT_FOUND]", "errors[ERR_RESIDENT_NOT_FOUND]", "errors[ERR_NOTICE_NOT_FOUND]", "errors[ERR_COMMUNITY_NOT_FOUND]"]
        distinguishing_aspect: "Every lifestyle/enforcement resource plus the root community returns its own typed 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /mpc/applications/00000000-0000-4000-8000-000000000000"
              as: DesignReviewer
              captures: { e_app: $.data.error_id }
            - call: "GET /mpc/violations/00000000-0000-4000-8000-000000000000"
              as: DesignReviewer
              captures: { e_vio: $.data.error_id }
            - call: "GET /mpc/events/00000000-0000-4000-8000-000000000000"
              as: LifestyleCoordinator
              captures: { e_event: $.data.error_id }
            - call: "GET /mpc/rsvps/00000000-0000-4000-8000-000000000000"
              as: LifestyleCoordinator
              captures: { e_rsvp: $.data.error_id }
            - call: "GET /mpc/appointments/00000000-0000-4000-8000-000000000000"
              as: LifestyleCoordinator
              captures: { e_appt: $.data.error_id }
            - call: "GET /mpc/residents/00000000-0000-4000-8000-000000000000"
              as: LifestyleCoordinator
              captures: { e_res: $.data.error_id }
            - call: "GET /mpc/notices/00000000-0000-4000-8000-000000000000"
              as: LifestyleCoordinator
              captures: { e_notice: $.data.error_id }
            - call: "GET /mpc/communities/00000000-0000-4000-8000-000000000000"
              as: DeclarantExecutive
              captures: { e_comm: $.data.error_id }
          assert:
            - "${e_app} == ERR_APPLICATION_NOT_FOUND; ${e_vio} == ERR_VIOLATION_NOT_FOUND; ${e_event} == ERR_EVENT_NOT_FOUND; ${e_rsvp} == ERR_RSVP_NOT_FOUND; ${e_appt} == ERR_APPOINTMENT_NOT_FOUND; ${e_res} == ERR_RESIDENT_NOT_FOUND; ${e_notice} == ERR_NOTICE_NOT_FOUND; ${e_comm} == ERR_COMMUNITY_NOT_FOUND (all http 404)"

      - name: lot_and_budget_defaults_applied
        claim_type: defaults
        grounds: [entities.Lot.fields.lot_premium_cents, entities.AssociationBudget.fields.non_assessment_income_cents, entities.BudgetLineItem.fields.is_reserve]
        distinguishing_aspect: "Omitted optional inputs land their declared defaults (0 / 0 / false) and computed totals track line-item additions."
        test_recipe:
          setup: ["active community with a PLANNED phase"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Defaults Depot", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/budgets"
              payload: { community_id: "${c_id}", fiscal_year: 2027 }
              as: DeclarantController
              captures: { bud_id: $.data.id, bud_income: $.data.non_assessment_income_cents, bud_total0: $.data.total_expense_cents }
          trigger:
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "L1" }
              as: DeclarantExecutive
              captures: { lot_prem: $.data.lot_premium_cents, lot_status: $.data.status }
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "UTILITIES", amount_cents: 700000 }
              as: DeclarantController
              captures: { li_reserve: $.data.is_reserve }
            - call: "GET /mpc/budgets/${bud_id}"
              as: DeclarantController
              captures: { bud_total1: $.data.total_expense_cents, bud_reserve: $.data.reserve_cents }
          assert:
            - "${lot_prem} == 0 and ${lot_status} == PLATTED"
            - "${bud_income} == 0 and ${bud_total0} == 0; ${li_reserve} == false"
            - "after one 700,000c non-reserve line: ${bud_total1} == 700000 and ${bud_reserve} == 0"

      - name: amenity_conditional_trigger_and_enum_validation
        claim_type: type_constraints
        grounds: ["entities.Amenity.fields.trigger_phase_id", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Conditional requirement (trigger_unit_count required iff trigger_phase_id present) and enum membership (GOLF_COURSE is not an amenity_type) both yield ERR_VALIDATION."
        test_recipe:
          setup: ["active community with one phase"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Enum Enclave", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /mpc/amenities"
              payload: { community_id: "${c_id}", amenity_type: "POOL", hard_deadline_date: "2027-12-31T00:00:00Z", budgeted_cost_cents: 500000, trigger_phase_id: "${p1_id}" }
              as: DeclarantExecutive
              captures: { err_pair: $.data.error_id }
            - call: "POST /mpc/amenities"
              payload: { community_id: "${c_id}", amenity_type: "GOLF_COURSE", hard_deadline_date: "2027-12-31T00:00:00Z", budgeted_cost_cents: 500000 }
              as: DeclarantExecutive
              captures: { err_enum: $.data.error_id }
          assert:
            - "${err_pair} == ERR_VALIDATION (trigger_phase_id without trigger_unit_count)"
            - "${err_enum} == ERR_VALIDATION (invalid enum member)"

  # ======================================================= state_machines ====
  - section: state_machines
    instances:
      - name: phase_invalid_transitions_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: ["state_machines.DevelopmentPhase", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "close-out from PLANNED is rejected; a CANCELLED phase rejects both a second cancel and open-sales (terminal lockdown)."
        test_recipe:
          setup: ["ACTIVE community; phase P1 PLANNED (no lots)"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Lockdown Lane", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id, p1_status: $.data.status }
          trigger:
            - call: "POST /mpc/phases/${p1_id}/close-out"
              payload: {}
              as: DeclarantExecutive
              captures: { err_closeout: $.data.error_id }
            - call: "POST /mpc/phases/${p1_id}/cancel"
              payload: {}
              as: DeclarantExecutive
              captures: { cancelled: $.data.status }
            - call: "POST /mpc/phases/${p1_id}/cancel"
              payload: {}
              as: DeclarantExecutive
              captures: { err_again: $.data.error_id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
              captures: { err_open: $.data.error_id }
          assert:
            - "initial state ${p1_status} == PLANNED; close-out from PLANNED -> ${err_closeout} == ERR_INVALID_STATE"
            - "cancel succeeds -> ${cancelled} == CANCELLED; second cancel -> ${err_again} == ERR_INVALID_STATE; open-sales on CANCELLED -> ${err_open} == ERR_INVALID_STATE"

      - name: closing_double_transition_rejected
        claim_type: idempotency
        grounds: ["state_machines.LotClosing", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED closing rejects a second close and a cancel (both defined only from PENDING)."
        test_recipe:
          setup: ["ACTIVE community/phase/agreement (1 lot, tranche due 2026-06-30); lot OFFERED; clock 2026-06-01 (tranche OPEN); one closing CLOSED"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Double Close", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "DC Builders", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { b_id: $.data.id }
            - call: "POST /mpc/agreements"
              payload: { community_id: "${c_id}", builder_id: "${b_id}", phase_id: "${p1_id}", base_price_per_lot_cents: 5000000, annual_escalation_pct: 6.0, penalty_per_lot_per_day_cents: 1000, earnest_money_cents: 1000000, total_lots_committed: 1 }
              as: DeclarantController
              captures: { ag_id: $.data.id }
            - call: "POST /mpc/tranches"
              payload: { agreement_id: "${ag_id}", tranche_no: 1, due_date: "2026-06-30T00:00:00Z", lot_count_due: 1 }
              as: DeclarantController
            - call: "POST /mpc/agreements/${ag_id}/execute"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/agreements/${ag_id}/commence"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "L1" }
              as: DeclarantExecutive
              captures: { l1_id: $.data.id }
            - call: "POST /mpc/lots/${l1_id}/offer"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mpc/closings"
              payload: { agreement_id: "${ag_id}", lot_id: "${l1_id}" }
              as: DeclarantController
              captures: { cl_id: $.data.id, cl_status: $.data.status }
            - call: "POST /mpc/closings/${cl_id}/close"
              payload: {}
              as: DeclarantController
          trigger:
            - call: "POST /mpc/closings/${cl_id}/close"
              payload: {}
              as: DeclarantController
              captures: { err_close2: $.data.error_id }
            - call: "POST /mpc/closings/${cl_id}/cancel"
              payload: {}
              as: DeclarantController
              captures: { err_cancel: $.data.error_id }
          assert:
            - "creation lands PENDING (${cl_status} == PENDING); after close the lot is CLOSED"
            - "second close -> ${err_close2} == ERR_INVALID_STATE; cancel after close -> ${err_cancel} == ERR_INVALID_STATE"

      - name: budget_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.AssociationBudget.REJECTED_to_DRAFT]
        distinguishing_aspect: "Cyclic branch: PROPOSED -> REJECTED -> DRAFT -> PROPOSED again, each hop role-correct."
        test_recipe:
          setup: ["ACTIVE community; DRAFT budget with one line item, PROPOSED"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Revision Ranch", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/budgets"
              payload: { community_id: "${c_id}", fiscal_year: 2027 }
              as: DeclarantController
              captures: { bud_id: $.data.id }
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "INSURANCE", amount_cents: 300000 }
              as: DeclarantController
            - call: "POST /mpc/budgets/${bud_id}/propose"
              payload: {}
              as: DeclarantController
          trigger:
            - call: "POST /mpc/budgets/${bud_id}/reject"
              payload: {}
              as: AssociationDirector
              captures: { st_rejected: $.data.status }
            - call: "POST /mpc/budgets/${bud_id}/revise"
              payload: {}
              as: DeclarantController
              captures: { st_draft: $.data.status }
            - call: "POST /mpc/budgets/${bud_id}/propose"
              payload: {}
              as: DeclarantController
              captures: { st_reproposed: $.data.status }
          assert:
            - "${st_rejected} == REJECTED, ${st_draft} == DRAFT, ${st_reproposed} == PROPOSED (full revision loop)"

      - name: phase_sequence_blocked_until_predecessor_delivers
        claim_type: precondition_enforcement
        grounds: ["state_machines.DevelopmentPhase.PLANNED_to_SALES_OPEN", "errors[ERR_PHASE_SEQUENCE_BLOCKED]"]
        distinguishing_aspect: "Guarded transition: phase 2 cannot open while phase 1 is PLANNED (predecessor must reach DELIVERING/CLOSED_OUT); duplicate sequence_no is also blocked."
        test_recipe:
          setup: ["ACTIVE community; phase 1 PLANNED; phase 2 PLANNED"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Sequence Springs", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P2", sequence_no: 2, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p2_id: $.data.id }
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1-dup", sequence_no: 1, planned_lot_count: 3 }
              as: DeclarantExecutive
              captures: { err_dup: $.data.error_id }
          trigger:
            - call: "POST /mpc/phases/${p2_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
              captures: { err_seq: $.data.error_id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
              captures: { p1_status: $.data.status }
            - call: "POST /mpc/phases/${p2_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
              captures: { err_seq2: $.data.error_id }
          assert:
            - "duplicate sequence_no -> ${err_dup} == ERR_PHASE_SEQUENCE_BLOCKED (409)"
            - "phase 2 with predecessor PLANNED -> ${err_seq} == ERR_PHASE_SEQUENCE_BLOCKED"
            - "phase 1 opens (${p1_status} == SALES_OPEN); phase 2 with predecessor merely SALES_OPEN still -> ${err_seq2} == ERR_PHASE_SEQUENCE_BLOCKED (needs DELIVERING or CLOSED_OUT)"

      - name: amenity_hard_deadline_delinquency_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.Amenity.UNDER_CONSTRUCTION_to_DELINQUENT, state_machines.CommunityEvent.SCHEDULED_to_CANCELLED, calculations.amenity_trigger_breach]
        distinguishing_aspect: "Clock sweep past hard_deadline_date flips the amenity DELINQUENT, cascades the SCHEDULED venue event to CANCELLED, and auto-creates a DRAFT AMENITY_DELINQUENCY notice."
        test_recipe:
          setup: ["ACTIVE community; CLUBHOUSE amenity UNDER_CONSTRUCTION with hard_deadline_date 2026-06-01; event at CLUBHOUSE SCHEDULED for 2026-06-10 (scheduled at the default clock: gate allows UNDER_CONSTRUCTION, 40-day lead)"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Deadline Downs", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/amenities"
