      - name: a_request_missing_x_user_header_is_rejected_ahead_of_role_and_shape
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - validations[priority=30]
          - errors.ERR_MISSING_USER_ID
        distinguishing_aspect: "The same body would fail the shape check for a missing permit_number and the role check for the wrong role, yet the answer is the 401 from priority 10, and this holds for the /_clock endpoint too."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /stormwater/permit-terms"
              payload: { term_start_date: "2026-01-01" }
              as: UtilityBillingClerk
              as_user_id: ""
              captures: { e1: $.data.error_id }
              note: "the X-User-ID header is omitted entirely; the role shown is only the role the caller would have had"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: StormwaterProgramManager
              as_user_id: ""
              captures: { e2: $.data.error_id }
              note: "X-User-ID header omitted"
          assert:
            - "both calls: 401 with error_id ERR_MISSING_USER_ID"
            - "neither the missing permit_number nor the disallowed UtilityBillingClerk role is reported, proving priority 10 runs first"
            - "no PermitTerm row is created and the logical clock stays at 2026-08-01T00:00:00Z"

