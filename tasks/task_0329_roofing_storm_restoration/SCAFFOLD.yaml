# =============================================================================
# Roofing & Storm-Restoration Contractor — seed tables (Expert difficulty)
# =============================================================================

scenario: |
  Roofing & Storm-Restoration Contractor: lead/inspection & damage assessment,
  scope & measurement (aerial) estimate, material order & delivery, crew
  scheduling, draw/progress payment, permit & inspection, change order,
  workmanship warranty.

domain_name: roofing-storm-restoration
api_prefix: ""

# Flat topology: every entity lives at a top-level collection (/jobs, /estimates,
# /draws, ...) and references its parents through declared foreign keys, never
# through nested URL paths.

complexity_profile:
  primary_archetype: ledger reconciliation
  secondary_archetype: workflow orchestration
  complexity_layers:
    - dual_variant_calculation       # aerial vs final estimate; prorated vs short-rate warranty refund
    - cascading_side_effects         # change-order apply cascades across estimate -> contract -> draw ledger -> material order
    - optimistic_concurrency         # OCC on Job.version for draw create (supersede) and on Estimate.version for line-item append
    - temporal_windowing             # crew assignment (half-open) and permit re-inspection window (closed + buffer)

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many        # Job -> Inspection/Estimate/MaterialOrder/CrewAssignment/Draw/Permit/ChangeOrder/Warranty
    - cross_aggregate    # CrewAssignment references Crew across the Job aggregate boundary
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Job
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: customer_name, type: string, source: input, description: "Homeowner / property owner name" }
      - { name: property_address, type: string, source: input, description: "Street address of the roof" }
      - { name: peril, type: enum, source: input, description: "HAIL | WIND | HURRICANE | OTHER — the storm peril claimed" }
      - { name: insurance_carrier, type: string, source: input, required: false, description: "Carrier name when claim-backed" }
      - { name: status, type: enum, source: system, description: "LEAD -> INSPECTED -> ESTIMATED -> CONTRACTED -> IN_PRODUCTION -> COMPLETED / LOST. Set by transitions in §1.2." }
      - { name: assigned_estimator_id, type: string, source: input, description: "FK -> Estimator.id; the estimator who owns scoping for this job" }
      - { name: bound_estimate_id, type: string, source: computed, required: false, description: "id of the Estimate bound at CONTRACTED (the one whose total set contract_value_cents); null before contracting" }
      - { name: contract_value_cents, type: integer, source: computed, description: "0 until CONTRACTED; then bound_estimate.final_total_cents + sum of APPLIED ChangeOrder.delta_cents. Conserved ledger anchor." }
      - { name: disbursed_gross_cents, type: integer, source: computed, default: 0, description: "Sum over DISBURSED Draw.gross_eligible_cents for this job" }
      - { name: retainage_held_cents, type: integer, source: computed, default: 0, description: "Sum over DISBURSED Draw.retainage_cents not yet released; reset to 0 when retainage released at warranty start" }
      - { name: disbursed_net_cents, type: integer, source: computed, default: 0, description: "Sum over DISBURSED Draw.net_disbursed_cents for this job" }
      - { name: billed_pct, type: number, source: computed, default: 0, description: "Highest cumulative_pct among DISBURSED Draws (0..1); the strictly-increasing billing watermark" }
      - { name: remaining_billable_cents, type: integer, source: computed, description: "contract_value_cents - disbursed_gross_cents (>= 0). With disbursed_gross_cents conserves to contract_value_cents." }
      - { name: retainage_pct, type: number, source: input, default: 0.10, description: "Fraction of each draw's gross withheld as retainage", constraints: "0 <= retainage_pct <= 0.20" }
      - { name: lost_reason, type: string, source: input, required: false, description: "Reason captured when a Job transitions to LOST" }

  - name: Estimator
    parent: null
    common_fields: false   # id, created_at only — reference data, immutable
    fields:
      - { name: name, type: string, source: input, description: "Estimator full name" }
      - { name: license_no, type: string, source: input, description: "State contractor license number" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew label, e.g. 'Crew Alpha'" }
      - { name: max_squares_per_day, type: number, source: input, description: "Productivity cap used for nothing observable but capacity sanity", default: 30 }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the crew may be scheduled" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job inspected" }
      - { name: kind, type: enum, source: input, description: "DAMAGE_ASSESSMENT | PERMIT_FINAL — DAMAGE_ASSESSMENT is the lead inspection; PERMIT_FINAL is the municipal final tied to a Permit" }
      - { name: permit_id, type: string, source: input, required: false, description: "FK -> Permit.id; required when kind=PERMIT_FINAL, must be null when kind=DAMAGE_ASSESSMENT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Closed-interval window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Closed-interval window end (ISO 8601 UTC), must be > scheduled_start" }
      - { name: damage_severity, type: enum, source: input, required: false, description: "MINOR | MODERATE | TOTAL_LOSS — recorded for DAMAGE_ASSESSMENT on completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PASSED / FAILED. Set by §1.2 transitions." }
      - { name: outcome, type: enum, source: input, required: false, description: "PASS | FAIL — supplied when completing the inspection" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job this estimate scopes" }
      - { name: source_kind, type: enum, source: input, description: "AERIAL | FIELD — AERIAL applies the aerial contingency uplift; FIELD does not" }
      - { name: aerial_contingency_pct, type: number, source: input, required: false, default: 0.08, description: "Uplift applied to the summed line subtotal for AERIAL estimates only", constraints: "0 <= aerial_contingency_pct <= 0.25" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED -> SUPERSEDED. DRAFT accepts line items; FINALIZED locks them." }
      - { name: line_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over EstimateLineItem.line_cost_cents (each already rounded per line) for this estimate" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "AERIAL: round(line_subtotal_cents * (1 + aerial_contingency_pct)); FIELD: line_subtotal_cents. The value bound into contract_value_cents." }

  - name: EstimateLineItem
    parent: null
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: input, description: "FK -> Estimate.id; the parent estimate (must be DRAFT to append)" }
      - { name: trade, type: enum, source: input, description: "SHINGLE | UNDERLAYMENT | RIDGE_VENT | FLASHING | DECKING | GUTTER" }
      - { name: squares, type: number, source: input, description: "Measured squares (100 sqft units)", constraints: "squares > 0" }
      - { name: waste_factor_pct, type: number, source: input, default: 0.10, description: "Per-line waste uplift", constraints: "0 <= waste_factor_pct <= 0.50" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per square in cents", constraints: "unit_price_cents > 0" }
      - { name: line_cost_cents, type: integer, source: computed, description: "round(squares * (1 + waste_factor_pct) * unit_price_cents) — rounded at the line, per §1.3 estimate_total" }

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job the materials are for" }
      - { name: bundles, type: integer, source: computed, description: "Derived from the job's bound estimate SHINGLE squares — see §1.3 material_order_sizing" }
      - { name: total_weight_lbs, type: integer, source: computed, description: "bundles * WEIGHT_PER_BUNDLE_LBS" }
      - { name: freight_cents, type: integer, source: computed, description: "Tiered freight by total_weight_lbs — see §1.3 material_order_sizing" }
      - { name: status, type: enum, source: system, description: "ORDERED -> DELIVERED / CANCELLED. Set by §1.2 transitions." }
      - { name: delivered_short, type: boolean, source: input, required: false, description: "True when delivery confirms fewer bundles than ordered (recorded at DELIVERED)" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job worked" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the crew booked" }
      - { name: window_start, type: datetime, source: input, description: "Half-open interval start [start, end) (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open interval end (ISO 8601 UTC), must be > window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED -> CHECKED_IN -> COMPLETED / CANCELLED. Set by §1.2 transitions." }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job the permit covers" }
      - { name: municipality, type: string, source: input, description: "Issuing authority name" }
      - { name: permit_number, type: string, source: input, required: false, description: "Issued number, recorded on ISSUED" }
      - { name: status, type: enum, source: system, description: "APPLIED -> ISSUED -> CLOSED / EXPIRED. Set by §1.2 transitions." }

  - name: Draw
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job billed" }
      - { name: cumulative_pct, type: number, source: input, description: "Cumulative percent-complete claimed (0..1); must strictly exceed the job's billed_pct", constraints: "0 < cumulative_pct <= 1" }
      - { name: expected_job_version, type: integer, source: input, description: "OCC token: the Job.version the client last observed; rejected if stale" }
      - { name: gross_eligible_cents, type: integer, source: computed, description: "round(contract_value_cents * cumulative_pct) - job.disbursed_gross_cents at request time — see §1.3 draw_amounts" }
      - { name: retainage_cents, type: integer, source: computed, description: "round(gross_eligible_cents * job.retainage_pct), unless is_final then 0 (retainage released separately)" }
      - { name: net_disbursed_cents, type: integer, source: computed, description: "gross_eligible_cents - retainage_cents" }
      - { name: is_final, type: boolean, source: computed, description: "cumulative_pct == 1.0" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> DISBURSED / REJECTED. Set by §1.2 transitions." }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job amended" }
      - { name: reason, type: string, source: input, description: "Why the scope changed (e.g. 'rotten decking discovered')" }
      - { name: delta_cents, type: integer, source: input, description: "Signed change to contract value in cents (may be negative)" }
      - { name: extra_shingle_squares, type: number, source: input, default: 0, description: "Additional SHINGLE squares to fold into material re-sizing on APPLIED", constraints: "extra_shingle_squares >= 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> APPROVED -> APPLIED / VOIDED. Set by §1.2 transitions." }

  - name: Warranty
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the completed job warranted" }
      - { name: term_months, type: integer, source: input, default: 120, description: "Workmanship warranty term in months", constraints: "term_months > 0" }
      - { name: premium_cents, type: integer, source: input, description: "Warranty premium charged in cents", constraints: "premium_cents >= 0" }
      - { name: start_at, type: datetime, source: system, description: "Stamped to the current clock when the warranty is activated" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> CANCELLED / EXPIRED. Set by §1.2 transitions." }
      - { name: cancel_basis, type: enum, source: input, required: false, description: "PRORATED | SHORT_RATE — chosen at cancellation; drives refund variant in §1.3 warranty_refund" }
      - { name: refund_cents, type: integer, source: computed, required: false, description: "Refund computed at CANCELLED per §1.3 warranty_refund" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    initial_state: LEAD
    terminal_states: [COMPLETED, LOST]
    transitions:
      - from: LEAD
        to: INSPECTED
        trigger: "POST /jobs/{id}/mark-inspected"
        actor: FieldAdjuster
        preconditions:
          - "At least one Inspection with job_id=this, kind=DAMAGE_ASSESSMENT, status=PASSED exists (ERR_NO_PASSED_ASSESSMENT)"
        side_effects:
          - "status -> INSPECTED"
          - "increments Job.version by 1"

      - from: INSPECTED
        to: ESTIMATED
        trigger: "POST /jobs/{id}/mark-estimated"
        actor: Estimator
        preconditions:
          - "At least one Estimate with job_id=this and status=FINALIZED exists (ERR_NO_FINALIZED_ESTIMATE)"
        side_effects:
          - "status -> ESTIMATED"
          - "increments Job.version by 1"

      - from: ESTIMATED
        to: CONTRACTED
        trigger: "POST /jobs/{id}/contract  (body: estimate_id)"
        actor: Estimator
        preconditions:
          - "estimate_id references an Estimate with job_id=this and status=FINALIZED (ERR_INVALID_STATE)"
          - "No other Estimate for this job is already bound (Job.bound_estimate_id is null) (ERR_ALREADY_CONTRACTED)"
        side_effects:
          - "status -> CONTRACTED"
          - "bound_estimate_id = estimate_id; that Estimate stays FINALIZED, all other FINALIZED estimates for the job -> SUPERSEDED"
          - "contract_value_cents = bound estimate final_total_cents"
          - "remaining_billable_cents = contract_value_cents"
          - "increments Job.version by 1"

      - from: CONTRACTED
        to: IN_PRODUCTION
        trigger: "POST /jobs/{id}/start-production"
        actor: ProductionManager
        preconditions:
          - "A MaterialOrder with job_id=this and status=DELIVERED exists (ERR_MATERIALS_NOT_DELIVERED)"
          - "A Permit with job_id=this and status=ISSUED exists (ERR_PERMIT_NOT_ISSUED)"
        side_effects:
          - "status -> IN_PRODUCTION"
          - "increments Job.version by 1"

      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /jobs/{id}/complete"
        actor: ProductionManager
        preconditions:
          - "billed_pct == 1.0 (a final Draw has been DISBURSED) (ERR_FINAL_DRAW_MISSING)"
          - "An Inspection with kind=PERMIT_FINAL and status=PASSED exists for this job (ERR_FINAL_INSPECTION_MISSING)"
          - "No ChangeOrder for this job is in PROPOSED or APPROVED (ERR_OPEN_CHANGE_ORDER)"
        side_effects:
          - "status -> COMPLETED"
          - "increments Job.version by 1"

      - from: LEAD
        to: LOST
        trigger: "POST /jobs/{id}/lose  (body: lost_reason)"
        actor: FieldAdjuster
        preconditions: []
        side_effects:
          - "status -> LOST"
          - "increments Job.version by 1"

      - from: INSPECTED
        to: LOST
        trigger: "POST /jobs/{id}/lose  (body: lost_reason)"
        actor: FieldAdjuster
        preconditions: []
        side_effects:
          - "status -> LOST"
          - "increments Job.version by 1"

      - from: ESTIMATED
        to: LOST
        trigger: "POST /jobs/{id}/lose  (body: lost_reason)"
        actor: FieldAdjuster
        preconditions: []
        side_effects:
          - "status -> LOST"
          - "increments Job.version by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/complete  (outcome=PASS)"
        actor: FieldAdjuster
        preconditions:
          - "outcome == PASS"
          - "For kind=DAMAGE_ASSESSMENT: damage_severity supplied (ERR_SEVERITY_REQUIRED)"
        side_effects:
          - "status -> PASSED"
          - "For kind=PERMIT_FINAL: referenced Permit, if ISSUED, -> CLOSED"
          - "increments Inspection.version by 1"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/complete  (outcome=FAIL)"
        actor: FieldAdjuster
        preconditions:
          - "outcome == FAIL"
        side_effects:
          - "status -> FAILED"
          - "increments Inspection.version by 1"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /estimates/{id}/finalize"
        actor: Estimator
        preconditions:
          - "At least one EstimateLineItem with estimate_id=this exists (ERR_EMPTY_ESTIMATE)"
        side_effects:
          - "status -> FINALIZED"
          - "line_subtotal_cents and final_total_cents frozen per §1.3 estimate_total"
          - "increments Estimate.version by 1"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: another estimate bound at Job CONTRACTED, or this estimate replaced"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUPERSEDED"
          - "increments Estimate.version by 1"

  - entity: MaterialOrder
    initial_state: ORDERED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /material-orders/{id}/deliver  (body: delivered_short?)"
        actor: ProductionManager
        preconditions:
          - "Parent Job.status is CONTRACTED or IN_PRODUCTION (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DELIVERED"
          - "increments MaterialOrder.version by 1"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /material-orders/{id}/cancel"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "increments MaterialOrder.version by 1"

  - entity: CrewAssignment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /crew-assignments/{id}/check-in"
        actor: ProductionManager
        preconditions:
          - "Parent Job.status == IN_PRODUCTION (ERR_JOB_NOT_IN_PRODUCTION)"
          - "Booked Crew.active == true (ERR_CREW_INACTIVE)"
        side_effects:
          - "status -> CHECKED_IN"
          - "increments CrewAssignment.version by 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /crew-assignments/{id}/complete"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "status -> COMPLETED"
          - "increments CrewAssignment.version by 1"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /crew-assignments/{id}/cancel"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "Frees the crew's half-open window for re-booking"
          - "increments CrewAssignment.version by 1"

  - entity: Permit
    initial_state: APPLIED
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /permits/{id}/issue  (body: permit_number)"
        actor: ProductionManager
        preconditions:
          - "permit_number supplied (ERR_MISSING_FIELD)"
        side_effects:
          - "status -> ISSUED; permit_number recorded"
          - "increments Permit.version by 1"

      - from: ISSUED
        to: CLOSED
        trigger: "system: a PERMIT_FINAL Inspection referencing this permit PASSES"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CLOSED"
          - "increments Permit.version by 1"

      - from: APPLIED
        to: EXPIRED
        trigger: "POST /permits/{id}/expire"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "status -> EXPIRED"
          - "increments Permit.version by 1"

  - entity: Draw
    initial_state: REQUESTED
    terminal_states: [DISBURSED, REJECTED]
    transitions:
      - from: REQUESTED
        to: DISBURSED
        trigger: "system: a Draw created via POST /draws is disbursed atomically in the same request when all preconditions pass"
        actor: system
        preconditions:
          - "Parent Job.status == IN_PRODUCTION (ERR_JOB_NOT_IN_PRODUCTION)"
          - "cumulative_pct > Job.billed_pct (ERR_PCT_NOT_INCREASING)"
          - "cumulative_pct <= 1.0 (ERR_PCT_OUT_OF_RANGE)"
          - "expected_job_version == Job.version (ERR_STALE_JOB_VERSION)"
        side_effects:
          - "status -> DISBURSED"
          - "gross_eligible_cents, retainage_cents, net_disbursed_cents computed per §1.3 draw_amounts"
          - "Job.disbursed_gross_cents += gross_eligible_cents; Job.disbursed_net_cents += net_disbursed_cents"
          - "Job.retainage_held_cents += retainage_cents; Job.billed_pct = cumulative_pct"
          - "Job.remaining_billable_cents = contract_value_cents - disbursed_gross_cents"
          - "increments Job.version by 1 (the OCC bump that staleness checks observe)"
          - "increments Draw.version by 1"

      - from: REQUESTED
        to: REJECTED
        trigger: "system: a Draw create that fails a non-version business precondition is recorded REJECTED (no ledger change)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REJECTED"
          - "No change to Job ledger fields"

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: ProductionManager
        preconditions:
          - "Parent Job.status IN {CONTRACTED, IN_PRODUCTION} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> APPROVED"
          - "increments ChangeOrder.version by 1"

      - from: APPROVED
        to: APPLIED
        trigger: "POST /change-orders/{id}/apply  (body: expected_job_version)"
        actor: ProductionManager
        preconditions:
          - "Parent Job.status IN {CONTRACTED, IN_PRODUCTION} (ERR_INVALID_STATE)"
          - "expected_job_version == Job.version (ERR_STALE_JOB_VERSION)"
          - "contract_value_cents + delta_cents >= disbursed_gross_cents (ERR_CONTRACT_BELOW_DISBURSED)"
        side_effects:
          - "status -> APPLIED"
          - "Job.contract_value_cents += delta_cents (cascade hop 1)"
          - "Job.remaining_billable_cents = contract_value_cents - disbursed_gross_cents (cascade hop 2, re-derived from new contract_value_cents)"
          - "If extra_shingle_squares > 0: the job's bound estimate effective SHINGLE squares grow by extra_shingle_squares, and any ORDERED MaterialOrder for the job is re-sized (bundles/total_weight_lbs/freight_cents recomputed per §1.3 material_order_sizing) (cascade hop 3, caused by hop-1/2 contract amendment)"
          - "increments Job.version by 1"

      - from: PROPOSED
        to: VOIDED
        trigger: "POST /change-orders/{id}/void"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "status -> VOIDED"
          - "increments ChangeOrder.version by 1"

      - from: APPROVED
        to: VOIDED
        trigger: "POST /change-orders/{id}/void"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "status -> VOIDED"
          - "increments ChangeOrder.version by 1"

  - entity: Warranty
    initial_state: PENDING
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /warranties/{id}/activate"
        actor: ProductionManager
        preconditions:
          - "Parent Job.status == COMPLETED (ERR_JOB_NOT_COMPLETED)"
        side_effects:
          - "status -> ACTIVE; start_at stamped to current clock"
          - "Retainage release: Job.retainage_held_cents -> 0 (released to homeowner) and Job.disbursed_net_cents += the released amount (cascade)"
          - "increments Warranty.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /warranties/{id}/cancel  (body: cancel_basis)"
        actor: ProductionManager
        preconditions:
          - "cancel_basis IN {PRORATED, SHORT_RATE} (ERR_MISSING_FIELD)"
        side_effects:
          - "status -> CANCELLED"
          - "refund_cents computed per §1.3 warranty_refund using the elapsed months between start_at and current clock"
          - "increments Warranty.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /warranties/{id}/expire"
        actor: ProductionManager
        preconditions:
          - "current clock >= start_at + term_months (ERR_WARRANTY_NOT_EXPIRED)"
        side_effects:
          - "status -> EXPIRED"
          - "increments Warranty.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: draw-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /draws"
    occ_field: "expected_job_version"
    description: |
      Creating a Draw against a Job whose version has advanced since the client
      last observed it is rejected on a stale-version check. A prior Draw create
      legitimately advanced the billing watermark and bumped Job.version; a
      create still carrying the older expected_job_version is therefore working
      from a stale view of the ledger and is refused.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

  - rule_id: change-order-apply-stale-job
    parent_entity: Job
    write_endpoint: "POST /change-orders/{id}/apply"
    occ_field: "expected_job_version"
    description: |
      Applying an approved ChangeOrder against a Job whose version has advanced
      since the client last observed it is rejected on a stale-version check.
      Another ledger mutation (a draw disbursement or another applied change
      order) has moved contract_value_cents / disbursed_gross_cents, so an apply
      carrying the older expected_job_version is reasoning from stale figures.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_total
    trigger: "Estimate finalize (DRAFT -> FINALIZED); also each EstimateLineItem append updates line_cost_cents and line_subtotal_cents while DRAFT"
    algorithm: aggregation
    formula: |
      Per line item:
        line_cost_cents = round_half_up( squares * (1 + waste_factor_pct) * unit_price_cents )
        # rounding happens AT THE LINE.
      line_subtotal_cents = sum of every EstimateLineItem.line_cost_cents for this estimate
        # PINNED ORDER: round each line first, THEN sum. (round-per-line-then-sum,
        #  not sum-then-round). This order is observable when fractional cents
        #  straddle a rounding boundary.
      If source_kind == AERIAL:
        final_total_cents = round_half_up( line_subtotal_cents * (1 + aerial_contingency_pct) )
      else  # FIELD
        final_total_cents = line_subtotal_cents
    input_set: "All EstimateLineItem rows whose estimate_id == this estimate. No status filter — line items have no status; they are immutable once the estimate is FINALIZED."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up at each line, then again after the AERIAL uplift"
    variants:
      - name: aerial
        when: "source_kind == AERIAL"
        difference: "final_total_cents applies the aerial_contingency_pct uplift to the summed subtotal"
      - name: field
        when: "source_kind == FIELD"
        difference: "no contingency; final_total_cents == line_subtotal_cents"

  - name: draw_amounts
    trigger: "Draw create that passes preconditions (REQUESTED -> DISBURSED)"
    algorithm: waterfall_allocation
    formula: |
      gross_to_date_cents = round_half_up( Job.contract_value_cents * cumulative_pct )
      gross_eligible_cents = gross_to_date_cents - Job.disbursed_gross_cents   # at request time
      is_final = (cumulative_pct == 1.0)
      if is_final:
        retainage_cents = 0          # final draw withholds nothing new
      else:
        retainage_cents = round_half_up( gross_eligible_cents * Job.retainage_pct )
      net_disbursed_cents = gross_eligible_cents - retainage_cents
    input_set: "Single Job (the draw's parent) read at request time: contract_value_cents, disbursed_gross_cents, retainage_pct."
    constants: {}
    precision: "integer cents; round_half_up on gross_to_date and on retainage"
    variants:
      - name: progress_draw
        when: "cumulative_pct < 1.0"
        difference: "retainage_cents withheld at retainage_pct"
      - name: final_draw
        when: "cumulative_pct == 1.0"
        difference: "retainage_cents = 0; the gross_eligible is paid net of nothing new (held retainage released separately at warranty activation)"

  - name: material_order_sizing
    trigger: "MaterialOrder create (uses the job's bound estimate); recomputed on ChangeOrder apply when extra_shingle_squares > 0 and an ORDERED MaterialOrder exists"
    algorithm: tiered_pricing
    formula: |
      effective_squares = (sum of bound-estimate EstimateLineItem.squares where trade==SHINGLE)
                          + (sum of APPLIED ChangeOrder.extra_shingle_squares for the job)
      bundles = max( MIN_BUNDLES, ceil( effective_squares * (1 + SHINGLE_WASTE) * BUNDLES_PER_SQUARE ) )
      total_weight_lbs = bundles * WEIGHT_PER_BUNDLE_LBS
      freight_cents:
        if total_weight_lbs <= 2000:  7500
        elif total_weight_lbs <= 4000: 12500
        else: 12500 + ceil( (total_weight_lbs - 4000) / 1000 ) * 3000
    input_set: "Bound estimate's SHINGLE line items (trade==SHINGLE) plus APPLIED ChangeOrder extra squares for the job."
    constants:
      MIN_BUNDLES: 12
      BUNDLES_PER_SQUARE: 3
      SHINGLE_WASTE: 0.15
      WEIGHT_PER_BUNDLE_LBS: 80
    precision: "integer bundles via ceil; freight in integer cents"

  - name: warranty_refund
    trigger: "Warranty cancel (ACTIVE -> CANCELLED)"
    algorithm: decay_function
    formula: |
      elapsed_months = whole months between start_at and current clock, floored (>= 0)
      remaining_months = max( 0, term_months - elapsed_months )
      prorated_cents = round_half_up( premium_cents * remaining_months / term_months )
      if cancel_basis == PRORATED:
        refund_cents = prorated_cents
      else  # SHORT_RATE
        refund_cents = round_half_up( prorated_cents * SHORT_RATE_FACTOR )
    input_set: "Single Warranty: premium_cents, term_months, start_at; current clock."
    constants:
      SHORT_RATE_FACTOR: 0.90
    precision: "integer cents; round_half_up on prorated, then again on the short-rate factor"
    variants:
      - name: prorated
        when: "cancel_basis == PRORATED"
        difference: "refund = full unearned proration"
      - name: short_rate
        when: "cancel_basis == SHORT_RATE"
        difference: "refund = 90% of the prorated amount (10% penalty)"

  - name: crew_window_overlap
    trigger: "CrewAssignment create (POST /crew-assignments)"
    algorithm: interval_merge
    formula: |
      For the target crew_id, let existing = CrewAssignment rows with that crew_id
        whose status IN {BOOKED, CHECKED_IN} (CANCELLED and COMPLETED free the window).
      Half-open semantics [window_start, window_end):
        conflict(a, b) := a.window_start < b.window_end AND b.window_start < a.window_end
      A new assignment conflicts if conflict(new, e) for any e in existing.
      Back-to-back (new.window_start == e.window_end) does NOT conflict.
    input_set: "CrewAssignment rows for the same crew_id with status IN {BOOKED, CHECKED_IN}."
    constants: {}
    precision: "datetime comparison at second granularity"

  - name: permit_inspection_buffer
    trigger: "Inspection create with kind=PERMIT_FINAL (POST /inspections)"
    algorithm: interval_merge
    formula: |
      For the target job_id, let existing = Inspection rows for that job with
        kind==PERMIT_FINAL and status IN {SCHEDULED, PASSED}.
      CLOSED interval semantics [scheduled_start, scheduled_end] with a mandatory
      buffer of BUFFER_HOURS between two PERMIT_FINAL windows on the same job:
        order the two intervals by start; gap_hours = (later.start - earlier.end) in hours
        conflict := gap_hours < BUFFER_HOURS   (this also catches true overlap, where gap is negative)
      A new PERMIT_FINAL inspection conflicts if conflict(new, e) for any e in existing.
      Exactly BUFFER_HOURS apart (gap_hours == BUFFER_HOURS) is allowed (>= boundary).
    input_set: "Inspection rows for the same job_id with kind==PERMIT_FINAL and status IN {SCHEDULED, PASSED}."
    constants:
      BUFFER_HOURS: 24
    precision: "datetime difference in whole hours; boundary at exactly BUFFER_HOURS is allowed"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Referenced foreign keys in the body resolve (job_id, crew_id, estimate_id, permit_id, estimate_id on contract)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints and POST /jobs/{id}/contract"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed (missing required scalar)"
    error_id: ERR_MISSING_FIELD
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "Enum values, numeric ranges, and interval validity (window_end > window_start, scheduled_end > scheduled_start, squares>0, 0<cumulative_pct<=1, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined (state-machine from: matches)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity state preconditions hold (job in IN_PRODUCTION for draws/check-in; materials delivered & permit issued for start-production; passed assessment/finalized estimate for job advance; crew active)"
    error_id: "varies (ERR_JOB_NOT_IN_PRODUCTION, ERR_MATERIALS_NOT_DELIVERED, ERR_PERMIT_NOT_ISSUED, ERR_NO_PASSED_ASSESSMENT, ERR_NO_FINALIZED_ESTIMATE, ERR_CREW_INACTIVE, ERR_JOB_NOT_COMPLETED)"
    http_status: 409
    applies_to: "cross-entity transition endpoints"

  - priority: 9
    category: business_temporal
    check: "Temporal-overlap rules: crew half-open window collision (ERR_CREW_DOUBLE_BOOKED); permit-final inspection buffer collision (ERR_INSPECTION_BUFFER_CONFLICT)"
    error_id: "varies (ERR_CREW_DOUBLE_BOOKED, ERR_INSPECTION_BUFFER_CONFLICT)"
    http_status: 409
    applies_to: "POST /crew-assignments, POST /inspections (kind=PERMIT_FINAL)"

  - priority: 10
    category: business_fiscal
    check: "Draw cumulative_pct strictly exceeds Job.billed_pct (ERR_PCT_NOT_INCREASING); change-order apply must not drop contract below disbursed gross (ERR_CONTRACT_BELOW_DISBURSED)"
    error_id: "varies (ERR_PCT_NOT_INCREASING, ERR_CONTRACT_BELOW_DISBURSED)"
    http_status: 409
    applies_to: "POST /draws, POST /change-orders/{id}/apply"

  - priority: 11
    category: state
    check: "OCC: expected_job_version equals current Job.version on draw create and change-order apply"
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
    applies_to: "POST /draws, POST /change-orders/{id}/apply"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

