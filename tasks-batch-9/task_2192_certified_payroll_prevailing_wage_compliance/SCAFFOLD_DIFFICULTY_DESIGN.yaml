  - rule_id: resource_temporal_overlap
    instances:
      - name: determination_governing_period_half_open_on_a_locality
        resource_entity: WageDetermination
        interval_semantics: "HALF-OPEN [effective_date, expiry_date or +infinity); touching endpoints are legal, containment is not"
        grounds:
          - validations.priority_25_governing_period_occupation
          - entities.WageDetermination.fields.effective_date
          - entities.WageDetermination.fields.expiry_date
        distinguishing_aspect: |
          The contended resource is a LOCALITY's governing period and the semantics are
          strictly half-open, so a successor whose effective_date exactly equals an
          existing determination's expiry_date is accepted, while a bounded determination
          that lands strictly inside that span is rejected. The rejected candidate is
          deliberately given its own expiry_date of 2026-05-20 so that it cannot touch the
          open-ended successor's [2026-06-01, +infinity) interval; the only row it can
          collide with is the [2026-01-01, 2026-06-01) predecessor, which makes the
          half-open containment check the sole cause of the failure.
        test_recipe:
          setup:
            - "Determination A for CA-ALAMEDA declares effective_date 2026-01-01 and expiry_date 2026-06-01, carries one ELEC rate and is ACTIVE, so it governs the half-open interval [2026-01-01, 2026-06-01)."
            - "Determination B for the same locality declares effective_date exactly 2026-06-01 with no expiry, carries one ELEC rate and activates cleanly because half-open intervals that merely touch do not intersect."
            - "Determination C for the same locality is still DRAFT with effective_date 2026-05-15 and expiry_date 2026-05-20, entirely inside A's span and entirely outside B's."
          setup_api_calls:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z", expiry_date: "2026-06-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_a_id: $.data.id }
