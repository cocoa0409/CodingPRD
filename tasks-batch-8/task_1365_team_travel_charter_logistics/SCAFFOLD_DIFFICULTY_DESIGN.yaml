            - "TravelPartyMember.${m_id}.status == SCRATCHED"

  # =====================================================================
  # Rule 8: resource_temporal_overlap (>=2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: flight_leg_rest_interval_buffer
        grounds:
          - calculations.rest_floor
          - entities.FlightLeg.fields.scheduled_depart_utc
          - entities.FlightLeg.fields.scheduled_arrive_utc
        distinguishing_aspect: |
          Interval semantics: BUFFER-style — leg N+1 must respect a mandatory
          rest gap (rest_required_minutes) after leg N's arrival, treating the
          time between arrival and next departure as a buffer zone that cannot
          be occupied. Adjacent (gap == rest_required_minutes exactly) is
          allowed; gap < rest_required is rejected. Sits on FlightLeg resource.
        test_recipe:
          setup:
            - "L1 arrives 2027-02-01T20:00Z, STANDARD policy, no delay -> rest_required = 600 minutes"
            - "L2 scheduled_depart = 2027-02-02T06:00Z (exactly 600 minutes after)"
            - "Test: boundary depart allowed; one minute earlier must be rejected"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "ATL", display_name: "Atlanta", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "CHA", game_tipoff_utc: "2027-02-02T00:00:00Z", return_arrival_utc: "2027-02-03T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "ATL", destination_code: "CHA", scheduled_depart_utc: "2027-02-01T18:00:00Z", scheduled_arrive_utc: "2027-02-01T20:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 2, origin_code: "CHA", destination_code: "ORL", scheduled_depart_utc: "2027-02-02T06:00:00Z", scheduled_arrive_utc: "2027-02-02T08:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg2_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg2_id}/book"
              payload: {}
              as: TravelCoordinator
              captures: { leg2_after: $.data }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 3, origin_code: "ORL", destination_code: "MIA", scheduled_depart_utc: "2027-02-02T05:59:00Z", scheduled_arrive_utc: "2027-02-02T07:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg3_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg3_id}/book"
              payload: {}
              as: TravelCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "FlightLeg.${leg2_id}.status == BOOKED (exactly 600min gap allowed, >= boundary inclusive)"
            - "error_id == ERR_REST_FLOOR_VIOLATION for leg3 (5h59m gap < 600min required)"

      - name: hotel_block_cutoff_date_exclusion
        grounds:
          - entities.HotelBlock.fields.cutoff_date
          - validations[priority=13]
        distinguishing_aspect: |
          Interval semantics: EXCLUSION-POINT — a hotel block's cutoff_date
          defines a half-open interval [check_in_date - infinity, cutoff_date)
          during which room name changes are accepted. ON the cutoff_date
          itself the change is rejected (ERR_CUTOFF_PASSED). Different
          semantic than the buffer-style rest rule: this is a deadline
          exclusion, not a minimum-gap requirement. Sits on HotelBlock
          resource (different entity than FlightLeg).
        test_recipe:
          setup:
            - "Hotel block with cutoff_date = 2027-03-10"
            - "Clock set to 2027-03-09T23:59:59Z: room create succeeds"
            - "Clock set to 2027-03-10T00:00:00Z: room create rejected"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-09T23:59:59Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "ORL", display_name: "Orlando", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "MIA", game_tipoff_utc: "2027-03-15T00:00:00Z", return_arrival_utc: "2027-03-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "O01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HMIA", room_count: 3, rate_cents_per_night: 28000, check_in_date: "2027-03-14", night_count: 1, cutoff_date: "2027-03-10" }
              as: TravelCoordinator
              captures: { block_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/rooms"
              payload: { member_id: "${m_id}", room_label: "801" }
              as: TravelCoordinator
              captures: { room_ok: $.data }
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "O02", party_role: "COACH", travel_class: "CHARTER_STANDARD", per_diem_tier: "TIER_B" }
              as: TravelManager
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/rooms"
              payload: { member_id: "${m2_id}", room_label: "802" }
              as: TravelCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "RoomAssignment.${room_ok.id}.status == RESERVED (created just before cutoff)"
            - "error_id == ERR_CUTOFF_PASSED (half-open interval: cutoff_date itself is excluded)"

  # =====================================================================
  # Rule 9: compensating_invariant (>=2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: season_committed_cost_conservation
        grounds:
          - calculations.season_budget_remaining
          - entities.Season.fields.committed_cost_cents
          - entities.Season.fields.travel_budget_cents
        distinguishing_aspect: |
          Conserved quantity: season fiscal budget. Forward action (trip lock)
          debits season.committed_cost_cents by trip.estimated_cost_cents;
          compensating action (trip cancel) credits the exact same amount back
          (minus any actual costs already incurred). Invariant: after
          lock-then-cancel, season.committed_cost_cents returns to its
          pre-lock value, and remaining = travel_budget_cents -
          committed_cost_cents is preserved.
        test_recipe:
          setup:
            - "Season with budget B, committed_cost_cents = 0"
            - "Trip created with hotel block 20000 + charter 5000000 = estimated 5020000"
            - "Lock -> committed = 5020000"
            - "Cancel (DRAFT-cancel impossible; must be DISRUPTED-cancel) -> committed -= 5020000 - penalty"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "UTA", display_name: "Utah", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id, season_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "POR", game_tipoff_utc: "2027-02-10T00:00:00Z", return_arrival_utc: "2027-02-11T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "U01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "SLC", destination_code: "PDX", scheduled_depart_utc: "2027-02-09T18:00:00Z", scheduled_arrive_utc: "2027-02-09T20:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HPDX", room_count: 1, rate_cents_per_night: 20000, check_in_date: "2027-02-09", night_count: 1, cutoff_date: "2027-02-05" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v0}" }
              as: TravelManager
              captures: { season_at_lock: $.data }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/contingencies"
              payload: { kind: "WEATHER", detected_at: "2027-02-09T10:00:00Z", affected_leg_id: "${leg_id}", severity: "CRITICAL" }
              as: TravelManager
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/cancel"
              payload: {}
              as: TravelManager
            - call: "GET /travel/teams/${team_id}/seasons/${season_id}"
              payload: {}
              as: Any
              captures: { season_final: $.data }
          assert:
            - "Trip.${trip_id}.posture == CANCELLED"
            - "Season.${season_id}.committed_cost_cents == 0 (returned to pre-lock value)"
            - "Season.${season_id}.travel_budget_cents == 100000000 (unchanged)"
            - "Conservation: committed_cost after lock-then-cancel == committed_cost before lock"

      - name: manifest_seat_conservation_across_bump_rebook
        grounds:
          - calculations.manifest_capacity_check
          - entities.ManifestEntry.fields.status
          - entities.CharterContract.fields.seat_capacity
        distinguishing_aspect: |
          Conserved quantity: available seat capacity on a charter leg.
          Forward action (bump) frees a confirmed seat; compensating action
          (rebook + re-confirm) re-occupies it. Invariant: at any point,
          confirmed_count + bumped_count + pending_count == total_manifest_entries,
          AND confirmed_count <= seat_capacity is preserved through the
          bump/rebook cycle. Different conserved quantity than fiscal budget.
        test_recipe:
          setup:
            - "Charter leg with seat_capacity=2, both seats CONFIRMED"
            - "Bump one entry (CONFIRMED -> BUMPED)"
            - "Rebook the leg (clears is_ticketed on all, statuses preserved)"
            - "Re-confirm the bumped entry impossible (still BUMPED); add new entry, confirm succeeds"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "MEM", display_name: "Memphis", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "NOLA", game_tipoff_utc: "2027-02-15T00:00:00Z", return_arrival_utc: "2027-02-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "MM1", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m1: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "MM2", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m2: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "MM3", party_role: "COACH", travel_class: "CHARTER_STANDARD", per_diem_tier: "TIER_B" }
              as: TravelManager
              captures: { m3: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VMM", base_price_cents: 3000000, fuel_surcharge_cap_cents: 300000, seat_capacity: 2, cargo_capacity_lb: 5000, penalty_bands: [{days_before: 30, penalty_pct: 10}] }
              as: TravelManager
              captures: { contract_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/countersign"
              payload: {}
              as: VendorRep
              captures: { contract_v_pre_exec: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/execute"
              payload: { expected_contract_version: "${contract_v_pre_exec}" }
              as: TravelFinanceLead
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "MEM", destination_code: "MSY", scheduled_depart_utc: "2027-02-14T18:00:00Z", scheduled_arrive_utc: "2027-02-14T19:00:00Z", is_charter: true, contract_id: "${contract_id}" }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest"
              payload: { member_id: "${m1}", seat_assignment: "1A" }
              as: TravelCoordinator
              captures: { e1: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest"
              payload: { member_id: "${m2}", seat_assignment: "1B" }
              as: TravelCoordinator
              captures: { e2: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest/${e1}/confirm"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest/${e2}/confirm"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest/${e1}/bump"
              payload: { bump_reason: "WEIGHT_BALANCE" }
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest"
              payload: { member_id: "${m3}", seat_assignment: "1A" }
              as: TravelCoordinator
              captures: { e3: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest/${e3}/confirm"
              payload: {}
              as: TravelCoordinator
          assert:
            - "ManifestEntry.${e1}.status == BUMPED"
            - "ManifestEntry.${e2}.status == CONFIRMED"
            - "ManifestEntry.${e3}.status == CONFIRMED"
            - "Conservation: CONFIRMED count (2) <= seat_capacity (2); freed seat reoccupied exactly once"
