# =============================================================================
# Task 1941: Cycling & Triathlon Event Operations — §1.9 Scaffold Corner Design
# Breadth coverage of testable claims in §1.1–§1.7 not already covered by §1.8.
# Logical clock default (no set_current_utc call) is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: event_creation_defaults_applied
        claim_type: creation_defaults
        grounds: [entities.Event]
        distinguishing_aspect: "Minimal POST /events stamps posture=DRAFT, swim_status=PENDING_DECISION (has_swim true), water_pool_remaining == water_pool_units, ops_run_index 0, version 1, and appeal_window_minutes defaults to 60."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 800 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "GET /events/${ev}"
              as: RaceDirector
              captures: { posture: $.data.posture, swim: $.data.swim_status, rem: $.data.water_pool_remaining, win: $.data.appeal_window_minutes, ops: $.data.ops_run_index, ver: $.data.version }
          assert:
            - "posture == DRAFT; swim_status == PENDING_DECISION"
            - "water_pool_remaining == 800; ops_run_index == 0; version == 1"
            - "appeal_window_minutes == 60 (default applied)"

      - name: event_no_swim_sets_no_swim_status
        claim_type: creation_defaults
        grounds: [entities.Event, state_machines.Event.swim_status]
        distinguishing_aspect: "has_swim=false yields swim_status == NO_SWIM at creation, and start requires no swim decision."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Du B", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "GET /events/${ev}"
              as: RaceDirector
              captures: { swim: $.data.swim_status }
          assert:
            - "swim_status == NO_SWIM (never PENDING_DECISION when has_swim is false)"

      - name: event_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Event
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /events/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http status 404"

      - name: athlete_creation_sets_active_license
        claim_type: creation
        grounds: [entities.Athlete]
        distinguishing_aspect: "Athlete starts with license_status == ACTIVE and is scoped to the creating event."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { lic: $.data.license_status, evfk: $.data.event_id }
          assert:
            - "license_status == ACTIVE; event_id == ${ev}"

      - name: wave_creation_defaults_open_empty
        claim_type: creation_defaults
        grounds: [entities.Wave]
        distinguishing_aspect: "New wave starts OPEN with assigned_count 0 and actual_start_time null."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "ELITE", scheduled_start_time: "2026-10-15T07:30:00Z", capacity: 5, draft_legal: true, age_band_min: 18, age_band_max: 99 }
              as: RaceDirector
              captures: { st: $.data.status, cnt: $.data.assigned_count, ast: $.data.actual_start_time }
          assert:
            - "status == OPEN; assigned_count == 0; actual_start_time == null"

      - name: aid_station_creation_unready
        claim_type: creation_defaults
        grounds: [entities.AidStation, calculations.aid_station_readiness]
        distinguishing_aspect: "New aid station: allocated_water_units 0, confirmed_volunteer_count 0, readiness UNDERSTAFFED (staffing checked before water)."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /events/${ev}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { rd: $.data.readiness_status, al: $.data.allocated_water_units }
          assert:
            - "readiness_status == UNDERSTAFFED; allocated_water_units == 0"

      - name: registration_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.Registration
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required entry_fee_cents yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["event and athlete exist"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath: $.data.id }
          trigger:
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${ath}", division: "AGE_GROUP" }
              as: Athlete
              as_user_id: "${ath}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http 400"

      - name: wave_invalid_enum_division_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Wave
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "division must be AGE_GROUP|ELITE; any other value yields ERR_VALIDATION."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "PRO", scheduled_start_time: "2026-10-15T07:30:00Z", capacity: 5, draft_legal: true, age_band_min: 18, age_band_max: 99 }
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http 400"

      - name: road_segment_end_before_start_returns_400
        claim_type: type_constraints
        grounds:
          - entities.RoadSegment
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "closure_end <= closure_start violates datetime ordering -> ERR_VALIDATION."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /events/${ev}/road-segments"
              payload: { name: "Main", length_km: 5.0, closure_start: "2026-10-15T12:00:00Z", closure_end: "2026-10-15T06:00:00Z" }
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http 400"

      - name: registration_listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Registration]
        distinguishing_aspect: "List endpoint returns envelope with meta, response_type array, and pagination fields limit/offset/total_count/has_more with defaults 10/0."
        test_recipe:
          setup: ["event with 2 registrations"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { a1: $.data.id }
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Bob B", birth_date: "1992-05-05", license_number: "USAT-2" }
              as: RaceDirector
              captures: { a2: $.data.id }
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${a1}", division: "AGE_GROUP", entry_fee_cents: 10000 }
              as: Athlete
              as_user_id: "${a1}"
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${a2}", division: "AGE_GROUP", entry_fee_cents: 10000 }
              as: Athlete
              as_user_id: "${a2}"
          trigger:
            - call: "GET /events/${ev}/registrations"
              as: RaceDirector
          assert:
            - "response_type == 'array'; data length == 2"
            - "meta.api_request_id present; pagination total_count == 2; has_more == false; limit == 10; offset == 0"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Wave.fields.assigned_count]
        distinguishing_aspect: "Client-supplied computed field (assigned_count) in a create payload is rejected/ignored: wave starts with assigned_count 0 regardless."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "ELITE", scheduled_start_time: "2026-10-15T07:30:00Z", capacity: 5, draft_legal: true, age_band_min: 18, age_band_max: 99 }
              as: RaceDirector
              captures: { cnt: $.data.assigned_count }
          assert:
            - "assigned_count == 0 — server-computed, never client-set"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: permit_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CoursePermit]
        distinguishing_aspect: "Approving a DRAFT permit (never submitted) fails with ERR_INVALID_STATE; no status change."
        test_recipe:
          setup: ["event + segment + DRAFT permit"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/road-segments"
              payload: { name: "Main", length_km: 5.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg: $.data.id }
            - call: "POST /road-segments/${seg}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per: $.data.id }
          trigger:
            - call: "POST /permits/${per}/approve"
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; permit remains DRAFT"

      - name: terminal_state_lockdown_cancelled_event_rejects_advance
        claim_type: terminal_lockdown
        grounds: [state_machines.Event.posture]
        distinguishing_aspect: "CANCELLED is terminal: POST /events/{id}/advance on a CANCELLED event fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["PERMITTED event, then cancelled"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/road-segments"
              payload: { name: "Main", length_km: 5.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg: $.data.id }
            - call: "POST /road-segments/${seg}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per: $.data.id }
            - call: "POST /permits/${per}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/cancel"
              payload: { reason: "hurricane" }
              as: RaceDirector
          trigger:
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; posture remains CANCELLED"

      - name: withdraw_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Registration]
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw fails with ERR_INVALID_STATE and refund fields do not change."
        test_recipe:
          setup: ["PAID registration, withdrawn once (default clock 2026-08-01 -> 75 days -> 75% tier, estimate 13500 on fee 20000)"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath: $.data.id }
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${ath}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/pay"
              as: Athlete
              as_user_id: "${ath}"
            - call: "POST /registrations/${reg}/withdraw"
              payload: { refund_destination: "card-1" }
              as: Athlete
              as_user_id: "${ath}"
          trigger:
            - call: "POST /registrations/${reg}/withdraw"
              payload: { refund_destination: "card-1" }
              as: Athlete
              as_user_id: "${ath}"
              captures: { err: $.data.error_id }
            - call: "GET /registrations/${reg}"
              as: RaceDirector
              captures: { est: $.data.refund_estimate_cents }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "refund_estimate_cents still == 13500 (no recompute on rejected retry)"

      - name: wave_reopen_only_from_closed
        claim_type: invalid_transition
        grounds: [state_machines.Wave]
        distinguishing_aspect: "Reopen on an OPEN wave (not CLOSED) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["event + OPEN wave"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "ELITE", scheduled_start_time: "2026-10-15T07:30:00Z", capacity: 5, draft_legal: true, age_band_min: 18, age_band_max: 99 }
              as: RaceDirector
              captures: { w: $.data.id }
          trigger:
            - call: "POST /waves/${w}/reopen"
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; wave remains OPEN"

      - name: timing_validate_from_invalidated_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TimingRecord]
        distinguishing_aspect: "INVALIDATED is terminal for timing records: validate after invalidate fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["LIVE race, R1 RACING, one RECORDED chip read, then invalidated"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 1000 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/road-segments"
              payload: { name: "Main", length_km: 5.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg: $.data.id }
            - call: "POST /road-segments/${seg}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per: $.data.id }
            - call: "POST /permits/${per}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
            - call: "POST /events/${ev}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { asx: $.data.id }
            - call: "POST /aid-stations/${asx}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va: $.data.id }
            - call: "POST /volunteer-assignments/${va}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath: $.data.id }
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${ath}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/pay"
              as: Athlete
              as_user_id: "${ath}"
            - call: "POST /registrations/${reg}/confirm"
              as: RaceDirector
            - call: "POST /events/${ev}/safety-assessments"
              payload: { water_temp_celsius: 20.0, lightning_within_10km: false }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T10:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations/${reg}/check-in-bike"
              payload: { bib_code: "BIB-1" }
              as: Athlete
              as_user_id: "${ath}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/start"
              as: RaceDirector
            - call: "POST /registrations/${reg}/timing-records"
              payload: { discipline: "SWIM", recorded_at: "2026-10-15T08:15:00Z" }
              as: Timer
              captures: { tr: $.data.id }
            - call: "POST /timing-records/${tr}/invalidate"
              as: Timer
          trigger:
            - call: "POST /timing-records/${tr}/validate"
              as: Timer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; record remains INVALIDATED"

      - name: finish_invalidate_reverts_to_racing
        claim_type: side_effect_execution
        grounds: [state_machines.TimingRecord.VALIDATED_to_INVALIDATED, state_machines.Registration]
        distinguishing_aspect: "Invalidating the VALIDATED FINISH record reverts the registration FINISHED -> RACING and nulls provisional totals."
        test_recipe:
          setup: ["LIVE race; R1 finished with all five splits validated (provisional 5490)"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 1000 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/road-segments"
              payload: { name: "Main", length_km: 5.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg: $.data.id }
            - call: "POST /road-segments/${seg}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per: $.data.id }
            - call: "POST /permits/${per}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
            - call: "POST /events/${ev}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { asx: $.data.id }
            - call: "POST /aid-stations/${asx}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va: $.data.id }
            - call: "POST /volunteer-assignments/${va}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
