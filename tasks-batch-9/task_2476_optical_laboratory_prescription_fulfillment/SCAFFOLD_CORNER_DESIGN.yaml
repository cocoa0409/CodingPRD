          - endpoints.GET_/rx-orders/{id}/charge-summary
        excluded_because:
          difficulty_instance: dual_variant_calc / order_quote_provisional_versus_final_diverges_on_rx_order_money
          rationale: >-
            The reconciliation identity gross == benefit + patient + writeoff is asserted there after
            each variant runs, so a separate reconciliation probe would restate it.

      - name: buffered_machine_windows_merge_into_forbidden_intervals
        claim_type: interval_merge
        grounds:
          - calculations.machine_bay_occupation_feasibility
        excluded_because:
          difficulty_instance: resource_temporal_overlap / generator_buffer_rejects_a_ten_minute_gap_and_accepts_the_exact_fifteen_minute_boundary
          rationale: >-
            The buffered-interval arithmetic is pinned there at both the rejecting gap and the exact
            accepting boundary, which is the only interesting content of the merge.

      - name: responsibility_share_weights_four_metrics_equally
        claim_type: weighted_scoring
        grounds:
          - calculations.remake_responsibility_split
        excluded_because:
          difficulty_instance: dual_variant_calc / remake_responsibility_process_audit_versus_tolerance_delta_on_remake_case
          rationale: >-
            The four-metric weighted average is computed there under TOLERANCE_DELTA and contrasted
            with the PROCESS_AUDIT verdict on the same case, including the resulting chargeback cents.

