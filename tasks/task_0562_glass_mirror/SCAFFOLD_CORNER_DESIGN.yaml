      - name: state_vs_fiscal_priority_conflict
        claim_type: Priority conflict
        grounds: ["validations[priority=5]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / accept_state_beats_credit_fiscal"
          rationale: "State-over-fiscal ordering is asserted by the named §1.8 instance."

