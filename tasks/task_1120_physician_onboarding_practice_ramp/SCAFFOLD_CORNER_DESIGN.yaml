            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 2, start_minute: 480, end_minute: 1080, block_type: "ADMIN" }, as: PracticeManager, captures: { t2: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${t2}/activate", payload: {}, as: PracticeManager }
          trigger:
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: PracticeManager, captures: { mins: "$.data.weekly_active_minutes", prac: "$.data.practice_status" } }
          assert:
            - "weekly_active_minutes == 480 (the 600-minute ADMIN block is excluded from the input set)"
            - "practice_status == BUILDING (480 < 1200 despite 1080 total ACTIVE minutes across all block types)"

      - name: milestone_attainment_equality_boundary
        claim_type: correct_result
        grounds: ["calculations.milestone_attainment", "entities.RampMilestone.fields.attained"]
        distinguishing_aspect: "The attainment threshold is inclusive: actual_wrvu == target_wrvu (100 == 100) attains; one wRVU short (149 vs 150) does not."
        test_recipe:
          setup: ["Executed offer pipeline; guarantee ACTIVE at clock 2027-06-05; months 1 and 2 REPORTED with actual 100 (target 100) and 149 (target 150)"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Sue", specialty: "FAMILY_MEDICINE", email: "sue@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=1", payload: {}, as: PracticeManager, captures: { ms1: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/report", payload: { actual_wrvu: 100, collections_cents: 500000 }, as: PracticeManager }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=2", payload: {}, as: PracticeManager, captures: { ms2: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms2}/report", payload: { actual_wrvu: 149, collections_cents: 500000 }, as: PracticeManager }
          trigger:
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst, captures: { a1: "$.data.attained" } }
            - { call: "POST /onboarding/ramp-milestones/${ms2}/attest", payload: {}, as: FinanceAnalyst, captures: { a2: "$.data.attained" } }
          assert:
