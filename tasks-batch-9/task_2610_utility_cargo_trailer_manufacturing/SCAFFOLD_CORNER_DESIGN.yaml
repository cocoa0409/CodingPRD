      - name: calc_selector_takes_the_oldest_stocked_unit_not_the_first_created
        claim_type: Input Set Filtering
        grounds:
          - calculations.allocation_unit_selector
          - entities.TrailerUnit.fields.released_to_stock_at
        distinguishing_aspect: |
          The ranking key is released_to_stock_at, which is NOT correlated with created_at, serial_number
          or id here: SN-000101 is created first, labeled first and sorts first lexicographically, but it is
          held out of stock by a PENDING option install and only reaches RELEASED_TO_STOCK on 2026-08-07,
          one day AFTER SN-000102. An implementation that ranked by any of the creation keys would allocate
          the wrong trailer, and the invoice would differ because SN-000101 carries an option.
