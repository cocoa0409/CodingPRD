            - { call: "POST /registry/bicycles", payload: { serial_number: "MCH200", manufacturer: "Trek", model: "Escape", primary_color: "Red", declared_value_cents: 55000, photo_url: "https://x/2.jpg" }, as: Owner, as_user_id: "${o2_id}", captures: { b2_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b2_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o2_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/theft-reports/${r2_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "MCH100", primary_color: "Red", found_at: "2026-05-12T00:00:00Z", found_location: "Lot", appraised_value_cents: 40000, manufacturer: "Trek" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}" }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}&theft_report_id=${r1_id}", as: Registrar, captures: { m1_id: "$.data[0].id" } }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}&theft_report_id=${r2_id}", as: Registrar, captures: { m2_id: "$.data[0].id" } }
            - { call: "POST /registry/claims", payload: { recovery_intake_id: "${i1_id}", match_id: "${m1_id}", proof_text: "receipt o1" }, as: Owner, as_user_id: "${o1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /registry/claims", payload: { recovery_intake_id: "${i1_id}", match_id: "${m2_id}", proof_text: "receipt o2" }, as: Owner, as_user_id: "${o2_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /registry/claims/${c1_id}/approve", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/claims/${c2_id}/approve", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RECOVERY_NOT_ACTIONABLE (observed ${err}) — intake already CLAIM_PENDING; first approved claim wins"

