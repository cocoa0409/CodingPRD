              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9002", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq2_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
