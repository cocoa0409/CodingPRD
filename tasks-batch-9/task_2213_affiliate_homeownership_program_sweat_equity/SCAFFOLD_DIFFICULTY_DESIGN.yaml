      - name: willingness_review_set_two_then_one_then_empty_collection_edge
        metric: "cardinality of the effective (non-RETRACTED) WILLINGNESS SelectionReview set per household: 2 -> 1 -> 0, where 0 is the empty-collection edge that yields null rather than 0 or a division error"
        endpoint: "POST /homeownership/selection-reviews/{id}/retract"
        grounds:
          - calculations.committee_quorum_and_willingness
          - calculations.household_selection_scoring
          - entities.ApplicantHousehold.fields.willingness_score
          - entities.ApplicantHousehold.fields.composite_selection_score
          - entities.SelectionReview.fields.status
          - validations[priority=15]
          - errors.ERR_COMMITTEE_QUORUM_NOT_MET
        distinguishing_aspect: |
          A different metric on a different endpoint from the money-threshold
          instance above: this boundary is the cardinality of a collection, not
          a numeric crossing, and it is reached through
          POST /homeownership/selection-reviews/{id}/retract rather than the
          approve endpoint. committee_quorum_and_willingness averages the
          effective WILLINGNESS reviews, so with two reviews (90 and 70) the
          score is round((90 + 70) / 2, 2) = 80.0; after one retraction the set
          has exactly one member and the mean is round(90 / 1, 2) = 90.0 - the
          just-inside probe that proves the divisor tracks the surviving rows;
          after the second retraction the set is EMPTY and willingness_score
          must become null (never 0, never a divide-by-zero), which is the
          just-outside probe. The empty set also drops the distinct-reviewer
          count for WILLINGNESS from 2 to 0 below committee_quorum 2, so the
          same recipe pins the downstream consequence: selection-decision
          fails priority 15 with ERR_COMMITTEE_QUORUM_NOT_MET and the household
          stays in COMMITTEE_REVIEW.
          Both probes live in this one recipe because the retract endpoint can
          be called twice against different rows.
        test_recipe:
          setup:
            - "One AffiliateProgram with committee_quorum 2, status ACTIVE, program_posture OPEN."
            - "One ApplicantHousehold in COMMITTEE_REVIEW with documentation_status VERIFIED, need_score 100 and ability_to_pay_score 100 on the PRELIMINARY basis."
            - "Six SUBMITTED SelectionReview rows: NEED 80 from each of committee-alice and committee-bruno, ABILITY 80 from each, and WILLINGNESS 90 from committee-alice plus WILLINGNESS 70 from committee-bruno, so willingness_score is 80.0 before the trigger."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Docs verified" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 90, recommendation: "ADVANCE", documented_reason: "Attended every orientation" }, as: SelectionCommitteeMember, as_user_id: "committee-alice", captures: { rev_w_alice: $.data.id } }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 70, recommendation: "ADVANCE", documented_reason: "Two rescheduled meetings" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno", captures: { rev_w_bruno: $.data.id } }
            - { call: "GET /homeownership/households/${hh_id}", as: ProgramAdmin, as_user_id: "admin-1", captures: { w_two: $.data.willingness_score, need_two: $.data.need_score, composite_two: $.data.composite_selection_score } }
          trigger:
            - { call: "POST /homeownership/selection-reviews/${rev_w_bruno}/retract", payload: { retraction_reason: "Score keyed against the wrong household" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "GET /homeownership/households/${hh_id}", as: ProgramAdmin, as_user_id: "admin-1", captures: { w_one: $.data.willingness_score } }
            - { call: "POST /homeownership/selection-reviews/${rev_w_alice}/retract", payload: { retraction_reason: "Committee reopened the willingness interview" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "GET /homeownership/households/${hh_id}", as: ProgramAdmin, as_user_id: "admin-1", captures: { w_zero: $.data.willingness_score } }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Attempted vote with no surviving willingness review" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "${need_two} == 100"
            - "${composite_two} == null"
            - "${w_two} == 80.0"
            - "${w_one} == 90.0"
            - "${w_zero} == null"
            - "SelectionReview.${rev_w_bruno}.status == RETRACTED"
            - "SelectionReview.${rev_w_alice}.status == RETRACTED"
            - "ApplicantHousehold.${hh_id}.willingness_score == null"
            - "ApplicantHousehold.${hh_id}.composite_selection_score == null"
            - "trigger step 5 response HTTP status == 409"
            - "trigger step 5 response data.error_id == ERR_COMMITTEE_QUORUM_NOT_MET"
            - "ApplicantHousehold.${hh_id}.selection_status == COMMITTEE_REVIEW"
            - "ApplicantHousehold.${hh_id}.score_basis == PRELIMINARY"

