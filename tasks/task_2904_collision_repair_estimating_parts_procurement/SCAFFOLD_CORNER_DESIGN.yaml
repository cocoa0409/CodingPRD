        distinguishing_aspect: >-
          Only the declared successor is accepted. From ESTIMATE_LOCKED the single legal to_stage is
          PARTS_STAGED, so REPAIR - which is a legal target one hop later - is ERR_STAGE_SEQUENCE_INVALID
