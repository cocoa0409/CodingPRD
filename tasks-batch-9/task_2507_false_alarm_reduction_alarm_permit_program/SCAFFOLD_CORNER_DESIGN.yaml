          - validations.priority_55_business_fiscal_ERR_PERMIT_RENEWAL_BLOCKED
          - endpoints.POST_/false-alarm-program/alarm-systems/{systemId}/approve-registration
        distinguishing_aspect: "PRIORITY PAIR B, winner. Schedule FS-2026-A is created but never activated, so no ACTIVE row governs the fee about to be assessed and issuance is refused with 409 ERR_NO_ACTIVE_FEE_SCHEDULE. The pair's joint fixture cannot be built after the fact — activation supersedes the prior ACTIVE row and always leaves exactly one ACTIVE schedule behind — so the partner row (priority 55) is exercised on its own in the next instance."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; FS-2026-A exists in status DRAFT only, the premises has two ECV contacts and system 1 is SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
          trigger:
            - call: "POST /false-alarm-program/alarm-systems/${system1_id}/approve-registration"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err_no_sched: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_ACTIVE_FEE_SCHEDULE"
            - "FeeSchedule.${sched_id}.status is still DRAFT and GET /false-alarm-program/fee-schedules?status=ACTIVE returns total_count 0"
            - "AlarmSystem.${system1_id}.status is still SUBMITTED, no AlarmPermit exists and AlarmSite.${site_id}.governing_fee_schedule_id is still null"
            - "no PERMIT_ISSUE_FEE invoice was raised, so the site's outstanding_balance_cents is still 0"

      - name: permit_renewal_at_a_delinquent_site_is_blocked
        claim_type: Violation -> Error
