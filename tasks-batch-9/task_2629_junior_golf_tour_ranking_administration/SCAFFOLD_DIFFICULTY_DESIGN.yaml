# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2629 - Junior Golf Tour & Ranking Administration
# -----------------------------------------------------------------------------
# Every instance grounds only in elements declared by SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert below was computed with Decimal / ROUND_HALF_UP against the
# formulas and constants in §1.3 before being written down.
# Shared fixture vocabulary used throughout:
#   season      2026 Junior Tour, age_cutoff_date 2026-08-31, assistance_budget_cents 500000
#   member m1   Ava Stone,  born 2010-05-04 -> age 16 -> U17, handicap 3.2, publication_opt_in true
#   member m2   Ben Cole,   born 2010-06-15 -> age 16 -> U17, handicap 5.1
#   member m3   Cara Diaz,  born 2010-03-02 -> age 16 -> U17, handicap 6.4
#   course      course_rating 71.4, slope_rating 128  ->  differential factor 113/128
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: ranking_provisional_live_diverges_from_certified_run
        grounds:
          - calculations.member_ranking_points
          - entities.Member.fields.provisional_ranking_points
          - entities.Member.fields.certified_ranking_points
          - entities.Member.fields.certified_rank_position
          - entities.Season.fields.ranking_epoch
          - state_machines.Tournament.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Both variants read the identical single-event pool, yet provisional_live divides by
          max(1, counted) = 1 and certified_run divides by max(counted, RANKING_MIN_EVENTS) = 4,
          so the same 405.00-point win reads 405.00 provisionally and 101.25 certified - a 4x
          divergence written to two different fields on the same Member row by two different calls.
        test_recipe:
          setup:
            - "One season with a 2026-08-31 age cutoff and a 500000-cent assistance pool."
            - "Two VERIFIED U17 members, m1 (handicap 3.2) and m2 (handicap 5.1)."
            - "One REGIONAL 2-round tournament, field_size_limit 2, entry_fee_cents 25000, course_rating 71.4, slope_rating 128, driven all the way to COMPLETED."
            - "m1 shoots 66 then 72 (total 138, finish_position 1, event_points 405.00); m2 shoots 74 then 76 (total 150, finish_position 2, event_points 285.00)."
            - "Neither member has any certified ranking figure yet: no ranking run has executed, so Season.ranking_epoch is 0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries", payload: { member_id: "${m2_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m2_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t1_id}/set-field", payload: {}, as: TourAdmin }
            - { call: "POST /entries/${e1_id}/pay", payload: { amount_cents: 25000 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /entries/${e2_id}/pay", payload: { amount_cents: 25000 }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-10T12:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/start", payload: {}, as: TourAdmin }
            - { call: "POST /rounds", payload: { entry_id: "${e1_id}", round_number: 1, tee_time: "2026-09-10T13:00:00Z", marker_member_id: "${m2_id}" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { r11_id: $.data.id } }
            - { call: "POST /rounds", payload: { entry_id: "${e2_id}", round_number: 1, tee_time: "2026-09-10T13:00:00Z", marker_member_id: "${m1_id}" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { r21_id: $.data.id } }
            - { call: "POST /rounds", payload: { entry_id: "${e1_id}", round_number: 2, tee_time: "2026-09-11T13:00:00Z", marker_member_id: "${m2_id}" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { r12_id: $.data.id } }
            - { call: "POST /rounds", payload: { entry_id: "${e2_id}", round_number: 2, tee_time: "2026-09-11T13:00:00Z", marker_member_id: "${m1_id}" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { r22_id: $.data.id } }
            - { call: "POST /rounds/${r11_id}/submit-score", payload: { gross_strokes: 66 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /rounds/${r11_id}/peer-verify", payload: { decision: "VERIFY" }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /rounds/${r11_id}/certify", payload: {}, as: RulesOfficial, as_user_id: "official-anna" }
            - { call: "POST /rounds/${r12_id}/submit-score", payload: { gross_strokes: 72 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /rounds/${r12_id}/peer-verify", payload: { decision: "VERIFY" }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /rounds/${r12_id}/certify", payload: {}, as: RulesOfficial, as_user_id: "official-anna" }
            - { call: "POST /rounds/${r21_id}/submit-score", payload: { gross_strokes: 74 }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /rounds/${r21_id}/peer-verify", payload: { decision: "VERIFY" }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /rounds/${r21_id}/certify", payload: {}, as: RulesOfficial, as_user_id: "official-anna" }
            - { call: "POST /rounds/${r22_id}/submit-score", payload: { gross_strokes: 76 }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /rounds/${r22_id}/peer-verify", payload: { decision: "VERIFY" }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /rounds/${r22_id}/certify", payload: {}, as: RulesOfficial, as_user_id: "official-anna" }
          trigger:
            - { call: "POST /seasons/${season_id}/ranking-runs", payload: { as_of_date: "2026-09-11" }, as: TourAdmin, captures: { epoch_after: $.data.ranking_epoch, ranked_n: $.data.ranked_member_count } }
          assert:
            - "Member.${m1_id}.provisional_ranking_points == 405.00"
            - "Member.${m1_id}.provisional_counted_events == 1"
            - "Member.${m1_id}.certified_ranking_points == 101.25"
            - "Member.${m1_id}.certified_counted_events == 1"
            - "Member.${m1_id}.certified_rank_position == 1"
            - "Member.${m2_id}.provisional_ranking_points == 285.00"
            - "Member.${m2_id}.certified_ranking_points == 71.25"
            - "Member.${m2_id}.certified_rank_position == 2"
            - "Member.${m1_id}.provisional_ranking_points != Member.${m1_id}.certified_ranking_points"
            - "${epoch_after} == 1"
            - "${ranked_n} == 2"
            - "Season.${season_id}.last_ranking_as_of_date == 2026-09-11"

      - name: assistance_estimate_diverges_from_event_settlement
        grounds:
          - calculations.assistance_award_amount
          - entities.AidApplication.fields.estimated_award_cents
          - entities.AidApplication.fields.covered_pct
          - entities.Entry.fields.aid_award_cents
          - state_machines.AidApplication.SUBMITTED_to_APPROVED
          - state_machines.Entry.UNPAID_to_AID_PARTIAL
        distinguishing_aspect: |
          A different entity domain from the ranking instance: this pair diverges on MONEY, not on
          points. The sliding_scale_estimate variant multiplies covered_pct 0.90 by the association
          constant AID_STANDARD_FEE_CENTS (25000) and writes 22500 onto the AidApplication, while
          the event_settlement variant multiplies the same 0.90 by the tournament's actual
          entry_fee_cents (32000) and writes 28800 onto the Entry and onto the Season ledger.
        test_recipe:
          setup:
            - "One season with a 500000-cent assistance pool, available 500000 / committed 0 / disbursed 0."
            - "m1 VERIFIED and U17."
            - "m1 holds an APPROVED AidApplication built from household_income_cents 6000000 over 3 dependents, i.e. income_per_dependent_cents 2000000, which lands in the 0.90 tier."
            - "One REGIONAL tournament in ENTRY_OPEN whose entry_fee_cents is 32000 - deliberately NOT the 25000 standard fee."
            - "The clock sits at 2026-08-10T00:00:00Z, well outside the 72-hour late-entry window that opens at 2026-08-29T00:00:00Z, so no surcharge can confound the comparison."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin, captures: { m1_v: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 6000000, dependents: 3, expected_member_version: "${m1_v}" }, as: Member, as_user_id: "${m1_id}", captures: { app_id: $.data.id } }
            - { call: "POST /aid-applications/${app_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { est_award: $.data.estimated_award_cents, pct: $.data.covered_pct } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Pinehurst Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 32000, round_count: 2, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}", aid_application_id: "${app_id}", request_assistance: true }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id, settled_award: $.data.aid_award_cents } }
          assert:
            - "${pct} == 0.90"
            - "AidApplication.${app_id}.income_per_dependent_cents == 2000000"
            - "${est_award} == 22500"
            - "${settled_award} == 28800"
            - "Entry.${e1_id}.gross_fee_cents == 32000"
            - "Entry.${e1_id}.late_entry_surcharge_cents == 0"
            - "Entry.${e1_id}.net_fee_due_cents == 3200"
            - "Entry.${e1_id}.fee_status == AID_PARTIAL"
            - "AidApplication.${app_id}.estimated_award_cents != Entry.${e1_id}.aid_award_cents"
            - "AidApplication.${app_id}.consumed_cents == 28800"
            - "Season.${season_id}.assistance_available_cents == 471200"
            - "Season.${season_id}.assistance_committed_cents == 28800"
            - "Season.${season_id}.assistance_disbursed_cents == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: event_points_four_factor_non_linear_interaction
        grounds:
          - calculations.entry_event_points
          - calculations.entry_finish_position
          - calculations.tournament_field_quality_factor
          - entities.Entry.fields.event_points
          - entities.Tournament.fields.field_quality_factor
          - state_machines.Tournament.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          MODE (a) - four independent inputs combine non-linearly in one closed form: a tier-keyed
          base (NATIONAL = 600), a multiplicative field_quality_factor, a floored linear finish
          decay (round_half_up(max(0.20, 1.00 - 0.05*(pos-1)), 2)) and an additive floored
          differential bonus. The runner-up's 650.00 is NOT the winner's 725.00 scaled by 0.95
          (that would be 688.75), because the bonus term is additive and differential-driven, not
          position-driven.
        test_recipe:
          setup:
            - "One season, two VERIFIED U17 members m1 and m2, both with WHS_CLUB handicaps (a NATIONAL tier refuses SELF_ATTESTED)."
            - "One NATIONAL single-round tournament, field_size_limit 2, entry_fee_cents 25000, course_rating 71.4, slope_rating 128, driven to COMPLETED with a 2-player field so field_quality_factor is exactly 1.00 (top_n 0, field_n 2 below the depth floor of 12)."
            - "m1 shoots 68 -> differential -3.0 -> finish_position 1; m2 shoots 70 -> differential -1.2 -> finish_position 2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "US Junior National", division: "U17", tier: "NATIONAL", start_date: "2026-09-20", end_date: "2026-09-20", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-15T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 1, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t2_id: $.data.id } }
            - { call: "POST /tournaments/${t2_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t2_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries", payload: { member_id: "${m2_id}", tournament_id: "${t2_id}" }, as: Member, as_user_id: "${m2_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t2_id}/close-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t2_id}/set-field", payload: {}, as: TourAdmin, captures: { fq: $.data.field_quality_factor } }
            - { call: "POST /entries/${e1_id}/pay", payload: { amount_cents: 25000 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /entries/${e2_id}/pay", payload: { amount_cents: 25000 }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-20T12:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t2_id}/start", payload: {}, as: TourAdmin }
            - { call: "POST /rounds", payload: { entry_id: "${e1_id}", round_number: 1, tee_time: "2026-09-20T13:00:00Z", marker_member_id: "${m2_id}" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { r1_id: $.data.id } }
            - { call: "POST /rounds", payload: { entry_id: "${e2_id}", round_number: 1, tee_time: "2026-09-20T13:00:00Z", marker_member_id: "${m1_id}" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { r2_id: $.data.id } }
            - { call: "POST /rounds/${r1_id}/submit-score", payload: { gross_strokes: 68 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /rounds/${r1_id}/peer-verify", payload: { decision: "VERIFY" }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /rounds/${r1_id}/certify", payload: {}, as: RulesOfficial, as_user_id: "official-anna" }
            - { call: "POST /rounds/${r2_id}/submit-score", payload: { gross_strokes: 70 }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /rounds/${r2_id}/peer-verify", payload: { decision: "VERIFY" }, as: Member, as_user_id: "${m1_id}" }
          trigger:
            - { call: "POST /rounds/${r2_id}/certify", payload: {}, as: RulesOfficial, as_user_id: "official-anna" }
          assert:
            - "${fq} == 1.00"
            - "Tournament.${t2_id}.status == COMPLETED"
            - "Round.${r1_id}.scoring_differential == -3.0"
            - "Round.${r2_id}.scoring_differential == -1.2"
            - "Entry.${e1_id}.finish_position == 1"
            - "Entry.${e2_id}.finish_position == 2"
            - "Entry.${e1_id}.event_points == 725.00"
            - "Entry.${e2_id}.event_points == 650.00"
            - "Entry.${e2_id}.event_points != 688.75"
            - "Tournament.${t2_id}.winner_entry_id == ${e1_id}"
            - "Member.${m1_id}.provisional_ranking_points == 725.00"
            - "Member.${m2_id}.provisional_ranking_points == 650.00"

      - name: scoring_differential_rounding_order_is_pinned
        grounds:
          - calculations.round_scoring_differential
          - entities.Round.fields.scoring_differential
          - entities.Entry.fields.avg_scoring_differential
          - state_machines.Round.PEER_VERIFIED_to_CERTIFIED
        distinguishing_aspect: |
          MODE (b) - the SAME two gross scores yield two different answers depending on the order
          of the two rounding steps. Rounding each round to 1dp first and then averaging gives
          (-4.8 + 0.5)/2 = -2.15 -> -2.2; averaging the raw quotients first gives
          (-4.7671875 + 0.5296875)/2 = -2.11875 -> -2.1. The scaffold pins -2.2, so an
          implementation that averages before rounding fails this assertion by exactly 0.1.
        test_recipe:
          setup:
            - "One season, two VERIFIED U17 members m1 and m2; m2 exists only to serve as the peer marker."
            - "One REGIONAL 2-round tournament, course_rating 71.4, slope_rating 128, field_size_limit 2, both entries ACCEPTED and PAID, tournament IN_PROGRESS."
            - "m1's two rounds are scheduled; round 1 was already submitted, peer-verified and CERTIFIED at gross 66 (differential -4.8); round 2 is PEER_VERIFIED at gross 72 and awaits certification."
            - "m2 never submits a card, so the tournament cannot reach COMPLETED and event_points stays null - the assertion isolates the differential arithmetic."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
