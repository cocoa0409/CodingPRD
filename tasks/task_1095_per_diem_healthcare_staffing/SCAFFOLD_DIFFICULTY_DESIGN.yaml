            - "Clinician.${cl_id}.status == ACTIVE"
            - "${err} == ERR_CREDENTIAL_MISSING with HTTP 422"
            - "${err} != ERR_CREDENTIAL_EXPIRED"
            - "Shift.${sh_id}.claim_count == 0"
            - "GET /staffing/claims?clinician_id=${cl_id} returns 0 items"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: clinician_half_open_adjacency_passes_overlap_but_fails_rest_buffer
        grounds:
          - validations[priority=86]
          - validations[priority=87]
          - errors[ERR_SHIFT_OVERLAP]
          - errors[ERR_REST_PERIOD_VIOLATION]
          - entities.Assignment.fields.work_status
        distinguishing_aspect: |
          Resource entity = CLINICIAN, interval semantics = pairwise HALF-OPEN intersection plus
          an 8-hour rest BUFFER. Back-to-back shifts (prev_end == next_start) do NOT intersect
          under [start, end), so ERR_SHIFT_OVERLAP does not fire; the buffer leg does, giving
          ERR_REST_PERIOD_VIOLATION for a zero-hour gap.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Rockford (unit_capacity 2) requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Omar Diallo with a VERIFIED RN_LICENSE."
            - "Shift S1 2026-06-08T07:00Z..19:00Z is ASSIGNED and CONFIRMED to Omar."
            - "Shift S2 2026-06-08T19:00Z..23:00Z is OPEN and starts at exactly the instant S1 ends."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Rockford", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Omar Diallo", email: "omar.diallo@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-1616", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh1: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T19:00:00Z", scheduled_end: "2026-06-08T23:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh2: $.data.id }
            - call: "POST /staffing/shifts/${sh1}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm1: $.data.id }
            - call: "GET /staffing/shifts/${sh1}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { v1: $.data.version }
            - call: "POST /staffing/shifts/${sh1}/award"
              payload: { expected_shift_version: "${v1}", claim_id: "${clm1}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg1: $.data.id }
            - call: "POST /staffing/assignments/${asg1}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /staffing/shifts/${sh2}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_REST_PERIOD_VIOLATION with HTTP 422"
            - "${err} != ERR_SHIFT_OVERLAP"
            - "Shift.${sh2}.claim_count == 0 and Shift.${sh2}.status == OPEN"
            - "Shift.${sh1}.status == ASSIGNED"
            - "the rest gap between S1.scheduled_end and S2.scheduled_start is 0.00 hours, below MIN_REST_HOURS_BETWEEN_SHIFTS = 8.0"

      - name: facility_unit_closed_interval_aggregate_capacity_rejects_touching_shift
        grounds:
          - validations[priority=88]
          - errors[ERR_UNIT_CAPACITY_EXCEEDED]
          - entities.Facility.fields.unit_capacity
          - entities.Shift.fields.status
        distinguishing_aspect: |
          Resource entity = FACILITY UNIT and interval semantics = AGGREGATE capacity counted
          over CLOSED intervals. The very same 19:00 adjacency that is NOT an overlap for a
          clinician IS an intersection here (touching endpoints count), so with unit_capacity 1
          the second shift is refused at creation time on a different endpoint.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Facility Stonegate with unit_capacity 1, requiring RN_LICENSE; RN rate card 7500."
            - "StaffingOrder headcount 2, window 2026-06-08..2026-06-15, already holding Shift S1 2026-06-08T07:00Z..19:00Z in status OPEN."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
