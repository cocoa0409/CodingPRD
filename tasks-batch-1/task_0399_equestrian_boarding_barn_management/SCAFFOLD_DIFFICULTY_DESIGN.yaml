  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_finalize
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_INVOICE_NOT_OPEN]
          - errors[ERR_NO_BILLABLE_LINES]
        distinguishing_aspect: |
          A request that is both already-non-OPEN (state, prio 7) AND has zero billable lines
          (business_constraint, prio 17) returns ERR_INVOICE_NOT_OPEN — state outranks the
          business_constraint check, exercising the state vs business_constraint pair.
        test_recipe:
          setup:
            - "An invoice already VOIDed (no billable lines), then a second FINALIZED transition is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Ida Rider", email: "ida@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", period_label: "2026-06" }
              as: BarnManager
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/transition"
              payload: { target_status: "VOID" }
              as: BarnManager
            - call: "GET /owners/${own_id}"
              payload: {}
              as: BarnManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/transition"
              payload: { target_status: "FINALIZED", expected_owner_version: "${ov}" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVOICE_NOT_OPEN"

      - name: safety_beats_referential_on_show_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=4]
          - errors[ERR_WAIVER_NOT_ACTIVE]
          - errors[ERR_ENTRY_NOT_FOUND]
        distinguishing_aspect: |
          Confirming a show entry that EXISTS (so existence passes) for an owner with NO active
          waiver returns the business_safety error ERR_WAIVER_NOT_ACTIVE, exercising the
          business_safety vs existence pair distinct from the state/business_constraint pair above.
        test_recipe:
          setup:
            - "Owner has NO signed waiver; horse exists; a SUBMITTED show entry exists; confirm is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Jo Rider", email: "jo@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Koda" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /show-entries"
              payload: { horse_id: "${horse_id}", event_name: "Spring Show", event_date: "2026-07-01T00:00:00.000Z", entry_fee_cents: 5000 }
              as: BarnManager
              captures: { se_id: $.data.id }
          trigger:
            - call: "POST /show-entries/${se_id}/transition"
              payload: { target_status: "CONFIRMED" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WAIVER_NOT_ACTIVE"

