              payload: {}
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and err_id == ERR_SAME_MARKET_REFERRAL"
            - "ReferralAgreement.${ref_id}.status remains PROPOSED"

      - name: withdraw_fulfilled_referral_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_AGREEMENT_LOCKED
        excluded_because:
          difficulty_instance: transitive_cascade / close_cascade_receipt_to_split_to_referral_fulfillment
          rationale: "The FULFILLED terminal state that locks the agreement is produced by the named §1.8 cascade instance; this corner only re-asserts the lock, so it is excluded to avoid a duplicated long setup chain."

      - name: replacement_of_non_active_agreement_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REPLACED_NOT_ACTIVE
        distinguishing_aspect: "Accepting a replacement agreement whose replaces_agreement_id points at a merely PROPOSED (not ACTIVE) agreement is rejected 409 ERR_REPLACED_NOT_ACTIVE."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Denver + Phoenix offices; ACTIVE Alice; one PROPOSED agreement R1 (never accepted)."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_office2
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - call: "POST /referral-agreements"
              payload: { referring_office_id: "${office2_id}", receiving_office_id: "${office_id}", agent_id: "${alice_id}", referral_fee_bps: 2000 }
              as: ManagingBroker
              captures: { ref1_id: $.data.id }
            - call: "POST /referral-agreements"
              payload: { referring_office_id: "${office2_id}", receiving_office_id: "${office_id}", agent_id: "${alice_id}", referral_fee_bps: 2500, replaces_agreement_id: "${ref1_id}" }
              as: ManagingBroker
              captures: { ref2_id: $.data.id }
          trigger:
            - call: "POST /referral-agreements/${ref2_id}/accept"
              payload: {}
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_REPLACED_NOT_ACTIVE"
            - "ReferralAgreement.${ref1_id}.status remains PROPOSED and ${ref2_id} remains PROPOSED"

      - name: cda_review_by_wrong_rung_role_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REVIEW_RUNG_MISMATCH
        excluded_because:
          difficulty_instance: non_linear_state_machine / cda_review_ladder_reject_cycles_to_rung_zero
          rationale: "ERR_REVIEW_RUNG_MISMATCH is asserted inside the named §1.8 instance (rung-1 review after a REJECT reset)."

      - name: negotiation_exhausted_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NEGOTIATION_EXHAUSTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / offer_negotiation_cycle_round_cap
          rationale: "Asserted in the named §1.8 instance."

      - name: offer_expired_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OFFER_EXPIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / offer_ttl_72h_exact_boundary_expires
          rationale: "Asserted in the named §1.8 instance."

      - name: stale_version_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
        excluded_because:
          difficulty_instance: endpoints / fee_assignment_create_with_stale_agent_version_returns_412
          rationale: "Asserted in the named endpoints corner instance (a §1.9 sibling, cited by name)."

      - name: assignment_overlap_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ASSIGNMENT_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fee_assignment_window_overlap_rejected_but_adjacency_allowed
          rationale: "Asserted in the named §1.8 instance."

      - name: schedule_window_violation_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SCHEDULE_WINDOW_VIOLATION
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fee_schedule_window_must_tile_without_overlap
          rationale: "Asserted in the named §1.8 instance."

      - name: cda_not_approved_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CDA_NOT_APPROVED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / request_close_gated_by_cda_approval
          rationale: "Asserted in the named §1.8 instance."

      - name: office_not_empty_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OFFICE_NOT_EMPTY
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / office_close_gated_by_active_agent_count
          rationale: "Asserted in the named §1.8 instance."

      - name: overpayment_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVERPAYMENT
        excluded_because:
          difficulty_instance: compensating_invariant / advance_and_return_preserve_unearned_balance
          rationale: "Asserted via the return-advance overflow rejection in the named §1.8 instance."

      - name: no_retention_baseline_error
        claim_type: violation_to_error
        grounds:
