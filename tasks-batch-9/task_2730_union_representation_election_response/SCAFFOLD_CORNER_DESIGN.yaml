              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/supervisors"
              payload: {"petition_id": "${pet_id}", "full_name": "Nils Brandt", "job_title": "Shift Supervisor", "span_of_control": 18, "has_hire_fire_authority": true}
              as: SupervisorTrainer
              captures: {"sup_id": "$.data.id"}
          trigger:
            - call: "POST /labor-relations/supervisors/${sup_id}/train"
              payload: {"modules_completed": ["TIPS_BOUNDARIES", "PROHIBITED_CONDUCT", "SOLICITATION_RULES"], "quiz_score": 79}
              as: SupervisorTrainer
            - call: "POST /labor-relations/supervisors/${sup_id}/train"
              payload: {"modules_completed": ["TIPS_BOUNDARIES", "PROHIBITED_CONDUCT"], "quiz_score": 95}
              as: SupervisorTrainer
            - call: "POST /labor-relations/supervisors/${sup_id}/train"
              payload: {"modules_completed": ["TIPS_BOUNDARIES", "PROHIBITED_CONDUCT", "SOLICITATION_RULES"], "quiz_score": 80}
              as: SupervisorTrainer
          assert:
            - "after call 1: HTTP 200, training_status == 'UNTRAINED', training_attempt_count == 1, quiz_score == 79, certified_at is null"
            - "after call 2: training_status == 'UNTRAINED', training_attempt_count == 2, quiz_score == 95, certified_at is null (a missing required module fails a passing score)"
            - "after call 3: training_status == 'TRAINED', training_attempt_count == 3, quiz_score == 80, certified_at == '2026-08-03T09:00:00Z'"
            - "Supervisor.${sup_id}.violation_count == 0 throughout (the loop is a training loop, not a violation loop)"

      - name: closing_the_last_scheduled_session_bubbles_the_round_to_polls_closed
        claim_type: Bubble up
        grounds:
          - state_machines.ElectionRound.transitions.POLLS_OPEN_to_POLLS_CLOSED
