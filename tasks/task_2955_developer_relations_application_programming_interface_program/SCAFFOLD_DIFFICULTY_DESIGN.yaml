      - name: upheld_violation_cascades_restriction_suspension_pool_and_delisting
        grounds:
          - state_machines.Developer.standing.UNDER_REVIEW_to_RESTRICTED
          - state_machines.QuotaAssignment.ACTIVE_to_SUSPENDED
          - state_machines.SandboxLease.ACTIVE_to_REVOKED
          - state_machines.Developer.directory_state.LISTED_to_DELISTED
          - calculations.violation_penalty_points
          - endpoints.POST /violation-cases/{id}/adjudicate
        distinguishing_aspect: |
          Depth-4 fan-out from one adjudication: adjudicate(UPHELD) -> violation_points 60 crosses
          RESTRICTION_THRESHOLD -> standing RESTRICTED -> (a) the ACTIVE entitlement becomes
          SUSPENDED and returns BOTH pool reservations, (b) the ACTIVE sandbox lease becomes REVOKED
          with closed_reason STANDING_CASCADE, (c) directory_state LISTED becomes DELISTED. Each
          branch is a different entity and the pool figures must reconcile exactly, so a partial
          implementation of the cascade is detectable from three independent reads.
