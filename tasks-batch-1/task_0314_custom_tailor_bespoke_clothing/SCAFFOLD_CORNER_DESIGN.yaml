              as: Customer
              as_user_id: "${c_id}"
              captures: { mp_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool CAU", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f_id: $.data.id }
            - call: "POST /orders"
