    input: ["race_id?", "entry_id?", "recorded_by_member_id?", "recall_type?", "limit?", "offset?"]
    output: RecallEvent[]
    side_effects: []

  # --- JuryPanel ------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/jury-panels"
    description: "Forms a jury panel under a chair who must hold a REGIONAL, NATIONAL or INTERNATIONAL certification. The chair is seated as the first seats element with seat_role CHAIR."
    roles: [RegattaChair]
    code: 201
    input: [regatta_id, chair_member_id]
    output: JuryPanel
    side_effects:
      - "status starts at FORMING with the chair seated, so seated_member_count is 1"
  - method: POST
    path: "/regatta-ops/jury-panels/{id}/seats"
    description: "Seats an additional judge on the panel, bubbling the panel up to SEATED once quorum is reached."
    roles: [RegattaChair]
    code: 200
    input: [member_id]
    output: JuryPanel
    side_effects:
      - "appends a seats element with seat_role MEMBER and recused false, and increments seated_member_count"
      - "JuryPanel.status FORMING -> SEATED once seated_member_count reaches Regatta.jury_quorum_required"
      - "increments JuryPanel.version by 1"
  - method: POST
    path: "/regatta-ops/jury-panels/{id}/recuse"
    description: "Recuses a seated judge and runs the three-hop cascade seat -> panel -> scheduled protests."
    roles: [JuryChair]
    code: 200
    input: [member_id]
    output: JuryPanel
    side_effects:
      - "hop 1: marks that seats element recused true and decrements seated_member_count"
      - "hop 2: JuryPanel.status SEATED -> FORMING when the refreshed count falls under Regatta.jury_quorum_required"
      - "hop 3: every Protest bound to this panel with status HEARING_SCHEDULED reverts to FILED with jury_panel_id null and hearing_utc null"
      - "increments JuryPanel.version by 1"
  - method: GET
    path: "/regatta-ops/jury-panels/{id}"
    description: "Reads one panel with its seat list and non-recused seat count."
    roles: [ClubAdmin, RegattaChair, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: JuryPanel
    side_effects: []
  - method: GET
    path: "/regatta-ops/jury-panels"
    description: "Lists panels, filterable by regatta, chair or status."
    roles: [ClubAdmin, RegattaChair, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["regatta_id?", "chair_member_id?", "status?", "limit?", "offset?"]
    output: JuryPanel[]
    side_effects: []

  # --- Protest --------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/protests"
    description: "Lodges a protest against another entry in a race whose results have opened. filed_utc is stamped from the logical clock and regatta_id is copied from the race."
    roles: [Competitor, RaceOfficer]
    code: 201
    input: [race_id, protestor_entry_id, protestee_entry_id, rule_cited, incident_utc]
    output: Protest
    side_effects:
      - "status starts at FILED with an empty evidence_log, evidence_count 0 and reopen_count 0"
      - "regatta_id is copied from Race.regatta_id and filed_utc from the logical clock"
      - "keeps the Regatta from bubbling up to SCORED while the protest is open"
  - method: POST
    path: "/regatta-ops/protests/{id}/evidence"
    description: "Files one piece of evidence on the protest record."
    roles: [Competitor, JuryChair]
    code: 200
    input: [kind, summary, submitted_by_entry_id]
    output: Protest
    side_effects:
      - "appends to evidence_log with recorded_utc from the logical clock and increments evidence_count by 1"
      - "increments Protest.version by 1"
  - method: POST
    path: "/regatta-ops/protests/{id}/schedule-hearing"
    description: "Binds a seated, conflict-free panel to the protest and sets the hearing time. Also the re-entry edge after a reopen."
    roles: [JuryChair]
    code: 200
    input: [jury_panel_id, hearing_utc]
    output: Protest
    side_effects:
      - "Protest.status FILED -> HEARING_SCHEDULED, or REOPENED -> HEARING_SCHEDULED"
      - "stores jury_panel_id and hearing_utc"
      - "increments Protest.version by 1"
  - method: POST
    path: "/regatta-ops/protests/{id}/hear"
    description: "Holds the hearing once the hearing time has arrived and at least one piece of evidence is on file."
    roles: [JuryChair]
    code: 200
    input: []
    output: Protest
    side_effects:
      - "Protest.status HEARING_SCHEDULED -> HEARD"
      - "increments Protest.version by 1"
  - method: POST
    path: "/regatta-ops/protests/{id}/decide"
    description: "Records the jury decision and runs the four-hop decision cascade down to the series standings."
    roles: [JuryChair]
    code: 200
    input: [decision, "penalty_target_entry_id?", "redress_race_number?"]
    output: Protest
    side_effects:
      - "hop 1: Protest.status HEARD -> DECIDED with decision, penalty_target_entry_id and, for REDRESS_GRANTED, redress_race_number"
      - "hop 2: rewrites the target RaceResult - DSQ with discardable false for PENALTY_DSQ, penalty_percent 20 for PENALTY_SCORING_20, an RDG score from calculations.redress_points_average for REDRESS_GRANTED, nothing for DISMISSED"
      - "hop 3: re-runs calculations.race_points_and_places for the affected race and increments Race.rescore_count by 1"
      - "hop 4: re-runs calculations.series_standing for every ACCEPTED entry of the affected division, which can change discarded_race_numbers and series_rank"
      - "may bubble the Regatta up RACING -> SCORED once no protest of the regatta is open"
      - "increments Protest.version by 1"
  - method: POST
    path: "/regatta-ops/protests/{id}/reopen"
    description: "Reopens a decided protest once only, reversing every side effect of the decision cascade."
    roles: [JuryChair]
    code: 200
    input: []
    output: Protest
    side_effects:
      - "hop 1: Protest.status DECIDED -> REOPENED, reopen_count becomes 1, decision returns to NONE and hearing_utc is cleared"
      - "hop 2: the rewritten RaceResult is restored to its pre-decision finish_status with discardable true and penalty_percent 0"
      - "hop 3: re-runs calculations.race_points_and_places then calculations.series_standing, restoring every series_points_gross to its pre-decision value with no drift"
      - "increments Protest.version by 1"
  - method: POST
    path: "/regatta-ops/protests/{id}/invalidate"
    description: "Rules a protest invalid on a procedural ground, which is terminal."
    roles: [JuryChair]
    code: 200
    input: [reason_code]
    output: Protest
    side_effects:
      - "Protest.status -> INVALID with invalid_reason_code stored"
      - "may bubble the Regatta up RACING -> SCORED once no protest of the regatta is open"
      - "increments Protest.version by 1"
  - method: GET
    path: "/regatta-ops/protests/{id}"
    description: "Reads one protest with its evidence log, bound panel, decision and reopen counter."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/regatta-ops/protests"
    description: "Lists protests, filterable by regatta, race, either party, bound panel, penalty target or status. Reverse-reachability channel for protests a recusal cascade pushed back to FILED."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["regatta_id?", "race_id?", "protestor_entry_id?", "protestee_entry_id?", "jury_panel_id?", "penalty_target_entry_id?", "status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # -- authentication and authorisation --
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNKNOWN_ACTOR
    http: 403
    condition: "X-User-ID of an entity_backed role does not resolve to an existing ClubMember"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint being called"
  - id: ERR_MEASURER_NOT_LICENSED
    http: 403
    condition: "a Measurer whose ClubMember.measurer_license_id is null attempts any certificate operation"
  - id: ERR_NOT_ACTING_PARTY
    http: 403
    condition: "a Competitor acts on a boat or entry it does not own or helm, or a JuryChair acts on a protest whose bound panel it does not chair"

  # -- request shape --
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required input, unknown field, undeclared enum member or numeric field outside its declared range"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or negative offset on a collection read"

  # -- existence --
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path id or a body foreign key does not resolve; path ids are checked left to right, then body foreign keys in endpoint input order"

  # -- optimistic concurrency --
  - id: ERR_STALE_BOAT_VERSION
    http: 412
    condition: "expected_boat_version on POST /rating-certificates does not equal the current Boat.version"
  - id: ERR_STALE_REGATTA_VERSION
    http: 412
    condition: "expected_regatta_version on POST /race-documents does not equal the current Regatta.version"

  # -- state --
  - id: ERR_INVALID_STATE
    http: 409
    condition: "no transition exists from the row's current state on the dimension the endpoint advances"
  - id: ERR_REGATTA_PHASE_INVALID
    http: 409
    condition: "the regatta is not in the lifecycle phase the operation requires: entries and divisions need NOR_PUBLISHED or SI_PUBLISHED, racing operations need RACING"
  - id: ERR_ENTRIES_CLOSED
    http: 409
    condition: "an entry is submitted after the regatta reached RACING or SCORED"
  - id: ERR_ENTRY_WITHDRAWN
    http: 409
    condition: "a protest, an evidence filing, a result or a recall names a WITHDRAWN entry"
  - id: ERR_RACE_START_BLOCKED
    http: 409
    condition: "a start sequence is requested while Race.start_blocked_reason is DIVISION_UNDER_MINIMUM"
  - id: ERR_SAILING_INSTRUCTIONS_NOT_EFFECTIVE
    http: 409
    condition: "a start sequence is requested before the newest published SI revision of the regatta reaches its effective_utc"

  # -- safety and segregation of duties --
  - id: ERR_CREW_SAFETY_COURSE_EXPIRED
    http: 422
    condition: "a crew member has a null safety_course_expiry_utc, or one earlier than Regatta.series_start_utc"
  - id: ERR_EQUIPMENT_INSPECTION_NOT_PASSED
    http: 422
    condition: "an entry is accepted while its inspection_status is NOT_INSPECTED or FAILED"
  - id: ERR_STAFFING_INCOMPLETE
    http: 422
    condition: "calculations.race_staffing_readiness reports a required position not covered across the whole coverage window, including the case of no confirmed assignments at all"
  - id: ERR_JURY_CONFLICT_OF_INTEREST
    http: 409
    condition: "a seated non-recused judge is a helm, crew member or confirmed PRO of the same regatta, or the panel chair measured the certificate pinned by a party to the protest"

  # -- referential integrity --
  - id: ERR_MARK_BOAT_ASSIGNMENT_INVALID
    http: 422
    condition: "mark_boat_id missing for a MARK_BOAT_DRIVER or SAFETY_BOAT duty, present for any other position, or naming a mark boat chartered for a different regatta"
  - id: ERR_CROSS_REGATTA_REFERENCE
    http: 409
    condition: "two referenced rows resolve to different regattas, or a certificate does not belong to the boat named by the entry"
  - id: ERR_AMENDMENT_TARGET_INVALID
    http: 409
    condition: "amends_document_id names a superseded document, a different doc_type, a document of another regatta, or is omitted when a published document of that type already exists"

  # -- rating, division and entry business rules --
  - id: ERR_MEASUREMENT_OUT_OF_RANGE
    http: 422
    condition: "a measurement input is outside its declared range, or valid_until is not strictly after valid_from"
  - id: ERR_CERTIFICATE_NOT_ISSUED
    http: 409
    condition: "the certificate pinned by the entry is DRAFT, SUSPENDED or SUPERSEDED at assignment or acceptance time"
  - id: ERR_CERTIFICATE_EXPIRED
    http: 422
    condition: "Regatta.series_start_utc falls outside the inclusive validity window of the pinned certificate"
  - id: ERR_CREW_MANIFEST_INCOMPLETE
    http: 422
    condition: "registered_crew_count differs from declared_crew_count, or no manifest element with position HELM matches Entry.helm_member_id"
  - id: ERR_DIVISION_BAND_MISMATCH
    http: 422
    condition: "at acceptance time the pinned band_key_spm is outside [rating_band_low, rating_band_high) of the assigned division, or the hull type no longer matches its boat_type_filter"
  - id: ERR_NO_ELIGIBLE_DIVISION
    http: 422
    condition: "no division of the regatta accepts the entry's band key and hull type"
  - id: ERR_FLEET_MINIMUM_NOT_MET
    http: 409
    condition: "a division is confirmed with fewer than max(min_entries, Regatta.fleet_minimum) assigned entries"
  - id: ERR_NO_MERGE_TARGET
    http: 409
    condition: "no other PROVISIONAL or CONFIRMED division of the regatta shares the merging division's hull-type scope"
  - id: ERR_DUPLICATE_RECORD
    http: 409
    condition: "violation of a uniqueness rule: sail_number, email, division code per regatta, race_number per regatta, call_sign per regatta, one result per race and entry, one seat per member per panel, one manifest element per member per entry"

  # -- temporal and resource overlap --
  - id: ERR_START_LINE_WINDOW_CONFLICT
    http: 409
    condition: "the new race prestart window overlaps the prestart window of another non-abandoned race of the regatta, or leaves less than the 3-minute gap between consecutive windows"
  - id: ERR_MEMBER_DUTY_OVERLAP
    http: 409
    condition: "a volunteer's half-open duty window overlaps another non-released window of the same member"
  - id: ERR_MARK_BOAT_OVERBOOKED
    http: 409
    condition: "the mark boat already carries concurrent_assignment_limit non-released assignments whose buffer-widened windows intersect the requested window"
  - id: ERR_PROTEST_WINDOW_NOT_OPEN
    http: 409
    condition: "a protest is filed for a race whose results_closed_utc is still null"
  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 422
    condition: "a protest is filed after results_closed_utc plus Regatta.protest_time_limit_minutes"
  - id: ERR_START_TIME_INVALID
    http: 422
    condition: "actual_start_utc precedes the opening of the prestart window"
  - id: ERR_HEARING_TIME_INVALID
    http: 422
    condition: "hearing_utc is not strictly later than the logical clock"
  - id: ERR_HEARING_NOT_DUE
    http: 409
    condition: "a hearing is held before hearing_utc"
  - id: ERR_AMENDMENT_NOT_LATER
    http: 422
    condition: "an amendment's effective_utc is not strictly later than the amended document's effective_utc"

  # -- protest and jury business rules --
  - id: ERR_PROTEST_PARTIES_INVALID
    http: 422
    condition: "protestor and protestee are the same entry, or incident_utc falls outside the race's sailing interval"
  - id: ERR_JURY_QUORUM_NOT_MET
    http: 409
    condition: "the panel carries fewer non-recused seats than Regatta.jury_quorum_required, or its chair does not hold a REGIONAL, NATIONAL or INTERNATIONAL certification"
  - id: ERR_EVIDENCE_REQUIRED
    http: 409
    condition: "a hearing is held on a protest with an empty evidence log"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "a protest already reopened once is reopened again"
  - id: ERR_DECISION_PAYLOAD_INVALID
    http: 422
    condition: "penalty_target_entry_id missing or naming a non-party, or redress_race_number present without REDRESS_GRANTED, absent with it, or naming a race that is not FINAL and non-abandoned"
  - id: ERR_REDRESS_NOT_COMPUTABLE
    http: 422
    condition: "redress is granted for an entry with no other non-voided, non-discarded result in the series"

  # -- results and recalls --
  - id: ERR_RESULT_PAYLOAD_INVALID
    http: 422
    condition: "elapsed_seconds present for a non-FINISHED result, absent for a FINISHED one, or finish_status is one of the derived-only values OCS, DSQ or RDG"
  - id: ERR_ENTRY_NOT_ACCEPTED
    http: 409
    condition: "a result or recall names an entry whose registration_status is not ACCEPTED"
  - id: ERR_RECALL_PAYLOAD_INVALID
    http: 422
    condition: "entry_id missing for an INDIVIDUAL recall, present for a GENERAL one, or signal_utc earlier than the opening of the prestart window"
  - id: ERR_DIVISION_NOT_CONFIRMED
    http: 409
    condition: "a race is scored while some division of the regatta with at least one accepted entry is still PROVISIONAL"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix — segregation of duties: the measurer of a boat's
#     certificate, the officer running the start and the jury seated to judge
#     it are distinct capacities, and the rules that enforce it are
#     ERR_JURY_CONFLICT_OF_INTEREST and ERR_NOT_ACTING_PARTY.
# ---------------------------------------------------------------------------
roles:
  - name: ClubAdmin
    description: "Club office operator: maintains the member roster and their credentials, and drives the logical clock in test environments. Holds no racing authority."
    identity: opaque
    exclusive_operations:
      - "POST /club-members"
      - "PATCH /club-members/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /boats (with Competitor)"
      - "POST /regattas (with RegattaChair)"
      - "every GET read endpoint"
  - name: RegattaChair
    description: "Chair of the organising authority: publishes the notice of race and sailing instructions, shapes divisions, admits entries and staffs the race committee."
    identity: "entity_backed:ClubMember"
    exclusive_operations:
      - "POST /regattas/{id}/open-racing"
      - "POST /race-documents"
      - "POST /divisions"
      - "POST /divisions/{id}/confirm"
      - "POST /divisions/{id}/merge"
      - "POST /entries/{id}/assign-division"
      - "POST /entries/{id}/accept"
      - "POST /jury-panels"
      - "POST /jury-panels/{id}/seats"
      - "POST /mark-boats"
      - "POST /duty-assignments"
      - "POST /duty-assignments/{id}/confirm"
      - "POST /duty-assignments/{id}/release"
    shared_operations:
      - "POST /regattas (with ClubAdmin)"
      - "POST /races (with RaceOfficer)"
      - "POST /entries, POST /entries/{id}/crew, POST /entries/{id}/withdraw (with Competitor)"
      - "every GET read endpoint"
  - name: Measurer
    description: "Licensed measurer: files measurement data, issues certificates, and suspends or reinstates them on measurement irregularities."
    identity: "entity_backed:ClubMember"
    exclusive_operations:
      - "POST /rating-certificates"
      - "POST /rating-certificates/{id}/issue"
      - "POST /rating-certificates/{id}/suspend"
      - "POST /rating-certificates/{id}/reinstate"
    shared_operations:
      - "every GET read endpoint except /races/{id}/staffing, /duty-assignments and /entries/{id}/series-standing"
  - name: RaceOfficer
    description: "Principal race officer and race committee: inspects equipment, runs the start sequence and recalls, starts, abandons and scores races, and records results."
    identity: "entity_backed:ClubMember"
    exclusive_operations:
      - "POST /entries/{id}/inspect"
      - "POST /races/{id}/start-sequence"
      - "POST /races/{id}/recall"
      - "POST /races/{id}/start"
      - "POST /races/{id}/abandon"
      - "POST /races/{id}/score"
      - "POST /race-results"
    shared_operations:
      - "POST /races (with RegattaChair)"
      - "POST /protests (with Competitor)"
      - "every GET read endpoint"
  - name: JuryChair
    description: "Chair of the protest committee: schedules and holds hearings, decides protests, grants redress, reopens a decision once and rules protests invalid. Must chair the panel bound to the protest."
    identity: "entity_backed:ClubMember"
    exclusive_operations:
      - "POST /protests/{id}/schedule-hearing"
      - "POST /protests/{id}/hear"
      - "POST /protests/{id}/decide"
      - "POST /protests/{id}/reopen"
      - "POST /protests/{id}/invalidate"
      - "POST /jury-panels/{id}/recuse"
    shared_operations:
      - "POST /protests/{id}/evidence (with Competitor)"
      - "every GET read endpoint"
  - name: Competitor
    description: "Boat owner or helm: registers boats, submits entries, manages the crew manifest, withdraws, files protests and submits evidence. Acts only on the boats it owns and the entries it helms."
    identity: "entity_backed:ClubMember"
    exclusive_operations:
      - "DELETE /entries/{id}/crew/{member_id}"
    shared_operations:
      - "POST /boats (with ClubAdmin)"
      - "POST /entries, POST /entries/{id}/crew, POST /entries/{id}/withdraw (with RegattaChair)"
      - "POST /protests (with RaceOfficer)"
      - "POST /protests/{id}/evidence (with JuryChair)"
      - "every GET read endpoint except /races/{id}/staffing and /duty-assignments"
