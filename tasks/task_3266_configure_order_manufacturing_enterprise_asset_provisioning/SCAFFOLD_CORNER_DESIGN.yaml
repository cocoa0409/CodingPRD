            - { call: "POST /api/orders/${cc4_o}/lines", payload: { configuration_id: "${cc4_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${cc4_a}", captures: { cc4_ol: $.data.id } }
            - { call: "POST /api/orders/${cc4_o}/submit", payload: { expected_configuration_version: "${cc4_cv}" }, as: CustomerUser, as_user_id: "${cc4_a}" }
