        grounds:
          - state_machines.Carrier.AUTHORIZED_to_RESTRICTED
          - state_machines.PolicyPurchaseRequest.DILIGENCE_CLEARED_to_CAPACITY_RESERVED
          - validations[priority=15]
          - errors[ERR_CARRIER_RESTRICTED]
          - calculations.valuation_net_yield
        distinguishing_aspect: |
          Entity pair PolicyPurchaseRequest <- Carrier: a request that is itself in the correct
          DILIGENCE_CLEARED state, whose premium breaches neither the single-carrier limit
          (projection lands on exactly 1500 bps against a limit of 1500, and the gate is strictly
          greater) nor the aggregate limit (headroom_usd 100000000.00), is still refused because a
          DIFFERENT entity — the owning Carrier — sits in RESTRICTED, reached only through a
          cash-value driven concentration re-evaluation on a sibling policy.
