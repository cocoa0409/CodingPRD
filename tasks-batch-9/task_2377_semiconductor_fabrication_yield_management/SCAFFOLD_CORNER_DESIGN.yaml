        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with a single step seq 10 LITHO 7.0h, so total_standard_hours is 7.0."
            - "PLAN-A DRAFT with planned_wafer_starts 50 and capacity_budget_hours 100.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 7.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { tsh: $.data.total_standard_hours }
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 50, capacity_budget_hours: 100.0, cycle_time_target_days: 30.0 }
