            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 2000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 7 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /compounds"
              payload: { order_id: "${order_id}", pump_id: "${pump_id}", delivery_at: "2026-06-10T09:00:00Z", retrieval_at: "2026-06-17T09:00:00Z" }
              as: Pharmacist
