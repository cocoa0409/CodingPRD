  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: warranty_lapsed_beats_invalid_state_on_review
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WARRANTY_LAPSED]
        distinguishing_aspect: "On review of a claim that is BOTH already terminal (WITHDRAWN -> state violation, priority 8) AND on a VOID-warranty unit (priority 10), the lower-priority state check (8) fires first: ERR_INVALID_STATE wins over ERR_WARRANTY_LAPSED. Category pair = state vs business_safety."
        test_recipe:
          setup:
            - "A unit whose warranty is VOID (overdue MANDATORY recall) and a warranty claim already WITHDRAWN."
          setup_api_calls:
            - call: "POST /customers"
