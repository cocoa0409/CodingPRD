        grounds:
          - state_machines.CuttingTest.SUBMITTED_to_APPROVED
          - state_machines.CuttingTest.APPROVED_to_SUPERSEDED
          - state_machines.PrimalPurchase.CUT_TESTED_to_RECEIVED
          - state_machines.PrimalPurchase.RECEIVED_to_CUT_TESTED
          - state_machines.RetailItem.PRICED_to_REPRICE_REQUIRED
          - calculations.subprimal_cost_allocation
          - calculations.retail_price_per_lb
          - entities.CasePlanLine.fields.price_stale
          - entities.CasePlan.fields.price_stale_line_count
        distinguishing_aspect: |
          Trigger is a cutting-test APPROVE and the chain is four hops deep along the COST
          axis: allocation (hop 1) -> PrimalPurchase ledger and status (hop 2) -> RetailItem
          cost basis, final price and PRICED -> REPRICE_REQUIRED (hop 3) -> CasePlanLine
          .price_stale plus CasePlan.price_stale_line_count (hop 4); the sibling cascade is
