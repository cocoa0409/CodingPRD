- section: consistency_model
  instances:
  - name: same_request_visibility_of_exposure_and_reservations
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - entities.CommercialAccount.fields.credit_exposure_cents
    - entities.InventoryItem.fields.reserved_units
    distinguishing_aspect: Every derived figure a mutation touches is visible in the mutating response itself, with no reconciliation pass required.
    test_recipe:
      setup:
      - Logical clock set; satellite stocks p_q; account A with one confirmed order.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Imm Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-Q
          description: Part Q
          line_code: IGN
          list_price_cents: 1000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_q: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_q}
          on_hand_units: 10
        as: PartsCategoryManager
        captures:
          inv: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Imm Garage
          tax_id: TX-C024
          billing_address: 1 Imm St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_q}
            quantity: 2
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
          acct_v1: $.data.version
      trigger:
      - call: POST /commercial/part-orders/${ord}/confirm
        payload:
          expected_order_version: ${ord_v}
          expected_account_version: ${acct_v1}
        as: CommercialSalesRep
        captures:
          conf_exposure: $.data.parts_subtotal_cents
      - call: GET /commercial/inventory-items/${inv}
        payload: {}
        as: CommercialSalesRep
      - call: POST /commercial/part-orders/${ord}/void
        payload: {}
        as: CommercialSalesRep
      assert:
      - the confirm response itself already reports the recomputed parts_subtotal_cents, with no second read needed
      - GET /commercial/inventory-items/${inv} immediately after returns reserved_units == 2 and available_units == 8
      - CommercialAccount.${acct}.credit_exposure_cents read straight afterwards equals the value the confirm returned
      - 'the same visibility holds for the void path: the void response reports exposure 0 and the inventory read shows reserved_units 0 in the same round trip'
