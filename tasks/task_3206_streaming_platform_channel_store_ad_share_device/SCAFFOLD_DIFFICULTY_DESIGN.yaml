            - call: "POST /publishers"
              payload: { legal_name: "Ovl Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Ovl Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k1: $.data.id }
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k2: $.data.id }
            - call: "POST /campaigns/${k1}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k1}/start"
              payload: {}
              as: AdOps
            - call: "POST /campaigns/${k2}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k2}/start"
              payload: {}
              as: AdOps
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k1}", slot_code: "HOME_ROW_4", window_start: "2026-09-12T10:00:00Z", window_end: "2026-09-12T12:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k2}", slot_code: "HOME_ROW_4", window_start: "2026-09-12T11:00:00Z", window_end: "2026-09-12T13:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /placement-bookings/${b1}/release"
              payload: {}
              as: AdOps
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k2}", slot_code: "HOME_ROW_4", window_start: "2026-09-12T11:00:00Z", window_end: "2026-09-12T13:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { b2: $.data.id }
          assert:
            - "err_overlap == ERR_SLOT_OVERLAP while ${b1} is HELD"
