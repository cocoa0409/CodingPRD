# =============================================================================
# Task 0844 — Weigh-Station & Commercial-Vehicle Enforcement (CVE)
# Difficulty band: Expert
# =============================================================================

scenario: |
  844. Weigh-Station & Commercial-Vehicle Enforcement: WIM/scale screening & bypass,
  inspection (Level I–III) & out-of-service, credential (IRP/IFTA/UCR) verification,
  overweight/oversize referral, citation & fine, HAZMAT & logbook (HOS) check,
  PRISM/carrier score, reporting

domain_name: weigh-station-cve
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: hybrid
  # A shallow ownership tree (Carrier→Driver, Station→Bay) plus a flat
  # enforcement pipeline (Screening→Inspection→Violation/Citation) whose members
  # carry cross-aggregate foreign keys (Screening references Carrier + Driver +
  # Station; Citation references Inspection + Carrier).

  state_machine_shape: branching
  # Inspection is branching+cyclic (fork to CLEARED/OOS_ISSUED, cycle through
  # REINSPECTION); Citation is branching (contest fork-join); Carrier and Driver
  # are cyclic (review/reset loops). No pure-linear pipeline drives the design.

  relationship_patterns:
    - one_to_many        # Carrier→Driver, Station→Bay, Inspection→Violation, Carrier→Citation
    - cross_aggregate    # Screening→Carrier/Driver/Station, Citation→Inspection/Carrier

  role_model: segregation_of_duties
  # Peer operational roles (Screener, Inspector, EnforcementOfficer, ComplianceAdmin)
  # plus an entity-backed CarrierRep. The officer who ISSUES a citation may not be
  # the one who ADJUDICATES its contest (SoD on X-User-ID).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: usdot_number, type: string, source: input, description: "US DOT number; unique across carriers", constraints: "unique; non-empty" }
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the motor carrier" }
      - { name: irp_status, type: enum, source: input, description: "IRP apportioned-registration status", constraints: "ACTIVE | EXPIRED | REVOKED" }
      - { name: ifta_status, type: enum, source: input, description: "IFTA fuel-tax license status", constraints: "ACTIVE | EXPIRED | REVOKED" }
      - { name: ucr_status, type: enum, source: input, description: "UCR registration status", constraints: "ACTIVE | EXPIRED | REVOKED" }
      - { name: oos_points, type: integer, source: computed, default: 0, description: "Accumulated out-of-service severity points (sum of OOS violation weights on OOS_ISSUED inspections, net of reinspection reversals)" }
      - { name: unpaid_fines_cents, type: integer, source: computed, default: 0, description: "Running balance of assessed-but-unsettled citation fines in cents" }
      - { name: iss_score, type: integer, source: computed, default: 0, description: "Provisional PRISM/ISS inspection-selection score 0-100 (includes non-terminal inspections)" }
      - { name: certified_iss_score, type: integer, source: computed, default: 0, description: "ISS score of this carrier's latest CERTIFIED ScoreSnapshot; 0 if none" }
      - { name: prism_flagged, type: boolean, source: computed, default: false, description: "True once carrier entered UNDER_REVIEW at least once via iss threshold" }
      - { name: registration_hold, type: boolean, source: computed, default: false, description: "True when unpaid_fines_cents crossed FINE_HOLD_THRESHOLD_CENTS" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | OOS_ORDERED", constraints: "ACTIVE | UNDER_REVIEW | OOS_ORDERED" }

  - name: Driver
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; employing carrier (taken from URL path)" }
      - { name: cdl_number, type: string, source: input, description: "Commercial driver license number" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: hos_status, type: enum, source: computed, default: "COMPLIANT", description: "Hours-of-Service status derived from duty logs", constraints: "COMPLIANT | VIOLATION" }
      - { name: driving_minutes_window, type: integer, source: computed, default: 0, description: "Cumulative DRIVING minutes since the last qualifying 10h reset" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OOS", constraints: "ACTIVE | OOS" }

  - name: WeighStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: gross_weight_limit_lbs, type: integer, source: input, default: 80000, description: "Legal gross vehicle weight limit in pounds" }
      - { name: single_axle_limit_lbs, type: integer, source: input, default: 20000, description: "Legal single-axle weight limit in pounds" }
      - { name: iss_bypass_threshold, type: integer, source: input, default: 50, description: "Carriers whose certified_iss_score is >= this value are denied WIM bypass", constraints: "0..100" }

  - name: InspectionBay
    parent: WeighStation
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> WeighStation.id; owning station (taken from URL path)" }
      - { name: label, type: string, source: input, description: "Bay label, e.g. 'Bay 1'" }
      - { name: reserved_minutes, type: integer, source: computed, default: 0, description: "Sum of scheduled-window minutes of inspections currently occupying this bay (IN_PROGRESS or REINSPECTION)" }
      - { name: status, type: enum, source: input, default: "AVAILABLE", description: "Operational status", constraints: "AVAILABLE | OUT_OF_ORDER" }

  - name: Screening
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> WeighStation.id; station performing the WIM/scale screening" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier of the screened vehicle" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; driver of the screened vehicle" }
      - { name: vehicle_plate, type: string, source: input, description: "License plate of the screened vehicle" }
      - { name: axle_count, type: integer, source: input, description: "Number of axles", constraints: ">= 2" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Weigh-in-motion gross weight in pounds" }
      - { name: heaviest_axle_lbs, type: integer, source: input, description: "Heaviest single-axle weight in pounds" }
      - { name: hazmat_placarded, type: boolean, source: input, description: "Vehicle displays HAZMAT placards" }
      - { name: oversize, type: boolean, source: input, default: false, description: "Vehicle flagged oversize/over-dimension" }
      - { name: overweight, type: boolean, source: computed, description: "True when gross_weight_lbs > station gross limit OR heaviest_axle_lbs > station single-axle limit" }
      - { name: credentials_valid, type: boolean, source: computed, description: "True when carrier irp_status AND ifta_status AND ucr_status are all ACTIVE at screening time" }
      - { name: decision, type: enum, source: computed, description: "BYPASS | PULL_IN — WIM sort outcome", constraints: "BYPASS | PULL_IN" }
      - { name: referral_reason, type: enum, source: computed, description: "Reason for pull-in, or NONE when bypassed", constraints: "NONE | PRISM_TARGET | OVERWEIGHT | OVERSIZE | CREDENTIAL | HAZMAT" }
      - { name: status, type: enum, source: system, description: "SCREENED | CLEARED | REFERRED | INSPECTED", constraints: "SCREENED | CLEARED | REFERRED | INSPECTED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: screening_id, type: string, source: input, description: "FK -> Screening.id; the pulled-in screening being inspected" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; copied from the screening" }
      - { name: bay_id, type: string, source: input, description: "FK -> InspectionBay.id; bay the inspection occupies" }
      - { name: level, type: enum, source: input, description: "CVSA inspection level", constraints: "LEVEL_I | LEVEL_II | LEVEL_III" }
      - { name: scheduled_start, type: datetime, source: input, description: "Bay occupancy window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Bay occupancy window end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: result, type: enum, source: computed, description: "Finalization outcome, or NONE while open", constraints: "NONE | CLEAR | OOS" }
      - { name: oos_flag, type: boolean, source: computed, default: false, description: "True once finalized with result=OOS" }
      - { name: reinspection_count, type: integer, source: computed, default: 0, description: "Number of times this inspection re-entered REINSPECTION" }
      - { name: oos_points_applied, type: integer, source: computed, default: 0, description: "OOS severity points this inspection currently contributes to its carrier (for compensation on reinspection clear)" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | CLEARED | OOS_ISSUED | REINSPECTION | CANCELLED", constraints: "IN_PROGRESS | CLEARED | OOS_ISSUED | REINSPECTION | CANCELLED" }

  - name: Violation
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; parent inspection (taken from URL path)" }
      - { name: code, type: string, source: input, description: "FMCSA violation code, e.g. '393.75' " }
      - { name: category, type: enum, source: input, description: "Defect category", constraints: "VEHICLE | DRIVER | HAZMAT | HOS | CREDENTIAL | WEIGHT" }
      - { name: severity_weight, type: integer, source: input, description: "Severity points 1..10", constraints: "1..10" }
      - { name: oos, type: boolean, source: input, description: "Whether this defect is out-of-service" }
      - { name: description, type: string, source: input, default: "", description: "Free-text description" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the finalized inspection the citation is based on" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; cited carrier (must equal the inspection's screening carrier)" }
      - { name: kind, type: enum, source: input, description: "Citation basis", constraints: "OVERWEIGHT | CREDENTIAL | HAZMAT | HOS | EQUIPMENT" }
      - { name: assessed_fine_cents, type: integer, source: computed, description: "Provisional fine at issuance (cents), from WIM weights for OVERWEIGHT or the flat schedule otherwise" }
      - { name: final_fine_cents, type: integer, source: computed, default: 0, description: "Final fine (cents) after adjudication: recomputed from certified weights on UPHOLD, 0 on DISMISS; equals assessed on non-contested settle" }
      - { name: certified_gross_lbs, type: integer, source: computed, default: 0, description: "Certified static-scale gross weight recorded at adjudication (0 until provided)" }
      - { name: certified_axle_lbs, type: integer, source: computed, default: 0, description: "Certified static-scale heaviest-axle weight recorded at adjudication (0 until provided)" }
      - { name: contest_reason, type: string, source: input, default: "", description: "Reason supplied by the carrier when contesting" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the EnforcementOfficer who issued the citation" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: "", description: "X-User-ID of the EnforcementOfficer who adjudicated the contest" }
      - { name: status, type: enum, source: system, description: "ASSESSED | CONTESTED | UPHELD | DISMISSED | SETTLED", constraints: "ASSESSED | CONTESTED | UPHELD | DISMISSED | SETTLED" }

  - name: DutyLogEntry
    parent: Driver
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; owning driver (taken from URL path)" }
      - { name: entry_type, type: enum, source: input, description: "HOS duty status", constraints: "DRIVING | ON_DUTY | OFF_DUTY | SLEEPER" }
      - { name: start_utc, type: datetime, source: input, description: "Entry start (ISO 8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Entry end (ISO 8601 UTC); must be strictly after start_utc" }

  - name: ScoreSnapshot
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; carrier scored (taken from URL path)" }
      - { name: method, type: enum, source: computed, description: "PROVISIONAL (auto, includes non-terminal inspections) | CERTIFIED (operator-run, finalized inspections only)", constraints: "PROVISIONAL | CERTIFIED" }
      - { name: iss_score, type: integer, source: computed, description: "ISS score 0-100 recorded at snapshot time under `method`" }
      - { name: inspection_count, type: integer, source: computed, description: "Number of inspections that fed this snapshot's score" }
      - { name: is_current, type: boolean, source: computed, description: "True for the carrier's latest snapshot; superseded snapshots flip to false" }
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock timestamp when the snapshot was computed" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Screening
    initial_state: SCREENED
    terminal_states: [CLEARED, INSPECTED]
    transitions:
      - from: SCREENED
        to: CLEARED
        trigger: "POST /screenings (auto at creation when decision computes to BYPASS)"
        actor: system
        preconditions:
          - "carrier.status == ACTIVE (cross-entity: an OOS_ORDERED carrier can never bypass)"
          - "overweight == false AND oversize == false AND credentials_valid == true AND hazmat_placarded == false"
          - "carrier.certified_iss_score < station.iss_bypass_threshold"
        side_effects:
          - "decision = BYPASS, referral_reason = NONE"
      - from: SCREENED
        to: REFERRED
        trigger: "POST /screenings (auto at creation when decision computes to PULL_IN)"
        actor: system
        preconditions:
          - "at least one pull-in condition holds (see calc screening_decision)"
        side_effects:
          - "decision = PULL_IN"
          - "referral_reason set by priority PRISM_TARGET > OVERWEIGHT > OVERSIZE > CREDENTIAL > HAZMAT"
      - from: REFERRED
        to: INSPECTED
        trigger: "POST /inspections/{id}/finalize (the screening's inspection is finalized)"
        actor: system
        preconditions: []
        side_effects:
          - "screening becomes terminal; no further inspection may be created from it"

  - entity: Inspection
    initial_state: IN_PROGRESS
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /inspections/{id}/finalize (result=CLEAR)"
        actor: Inspector
        preconditions:
          - "inspection.status == IN_PROGRESS"
        side_effects:
          - "result = CLEAR"
          - "release bay reservation: bay.reserved_minutes -= window minutes (INVARIANT bay_reserved_minutes)"
          - "screening REFERRED -> INSPECTED"
          - "recompute carrier.iss_score (provisional)"
          - "auto-create PROVISIONAL current ScoreSnapshot only if carrier crosses ACTIVE->UNDER_REVIEW"
      - from: IN_PROGRESS
        to: OOS_ISSUED
        trigger: "POST /inspections/{id}/finalize (result=OOS)"
        actor: Inspector
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "at least one Violation with oos == true exists (else ERR_NO_OOS_BASIS)"
        side_effects:
          - "result = OOS, oos_flag = true"
          - "CASCADE hop B: carrier.oos_points += sum(v.severity_weight for v where v.oos); oos_points_applied records the amount"
          - "if any OOS violation has category in {DRIVER, HOS}: driver ACTIVE -> OOS"
          - "release bay reservation: bay.reserved_minutes -= window minutes"
          - "screening REFERRED -> INSPECTED"
          - "CASCADE hop C: recompute carrier.iss_score; if iss_score >= ISS_REVIEW_THRESHOLD then carrier ACTIVE -> UNDER_REVIEW; if oos_points >= OOS_ORDER_THRESHOLD then carrier -> OOS_ORDERED"
          - "CASCADE hop D: when carrier enters UNDER_REVIEW, set prism_flagged=true and auto-create a PROVISIONAL ScoreSnapshot (is_current=true) that supersedes the prior current snapshot (prior.is_current=false); increments carrier.version"
      - from: OOS_ISSUED
        to: REINSPECTION
        trigger: "POST /inspections/{id}/reinspect"
        actor: Inspector
        preconditions:
          - "inspection.status == OOS_ISSUED"
        side_effects:
          - "reinspection_count += 1"
          - "re-reserve bay: bay.reserved_minutes += window minutes (bay must be free for the window again)"
        note: "Cyclic: an OOS inspection can loop back for re-inspection."
      - from: REINSPECTION
        to: CLEARED
        trigger: "POST /inspections/{id}/finalize (result=CLEAR)"
        actor: Inspector
        preconditions:
          - "inspection.status == REINSPECTION"
        side_effects:
          - "result = CLEAR"
          - "COMPENSATION: carrier.oos_points -= oos_points_applied; oos_points_applied = 0"
          - "release bay reservation: bay.reserved_minutes -= window minutes"
          - "recompute carrier.iss_score; if oos_points < OOS_ORDER_THRESHOLD and certified_iss_score < ISS_REVIEW_THRESHOLD, carrier OOS_ORDERED/UNDER_REVIEW may return to ACTIVE"
      - from: REINSPECTION
        to: OOS_ISSUED
        trigger: "POST /inspections/{id}/finalize (result=OOS)"
        actor: Inspector
        preconditions:
          - "inspection.status == REINSPECTION"
          - "at least one Violation with oos == true exists (else ERR_NO_OOS_BASIS)"
        side_effects:
          - "result = OOS, oos_flag = true"
          - "release bay reservation: bay.reserved_minutes -= window minutes"
        note: "Cyclic: reinspection can re-issue OOS without re-adding points already applied."
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: Inspector
        preconditions:
          - "inspection.status == IN_PROGRESS"
        side_effects:
          - "release bay reservation: bay.reserved_minutes -= window minutes (INVARIANT bay_reserved_minutes: create+cancel leaves sum unchanged)"
          - "screening remains REFERRED (re-inspectable)"

  - entity: Citation
    initial_state: ASSESSED
    terminal_states: [DISMISSED, SETTLED]
    transitions:
      - from: ASSESSED
        to: CONTESTED
        trigger: "POST /citations/{id}/contest"
        actor: CarrierRep
        preconditions:
          - "citation.status == ASSESSED"
          - "acting CarrierRep owns citation.carrier_id"
        side_effects: []
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /citations/{id}/adjudicate (result=UPHOLD)"
        actor: EnforcementOfficer
        preconditions:
          - "citation.status == CONTESTED"
          - "acting officer X-User-ID != citation.issued_by_user_id (SoD)"
        side_effects:
          - "record certified_gross_lbs / certified_axle_lbs and adjudicated_by_user_id"
          - "final_fine_cents = overweight_fine(certified weights) for OVERWEIGHT else assessed_fine_cents"
          - "RECONCILE: carrier.unpaid_fines_cents += (final_fine_cents - assessed_fine_cents)"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /citations/{id}/adjudicate (result=DISMISS)"
        actor: EnforcementOfficer
        preconditions:
          - "citation.status == CONTESTED"
          - "acting officer X-User-ID != citation.issued_by_user_id (SoD)"
        side_effects:
          - "final_fine_cents = 0, adjudicated_by_user_id recorded"
          - "COMPENSATION (INVARIANT carrier_unpaid_fines): carrier.unpaid_fines_cents -= assessed_fine_cents"
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /citations/{id}/settle"
        actor: CarrierRep
        preconditions:
          - "citation.status == ASSESSED"
          - "acting CarrierRep owns citation.carrier_id"
          - "payment_cents == assessed_fine_cents (else ERR_SETTLEMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "final_fine_cents = assessed_fine_cents"
          - "carrier.unpaid_fines_cents -= assessed_fine_cents"
      - from: UPHELD
        to: SETTLED
        trigger: "POST /citations/{id}/settle"
        actor: CarrierRep
        preconditions:
          - "citation.status == UPHELD"
          - "acting CarrierRep owns citation.carrier_id"
          - "payment_cents == final_fine_cents (else ERR_SETTLEMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "carrier.unpaid_fines_cents -= final_fine_cents"

  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "system (recompute after inspection finalize/violation) when iss_score >= ISS_REVIEW_THRESHOLD"
        actor: system
        preconditions:
          - "iss_score >= ISS_REVIEW_THRESHOLD"
        side_effects:
          - "prism_flagged = true; auto-create PROVISIONAL current ScoreSnapshot; increments version"
      - from: UNDER_REVIEW
        to: OOS_ORDERED
        trigger: "system (recompute after inspection finalize) when oos_points >= OOS_ORDER_THRESHOLD"
        actor: system
        preconditions:
          - "oos_points >= OOS_ORDER_THRESHOLD"
        side_effects:
          - "carrier is federally out-of-service; all future screenings for this carrier compute decision=PULL_IN referral_reason=PRISM_TARGET"
      - from: ACTIVE
        to: OOS_ORDERED
        trigger: "system (recompute after inspection finalize) when oos_points >= OOS_ORDER_THRESHOLD"
        actor: system
        preconditions:
          - "oos_points >= OOS_ORDER_THRESHOLD"
        side_effects:
          - "carrier is federally out-of-service"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /carriers/{id}/score-snapshots (CERTIFIED recompute clears review)"
        actor: system
        preconditions:
          - "certified_iss_score < ISS_REVIEW_THRESHOLD"
          - "oos_points < OOS_ORDER_THRESHOLD"
        side_effects: ["prism_flagged = false"]
        note: "Cyclic: review can be lifted by a clean certified snapshot."
      - from: OOS_ORDERED
        to: ACTIVE
        trigger: "POST /carriers/{id}/score-snapshots (CERTIFIED recompute after reinspection reversals)"
        actor: system
        preconditions:
          - "oos_points < OOS_ORDER_THRESHOLD"
          - "certified_iss_score < ISS_REVIEW_THRESHOLD"
        side_effects: ["prism_flagged = false"]

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OOS
        trigger: "system (inspection finalize with an OOS violation of category DRIVER or HOS) OR HOS driving limit exceeded on a duty-log post"
        actor: system
        preconditions: []
        side_effects: ["hos_status may be set to VIOLATION when triggered by HOS"]
      - from: OOS
        to: ACTIVE
        trigger: "POST /drivers/{id}/duty-logs (a qualifying OFF_DUTY entry of >= HOS_RESET_MIN minutes resets HOS)"
        actor: system
        preconditions:
          - "a posted OFF_DUTY entry has duration >= HOS_RESET_MIN"
        side_effects: ["hos_status = COMPLIANT; driving_minutes_window = 0"]
        note: "Cyclic: a full off-duty reset returns the driver to service."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: score-snapshot-create-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /carriers/{id}/score-snapshots"
    occ_field: "expected_carrier_version"
    description: |
      Creating a CERTIFIED ScoreSnapshot against a Carrier whose version has
      advanced since the client last observed it is rejected. A snapshot
      legitimately supersedes the carrier's prior current snapshot (flipping
      its is_current to false) and leaves carrier.status unchanged, so a second
      strictly-sequential create would itself succeed under natural semantics;
      the OCC stale-version check is the only guard that rejects a writer whose
      view of the carrier is stale (e.g. after a cascaded oos_points/iss/version
      bump from an intervening inspection finalize).
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: overweight_fine
    trigger: "POST /citations issuance (assessed, from WIM weights) and POST /citations/{id}/adjudicate UPHOLD (final, from certified weights)"
    algorithm: tiered_pricing
    formula: |
      def tiered(excess_lbs):            # marginal cents-per-pound, waterfall over brackets
        b1 = min(excess_lbs, 2000)
        b2 = min(max(excess_lbs - 2000, 0), 3000)   # pounds 2001..5000
        b3 = max(excess_lbs - 5000, 0)              # pounds 5001+
        return b1*RATE_T1 + b2*RATE_T2 + b3*RATE_T3   # cents
      gross_excess = max(0, gross_weight_lbs - station.gross_weight_limit_lbs)
      axle_excess  = max(0, heaviest_axle_lbs - station.single_axle_limit_lbs)
      overweight_fine_cents = max(tiered(gross_excess), tiered(axle_excess))
    input_set: "gross/axle weights come from the Screening (assessed) or from certified_* inputs at adjudication (final); limits from the Screening's station"
    constants: { RATE_T1: 10, RATE_T2: 25, RATE_T3: 50 }
    precision: "integer cents; no rounding needed (integer inputs)"
    variants:
      - name: assessed
        when: "at citation issuance"
        difference: "uses the Screening's weigh-in-motion gross_weight_lbs / heaviest_axle_lbs"
      - name: final
        when: "at adjudication UPHOLD"
        difference: "uses officer-entered certified_gross_lbs / certified_axle_lbs (static certified scale); typically lower, producing a delta reconciled onto carrier.unpaid_fines_cents"

  - name: flat_fine
    trigger: "POST /citations issuance for kind in {CREDENTIAL, HAZMAT, HOS, EQUIPMENT}"
    algorithm: threshold
    formula: |
      assessed_fine_cents = FLAT_FINE_CENTS[kind]
    input_set: "citation.kind only"
    constants: { CREDENTIAL: 25000, HAZMAT: 100000, HOS: 50000, EQUIPMENT: 15000 }
    precision: "integer cents"

  - name: carrier_iss_score
    trigger: "recompute on POST /inspections/{id}/violations, POST /inspections/{id}/finalize, POST /inspections/{id}/cancel (provisional) and on POST /carriers/{id}/score-snapshots (certified)"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED and load-bearing: round each per-inspection value
      # to the nearest INTEGER (HALF_UP) FIRST, then average, then round the
      # average HALF_UP to an integer. Doing it the other way (average the raw
      # values, then round once) yields a different score.
      included = inspections of this carrier whose status is in the variant's set,
                 ordered by created_at ASC, take the LAST 5 (most recent by created_at)
      if included is empty: iss_score = 0
      else:
        for each inspection i in included:
          raw_i    = sum(v.severity_weight for v in i.violations) * (OOS_MULT if i.oos_flag else 1.0)
          points_i = round(min(raw_i, 100.0), 0)          # HALF_UP to integer, PER inspection, FIRST
        iss_score = round( sum(points_i) / len(included), 0 )   # HALF_UP to integer, AFTER averaging
        iss_score = min(100, max(0, iss_score))
    input_set: "see variants for the status inclusion set; tie-order is created_at ASC (never id)"
    constants: { OOS_MULT: 1.5, WINDOW_N: 5 }
    precision: "per-inspection round to integer half_up FIRST, then average, then round to integer half_up"
    variants:
      - name: provisional
        when: "carrier.iss_score field; auto snapshots"
        difference: "inclusion set status in {IN_PROGRESS, REINSPECTION, CLEARED, OOS_ISSUED} (excludes CANCELLED)"
      - name: certified
        when: "CERTIFIED ScoreSnapshot via POST /carriers/{id}/score-snapshots"
        difference: "inclusion set status in {CLEARED, OOS_ISSUED} only (finalized inspections); a pending IN_PROGRESS inspection's violations are excluded, diverging from provisional"

  - name: screening_decision
    trigger: "POST /screenings (computed at creation)"
    algorithm: threshold
    formula: |
      overweight = (gross_weight_lbs > station.gross_weight_limit_lbs) OR
                   (heaviest_axle_lbs > station.single_axle_limit_lbs)   # strict '>' — at-limit is legal
      credentials_valid = (carrier.irp_status == ACTIVE AND carrier.ifta_status == ACTIVE AND carrier.ucr_status == ACTIVE)
      pull_in =
        carrier.status != ACTIVE OR                                   # PRISM_TARGET (cross-entity gate)
        carrier.certified_iss_score >= station.iss_bypass_threshold OR # PRISM_TARGET
        overweight OR oversize OR (not credentials_valid) OR hazmat_placarded
      decision = PULL_IN if pull_in else BYPASS
      status   = REFERRED if pull_in else CLEARED
      referral_reason (when pull_in), by priority:
        PRISM_TARGET  if carrier.status != ACTIVE or certified_iss_score >= threshold
        else OVERWEIGHT if overweight
        else OVERSIZE   if oversize
        else CREDENTIAL if not credentials_valid
        else HAZMAT     if hazmat_placarded
        else NONE
    input_set: "the screening's own weights/flags plus the referenced carrier and station state"
    precision: "n/a (boolean/enum)"

  - name: hos_driving_check
    trigger: "POST /drivers/{id}/duty-logs"
    algorithm: aggregation
    formula: |
      # A qualifying reset = an OFF_DUTY entry of duration >= HOS_RESET_MIN.
      # driving_minutes_window = sum of DRIVING-entry minutes since the end of the
      # most recent qualifying reset (or since the first entry if none).
      new_window = driving_minutes_window(before) + (entry duration if entry_type==DRIVING else 0)
      if entry_type == DRIVING and new_window > HOS_DRIVING_LIMIT_MIN:
        reject with ERR_HOS_DRIVING_LIMIT and set driver.hos_status = VIOLATION, driver.status = OOS
      if entry_type == OFF_DUTY and duration >= HOS_RESET_MIN:
        driving_minutes_window = 0; hos_status = COMPLIANT; driver OOS -> ACTIVE
    input_set: "the driver's DutyLogEntry set plus the new entry"
    constants: { HOS_DRIVING_LIMIT_MIN: 660, HOS_WINDOW_MIN: 840, HOS_RESET_MIN: 600 }
    precision: "integer minutes; boundary is strict '>' (exactly 660 driving minutes is allowed)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: "ERR_CARRIER_NOT_FOUND / ERR_STATION_NOT_FOUND / ERR_BAY_NOT_FOUND / ERR_DRIVER_NOT_FOUND / ERR_SCREENING_NOT_FOUND / ERR_INSPECTION_NOT_FOUND / ERR_CITATION_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: auth
    check: "CarrierRep acting on a carrier-owned resource must own it (X-User-ID == the resource's carrier_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /carriers/{id}/drivers, POST /drivers/{id}/duty-logs, POST /citations/{id}/contest, POST /citations/{id}/settle"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: the officer adjudicating a contest must differ from the officer who issued it (X-User-ID != issued_by_user_id)"
    error_id: ERR_SOD_CONFLICT
    http_status: 403
    applies_to: "POST /citations/{id}/adjudicate"
  - priority: 6
    category: state
    check: "Target resource is in a state that admits the requested transition (screening REFERRED for inspection create; inspection state for finalize/violation/reinspect/cancel; citation state for contest/adjudicate/settle)"
    error_id: "ERR_SCREENING_NOT_REFERRED / ERR_INSPECTION_INVALID_STATE / ERR_CITATION_INVALID_STATE"
    http_status: 409
    applies_to: "POST /inspections, /inspections/{id}/*, /citations/{id}/*"
  - priority: 7
    category: business_safety
    check: "Compliance basis present: OOS finalize needs an OOS violation; OVERWEIGHT citation needs screening.overweight; HAZMAT citation needs a HAZMAT-category violation; a DRIVING duty-log within limit"
    error_id: "ERR_NO_OOS_BASIS / ERR_OVERWEIGHT_BASIS_MISSING / ERR_HAZMAT_BASIS_MISSING / ERR_HOS_DRIVING_LIMIT"
    http_status: 422
    applies_to: "POST /inspections/{id}/finalize, POST /citations, POST /drivers/{id}/duty-logs"
  - priority: 8
    category: business_referential
    check: "Citation.carrier_id must equal the carrier of the citation's inspection screening"
    error_id: ERR_CARRIER_MISMATCH
    http_status: 409
    applies_to: "POST /citations"
  - priority: 9
    category: business_temporal
    check: "Interval rules: an inspection's bay window must not overlap another active window on the same bay (half-open); a driving shift needs a >= HOS_RESET_MIN off-duty buffer; duty-log entries must not overlap in time"
    error_id: "ERR_BAY_WINDOW_CONFLICT / ERR_HOS_RESET_REQUIRED / ERR_DUTY_LOG_OVERLAP"
    http_status: 409
    applies_to: "POST /inspections, POST /drivers/{id}/duty-logs"
  - priority: 10
    category: business_constraint
    check: "Field/enum/range validity, usdot uniqueness, bay availability, scheduled_end > scheduled_start, severity_weight in 1..10"
    error_id: "ERR_VALIDATION / ERR_DUPLICATE_USDOT / ERR_BAY_UNAVAILABLE"
    http_status: 422
    applies_to: "create endpoints"
  - priority: 11
    category: business_fiscal
    check: "Fine ceiling: unpaid_fines_cents + assessed_fine_cents must be < FINE_CAP_CENTS at issuance; settlement payment must equal the outstanding fine"
    error_id: "ERR_FINE_CAP_EXCEEDED / ERR_SETTLEMENT_AMOUNT_MISMATCH"
    http_status: 422
    applies_to: "POST /citations, POST /citations/{id}/settle"
  - priority: 12
    category: state
    check: "OCC: expected_carrier_version must equal the carrier's current version"
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412
    applies_to: "POST /carriers/{id}/score-snapshots"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  # ---- Carrier ----
  - method: POST
    path: "/carriers"
    description: "Register a motor carrier"
    roles: [ComplianceAdmin]
    code: 201
    input: [usdot_number, legal_name, irp_status, ifta_status, ucr_status]
    output: Carrier
    side_effects: ["status=ACTIVE; oos_points=0; unpaid_fines_cents=0; iss_score=0; certified_iss_score=0; prism_flagged=false; registration_hold=false; version=1"]
  - method: GET
    path: "/carriers"
    description: "List carriers (paginated)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []
  - method: GET
    path: "/carriers/{id}"
    description: "Get a carrier"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/carriers/{id}/drivers"
    description: "Register a driver under a carrier"
    roles: [ComplianceAdmin, CarrierRep]
    code: 201
    input: [cdl_number, full_name]
    output: Driver
    side_effects: ["status=ACTIVE; hos_status=COMPLIANT; driving_minutes_window=0"]
  - method: GET
    path: "/carriers/{id}/drivers"
    description: "List a carrier's drivers (reverse-reachability for Driver.carrier_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Driver[]
    side_effects: []
  - method: POST
    path: "/carriers/{id}/score-snapshots"
    description: "Compute and record a CERTIFIED PRISM/ISS ScoreSnapshot; OCC-guarded on the carrier version"
    roles: [ComplianceAdmin]
    code: 201
    input: [expected_carrier_version]
    output: ScoreSnapshot
    side_effects:
      - "method=CERTIFIED; iss_score = carrier_iss_score(certified); is_current=true; prior current snapshot -> is_current=false"
      - "carrier.certified_iss_score updated; may lift UNDER_REVIEW/OOS_ORDERED -> ACTIVE"
      - "increments Carrier.version by 1"
  - method: GET
    path: "/carriers/{id}/score-snapshots"
    description: "List a carrier's score snapshots (reverse-reachability for ScoreSnapshot.carrier_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: ScoreSnapshot[]
    side_effects: []

  # ---- WeighStation / Bay ----
  - method: POST
    path: "/stations"
    description: "Create a weigh station"
    roles: [ComplianceAdmin]
    code: 201
    input: [name, state_code, "gross_weight_limit_lbs?", "single_axle_limit_lbs?", "iss_bypass_threshold?"]
    output: WeighStation
    side_effects: ["defaults: gross_weight_limit_lbs=80000, single_axle_limit_lbs=20000, iss_bypass_threshold=50"]
  - method: GET
    path: "/stations/{id}"
    description: "Get a weigh station"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: WeighStation
    side_effects: []
  - method: POST
    path: "/stations/{id}/bays"
    description: "Create an inspection bay under a station"
    roles: [ComplianceAdmin]
    code: 201
    input: [label, "status?"]
    output: InspectionBay
    side_effects: ["reserved_minutes=0; status defaults AVAILABLE"]
  - method: GET
    path: "/stations/{id}/bays"
    description: "List a station's bays (reverse-reachability for InspectionBay.station_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: InspectionBay[]
    side_effects: []

  # ---- Driver duty logs ----
  - method: GET
    path: "/drivers/{id}"
    description: "Get a driver"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: POST
    path: "/drivers/{id}/duty-logs"
    description: "Append an HOS duty-log entry; runs overlap, reset-buffer and driving-limit checks"
    roles: [CarrierRep, ComplianceAdmin]
    code: 201
    input: [entry_type, start_utc, end_utc]
    output: DutyLogEntry
    side_effects:
      - "recompute driver.driving_minutes_window / hos_status"
      - "DRIVING over HOS_DRIVING_LIMIT_MIN -> driver OOS (rejected create)"
      - "OFF_DUTY >= HOS_RESET_MIN -> reset window, driver OOS -> ACTIVE"
  - method: GET
    path: "/drivers/{id}/duty-logs"
    description: "List a driver's duty logs (reverse-reachability for DutyLogEntry.driver_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: DutyLogEntry[]
    side_effects: []

  # ---- Screening ----
  - method: POST
    path: "/screenings"
    description: "Record a WIM/scale screening; computes overweight/credentials/decision/referral_reason at creation"
    roles: [Screener]
    code: 201
    input: [station_id, carrier_id, driver_id, vehicle_plate, axle_count, gross_weight_lbs, heaviest_axle_lbs, hazmat_placarded, "oversize?"]
    output: Screening
    side_effects:
      - "compute overweight, credentials_valid, decision, referral_reason (calc screening_decision)"
      - "status = CLEARED (BYPASS) or REFERRED (PULL_IN)"
  - method: GET
    path: "/screenings"
    description: "List screenings, filterable (reverse-reachability for Screening.station_id/carrier_id/driver_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: ["station_id?", "carrier_id?", "driver_id?", "status?", "limit?", "offset?"]
    output: Screening[]
    side_effects: []
  - method: GET
    path: "/screenings/{id}"
    description: "Get a screening"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Screening
    side_effects: []

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Open a Level I-III inspection on a referred screening; reserves the bay window"
    roles: [Inspector]
    code: 201
    input: [screening_id, bay_id, level, scheduled_start, scheduled_end]
    output: Inspection
    side_effects:
      - "driver_id copied from screening; status=IN_PROGRESS; result=NONE"
      - "reserve bay window: bay.reserved_minutes += minutes(scheduled_end - scheduled_start)"
  - method: GET
    path: "/inspections"
    description: "List inspections, filterable (reverse-reachability for Inspection.screening_id/driver_id/bay_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: ["screening_id?", "driver_id?", "bay_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/violations"
    description: "Record a violation on an open inspection"
    roles: [Inspector]
    code: 201
    input: [code, category, severity_weight, oos, "description?"]
    output: Violation
    side_effects: ["recompute carrier.iss_score (provisional)"]
  - method: GET
    path: "/inspections/{id}/violations"
    description: "List an inspection's violations (reverse-reachability for Violation.inspection_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/finalize"
    description: "Finalize an inspection as CLEAR or OOS; drives the OOS cascade"
    roles: [Inspector]
    code: 200
    input: [result]
    output: Inspection
    side_effects:
      - "CLEAR or OOS branch per state machine; releases bay reservation; screening -> INSPECTED"
      - "OOS: carrier.oos_points += OOS severity; driver may go OOS; recompute iss; carrier ACTIVE->UNDER_REVIEW / ->OOS_ORDERED; auto PROVISIONAL snapshot"
  - method: POST
    path: "/inspections/{id}/reinspect"
    description: "Re-open an OOS inspection for re-inspection (cyclic)"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status OOS_ISSUED -> REINSPECTION; reinspection_count += 1; re-reserve bay window"]
  - method: POST
    path: "/inspections/{id}/cancel"
    description: "Cancel an open inspection and release its bay window"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status IN_PROGRESS -> CANCELLED; bay.reserved_minutes -= window minutes"]

  # ---- Citation ----
  - method: POST
    path: "/citations"
    description: "Issue a citation from a finalized inspection; computes assessed fine and debits carrier"
    roles: [EnforcementOfficer]
    code: 201
    input: [inspection_id, carrier_id, kind]
    output: Citation
    side_effects:
      - "assessed_fine_cents = overweight_fine(assessed) or flat_fine; status=ASSESSED; issued_by_user_id = X-User-ID"
      - "CASCADE: carrier.unpaid_fines_cents += assessed_fine_cents; if that crosses FINE_HOLD_THRESHOLD_CENTS, registration_hold = true"
  - method: GET
    path: "/citations"
    description: "List citations, filterable (reverse-reachability for Citation.inspection_id/carrier_id)"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: ["inspection_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []
  - method: GET
    path: "/citations/{id}"
    description: "Get a citation"
    roles: [ComplianceAdmin, Screener, Inspector, EnforcementOfficer, CarrierRep]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: POST
    path: "/citations/{id}/contest"
    description: "Carrier contests a citation (ASSESSED -> CONTESTED)"
    roles: [CarrierRep]
    code: 200
    input: [contest_reason]
    output: Citation
    side_effects: ["status -> CONTESTED"]
  - method: POST
    path: "/citations/{id}/adjudicate"
    description: "Officer rules on a contest (UPHOLD or DISMISS); SoD-gated"
    roles: [EnforcementOfficer]
    code: 200
    input: [result, "certified_gross_lbs?", "certified_axle_lbs?"]
    output: Citation
    side_effects:
      - "UPHOLD: final_fine_cents from certified weights; reconcile carrier.unpaid_fines_cents += (final - assessed)"
      - "DISMISS: final_fine_cents=0; carrier.unpaid_fines_cents -= assessed_fine_cents (compensation)"
      - "adjudicated_by_user_id = X-User-ID"
  - method: POST
    path: "/citations/{id}/settle"
    description: "Carrier settles a citation (ASSESSED/UPHELD -> SETTLED)"
    roles: [CarrierRep]
    code: 200
    input: [payment_cents]
    output: Citation
    side_effects: ["status -> SETTLED; carrier.unpaid_fines_cents -= outstanding fine"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "CarrierRep acting on a carrier resource they do not own (X-User-ID != carrier_id)" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "Adjudicating officer is the same X-User-ID that issued the citation" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad enum, out-of-range value, or scheduled_end <= scheduled_start" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Referenced carrier does not exist" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "Referenced station does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "Referenced inspection bay does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Referenced driver does not exist" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "Referenced screening does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Referenced inspection does not exist" }
  - { id: ERR_CITATION_NOT_FOUND, http: 404, condition: "Referenced citation does not exist" }
  - { id: ERR_DUPLICATE_USDOT, http: 409, condition: "usdot_number already registered to another carrier" }
  - { id: ERR_SCREENING_NOT_REFERRED, http: 409, condition: "Inspection create against a screening whose status is not REFERRED" }
  - { id: ERR_INSPECTION_INVALID_STATE, http: 409, condition: "Inspection action not allowed from its current status" }
  - { id: ERR_CITATION_INVALID_STATE, http: 409, condition: "Citation action not allowed from its current status" }
  - { id: ERR_BAY_UNAVAILABLE, http: 409, condition: "Inspection create against a bay whose status is OUT_OF_ORDER" }
  - { id: ERR_NO_OOS_BASIS, http: 422, condition: "OOS finalize with no OOS violation recorded (empty OOS set)" }
  - { id: ERR_OVERWEIGHT_BASIS_MISSING, http: 422, condition: "OVERWEIGHT citation whose inspection screening is not overweight" }
  - { id: ERR_HAZMAT_BASIS_MISSING, http: 422, condition: "HAZMAT citation whose inspection has no HAZMAT-category violation" }
  - { id: ERR_HOS_DRIVING_LIMIT, http: 422, condition: "A DRIVING duty-log entry would push cumulative window driving above HOS_DRIVING_LIMIT_MIN" }
  - { id: ERR_CARRIER_MISMATCH, http: 409, condition: "Citation.carrier_id does not equal the carrier of its inspection's screening" }
  - { id: ERR_BAY_WINDOW_CONFLICT, http: 409, condition: "Inspection bay window overlaps another active window on the same bay (half-open)" }
  - { id: ERR_HOS_RESET_REQUIRED, http: 409, condition: "A DRIVING shift lacks the required >= HOS_RESET_MIN off-duty buffer since the prior driving shift" }
  - { id: ERR_DUTY_LOG_OVERLAP, http: 409, condition: "A duty-log entry overlaps an existing entry for the same driver" }
  - { id: ERR_SETTLEMENT_AMOUNT_MISMATCH, http: 422, condition: "Settlement payment_cents does not equal the citation's outstanding fine" }
  - { id: ERR_FINE_CAP_EXCEEDED, http: 422, condition: "unpaid_fines_cents + assessed_fine_cents would reach or exceed FINE_CAP_CENTS at issuance" }
  - { id: ERR_STALE_CARRIER_VERSION, http: 412, condition: "expected_carrier_version does not match the carrier's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Program administrator: configures carriers, stations, bays; runs certified PRISM/ISS scoring; sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers"
      - "POST /stations"
      - "POST /stations/{id}/bays"
      - "POST /carriers/{id}/score-snapshots"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /carriers/{id}/drivers (shared with CarrierRep)"
      - "POST /drivers/{id}/duty-logs (shared with CarrierRep)"
      - "all GET reads"
  - name: Screener
    description: "Weigh-station operator running the WIM/scale sort."
    identity: "opaque"
    exclusive_operations:
      - "POST /screenings"
    shared_operations:
      - "all GET reads"
  - name: Inspector
    description: "CVSA-certified inspector conducting Level I-III inspections and OOS orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/violations"
      - "POST /inspections/{id}/finalize"
      - "POST /inspections/{id}/reinspect"
      - "POST /inspections/{id}/cancel"
    shared_operations:
      - "all GET reads"
  - name: EnforcementOfficer
    description: "Officer who issues citations and adjudicates contests (SoD: issuer != adjudicator)."
    identity: "opaque"
    exclusive_operations:
      - "POST /citations"
      - "POST /citations/{id}/adjudicate"
    shared_operations:
      - "all GET reads"
  - name: CarrierRep
    description: "Motor-carrier representative acting on their own carrier: registers drivers, submits duty logs, contests and settles citations."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /citations/{id}/contest"
      - "POST /citations/{id}/settle"
    shared_operations:
      - "POST /carriers/{id}/drivers (must own carrier)"
      - "POST /drivers/{id}/duty-logs (must own the driver's carrier)"
      - "all GET reads"

# Named constants referenced above (thresholds live here so PRD/tests/impl agree):
#   ISS_REVIEW_THRESHOLD      = 10   (iss_score >= 10  -> Carrier ACTIVE -> UNDER_REVIEW)
#   OOS_ORDER_THRESHOLD       = 20   (oos_points >= 20 -> Carrier -> OOS_ORDERED)
#   FINE_HOLD_THRESHOLD_CENTS = 100000  (unpaid >= $1000 -> registration_hold = true)
#   FINE_CAP_CENTS            = 200000  (unpaid + assessed >= $2000 at issuance -> ERR_FINE_CAP_EXCEEDED)
constants:
  ISS_REVIEW_THRESHOLD: 10
  OOS_ORDER_THRESHOLD: 20
  FINE_HOLD_THRESHOLD_CENTS: 100000
  FINE_CAP_CENTS: 200000
  OVERWEIGHT_RATE_T1_CENTS_PER_LB: 10
  OVERWEIGHT_RATE_T2_CENTS_PER_LB: 25
  OVERWEIGHT_RATE_T3_CENTS_PER_LB: 50
  FLAT_FINE_CREDENTIAL_CENTS: 25000
  FLAT_FINE_HAZMAT_CENTS: 100000
  FLAT_FINE_HOS_CENTS: 50000
  FLAT_FINE_EQUIPMENT_CENTS: 15000
  ISS_OOS_MULT: 1.5
  ISS_WINDOW_N: 5
  HOS_DRIVING_LIMIT_MIN: 660
  HOS_WINDOW_MIN: 840
  HOS_RESET_MIN: 600
  DEFAULT_GROSS_WEIGHT_LIMIT_LBS: 80000
  DEFAULT_SINGLE_AXLE_LIMIT_LBS: 20000
  DEFAULT_ISS_BYPASS_THRESHOLD: 50
