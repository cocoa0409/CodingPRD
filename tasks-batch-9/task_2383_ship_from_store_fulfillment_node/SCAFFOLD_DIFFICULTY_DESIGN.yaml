      - name: pack_allowed_at_exactly_the_cutoff_minute_and_refused_one_minute_later
        grounds:
          - validations.ERR_STORE_CUTOFF_PASSED
          - entities.Store.fields.cutoff_utc_minutes
          - entities.FulfillmentAssignment.fields.labor_minutes_actual
        distinguishing_aspect: |
          Metric 2 = clock_minute_of_day(now) against store.cutoff_utc_minutes at endpoint
          POST /assignments/{assignment_id}/pack (a different metric and endpoint from instance
          1): packing at exactly 17:00:00Z (minute 1020 == the cutoff) must succeed and stamp
          labor_minutes_actual 475.00, while the identical pack of the sibling assignment at
          17:01:00Z is refused with 422 ERR_STORE_CUTOFF_PASSED.
        test_recipe:
          setup:
            - "Clock 09:00; S1 (cutoff_utc_minutes 1020) is the only node with SKU-A on_hand 12 / safety 2 and a MEDIUM_BOX supply of 5."
            - "Two GROUND zone-4 orders of SKU-A x2 are committed to S1 as a1 and a2 (each labor_minutes_reserved 18.00, concurrent load 36 <= cap 240)."
            - "Both are accepted at 09:05 and picked 2/2 at 09:10, so both sit in PICKED with accepted_at 09:05."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
