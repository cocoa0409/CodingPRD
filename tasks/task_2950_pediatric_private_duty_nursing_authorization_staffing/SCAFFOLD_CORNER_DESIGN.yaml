              payload: { to_iso8601: "2026-08-05T16:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/shifts/${shift_id}/clock-out"
              payload: {}
              as: Nurse
              as_user_id: "${n1_id}"
              captures: { net_units: $.data.net_billable_units }
            - call: "POST /pdn/timesheets/${ts_id}/submit"
