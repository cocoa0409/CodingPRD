  # ===========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: closed_window_priority_8_beats_capacity_priority_17
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - errors[ERR_DINING_WINDOW_CLOSED]
          - errors[ERR_KITCHEN_CAPACITY_BAND]
          - endpoints.POST_/order-slips
        distinguishing_aspect: |
          A business_constraint versus business_constraint conflict across
          adjacent rows: the seating-window check is hoisted above the capacity
          computation, so a placement that is both outside the ordering window and
          would band BLOCKED must report the window error, never the capacity one.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1. ENTREE E1 price 1000 prep 2. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z runtime 100, so dining_open 19:40, entree_ready_deadline 21:15, dining_close 21:05. Clock at 2026-09-01T21:30:00Z, i.e. past both the deadline and the close."
            - "Five ENTREE slips already accepted on X1, so the demand and the capacity band would both be adverse."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 8", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
