          - errors[ERR_ALLOCATION_BELOW_CONSUMED]
        distinguishing_aspect: |
          The PATCH floor is consumed capacity: with 6 of 10 heads consumed by a
          SCHEDULED record, adjusting the allocation to 5 fails
          ERR_ALLOCATION_BELOW_CONSUMED while adjusting to 12 succeeds and
          recomputes committed_headroom to 6.
        test_recipe:
          setup:
            - "ISSUED certificate + ISSUED permit (alloc 10) + one SCHEDULED record of 6 at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S39", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
