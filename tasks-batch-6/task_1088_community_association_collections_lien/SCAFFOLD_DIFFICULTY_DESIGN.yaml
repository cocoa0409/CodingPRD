              as: CollectionsAgent
              captures: { notice1_id: $.data.id }
            - call: "POST /collections/notices/${notice1_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "DEMAND" }
              as: CollectionsAgent
              captures: { notice2_id: $.data.id }
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/notices/${notice2_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_NOTICE_COOLDOWN"
            - "GET /collections/notices/${notice2_id} data.status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_trust_cash_conservation
        grounds:
          - calculations.trust_balance
          - entities.Association.fields.trust_balance_cents
          - state_machines.Payment.POSTED_to_REVERSED
        distinguishing_aspect: "Conserved quantity = Association.trust_balance_cents (trust cash): posting a 70000 payment raises trust to 70000, reversing it returns trust to its pre-post value 0 — post + reverse nets to zero drift."
        test_recipe:
          setup:
            - "Association with one Account; trust_balance_cents starts 0. Clock 2026-05-01."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Gale HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "40", owner_name: "Dex Hale" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 70000, received_date: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { pay_id: $.data.id }
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { trust_after_post: $.data.trust_balance_cents }
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: { reversal_reason: "NSF" }
              as: CollectionsAgent
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { trust_after_reverse: $.data.trust_balance_cents }
          assert:
            - "trust_balance_cents after POST payment == 70000"
            - "trust_balance_cents after reverse == 0"

      - name: ci_receivable_conservation
        grounds:
          - calculations.account_balance
          - entities.Account.fields.total_balance_cents
          - state_machines.Assessment.OPEN_to_WAIVED
        distinguishing_aspect: "A different conserved quantity = Account.total_balance_cents (receivable): posting a 30000 ATTORNEY_COST assessment raises the receivable to 30000, waiving it returns the receivable to its pre-charge value 0 — post + waive nets to zero drift."
        test_recipe:
          setup:
            - "Account with total_balance_cents 0. Clock 2026-05-01."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Knoll HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "41", owner_name: "Fay Orr" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "ATTORNEY_COST", amount_cents: 30000, due_date: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { asm_id: $.data.id }
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { bal_after_post: $.data.total_balance_cents }
            - call: "POST /collections/assessments/${asm_id}/waive"
              payload: {}
              as: CollectionsAgent
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { bal_after_waive: $.data.total_balance_cents }
          assert:
            - "total_balance_cents after POST assessment == 30000"
            - "total_balance_cents after waive == 0"
