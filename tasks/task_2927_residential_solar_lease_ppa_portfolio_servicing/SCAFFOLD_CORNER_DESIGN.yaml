              payload: { homeowner_id: "${hoC3_id}", tariff_id: "${tC3_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agC3_id: $.data.id, agC3_v0: $.data.version }
          trigger:
            - call: "POST /servicing/agreements/${agC3_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agC3_v1: $.data.version }
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agC3_id}", period_year: 2026, period_month: 6, metered_kwh: 900 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ppC3_id: $.data.id }
            - call: "GET /servicing/agreements/${agC3_id}"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agC3_v2: $.data.version }
            - call: "POST /servicing/production-periods/${ppC3_id}/reconcile"
              payload: { issue_credit: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "GET /servicing/agreements/${agC3_id}"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agC3_v3: $.data.version }
            - call: "POST /servicing/outage-events"
              payload: { agreement_id: "${agC3_id}", inverter_serial: "INV-7781-A", outage_type: "COMMS_LOSS", detected_at: "2026-07-04T09:00:00Z" }
              as: FieldOpsCoordinator
              as_user_id: "u_ops_1"
            - call: "GET /servicing/agreements/${agC3_id}"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { agC3_v4: $.data.version }
          assert:
            - "${agC3_v1} == ${agC3_v0} + 1: activation is a write on the agreement"
            - "${agC3_v2} == ${agC3_v1}: recording a month without reconciling it does NOT touch the agreement, and neither does the read"
            - "${agC3_v3} == ${agC3_v2} + 1: the CREDIT_ISSUED reconcile bumps the version exactly once even though it moves credit_earned_cents, credit_applied_cents and credit_balance_cents"
            - "${agC3_v4} == ${agC3_v3} + 1: recording the outage bumps it once more"
            - "ProductionPeriod.${ppC3_id}.status == CREDIT_ISSUED with gross_expected_kwh == 1075, guarantee_floor_kwh == 1021, shortfall_kwh == 121, credit_cents == 1837, gross_due_cents == 13660, credit_applied_cents == 0, net_due_cents == 13660, late_fee_cents == 0"
            - "three consecutive GET /servicing/agreements/${agC3_id} calls all report version ${agC3_v4}: reads never increment"

      - name: credit_application_is_capped_by_the_smaller_of_the_month_and_the_balance
        claim_type: threshold_boundary_behaviour
        grounds:
          - calculations.period_net_settlement
          - calculations.credit_ledger_invariant
          - complexity_profile.complexity_layers
          - endpoints[POST /servicing/production-periods]
        distinguishing_aspect: "Step 3 of the settlement waterfall is min(gross_due_cents, available_credit_cents), so the same 13569-cent balance is consumed 6071 first (capped by the month), then 7498 (the boundary case where the two bounds are exactly equal), then 0 — and the invoice never goes negative nor pays out cash."
        test_recipe:
          setup:
            - "One ACTIVE PPA agreement (A1 terms: start 2025-01-01, escalator 0.029, base rate 14750 millicents, 9600 kWh, band 0.05); contract year 2 rate is 15178 and contract year 3 is 15618."
            - "Clock starts at 2026-05-10T00:00:00Z so April 2026 has elapsed and its due date 2026-05-21 has not passed."
            - "April 2026 is metered at 0 kWh and reconciled with issue_credit true, which earns 13569 cents of credit against a zero invoice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-10T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoC4_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tC4_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoC4_id}", tariff_id: "${tC4_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agC4_id: $.data.id }
            - call: "POST /servicing/agreements/${agC4_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agC4_id}", period_year: 2026, period_month: 4, metered_kwh: 0, auto_reconcile: true, auto_issue_credit: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ppC4_apr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agC4_id}", period_year: 2026, period_month: 12, metered_kwh: 400, auto_reconcile: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ppC4_dec_id: $.data.id }
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agC4_id}", period_year: 2026, period_month: 11, metered_kwh: 494, auto_reconcile: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ppC4_nov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-05T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agC4_id}", period_year: 2027, period_month: 1, metered_kwh: 500, auto_reconcile: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ppC4_jan_id: $.data.id }
          assert:
            - "ProductionPeriod.${ppC4_apr_id}: status CREDIT_ISSUED, gross_expected_kwh 941, guarantee_floor_kwh 894, shortfall_kwh 894, credit_cents 13569, gross_due_cents 0, credit_applied_cents 0, net_due_cents 0, total_invoiced_cents 0"
            - "after April: SolarAgreement.${agC4_id}.credit_earned_cents == 13569, credit_applied_cents == 0, credit_balance_cents == 13569"
            - "ProductionPeriod.${ppC4_dec_id}: contract_year 2, gross_due_cents 6071, credit_applied_cents 6071, net_due_cents 0, late_fee_cents 0, total_invoiced_cents 0 — the credit is capped by the month, not by the 13569 balance"
            - "after December: credit_earned_cents == 13569, credit_applied_cents == 6071, credit_balance_cents == 7498"
            - "ProductionPeriod.${ppC4_nov_id}: gross_due_cents 7498, credit_applied_cents 7498, net_due_cents 0, total_invoiced_cents 0 — the exact-equality boundary where gross_due and the balance coincide"
            - "November is past its 2026-12-21 due date at clock 2027-01-05, and late_fee_cents is still 0 because the fee is a percentage of net_due_cents, which is 0"
            - "after November: credit_earned_cents == 13569, credit_applied_cents == 13569, credit_balance_cents == 0"
            - "ProductionPeriod.${ppC4_jan_id}: contract_year 3, gross_due_cents 7809, credit_applied_cents 0, net_due_cents 7809, total_invoiced_cents 7809 — an exhausted ledger applies nothing and never goes negative"
            - "after January: credit_balance_cents == 0 and credit_applied_cents == 13569, so the ledger identity credit_balance == credit_earned - credit_applied holds at every step"

      - name: cascading_side_effect_chains
        excluded_because:
          difficulty_instance: transitive_cascade.truck_roll_completion_cascades_to_excused_production_month
          rationale: >-
            The cascading_side_effects layer is probed end-to-end by both §1.8
            transitive_cascade instances: a truck-roll completion propagating through
            OutageEvent to the agreement's excused-downtime counter and on into a
            re-reconciled production month, and a PREPAYMENT close propagating to UCC
            terminations plus the child-write lockout. Ordering sensitivity and the
            no-partial-application property are asserted there.

      - name: dual_variant_calculation_pairs
        excluded_because:
          difficulty_instance: dual_variant_calc.true_up_monthly_rolling_vs_annual_diverge_on_same_twelve_months
          rationale: >-
            Both variant pairs the domain declares — MONTHLY_ROLLING versus
            ANNUAL_TRUE_UP on the same twelve months, and NPV versus unamortized
            payoff on identical transfer terms — are already asserted with computed
            literals and a pinned delta in §1.8's dual_variant_calc block, including
            variant selection by context.

  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ProductionPeriod.RECORDED_to_CREDIT_ISSUED
          - calculations.credit_ledger_invariant
          - calculations.monitoring_status_projection
        distinguishing_aspect: "consistency_model is immediate, so a single reconcile request returns the fully settled month AND an immediately following agreement read already shows the moved ledger and re-projected monitoring status — no second call, no re-read delay, no eventual convergence step."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z."
            - "One ACTIVE PPA agreement (A1 terms) with June 2026 recorded at 900 metered kWh but NOT yet reconciled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoM1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
