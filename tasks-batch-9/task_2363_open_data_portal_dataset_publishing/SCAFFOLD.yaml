# =============================================================================
# task_2363 — Open Data Portal & Dataset Publishing (municipal open data program)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: >-
  2363. Open Data Portal & Dataset Publishing (municipal open data program): dataset inventory
  across departments with prioritization based on public demand and policy value, publication
  readiness review covering privacy risk, aggregation requirements and reidentification analysis,
  metadata standards with update frequency, data dictionary, provenance and contact information,
  automated pipeline configuration for recurring publication with failure alerting and staleness
  detection, data quality issue intake from users with correction workflow and version history,
  license terms and attribution requirements with clear reuse permissions, high-value dataset
  commitments with service level expectations for currency, usage analytics and community
  engagement including application showcases and feedback on new dataset requests

domain_name: open-data-portal
api_prefix: /open-data

complexity_profile:
  difficulty_level: expert_plus          # above the §0.4 Expert band: 14 entities, 74 endpoints,
                                         # 9 calculations (4 dual-variant), 8 state machines
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Dataset <-> DatasetRequest (linked_dataset_id), QualityIssue <-> DatasetVersion
  # (mutual FKs: correction_issue_id / resolution_version_id), PublicationPipeline ->
  # PublicationPipeline (superseded_pipeline_id, self-referential), DatasetVersion ->
  # DatasetVersion (supersedes_version_id, self-referential). No URL nesting for ownership:
  # every entity is addressed from its own flat collection with FK fields in the body.

  state_machine_shape: parallel
  # Dataset carries two independent state dimensions on one row: publication_status
  # (INVENTORIED -> SCREENING -> READY -> PUBLISHED <-> UNDER_REMEDIATION -> RETIRED, cyclic)
  # and currency_status (CURRENT -> AGING -> STALE -> BREACHED, clock- and pipeline-driven).
  # PrivacyAssessment (BLOCKED -> DRAFT), PipelineRun (FAILED -> RETRY_QUEUED -> RUNNING),
  # MetadataRecord (RETURNED -> DRAFT) and DatasetRequest (UNDER_REVIEW -> OPEN) add cycles;
  # Department.compliance_posture is a compound (children-derived) gate.

  relationship_patterns:
    - one_to_many          # Department -> Dataset, Dataset -> DatasetVersion / QualityIssue
    - self_referential     # DatasetVersion.supersedes_version_id, PublicationPipeline.superseded_pipeline_id
    - cross_aggregate      # DatasetVersion.correction_issue_id, DatasetRequest.linked_dataset_id
    - many_to_many         # CommunityMember <-> DatasetRequest via DatasetRequest.votes[]

  role_model: segregation_of_duties
  # PrivacyReviewer who authored an assessment (assessor_user_id) may never be the reviewer who
  # decides it (decided_by_user_id); DataCoordinator is scoped to its own Department; PortalAdmin
  # owns publication and adjudication but cannot author privacy assessments.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Publishing department name" }
      - { name: code, type: string, source: input, description: "Short department code", constraints: "unique across Department, 2-12 chars uppercase" }
      - { name: contact_email, type: string, source: input, description: "Program contact address for the department" }
      - { name: credits_issued_units, type: number, source: computed, default: 0.00, description: "Lifetime stewardship credits granted to this department; only POST /departments/{id}/credit-grants increases it" }
      - { name: credit_balance_units, type: number, source: computed, default: 0.00, description: "Unescrowed, unconsumed credits available to arm pipelines and settle runs" }
      - { name: credits_escrowed_units, type: number, source: computed, default: 0.00, description: "Credits held by this department's pipelines with status IN {ARMED, SUSPENDED}" }
      - { name: credits_consumed_units, type: number, source: computed, default: 0.00, description: "Credits permanently spent on settled PipelineRun charges" }
      - { name: breached_dataset_count, type: integer, source: computed, default: 0, description: "Count of this department's datasets with currency_status == BREACHED" }
      - { name: stale_dataset_count, type: integer, source: computed, default: 0, description: "Count of this department's datasets with currency_status == STALE" }
      - { name: remediation_dataset_count, type: integer, source: computed, default: 0, description: "Count of this department's datasets with publication_status == UNDER_REMEDIATION" }
      - { name: overdue_correction_count, type: integer, source: computed, default: 0, description: "Count of QualityIssue rows on this department's datasets with status == ACCEPTED AND correction_breached == true" }
      - { name: risk_points, type: integer, source: computed, default: 0, description: "Weighted compliance risk total (see calculations.department_compliance_posture)" }
      - { name: compliance_posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | SUSPENDED — gates publication and pipeline arming", constraints: "OPEN when risk_points <= 1; RESTRICTED when 2 <= risk_points <= 5; SUSPENDED when risk_points >= 6" }

  - name: LicenseTerm
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "License code such as CC-BY-4.0", constraints: "unique across LicenseTerm" }
      - { name: name, type: string, source: input, description: "Human-readable license name" }
      - { name: attribution_required, type: boolean, source: input, default: false, description: "Reusers must credit the city" }
      - { name: commercial_use_allowed, type: boolean, source: input, default: true, description: "Commercial reuse permitted" }
      - { name: share_alike, type: boolean, source: input, default: false, description: "Derivative works must carry the same license" }
      - { name: attribution_text_template, type: string, source: input, description: "Required attribution wording; nullable when attribution_required == false" }
      - { name: reuse_permission_class, type: enum, source: computed, description: "UNRESTRICTED | ATTRIBUTION | COPYLEFT | NONCOMMERCIAL — first-match-wins over the three flags (see calculations.license_reuse_permission_class)" }
      - { name: retired, type: boolean, source: system, default: false, description: "Set true by POST /licenses/{id}/retire; retired licenses cannot back a newly accepted MetadataRecord" }

  - name: IngestRunner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shared ingest worker name" }
      - { name: cooldown_minutes, type: integer, source: input, default: 15, description: "Mandatory buffer appended after every armed window on this runner", constraints: "0..120" }
      - { name: armed_window_count, type: integer, source: computed, default: 0, description: "Count of PublicationPipeline rows on this runner with status IN {ARMED, SUSPENDED}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DRAINING | OFFLINE — only ACTIVE runners may start a PipelineRun", constraints: "set by PATCH /ingest-runners/{runnerId}" }

  - name: Dataset
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department, immutable after creation" }
      - { name: title, type: string, source: input, description: "Catalog title" }
      - { name: slug, type: string, source: input, description: "Catalog URL slug", constraints: "unique across Dataset, lowercase kebab-case" }
      - { name: description, type: string, source: input, description: "Public catalog description" }
      - { name: update_frequency, type: enum, source: input, description: "DAILY | WEEKLY | MONTHLY | QUARTERLY | ANNUAL | IRREGULAR — declared publication cadence" }
      - { name: column_count, type: integer, source: input, description: "Number of columns in the published extract; denominator of metadata dictionary coverage", constraints: ">= 1" }
      - { name: sensitivity_class, type: enum, source: input, description: "PUBLIC | SENSITIVE | RESTRICTED — drives the reidentification multiplier" }
      - { name: public_demand_score, type: number, source: input, description: "Coordinator-declared public demand, 0.00-100.00, 2 decimals" }
      - { name: policy_value_score, type: number, source: input, description: "Coordinator-declared policy value, 0.00-100.00, 2 decimals" }
      - { name: embargo_until_utc, type: datetime, source: input, description: "Publication embargo instant; nullable. Publication and run starts are refused while logical_now < embargo_until_utc" }
      - { name: aggregation_geography, type: enum, source: input, description: "BLOCK | TRACT | COUNTY — geography the published extract is aggregated to; nullable at creation, set or raised later by POST /datasets/{datasetId}/aggregation" }
      - { name: engagement_index, type: number, source: computed, default: 0.00, description: "Decay-weighted usage index over the three highest usage_epochs entries (see calculations.dataset_engagement_index)" }
      - { name: observed_demand_score, type: number, source: computed, default: 0.00, description: "== engagement_index; substitutes for public_demand_score in the AS_OBSERVED priority variant" }
      - { name: priority_score, type: number, source: computed, default: 0.00, description: "Active prioritization score, 2 decimals (see calculations.dataset_priority_score)" }
      - { name: priority_score_variant, type: enum, source: computed, default: AS_DECLARED, description: "AS_DECLARED | AS_OBSERVED — which variant produced priority_score" }
      - { name: priority_tier, type: enum, source: computed, default: TIER_3, description: "TIER_1 | TIER_2 | TIER_3 — TIER_1 when priority_score >= 75.00, TIER_2 when >= 50.00, else TIER_3" }
      - { name: usage_epochs, type: array, source: system, default: [], description: "Append-only usage buckets, objects { epoch_index: integer, api_call_count: integer, download_count: integer, recorded_at: datetime }; epoch_index unique per dataset" }
      - { name: showcase_apps, type: array, source: system, default: [], description: "Community application showcase entries, objects { label: string, name: string, url: string, submitter_member_id: string, status: SUBMITTED|APPROVED|REJECTED, decided_at: datetime }; label unique per dataset" }
      - { name: publication_status, type: enum, source: system, default: INVENTORIED, description: "INVENTORIED | SCREENING | READY | PUBLISHED | UNDER_REMEDIATION | RETIRED" }
      - { name: currency_status, type: enum, source: computed, default: CURRENT, description: "CURRENT | AGING | STALE | BREACHED (see calculations.dataset_currency_status)" }
      - { name: public_access_suspended, type: boolean, source: system, default: false, description: "True while the dataset sits in UNDER_REMEDIATION" }
      - { name: high_value_committed, type: boolean, source: system, default: false, description: "True once a high-value currency commitment is registered; only committed datasets may reach BREACHED" }
      - { name: live_row_count, type: integer, source: computed, default: 0, description: "Row count of this dataset's DatasetVersion with status == LIVE, else 0" }
      - { name: version_index_high_water, type: integer, source: system, default: 0, description: "Highest version_index ever minted for this dataset; never decreases, even after a retraction" }
      - { name: last_published_at, type: datetime, source: system, description: "published_at of the current LIVE version; nullable before first publication" }
      - { name: next_due_at, type: datetime, source: computed, description: "last_published_at + cadence days; null when update_frequency == IRREGULAR or never published" }
      - { name: days_overdue, type: integer, source: computed, default: 0, description: "floor((logical_now - next_due_at) / 86400s), floored at 0" }
      - { name: staleness_alert_count, type: integer, source: system, default: 0, description: "Number of staleness alerts emitted for this dataset" }
      - { name: last_staleness_alert_at, type: datetime, source: system, description: "Instant of the most recent staleness alert; nullable" }
      - { name: remediation_opened_at, type: datetime, source: system, description: "Instant the dataset entered UNDER_REMEDIATION; nullable" }

  - name: MetadataRecord
    parent: null
    common_fields: true
    fields:
      - { name: dataset_id, type: string, source: input, description: "FK -> Dataset.id; the dataset this metadata describes", constraints: "at most one MetadataRecord per dataset with status IN {DRAFT, SUBMITTED, ACCEPTED}" }
      - { name: license_id, type: string, source: input, description: "FK -> LicenseTerm.id; license governing reuse of the dataset" }
      - { name: data_dictionary_field_count, type: integer, source: input, description: "Number of columns documented in the data dictionary", constraints: ">= 0" }
      - { name: provenance_detail_lines, type: integer, source: input, description: "Documented lineage steps; target is PROVENANCE_TARGET_LINES", constraints: ">= 0" }
      - { name: contact_email, type: string, source: input, description: "Steward contact published with the dataset" }
      - { name: declared_update_frequency, type: enum, source: input, description: "DAILY | WEEKLY | MONTHLY | QUARTERLY | ANNUAL | IRREGULAR — frequency promised in the metadata record" }
      - { name: attribution_element_count, type: integer, source: input, default: 0, description: "How many of the 6 required attribution elements are filled in", constraints: "0..6" }
      - { name: component_contributions, type: array, source: computed, default: [], description: "The six per-component contributions, each already rounded to 2 decimals, in declaration order [dictionary, provenance, contact, frequency, license, attribution]" }
      - { name: completeness_score, type: number, source: computed, default: 0.00, description: "Sum of component_contributions re-rounded to 2 decimals (see calculations.metadata_completeness_score)" }
      - { name: returned_reason, type: string, source: system, description: "Reviewer note captured when status becomes RETURNED; nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED" }

  - name: PrivacyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: dataset_id, type: string, source: input, description: "FK -> Dataset.id; the dataset under reidentification analysis", constraints: "at most one PrivacyAssessment per dataset with status IN {DRAFT, SUBMITTED, CLEARED}" }
      - { name: assessor_user_id, type: string, source: system, description: "X-User-ID of the PrivacyReviewer that created the assessment (opaque operator id)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the PrivacyReviewer that cleared or blocked it; nullable until decided; MUST differ from assessor_user_id" }
      - { name: declared_quasi_identifier_count, type: integer, source: input, description: "Quasi-identifier columns declared by the department", constraints: "0..20" }
      - { name: declared_smallest_cell_size, type: integer, source: input, description: "Smallest cross-tab cell size the department declared", constraints: ">= 1" }
      - { name: verified_smallest_cell_size, type: integer, source: input, description: "Cell size the reviewer measured on the actual extract; nullable until set by PATCH /privacy-assessments/{assessmentId}", constraints: ">= 1" }
      - { name: population_size, type: integer, source: input, description: "Population covered by the extract", constraints: ">= 1" }
      - { name: k_anonymity_k, type: integer, source: computed, default: 1, description: "== verified_smallest_cell_size when set, else declared_smallest_cell_size" }
      - { name: screening_risk_score, type: number, source: computed, default: 0.00, description: "SCREENING variant reidentification score, 2 decimals (see calculations.reidentification_risk_score)" }
      - { name: clearance_risk_score, type: number, source: computed, description: "CLEARANCE variant reidentification score, 2 decimals; null until the assessment is submitted" }
      - { name: risk_score, type: number, source: computed, default: 0.00, description: "== screening_risk_score while status == DRAFT, else clearance_risk_score" }
      - { name: aggregation_required, type: boolean, source: computed, default: false, description: "risk_score >= AGGREGATION_REQUIRED_MIN" }
      - { name: min_aggregation_geography, type: enum, source: computed, default: BLOCK, description: "BLOCK | TRACT | COUNTY — coarsest geography required before publication" }
      - { name: block_reason, type: enum, source: system, description: "RISK_TOO_HIGH | AGGREGATION_UNMET | REVIEWER_JUDGEMENT — set when status becomes BLOCKED; nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | CLEARED | BLOCKED" }

  - name: PublicationPipeline
    parent: null
    common_fields: true
    fields:
      - { name: dataset_id, type: string, source: input, description: "FK -> Dataset.id; dataset republished by this pipeline" }
      - { name: runner_id, type: string, source: input, description: "FK -> IngestRunner.id; shared worker that executes the recurring job" }
      - { name: superseded_pipeline_id, type: string, source: computed, description: "FK -> PublicationPipeline.id; the pipeline this one replaced at creation time; nullable" }
      - { name: cadence, type: enum, source: input, description: "DAILY | WEEKLY | MONTHLY | QUARTERLY | ANNUAL — recurrence of the automated publication" }
      - { name: window_start_minute, type: integer, source: input, description: "Daily window start, minutes after 00:00 UTC", constraints: "0..1439" }
      - { name: window_duration_minutes, type: integer, source: input, description: "Window length in minutes", constraints: "1..480" }
      - { name: window_end_minute, type: integer, source: computed, description: "== window_start_minute + window_duration_minutes; must be <= 1440" }
      - { name: alert_email, type: string, source: input, description: "Address notified when a run fails or the dataset goes stale" }
      - { name: escrow_required_units, type: number, source: computed, default: 0.00, description: "Credits this pipeline must escrow to arm (see calculations.pipeline_credit_escrow)" }
      - { name: escrowed_credit_units, type: number, source: computed, default: 0.00, description: "Credits currently held by this pipeline; released on decommission, drawn down by run settlement" }
      - { name: consecutive_failure_count, type: integer, source: system, default: 0, description: "Consecutive FAILED runs since the last SUCCEEDED run, reset to 0 by report-success and by resume" }
      - { name: suspend_reason, type: enum, source: system, description: "FAILURE_STREAK | REMEDIATION_HOLD | ADMIN_REQUEST — set when status becomes SUSPENDED; nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ARMED | SUSPENDED | DECOMMISSIONED" }

  - name: PipelineRun
    parent: null
    common_fields: true
    fields:
      - { name: pipeline_id, type: string, source: input, description: "FK -> PublicationPipeline.id; pipeline whose schedule produced this run" }
      - { name: scheduled_for_utc, type: datetime, source: input, description: "Instant the run is scheduled to start; its minute-of-day must fall inside the pipeline window" }
      - { name: started_at, type: datetime, source: system, description: "Instant the run entered RUNNING; nullable" }
      - { name: finished_at, type: datetime, source: system, description: "Instant the run reached SUCCEEDED, FAILED or SKIPPED; nullable" }
      - { name: rows_ingested, type: integer, source: input, default: 0, description: "Rows written by a successful run; stays 0 for FAILED and SKIPPED runs" }
      - { name: failure_code, type: enum, source: input, description: "SOURCE_UNAVAILABLE | SCHEMA_DRIFT | TIMEOUT | TRANSFORM_ERROR — nullable, set on failure" }
      - { name: alert_dispatched, type: boolean, source: system, default: false, description: "True once a failure alert has been emitted to the pipeline alert_email" }
      - { name: consecutive_failure_index, type: integer, source: system, default: 0, description: "Value of the pipeline's consecutive_failure_count after this run failed; 0 for non-failed runs" }
      - { name: compute_credits, type: number, source: computed, default: 0.00, description: "Step 1 of settlement: ceil(rows_ingested / ROWS_PER_COMPUTE_UNIT) * COMPUTE_UNIT_CREDITS" }
      - { name: alert_credits, type: number, source: computed, default: 0.00, description: "Step 2 of settlement: ALERT_FEE_CREDITS when alert_dispatched else 0.00" }
      - { name: subtotal_credits, type: number, source: computed, default: 0.00, description: "Step 3: compute_credits + alert_credits — the ONLY input to the reliability tier" }
      - { name: reliability_discount_pct, type: number, source: computed, default: 0.00, description: "Step 4: tier keyed on subtotal_credits, never re-keyed on the discounted total" }
      - { name: discount_credits, type: number, source: computed, default: 0.00, description: "Step 5: round(subtotal_credits * reliability_discount_pct, 2)" }
      - { name: total_charge_credits, type: number, source: computed, default: 0.00, description: "Step 6: subtotal_credits - discount_credits" }
      - { name: escrow_drawn_units, type: number, source: computed, default: 0.00, description: "Portion of total_charge_credits taken from the pipeline escrow (first bucket of the waterfall)" }
      - { name: balance_drawn_units, type: number, source: computed, default: 0.00, description: "Portion of total_charge_credits taken from Department.credit_balance_units (second bucket)" }
      - { name: skip_reason, type: enum, source: system, description: "PIPELINE_SUSPENDED | PIPELINE_DECOMMISSIONED | DATASET_RETIRED — set when a SCHEDULED or RETRY_QUEUED run is skipped by a cascade; nullable" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | RUNNING | SUCCEEDED | FAILED | RETRY_QUEUED | SKIPPED" }

  - name: DatasetVersion
    parent: null
    common_fields: true
    fields:
      - { name: dataset_id, type: string, source: input, description: "FK -> Dataset.id; dataset this published version belongs to" }
      - { name: source_run_id, type: string, source: computed, description: "FK -> PipelineRun.id; run that produced this version; nullable for manual versions" }
      - { name: correction_issue_id, type: string, source: input, description: "FK -> QualityIssue.id; issue this correction version answers; nullable" }
      - { name: supersedes_version_id, type: string, source: computed, description: "FK -> DatasetVersion.id; the version that was LIVE immediately before this one; nullable for version_index 1" }
      - { name: version_index, type: integer, source: system, description: "Monotone per-dataset index starting at 1, minted as version_index_high_water + 1" }
      - { name: version_label, type: string, source: system, description: "\"v\" + version_index" }
      - { name: change_type, type: enum, source: input, description: "INITIAL | SCHEDULED_REFRESH | CORRECTION | SCHEMA_CHANGE" }
      - { name: row_count, type: integer, source: input, description: "Rows in this published extract", constraints: ">= 0" }
      - { name: notes, type: string, source: input, description: "Change note shown in the public version history; nullable" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock instant this version became LIVE" }
      - { name: superseded_at, type: datetime, source: system, description: "Instant a newer version replaced this one; nullable and cleared back to null when the successor is retracted" }
      - { name: retracted_at, type: datetime, source: system, description: "Instant this version was retracted; nullable" }
      - { name: status, type: enum, source: system, default: LIVE, description: "LIVE | SUPERSEDED | RETRACTED — exactly one LIVE version per dataset that has been published at least once and never fully retracted" }

  - name: QualityIssue
    parent: null
    common_fields: true
    fields:
      - { name: dataset_id, type: string, source: input, description: "FK -> Dataset.id; dataset the reporter found a problem in" }
      - { name: reporter_member_id, type: string, source: input, description: "FK -> CommunityMember.id; community member that filed the issue" }
      - { name: resolution_version_id, type: string, source: computed, description: "FK -> DatasetVersion.id; correction version that resolved the issue; nullable" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL — drives triage and correction SLAs" }
      - { name: category, type: enum, source: input, description: "ACCURACY | COMPLETENESS | TIMELINESS | SCHEMA | PRIVACY" }
      - { name: description, type: string, source: input, description: "Reporter's description of the defect" }
      - { name: triage_due_at, type: datetime, source: computed, description: "created_at + TRIAGE_SLA_HOURS[severity]" }
      - { name: triaged_at, type: datetime, source: system, description: "Instant status became TRIAGED; nullable" }
      - { name: accepted_at, type: datetime, source: system, description: "Instant status became ACCEPTED; nullable" }
      - { name: correction_due_at, type: datetime, source: computed, description: "accepted_at + CORRECTION_SLA_DAYS[severity]; null until accepted" }
      - { name: triage_breached, type: boolean, source: system, default: false, description: "True when the issue was still SUBMITTED after triage_due_at" }
      - { name: correction_breached, type: boolean, source: system, default: false, description: "True when the issue was still ACCEPTED after correction_due_at" }
      - { name: reject_reason, type: enum, source: system, description: "NOT_REPRODUCIBLE | OUT_OF_SCOPE | DUPLICATE — set when status becomes REJECTED; nullable" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | TRIAGED | ACCEPTED | REJECTED | CORRECTED | CLOSED" }

  - name: CommunityMember
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login address", constraints: "unique across CommunityMember" }
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: organization, type: string, source: input, description: "Affiliation shown on showcase entries; nullable" }
      - { name: accepted_issue_count, type: integer, source: computed, default: 0, description: "QualityIssue rows by this member with status IN {ACCEPTED, CORRECTED, CLOSED}" }
      - { name: rejected_issue_count, type: integer, source: computed, default: 0, description: "QualityIssue rows by this member with status == REJECTED" }
      - { name: approved_showcase_count, type: integer, source: computed, default: 0, description: "Dataset.showcase_apps entries with submitter_member_id == this member and status == APPROVED" }
      - { name: last_credited_at, type: datetime, source: system, description: "Instant of the member's most recent credited contribution; initialised to created_at" }
      - { name: decay_epochs, type: integer, source: computed, default: 0, description: "floor((logical_now - last_credited_at) / REPUTATION_DECAY_PERIOD_DAYS days), floored at 0" }
      - { name: reputation_score, type: number, source: computed, default: 50.00, description: "Decayed reputation, 2 decimals (see calculations.member_reputation_score)" }
      - { name: vote_weight, type: integer, source: computed, default: 2, description: "3 when reputation_score >= 70.00, 2 when >= 40.00, else 1" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | THROTTLED — THROTTLED once rejected_issue_count - accepted_issue_count >= THROTTLE_NET_REJECTS" }

  - name: DatasetRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_member_id, type: string, source: input, description: "FK -> CommunityMember.id; member asking for a new dataset" }
      - { name: linked_dataset_id, type: string, source: computed, description: "FK -> Dataset.id; dataset that fulfils this request; nullable until fulfilment" }
      - { name: title, type: string, source: input, description: "Requested dataset title" }
      - { name: rationale, type: string, source: input, description: "Why the data is wanted" }
      - { name: votes, type: array, source: system, default: [], description: "Append-only upvotes, objects { member_id: string, weight: integer, cast_at: datetime }; member_id unique within the array" }
      - { name: weighted_vote_total, type: integer, source: computed, default: 0, description: "Sum of votes[].weight" }
      - { name: demand_signal, type: number, source: computed, default: 0.00, description: "min(100, weighted_vote_total * DEMAND_SIGNAL_MULTIPLIER), 2 decimals" }
      - { name: decision_note, type: string, source: system, description: "Reviewer note captured on review/decide; nullable" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | ACCEPTED | DECLINED | FULFILLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Dataset, dimension 1 of 2: publication_status (cyclic through remediation) ----
  - entity: Dataset
    dimension: publication_status
    initial_state: INVENTORIED
    terminal_states: [RETIRED]
    transitions:
      - from: INVENTORIED
        to: SCREENING
        trigger: "POST /open-data/datasets/{datasetId}/screen"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
          - "department.compliance_posture != SUSPENDED"
        side_effects:
          - "recompute priority_score with the AS_DECLARED variant; priority_score_variant = AS_DECLARED"
          - "dataset becomes eligible for POST /datasets/{datasetId}/usage-report (catalog-page analytics)"
          - "increments Dataset.version by 1"
      - from: SCREENING
        to: READY
        trigger: "POST /open-data/datasets/{datasetId}/mark-ready"
        actor: DataCoordinator
        preconditions:
          - "exactly one MetadataRecord for this dataset with status == ACCEPTED exists"
          - "exactly one PrivacyAssessment for this dataset with status == CLEARED exists"
          - "if that assessment has aggregation_required == true then GEO_RANK[dataset.aggregation_geography] >= GEO_RANK[assessment.min_aggregation_geography]"
          - "department.compliance_posture != SUSPENDED"
        side_effects:
          - "increments Dataset.version by 1"
        note: "Cross-entity guard: Dataset cannot advance without CLEARED PrivacyAssessment and ACCEPTED MetadataRecord."
      - from: READY
        to: PUBLISHED
        trigger: "POST /open-data/datasets/{datasetId}/publish"
        actor: DataCoordinator
        preconditions:
          - "dataset.embargo_until_utc IS NULL OR logical_now >= dataset.embargo_until_utc"
          - "department.compliance_posture != SUSPENDED"
          - "if department.compliance_posture == RESTRICTED then the dataset's priority_tier AS IT STANDS AT THE START OF THIS REQUEST (AS_DECLARED) must be TIER_1 or TIER_2"
          - "the MetadataRecord backing this dataset references a LicenseTerm with retired == false"
        side_effects:
          - "creates DatasetVersion with version_index = dataset.version_index_high_water + 1, change_type = INITIAL, row_count = initial_row_count, status = LIVE, published_at = logical_now, supersedes_version_id = null"
          - "sets dataset.version_index_high_water = 1, dataset.live_row_count = initial_row_count, dataset.last_published_at = logical_now"
          - "recomputes engagement_index, then recomputes priority_score with the AS_OBSERVED variant; priority_score_variant = AS_OBSERVED (evaluated AFTER the RESTRICTED gate above)"
          - "recomputes next_due_at, days_overdue and currency_status (-> CURRENT)"
          - "recomputes department.risk_points and department.compliance_posture"
          - "increments Dataset.version by 1"
      - from: PUBLISHED
        to: UNDER_REMEDIATION
        trigger: "system cascade, hop 2 of POST /open-data/quality-issues/{issueId}/decide with decision == ACCEPT"
        actor: system
        preconditions:
          - "the accepted QualityIssue has severity == CRITICAL AND category == PRIVACY"
          - "issue.dataset_id == dataset.id"
        side_effects:
          - "sets public_access_suspended = true and remediation_opened_at = logical_now"
          - "hop 3: every PublicationPipeline of this dataset with status == ARMED transitions to SUSPENDED with suspend_reason = REMEDIATION_HOLD"
          - "recomputes department.remediation_dataset_count, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
        note: "Hop 2 of cascade transitive_cascade/issue_accept_privacy_remediation_chain."
      - from: UNDER_REMEDIATION
        to: PUBLISHED
        trigger: "POST /open-data/quality-issues/{issueId}/link-correction"
        actor: DataCoordinator
        preconditions:
          - "no other QualityIssue on this dataset has status == ACCEPTED with severity == CRITICAL AND category == PRIVACY"
          - "the linked DatasetVersion has status == LIVE, change_type == CORRECTION and dataset_id == dataset.id"
        side_effects:
          - "sets public_access_suspended = false and remediation_opened_at = null"
          - "recomputes currency_status; the STALE floor imposed by a SUSPENDED pipeline still applies while the pipeline is SUSPENDED"
          - "recomputes department.remediation_dataset_count, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
        note: "Closes the PUBLISHED -> UNDER_REMEDIATION -> PUBLISHED cycle."
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /open-data/datasets/{datasetId}/retire"
        actor: DataCoordinator
        preconditions:
          - "no QualityIssue on this dataset has status IN {SUBMITTED, TRIAGED, ACCEPTED}"
        side_effects:
          - "every PublicationPipeline of this dataset with status IN {ARMED, SUSPENDED} transitions to DECOMMISSIONED, releasing escrowed_credit_units back to department.credit_balance_units"
          - "every PipelineRun of those pipelines with status IN {SCHEDULED, RETRY_QUEUED} transitions to SKIPPED with skip_reason = DATASET_RETIRED"
          - "sets public_access_suspended = true; recomputes department counters, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
      - from: READY
        to: RETIRED
        trigger: "POST /open-data/datasets/{datasetId}/retire"
        actor: DataCoordinator
        preconditions:
          - "no QualityIssue on this dataset has status IN {SUBMITTED, TRIAGED, ACCEPTED}"
        side_effects:
          - "sets public_access_suspended = true"
          - "increments Dataset.version by 1"

  # ---- Dataset, dimension 2 of 2: currency_status (independent axis on the same row) ----
  - entity: Dataset
    dimension: currency_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: AGING
        trigger: "POST /open-data/ops-run (step 1) — logical_now > next_due_at and days_overdue <= GRACE_DAYS[priority_tier]"
        actor: system
        preconditions:
          - "publication_status IN {PUBLISHED, UNDER_REMEDIATION}"
          - "next_due_at IS NOT NULL"
        side_effects:
          - "recomputes days_overdue"
          - "increments Dataset.version by 1"
      - from: AGING
        to: STALE
        trigger: "POST /open-data/ops-run (step 1) — days_overdue > GRACE_DAYS[priority_tier]"
        actor: system
        preconditions:
          - "publication_status IN {PUBLISHED, UNDER_REMEDIATION}"
        side_effects:
          - "step 2: increments staleness_alert_count by 1 and sets last_staleness_alert_at = logical_now"
          - "recomputes department.stale_dataset_count, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
      - from: CURRENT
        to: STALE
        trigger: "system cascade, hop 3 of POST /open-data/pipeline-runs/{runId}/report-failure (pipeline reached the failure streak limit and was SUSPENDED)"
        actor: system
        preconditions:
          - "the dataset's PublicationPipeline with status IN {ARMED, SUSPENDED} is now SUSPENDED"
          - "publication_status IN {PUBLISHED, UNDER_REMEDIATION}"
        side_effects:
          - "applies the SUSPENDED-pipeline floor: currency_status = max_severity(clock_computed_status, STALE)"
          - "increments staleness_alert_count by 1 and sets last_staleness_alert_at = logical_now"
          - "hop 4: recomputes department.stale_dataset_count, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
        note: "Hop 3 of cascade transitive_cascade/run_failure_streak_posture_chain."
      - from: STALE
        to: BREACHED
        trigger: "POST /open-data/ops-run (step 1) — days_overdue > 2 * GRACE_DAYS[priority_tier]"
        actor: system
        preconditions:
          - "high_value_committed == true"
          - "publication_status IN {PUBLISHED, UNDER_REMEDIATION}"
        side_effects:
          - "step 2: increments staleness_alert_count by 1 and sets last_staleness_alert_at = logical_now"
          - "recomputes department.breached_dataset_count, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
        note: "A dataset with high_value_committed == false floors at STALE and never reaches BREACHED."
      - from: STALE
        to: CURRENT
        trigger: "POST /open-data/pipeline-runs/{runId}/report-success or POST /open-data/dataset-versions"
        actor: DataCoordinator
        preconditions:
          - "a new DatasetVersion became LIVE with published_at == logical_now"
          - "no PublicationPipeline of this dataset has status == SUSPENDED"
        side_effects:
          - "recomputes next_due_at from the new last_published_at, sets days_overdue = 0"
          - "recomputes department counters, risk_points and compliance_posture"
          - "increments Dataset.version by 1"
      - from: BREACHED
        to: CURRENT
        trigger: "POST /open-data/pipeline-runs/{runId}/report-success or POST /open-data/dataset-versions"
        actor: DataCoordinator
        preconditions:
          - "a new DatasetVersion became LIVE with published_at == logical_now"
          - "no PublicationPipeline of this dataset has status == SUSPENDED"
        side_effects:
          - "recomputes next_due_at, sets days_overdue = 0"
          - "recomputes department.breached_dataset_count, risk_points and compliance_posture"
          - "increments Dataset.version by 1"

  # ---- MetadataRecord (RETURNED -> DRAFT revision loop) ----
  - entity: MetadataRecord
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /open-data/metadata-records/{metadataRecordId}/submit"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
          - "dataset.publication_status == SCREENING"
        side_effects:
          - "recomputes component_contributions and completeness_score"
          - "increments MetadataRecord.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /open-data/metadata-records/{metadataRecordId}/decide with decision == ACCEPT"
        actor: PortalAdmin
        preconditions:
          - "license.retired == false"
          - "if license.attribution_required == true then attribution_element_count >= 1"
          - "completeness_score >= METADATA_ACCEPT_MIN"
        side_effects:
          - "increments MetadataRecord.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /open-data/metadata-records/{metadataRecordId}/decide with decision == RETURN"
        actor: PortalAdmin
        preconditions:
          - "returned_reason supplied in the request body"
        side_effects:
          - "sets returned_reason"
          - "increments MetadataRecord.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "PATCH /open-data/metadata-records/{metadataRecordId}"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
        side_effects:
          - "clears returned_reason, recomputes component_contributions and completeness_score"
          - "increments MetadataRecord.version by 1"
        note: "Revision loop: RETURNED -> DRAFT -> SUBMITTED can repeat without limit."

  # ---- PrivacyAssessment (BLOCKED -> DRAFT revision loop, branching decision) ----
  - entity: PrivacyAssessment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /open-data/privacy-assessments/{assessmentId}/submit"
        actor: PrivacyReviewer
        preconditions:
          - "verified_smallest_cell_size IS NOT NULL"
          - "dataset.publication_status == SCREENING"
        side_effects:
          - "computes clearance_risk_score (CLEARANCE variant), sets risk_score = clearance_risk_score"
          - "recomputes k_anonymity_k, aggregation_required and min_aggregation_geography from clearance_risk_score"
          - "increments PrivacyAssessment.version by 1"
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /open-data/privacy-assessments/{assessmentId}/decide with decision == CLEAR"
        actor: PrivacyReviewer
        preconditions:
          - "X-User-ID != assessor_user_id (segregation of duties)"
          - "clearance_risk_score < CLEARANCE_RISK_MAX"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "increments PrivacyAssessment.version by 1"
      - from: SUBMITTED
        to: BLOCKED
        trigger: "POST /open-data/privacy-assessments/{assessmentId}/decide with decision == BLOCK"
        actor: PrivacyReviewer
        preconditions:
          - "X-User-ID != assessor_user_id (segregation of duties)"
          - "block_reason supplied in the request body"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and block_reason"
          - "increments PrivacyAssessment.version by 1"
        note: "Branch sibling of SUBMITTED -> CLEARED with a divergent side-effect set (no clearance, blocking reason recorded)."
      - from: BLOCKED
        to: DRAFT
        trigger: "POST /open-data/privacy-assessments/{assessmentId}/reopen"
        actor: PrivacyReviewer
        preconditions:
          - "dataset.publication_status == SCREENING"
        side_effects:
          - "clears decided_by_user_id and block_reason, clears clearance_risk_score, sets risk_score = screening_risk_score"
          - "increments PrivacyAssessment.version by 1"
        note: "Revision loop: BLOCKED -> DRAFT -> SUBMITTED -> CLEARED is the standard remediation path."

  # ---- PublicationPipeline (SUSPENDED <-> ARMED cycle) ----
  - entity: PublicationPipeline
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DRAFT
        to: ARMED
        trigger: "POST /open-data/publication-pipelines/{pipelineId}/arm"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
          - "dataset.publication_status == PUBLISHED"
          - "department.compliance_posture != SUSPENDED"
          - "runner.status == ACTIVE"
          - "no PublicationPipeline with status IN {ARMED, SUSPENDED} on the same runner has an occupied interval intersecting this pipeline's window (see validations priority 23)"
          - "at most DEPARTMENT_WINDOW_CAP - 1 other ARMED pipelines of the same department cover any minute shared with this window (see validations priority 24)"
          - "department.credit_balance_units >= escrow_required_units"
        side_effects:
          - "escrows escrow_required_units: department.credit_balance_units -= escrow_required_units, department.credits_escrowed_units += escrow_required_units, pipeline.escrowed_credit_units = escrow_required_units"
          - "increments runner.armed_window_count by 1"
          - "increments PublicationPipeline.version by 1"
      - from: ARMED
        to: SUSPENDED
        trigger: "POST /open-data/publication-pipelines/{pipelineId}/suspend, or system cascade from report-failure (FAILURE_STREAK) or from Dataset entering UNDER_REMEDIATION (REMEDIATION_HOLD)"
        actor: PortalAdmin
        preconditions:
          - "suspend_reason is ADMIN_REQUEST for the manual trigger; FAILURE_STREAK or REMEDIATION_HOLD for the cascaded triggers"
        side_effects:
          - "escrowed_credit_units are retained (still counted in department.credits_escrowed_units)"
          - "every PipelineRun of this pipeline with status IN {SCHEDULED, RETRY_QUEUED} transitions to SKIPPED with skip_reason = PIPELINE_SUSPENDED"
          - "applies the STALE floor to dataset.currency_status and increments dataset.staleness_alert_count by 1"
          - "recomputes department.stale_dataset_count, risk_points and compliance_posture"
          - "increments PublicationPipeline.version by 1"
      - from: SUSPENDED
        to: ARMED
        trigger: "POST /open-data/publication-pipelines/{pipelineId}/resume"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
          - "dataset.publication_status == PUBLISHED (a dataset in UNDER_REMEDIATION cannot have its pipeline resumed)"
          - "runner.status == ACTIVE"
          - "the runner-window and department-window interval rules still hold"
        side_effects:
          - "sets consecutive_failure_count = 0 and clears suspend_reason"
          - "lifts the STALE floor and recomputes dataset.currency_status from the logical clock"
          - "recomputes department.stale_dataset_count, risk_points and compliance_posture"
          - "increments PublicationPipeline.version by 1"
        note: "Closes the ARMED -> SUSPENDED -> ARMED cycle."
      - from: DRAFT
        to: DECOMMISSIONED
        trigger: "POST /open-data/publication-pipelines/{pipelineId}/decommission, or supersession by a newer pipeline created for the same dataset"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id for the manual trigger"
        side_effects:
          - "no escrow exists yet, so no credit movement occurs and runner.armed_window_count is unchanged"
          - "increments PublicationPipeline.version by 1"
        note: "A DRAFT pipeline is superseded silently when its dataset gets a replacement configuration; the newer pipeline records superseded_pipeline_id."
      - from: ARMED
        to: DECOMMISSIONED
        trigger: "POST /open-data/publication-pipelines/{pipelineId}/decommission, or system cascade from Dataset retirement, or supersession by a newer pipeline created for the same dataset"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id for the manual trigger"
        side_effects:
          - "releases escrow: department.credit_balance_units += pipeline.escrowed_credit_units, department.credits_escrowed_units -= pipeline.escrowed_credit_units, pipeline.escrowed_credit_units = 0.00"
          - "every PipelineRun of this pipeline with status IN {SCHEDULED, RETRY_QUEUED} transitions to SKIPPED with skip_reason = PIPELINE_DECOMMISSIONED"
          - "decrements runner.armed_window_count by 1"
          - "increments PublicationPipeline.version by 1"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /open-data/publication-pipelines/{pipelineId}/decommission"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
        side_effects:
          - "releases escrow exactly as in ARMED -> DECOMMISSIONED"
          - "runner.armed_window_count is NOT decremented again (the ARMED -> SUSPENDED transition already released the count)"
          - "lifts the STALE floor and recomputes dataset.currency_status"
          - "increments PublicationPipeline.version by 1"

  # ---- PipelineRun (FAILED -> RETRY_QUEUED -> RUNNING cycle, branching outcomes) ----
  - entity: PipelineRun
    initial_state: SCHEDULED
    terminal_states: [SUCCEEDED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /open-data/pipeline-runs/{runId}/start"
        actor: PortalAdmin
        preconditions:
          - "pipeline.status == ARMED"
          - "runner.status == ACTIVE"
          - "logical_now >= scheduled_for_utc"
          - "dataset.embargo_until_utc IS NULL OR logical_now >= dataset.embargo_until_utc"
          - "dataset.publication_status == PUBLISHED"
        side_effects:
          - "sets started_at = logical_now"
          - "increments PipelineRun.version by 1"
      - from: RUNNING
        to: SUCCEEDED
        trigger: "POST /open-data/pipeline-runs/{runId}/report-success"
        actor: PortalAdmin
        preconditions:
          - "rows_ingested >= 0 supplied in the request body"
        side_effects:
          - "settles the run charge (compute_credits, alert_credits = 0.00, subtotal_credits, reliability_discount_pct, discount_credits, total_charge_credits) and draws it escrow-first, balance-second"
          - "creates DatasetVersion with change_type = SCHEDULED_REFRESH, source_run_id = run.id, row_count = rows_ingested, supersedes_version_id = the previously LIVE version, status = LIVE"
          - "sets the previously LIVE DatasetVersion to SUPERSEDED with superseded_at = logical_now"
          - "sets dataset.live_row_count = rows_ingested, dataset.last_published_at = logical_now, recomputes next_due_at, days_overdue and currency_status"
          - "sets pipeline.consecutive_failure_count = 0"
          - "recomputes department counters, risk_points and compliance_posture"
          - "increments PipelineRun.version, PublicationPipeline.version and Dataset.version by 1 each"
      - from: RUNNING
        to: FAILED
        trigger: "POST /open-data/pipeline-runs/{runId}/report-failure"
        actor: PortalAdmin
        preconditions:
          - "failure_code supplied in the request body"
        side_effects:
          - "hop 1: sets failure_code, alert_dispatched = true, rows_ingested stays 0, increments pipeline.consecutive_failure_count by 1 and copies it into consecutive_failure_index; settles the alert-only charge escrow-first, balance-second"
          - "hop 2: when pipeline.consecutive_failure_count >= FAILURE_STREAK_LIMIT the pipeline transitions ARMED -> SUSPENDED with suspend_reason = FAILURE_STREAK"
          - "hop 3: because the pipeline became SUSPENDED, dataset.currency_status takes the STALE floor and staleness_alert_count increments by 1"
          - "hop 4: because dataset.currency_status became STALE, department.stale_dataset_count, risk_points and compliance_posture are recomputed"
          - "increments PipelineRun.version by 1"
        note: "Branch sibling of RUNNING -> SUCCEEDED with a completely different side-effect set; head of cascade transitive_cascade/run_failure_streak_posture_chain."
      - from: FAILED
        to: RETRY_QUEUED
        trigger: "POST /open-data/pipeline-runs/{runId}/requeue"
        actor: PortalAdmin
        preconditions:
          - "pipeline.status == ARMED"
          - "new scheduled_for_utc >= logical_now and its minute-of-day falls inside the pipeline window"
        side_effects:
          - "overwrites scheduled_for_utc, clears failure_code and started_at, sets alert_dispatched = false"
          - "increments PipelineRun.version by 1"
      - from: RETRY_QUEUED
        to: RUNNING
        trigger: "POST /open-data/pipeline-runs/{runId}/start"
        actor: PortalAdmin
        preconditions:
          - "pipeline.status == ARMED"
          - "runner.status == ACTIVE"
          - "logical_now >= scheduled_for_utc"
        side_effects:
          - "sets started_at = logical_now"
          - "increments PipelineRun.version by 1"
        note: "Closes the FAILED -> RETRY_QUEUED -> RUNNING cycle."
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system cascade from pipeline suspension, decommission, or dataset retirement"
        actor: system
        preconditions:
          - "the owning pipeline left ARMED in the same request"
        side_effects:
          - "sets finished_at = logical_now and skip_reason = PIPELINE_SUSPENDED when the owning pipeline was suspended, PIPELINE_DECOMMISSIONED when it was decommissioned directly, DATASET_RETIRED when the cascade came from dataset retirement"
          - "no credits are charged"
          - "increments PipelineRun.version by 1"
      - from: RETRY_QUEUED
        to: SKIPPED
        trigger: "system cascade from pipeline suspension, decommission, or dataset retirement"
        actor: system
        preconditions:
          - "the owning pipeline left ARMED in the same request"
        side_effects:
          - "sets finished_at = logical_now and skip_reason = PIPELINE_SUSPENDED when the owning pipeline was suspended, PIPELINE_DECOMMISSIONED when it was decommissioned directly, DATASET_RETIRED when the cascade came from dataset retirement"
          - "increments PipelineRun.version by 1"

  # ---- DatasetVersion (append-only history with compensating retraction) ----
  - entity: DatasetVersion
    initial_state: LIVE
    terminal_states: [RETRACTED]
    transitions:
      - from: LIVE
        to: SUPERSEDED
        trigger: "POST /open-data/dataset-versions or POST /open-data/pipeline-runs/{runId}/report-success"
        actor: DataCoordinator
        preconditions:
          - "a newer version for the same dataset became LIVE in the same request"
        side_effects:
          - "sets superseded_at = logical_now"
          - "increments DatasetVersion.version by 1"
      - from: LIVE
        to: RETRACTED
        trigger: "POST /open-data/dataset-versions/{versionId}/retract"
        actor: PortalAdmin
        preconditions:
          - "version_index >= 2 (a predecessor exists)"
          - "the predecessor version has status == SUPERSEDED"
        side_effects:
          - "sets retracted_at = logical_now"
          - "restores the predecessor: status SUPERSEDED -> LIVE, superseded_at = null"
          - "sets dataset.live_row_count = predecessor.row_count and dataset.last_published_at = predecessor.published_at; version_index_high_water is NOT decreased"
          - "recomputes dataset.next_due_at, days_overdue and currency_status"
          - "increments DatasetVersion.version and Dataset.version by 1 each"
        note: "Compensating action for POST /open-data/dataset-versions; conserves the published-record ledger."
      - from: SUPERSEDED
        to: LIVE
        trigger: "POST /open-data/dataset-versions/{versionId}/retract applied to the successor"
        actor: PortalAdmin
        preconditions:
          - "the successor version transitioned LIVE -> RETRACTED in the same request"
        side_effects:
          - "clears superseded_at"
          - "increments DatasetVersion.version by 1"

  # ---- QualityIssue (intake -> correction workflow) ----
  - entity: QualityIssue
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /open-data/quality-issues/{issueId}/triage"
        actor: DataCoordinator
        preconditions:
          - "dataset.publication_status IN {PUBLISHED, UNDER_REMEDIATION}"
        side_effects:
          - "sets triaged_at = logical_now; sets triage_breached = true when logical_now > triage_due_at"
          - "increments QualityIssue.version by 1"
      - from: TRIAGED
        to: ACCEPTED
        trigger: "POST /open-data/quality-issues/{issueId}/decide with decision == ACCEPT"
        actor: DataCoordinator
        preconditions:
          - "department.compliance_posture != SUSPENDED"
        side_effects:
          - "hop 1: sets accepted_at = logical_now and correction_due_at = accepted_at + CORRECTION_SLA_DAYS[severity]; increments reporter.accepted_issue_count and sets reporter.last_credited_at = logical_now, recomputing reputation_score and vote_weight"
          - "hop 2: when severity == CRITICAL AND category == PRIVACY AND dataset.publication_status == PUBLISHED, the dataset transitions PUBLISHED -> UNDER_REMEDIATION"
          - "hop 3: because the dataset left PUBLISHED, its ARMED pipeline transitions to SUSPENDED with suspend_reason = REMEDIATION_HOLD"
          - "hop 4: because the pipeline became SUSPENDED, its SCHEDULED runs transition to SKIPPED with skip_reason = PIPELINE_SUSPENDED and dataset.currency_status takes the STALE floor"
          - "recomputes department counters, risk_points and compliance_posture"
          - "increments QualityIssue.version by 1"
        note: "Head of cascade transitive_cascade/issue_accept_privacy_remediation_chain (depth 4)."
      - from: TRIAGED
        to: REJECTED
        trigger: "POST /open-data/quality-issues/{issueId}/decide with decision == REJECT"
        actor: DataCoordinator
        preconditions:
          - "reject_reason supplied in the request body"
        side_effects:
          - "sets reject_reason; increments reporter.rejected_issue_count and sets reporter.last_credited_at = logical_now, recomputing reputation_score, vote_weight and status (ACTIVE -> THROTTLED once rejected_issue_count - accepted_issue_count >= THROTTLE_NET_REJECTS)"
          - "no dataset or pipeline side effects fire"
          - "increments QualityIssue.version by 1"
        note: "Branch sibling of TRIAGED -> ACCEPTED with a disjoint side-effect set."
      - from: ACCEPTED
        to: CORRECTED
        trigger: "POST /open-data/quality-issues/{issueId}/link-correction"
        actor: DataCoordinator
        preconditions:
          - "X-User-ID == dataset.department_id"
          - "the referenced DatasetVersion has dataset_id == issue.dataset_id, change_type == CORRECTION and status == LIVE"
        side_effects:
          - "sets resolution_version_id and the version's correction_issue_id; clears correction_breached"
          - "when the dataset is UNDER_REMEDIATION and no other CRITICAL/PRIVACY issue is ACCEPTED, the dataset transitions UNDER_REMEDIATION -> PUBLISHED"
          - "recomputes department.overdue_correction_count, risk_points and compliance_posture"
          - "increments QualityIssue.version by 1"
      - from: CORRECTED
        to: CLOSED
        trigger: "POST /open-data/quality-issues/{issueId}/close"
        actor: PortalAdmin
        preconditions:
          - "resolution_version_id IS NOT NULL"
        side_effects:
          - "increments QualityIssue.version by 1"

  # ---- DatasetRequest (UNDER_REVIEW -> OPEN deferral cycle) ----
  - entity: DatasetRequest
    initial_state: OPEN
    terminal_states: [DECLINED, FULFILLED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /open-data/dataset-requests/{requestId}/review"
        actor: PortalAdmin
        preconditions:
          - "weighted_vote_total >= REVIEW_VOTE_MIN"
        side_effects:
          - "sets decision_note"
          - "increments DatasetRequest.version by 1"
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /open-data/dataset-requests/{requestId}/decide with decision == DEFER"
        actor: PortalAdmin
        preconditions:
          - "decision_note supplied in the request body"
        side_effects:
          - "sets decision_note; votes are preserved so the request can be reviewed again once more demand accrues"
          - "increments DatasetRequest.version by 1"
        note: "Deferral cycle OPEN -> UNDER_REVIEW -> OPEN."
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /open-data/dataset-requests/{requestId}/decide with decision == ACCEPT"
        actor: PortalAdmin
        preconditions:
          - "decision_note supplied in the request body"
        side_effects:
          - "increments DatasetRequest.version by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /open-data/dataset-requests/{requestId}/decide with decision == DECLINE"
        actor: PortalAdmin
        preconditions:
          - "decision_note supplied in the request body"
        side_effects:
          - "increments DatasetRequest.version by 1"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "POST /open-data/dataset-requests/{requestId}/fulfill"
        actor: PortalAdmin
        preconditions:
          - "the referenced dataset has publication_status IN {SCREENING, READY, PUBLISHED}"
        side_effects:
          - "sets linked_dataset_id"
          - "recomputes the linked dataset's community_pressure input and its priority_score under the dataset's current priority_score_variant"
          - "increments DatasetRequest.version and Dataset.version by 1 each"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: version-create-stale-dataset
    parent_entity: Dataset
    write_endpoint: "POST /open-data/dataset-versions"
    occ_field: "expected_dataset_version"
    description: |
      Creating a DatasetVersion against a Dataset whose version has advanced since the client last
      observed it is rejected. A new version legitimately supersedes the current LIVE one, so a
      writer holding a stale view of the dataset would silently supersede a version it never saw.
    error_id: ERR_STALE_DATASET_VERSION
    http_status: 412
  - rule_id: pipeline-create-stale-dataset
    parent_entity: Dataset
    write_endpoint: "POST /open-data/publication-pipelines"
    occ_field: "expected_dataset_version"
    description: |
      Creating a PublicationPipeline against a Dataset whose version has advanced since the client
      last observed it is rejected. Creating a pipeline legitimately decommissions the dataset's
      previous non-DECOMMISSIONED pipeline (recorded as superseded_pipeline_id), so a stale writer
      would discard a configuration it never observed.
    error_id: ERR_STALE_DATASET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dataset_priority_score
    trigger: "On POST /open-data/datasets (creation, AS_DECLARED), on Dataset INVENTORIED -> SCREENING (AS_DECLARED), on Dataset READY -> PUBLISHED (AS_OBSERVED), on POST /open-data/ops-run step 3 for every PUBLISHED dataset (AS_OBSERVED), and on DatasetRequest ACCEPTED -> FULFILLED (current variant)"
    algorithm: weighted_scoring
    formula: |
      # community_pressure: demand transferred from fulfilled community requests
      linked_requests = DatasetRequest rows where linked_dataset_id == dataset.id
                        AND status IN {ACCEPTED, FULFILLED}          # explicit status filter
      vote_weight_total = sum(r.weighted_vote_total for r in linked_requests)   # no time window; all such rows
      community_pressure = min(COMMUNITY_CAP, COMMUNITY_VOTE_MULTIPLIER * vote_weight_total)

      # demand term depends on the variant (see variants below)
      demand_term = public_demand_score            # AS_DECLARED
                  | observed_demand_score          # AS_OBSERVED  (== engagement_index)

      priority_score = round_half_up(
            W_DEMAND    * demand_term
          + W_POLICY    * policy_value_score
          + W_COMMUNITY * community_pressure, 2)

      priority_tier = TIER_1 if priority_score >= TIER_1_MIN
                      else TIER_2 if priority_score >= TIER_2_MIN
                      else TIER_3
    input_set: "The dataset's own declared scores plus DatasetRequest rows with status IN {ACCEPTED, FULFILLED} linked to this dataset; requests in OPEN, UNDER_REVIEW or DECLINED contribute nothing."
    constants:
      W_DEMAND: 0.45
      W_POLICY: 0.35
      W_COMMUNITY: 0.20
      COMMUNITY_VOTE_MULTIPLIER: 4
      COMMUNITY_CAP: 100
      TIER_1_MIN: 75.00
      TIER_2_MIN: 50.00
    precision: "2 decimal places, round_half_up, applied once to the weighted sum (never to the individual terms)"
    variants:
      - name: AS_DECLARED
        when: "Dataset.publication_status IN {INVENTORIED, SCREENING, READY} — inventory prioritisation before the catalog page has traffic"
        difference: "demand_term = public_demand_score, the coordinator-declared figure"
      - name: AS_OBSERVED
        when: "Dataset.publication_status IN {PUBLISHED, UNDER_REMEDIATION} — post-publication prioritisation"
        difference: "demand_term = observed_demand_score (== engagement_index). Identical stored inputs therefore yield a different priority_score and possibly a different priority_tier once the dataset is published; the RESTRICTED publication gate is evaluated against the AS_DECLARED tier that is still stored when the publish request starts."

  - name: reidentification_risk_score
    trigger: "SCREENING variant on POST /open-data/privacy-assessments (creation); CLEARANCE variant on PrivacyAssessment DRAFT -> SUBMITTED"
    algorithm: threshold
    formula: |
      qi_factor  = min(QI_CAP, QI_UNIT * declared_quasi_identifier_count)
      cell_size  = declared_smallest_cell_size   # SCREENING variant
                 | verified_smallest_cell_size   # CLEARANCE variant
      cell_factor = CELL_FACTOR_LOW    if cell_size >= CELL_HIGH_MIN      # >= 11 -> 0.5
                    else CELL_FACTOR_MID if cell_size >= CELL_MID_MIN     # 5..10 -> 1.0
                    else CELL_FACTOR_HIGH                                 # 1..4  -> 2.0
      population_factor = 1.00                                            # SCREENING variant always
                        | (SMALL_POP_FACTOR if population_size < SMALL_POP_MIN else 1.00)   # CLEARANCE
      sensitivity_multiplier = SENSITIVITY_MULTIPLIER[dataset.sensitivity_class]

      risk = min(RISK_CAP, round_half_up(
                 qi_factor * cell_factor * population_factor * sensitivity_multiplier, 2))

      k_anonymity_k          = cell_size
      aggregation_required   = risk >= AGGREGATION_REQUIRED_MIN
      min_aggregation_geography = COUNTY if risk >= GEO_COUNTY_MIN
                                  else TRACT if risk >= AGGREGATION_REQUIRED_MIN
                                  else BLOCK
    input_set: "Only the assessment's own declared/verified fields and its dataset's sensitivity_class. Other assessments on the same dataset (status BLOCKED) are ignored."
    constants:
      QI_UNIT: 8
      QI_CAP: 40
      CELL_HIGH_MIN: 11
      CELL_MID_MIN: 5
      CELL_FACTOR_LOW: 0.5
      CELL_FACTOR_MID: 1.0
      CELL_FACTOR_HIGH: 2.0
      SMALL_POP_MIN: 5000
      SMALL_POP_FACTOR: 1.25
      SENSITIVITY_MULTIPLIER: { PUBLIC: 0.8, SENSITIVE: 1.0, RESTRICTED: 1.4 }
      RISK_CAP: 100.00
      AGGREGATION_REQUIRED_MIN: 35.00
      GEO_COUNTY_MIN: 60.00
      CLEARANCE_RISK_MAX: 60.00
      GEO_RANK: { BLOCK: 1, TRACT: 2, COUNTY: 3 }
    precision: "2 decimal places, round_half_up applied once to the product, then capped at RISK_CAP"
    variants:
      - name: SCREENING
        when: "Computed at assessment creation, stored in screening_risk_score; drives risk_score while status == DRAFT"
        difference: "Uses declared_smallest_cell_size and forces population_factor = 1.00 (the screening pass deliberately ignores population size)"
      - name: CLEARANCE
        when: "Computed at DRAFT -> SUBMITTED, stored in clearance_risk_score; drives risk_score from SUBMITTED onwards and gates SUBMITTED -> CLEARED"
        difference: "Uses verified_smallest_cell_size measured on the real extract AND applies SMALL_POP_FACTOR when population_size < SMALL_POP_MIN. With identical stored inputs the two variants can straddle AGGREGATION_REQUIRED_MIN, flipping aggregation_required from false to true."

  - name: metadata_completeness_score
    trigger: "On POST /open-data/metadata-records, on PATCH /open-data/metadata-records/{metadataRecordId} (including the RETURNED -> DRAFT transition), and on MetadataRecord DRAFT -> SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      c1 = min(1, data_dictionary_field_count / dataset.column_count)     # data dictionary coverage
      c2 = min(1, provenance_detail_lines / PROVENANCE_TARGET_LINES)      # provenance depth
      c3 = 1 if contact_email contains "@" else 0                        # contact information
      c4 = 1 if declared_update_frequency == dataset.update_frequency else 0
      c5 = 1 if license_id resolves to a LicenseTerm with retired == false else 0
      c6 = min(1, attribution_element_count / ATTRIBUTION_ELEMENTS_TOTAL)

      # PINNED ROUNDING ORDER — round EACH weighted contribution to 2 decimals FIRST, then sum,
      # then round the sum. Summing the unrounded contributions and rounding once at the end is
      # WRONG and can differ by 0.01, which is enough to flip the METADATA_ACCEPT_MIN gate.
      component_contributions = [ round_half_up(W[i] * c[i] * 100, 2) for i in 1..6 ]
      completeness_score      = round_half_up(sum(component_contributions), 2)
    input_set: "The metadata record's own fields, its dataset's column_count and update_frequency, and its LicenseTerm's retired flag."
    constants:
      W: [0.30, 0.20, 0.15, 0.15, 0.10, 0.10]
      PROVENANCE_TARGET_LINES: 24
      ATTRIBUTION_ELEMENTS_TOTAL: 6
      METADATA_ACCEPT_MIN: 85.00
    precision: "Two-stage: each of the six contributions is rounded to 2 decimals half-up, then their sum is rounded to 2 decimals half-up. Worked trap: column_count=9, data_dictionary_field_count=7, provenance_detail_lines=16, attribution_element_count=5, c3=c4=c5=1 gives contributions [23.33, 13.33, 15.00, 15.00, 10.00, 8.33] -> 84.99 (REJECTED), whereas sum-then-round yields 85.00 (would be ACCEPTED)."

  - name: pipeline_run_settlement
    trigger: "On PipelineRun RUNNING -> SUCCEEDED and on PipelineRun RUNNING -> FAILED"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and strictly sequential. The reliability tier looks circular
      # ("the discount depends on the charge, the charge depends on the discount"); it is resolved
      # by keying the tier on the PRE-DISCOUNT subtotal and never re-evaluating it afterwards.
      step 1: compute_credits = ceil(rows_ingested / ROWS_PER_COMPUTE_UNIT) * COMPUTE_UNIT_CREDITS
                                # rows_ingested is 0 for FAILED runs -> compute_credits = 0.00
      step 2: alert_credits   = ALERT_FEE_CREDITS if alert_dispatched else 0.00
      step 3: subtotal_credits = compute_credits + alert_credits
      step 4: reliability_discount_pct =
                  DISCOUNT_TIER_A_PCT if subtotal_credits >= DISCOUNT_TIER_A_MIN     # >= 40 -> 0.10
                  else DISCOUNT_TIER_B_PCT if subtotal_credits >= DISCOUNT_TIER_B_MIN # >= 20 -> 0.05
                  else 0.00
      step 5: discount_credits = round_half_up(subtotal_credits * reliability_discount_pct, 2)
      step 6: total_charge_credits = round_half_up(subtotal_credits - discount_credits, 2)
              # NEVER re-tier on total_charge_credits: a subtotal of exactly 40 settles at 36.00,
              # not at 38.00.
      # waterfall draw, escrow bucket first:
      escrow_drawn_units  = min(pipeline.escrowed_credit_units, total_charge_credits)
      balance_drawn_units = total_charge_credits - escrow_drawn_units
      pipeline.escrowed_credit_units      -= escrow_drawn_units
      department.credits_escrowed_units   -= escrow_drawn_units
      department.credit_balance_units     -= balance_drawn_units
      department.credits_consumed_units   += total_charge_credits
    input_set: "The single run being settled. Prior runs of the same pipeline affect only consecutive_failure_count, never this charge."
    constants:
      ROWS_PER_COMPUTE_UNIT: 10000
      COMPUTE_UNIT_CREDITS: 4
      ALERT_FEE_CREDITS: 3
      DISCOUNT_TIER_A_MIN: 40
      DISCOUNT_TIER_A_PCT: 0.10
      DISCOUNT_TIER_B_MIN: 20
      DISCOUNT_TIER_B_PCT: 0.05
      FAILURE_STREAK_LIMIT: 3
    precision: "2 decimal places, round_half_up at steps 5 and 6 only; compute_credits and alert_credits are exact integers expressed with 2 decimals"

  - name: pipeline_credit_escrow
    trigger: "On POST /open-data/publication-pipelines (escrow_required_units) and on PublicationPipeline DRAFT -> ARMED (the escrow itself)"
    algorithm: waterfall_allocation
    formula: |
      runs_per_month        = ceil(ESCROW_HORIZON_DAYS / CADENCE_DAYS[cadence])
      escrow_required_units = min(ESCROW_CAP_UNITS, runs_per_month * ESCROW_PER_RUN_UNITS)
      # arming moves credits between buckets without creating or destroying any:
      #   credit_balance_units -= escrow_required_units
      #   credits_escrowed_units += escrow_required_units
      # decommissioning reverses it exactly, using the pipeline's CURRENT escrowed_credit_units
      # (which run settlements may already have drawn down).
      # INVARIANT (must hold after every request):
      #   credit_balance_units + credits_escrowed_units + credits_consumed_units == credits_issued_units
    input_set: "The pipeline's cadence only; window length and runner choice do not affect the escrow."
    constants:
      ESCROW_HORIZON_DAYS: 30
      ESCROW_PER_RUN_UNITS: 2
      ESCROW_CAP_UNITS: 60
      CADENCE_DAYS: { DAILY: 1, WEEKLY: 7, MONTHLY: 30, QUARTERLY: 91, ANNUAL: 365 }
    precision: "2 decimal places; all four department credit buckets are 2-decimal numbers"

  - name: dataset_currency_status
    trigger: "On Dataset READY -> PUBLISHED, on PipelineRun RUNNING -> SUCCEEDED, on POST /open-data/dataset-versions, on POST /open-data/dataset-versions/{versionId}/retract, on every PublicationPipeline transition into or out of SUSPENDED, and on POST /open-data/ops-run step 1"
    algorithm: threshold
    formula: |
      next_due_at = null if update_frequency == IRREGULAR or last_published_at IS NULL
                    else last_published_at + CADENCE_DAYS[update_frequency] days
      days_overdue = 0 if next_due_at IS NULL or logical_now <= next_due_at
                     else floor((logical_now - next_due_at) / 86400 seconds)
      grace = GRACE_DAYS[priority_tier]

      clock_status = CURRENT  if next_due_at IS NULL or logical_now <= next_due_at
                     else AGING    if days_overdue <= grace
                     else STALE    if days_overdue <= 2 * grace
                     else (BREACHED if high_value_committed else STALE)

      # SUSPENDED-pipeline floor: an unhealthy automation pipeline makes the dataset stale
      # regardless of the clock.
      pipeline_floor = STALE if any PublicationPipeline of this dataset has status == SUSPENDED
                       else CURRENT
      currency_status = max_severity(clock_status, pipeline_floor)      # severity order below
    input_set: "The dataset itself plus its PublicationPipeline rows with status == SUSPENDED. Pipelines in DRAFT or DECOMMISSIONED impose no floor."
    constants:
      SEVERITY_ORDER: [CURRENT, AGING, STALE, BREACHED]
      GRACE_DAYS: { TIER_1: 2, TIER_2: 7, TIER_3: 14 }
      CADENCE_DAYS: { DAILY: 1, WEEKLY: 7, MONTHLY: 30, QUARTERLY: 91, ANNUAL: 365 }
    precision: "Integer days; days_overdue uses floor, and the AGING boundary is inclusive (days_overdue == grace is still AGING, days_overdue == grace + 1 is STALE)"

  - name: member_reputation_score
    trigger: "On GET /open-data/members/{memberId}, on QualityIssue TRIAGED -> ACCEPTED, on QualityIssue TRIAGED -> REJECTED, on showcase approval (POST /open-data/datasets/{datasetId}/showcase-apps/{showcaseLabel}/decide), and on POST /open-data/dataset-requests/{requestId}/votes (weight snapshot)"
    algorithm: decay_function
    formula: |
      raw = REPUTATION_BASE
            + ACCEPT_POINTS   * accepted_issue_count
            - REJECT_POINTS   * rejected_issue_count
            + SHOWCASE_POINTS * approved_showcase_count
      decay_epochs = max(0, floor((logical_now - last_credited_at) / (REPUTATION_DECAY_PERIOD_DAYS days)))
      decayed = REPUTATION_BASE + (raw - REPUTATION_BASE) * (DECAY_FACTOR ** decay_epochs)
      reputation_score = round_half_up(min(100, max(0, decayed)), 2)

      vote_weight = 3 if reputation_score >= WEIGHT_HIGH_MIN
                    else 2 if reputation_score >= WEIGHT_MID_MIN
                    else 1
      status = THROTTLED if (rejected_issue_count - accepted_issue_count) >= THROTTLE_NET_REJECTS
               else ACTIVE
    input_set: "The member's own counters. accepted_issue_count counts QualityIssue rows with status IN {ACCEPTED, CORRECTED, CLOSED}; rejected_issue_count counts status == REJECTED; issues still SUBMITTED or TRIAGED count in neither."
    constants:
      REPUTATION_BASE: 50
      ACCEPT_POINTS: 6
      REJECT_POINTS: 4
      SHOWCASE_POINTS: 2
      DECAY_FACTOR: 0.80
      REPUTATION_DECAY_PERIOD_DAYS: 30
      WEIGHT_HIGH_MIN: 70.00
      WEIGHT_MID_MIN: 40.00
      THROTTLE_NET_REJECTS: 3
    precision: "2 decimal places, round_half_up applied once after clamping; the decay exponent is an integer count of whole 30-day epochs"

  - name: dataset_engagement_index
    trigger: "On POST /open-data/datasets/{datasetId}/usage-report, on Dataset READY -> PUBLISHED, on GET /open-data/datasets/{datasetId}/analytics, and on POST /open-data/ops-run step 3"
    algorithm: aggregation
    formula: |
      # source: dataset.usage_epochs; selection: the 3 rows with the highest epoch_index
      # (epoch_index is unique per dataset, so the ordering is total and no tie-break is needed;
      # if two rows ever tied, recorded_at ASC would decide). Window is inclusive of the newest row.
      selected = usage_epochs sorted by epoch_index DESC, take first EPOCH_WINDOW rows
      epoch_value(e) = API_WEIGHT * e.api_call_count + DOWNLOAD_WEIGHT * e.download_count
      weighted = sum( EPOCH_WEIGHTS[i] * epoch_value(selected[i]) for i in 0..len(selected)-1 )
                 # PINNED: weights are NOT renormalised when fewer than EPOCH_WINDOW rows exist —
                 # a dataset with a single epoch keeps only the 0.50 weight, the other 0.50 is lost.
      engagement_index      = min(100.00, round_half_up(weighted / ENGAGEMENT_NORMALIZER, 2))
      observed_demand_score = engagement_index
      # Empty set: usage_epochs == [] -> weighted = 0 -> engagement_index = 0.00
    input_set: "Only dataset.usage_epochs entries; every entry ever recorded is eligible, but only the three highest epoch_index rows contribute."
    constants:
      EPOCH_WINDOW: 3
      EPOCH_WEIGHTS: [0.50, 0.30, 0.20]
      API_WEIGHT: 0.60
      DOWNLOAD_WEIGHT: 0.40
      ENGAGEMENT_NORMALIZER: 50
    precision: "2 decimal places, round_half_up applied once after dividing by ENGAGEMENT_NORMALIZER, then capped at 100.00"

  - name: department_compliance_posture
    trigger: "On every transition that changes a dataset's currency_status or publication_status, on QualityIssue correction breach detection, and on POST /open-data/ops-run step 5 (departments processed in created_at ASC order, AFTER all datasets have been recomputed in step 1)"
    algorithm: aggregation
    formula: |
      breached_dataset_count    = count(Dataset where department_id == dept.id
                                        AND currency_status == BREACHED
                                        AND publication_status IN {PUBLISHED, UNDER_REMEDIATION})
      stale_dataset_count       = count(Dataset where department_id == dept.id
                                        AND currency_status == STALE
                                        AND publication_status IN {PUBLISHED, UNDER_REMEDIATION})
      remediation_dataset_count = count(Dataset where department_id == dept.id
                                        AND publication_status == UNDER_REMEDIATION)
      overdue_correction_count  = count(QualityIssue where dataset.department_id == dept.id
                                        AND status == ACCEPTED AND correction_breached == true)

      risk_points = BREACHED_WEIGHT    * breached_dataset_count
                  + STALE_WEIGHT       * stale_dataset_count
                  + REMEDIATION_WEIGHT * remediation_dataset_count
                  + OVERDUE_WEIGHT     * overdue_correction_count

      compliance_posture = SUSPENDED  if risk_points >= SUSPENDED_MIN
                           else RESTRICTED if risk_points >= RESTRICTED_MIN
                           else OPEN
    input_set: "Datasets of this department with publication_status IN {PUBLISHED, UNDER_REMEDIATION} (RETIRED and pre-publication datasets never contribute), plus their ACCEPTED QualityIssue rows flagged correction_breached."
    constants:
      BREACHED_WEIGHT: 3
      STALE_WEIGHT: 2
      REMEDIATION_WEIGHT: 2
      OVERDUE_WEIGHT: 1
      RESTRICTED_MIN: 2
      SUSPENDED_MIN: 6
    precision: "Integer risk_points; boundaries are inclusive (risk_points == 2 is RESTRICTED, risk_points == 1 is OPEN)"

  - name: license_reuse_permission_class
    trigger: "On POST /open-data/licenses"
    algorithm: constraint_propagation
    formula: |
      # FIRST MATCH WINS in exactly this order — the clauses overlap deliberately.
      if attribution_required == false and commercial_use_allowed == true and share_alike == false:
          UNRESTRICTED
      elif attribution_required == true and commercial_use_allowed == true and share_alike == false:
          ATTRIBUTION
      elif share_alike == true:
          COPYLEFT                # wins over NONCOMMERCIAL even when commercial_use_allowed == false
      else:
          NONCOMMERCIAL
    input_set: "The license's own three boolean flags."
    constants: {}
    precision: "Enumerated output; no numeric rounding"

  - name: request_demand_signal
    trigger: "On POST /open-data/dataset-requests/{requestId}/votes"
    algorithm: aggregation
    formula: |
      # votes[] is append-only; each entry snapshots the voter's vote_weight at cast time and is
      # never re-weighted when the member's reputation later changes.
      weighted_vote_total = sum(v.weight for v in votes)          # all entries, no time window
      demand_signal       = round_half_up(min(100, DEMAND_SIGNAL_MULTIPLIER * weighted_vote_total), 2)
      # gate for OPEN -> UNDER_REVIEW: weighted_vote_total >= REVIEW_VOTE_MIN
    input_set: "Every entry in this request's votes array; a member may appear at most once."
    constants:
      DEMAND_SIGNAL_MULTIPLIER: 5
      REVIEW_VOTE_MIN: 4
    precision: "2 decimal places for demand_signal; weighted_vote_total is an integer"

  - name: quality_issue_sla_clock
    trigger: "On POST /open-data/quality-issues (triage_due_at), on QualityIssue TRIAGED -> ACCEPTED (correction_due_at), on POST /open-data/quality-issues/{issueId}/triage and /link-correction (breach flags), and on POST /open-data/ops-run step 4"
    algorithm: chronological
    formula: |
      triage_due_at     = created_at + TRIAGE_SLA_HOURS[severity] hours
      correction_due_at = accepted_at + CORRECTION_SLA_DAYS[severity] days     # null until accepted
      # breach flags are LATCHING: once set true they are never cleared by a later sweep,
      # and they are evaluated with a strictly-greater comparison (equality is on time).
      triage_breached     = true when the SUBMITTED -> TRIAGED transition happens with
                            logical_now > triage_due_at, or when an ops-run observes a
                            still-SUBMITTED issue with logical_now > triage_due_at
      correction_breached = true when an ops-run observes a still-ACCEPTED issue with
                            logical_now > correction_due_at; cleared only by the
                            ACCEPTED -> CORRECTED transition itself
    input_set: "The issue's own severity and timestamps; ops-run step 4 walks QualityIssue rows in created_at ASC order and only inspects status IN {SUBMITTED, ACCEPTED}."
    constants:
      TRIAGE_SLA_HOURS: { LOW: 168, MEDIUM: 72, HIGH: 24, CRITICAL: 8 }
      CORRECTION_SLA_DAYS: { LOW: 90, MEDIUM: 30, HIGH: 14, CRITICAL: 5 }
    precision: "Whole hours and whole days; both comparisons are strict (logical_now == due_at is NOT a breach)"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles (Anonymous requires no X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path-parameterised resource resolves, validated left to right (dataset before showcaseLabel)"
    error_id: "ERR_DATASET_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_RUNNER_NOT_FOUND | ERR_METADATA_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_PIPELINE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_VERSION_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_SHOWCASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: business_constraint
    check: "Request body schema: required fields present, enum members valid, integers/numbers inside declared ranges (0 <= scores <= 100, 0 <= window_start_minute <= 1439, 1 <= window_duration_minutes <= 480, 0 <= attribution_element_count <= 6, credit_units > 0, limit 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and all list endpoints with pagination"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_DEPARTMENT_NOT_FOUND | ERR_DATASET_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_RUNNER_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_VERSION_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_PIPELINE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /datasets, POST /metadata-records, POST /privacy-assessments, POST /publication-pipelines, POST /pipeline-runs, POST /dataset-versions, POST /quality-issues, POST /dataset-requests, POST /dataset-requests/{requestId}/votes, POST /dataset-requests/{requestId}/fulfill, POST /quality-issues/{issueId}/link-correction, POST /datasets/{datasetId}/showcase-apps"
  - priority: 6
    category: auth
    check: "DataCoordinator scope: X-User-ID equals the target dataset's department_id (for POST /datasets, equals the body department_id)"
    error_id: ERR_DEPARTMENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every DataCoordinator-only endpoint"
  - priority: 7
    category: auth
    check: "CommunityMember self-scope: X-User-ID equals the body reporter_member_id / requester_member_id / member_id / submitter_member_id"
    error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /quality-issues, POST /dataset-requests, POST /dataset-requests/{requestId}/votes, POST /datasets/{datasetId}/showcase-apps"
  - priority: 8
    category: auth
    check: "Segregation of duties: on a privacy decision, X-User-ID != assessment.assessor_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /privacy-assessments/{assessmentId}/decide"
  - priority: 9
    category: business_referential
    check: "Scalar uniqueness: Department.code, LicenseTerm.code, Dataset.slug, CommunityMember.email"
    error_id: "ERR_DUPLICATE_DEPARTMENT_CODE | ERR_DUPLICATE_LICENSE_CODE | ERR_DUPLICATE_DATASET_SLUG | ERR_DUPLICATE_MEMBER_EMAIL"
    http_status: 409
    applies_to: "POST /departments, POST /licenses, POST /datasets, POST /members/register"
  - priority: 10
    category: business_referential
    check: "Per-dataset singletons: at most one MetadataRecord with status IN {DRAFT, SUBMITTED, ACCEPTED} and at most one PrivacyAssessment with status IN {DRAFT, SUBMITTED, CLEARED}"
    error_id: "ERR_METADATA_RECORD_EXISTS | ERR_ASSESSMENT_EXISTS"
    http_status: 409
    applies_to: "POST /metadata-records, POST /privacy-assessments"
  - priority: 11
    category: business_referential
    check: "Collection-member uniqueness: usage epoch_index unique per dataset, showcase label unique per dataset, one vote per member per request"
    error_id: "ERR_DUPLICATE_USAGE_EPOCH | ERR_DUPLICATE_SHOWCASE_LABEL | ERR_DUPLICATE_VOTE"
    http_status: 409
    applies_to: "POST /datasets/{datasetId}/usage-report, POST /datasets/{datasetId}/showcase-apps, POST /dataset-requests/{requestId}/votes"
  - priority: 12
    category: state
    check: "Optimistic concurrency: expected_dataset_version equals the current Dataset.version"
    error_id: ERR_STALE_DATASET_VERSION
    http_status: 412
    applies_to: "POST /dataset-versions, POST /publication-pipelines"
  - priority: 13
    category: state
    check: "The target resource is in a state from which the requested transition exists (including terminal-state lockdown: RETIRED datasets, CLOSED/REJECTED issues, DECOMMISSIONED pipelines, SUCCEEDED/SKIPPED runs, RETRACTED versions, DECLINED/FULFILLED requests accept no further transitions)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_DATASET_NOT_PUBLISHED | ERR_PIPELINE_NOT_ARMED | ERR_VERSION_NOT_LIVE"
    http_status: 409
    applies_to: "every state-changing endpoint"
  - priority: 14
    category: state
    check: "Cross-entity readiness gates: mark-ready requires an ACCEPTED MetadataRecord and a CLEARED PrivacyAssessment for the dataset; publish requires the MetadataRecord still ACCEPTED"
    error_id: "ERR_METADATA_NOT_ACCEPTED | ERR_PRIVACY_CLEARANCE_REQUIRED"
    http_status: 409
    applies_to: "POST /datasets/{datasetId}/mark-ready, POST /datasets/{datasetId}/publish"
  - priority: 15
    category: business_safety
    check: "Aggregation requirement: when the dataset's CLEARED PrivacyAssessment has aggregation_required == true, GEO_RANK[dataset.aggregation_geography] >= GEO_RANK[assessment.min_aggregation_geography] (a null aggregation_geography ranks 0)"
    error_id: ERR_AGGREGATION_UNMET
    http_status: 422
    applies_to: "POST /datasets/{datasetId}/mark-ready, POST /datasets/{datasetId}/publish"
  - priority: 16
    category: business_safety
    check: "Clearance ceiling: a privacy assessment whose clearance_risk_score >= CLEARANCE_RISK_MAX cannot be CLEARED"
    error_id: ERR_REIDENTIFICATION_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /privacy-assessments/{assessmentId}/decide"
  - priority: 17
    category: business_safety
    check: "A submitted assessment requires verified_smallest_cell_size to have been measured"
    error_id: ERR_VERIFIED_CELL_SIZE_MISSING
    http_status: 422
    applies_to: "POST /privacy-assessments/{assessmentId}/submit"
  - priority: 18
    category: business_referential
    check: "The LicenseTerm backing the metadata record has retired == false"
    error_id: ERR_LICENSE_RETIRED
    http_status: 409
    applies_to: "POST /metadata-records/{metadataRecordId}/decide, POST /datasets/{datasetId}/publish"
  - priority: 19
    category: business_temporal
    check: "Embargo: logical_now >= dataset.embargo_until_utc when embargo_until_utc is set"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /datasets/{datasetId}/publish, POST /pipeline-runs/{runId}/start"
  - priority: 20
    category: business_temporal
    check: "Run schedule sanity: scheduled_for_utc >= logical_now at creation/requeue, and logical_now >= scheduled_for_utc at start"
    error_id: ERR_RUN_SCHEDULE_INVALID
    http_status: 422
    applies_to: "POST /pipeline-runs, POST /pipeline-runs/{runId}/requeue, POST /pipeline-runs/{runId}/start"
  - priority: 21
    category: business_temporal
    check: "The run's minute-of-day falls inside the pipeline's half-open window [window_start_minute, window_end_minute)"
    error_id: ERR_RUN_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /pipeline-runs, POST /pipeline-runs/{runId}/requeue"
  - priority: 22
    category: business_temporal
    check: "Window geometry: window_start_minute + window_duration_minutes <= 1440 (windows may not wrap past midnight UTC)"
    error_id: ERR_WINDOW_WRAPS_MIDNIGHT
    http_status: 422
    applies_to: "POST /publication-pipelines"
  - priority: 23
    category: business_constraint
    check: "Runner exclusivity (half-open interval plus trailing cooldown buffer): for every other PublicationPipeline on the same runner with status IN {ARMED, SUSPENDED}, the candidate's own interval [window_start_minute, window_end_minute) must not intersect the occupant's occupied interval [window_start_minute, window_end_minute + runner.cooldown_minutes). Exact-boundary adjacency after the buffer is allowed."
    error_id: ERR_RUNNER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /publication-pipelines/{pipelineId}/arm, POST /publication-pipelines/{pipelineId}/resume"
  - priority: 24
    category: business_constraint
    check: "Department steward capacity (closed interval, aggregate capacity): counting closed intervals [window_start_minute, window_end_minute] of the same department's ARMED pipelines, no minute may be covered by more than DEPARTMENT_WINDOW_CAP = 2 windows including the candidate. Touching endpoints DO collide under this rule."
    error_id: ERR_DEPARTMENT_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /publication-pipelines/{pipelineId}/arm, POST /publication-pipelines/{pipelineId}/resume"
  - priority: 25
    category: business_constraint
    check: "The pipeline's IngestRunner has status == ACTIVE"
    error_id: ERR_RUNNER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /publication-pipelines/{pipelineId}/arm, POST /publication-pipelines/{pipelineId}/resume, POST /pipeline-runs/{runId}/start"
  - priority: 26
    category: business_constraint
    check: "Metadata acceptance floor: completeness_score >= METADATA_ACCEPT_MIN (85.00), computed with the pinned round-each-contribution-then-sum order"
    error_id: ERR_METADATA_INCOMPLETE
    http_status: 422
    applies_to: "POST /metadata-records/{metadataRecordId}/decide with decision == ACCEPT"
  - priority: 27
    category: business_constraint
    check: "Attribution readiness: when the license has attribution_required == true, attribution_element_count >= 1"
    error_id: ERR_ATTRIBUTION_MISSING
    http_status: 422
    applies_to: "POST /metadata-records/{metadataRecordId}/decide with decision == ACCEPT"
  - priority: 28
    category: business_constraint
    check: "Community demand floor: weighted_vote_total >= REVIEW_VOTE_MIN (4) before a request may enter UNDER_REVIEW"
    error_id: ERR_INSUFFICIENT_DEMAND
    http_status: 422
    applies_to: "POST /dataset-requests/{requestId}/review"
  - priority: 29
    category: business_constraint
    check: "A THROTTLED CommunityMember cannot file new quality issues or cast votes"
    error_id: ERR_MEMBER_THROTTLED
    http_status: 422
    applies_to: "POST /quality-issues, POST /dataset-requests/{requestId}/votes"
  - priority: 30
    category: business_constraint
    check: "High-value eligibility: priority_tier == TIER_1 and publication_status IN {READY, PUBLISHED}"
    error_id: ERR_NOT_HIGH_VALUE_ELIGIBLE
    http_status: 422
    applies_to: "POST /datasets/{datasetId}/high-value-commitment"
  - priority: 31
    category: business_constraint
    check: "Retraction requires a predecessor: version_index >= 2 and the immediately preceding version has status == SUPERSEDED"
    error_id: ERR_NO_PREDECESSOR_VERSION
    http_status: 409
    applies_to: "POST /dataset-versions/{versionId}/retract"
  - priority: 32
    category: business_constraint
    check: "Retirement requires a clean queue: no QualityIssue on the dataset has status IN {SUBMITTED, TRIAGED, ACCEPTED}"
    error_id: ERR_OPEN_ISSUES_BLOCK_RETIRE
    http_status: 409
    applies_to: "POST /datasets/{datasetId}/retire"
  - priority: 33
    category: business_safety
    check: "Posture gate: department.compliance_posture != SUSPENDED, and when it is RESTRICTED the dataset's stored priority_tier at the start of the request must be TIER_1 or TIER_2"
    error_id: "ERR_DEPARTMENT_SUSPENDED | ERR_RESTRICTED_POSTURE_TIER"
    http_status: 403
    applies_to: "POST /datasets/{datasetId}/screen, POST /datasets/{datasetId}/mark-ready, POST /datasets/{datasetId}/publish, POST /publication-pipelines/{pipelineId}/arm, POST /quality-issues/{issueId}/decide"
  - priority: 34
    category: business_fiscal
    check: "Credit sufficiency: department.credit_balance_units >= pipeline.escrow_required_units"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /publication-pipelines/{pipelineId}/arm"

# =============================================================================
# §1.5 Endpoint Surface
# =============================================================================
endpoints:
  # --- Department ---
  - method: POST
    path: "/open-data/departments"
    description: "Register a publishing department (the credit-holding steward of its datasets)"
    roles: [PortalAdmin]
    code: 201
    input: [name, code, contact_email]
    output: Department
    side_effects:
      - "credits_issued_units=0.00, credit_balance_units=0.00, credits_escrowed_units=0.00, credits_consumed_units=0.00"
      - "breached_dataset_count=0, stale_dataset_count=0, remediation_dataset_count=0, overdue_correction_count=0"
      - "risk_points=0, compliance_posture=OPEN"
  - method: GET
    path: "/open-data/departments"
    description: "List departments, filterable by code and posture"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["code?", "compliance_posture?", "limit?", "offset?"]
    output: Department[]
    side_effects: []
  - method: GET
    path: "/open-data/departments/{departmentId}"
    description: "Get one department"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: GET
    path: "/open-data/departments/{departmentId}/scorecard"
    description: "Computed read: posture arithmetic and the credit-conservation reconciliation for one department"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: "{department_id, compliance_posture, risk_points, breached_dataset_count, stale_dataset_count, remediation_dataset_count, overdue_correction_count, credits_issued_units, credit_balance_units, credits_escrowed_units, credits_consumed_units, credit_ledger_balanced}"
    side_effects: []
  - method: POST
    path: "/open-data/departments/{departmentId}/credit-grants"
    description: "Grant publication credits to a department"
    roles: [PortalAdmin]
    code: 200
    input: [credit_units, "memo?"]
    output: Department
    side_effects:
      - "credits_issued_units += credit_units; credit_balance_units += credit_units"
      - "credits_escrowed_units and credits_consumed_units unchanged (conservation invariant preserved)"

  # --- LicenseTerm ---
  - method: POST
    path: "/open-data/licenses"
    description: "Define a reuse licence with attribution and permission characteristics"
    roles: [PortalAdmin]
    code: 201
    input: [code, name, "attribution_required?", "commercial_use_allowed?", "share_alike?", "attribution_text_template?"]
    output: LicenseTerm
    side_effects:
      - "reuse_permission_class computed by license_reuse_permission_class (first match wins)"
      - "retired=false"
  - method: GET
    path: "/open-data/licenses"
    description: "List licences"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["code?", "retired?", "reuse_permission_class?", "limit?", "offset?"]
    output: LicenseTerm[]
    side_effects: []
  - method: GET
    path: "/open-data/licenses/{licenseId}"
    description: "Get one licence"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: LicenseTerm
    side_effects: []
  - method: POST
    path: "/open-data/licenses/{licenseId}/retire"
    description: "Retire a licence so no further metadata record may be accepted against it"
    roles: [PortalAdmin]
    code: 200
    input: []
    output: LicenseTerm
    side_effects: ["retired=true (already-ACCEPTED metadata records keep the licence but publication is blocked)"]

  # --- IngestRunner ---
  - method: POST
    path: "/open-data/ingest-runners"
    description: "Register a shared ingest runner with its post-window cooldown"
    roles: [PortalAdmin]
    code: 201
    input: [name, "cooldown_minutes?"]
    output: IngestRunner
    side_effects: ["status=ACTIVE, armed_window_count=0, cooldown_minutes defaults to 15"]
  - method: GET
    path: "/open-data/ingest-runners"
    description: "List ingest runners"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IngestRunner[]
    side_effects: []
  - method: GET
    path: "/open-data/ingest-runners/{runnerId}"
    description: "Get one ingest runner"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: IngestRunner
    side_effects: []
  - method: PATCH
    path: "/open-data/ingest-runners/{runnerId}"
    description: "Update runner availability or cooldown"
    roles: [PortalAdmin]
    code: 200
    input: ["status?", "cooldown_minutes?"]
    output: IngestRunner
    side_effects: ["version += 1; cooldown change re-scopes future overlap checks only, never retro-invalidates ARMED pipelines"]

  # --- Dataset ---
  - method: POST
    path: "/open-data/datasets"
    description: "Add a dataset to the department inventory with declared demand and policy value"
    roles: [DataCoordinator]
    code: 201
    input: [department_id, title, slug, description, update_frequency, column_count, sensitivity_class, public_demand_score, policy_value_score, "embargo_until_utc?", "aggregation_geography?"]
    output: Dataset
    side_effects:
      - "publication_status=INVENTORIED, currency_status=CURRENT, public_access_suspended=false, high_value_committed=false"
      - "priority_score computed with the AS_DECLARED variant; priority_score_variant=AS_DECLARED; priority_tier derived"
      - "engagement_index=0.00, observed_demand_score=0.00, usage_epochs=[], showcase_apps=[]"
      - "live_row_count=0, version_index_high_water=0, days_overdue=0, staleness_alert_count=0"
  - method: GET
    path: "/open-data/datasets"
    description: "Search the dataset inventory (public catalogue)"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["department_id?", "publication_status?", "currency_status?", "priority_tier?", "high_value_committed?", "sensitivity_class?", "limit?", "offset?"]
    output: Dataset[]
    side_effects: []
  - method: GET
    path: "/open-data/datasets/{datasetId}"
    description: "Get one dataset"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: Dataset
    side_effects: []
  - method: GET
    path: "/open-data/datasets/{datasetId}/analytics"
    description: "Computed read: usage analytics, engagement, both priority variants and currency posture for one dataset"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: "{dataset_id, engagement_index, observed_demand_score, priority_score, priority_score_variant, priority_tier, priority_score_as_declared, priority_score_as_observed, usage_epoch_count, approved_showcase_count, open_issue_count, currency_status, days_overdue, next_due_at}"
    side_effects: []
  - method: POST
    path: "/open-data/datasets/{datasetId}/screen"
    description: "Move a dataset into publication readiness review"
    roles: [DataCoordinator]
    code: 200
    input: []
    output: Dataset
    side_effects: ["publication_status INVENTORIED → SCREENING"]
  - method: POST
    path: "/open-data/datasets/{datasetId}/aggregation"
    description: "Set or change the aggregation geography the published extract will be rolled up to"
    roles: [DataCoordinator]
    code: 200
    input: [aggregation_geography]
    output: Dataset
    side_effects:
      - "aggregation_geography replaced (may be lowered while SCREENING or READY; re-checked at publish)"
      - "allowed only while publication_status IN {SCREENING, READY}"
  - method: POST
    path: "/open-data/datasets/{datasetId}/mark-ready"
    description: "Declare the dataset publication-ready once metadata is accepted and privacy is cleared"
    roles: [DataCoordinator]
    code: 200
    input: []
    output: Dataset
    side_effects: ["publication_status SCREENING → READY"]
  - method: POST
    path: "/open-data/datasets/{datasetId}/publish"
    description: "Publish the dataset to the portal, creating its first LIVE version"
    roles: [DataCoordinator]
    code: 200
    input: [initial_row_count]
    output: Dataset
    side_effects:
      - "publication_status READY → PUBLISHED; last_published_at=logical_now"
      - "a DatasetVersion is created with version_index=1, change_type=INITIAL, status=LIVE"
      - "live_row_count=initial_row_count; version_index_high_water=1"
      - "next_due_at = last_published_at + cadence days for update_frequency; currency_status=CURRENT; days_overdue=0"
      - "version += 1"
  - method: POST
    path: "/open-data/datasets/{datasetId}/retire"
    description: "Retire a dataset from the portal"
    roles: [DataCoordinator]
    code: 200
    input: ["reason?"]
    output: Dataset
    side_effects:
      - "publication_status → RETIRED; public_access_suspended=true"
      - "any ARMED or SUSPENDED pipeline → DECOMMISSIONED with its escrow released to credit_balance_units"
      - "department remediation/stale/breached counters recomputed and posture re-derived"
  - method: POST
    path: "/open-data/datasets/{datasetId}/usage-report"
    description: "Record one usage epoch (api calls and downloads) for engagement and observed-demand analytics"
    roles: [PortalAdmin]
    code: 200
    input: [epoch_index, api_call_count, download_count]
    output: Dataset
    side_effects:
      - "usage_epochs gains {epoch_index, api_call_count, download_count}"
      - "engagement_index recomputed by dataset_engagement_index; observed_demand_score recomputed"
      - "priority_score recomputed with the variant selected by publication_status (AS_DECLARED while INVENTORIED/SCREENING/READY, AS_OBSERVED from PUBLISHED onwards); priority_score_variant and priority_tier updated accordingly"
      - "allowed from publication_status SCREENING onward (catalogue-page analytics precede publication)"
  - method: POST
    path: "/open-data/datasets/{datasetId}/high-value-commitment"
    description: "Commit the dataset to the high-value currency service level"
    roles: [PortalAdmin]
    code: 200
    input: []
    output: Dataset
    side_effects: ["high_value_committed=true (enables the BREACHED currency state and department breach weighting)"]
  - method: POST
    path: "/open-data/datasets/{datasetId}/showcase-apps"
    description: "Submit a community application showcase against a published dataset"
    roles: [CommunityMember]
    code: 201
    input: [label, name, url, submitter_member_id]
    output: Dataset
    side_effects: ["showcase_apps gains {label, name, url, submitter_member_id, status: PENDING}"]
  - method: POST
    path: "/open-data/datasets/{datasetId}/showcase-apps/{showcaseLabel}/decide"
    description: "Approve or reject a submitted showcase application"
    roles: [PortalAdmin]
    code: 200
    input: [decision]
    output: Dataset
    side_effects:
      - "showcase entry status → APPROVED or REJECTED"
      - "on APPROVED: submitter's approved_showcase_count += 1, reputation_score and vote_weight recomputed"

  # --- MetadataRecord ---
  - method: POST
    path: "/open-data/metadata-records"
    description: "Draft the metadata standard record (dictionary, provenance, contact, frequency, licence) for a dataset"
    roles: [DataCoordinator]
    code: 201
    input: [dataset_id, license_id, data_dictionary_field_count, provenance_detail_lines, contact_email, declared_update_frequency, "attribution_element_count?"]
    output: MetadataRecord
    side_effects:
      - "status=DRAFT; completeness_score and component_contributions computed by metadata_completeness_score"
  - method: GET
    path: "/open-data/metadata-records"
    description: "List metadata records, filterable by dataset, licence and status"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["dataset_id?", "license_id?", "status?", "limit?", "offset?"]
    output: MetadataRecord[]
    side_effects: []
  - method: GET
    path: "/open-data/metadata-records/{metadataRecordId}"
    description: "Get one metadata record"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: MetadataRecord
    side_effects: []
  - method: PATCH
    path: "/open-data/metadata-records/{metadataRecordId}"
    description: "Revise a DRAFT metadata record"
    roles: [DataCoordinator]
    code: 200
    input: ["license_id?", "data_dictionary_field_count?", "provenance_detail_lines?", "contact_email?", "declared_update_frequency?", "attribution_element_count?"]
    output: MetadataRecord
    side_effects: ["completeness_score and component_contributions recomputed; version += 1; allowed only while status == DRAFT"]
  - method: POST
    path: "/open-data/metadata-records/{metadataRecordId}/submit"
    description: "Submit the metadata record for portal review"
    roles: [DataCoordinator]
    code: 200
    input: []
    output: MetadataRecord
    side_effects: ["status DRAFT → SUBMITTED"]
  - method: POST
    path: "/open-data/metadata-records/{metadataRecordId}/decide"
    description: "Accept or return a submitted metadata record"
    roles: [PortalAdmin]
    code: 200
    input: [decision, "returned_reason?"]
    output: MetadataRecord
    side_effects:
      - "status SUBMITTED → ACCEPTED (completeness and attribution gates enforced) or → RETURNED"
      - "on RETURNED: returned_reason stored and the record may be re-drafted"
  # --- PrivacyAssessment ---
  - method: POST
    path: "/open-data/privacy-assessments"
    description: "Open a privacy risk and reidentification assessment for a screening dataset"
    roles: [PrivacyReviewer]
    code: 201
    input: [dataset_id, declared_quasi_identifier_count, declared_smallest_cell_size, population_size]
    output: PrivacyAssessment
    side_effects:
      - "status=DRAFT; assessor_user_id=X-User-ID; verified_smallest_cell_size=null"
      - "screening_risk_score computed from declared inputs; risk_score mirrors the SCREENING variant"
  - method: GET
    path: "/open-data/privacy-assessments"
    description: "List privacy assessments"
    roles: [DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["dataset_id?", "status?", "aggregation_required?", "limit?", "offset?"]
    output: PrivacyAssessment[]
    side_effects: []
  - method: GET
    path: "/open-data/privacy-assessments/{assessmentId}"
    description: "Get one privacy assessment"
    roles: [DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: PrivacyAssessment
    side_effects: []
  - method: PATCH
    path: "/open-data/privacy-assessments/{assessmentId}"
    description: "Record measured cell sizes and revise declared inputs while the assessment is DRAFT"
    roles: [PrivacyReviewer]
    code: 200
    input: ["verified_smallest_cell_size?", "declared_quasi_identifier_count?", "declared_smallest_cell_size?", "population_size?"]
    output: PrivacyAssessment
    side_effects: ["screening_risk_score recomputed; version += 1; allowed only while status == DRAFT"]
  - method: POST
    path: "/open-data/privacy-assessments/{assessmentId}/submit"
    description: "Submit the assessment for an independent clearance decision"
    roles: [PrivacyReviewer]
    code: 200
    input: []
    output: PrivacyAssessment
    side_effects: ["status DRAFT → SUBMITTED; clearance_risk_score computed with the CLEARANCE variant; risk_score mirrors it"]
  - method: POST
    path: "/open-data/privacy-assessments/{assessmentId}/decide"
    description: "Clear or block a submitted assessment (must not be the assessor)"
    roles: [PrivacyReviewer]
    code: 200
    input: [decision, "block_reason?"]
    output: PrivacyAssessment
    side_effects:
      - "status SUBMITTED → CLEARED or → BLOCKED; decided_by_user_id=X-User-ID"
      - "on CLEARED: aggregation_required and min_aggregation_geography frozen from the CLEARANCE variant"
  - method: POST
    path: "/open-data/privacy-assessments/{assessmentId}/reopen"
    description: "Return a blocked assessment to draft for re-analysis"
    roles: [PrivacyReviewer]
    code: 200
    input: []
    output: PrivacyAssessment
    side_effects: ["status BLOCKED → DRAFT; block_reason cleared; clearance_risk_score cleared"]

  # --- PublicationPipeline ---
  - method: POST
    path: "/open-data/publication-pipelines"
    description: "Configure a recurring publication pipeline on a shared runner (optimistically concurrent against the dataset)"
    roles: [DataCoordinator]
    code: 201
    input: [dataset_id, runner_id, cadence, window_start_minute, window_duration_minutes, alert_email, expected_dataset_version]
    output: PublicationPipeline
    side_effects:
      - "status=DRAFT; window_end_minute = window_start_minute + window_duration_minutes"
      - "escrow_required_units computed by pipeline_credit_escrow; escrowed_credit_units=0.00; consecutive_failure_count=0"
      - "any existing DRAFT/ARMED/SUSPENDED pipeline for the dataset is DECOMMISSIONED, its escrow released, and superseded_pipeline_id points at it"
      - "increments Dataset.version by 1"
  - method: GET
    path: "/open-data/publication-pipelines"
    description: "List publication pipelines"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: ["dataset_id?", "runner_id?", "superseded_pipeline_id?", "status?", "cadence?", "limit?", "offset?"]
    output: PublicationPipeline[]
    side_effects: []
  - method: GET
    path: "/open-data/publication-pipelines/{pipelineId}"
    description: "Get one publication pipeline"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: PublicationPipeline
    side_effects: []
  - method: POST
    path: "/open-data/publication-pipelines/{pipelineId}/arm"
    description: "Arm the pipeline: reserve the runner window and escrow its credits"
    roles: [DataCoordinator]
    code: 200
    input: []
    output: PublicationPipeline
    side_effects:
      - "status DRAFT → ARMED; escrowed_credit_units=escrow_required_units"
      - "department credit_balance_units -= escrow_required_units; credits_escrowed_units += escrow_required_units"
      - "runner armed_window_count += 1"
  - method: POST
    path: "/open-data/publication-pipelines/{pipelineId}/suspend"
    description: "Suspend an armed pipeline, freeing its runner window while retaining escrow"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: ["suspend_reason?"]
    output: PublicationPipeline
    side_effects:
      - "status ARMED → SUSPENDED; runner armed_window_count -= 1"
      - "every SCHEDULED or RETRY_QUEUED run on this pipeline → SKIPPED with skip_reason=PIPELINE_SUSPENDED"
      - "escrowed_credit_units retained (window remains reserved against the runner cooldown buffer)"
  - method: POST
    path: "/open-data/publication-pipelines/{pipelineId}/resume"
    description: "Return a suspended pipeline to armed service"
    roles: [DataCoordinator]
    code: 200
    input: []
    output: PublicationPipeline
    side_effects: ["status SUSPENDED → ARMED; consecutive_failure_count=0; suspend_reason cleared; runner armed_window_count += 1"]
  - method: POST
    path: "/open-data/publication-pipelines/{pipelineId}/decommission"
    description: "Permanently decommission a pipeline and release its escrow"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: PublicationPipeline
    side_effects:
      - "status → DECOMMISSIONED; escrowed_credit_units released to department credit_balance_units and subtracted from credits_escrowed_units"
      - "escrowed_credit_units=0.00; open runs → SKIPPED with skip_reason=PIPELINE_DECOMMISSIONED"

  # --- PipelineRun ---
  - method: POST
    path: "/open-data/pipeline-runs"
    description: "Schedule one run of an armed pipeline inside its window"
    roles: [DataCoordinator, PortalAdmin]
    code: 201
    input: [pipeline_id, scheduled_for_utc]
    output: PipelineRun
    side_effects: ["status=SCHEDULED; consecutive_failure_index=pipeline.consecutive_failure_count; alert_dispatched=false"]
  - method: GET
    path: "/open-data/pipeline-runs"
    description: "List pipeline runs"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: ["pipeline_id?", "status?", "failure_code?", "limit?", "offset?"]
    output: PipelineRun[]
    side_effects: []
  - method: GET
    path: "/open-data/pipeline-runs/{runId}"
    description: "Get one pipeline run"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: PipelineRun
    side_effects: []
  - method: POST
    path: "/open-data/pipeline-runs/{runId}/start"
    description: "Begin execution of a scheduled or requeued run"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: PipelineRun
    side_effects: ["status → RUNNING; started_at=logical_now"]
  - method: POST
    path: "/open-data/pipeline-runs/{runId}/report-success"
    description: "Report a successful ingest, settle its credits and roll the dataset forward"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: [rows_ingested]
    output: PipelineRun
    side_effects:
      - "status RUNNING → SUCCEEDED; finished_at=logical_now; settlement fields computed by pipeline_run_settlement"
      - "total_charge_credits drawn escrow-first then balance by pipeline_credit_escrow's waterfall; escrow_drawn_units and balance_drawn_units recorded"
      - "a DatasetVersion is created with change_type=SCHEDULED_REFRESH, status=LIVE, supersedes_version_id = the prior LIVE version (which becomes SUPERSEDED)"
      - "dataset live_row_count=rows_ingested, version_index_high_water += 1, last_published_at=logical_now, next_due_at recomputed, currency_status=CURRENT, days_overdue=0"
      - "pipeline consecutive_failure_count=0; department posture recomputed"
  - method: POST
    path: "/open-data/pipeline-runs/{runId}/report-failure"
    description: "Report an ingest failure, charge the alerting overhead and advance the failure streak"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: [failure_code]
    output: PipelineRun
    side_effects:
      - "status RUNNING → FAILED; rows_ingested=0; alert_dispatched=true; alert sent to pipeline.alert_email"
      - "settlement computed by pipeline_run_settlement (alert overhead applies, no reliability discount)"
      - "pipeline consecutive_failure_count += 1; at PIPELINE_FAILURE_SUSPEND_STREAK the pipeline is SUSPENDED, its open runs SKIPPED, the dataset currency floored at STALE and the department posture re-derived"
      - "dataset.staleness_alert_count is NOT touched here — the failure alert goes to alert_email, while staleness alerting is emitted only by ops-run and by the ARMED -> SUSPENDED cascade"
  - method: POST
    path: "/open-data/pipeline-runs/{runId}/requeue"
    description: "Requeue a failed run for a later slot inside the window"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: [scheduled_for_utc]
    output: PipelineRun
    side_effects: ["status FAILED → RETRY_QUEUED; scheduled_for_utc replaced; started_at and finished_at cleared"]

  # --- DatasetVersion ---
  - method: POST
    path: "/open-data/dataset-versions"
    description: "Publish a manual or corrective dataset version (optimistically concurrent against the dataset)"
    roles: [DataCoordinator]
    code: 201
    input: [dataset_id, change_type, row_count, "notes?", "correction_issue_id?", expected_dataset_version]
    output: DatasetVersion
    side_effects:
      - "status=LIVE; version_index = dataset.version_index_high_water + 1; supersedes_version_id = prior LIVE version, which becomes SUPERSEDED"
      - "dataset live_row_count=row_count, version_index_high_water=version_index, last_published_at=logical_now, next_due_at recomputed, currency_status=CURRENT"
      - "correction_issue_id merely tags the version as the remedy for that issue; the issue itself only moves ACCEPTED → CORRECTED when POST /quality-issues/{issueId}/link-correction is called, which is also what returns the dataset from UNDER_REMEDIATION to PUBLISHED"
      - "increments Dataset.version by 1"
  - method: GET
    path: "/open-data/dataset-versions"
    description: "List dataset versions (version history)"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["dataset_id?", "source_run_id?", "correction_issue_id?", "supersedes_version_id?", "status?", "change_type?", "limit?", "offset?"]
    output: DatasetVersion[]
    side_effects: []
  - method: GET
    path: "/open-data/dataset-versions/{versionId}"
    description: "Get one dataset version"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: DatasetVersion
    side_effects: []
  - method: POST
    path: "/open-data/dataset-versions/{versionId}/retract"
    description: "Retract the LIVE version and restore its predecessor exactly"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: ["reason?"]
    output: DatasetVersion
    side_effects:
      - "status LIVE → RETRACTED; retracted_at=logical_now"
      - "the predecessor version SUPERSEDED → LIVE; its superseded_at cleared"
      - "dataset live_row_count restored to the predecessor's row_count; version_index_high_water unchanged (never decreases)"

  # --- CommunityMember ---
  - method: POST
    path: "/open-data/members/register"
    description: "Register a community member of the open data programme"
    roles: [Anonymous, PortalAdmin]
    code: 201
    input: [email, display_name, "organization?"]
    output: CommunityMember
    side_effects:
      - "accepted_issue_count=0, rejected_issue_count=0, approved_showcase_count=0, decay_epochs=0"
      - "reputation_score=50.00, vote_weight=2, status=ACTIVE"
  - method: GET
    path: "/open-data/members/{memberId}"
    description: "Get one community member"
    roles: [CommunityMember, DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: CommunityMember
    side_effects: []

  # --- QualityIssue ---
  - method: POST
    path: "/open-data/quality-issues"
    description: "Report a data quality issue against a published dataset"
    roles: [CommunityMember]
    code: 201
    input: [dataset_id, reporter_member_id, severity, category, description]
    output: QualityIssue
    side_effects:
      - "status=SUBMITTED; triage_due_at = logical_now + TRIAGE_SLA_HOURS[severity] (see calculations.quality_issue_sla_clock); triage_breached=false, correction_breached=false"
  - method: GET
    path: "/open-data/quality-issues"
    description: "List quality issues"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["dataset_id?", "reporter_member_id?", "resolution_version_id?", "status?", "severity?", "limit?", "offset?"]
    output: QualityIssue[]
    side_effects: []
  - method: GET
    path: "/open-data/quality-issues/{issueId}"
    description: "Get one quality issue"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: QualityIssue
    side_effects: []
  - method: POST
    path: "/open-data/quality-issues/{issueId}/triage"
    description: "Triage a submitted issue"
    roles: [DataCoordinator]
    code: 200
    input: []
    output: QualityIssue
    side_effects: ["status SUBMITTED → TRIAGED; triaged_at=logical_now; triage_breached set if logical_now > triage_due_at"]
  - method: POST
    path: "/open-data/quality-issues/{issueId}/decide"
    description: "Accept a triaged issue for correction, or reject it"
    roles: [DataCoordinator]
    code: 200
    input: [decision, "reject_reason?"]
    output: QualityIssue
    side_effects:
      - "on ACCEPT: status TRIAGED → ACCEPTED; accepted_at=logical_now; correction_due_at = accepted_at + CORRECTION_SLA_DAYS[severity]"
      - "on ACCEPT: dataset publication_status PUBLISHED → UNDER_REMEDIATION, remediation_opened_at=logical_now; its ARMED pipeline → SUSPENDED with open runs SKIPPED; department remediation_dataset_count += 1 and posture re-derived"
      - "on ACCEPT: reporter accepted_issue_count += 1, reputation and vote_weight recomputed, last_credited_at=logical_now"
      - "on REJECT: status TRIAGED → REJECTED; reporter rejected_issue_count += 1, reputation recomputed, THROTTLED when reputation drops below MEMBER_THROTTLE_FLOOR"
  - method: POST
    path: "/open-data/quality-issues/{issueId}/link-correction"
    description: "Attach an already published corrective version to an accepted issue"
    roles: [DataCoordinator]
    code: 200
    input: [dataset_version_id]
    output: QualityIssue
    side_effects:
      - "resolution_version_id set; status ACCEPTED → CORRECTED; correction_breached set if logical_now > correction_due_at"
      - "when no further ACCEPTED issue remains, the dataset leaves UNDER_REMEDIATION for PUBLISHED and the department counters are recomputed"
  - method: POST
    path: "/open-data/quality-issues/{issueId}/close"
    description: "Close a corrected issue"
    roles: [DataCoordinator, PortalAdmin]
    code: 200
    input: []
    output: QualityIssue
    side_effects: ["status CORRECTED → CLOSED"]

  # --- DatasetRequest ---
  - method: POST
    path: "/open-data/dataset-requests"
    description: "Request a new dataset from the community"
    roles: [CommunityMember]
    code: 201
    input: [requester_member_id, title, rationale]
    output: DatasetRequest
    side_effects: ["status=OPEN; votes=[]; weighted_vote_total=0; demand_signal computed as NONE"]
  - method: GET
    path: "/open-data/dataset-requests"
    description: "List community dataset requests"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: ["requester_member_id?", "linked_dataset_id?", "status?", "demand_signal?", "limit?", "offset?"]
    output: DatasetRequest[]
    side_effects: []
  - method: GET
    path: "/open-data/dataset-requests/{requestId}"
    description: "Get one dataset request"
    roles: [Anonymous, CommunityMember, DataCoordinator, PrivacyReviewer, PortalAdmin]
    code: 200
    input: []
    output: DatasetRequest
    side_effects: []
  - method: POST
    path: "/open-data/dataset-requests/{requestId}/votes"
    description: "Cast a reputation-weighted vote for a dataset request"
    roles: [CommunityMember]
    code: 200
    input: [member_id]
    output: DatasetRequest
    side_effects:
      - "votes gains {member_id, weight: member.vote_weight}; weighted_vote_total recomputed as the sum of stored weights"
      - "demand_signal recomputed by request_demand_signal; any dataset linked to this request has its AS_DECLARED priority inputs re-scored"
  - method: POST
    path: "/open-data/dataset-requests/{requestId}/review"
    description: "Take a sufficiently demanded request under review"
    roles: [PortalAdmin]
    code: 200
    input: ["decision_note?"]
    output: DatasetRequest
    side_effects: ["status OPEN → UNDER_REVIEW"]
  - method: POST
    path: "/open-data/dataset-requests/{requestId}/decide"
    description: "Accept, decline or defer a request under review"
    roles: [PortalAdmin]
    code: 200
    input: [decision, decision_note]
    output: DatasetRequest
    side_effects: ["status UNDER_REVIEW → ACCEPTED, → DECLINED, or → OPEN when decision=DEFER; decision_note stored"]
  - method: POST
    path: "/open-data/dataset-requests/{requestId}/fulfill"
    description: "Link an accepted request to the dataset that satisfies it"
    roles: [PortalAdmin]
    code: 200
    input: [dataset_id]
    output: DatasetRequest
    side_effects:
      - "status ACCEPTED → FULFILLED; linked_dataset_id set"
      - "the linked dataset's AS_DECLARED priority inputs gain the request's weighted demand and priority_tier is re-derived"

  # --- Operational sweep and logical clock ---
  - method: POST
    path: "/open-data/ops-run"
    description: "Run the portal sweep: staleness detection, currency re-derivation, alerting, SLA breach marking and department posture recomputation"
    roles: [PortalAdmin]
    code: 200
    input: []
    output: "{datasets_recomputed, currency_transitions, staleness_alerts_emitted, issues_triage_breached, issues_correction_breached, departments_recomputed, postures_changed}"
    side_effects:
      - "every non-RETIRED published dataset: days_overdue and currency_status recomputed by dataset_currency_status"
      - "each dataset entering or remaining in STALE or BREACHED emits one alert per sweep: staleness_alert_count += 1, last_staleness_alert_at=logical_now"
      - "overdue SUBMITTED issues get triage_breached=true; overdue ACCEPTED issues get correction_breached=true"
      - "department risk_points and compliance_posture re-derived from the refreshed counters"
  - method: POST
    path: "/open-data/_clock/set_current_utc"
    description: "Test-only logical clock control. The logical clock starts at 2026-08-01T00:00:00Z and every temporal rule reads it instead of wall time."
    roles: [PortalAdmin]
    code: 200
    input: [to_iso8601]
    output: "{current_utc}"
    side_effects: ["logical_now replaced; no entity is recomputed until the next write or ops-run"]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown, or X-User-ID missing for a role that requires an identity"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Acting role is not listed in the endpoint's roles"
  - id: ERR_DEPARTMENT_SCOPE_VIOLATION
    http: 403
    condition: "DataCoordinator acting on a dataset that belongs to another department"
  - id: ERR_MEMBER_SCOPE_VIOLATION
    http: 403
    condition: "CommunityMember acting on behalf of a different member id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Privacy clearance decided by the same user who authored the assessment"
  - id: ERR_DEPARTMENT_SUSPENDED
    http: 403
    condition: "Department compliance_posture is SUSPENDED"
  - id: ERR_RESTRICTED_POSTURE_TIER
    http: 403
    condition: "Department posture is RESTRICTED and the dataset is not TIER_1 or TIER_2"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, or numeric value outside its declared range"
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "Referenced department does not exist"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "Referenced licence does not exist"
  - id: ERR_RUNNER_NOT_FOUND
    http: 404
