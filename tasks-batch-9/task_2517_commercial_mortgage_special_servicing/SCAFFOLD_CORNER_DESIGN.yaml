      - name: consultation_links_a_borrower_request_to_its_trust_and_unblocks_approval
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_consultations
          - state_machines.BorrowerRequest.RECOMMENDED_to_CONSULTATION_PENDING
          - errors.ERR_BORROWER_REQUEST_NOT_FOUND
        distinguishing_aspect: "The polymorphic link is exercised on its BORROWER_REQUEST arm rather than the WORKOUT_PLAN arm: both endpoints of the association must exist (an absent borrower_request_id is a 404 before anything is written), the link drags the subject request from RECOMMENDED to CONSULTATION_PENDING as a system-driven transition, and only once the linked consultation is CONSENTED can the committee approve — which then writes loan.is_modified through the request."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; trust CONTROLLING so the consultation carries CONSENT_RIGHT."
            - "Loan principal 10,000,000.00 in SPECIAL_SERVICING with an ACCEPTED appraisal covering [2026-07-01, 2027-07-01)."
            - "A MODIFICATION request at the 25,000.00 deposit floor, analysed to SERVICING_STANDARD_MET and RECOMMENDED."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V32", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V32", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-06-15T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-06-20T00:00:00Z", appraiser_firm: "Meridian Valuation" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 9000000, as_of_date: "2026-07-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "rate relief to 4.5% for 24 months", proposed_rate_pct: 4.5 }
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { request_id: "$.data.id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/borrower-requests/${request_id}/analysis"
              payload: { npv_recovery_with_request_usd: 12000000, npv_recovery_without_request_usd: 11900000, analysis_discount_rate_pct: 8.0 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { margin: "$.data.servicing_standard_margin_usd", conclusion: "$.data.servicing_standard_conclusion" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "RECOMMENDED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { recommended_status: "$.data.status" }
          trigger:
            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_id}", subject_type: "BORROWER_REQUEST", borrower_request_id: "00000000-0000-4000-8000-000000000042" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { missing_subject_error: "$.data.error_id" }
            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_id}", subject_type: "BORROWER_REQUEST", borrower_request_id: "${request_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { consult_id: "$.data.id", consult_rights: "$.data.rights_type", consult_subject: "$.data.borrower_request_id", consult_plan: "$.data.workout_plan_id" }
            - call: "GET /special-servicing/borrower-requests/${request_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { linked_request_status: "$.data.status" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { premature_approval_error: "$.data.error_id" }
            - call: "POST /special-servicing/consultations/${consult_id}/response"
              payload: { response: "CONSENTED", response_note: "no objection to the rate modification" }
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
              captures: { consult_status: "$.data.status", responder: "$.data.responded_by_user_id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { approved_status: "$.data.status", decider: "$.data.decided_by_user_id", decided_on: "$.data.decided_on" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { is_modified: "$.data.is_modified" }
            - call: "GET /special-servicing/consultations"
              payload: { borrower_request_id: "${request_id}" }
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
              captures: { listed_consult_id: "$.data[0].id" }
          assert:
            - "The analysis writes servicing_standard_margin_usd 100000.00 against required_margin_usd max(50000, 0.005 * 10,000,000.00 = 50000.00) = 50000.00, so servicing_standard_conclusion is SERVICING_STANDARD_MET"
            - "Issuing the consultation against an absent borrower_request_id returns HTTP 404 with error_id ERR_BORROWER_REQUEST_NOT_FOUND and creates no ConsultationRequest row"
            - "The real issue returns 201 with rights_type CONSENT_RIGHT, borrower_request_id == ${request_id} and workout_plan_id null — exactly one arm of the polymorphic link is populated"
            - "The link drags the subject: the request moved RECOMMENDED -> CONSULTATION_PENDING as a system-driven transition with no direct status call"
            - "Approving before the response returns HTTP 409 with error_id ERR_CONSULTATION_NOT_SATISFIED — a PENDING CONSENT_RIGHT consultation blocks the committee"
            - "CONSENTED stamps responded_at 2026-08-01T00:00:00Z and responded_by_user_id == ${trust_id}"
            - "The second approval attempt returns 200 with status APPROVED, decided_by_user_id 'cmte-001' and decided_on 2026-08-01T00:00:00Z"
            - "Loan.is_modified flipped to true because request_type == MODIFICATION; the PROVISIONAL 1900000.00 appraisal reduction created by the acceptance is untouched by any of this"
            - "The reverse-reachability list filtered by borrower_request_id returns exactly the one consultation"

      - name: asset_business_plan_read_derives_countdown_and_flips_overdue
        claim_type: computed_read
        grounds:
          - endpoints.GET_loans_id_asset-business-plan
          - entities.Loan.fields.asset_business_plan_due_date
        distinguishing_aspect: "A pure derived read with no stored counterpart: days_until_due and is_overdue are recomputed from the logical clock on every call, so the same loan yields +60 / false at 2026-08-01 and -5 / true at 2026-10-05 without any write in between. It also proves the read pulls ara_amount_usd and required_monthly_pi_advance_usd from the loan and recommended_alternative_type across the plan link."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; loan principal 10,000,000.00, monthly debt service 65,000.00, no effective reduction."
            - "Transferred to special servicing on 2026-08-01, so asset_business_plan_due_date is 2026-09-30."
            - "A workout plan scored at 8.0% CONTRACTUAL whose winning alternative is a MODIFICATION."
