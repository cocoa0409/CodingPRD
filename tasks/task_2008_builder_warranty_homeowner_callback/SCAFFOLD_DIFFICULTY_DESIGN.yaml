      - name: chargeback_zero_final_auto_void
        grounds:
          - calculations.chargeback_amount
          - state_machines.Chargeback.ISSUED_to_VOID
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Money metric through POST /work-orders/{id}/complete (different metric and endpoint
          from the coverage instance): actual cost exactly EQUAL to the 25000 deductible yields
          recoverable 0, so the provisional chargeback auto-VOIDs instead of going payable.
        test_recipe:
          setup:
            - "Home (STANDARD, closing 2026-06-01); approved PLUMBING request; tp; wo estimated 100000 SUBCONTRACTOR"
            - "cb ISSUED with provisional 82500 (recoverable 75000 + fee 7500)"
