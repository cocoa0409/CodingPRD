              as: RegistryAgent
              as_user_id: "u_registry_1"
          assert:
            - "before the trigger DealAllocation.${alloc_a}.status == CONFIRMED with allocation_share_pct 100.00 and DealAllocation.${alloc_b}.status == PROPOSED with allocation_share_pct 40.00 = round(100 * 10.000 / 25.000, 2)"
            - "Deal.${deal_id}.confirmed_allocated_mw == 25.000 and unallocated_mw == 0.000, so the PROPOSED 10.000 MW never entered the confirmed pool and execute was legal"
            - "the trigger returns 200 with EnvironmentalAttributeBatch.${batch_id}.status == TRANSFERRED, transferred_to_offtaker_id ${buyer_a} and transferred_at 2026-08-01T00:00:00Z"
            - "allocation_breakdown == [{offtaker_id: ${buyer_a}, mwh: 8}] - a single row summing to the full quantity_mwh of 8"
            - "${buyer_b} does not appear in allocation_breakdown at all: the basis was 25.000, not 35.000"
            - "the wrong answer to reject is the pair [{${buyer_a}, 6}, {${buyer_b}, 2}], which is what an unfiltered basis of 35.000 produces (floor 5.714 -> 5 and floor 2.285 -> 2, leftover 1 to the larger remainder) and which still sums to 8"
            - "Deal.${deal_id}.attributes_transferred_mwh == 8 and attributes_minted_mwh == 8, while Offtaker.${buyer_b}.claimed_attributes_mwh remains 0"

      - name: eligible_credit_support_haircut_by_issuer_rating_and_guarantor_tier
        claim_type: constants_applied
        grounds:
          - calculations.eligible_credit_support
          - endpoints.POST_/ppa/deals/{id}/credit-support
          - endpoints.POST_/ppa/credit-support/{id}/post
          - entities.CreditSupportInstrument.fields.haircut_pct
        distinguishing_aspect: |
          Face amount is not credit. A 500000.00 letter of credit from a BBB bank
          contributes 450000.00 at a 10.00 haircut, and a 1000000.00 guarantee from a
          merely STANDARD parent contributes 750000.00 at a 25.00 haircut - so the
          deal's coverage is 1200000.00 against 1500000.00 of face. The two haircuts
          come from two different tables keyed on two different entities, and
          registration itself must compute neither: haircut_pct and eligible_credit_usd
          stay null until the instrument is posted, and registration must not touch
          Deal.version.
        test_recipe:
          setup:
            - "CHAIN A with the QUALIFIED Northwind buyer and a DRAFT 25.000 MW deal; posting does not require any particular deal status, only a matching Deal.version."
            - "A second offtaker, Bare Minimum Industrials LLC (BBB, FITCH, leverage 4.0, disclosure NONE), submitted for qualification so that it carries credit_tier STANDARD; it is left UNDER_REVIEW and is used only as the guarantor."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Bare Minimum Industrials LLC", credit_rating: "BBB", rating_agency: "FITCH", reported_ebitda_usd: 20000000.00, net_debt_to_ebitda: 4.0, disclosure_framework: "NONE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { guarantor_id: $.data.id }
            - call: "POST /ppa/offtakers/${guarantor_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/credit-support"
              payload: { instrument_type: "LETTER_OF_CREDIT", purpose: "PERFORMANCE_SECURITY", face_amount_usd: 500000.00, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2031-12-31T00:00:00Z", issuer_name: "Second Federal Bank", issuer_rating: "BBB" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { lc_id: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/credit-support"
              payload: { instrument_type: "PARENT_GUARANTEE", purpose: "PERFORMANCE_SECURITY", face_amount_usd: 1000000.00, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2031-12-31T00:00:00Z", guarantor_offtaker_id: "${guarantor_id}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { pg_id: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { deal_v1: $.data.version }
            - call: "POST /ppa/credit-support/${lc_id}/post"
              payload: { expected_deal_version: "${deal_v1}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "GET /ppa/deals/${deal_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { deal_v2: $.data.version }
          trigger:
            - call: "POST /ppa/credit-support/${pg_id}/post"
              payload: { expected_deal_version: "${deal_v2}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
          assert:
            - "Offtaker.${guarantor_id}.credit_score == 62.10 = 0.55*72 + 0.30*60 + 0.15*30 and credit_tier == STANDARD, even though it is only UNDER_REVIEW - a tier exists as soon as scoring has run"
            - "immediately after registration both instruments are PROPOSED with haircut_pct, eligible_credit_usd, posted_at and closed_at all null, and Deal.version is unchanged at ${deal_v1} across both registrations"
            - "after posting the letter of credit: haircut_pct == 10.00 from LC_HAIRCUT_PCT.BBB and eligible_credit_usd == 450000.00 = round(500000.00 * (1 - 10.00 / 100), 2)"
            - "the trigger returns 200 with CreditSupportInstrument.${pg_id}.haircut_pct == 25.00 from PG_HAIRCUT_PCT.STANDARD, keyed on the guarantor's tier and not on any rating field of the instrument"
            - "CreditSupportInstrument.${pg_id}.eligible_credit_usd == 750000.00 = round(1000000.00 * (1 - 25.00 / 100), 2) and posted_at == 2026-08-01T00:00:00Z"
            - "Deal.${deal_id}.posted_credit_support_usd == 1200000.00 = 450000.00 + 750000.00, against 1500000.00 of combined face - the 300000.00 difference is the haircut"
            - "Deal.${deal_id}.credit_support_required_usd is still 0.00 and credit_status is still NOT_SUBMITTED, so over-collateralising a deal that needs nothing is legal and changes no status"

      - name: credit_score_weighted_components_and_guarantor_lift
        claim_type: weighted_scoring
        grounds:
