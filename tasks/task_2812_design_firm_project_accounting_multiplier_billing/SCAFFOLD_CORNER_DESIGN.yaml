              as: ProjectAccountant
              captures: { p_v1: $.data.version }
            - call: "POST /invoices"
              payload: { project_id: "${p_id}", period_end: "2026-05-31", expected_project_version: "${p_v1}" }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { inv1: $.data.id }
            - call: "POST /invoices"
              payload: { project_id: "${p_id}", period_end: "2026-05-31", expected_project_version: "${p_v1}" }
              as: ProjectAccountant
              as_user_id: "acct-002"
            - call: "GET /invoices?project_id=${p_id}"
              payload: {}
              as: Controller
            - call: "POST /time-entries/${te_c}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "GET /projects/${p_id}"
              payload: {}
              as: ProjectAccountant
              captures: { p_v2: $.data.version }
            - call: "POST /invoices"
              payload: { project_id: "${p_id}", period_end: "2026-05-31", expected_project_version: "${p_v2}" }
              as: ProjectAccountant
              as_user_id: "acct-002"
              captures: { inv2: $.data.id }
            - call: "GET /projects/${p_id}"
              payload: {}
              as: Controller
          assert:
            - "Invoice.${inv1}: labor_billed 1143.75, gross_billed 1143.75, discount_amount 0.00, retainage_amount 57.19 (round_half_up of 57.1875), net_due 1086.56, prepared_by_user_id acct-001"
            - "the second preparation on the same ${p_v1} returns 412 ERR_STALE_PROJECT_VERSION — the first invoice spent that token by incrementing Project.version"
            - "GET /invoices?project_id=${p_id} returns total_count 1 immediately after the 412; the refused call created no DRAFT and no partially swept invoice"
            - "TimeEntry.${te_a} and ${te_b} both point at ${inv1} only, and Project.billed_open is 1143.75 with unbilled_wip 0.00 — unchanged by the refusal"
            - "approving ${te_c} advances Project.version again, so ${p_v2} is the token that works"
            - "Invoice.${inv2} sweeps only ${te_c}: gross_billed 381.25, retainage_amount 19.06 (round_half_up of 19.0625), net_due 362.19"
            - "Project.${p_id} finally reports unbilled_wip 0.00, billed_open 1525.00, written_off_gross 0.00 and total_charge_value 1525.00"

      - name: five_hop_cascade_from_a_single_payment
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / invoice_payment_five_hop_close_cascade
          rationale: "The full hop chain from POST /invoices/{id}/record-payment through payable release, posture, phase and project closure is asserted hop by hop."

      - name: percent_complete_has_two_variants_with_a_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / phase_earned_value_effort_based_vs_assessed
          rationale: "Both variants are computed over identical charge data and the delta on switching percent_complete_method is asserted."

      - name: rollup_fields_reconcile_after_a_compensating_write
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[derived_field_reconciliation]
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_void_restores_every_swept_population_without_drift
          rationale: "Every rollup field is re-asserted after the void, including the conservation of total_charge_value with no cent of drift."

  - section: consistency_model
    instances:
      - name: every_derived_read_is_current_in_the_very_next_request
        claim_type: immediate_consistency
        grounds:
          - consistency_model
          - calculations.project_rollup_metrics
          - endpoints.GET_phases_phase_id_earned_value
        distinguishing_aspect: |
          One approval fans out to a frozen entity, a phase accumulator, two computed reports and
          the project rollup, and immediate consistency means all five are correct on the first
          read that follows — with no refresh call in between. The mirror case matters just as
          much: a refused repeat of the same transition must leave all five reads byte-identical.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z; private client"
            - "ACTIVE T&M project (multiplier 3.0500, rate 62.50) with one phase (fee 200000.00, labor budget 60000.00) and one SUBMITTED 4.00 h entry dated 2026-05-11"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "PROJECT_ARCHITECT", raw_cost_rate: 62.50, effective_from: "2026-01-01" }
              as: Controller
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Riverside Library", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 4.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_id: $.data.id }
          trigger:
            - call: "GET /phases/${ph_id}/earned-value"
              payload: {}
              as: Controller
            - call: "POST /time-entries/${te_id}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "GET /time-entries/${te_id}"
              payload: {}
              as: Controller
            - call: "GET /phases/${ph_id}"
              payload: {}
              as: Controller
            - call: "GET /phases/${ph_id}/earned-value"
              payload: {}
              as: Controller
            - call: "GET /projects/${p_id}"
              payload: {}
              as: Controller
            - call: "GET /projects/${p_id}/wip-aging"
              payload: {}
              as: ProjectAccountant
            - call: "POST /time-entries/${te_id}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "GET /projects/${p_id}"
              payload: {}
              as: Controller
            - call: "GET /projects/${p_id}/wip-aging"
              payload: {}
              as: ProjectAccountant
          assert:
            - "the pre-approval earned-value report shows effort_based_percent_complete 0.0000 and recognized_earned_value 0.00 — a SUBMITTED entry contributes nothing"
            - "the first read after the approval already shows TimeEntry.${te_id} APPROVED with raw_cost 250.00, applied_multiplier 3.0500 and billable_amount 762.50, all frozen"
            - "GET /phases/${ph_id} already shows actual_labor_cost 250.00 on that same first read"
            - "the post-approval earned-value report shows effort_based_percent_complete 0.0042 (round_half_up of 250.00/60000.00 to 4 places) and recognized_earned_value 840.00, with no second write required to materialise it"
            - "GET /projects/${p_id} already shows raw_labor_cost_to_date 250.00, unbilled_wip 762.50, net_multiplier_achieved 3.0500, earned_revenue_to_date 840.00 and total_charge_value 762.50"
            - "GET /projects/${p_id}/wip-aging already shows bucket_0_30 762.50, bucket_31_60 0.00, total_unbilled 762.50 and write_off_eligible_amount 0.00, computed against the logical clock rather than wall time"
            - "the repeated approve returns 409 ERR_INVALID_STATE_TRANSITION"
            - "the two reads taken after that 409 are identical to the two taken before it — same unbilled_wip 762.50, same version, no double-posting of the 762.50"
