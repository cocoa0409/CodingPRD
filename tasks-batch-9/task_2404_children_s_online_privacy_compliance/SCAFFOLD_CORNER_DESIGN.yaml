          assert:
            - "${pr_attempts_initial} == 0 and ${method_1} == SIGNED_FORM_RETURN"
            - "${attempts_1} == 1, ${attempts_2} == 2, ${attempts_3} == 3 (the counter only moves on the VERIFYING -> VERIFICATION_FAILED edge)"
