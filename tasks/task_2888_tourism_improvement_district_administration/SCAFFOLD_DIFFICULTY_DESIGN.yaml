  - rule_id: cross_entity_state_dependency
    instances:

      - name: program_launch_gated_on_the_district_dmo_agreement_reaching_executed
        grounds:
          - validations.ERR_DMO_AGREEMENT_NOT_EXECUTED
          - state_machines.MarketingProgram.PLANNED_to_RUNNING
          - entities.District.fields.dmo_agreement_status
          - endpoints.POST_/districts/{id}/dmo-coordination
        distinguishing_aspect: |
          The program's own state is flawless PLANNED under an APPROVED plan inside its booking window,
          yet the launch is refused because a field on a different aggregate — District.dmo_agreement_status
          — is not EXECUTED. A merely PROPOSED agreement is still refused, which shows the guard tests one
          specific value rather than "not NONE", and the identical launch succeeds the moment the
          agreement is executed.
        test_recipe:
          setup:
            - "district ACTIVE with dmo_agreement_status still NONE"
            - "period FY2027-Q1 with b1 filed at 824,500 and b2 filed at 340,000 so the plan can be approved"
            - "an approved 1,000,000 fiscal-2027 plan and a PLANNED 62,000 program with booking window [2026-09-01, 2026-12-01)"
            - "logical clock at 2026-09-01, inside the booking window"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_find_st_b2
            - *k_file_st1_824500
            - *k_file_st2_340000
            - *k_plan_fy2027
            - *k_sponsor_plan
            - *k_approve_plan
            - *k_program_62000
            - *k_clock_launch
          trigger:
            - call: "POST /marketing-programs/${mp_id}/launch"
              payload: { launch_note: "attempted launch with no DMO agreement at all" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /districts/${d_id}/dmo-coordination"
              payload: { dmo_name: "Visit Harbor Bay", dmo_agreement_status: "PROPOSED", dmo_contract_cents: 200000, lodging_tax_match_pool_cents: 400000, public_lodging_tax_offset_cents: 0 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /marketing-programs/${mp_id}/launch"
              payload: { launch_note: "attempted launch under a merely proposed agreement" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - *k_dmo_executed
            - call: "POST /marketing-programs/${mp_id}/launch"
              payload: { launch_note: "launch under the executed agreement" }
              as: DmoLiaison
              as_user_id: "dmo-01"
          assert:
            - "the first launch returns ERR_DMO_AGREEMENT_NOT_EXECUTED with HTTP 409 while District.${d_id}.dmo_agreement_status == NONE"
            - "the second launch returns ERR_DMO_AGREEMENT_NOT_EXECUTED with HTTP 409 while District.${d_id}.dmo_agreement_status == PROPOSED"
            - "MarketingProgram.${mp_id}.status is still PLANNED and launched_at is null after both refusals"
            - "after the executed agreement, District.${d_id}.dmo_agreement_status == EXECUTED and lodging_tax_match_pool_cents == 400000"
            - "the third launch returns HTTP 200 with MarketingProgram.${mp_id}.status == RUNNING and launched_at == 2026-09-01T00:00:00Z"
            - "AnnualWorkPlan.${wp_id}.status was APPROVED throughout, so the refusals came from the district and not from the plan"

      - name: audit_certification_gated_on_the_owning_period_leaving_open
        grounds:
          - validations.ERR_PERIOD_NOT_CLOSED
          - state_machines.AssessmentStatement.FILED_to_AUDITED
          - state_machines.AssessmentPeriod.OPEN_to_CLOSED
          - calculations.assessment_amount
        distinguishing_aspect: |
          A statement whose own filing dimension is legitimately FILED still cannot be audited: the gate
          is the state of its parent AssessmentPeriod. The identical audit call is refused at
          priority 60 while the period is OPEN and succeeds unchanged once the period is CLOSED, at
          which point the FINAL variant writes final_assessment_cents for the first time.
        test_recipe:
          setup:
            - "district ACTIVE, period FY2027-Q1 still OPEN"
            - "b1's statement filed at 824,500 with final_assessment_cents still null"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_file_st1_824500
          trigger:
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "audit attempted while the period is still open" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
            - *k_clock_period_end
            - *k_close_q1
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "audit recorded after closure" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
          assert:
            - "the first audit returns ERR_PERIOD_NOT_CLOSED with HTTP 409 while AssessmentPeriod.${ap_id}.status == OPEN"
            - "after the refusal, AssessmentStatement.${st1_id}.filing_status is still FILED, final_assessment_cents is still null and audited_by_user_id is null"
            - "AssessmentPeriod.${ap_id}.status == CLOSED after the closure call and billed_total_cents == 824500"
            - "the second audit returns HTTP 200 with AssessmentStatement.${st1_id}.filing_status == AUDITED"
            - "AssessmentStatement.${st1_id}.final_assessment_cents == 824500 and effective_assessment_cents == 824500"
            - "AssessmentStatement.${st1_id}.audited_by_user_id == auditor-01"

      - name: renewal_pending_gated_on_published_annual_report_and_financial_audit
        grounds:
          - validations.ERR_TRANSPARENCY_REQUIREMENTS_UNMET
          - state_machines.TransparencyRecord
          - state_machines.District.ACTIVE_to_RENEWAL_PENDING
          - entities.District.fields.transparency_standing
        distinguishing_aspect: |
          Entering RENEWAL_PENDING depends on the states of two TransparencyRecord rows of different
          record_type for District.current_fiscal_year. NOTICED is not enough and one PUBLISHED record is
          not enough: the advance is refused until both the ANNUAL_REPORT and the FINANCIAL_AUDIT reach
          PUBLISHED, at which point the identical call succeeds inside the same renewal window.
        test_recipe:
          setup:
            - "district ACTIVE with term_years 1, expiration_date 2027-08-01 and current_fiscal_year 2027"
            - "an ANNUAL_REPORT and a FINANCIAL_AUDIT for fiscal year 2027 scheduled at clock 2027-01-05 for 2027-01-25, required_by 2027-03-01, so the 14-day notice rule is satisfied"
            - "both records advanced to NOTICED, then the clock moved to 2027-02-10, inside the 180-day renewal window that opened 2027-02-02"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "ANNUAL_REPORT", fiscal_year: 2027, scheduled_for: "2027-01-25T00:00:00Z", required_by: "2027-03-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { ar_id: "$.data.id" }
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "FINANCIAL_AUDIT", fiscal_year: 2027, scheduled_for: "2027-01-25T00:00:00Z", required_by: "2027-03-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { fa_id: "$.data.id" }
            - call: "POST /transparency-records/${ar_id}/advance"
              payload: { to_status: "NOTICED", document_reference: "notice-ar-2027" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${fa_id}/advance"
              payload: { to_status: "NOTICED", document_reference: "notice-fa-2027" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "RENEWAL_PENDING", effective_on: "2027-02-10T00:00:00Z", reason: "attempted with both records only NOTICED" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${ar_id}/advance"
              payload: { to_status: "COMPLETED", document_reference: "ar-2027-draft" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${ar_id}/advance"
              payload: { to_status: "PUBLISHED", document_reference: "ar-2027-final" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "RENEWAL_PENDING", effective_on: "2027-02-10T00:00:00Z", reason: "attempted with only the annual report published" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${fa_id}/advance"
              payload: { to_status: "COMPLETED", document_reference: "fa-2027-fieldwork" }
              as: DistrictAdministrator
              as_user_id: "admin-02"
            - call: "POST /transparency-records/${fa_id}/advance"
              payload: { to_status: "PUBLISHED", document_reference: "fa-2027-opinion" }
              as: DistrictAdministrator
              as_user_id: "admin-02"
            - call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "RENEWAL_PENDING", effective_on: "2027-02-10T00:00:00Z", reason: "both transparency obligations published" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the first advance returns ERR_TRANSPARENCY_REQUIREMENTS_UNMET with HTTP 409 while both records are NOTICED"
            - "the second advance still returns ERR_TRANSPARENCY_REQUIREMENTS_UNMET with HTTP 409 when only TransparencyRecord.${ar_id} is PUBLISHED"
            - "District.${d_id}.status is still ACTIVE after both refusals"
            - "TransparencyRecord.${ar_id}.status == PUBLISHED and TransparencyRecord.${fa_id}.status == PUBLISHED before the third advance"
            - "the third advance returns HTTP 200 with District.${d_id}.status == RENEWAL_PENDING"
            - "District.${d_id}.transparency_standing == COMPLIANT throughout, since neither record ever passed required_by 2027-03-01"

  - rule_id: resource_temporal_overlap
    instances:

      - name: room_night_claim_stays_are_half_open_per_program_and_property
        grounds:
          - validations.ERR_CLAIM_STAY_OVERLAP
          - entities.RoomNightClaim.fields.stay_start
          - entities.RoomNightClaim.fields.stay_end
          - state_machines.RoomNightClaim.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Claim stays are half-open [stay_start, stay_end) scoped to the (program, property) pair, so a
          stay beginning exactly where another ends is accepted, a stay overlapping by a single day is
          refused, the same interval is free for a different property, and a REJECTED claim releases
          its interval for re-use. Four distinct edges of one interval rule in one chain.
        test_recipe:
          setup:
            - "district ACTIVE with an EXECUTED DMO agreement and an approved 1,000,000 fiscal-2027 plan"
            - "a 62,000 program with booking window [2026-09-01, 2026-12-01), launched at clock 2026-09-01"
            - "logical clock at 2026-09-25 so every stay below sits inside the booking window"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_find_st_b2
            - *k_file_st1_824500
            - *k_file_st2_340000
            - *k_plan_fy2027
            - *k_sponsor_plan
            - *k_approve_plan
            - *k_dmo_executed
            - *k_program_62000
            - *k_clock_launch
            - *k_launch_program
            - *k_clock_claims
          trigger:
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b1_id}", stay_start: "2026-09-01T00:00:00Z", stay_end: "2026-09-08T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { ov1_id: "$.data.id" }
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b1_id}", stay_start: "2026-09-08T00:00:00Z", stay_end: "2026-09-15T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { ov2_id: "$.data.id" }
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b1_id}", stay_start: "2026-09-14T00:00:00Z", stay_end: "2026-09-20T00:00:00Z", room_nights: 6, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b2_id}", stay_start: "2026-09-08T00:00:00Z", stay_end: "2026-09-15T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
              captures: { ov4_id: "$.data.id" }
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b1_id}", stay_start: "2026-09-20T00:00:00Z", stay_end: "2026-09-27T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { ov5_id: "$.data.id" }
            - call: "POST /room-night-claims/${ov5_id}/verification"
              payload: { decision: "REJECT", rejection_reason: "DUPLICATE_STAY" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b1_id}", stay_start: "2026-09-20T00:00:00Z", stay_end: "2026-09-27T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { ov6_id: "$.data.id" }
          assert:
            - "RoomNightClaim.${ov1_id}.status == SUBMITTED, the first interval being unopposed"
            - "the adjacent claim is created with HTTP 201 and RoomNightClaim.${ov2_id}.stay_start == 2026-09-08T00:00:00Z, a stay starting exactly where another ends being accepted"
            - "the [2026-09-14, 2026-09-20) claim returns ERR_CLAIM_STAY_OVERLAP with HTTP 409, overlapping [2026-09-08, 2026-09-15) by a single day"
            - "the identical [2026-09-08, 2026-09-15) interval for b2 is created with HTTP 201, because the rule is scoped to the (marketing_program_id, lodging_business_id) pair"
            - "RoomNightClaim.${ov5_id}.status == REJECTED after verification"
            - "the re-submitted [2026-09-20, 2026-09-27) claim for b1 is created with HTTP 201 as RoomNightClaim.${ov6_id}, proving a REJECTED claim frees its interval"
            - "GET /marketing-programs/${mp_id}/room-night-claims returns exactly 4 rows for the program"

      - name: assessment_period_windows_are_half_open_within_one_district
        grounds:
          - validations.ERR_PERIOD_OVERLAP
          - entities.AssessmentPeriod.fields.period_start
          - entities.AssessmentPeriod.fields.period_end
          - endpoints.POST_/assessment-periods
        distinguishing_aspect: |
          Assessment periods of one district are half-open [period_start, period_end): a new period
          starting exactly on an existing period's period_end is accepted on both sides of an existing
          window, while a period straddling an existing boundary by any amount is refused. The chain
          places one accepted touch before the overlap attempt and one after, so an implementation that
          rejects touching windows and one that accepts straddling windows both fail.
        test_recipe:
          setup:
            - "district ACTIVE with the canonical four-property roll"
            - "period FY2027-Q1 [2026-08-01, 2026-11-01) already created"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
          trigger:
            - call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-Q2", period_start: "2026-11-01T00:00:00Z", period_end: "2027-02-01T00:00:00Z", due_date: "2027-02-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { tq2_id: "$.data.id" }
            - call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-XX", period_start: "2026-10-15T00:00:00Z", period_end: "2026-12-15T00:00:00Z", due_date: "2026-12-31T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-Q3", period_start: "2027-02-01T00:00:00Z", period_end: "2027-05-01T00:00:00Z", due_date: "2027-05-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { tq3_id: "$.data.id" }
          assert:
            - "the FY2027-Q2 period is created with HTTP 201 and AssessmentPeriod.${tq2_id}.status == OPEN, starting exactly on FY2027-Q1's period_end"
            - "the FY2027-XX period straddling 2026-11-01 returns ERR_PERIOD_OVERLAP with HTTP 409"
            - "the FY2027-Q3 period is created with HTTP 201 and AssessmentPeriod.${tq3_id}.period_start == 2027-02-01T00:00:00Z"
            - "GET /districts/${d_id}/assessment-periods returns exactly 3 rows, so the refused period left nothing behind"
            - "AssessmentPeriod.${ap_id}.period_end == 2026-11-01T00:00:00Z is shared with AssessmentPeriod.${tq2_id}.period_start with no gap and no overlap"

  - rule_id: compensating_invariant
    instances:

      - name: remittance_reversals_restore_the_statement_and_district_ledger_exactly
        grounds:
          - calculations.remittance_waterfall
          - calculations.payment_status_derivation
          - state_machines.AssessmentStatement.payment_status
          - state_machines.Remittance.APPLIED_to_REVERSED
          - entities.District.fields.collected_to_date_cents
        distinguishing_aspect: |
          A reversal subtracts exactly the four allocations recorded on the Remittance row instead of
          re-running the waterfall backwards, so unwinding the second of two payments returns the
          statement to byte-identical buckets, total_due and payment_status, and unwinding an
          overpaying payment removes the credit as well. Both compensations are checked against the
          conserved identity that ties District.collected_to_date_cents to the four per-statement buckets.
        test_recipe:
          setup:
            - "district ACTIVE, period FY2027-Q1 with b1's statement filed at 824,500 and nothing paid"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_file_st1_824500
          trigger:
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 500000, received_on: "2026-08-01T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { remA_id: "$.data.id" }
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 324500, received_on: "2026-08-01T00:00:00Z", method: "WIRE" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { remB_id: "$.data.id" }
            - call: "POST /assessment-statements/${st1_id}/remittance-reversals"
              payload: { remittance_id: "${remB_id}", reversal_reason: "wire recalled by the operator's bank" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 400000, received_on: "2026-08-01T00:00:00Z", method: "CHECK" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { remC_id: "$.data.id" }
            - call: "POST /assessment-statements/${st1_id}/remittance-reversals"
              payload: { remittance_id: "${remC_id}", reversal_reason: "check returned unpaid" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "after remittance A, AssessmentStatement.${st1_id}.principal_paid_cents == 500000, total_due_cents == 324500, payment_status == PARTIALLY_PAID and District.${d_id}.collected_to_date_cents == 500000"
            - "after remittance B, principal_paid_cents == 824500, total_due_cents == 0, payment_status == PAID_IN_FULL and District.${d_id}.collected_to_date_cents == 824500"
            - "Remittance.${remB_id}.applied_to_interest_cents == 0, applied_to_penalty_cents == 0, applied_to_principal_cents == 324500 and applied_to_credit_cents == 0"
            - "after reversing B, Remittance.${remB_id}.status == REVERSED and the statement is byte-identical to its post-A state: principal_paid_cents == 500000, total_due_cents == 324500, credit_balance_cents == 0, payment_status == PARTIALLY_PAID, District.${d_id}.collected_to_date_cents == 500000"
            - "after remittance C of 400000, Remittance.${remC_id}.applied_to_principal_cents == 324500 and applied_to_credit_cents == 75500, payment_status == REFUND_DUE, total_due_cents == 0 and District.${d_id}.collected_to_date_cents == 900000"
            - "after reversing C, credit_balance_cents == 0, principal_paid_cents == 500000, total_due_cents == 324500, payment_status == PARTIALLY_PAID and District.${d_id}.collected_to_date_cents == 500000"
            - "at every one of the six checkpoints District.${d_id}.collected_to_date_cents equals the sum over the district's statements of (interest_paid_cents + penalty_paid_cents + principal_paid_cents + credit_balance_cents)"
            - "AssessmentPeriod.${ap_id}.collected_total_cents == 500000 at the end, matching the district ledger"

      - name: signature_withdrawal_restores_petition_support_to_its_prior_value
        grounds:
          - state_machines.PetitionSignature.VALID_to_WITHDRAWN
          - calculations.petition_support
          - entities.PetitionDrive.fields.signed_basis_cents
          - entities.PetitionDrive.fields.weighted_support_pct
        distinguishing_aspect: |
          Withdrawing a signature must restore the drive's four derived support figures to exactly the
          values they held immediately before that signature was recorded — 0.6000 weighted and 0.2500
          headcount — rather than recomputing from a drifted running total, and a fresh signature by the
          same property afterwards must reach 0.6500 again, proving the compensation is exact in both
          directions and that a WITHDRAWN row does not trip the duplicate-signature rule.
        test_recipe:
          setup:
            - "the canonical district still in PETITION_CIRCULATING with an OPEN FORMATION drive whose window is [2026-08-01, 2026-09-01)"
            - "b1 has already signed, giving signed_basis 60,000,000 of 100,000,000"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
          trigger:
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b4_id}" }
              as: LodgingOperator
              as_user_id: "${b4_id}"
              captures: { sig_b4_id: "$.data.id" }
            - call: "POST /petition-signatures/${sig_b4_id}/withdrawal"
              payload: { reason: "ownership change at the property" }
              as: LodgingOperator
              as_user_id: "${b4_id}"
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b4_id}" }
              as: LodgingOperator
              as_user_id: "${b4_id}"
              captures: { sig_b4_again_id: "$.data.id" }
          assert:
            - "before b4 signs, PetitionDrive.${pd_id}.signed_basis_cents == 60000000, valid_signature_count == 1, weighted_support_pct == 0.6000 and headcount_support_pct == 0.2500"
            - "after b4 signs, signed_basis_cents == 65000000, valid_signature_count == 2, weighted_support_pct == 0.6500 and headcount_support_pct == 0.5000"
            - "PetitionSignature.${sig_b4_id}.weight_basis_revenue_cents == 5000000"
            - "after the withdrawal, PetitionSignature.${sig_b4_id}.status == WITHDRAWN and PetitionDrive.${pd_id}.signed_basis_cents == 60000000, valid_signature_count == 1, weighted_support_pct == 0.6000, headcount_support_pct == 0.2500 — exactly the pre-signature figures"
            - "the second signature by b4 is created with HTTP 201 as PetitionSignature.${sig_b4_again_id}, because a WITHDRAWN row does not trigger ERR_DUPLICATE_SIGNATURE"
            - "after the re-signature, signed_basis_cents == 65000000 and weighted_support_pct == 0.6500 again"
            - "PetitionSignature.${sig_b1_id}.status is VALID throughout and its weight_basis_revenue_cents == 60000000 is never rewritten"
