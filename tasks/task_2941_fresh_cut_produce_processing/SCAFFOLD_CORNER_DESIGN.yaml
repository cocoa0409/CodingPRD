      - name: corner_hold_test_gates_and_release_segregation
        claim_type: Violation → Error
        grounds:
          - validations[priority=34]
          - validations[priority=59]
          - validations[priority=37]
          - state_machines[HoldRecord].transitions[UNDER_TEST->UNDER_TEST]
        distinguishing_aspect: "Recording a result before a sample is submitted is a state error, a POSITIVE result blocks the release at priority 59, the self-loop lets a NEGATIVE result overwrite it, and the technician who recorded the result cannot also release the hold even while wearing the QAManager role."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED with 900 ON_HOLD cases and hold ${hold_id} is HELD with test_round 0"]
          setup_api_calls: []
          trigger:
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { e_state: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
              captures: { e_state2: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r1: "$.data.test_round" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "POSITIVE" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { s1: "$.data.status", res1: "$.data.latest_test_result", by1: "$.data.resulted_by_user_id" }
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
              captures: { e_positive: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 900000 }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { s2: "$.data.status", res2: "$.data.latest_test_result", r2: "$.data.test_round" }
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qat-2"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
              captures: { s3: "$.data.status", relby: "$.data.released_by_user_id", fin: "$.data.closed_at" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { disp: "$.data.disposition_status", fin_days: "$.data.final_shelf_life_days" }
          assert:
            - "${e_state} == ERR_HOLD_INVALID_STATE with HTTP 409: record-result requires UNDER_TEST, and no sample has been submitted"
            - "${e_state2} == ERR_HOLD_INVALID_STATE for a release attempted from HELD, evaluated at priority 34 before the result check at 59"
            - "${r1} == 1 with the hold now UNDER_TEST; ${s1} == UNDER_TEST, ${res1} == POSITIVE and ${by1} == qat-2 (the self-loop does not leave UNDER_TEST)"
            - "${e_positive} == ERR_TEST_RESULT_NOT_NEGATIVE with HTTP 409 at priority 59"
            - "${s2} == UNDER_TEST with ${res2} == NEGATIVE and ${r2} == 1: re-resulting the same round overwrites the verdict without consuming a round"
            - "${e_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 when the releasing X-User-ID equals resulted_by_user_id, even though the role header is QAManager"
            - "${s3} == RELEASED with ${relby} == qam-1, ${fin} non-null, ${disp} == RELEASED and ${fin_days} == 13 (base 14 less one harvest-lag day, with no micro penalty because 900000 < 1000000)"

      - name: corner_closed_run_refuses_start_close_and_consumption
        claim_type: Violation → Error
        grounds:
          - validations[priority=28]
          - validations[priority=29]
        distinguishing_aspect: "One CLOSED run rejects all three lifecycle writes with the two distinct state errors: start reports ERR_RUN_NOT_IN_SETUP while both close and consumption report ERR_RUN_NOT_RUNNING, and the consumption's version check is not consulted first."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED with 900 cases and one ACTIVE consumption"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv: "$.data.version" }
          trigger:
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { e_start: "$.data.error_id" }
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { e_close: "$.data.error_id" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 100.00, expected_process_run_version: "${rv}" }
              as: LineOperator
              captures: { e_cons: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv2: "$.data.version", cases: "$.data.cases_produced" }
          assert:
            - "${e_start} == ERR_RUN_NOT_IN_SETUP with HTTP 409 at priority 28"
            - "${e_close} == ERR_RUN_NOT_RUNNING with HTTP 409 at priority 29, so a second close cannot double-mint cases"
            - "${e_cons} == ERR_RUN_NOT_RUNNING even though the supplied version was current: the state gate is what refuses the write"
            - "${rv2} == ${rv} and ${cases} == 900: none of the three refusals wrote anything"

      - name: corner_remaining_shelf_life_at_ship_boundary
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=56]
          - state_machines[FinishedCase].transitions[IN_INVENTORY->SHIPPED]
          - entities.CustomerSpec.fields.min_remaining_shelf_life_days_at_ship
        distinguishing_aspect: "Against a FINAL code date of 2026-08-16 and a spec demanding 10 remaining days, a ship on 2026-08-06 leaves exactly 10 whole days and succeeds, while the very next day leaves 9 and is refused, so the comparison is >= on whole days."
        test_recipe:
          setup: ["execute the BASE chain, then submit an APC sample resulting NEGATIVE with 900000 cfu/g and release the hold, so the run is RELEASED with final_shelf_life_days 13, final_code_date 2026-08-16 and 900 IN_INVENTORY cases"]
          setup_api_calls:
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 900000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { fin_code: "$.data.final_code_date" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 2, offset: 0 }
              as: QAManager
              captures: { c1: "$.data[0].id", c2: "$.data[1].id", c1_code: "$.data[0].code_date" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /finished-cases/${c1}/ship"
              as: ShippingClerk
              captures: { st1: "$.data.status", shipped1: "$.data.shipped_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /finished-cases/${c2}/ship"
              as: ShippingClerk
              captures: { e_ship: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { avail: "$.data.cases_available", shipped_cnt: "$.data.cases_shipped" }
          assert:
            - "${fin_code} == 2026-08-16 (date(closed_at 2026-08-03) + 13 days) and ${c1_code} == 2026-08-16: the release restamped every case with the FINAL date"
            - "${st1} == SHIPPED with ${shipped1} == 2026-08-06T08:00:00.000Z, because 2026-08-16 minus 2026-08-06 is exactly the 10 days the spec demands"
            - "${e_ship} == ERR_INSUFFICIENT_REMAINING_SHELF_LIFE with HTTP 422 one calendar day later, when only 9 whole days remain against the same 2026-08-16 code date"
            - "${avail} == 899 and ${shipped_cnt} == 1: only the successful ship moved a counter"

      - name: corner_out_of_spec_receipt_needs_a_manager_override
        claim_type: Violation → Error
        grounds:
          - validations[priority=38]
          - errors[ERR_RECEIPT_TEMP_OUT_OF_SPEC]
        excluded_because:
          difficulty_instance: receipt_pulp_temp_at_exact_max_is_marginal
          rationale: "That instance accepts a 4.4 C load without any override, then hits ERR_RECEIPT_TEMP_OUT_OF_SPEC at 4.5 C and clears it with a QAManager override, so both the violation and the satisfaction sides of priority 38 are already pinned there."

      - name: corner_line_interval_and_allergen_buffer_conflicts
        claim_type: Violation → Error
        grounds:
          - validations[priority=54]
          - validations[priority=55]
        excluded_because:
          difficulty_instance: line_run_interval_pairwise_exclusion_with_allergen_buffer
          rationale: "That instance covers the overlapping window, the touching window that is allowed, the sub-45-minute changeover gap and the 45-minute gap that passes, which is the full boundary set for priorities 54 and 55."

      - name: corner_wash_system_concurrent_capacity
        claim_type: Aggregate validation
        grounds:
          - validations[priority=65]
        excluded_because:
          difficulty_instance: wash_system_aggregate_concurrency_capacity
          rationale: "That instance places two runs from different lines on one wash system, is refused the third overlapping occupant with ERR_WASH_SYSTEM_CAPACITY_EXCEEDED, and then succeeds with a disjoint window - the aggregate claim in full."

      - name: corner_consumption_receipt_and_balance_gates
        claim_type: Violation → Error
        grounds:
          - validations[priority=40]
          - validations[priority=64]
        excluded_because:
          difficulty_instance: consumption_receipt_safety_beats_balance_fiscal
          rationale: "That instance orders ERR_RECEIPT_NOT_ACCEPTED ahead of ERR_INSUFFICIENT_RECEIPT_BALANCE on the same call and then consumes the exact remaining balance to zero, covering both rules and their relative priority."

      - name: corner_dwell_gate_at_close
        claim_type: Violation → Error
        grounds:
          - validations[priority=48]
        excluded_because:
          difficulty_instance: wash_target_ppm_then_dwell_evaluation_order_pinned
          rationale: "That instance refuses the close at 149 seconds against a frozen requirement of 150 and accepts it at exactly 150, which is the boundary form of priority 48."

      - name: corner_close_without_active_consumption
        claim_type: Violation → Error
        grounds:
          - validations[priority=61]
        excluded_because:
          difficulty_instance: consumption_void_restores_receipt_pound_balance
          rationale: "That instance voids the run's only consumption and then closes it, hitting ERR_NO_LOTS_CONSUMED with input_lb back at 0.00, which is exactly the priority 61 claim plus its compensating context."

  - section: endpoints
    instances:
      - name: corner_logical_clock_drives_every_system_timestamp
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Product.fields.created_at
        distinguishing_aspect: "Before the clock is ever moved every system timestamp reads the fixed epoch 2026-08-01T00:00:00Z, after a set they read the new instant, and moving the clock rewrites nothing already stored."
        test_recipe:
          setup: ["empty database; the logical clock has not been touched"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { code: "EPOCH-1", name: "Epoch Probe", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: false }
              as: PlantAdmin
              captures: { p1: "$.data.id", p1_created: "$.data.created_at", p1_updated: "$.data.updated_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
              captures: { now1: "$.data.current_utc" }
            - call: "POST /lines"
              payload: { line_code: "LX", required_disassembly_component_count: 12, max_atp_rlu: 200 }
              as: PlantAdmin
              captures: { l_created: "$.data.created_at" }
            - call: "GET /products/${p1}"
              as: PlantAdmin
              captures: { p1_created_again: "$.data.created_at", p1_v: "$.data.version" }
          assert:
            - "${p1_created} == ${p1_updated} == 2026-08-01T00:00:00.000Z: the untouched clock is the declared epoch, never real wall-clock time"
            - "${now1} == 2026-08-02T05:00:00Z is echoed back in the inline { current_utc } body with response_type object"
            - "${l_created} == 2026-08-02T05:00:00.000Z: the row created after the set reads the new logical instant"
            - "${p1_created_again} == 2026-08-01T00:00:00.000Z and ${p1_v} == 1: the clock move stored nothing and bumped no version"

      - name: corner_run_list_filters_on_both_state_dimensions
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /process-runs]
          - entities.ProcessRun.fields.run_status
          - entities.ProcessRun.fields.disposition_status
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three runs on one line - one CLOSED and HELD, two SETUP - are separable by run_status, by disposition_status and by line_id, and the SETUP page honours limit and offset independently of the filter."
        test_recipe:
          setup:
            - "execute the BASE chain, so RUN1 on L1 is CLOSED with disposition_status HELD and the clock reads 2026-08-03T11:00:00Z"
            - "two further runs are planned on L1 for the following two days with the same product, so no allergen changeover is required and no window overlaps"
          setup_api_calls:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-04T07:00:00Z", planned_end_at: "2026-08-04T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_b: "$.data.id", run_b_status: "$.data.run_status", run_b_disp: "$.data.disposition_status" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_c: "$.data.id" }
          trigger:
            - call: "GET /process-runs"
              payload: { run_status: "CLOSED" }
              as: QAManager
              captures: { closed_id: "$.data[0].id", closed_disp: "$.data[0].disposition_status" }
            - call: "GET /process-runs"
              payload: { disposition_status: "HELD" }
              as: QAManager
              captures: { held_id: "$.data[0].id" }
            - call: "GET /process-runs"
              payload: { run_status: "SETUP", limit: 1, offset: 0 }
              as: QAManager
              captures: { page1_id: "$.data[0].id", page1_status: "$.data[0].run_status" }
            - call: "GET /process-runs"
              payload: { run_status: "SETUP", limit: 1, offset: 1 }
              as: QAManager
              captures: { page2_id: "$.data[0].id" }
            - call: "GET /process-runs"
              payload: { line_id: "${line_id}", disposition_status: "UNRESTRICTED" }
              as: ShippingClerk
              captures: { unr_id: "$.data[0].id" }
            - call: "GET /process-runs"
              payload: { run_status: "RUNNING" }
              as: QAManager
              captures: { none_hit: "$.data[0].id" }
          assert:
            - "${run_b_status} == SETUP and ${run_b_disp} == UNRESTRICTED: the two dimensions are set independently at creation"
            - "${closed_id} == ${run_id} with ${closed_disp} == HELD, and the CLOSED page carries total_count 1 and has_more false"
            - "${held_id} == ${run_id}: filtering on the disposition dimension alone finds the same single run"
            - "the two SETUP pages each return exactly 1 row with total_count 2, has_more true on offset 0 and false on offset 1, and ${page1_id} != ${page2_id} with both drawn from {${run_b}, ${run_c}} and ${page1_status} == SETUP"
            - "the line_id + disposition_status query returns exactly 2 rows, total_count 2, both from {${run_b}, ${run_c}}, so ${unr_id} is one of them and RUN1 is excluded"
            - "the RUNNING query returns an empty data array with total_count 0 and has_more false, so ${none_hit} resolves to nothing"

      - name: corner_consumption_junction_lists_from_both_sides
        claim_type: Cross-reference link
        grounds:
          - endpoints[GET /process-runs/{id}/lot-consumptions]
          - endpoints[GET /raw-receipts/{id}/lot-consumptions]
          - endpoints[GET /grower-lots/{id}/raw-receipts]
          - entities.LotConsumption.fields.status
        distinguishing_aspect: "The same two LotConsumption rows are reachable from the run side and from the receipt side, the status filter separates the ACTIVE row from the VOIDED one on both, and the receipt list under the grower lot answers to temp_grade."
        test_recipe:
          setup: ["execute BASE steps 1-19, so RUN1 is RUNNING with 30000.00 lb of R1 consumed and R1 has 6000.00 lb remaining"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv: "$.data.version" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 1000.00, expected_process_run_version: "${rv}" }
              as: LineOperator
              captures: { cons2: "$.data.id" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv2: "$.data.version" }
            - call: "POST /lot-consumptions/${cons2}/void"
              payload: { expected_process_run_version: "${rv2}" }
              as: LineOperator
              captures: { void_status: "$.data.status" }
          trigger:
            - call: "GET /process-runs/${run_id}/lot-consumptions"
              as: QATechnician
              captures: { run_side_first: "$.data[0].id", run_side_receipt: "$.data[0].raw_receipt_id" }
            - call: "GET /process-runs/${run_id}/lot-consumptions"
              payload: { status: "ACTIVE" }
              as: QATechnician
              captures: { active_id: "$.data[0].id", active_lb: "$.data[0].consumed_lb" }
            - call: "GET /raw-receipts/${rcpt_id}/lot-consumptions"
              payload: { status: "VOIDED" }
              as: QATechnician
              captures: { voided_id: "$.data[0].id", voided_at: "$.data[0].voided_at" }
            - call: "GET /grower-lots/${lot_id}/raw-receipts"
              payload: { temp_grade: "IN_SPEC" }
              as: ReceivingClerk
              captures: { rc_id: "$.data[0].id", rc_remaining: "$.data[0].remaining_lb" }
            - call: "GET /grower-lots/${lot_id}/raw-receipts"
              payload: { temp_grade: "OUT_OF_SPEC" }
              as: ReceivingClerk
              captures: { miss: "$.data[0].id" }
          assert:
            - "${void_status} == VOIDED and the unfiltered run-side list returns 2 rows with total_count 2, both pointing at R1, so ${run_side_receipt} == ${rcpt_id}"
            - "${active_id} is the 30000.00 lb row with ${active_lb} == 30000.00, and that filtered page reports total_count 1"
            - "${voided_id} == ${cons2} with ${voided_at} non-null: the receipt-side view of the junction returns the same row the run-side view hid"
            - "${rc_id} == ${rcpt_id} with ${rc_remaining} == 6000.00, the void having restored the 1000.00 lb exactly"
            - "the OUT_OF_SPEC query returns an empty array with total_count 0, so ${miss} resolves to nothing: the filter is applied, not ignored"

      - name: corner_traceability_read_recomputes_the_whole_chain
        claim_type: Computed read
        grounds:
          - endpoints[GET /process-runs/{id}/traceability]
          - calculations.case_disposition_counts
          - entities.ProcessRun.fields.provisional_code_date
          - entities.ProcessRun.fields.final_code_date
        distinguishing_aspect: "The recall view is derived on every read, never stored: it walks consumptions to receipts to grower lots, reports the case tally by disposition, shows the provisional code date while the run is held and the final one after release, and reports an empty rework ancestry for a first-generation run."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED with 900 ON_HOLD cases, one ACTIVE consumption of R1 from lot G1, provisional_code_date 2026-08-17 and the clock at 2026-08-03T11:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "GET /process-runs/${run_id}/traceability"
              as: QAManager
              captures: { t_run: "$.data.process_run_id", t_prod: "$.data.product_code", t_cust: "$.data.customer_code", t_lots: "$.data.grower_lot_ids", t_codes: "$.data.grower_codes", t_rcpts: "$.data.raw_receipt_ids", t_active: "$.data.active_consumption_count", t_void: "$.data.voided_consumption_count", t_cases: "$.data.case_count", t_ship: "$.data.shipped_case_count", t_hold: "$.data.on_hold_case_count", t_dest: "$.data.destroyed_case_count", t_code: "$.data.effective_code_date", t_src: "$.data.rework_source_run_id", t_anc: "$.data.rework_ancestor_run_ids" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 900000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: ShippingClerk
              captures: { case1: "$.data[0].id" }
            - call: "POST /finished-cases/${case1}/ship"
              as: ShippingClerk
            - call: "GET /process-runs/${run_id}/traceability"
              as: QATechnician
              captures: { u_active: "$.data.active_consumption_count", u_cases: "$.data.case_count", u_ship: "$.data.shipped_case_count", u_hold: "$.data.on_hold_case_count", u_code: "$.data.effective_code_date" }
          assert:
            - "${t_run} == ${run_id}, ${t_prod} == RML-SHRED and ${t_cust} == FSVC-NORTH: the view joins across Product and CustomerSpec"
            - "${t_lots} == [${lot_id}], ${t_codes} == [GRW-100] and ${t_rcpts} == [${rcpt_id}]: one hop back through the junction reaches exactly one receipt and one lot, with no duplicates"
            - "${t_active} == 1, ${t_void} == 0, ${t_cases} == 900, ${t_ship} == 0, ${t_hold} == 900 and ${t_dest} == 0 while the hold is open"
            - "${t_code} == 2026-08-17, the provisional code date, because final_code_date is still null"
            - "${t_src} is null and ${t_anc} == []: a run with no rework_source_run_id reports an empty ancestry rather than omitting the keys"
            - "after the release and the single ship, ${u_cases} == 900, ${u_ship} == 1, ${u_hold} == 0 and ${u_active} == 1: the read is recomputed, not cached"
            - "${u_code} == 2026-08-16, the final code date, which is 13 days after date(closed_at) with no micro penalty at 900000 cfu/g"

      - name: corner_finished_case_page_is_sequence_ordered_and_cost_complete
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /process-runs/{id}/finished-cases]
          - entities.FinishedCase.fields.case_code
          - entities.FinishedCase.fields.case_sequence
          - entities.FinishedCase.fields.allocated_cost_cents
        distinguishing_aspect: "The case list is ordered by case_sequence rather than by id, so deep offsets land on the last cases packed, the case_code carries the line code and pack date, and every page reports the allocated cents that reconcile to the run total."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 packed 900 cases on line L1 on 2026-08-03 against spec S_FS (JULIAN, 20.0 lb cases) and all 900 are ON_HOLD"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { total_cost: "$.data.total_run_cost_cents", per_case: "$.data.per_case_cost_cents", remainder: "$.data.cost_remainder_cents" }
          trigger:
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 3, offset: 0 }
              as: LineOperator
              captures: { s1: "$.data[0].case_sequence", code1: "$.data[0].case_code", cd1: "$.data[0].code_date", lbl1: "$.data[0].code_date_label", nw1: "$.data[0].net_weight_lb", st1: "$.data[0].status", cost1: "$.data[0].allocated_cost_cents", s2: "$.data[1].case_sequence", code2: "$.data[1].case_code", s3: "$.data[2].case_sequence" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 2, offset: 898 }
              as: LineOperator
              captures: { s899: "$.data[0].case_sequence", s900: "$.data[1].case_sequence", code900: "$.data[1].case_code", cost900: "$.data[1].allocated_cost_cents" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { status: "IN_INVENTORY" }
              as: LineOperator
              captures: { none_yet: "$.data[0].id" }
          assert:
            - "${s1} == 1, ${s2} == 2 and ${s3} == 3 with ${code1} == L1-20260803-0001 and ${code2} == L1-20260803-0002: the sequence is 1-based and the suffix is zero-padded to four digits"
            - "${cd1} == 2026-08-17 with ${lbl1} == 2026229 (JULIAN day-of-year 229), ${nw1} == 20.0 copied from the spec and ${st1} == ON_HOLD"
            - "${s899} == 899 and ${s900} == 900 with ${code900} == L1-20260803-0900: offset 898 reaches the tail because the ordering is case_sequence ASC, and the page reports total_count 900 with has_more false"
            - "${cost1} == ${per_case} + 1 when ${remainder} >= 1, while ${cost900} == ${per_case} because 900 > ${remainder}: the waterfall hands the leftover cents to the lowest sequences"
            - "summing allocated_cost_cents across all 900 cases equals ${total_cost} exactly, with no cent invented or lost"
            - "the IN_INVENTORY query returns an empty array with total_count 0, so ${none_yet} resolves to nothing while the hold is open"

      - name: corner_disposition_override_is_a_conditional_action
        claim_type: Conditional action
        grounds:
          - endpoints[POST /raw-receipts/{id}/disposition]
          - validations[priority=3]
        excluded_because:
          difficulty_instance: receipt_pulp_temp_at_exact_max_is_marginal
          rationale: "That instance exercises the endpoint's conditional branch in both directions - an in-spec load accepted with no override, an out-of-spec load refused without one and accepted by a QAManager with one - so the conditional-action claim for this endpoint is already fully covered."

      - name: corner_close_creates_the_case_batch_in_one_shot
        claim_type: Bulk action
        grounds:
          - endpoints[POST /process-runs/{id}/close]
          - calculations.run_cost_allocation_per_case
        excluded_because:
          difficulty_instance: run_cost_allocation_rounding_order_and_remainder_waterfall
          rationale: "That instance closes a run, verifies that the bulk-created case rows carry the floored share plus the distributed remainder, and reconciles the sum to the last cent, which is the whole of the bulk-creation claim for this endpoint."

      - name: corner_run_start_is_gated_on_a_sibling_entity
        claim_type: Conditional action
        grounds:
          - endpoints[POST /process-runs/{id}/start]
        excluded_because:
          difficulty_instance: run_start_requires_validated_sanitation_on_line
          rationale: "That instance drives the same endpoint from refused to permitted purely by changing the line's sanitation state, which is the cross-entity conditional-action claim in its sharpest form."

  - section: errors
    instances:
      - name: corner_error_body_shape_is_uniform_across_status_families
        claim_type: Error Triggerability
        grounds:
          - response_envelope.error
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Five errors spanning 401, 403, 400, 404 and 409 all come back in the identical error envelope - response_type error with exactly error_id and message under data - so a client cannot distinguish the families by shape, only by status and error_id."
        test_recipe:
          setup: ["execute BASE steps 1-2, so the clock reads 2026-08-02T05:00:00Z and product RML-SHRED exists"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              as_user_id: ""
              captures: { e401: "$.data.error_id", m401: "$.data.message" }
            - call: "POST /products"
              payload: { code: "SLAW-MIX", name: "Slaw Mix", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: false }
              as: QAManager
              captures: { e403: "$.data.error_id" }
            - call: "POST /products"
              payload: { code: "SLAW-MIX", name: "Slaw Mix", commodity_class: "PLASTIC", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: false }
              as: PlantAdmin
              captures: { e400: "$.data.error_id" }
            - call: "GET /products/11111111-1111-4111-8111-111111111111"
              as: PlantAdmin
              captures: { e404: "$.data.error_id" }
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred Duplicate", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: false }
              as: PlantAdmin
              captures: { e409: "$.data.error_id" }
            - call: "GET /products"
              as: PlantAdmin
              captures: { first_code: "$.data[0].code" }
          assert:
            - "${e401} == ERR_UNAUTHENTICATED with HTTP 401 when X-User-ID is the empty string, and ${m401} is a non-empty human-readable string"
            - "${e403} == ERR_UNAUTHORIZED with HTTP 403 because PlantAdmin is the only role on POST /products"
            - "${e400} == ERR_INVALID_REQUEST with HTTP 400 for the undeclared commodity_class member"
            - "${e404} == ERR_PRODUCT_NOT_FOUND with HTTP 404 for a well-formed but unknown UUID"
            - "${e409} == ERR_DUPLICATE_CODE with HTTP 409, the code uniqueness being enforced after the payload has been accepted as well-formed"
            - "every one of the five bodies carries meta.api_request_id and meta.api_request_timestamp, response_type == error, and exactly the two keys error_id and message under data"
            - "${first_code} == RML-SHRED and the list reports total_count 1: none of the five rejected calls created a Product"

      - name: corner_ship_reports_the_run_cause_before_the_case_symptom
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_HOLD_NOT_RELEASED]
          - errors[ERR_CASE_NOT_IN_INVENTORY]
          - validations[priority=35]
          - validations[priority=36]
        distinguishing_aspect: "The same case yields two different 409s depending on why it cannot ship: while the run is HELD the run-level cause is reported even though the case itself is ON_HOLD, and only once the run is RELEASED can the case-level ERR_CASE_NOT_IN_INVENTORY surface, on a second ship of an already shipped case."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED, its disposition_status is HELD and all 900 cases are ON_HOLD"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: ShippingClerk
              captures: { c1: "$.data[0].id", c1_st: "$.data[0].status" }
          trigger:
            - call: "POST /finished-cases/${c1}/ship"
              as: ShippingClerk
              captures: { e_run: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 900000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "POST /finished-cases/${c1}/ship"
              as: ShippingClerk
              captures: { st_ok: "$.data.status" }
            - call: "POST /finished-cases/${c1}/ship"
              as: ShippingClerk
              captures: { e_case: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: ShippingClerk
              captures: { shipped: "$.data.cases_shipped", avail: "$.data.cases_available" }
          assert:
            - "${c1_st} == ON_HOLD before the release"
            - "${e_run} == ERR_HOLD_NOT_RELEASED with HTTP 409: priority 35 fires before the case's own status is inspected at 36"
            - "${st_ok} == SHIPPED once the run's disposition_status is RELEASED"
            - "${e_case} == ERR_CASE_NOT_IN_INVENTORY with HTTP 409 on the repeat, which is only reachable because the run-level gate now passes"
            - "${shipped} == 1 and ${avail} == 899: the refused repeat did not double-count the shipment"

      - name: corner_yield_tolerance_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_YIELD_OUT_OF_TOLERANCE]
        excluded_because:
          difficulty_instance: yield_at_exact_product_minimum_passes
          rationale: "That instance closes one run at exactly the product minimum and a second one a hundredth of a percent below it, so both the pass side and the ERR_YIELD_OUT_OF_TOLERANCE side of the 422 are already triggered there."

  - section: rbac
    instances:
      - name: corner_every_role_is_refused_the_other_roles_exclusive_writes
        claim_type: Exclusive operation denial
        grounds:
          - roles[PlantAdmin].exclusive_operations
          - roles[ReceivingClerk].exclusive_operations
          - roles[QATechnician].exclusive_operations
          - roles[QAManager].exclusive_operations
          - roles[LineOperator].exclusive_operations
          - roles[SanitationTech].exclusive_operations
          - roles[ShippingClerk].exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: "Seven exclusive writes are each attempted by a role that is not on the endpoint, and every one is refused with ERR_UNAUTHORIZED before any state, payload or foreign-key check runs - including the sanitation start that would also have failed its state gate, and an undeclared role string that is refused on a read every real role may perform."
        test_recipe:
          setup: ["execute BASE steps 1-13, so P_ROMAINE, S_FS, L1, W1, G1 APPROVED, R1 ACCEPTED and a VALIDATED sanitation event exist and the clock is 2026-08-02T05:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { code: "PA-ONLY", name: "Admin Only", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: false }
              as: ShippingClerk
              captures: { d1: "$.data.error_id" }
            - call: "POST /raw-receipts"
