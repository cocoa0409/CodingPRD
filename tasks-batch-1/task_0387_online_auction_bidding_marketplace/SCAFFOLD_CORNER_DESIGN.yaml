scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with email/display_name/roles returns 201; fee_balance_cents==0, feedback_score==0, standing==GOOD, status==ACTIVE all defaulted server-side."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "c1@x.com", display_name: "C1", roles: ["SELLER","BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Account.${a_id}.fee_balance_cents == 0"
            - "Account.${a_id}.feedback_score == 0"
            - "Account.${a_id}.standing == GOOD"
            - "Account.${a_id}.status == ACTIVE"
            - "Account.${a_id}.version == 1"

      - name: create_account_missing_roles_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Account.fields.roles, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts omitting the required roles field is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "c2@x.com", display_name: "C2" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: get_listing_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Listing, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /listings/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: listing_computed_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Listing.fields.status, entities.Listing.fields.current_price_cents, entities.Listing.fields.effective_end_at]
        distinguishing_aspect: "On POST /listings the server-managed status starts DRAFT and computed price/end fields are null/uninitialized regardless of any client-supplied values; only declared input fields are honored."
        test_recipe:
          setup: ["Seller S registered."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c3@x.com", display_name: "C3", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T3", format: "AUCTION", start_price_cents: 10000, scheduled_end_at: "2026-07-01T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Listing.${lst_id}.status == DRAFT"
            - "Listing.${lst_id}.bid_count == 0"
            - "Listing.${lst_id}.winner_account_id == null"

      - name: listing_default_accepts_offers_false
        claim_type: Defaults
        grounds: [entities.Listing.fields.accepts_offers]
        distinguishing_aspect: "Omitting accepts_offers on POST /listings defaults it to false."
        test_recipe:
          setup: ["Seller S registered."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c4@x.com", display_name: "C4", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T4", format: "BUY_NOW", buy_now_price_cents: 9000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "Listing.${lst_id}.accepts_offers == false"

      - name: account_feedback_score_computed_correct
        claim_type: Computed Fields
        grounds: [entities.Account.fields.feedback_score, calculations.account_feedback_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / account_feedback_score_net_vs_seller_fee_balance_outstanding
          rationale: "feedback_score computed value (POSITIVE-NEGATIVE net) is asserted directly in that §1.8 instance."

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_listing_with_bids_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Listing.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ACTIVE listing that already has >=1 bid cannot be cancelled; POST /listings/{id}/cancel returns ERR_INVALID_STATE (precondition bid_count==0 fails)."
        test_recipe:
          setup: ["Seller S publishes AUCTION start 10000 ending 2026-07-01; Buyer A places one bid max 12000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c5s@x.com", display_name: "C5S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c5a@x.com", display_name: "C5A", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T5", format: "AUCTION", start_price_cents: 10000, scheduled_end_at: "2026-07-01T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 12000 }
              as: Buyer
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /listings/${lst_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Listing.${lst_id}.status == ACTIVE"

      - name: terminal_listing_cancelled_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Listing.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED (terminal) listing rejects further transitions; a second POST /listings/{id}/cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Seller S creates a DRAFT listing and cancels it (now CANCELLED, terminal)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c6@x.com", display_name: "C6", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T6", format: "BUY_NOW", buy_now_price_cents: 9000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /listings/${lst_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Listing.${lst_id}.status == CANCELLED"

      - name: offer_accept_declines_competing_offers_conditional_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Listing.ACTIVE_to_SOLD, state_machines.Offer.PENDING_to_ACCEPTED, entities.Offer.fields.status]
        distinguishing_aspect: "When the seller accepts one offer, the conditional cascade DECLINES all other PENDING/COUNTERED offers on the same listing while the accepted one becomes ACCEPTED and an Order(OFFER_ACCEPT) is created."
        test_recipe:
          setup: ["Seller S publishes BUY_NOW 50000 accepts_offers; Buyer B1 offers 20000; Buyer B2 offers 22000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c7s@x.com", display_name: "C7S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c7b1@x.com", display_name: "C7B1", roles: ["BUYER"] }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c7b2@x.com", display_name: "C7B2", roles: ["BUYER"] }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T7", format: "BUY_NOW", buy_now_price_cents: 50000, accepts_offers: true }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_account_id: "${b1_id}", amount_cents: 20000 }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { off1_id: $.data.id }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_account_id: "${b2_id}", amount_cents: 22000 }
              as: Buyer
              as_user_id: "${b2_id}"
              captures: { off2_id: $.data.id }
          trigger:
            - call: "POST /offers/${off1_id}/accept"
              payload: { shipping_cents: 0 }
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "Offer.${off1_id}.status == ACCEPTED"
            - "Offer.${off2_id}.status == DECLINED"
            - "Listing.${lst_id}.status == SOLD"
            - "Listing.${lst_id}.sold_price_cents == 20000"

      - name: offer_expires_on_clock_advance
        claim_type: Valid Transition
        grounds: [state_machines.Offer.PENDING_to_EXPIRED, entities.Offer.fields.status]
        distinguishing_aspect: "A PENDING offer auto-transitions to EXPIRED once the clock advances past created_at + OFFER_TTL_SECONDS (24h)."
        test_recipe:
          setup: ["Seller S publishes BUY_NOW 50000 accepts_offers at clock 2026-06-01T00:00:00Z; Buyer B offers 20000; clock advances 25h."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c8s@x.com", display_name: "C8S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c8b@x.com", display_name: "C8B", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T8", format: "BUY_NOW", buy_now_price_cents: 50000, accepts_offers: true }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_account_id: "${b_id}", amount_cents: 20000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T01:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Offer.${off_id}.status == EXPIRED"

      - name: dispute_branch_no_refund_leaves_payment_unchanged
        claim_type: Side Effect Execution
        grounds: [state_machines.Dispute.ESCALATED_to_RESOLVED_NO_REFUND, entities.Order.fields.payment_status]
        distinguishing_aspect: "Admin resolving an escalated dispute with approved_amount_cents==0 moves Dispute to RESOLVED_NO_REFUND, sets resolved_amount_cents==0, and leaves Order.payment_status==PAID and paid_amount_cents unchanged (divergent branch — no fee credit)."
        test_recipe:
          setup: ["Seller S, Buyer B; BUY_NOW 20000 bought+paid; B opens dispute req 5000, escalates after 72h."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c9s@x.com", display_name: "C9S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c9b@x.com", display_name: "C9B", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T9", format: "BUY_NOW", buy_now_price_cents: 20000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /orders/${ord_id}/disputes"
              payload: { opener_account_id: "${b_id}", reason: "DAMAGED", requested_amount_cents: 5000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /disputes/${disp_id}/escalate"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { approved_amount_cents: 0 }
              as: PlatformAdmin
          assert:
            - "Dispute.${disp_id}.status == RESOLVED_NO_REFUND"
            - "Dispute.${disp_id}.resolved_amount_cents == 0"
            - "Order.${ord_id}.payment_status == PAID"
            - "Order.${ord_id}.paid_amount_cents == 20000"

      - name: auction_close_reserve_not_met_no_order
        claim_type: Valid Transition
        grounds: [state_machines.Listing.ACTIVE_to_ENDED_RESERVE_NOT_MET, entities.Listing.fields.winner_account_id]
        distinguishing_aspect: "When the high bid is below reserve at close, the listing moves to ENDED_RESERVE_NOT_MET with no winner and no Order created."
        test_recipe:
          setup: ["Seller S publishes AUCTION start 10000 reserve 50000 ending 2026-06-10; Buyer A bids max 12000 (below reserve)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c10s@x.com", display_name: "C10S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c10a@x.com", display_name: "C10A", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T10", format: "AUCTION", start_price_cents: 10000, reserve_price_cents: 50000, scheduled_end_at: "2026-06-10T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 12000 }
              as: Buyer
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "Listing.${lst_id}.status == ENDED_RESERVE_NOT_MET"
            - "Listing.${lst_id}.winner_account_id == null"

      - name: hybrid_buy_now_blocked_after_first_bid
        claim_type: Invalid Transitions
        grounds: [state_machines.Listing.ACTIVE_to_SOLD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "On a HYBRID listing the buy-now option disappears after the first bid; POST /listings/{id}/buy-now once bid_count>=1 returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Seller S publishes HYBRID start 10000 buy_now 30000 ending 2026-06-10; Buyer A bids max 12000 (bid_count=1)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c11s@x.com", display_name: "C11S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c11a@x.com", display_name: "C11A", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c11b@x.com", display_name: "C11B", roles: ["BUYER"] }
              as: Anonymous
              captures: { bb_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T11", format: "HYBRID", start_price_cents: 10000, buy_now_price_cents: 30000, scheduled_end_at: "2026-06-10T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 12000 }
              as: Buyer
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${bb_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${bb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Listing.${lst_id}.status == ACTIVE"

      - name: auction_close_met_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Listing.ACTIVE_to_ENDED_MET, state_machines.Listing.ENDED_MET_to_SOLD]
        excluded_because:
          difficulty_instance: transitive_cascade / auction_close_cascade_order_invoice_balance
          rationale: "The ENDED_MET->SOLD cascade and Order/Invoice creation are asserted end-to-end in that §1.8 instance."

      - name: settle_invoice_clears_fee_balance_restores_standing
        claim_type: Valid Transition
        grounds: ["state_machines.SellerFeeInvoice.INVOICED_to_PAID", entities.Account.fields.fee_balance_cents, entities.Account.fields.standing, calculations.seller_fee_balance]
        distinguishing_aspect: "Settling the seller's INVOICED invoice (amount 3630) flips it to PAID; the seller's fee_balance_cents drops to 0 (PAID contributes 0) and standing returns to GOOD."
        test_recipe:
          setup: ["Seller S sold a BUY_NOW item 30000 (Invoice 3630 INVOICED, S.fee_balance_cents 3630, S.standing SUSPENDED)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c36s@x.com", display_name: "C36S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c36b@x.com", display_name: "C36B", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T36", format: "BUY_NOW", buy_now_price_cents: 30000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /seller-fee-invoices?order_id=${ord_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /seller-fee-invoices/${inv_id}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SellerFeeInvoice.${inv_id}.settlement_status == PAID"
            - "Account.${s_id}.fee_balance_cents == 0"
            - "Account.${s_id}.standing == GOOD"

  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: bid_increment_tier_lower_edge_inclusive
        claim_type: Constants Applied
        grounds: [calculations.bid_increment, "validations[priority=11]"]
        distinguishing_aspect: "At current_price exactly 50000 the increment tier is 1000 (lower-edge inclusive), so the minimum next bid is 51000; a bid of 50999 is rejected ERR_BID_TOO_LOW while 51000 is accepted."
        test_recipe:
          setup: ["Seller S publishes AUCTION start 50000 ending 2026-06-10; Buyer A bids max 50000 (first -> current 50000)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c12s@x.com", display_name: "C12S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c12a@x.com", display_name: "C12A", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c12b@x.com", display_name: "C12B", roles: ["BUYER"] }
              as: Anonymous
              captures: { bb_id: $.data.id }
            - call: "POST /_clock/set"
