      - name: referential_check_precedes_fiscal_cap_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=10]", "validations[priority=13]"]
        distinguishing_aspect: "A chargeback that is both unattributed AND far over a 5000 cap returns ERR_DIVERSION_NOT_ATTRIBUTED, confirming the fiscal ceiling is 'checked last'."
        test_recipe:
          setup: ["Northwind shipped and traced SN-0001; a third distributor Tightwad Ltd exists with annual_chargeback_cap_cents 5000; the request bills Tightwad for 4 units (10000)."]
          setup_api_calls:
