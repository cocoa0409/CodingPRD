        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-commit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "generate-options bumps the case version; a commit carrying the pre-regeneration version is rejected 412 while the case stays OFFERED."
        test_recipe:
          setup: ["event RECOVERY; booking disrupted; case OFFERED (options generated once, version captured)"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
