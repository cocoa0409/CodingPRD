              captures: { o_apr: $.data.id }
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2027-07-12T06:00:00Z", window_end: "2027-07-13T06:00:00Z", scope_note: "july slot" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { o_jul: $.data.id }
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2027-10-11T06:00:00Z", window_end: "2027-10-12T06:00:00Z", scope_note: "october slot" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { o_oct: $.data.id }
          assert:
            - "all four calls returned 201 with status == PROPOSED and deferral_count == 0"
            - "MaintenanceOutage.${o_jan}.seasonality_index == 0.62"
            - "MaintenanceOutage.${o_apr}.seasonality_index == 1.05"
            - "MaintenanceOutage.${o_jul}.seasonality_index == 1.20"
            - "MaintenanceOutage.${o_oct}.seasonality_index == 0.90"
            - "every outage has planned_downtime_hours == 24.00, at_risk_msf == 0.000 and opportunity_cost_usd == 0.00"

      - name: fail_rate_exactly_at_the_downgrade_ceiling_downgrades_rather_than_holds
