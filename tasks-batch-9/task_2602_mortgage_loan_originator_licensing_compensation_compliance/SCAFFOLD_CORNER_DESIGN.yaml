            - "${auth1} == 2026-09-02T00:00:00Z (re-stamped at reinstatement)"
            - "${s2_exp} contains ${lic_id}"
            - "${st2} == ACTIVE, ${cnt2} == 2"
            - "${exp2} == 2028-09-02T00:00:00Z (clock 2027-09-03 + 365 days)"
            - "${win2} == 2028-07-04T00:00:00Z"
            - "${s3_exp} contains ${lic_id}"
            - "HTTP status is 422 on the third REINSTATE"
            - "${err} == ERR_REINSTATEMENT_LIMIT_REACHED"
            - "${fin_st} == EXPIRED (the refusal left the licence lapsed)"
            - "${fin_cnt} == 2 (the failed attempt did not bump the counter)"
            - "${fin_exp} == 2028-09-02T00:00:00Z (unchanged by the refusal)"
            - "${fin_year} == 2026 (no renewal completion ever ran)"
            - "${states} == [] (an EXPIRED licence confers no authority)"

