            - call: "GET /cbb/collections/${col_id}/units"
              as: ProcessingTechnologist
              as_user_id: "pt-001"
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /cbb/processing-runs"
              payload: { unit_id: "${unit_id}", method: "HES_SEDIMENTATION", pre_tnc_millions: 1100 }
              as: ProcessingTechnologist
              as_user_id: "pt-001"
              captures: { run_id: "$.data.id" }
            - call: "POST /cbb/processing-runs/${run_id}/complete"
              payload: { outcome: "COMPLETED", post_volume_ml: 25.0, post_tnc_millions: 1000 }
              as: ProcessingTechnologist
              as_user_id: "pt-001"
            - call: "GET /cbb/units/${unit_id}/quality-tests"
              as: MedicalDirector
              as_user_id: "md-001"
          trigger:
            - call: "POST /cbb/units/${unit_id}/eligibility-determination"
              payload: { decision_note: "premature determination" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "GET /cbb/units/${unit_id}"
              as: MedicalDirector
              as_user_id: "md-001"
          assert:
            - "the pre-trigger quality-tests listing has total_count == 0"
            - "the trigger returns HTTP 409 with error_id ERR_NO_QUALITY_TEST — not ERR_STERILITY_POSITIVE (priority 15) and not ERR_MATERNAL_SCREENING_INCOMPLETE (priority 13, satisfied by the COMPLETED panel)"
            - "unit read: eligibility_status still PENDING, eligibility_reason_code == null, eligibility_determined_by_user_id == null, quality_acceptance_score == null"
            - "unit read: post_processing_volume_ml == 25.0 and processing_status == VOLUME_REDUCED are untouched by the refusal"

      - name: corner_higher_priority_state_error_wins_over_the_fiscal_error
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: unit_state_409_outranks_account_delinquent_402_on_reservation
          rationale: "That §1.8 instance constructs a request that violates both the priority-9 unit-state rule and the priority-33 delinquency rule and asserts the 409 wins, then removes the state violation to show the 402 surfacing — the full priority-ordering claim."

      - name: corner_priority_conflict_across_distant_priorities
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: maternal_reactive_422_outranks_confirmatory_required_409_on_release
          rationale: "Priorities 14 and 17 are violated by the same release call in that instance, which asserts the lower-numbered 422 masks the 409 and then unmasks it, covering the priority-conflict pattern across distant priorities."

      - name: corner_release_validity_depends_on_the_holding_tank
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: release_gated_on_holding_tank_status
          rationale: "Validity of the release depends entirely on a different entity's state (the StorageTank), and that §1.8 instance tests both the invalid (ALARM -> ERR_TANK_NOT_OPERATIONAL) and the valid (ONLINE -> released) direction on the same reservation."

  - section: endpoints
    instances:
      - name: corner_storage_tank_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds: "§1.5 POST /cbb/storage-tanks (201), GET /cbb/storage-tanks/{id} (200) and GET /cbb/storage-tanks (200, filterable by status and tank_class with limit/offset); §1.1 StorageTank declares no update or delete surface."
        distinguishing_aspect: "The full CRUD surface the scaffold actually offers for a tank — create, read-by-id, filtered list — plus the explicit absence of update and delete endpoints, so a re-read must be byte-identical to the creation body."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "No StorageTank rows exist."
