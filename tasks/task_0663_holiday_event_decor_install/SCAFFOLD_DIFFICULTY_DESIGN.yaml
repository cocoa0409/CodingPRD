        grounds:
          - validations[priority=13]
          - entities.StorageLot.fields.stored_from
          - entities.StorageLot.fields.released_on
          - entities.StorageBay.fields.capacity_units
        distinguishing_aspect: >
          Storage-bay resource, half-open aggregate-capacity semantics: a lot of 30 units is rejected
          because it overlaps an existing 80-unit lot on a capacity-100 bay (80+30 > 100); but an
