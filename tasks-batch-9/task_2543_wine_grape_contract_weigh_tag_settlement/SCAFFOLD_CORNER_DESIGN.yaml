              as: HarvestCoordinator
              captures: { pick_call_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_call_id}/acknowledge"
              payload: {}
              as: Grower
          trigger:
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_closed}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 20.000 }
              as: HarvestCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_open}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 40.500 }
              as: HarvestCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_open}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 40.000 }
              as: HarvestCoordinator
              captures: { appointment_id: $.data.id }
            - call: "GET /grower-relations/crush-pad-lanes/${lane_open}"
              as: HarvestCoordinator
            - call: "GET /grower-relations/crush-pad-lanes/${lane_closed}"
              as: HarvestCoordinator
          assert:
            - "${e1} == ERR_LANE_CLOSED with HTTP 409: an idle window on a CLOSED lane is still unbookable"
            - "${e2} == ERR_LOAD_EXCEEDS_LANE_MAX with HTTP 409: 40.500 > max_load_tons 40.000 even though the lane's daily budget of 80.000 t is untouched"
            - "The third call returns 201 with status SCHEDULED: planned_tons exactly equal to max_load_tons is accepted"
            - "Lane ${lane_open} reports committed_tons == 40.000 and scheduled_appointment_count == 1 — only the accepted booking moved the ledger"
            - "Lane ${lane_closed} reports committed_tons == 0.000 and scheduled_appointment_count == 0 — the refused call left no trace"

