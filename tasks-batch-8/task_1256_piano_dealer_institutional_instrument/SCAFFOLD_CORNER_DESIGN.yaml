  # ==================================================================
  # Section: rbac
  # ==================================================================
  - section: rbac
    instances:
      - name: bid_self_approval_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", "errors[ERR_SOD_SELF_APPROVAL]", "roles[ComplianceOfficer]"]
        distinguishing_aspect: "Segregation of duties: a ComplianceOfficer whose X-User-ID equals the bid's prepared_by_user_id is refused with ERR_SOD_SELF_APPROVAL; a different officer approves successfully."
        test_recipe:
          setup: ["INSTITUTIONAL customer; instrument 500000/300000; bid created by X-User-ID 'ibo-self' and SUBMITTED"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "SOD County", email: "buy@sod.gov", customer_type: "INSTITUTIONAL", institution_type: "GOVERNMENT", state_contract_ceiling_cents: 900000 }
              as: SalesAssociate
              captures: { cu_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-SOD-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${i_id}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-self"
              captures: { b_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages/${b_id}/submit"
              as: InstitutionalBidOfficer
              as_user_id: "ibo-self"
          trigger:
            - call: "POST /piano-dealer/bid-packages/${b_id}/compliance-approve"
              as: ComplianceOfficer
              as_user_id: "ibo-self"
              captures: { err: $.data.error_id }
            - call: "POST /piano-dealer/bid-packages/${b_id}/compliance-approve"
              as: ComplianceOfficer
              as_user_id: "co-other"
          assert:
            - "Self-approval: error_id == ERR_SOD_SELF_APPROVAL (403); status remains SUBMITTED"
            - "Different officer: succeeds, BidPackage.${b_id}.status == APPROVED"

      - name: sales_associate_cannot_approve_bid
        claim_type: role_denial
        grounds: ["roles[SalesAssociate]", "roles[ComplianceOfficer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Role gate: SalesAssociate is not in the compliance-approve role list — ERR_UNAUTHORIZED_ROLE regardless of bid state."
        test_recipe:
          setup: ["INSTITUTIONAL customer; instrument; SUBMITTED bid"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Role Tech", email: "rt@role.edu", customer_type: "INSTITUTIONAL", institution_type: "EDUCATION" }
              as: SalesAssociate
              captures: { cu_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-RB-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${i_id}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-rb"
              captures: { b_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages/${b_id}/submit"
              as: InstitutionalBidOfficer
              as_user_id: "ibo-rb"
          trigger:
            - call: "POST /piano-dealer/bid-packages/${b_id}/compliance-approve"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403)"

      - name: customer_cannot_intake_instrument
        claim_type: role_denial
        grounds: ["roles[Customer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Customer role is excluded from inventory management: POST /instruments as Customer fails with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["One registered customer"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Nosy Nell", email: "nell@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-NO-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 300000, floor_price_cents: 200000 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403)"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Unknown/absent role credential fails priority 1 with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Ghost User", email: "ghost@x.com", customer_type: "INDIVIDUAL" }
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401)"

      - name: customer_cannot_counter_another_customers_appraisal
        claim_type: role_denial
        grounds: ["validations[priority=3]", "roles[Customer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Ownership binding for entity_backed role: Customer B's X-User-ID does not equal appraisal.customer_id of Customer A's appraisal — ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Customers A and B; A's appraisal evaluated to OFFERED"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Owner Ann", email: "oa@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { ca_id: $.data.id }
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Intruder Ian", email: "ii@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { cb_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${ca_id}", category: "UPRIGHT", manufacturer: "Kawai", model: "K300", year_built: 2016, condition_grade: "EXCELLENT" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 0, market_adjustment_pct: 0.0 }
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/counter"
              payload: { counter_value_cents: 700000 }
              as: Customer
              as_user_id: "${cb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403)"
            - "TradeInAppraisal.${a_id}.status remains OFFERED"

  # ==================================================================
  # Section: consistency_model (immediate)
  # ==================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_created_resources
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A created instrument is GET-table in the very next request with all server fields populated (status IN_PREP, version 1)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-IM-1", category: "HYBRID", manufacturer: "Yamaha", model: "N1X", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 700000, floor_price_cents: 550000 }
              as: StoreManager
              captures: { i_id: $.data.id }
          trigger:
            - call: "GET /piano-dealer/instruments/${i_id}"
              as: StoreManager
          assert:
            - "GET returns the instrument with status == IN_PREP and version == 1 in the same test step (no lag)"
