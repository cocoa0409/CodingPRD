      - name: subscription_load_lines_round_independently_before_summing
        claim_type: aggregation
        grounds:
          - calculations.subscription_load_and_shares
          - entities.Subscription.fields.upfront_selling_commission_cents
          - entities.Subscription.fields.dealer_manager_fee_cents
        excluded_because:
          difficulty_instance: subscription_load_per_line_rounding_then_sum
          rationale: |
            The §1.8 instance already pins the two independently rounded load
            lines (6881 and 626 on a 250200-cent gross at 275 and 25 bps), the
            242693-cent net investment and the floor-then-remainder share
            issuance. A breadth copy would re-assert the same aggregation.

      - name: repurchase_waterfall_fills_hardship_tier_before_pro_rata
        claim_type: waterfall_allocation
        grounds:
          - calculations.repurchase_allocation_waterfall
          - entities.RepurchaseRequest.fields.hardship_type
          - entities.RepurchaseRequest.fields.approved_value_cents
        excluded_because:
          difficulty_instance: repurchase_hardship_tier_then_prorata_leftover_allocation
          rationale: |
            The §1.8 instance already fills the hardship tier in full first, then
            pro-rates the residual capacity across the ordinary tier with floor
            rounding and hands the single leftover cent to the earliest-created
            request. Every waterfall boundary claim is already asserted there.

      - name: nav_variance_threshold_boundary_requires_no_opinion
        claim_type: threshold
        grounds:
          - calculations.nav_variance
          - entities.NavRecord.fields.variance_bps
          - errors[ERR_ADVISOR_OPINION_REQUIRED]
        excluded_because:
          difficulty_instance: nav_variance_exactly_at_escalation_threshold
          rationale: |
            The §1.8 instance already drives a 1000 -> 1050 move to exactly 500
            bps and confirms confirmation succeeds without an opinion reference,
            then a 550 bps move that demands one. Both sides of
            NAV_VARIANCE_ESCALATION_BPS are covered.

      - name: distribution_fee_accrues_to_cap_then_converts_the_lot
        claim_type: threshold
        grounds:
          - calculations.distribution_fee_accrual_and_conversion
          - entities.ShareLot.fields.cumulative_distribution_fee_cents
          - entities.ShareClass.fields.converts_to_class_code
        excluded_because:
          difficulty_instance: distribution_fee_capped_accrual_then_class_conversion_order
          rationale: |
            The §1.8 instance already clamps the final monthly accrual to the
            remaining cap headroom and then converts the lot at the destination
            class price in the declared order, so the cap threshold and the
            accrue-before-convert sequencing are both already asserted.

      - name: nav_period_closed_intervals_overlap_on_a_shared_endpoint
        claim_type: interval_merge
        grounds:
          - calculations.nav_period_coverage
          - errors[ERR_NAV_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: nav_period_closed_interval_overlap_versus_adjacent_month
          rationale: |
            The §1.8 instance already contrasts a shared endpoint date (an
            overlap under closed-interval semantics) with a truly adjacent month
            that is accepted, which is exactly the interval_merge boundary claim
            for this rule.

      - name: repurchase_windows_may_touch_but_settlement_blackout_conflicts
        claim_type: interval_merge
        grounds:
          - calculations.repurchase_period_window
          - errors[ERR_REPURCHASE_PERIOD_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: repurchase_window_adjacency_legal_but_settlement_blackout_conflicts
          rationale: |
            The §1.8 instance already shows that half-open request windows may
            touch at an endpoint while the five-day settlement blackout still
            rejects the sibling, covering the adjacency and gap cases of this
            rule.

      - name: nav_two_variants_diverge_on_one_dataset
        claim_type: variant_divergence
        grounds:
          - calculations.nav_per_share
          - entities.NavRecord.fields.nav_per_share_pre_accrual_cents
          - entities.NavRecord.fields.nav_per_share_cents
        excluded_because:
          difficulty_instance: nav_pre_accrual_vs_official_transaction_price
          rationale: |
            The §1.8 instance already computes both NAV variants from one dataset,
            asserts the exact delta between them and shows that only the official
            variant becomes the transaction price.

      - name: coverage_two_variants_diverge_on_one_declaration
        claim_type: variant_divergence
        grounds:
          - calculations.distribution_declaration_total_and_coverage
          - entities.DistributionDeclaration.fields.coverage_ratio_gaap_bps
          - entities.DistributionDeclaration.fields.coverage_ratio_cash_bps
        excluded_because:
          difficulty_instance: distribution_coverage_gaap_basis_vs_cash_flow_basis
          rationale: |
            The §1.8 instance already measures one declared total against both
            GAAP net income and adjusted cash flow, asserts the two
            return-of-capital figures and shows that only the cash-flow variant
            gates the acknowledgement error.

