scenario: "Immigration Case Management (USCIS): case type (I-130/485/765/131), Receipt Number, Biometrics, RFE response, Priority Date, Visa Bulletin, AOS interview."

domain_name: "uscis-case-management"
api_prefix: "/uscis"

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "workflow_orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: alien_number
        type: string
        source: input
        description: "A-Number, e.g. A123456789; unique across applicants"
        constraints: "matches ^A\\d{9}$; UNIQUE"
      - name: full_name
        type: string
        source: input
        description: "Legal name of applicant"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date YYYY-MM-DD"
      - name: country_of_chargeability
        type: enum
        source: input
        description: "Visa-bulletin country bucket"
        constraints: "one of: WORLDWIDE, CHINA, INDIA, MEXICO, PHILIPPINES"
      - name: email
        type: string
        source: input
        description: "Contact email; UNIQUE"
      - name: is_under_14
        type: boolean
        source: computed
        description: "True when date_of_birth implies age < 14 at case file_date; recomputed when Case.file_date is stamped"

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - name: bar_number
        type: string
        source: input
        description: "State bar number; UNIQUE"
      - name: full_name
        type: string
        source: input
        description: "Attorney name"
      - name: firm_name
        type: string
        source: input
        description: "Law firm or solo practice name"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the principal applicant for this case"
      - name: attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; G-28 representative; nullable when applicant is self-represented"
      - name: case_type
        type: enum
        source: input
        description: "USCIS form filed"
        constraints: "one of: I-130, I-485, I-765, I-131"
      - name: preference_category
        type: enum
        source: input
        description: "Required for I-130; ignored otherwise"
        constraints: "one of: F1, F2A, F2B, F3, F4, IR; nullable when case_type != I-130"
      - name: receipt_number
        type: string
        source: system
        description: "Server-minted 13-char receipt: <SC>YY<DDD>NNNNN where SC=service-center code; UNIQUE"
        constraints: "matches ^(NBC|MSC|SRC|EAC|WAC|LIN|YSC|NSC|VSC|TSC)\\d{10}$"
      - name: priority_date
        type: string
        source: system
        description: "ISO date stamped at FILED transition; equals file_date for I-485/I-765/I-131; for I-130 equals file_date as well (no labor cert in this scope)"
      - name: file_date
        type: string
        source: system
        description: "ISO date; stamped when case transitions DRAFT->FILED"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle state"
        constraints: "one of: DRAFT, FILED, BIOMETRICS_SCHEDULED, BIOMETRICS_COMPLETED, UNDER_REVIEW, RFE_PENDING, INTERVIEW_SCHEDULED, INTERVIEW_COMPLETED, APPROVED, DENIED, ABANDONED"
      - name: filing_fee_cents
        type: integer
        source: computed
        description: "Server-computed at FILED transition per calculations.filing_fee"
      - name: rfe_round_count
        type: integer
        source: system
        description: "Number of RFE cycles consumed; increments on each RFE issuance"
        default: 0
      - name: assigned_officer_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Officer assigned at FILED; nullable until assignment"

  - name: BiometricsAppointment
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id"
      - name: scheduled_at
        type: string
        source: input
        description: "ISO 8601 UTC timestamp of the appointment"
      - name: asc_location_code
        type: string
        source: input
        description: "Application Support Center code, e.g. ASC-SF-01"
      - name: status
        type: enum
        source: system
        description: "Appointment state"
        constraints: "one of: SCHEDULED, COMPLETED, NO_SHOW, RESCHEDULED"

  - name: RFE
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id"
      - name: issued_at
        type: string
        source: system
        description: "ISO 8601 UTC; stamped at issuance"
      - name: response_deadline
        type: string
        source: computed
        description: "Server-computed ISO date = issued_at + 87 calendar days (per calculations.rfe_deadline)"
      - name: evidence_items_requested
        type: array
        source: input
        description: "Array of strings naming evidence categories requested"
      - name: status
        type: enum
        source: system
        description: "RFE lifecycle state"
        constraints: "one of: ISSUED, RESPONDED, EXPIRED"
      - name: responded_at
        type: string
        source: system
        description: "ISO 8601 UTC of response submission; nullable until RESPONDED"

  - name: InterviewAppointment
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id"
      - name: scheduled_at
        type: string
        source: input
        description: "ISO 8601 UTC timestamp"
      - name: field_office_code
        type: string
        source: input
        description: "Field office code, e.g. FO-SFR"
      - name: status
        type: enum
        source: system
        description: "Interview state"
        constraints: "one of: SCHEDULED, COMPLETED, NO_SHOW, RESCHEDULED"
      - name: decision_after_interview
        type: enum
        source: system
        description: "Officer's decision recorded at COMPLETED transition"
        constraints: "one of: APPROVE, DENY, NEEDS_REVIEW; nullable until COMPLETED"

  - name: VisaBulletinEntry
    parent: null
    common_fields: false
    fields:
      - name: bulletin_month
        type: string
        source: input
        description: "ISO month YYYY-MM (e.g., 2026-06); UNIQUE per (preference_category, country, chart_type)"
      - name: preference_category
        type: enum
        source: input
        description: "Family-based preference category"
        constraints: "one of: F1, F2A, F2B, F3, F4, IR"
      - name: country
        type: enum
        source: input
        description: "Chargeability country bucket"
        constraints: "one of: WORLDWIDE, CHINA, INDIA, MEXICO, PHILIPPINES"
      - name: chart_type
        type: enum
        source: input
        description: "Which chart this entry belongs to"
        constraints: "one of: FINAL_ACTION, FILING_DATE"
      - name: cutoff_date
        type: string
        source: input
        description: "ISO date or 'CURRENT'; priority_date < cutoff_date means visa available under FINAL_ACTION chart (strict <)"

  - name: CaseEvent
    parent: Case
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; parent case for this event"
      - name: event_type
        type: enum
        source: system
        description: "Event kind"
        constraints: "one of: STATUS_CHANGE, RFE_ISSUED, RFE_RESPONDED, RFE_EXPIRED, BIOMETRICS_COMPLETED, INTERVIEW_COMPLETED, FEE_ASSESSED, OFFICER_ASSIGNED, VISA_AVAILABILITY_CHECK"
      - name: from_status
        type: string
        source: system
        description: "Prior Case.status when event_type=STATUS_CHANGE; nullable otherwise"
      - name: to_status
        type: string
        source: system
        description: "New Case.status when event_type=STATUS_CHANGE; nullable otherwise"
      - name: payload_json
        type: object
        source: system
        description: "Free-form structured payload for the event (e.g., {rfe_id, evidence_items})"
      - name: occurred_at
        type: string
        source: system
        description: "ISO 8601 UTC of event"

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: string
        source: system
        description: "ISO 8601 UTC the server treats as 'now' for deadline math and bulletin month resolution; mutated by test-driving endpoint /uscis/_clock/set_current_utc; singleton record id='clock'"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, ABANDONED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /uscis/cases/{id}/file"
        actor: Applicant
        preconditions:
          - "Case.status == DRAFT"
          - "Case.case_type is set"
          - "If case_type == I-130 then preference_category is one of {F1,F2A,F2B,F3,F4,IR}"
          - "Applicant referenced by applicant_id exists"
        side_effects:
          - "Mint receipt_number per receipt-number scheme"
          - "Stamp file_date = ClockState.current_utc[:10]"
          - "Stamp priority_date = file_date"
          - "Compute filing_fee_cents per calculations.filing_fee and stamp on Case"
          - "Assign officer (round-robin opaque officer_id from server pool); writes assigned_officer_id"
          - "Recompute Applicant.is_under_14 against file_date"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=DRAFT, to=FILED}"
          - "Append CaseEvent{event_type=FEE_ASSESSED, payload_json={fee_cents}}"
          - "Append CaseEvent{event_type=OFFICER_ASSIGNED, payload_json={officer_id}}"
          - "Increment Case.version by 1"

      - from: FILED
        to: BIOMETRICS_SCHEDULED
        trigger: "POST /uscis/cases/{id}/biometrics (creates BiometricsAppointment)"
        actor: Officer
        preconditions:
          - "Case.status == FILED"
          - "Case.case_type in {I-485, I-765, I-131} (I-130 skips biometrics in this scope)"
          - "scheduled_at >= ClockState.current_utc + 7 days"
        side_effects:
          - "Create BiometricsAppointment in SCHEDULED"
          - "Set Case.status = BIOMETRICS_SCHEDULED"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=FILED, to=BIOMETRICS_SCHEDULED}"
          - "Increment Case.version by 1"

      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /uscis/cases/{id}/advance-review (I-130 path; skip biometrics)"
        actor: Officer
        preconditions:
          - "Case.status == FILED"
          - "Case.case_type == I-130"
        side_effects:
          - "Set Case.status = UNDER_REVIEW"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=FILED, to=UNDER_REVIEW}"
          - "Increment Case.version by 1"

      - from: BIOMETRICS_SCHEDULED
        to: BIOMETRICS_COMPLETED
        trigger: "POST /uscis/biometrics/{id}/complete"
        actor: Officer
        preconditions:
          - "BiometricsAppointment.status == SCHEDULED"
          - "ClockState.current_utc >= BiometricsAppointment.scheduled_at"
          - "Parent Case.status == BIOMETRICS_SCHEDULED"
        side_effects:
          - "Set BiometricsAppointment.status = COMPLETED"
          - "Cascade: set parent Case.status = BIOMETRICS_COMPLETED"
          - "Append CaseEvent{event_type=BIOMETRICS_COMPLETED}"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=BIOMETRICS_SCHEDULED, to=BIOMETRICS_COMPLETED}"
          - "Increment Case.version by 1"

      - from: BIOMETRICS_COMPLETED
        to: UNDER_REVIEW
        trigger: "POST /uscis/cases/{id}/advance-review"
        actor: Officer
        preconditions:
          - "Case.status == BIOMETRICS_COMPLETED"
        side_effects:
          - "Set Case.status = UNDER_REVIEW"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=BIOMETRICS_COMPLETED, to=UNDER_REVIEW}"
          - "Increment Case.version by 1"

      - from: UNDER_REVIEW
        to: RFE_PENDING
        trigger: "POST /uscis/cases/{id}/rfes (issue RFE)"
        actor: Officer
        preconditions:
          - "Case.status == UNDER_REVIEW"
          - "Case.rfe_round_count < 2 (at most 2 RFE rounds permitted)"
          - "evidence_items_requested length >= 1"
        side_effects:
          - "Create RFE in ISSUED with issued_at = ClockState.current_utc"
          - "Compute RFE.response_deadline = issued_at + 87 calendar days"
          - "Increment Case.rfe_round_count by 1"
          - "Set Case.status = RFE_PENDING"
          - "Append CaseEvent{event_type=RFE_ISSUED, payload_json={rfe_id, deadline}}"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=UNDER_REVIEW, to=RFE_PENDING}"
          - "Increment Case.version by 1"

      - from: RFE_PENDING
        to: UNDER_REVIEW
        trigger: "POST /uscis/rfes/{id}/respond"
        actor: Applicant
        preconditions:
          - "RFE.status == ISSUED"
          - "ClockState.current_utc < RFE.response_deadline (deadline not breached at submission)"
          - "Parent Case.status == RFE_PENDING"
          - "The acting Applicant's id equals Case.applicant_id"
        side_effects:
          - "Set RFE.status = RESPONDED"
          - "Stamp RFE.responded_at = ClockState.current_utc"
          - "Cascade: set parent Case.status = UNDER_REVIEW (loop back; rfe_round_count is NOT reset)"
          - "Append CaseEvent{event_type=RFE_RESPONDED, payload_json={rfe_id}}"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=RFE_PENDING, to=UNDER_REVIEW}"
          - "Increment Case.version by 1"

      - from: RFE_PENDING
        to: ABANDONED
        trigger: "System ops-run: POST /uscis/_ops/sweep-rfe-deadlines (or auto when clock advances past any open RFE deadline)"
        actor: system
        preconditions:
          - "RFE.status == ISSUED"
          - "ClockState.current_utc >= RFE.response_deadline"
        side_effects:
          - "Set RFE.status = EXPIRED"
          - "Cascade: set parent Case.status = ABANDONED (terminal)"
          - "Append CaseEvent{event_type=RFE_EXPIRED, payload_json={rfe_id}}"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=RFE_PENDING, to=ABANDONED}"
          - "Increment Case.version by 1"

      - from: UNDER_REVIEW
        to: INTERVIEW_SCHEDULED
        trigger: "POST /uscis/cases/{id}/interviews"
        actor: Officer
        preconditions:
          - "Case.status == UNDER_REVIEW"
          - "Case.case_type == I-485 (AOS interview applies only to I-485 in this scope)"
          - "No open RFE on this case (every RFE.status in {RESPONDED, EXPIRED})"
          - "scheduled_at >= ClockState.current_utc + 7 days"
          - "Cross-entity: for I-485 with preference_category set, visa availability under FINAL_ACTION chart must be CURRENT at scheduled_at's bulletin month — i.e., Case.priority_date < VisaBulletinEntry.cutoff_date for (preference_category, applicant.country_of_chargeability, FINAL_ACTION) OR the entry's cutoff_date == 'CURRENT'"
        side_effects:
          - "Create InterviewAppointment in SCHEDULED"
          - "Set Case.status = INTERVIEW_SCHEDULED"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=UNDER_REVIEW, to=INTERVIEW_SCHEDULED}"
          - "Increment Case.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /uscis/cases/{id}/decide"
        actor: Officer
        preconditions:
          - "Case.status == UNDER_REVIEW"
          - "Case.case_type in {I-130, I-765, I-131} (I-485 must route through interview)"
          - "No open RFE on this case"
          - "decision == APPROVE"
          - "expected_case_version equals current Case.version"
        side_effects:
          - "Set Case.status = APPROVED (terminal)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=UNDER_REVIEW, to=APPROVED}"
          - "Increment Case.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /uscis/cases/{id}/decide"
        actor: Officer
        preconditions:
          - "Case.status == UNDER_REVIEW"
          - "Case.case_type in {I-130, I-765, I-131}"
          - "decision == DENY"
          - "expected_case_version equals current Case.version"
        side_effects:
          - "Set Case.status = DENIED (terminal)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=UNDER_REVIEW, to=DENIED}"
          - "Increment Case.version by 1"

      - from: INTERVIEW_SCHEDULED
        to: INTERVIEW_COMPLETED
        trigger: "POST /uscis/interviews/{id}/complete"
        actor: Officer
        preconditions:
          - "InterviewAppointment.status == SCHEDULED"
          - "ClockState.current_utc >= InterviewAppointment.scheduled_at"
          - "Parent Case.status == INTERVIEW_SCHEDULED"
          - "decision_after_interview in {APPROVE, DENY, NEEDS_REVIEW}"
        side_effects:
          - "Set InterviewAppointment.status = COMPLETED"
          - "Stamp InterviewAppointment.decision_after_interview"
          - "Cascade: set parent Case.status = INTERVIEW_COMPLETED"
          - "Append CaseEvent{event_type=INTERVIEW_COMPLETED, payload_json={decision}}"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=INTERVIEW_SCHEDULED, to=INTERVIEW_COMPLETED}"
          - "Increment Case.version by 1"

      - from: INTERVIEW_COMPLETED
        to: APPROVED
        trigger: "POST /uscis/cases/{id}/decide"
        actor: Officer
        preconditions:
          - "Case.status == INTERVIEW_COMPLETED"
          - "Latest InterviewAppointment.decision_after_interview == APPROVE"
          - "decision == APPROVE"
          - "Cross-entity: for I-485, visa availability under FINAL_ACTION chart MUST still be CURRENT at ClockState.current_utc's bulletin month"
          - "expected_case_version equals current Case.version"
        side_effects:
          - "Set Case.status = APPROVED (terminal)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=INTERVIEW_COMPLETED, to=APPROVED}"
          - "Increment Case.version by 1"

      - from: INTERVIEW_COMPLETED
        to: DENIED
        trigger: "POST /uscis/cases/{id}/decide"
        actor: Officer
        preconditions:
          - "Case.status == INTERVIEW_COMPLETED"
          - "decision == DENY"
          - "expected_case_version equals current Case.version"
        side_effects:
          - "Set Case.status = DENIED (terminal)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=INTERVIEW_COMPLETED, to=DENIED}"
          - "Increment Case.version by 1"

      - from: INTERVIEW_COMPLETED
        to: UNDER_REVIEW
        trigger: "POST /uscis/cases/{id}/decide"
        actor: Officer
        preconditions:
          - "Case.status == INTERVIEW_COMPLETED"
          - "Latest InterviewAppointment.decision_after_interview == NEEDS_REVIEW"
          - "decision == REOPEN"
          - "expected_case_version equals current Case.version"
        side_effects:
          - "Set Case.status = UNDER_REVIEW (revision loop — back-edge)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=INTERVIEW_COMPLETED, to=UNDER_REVIEW}"
          - "Increment Case.version by 1"

  - entity: BiometricsAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /uscis/biometrics/{id}/complete"
        actor: Officer
        preconditions: ["BiometricsAppointment.status == SCHEDULED", "ClockState.current_utc >= scheduled_at"]
        side_effects: ["See Case.BIOMETRICS_SCHEDULED->BIOMETRICS_COMPLETED for cascade"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /uscis/biometrics/{id}/mark-no-show"
        actor: Officer
        preconditions:
          - "BiometricsAppointment.status == SCHEDULED"
          - "ClockState.current_utc >= scheduled_at + 24 hours"
        side_effects:
          - "Set BiometricsAppointment.status = NO_SHOW (terminal)"
          - "Cascade: set parent Case.status = ABANDONED (terminal)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=BIOMETRICS_SCHEDULED, to=ABANDONED}"
          - "Increment Case.version by 1"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /uscis/biometrics/{id}/reschedule"
        actor: Officer
        preconditions:
          - "BiometricsAppointment.status == SCHEDULED"
          - "new_scheduled_at >= ClockState.current_utc + 7 days"
        side_effects:
          - "Set BiometricsAppointment.status = RESCHEDULED"
          - "Create a new BiometricsAppointment in SCHEDULED with the new scheduled_at"
          - "Parent Case.status remains BIOMETRICS_SCHEDULED"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=BIOMETRICS_SCHEDULED, to=BIOMETRICS_SCHEDULED, payload_json={rescheduled_from, rescheduled_to}}"
          - "Increment Case.version by 1"

  - entity: RFE
    initial_state: ISSUED
    terminal_states: [RESPONDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: RESPONDED
        trigger: "POST /uscis/rfes/{id}/respond"
        actor: Applicant
        preconditions:
          - "RFE.status == ISSUED"
          - "ClockState.current_utc < RFE.response_deadline"
          - "Parent Case.status == RFE_PENDING"
        side_effects: ["See Case.RFE_PENDING->UNDER_REVIEW cascade"]
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /uscis/_ops/sweep-rfe-deadlines"
        actor: system
        preconditions:
          - "RFE.status == ISSUED"
          - "ClockState.current_utc >= RFE.response_deadline"
        side_effects: ["See Case.RFE_PENDING->ABANDONED cascade"]

  - entity: InterviewAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /uscis/interviews/{id}/complete"
        actor: Officer
        preconditions:
          - "InterviewAppointment.status == SCHEDULED"
          - "ClockState.current_utc >= scheduled_at"
        side_effects: ["See Case.INTERVIEW_SCHEDULED->INTERVIEW_COMPLETED cascade"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /uscis/interviews/{id}/mark-no-show"
        actor: Officer
        preconditions:
          - "InterviewAppointment.status == SCHEDULED"
          - "ClockState.current_utc >= scheduled_at + 24 hours"
        side_effects:
          - "Set InterviewAppointment.status = NO_SHOW (terminal)"
          - "Cascade: set parent Case.status = ABANDONED (terminal)"
          - "Append CaseEvent{event_type=STATUS_CHANGE, from=INTERVIEW_SCHEDULED, to=ABANDONED}"
          - "Increment Case.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-decide-stale-version
    parent_entity: Case
    write_endpoint: "POST /uscis/cases/{id}/decide"
    occ_field: "expected_case_version"
    description: |
      Issuing a final decision against a Case whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      writer has just issued an RFE (legitimately advancing the case state per
      §1.2 UNDER_REVIEW->RFE_PENDING) and the deciding officer's view of the
      case is therefore stale; the natural product semantics would otherwise
      allow the new request to legitimately succeed on its own.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rfe-respond-stale-version
    parent_entity: Case
    write_endpoint: "POST /uscis/rfes/{id}/respond"
    occ_field: "expected_case_version"
    description: |
      Submitting an RFE response against a Case whose version has advanced
      since the applicant last observed it is rejected. Captures the case
      where the officer has run the deadline sweep (legitimately expiring a
      separate, time-bound RFE on the same case) and the applicant's view of
      the case is now stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_fee
    trigger: "On Case.DRAFT->FILED transition (POST /uscis/cases/{id}/file)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: case_type, applicant.is_under_14 (computed at file_date), preference_category
      # Step 1: pick base fee from BASE_FEE_CENTS by case_type
      base = BASE_FEE_CENTS[case_type]
      # Step 2: biometrics surcharge — added only when biometrics is required
      #         (I-130 case_type skips biometrics per §1.2; surcharge omitted)
      surcharge = BIOMETRICS_SURCHARGE_CENTS if case_type in {I-485, I-765, I-131} else 0
      # Step 3: child discount — applies ONLY when case_type == I-485 AND applicant.is_under_14
      #         A flat percentage discount applied to (base + surcharge), then rounded.
      pre_discount = base + surcharge
      if case_type == "I-485" and applicant.is_under_14:
          # NESTED ROUNDING ORDER (PINNED): apply discount to the SUBTOTAL first,
          # then round-half-up to whole cents. Do NOT round base and surcharge
          # separately and sum. Order matters for cases where surcharge*discount
          # produces a half-cent (e.g., 0.5 cent) — this scaffold pins
          # 'discount then round' producing a single rounding event.
          discounted = pre_discount * (1 - CHILD_DISCOUNT_PCT)
          fee_cents = round_half_up(discounted)
      else:
          fee_cents = pre_discount  # already whole-cent integers
      return fee_cents
    input_set: "case_type, applicant.is_under_14 recomputed at file_date, preference_category"
    constants:
      BASE_FEE_CENTS:
        I-130: 56000
        I-485: 142000
        I-765: 41000
        I-131: 63000
      BIOMETRICS_SURCHARGE_CENTS: 8500
      CHILD_DISCOUNT_PCT: 0.25
    precision: "Whole cents, round_half_up applied AFTER discount multiplication"
    variants: []

  - name: rfe_deadline
    trigger: "On Case.UNDER_REVIEW->RFE_PENDING transition (POST /uscis/cases/{id}/rfes)"
    algorithm: threshold
    formula: |
      # Inputs: RFE.issued_at (ISO 8601 UTC)
      # Add 87 calendar days, snap to date (drop time component)
      response_deadline = (issued_at_date + 87 days).iso_date()
      # Strict-inequality contract: a response submitted at exactly
      # ClockState.current_utc == response_deadline (00:00:00.000Z) is REJECTED
      # (expired). The boundary check is `current_utc < deadline` — '<' not '<='.
      return response_deadline
    input_set: "RFE.issued_at"
    constants:
      DEADLINE_DAYS: 87
    precision: "Whole calendar days; deadline boundary is strict less-than (current_utc < deadline)"
    variants: []

  - name: visa_availability
    trigger: "On Case.UNDER_REVIEW->INTERVIEW_SCHEDULED transition; on Case.INTERVIEW_COMPLETED->APPROVED transition; on GET /uscis/cases/{id}/visa-availability read"
    algorithm: threshold
    formula: |
      # Inputs: case.priority_date, case.preference_category,
      #         applicant.country_of_chargeability, chart_type, evaluation_month
      # Step 1: resolve evaluation_month = ClockState.current_utc[:7] (e.g., '2026-06')
      # Step 2: find VisaBulletinEntry with matching (preference_category, country,
      #         chart_type, bulletin_month = evaluation_month).
      #   - tie-break: no ties possible — the (category, country, chart_type, month)
      #     tuple is UNIQUE per §1.1 constraint.
      # Step 3: empty-set fallback — if no entry exists for evaluation_month, FALL BACK
      #         to the most recent prior month with an entry for that (category, country,
      #         chart_type) by lexicographic max of bulletin_month; if still no entry,
      #         result is RETROGRESSED (visa unavailable).
      # Step 4: comparison — if cutoff_date == 'CURRENT', result is CURRENT.
      #         Otherwise CURRENT iff priority_date STRICTLY less than cutoff_date
      #         ('<', not '<='); exact equality is RETROGRESSED.
      return "CURRENT" or "RETROGRESSED"
    input_set: "Case.priority_date, Case.preference_category, Applicant.country_of_chargeability, evaluation_month, chart_type"
    constants: {}
    precision: "Date comparison is whole-day; boundary is strict '<'"
    variants:
      - name: final_action
        when: "Used by §1.2 visa availability gates and by official decision: chart_type=FINAL_ACTION"
        difference: "Reads only FINAL_ACTION-chart VisaBulletinEntry rows; CURRENT here means the case can move to interview or be approved."
      - name: filing_date
        when: "Used by certain advisory reads only (chart_type=FILING_DATE)"
        difference: "Reads only FILING_DATE-chart rows; CURRENT here only means the case may FILE I-485 — does NOT authorize interview or approval. For the SAME (priority_date, category, country, evaluation_month), final_action and filing_date can disagree (e.g., filing_date CURRENT, final_action RETROGRESSED) when the bulletin's filing-date cutoff is later than its final-action cutoff."

  - name: officer_workload_score
    trigger: "On GET /uscis/officers/{officer_id}/workload read"
    algorithm: weighted_scoring
    formula: |
      # Per officer, two values are produced from the SAME pool of cases.
      # Pool: every Case with assigned_officer_id == officer_id and
      #       status NOT in {APPROVED, DENIED, ABANDONED}.
      #
      # VARIANT A — weighted_complexity (the operative workload_score):
      #   Per-case weights by status:
      #     FILED                  -> 1
      #     BIOMETRICS_SCHEDULED   -> 2
      #     BIOMETRICS_COMPLETED   -> 3
      #     UNDER_REVIEW           -> 4
      #     RFE_PENDING            -> 2   (clock is on the applicant, lighter touch)
      #     INTERVIEW_SCHEDULED    -> 5
      #     INTERVIEW_COMPLETED    -> 5
      #   Per-case age multiplier:
      #     age_days = (current_utc_date - file_date).days
      #     multiplier = 1 + min(age_days / 365, 1.0)  # capped at 2x at 1 year
      #   score_for_case = STATUS_WEIGHT[status] * multiplier
      #   workload_score = sum(score_for_case for c in pool),
      #                    rounded to 2 decimal places, round_half_up
      #                    (apply rounding ONCE to the FINAL sum, not per case).
      #
      # VARIANT B — flat_count (an advisory active-case count, exposed alongside):
      #   case_count = len(pool)   # ignores status weights and age multiplier
      #
      # For an officer with one BIOMETRICS_SCHEDULED case and one UNDER_REVIEW case
      # of identical age, weighted_complexity != flat_count (e.g., 6.0 vs 2),
      # so the two variants demonstrably diverge for identical pool inputs.
      #
      # Return shape: { workload_score: <Variant A>, case_count: <Variant B>, officer_id }.
    input_set: "All Case rows assigned to the officer and not in terminal status"
    constants:
      STATUS_WEIGHTS:
        FILED: 1
        BIOMETRICS_SCHEDULED: 2
        BIOMETRICS_COMPLETED: 3
        UNDER_REVIEW: 4
        RFE_PENDING: 2
        INTERVIEW_SCHEDULED: 5
        INTERVIEW_COMPLETED: 5
      MULTIPLIER_CAP: 2.0
      MULTIPLIER_DAYS_PER_UNIT: 365
    precision: "Variant A: 2 decimal places, round_half_up applied ONCE to the FINAL sum, not per case. Variant B: integer."
    variants:
      - name: weighted_complexity
        when: "Used by the workload_score field on GET /uscis/officers/{officer_id}/workload."
        difference: "Each case contributes STATUS_WEIGHT[status] * (1 + min(age_days/365, 1.0)); same pool of cases yields a higher number than flat_count whenever any case has STATUS_WEIGHT > 1 or age_days > 0."
      - name: flat_count
        when: "Used by the case_count field on GET /uscis/officers/{officer_id}/workload."
        difference: "Each case contributes exactly 1, regardless of status or age. For any non-empty pool with at least one case in a status whose weight != 1, this returns a strictly smaller number than weighted_complexity."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /uscis/applicants/register and POST /uscis/attorneys/register"

  - priority: 2
    category: auth
    check: "X-User-Role is a recognized role from §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all except POST /uscis/applicants/register and POST /uscis/attorneys/register"

  - priority: 3
    category: auth
    check: "The acting role is authorized for the called endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path-templated id refers to an existing resource of the expected entity (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints"

  - priority: 5
    category: existence
    check: "Every FK in the request body refers to an existing resource of the expected entity"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with FK fields in input"

  - priority: 6
    category: business_referential
    check: "For entity_backed Applicant role, X-User-ID equals the applicant_id of any Case being mutated; for Attorney role, X-User-ID equals attorney_id on the case"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /uscis/cases/{id}/file, POST /uscis/rfes/{id}/respond, GET /uscis/cases/{id}, GET /uscis/cases/{id}/events"

  - priority: 7
    category: state
    check: "Target entity is in the from-state required by the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "Target entity is not in a terminal state for the requested transition"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_constraint
    check: "Case.case_type is supported by the operation (e.g., biometrics endpoint rejects I-130; interview endpoint requires I-485)"
    error_id: ERR_CASE_TYPE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /uscis/cases/{id}/biometrics, POST /uscis/cases/{id}/interviews, POST /uscis/cases/{id}/advance-review"

  - priority: 10
    category: business_safety
    check: "RFE cap not exceeded — Case.rfe_round_count < MAX_RFE_ROUNDS (=2) before issuing a new RFE"
    error_id: ERR_RFE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /uscis/cases/{id}/rfes"

  - priority: 11
    category: business_referential
    check: "For I-485 interview scheduling and I-485 approval, visa availability under FINAL_ACTION chart at the relevant bulletin month MUST be CURRENT (priority_date STRICTLY less than cutoff_date OR cutoff_date == 'CURRENT')"
    error_id: ERR_VISA_RETROGRESSED
    http_status: 422
    applies_to: "POST /uscis/cases/{id}/interviews, POST /uscis/cases/{id}/decide (when case_type == I-485)"

  - priority: 12
    category: business_temporal
    check: "Appointments must be scheduled at least 7 days in the future from ClockState.current_utc (scheduled_at >= now + 7 days)"
    error_id: ERR_APPT_TOO_SOON
    http_status: 422
    applies_to: "POST /uscis/cases/{id}/biometrics, POST /uscis/cases/{id}/interviews, POST /uscis/biometrics/{id}/reschedule"

  - priority: 13
    category: business_temporal
    check: "Two appointments of the same kind for the SAME case must NOT overlap. Interval semantics: closed-start, open-end half-open intervals [scheduled_at, scheduled_at + 60 min); rejection on any geometric intersection including back-to-back where end == next.start counts as NO collision (open-end). Applies per-case, per-appointment-kind."
    error_id: ERR_APPT_OVERLAP_SAME_CASE
    http_status: 409
    applies_to: "POST /uscis/cases/{id}/biometrics, POST /uscis/cases/{id}/interviews"

  - priority: 14
    category: business_temporal
    check: "At an ASC location, no two ACTIVE (status==SCHEDULED) BiometricsAppointment slots may share the EXACT same scheduled_at instant — the location's per-instant capacity is 1. Interval semantics: point-instant collision (NOT a window-overlap rule); two appointments with the same scheduled_at conflict regardless of duration."
    error_id: ERR_ASC_SLOT_TAKEN
    http_status: 409
    applies_to: "POST /uscis/cases/{id}/biometrics, POST /uscis/biometrics/{id}/reschedule"

  - priority: 15
    category: business_constraint
    check: "RFE response deadline not breached at submission: ClockState.current_utc < RFE.response_deadline (strict less-than)"
    error_id: ERR_RFE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /uscis/rfes/{id}/respond"

  - priority: 16
    category: business_fiscal
    check: "OCC: when an endpoint takes expected_case_version, it must equal the current Case.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /uscis/cases/{id}/decide, POST /uscis/rfes/{id}/respond"

  - priority: 17
    category: business_constraint
    check: "Required input fields per §1.5 input must all be present and well-typed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Registration
  - method: POST
    path: "/uscis/applicants/register"
    description: "Self-register a new applicant; no auth required"
    roles: [Anonymous]
    code: 201
    input: [alien_number, full_name, date_of_birth, country_of_chargeability, email]
    output: Applicant
    side_effects: ["Create Applicant"]

  - method: POST
    path: "/uscis/attorneys/register"
    description: "Self-register a new attorney; no auth required"
    roles: [Anonymous]
    code: 201
    input: [bar_number, full_name, firm_name]
    output: Attorney
    side_effects: ["Create Attorney"]

  # Applicant reads
  - method: GET
    path: "/uscis/applicants/{id}"
    description: "Get an applicant"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/uscis/attorneys/{id}"
    description: "Get an attorney"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: Attorney
    side_effects: []

  # Cases
  - method: POST
    path: "/uscis/cases"
    description: "Create a DRAFT case (no fees, no receipt yet)"
    roles: [Applicant, Attorney]
    code: 201
    input: ["applicant_id", "attorney_id?", "case_type", "preference_category?"]
    output: Case
    side_effects: ["Create Case in DRAFT"]

  - method: GET
    path: "/uscis/cases/{id}"
    description: "Get a case"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/uscis/cases"
    description: "List cases with filters"
    roles: [Officer, FieldOfficeAdmin]
    code: 200
    input: ["applicant_id?", "attorney_id?", "assigned_officer_id?", "status?", "case_type?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/uscis/cases/{id}/file"
    description: "Submit a DRAFT case for processing"
    roles: [Applicant, Attorney]
    code: 200
    input: []
    output: Case
    side_effects: ["See §1.2 Case.DRAFT->FILED transition"]

  - method: POST
    path: "/uscis/cases/{id}/biometrics"
    description: "Schedule biometrics for the case"
    roles: [Officer]
    code: 201
    input: [scheduled_at, asc_location_code]
    output: BiometricsAppointment
    side_effects: ["See §1.2 Case.FILED->BIOMETRICS_SCHEDULED transition"]

  - method: GET
    path: "/uscis/cases/{id}/biometrics"
    description: "List biometrics appointments for a case (FK reverse-reachability)"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: BiometricsAppointment[]
    side_effects: []

  - method: GET
    path: "/uscis/biometrics/{id}"
    description: "Get a biometrics appointment"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: BiometricsAppointment
    side_effects: []

  - method: POST
    path: "/uscis/biometrics/{id}/complete"
    description: "Mark biometrics complete"
    roles: [Officer]
    code: 200
    input: []
    output: BiometricsAppointment
    side_effects: ["Cascades parent Case to BIOMETRICS_COMPLETED"]

  - method: POST
    path: "/uscis/biometrics/{id}/reschedule"
    description: "Reschedule biometrics to a new time"
    roles: [Officer]
    code: 200
    input: [new_scheduled_at, new_asc_location_code]
    output: BiometricsAppointment
    side_effects: ["Marks current RESCHEDULED, creates a fresh SCHEDULED appointment for the same case"]

  - method: POST
    path: "/uscis/biometrics/{id}/mark-no-show"
    description: "Mark biometrics no-show after grace window"
    roles: [Officer]
    code: 200
    input: []
    output: BiometricsAppointment
    side_effects: ["Cascades parent Case to ABANDONED (terminal)"]

  - method: POST
    path: "/uscis/cases/{id}/advance-review"
    description: "Advance an I-130 case (no biometrics) or post-biometrics case to UNDER_REVIEW"
    roles: [Officer]
    code: 200
    input: []
    output: Case
    side_effects: ["Sets status to UNDER_REVIEW"]

  - method: POST
    path: "/uscis/cases/{id}/rfes"
    description: "Issue an RFE on the case"
    roles: [Officer]
    code: 201
    input: [evidence_items_requested]
    output: RFE
    side_effects: ["See §1.2 UNDER_REVIEW->RFE_PENDING transition"]

  - method: GET
    path: "/uscis/cases/{id}/rfes"
    description: "List RFEs for a case (FK reverse-reachability)"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: RFE[]
    side_effects: []

  - method: GET
    path: "/uscis/rfes/{id}"
    description: "Get an RFE"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: RFE
    side_effects: []

  - method: POST
    path: "/uscis/rfes/{id}/respond"
    description: "Submit applicant's RFE response"
    roles: [Applicant, Attorney]
    code: 200
    input: [expected_case_version, response_summary]
    output: RFE
    side_effects: ["See §1.2 RFE_PENDING->UNDER_REVIEW cascade"]

  - method: POST
    path: "/uscis/cases/{id}/interviews"
    description: "Schedule an AOS interview (I-485 only)"
    roles: [Officer]
    code: 201
    input: [scheduled_at, field_office_code]
    output: InterviewAppointment
    side_effects: ["See §1.2 UNDER_REVIEW->INTERVIEW_SCHEDULED transition"]

  - method: GET
    path: "/uscis/cases/{id}/interviews"
    description: "List interviews for a case (FK reverse-reachability)"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: InterviewAppointment[]
    side_effects: []

  - method: GET
    path: "/uscis/interviews/{id}"
    description: "Get an interview"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: InterviewAppointment
    side_effects: []

  - method: POST
    path: "/uscis/interviews/{id}/complete"
    description: "Officer marks interview completed with a decision"
    roles: [Officer]
    code: 200
    input: [decision_after_interview]
    output: InterviewAppointment
    side_effects: ["Cascades parent Case to INTERVIEW_COMPLETED"]

  - method: POST
    path: "/uscis/interviews/{id}/mark-no-show"
    description: "Mark interview no-show after grace window"
    roles: [Officer]
    code: 200
    input: []
    output: InterviewAppointment
    side_effects: ["Cascades parent Case to ABANDONED"]

  - method: POST
    path: "/uscis/cases/{id}/decide"
    description: "Officer issues final decision (or reopens after interview)"
    roles: [Officer]
    code: 200
    input: [decision, expected_case_version]
    output: Case
    side_effects: ["See §1.2 decide transitions"]

  - method: GET
    path: "/uscis/cases/{id}/events"
    description: "List CaseEvent rows for a case (FK reverse-reachability)"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: CaseEvent[]
    side_effects: []

  - method: GET
    path: "/uscis/cases/{id}/visa-availability"
    description: "Advisory read: visa availability under both FINAL_ACTION and FILING_DATE charts at the current ClockState month"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: []
    output: "{ final_action: string, filing_date: string, evaluation_month: string }"
    side_effects: []

  # Visa Bulletin
  - method: POST
    path: "/uscis/visa-bulletin"
    description: "Publish a visa bulletin entry"
    roles: [FieldOfficeAdmin]
    code: 201
    input: [bulletin_month, preference_category, country, chart_type, cutoff_date]
    output: VisaBulletinEntry
    side_effects: ["Create VisaBulletinEntry"]

  - method: GET
    path: "/uscis/visa-bulletin"
    description: "List visa bulletin entries with filters"
    roles: [Applicant, Attorney, Officer, FieldOfficeAdmin]
    code: 200
    input: ["bulletin_month?", "preference_category?", "country?", "chart_type?", "limit?", "offset?"]
    output: VisaBulletinEntry[]
    side_effects: []

  # Officer workload
  - method: GET
    path: "/uscis/officers/{officer_id}/workload"
    description: "Get a single officer's workload score"
    roles: [FieldOfficeAdmin]
    code: 200
    input: []
    output: "{ officer_id: string, workload_score: number, case_count: integer }"
    side_effects: []

  # Test-driving endpoints (under /_*)
