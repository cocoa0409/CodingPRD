          assert:
            - "GET /ppa/settlement-periods/${period_id}/intervals returns the three hours in hour_start order - ${first_id}, ${edge_id}, ${after_id} - which is the reverse of the order they were posted in"
            - "the trigger returns 200 with RiskEvent.${event_id}.status == ACCEPTED, reviewed_by_user_id u_committee_1 and reviewed_at 2026-08-01T00:00:00Z"
            - "RiskEvent.${event_id}.duration_days == 5 = floor(428400 / 86400) + 1 = floor(4.9583) + 1, not 4 and not 6"
            - "RiskEvent.${event_id}.excused_hours == 2, counting ${first_id} at window_start and ${edge_id} at exactly window_end; ${after_id} one hour past window_end is excluded"
            - "RiskEvent.${event_id}.price_adjustment_usd_per_mwh is null and Deal.${deal_id}.contract_price_usd_per_mwh is still 22.00, because the CHANGE_IN_LAW repricing hop does not run for FORCE_MAJEURE"
            - "the period is still OPEN with every money field null, because sizing a claim never settles a period"

      - name: attribute_allocation_basis_counts_confirmed_allocations_only
        claim_type: input_set_filtering
        grounds:
          - calculations.attribute_allocation
          - endpoints.POST_/ppa/attribute-batches/{id}/transfer
          - entities.DealAllocation.fields.status
        distinguishing_aspect: |
          The aggregated deal carries a CONFIRMED 25.000 MW allocation and a still
          PROPOSED 10.000 MW allocation. The largest-remainder basis is 25.000, not
          35.000, so the whole 8 MWh batch goes to the confirmed buyer. An
          implementation that sums every allocation row would hand 6 MWh to the
          confirmed buyer and 2 MWh to a buyer who has not agreed to anything - the
          parts would still sum to 8, so the conservation invariant alone would not
          catch it. Only the input-set filter does.
        test_recipe:
          setup:
            - "CHAIN C on a 100 MW OPERATIONAL solar project, but the deal is AGGREGATED at 25.000 MW, flat 22.00, basis BUYER, settled at its own NODE."
            - "Two QUALIFIED buyers each holding a registry account: Northwind confirms a 25.000 MW allocation, Cascadia's 10.000 MW allocation is left PROPOSED."
            - "One September hour metered at 8.5000 MWh, calculated, and an 8 MWh batch minted from it."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_a: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_a}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_a}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Cascadia Foods Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00902" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_b: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_b}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_b}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2026-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
