      - name: self_review_forbidden_on_verify_and_reject
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SELF_REVIEW_FORBIDDEN]", roles.AttendingAnesthesiologist]
        distinguishing_aspect: "Segregation of duties: the attesting physician calling verify (and reject) on their OWN attestation is rejected 403 ERR_SELF_REVIEW_FORBIDDEN — X-User-ID == physician_id is the trigger."
        test_recipe:
