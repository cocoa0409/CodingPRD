# SCAFFOLD.yaml — task_2786_theme_park_ride_maintenance_daily_inspection
# §1.0–§1.7 seed tables. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: "2786. Theme Park Ride Maintenance & Daily Inspection (regional theme park maintenance department): daily pre-opening inspection checklist by attraction with sign-off before guest operations, preventive maintenance intervals from manufacturer bulletins with nondestructive testing on critical components, ride downtime tracking with root cause analysis and parts availability planning, manufacturer bulletin and recall implementation with fleet-wide action, ride operator training, dispatch procedures and restraint verification standards, incident and injury investigation with regulator notification and ride hold procedures, off-season overhaul scheduling with teardown, inspection and rebuild of major components, capacity impact analysis when attractions are down during peak periods"

domain_name: theme-park-ride-maintenance
api_prefix: /park-ops

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer top-level collection under /park-ops with FK fields in
  # the request body. No entity is addressed through a nested parent path segment;
  # the only sub-path segments that exist are computed reads
  # (/attractions/{id}/capacity-impact) and action endpoints on the entity itself.

  state_machine_shape: cyclic
  # DailyInspection cycles IN_PROGRESS -> PENDING_SIGN_OFF -> REJECTED -> IN_PROGRESS
  # and IN_PROGRESS -> BLOCKED -> IN_PROGRESS; DowntimeEvent cycles
  # DIAGNOSED -> AWAITING_PARTS -> DIAGNOSED; IncidentReport is a branching
  # fork-join (UNDER_INVESTIGATION -> {REGULATOR_NOTIFIED | INTERNAL_REVIEW_CLOSED}
  # -> CLEARED_TO_OPERATE); MaintenanceBulletin is compound (COMPLETED derived from
  # BulletinAction children).

  relationship_patterns:
    - one_to_many          # Attraction -> ComponentAsset / DailyInspection / BulletinAction
    - self_referential     # MaintenanceBulletin.supersedes_bulletin_id -> MaintenanceBulletin.id
    - cross_aggregate      # BulletinAction -> PartRequisition; DailyInspection -> IncidentReport
    - polymorphic_optional # PartRequisition attaches to DowntimeEvent OR BulletinAction OR neither

  role_model: segregation_of_duties
  # The technician who recorded any InspectionItemResult on a DailyInspection can
  # never be the QualifiedInspector who signs it off (X-User-ID compared against
  # DailyInspection.recorded_by_user_ids).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Attraction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Public attraction name.
        constraints: non-empty, max 120 chars
      - name: park_area
        type: enum
        source: input
        description: Park land the attraction sits in.
        constraints: one of FRONTIER, LAGOON, SKYLINE, KIDS_COVE
      - name: manufacturer
        type: string
        source: input
        description: Ride manufacturer name, matched against MaintenanceBulletin.manufacturer.
        constraints: non-empty
      - name: model_code
        type: string
        source: input
        description: Manufacturer model code, matched against MaintenanceBulletin.model_code for fleet-wide action fan-out.
        constraints: non-empty
      - name: ride_class
        type: enum
        source: input
        description: Thrill classification; drives RIDE_CLASS_FACTOR in bulletin_fleet_risk_score.
        constraints: one of KIDDIE, FAMILY, THRILL, WATER
      - name: theoretical_hourly_capacity
        type: integer
        source: input
        description: Guests per operating hour at design throughput; multiplier in downtime_capacity_loss.
        constraints: ">= 1"
      - name: min_operators_required
        type: integer
        source: input
        description: Operators needed to dispatch; denominator of the staffing ratio in dispatch_readiness_index.
        constraints: ">= 1"
      - name: mean_repair_minutes
        type: integer
        source: input
        default: 120
        description: Historical mean repair duration; used to project ended_at for still-open downtime in the PROVISIONAL capacity variant.
        constraints: ">= 1"
      - name: parts_budget_cents
        type: integer
        source: input
        description: Season parts budget ceiling for this attraction, in whole cents.
        constraints: ">= 0"
      - name: parts_budget_committed_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved quantity: sum of PartRequisition.total_cost_cents for this attraction whose status IN {RESERVED, BACKORDERED, RECEIVED}."
      - name: cumulative_cycles
        type: integer
        source: system
        default: 0
        description: Lifetime ride cycle counter, advanced only by POST /park-ops/attractions/{id}/cycles.
      - name: ytd_downtime_minutes
        type: integer
        source: computed
        default: 0
        description: "Conserved quantity: sum of DowntimeEvent.duration_minutes for this attraction whose status == CLOSED."
      - name: regulatory_hold
        type: boolean
        source: computed
        default: false
        description: "True while this attraction has any IncidentReport whose status IN {RIDE_HELD, UNDER_INVESTIGATION, REGULATOR_NOTIFIED}."
      - name: active_template_id
        type: string
        source: computed
        description: "FK -> InspectionTemplate.id; nullable; the single InspectionTemplate for this attraction whose status == ACTIVE, or null when none has been activated."
      - name: last_signed_off_service_date
        type: string
        source: computed
        description: Service date (YYYY-MM-DD) of the most recent DailyInspection that reached SIGNED_OFF; null before the first sign-off.
      - name: certified_operator_count
        type: integer
        source: computed
        default: 0
        description: "Count of OperatorCertification rows for this attraction whose derived status == CERTIFIED at the current logical clock instant."
      - name: operational_posture
        type: enum
        source: computed
        default: CLOSED_PENDING_INSPECTION
        description: Guest-operations gate derived by calculations.operational_posture_derivation; recomputed after every mutation that touches its inputs.
        constraints: one of OPEN, CLOSED_PENDING_INSPECTION, DOWN, HOLD, OVERHAUL

  - name: ComponentAsset
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction this component is installed on.
      - name: name
        type: string
        source: input
        description: Component label as printed in the manufacturer manual.
        constraints: non-empty
      - name: component_type
        type: enum
        source: input
        description: Component family, drives which NDT methods are meaningful.
        constraints: one of BRAKE, LIFT_CHAIN, RESTRAINT_ACTUATOR, GEARBOX, AXLE, CONTROL_PLC
      - name: criticality
        type: enum
        source: input
        description: Safety classification; only SAFETY_CRITICAL components can force posture DOWN on NDT lapse.
        constraints: one of SAFETY_CRITICAL, ESSENTIAL, NON_CRITICAL
      - name: ndt_interval_cycles
        type: integer
        source: input
        description: Manufacturer nondestructive-testing interval in ride cycles.
        constraints: ">= 1"
      - name: ndt_interval_days
        type: integer
        source: input
        description: Manufacturer nondestructive-testing interval in calendar days.
        constraints: ">= 1"
      - name: last_ndt_at
        type: datetime
        source: computed
        description: Logical-clock instant of the last recorded NDT; initialised to the creating request's logical clock reading.
      - name: last_ndt_cycles
        type: integer
        source: computed
        description: Attraction.cumulative_cycles as observed when the last NDT was recorded; initialised from the attraction at creation.
      - name: last_ndt_method
        type: enum
        source: computed
        description: NDT method of the last recorded test; null until the first NDT record.
        constraints: one of MAGNETIC_PARTICLE, ULTRASONIC, DYE_PENETRANT, EDDY_CURRENT, VISUAL
      - name: ndt_status
        type: enum
        source: computed
        default: CURRENT
        description: Derived by calculations.component_ndt_due_status from cycles-since and days-since against the two intervals.
        constraints: one of CURRENT, DUE, OVERDUE
      - name: condition_flag
        type: enum
        source: computed
        default: OK
        description: SUSPECT when an inspection item bound to this component was recorded FAIL; FAILED when a DowntimeEvent named it as failed_component_id; cleared to OK by an NDT record with result PASS or by overhaul recommissioning.
        constraints: one of OK, SUSPECT, FAILED

  - name: InspectionTemplate
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction whose pre-opening checklist this template defines.
      - name: revision
        type: integer
        source: computed
        description: 1 for the first template of an attraction, otherwise (max existing revision for that attraction) + 1.
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: DRAFT at creation, ACTIVE after activation, SUPERSEDED when a later revision is activated.
        constraints: one of DRAFT, ACTIVE, SUPERSEDED
      - name: effective_from_date
        type: string
        source: input
        description: First service date (YYYY-MM-DD) this template may be pinned by a DailyInspection.
        constraints: ISO date
      - name: item_count
        type: integer
        source: computed
        default: 0
        description: Number of ChecklistItem rows whose template_id is this template.
      - name: activated_at
        type: datetime
        source: computed
        description: Logical-clock instant of activation; null while DRAFT.

  - name: ChecklistItem
    parent: null
    common_fields: false
    entity_kind: configuration
    fields:
      - name: template_id
        type: string
        source: input
        description: FK -> InspectionTemplate.id; the template revision this row belongs to.
      - name: component_id
        type: string
        source: input
        description: FK -> ComponentAsset.id; nullable; the component this checklist line inspects. When set, a FAIL result flips that component's condition_flag to SUSPECT.
      - name: sequence_no
        type: integer
        source: input
        description: Walk order within the template; unique per template.
        constraints: ">= 1"
      - name: description
        type: string
        source: input
        description: The check the technician performs.
        constraints: non-empty
      - name: severity_class
        type: enum
        source: input
        description: SAFETY_CRITICAL FAIL blocks the inspection; ESSENTIAL FAIL requires a note but permits sign-off; ADVISORY FAIL is informational.
        constraints: one of SAFETY_CRITICAL, ESSENTIAL, ADVISORY
      - name: requires_photo
        type: boolean
        source: input
        default: false
        description: Documentation flag carried onto the result row; not enforced by the API.

  - name: DailyInspection
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction being inspected.
      - name: template_id
        type: string
        source: computed
        description: FK -> InspectionTemplate.id; pinned at creation to the attraction's ACTIVE template and never re-pointed afterwards.
      - name: template_revision
        type: integer
        source: computed
        description: InspectionTemplate.revision snapshotted at creation, so later template activations cannot retro-change this inspection.
      - name: service_date
        type: string
        source: input
        description: Operating date (YYYY-MM-DD) this pre-opening inspection covers; unique per attraction.
        constraints: ISO date
      - name: status
        type: enum
        source: computed
        default: IN_PROGRESS
        description: Lifecycle state; see state_machines.DailyInspection.
        constraints: one of IN_PROGRESS, BLOCKED, PENDING_SIGN_OFF, REJECTED, SIGNED_OFF
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the MaintenanceTechnician that created the inspection.
      - name: recorded_by_user_ids
        type: array
        source: computed
        default: []
        description: Distinct X-User-ID values that have recorded any item result on this inspection, in first-record order; the segregation-of-duties set checked at sign-off.
      - name: signed_off_by_user_id
        type: string
        source: computed
        description: X-User-ID of the QualifiedInspector that signed off; null until SIGNED_OFF.
      - name: signed_off_at
        type: datetime
        source: computed
        description: Logical-clock instant of sign-off; null until SIGNED_OFF.
      - name: rejection_reason
        type: string
        source: computed
        description: Reason text from the most recent reject call; retained across reopen for audit.
      - name: rework_round
        type: integer
        source: computed
        default: 0
        description: Incremented by one on every REJECTED -> IN_PROGRESS reopen.
      - name: pending_item_count
        type: integer
        source: computed
        default: 0
        description: Count of this inspection's InspectionItemResult rows whose outcome == PENDING.
      - name: blocking_item_count
        type: integer
        source: computed
        default: 0
        description: "Count of this inspection's InspectionItemResult rows whose outcome == FAIL and severity_class == SAFETY_CRITICAL."
      - name: essential_fail_count
        type: integer
        source: computed
        default: 0
        description: "Count of this inspection's InspectionItemResult rows whose outcome == FAIL and severity_class == ESSENTIAL; penalty input to dispatch_readiness_index."

  - name: InspectionItemResult
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: inspection_id
        type: string
        source: system
        description: FK -> DailyInspection.id; the inspection this result belongs to; set by the fan-out cascade on POST /park-ops/daily-inspections.
      - name: checklist_item_id
        type: string
        source: system
        description: FK -> ChecklistItem.id; the template line this result answers; set by the same fan-out cascade.
      - name: severity_class
        type: enum
        source: computed
        description: Snapshot of ChecklistItem.severity_class taken when the result row was created, so template edits cannot retro-change blocking semantics.
        constraints: one of SAFETY_CRITICAL, ESSENTIAL, ADVISORY
      - name: outcome
        type: enum
        source: computed
        default: PENDING
        description: PENDING until recorded; PASS, FAIL or NA afterwards; reset to PENDING for FAIL rows on inspection reopen.
        constraints: one of PENDING, PASS, FAIL, NA
      - name: note
        type: string
        source: input
        description: Free-text finding; mandatory when recording FAIL on an ESSENTIAL line.
      - name: recorded_by_user_id
        type: string
        source: computed
        description: X-User-ID of the technician that recorded the outcome; null while PENDING.
      - name: recorded_at
        type: datetime
        source: computed
        description: Logical-clock instant the outcome was recorded; null while PENDING.

  - name: MaintenanceBulletin
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: bulletin_ref
        type: string
        source: input
        description: Manufacturer bulletin reference string; unique across all bulletins.
        constraints: non-empty, unique
      - name: manufacturer
        type: string
        source: input
        description: Manufacturer that issued the bulletin; matched against Attraction.manufacturer during fan-out.
        constraints: non-empty
      - name: model_code
        type: string
        source: input
        description: Affected model code; matched against Attraction.model_code during fan-out.
        constraints: non-empty
      - name: severity
        type: enum
        source: input
        description: ADVISORY and MANDATORY actions may be deferred; RECALL actions may not.
        constraints: one of ADVISORY, MANDATORY, RECALL
      - name: issued_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) the manufacturer issued the bulletin.
        constraints: ISO date
      - name: compliance_deadline_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) by which every fleet action must be VERIFIED; overdue days feed bulletin_fleet_risk_score.
        constraints: ISO date, must be >= issued_date
      - name: supersedes_bulletin_id
        type: string
        source: input
        description: FK -> MaintenanceBulletin.id; nullable; the earlier bulletin this one replaces. Self-referential chain; a bulletin may not supersede itself.
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: ISSUED at creation, ACKNOWLEDGED after fan-out, COMPLETED when every non-CANCELLED action is VERIFIED, SUPERSEDED when a later bulletin names it.
        constraints: one of ISSUED, ACKNOWLEDGED, COMPLETED, SUPERSEDED
      - name: action_total_count
        type: integer
        source: computed
        default: 0
        description: "Count of BulletinAction rows for this bulletin whose status != CANCELLED."
      - name: action_verified_count
        type: integer
        source: computed
        default: 0
        description: "Count of BulletinAction rows for this bulletin whose status == VERIFIED."
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock instant of acknowledgement; null while ISSUED.
      - name: acknowledged_by_user_id
        type: string
        source: computed
        description: X-User-ID of the MaintenanceManager that acknowledged the bulletin; null while ISSUED.

  - name: BulletinAction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: bulletin_id
        type: string
        source: system
        description: FK -> MaintenanceBulletin.id; set by the acknowledge fan-out cascade.
      - name: attraction_id
        type: string
        source: system
        description: FK -> Attraction.id; the fleet unit this action applies to, set by the acknowledge fan-out cascade.
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: Fleet-wide action lifecycle; see state_machines.BulletinAction.
        constraints: one of PENDING, IN_WORK, VERIFIED, DEFERRED, CANCELLED
      - name: deferral_reason
        type: string
        source: computed
        description: Reason text supplied on defer; null unless the action has ever been deferred.
      - name: deferred_until_date
        type: string
        source: computed
        description: Date (YYYY-MM-DD) the deferral runs to; null unless deferred.
      - name: verified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the QualifiedInspector that verified the action; null until VERIFIED.
      - name: verified_at
        type: datetime
        source: computed
        description: Logical-clock instant of verification; null until VERIFIED.
      - name: required_part_received
        type: boolean
        source: computed
        default: false
        description: "True when at least one PartRequisition whose bulletin_action_id is this action has status == RECEIVED, or when no PartRequisition references this action at all."

  - name: DowntimeEvent
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction that went down.
      - name: failed_component_id
        type: string
        source: computed
        description: FK -> ComponentAsset.id; nullable; the component named during diagnosis as root cause.
      - name: started_at
        type: datetime
        source: input
        description: UTC instant the attraction stopped carrying guests.
        constraints: ISO 8601 UTC with three fractional digits
      - name: ended_at
        type: datetime
        source: computed
        description: UTC instant service resumed, supplied on resolve; null until RESOLVED.
      - name: service_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) of started_at; the bucketing key for capacity-impact windows.
      - name: cause_category
        type: enum
        source: input
        description: Reported cause family at open time.
        constraints: one of MECHANICAL, ELECTRICAL, GUEST_ILLNESS, WEATHER, INSPECTION_FAIL, OPERATOR
      - name: root_cause_code
        type: string
        source: computed
        description: Root-cause code assigned during diagnosis; null until DIAGNOSED.
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: Downtime lifecycle; see state_machines.DowntimeEvent.
        constraints: one of OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED, CLOSED, VOIDED
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between started_at and ended_at; null until RESOLVED."
      - name: peak_minutes
        type: integer
        source: computed
        description: "Whole minutes of [started_at, ended_at) intersecting the peak window [service_date 11:00Z, service_date 17:00Z); null until RESOLVED."
      - name: off_peak_minutes
        type: integer
        source: computed
        description: duration_minutes minus peak_minutes; null until RESOLVED.
      - name: settled_guest_slots_lost
        type: number
        source: computed
        description: Per-event SETTLED capacity loss from calculations.downtime_capacity_loss, rounded to 2 decimals half-up; null until RESOLVED.
      - name: void_reason
        type: string
        source: computed
        description: Reason text supplied on void; null unless VOIDED.
      - name: auto_opened
        type: boolean
        source: computed
        default: false
        description: True when the system opened this event as a cascade of an inspection safety-critical failure rather than a technician report.

  - name: PartRequisition
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction whose parts budget this requisition commits against.
      - name: downtime_event_id
        type: string
        source: input
        description: FK -> DowntimeEvent.id; nullable; the downtime event this part is needed for.
      - name: bulletin_action_id
        type: string
        source: input
        description: FK -> BulletinAction.id; nullable; the fleet action this part is needed for.
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number.
        constraints: non-empty
      - name: quantity
        type: integer
        source: input
        description: Units requisitioned.
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Unit price in whole cents.
        constraints: ">= 0"
      - name: total_cost_cents
        type: integer
        source: computed
        description: quantity * unit_cost_cents, in whole cents.
      - name: needed_by_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) the part must be on site.
        constraints: ISO date
      - name: expected_availability_date
        type: string
        source: computed
        description: Vendor promise date (YYYY-MM-DD) supplied on backorder; null otherwise.
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: Requisition lifecycle; see state_machines.PartRequisition.
        constraints: one of REQUESTED, RESERVED, BACKORDERED, RECEIVED, CANCELLED
      - name: cancel_reason
        type: string
        source: computed
        description: Reason text supplied on cancel; null unless CANCELLED.

  - name: OperatorCertification
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction this operator is certified to dispatch.
      - name: operator_user_id
        type: string
        source: input
        description: Opaque staff identifier of the ride operator; the overlap-resource key together with attraction_id.
        constraints: non-empty
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the certification validity interval.
        constraints: ISO 8601 UTC with three fractional digits
      - name: expires_at
        type: datetime
        source: input
        description: Exclusive end of the certification validity interval; must be strictly after effective_from.
        constraints: ISO 8601 UTC with three fractional digits
      - name: restraint_verification_score
        type: integer
        source: input
        description: Restraint-verification practical score; feeds dispatch_readiness_index.
        constraints: 0..100
      - name: dispatch_procedure_score
        type: integer
        source: input
        description: Dispatch-procedure written score.
        constraints: 0..100
      - name: suspended_at
        type: datetime
        source: computed
        description: Logical-clock instant of suspension; null unless currently suspended.
      - name: suspension_reason
        type: string
        source: computed
        description: Reason text supplied on suspend; null unless currently suspended.
      - name: status
        type: enum
        source: computed
        default: TRAINEE
        description: Derived by calculations.certification_status_derivation from the scores, suspended_at and the logical clock against the validity interval.
        constraints: one of TRAINEE, CERTIFIED, SUSPENDED, EXPIRED

  - name: IncidentReport
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction the incident occurred on.
      - name: occurred_at
        type: datetime
        source: input
        description: UTC instant of the incident; the clock anchor for the regulator-notification deadline.
        constraints: ISO 8601 UTC with three fractional digits
      - name: injury_severity
        type: enum
        source: input
        description: SERIOUS and FATAL require regulator notification and force an immediate ride hold at creation.
        constraints: one of NONE, MINOR, SERIOUS, FATAL
      - name: guest_count_affected
        type: integer
        source: input
        description: Number of guests involved.
        constraints: ">= 0"
      - name: narrative
        type: string
        source: input
        description: First-report narrative.
        constraints: non-empty
      - name: status
        type: enum
        source: computed
        default: REPORTED
        description: Investigation lifecycle; see state_machines.IncidentReport.
        constraints: one of REPORTED, RIDE_HELD, UNDER_INVESTIGATION, REGULATOR_NOTIFIED, INTERNAL_REVIEW_CLOSED, CLEARED_TO_OPERATE
      - name: regulator_notification_due_at
        type: datetime
        source: computed
        description: occurred_at plus REGULATOR_NOTIFICATION_HOURS when injury_severity IN {SERIOUS, FATAL}; null otherwise.
      - name: regulator_case_ref
        type: string
        source: computed
        description: Regulator case reference captured at notification; null unless the regulator branch was taken.
      - name: notified_at
        type: datetime
        source: computed
        description: Logical-clock instant of regulator notification; null unless the regulator branch was taken.
      - name: notified_late
        type: boolean
        source: computed
        default: false
        description: True when notified_at is strictly after regulator_notification_due_at.
      - name: investigator_user_id
        type: string
        source: computed
        description: X-User-ID recorded when the investigation opened; null before UNDER_INVESTIGATION.
      - name: regulator_clearance_ref
        type: string
        source: computed
        description: Regulator clearance reference required to clear an incident that took the regulator branch; null otherwise.
      - name: cleared_at
        type: datetime
        source: computed
        description: Logical-clock instant of clearance; null until CLEARED_TO_OPERATE.
      - name: suspended_certification_count
        type: integer
        source: computed
        default: 0
        description: Number of OperatorCertification rows this incident suspended via the regulator-notification cascade; the same count is reinstated on clearance.

  - name: ShopBay
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Maintenance shop bay label.
        constraints: non-empty
      - name: concurrent_slot_capacity
        type: integer
        source: input
        description: How many overhaul work orders may occupy this bay on any single calendar day.
        constraints: ">= 1"
      - name: booked_order_count
        type: integer
        source: computed
        default: 0
        description: "Count of OverhaulWorkOrder rows for this bay whose status != RECOMMISSIONED."

  - name: OverhaulWorkOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: attraction_id
        type: string
        source: input
        description: FK -> Attraction.id; the attraction being overhauled.
      - name: component_id
        type: string
        source: input
        description: FK -> ComponentAsset.id; the major component torn down, inspected and rebuilt. Must be installed on attraction_id.
      - name: shop_bay_id
        type: string
        source: input
        description: FK -> ShopBay.id; the bay reserved for the teardown window.
      - name: window_start_date
        type: string
        source: input
        description: First occupied bay date (YYYY-MM-DD), inclusive.
        constraints: ISO date
      - name: window_end_date
        type: string
        source: input
        description: Last occupied bay date (YYYY-MM-DD), inclusive; must be >= window_start_date.
        constraints: ISO date
      - name: parts_subtotal_cents
        type: integer
        source: input
        description: Quoted parts cost for the rebuild kit, in whole cents.
        constraints: ">= 0"
      - name: labor_hours
        type: integer
        source: input
        description: Quoted shop labor hours.
        constraints: ">= 0"
      - name: expedite_requested
        type: boolean
        source: input
        default: false
        description: When true the expedite fee tier is applied on top of the discounted base.
      - name: off_season
        type: boolean
        source: computed
        description: "True when every date in [window_start_date, window_end_date] falls inside the off-season span (11-01 through the following 02-28)."
      - name: base_total_cents
        type: integer
        source: computed
        description: parts_subtotal_cents plus labor_hours * LABOR_RATE_CENTS_PER_HOUR.
      - name: off_season_discount_cents
        type: integer
        source: computed
        description: base_total_cents * OFF_SEASON_DISCOUNT_PCT rounded half-up to whole cents when off_season is true, else 0.
      - name: discounted_base_cents
        type: integer
        source: computed
        description: base_total_cents minus off_season_discount_cents; the tier-selection key for the expedite fee.
      - name: expedite_pct
        type: number
        source: computed
        description: Expedite rate selected from EXPEDITE_TIERS by discounted_base_cents; 0 when expedite_requested is false.
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: discounted_base_cents * expedite_pct rounded half-up to whole cents; 0 when expedite_requested is false.
      - name: estimated_total_cents
        type: integer
        source: computed
        description: discounted_base_cents plus expedite_fee_cents.
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Overhaul phase; see state_machines.OverhaulWorkOrder.
        constraints: one of SCHEDULED, TEARDOWN, INSPECTION, REBUILD, RECOMMISSIONED
      - name: recommissioned_at
        type: datetime
        source: computed
        description: Logical-clock instant the component returned to service; null until RECOMMISSIONED.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: InspectionTemplate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /park-ops/inspection-templates/{id}/activate"
        actor: ParkOpsAdmin
        preconditions:
          - "template.status == DRAFT"
          - "template.item_count >= 1"
          - "payload.expected_attraction_version == Attraction.version (OCC, concurrency_rules[template-activate-stale-attraction])"
        side_effects:
          - "sets template.activated_at to the current logical clock instant"
          - "the attraction's prior template whose status == ACTIVE (at most one) transitions ACTIVE -> SUPERSEDED"
          - "sets Attraction.active_template_id to this template's id"
          - "increments Attraction.version by 1"
          - "recomputes Attraction.operational_posture per calculations.operational_posture_derivation"
        note: "Activation is the supersede point; already-created DailyInspection rows keep their pinned template_revision."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a later revision for the same attraction is activated"
        actor: system
        preconditions:
          - "another InspectionTemplate for the same attraction_id has just reached ACTIVE"
        side_effects:
          - "Attraction.active_template_id no longer points at this template"

  - entity: DailyInspection
    initial_state: IN_PROGRESS
    terminal_states: [SIGNED_OFF]
    transitions:
      - from: null
        to: IN_PROGRESS
        trigger: "POST /park-ops/daily-inspections"
        actor: MaintenanceTechnician
        preconditions:
          - "Attraction.active_template_id is not null (else ERR_NO_ACTIVE_TEMPLATE)"
          - "no DailyInspection exists for the same (attraction_id, service_date) (else ERR_DUPLICATE_INSPECTION)"
          - "service_date >= the pinned template's effective_from_date"
        side_effects:
          - "pins template_id = Attraction.active_template_id and template_revision = that template's revision"
          - "fan-out: creates one InspectionItemResult with outcome PENDING per ChecklistItem of the pinned template, copying severity_class"
          - "sets pending_item_count = pinned template.item_count; blocking_item_count = 0; essential_fail_count = 0"
          - "sets opened_by_user_id = X-User-ID"
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "POST /park-ops/inspection-item-results/{id}/record with outcome FAIL on a SAFETY_CRITICAL line"
        actor: MaintenanceTechnician
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "the recorded result's severity_class == SAFETY_CRITICAL and outcome == FAIL"
        side_effects:
          - "CASCADE hop 2 of transitive_cascade/inspection_fail_opens_downtime: because the bound ComponentAsset flipped to condition_flag SUSPECT in hop 1, blocking_item_count increments by 1 and status becomes BLOCKED"
          - "CASCADE hop 3: because this inspection entered BLOCKED, Attraction.operational_posture recomputes to DOWN"
          - "CASCADE hop 4: because the attraction's posture became DOWN and it has no DowntimeEvent whose status IN {OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED}, the system creates a DowntimeEvent with cause_category INSPECTION_FAIL, auto_opened true, started_at = current logical clock, status OPEN"
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "POST /park-ops/inspection-item-results/{id}/record re-recording the last blocking line as PASS"
        actor: MaintenanceTechnician
        preconditions:
          - "inspection.status == BLOCKED"
          - "the target result's severity_class == SAFETY_CRITICAL and its current outcome == FAIL"
          - "blocking_item_count would reach 0 after this record"
        side_effects:
          - "decrements blocking_item_count to 0 and sets status back to IN_PROGRESS"
          - "clears the bound ComponentAsset.condition_flag back to OK when no other FAIL result references it"
          - "recomputes Attraction.operational_posture (the auto-opened DowntimeEvent still holds it at DOWN until closed)"
        note: "This is the BLOCKED leg of the non-linear cycle; the auto-opened DowntimeEvent is NOT auto-closed."
      - from: IN_PROGRESS
        to: PENDING_SIGN_OFF
        trigger: "POST /park-ops/daily-inspections/{id}/submit"
        actor: MaintenanceTechnician
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "pending_item_count == 0 (else ERR_ITEM_RESULTS_PENDING)"
        side_effects:
          - "no field on other entities changes; updated_at and version advance"
      - from: PENDING_SIGN_OFF
        to: SIGNED_OFF
        trigger: "POST /park-ops/daily-inspections/{id}/sign-off"
        actor: QualifiedInspector
        preconditions:
          - "inspection.status == PENDING_SIGN_OFF"
          - "blocking_item_count == 0 (else ERR_SAFETY_CRITICAL_ITEM_FAILED)"
          - "no ComponentAsset of the attraction with criticality SAFETY_CRITICAL has ndt_status == OVERDUE (else ERR_NDT_OVERDUE_SAFETY_CRITICAL)"
          - "Attraction.regulatory_hold == false (else ERR_REGULATORY_HOLD_ACTIVE) — cross_entity_state_dependency on IncidentReport"
          - "X-User-ID is not present in inspection.recorded_by_user_ids (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets signed_off_by_user_id = X-User-ID and signed_off_at = current logical clock"
          - "sets Attraction.last_signed_off_service_date = inspection.service_date"
          - "recomputes Attraction.operational_posture (leaves CLOSED_PENDING_INSPECTION for OPEN when nothing else gates the attraction)"
      - from: PENDING_SIGN_OFF
        to: REJECTED
        trigger: "POST /park-ops/daily-inspections/{id}/reject"
        actor: QualifiedInspector
        preconditions:
          - "inspection.status == PENDING_SIGN_OFF"
        side_effects:
          - "stores rejection_reason"
          - "recomputes Attraction.operational_posture (the attraction has no SIGNED_OFF inspection for the service date, so posture stays CLOSED_PENDING_INSPECTION or lower)"
      - from: REJECTED
        to: IN_PROGRESS
        trigger: "POST /park-ops/daily-inspections/{id}/reopen"
        actor: MaintenanceTechnician
        preconditions:
          - "inspection.status == REJECTED"
        side_effects:
          - "increments rework_round by 1"
          - "every InspectionItemResult of this inspection whose outcome == FAIL is reset to outcome PENDING with recorded_by_user_id and recorded_at cleared"
          - "recomputes pending_item_count, blocking_item_count and essential_fail_count from the reset rows"
          - "leaves recorded_by_user_ids untouched, so the segregation-of-duties set survives rework rounds"
        note: "Closes the cycle IN_PROGRESS -> PENDING_SIGN_OFF -> REJECTED -> IN_PROGRESS."

  - entity: InspectionItemResult
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /park-ops/inspection-item-results/{id}/record with outcome PASS"
        actor: MaintenanceTechnician
        preconditions:
          - "result.outcome == PENDING"
          - "parent inspection.status IN {IN_PROGRESS, BLOCKED}"
        side_effects:
          - "sets recorded_by_user_id, recorded_at; appends X-User-ID to inspection.recorded_by_user_ids when absent"
          - "decrements inspection.pending_item_count by 1"
      - from: PENDING
        to: FAIL
        trigger: "POST /park-ops/inspection-item-results/{id}/record with outcome FAIL"
        actor: MaintenanceTechnician
        preconditions:
          - "parent inspection.status IN {IN_PROGRESS, BLOCKED}"
          - "note is a non-empty string when severity_class == ESSENTIAL (else ERR_ESSENTIAL_FAIL_NOTE_REQUIRED)"
        side_effects:
          - "CASCADE hop 1 of transitive_cascade/inspection_fail_opens_downtime: when the bound ChecklistItem.component_id is non-null, that ComponentAsset.condition_flag becomes SUSPECT"
          - "increments inspection.essential_fail_count when severity_class == ESSENTIAL"
          - "for severity_class SAFETY_CRITICAL, drives the inspection IN_PROGRESS -> BLOCKED transition (hops 2-4)"
      - from: PENDING
        to: NA
        trigger: "POST /park-ops/inspection-item-results/{id}/record with outcome NA"
        actor: MaintenanceTechnician
        preconditions:
          - "parent inspection.status IN {IN_PROGRESS, BLOCKED}"
          - "severity_class != SAFETY_CRITICAL (a safety-critical line can never be waived; else ERR_INVALID_REQUEST via §1.4 priority 5)"
        side_effects:
          - "decrements inspection.pending_item_count"
      - from: FAIL
        to: PASS
        trigger: "POST /park-ops/inspection-item-results/{id}/record with outcome PASS re-recording a failed line"
        actor: MaintenanceTechnician
        preconditions:
          - "result.outcome == FAIL"
          - "parent inspection.status IN {IN_PROGRESS, BLOCKED}"
        side_effects:
          - "sets recorded_by_user_id and recorded_at to the re-recording technician and instant"
          - "decrements inspection.essential_fail_count when severity_class == ESSENTIAL and inspection.blocking_item_count when severity_class == SAFETY_CRITICAL"
          - "leaves pending_item_count unchanged, because a FAIL row was not pending"
          - "for severity_class SAFETY_CRITICAL, drives the inspection BLOCKED -> IN_PROGRESS transition once blocking_item_count reaches 0"
      - from: PASS
        to: FAIL
        trigger: "POST /park-ops/inspection-item-results/{id}/record with outcome FAIL re-recording a passed line"
        actor: MaintenanceTechnician
        preconditions:
          - "result.outcome == PASS"
          - "parent inspection.status IN {IN_PROGRESS, BLOCKED, PENDING_SIGN_OFF}"
          - "note is a non-empty string when severity_class == ESSENTIAL (else ERR_ESSENTIAL_FAIL_NOTE_REQUIRED)"
        side_effects:
          - "CASCADE hop 1 as on PENDING -> FAIL: a bound ComponentAsset.condition_flag becomes SUSPECT"
          - "increments inspection.essential_fail_count when severity_class == ESSENTIAL and inspection.blocking_item_count when severity_class == SAFETY_CRITICAL"
          - "drives the inspection IN_PROGRESS -> BLOCKED only when the parent is IN_PROGRESS; a parent already in PENDING_SIGN_OFF keeps that status and simply carries blocking_item_count > 0"
        note: "The post-submission re-record. Because PENDING_SIGN_OFF has no declared edge to BLOCKED, this is the only way to reach a PENDING_SIGN_OFF inspection whose blocking_item_count > 0, which makes ERR_SAFETY_CRITICAL_ITEM_FAILED (§1.4 priority 8) the operative sign-off gate rather than the priority 7 state check."
      - from: FAIL
        to: PENDING
        trigger: "system: parent inspection REJECTED -> IN_PROGRESS reopen"
        actor: system
        preconditions:
          - "result.outcome == FAIL"
        side_effects:
          - "clears recorded_by_user_id and recorded_at; increments inspection.pending_item_count"

  - entity: MaintenanceBulletin
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /park-ops/bulletins/{id}/acknowledge"
        actor: MaintenanceManager
        preconditions:
          - "bulletin.status == ISSUED"
        side_effects:
          - "sets acknowledged_at and acknowledged_by_user_id"
          - "fan-out: creates one BulletinAction with status PENDING for every Attraction whose manufacturer == bulletin.manufacturer AND model_code == bulletin.model_code, ordered by Attraction.created_at ascending"
          - "sets action_total_count to the number of created actions and action_verified_count to 0"
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "system: the last non-CANCELLED BulletinAction reaches VERIFIED"
        actor: system
        preconditions:
          - "action_total_count >= 1"
          - "action_verified_count == action_total_count"
        side_effects:
          - "compound bubble-up; no further action rows may be created for this bulletin"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a newly created MaintenanceBulletin names this one in supersedes_bulletin_id"
        actor: system
        preconditions:
          - "bulletin.status IN {ISSUED, ACKNOWLEDGED}"
        side_effects:
          - "every BulletinAction of this bulletin whose status IN {PENDING, IN_WORK, DEFERRED} transitions to CANCELLED"
          - "recomputes action_total_count (CANCELLED rows are excluded)"
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "system: a newly created MaintenanceBulletin names this one in supersedes_bulletin_id"
        actor: system
        preconditions:
          - "bulletin.status IN {ISSUED, ACKNOWLEDGED}"
        side_effects:
          - "every BulletinAction of this bulletin whose status IN {PENDING, IN_WORK, DEFERRED} transitions to CANCELLED"
          - "recomputes action_total_count (CANCELLED rows are excluded)"

  - entity: BulletinAction
    initial_state: PENDING
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_WORK
        trigger: "POST /park-ops/bulletin-actions/{id}/start"
        actor: MaintenanceTechnician
        preconditions:
          - "action.status == PENDING"
          - "the parent bulletin.status == ACKNOWLEDGED"
        side_effects:
          - "no cross-entity change; updated_at and version advance"
      - from: PENDING
        to: DEFERRED
        trigger: "POST /park-ops/bulletin-actions/{id}/defer"
        actor: MaintenanceManager
        preconditions:
          - "action.status == PENDING"
          - "parent bulletin.severity != RECALL (else ERR_RECALL_NOT_DEFERRABLE)"
          - "deferred_until_date <= parent bulletin.compliance_deadline_date"
        side_effects:
          - "stores deferral_reason and deferred_until_date"
          - "raises the bulletin's FLEET_AGGREGATE risk score via the deferral escalation factor"
      - from: IN_WORK
        to: VERIFIED
        trigger: "POST /park-ops/bulletin-actions/{id}/verify"
        actor: QualifiedInspector
        preconditions:
          - "action.status == IN_WORK"
          - "action.required_part_received == true (else ERR_PART_NOT_RECEIVED) — cross_entity_state_dependency on PartRequisition"
        side_effects:
          - "sets verified_by_user_id and verified_at"
          - "increments parent MaintenanceBulletin.action_verified_count by 1"
          - "when action_verified_count == action_total_count the parent bulletin bubbles up ACKNOWLEDGED -> COMPLETED"
      - from: PENDING
        to: CANCELLED
        trigger: "system: parent bulletin transitions to SUPERSEDED"
        actor: system
        preconditions:
          - "action.status IN {PENDING, IN_WORK, DEFERRED}"
        side_effects:
          - "excluded from action_total_count"
      - from: IN_WORK
        to: CANCELLED
        trigger: "system: parent bulletin transitions to SUPERSEDED"
        actor: system
        preconditions:
          - "action.status IN {PENDING, IN_WORK, DEFERRED}"
        side_effects:
          - "excluded from action_total_count"
      - from: DEFERRED
        to: CANCELLED
        trigger: "system: parent bulletin transitions to SUPERSEDED"
        actor: system
        preconditions:
          - "action.status IN {PENDING, IN_WORK, DEFERRED}"
        side_effects:
          - "excluded from action_total_count"

  - entity: DowntimeEvent
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /park-ops/downtime-events (or system cascade hop 4 from an inspection safety-critical FAIL)"
        actor: MaintenanceTechnician
        preconditions:
          - "the attraction has no DowntimeEvent whose status IN {OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED} (else ERR_DOWNTIME_ALREADY_OPEN)"
        side_effects:
          - "sets service_date = UTC calendar date of started_at"
          - "recomputes Attraction.operational_posture to DOWN"
      - from: OPEN
        to: DIAGNOSED
        trigger: "POST /park-ops/downtime-events/{id}/diagnose"
        actor: MaintenanceTechnician
        preconditions:
          - "event.status == OPEN"
          - "failed_component_id, when supplied, names a ComponentAsset whose attraction_id == event.attraction_id (else ERR_COMPONENT_ATTRACTION_MISMATCH)"
        side_effects:
          - "stores root_cause_code and failed_component_id"
          - "when failed_component_id is supplied, that ComponentAsset.condition_flag becomes FAILED"
      - from: DIAGNOSED
        to: AWAITING_PARTS
        trigger: "system: a PartRequisition whose downtime_event_id is this event transitions REQUESTED -> BACKORDERED"
        actor: system
        preconditions:
          - "event.status == DIAGNOSED"
        side_effects:
          - "posture stays DOWN; the event is excluded from the SETTLED capacity window until CLOSED"
      - from: AWAITING_PARTS
        to: DIAGNOSED
        trigger: "system: a PartRequisition whose downtime_event_id is this event transitions BACKORDERED -> RECEIVED"
        actor: system
        preconditions:
          - "event.status == AWAITING_PARTS"
        side_effects:
          - "no other entity changes; closes the AWAITING_PARTS cycle"
      - from: DIAGNOSED
        to: RESOLVED
        trigger: "POST /park-ops/downtime-events/{id}/resolve"
        actor: MaintenanceTechnician
        preconditions:
          - "event.status == DIAGNOSED"
          - "ended_at > started_at"
          - "the UTC calendar date of ended_at == event.service_date (else ERR_DOWNTIME_SPANS_SERVICE_DATES)"
        side_effects:
          - "computes duration_minutes, peak_minutes, off_peak_minutes and settled_guest_slots_lost per calculations.downtime_capacity_loss"
        note: "AWAITING_PARTS must return to DIAGNOSED before resolve is permitted."
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /park-ops/downtime-events/{id}/close"
        actor: MaintenanceManager
        preconditions:
          - "event.status == RESOLVED"
        side_effects:
          - "adds duration_minutes to Attraction.ytd_downtime_minutes (compensating_invariant/downtime_minutes_ledger forward leg)"
          - "recomputes Attraction.operational_posture; the attraction leaves DOWN when nothing else gates it"
      - from: CLOSED
        to: VOIDED
        trigger: "POST /park-ops/downtime-events/{id}/void"
        actor: MaintenanceManager
        preconditions:
          - "event.status == CLOSED"
        side_effects:
          - "subtracts duration_minutes from Attraction.ytd_downtime_minutes (compensating leg; the ledger returns to its pre-close value)"
          - "stores void_reason; the event leaves the SETTLED capacity-impact input set"

  - entity: PartRequisition
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /park-ops/part-requisitions"
        actor: MaintenanceTechnician
        preconditions:
          - "at most one of downtime_event_id / bulletin_action_id is supplied"
          - "a supplied downtime_event_id names a DowntimeEvent whose attraction_id == payload.attraction_id (else ERR_INVALID_REQUEST via §1.4 priority 5)"
          - "a supplied bulletin_action_id names a BulletinAction whose attraction_id == payload.attraction_id (else ERR_INVALID_REQUEST via §1.4 priority 5)"
        side_effects:
          - "computes total_cost_cents = quantity * unit_cost_cents"
          - "no budget is committed while REQUESTED"
      - from: REQUESTED
        to: RESERVED
        trigger: "POST /park-ops/part-requisitions/{id}/reserve"
        actor: MaintenanceManager
        preconditions:
          - "requisition.status == REQUESTED"
          - "Attraction.parts_budget_committed_cents + requisition.total_cost_cents <= Attraction.parts_budget_cents (else ERR_PARTS_BUDGET_EXCEEDED)"
        side_effects:
          - "adds total_cost_cents to Attraction.parts_budget_committed_cents (compensating_invariant/parts_budget_ledger forward leg)"
      - from: REQUESTED
        to: BACKORDERED
        trigger: "POST /park-ops/part-requisitions/{id}/backorder"
        actor: MaintenanceManager
        preconditions:
          - "requisition.status == REQUESTED"
          - "Attraction.parts_budget_committed_cents + requisition.total_cost_cents <= Attraction.parts_budget_cents (else ERR_PARTS_BUDGET_EXCEEDED)"
        side_effects:
          - "stores expected_availability_date and adds total_cost_cents to Attraction.parts_budget_committed_cents"
          - "when downtime_event_id is set and that event.status == DIAGNOSED, the event transitions DIAGNOSED -> AWAITING_PARTS"
      - from: RESERVED
        to: RECEIVED
        trigger: "POST /park-ops/part-requisitions/{id}/receive"
        actor: MaintenanceTechnician
        preconditions:
          - "requisition.status IN {RESERVED, BACKORDERED}"
        side_effects:
          - "committed budget is unchanged (RECEIVED remains inside the committed set)"
          - "when bulletin_action_id is set, that BulletinAction.required_part_received becomes true"
          - "when downtime_event_id is set and that event.status == AWAITING_PARTS, the event transitions AWAITING_PARTS -> DIAGNOSED"
      - from: BACKORDERED
        to: RECEIVED
        trigger: "POST /park-ops/part-requisitions/{id}/receive"
        actor: MaintenanceTechnician
        preconditions:
          - "requisition.status IN {RESERVED, BACKORDERED}"
        side_effects:
          - "committed budget is unchanged"
          - "when bulletin_action_id is set, that BulletinAction.required_part_received becomes true"
          - "when downtime_event_id is set and that event.status == AWAITING_PARTS, the event transitions AWAITING_PARTS -> DIAGNOSED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /park-ops/part-requisitions/{id}/cancel"
        actor: MaintenanceManager
        preconditions:
          - "requisition.status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects:
          - "stores cancel_reason; no budget change because REQUESTED never committed"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /park-ops/part-requisitions/{id}/cancel"
        actor: MaintenanceManager
        preconditions:
          - "requisition.status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects:
          - "subtracts total_cost_cents from Attraction.parts_budget_committed_cents (compensating leg of parts_budget_ledger)"
          - "stores cancel_reason"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /park-ops/part-requisitions/{id}/cancel"
        actor: MaintenanceManager
        preconditions:
          - "requisition.status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects:
          - "subtracts total_cost_cents from Attraction.parts_budget_committed_cents"
          - "when downtime_event_id is set and that event.status == AWAITING_PARTS, the event transitions AWAITING_PARTS -> DIAGNOSED"

  - entity: OperatorCertification
    initial_state: TRAINEE
    terminal_states: [EXPIRED]
    transitions:
      - from: null
        to: CERTIFIED
        trigger: "POST /park-ops/operator-certifications with passing scores and a validity interval containing the logical clock"
        actor: MaintenanceManager
        preconditions:
          - "no other OperatorCertification for the same (attraction_id, operator_user_id) has a validity interval overlapping [effective_from, expires_at) (else ERR_CERTIFICATION_WINDOW_OVERLAP)"
          - "restraint_verification_score >= RESTRAINT_PASS_SCORE and dispatch_procedure_score >= DISPATCH_PASS_SCORE"
        side_effects:
          - "increments Attraction.certified_operator_count"
          - "recomputes the attraction's dispatch_readiness_index inputs"
      - from: null
        to: TRAINEE
        trigger: "POST /park-ops/operator-certifications with a failing score or a future effective_from"
        actor: MaintenanceManager
        preconditions:
          - "no overlapping certification for the same (attraction_id, operator_user_id)"
        side_effects:
          - "Attraction.certified_operator_count is unchanged"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /park-ops/operator-certifications/{id}/suspend, or system cascade hop 3 when the attraction enters posture HOLD"
        actor: SafetyOfficer
        preconditions:
          - "derived status == CERTIFIED (else ERR_CERTIFICATION_STATE_INVALID)"
        side_effects:
          - "sets suspended_at and suspension_reason"
          - "CASCADE hop 4 of transitive_cascade/ride_hold_suspends_dispatch: because this certification became SUSPENDED, Attraction.certified_operator_count is recomputed downward"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "system: the IncidentReport that suspended it reaches CLEARED_TO_OPERATE"
        actor: system
        preconditions:
          - "suspended_at is not null and the logical clock is still inside [effective_from, expires_at)"
        side_effects:
          - "clears suspended_at and suspension_reason; Attraction.certified_operator_count is recomputed upward"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system: the logical clock reaches expires_at (derived at read time)"
        actor: system
        preconditions:
          - "current logical clock >= expires_at"
        side_effects:
          - "Attraction.certified_operator_count excludes the row from the next recomputation"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: the logical clock reaches expires_at (derived at read time)"
        actor: system
        preconditions:
          - "current logical clock >= expires_at"
        side_effects:
          - "EXPIRED takes precedence over SUSPENDED in calculations.certification_status_derivation"

  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [CLEARED_TO_OPERATE]
    transitions:
      - from: null
        to: RIDE_HELD
        trigger: "POST /park-ops/incidents with injury_severity IN {SERIOUS, FATAL}"
        actor: SafetyOfficer
        preconditions:
          - "the attraction exists"
        side_effects:
          - "sets regulator_notification_due_at = occurred_at + REGULATOR_NOTIFICATION_HOURS"
          - "runs the same hop 1-4 cascade as the explicit hold-ride transition"
      - from: null
        to: REPORTED
        trigger: "POST /park-ops/incidents with injury_severity IN {NONE, MINOR}"
        actor: SafetyOfficer
        preconditions:
          - "the attraction exists"
        side_effects:
          - "regulator_notification_due_at stays null; no ride hold is applied"
      - from: REPORTED
        to: RIDE_HELD
        trigger: "POST /park-ops/incidents/{id}/hold-ride"
        actor: SafetyOfficer
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "CASCADE hop 1 of transitive_cascade/ride_hold_suspends_dispatch: Attraction.regulatory_hold becomes true"
          - "CASCADE hop 2: because regulatory_hold became true, Attraction.operational_posture recomputes to HOLD"
          - "CASCADE hop 3: because the posture became HOLD, every OperatorCertification of the attraction whose derived status == CERTIFIED transitions to SUSPENDED with suspension_reason 'RIDE_HOLD'; suspended_certification_count records how many"
          - "CASCADE hop 4: because those certifications became SUSPENDED, Attraction.certified_operator_count is recomputed downward"
      - from: RIDE_HELD
        to: UNDER_INVESTIGATION
        trigger: "POST /park-ops/incidents/{id}/investigate"
        actor: SafetyOfficer
        preconditions:
          - "incident.status == RIDE_HELD"
        side_effects:
          - "stores investigator_user_id; regulatory_hold stays true"
      - from: UNDER_INVESTIGATION
        to: REGULATOR_NOTIFIED
        trigger: "POST /park-ops/incidents/{id}/notify-regulator"
        actor: SafetyOfficer
        preconditions:
          - "incident.status == UNDER_INVESTIGATION"
          - "injury_severity IN {SERIOUS, FATAL} (else ERR_NOTIFICATION_NOT_REQUIRED)"
        side_effects:
          - "BRANCH A side-effect set: stores regulator_case_ref and notified_at, and sets notified_late = (notified_at > regulator_notification_due_at)"
          - "clearance from this branch additionally requires regulator_clearance_ref"
      - from: UNDER_INVESTIGATION
        to: INTERNAL_REVIEW_CLOSED
        trigger: "POST /park-ops/incidents/{id}/close-internal"
        actor: SafetyOfficer
        preconditions:
          - "incident.status == UNDER_INVESTIGATION"
        side_effects:
          - "BRANCH B side-effect set: regulator_case_ref, notified_at and notified_late all stay at their null/false defaults"
          - "clearance from this branch requires no regulator_clearance_ref"
      - from: REGULATOR_NOTIFIED
        to: CLEARED_TO_OPERATE
        trigger: "POST /park-ops/incidents/{id}/clear"
        actor: SafetyOfficer
        preconditions:
          - "incident.status IN {REGULATOR_NOTIFIED, INTERNAL_REVIEW_CLOSED}"
          - "regulator_clearance_ref is supplied and non-empty because this incident took BRANCH A (else ERR_REGULATOR_CLEARANCE_REQUIRED)"
        side_effects:
          - "sets cleared_at; compensates the hold cascade: Attraction.regulatory_hold becomes false when no other IncidentReport of the attraction is in {RIDE_HELD, UNDER_INVESTIGATION, REGULATOR_NOTIFIED}"
          - "every OperatorCertification this incident suspended returns SUSPENDED -> CERTIFIED and Attraction.certified_operator_count is recomputed upward"
          - "recomputes Attraction.operational_posture"
      - from: INTERNAL_REVIEW_CLOSED
        to: CLEARED_TO_OPERATE
        trigger: "POST /park-ops/incidents/{id}/clear"
        actor: SafetyOfficer
        preconditions:
          - "incident.status IN {REGULATOR_NOTIFIED, INTERNAL_REVIEW_CLOSED}"
          - "regulator_clearance_ref is ignored on this branch and may be omitted"
        side_effects:
          - "identical compensation of the hold cascade as the BRANCH A join, minus any regulator bookkeeping"
        note: "The two branches join here with divergent entry preconditions — the fork-join shape required by rule non_linear_state_machine."

  - entity: OverhaulWorkOrder
    initial_state: SCHEDULED
    terminal_states: [RECOMMISSIONED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /park-ops/overhaul-work-orders"
        actor: MaintenanceManager
        preconditions:
          - "component_id names a ComponentAsset whose attraction_id == payload.attraction_id (else ERR_COMPONENT_ATTRACTION_MISMATCH)"
          - "the buffered window does not exceed the bay's concurrent_slot_capacity on any day (else ERR_BAY_CAPACITY_CONFLICT)"
          - "payload.expected_shop_bay_version == ShopBay.version (OCC, concurrency_rules[overhaul-create-stale-shop-bay])"
        side_effects:
          - "computes off_season, base_total_cents, off_season_discount_cents, discounted_base_cents, expedite_pct, expedite_fee_cents and estimated_total_cents per calculations.overhaul_cost_estimate"
          - "increments ShopBay.booked_order_count and ShopBay.version by 1"
      - from: SCHEDULED
        to: TEARDOWN
        trigger: "POST /park-ops/overhaul-work-orders/{id}/advance with target_phase TEARDOWN"
        actor: MaintenanceManager
        preconditions:
          - "order.status == SCHEDULED"
          - "the attraction has no DailyInspection for the current service date whose status == PENDING_SIGN_OFF (else ERR_INSPECTION_STATE_INVALID via §1.4 priority 7)"
        side_effects:
          - "recomputes Attraction.operational_posture to OVERHAUL (highest-precedence posture)"
      - from: TEARDOWN
        to: INSPECTION
        trigger: "POST /park-ops/overhaul-work-orders/{id}/advance with target_phase INSPECTION"
        actor: MaintenanceManager
        preconditions:
          - "order.status == TEARDOWN"
        side_effects:
          - "the component's condition_flag is left untouched until recommissioning"
      - from: INSPECTION
        to: REBUILD
        trigger: "POST /park-ops/overhaul-work-orders/{id}/advance with target_phase REBUILD"
        actor: MaintenanceManager
        preconditions:
          - "order.status == INSPECTION"
        side_effects:
          - "no cross-entity change"
      - from: REBUILD
        to: RECOMMISSIONED
        trigger: "POST /park-ops/overhaul-work-orders/{id}/advance with target_phase RECOMMISSIONED"
        actor: MaintenanceManager
        preconditions:
          - "order.status == REBUILD"
        side_effects:
          - "sets recommissioned_at; the component's last_ndt_at becomes the current logical clock, last_ndt_cycles becomes Attraction.cumulative_cycles, ndt_status returns to CURRENT and condition_flag returns to OK"
          - "decrements ShopBay.booked_order_count"
          - "recomputes Attraction.operational_posture, which leaves OVERHAUL"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: template-activate-stale-attraction
    parent_entity: Attraction
    write_endpoint: "POST /park-ops/inspection-templates/{id}/activate"
    occ_field: "expected_attraction_version"
    description: |
      Activating an InspectionTemplate against an Attraction whose version has
      advanced since the client last read it is rejected. Activation legitimately
      supersedes whichever template is currently ACTIVE, so an operator working
      from a stale view of the attraction would silently retire a revision they
      never saw; the stale-version check turns that into a 412.
    error_id: ERR_STALE_ATTRACTION_VERSION
    http_status: 412
  - rule_id: overhaul-create-stale-shop-bay
    parent_entity: ShopBay
    write_endpoint: "POST /park-ops/overhaul-work-orders"
    occ_field: "expected_shop_bay_version"
    description: |
      Booking an OverhaulWorkOrder into a ShopBay whose version has advanced since
      the client last read it is rejected. Another planner may have consumed a
      concurrent slot whose window the requested one would legitimately fit beside,
      so the capacity arithmetic the client reasoned from is stale.
    error_id: ERR_STALE_SHOP_BAY_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: downtime_capacity_loss
    trigger: "GET /park-ops/attractions/{id}/capacity-impact; the SETTLED per-event component is also stamped onto DowntimeEvent.settled_guest_slots_lost during the DIAGNOSED -> RESOLVED transition"
    algorithm: interval_merge + aggregation (dual-variant)
    formula: |
      # ---- per-event geometry (shared by both variants) ----
      peak_window(e)      = [ e.service_date + PEAK_WINDOW_START_UTC ,
                              e.service_date + PEAK_WINDOW_END_UTC )      # half-open
      occupancy(e)        = [ e.started_at , e.ended_at )                  # half-open
      peak_minutes(e)     = whole minutes of ( occupancy(e) INTERSECT peak_window(e) )
      duration_minutes(e) = whole minutes of occupancy(e)
      off_peak_minutes(e) = duration_minutes(e) - peak_minutes(e)

      weighted_hours(e)   = peak_minutes(e)/60 * PEAK_CAPACITY_WEIGHT
                          + off_peak_minutes(e)/60 * OFF_PEAK_CAPACITY_WEIGHT

      # ---- variant SETTLED: round per event, THEN sum (rounding order PINNED) ----
      loss_settled(e)          = round_half_up( A.theoretical_hourly_capacity * weighted_hours(e), 2 )
      settled_guest_slots_lost = round_half_up( SUM over e in INPUT_SET of loss_settled(e), 2 )

      # ---- variant PROVISIONAL: sum the geometry FIRST, round ONCE, then credit ----
      total_peak_minutes     = SUM over e in INPUT_SET of peak_minutes(e)
      total_off_peak_minutes = SUM over e in INPUT_SET of off_peak_minutes(e)
      raw_provisional        = round_half_up(
                                 A.theoretical_hourly_capacity *
                                 ( total_peak_minutes/60 * PEAK_CAPACITY_WEIGHT
                                 + total_off_peak_minutes/60 * OFF_PEAK_CAPACITY_WEIGHT ), 2 )
      provisional_guest_slots_lost = round_half_up(
                                 raw_provisional * (1 - PROVISIONAL_RECOVERY_CREDIT), 2 )

      divergence_guest_slots = round_half_up(
                                 settled_guest_slots_lost - provisional_guest_slots_lost, 2 )

      # ---- projection of still-open downtime (PROVISIONAL only) ----
      # For an event whose status IN {OPEN, DIAGNOSED, AWAITING_PARTS} and whose
      # ended_at is null, PROVISIONAL substitutes
      #   projected_ended_at = e.started_at + A.mean_repair_minutes minutes
      # clamped so it never crosses midnight UTC of e.service_date. SETTLED never
      # projects: an event with ended_at == null contributes 0 to SETTLED.
    input_set: |
      Both variants read the SAME event set: every DowntimeEvent whose
      attraction_id == {id} and whose service_date is inside
      [window_start_date, window_end_date] (both inclusive, defaulting to the
      logical clock's UTC date for both bounds) and whose
      status IN {RESOLVED, CLOSED, OPEN, DIAGNOSED, AWAITING_PARTS}.
      Events with status == VOIDED are excluded from both variants.
      Ordering for the SETTLED summation is service_date ASC, then started_at ASC,
      then created_at ASC (no identifier ever participates).
    constants:
      PEAK_WINDOW_START_UTC: "11:00"
      PEAK_WINDOW_END_UTC: "17:00"
      PEAK_CAPACITY_WEIGHT: 1.00
      OFF_PEAK_CAPACITY_WEIGHT: 0.55
      PROVISIONAL_RECOVERY_CREDIT: 0.15
    precision: "2 decimal places, round_half_up; minute counts are whole integers (an occupancy of 89.6 seconds contributes 1 minute only when the boundary arithmetic yields a whole minute — started_at and ended_at are always minute-aligned in this domain)"
    variants:
      - name: SETTLED
        when: "the chronological, books-closed number reported to park operations after each event is resolved"
        difference: "rounds each event's loss to 2 decimals BEFORE summing and applies no recovery credit"
      - name: PROVISIONAL
        when: "the forward-looking number the duty manager sees mid-day, including still-open downtime"
        difference: "aggregates raw peak/off-peak minutes first and rounds ONCE, then multiplies by (1 - PROVISIONAL_RECOVERY_CREDIT); still-open events contribute a projected ended_at"

  - name: bulletin_fleet_risk_score
    trigger: "GET /park-ops/bulletins/{id}/risk"
    algorithm: weighted_scoring (dual-variant)
    formula: |
      days_overdue = max( 0, floor( ( clock_date - B.compliance_deadline_date ) in whole days ) )
      overdue_points = min( days_overdue * OVERDUE_POINTS_PER_DAY, OVERDUE_POINT_CAP )

      for each action a in INPUT_SET (attraction A = a.attraction_id):
        raw(a)   = SEVERITY_BASE[B.severity]
                 * RIDE_CLASS_FACTOR[A.ride_class]
                 * STATUS_FACTOR[a.status]
                 + overdue_points
        score(a) = min( round_half_up( raw(a), 2 ), SCORE_CEILING )

      deferred_action_count = count of a in INPUT_SET where a.status == DEFERRED
      escalation_factor     = 1 + DEFERRAL_ESCALATION_STEP * deferred_action_count

      # variant FLEET_AGGREGATE
      mean_rounded          = round_half_up( SUM(score(a)) / count(INPUT_SET), 2 )
      fleet_aggregate_score = min( round_half_up( mean_rounded * escalation_factor, 2 ), SCORE_CEILING )

      # variant PER_UNIT_MAX
      per_unit_max_score    = max over a in INPUT_SET of score(a)      # no escalation

      divergence = round_half_up( per_unit_max_score - fleet_aggregate_score, 2 )
      # When INPUT_SET is empty both variants are 0.00 and divergence is 0.00.
    input_set: |
      Every BulletinAction whose bulletin_id == {id} and whose
      status IN {PENDING, IN_WORK, DEFERRED}. VERIFIED and CANCELLED actions are
      excluded from both variants. Iteration order is attraction created_at ASC.
    constants:
      SEVERITY_BASE: { ADVISORY: 10, MANDATORY: 40, RECALL: 70 }
      RIDE_CLASS_FACTOR: { KIDDIE: 0.6, FAMILY: 0.8, WATER: 1.0, THRILL: 1.2 }
      STATUS_FACTOR: { PENDING: 1.0, IN_WORK: 0.6, DEFERRED: 1.4 }
      OVERDUE_POINTS_PER_DAY: 1.5
      OVERDUE_POINT_CAP: 30
      DEFERRAL_ESCALATION_STEP: 0.05
      SCORE_CEILING: 100
    precision: "2 decimal places, round_half_up; the mean is rounded before the escalation multiply and the product is rounded again"
    variants:
      - name: FLEET_AGGREGATE
        when: "the compliance dashboard number the maintenance director reports for the whole fleet"
        difference: "arithmetic mean of the per-action scores, then multiplied by the deferral escalation factor"
      - name: PER_UNIT_MAX
        when: "the number the safety committee uses to decide whether any single unit must be pulled"
        difference: "maximum single-action score, ignoring the deferral escalation factor entirely"

  - name: overhaul_cost_estimate
    trigger: "POST /park-ops/overhaul-work-orders (stamped onto the created OverhaulWorkOrder)"
    algorithm: tiered_pricing with pinned evaluation order
    formula: |
      # The tier the expedite fee uses depends on the discounted base, and the
      # discount depends on the base — a circular-looking dependency. The order
      # below is the ONLY sanctioned evaluation order.
      #
      # step 1
      labor_cents = W.labor_hours * LABOR_RATE_CENTS_PER_HOUR
      # step 2
      base_total_cents = W.parts_subtotal_cents + labor_cents
      # step 3
      off_season = every date in [W.window_start_date, W.window_end_date] falls in the
                   off-season span (month-day >= OFF_SEASON_START_MMDD in year Y, or
                   month-day <= OFF_SEASON_END_MMDD in year Y+1)
      off_season_discount_cents = off_season
                                  ? round_half_up( base_total_cents * OFF_SEASON_DISCOUNT_PCT )
                                  : 0
      # step 4
      discounted_base_cents = base_total_cents - off_season_discount_cents
      # step 5  -- tier selected from discounted_base_cents, NOT from base_total_cents
      expedite_pct = W.expedite_requested
                     ? ( discounted_base_cents <  EXPEDITE_TIER_1_CEILING ? EXPEDITE_PCT_SMALL
                       : discounted_base_cents <  EXPEDITE_TIER_2_CEILING ? EXPEDITE_PCT_MEDIUM
                       :                                                    EXPEDITE_PCT_LARGE )
                     : 0
      # step 6
      expedite_fee_cents = round_half_up( discounted_base_cents * expedite_pct )
      # step 7
      estimated_total_cents = discounted_base_cents + expedite_fee_cents
    input_set: "The single OverhaulWorkOrder being created; no sibling rows participate."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 9500
      OFF_SEASON_DISCOUNT_PCT: 0.06
      OFF_SEASON_START_MMDD: "11-01"
      OFF_SEASON_END_MMDD: "02-28"
      EXPEDITE_TIER_1_CEILING: 5000000
      EXPEDITE_TIER_2_CEILING: 20000000
      EXPEDITE_PCT_SMALL: 0.12
      EXPEDITE_PCT_MEDIUM: 0.08
      EXPEDITE_PCT_LARGE: 0.05
    precision: "whole cents throughout; every intermediate multiplication is rounded half-up to a whole cent before the next step consumes it"

  - name: component_ndt_due_status
    trigger: "recomputed after POST /park-ops/attractions/{id}/cycles, after POST /park-ops/components/{id}/ndt-records, after POST /_clock/set_current_utc, and on every read of a ComponentAsset"
    algorithm: threshold
    formula: |
      cycles_since_ndt = A.cumulative_cycles - C.last_ndt_cycles
      days_since_ndt   = floor( ( clock_now - C.last_ndt_at ) / 86400 seconds )

      due_by_cycles     = cycles_since_ndt >= C.ndt_interval_cycles
      due_by_days       = days_since_ndt   >= C.ndt_interval_days
      overdue_by_cycles = cycles_since_ndt >= ceil( C.ndt_interval_cycles * NDT_GRACE_FACTOR )
      overdue_by_days   = days_since_ndt   >= ceil( C.ndt_interval_days   * NDT_GRACE_FACTOR )

      ndt_status = (overdue_by_cycles OR overdue_by_days) ? OVERDUE
                 : (due_by_cycles     OR due_by_days)     ? DUE
                 :                                          CURRENT
    input_set: "The single ComponentAsset plus its parent Attraction's cumulative_cycles and the logical clock."
    constants:
      NDT_GRACE_FACTOR: 1.20
    precision: "integer comparisons only; the >= on both metrics is inclusive, so cycles_since_ndt exactly equal to ndt_interval_cycles is already DUE"

  - name: certification_status_derivation
    trigger: "on every read or aggregation of an OperatorCertification, and after POST /_clock/set_current_utc"
    algorithm: threshold with pinned precedence
    formula: |
      now = current logical clock instant
      if now >= C.expires_at:                                  status = EXPIRED
      elif C.suspended_at is not null:                         status = SUSPENDED
      elif now <  C.effective_from:                            status = TRAINEE
      elif C.restraint_verification_score >= RESTRAINT_PASS_SCORE
           and C.dispatch_procedure_score  >= DISPATCH_PASS_SCORE:
                                                               status = CERTIFIED
      else:                                                    status = TRAINEE
    input_set: "The single OperatorCertification row and the logical clock."
    constants:
      RESTRAINT_PASS_SCORE: 85
      DISPATCH_PASS_SCORE: 80
    precision: "exact integer score comparisons; the validity interval is half-open [effective_from, expires_at)"

  - name: dispatch_readiness_index
    trigger: "GET /park-ops/attractions/{id}/dispatch-readiness"
    algorithm: weighted_scoring with nested min/max and a state branch
    formula: |
      certified = [ c in OperatorCertification where c.attraction_id == {id}
                    and certification_status_derivation(c) == CERTIFIED ]
      certified_operator_count = count(certified)

      if A.operational_posture != OPEN:
          dispatch_readiness_index = 0.00        # conditional branch on entity state
      elif certified_operator_count == 0:
          dispatch_readiness_index = 0.00        # empty-set guard, no division
      else:
          staffing_ratio  = min( certified_operator_count / A.min_operators_required, 1.0 )
          mean_restraint  = SUM(c.restraint_verification_score for c in certified)
                            / certified_operator_count            # exact rational, unrounded
          restraint_factor = min( max( (mean_restraint - RESTRAINT_FLOOR_SCORE)
                                       / RESTRAINT_SPAN, 0.0 ), 1.0 )
          penalty = min( essential_fail_count_of_latest_signed_off_inspection * ESSENTIAL_FAIL_PENALTY,
                         ESSENTIAL_FAIL_PENALTY_CAP )
          dispatch_readiness_index = max(
              round_half_up( 100 * staffing_ratio
                             * ( BASE_WEIGHT + RESTRAINT_WEIGHT * restraint_factor )
                             - penalty, 2 ),
              0.00 )
    input_set: |
      certified: OperatorCertification rows of this attraction whose derived status
      is exactly CERTIFIED at the logical clock instant. essential_fail_count is read
      from the attraction's DailyInspection with the greatest service_date among rows
      whose status == SIGNED_OFF (tie-break: created_at ASC, then the earliest row
      wins); when the attraction has no SIGNED_OFF inspection the penalty is 0.
    constants:
      RESTRAINT_FLOOR_SCORE: 60
      RESTRAINT_SPAN: 40
      BASE_WEIGHT: 0.40
      RESTRAINT_WEIGHT: 0.60
      ESSENTIAL_FAIL_PENALTY: 8
      ESSENTIAL_FAIL_PENALTY_CAP: 40
    precision: "2 decimal places, round_half_up, applied ONCE at the end; mean_restraint and restraint_factor stay unrounded inside the expression"

  - name: operational_posture_derivation
    trigger: "recomputed at the end of every mutation that touches an Attraction, its ComponentAssets, DailyInspections, DowntimeEvents, IncidentReports or OverhaulWorkOrders, and after POST /_clock/set_current_utc"
    algorithm: constraint_propagation with pinned precedence
    formula: |
      # First matching clause wins; the order is normative.
      1. OVERHAUL  if any OverhaulWorkOrder of the attraction has
                      status IN {TEARDOWN, INSPECTION, REBUILD}
      2. HOLD      if A.regulatory_hold == true
      3. DOWN      if any DowntimeEvent of the attraction has
                      status IN {OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED}
                   OR any ComponentAsset of the attraction with
                      criticality == SAFETY_CRITICAL has ndt_status == OVERDUE
                   OR the attraction's DailyInspection for the current service date
                      has status == BLOCKED
      4. CLOSED_PENDING_INSPECTION
                   if A.last_signed_off_service_date != the current logical
                      clock's UTC date
      5. OPEN      otherwise
    input_set: "All child rows of the attraction listed above, at their current persisted states, plus the logical clock's UTC date."
    constants: {}
    precision: "enumerated clauses; no arithmetic"

  - name: parts_budget_committed_ledger
    trigger: "after every PartRequisition transition into or out of {RESERVED, BACKORDERED, RECEIVED}"
    algorithm: aggregation
    formula: |
      total_cost_cents(r) = r.quantity * r.unit_cost_cents
      A.parts_budget_committed_cents =
          SUM of total_cost_cents(r) over every PartRequisition r
          where r.attraction_id == A.id and r.status IN {RESERVED, BACKORDERED, RECEIVED}
      # Conserved-quantity invariant: reserve followed by cancel must restore the
      # pre-reserve value exactly; RECEIVED never leaves the committed set.
    input_set: "PartRequisition rows of the attraction whose status IN {RESERVED, BACKORDERED, RECEIVED}; REQUESTED and CANCELLED rows are excluded."
    constants: {}
    precision: "whole cents, exact integer arithmetic, no rounding"

  - name: downtime_minutes_ledger
    trigger: "after DowntimeEvent RESOLVED -> CLOSED and after CLOSED -> VOIDED"
    algorithm: aggregation
    formula: |
      A.ytd_downtime_minutes =
          SUM of e.duration_minutes over every DowntimeEvent e
          where e.attraction_id == A.id and e.status == CLOSED
      # Conserved-quantity invariant: close followed by void must restore the
      # pre-close value exactly, for every event and in any order.
    input_set: "DowntimeEvent rows of the attraction whose status == CLOSED; OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED and VOIDED rows are excluded."
    constants: {}
    precision: "whole minutes, exact integer arithmetic"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first violated row's error_id is the response)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND that role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id embedded in the request path resolves to a live row, validated left-to-right"
    error_id: "ERR_ATTRACTION_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_CHECKLIST_ITEM_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_ITEM_RESULT_NOT_FOUND | ERR_BULLETIN_NOT_FOUND | ERR_BULLETIN_ACTION_NOT_FOUND | ERR_DOWNTIME_EVENT_NOT_FOUND | ERR_REQUISITION_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_SHOP_BAY_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to a live row, validated in the field order declared in §1.5 input"
    error_id: "ERR_ATTRACTION_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_BULLETIN_NOT_FOUND | ERR_BULLETIN_ACTION_NOT_FOUND | ERR_DOWNTIME_EVENT_NOT_FOUND | ERR_SHOP_BAY_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints with FK body fields"
  - priority: 5
    category: business_constraint
    check: "request shape: required fields present, enum members recognised, integers inside their declared ranges, ISO dates and ISO-8601-UTC instants well formed, ended_at > started_at, expires_at > effective_from, window_end_date >= window_start_date, compliance_deadline_date >= issued_date, bulletin_ref unique, sequence_no unique within its template, supersedes_bulletin_id != the row being created, at most one of downtime_event_id / bulletin_action_id supplied, a supplied downtime_event_id / bulletin_action_id belongs to the same attraction_id as the requisition being created, outcome NA never recorded on a SAFETY_CRITICAL checklist line"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: state
    check: "OCC: the supplied expected_attraction_version / expected_shop_bay_version equals the current version of the named parent row"
    error_id: "ERR_STALE_ATTRACTION_VERSION | ERR_STALE_SHOP_BAY_VERSION"
    http_status: 412
    applies_to: "POST /park-ops/inspection-templates/{id}/activate, POST /park-ops/overhaul-work-orders"
  - priority: 7
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2; for POST /park-ops/overhaul-work-orders/{id}/advance to TEARDOWN this check also covers the cross-entity gate on the attraction's current-service-date DailyInspection, which reports ERR_INSPECTION_STATE_INVALID"
    error_id: "ERR_TEMPLATE_STATE_INVALID | ERR_INSPECTION_STATE_INVALID | ERR_BULLETIN_STATE_INVALID | ERR_ACTION_STATE_INVALID | ERR_DOWNTIME_STATE_INVALID | ERR_REQUISITION_STATE_INVALID | ERR_CERTIFICATION_STATE_INVALID | ERR_INCIDENT_STATE_INVALID | ERR_WORK_ORDER_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "sign-off is refused while the inspection has blocking_item_count > 0"
    error_id: ERR_SAFETY_CRITICAL_ITEM_FAILED
    http_status: 409
    applies_to: "POST /park-ops/daily-inspections/{id}/sign-off"
  - priority: 9
    category: business_safety
    check: "sign-off is refused while any ComponentAsset of the attraction with criticality SAFETY_CRITICAL has ndt_status == OVERDUE"
    error_id: ERR_NDT_OVERDUE_SAFETY_CRITICAL
    http_status: 409
    applies_to: "POST /park-ops/daily-inspections/{id}/sign-off"
  - priority: 10
    category: business_safety
    check: "operations that would return an attraction to guest service are refused while Attraction.regulatory_hold == true"
    error_id: ERR_REGULATORY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /park-ops/daily-inspections/{id}/sign-off, POST /park-ops/attractions/{id}/cycles"
  - priority: 11
    category: business_safety
    check: "segregation of duties: the signing X-User-ID must not appear in DailyInspection.recorded_by_user_ids"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /park-ops/daily-inspections/{id}/sign-off"
  - priority: 12
    category: business_referential
    check: "a supplied component_id names a ComponentAsset installed on the attraction named by the same request (or by the row being mutated)"
    error_id: ERR_COMPONENT_ATTRACTION_MISMATCH
    http_status: 422
    applies_to: "POST /park-ops/overhaul-work-orders, POST /park-ops/downtime-events/{id}/diagnose, POST /park-ops/inspection-templates/{id}/items"
  - priority: 13
    category: business_referential
    check: "the attraction has a template whose status == ACTIVE before a DailyInspection may be created"
    error_id: ERR_NO_ACTIVE_TEMPLATE
    http_status: 409
    applies_to: "POST /park-ops/daily-inspections"
  - priority: 14
    category: business_referential
    check: "BulletinAction verification requires required_part_received == true"
    error_id: ERR_PART_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /park-ops/bulletin-actions/{id}/verify"
  - priority: 15
    category: business_referential
    check: "regulator notification is only meaningful when injury_severity IN {SERIOUS, FATAL}"
    error_id: ERR_NOTIFICATION_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /park-ops/incidents/{id}/notify-regulator"
  - priority: 16
    category: business_referential
    check: "clearing an incident that reached REGULATOR_NOTIFIED requires a non-empty regulator_clearance_ref"
    error_id: ERR_REGULATOR_CLEARANCE_REQUIRED
    http_status: 422
    applies_to: "POST /park-ops/incidents/{id}/clear"
  - priority: 17
    category: business_constraint
    check: "a template may only be activated when item_count >= 1 (empty-collection boundary)"
    error_id: ERR_TEMPLATE_HAS_NO_ITEMS
    http_status: 422
    applies_to: "POST /park-ops/inspection-templates/{id}/activate"
  - priority: 18
    category: business_constraint
    check: "submit is refused while pending_item_count > 0"
    error_id: ERR_ITEM_RESULTS_PENDING
    http_status: 409
    applies_to: "POST /park-ops/daily-inspections/{id}/submit"
  - priority: 19
    category: business_constraint
    check: "recording FAIL on a line whose severity_class == ESSENTIAL requires a non-empty note"
    error_id: ERR_ESSENTIAL_FAIL_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /park-ops/inspection-item-results/{id}/record"
  - priority: 20
    category: business_constraint
    check: "at most one DailyInspection per (attraction_id, service_date)"
    error_id: ERR_DUPLICATE_INSPECTION
    http_status: 409
    applies_to: "POST /park-ops/daily-inspections"
  - priority: 21
    category: business_constraint
    check: "an attraction may hold at most one DowntimeEvent whose status IN {OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED}"
    error_id: ERR_DOWNTIME_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /park-ops/downtime-events"
  - priority: 22
    category: business_constraint
    check: "an action belonging to a bulletin whose severity == RECALL may not be deferred"
    error_id: ERR_RECALL_NOT_DEFERRABLE
    http_status: 409
    applies_to: "POST /park-ops/bulletin-actions/{id}/defer"
  - priority: 23
    category: business_temporal
    check: "the UTC calendar date of ended_at equals DowntimeEvent.service_date"
    error_id: ERR_DOWNTIME_SPANS_SERVICE_DATES
    http_status: 422
    applies_to: "POST /park-ops/downtime-events/{id}/resolve"
  - priority: 24
    category: business_temporal
    check: |
      Shop-bay occupancy, CLOSED-interval semantics with a changeover buffer and
      aggregate capacity: expand the requested window to
      [window_start_date - CHANGEOVER_BUFFER_DAYS, window_end_date + CHANGEOVER_BUFFER_DAYS]
      (CHANGEOVER_BUFFER_DAYS = 1, both endpoints inclusive). For every calendar day
      D in the expanded window, count existing OverhaulWorkOrder rows for the same
      shop_bay_id whose status != RECOMMISSIONED and whose own unbuffered inclusive
      window [window_start_date, window_end_date] contains D. If that count for any
      single D is already >= ShopBay.concurrent_slot_capacity, reject.
    error_id: ERR_BAY_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /park-ops/overhaul-work-orders"
  - priority: 25
    category: business_temporal
    check: |
      Operator certification validity, HALF-OPEN interval semantics with strict
      pairwise exclusivity and no buffer: for the resource key
      (attraction_id, operator_user_id), reject when the requested
      [effective_from, expires_at) intersects any existing row's
      [effective_from, expires_at) for a positive duration. Exact adjacency
      (new.effective_from == old.expires_at, or new.expires_at == old.effective_from)
      is NOT an overlap and is accepted. EXPIRED rows still occupy their interval.
    error_id: ERR_CERTIFICATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /park-ops/operator-certifications"
  - priority: 26
    category: business_fiscal
    check: "Attraction.parts_budget_committed_cents + requisition.total_cost_cents <= Attraction.parts_budget_cents (equality is permitted)"
    error_id: ERR_PARTS_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /park-ops/part-requisitions/{id}/reserve, POST /park-ops/part-requisitions/{id}/backorder"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every business path is namespaced under api_prefix /park-ops; each entity has
# a single-resource GET and a filtered list GET so every foreign key declared in
# §1.1 is reverse-enumerable. The one test-driving endpoint lives under /_clock.
# ---------------------------------------------------------------------------

endpoints:
  # ---- Attraction ----
  - method: POST
    path: "/park-ops/attractions"
    description: "Register an attraction in the maintenance system of record."
    roles: [ParkOpsAdmin]
    code: 201
    input: [name, park_area, manufacturer, model_code, ride_class, theoretical_hourly_capacity, min_operators_required, parts_budget_cents, "mean_repair_minutes?"]
    output: Attraction
    side_effects:
      - "operational_posture initialises to CLOSED_PENDING_INSPECTION"
      - "cumulative_cycles = 0, parts_budget_committed_cents = 0, ytd_downtime_minutes = 0, certified_operator_count = 0"
      - "regulatory_hold = false, active_template_id = null, last_signed_off_service_date = null"
      - "mean_repair_minutes defaults to 120 when omitted"
  - method: GET
    path: "/park-ops/attractions/{id}"
    description: "Read one attraction; every computed field is re-derived against the current logical clock before the response is built."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: Attraction
    side_effects: []
  - method: GET
    path: "/park-ops/attractions"
    description: "Paginated attraction list ordered by created_at ASC; the active_template_id filter is the reverse-enumeration channel for Attraction.active_template_id."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["park_area?", "operational_posture?", "model_code?", "manufacturer?", "active_template_id?", "limit?", "offset?"]
    output: Attraction[]
    side_effects: []
  - method: POST
    path: "/park-ops/attractions/{id}/cycles"
    description: "Log ride cycles completed on a service date. The only writer of Attraction.cumulative_cycles, and therefore the only way to drive a component across its NDT cycle interval."
    roles: [MaintenanceTechnician, RideOperator]
    code: 200
    input: [service_date, cycles_added]
    output: Attraction
    side_effects:
      - "adds cycles_added to Attraction.cumulative_cycles"
      - "re-derives ndt_status for every ComponentAsset of the attraction per calculations.component_ndt_due_status"
      - "recomputes Attraction.operational_posture; a SAFETY_CRITICAL component reaching ndt_status OVERDUE forces DOWN"
      - "refused with ERR_REGULATORY_HOLD_ACTIVE while Attraction.regulatory_hold == true (§1.4 priority 10)"
  - method: GET
    path: "/park-ops/attractions/{id}/capacity-impact"
    description: "Dual-variant capacity impact for an inclusive service-date window; both bounds default to the logical clock's UTC date. Computed read, persists nothing."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["window_start_date?", "window_end_date?"]
    output: { attraction_id: string, window_start_date: string, window_end_date: string, event_count: integer, settled_guest_slots_lost: number, provisional_guest_slots_lost: number, divergence_guest_slots: number }
    side_effects: ["evaluates calculations.downtime_capacity_loss in both variants over the same event set"]
  - method: GET
    path: "/park-ops/attractions/{id}/dispatch-readiness"
    description: "Dispatch readiness index for the attraction at the current logical clock. Computed read, persists nothing."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: { attraction_id: string, operational_posture: string, certified_operator_count: integer, mean_restraint_score: number, essential_fail_count: integer, dispatch_readiness_index: number }
    side_effects: ["evaluates calculations.dispatch_readiness_index"]

  # ---- ComponentAsset ----
  - method: POST
    path: "/park-ops/components"
    description: "Install a component on an attraction with its manufacturer nondestructive-testing intervals."
    roles: [ParkOpsAdmin]
    code: 201
    input: [attraction_id, name, component_type, criticality, ndt_interval_cycles, ndt_interval_days]
    output: ComponentAsset
    side_effects:
      - "last_ndt_at = the current logical clock instant, last_ndt_cycles = Attraction.cumulative_cycles as observed now"
      - "ndt_status = CURRENT, condition_flag = OK, last_ndt_method = null"
  - method: GET
    path: "/park-ops/components/{id}"
    description: "Read one component with ndt_status re-derived against the attraction's current cycle count and the logical clock."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: ComponentAsset
    side_effects: []
  - method: GET
    path: "/park-ops/components"
    description: "Paginated component list ordered by created_at ASC; the attraction_id filter is the reverse-enumeration channel for ComponentAsset.attraction_id."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "criticality?", "ndt_status?", "component_type?", "condition_flag?", "limit?", "offset?"]
    output: ComponentAsset[]
    side_effects: []
  - method: POST
    path: "/park-ops/components/{id}/ndt-records"
    description: "Record a nondestructive test on a component, resetting both NDT interval baselines at once."
    roles: [QualifiedInspector]
    code: 200
    input: [ndt_method, result]
    output: ComponentAsset
    side_effects:
      - "sets last_ndt_method = ndt_method, last_ndt_at = the current logical clock, last_ndt_cycles = Attraction.cumulative_cycles"
      - "ndt_status returns to CURRENT"
      - "condition_flag returns to OK when result == PASS and becomes FAILED when result == FAIL"
      - "recomputes Attraction.operational_posture"

  # ---- InspectionTemplate / ChecklistItem ----
  - method: POST
    path: "/park-ops/inspection-templates"
    description: "Open a DRAFT pre-opening checklist revision for an attraction."
    roles: [ParkOpsAdmin]
    code: 201
    input: [attraction_id, effective_from_date]
    output: InspectionTemplate
    side_effects:
      - "revision = (greatest existing revision for this attraction) + 1, or 1 when this is the first"
      - "status = DRAFT, item_count = 0, activated_at = null"
  - method: GET
    path: "/park-ops/inspection-templates/{id}"
    description: "Read one checklist template revision."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: InspectionTemplate
    side_effects: []
  - method: GET
    path: "/park-ops/inspection-templates"
    description: "Paginated template list ordered by attraction_id then revision ASC; the attraction_id filter is the reverse-enumeration channel for InspectionTemplate.attraction_id."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "status?", "limit?", "offset?"]
    output: InspectionTemplate[]
    side_effects: []
  - method: POST
    path: "/park-ops/inspection-templates/{id}/items"
    description: "Append a checklist line to a DRAFT template revision. A supplied component_id must name a component installed on the template's attraction."
    roles: [ParkOpsAdmin]
    code: 201
    input: [sequence_no, description, severity_class, "component_id?", "requires_photo?"]
    output: ChecklistItem
    side_effects:
      - "sets template_id from the path id and increments InspectionTemplate.item_count by 1"
      - "requires_photo defaults to false when omitted"
      - "refused with ERR_TEMPLATE_STATE_INVALID when the template is not DRAFT, and with ERR_COMPONENT_ATTRACTION_MISMATCH when component_id belongs to another attraction"
  - method: POST
    path: "/park-ops/inspection-templates/{id}/activate"
    description: "Activate a DRAFT revision, superseding whichever revision is currently ACTIVE for the attraction. Guarded by optimistic concurrency on the attraction's version (concurrency_rules[template-activate-stale-attraction])."
    roles: [ParkOpsAdmin]
    code: 200
    input: [expected_attraction_version]
    output: InspectionTemplate
    side_effects:
      - "status DRAFT -> ACTIVE and activated_at = the current logical clock"
      - "the attraction's prior ACTIVE template transitions ACTIVE -> SUPERSEDED"
      - "sets Attraction.active_template_id to this template's id and increments Attraction.version by 1"
      - "recomputes Attraction.operational_posture"
  - method: GET
    path: "/park-ops/checklist-items/{id}"
    description: "Read one checklist line definition. ChecklistItem is immutable (common_fields false): it carries no version and no update endpoint."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: ChecklistItem
    side_effects: []
  - method: GET
    path: "/park-ops/checklist-items"
    description: "Paginated checklist-line list ordered by sequence_no ASC; the template_id and component_id filters are the reverse-enumeration channels for both of ChecklistItem's foreign keys."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["template_id?", "component_id?", "severity_class?", "limit?", "offset?"]
    output: ChecklistItem[]
    side_effects: []

  # ---- DailyInspection / InspectionItemResult ----
  - method: POST
    path: "/park-ops/daily-inspections"
    description: "Open the pre-opening inspection for an attraction and service date. Pins the ACTIVE template revision and fans out one result row per checklist line."
    roles: [MaintenanceTechnician]
    code: 201
    input: [attraction_id, service_date]
    output: DailyInspection
    side_effects:
      - "pins template_id = Attraction.active_template_id and template_revision = that template's revision"
      - "creates one InspectionItemResult with outcome PENDING per ChecklistItem of the pinned template, copying severity_class onto each row"
      - "pending_item_count = the pinned template's item_count; blocking_item_count = 0; essential_fail_count = 0"
      - "opened_by_user_id = X-User-ID; recorded_by_user_ids = []"
      - "refused with ERR_NO_ACTIVE_TEMPLATE when active_template_id is null and with ERR_DUPLICATE_INSPECTION on a repeat (attraction_id, service_date)"
  - method: GET
    path: "/park-ops/daily-inspections/{id}"
    description: "Read one daily inspection with its three derived counters and its segregation-of-duties audit set."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: DailyInspection
    side_effects: []
  - method: GET
    path: "/park-ops/daily-inspections"
    description: "Paginated inspection list ordered by service_date ASC then created_at ASC; the attraction_id and template_id filters are the reverse-enumeration channels for both of DailyInspection's foreign keys."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "template_id?", "service_date?", "status?", "limit?", "offset?"]
    output: DailyInspection[]
    side_effects: []
  - method: POST
    path: "/park-ops/daily-inspections/{id}/submit"
    description: "Hand a fully recorded checklist to the qualified inspector."
    roles: [MaintenanceTechnician]
    code: 200
    input: []
    output: DailyInspection
    side_effects:
      - "status IN_PROGRESS -> PENDING_SIGN_OFF"
      - "refused with ERR_ITEM_RESULTS_PENDING while pending_item_count > 0"
  - method: POST
    path: "/park-ops/daily-inspections/{id}/sign-off"
    description: "Sign the attraction off for guest operations. Enforces the blocking-item gate, the safety-critical NDT gate, the regulatory-hold gate and segregation of duties, in that priority order."
    roles: [QualifiedInspector]
    code: 200
    input: []
    output: DailyInspection
    side_effects:
      - "status PENDING_SIGN_OFF -> SIGNED_OFF"
      - "sets signed_off_by_user_id = X-User-ID and signed_off_at = the current logical clock"
      - "sets Attraction.last_signed_off_service_date = this inspection's service_date"
      - "recomputes Attraction.operational_posture, which leaves CLOSED_PENDING_INSPECTION for OPEN when nothing else gates the attraction"
  - method: POST
    path: "/park-ops/daily-inspections/{id}/reject"
    description: "Send the checklist back to the technician for rework."
    roles: [QualifiedInspector]
    code: 200
    input: [rejection_reason]
    output: DailyInspection
    side_effects:
      - "status PENDING_SIGN_OFF -> REJECTED and rejection_reason stored"
      - "recomputes Attraction.operational_posture"
  - method: POST
    path: "/park-ops/daily-inspections/{id}/reopen"
    description: "Start a new rework round on a rejected checklist; the cycle-closing transition."
    roles: [MaintenanceTechnician]
    code: 200
    input: []
    output: DailyInspection
    side_effects:
      - "status REJECTED -> IN_PROGRESS and rework_round increments by 1"
      - "every InspectionItemResult of this inspection whose outcome == FAIL returns to PENDING with recorded_by_user_id and recorded_at cleared"
      - "recomputes pending_item_count, blocking_item_count and essential_fail_count"
      - "leaves recorded_by_user_ids untouched so the segregation-of-duties set survives rework"
  - method: GET
    path: "/park-ops/inspection-item-results/{id}"
    description: "Read one checklist result row with its snapshotted severity_class."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: InspectionItemResult
    side_effects: []
  - method: GET
    path: "/park-ops/inspection-item-results"
    description: "Paginated result list ordered by the sequence_no of the referenced checklist line; the inspection_id and checklist_item_id filters are the reverse-enumeration channels for both foreign keys and the only way to discover the ids of the cascade-created rows."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["inspection_id?", "checklist_item_id?", "outcome?", "severity_class?", "limit?", "offset?"]
    output: InspectionItemResult[]
    side_effects: []
  - method: POST
    path: "/park-ops/inspection-item-results/{id}/record"
    description: "Record a PASS, FAIL or NA outcome on one checklist line. A FAIL on a SAFETY_CRITICAL line starts the four-hop cascade that ends in an auto-opened downtime event; re-recording the last blocking line as PASS walks the cycle back."
    roles: [MaintenanceTechnician]
    code: 200
    input: [outcome, "note?"]
    output: InspectionItemResult
    side_effects:
      - "sets outcome, recorded_by_user_id = X-User-ID and recorded_at = the current logical clock"
      - "appends X-User-ID to DailyInspection.recorded_by_user_ids when not already present"
      - "recomputes the inspection's pending_item_count, blocking_item_count and essential_fail_count"
      - "hop 1: a FAIL on a line whose ChecklistItem.component_id is non-null sets that ComponentAsset.condition_flag to SUSPECT"
      - "hops 2-4 for a SAFETY_CRITICAL FAIL: the inspection becomes BLOCKED, Attraction.operational_posture recomputes to DOWN, and the system opens a DowntimeEvent with cause_category INSPECTION_FAIL and auto_opened true unless one whose status IN {OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED} already exists"
      - "a PASS -> FAIL re-record is accepted while the inspection is IN_PROGRESS, BLOCKED or PENDING_SIGN_OFF; from PENDING_SIGN_OFF the status is retained and only blocking_item_count and essential_fail_count move, which is the sole route to ERR_SAFETY_CRITICAL_ITEM_FAILED at sign-off"
      - "refused with ERR_ESSENTIAL_FAIL_NOTE_REQUIRED when a FAIL on an ESSENTIAL line carries no note"

  # ---- MaintenanceBulletin / BulletinAction ----
  - method: POST
    path: "/park-ops/bulletins"
    description: "Publish a manufacturer bulletin or recall. No fleet actions exist until the bulletin is acknowledged; naming an earlier bulletin in supersedes_bulletin_id retires it and cancels its outstanding actions."
    roles: [ParkOpsAdmin]
    code: 201
    input: [bulletin_ref, manufacturer, model_code, severity, issued_date, compliance_deadline_date, "supersedes_bulletin_id?"]
    output: MaintenanceBulletin
    side_effects:
      - "status = ISSUED, action_total_count = 0, action_verified_count = 0"
      - "when supersedes_bulletin_id is supplied, that bulletin transitions to SUPERSEDED and every BulletinAction of it whose status IN {PENDING, IN_WORK, DEFERRED} transitions to CANCELLED"
      - "the superseded bulletin's action_total_count is recomputed with CANCELLED rows excluded"
  - method: GET
    path: "/park-ops/bulletins/{id}"
    description: "Read one bulletin with its compound status and both action counters."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: MaintenanceBulletin
    side_effects: []
  - method: GET
    path: "/park-ops/bulletins"
    description: "Paginated bulletin list ordered by issued_date ASC then created_at ASC; the supersedes_bulletin_id filter is the reverse-enumeration channel for the self-referential foreign key."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["manufacturer?", "model_code?", "severity?", "status?", "supersedes_bulletin_id?", "limit?", "offset?"]
    output: MaintenanceBulletin[]
    side_effects: []
  - method: GET
    path: "/park-ops/bulletins/{id}/risk"
    description: "Dual-variant fleet risk score for a bulletin at the current logical clock. Computed read, persists nothing."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: { bulletin_id: string, evaluated_action_count: integer, deferred_action_count: integer, escalation_factor: number, fleet_aggregate_score: number, per_unit_max_score: number, divergence: number }
    side_effects: ["evaluates calculations.bulletin_fleet_risk_score in both variants over the same action set"]
  - method: POST
    path: "/park-ops/bulletins/{id}/acknowledge"
    description: "Acknowledge the bulletin and fan out one action per matching fleet unit. Matching is on manufacturer AND model_code."
    roles: [MaintenanceManager]
    code: 200
    input: []
    output: MaintenanceBulletin
    side_effects:
      - "status ISSUED -> ACKNOWLEDGED, acknowledged_at = the current logical clock, acknowledged_by_user_id = X-User-ID"
      - "creates one BulletinAction with status PENDING for every Attraction whose manufacturer and model_code both match, in Attraction.created_at ASC order"
      - "action_total_count = the number of created actions; action_verified_count = 0"
  - method: GET
    path: "/park-ops/bulletin-actions/{id}"
    description: "Read one per-attraction fleet action."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: BulletinAction
    side_effects: []
  - method: GET
    path: "/park-ops/bulletin-actions"
    description: "Paginated fleet-action list ordered by created_at ASC; the bulletin_id and attraction_id filters are the reverse-enumeration channels for both foreign keys and the only way to discover the ids of the fan-out rows."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["bulletin_id?", "attraction_id?", "status?", "limit?", "offset?"]
    output: BulletinAction[]
    side_effects: []
  - method: POST
    path: "/park-ops/bulletin-actions/{id}/start"
    description: "Begin the corrective work on one fleet unit."
    roles: [MaintenanceTechnician]
    code: 200
    input: []
    output: BulletinAction
    side_effects:
      - "status PENDING -> IN_WORK"
      - "refused with ERR_ACTION_STATE_INVALID unless the parent bulletin is ACKNOWLEDGED and the action is PENDING"
  - method: POST
    path: "/park-ops/bulletin-actions/{id}/verify"
    description: "Verify and close out the corrective work on one fleet unit; bubbles the parent bulletin to COMPLETED once every non-CANCELLED sibling is VERIFIED."
    roles: [QualifiedInspector]
    code: 200
    input: []
    output: BulletinAction
    side_effects:
      - "status IN_WORK -> VERIFIED, verified_by_user_id = X-User-ID, verified_at = the current logical clock"
      - "increments MaintenanceBulletin.action_verified_count by 1"
      - "when action_verified_count == action_total_count the parent bulletin transitions ACKNOWLEDGED -> COMPLETED"
      - "refused with ERR_PART_NOT_RECEIVED while required_part_received == false"
  - method: POST
    path: "/park-ops/bulletin-actions/{id}/defer"
    description: "Defer a non-recall fleet action with a documented reason and a date no later than the bulletin's compliance deadline."
    roles: [MaintenanceManager]
    code: 200
    input: [deferral_reason, deferred_until_date]
    output: BulletinAction
    side_effects:
      - "status PENDING -> DEFERRED, deferral_reason and deferred_until_date stored"
      - "raises the bulletin's FLEET_AGGREGATE risk through the deferral escalation factor while leaving PER_UNIT_MAX unescalated"
      - "refused with ERR_RECALL_NOT_DEFERRABLE when the parent bulletin's severity is RECALL"

  # ---- DowntimeEvent ----
  - method: POST
    path: "/park-ops/downtime-events"
    description: "Open a downtime event against an attraction. service_date is pinned from the UTC calendar date of started_at and becomes the bucketing key for capacity impact."
    roles: [MaintenanceTechnician]
    code: 201
    input: [attraction_id, started_at, cause_category]
    output: DowntimeEvent
    side_effects:
      - "status = OPEN, service_date = UTC calendar date of started_at, auto_opened = false"
      - "duration_minutes, peak_minutes, off_peak_minutes and settled_guest_slots_lost stay null until resolution"
      - "recomputes Attraction.operational_posture to DOWN"
      - "refused with ERR_DOWNTIME_ALREADY_OPEN when the attraction already holds an event in OPEN, DIAGNOSED, AWAITING_PARTS or RESOLVED"
  - method: GET
    path: "/park-ops/downtime-events/{id}"
    description: "Read one downtime event with its frozen minute and capacity fields."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: DowntimeEvent
    side_effects: []
  - method: GET
    path: "/park-ops/downtime-events"
    description: "Paginated downtime list ordered by service_date ASC then started_at ASC; the attraction_id and failed_component_id filters are the reverse-enumeration channels for both foreign keys and the only way to discover the id of a cascade-opened event."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "failed_component_id?", "status?", "service_date?", "cause_category?", "auto_opened?", "limit?", "offset?"]
    output: DowntimeEvent[]
    side_effects: []
  - method: POST
    path: "/park-ops/downtime-events/{id}/diagnose"
    description: "Attach the root cause analysis and, optionally, the component that failed."
    roles: [MaintenanceTechnician]
    code: 200
    input: [root_cause_code, "failed_component_id?"]
    output: DowntimeEvent
    side_effects:
      - "status OPEN -> DIAGNOSED, root_cause_code and failed_component_id stored"
      - "a supplied failed_component_id sets that ComponentAsset.condition_flag to FAILED"
      - "refused with ERR_COMPONENT_ATTRACTION_MISMATCH when the component is installed on another attraction"
  - method: POST
    path: "/park-ops/downtime-events/{id}/resolve"
    description: "Close out the repair. Freezes the minute geometry and the SETTLED per-event capacity loss; the event must have returned from AWAITING_PARTS to DIAGNOSED first."
    roles: [MaintenanceTechnician]
    code: 200
    input: [ended_at]
    output: DowntimeEvent
    side_effects:
      - "status DIAGNOSED -> RESOLVED, ended_at stored"
      - "computes duration_minutes, peak_minutes, off_peak_minutes and settled_guest_slots_lost per calculations.downtime_capacity_loss"
      - "Attraction.ytd_downtime_minutes is NOT touched yet — the ledger moves only on close"
      - "refused with ERR_DOWNTIME_SPANS_SERVICE_DATES when the UTC date of ended_at differs from service_date"
  - method: POST
    path: "/park-ops/downtime-events/{id}/close"
    description: "Sign the resolved event off for reporting; the forward leg of the downtime-minutes ledger."
    roles: [MaintenanceManager]
    code: 200
    input: []
    output: DowntimeEvent
    side_effects:
      - "status RESOLVED -> CLOSED"
      - "adds duration_minutes to Attraction.ytd_downtime_minutes"
      - "recomputes Attraction.operational_posture, which leaves DOWN when nothing else gates the attraction"
  - method: POST
    path: "/park-ops/downtime-events/{id}/void"
    description: "Void a closed event that was logged in error; the compensating leg that must restore Attraction.ytd_downtime_minutes to its exact pre-close value."
    roles: [MaintenanceManager]
    code: 200
    input: [void_reason]
    output: DowntimeEvent
    side_effects:
      - "status CLOSED -> VOIDED, void_reason stored"
      - "subtracts duration_minutes from Attraction.ytd_downtime_minutes"
      - "the event leaves the capacity-impact input set for both variants"
      - "recomputes Attraction.operational_posture"

  # ---- PartRequisition ----
  - method: POST
    path: "/park-ops/part-requisitions"
    description: "Raise a parts requisition, optionally linked to exactly one of a downtime event or a fleet action (polymorphic optional parentage). Nothing is committed against the budget while REQUESTED."
    roles: [MaintenanceTechnician]
    code: 201
    input: [attraction_id, part_number, quantity, unit_cost_cents, needed_by_date, "downtime_event_id?", "bulletin_action_id?"]
    output: PartRequisition
    side_effects:
      - "status = REQUESTED, total_cost_cents = quantity * unit_cost_cents"
      - "a supplied downtime_event_id or bulletin_action_id must belong to the same attraction_id"
      - "refused with ERR_INVALID_REQUEST when both parent links are supplied"
  - method: GET
    path: "/park-ops/part-requisitions/{id}"
    description: "Read one parts requisition."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: PartRequisition
    side_effects: []
  - method: GET
    path: "/park-ops/part-requisitions"
    description: "Paginated requisition list ordered by created_at ASC; the attraction_id, downtime_event_id and bulletin_action_id filters are the reverse-enumeration channels for all three foreign keys."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "downtime_event_id?", "bulletin_action_id?", "status?", "limit?", "offset?"]
    output: PartRequisition[]
    side_effects: []
  - method: POST
    path: "/park-ops/part-requisitions/{id}/reserve"
    description: "Commit budget and reserve the part from stores; the forward leg of the parts-budget ledger."
    roles: [MaintenanceManager]
    code: 200
    input: []
    output: PartRequisition
    side_effects:
      - "status REQUESTED -> RESERVED"
      - "adds total_cost_cents to Attraction.parts_budget_committed_cents"
      - "refused with ERR_PARTS_BUDGET_EXCEEDED when the commitment would exceed Attraction.parts_budget_cents (equality is permitted)"
  - method: POST
    path: "/park-ops/part-requisitions/{id}/backorder"
    description: "Record that the part is unavailable, commit the budget against the vendor promise date, and park any linked downtime event in AWAITING_PARTS."
    roles: [MaintenanceManager]
    code: 200
    input: [expected_availability_date]
    output: PartRequisition
    side_effects:
      - "status REQUESTED -> BACKORDERED, expected_availability_date stored"
      - "adds total_cost_cents to Attraction.parts_budget_committed_cents"
      - "a linked DowntimeEvent whose status == DIAGNOSED transitions DIAGNOSED -> AWAITING_PARTS"
      - "refused with ERR_PARTS_BUDGET_EXCEEDED under the same ceiling as reserve"
  - method: POST
    path: "/park-ops/part-requisitions/{id}/receive"
    description: "Receive the part into the shop. Committed budget is unchanged because RECEIVED stays inside the committed set."
    roles: [MaintenanceTechnician]
    code: 200
    input: []
    output: PartRequisition
    side_effects:
      - "status RESERVED or BACKORDERED -> RECEIVED"
      - "a linked BulletinAction has required_part_received set to true"
      - "a linked DowntimeEvent whose status == AWAITING_PARTS transitions AWAITING_PARTS -> DIAGNOSED"
  - method: POST
    path: "/park-ops/part-requisitions/{id}/cancel"
    description: "Cancel a requisition; the compensating leg that releases exactly what was committed and nothing more."
    roles: [MaintenanceManager]
    code: 200
    input: [cancel_reason]
    output: PartRequisition
    side_effects:
      - "status REQUESTED, RESERVED or BACKORDERED -> CANCELLED, cancel_reason stored"
      - "subtracts total_cost_cents from Attraction.parts_budget_committed_cents only when the prior status was RESERVED or BACKORDERED; a REQUESTED cancel changes no ledger"
      - "cancelling a BACKORDERED row returns a linked AWAITING_PARTS downtime event to DIAGNOSED"

  # ---- OperatorCertification ----
  - method: POST
    path: "/park-ops/operator-certifications"
    description: "Certify a ride operator on one attraction for the half-open validity interval [effective_from, expires_at). The derived status follows calculations.certification_status_derivation, so a future effective_from or a failing score yields TRAINEE rather than CERTIFIED."
    roles: [MaintenanceManager]
    code: 201
    input: [attraction_id, operator_user_id, effective_from, expires_at, restraint_verification_score, dispatch_procedure_score]
    output: OperatorCertification
    side_effects:
      - "status derived at creation; a CERTIFIED row increments Attraction.certified_operator_count"
      - "refused with ERR_CERTIFICATION_WINDOW_OVERLAP when the interval intersects an existing row for the same (attraction_id, operator_user_id) for a positive duration; exact adjacency is accepted"
  - method: GET
    path: "/park-ops/operator-certifications/{id}"
    description: "Read one certification with status re-derived against the logical clock."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: OperatorCertification
    side_effects: []
  - method: GET
    path: "/park-ops/operator-certifications"
    description: "Paginated certification list ordered by effective_from ASC; the attraction_id filter is the reverse-enumeration channel for OperatorCertification.attraction_id."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "operator_user_id?", "status?", "limit?", "offset?"]
    output: OperatorCertification[]
    side_effects: []
  - method: POST
    path: "/park-ops/operator-certifications/{id}/suspend"
    description: "Suspend a certification following a safety finding. Only a row whose derived status is CERTIFIED may be suspended."
    roles: [SafetyOfficer]
    code: 200
    input: [suspension_reason]
    output: OperatorCertification
    side_effects:
      - "derived status CERTIFIED -> SUSPENDED, suspended_at = the current logical clock, suspension_reason stored"
      - "recomputes Attraction.certified_operator_count downward"
      - "refused with ERR_CERTIFICATION_STATE_INVALID when the derived status is TRAINEE, SUSPENDED or EXPIRED"

  # ---- IncidentReport ----
  - method: POST
    path: "/park-ops/incidents"
    description: "File a guest incident or injury report. REGULATOR_NOTIFICATION_HOURS = 24: an incident whose injury_severity is SERIOUS or FATAL opens directly in RIDE_HELD with regulator_notification_due_at = occurred_at + 24 hours and runs the full hold cascade, while NONE and MINOR open in REPORTED with regulator_notification_due_at null and no hold."
    roles: [SafetyOfficer]
    code: 201
    input: [attraction_id, occurred_at, injury_severity, guest_count_affected, narrative]
    output: IncidentReport
    side_effects:
      - "SERIOUS or FATAL: status = RIDE_HELD, regulator_notification_due_at = occurred_at + 24 hours, Attraction.regulatory_hold = true, posture recomputes to HOLD, every CERTIFIED OperatorCertification of the attraction becomes SUSPENDED with suspension_reason RIDE_HOLD, suspended_certification_count records how many, and Attraction.certified_operator_count is recomputed downward"
      - "NONE or MINOR: status = REPORTED, regulator_notification_due_at = null, no cascade runs"
      - "notified_late = false, suspended_certification_count = 0 unless the cascade ran"
  - method: GET
    path: "/park-ops/incidents/{id}"
    description: "Read one incident report with both fork-branch bookkeeping sets."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/park-ops/incidents"
    description: "Paginated incident list ordered by occurred_at ASC; the attraction_id filter is the reverse-enumeration channel for IncidentReport.attraction_id."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "status?", "injury_severity?", "notified_late?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: POST
    path: "/park-ops/incidents/{id}/hold-ride"
    description: "Place the regulatory ride hold on an incident that opened in REPORTED; hop 1 of the four-hop hold cascade."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "status REPORTED -> RIDE_HELD"
      - "hop 1: Attraction.regulatory_hold becomes true"
      - "hop 2: Attraction.operational_posture recomputes to HOLD"
      - "hop 3: every OperatorCertification of the attraction whose derived status == CERTIFIED becomes SUSPENDED with suspension_reason RIDE_HOLD; suspended_certification_count records the count"
      - "hop 4: Attraction.certified_operator_count is recomputed downward"
  - method: POST
    path: "/park-ops/incidents/{id}/investigate"
    description: "Open the investigation; the fork point from which the regulator branch and the internal branch diverge."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "status RIDE_HELD -> UNDER_INVESTIGATION, investigator_user_id = X-User-ID"
      - "Attraction.regulatory_hold stays true"
  - method: POST
    path: "/park-ops/incidents/{id}/notify-regulator"
    description: "Take BRANCH A by filing the statutory notification. Only meaningful for SERIOUS or FATAL incidents."
    roles: [SafetyOfficer]
    code: 200
    input: [regulator_case_ref]
    output: IncidentReport
    side_effects:
      - "status UNDER_INVESTIGATION -> REGULATOR_NOTIFIED, regulator_case_ref and notified_at stored"
      - "notified_late = true when notified_at is strictly after regulator_notification_due_at"
      - "clearance from this branch additionally requires regulator_clearance_ref"
      - "refused with ERR_NOTIFICATION_NOT_REQUIRED when injury_severity is NONE or MINOR"
  - method: POST
    path: "/park-ops/incidents/{id}/close-internal"
    description: "Take BRANCH B by closing the internal review without a regulator filing."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "status UNDER_INVESTIGATION -> INTERNAL_REVIEW_CLOSED"
      - "regulator_case_ref, notified_at stay null and notified_late stays false"
      - "clearance from this branch requires no regulator_clearance_ref"
  - method: POST
    path: "/park-ops/incidents/{id}/clear"
    description: "Release the ride hold; the join point of both branches. A BRANCH A incident demands a non-empty regulator_clearance_ref, a BRANCH B incident ignores it."
    roles: [SafetyOfficer]
    code: 200
    input: ["regulator_clearance_ref?"]
    output: IncidentReport
    side_effects:
      - "status REGULATOR_NOTIFIED or INTERNAL_REVIEW_CLOSED -> CLEARED_TO_OPERATE, cleared_at = the current logical clock"
      - "Attraction.regulatory_hold becomes false when no other incident of the attraction remains in RIDE_HELD, UNDER_INVESTIGATION or REGULATOR_NOTIFIED"
      - "every OperatorCertification this incident suspended returns SUSPENDED -> CERTIFIED and Attraction.certified_operator_count is recomputed upward"
      - "recomputes Attraction.operational_posture"
      - "refused with ERR_REGULATOR_CLEARANCE_REQUIRED when the incident reached REGULATOR_NOTIFIED and no clearance reference is supplied"

  # ---- ShopBay / OverhaulWorkOrder ----
  - method: POST
    path: "/park-ops/shop-bays"
    description: "Open an off-season overhaul bay with a fixed number of concurrent slots."
    roles: [ParkOpsAdmin]
    code: 201
    input: [name, concurrent_slot_capacity]
    output: ShopBay
    side_effects: ["version = 1, booked_order_count = 0"]
  - method: GET
    path: "/park-ops/shop-bays/{id}"
    description: "Read one shop bay; the source of the version value a planner must echo back as expected_shop_bay_version."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: ShopBay
    side_effects: []
  - method: GET
    path: "/park-ops/shop-bays"
    description: "Paginated shop-bay list ordered by created_at ASC."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ShopBay[]
    side_effects: []
  - method: POST
    path: "/park-ops/overhaul-work-orders"
    description: "Schedule an off-season teardown, inspection and rebuild for one major component in a shop bay. Guarded by optimistic concurrency on the bay's version (concurrency_rules[overhaul-create-stale-shop-bay]) and by the buffered bay-capacity check."
    roles: [MaintenanceManager]
    code: 201
    input: [attraction_id, component_id, shop_bay_id, expected_shop_bay_version, window_start_date, window_end_date, parts_subtotal_cents, labor_hours, "expedite_requested?"]
    output: OverhaulWorkOrder
    side_effects:
      - "status = SCHEDULED"
      - "computes off_season, base_total_cents, off_season_discount_cents, discounted_base_cents, expedite_pct, expedite_fee_cents and estimated_total_cents per calculations.overhaul_cost_estimate"
      - "increments ShopBay.booked_order_count by 1 and ShopBay.version by 1"
      - "refused with ERR_COMPONENT_ATTRACTION_MISMATCH, ERR_BAY_CAPACITY_CONFLICT or ERR_STALE_SHOP_BAY_VERSION per the §1.4 priority ladder"
  - method: GET
    path: "/park-ops/overhaul-work-orders/{id}"
    description: "Read one overhaul work order with its full cost breakdown."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: []
    output: OverhaulWorkOrder
    side_effects: []
  - method: GET
    path: "/park-ops/overhaul-work-orders"
    description: "Paginated work-order list ordered by window_start_date ASC; the attraction_id, component_id and shop_bay_id filters are the reverse-enumeration channels for all three foreign keys."
    roles: [ParkOpsAdmin, MaintenanceManager, MaintenanceTechnician, QualifiedInspector, SafetyOfficer, RideOperator]
    code: 200
    input: ["attraction_id?", "component_id?", "shop_bay_id?", "status?", "off_season?", "limit?", "offset?"]
    output: OverhaulWorkOrder[]
    side_effects: []
  - method: POST
    path: "/park-ops/overhaul-work-orders/{id}/advance"
    description: "Advance the work order exactly one step along SCHEDULED -> TEARDOWN -> INSPECTION -> REBUILD -> RECOMMISSIONED. target_phase names the status being entered and must be the immediate successor of the current one."
    roles: [MaintenanceManager]
    code: 200
    input: [target_phase]
    output: OverhaulWorkOrder
    side_effects:
      - "status advances one step; the SCHEDULED -> TEARDOWN step recomputes Attraction.operational_posture to OVERHAUL, the highest-precedence posture"
      - "the RECOMMISSIONED step sets recommissioned_at, resets the component's last_ndt_at to the current logical clock and last_ndt_cycles to Attraction.cumulative_cycles, returns its ndt_status to CURRENT and condition_flag to OK, decrements ShopBay.booked_order_count, and recomputes the attraction's posture out of OVERHAUL"
      - "refused with ERR_WORK_ORDER_STATE_INVALID when target_phase is not the immediate successor of the current status"

  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical current UTC instant. The logical clock is the only source of 'now' for every derived field in this service — NDT day intervals, certification validity, regulator notification deadlines, capacity windows and posture derivation. Its value at process start is exactly 2026-08-01T00:00:00Z and it never falls back to wall-clock time."
    roles: [ParkOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "subsequent derivations of ComponentAsset.ndt_status, OperatorCertification.status, IncidentReport.notified_late and Attraction.operational_posture read the new instant"
      - "persists no business entity and moves no state machine on its own"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (http_status values match §1.4 exactly)
# ---------------------------------------------------------------------------

errors:
  # -- authentication / authorisation --
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-Role or X-User-ID is absent or blank, or X-User-Role is not one of the six roles declared in §1.7."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    when: "the caller's role is recognised but does not appear in the target endpoint's roles list in §1.5."

  # -- request shape --
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "a required input field is absent or null, an enum value is outside its declared set, an integer falls outside its declared range, an ISO date or ISO-8601-UTC instant is malformed, ended_at <= started_at, expires_at <= effective_from, window_end_date < window_start_date, compliance_deadline_date < issued_date, bulletin_ref is not unique, sequence_no repeats within its template, supersedes_bulletin_id names the row being created, or both downtime_event_id and bulletin_action_id are supplied on one requisition."

  # -- existence: path parameters and body foreign keys --
  - error_id: ERR_ATTRACTION_NOT_FOUND
    http_status: 404
    when: "the attraction named by the path {id} or by a body attraction_id does not exist."
  - error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    when: "the component named by the path {id} or by a body component_id / failed_component_id does not exist."
  - error_id: ERR_TEMPLATE_NOT_FOUND
    http_status: 404
    when: "the inspection template named by the path {id} does not exist."
  - error_id: ERR_CHECKLIST_ITEM_NOT_FOUND
    http_status: 404
    when: "the checklist item named by the path {id} does not exist."
  - error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    when: "the daily inspection named by the path {id} does not exist."
  - error_id: ERR_ITEM_RESULT_NOT_FOUND
    http_status: 404
    when: "the inspection item result named by the path {id} does not exist."
  - error_id: ERR_BULLETIN_NOT_FOUND
    http_status: 404
    when: "the bulletin named by the path {id} or by a body supersedes_bulletin_id does not exist."
  - error_id: ERR_BULLETIN_ACTION_NOT_FOUND
    http_status: 404
    when: "the fleet action named by the path {id} or by a body bulletin_action_id does not exist."
  - error_id: ERR_DOWNTIME_EVENT_NOT_FOUND
    http_status: 404
    when: "the downtime event named by the path {id} or by a body downtime_event_id does not exist."
  - error_id: ERR_REQUISITION_NOT_FOUND
    http_status: 404
    when: "the part requisition named by the path {id} does not exist."
  - error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    when: "the operator certification named by the path {id} does not exist."
  - error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    when: "the incident report named by the path {id} does not exist."
  - error_id: ERR_SHOP_BAY_NOT_FOUND
    http_status: 404
    when: "the shop bay named by the path {id} or by a body shop_bay_id does not exist."
  - error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    when: "the overhaul work order named by the path {id} does not exist."

  # -- optimistic concurrency (§1.2.1) --
  - error_id: ERR_STALE_ATTRACTION_VERSION
    http_status: 412
    when: "expected_attraction_version on POST /park-ops/inspection-templates/{id}/activate does not equal the attraction's current version."
  - error_id: ERR_STALE_SHOP_BAY_VERSION
    http_status: 412
    when: "expected_shop_bay_version on POST /park-ops/overhaul-work-orders does not equal the shop bay's current version."

  # -- per-entity state guards --
  - error_id: ERR_TEMPLATE_STATE_INVALID
    http_status: 409
    when: "an item is appended to a template that is not DRAFT, or activation is requested on a template that is ACTIVE or SUPERSEDED."
  - error_id: ERR_INSPECTION_STATE_INVALID
    http_status: 409
    when: "a daily-inspection transition is requested from a state that does not declare it: submitting anything other than IN_PROGRESS, signing off or rejecting anything other than PENDING_SIGN_OFF, reopening anything other than REJECTED, or recording a result row while the parent inspection is PENDING_SIGN_OFF, REJECTED or SIGNED_OFF."
  - error_id: ERR_BULLETIN_STATE_INVALID
    http_status: 409
    when: "acknowledgement is requested on a bulletin whose status is ACKNOWLEDGED, COMPLETED or SUPERSEDED."
  - error_id: ERR_ACTION_STATE_INVALID
    http_status: 409
    when: "a fleet-action transition is requested from a state that does not declare it: starting an action that is not PENDING or whose parent bulletin is not ACKNOWLEDGED, verifying an action that is not IN_WORK, or deferring an action that is IN_WORK, VERIFIED, DEFERRED or CANCELLED."
  - error_id: ERR_DOWNTIME_STATE_INVALID
    http_status: 409
    when: "a downtime transition is requested from a state that does not declare it: diagnosing anything other than OPEN, resolving anything other than DIAGNOSED (an AWAITING_PARTS event must return to DIAGNOSED first), closing anything other than RESOLVED, or voiding anything other than CLOSED."
  - error_id: ERR_REQUISITION_STATE_INVALID
    http_status: 409
    when: "a requisition transition is requested from a state that does not declare it: reserving or backordering anything other than REQUESTED, receiving anything other than RESERVED or BACKORDERED, or cancelling a RECEIVED or CANCELLED row."
  - error_id: ERR_CERTIFICATION_STATE_INVALID
    http_status: 409
    when: "suspension is requested on a certification whose derived status is TRAINEE, SUSPENDED or EXPIRED rather than CERTIFIED."
  - error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    when: "an incident transition is requested from a state that does not declare it: holding an incident that is not REPORTED, investigating one that is not RIDE_HELD, notifying or closing internally from anything other than UNDER_INVESTIGATION, or clearing one that is not REGULATOR_NOTIFIED or INTERNAL_REVIEW_CLOSED."
  - error_id: ERR_WORK_ORDER_STATE_INVALID
    http_status: 409
    when: "target_phase is not the immediate successor of the work order's current status along SCHEDULED -> TEARDOWN -> INSPECTION -> REBUILD -> RECOMMISSIONED, including any advance out of RECOMMISSIONED."

  # -- domain rules, in §1.4 priority order --
  - error_id: ERR_SAFETY_CRITICAL_ITEM_FAILED
    http_status: 409
    when: "sign-off is attempted while the inspection's blocking_item_count is greater than zero."
  - error_id: ERR_NDT_OVERDUE_SAFETY_CRITICAL
    http_status: 409
    when: "sign-off is attempted while any ComponentAsset of the attraction with criticality SAFETY_CRITICAL derives ndt_status OVERDUE."
  - error_id: ERR_REGULATORY_HOLD_ACTIVE
    http_status: 409
    when: "sign-off or a cycle log is attempted while Attraction.regulatory_hold is true."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "the signing X-User-ID already appears in DailyInspection.recorded_by_user_ids."
  - error_id: ERR_COMPONENT_ATTRACTION_MISMATCH
    http_status: 422
    when: "a supplied component_id or failed_component_id names a ComponentAsset installed on a different attraction than the one the request targets."
  - error_id: ERR_NO_ACTIVE_TEMPLATE
    http_status: 409
    when: "a daily inspection is opened for an attraction whose active_template_id is null."
  - error_id: ERR_PART_NOT_RECEIVED
    http_status: 409
    when: "a fleet action is verified while its required_part_received is false."
  - error_id: ERR_NOTIFICATION_NOT_REQUIRED
    http_status: 422
    when: "the regulator is notified for an incident whose injury_severity is NONE or MINOR."
  - error_id: ERR_REGULATOR_CLEARANCE_REQUIRED
    http_status: 422
    when: "an incident that reached REGULATOR_NOTIFIED is cleared without a non-empty regulator_clearance_ref."
  - error_id: ERR_TEMPLATE_HAS_NO_ITEMS
    http_status: 422
    when: "activation is requested on a DRAFT template whose item_count is zero."
  - error_id: ERR_ITEM_RESULTS_PENDING
    http_status: 409
    when: "an inspection is submitted while its pending_item_count is greater than zero."
  - error_id: ERR_ESSENTIAL_FAIL_NOTE_REQUIRED
    http_status: 422
    when: "a FAIL outcome is recorded on a line whose severity_class is ESSENTIAL without a non-empty note."
  - error_id: ERR_DUPLICATE_INSPECTION
    http_status: 409
    when: "a daily inspection already exists for the same (attraction_id, service_date)."
  - error_id: ERR_DOWNTIME_ALREADY_OPEN
    http_status: 409
    when: "a downtime event is opened for an attraction that already holds one in OPEN, DIAGNOSED, AWAITING_PARTS or RESOLVED."
  - error_id: ERR_RECALL_NOT_DEFERRABLE
    http_status: 409
    when: "deferral is requested for a fleet action whose parent bulletin has severity RECALL."
  - error_id: ERR_DOWNTIME_SPANS_SERVICE_DATES
    http_status: 422
    when: "the UTC calendar date of ended_at differs from the event's pinned service_date."
  - error_id: ERR_BAY_CAPACITY_CONFLICT
    http_status: 409
    when: "the requested window, widened by CHANGEOVER_BUFFER_DAYS on both sides, contains a calendar day on which the bay's existing non-RECOMMISSIONED work orders already occupy every concurrent slot."
  - error_id: ERR_CERTIFICATION_WINDOW_OVERLAP
    http_status: 409
    when: "the requested half-open validity interval intersects an existing certification interval for the same (attraction_id, operator_user_id) for a positive duration; exact adjacency is not an overlap."
  - error_id: ERR_PARTS_BUDGET_EXCEEDED
    http_status: 402
    when: "committing a requisition would push Attraction.parts_budget_committed_cents strictly above Attraction.parts_budget_cents."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
#
# Every role is `opaque`: X-User-ID is a maintenance-department badge id, never
# the id of a persisted entity. The scaffold stores those badge ids on business
# rows (DailyInspection.opened_by_user_id / recorded_by_user_ids /
# signed_off_by_user_id, InspectionItemResult.recorded_by_user_id,
# BulletinAction.verified_by_user_id, MaintenanceBulletin.acknowledged_by_user_id,
# IncidentReport.investigator_user_id) purely so the segregation-of-duties check
# in §1.4 priority 11 can compare them; no rule ever requires X-User-ID to equal
# any entity's id. OperatorCertification.operator_user_id is likewise an opaque
# staff identifier supplied as input, not an authenticated caller.
# ---------------------------------------------------------------------------

roles:
  - name: ParkOpsAdmin
    description: "Configures the system of record: attractions, components, checklist template revisions and their activation, bulletin publication, shop bays, and the logical clock. Records no inspection outcomes and signs nothing off."
    identity: "opaque"
    exclusive_operations:
      - "POST /park-ops/attractions"
      - "POST /park-ops/components"
      - "POST /park-ops/inspection-templates"
      - "POST /park-ops/inspection-templates/{id}/items"
      - "POST /park-ops/inspection-templates/{id}/activate"
      - "POST /park-ops/bulletins"
      - "POST /park-ops/shop-bays"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint under /park-ops"
  - name: MaintenanceManager
    description: "Owns money, parts and scheduling: bulletin acknowledgement and deferral, requisition commitment, release and cancellation, downtime closure and voiding, operator certification issuance, and off-season overhaul scheduling and phase advancement."
    identity: "opaque"
    exclusive_operations:
      - "POST /park-ops/bulletins/{id}/acknowledge"
      - "POST /park-ops/bulletin-actions/{id}/defer"
      - "POST /park-ops/downtime-events/{id}/close"
      - "POST /park-ops/downtime-events/{id}/void"
      - "POST /park-ops/part-requisitions/{id}/reserve"
      - "POST /park-ops/part-requisitions/{id}/backorder"
      - "POST /park-ops/part-requisitions/{id}/cancel"
      - "POST /park-ops/operator-certifications"
      - "POST /park-ops/overhaul-work-orders"
      - "POST /park-ops/overhaul-work-orders/{id}/advance"
    shared_operations:
      - "every GET endpoint under /park-ops"
  - name: MaintenanceTechnician
    description: "Performs the work: opens, reworks and submits daily inspections, records checklist outcomes, opens, diagnoses and resolves downtime events, raises and receives part requisitions, and starts bulletin corrective work. Structurally barred from signing off any inspection whose results it recorded."
    identity: "opaque"
    exclusive_operations:
      - "POST /park-ops/daily-inspections"
      - "POST /park-ops/daily-inspections/{id}/submit"
      - "POST /park-ops/daily-inspections/{id}/reopen"
      - "POST /park-ops/inspection-item-results/{id}/record"
      - "POST /park-ops/downtime-events"
      - "POST /park-ops/downtime-events/{id}/diagnose"
      - "POST /park-ops/downtime-events/{id}/resolve"
      - "POST /park-ops/part-requisitions"
      - "POST /park-ops/part-requisitions/{id}/receive"
      - "POST /park-ops/bulletin-actions/{id}/start"
    shared_operations:
      - "POST /park-ops/attractions/{id}/cycles (shared with RideOperator)"
      - "every GET endpoint under /park-ops"
  - name: QualifiedInspector
    description: "Holds the statutory sign-off authority: signs off or rejects the pre-opening checklist, performs nondestructive testing, and verifies bulletin corrective work. Never records checklist outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /park-ops/daily-inspections/{id}/sign-off"
      - "POST /park-ops/daily-inspections/{id}/reject"
      - "POST /park-ops/components/{id}/ndt-records"
      - "POST /park-ops/bulletin-actions/{id}/verify"
    shared_operations:
      - "every GET endpoint under /park-ops"
  - name: SafetyOfficer
    description: "Owns incident handling and the regulatory interface: files incidents, places the ride hold, opens the investigation, files the regulator notification or closes the internal review, clears the hold, and suspends operator certifications."
    identity: "opaque"
    exclusive_operations:
      - "POST /park-ops/incidents"
      - "POST /park-ops/incidents/{id}/hold-ride"
      - "POST /park-ops/incidents/{id}/investigate"
      - "POST /park-ops/incidents/{id}/notify-regulator"
      - "POST /park-ops/incidents/{id}/close-internal"
      - "POST /park-ops/incidents/{id}/clear"
      - "POST /park-ops/operator-certifications/{id}/suspend"
    shared_operations:
      - "every GET endpoint under /park-ops"
  - name: RideOperator
    description: "Dispatches guests and logs ride cycles. Read-only against every maintenance record; may not open, record, verify or sign off anything."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /park-ops/attractions/{id}/cycles (shared with MaintenanceTechnician)"
      - "every GET endpoint under /park-ops"
