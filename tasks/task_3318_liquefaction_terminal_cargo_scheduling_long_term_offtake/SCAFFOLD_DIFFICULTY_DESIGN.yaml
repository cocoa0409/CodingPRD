            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/cargo-slots/${slot1}/vessel-nominations", payload: { vessel_name: "Gas Alpha", imo_number: "9111001", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot1_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc1: $.data.id } }
            - { call: "POST /api/vessel-calls/${vc1}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-12T00:00:00Z", window_end: "2027-01-14T00:00:00Z" }, as: MarineScheduler }
            - { call: "POST /api/cargo-slots/${slot2}/vessel-nominations", payload: { vessel_name: "Oversize Carrier", imo_number: "9111002", vessel_loa_m: 330, vessel_dwt_t: 100000, demurrage_rate_usd_per_day: 90000, expected_cargo_slot_version: "${slot2_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc2: $.data.id } }
          trigger:
            - { call: "POST /api/vessel-calls/${vc2}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-13T00:00:00Z", window_end: "2027-01-15T00:00:00Z" }, as: MarineScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VESSEL_BERTH_INCOMPATIBLE (safety priority 5 beats temporal priority 6)"
            - "VesselCall.${vc2}.status == NOMINATED"

  # =========================================================================
  # Rule 6 — boundary_precision_check (laytime-hours equality; notice-days threshold)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: demurrage_zero_when_used_equals_allowed
        grounds:
          - calculations.laytime_demurrage
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric: laytime hours. Demurrage accrues only when used > allowed
          (strictly greater); at used == allowed == 19.00h exactly, demurrage is
          0.00 — not one cent.
        test_recipe:
          setup:
            - "Full marine chain; slot 3,600,000 mmbtu (allowed 19h); NOR 2027-01-12T00:00Z; berthed 2027-01-12T05:00Z (laytime start 05:00); departed 2027-01-13T00:00:00Z (elapsed exactly 19.00h); no exclusions"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Kappa Natural Gas", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
