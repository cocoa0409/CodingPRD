            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_alloc_t2: $.data.allocated_cents }
            - call: "POST /presentations/${p1_id}/discrepancies"
              payload: { code: "GOODS_DESCRIPTION_MISMATCH", severity: "MATERIAL", description: "Invoice reads spruce boards, credit calls for pine boards" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p1_id}/conclude-examination"
              payload: { conclusion_note: "P1 discrepant" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p1_id}/refuse"
              payload: { disposal_instruction: "HOLD_AT_DISPOSAL", refusal_note: "UCP 600 art.16 refusal for P1" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "GET /credits/${credit_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { avail_t3: $.data.available_cents }
            - call: "POST /presentations/${p2_id}/discrepancies"
              payload: { code: "GOODS_DESCRIPTION_MISMATCH", severity: "MATERIAL", description: "Invoice reads spruce boards, credit calls for pine boards" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p2_id}/conclude-examination"
              payload: { conclusion_note: "P2 discrepant" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations/${p2_id}/refuse"
              payload: { disposal_instruction: "RETURN_TO_PRESENTER", refusal_note: "UCP 600 art.16 refusal for P2" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "GET /credits/${credit_id}"
              payload: {}
