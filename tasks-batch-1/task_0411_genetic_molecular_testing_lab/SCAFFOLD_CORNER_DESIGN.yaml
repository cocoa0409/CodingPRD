  # SECTION 4 — VALIDATIONS (violation->error, satisfaction->pass, priority)
  # ===========================================================================
  - section: validations
    instances:

      - name: missing_user_context_returns_401
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_MISSING_OR_INVALID_USER_CONTEXT (401), ahead of any role/existence check."
        test_recipe:
          setup:
            - "Empty DB; a request sent with no auth headers."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "GET /lab/genes"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"
            - "response status code == 401"

      - name: unknown_role_returns_401
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "A request whose X-User-Role is a string outside the six known roles returns ERR_MISSING_OR_INVALID_USER_CONTEXT (401)."
        test_recipe:
          setup:
            - "Empty DB; request with an unknown role header."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "GET /lab/genes"
              payload: {}
              as: Janitor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"
            - "response status code == 401"

      - name: auth_beats_existence_unknown_role_on_missing_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "Hitting a path with a non-existent order id AND an unknown role returns the priority-1 ERR_MISSING_OR_INVALID_USER_CONTEXT (401), not the priority-3 404 — auth precedes existence."
        test_recipe:
          setup:
            - "Empty DB; unknown role, non-existent order id in path."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
