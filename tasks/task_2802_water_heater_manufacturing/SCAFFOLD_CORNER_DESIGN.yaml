      - name: verdict_guards_before_booking_a_result_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 19]
          - validations[priority 20]
          - validations[priority 40]
          - errors[ERR_SAMPLE_SIZE_INSUFFICIENT]
          - errors[ERR_INSUFFICIENT_TEST_SAMPLE]
          - errors[ERR_TEST_WINDOW_NOT_ELAPSED]
          - calculations.lot_holiday_density
        distinguishing_aspect: >
          Three independent gates all refuse to book a verdict from insufficient evidence, and each must be
          distinguishable: an undersized lining sample is ERR_SAMPLE_SIZE_INSUFFICIENT and NEVER a FAIL verdict
          (so no scrap is charged), a certification with only 2 PASSED UEF tests is ERR_INSUFFICIENT_TEST_SAMPLE
          even though those 2 tests are perfectly good, and a test whose window has not closed is
          ERR_TEST_WINDOW_NOT_ELAPSED rather than a silently early reading.
        test_recipe:
          setup:
            - "Model GX50-T has 2 PASSED UEF tests and one still-SCHEDULED FIRST_HOUR_RATING test."
            - "MIN_UEF_SAMPLE_TESTS is 3, and one PASSED test of each of the other two types is also required."
            - "Tank lot TL-001 has planned_quantity 120, so its required lining sample is max(3, ceil(6.0)) == 6."
            - "The logical clock is 2026-08-03T02:00:00Z, which is before the FIRST_HOUR_RATING window_end of 2026-08-04T10:00:00Z."
            - "Certification cert1 is in DRAFT against the model's current version."
