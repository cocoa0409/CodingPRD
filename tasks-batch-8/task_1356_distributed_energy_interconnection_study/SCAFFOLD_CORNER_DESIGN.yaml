            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { m1: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/cluster-groups/${cg_id}/studies"
              payload: { total_cost_cents: 1000000 }
              as: StudyEngineer
              captures: { s_id: $.data.id }
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p1_v1: $.data.version }
            - call: "POST /interconnection/projects/${p1_id}/agreements"
              payload: { target_cod: "2027-06-01T00:00:00Z", max_injection_mw: 10, curtailment_hours_cap: 0, expected_project_version: "${p1_v1}" }
              as: QueueAdministrator
              captures: { ag1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: QueueAdministrator
            - call: "POST /interconnection/agreements/${ag1_id}/execute"
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_expire: $.data.error_id }
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p1_v2: $.data.version }
            - call: "POST /interconnection/projects/${p1_id}/agreements"
              payload: { target_cod: "2028-06-01T00:00:00Z", max_injection_mw: 10, curtailment_hours_cap: 0, expected_project_version: "${p1_v2}" }
              as: QueueAdministrator
              captures: { ag2_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/agreements"
              payload: { target_cod: "2029-06-01T00:00:00Z", max_injection_mw: 10, curtailment_hours_cap: 0, expected_project_version: "${p1_v2}" }
              as: QueueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err_expire} == ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED (A1 -> EXPIRED, enabling re-issuance)"
            - "A2 issued successfully with the fresh version ${p1_v2} (${ag2_id} present, status ISSUED)"
            - "${err} == ERR_STALE_VERSION (HTTP 412): the second re-issuance carries the version captured before A2 superseded A1"

      - name: occ_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-reissue-stale-project]", "entities.Project"]
        distinguishing_aspect: "Project.version starts at 1 and increments by exactly 1 per mutation: creation v1, the deposit that flips SUBMITTED -> QUEUED v2."
        test_recipe:
          setup: ["Developer; FORMING cluster"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
