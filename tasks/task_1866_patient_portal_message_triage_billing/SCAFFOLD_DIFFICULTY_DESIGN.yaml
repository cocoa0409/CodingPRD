            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "MA", body: "ten minutes" }, as: Patient, as_user_id: "${pat_l}", captures: { ma: "$.data.id", ma_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${ma}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${ma_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
