  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: cumulative_drawn_pct_boundary_on_disburse
        metric: "Concession.cumulative_drawn_pct against CONSTRUCTION_START_PCT (0.30), compared AFTER rounding to 4 decimal places"
        endpoint: "POST /ppp/drawdown-milestones/{id}/disburse"
        grounds:
          - calculations.construction_trigger_and_seed
          - calculations.construction_trigger_and_seed.constants.CONSTRUCTION_START_PCT
          - state_machines.Concession.FINANCIAL_CLOSE_to_CONSTRUCTION
        distinguishing_aspect: |
          The comparison is `>=` against the 4-dp ROUNDED ratio, so the boundary is not the
          raw fraction. Concession A draws 120000000 of 400000000 -> exactly 0.3000 -> the
          transition FIRES (inclusive boundary) and a CONSTRUCTION_SEED ledger row appears.
          Concession B draws 119900000 -> raw 0.299750 -> rounds to 0.2998 -> does NOT fire.
          Both a strict `>` reading and a comparison against the unrounded ratio give the
          wrong answer for at least one of the two.
        test_recipe:
          setup:
            - "Two independent concessions, each at FINANCIAL_CLOSE with total_project_cost_cents 400000000, senior_debt_committed_cents 300000000, equity_committed_cents 100000000 and zero drawn."
            - "Concession A has an APPROVED milestone for 120000000; Concession B has an APPROVED milestone for 119900000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_a: $.data.id }
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Kestrel Highways Projectco", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_b: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_a}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_a: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_b}", project_name: "B12 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_b: $.data.id }
            - call: "POST /ppp/concessions/${csn_a}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_a_v: $.data.version }
            - call: "POST /ppp/concessions/${csn_b}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_b_v: $.data.version }
            - call: "POST /ppp/concessions/${csn_a}/drawdown-milestones"
              payload: { milestone_name: "M1 at the boundary", requested_amount_cents: 120000000, expected_concession_version: "${csn_a_v}" }
              as: Concessionaire
              as_user_id: "${cnr_a}"
              captures: { ma_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_b}/drawdown-milestones"
              payload: { milestone_name: "M1 just below the boundary", requested_amount_cents: 119900000, expected_concession_version: "${csn_b_v}" }
              as: Concessionaire
              as_user_id: "${cnr_b}"
              captures: { mb_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${ma_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${mb_id}/approve"
              payload: { certified_cost_cents: 119900000 }
              as: IndependentCertifier
          trigger:
            - call: "POST /ppp/drawdown-milestones/${ma_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /ppp/drawdown-milestones/${mb_id}/disburse"
              payload: {}
              as: LenderAgent
          assert:
            - "AT the boundary — Concession.${csn_a}.cumulative_drawn_pct == 0.3000 and status == CONSTRUCTION"
            - "AT the boundary — GET /ppp/reserve-transactions?concession_id=${csn_a} returns total_count 1 with reason 'CONSTRUCTION_SEED', amount_cents 8000000 and resulting_balance_cents 8000000; Concession.${csn_a}.lifecycle_reserve_balance_cents == 8000000"
            - "JUST BELOW — Concession.${csn_b}.cumulative_drawn_pct == 0.2998 (raw 0.299750 rounded half-up at 4 dp), NOT 0.2997 and NOT 0.3000"
            - "JUST BELOW — Concession.${csn_b}.status is still FINANCIAL_CLOSE"
            - "JUST BELOW — GET /ppp/reserve-transactions?concession_id=${csn_b} returns total_count 0 and Concession.${csn_b}.lifecycle_reserve_balance_cents == 0"
            - "both milestones are DISBURSED, so the difference is attributable to the threshold alone: DrawdownMilestone.${ma_id}.status == DISBURSED and DrawdownMilestone.${mb_id}.status == DISBURSED"
            - "Concession.${csn_b}.equity_drawn_cents == 100000000 and senior_debt_drawn_cents == 19900000"

      - name: self_report_variance_tolerance_boundary_on_verify
        metric: "PerformanceReport.variance_pct against SELF_REPORT_VARIANCE_TOLERANCE_PCT (0.05), a STRICT greater-than"
        endpoint: "POST /ppp/service-periods/{id}/verify"
        grounds:
          - calculations.self_report_variance
          - calculations.self_report_variance.constants.SELF_REPORT_VARIANCE_TOLERANCE_PCT
          - calculations.self_report_variance.constants.UNDERSTATEMENT_UPLIFT_PCT
          - calculations.deduction_points_from_counts
        distinguishing_aspect: |
          A different metric (a variance ratio, not a funding ratio) on a different endpoint.
          Both periods self-report 320 points. Period 1 verifies at 336 points -> variance
          exactly 0.0500, which is NOT strictly greater than the 0.05 tolerance, so NO
          understatement deduction is created. Period 2 verifies at 340 -> 0.0625 -> one
          SELF_REPORT_UNDERSTATEMENT event is auto-created, and its points come from the
          uplifted DELTA (round_half_up(20 * 1.25) = 25, raw 31250), not from the verified
          total. A `>=` reading wrongly penalises period 1; uplifting the total instead of
          the delta gives 425 points on period 2.
