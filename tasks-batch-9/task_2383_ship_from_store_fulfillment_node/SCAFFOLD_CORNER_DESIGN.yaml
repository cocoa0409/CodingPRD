          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z. Node S1, SKU-A, an inventory row and a MEDIUM_BOX packaging row exist, and CustomerCare has opened order O1 with one A x 2 line."
            - "The ninth planner-exclusive route, POST /stores/{store_id}/reactivate, needs a DEACTIVATED node and is exercised as NetworkPlanner by the errors instance two_breached_windows_deactivate_the_node_and_only_a_deactivated_node_reactivates."
