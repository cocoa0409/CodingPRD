scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: weekly_charge_provisional_vs_final
        grounds:
          - calculations.weekly_renewal_charge
          - calculations.weekly_renewal_charge.variants.provisional_at_open
          - calculations.weekly_renewal_charge.variants.final_at_settlement
          - state_machines.RentalWeek.OPEN_to_DUE
          - entities.RentalWeek.fields.amount_due_cents
        distinguishing_aspect: |
          The same RentalWeek yields amount_due_cents 38000 at provisional_at_open and
          43735 at final_at_settlement, so the two valid readings of one week's charge
          differ by 5735 cents rather than agreeing.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one eligible driver on a verified TIER_1 enrollment; one STANDARD vehicle in region CA; one ACTIVE agreement at weekly_rate_cents 35000, insurance_premium_cents 4000, unlimited_mileage false, mileage_cap_miles 2000, maintenance_allowance_miles 200"
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: false, mileage_cap_miles: 2000, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v1: $.data.version }
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v1}" }
              as: FleetOpsAgent
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /program/weeks/${w_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { provisional_due: $.data.amount_due_cents }
            - call: "POST /program/weeks/${w_id}/mileage"
              payload: { miles_driven: 2200 }
              as: FleetOpsAgent
            - call: "POST /program/weeks/${w_id}/settle"
              payload: {}
              as: ComplianceOfficer
              captures: { final_due: $.data.amount_due_cents }
          assert:
            - "RentalWeek.${w_id}.amount_due_cents == 43735 after POST /program/weeks/{id}/settle"
            - "the provisional amount_due_cents observed while the week was OPEN was 38000"
            - "RentalWeek.${w_id}.mileage_overage_cents == 5000, being round_half_up((2200 - 2000) * 25)"
            - "RentalWeek.${w_id}.platform_credit_cents == 565, being (75-50)*10 + (95-75+1)*10*3//2 capped at 600"

      - name: activity_credit_forward_vs_settled_basis
        grounds:
          - calculations.platform_activity_credit
          - calculations.platform_activity_credit.variants.platform_credit
          - calculations.platform_activity_credit.variants.renewal_credit
          - entities.RentalWeek.fields.platform_credit_cents
          - validations[priority=25]
        distinguishing_aspect: |
          On the identical agreement, the platform_credit variant reads 565 cents from the
          driver's activity score alone while the renewal_credit variant reads 300 cents
          from the RentalPayment rows actually settled, so the two valid credit readings
          of one agreement disagree on a metric no other rule touches.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one eligible driver with platform_activity_score 95; one ACTIVE agreement; two OPEN weeks, the first already settled to DUE and partly tendered"
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /program/drivers"
              payload: { full_name: "Bram Osei", email: "bram@example.com", platform_driver_id: "PLT-3T7V1NB6", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004353", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 41000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v1: $.data.version }
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v1}" }
              as: FleetOpsAgent
              captures: { w1_id: $.data.id }
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v2: $.data.version }
            - call: "POST /program/weeks/${w1_id}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/weeks/${w1_id}/payments"
              payload: { amount_cents: 38000, payment_outcome: "SUCCEEDED" }
              as: SupportAgent
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v2}" }
              as: FleetOpsAgent
              captures: { w2_id: $.data.id }
          trigger:
            - call: "GET /program/agreements/${a_id}/summary"
              payload: {}
              as: FleetOpsAgent
              captures: { renewal_credit: $.data.renewal_credit_cents }
            - call: "GET /program/weeks/${w1_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { week_credit: $.data.platform_credit_cents }
          assert:
            - "RentalWeek.${w1_id}.platform_credit_cents == 565"
            - "the agreement summary renewal_credit_cents == 38370 after one week settles in full"
            - "the two readings differ from each other, so the settled-basis credit is not a copy of the platform_credit field"

  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_score_floor_before_bonus
        grounds:
          - calculations.driver_eligibility_score
          - calculations.driver_eligibility_score.variants.escalated_evaluation
          - entities.Driver.fields.driving_record_points
          - validations[priority=11]
        distinguishing_aspect: |
          A driving record of 7 points yields score 50 and decision DENIED while 8 points
          yields score 30 that the escalation bonus lifts back to 45, so the ordering
          <bonus applied after the floor> is observable and reverses which record is worse
          for the approve threshold.
        test_recipe:
          setup:
            - "two freshly registered drivers with identical platform_activity_score 90 and FOR_HIRE licences, differing only in driving_record_points: one at 7 and one at 8"
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Cora Lin", email: "cora@example.com", platform_driver_id: "PLT-5R9W2HD4", platform_activity_score: 90, driving_record_points: 7, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d7_id: $.data.id }
            - call: "POST /program/drivers"
              payload: { full_name: "Dev Rao", email: "dev@example.com", platform_driver_id: "PLT-6Y4J8MF5", platform_activity_score: 90, driving_record_points: 8, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d8_id: $.data.id }
          trigger:
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d7_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e7_id: $.data.id, score7: $.data.eligibility_score, decision7: $.data.eligibility_decision }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d8_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e8_id: $.data.id, score8: $.data.eligibility_score, decision8: $.data.eligibility_decision }
          assert:
            - "DriverEnrollment.${e7_id}.eligibility_score == 50"
            - "DriverEnrollment.${e7_id}.eligibility_decision == DENIED"
            - "DriverEnrollment.${e8_id}.eligibility_score == 45"
            - "DriverEnrollment.${e8_id}.eligibility_decision == DENIED"
            - "DriverEnrollment.${e8_id}.record_snapshot == 8 and DriverEnrollment.${e7_id}.record_snapshot == 7"

      - name: equity_credit_then_escrow_schedule_order
        grounds:
          - calculations.purchase_option_equity_credit
          - calculations.purchase_option_equity_credit.variants.escrow_schedule_basis
          - entities.PurchaseOption.fields.escrow_required_cents
          - state_machines.PurchaseOption.ELECTED_to_ESCROW_FUNDED
        distinguishing_aspect: |
          escrow_required_cents is 74840 when derived from the one-week equity credit of
          3843, and 7683 when derived from the two-week credit of 7687, so the pinned order
          <credit first, schedule second> changes the recurring amount.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one eligible driver, one ACTIVE agreement; two weeks settled and paid in full; a 1800000 cent purchase option offered over 24 escrow weeks"
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: false, mileage_cap_miles: 2000, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v1: $.data.version }
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v1}" }
              as: FleetOpsAgent
              captures: { w1_id: $.data.id }
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v2: $.data.version }
            - call: "POST /program/weeks/${w1_id}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/weeks/${w1_id}/payments"
              payload: { amount_cents: 38435, payment_outcome: "SUCCEEDED" }
              as: SupportAgent
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v2}" }
              as: FleetOpsAgent
              captures: { w2_id: $.data.id }
            - call: "POST /program/weeks/${w2_id}/mileage"
              payload: { miles_driven: 2200 }
              as: FleetOpsAgent
            - call: "POST /program/weeks/${w2_id}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/weeks/${w2_id}/payments"
              payload: { amount_cents: 38435, payment_outcome: "SUCCEEDED" }
              as: SupportAgent
            - call: "POST /program/purchase-options"
              payload: { agreement_id: "${a_id}", driver_id: "${d_id}", purchase_price_cents: 1800000, escrow_weeks_required: 24 }
              as: PlatformAdmin
              captures: { po_id: $.data.id, seed_equity: $.data.equity_credit_cents, seed_escrow: $.data.escrow_required_cents }
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v3: $.data.version }
          trigger:
            - call: "POST /program/purchase-options/${po_id}/elect"
              payload: { expected_agreement_version: "${a_v3}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { elected_equity: $.data.equity_credit_cents, elected_escrow: $.data.escrow_required_cents }
          assert:
            - "PurchaseOption.${po_id}.equity_credit_cents == 3843 when the option is offered, one settled week having accrued credit"
            - "PurchaseOption.${po_id}.escrow_required_cents == 74840 at offer time, derived from the credit 3843"
            - "PurchaseOption.${po_id}.escrow_required_cents == 7683 after election, derived from the fully recomputed equity credit 7687 on two settled weeks"
            - "RentalAgreement.${a_id}.agreement_status == PURCHASE_PENDING"

  - rule_id: non_linear_state_machine
    instances:
      - name: rental_week_payment_dimension_cycles_independently
        grounds:
          - state_machines.RentalWeek.UNPAID_DIMENSION_to_FAILED_DIMENSION
          - state_machines.RentalWeek.FAILED_DIMENSION_to_UNPAID_DIMENSION
          - state_machines.RentalWeek.PARTIAL_DIMENSION_to_SETTLED_DIMENSION
          - entities.RentalWeek.fields.payment_status
          - entities.RentalWeek.fields.week_status
        distinguishing_aspect: |
          RentalWeek carries two independent state dimensions on the same row — week_status
          stays DUE while payment_status walks UNPAID to PARTIAL to FAILED to UNPAID to
          SETTLED — so no single linear A-to-B-to-C reading of the row describes its state.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one ACTIVE agreement; week 1 settled to week_status DUE with amount_due_cents 38435"
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "GET /program/agreements/${a_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { a_v1: $.data.version }
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v1}" }
              as: FleetOpsAgent
              captures: { w_id: $.data.id }
            - call: "POST /program/weeks/${w_id}/settle"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /program/weeks/${w_id}/payments"
              payload: { amount_cents: 20000, payment_outcome: "SUCCEEDED" }
              as: SupportAgent
              captures: { after_partial: $.data.payment_status }
            - call: "POST /program/weeks/${w_id}/retry-payment"
              payload: { amount_cents: 18000, payment_outcome: "FAILED" }
              as: SupportAgent
              captures: { after_failed: $.data.payment_status }
            - call: "POST /program/weeks/${w_id}/retry-payment"
              payload: { amount_cents: 18000, payment_outcome: "SUCCEEDED" }
              as: SupportAgent
              captures: { after_settled: $.data.payment_status }
          assert:
            - "RentalWeek.${w_id}.payment_status walked UNPAID, PARTIAL, FAILED, UNPAID, SETTLED"
            - "RentalWeek.${w_id}.week_status == PAID after the successful retry"
            - "RentalWeek.${w_id}.amount_due_cents == 18000 stood after the partial tender of 20000"

      - name: maintenance_completion_branches_on_loaner_presence
        grounds:
          - state_machines.MaintenanceEvent.IN_PROGRESS_to_LOANER_ISSUED
          - state_machines.MaintenanceEvent.LOANER_ISSUED_to_COMPLETED
          - state_machines.MaintenanceEvent.IN_PROGRESS_to_COMPLETED
          - entities.MaintenanceEvent.fields.earnings_interruption_hours
          - errors[ERR_LOANER_UNAVAILABLE]
        distinguishing_aspect: |
          POST /maintenance-events/{id}/complete converges on COMPLETED from three distinct
          origins whose side-effect sets differ: from REPORTED the allowance applied is 0,
          from IN_PROGRESS it is min(30, 200) = 30 hours of earnings interruption with the
          original unit resuming, and from LOANER_ISSUED it is 0 with both units re-seated —
          so the fork is observable in earnings_interruption_hours, not just in event_status.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one ACTIVE agreement on a 40000-mile STANDARD unit; a second STANDARD unit in CA available as a loaner"
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/vehicles"
              payload: { vin: "2HGES16575H606231", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 61000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { loaner_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "GET /program/vehicles/${v_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { v_v1: $.data.version }
          trigger:
            - call: "POST /program/maintenance-events"
              payload: { agreement_id: "${a_id}", vehicle_id: "${v_id}", event_type: "UNSCHEDULED_REPAIR", odometer_at_service: 41200, downtime_hours: 30, damage_liability_cents: 0, expected_vehicle_version: "${v_v1}" }
              as: FleetOpsAgent
              captures: { me_id: $.data.id }
            - call: "POST /program/maintenance-events/${me_id}/start"
              payload: {}
              as: FleetOpsAgent
            - call: "POST /program/maintenance-events/${me_id}/issue-loaner"
              payload: {}
              as: FleetOpsAgent
              captures: { selected_loaner: $.data.loaner_vehicle_id }
            - call: "POST /program/maintenance-events/${me_id}/complete"
              payload: {}
              as: FleetOpsAgent
              captures: { interruption: $.data.earnings_interruption_hours }
          assert:
            - "MaintenanceEvent.${me_id}.event_status == COMPLETED"
            - "MaintenanceEvent.${me_id}.earnings_interruption_hours == 0, the loaner-protected branch"
            - "ProgramVehicle.${v_id}.vehicle_status == ASSIGNED with assigned_driver_id ${d_id}"
            - "ProgramVehicle.${loaner_id}.vehicle_status == AVAILABLE with assigned_driver_id null"

  - rule_id: transitive_cascade
    instances:
      - name: grace_lapse_cascade_reaches_driver_enrollment
        grounds:
          - state_machines.RentalWeek.GRACE_to_DELINQUENT
          - state_machines.RentalAgreementPosture.RESTRICTED_to_FROZEN
          - state_machines.Driver.ELIGIBLE_to_SUSPENDED
          - state_machines.DriverEnrollment.ACTIVE_to_SUSPENDED
          - entities.DriverEnrollment.fields.enrollment_status
        distinguishing_aspect: |
          One grace-lapse call propagates four hops — week to posture to driver to
