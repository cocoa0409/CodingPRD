            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G Eval", email: "geval@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Ava", age: 8, gender: "FEMALE", home_zip: "44114", interest_tags: ["MUSIC"] }
              as: MatchSpecialist
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: $.data.id }
            - call: "GET /volunteers/${v_id}"
              payload: {}
              as: MatchSpecialist
              captures: { v_v: $.data.version }
            - call: "POST /match-proposals/${prop_id}/accept"
              payload: { expected_volunteer_version: "${v_v}" }
              as: MatchSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-02T10:00:00Z", scheduled_end: "2026-01-02T11:00:00Z", location: "Cafe" }
              as: MatchSpecialist
              captures: { mtg_id: $.data.id }
            - call: "POST /match-meetings/${mtg_id}/hold"
              payload: {}
              as: MatchSpecialist
            - call: "POST /match-meetings/${mtg_id}/affirm"
              payload: {}
              as: MatchSpecialist
            - call: "POST /matches/${m_id}/activities"
              payload: { occurred_at: "2026-01-25T10:00:00Z", duration_minutes: 60, activity_type: "CALL" }
              as: MatchSpecialist
            - call: "GET /matches/${m_id}/supervision-contacts"
              payload: {}
              as: Supervisor
              captures: { sc_id: "$.data[0].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: Coordinator
            - call: "GET /matches/${m_id}"
              payload: {}
              as: Supervisor
              captures: { comp_pre: $.data.compliance_status }
          trigger:
            - call: "POST /supervision-contacts/${sc_id}/complete"
              payload: { contacted_at: "2026-03-05T00:00:00Z", party: "BIG" }
              as: Supervisor
            - call: "GET /matches/${m_id}"
              payload: {}
              as: Supervisor
              captures: { comp: $.data.compliance_status }
          assert:
            - "compliance_status BEFORE completion (day 63, contact still OPEN) == RED"
            - "Match.${m_id}.compliance_status immediately after completion == GREEN"
            - "Match.${m_id}.last_contact_at == 2026-03-05T00:00:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: match_parallel_relationship_and_compliance_axes
        grounds:
          - state_machines.Match.CONFIRMED_to_INTRODUCED
          - state_machines.Match.INTRODUCED_to_ACTIVE
          - entities.Match.fields.relationship_status
          - entities.Match.fields.compliance_status
        distinguishing_aspect: "Match carries two independent state axes: relationship_status (CONFIRMED->INTRODUCED->ACTIVE) advances via meeting actions while compliance_status (GREEN/AMBER/RED) is derived from supervision/activity recency; the same row can be relationship_status ACTIVE while compliance_status flips GREEN->AMBER without any relationship transition firing."
        test_recipe:
          setup:
            - "An ACTIVE Match (relationship axis) with a fresh contact so compliance is GREEN; then clock advances 40 days with no new contact -> compliance becomes AMBER while relationship_status stays ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Par", email: "vpar@x.com", gender: "MALE", home_zip: "60601", interest_tags: ["STEM"], max_weekly_hours: 5 }
