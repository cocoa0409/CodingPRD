      - name: passing_a_technician_grade_rederives_the_partners_authorized_model_ids
        claim_type: Cross-entity
        grounds:
          - state_machines.TechnicianCertification["ENROLLED -> PASSED"].side_effects
          - calculations.service_partner_claim_authority
        distinguishing_aspect: "Grading a technician mutates a different aggregate: the second PASSED certification on the same model flips ServicePartner.authorized_model_ids from [] to [model], while the first PASSED one leaves it empty because MIN_CERTIFIED_TECHS_PER_MODEL is 2; certified_on and expires_on are stamped from the clock plus CERT_TERM_DAYS = 730."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel; ServicePartner SP-1 (FULL stocking) with two ENROLLED technicians T1 and T2, both with 40 training hours on that model."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /service-partners"
              payload: { partner_code: "SP-1", name: "Metro Service", region_code: "NE", parts_stocking_level: "FULL" }
              as: ChannelManager
              captures: { sp_id: $.data.id }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T1", training_hours: 40 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc1: $.data.id }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T2", training_hours: 40 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc2: $.data.id }
          trigger:
            - call: "POST /technician-certifications/${tc1}/grade"
              payload: { exam_score: 88 }
              as: ChannelManager
              captures: { st1: $.data.status, cert1: $.data.certified_on, exp1: $.data.expires_on }
            - call: "GET /service-partners/${sp_id}"
              payload: {}
              as: ChannelManager
              captures: { models_after_one: $.data.authorized_model_ids }
            - call: "POST /technician-certifications/${tc2}/grade"
              payload: { exam_score: 80 }
              as: ChannelManager
              captures: { st2: $.data.status }
            - call: "GET /service-partners/${sp_id}"
              payload: {}
              as: ChannelManager
              captures: { models_after_two: $.data.authorized_model_ids, sp_status: $.data.status }
          assert:
            - "${st1} == PASSED"
            - "${cert1} == '2026-08-01T00:00:00Z'"
            - "${exp1} == '2028-07-31T00:00:00Z'"
            - "${models_after_one} == []"
            - "${st2} == PASSED"
            - "${models_after_two} == ['${model_id}']"
            - "${sp_status} == APPLIED"

      - name: coverage_lazily_expires_when_the_clock_reaches_coverage_end_date
        claim_type: Valid Transition
        grounds:
          - state_machines.ConnectedUnit["ACTIVE -> EXPIRED"]
          - constants.COVERAGE_TERM_DAYS
        distinguishing_aspect: "The ACTIVE -> EXPIRED move has no endpoint: it is evaluated lazily on the next read, and the comparison is clock >= coverage_end_date, so a read one second before the term end still shows ACTIVE and a read exactly at 2027-08-01T00:00:00Z shows EXPIRED with the reserve balance left untouched."
