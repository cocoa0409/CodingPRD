            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw_exp: "$.data.assignments_expired", sw_rec: "$.data.recurrences_created" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { old_prog: "$.data[0].progress_status", old_exp: "$.data[0].expires_at", new_prog: "$.data[1].progress_status", new_trig: "$.data[1].trigger_source", new_due: "$.data[1].base_due_at" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { vc: "$.data.verified_completed_count" } }
          assert:
            - "old_exp == \"2026-09-03T09:00:00Z\" (accept 2026-08-03T09:00:00Z + 1 calendar month)"
            - "sw_exp == 1 and sw_rec == 1 (inclusive boundary: expired AT the expiry instant)"
            - "old_prog == \"EXPIRED\"; new_prog == \"ASSIGNED\" and new_trig == \"RECURRENCE\""
            - "new_due == \"2026-09-08T09:00:00Z\" (5 calendar days from recurrence)"
