  # ==================================================================
  # Rule 5: priority_pair_validation_conflict (different category pairs)
  # ==================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payment_state_beats_overpayment_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_ORDER_NOT_PAYABLE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Category pair state (5) vs business_fiscal (10): a 1-cent payment on a PAID_IN_FULL
          order violates both ERR_ORDER_NOT_PAYABLE (state) and ERR_OVERPAYMENT (amount exceeds
          the now-zero balance); the state error MUST win.
        test_recipe:
          setup:
            - "Customer; order (500000 line, total 515000) fully paid (balance_cents == 0, payment_status PAID_IN_FULL)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Oliver Overpay", email: "oliver@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-O-1", category: "DIGITAL", manufacturer: "Roland", model: "FP90", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 515000, method: "CARD" }
              as: SalesAssociate
          trigger:
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 1, method: "CARD" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_PAYABLE (state priority 5 beats fiscal priority 10; ERR_OVERPAYMENT must NOT be returned)"
            - "SalesOrder.${o_id}.payment_status remains PAID_IN_FULL and amount_paid_cents == 515000"

      - name: delivery_climate_safety_beats_crew_conflict_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_CLIMATE_REQUIREMENT_UNMET]
          - errors[ERR_CREW_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety (6) vs business_constraint (8): scheduling a climate-
          requiring order onto a non-certified crew inside that crew's buffered window violates
          both rules; ERR_CLIMATE_REQUIREMENT_UNMET MUST win over ERR_CREW_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Crew NC with climate_certified == false; crew NC already occupied 2026-06-01T10:00-12:00 (buffer extends occupation to 12:30) by a first paid order"
            - "A second paid order with climate_controlled_required == true (total 535000: fee 15000 + climate 20000)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Clara Climate", email: "clara@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-C-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i1: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-C-2", category: "GRAND", manufacturer: "Steinway", model: "S", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i2: $.data.id }
            - call: "POST /piano-dealer/instruments/${i1}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/instruments/${i2}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew NonClimate", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i1}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o1: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o1}/payments"
              payload: { amount_cents: 515000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o1}", crew_id: "${cr_id}", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i2}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: true }
              as: SalesAssociate
              captures: { o2: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o2}/payments"
              payload: { amount_cents: 535000, method: "CARD" }
              as: SalesAssociate
          trigger:
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o2}", crew_id: "${cr_id}", window_start: "2026-06-01T11:00:00Z", window_end: "2026-06-01T13:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLIMATE_REQUIREMENT_UNMET (safety priority 6 beats constraint priority 8; ERR_CREW_WINDOW_CONFLICT must NOT be returned)"
            - "SalesOrder.${o2}.fulfillment_status remains AWAITING_SCHEDULING"

  # ==================================================================
  # Rule 6: boundary_precision_check (different metrics/endpoints)
  # ==================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: trade_in_cap_inclusive_at_exactly_forty_pct
        grounds:
          - calculations.order_total
          - entities.SalesOrder.fields.trade_in_credit_cents
        distinguishing_aspect: |
          Metric: money cap on POST /sales-orders. Appraisal final 200000 lands EXACTLY on
          round(0.40 * 500000) == 200000; the cap is inclusive (min), so the full 200000 credit
          is granted — a '>'-style cap reading would wrongly clamp it.
        test_recipe:
          setup:
            - "Customer; ACCEPTED appraisal with final_value_cents 200000 (DIGITAL 2022 EXCELLENT: provisional 220000, evaluate reconditioning 20000 / adjustment 0.0)"
            - "One AVAILABLE NEW instrument 500000/1"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Boris Bounds", email: "boris@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "DIGITAL", manufacturer: "Roland", model: "RD2000", year_built: 2022, condition_grade: "EXCELLENT" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 20000, market_adjustment_pct: 0.0 }
              as: StoreManager
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/accept"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-T-1", category: "UPRIGHT", manufacturer: "Kawai", model: "K200", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 1 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], trade_in_appraisal_id: "${a_id}", tax_rate: 0.08, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          assert:
            - "SalesOrder.${o_id}.subtotal_cents == 500000"
            - "SalesOrder.${o_id}.trade_in_credit_cents == 200000 (cap is inclusive: == cap is granted, not clamped below)"
            - "SalesOrder.${o_id}.tax_cents == 24000 (round(300000 * 0.08))"
            - "SalesOrder.${o_id}.total_cents == 339000 (500000 - 200000 + 15000 + 24000)"

      - name: service_plan_zero_credit_booking_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_PLAN_EXHAUSTED]
          - entities.ServicePlan.fields.visits_available
        distinguishing_aspect: |
          Metric: zero-count boundary on POST /service-visits (a different metric — visit credits —
          and a different endpoint from the money cap). BASIC plan with visits_total 2: after two
          completions visits_available hits exactly 0 and the next booking MUST fail; 0 is rejected,
          not treated as one remaining.
        test_recipe:
          setup:
            - "Customer; order (100000 line, total 115000) PAID_IN_FULL, DELIVERED, INSTALLED"
            - "BASIC ServicePlan (visits_total 2); technician Ted; two visits completed (visits_used 2, visits_booked 0, visits_available 0, plan EXHAUSTED)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Zoe Zero", email: "zoe@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-Z-1", category: "DIGITAL", manufacturer: "Kawai", model: "ES120", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 115000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Delta", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-03T09:00:00Z", window_end: "2026-05-03T11:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/confirm-installation"
              as: StoreManager
            - call: "POST /piano-dealer/service-plans"
              payload: { order_id: "${o_id}", tier: "BASIC" }
              as: ServiceCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /piano-dealer/technicians"
              payload: { full_name: "Ted Tuner", certification_level: "STANDARD" }
              as: StoreManager
              captures: { t_id: $.data.id }
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-01T09:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: ServiceCoordinator
              captures: { v1: $.data.id }
            - call: "POST /piano-dealer/service-visits/${v1}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-01T11:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ServiceCoordinator
              captures: { v2: $.data.id }
            - call: "POST /piano-dealer/service-visits/${v2}/complete"
              as: ServiceCoordinator
          trigger:
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T15:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_EXHAUSTED"
            - "ServicePlan.${p_id}.visits_used == 2 and visits_booked == 0 and visits_available == 0"
            - "ServicePlan.${p_id}.status == EXHAUSTED"

  # ==================================================================
  # Rule 7: cross_entity_state_dependency (different entity pairs)
  # ==================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_creation_requires_instrument_available
        grounds:
          - state_machines.Instrument.AVAILABLE_to_RESERVED
          - validations[priority=5]
          - errors[ERR_INSTRUMENT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Pair SalesOrder x Instrument: creating an order whose line instrument is RESERVED
          (held by an earlier UNPAID order) MUST fail with ERR_INSTRUMENT_NOT_AVAILABLE; the
          instrument's own state gates a different aggregate's creation.
        test_recipe:
          setup:
            - "Customer; one AVAILABLE instrument; first UNPAID order already holds it (instrument RESERVED)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Gail Gate", email: "gail@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-G-9", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2022, condition_grade: "GOOD", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSTRUMENT_NOT_AVAILABLE"
            - "Instrument.${i_id}.status remains RESERVED and only one order references it"

      - name: delivery_scheduling_requires_payable_order_gate
        grounds:
          - state_machines.SalesOrder.fulfillment_status.AWAITING_SCHEDULING_to_DELIVERY_SCHEDULED
          - validations[priority=5]
          - errors[ERR_DELIVERY_NOT_ACTIONABLE]
        distinguishing_aspect: |
          Pair DeliveryJob x SalesOrder (different pair from order x instrument): scheduling a
          delivery requires the ORDER's payment_status in {DEPOSIT_PAID, PAID_IN_FULL,
          FINANCED_ACTIVE}; an UNPAID order's job creation MUST fail even though the job's own
          fields are all valid.
        test_recipe:
          setup:
            - "Customer; AVAILABLE instrument; UNPAID order; crew exists"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Uma Unpaid", email: "uma@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-U-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2023, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 400000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 400000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Epsilon", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-06-05T09:00:00Z", window_end: "2026-06-05T12:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DELIVERY_NOT_ACTIONABLE"
            - "SalesOrder.${o_id}.fulfillment_status remains AWAITING_SCHEDULING and no DeliveryJob is persisted"

  # ==================================================================
  # Rule 8: resource_temporal_overlap (different interval semantics)
  # ==================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_half_open_window_with_travel_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_CREW_WINDOW_CONFLICT]
          - entities.DeliveryJob.fields.window_start
        distinguishing_aspect: |
          Interval semantics A on DeliveryCrew: half-open [start, end) PLUS a mandatory 30-minute
          travel buffer after each job, so occupation is [start, end + 30min). A successor starting
          exactly at end (12:00) conflicts; starting exactly at end+buffer (12:30) is allowed
          (inclusive lower bound of the gap).
        test_recipe:
          setup:
            - "Crew C; two PAID orders o1 (scheduled 10:00-12:00) and o2 (awaiting scheduling)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Buffy Buffer", email: "buffy@x.com", customer_type: "INDIVIDUAL" }
