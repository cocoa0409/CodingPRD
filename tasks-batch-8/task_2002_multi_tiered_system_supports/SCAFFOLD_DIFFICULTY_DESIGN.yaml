              payload: { scheduled_on: "2026-08-14", minutes: 30, outcome: "STUDENT_ABSENT" }
              as: InterventionistRole
              as_user_id: "${i_id}"
            # Week 2: ISO week containing 2026-08-17..2026-08-19
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${q_id}/plans/${p_id}/sessions"
