              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cs1}", name: "Selector Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 180, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rs1: $.data.id }
            - call: "POST /routes/${rs1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rs1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { ts1: "$.data[0].id", ts3: "$.data[2].id" }
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cs1}", service_date: "2026-09-02", requested_pickup_min: 433, party_size: 2, requires_ada: false }
              as: ClientLiaison
              captures: { ods1: $.data.id }
          trigger:
            - call: "POST /on-demand-requests/${ods1}/match"
              payload: {}
              as: OpsPlanner
              captures: { ods1_trip: $.data.matched_trip_id }
          assert:
            - "${ods1_trip} == '${ts3}'"
            - "${ods1_trip} != '${ts1}'"
            - "GET /on-demand-requests/${ods1} -> OnDemandRequest.status == 'MATCHED' and promised_wait_minutes == 9 and promised_headway_minutes == 12"
            - "GET /trips/${ts3} -> Trip.matched_party_seats == 2"
            - "GET /on-demand-requests?matched_trip_id=${ts3} -> total_count == 1"

      - name: match_with_empty_candidate_pool_denies_instead_of_erroring
        claim_type: input_set_filtering
        grounds:
          - calculations.trip_match_selector
          - state_machines.OnDemandRequest.PENDING_to_DENIED
        distinguishing_aspect: "An ADA-requiring request against a route whose trips all have vehicle_id null produces an empty candidate set, so match responds 200 with status DENIED rather than raising ERR_ADA_VEHICLE_REQUIRED."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with a PUBLISHED Route (window 420..456) for 2026-09-02 whose four trips are all SCHEDULED with no vehicle assigned."
            - "One PENDING OnDemandRequest for pickup 420, party of 1, requires_ada true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Denied Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cq1: $.data.id }
            - call: "POST /service-contracts/${cq1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cq1}", name: "Denied Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rq1: $.data.id }
            - call: "POST /routes/${rq1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cq1}", service_date: "2026-09-02", requested_pickup_min: 420, party_size: 1, requires_ada: true }
              as: ClientLiaison
              captures: { odq1: $.data.id }
          trigger:
            - call: "POST /on-demand-requests/${odq1}/match"
              payload: {}
              as: OpsPlanner
              captures: { odq1_status: $.data.status }
          assert:
            - "HTTP status is 200"
            - "${odq1_status} == 'DENIED'"
            - "GET /on-demand-requests/${odq1} -> OnDemandRequest.matched_trip_id == null"
            - "response_type == 'object' and no error_id is present"

      - name: wait_overage_exactly_at_grace_mints_no_credit
        claim_type: precision
        grounds:
          - calculations.on_demand_wait_estimate
          - entities.OnDemandRequest.fields.wait_overage_minutes
        distinguishing_aspect: "A promised wait of 9 against an 11-minute realized wait gives wait_overage_minutes exactly 2, which equals WAIT_SLA_GRACE_MINUTES and therefore mints no WAIT_SLA_BREACH memo — the rule fires strictly above the grace."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with a PUBLISHED Route (headway 12) for 2026-09-02 whose 432 trip is assigned and IN_SERVICE."
            - "One OnDemandRequest for pickup 425 MATCHED to that trip with promised_wait_minutes 9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Grace Wait Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cg1: $.data.id }
            - call: "POST /service-contracts/${cg1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cg1}", name: "Grace Wait Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rg1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3201", seat_capacity: 20, is_ada_accessible: false, odometer_km: 1400, service_interval_km: 20000 }
              as: FleetManager
              captures: { vg1: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Grace Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { dg1: $.data.id }
            - call: "POST /routes/${rg1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rg1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tg2: "$.data[1].id" }
            - call: "POST /trips/${tg2}/assign"
              payload: { vehicle_id: "${vg1}", driver_id: "${dg1}" }
              as: OpsPlanner
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cg1}", service_date: "2026-09-02", requested_pickup_min: 425, party_size: 1, requires_ada: false }
              as: ClientLiaison
              captures: { odg1: $.data.id }
            - call: "POST /on-demand-requests/${odg1}/match"
              payload: { trip_id: "${tg2}" }
              as: OpsPlanner
            - call: "POST /trips/${tg2}/start"
              payload: { actual_departure_min: 433 }
              as: DriverUser
              as_user_id: "${dg1}"
          trigger:
            - call: "POST /on-demand-requests/${odg1}/serve"
              payload: { actual_pickup_min: 436 }
              as: DriverUser
              as_user_id: "${dg1}"
              captures: { odg1_over: $.data.wait_overage_minutes }
          assert:
            - "GET /on-demand-requests/${odg1} -> OnDemandRequest.actual_wait_minutes == 11"
            - "${odg1_over} == 2"
            - "GET /on-demand-requests/${odg1} -> OnDemandRequest.status == 'SERVED'"
            - "GET /credit-memos?contract_id=${cg1} -> total_count == 0"
            - "GET /service-contracts/${cg1} -> ServiceContract.credit_balance_cents == 0"

      - name: route_fleet_requirement_uses_the_larger_of_two_branches
        claim_type: constants_applied
        grounds:
          - calculations.route_fleet_requirement
        excluded_because:
          difficulty_instance: route_fleet_requirement_max_of_headway_and_demand
          rationale: "That §1.8 instance already pins both branches of the max() and the ADA ceiling with literal expected values 8, 2, 6 and 2."

  # =========================================================================
  - section: validations
    instances:

      - name: overlapping_reporting_period_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=114]
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: "A second report for 2026-09-15..2026-10-15 overlaps the existing 2026-09-01..2026-09-30 report on the same contract and is rejected with 409 ERR_PERIOD_OVERLAP; no second report row is created."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with one DRAFT ServicePeriodReport for 2026-09-01..2026-09-30."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Overlap Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cov: $.data.id }
            - call: "POST /service-contracts/${cov}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /service-period-reports"
              payload: { contract_id: "${cov}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ClientLiaison
          trigger:
            - call: "POST /service-period-reports"
              payload: { contract_id: "${cov}", period_start_date: "2026-09-15", period_end_date: "2026-10-15" }
              as: ClientLiaison
              captures: { e_ovl: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${e_ovl} == 'ERR_PERIOD_OVERLAP'"
            - "GET /service-period-reports?contract_id=${cov} -> total_count == 1"

      - name: reporting_period_outside_contract_term_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=112]
          - errors[ERR_PERIOD_OUT_OF_TERM]
        distinguishing_aspect: "A period of 2026-08-01..2026-08-31 starts before term_start_date 2026-09-01 and is rejected with 422 ERR_PERIOD_OUT_OF_TERM."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract whose term runs 2026-09-01..2027-08-31 with no reports."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Term Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { ctm: $.data.id }
            - call: "POST /service-contracts/${ctm}/activate"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /service-period-reports"
              payload: { contract_id: "${ctm}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: ClientLiaison
              captures: { e_term: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${e_term} == 'ERR_PERIOD_OUT_OF_TERM'"
            - "GET /service-period-reports?contract_id=${ctm} -> total_count == 0"

      - name: publish_for_a_date_outside_the_term_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=110]
          - errors[ERR_DATE_OUT_OF_TERM]
        distinguishing_aspect: "Publishing for 2027-09-15, one day past term_end_date 2027-08-31, returns 422 ERR_DATE_OUT_OF_TERM and leaves the route DRAFT with zero trips."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract whose term ends 2027-08-31, holding one DRAFT Route."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Publish Term Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cpt: $.data.id }
            - call: "POST /service-contracts/${cpt}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cpt}", name: "Out Of Term Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rpt: $.data.id }
          trigger:
            - call: "POST /routes/${rpt}/publish"
              payload: { service_date: "2027-09-15" }
              as: OpsPlanner
              captures: { e_date: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${e_date} == 'ERR_DATE_OUT_OF_TERM'"
            - "GET /routes/${rpt} -> Route.status == 'DRAFT' and Route.published_service_date == null"
            - "GET /trips?route_id=${rpt} -> total_count == 0"

      - name: renewal_window_opens_exactly_sixty_days_before_term_end
        claim_type: temporal_validation
        grounds:
          - validations[priority=118]
          - errors[ERR_RENEWAL_WINDOW_CLOSED]
          - calculations.renewal_proposed_rate
        distinguishing_aspect: "With term_end_date 2027-08-31 the window opens on 2027-07-02: a create at 2027-07-01 returns 422 ERR_RENEWAL_WINDOW_CLOSED while the identical create at 2027-07-02 succeeds with proposed rate 9315."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract at 9000 cents per service hour, escalation 3.5, term ending 2027-08-31 and no APPROVED report."
            - "Logical clock parked at 2027-07-01T12:00:00Z, one day before the window opens."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T12:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Window Boundary Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cwb: $.data.id }
            - call: "POST /service-contracts/${cwb}/activate"
              payload: {}
              as: ContractAdmin
              captures: { cwb_v: $.data.version }
          trigger:
            - call: "POST /renewal-offers"
              payload: { contract_id: "${cwb}", proposed_term_months: 12, expected_contract_version: "${cwb_v}" }
              as: ContractAdmin
              captures: { e_win: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-02T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /renewal-offers"
              payload: { contract_id: "${cwb}", proposed_term_months: 12, expected_contract_version: "${cwb_v}" }
              as: ContractAdmin
              captures: { owb: $.data.id, owb_rate: $.data.proposed_rate_cents_per_service_hour }
          assert:
            - "the 2027-07-01 attempt responds with HTTP 422 and ${e_win} == 'ERR_RENEWAL_WINDOW_CLOSED'"
            - "after the failed attempt, GET /service-contracts/${cwb} -> ServiceContract.status == 'ACTIVE' and version is unchanged at ${cwb_v}"
            - "the 2027-07-02 attempt responds with HTTP 201"
            - "${owb_rate} == 9315"
            - "RenewalOffer.${owb}.applied_escalation_pct == 3.5 and RenewalOffer.${owb}.basis_report_id == null"
            - "GET /service-contracts/${cwb} -> ServiceContract.status == 'RENEWAL_PENDING'"

      - name: branding_below_the_ada_floor_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=86]
          - errors[ERR_ADA_FLEET_SHORTFALL]
          - entities.ServiceContract.fields.ada_min_accessible_pct
        distinguishing_aspect: "On a contract with ada_min_accessible_pct 50.00, branding a third vehicle would take the ADA share from exactly 50.00 to 33.33 and is rejected with 422 ERR_ADA_FLEET_SHORTFALL, leaving branded_vehicle_count at 2."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with ada_min_accessible_pct 50.00."
            - "One ADA vehicle and one non-ADA vehicle already branded to it, so branded_vehicle_count is 2 and the share is exactly 50.00."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Floor Enforcement Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 50.00 }
              as: ContractAdmin
              captures: { caf: $.data.id }
            - call: "POST /service-contracts/${caf}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3301", seat_capacity: 20, is_ada_accessible: true, odometer_km: 100, service_interval_km: 20000, branding_contract_id: "${caf}" }
              as: FleetManager
              captures: { vaf1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3302", seat_capacity: 20, is_ada_accessible: false, odometer_km: 200, service_interval_km: 20000, branding_contract_id: "${caf}" }
              as: FleetManager
              captures: { vaf2: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3303", seat_capacity: 20, is_ada_accessible: false, odometer_km: 300, service_interval_km: 20000 }
              as: FleetManager
              captures: { vaf3: $.data.id }
          trigger:
            - call: "POST /vehicles/${vaf3}/brand"
              payload: { branding_contract_id: "${caf}" }
              as: FleetManager
              captures: { e_ada: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${e_ada} == 'ERR_ADA_FLEET_SHORTFALL'"
            - "GET /vehicles/${vaf3} -> Vehicle.branding_contract_id == null"
            - "GET /service-contracts/${caf} -> ServiceContract.branded_vehicle_count == 2 and ServiceContract.branded_ada_vehicle_count == 1"

      - name: branded_vehicle_cannot_serve_another_contracts_trip
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=130]
          - errors[ERR_VEHICLE_BRANDING_MISMATCH]
        distinguishing_aspect: "A vehicle wearing contract Beta's livery is refused for a trip whose contract_id is Alpha with 422 ERR_VEHICLE_BRANDING_MISMATCH, even though the vehicle is AVAILABLE and free of block conflicts."
        test_recipe:
          setup:
            - "Two ACTIVE ServiceContracts, Alpha owning a PUBLISHED single-trip Route on 2026-09-02, and Beta with ada_min_accessible_pct 0.00."
            - "One non-ADA vehicle branded to Beta and one driver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Alpha Site", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cba: $.data.id }
            - call: "POST /service-contracts/${cba}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Beta Site", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 0.00 }
              as: ContractAdmin
              captures: { cbb: $.data.id }
            - call: "POST /service-contracts/${cbb}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cba}", name: "Alpha Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rba: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3401", seat_capacity: 20, is_ada_accessible: false, odometer_km: 400, service_interval_km: 20000, branding_contract_id: "${cbb}" }
              as: FleetManager
              captures: { vbb: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Branding Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { dbb: $.data.id }
            - call: "POST /routes/${rba}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rba}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tba: "$.data[0].id" }
          trigger:
            - call: "POST /trips/${tba}/assign"
              payload: { vehicle_id: "${vbb}", driver_id: "${dbb}" }
              as: OpsPlanner
              captures: { e_brand: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${e_brand} == 'ERR_VEHICLE_BRANDING_MISMATCH'"
            - "GET /trips/${tba} -> Trip.dispatch_status == 'SCHEDULED' and Trip.vehicle_id == null"
            - "GET /vehicles/${vbb} -> Vehicle.status == 'AVAILABLE' and Vehicle.committed_block_minutes == 0"

      - name: future_maintenance_window_touching_the_arrival_blocks_assignment
        claim_type: temporal_validation
        grounds:
          - validations[priority=80]
          - errors[ERR_VEHICLE_IN_MAINTENANCE_WINDOW]
        distinguishing_aspect: "The maintenance window is closed on both ends, so a shop window of 468..500 collides with a trip running 420..468 at the single shared minute 468 and the assignment is refused with 422 ERR_VEHICLE_IN_MAINTENANCE_WINDOW while the vehicle itself is still AVAILABLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z, so an order dated 2026-09-02 is future-dated and does not move the vehicle out of AVAILABLE."
            - "One ACTIVE ServiceContract with a PUBLISHED single-trip Route running 420..468 on 2026-09-02."
            - "One OPEN MaintenanceOrder for that vehicle on 2026-09-02 with window 468..500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Window Touch Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cmw: $.data.id }
            - call: "POST /service-contracts/${cmw}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cmw}", name: "Window Touch Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rmw: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3501", seat_capacity: 20, is_ada_accessible: false, odometer_km: 500, service_interval_km: 20000 }
              as: FleetManager
              captures: { vmw: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Window Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { dmw: $.data.id }
            - call: "POST /routes/${rmw}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rmw}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tmw: "$.data[0].id" }
            - call: "POST /maintenance-orders"
              payload: { vehicle_id: "${vmw}", kind: "PREVENTIVE", service_date: "2026-09-02", window_start_min: 468, window_end_min: 500 }
              as: FleetManager
              captures: { mmw: $.data.id, mmw_displaced: $.data.displaced_trip_count }
          trigger:
            - call: "POST /trips/${tmw}/assign"
              payload: { vehicle_id: "${vmw}", driver_id: "${dmw}" }
              as: OpsPlanner
              captures: { e_mw: $.data.error_id }
          assert:
            - "${mmw_displaced} == 0"
            - "GET /vehicles/${vmw} -> Vehicle.status == 'AVAILABLE'"
            - "HTTP status is 422"
            - "${e_mw} == 'ERR_VEHICLE_IN_MAINTENANCE_WINDOW'"
            - "GET /trips/${tmw} -> Trip.dispatch_status == 'SCHEDULED' and Trip.vehicle_id == null"

      - name: duplicate_fleet_code_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=90]
          - errors[ERR_FLEET_CODE_DUPLICATE]
        distinguishing_aspect: "A second vehicle carrying fleet_code SHV-3601 returns 409 ERR_FLEET_CODE_DUPLICATE and the fleet still holds exactly one vehicle."
        test_recipe:
          setup:
            - "Exactly one Vehicle exists, with fleet_code SHV-3601."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3601", seat_capacity: 20, is_ada_accessible: false, odometer_km: 600, service_interval_km: 20000 }
              as: FleetManager
              captures: { vdup: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3601", seat_capacity: 30, is_ada_accessible: true, odometer_km: 10, service_interval_km: 15000 }
              as: FleetManager
              captures: { e_dup: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${e_dup} == 'ERR_FLEET_CODE_DUPLICATE'"
            - "GET /vehicles -> total_count == 1 and data[0].id == '${vdup}'"

      - name: counter_rate_below_base_is_rejected_and_countered_offer_cannot_be_countered_again
        claim_type: violation_to_error
        grounds:
          - validations[priority=142]
          - errors[ERR_COUNTER_RATE_OUT_OF_BOUNDS]
          - errors[ERR_OFFER_NOT_OPEN]
          - state_machines.RenewalOffer.OPEN_to_COUNTERED
        distinguishing_aspect: "A counter of 8900 sits below the contract's base rate of 9000 and returns 422 ERR_COUNTER_RATE_OUT_OF_BOUNDS; a valid counter of 9100 then succeeds, after which a third counter returns 409 ERR_OFFER_NOT_OPEN."
        test_recipe:
          setup:
            - "Logical clock at 2027-07-15T09:00:00Z."
            - "One ServiceContract at RENEWAL_PENDING with one OPEN RenewalOffer whose proposed rate is 9315."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
