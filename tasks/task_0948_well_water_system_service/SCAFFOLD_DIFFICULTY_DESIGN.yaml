  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_buffered_window_collides_with_a_merely_touching_window
        resource: Technician
        interval_semantics: "half-open [start, end) expanded by a symmetric 45-minute travel buffer on the candidate"
        grounds:
          - calculations.technician_window_overlap
          - validations[priority=49]
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
          - global_constants.TRAVEL_BUFFER_MINUTES
        distinguishing_aspect: |
          BUFFERED-INTERVAL geometry on the Technician resource: a candidate window
          that starts exactly when the existing one ends (11:00Z) still collides
          because the 45-minute buffer pushes the candidate's lower edge back to
          10:15Z, and the same candidate moved to 11:45Z (buffered lower edge exactly
          11:00Z) is accepted because the overlap test is strict.
