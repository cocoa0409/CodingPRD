  - rule_id: cross_entity_state_dependency
    instances:

      - name: cycle_settle_blocked_by_a_dispute_row_in_another_aggregate
        grounds:
          - validations.priority_49_ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT
          - state_machines.SettlementCycle.EXCHANGED_to_SETTLED
          - state_machines.Dispute.OPEN_to_ACCEPTED
          - calculations.settlement_statement
          - entities.HireLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          The cycle itself is in a perfectly legal state for settlement (EXCHANGED, acted
          on by the payer BN, inside its window), yet POST .../settle must fail with 409
          ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT purely because a row in a DIFFERENT entity
          (Dispute, status OPEN) points at it. Resolving that foreign row — CX accepting
          at the filed 4700 — unblocks the identical call, which then settles at the
          RECONCILED net of 13938 rather than the AS_REPORTED 18614, and mints
          SETTLEMENT_PAYMENT of -13938. The blocking condition is state-of-another-entity,
          not any field on SettlementCycle.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI; three CX-owned cars produce BN segments of 8775, 5233 and 4700 gross."
            - "The 2026-08 cycle (payer BN, payee CX) is computed at 2026-09-01T00:00:00Z (net 18614) and exchanged."
            - "BN files a dispute against the 4700 empty-car line for its full amount; the dispute sits in OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
