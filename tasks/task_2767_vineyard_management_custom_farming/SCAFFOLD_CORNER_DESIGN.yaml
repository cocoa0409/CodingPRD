        distinguishing_aspect: "(block_id, plan_year) is unique regardless of plan_status: a second 2026 plan for B-12 returns ERR_DUPLICATE_PLAN_FOR_BLOCK_YEAR at HTTP 409 even while the first is still DRAFT, but a 2027 plan for the same block is accepted."
