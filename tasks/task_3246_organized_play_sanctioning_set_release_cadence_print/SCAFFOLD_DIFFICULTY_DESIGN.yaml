  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: two different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: release_must_reach_released_before_application_can_be_approved
        grounds:
          - state_machines.EventApplication.status.SUBMITTED_to_APPROVED
          - state_machines.SetRelease.status.PRERELEASE_to_RELEASED
          - errors[ERR_SET_NOT_STREET_LEGAL]
        distinguishing_aspect: "The SetRelease -> EventApplication pair: approval is blocked while the cited release is PRERELEASE and becomes legal exactly when the release settles to RELEASED, so the child's transition set is a function of the parent's state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one store with daily_event_capacity 8 and event_space_capacity 8; one FIXED format; one LOCAL application on the release."
            - "The clock is advanced to 2026-09-12T12:00:00Z, inside the prerelease weekend, so the release is PRERELEASE."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T12:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 409 and ${eid} == \"ERR_SET_NOT_STREET_LEGAL\""
            - "SetRelease.${set_id}.status == PRERELEASE at the moment of refusal"
            - "EventApplication.${app_id}.status == SUBMITTED and EventApplication.${app_id}.prize_allocation_id is null, so no pool was synthesized"
            - "advancing the clock to 2026-09-18T00:00:00Z moves SetRelease.${set_id}.status to RELEASED, after which the identical APPROVE call succeeds and sets prize_allocation_id"

      - name: store_must_be_active_before_distributions_can_pass
        grounds:
          - state_machines.PrizeDistribution.status.PROPOSED_to_PASSED
          - state_machines.Store.status.ACTIVE_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The Store -> PrizeDistribution pair: a distribution can only PASS while its store's allocation is OPEN, and the Store transition to SUSPENDED propagates through the allocation so the distribution's valid transition set collapses — a different entity pair from the release-to-application dependency."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, one LOCAL application approved with a BUNDLED pool of base_tp 16; one PROPOSED distribution of 5 points."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-distributions"
              payload: { prize_allocation_id: "${alloc_id}", recipient_ref: "PLAYER-5", quantity: 5 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /op/stores/${store_id}/transition"
              payload: { action: "SUSPEND", reason: "Report-handling audit failure" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "PASS" }
              as: OpsAdmin
              captures: { eid2: $.data.error_id }
          assert:
            - "the response status is 409 and ${eid2} == \"ERR_INVALID_STATE\""
            - "Store.${store_id}.status == SUSPENDED and PrizeAllocation.${alloc_id}.status == RELEASED"
            - "PrizeDistribution.${dist_id}.status == PROPOSED and PrizeAllocation.${alloc_id}.total_drawn_tp == 0"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: two different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: event_space_capacity_aggregate_with_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_EVENT_SPACE_CAPACITY]
          - entities.Store.fields.event_space_capacity
        distinguishing_aspect: "Aggregate occupancy-with-buffer semantics on the store's event space: two events that are adjacent-but-disjoint raw still collide once each is padded by 30 minutes, so the conflict is driven by a cover count over padded intervals rather than a pairwise intersection."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store with daily_event_capacity 8 and event_space_capacity 1; one FIXED format."
            - "Application A is APPROVED for 2026-09-26T18:00:00Z, occupying raw 18:00-24:00 and padded 17:30-00:30."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 1 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_a: $.data.id }
            - call: "POST /op/event-applications/${app_a}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-27T00:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_b: $.data.id }
          trigger:
            - call: "POST /op/event-applications/${app_b}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 422 and ${eid} == \"ERR_EVENT_SPACE_CAPACITY\""
            - "the two raw sessions touch at 2026-09-27T00:00:00Z without overlapping, so the refusal is caused by the buffered cover count and not by raw intersection"
            - "EventApplication.${app_b}.status == SUBMITTED"

      - name: pairwise_half_open_boundary_is_legal
        grounds:
          - validations[priority=12]
          - state_machines.EventApplication.status.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Half-open pairwise semantics on the same resource but a disjoint geometry: with a padding-free capacity of 2 the touching pair 18:00-24:00 and 00:00-06:00 shares exactly one boundary instant and is accepted, whereas a one-minute inward shift is rejected."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store with daily_event_capacity 8 and event_space_capacity 4 so the aggregate rule cannot fire; one FIXED format."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 4 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_a: $.data.id }
            - call: "POST /op/event-applications/${app_a}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-27T00:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_touch: $.data.id }
            - call: "POST /op/event-applications/${app_touch}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-27T00:01:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_shift: $.data.id }
            - call: "POST /op/event-applications/${app_shift}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { eid2: $.data.error_id }
          assert:
            - "the touching application ${app_touch} approves with status APPROVED because [scheduled_date, scheduled_date + 6 hours] is half-open"
            - "the one-minute-shifted application returns 422 with ${eid2} == \"ERR_EVENT_WINDOW_OVERLAP\""
            - "EventApplication.${app_shift}.status == SUBMITTED"

  # ===========================================================================
  # Rule 9 — compensating_invariant: two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: pool_points_conserved_across_pass_void_pair
        grounds:
          - calculations.prize_pool_remaining
          - state_machines.PrizeDistribution.status.PASSED_to_VOIDED
          - state_machines.PrizeAllocation.status.CLOSED_to_OPEN
        distinguishing_aspect: "Conserves allocation points: PASS then VOID of the same distribution leaves ALLOC_INVARIANT = base_tp - total_drawn_tp + total_restored_tp unchanged at 48, so remaining_tp returns to its pre-draw value with zero drift."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, one QUALIFIER application approved with a BUNDLED pool of base_tp 48; one PROPOSED distribution of 20 points."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "QUALIFIER", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-distributions"
              payload: { prize_allocation_id: "${alloc_id}", recipient_ref: "PLAYER-20", quantity: 20 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "PASS" }
              as: OpsAdmin
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "VOID" }
              as: OpsAdmin
          assert:
            - "PrizeAllocation.${alloc_id}.base_tp == 48"
            - "after PASS PrizeAllocation.${alloc_id}.total_drawn_tp == 20 and remaining_tp == 28"
            - "after VOID PrizeAllocation.${alloc_id}.total_restored_tp == 20 and remaining_tp == 48 again"
            - "ALLOC_INVARIANT = base_tp - total_drawn_tp + total_restored_tp == 48 before PASS and == 48 after VOID, so drift is exactly 0"
            - "Store.${store_id}.tp_balance == 48"

      - name: physical_grant_points_conserved_within_draw_and_restore
        grounds:
          - state_machines.CodeRedemption.physical_grant_status.RESERVED_to_DISBURSED
          - calculations.prize_pool_remaining
          - errors[ERR_INSUFFICIENT_POOL]
        distinguishing_aspect: "Conserves a different quantity — the physical-grant pair draws and restores an identical floored amount inside one transaction, so a disbursement can never leave the pool short even though it is modelled as a draw."
        test_recipe:
          setup:
            - "Logical clock past street_date + 7 days; one store, one FIXED format, one LOCAL application approved with a BUNDLED pool of base_tp 16 raised to 166; one PHYSICAL card REDEEMED so its grant is RESERVED."
            - "The application is COMPLETED in setup so the disbursement precondition holds before the trigger."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-allocations/${alloc_id}/transition"
              payload: { action: "INCREASE_REPRINT_RUN", additional_tp: 150 }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "PHY-4", code_kind: "PHYSICAL", event_application_id: "${app_id}" }
              as: OpsAdmin
              captures: { red_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "PHY-4", code_kind: "PHYSICAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-26T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "COMPLETE" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /op/code-redemptions/${red_id}/transition"
              payload: { action: "DISBURSE" }
              as: OpsAdmin
          assert:
            - "CodeRedemption.${red_id}.physical_grant_status == DISBURSED"
            - "PrizeAllocation.${alloc_id}.total_drawn_tp == 40 and PrizeAllocation.${alloc_id}.total_restored_tp == 40"
            - "PrizeAllocation.${alloc_id}.remaining_tp == 166 so the conserved GRANT_PAIR = total_drawn_tp - total_restored_tp from disbursements is exactly 0"
            - "PrizeAllocation.${alloc_id}.status == OPEN and no ERR_INSUFFICIENT_POOL was raised"
