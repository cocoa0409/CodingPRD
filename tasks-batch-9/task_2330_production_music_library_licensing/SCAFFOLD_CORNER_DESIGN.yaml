        grounds:
          - calculations.license_fee_quote.formula
          - calculations.license_fee_quote.constants
          - calculations.license_fee_quote.precision
        distinguishing_aspect: |
          Exercises the widest factor product the rate card allows (WORLDWIDE × 24 months ×
          exclusivity × rush) together with all three addon kinds, so a solution that rounds after
          adding the addons or applies the discount to the core alone diverges; the second quote pins
          the opposite corner (LOCAL, 3-month TERM_FACTOR 0.70, no addons, 0.00% discount tier).
        test_recipe:
          setup:
            - "One ACTIVE ROYALTY_SPLIT agreement (sync fee share 40.00), one CATALOGED work, two tiers (ONLINE-STD base 250000 / ONLINE_AD, GAME-STD base 210000 / GAME) and one licensee with a 5000000 limit."
