            - { call: "POST /v1/payments/${adv_id}/requeue", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/payments/${adv_id}/approve", payload: {}, as: Adjuster }
            - { call: "POST /v1/payments/${adv_id}/issue", payload: {}, as: Adjuster }
            - { call: "POST /v1/payments/${adv_id}/clear", payload: {}, as: ContractorAdmin }
            - { call: "GET /v1/invoices/${inv_id}", payload: {}, as: ContractorAdmin, captures: { out_reclear: $.data.outstanding_cents } }
            - { call: "POST /v1/claims/${cl_id}/payments", payload: { type: "DEDUCTIBLE", amount_cents: 50000 }, as: Customer, as_user_id: "${cust_id}", captures: { ded_id: $.data.id } }
            - { call: "POST /v1/payments/${ded_id}/approve", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/payments/${ded_id}/issue", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/payments/${ded_id}/clear", payload: {}, as: ContractorAdmin }
            - { call: "GET /v1/invoices/${inv_id}", payload: {}, as: ContractorAdmin, captures: { inv_final: $.data.status, out_final: $.data.outstanding_cents } }
            - { call: "GET /v1/claims/${cl_id}", payload: {}, as: ContractorAdmin, captures: { cl_final: $.data.status, ded_collected: $.data.deductible_collected_cents } }
          assert:
            - "captured out_issued == 500000  # 500,000 = 500,000 + 0 cleared"
            - "captured out_after_return == 500000  # clawback restores: invariant 500,000 == outstanding + cleared_sum holds with cleared_sum back to 0"
            - "captured out_reclear == 50000  # re-presented and cleared: 500,000 = 50,000 + 450,000"
            - "captured inv_final == SETTLED and out_final == 0"
            - "captured cl_final == CLOSED and ded_collected == 50000  # exactly the deductible; auto-close bubble-up"
      - name: code_upgrade_approve_and_withdraw_preserve_bucket
        grounds:
          - calculations.ordinance_law_waterfall
          - state_machines.CodeUpgrade.IDENTIFIED_to_APPROVED
          - state_machines.CodeUpgrade.APPROVED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: ordinance bucket — consumed_cents + remaining ==
          limit (250,000c) across the approve/withdraw pair: approving a
          150,000c item consumes 150,000; withdrawing it returns the bucket to
          exactly 0 consumed, and a fresh 250,000c item then approves fully
          covered — proving the release was cent-exact. Different conserved
          quantity than the invoice-balance invariant.
        test_recipe:
          setup:
            - "Policy coverage_a 2,500,000, ordinance pct 0.10, cap 300,000 -> limit 250,000; claim HAIL INTAKE; CodeUpgrade A estimated 150,000"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-W", coverage_a_limit_cents: 2500000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, ordinance_coverage_pct: 0.10, ordinance_flat_cap_cents: 300000, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "HAIL", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/code-upgrades", payload: { code_citation: "IRC R905.1", description: "Ice barrier underlayment", estimated_cost_cents: 150000 }, as: Estimator, captures: { cu_a: $.data.id } }
            - { call: "POST /v1/code-upgrades/${cu_a}/approve", payload: {}, as: Adjuster, captures: { a_cov: $.data.covered_cents } }
            - { call: "GET /v1/claims/${cl_id}/financial-summary", payload: {}, as: Estimator, captures: { consumed_mid: $.data.ordinance_consumed_cents } }
          trigger:
            - { call: "POST /v1/code-upgrades/${cu_a}/withdraw", payload: {}, as: Estimator, captures: { a_status: $.data.status } }
            - { call: "GET /v1/claims/${cl_id}/financial-summary", payload: {}, as: Estimator, captures: { consumed_after: $.data.ordinance_consumed_cents, limit: $.data.ordinance_limit_cents } }
            - { call: "POST /v1/claims/${cl_id}/code-upgrades", payload: { code_citation: "IBC 1010", description: "Egress door widening", estimated_cost_cents: 250000 }, as: Estimator, captures: { cu_b: $.data.id } }
            - { call: "POST /v1/code-upgrades/${cu_b}/approve", payload: {}, as: Adjuster, captures: { b_cov: $.data.covered_cents } }
          assert:
            - "captured a_cov == 150000 and consumed_mid == 150000  # forward action"
            - "captured a_status == WITHDRAWN and consumed_after == 0  # compensation restores the bucket cent-exactly"
            - "captured limit == 250000 and (consumed_after + (limit - consumed_after)) == 250000  # conserved quantity"
            - "captured b_cov == 250000  # full bucket available again: proof of zero drift"
