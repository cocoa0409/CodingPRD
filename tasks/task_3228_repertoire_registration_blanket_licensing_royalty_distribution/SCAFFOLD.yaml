# SCAFFOLD — Repertoire Registration, Blanket Licensing & Royalty Distribution (BMI-like PRO)
# Seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design (§1.9) live in sibling files.

scenario: >-
  Repertoire Registration, Blanket Licensing & Royalty Distribution (BMI): songwriter and publisher
  affiliation with work registration including share splits and co-writer claims, conflicting
  registration resolution when shares from different parties exceed the whole, blanket license
  issuance to broadcasters, digital services and venues with rate structures by category, rate court
  and negotiated license processes when licensees dispute fees, performance data collection from
  monitoring, cue sheets and digital reporting with sampling for unmonitored media, royalty pool
  allocation converting performances into payments with weighting by medium and time of day,
  distribution schedules with adjustments and claims periods, audit rights and unclaimed royalty
  handling

domain_name: repertoire-licensing-royalty
api_prefix: /pro

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Affiliate
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the songwriter or publisher" }
      - { name: party_type, type: enum, source: input, description: "Kind of affiliated party", constraints: "SONGWRITER | PUBLISHER" }
      - { name: affiliation_code, type: string, source: input, description: "Party-assigned mnemonic code; unique across all affiliates", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "Affiliation lifecycle state", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: royalty_balance_cents, type: integer, source: computed, description: "Unpaid net royalty ledger balance; debited by payable statements, credited by post-distribution adjustments" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Cumulative lifetime amount actually paid across all distributions" }

  - name: Work
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Work title as registered" }
      - { name: alternate_titles, type: array, source: input, description: "Alternate title strings used for performance matching", default: [] }
      - { name: registered_by_affiliate_id, type: string, source: input, description: "FK -> Affiliate.id; affiliate (usually the publisher) that submitted the registration" }
      - { name: status, type: enum, source: system, description: "Work registration lifecycle", default: REGISTERED, constraints: "REGISTERED | IN_CONFLICT | CONFIRMED | WITHDRAWN" }
      - { name: confirmed_at, type: datetime, source: system, description: "Timestamp the work reached CONFIRMED; null until then" }
      - { name: aggregate_interest_bps, type: integer, source: computed, description: "Sum of interest_share_bps over ShareClaims with status ACCEPTED (SUBMITTED pending and DISPUTED claims are excluded until resolved); recomputed on every share mutation" }

  - name: ShareClaim
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; work the claim attaches to" }
      - { name: affiliate_id, type: string, source: input, description: "FK -> Affiliate.id; affiliate asserting ownership" }
      - { name: role, type: enum, source: input, description: "Writer or publisher share", constraints: "WRITER | PUBLISHER" }
      - { name: collection_share_bps, type: integer, source: input, description: "Share of collections routed to this affiliate, basis points of the whole work (10000 bps = 100%)" , constraints: "1..10000" }
      - { name: interest_share_bps, type: integer, source: input, description: "Share of ownership interest asserted; drives conflict detection; basis points", constraints: "1..10000" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", default: SUBMITTED, constraints: "SUBMITTED | ACCEPTED | DISPUTED | REVOKED" }

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of broadcaster, digital service, or venue operator" }
      - { name: category, type: enum, source: input, description: "Licensee market category driving the rate structure", constraints: "BROADCASTER | DIGITAL_SERVICE | VENUE" }
      - { name: reported_revenue_cents, type: integer, source: input, description: "Latest annual gross revenue self-reported by the licensee; basis for blanket fee", constraints: ">= 0" }
      - { name: usage_units, type: integer, source: input, description: "Annual usage units (digital: streams; venue: events; broadcasters report 0)", constraints: ">= 0" }
      - { name: blanket_fee_cents, type: integer, source: computed, description: "Annual blanket fee per fee_engine calculation; recomputed on licensee revenue/usage update and on license issuance/renewal" }
      - { name: credit_standing, type: enum, source: system, description: "Payment standing gate for issuance", default: GOOD, constraints: "GOOD | DELINQUENT" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; licensee holding the blanket license" }
      - { name: category, type: enum, source: system, description: "Copied from Licensee.category at issuance; immutable thereafter", constraints: "BROADCASTER | DIGITAL_SERVICE | VENUE" }
      - { name: effective_date, type: string, source: input, description: "First covered day, ISO date (inclusive)" }
      - { name: expiry_date, type: string, source: input, description: "Last covered day, ISO date (inclusive); must be > effective_date" }
      - { name: status, type: enum, source: system, description: "License lifecycle", default: ACTIVE, constraints: "ACTIVE | DISPUTED | SUSPENDED | EXPIRED | TERMINATED" }
      - { name: fee_basis_cents, type: integer, source: system, description: "Licensee.blanket_fee_cents snapshot pinned at issuance; fees for performances under this license always use this pinned basis" }

  - name: RateDispute
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license whose fees are disputed" }
      - { name: opened_by_role, type: enum, source: input, description: "Party initiating the dispute", constraints: "LICENSEE | PRO" }
      - { name: disputed_fee_cents, type: integer, source: input, description: "Fee amount the initiating party asserts is correct" }
      - { name: status, type: enum, source: system, description: "Dispute negotiation lifecycle (cyclic negotiation loop)", default: OPEN, constraints: "OPEN | NEGOTIATION | RATE_COURT | SETTLED | WITHDRAWN" }
      - { name: settled_fee_cents, type: integer, source: system, description: "Final agreed or adjudicated fee; set at SETTLED, null until then" }
      - { name: negotiation_rounds, type: integer, source: system, description: "Count of NEGOTIATION entries; increments on each return to NEGOTIATION", default: 0 }

  - name: RateCourtCase
    parent: null
    common_fields: true
    fields:
      - { name: dispute_id, type: string, source: input, description: "FK -> RateDispute.id; dispute escalated to rate court", constraints: "at most one non-DISMISSED case per dispute" }
      - { name: status, type: enum, source: system, description: "Court case lifecycle", default: FILED, constraints: "FILED | HEARING | DECIDED | DISMISSED" }
      - { name: adjudicated_fee_cents, type: integer, source: system, description: "Fee set by the court at DECIDED; null until then" }

  - name: PerformanceEvent
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; work performed; must be status CONFIRMED at ingestion" }
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license covering the performance; must cover performance_date" }
      - { name: performance_date, type: string, source: input, description: "ISO date of the performance" }
      - { name: medium, type: enum, source: input, description: "Carriage medium", constraints: "TERRESTRIAL_RADIO | NETWORK_TV | CABLE_TV | DIGITAL_STREAMING | LIVE_VENUE" }
      - { name: daypart, type: enum, source: input, description: "Time-of-day bucket", constraints: "PRIME | DAY | LATE_NIGHT | OVERNIGHT" }
      - { name: source, type: enum, source: input, description: "Reporting channel", constraints: "MONITORING | CUE_SHEET | DIGITAL_REPORT | SAMPLE" }
      - { name: play_count, type: integer, source: input, description: "Reported plays; for SAMPLE rows this is the sample count before expansion", constraints: ">= 1" }
      - { name: universe_estimated_plays, type: integer, source: computed, description: "Estimated true plays: play_count for census sources; expanded per sampled_projection for SAMPLE rows" }
      - { name: credit_units, type: number, source: computed, description: "Weight applied per royalty_allocation after genre feature bonuses; equals performance_weight(universe) adjusted by feature bonus" }
      - { name: cycle_id, type: string, source: system, description: "FK -> DistributionCycle.id; set when the event is captured into a cycle pool; null while free" }
      - { name: rejection_error_id, type: string, source: system, description: "On REJECTED rows (bulk ingest failures): the error_id that failed the row (e.g. ERR_WORK_NOT_CONFIRMED); null otherwise" }
      - { name: status, type: enum, source: system, description: "Ingestion lifecycle", default: ACCEPTED, constraints: "ACCEPTED | REJECTED | VOIDED" }

  - name: DistributionCycle
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label, e.g. 2026Q1", constraints: "unique" }
      - { name: period_start, type: string, source: input, description: "First performance date in scope, ISO date (inclusive)" }
      - { name: period_end, type: string, source: input, description: "Last performance date in scope, ISO date (inclusive); >= period_start" }
      - { name: status, type: enum, source: system, description: "Cycle lifecycle", default: DRAFT, constraints: "DRAFT | COLLECTING | CALCULATING | DISTRIBUTED | ADJUSTED" }
      - { name: pool_amount_cents, type: integer, source: computed, description: "Distributable pool = pinned fee_basis_cents of licenses covering the period minus ADMIN deduct; set at CALCULATING" }
      - { name: claims_open_until, type: string, source: system, description: "ISO date; adjustment claims accepted while logical clock date <= this; equals period_end + CLAIMS_WINDOW_DAYS" }
      - { name: version_epoch, type: integer, source: system, description: "Allocation computation epoch; increments on every CALCULATING re-entry", default: 0 }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> DistributionCycle.id; cycle this statement belongs to" }
      - { name: affiliate_id, type: string, source: input, description: "FK -> Affiliate.id; payee" }
      - { name: epoch, type: integer, source: system, description: "Cycle.version_epoch this statement was computed under; statements of earlier epochs are superseded" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Pre-deduction royalty per royalty_allocation" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Administration fee withheld per admin_fee calculation" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_amount_cents - admin_fee_cents; the affiliate ledger credit is net_amount_cents - unclaimed_amount_cents" }
      - { name: unclaimed_amount_cents, type: integer, source: computed, description: "Portion of net not payable because the affiliate lacks any ACCEPTED share or is non-ACTIVE; routed to unclaimed pool" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", default: DRAFT, constraints: "DRAFT | FINALIZED | PAID | ADJUSTED" }

  - name: RoyaltyAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> RoyaltyStatement.id; statement being adjusted" }
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; copied from statement" }
      - { name: delta_cents, type: integer, source: input, description: "Signed adjustment applied to the affiliate ledger; negative claws back" }
      - { name: reason, type: enum, source: input, description: "Adjustment origin", constraints: "LATE_CLAIM | AUDIT_FINDING | RATE_COURT_RETRO | DATA_CORRECTION" }
      - { name: audit_id, type: string, source: input, description: "FK -> AuditRequest.id; REQUIRED when reason == AUDIT_FINDING (links the remedy to the audit that found it), forbidden otherwise", constraints: "required iff reason == AUDIT_FINDING" }
      - { name: status, type: enum, source: system, description: "Approval lifecycle (segregation of duties)", default: PENDING, constraints: "PENDING | APPROVED | REJECTED | APPLIED" }

  - name: AuditRequest
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; audit target" }
      - { name: scope_period_start, type: string, source: input, description: "First date of audit scope, ISO date" }
      - { name: scope_period_end, type: string, source: input, description: "Last date of audit scope, ISO date; must be within AUDIT_LOOKBACK_DAYS of initiation" }
      - { name: status, type: enum, source: system, description: "Audit lifecycle", default: OPEN, constraints: "OPEN | FINDINGS_FILED | CLOSED" }
      - { name: findings_delta_cents, type: integer, source: system, description: "Signed aggregate finding; positive means licensee underpaid", default: 0 }

  - name: UnclaimedRoyaltyPool
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> DistributionCycle.id; owning cycle", constraints: "exactly one pool row per cycle" }
      - { name: balance_cents, type: integer, source: computed, description: "Unclaimed royalties held; increased by distribution routing, decreased by escheatment and by successful late claims" }
      - { name: status, type: enum, source: system, description: "Pool lifecycle", default: OPEN, constraints: "OPEN | PARTIALLY_ESCHEATED | ESCHEATED" }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Work
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /pro/works/{id}/confirm"
        actor: ProRegistrar
        preconditions:
          - "work.aggregate_interest_bps <= 10000"
          - "at least one ShareClaim of the work is ACCEPTED"
          - "no ShareClaim of the work is in DISPUTED status"
        side_effects:
          - "work.confirmed_at := clock now"
          - "increments Work.version by 1"
        note: "Direct confirm only when shares never conflicted; conflicted works confirm via resolution."
      - from: REGISTERED
        to: IN_CONFLICT
        trigger: "system: share_claim_conflict_check detects work.aggregate_interest_bps > 10000 after a ShareClaim create/update"
        actor: system
        preconditions:
          - "work.aggregate_interest_bps > 10000"
        side_effects:
          - "the newly inserted SUBMITTED ShareClaim(s) whose insertion pushed the aggregate over 10000 are set to DISPUTED; previously ACCEPTED claims on the work remain ACCEPTED"
          - "increments Work.version by 1"
      - from: IN_CONFLICT
        to: CONFIRMED
        trigger: "POST /pro/works/{id}/resolve-conflict"
        actor: ProRegistrar
        preconditions:
          - "work.status == IN_CONFLICT"
          - "every DISPUTED claim on the work appears in exactly one of accept_claim_ids / revoke_claim_ids; ids listed must belong to this work"
          - "after applying the request's disposition, work.aggregate_interest_bps <= 10000 AND no DISPUTED claims remain"
        side_effects:
          - "claims listed in accept_claim_ids := ACCEPTED (their interest_share_bps now counts toward the aggregate)"
          - "claims listed in revoke_claim_ids := REVOKED (compensation: their interest_share_bps never counted and is removed from the aggregate)"
          - "work.aggregate_interest_bps recomputed as sum over ACCEPTED claims"
          - "work.confirmed_at := clock now"
          - "increments Work.version by 1"
      - from: IN_CONFLICT
        to: REGISTERED
        trigger: "system: the last DISPUTED ShareClaim of the work is REVOKED (leaving no DISPUTED claims and aggregate_interest_bps <= 10000)"
        actor: system
        preconditions:
          - "work.aggregate_interest_bps <= 10000"
          - "count of DISPUTED claims on the work == 0"
        side_effects:
          - "increments Work.version by 1"
        note: "Cycle IN_CONFLICT -> REGISTERED -> IN_CONFLICT is allowed across successive over-claim episodes."
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /pro/works/{id}/withdraw"
        actor: Publisher
        preconditions:
          - "caller is the work's registered_by_affiliate_id and is a PUBLISHER affiliate"
          - "no PerformanceEvent with status ACCEPTED references the work"
        side_effects:
          - "all non-REVOKED ShareClaims of the work := REVOKED"
          - "increments Work.version by 1"
      - from: IN_CONFLICT
        to: WITHDRAWN
        trigger: "POST /pro/works/{id}/withdraw"
        actor: Publisher
        preconditions:
          - "caller is the work's registered_by_affiliate_id and is a PUBLISHER affiliate"
          - "no PerformanceEvent with status ACCEPTED references the work"
        side_effects:
          - "all non-REVOKED ShareClaims of the work := REVOKED"
          - "work.aggregate_interest_bps := 0"
          - "increments Work.version by 1"

  - entity: ShareClaim
    initial_state: SUBMITTED
    terminal_states: [REVOKED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /pro/works/{work_id}/share-claims (auto-accept when, after insert, work.aggregate_interest_bps <= 10000)"
        actor: system
        preconditions:
          - "work.aggregate_interest_bps <= 10000 after including this claim"
        side_effects:
          - "work.aggregate_interest_bps recomputed (adds this claim's interest_share_bps)"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "system: share_claim_conflict_check marks the claim when the work flips IN_CONFLICT"
        actor: system
        preconditions:
          - "work.aggregate_interest_bps > 10000"
        side_effects:
          - "work.status := IN_CONFLICT (if not already)"
      - from: ACCEPTED
        to: DISPUTED
        trigger: "POST /pro/share-claims/{id}/dispute — another claim holder challenges an already-ACCEPTED claim, re-opening conflict"
        actor: Publisher
        preconditions:
          - "caller affiliate holds a non-REVOKED ShareClaim on the same work"
          - "caller affiliate != share_claim.affiliate_id"
        side_effects:
          - "work.status := IN_CONFLICT"
          - "work aggregate recomputed (unchanged; conflict is adversarial, not arithmetic)"
      - from: DISPUTED
        to: ACCEPTED
        trigger: "POST /pro/works/{id}/resolve-conflict listing this claim in accept_claim_ids"
        actor: ProRegistrar
        preconditions:
          - "work.status == IN_CONFLICT"
          - "post-resolution work.aggregate_interest_bps <= 10000"
        side_effects:
          - "work.aggregate_interest_bps recomputed"
      - from: DISPUTED
        to: REVOKED
        trigger: "POST /pro/works/{id}/resolve-conflict listing this claim in revoke_claim_ids"
        actor: ProRegistrar
        preconditions:
          - "work.status == IN_CONFLICT"
        side_effects:
          - "work.aggregate_interest_bps recomputed (compensation: the DISPUTED claim never counted; aggregate stays the sum over ACCEPTED claims)"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /pro/share-claims/{id}/revoke"
        actor: Publisher
        preconditions:
          - "caller affiliate == share_claim.affiliate_id"
          - "no FINALIZED-or-later RoyaltyStatement for any cycle has routed royalties on this claim"
        side_effects:
          - "work.aggregate_interest_bps recomputed"
          - "if work was IN_CONFLICT and now clean, work transitions IN_CONFLICT -> REGISTERED"

  - entity: License
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: DISPUTED
        trigger: "POST /pro/licenses/{id}/disputes (RateDispute opened on this license)"
        actor: Licensee
        preconditions:
          - "license.status == ACTIVE"
          - "no OPEN/NEGOTIATION/RATE_COURT dispute already exists for this license"
        side_effects:
          - "creates RateDispute(status=OPEN)"
          - "increments License.version by 1"
      - from: DISPUTED
        to: ACTIVE
        trigger: "system: the license's RateDispute reaches SETTLED or WITHDRAWN"
        actor: system
        preconditions:
          - "linked dispute.status IN {SETTLED, WITHDRAWN}"
        side_effects:
          - "if dispute settled_fee_cents differs from licensee.blanket_fee_cents, licensee.blanket_fee_cents := settled_fee_cents (license.fee_basis_cents stays pinned)"
          - "if settled_fee_cents < fee_basis_cents, creates a RoyaltyAdjustment(reason=RATE_COURT_RETRO) is NOT created here; retro deltas are computed at next cycle via fee_basis pinning rules"
          - "increments License.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pro/licenses/{id}/suspend"
        actor: ProLicensingAdmin
        preconditions:
          - "licensee.credit_standing == DELINQUENT"
        side_effects:
          - "new PerformanceEvent ingestion under this license is rejected with ERR_LICENSE_SUSPENDED"
          - "increments License.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pro/licenses/{id}/reinstate"
        actor: ProLicensingAdmin
        preconditions:
          - "licensee.credit_standing == GOOD"
        side_effects:
          - "increments License.version by 1"
      - from: DISPUTED
        to: SUSPENDED
        trigger: "POST /pro/licenses/{id}/suspend"
        actor: ProLicensingAdmin
        preconditions:
          - "licensee.credit_standing == DELINQUENT"
        side_effects:
          - "increments License.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock date advances beyond license.expiry_date (checked on clock set and on any license read)"
        actor: system
        preconditions:
          - "clock date > license.expiry_date"
        side_effects:
          - "increments License.version by 1"
      - from: DISPUTED
        to: EXPIRED
        trigger: "system: logical clock date advances beyond license.expiry_date while dispute unresolved"
        actor: system
        preconditions:
          - "clock date > license.expiry_date"
        side_effects:
          - "increments License.version by 1"
        note: "Expiry does not settle the dispute; dispute continues and may produce retro adjustments."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pro/licenses/{id}/terminate"
        actor: ProLicensingAdmin
        preconditions:
          - "audit against this licensee is CLOSED or none OPEN"
        side_effects:
          - "increments License.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /pro/licenses/{id}/terminate"
        actor: ProLicensingAdmin
        preconditions: []
        side_effects:
          - "increments License.version by 1"

  - entity: RateDispute
    initial_state: OPEN
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: NEGOTIATION
        trigger: "POST /pro/disputes/{id}/negotiate"
        actor: ProLicensingAdmin
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "dispute.negotiation_rounds += 1"
          - "increments RateDispute.version by 1"
      - from: NEGOTIATION
        to: NEGOTIATION
        trigger: "POST /pro/disputes/{id}/negotiate (further round with a new counter-offer)"
        actor: Licensee
        preconditions:
          - "dispute.status == NEGOTIATION"
          - "payload.counter_fee_cents differs from the last offered fee"
        side_effects:
          - "dispute.negotiation_rounds += 1"
          - "increments RateDispute.version by 1"
        note: "Cyclic loop: NEGOTIATION -> NEGOTIATION permits unbounded rounds."
      - from: NEGOTIATION
        to: SETTLED
        trigger: "POST /pro/disputes/{id}/settle"
        actor: ProLicensingAdmin
        preconditions:
          - "dispute.status == NEGOTIATION"
          - "payload.agreed_fee_cents >= 0"
        side_effects:
          - "dispute.settled_fee_cents := payload.agreed_fee_cents"
          - "license transitions DISPUTED -> ACTIVE"
          - "licensee.blanket_fee_cents := agreed_fee_cents when agreed_fee_cents != licensee.blanket_fee_cents"
          - "increments RateDispute.version by 1"
      - from: OPEN
        to: RATE_COURT
        trigger: "POST /pro/disputes/{id}/escalate (creates RateCourtCase FILED)"
        actor: Licensee
        preconditions:
          - "dispute.status IN {OPEN, NEGOTIATION}"
          - "no non-DISMISSED RateCourtCase exists for this dispute"
        side_effects:
          - "creates RateCourtCase(status=FILED)"
          - "increments RateDispute.version by 1"
      - from: NEGOTIATION
        to: RATE_COURT
        trigger: "POST /pro/disputes/{id}/escalate"
        actor: Licensee
        preconditions:
          - "no non-DISMISSED RateCourtCase exists for this dispute"
        side_effects:
          - "creates RateCourtCase(status=FILED)"
          - "increments RateDispute.version by 1"
      - from: RATE_COURT
        to: SETTLED
        trigger: "system: linked RateCourtCase reaches DECIDED"
        actor: system
        preconditions:
          - "rate_court_case.status == DECIDED"
        side_effects:
          - "dispute.settled_fee_cents := rate_court_case.adjudicated_fee_cents"
          - "license transitions DISPUTED -> ACTIVE (or remains EXPIRED; retro path via adjustments)"
          - "licensee.blanket_fee_cents := adjudicated_fee_cents"
          - "increments RateDispute.version by 1"
      - from: RATE_COURT
        to: NEGOTIATION
        trigger: "system: linked RateCourtCase is DISMISSED before decision"
        actor: system
        preconditions:
          - "rate_court_case.status == DISMISSED"
        side_effects:
          - "dispute.negotiation_rounds += 1"
          - "increments RateDispute.version by 1"
        note: "Cycle: NEGOTIATION -> RATE_COURT -> NEGOTIATION on dismissal."
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /pro/disputes/{id}/withdraw"
        actor: Licensee
        preconditions:
          - "dispute.opened_by_role == LICENSEE"
          - "caller licensee == dispute.license.licensee_id"
        side_effects:
          - "license transitions DISPUTED -> ACTIVE"
          - "increments RateDispute.version by 1"
      - from: NEGOTIATION
        to: WITHDRAWN
        trigger: "POST /pro/disputes/{id}/withdraw"
        actor: Licensee
        preconditions:
          - "dispute.opened_by_role == LICENSEE"
        side_effects:
          - "license transitions DISPUTED -> ACTIVE"
          - "increments RateDispute.version by 1"

  - entity: RateCourtCase
    initial_state: FILED
    terminal_states: [DECIDED, DISMISSED]
    transitions:
      - from: FILED
        to: HEARING
        trigger: "POST /pro/rate-court-cases/{id}/open-hearing"
        actor: RateCourtOfficer
        preconditions:
          - "case.status == FILED"
        side_effects:
          - "increments RateCourtCase.version by 1"
      - from: HEARING
        to: DECIDED
        trigger: "POST /pro/rate-court-cases/{id}/decide"
        actor: RateCourtOfficer
        preconditions:
          - "case.status == HEARING"
          - "payload.adjudicated_fee_cents >= 0"
        side_effects:
          - "case.adjudicated_fee_cents := payload.adjudicated_fee_cents"
          - "dispute transitions RATE_COURT -> SETTLED with settled_fee_cents := adjudicated_fee_cents"
          - "licensee.blanket_fee_cents := adjudicated_fee_cents"
          - "increments RateCourtCase.version by 1"
      - from: FILED
        to: DISMISSED
        trigger: "POST /pro/rate-court-cases/{id}/dismiss"
        actor: RateCourtOfficer
        preconditions:
          - "case.status == FILED"
        side_effects:
          - "dispute transitions RATE_COURT -> NEGOTIATION (rounds += 1)"
          - "increments RateCourtCase.version by 1"

  - entity: PerformanceEvent
    initial_state: ACCEPTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /pro/performances/{id}/void"
        actor: RoyaltyDistributor
        preconditions:
          - "event.cycle_id is null OR owning cycle.status == COLLECTING"
        side_effects:
          - "if event.cycle_id set, cycle's captured credit total recomputed at next CALCULATING entry"
          - "increments PerformanceEvent.version by 1"
      - from: ACCEPTED
        to: REJECTED
        trigger: "system: ingestion-time validation failed after provisional accept is not supported; REJECTED is reached only via bulk-ingest rows failing validation (created directly in REJECTED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "REJECTED rows are created in terminal state by the bulk ingest endpoint when a row fails validation; they never consume credit."

  - entity: DistributionCycle
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: COLLECTING
        trigger: "POST /pro/cycles/{id}/open"
        actor: RoyaltyDistributor
        preconditions:
          - "cycle.period_start <= cycle.period_end"
        side_effects:
          - "creates UnclaimedRoyaltyPool(cycle_id, balance_cents=0, status=OPEN) if absent"
          - "increments DistributionCycle.version by 1"
      - from: COLLECTING
        to: CALCULATING
        trigger: "POST /pro/cycles/{id}/close-collection"
        actor: RoyaltyDistributor
        preconditions:
          - "at least one PerformanceEvent with status ACCEPTED and cycle_id == cycle.id exists"
        side_effects:
          - "cycle.version_epoch += 1"
          - "cycle.pool_amount_cents := sum of fee_basis_cents over licenses whose [effective_date, expiry_date] intersects [period_start, period_end] and status != TERMINATED, minus pool ADMIN deduct per royalty_pool calculation"
          - "royalty_allocation calculation runs; RoyaltyStatements created in DRAFT for the new epoch"
          - "unclaimed routing credits UnclaimedRoyaltyPool.balance_cents"
          - "increments DistributionCycle.version by 1"
      - from: CALCULATING
        to: DISTRIBUTED
        trigger: "POST /pro/cycles/{id}/distribute"
        actor: RoyaltyDistributor
        preconditions:
          - "all RoyaltyStatements of the current epoch are FINALIZED (via POST /pro/statements/{id}/finalize)"
        side_effects:
          - "each FINALIZED statement -> PAID; affiliate.royalty_balance_cents += statement.net_amount_cents - statement.unclaimed_amount_cents; affiliate.total_paid_cents += same"
          - "cycle.claims_open_until := period_end + CLAIMS_WINDOW_DAYS (if not already set)"
          - "increments DistributionCycle.version by 1"
      - from: DISTRIBUTED
        to: ADJUSTED
        trigger: "system: first RoyaltyAdjustment with status APPLIED posts against a statement of this cycle"
        actor: system
        preconditions:
          - "an adjustment for a statement of this cycle was APPLIED"
        side_effects:
          - "affiliate.royalty_balance_cents += adjustment.delta_cents"
          - "statement.status := ADJUSTED"
          - "increments DistributionCycle.version by 1"
      - from: ADJUSTED
        to: ADJUSTED
        trigger: "system: subsequent APPLIED adjustments keep the cycle in ADJUSTED"
        actor: system
        preconditions: []
        side_effects:
          - "affiliate.royalty_balance_cents += adjustment.delta_cents"

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /pro/statements/{id}/finalize"
        actor: RoyaltyDistributor
        preconditions:
          - "owning cycle.status == CALCULATING"
          - "statement.epoch == cycle.version_epoch"
        side_effects:
          - "increments RoyaltyStatement.version by 1"
      - from: FINALIZED
        to: PAID
        trigger: "system: owning cycle distributes"
        actor: system
        preconditions:
          - "cycle.status CALCULATING -> DISTRIBUTED"
        side_effects:
          - "affiliate.royalty_balance_cents += net_amount_cents - unclaimed_amount_cents"
      - from: PAID
        to: ADJUSTED
        trigger: "system: a RoyaltyAdjustment against this statement is APPLIED"
        actor: system
        preconditions:
          - "adjustment.status PENDING -> APPROVED -> APPLIED"
        side_effects:
          - "affiliate.royalty_balance_cents += adjustment.delta_cents"

  - entity: RoyaltyAdjustment
    initial_state: PENDING
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /pro/adjustments/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "caller X-User-ID != adjustment creator X-User-ID (segregation of duties)"
          - "if reason == LATE_CLAIM: owning cycle.claims_open_until >= clock date"
          - "if reason == LATE_CLAIM: claimed amount <= UnclaimedRoyaltyPool.balance_cents for the cycle"
        side_effects:
          - "increments RoyaltyAdjustment.version by 1"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /pro/adjustments/{id}/apply"
        actor: FinanceOfficer
        preconditions:
          - "adjustment.status == APPROVED"
        side_effects:
          - "affiliate.royalty_balance_cents += delta_cents"
          - "if reason == LATE_CLAIM and delta_cents > 0: UnclaimedRoyaltyPool.balance_cents -= delta_cents"
          - "statement.status := ADJUSTED; cycle DISTRIBUTED -> ADJUSTED"
          - "increments RoyaltyAdjustment.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /pro/adjustments/{id}/reject"
        actor: FinanceOfficer
        preconditions:
          - "caller X-User-ID != adjustment creator X-User-ID"
        side_effects:
          - "increments RoyaltyAdjustment.version by 1"

  - entity: AuditRequest
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINDINGS_FILED
        trigger: "POST /pro/audits/{id}/file-findings"
        actor: FinanceOfficer
        preconditions:
          - "audit.status == OPEN"
        side_effects:
          - "audit.findings_delta_cents := payload.findings_delta_cents"
          - "increments AuditRequest.version by 1"
      - from: FINDINGS_FILED
        to: CLOSED
        trigger: "POST /pro/audits/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "if findings_delta_cents > 0: a RoyaltyAdjustment(reason=AUDIT_FINDING) referencing the underpayment has been created (any status except REJECTED)"
        side_effects:
          - "licensee.credit_standing := DELINQUENT if findings_delta_cents > LICENSEE_DELINQUENCY_THRESHOLD_CENTS"
          - "increments AuditRequest.version by 1"

  - entity: UnclaimedRoyaltyPool
    initial_state: OPEN
    terminal_states: [ESCHEATED]
    transitions:
      - from: OPEN
        to: PARTIALLY_ESCHEATED
        trigger: "POST /pro/pools/{id}/escheat"
        actor: FinanceOfficer
        preconditions:
          - "clock date > cycle.claims_open_until + ESCHEAT_GRACE_DAYS"
          - "pool.balance_cents > 0"
        side_effects:
          - "pool.balance_cents := max(0, balance_cents - payload.amount_cents)"
          - "increments UnclaimedRoyaltyPool.version by 1"
      - from: PARTIALLY_ESCHEATED
        to: ESCHEATED
        trigger: "POST /pro/pools/{id}/escheat with amount_cents == pool.balance_cents"
        actor: FinanceOfficer
        preconditions:
          - "payload.amount_cents == pool.balance_cents"
        side_effects:
          - "pool.balance_cents := 0"
          - "increments UnclaimedRoyaltyPool.version by 1"
      - from: OPEN
        to: ESCHEATED
        trigger: "POST /pro/pools/{id}/escheat with amount_cents == pool.balance_cents"
        actor: FinanceOfficer
        preconditions:
          - "clock date > cycle.claims_open_until + ESCHEAT_GRACE_DAYS"
        side_effects:
          - "pool.balance_cents := 0"
          - "increments UnclaimedRoyaltyPool.version by 1"

  # -------------------------------------------------------------------------
  # §1.2.1 Concurrency Rules (OCC on parent version; true races only)
  # -------------------------------------------------------------------------
concurrency_rules:
  - rule_id: conflict-resolution-stale-work
    parent_entity: Work
    write_endpoint: "POST /pro/works/{id}/resolve-conflict"
    occ_field: "expected_work_version"
    description: |
      Resolving a conflict on a Work whose version has advanced since the client
      last observed it is rejected, because the claim disposition the client
      based its resolution on (e.g. aggregate_interest_bps, claim statuses) may
      have changed. The loser retries against the fresh work state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cycle-close-stale-cycle
    parent_entity: DistributionCycle
    write_endpoint: "POST /pro/cycles/{id}/close-collection"
    occ_field: "expected_cycle_version"
    description: |
      Closing collection on a DistributionCycle whose version has advanced since
      the client last observed it is rejected; a prior close (which legitimately
      re-ran the allocation and bumped version_epoch) makes the caller's pool
      assumptions stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: license-issue-stale-licensee
    parent_entity: Licensee
    write_endpoint: "POST /pro/licensees/{id}/licenses"
    occ_field: "expected_licensee_version"
    description: |
      Issuing a license against a Licensee whose version has advanced since the
      client last observed it is rejected, because blanket_fee_cents (pinned into
      the new license's fee_basis_cents) may have been recomputed from a revenue
      or usage update the client has not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: fee_engine
    trigger: "on POST /pro/licensees (create), PATCH /pro/licensees/{id} (revenue/usage update), and license issuance/renewal"
    algorithm: tiered_pricing
    formula: |
      # Category-parameterized blanket fee. Marginal-tier rate on revenue plus a
      # per-usage-unit charge; result is the GREATER of that and the category
      # minimum. Rounding: round_half_up to whole cents ONCE at the end (no
      # per-tier rounding).
      if category == BROADCASTER:
        # tiers over reported_revenue_cents (marginal):
        #   [0, 500_000_000_000]            @ 0.0160
        #   (500_000_000_000, 2_000_000_000_000] @ 0.0140
        #   (2_000_000_000_000, inf)        @ 0.0110
        fee = marginal_tier_sum(revenue) ; min_fee = 25_000_000 (cents)
      elif category == DIGITAL_SERVICE:
        # tiers: [0, 100_000_000_000] @ 0.0175 ; above @ 0.0150 ; PLUS per-stream
        # charge of PER_STREAM_MICRO_CENTS per usage_unit, added before the
        # max() with the minimum.
        fee = marginal_tier_sum(revenue) + usage_units * PER_STREAM_MICRO_CENTS / 10000
        min_fee = 10_000_000
      else: # VENUE
        # flat rate on revenue + per-event charge; NOT tiered.
        fee = revenue * 0.0080 + usage_units * VENUE_PER_EVENT_CENTS
        min_fee = 5_000_000
      blanket_fee_cents = round_half_up(max(fee, min_fee))
    input_set: "the single Licensee row being created/updated/licensed"
    constants:
      BCAST_T1_CAP_CENTS: 500000000000
      BCAST_T1_RATE: 0.0160
      BCAST_T2_CAP_CENTS: 2000000000000
      BCAST_T2_RATE: 0.0140
      BCAST_T3_RATE: 0.0110
      BCAST_MIN_FEE_CENTS: 25000000
      DIG_T1_CAP_CENTS: 100000000000
      DIG_T1_RATE: 0.0175
      DIG_T2_RATE: 0.0150
      PER_STREAM_MICRO_CENTS: 20
      DIG_MIN_FEE_CENTS: 10000000
      VENUE_RATE: 0.0080
      VENUE_PER_EVENT_CENTS: 15000
      VENUE_MIN_FEE_CENTS: 5000000
    precision: "whole cents, round_half_up, single final rounding"
    variants:
      - name: negotiated_fee_override
        when: "licensee.blanket_fee_cents was set by a SETTLED dispute (settled_fee_cents)"
        difference: "fee_engine formula is bypassed; blanket_fee_cents equals settled_fee_cents until the next revenue/usage PATCH re-runs the engine and takes max(engine, settled_fee_cents)"

  - name: performance_weight
    trigger: "on PerformanceEvent ingest (credit_units computation) and at cycle close"
    algorithm: weighted_scoring
    formula: |
      # Per-event weight = medium_factor * daypart_factor * universe_estimated_plays.
      # Feature bonus: works with > 2 ACCEPTED writer claims get FEATURE_BONUS_MULT
      # applied to the medium*daypart product BEFORE multiplying by plays.
      # credit_units are kept at 4 decimal places (round_half_up at 4dp) per event;
      # the cycle-level sum uses the already-rounded per-event values.
      medium_factor = MEDIUM_FACTORS[medium]
      daypart_factor = DAYPART_FACTORS[daypart]
      base = medium_factor * daypart_factor
      if count(ACCEPTED ShareClaims on work with role == WRITER) > 2:
        base = base * FEATURE_BONUS_MULT
      credit_units = round4(base * universe_estimated_plays)
    input_set: "single PerformanceEvent + its work's ACCEPTED writer-claim count"
    constants:
      MEDIUM_FACTORS: { TERRESTRIAL_RADIO: 1.0, NETWORK_TV: 2.5, CABLE_TV: 1.5, DIGITAL_STREAMING: 0.6, LIVE_VENUE: 1.2 }
      DAYPART_FACTORS: { PRIME: 2.0, DAY: 1.0, LATE_NIGHT: 0.7, OVERNIGHT: 0.4 }
      FEATURE_BONUS_MULT: 1.1
    precision: "4 decimal places per event, round_half_up; cycle sums add rounded values"

  - name: sampled_projection
    trigger: "on PerformanceEvent ingest when source == SAMPLE"
    algorithm: forward_looking
    formula: |
      # Unmonitored media: expand a sampled play count to a universe estimate.
      # universe = play_count * (SAMPLING_FRAME_UNITS / frame_units_reported),
      # rounded to the NEAREST integer with round_half_up, MINIMUM of play_count
      # (never project below the observed count).
      # For census sources (MONITORING, CUE_SHEET, DIGITAL_REPORT): universe = play_count.
      if source == SAMPLE:
        universe = max(play_count, round_half_up(play_count * SAMPLING_FRAME_UNITS / frame_units_reported))
      else:
        universe = play_count
    input_set: "single PerformanceEvent (play_count, source, payload frame_units_reported)"
    constants:
      SAMPLING_FRAME_UNITS: 52
    precision: "integer plays, round_half_up"
    variants:
      - name: census_reporting
        when: "source != SAMPLE"
        difference: "no expansion; universe_estimated_plays == play_count exactly"

  - name: royalty_pool
    trigger: "on DistributionCycle COLLECTING -> CALCULATING"
    algorithm: aggregation
    formula: |
      # Distributable pool from licenses intersecting the period.
      # pool_gross = sum of license.fee_basis_cents over licenses where
      #   effective_date <= period_end AND expiry_date >= period_start
      #   AND status != TERMINATED
      # proration: a license contributes fee_basis_cents * covered_days/365,
      #   where covered_days = days of [effective,expiry] intersect [period_start,period_end]
      #   (inclusive both ends), integer-truncated per license BEFORE summing.
      # pool_amount_cents = round_half_up(pool_gross * (1 - ADMIN_RATE))
      # Evaluation order pinned: prorate per license -> truncate per license ->
      # sum -> apply ADMIN_RATE -> round once.
    input_set: "all License rows with status != TERMINATED intersecting the cycle period"
    constants:
      ADMIN_RATE: 0.15
      DAYS_IN_YEAR: 365
    precision: "per-license integer truncation; single final round_half_up to cents"

  - name: royalty_allocation
    trigger: "on DistributionCycle COLLECTING -> CALCULATING (after royalty_pool)"
    algorithm: waterfall_allocation
    formula: |
      # Converts captured performances into per-affiliate gross amounts.
      # total_credit_units = sum of credit_units over PerformanceEvents with
      #   status == ACCEPTED AND cycle_id == cycle.id
      # unit_value = pool_amount_cents / total_credit_units  (exact rational)
      # Per work: work_value_exact = sum(credit_units of its events) * unit_value
      # Per affiliate on that work: affiliate_exact = work_value_exact *
      #   collection_share_bps / 10000 over claims with status == ACCEPTED
      # Rounding (pinned): each affiliate's per-work amount is rounded
      # round_half_up to cents; the cycle-level rounding residue
      # (pool_amount_cents - sum of all rounded amounts) is reconciled
      # cent-by-cent: positive residue is awarded +1 cent at a time to
      # statements ordered by (rounded amount DESC, affiliate created_at ASC);
      # negative residue is clawed back -1 cent at a time from statements
      # ordered by (rounded amount DESC, affiliate created_at ASC) — i.e. the
      # largest statements absorb both directions of rounding drift.
      # Affiliates with status != ACTIVE have their per-work amount redirected:
      # a statement is still created recording the gross, its
      # unclaimed_amount_cents equals the gross, and the same cents credit the
      # cycle's UnclaimedRoyaltyPool. Works with NO ACCEPTED claim have their
      # whole work value routed directly to the pool (no statement created).
      # Admin fee does NOT apply to the unclaimed portion: pool credits are
      # gross cents; admin_fee_cents is computed on (gross - unclaimed) only.
    input_set: "PerformanceEvents ACCEPTED & captured in this cycle; ShareClaims ACCEPTED on those works; Affiliate.status"
    constants:
      RESIDUE_TIE_BREAK: "rounded amount DESC, then affiliate created_at ASC"
    precision: "round_half_up per affiliate per work; residue cent-distribution pinned"

  - name: admin_fee
    trigger: "on RoyaltyStatement creation (during royalty_allocation)"
    algorithm: threshold
    formula: |
      # Withheld administration fee per statement, charged ONLY on the payable
      # portion (gross minus the unclaimed routing):
      # payable = gross_amount_cents - unclaimed_amount_cents
      # admin_fee_cents = round_half_up(payable * ADMIN_WITHHOLD_RATE)
      # capped so the payable net never goes negative:
      # admin_fee_cents = min(admin_fee_cents, payable)
      # net_amount_cents = gross_amount_cents - admin_fee_cents (unclaimed
      # cents remain part of net on the statement but credit the pool rather
      # than the affiliate at distribution).
      # A statement with payable == 0 has admin_fee_cents == 0 (zero floor).
    input_set: "single RoyaltyStatement gross_amount_cents and unclaimed_amount_cents"
    constants:
      ADMIN_WITHHOLD_RATE: 0.05
    precision: "whole cents, round_half_up"

  - name: late_claim_payout
    trigger: "on RoyaltyAdjustment(reason=LATE_CLAIM) approval"
    algorithm: threshold
    formula: |
      # A late claim pays out of the cycle's UnclaimedRoyaltyPool.
      # payable = min(claimed_delta_cents, pool.balance_cents)
      # Approve requires: clock date <= cycle.claims_open_until (inclusive; the
      # claim is still valid ON the final day) AND claimed_delta_cents <=
      # pool.balance_cents (full-coverage rule: partial approvals are rejected,
      # the claimant must re-file for the available amount).
    input_set: "single adjustment + cycle's UnclaimedRoyaltyPool"
    constants:
      CLAIMS_WINDOW_DAYS: 90
    precision: "whole cents"
    variants:
      - name: post_window_escheat_claim
        when: "clock date > claims_open_until"
        difference: "claim is rejected outright with ERR_CLAIMS_WINDOW_CLOSED; pool may be escheated instead"

  - name: audit_assessment
    trigger: "on AuditRequest OPEN -> FINDINGS_FILED and close"
    algorithm: aggregation
    formula: |
      # Aggregate underpayment assessment. findings_delta_cents is the officer-
      # asserted signed sum; on close, if findings_delta_cents >
      # LICENSEE_DELINQUENCY_THRESHOLD_CENTS the licensee's credit_standing
      # flips to DELINQUENT (exactly-equal does NOT flip: strictly greater).
      # The audit's monetary remedy is carried by a separate
      # RoyaltyAdjustment(reason=AUDIT_FINDING), never by mutating statements
      # in place.
    input_set: "single AuditRequest"
    constants:
      LICENSEE_DELINQUENCY_THRESHOLD_CENTS: 1000000
    precision: "whole cents"

  - name: escheatment_sweep
    trigger: "on POST /pro/pools/{id}/escheat"
    algorithm: chronological
    formula: |
      # Unclaimed royalties escheat to the state after the claims window plus a
      # grace period. Eligibility: clock date > cycle.claims_open_until +
      # ESCHEAT_GRACE_DAYS (strictly greater; on the exact grace-final day the
      # pool is NOT yet escheatable). Partial escheats allowed while balance >
      # 0; full escheat (amount == balance) moves the pool to ESCHEATED.
    input_set: "single UnclaimedRoyaltyPool + its cycle's claims_open_until"
    constants:
      ESCHEAT_GRACE_DAYS: 30
    precision: "whole cents"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in the declared role set; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right (work before share-claim, cycle before statement, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "body-referenced FK targets exist (work_id, license_id, affiliate_id, cycle_id, statement_id, dispute_id, licensee_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST/PATCH endpoints with FK fields"
  - priority: 5
    category: state
    check: "target resource state permits the operation per state machine (e.g., confirm only from REGISTERED, settle only from NEGOTIATION, finalize only in CALCULATING cycle)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "optimistic concurrency: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pro/works/{id}/resolve-conflict, POST /pro/cycles/{id}/close-collection, POST /pro/licensees/{id}/licenses"
  - priority: 7
    category: business_safety
    check: "segregation of duties: adjustment approver/rejecter X-User-ID differs from the adjustment creator's X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pro/adjustments/{id}/approve, POST /pro/adjustments/{id}/reject"
  - priority: 8
    category: business_safety
    check: "audit scope end date within AUDIT_LOOKBACK_DAYS (1095) of the logical clock date"
    error_id: ERR_AUDIT_SCOPE_TOO_OLD
    http_status: 422
    applies_to: "POST /pro/licensees/{id}/audits"
  - priority: 9
    category: business_temporal
    check: "performance_date within an intersecting license's [effective_date, expiry_date] for the referenced license_id"
    error_id: ERR_PERFORMANCE_OUTSIDE_LICENSE_WINDOW
    http_status: 422
    applies_to: "POST /pro/performances, POST /pro/performances/bulk"
  - priority: 10
    category: business_temporal
    check: "late-claim adjustment filed while clock date <= cycle.claims_open_until (inclusive)"
    error_id: ERR_CLAIMS_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /pro/statements/{id}/adjustments (reason=LATE_CLAIM), POST /pro/adjustments/{id}/approve"
  - priority: 11
    category: business_temporal
    check: "escheat requested only when clock date > claims_open_until + ESCHEAT_GRACE_DAYS"
    error_id: ERR_ESCHEAT_NOT_YET_DUE
    http_status: 422
    applies_to: "POST /pro/pools/{id}/escheat"
  - priority: 12
    category: business_constraint
    check: "share-claim shares within bounds: 1 <= collection_share_bps <= 10000 and 1 <= interest_share_bps <= 10000; at most one claim per (work_id, affiliate_id, role) in non-REVOKED status"
    error_id: ERR_INVALID_SHARE
    http_status: 422
    applies_to: "POST /pro/works/{id}/share-claims"
  - priority: 13
    category: business_constraint
    check: "conflict-resolution request disposes every DISPUTED claim on the work exactly once (accept xor revoke) and post-resolution aggregate_interest_bps <= 10000"
    error_id: ERR_CONFLICT_RESOLUTION_INVALID
    http_status: 422
    applies_to: "POST /pro/works/{id}/resolve-conflict"
  - priority: 14
    category: business_constraint
    check: "work confirm requires aggregate_interest_bps <= 10000 and no DISPUTED claims"
    error_id: ERR_WORK_SHARES_INCOMPLETE
    http_status: 422
    applies_to: "POST /pro/works/{id}/confirm"
  - priority: 15
    category: business_referential
    check: "performance ingest requires referenced work status == CONFIRMED"
    error_id: ERR_WORK_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /pro/performances, POST /pro/performances/bulk"
  - priority: 16
    category: business_referential
    check: "performance ingest requires referenced license status IN {ACTIVE, DISPUTED} (performances still accrue during a good-faith dispute) — SUSPENDED/EXPIRED/TERMINATED rejected"
    error_id: ERR_LICENSE_SUSPENDED
    http_status: 422
    applies_to: "POST /pro/performances, POST /pro/performances/bulk"
  - priority: 17
    category: business_referential
    check: "license issuance requires licensee.credit_standing == GOOD"
    error_id: ERR_LICENSEE_DELINQUENT
    http_status: 422
    applies_to: "POST /pro/licensees/{id}/licenses"
  - priority: 18
    category: business_referential
    check: "work withdrawal requires no ACCEPTED PerformanceEvent references the work"
    error_id: ERR_WORK_HAS_PERFORMANCES
    http_status: 422
    applies_to: "POST /pro/works/{id}/withdraw"
  - priority: 19
    category: business_referential
    check: "share-claim revocation requires no FINALIZED-or-later statement routed royalties on the claim"
    error_id: ERR_CLAIM_LOCKED_BY_DISTRIBUTION
    http_status: 422
    applies_to: "POST /pro/share-claims/{id}/revoke"
  - priority: 20
    category: business_fiscal
    check: "late-claim approve requires claimed delta_cents <= cycle pool balance_cents (full-coverage rule)"
    error_id: ERR_UNCLAIMED_POOL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /pro/adjustments/{id}/approve"
  - priority: 21
    category: business_fiscal
    check: "escheat amount_cents > 0 and <= pool.balance_cents"
    error_id: ERR_ESCHEAT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /pro/pools/{id}/escheat"
  - priority: 22
    category: business_fiscal
    check: "cycle distribute requires all current-epoch statements FINALIZED"
    error_id: ERR_STATEMENTS_NOT_FINALIZED
    http_status: 422
    applies_to: "POST /pro/cycles/{id}/distribute"
  - priority: 23
    category: business_constraint
    check: "field shape: enum members valid; dates ISO; effective_date < expiry_date; period_start <= period_end; play_count >= 1; disputed_fee_cents >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/pro/_clock/set_current_utc"
    description: "Sets the server logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProSystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["triggers expiry sweep: licenses with expiry_date < new date transition to EXPIRED"]

  # --- affiliates ---
  - method: POST
    path: "/pro/affiliates"
    description: "Affiliate a songwriter or publisher"
    roles: [ProRegistrar]
    code: 201
    input: [legal_name, party_type, affiliation_code]
    output: Affiliate
    side_effects: []
  - method: GET
    path: "/pro/affiliates"
    description: "List affiliates with pagination and filters"
    roles: [ProRegistrar, ProLicensingAdmin, RoyaltyDistributor, FinanceOfficer, RateCourtOfficer]
    code: 200
    input: ["party_type?", "status?", "limit?", "offset?"]
    output: "Affiliate[]"
    side_effects: []
  - method: GET
    path: "/pro/affiliates/{id}"
    description: "Fetch one affiliate including computed royalty_balance_cents and total_paid_cents"
    roles: [ProRegistrar, RoyaltyDistributor, FinanceOfficer, Affiliate]
    code: 200
    input: []
    output: Affiliate
    side_effects: []
  - method: PATCH
    path: "/pro/affiliates/{id}"
    description: "Update affiliate status (suspend/terminate) or legal name"
    roles: [ProRegistrar]
    code: 200
    input: ["legal_name?", "status?"]
    output: Affiliate
    side_effects: ["increments Affiliate.version by 1"]

  # --- works & share claims ---
  - method: POST
    path: "/pro/works"
    description: "Register a musical work"
    roles: [Publisher]
    code: 201
    input: [title, "alternate_titles?", registered_by_affiliate_id]
    output: Work
    side_effects: ["increments Work.version by 1"]
  - method: GET
    path: "/pro/works"
    description: "List works; filter by status or registered_by_affiliate_id"
    roles: [ProRegistrar, RoyaltyDistributor, Publisher, Songwriter]
    code: 200
    input: ["status?", "registered_by_affiliate_id?", "limit?", "offset?"]
    output: "Work[]"
    side_effects: []
  - method: GET
    path: "/pro/works/{id}"
    description: "Fetch one work including aggregate_interest_bps"
    roles: [ProRegistrar, RoyaltyDistributor, Publisher, Songwriter]
    code: 200
    input: []
    output: Work
    side_effects: []
  - method: POST
    path: "/pro/works/{id}/confirm"
    description: "Confirm a REGISTERED work whose shares are clean"
    roles: [ProRegistrar]
    code: 200
    input: []
    output: Work
    side_effects: ["Work REGISTERED -> CONFIRMED", "increments Work.version by 1"]
  - method: POST
    path: "/pro/works/{id}/withdraw"
    description: "Withdraw a work (registering publisher only, no accepted performances)"
    roles: [Publisher]
    code: 200
    input: []
    output: Work
    side_effects: ["Work -> WITHDRAWN", "non-REVOKED ShareClaims -> REVOKED", "increments Work.version by 1"]
  - method: POST
    path: "/pro/works/{id}/resolve-conflict"
    description: "Resolve an over-claim conflict by accepting/revoking disputed claims (OCC on work version)"
    roles: [ProRegistrar]
    code: 200
    input: [accept_claim_ids, revoke_claim_ids, expected_work_version]
    output: Work
    side_effects: ["claims disposed", "work IN_CONFLICT -> CONFIRMED when clean", "increments Work.version by 1"]
  - method: POST
    path: "/pro/works/{id}/share-claims"
    description: "Assert a share claim on a work"
    roles: [Publisher, Songwriter]
    code: 201
    input: [affiliate_id, role, collection_share_bps, interest_share_bps]
    output: ShareClaim
    side_effects: ["auto-ACCEPT or mark DISPUTED per aggregate", "work may flip REGISTERED <-> IN_CONFLICT", "increments Work.version by 1"]
  - method: GET
    path: "/pro/works/{id}/share-claims"
    description: "List share claims of a work"
    roles: [ProRegistrar, RoyaltyDistributor, Publisher, Songwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShareClaim[]"
    side_effects: []
  - method: GET
    path: "/pro/share-claims"
    description: "Filtered list of share claims across works"
    roles: [ProRegistrar, RoyaltyDistributor]
    code: 200
    input: ["work_id?", "affiliate_id?", "status?", "limit?", "offset?"]
    output: "ShareClaim[]"
    side_effects: []
  - method: GET
    path: "/pro/affiliates/{id}/share-claims"
    description: "List share claims asserted by an affiliate"
    roles: [ProRegistrar, RoyaltyDistributor, Publisher, Songwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShareClaim[]"
    side_effects: []
  - method: POST
    path: "/pro/share-claims/{id}/revoke"
    description: "Revoke an own ACCEPTED/SUBMITTED claim"
    roles: [Publisher, Songwriter]
    code: 200
    input: []
    output: ShareClaim
    side_effects: ["claim -> REVOKED", "work aggregate recomputed", "work may leave IN_CONFLICT"]
  - method: POST
    path: "/pro/share-claims/{id}/dispute"
    description: "Another claim holder challenges an ACCEPTED claim on the same work, re-opening conflict"
    roles: [Publisher, Songwriter]
    code: 200
    input: []
    output: ShareClaim
    side_effects: ["claim ACCEPTED -> DISPUTED", "work -> IN_CONFLICT", "increments Work.version by 1"]

  # --- licensees & licenses ---
  - method: POST
    path: "/pro/licensees"
    description: "Onboard a licensee; computes blanket_fee_cents via fee_engine"
    roles: [ProLicensingAdmin]
    code: 201
    input: [legal_name, category, reported_revenue_cents, usage_units]
    output: Licensee
    side_effects: ["fee_engine computes blanket_fee_cents"]
  - method: GET
    path: "/pro/licensees"
    description: "List licensees"
    roles: [ProLicensingAdmin, FinanceOfficer, RateCourtOfficer, Licensee]
    code: 200
    input: ["category?", "credit_standing?", "limit?", "offset?"]
    output: "Licensee[]"
    side_effects: []
  - method: GET
    path: "/pro/licensees/{id}"
    description: "Fetch one licensee including computed blanket_fee_cents"
    roles: [ProLicensingAdmin, FinanceOfficer, Licensee]
    code: 200
    input: []
    output: Licensee
    side_effects: []
  - method: PATCH
    path: "/pro/licensees/{id}"
    description: "Update reported revenue / usage; recomputes blanket_fee_cents"
    roles: [ProLicensingAdmin, Licensee]
    code: 200
    input: ["reported_revenue_cents?", "usage_units?"]
    output: Licensee
    side_effects: ["fee_engine recomputes blanket_fee_cents (max(engine, settled_fee_cents) if a settled override exists)", "increments Licensee.version by 1"]
  - method: POST
    path: "/pro/licensees/{id}/licenses"
    description: "Issue a blanket license (OCC on licensee version); pins fee_basis_cents"
    roles: [ProLicensingAdmin]
    code: 201
    input: [effective_date, expiry_date, expected_licensee_version]
    output: License
    side_effects: ["license.fee_basis_cents := licensee.blanket_fee_cents", "license.category := licensee.category", "increments Licensee.version by 1"]
  - method: GET
    path: "/pro/licensees/{id}/licenses"
    description: "List licenses of a licensee"
    roles: [ProLicensingAdmin, FinanceOfficer, Licensee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "License[]"
    side_effects: []
  - method: GET
    path: "/pro/licenses"
    description: "Filtered list of licenses"
    roles: [ProLicensingAdmin, RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: ["licensee_id?", "status?", "category?", "limit?", "offset?"]
    output: "License[]"
    side_effects: []
  - method: GET
    path: "/pro/licenses/{id}"
    description: "Fetch one license"
    roles: [ProLicensingAdmin, FinanceOfficer, Licensee]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: POST
    path: "/pro/licenses/{id}/suspend"
    description: "Suspend a license (requires licensee DELINQUENT)"
    roles: [ProLicensingAdmin]
    code: 200
    input: []
    output: License
    side_effects: ["License -> SUSPENDED", "increments License.version by 1"]
  - method: POST
    path: "/pro/licenses/{id}/reinstate"
    description: "Reinstate a suspended license (requires licensee GOOD)"
    roles: [ProLicensingAdmin]
    code: 200
    input: []
    output: License
    side_effects: ["License SUSPENDED -> ACTIVE", "increments License.version by 1"]
  - method: POST
    path: "/pro/licenses/{id}/terminate"
    description: "Terminate a license"
    roles: [ProLicensingAdmin]
    code: 200
    input: []
    output: License
    side_effects: ["License -> TERMINATED", "increments License.version by 1"]

  # --- disputes & rate court ---
  - method: POST
    path: "/pro/licenses/{id}/disputes"
    description: "Open a rate dispute on an ACTIVE license (licensee or PRO-initiated)"
    roles: [Licensee, ProLicensingAdmin]
    code: 201
    input: [opened_by_role, disputed_fee_cents]
    output: RateDispute
    side_effects: ["license ACTIVE -> DISPUTED", "increments License.version by 1"]
  - method: GET
    path: "/pro/licenses/{id}/disputes"
    description: "List disputes of a license"
    roles: [ProLicensingAdmin, RateCourtOfficer, Licensee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RateDispute[]"
    side_effects: []
  - method: GET
    path: "/pro/disputes"
    description: "Filtered list of disputes"
    roles: [ProLicensingAdmin, RateCourtOfficer, FinanceOfficer]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: "RateDispute[]"
    side_effects: []
  - method: GET
    path: "/pro/disputes/{id}"
    description: "Fetch one dispute"
    roles: [ProLicensingAdmin, RateCourtOfficer, Licensee]
    code: 200
    input: []
    output: RateDispute
    side_effects: []
  - method: POST
    path: "/pro/disputes/{id}/negotiate"
    description: "Advance a negotiation round with a counter-offer"
    roles: [ProLicensingAdmin, Licensee]
    code: 200
    input: [counter_fee_cents]
    output: RateDispute
    side_effects: ["negotiation_rounds += 1", "increments RateDispute.version by 1"]
  - method: POST
    path: "/pro/disputes/{id}/settle"
    description: "Settle a dispute in NEGOTIATION at an agreed fee"
    roles: [ProLicensingAdmin]
    code: 200
    input: [agreed_fee_cents]
    output: RateDispute
    side_effects: ["dispute -> SETTLED", "license DISPUTED -> ACTIVE", "licensee.blanket_fee_cents := agreed_fee_cents when different"]
  - method: POST
    path: "/pro/disputes/{id}/escalate"
    description: "Escalate to rate court; creates RateCourtCase FILED"
    roles: [Licensee]
    code: 201
    input: []
    output: RateCourtCase
    side_effects: ["dispute -> RATE_COURT", "RateCourtCase created FILED"]
  - method: POST
    path: "/pro/disputes/{id}/withdraw"
    description: "Withdraw a licensee-opened dispute"
    roles: [Licensee]
    code: 200
    input: []
    output: RateDispute
    side_effects: ["dispute -> WITHDRAWN", "license DISPUTED -> ACTIVE"]
  - method: GET
    path: "/pro/disputes/{id}/rate-court-cases"
    description: "List rate court cases of a dispute"
    roles: [ProLicensingAdmin, RateCourtOfficer, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: "RateCourtCase[]"
    side_effects: []
  - method: POST
    path: "/pro/rate-court-cases/{id}/open-hearing"
    description: "Move a filed case to hearing"
    roles: [RateCourtOfficer]
    code: 200
    input: []
    output: RateCourtCase
    side_effects: ["increments RateCourtCase.version by 1"]
  - method: POST
    path: "/pro/rate-court-cases/{id}/decide"
    description: "Adjudicate a fee; settles the dispute and overrides licensee.blanket_fee_cents"
    roles: [RateCourtOfficer]
    code: 200
    input: [adjudicated_fee_cents]
    output: RateCourtCase
    side_effects: ["case -> DECIDED", "dispute RATE_COURT -> SETTLED", "license DISPUTED -> ACTIVE", "licensee.blanket_fee_cents := adjudicated_fee_cents"]
  - method: POST
    path: "/pro/rate-court-cases/{id}/dismiss"
    description: "Dismiss a filed case; dispute returns to NEGOTIATION"
    roles: [RateCourtOfficer]
    code: 200
    input: []
    output: RateCourtCase
    side_effects: ["case -> DISMISSED", "dispute RATE_COURT -> NEGOTIATION (rounds += 1)"]

  # --- performance ingestion ---
  - method: POST
    path: "/pro/performances"
    description: "Ingest a single performance event (computes universe_estimated_plays and credit_units)"
    roles: [RoyaltyDistributor]
    code: 201
    input: [work_id, license_id, performance_date, medium, daypart, source, play_count, "frame_units_reported?"]
    output: PerformanceEvent
    side_effects: ["sampled_projection + performance_weight compute universe_estimated_plays and credit_units"]
  - method: POST
    path: "/pro/performances/bulk"
    description: "Bulk ingest; per-row success/failure (rows failing validation are persisted as REJECTED with no credit)"
    roles: [RoyaltyDistributor]
    code: 200
    input: [events]
    # events[] items carry the same fields as POST /pro/performances
    # (work_id, license_id, performance_date, medium, daypart, source,
    # play_count, frame_units_reported?); per-row validation errors are
    # recorded on the persisted REJECTED row (error_id field per row).
    output: "PerformanceEvent[]"
    side_effects: ["valid rows accepted with computed fields; invalid rows REJECTED"]
  - method: GET
    path: "/pro/performances"
    description: "Filtered list of performance events"
    roles: [RoyaltyDistributor, FinanceOfficer, ProLicensingAdmin]
    code: 200
    input: ["work_id?", "license_id?", "cycle_id?", "status?", "medium?", "limit?", "offset?"]
    output: "PerformanceEvent[]"
    side_effects: []
  - method: GET
    path: "/pro/works/{id}/performances"
    description: "List performances of a work"
    roles: [RoyaltyDistributor, Publisher, Songwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PerformanceEvent[]"
    side_effects: []
  - method: GET
    path: "/pro/licenses/{id}/performances"
    description: "List performances under a license"
    roles: [RoyaltyDistributor, Licensee, ProLicensingAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PerformanceEvent[]"
    side_effects: []
  - method: POST
    path: "/pro/performances/{id}/void"
    description: "Void an accepted performance not yet locked by a calculating cycle"
    roles: [RoyaltyDistributor]
    code: 200
    input: []
    output: PerformanceEvent
    side_effects: ["event -> VOIDED", "increments PerformanceEvent.version by 1"]
  - method: POST
    path: "/pro/cycles/{id}/performances/capture"
    description: "Capture accepted performances in the period into a COLLECTING cycle (sets cycle_id)"
    roles: [RoyaltyDistributor]
    code: 200
    input: [performance_event_ids]
    output: "PerformanceEvent[]"
    side_effects: ["each event.cycle_id := cycle.id", "increments DistributionCycle.version by 1"]
  - method: GET
    path: "/pro/cycles/{id}/performances"
    description: "List performances captured into a cycle"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PerformanceEvent[]"
    side_effects: []
  - method: GET
    path: "/pro/adjustments"
    description: "Filtered list of adjustments across statements"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: ["affiliate_id?", "audit_id?", "status?", "reason?", "limit?", "offset?"]
    output: "RoyaltyAdjustment[]"
    side_effects: []
  - method: GET
    path: "/pro/pools"
    description: "Filtered list of unclaimed royalty pools"
    roles: [FinanceOfficer, RoyaltyDistributor]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: "UnclaimedRoyaltyPool[]"
    side_effects: []

  # --- distribution cycles, statements, adjustments ---
  - method: POST
    path: "/pro/cycles"
    description: "Create a distribution cycle (DRAFT)"
    roles: [RoyaltyDistributor]
    code: 201
    input: [label, period_start, period_end]
    output: DistributionCycle
    side_effects: []
  - method: GET
    path: "/pro/cycles"
    description: "List distribution cycles"
    roles: [RoyaltyDistributor, FinanceOfficer, ProLicensingAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DistributionCycle[]"
    side_effects: []
  - method: GET
    path: "/pro/cycles/{id}"
    description: "Fetch one cycle including pool_amount_cents and version_epoch"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: []
    output: DistributionCycle
    side_effects: []
  - method: POST
    path: "/pro/cycles/{id}/open"
    description: "Open a cycle for collection; creates its UnclaimedRoyaltyPool"
    roles: [RoyaltyDistributor]
    code: 200
    input: []
    output: DistributionCycle
    side_effects: ["cycle DRAFT -> COLLECTING", "UnclaimedRoyaltyPool created (balance 0)", "increments DistributionCycle.version by 1"]
  - method: POST
    path: "/pro/cycles/{id}/close-collection"
    description: "Close collection and run pool + allocation (OCC on cycle version)"
    roles: [RoyaltyDistributor]
    code: 200
    input: [expected_cycle_version]
    output: DistributionCycle
    side_effects: ["cycle COLLECTING -> CALCULATING", "royalty_pool computes pool_amount_cents", "royalty_allocation creates epoch statements", "unclaimed routed to pool", "increments DistributionCycle.version by 1"]
  - method: POST
    path: "/pro/cycles/{id}/distribute"
    description: "Distribute a fully-finalized cycle; pays statements to affiliate ledgers"
    roles: [RoyaltyDistributor]
    code: 200
    input: []
    output: DistributionCycle
    side_effects: ["cycle CALCULATING -> DISTRIBUTED", "statements FINALIZED -> PAID", "affiliate.royalty_balance_cents credited", "claims_open_until := period_end + 90 days"]
  - method: GET
    path: "/pro/cycles/{id}/statements"
    description: "List statements of a cycle"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: ["status?", "epoch?", "affiliate_id?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []
  - method: GET
    path: "/pro/cycles/{id}/pool"
    description: "Fetch the cycle's unclaimed royalty pool"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: []
    output: UnclaimedRoyaltyPool
    side_effects: []
  - method: GET
    path: "/pro/statements"
    description: "Filtered list of statements"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: ["cycle_id?", "affiliate_id?", "status?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []
  - method: GET
    path: "/pro/affiliates/{id}/statements"
    description: "List statements payable to an affiliate"
    roles: [RoyaltyDistributor, FinanceOfficer, Publisher, Songwriter]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []
  - method: GET
    path: "/pro/statements/{id}"
    description: "Fetch one statement"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: POST
    path: "/pro/statements/{id}/finalize"
    description: "Finalize a DRAFT statement of the current epoch"
    roles: [RoyaltyDistributor]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["statement DRAFT -> FINALIZED", "increments RoyaltyStatement.version by 1"]
  - method: POST
    path: "/pro/statements/{id}/adjustments"
    description: "File an adjustment (late claim, audit finding, rate-court retro, data correction)"
    roles: [RoyaltyDistributor, FinanceOfficer, Publisher, Songwriter]
    code: 201
    input: [delta_cents, reason, "audit_id?"]
    output: RoyaltyAdjustment
    side_effects: ["adjustment created PENDING"]
  - method: GET
    path: "/pro/statements/{id}/adjustments"
    description: "List adjustments of a statement"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RoyaltyAdjustment[]"
    side_effects: []
  - method: GET
    path: "/pro/adjustments/{id}"
    description: "Fetch one adjustment"
    roles: [RoyaltyDistributor, FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyAdjustment
    side_effects: []
  - method: POST
    path: "/pro/adjustments/{id}/approve"
    description: "Approve an adjustment (segregation of duties: approver != creator)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyAdjustment
    side_effects: ["adjustment PENDING -> APPROVED", "increments RoyaltyAdjustment.version by 1"]
  - method: POST
    path: "/pro/adjustments/{id}/reject"
    description: "Reject an adjustment (segregation of duties)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyAdjustment
    side_effects: ["adjustment PENDING -> REJECTED", "increments RoyaltyAdjustment.version by 1"]
  - method: POST
    path: "/pro/adjustments/{id}/apply"
    description: "Apply an approved adjustment to the affiliate ledger and pool"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyAdjustment
    side_effects: ["adjustment APPROVED -> APPLIED", "affiliate.royalty_balance_cents += delta_cents", "LATE_CLAIM debits pool", "cycle DISTRIBUTED -> ADJUSTED"]

  # --- audits ---
  - method: POST
    path: "/pro/licensees/{id}/audits"
    description: "Open an audit against a licensee"
    roles: [FinanceOfficer]
    code: 201
    input: [scope_period_start, scope_period_end]
    output: AuditRequest
    side_effects: []
  - method: GET
    path: "/pro/licensees/{id}/audits"
    description: "List audits of a licensee"
    roles: [FinanceOfficer, ProLicensingAdmin, Licensee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuditRequest[]"
    side_effects: []
  - method: GET
    path: "/pro/audits/{id}"
    description: "Fetch one audit"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AuditRequest
    side_effects: []
  - method: POST
    path: "/pro/audits/{id}/file-findings"
    description: "File audit findings with an aggregate signed delta"
    roles: [FinanceOfficer]
    code: 200
    input: [findings_delta_cents]
    output: AuditRequest
    side_effects: ["audit OPEN -> FINDINGS_FILED", "increments AuditRequest.version by 1"]
  - method: POST
    path: "/pro/audits/{id}/close"
    description: "Close an audit; flips licensee to DELINQUENT when findings exceed threshold"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AuditRequest
    side_effects: ["audit -> CLOSED", "licensee.credit_standing := DELINQUENT if findings_delta_cents > threshold"]

  # --- unclaimed pool escheatment ---
  - method: GET
    path: "/pro/pools/{id}"
    description: "Fetch an unclaimed royalty pool"
    roles: [FinanceOfficer, RoyaltyDistributor]
    code: 200
    input: []
    output: UnclaimedRoyaltyPool
    side_effects: []
  - method: POST
    path: "/pro/pools/{id}/escheat"
    description: "Escheats unclaimed funds after claims window + grace (partial or full)"
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents]
    output: UnclaimedRoyaltyPool
    side_effects: ["pool balance reduced", "pool -> PARTIALLY_ESCHEATED or ESCHEATED", "increments UnclaimedRoyaltyPool.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for the endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "body FK target (work/license/affiliate/cycle/statement/dispute/licensee) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource state does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_VALIDATION, http: 400, condition: "field shape violation: bad enum, bad date, play_count < 1, effective_date >= expiry_date, negative amounts" }
  - { id: ERR_INVALID_SHARE, http: 422, condition: "share bps out of 1..10000 or duplicate non-REVOKED claim for (work, affiliate, role)" }
  - { id: ERR_WORK_SHARES_INCOMPLETE, http: 422, condition: "work confirm attempted while aggregate_interest_bps > 10000 or DISPUTED claims remain" }
  - { id: ERR_CONFLICT_RESOLUTION_INVALID, http: 422, condition: "resolution does not dispose every DISPUTED claim exactly once, or leaves aggregate > 10000" }
  - { id: ERR_WORK_NOT_CONFIRMED, http: 422, condition: "performance ingested against a work not in CONFIRMED status" }
  - { id: ERR_WORK_HAS_PERFORMANCES, http: 422, condition: "withdrawal blocked because ACCEPTED performances reference the work" }
  - { id: ERR_CLAIM_LOCKED_BY_DISTRIBUTION, http: 422, condition: "claim revocation blocked because a FINALIZED-or-later statement routed royalties on it" }
  - { id: ERR_LICENSEE_DELINQUENT, http: 422, condition: "license issuance attempted for a licensee whose credit_standing is DELINQUENT" }
  - { id: ERR_LICENSE_SUSPENDED, http: 422, condition: "performance ingested under a SUSPENDED/EXPIRED/TERMINATED license" }
  - { id: ERR_PERFORMANCE_OUTSIDE_LICENSE_WINDOW, http: 422, condition: "performance_date outside the referenced license's [effective_date, expiry_date]" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "a second dispute opened on a license with an existing OPEN/NEGOTIATION/RATE_COURT dispute" }
  - { id: ERR_RATE_COURT_CASE_EXISTS, http: 409, condition: "escalation attempted while a non-DISMISSED RateCourtCase exists for the dispute" }
  - { id: ERR_DISPUTE_NOT_WITHDRAWABLE, http: 422, condition: "withdrawal attempted on a PRO-opened dispute or by a non-owning licensee" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "adjustment approver/rejecter is the same user who created it" }
  - { id: ERR_CLAIMS_WINDOW_CLOSED, http: 422, condition: "late-claim adjustment filed or approved after cycle.claims_open_until" }
  - { id: ERR_UNCLAIMED_POOL_INSUFFICIENT, http: 422, condition: "late-claim approve with delta_cents greater than the cycle pool balance (full-coverage rule)" }
  - { id: ERR_ESCHEAT_NOT_YET_DUE, http: 422, condition: "escheat requested on or before claims_open_until + ESCHEAT_GRACE_DAYS" }
  - { id: ERR_ESCHEAT_AMOUNT_INVALID, http: 422, condition: "escheat amount <= 0 or greater than pool balance" }
  - { id: ERR_AUDIT_SCOPE_TOO_OLD, http: 422, condition: "audit scope_period_end more than 1095 days before the logical clock date" }
  - { id: ERR_AUDIT_CLOSE_REQUIRES_ADJUSTMENT, http: 422, condition: "closing an audit with positive findings without a non-REJECTED AUDIT_FINDING adjustment" }
  - { id: ERR_STATEMENTS_NOT_FINALIZED, http: 422, condition: "cycle distribute attempted while current-epoch statements remain DRAFT" }
  - { id: ERR_CYCLE_NO_PERFORMANCES, http: 422, condition: "close-collection attempted with zero ACCEPTED performances captured in the cycle" }

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProRegistrar
    description: "PRO affiliation and repertoire registration operator"
    identity: opaque
    exclusive_operations:
      - "POST /pro/affiliates"
      - "PATCH /pro/affiliates/{id}"
      - "POST /pro/works/{id}/confirm"
      - "POST /pro/works/{id}/resolve-conflict"
    shared_operations:
      - "GET affiliates/works/share-claims reads"
  - name: ProLicensingAdmin
    description: "PRO licensing operator: licensees, licenses, negotiation, suspension"
    identity: opaque
    exclusive_operations:
      - "POST /pro/licensees"
      - "PATCH /pro/licensees/{id}"
      - "POST /pro/licensees/{id}/licenses"
      - "POST /pro/licenses/{id}/suspend, /reinstate, /terminate"
      - "POST /pro/disputes/{id}/settle"
    shared_operations:
      - "POST /pro/disputes/{id}/negotiate (with Licensee)"
      - "POST /pro/licenses/{id}/disputes (PRO-initiated disputes, opened_by_role=PRO)"
      - "GET licensees/licenses/disputes reads"
  - name: RateCourtOfficer
    description: "Rate court official adjudicating escalated disputes"
    identity: opaque
    exclusive_operations:
      - "POST /pro/rate-court-cases/{id}/open-hearing"
      - "POST /pro/rate-court-cases/{id}/decide"
      - "POST /pro/rate-court-cases/{id}/dismiss"
    shared_operations:
      - "GET disputes/rate-court-cases reads"
  - name: RoyaltyDistributor
    description: "PRO royalty operations: performance ingestion, cycles, statements"
    identity: opaque
    exclusive_operations:
      - "POST /pro/performances, /pro/performances/bulk"
      - "POST /pro/performances/{id}/void"
      - "POST /pro/cycles and all cycle actions"
      - "POST /pro/cycles/{id}/performances/capture"
      - "POST /pro/statements/{id}/finalize"
    shared_operations:
      - "POST /pro/statements/{id}/adjustments (with FinanceOfficer, Publisher, Songwriter)"
      - "GET performances/cycles/statements reads"
  - name: FinanceOfficer
    description: "PRO finance: adjustment approval, audits, escheatment — segregated from adjustment creation it approves"
    identity: opaque
    exclusive_operations:
      - "POST /pro/adjustments/{id}/approve, /reject, /apply"
      - "POST /pro/licensees/{id}/audits and audit actions"
      - "POST /pro/pools/{id}/escheat"
    shared_operations:
      - "POST /pro/statements/{id}/adjustments (as creator; cannot approve own)"
      - "GET statements/adjustments/audits/pools reads"
  - name: Publisher
    description: "Affiliated publisher acting on its own works and claims"
    identity: "entity_backed:Affiliate"
    exclusive_operations:
      - "POST /pro/works"
      - "POST /pro/works/{id}/withdraw"
    shared_operations:
      - "POST /pro/works/{id}/share-claims (own affiliate_id only)"
      - "POST /pro/share-claims/{id}/revoke (own claims only)"
      - "POST /pro/share-claims/{id}/dispute (claims on a work where caller holds a claim)"
      - "POST /pro/statements/{id}/adjustments (own statements only, reason=LATE_CLAIM)"
      - "GET own works/claims/performances/statements"
  - name: Songwriter
    description: "Affiliated songwriter asserting writer shares and late claims"
    identity: "entity_backed:Affiliate"
    exclusive_operations: []
    shared_operations:
      - "POST /pro/works/{id}/share-claims (own affiliate_id only)"
      - "POST /pro/share-claims/{id}/revoke (own claims only)"
      - "POST /pro/share-claims/{id}/dispute (claims on a work where caller holds a claim)"
      - "POST /pro/statements/{id}/adjustments (own statements only, reason=LATE_CLAIM)"
      - "GET own claims/statements/performances"
  - name: Licensee
    description: "Licensed broadcaster/digital service/venue operator"
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /pro/licenses/{id}/disputes (own licenses only)"
      - "POST /pro/disputes/{id}/escalate (own disputes only)"
      - "POST /pro/disputes/{id}/withdraw (own disputes only)"
    shared_operations:
      - "POST /pro/disputes/{id}/negotiate (own disputes, with ProLicensingAdmin)"
      - "PATCH /pro/licensees/{id} (self only, revenue/usage)"
      - "GET own licenses/disputes/audits/performances"
  - name: ProSystemAdmin
    description: "Operator of the logical clock test-driving endpoint"
    identity: opaque
    exclusive_operations:
      - "POST /pro/_clock/set_current_utc"
    shared_operations: []
