      - name: observation_extension_max_aggregates_across_events_and_never_sums_them
        claim_type: constants_applied
        grounds:
          - calculations.observation_extension
          - calculations.observation_extension.constants.ABORT_MIN_EXTENSION
          - entities.AdverseEvent.fields.observation_extension_minutes
          - entities.Appointment.fields.observation_extension_minutes
        distinguishing_aspect: |
          Four reactions on one visit walk the whole grade map and prove the aggregation
          is MAX, not SUM: grade 2 lifts the extension to 30 (window 90/270/810), grade 1
          contributes 0 and leaves the window byte-identical, grade 4 with action HOLD
          contributes 120 so the delta applied is 90 not 120 (window 180/360/900), and a
          final grade-1 event with action ABORT carries its own floor of 60 yet cannot
          lower the appointment's max of 120. A summing implementation would report 150
          and an end_minute of 930.
        test_recipe:
          setup:
            - "The canonical full chain taken to OBSERVING at clock 2026-08-10T11:30:00Z, plan total_cycles 6, chair A1 holding only this visit so no bump can interfere."
            - "At entry the visit reads observation_minutes 60, chair_minutes 240, end_minute 780, observation_extension_minutes 0."
