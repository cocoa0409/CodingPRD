            - "The filing at clock 2026-09-09T00:00:01Z succeeds with HTTP 201: Case.${case_2_id}.status == FILED, version == 1, required_seat_count == 1, assessed_fee_cents == 150000"
            - "Case.${case_2_id}.created_at == 2026-09-09T00:00:01Z and Complainant.${cpl_id}.open_case_count == 1"
            - "GET /udrp/cases?domain_id=${dom_id} now reports meta.total_count == 2"

      - name: implementation_deadline_instant_is_still_inside_the_waiting_period
        grounds:
          - calculations.implementation_window
          - validations[priority=72].ERR_IMPLEMENTATION_PERIOD_ACTIVE
          - validations[priority=73].ERR_CHALLENGE_WINDOW_CLOSED
          - state_machines.Decision.ISSUED_to_IMPLEMENTED
          - state_machines.DomainName.LOCKED_to_TRANSFER_EXECUTED
        distinguishing_aspect: |
          One instant carries two opposite inclusive boundaries. The decision is issued at
          2026-09-01T10:00:00Z, so ten business days - skipping both weekends and the provider holiday
          2026-09-07 - put implementation_deadline_at at 2026-09-16T10:00:00Z and preserve the
          10:00:00 time of day. At exactly that instant the registrar still cannot act
          (ERR_IMPLEMENTATION_PERIOD_ACTIVE, because the rule reads "at or before"), while a court
          challenge would still be admissible; one second later the challenge is refused
          (ERR_CHALLENGE_WINDOW_CLOSED) and the very same implementation call succeeds. Dropping the
          holiday gives 2026-09-15, and a date-only comparison lets the registrar act a whole day
          early.
