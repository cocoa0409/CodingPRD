scaffold_corner_design:
- section: entities
  instances:
  - name: station_create_applies_defaults_and_returns_common_fields
    claim_type: Creation
    grounds:
    - entities.Station
    - endpoints.POST /stations
    distinguishing_aspect: Creating a station with only name and zone_code returns 201 with surge_enabled defaulted true, pay_liabilities_cents
      0, version 1, and server-generated id/created_at/updated_at.
    test_recipe:
      setup:
      - Clock at default 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - &id005
        call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      assert:
      - response status 201, response_type object
      - Station.${st}.surge_enabled == true (default applied)
      - Station.${st}.pay_liabilities_cents == 0
      - Station.${st}.version == 1 and id/created_at/updated_at are non-null
  - name: driver_register_applies_computed_defaults_and_spawns_screening
    claim_type: Defaults
    grounds:
    - entities.Driver
    - entities.BackgroundScreening
    - endpoints.POST /drivers/register
    distinguishing_aspect: Registration returns 201 with status APPLIED, rating_tier STANDARD, reliability_score_bp 10000, both rating scores
      0, and exactly one BackgroundScreening in INITIATED is created for the driver.
    test_recipe:
      setup:
      - Clock at default; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - &id002
        call: POST /drivers/register
        payload:
          legal_name: Dana One
          email: dana.one@example.com
        as: Anonymous
        captures:
          d: $.data.id
      - &id003
        call: GET /drivers/${d}/screenings
        as: PlatformAdmin
        captures:
          sc: $.data[0].id
      assert:
      - Driver.${d}.status == "APPLIED", rating_tier == "STANDARD", reliability_score_bp == 10000, rating_score_x100 == 0, lifetime_rating_x100
        == 0
      - BackgroundScreening.${sc}.status == "INITIATED" and its driver_id == ${d}
  - name: computed_fields_ignored_input_on_register
    claim_type: Computed Fields
    grounds:
    - entities.Driver.fields.rating_tier
    - endpoints.POST /drivers/register
    distinguishing_aspect: Client-supplied computed/system fields (rating_tier, reliability_score_bp, status) on registration are ignored — the
      response carries the system defaults, not the supplied values.
    test_recipe:
      setup:
      - Clock at default; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /drivers/register
        payload:
          legal_name: Mallory Cheat
          email: mallory.cheat@example.com
          rating_tier: PREMIER
          reliability_score_bp: 1
          status: ACTIVE
        as: Anonymous
        captures:
          dm: $.data.id
      assert:
      - Driver.${dm}.rating_tier == "STANDARD" (client value ignored)
      - Driver.${dm}.reliability_score_bp == 10000 and status == "APPLIED"
  - name: invalid_enum_member_rejected_with_validation_error
    claim_type: Type Constraints
    grounds:
    - entities.Vehicle.fields.vehicle_class
    - endpoints.POST /drivers/{driver_id}/vehicles
    distinguishing_aspect: vehicle_class must be one of SEDAN|SUV|VAN; TRUCK is rejected with ERR_VALIDATION (400) and no vehicle row is created.
    test_recipe:
      setup:
      - Driver registered (screening INITIATED; activation not required for vehicle registration).
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /drivers/${d}/vehicles
        payload:
          vin: VIN-BAD-CLASS
          vehicle_class: TRUCK
        as: Driver
        as_user_id: ${d}
        captures:
          err: $.data.error_id
      assert:
      - response status 400 and captured ${err} == "ERR_VALIDATION"
      - GET /drivers/${d}/vehicles returns an empty list
  - name: get_missing_block_returns_not_found
    claim_type: Not Found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints.GET /blocks/{block_id}
    distinguishing_aspect: GET /blocks/{id} with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND with the error envelope shape.
    test_recipe:
      setup:
      - Clock at default; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: GET /blocks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: StationOps
        captures:
          err: $.data.error_id
      assert:
      - response status 404, response_type error, captured ${err} == "ERR_NOT_FOUND"
      - meta.api_request_id present on the error response
  - name: insurance_status_none_until_first_attestation
    claim_type: Computed Fields
    grounds:
    - entities.Vehicle.fields.insurance_status
    distinguishing_aspect: A freshly created vehicle has insurance_status NONE (never attested), distinct from EXPIRED — attest-insurance is the
      only path to ATTESTED.
    test_recipe:
      setup:
      - Driver registered.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - &id004
        call: POST /drivers/${d}/vehicles
        payload:
          vin: VIN-D1-0001
          vehicle_class: SEDAN
        as: Driver
        as_user_id: ${d}
        captures:
          v: $.data.id
          ins: $.data.insurance_status
      assert:
      - Vehicle.${v}.insurance_status == "NONE" (captured ${ins})
      - Vehicle.${v}.status == "ACTIVE" and insurance_expires_on is null
  - name: onboarded_driver_get_round_trips_profile_fields
    claim_type: Retrieval
    grounds:
    - entities.Driver
    - endpoints.GET /drivers/{driver_id}
    distinguishing_aspect: After full onboarding, GET returns legal_name/email verbatim plus status ACTIVE — stored input fields round-trip unchanged.
    test_recipe:
      setup:
      - Driver fully onboarded and activated.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - &id006
        call: POST /screenings/${sc}/begin-review
        as: PlatformAdmin
      - &id007
        call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
      - *id004
      - &id008
        call: POST /vehicles/${v}/attest-insurance
        payload:
          insurance_expires_on: '2027-01-01'
        as: Driver
        as_user_id: ${d}
      - &id009
        call: POST /drivers/${d}/activate
        as: PlatformAdmin
      trigger:
      - call: GET /drivers/${d}
        as: Driver
        as_user_id: ${d}
        captures:
          nm: $.data.legal_name
          em: $.data.email
          stt: $.data.status
      assert:
      - captured ${nm} == "Dana One" and ${em} == "dana.one@example.com"
      - captured ${stt} == "ACTIVE"
  - name: rating_event_is_append_only_with_no_mutation_endpoint
    claim_type: Immutability
    grounds:
    - entities.RatingEvent
    distinguishing_aspect: RatingEvent exposes only list reads (driver and assignment sub-resources); no PUT/PATCH/DELETE endpoint exists in §1.5,
      so events are immutable once created.
    test_recipe:
      setup:
      - Driver onboarded; one clean completion on the warm-up block producing exactly one RatingEvent with points 500.
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - &id010
        call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:00:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bw: $.data.id
      - &id011
        call: POST /blocks/${bw}/publish
        as: StationOps
      - &id012
        call: POST /blocks/${bw}/accept
        payload:
          vehicle_id: ${v}
        as: Driver
        as_user_id: ${d}
        captures:
          aw: $.data.id
      - &id013
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T01:45:00Z'
        as: PlatformAdmin
      - &id014
        call: POST /assignments/${aw}/check-in
        as: Driver
        as_user_id: ${d}
      - &id017
        call: POST /assignments/${aw}/load-packages
        payload:
          packages:
          - tracking_code: PW-1
            billable_weight_kg: 1.0
            promised_by: '2026-09-01T03:00:00Z'
        as: StationOps
      - &id015
        call: POST /assignments/${aw}/depart
        as: Driver
        as_user_id: ${d}
      - &id016
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:30:00Z'
        as: PlatformAdmin
      - &id018
        call: GET /assignments/${aw}/packages
        as: StationOps
        captures:
          pw1: $.data[0].id
      - &id019
        call: POST /packages/${pw1}/deliver
        payload:
          photo_url: https://img.example/pw1.jpg
          photo_gps_tagged: true
        as: Driver
        as_user_id: ${d}
      - &id020
        call: POST /assignments/${aw}/complete
        as: StationOps
      trigger:
      - call: GET /drivers/${d}/rating-events
        as: Driver
        as_user_id: ${d}
        captures:
          ev0_points: $.data[0].points
          ev0_type: $.data[0].event_type
      - call: GET /assignments/${aw}/rating-events
        as: StationOps
      assert:
      - driver event list has total_count == 1 with captured ${ev0_points} == 500 and ${ev0_type} == "COMPLETION_SCORE"
      - the assignment-scoped list returns the same single event (FK reverse reachability)
      - no update/delete endpoint exists for RatingEvent in §1.5 (immutability by contract)
- section: state_machines
  instances:
  - name: screening_clear_happy_path_records_decided_at
    claim_type: valid_transition
    grounds:
    - state_machines.BackgroundScreening.INITIATED_to_IN_REVIEW
    - state_machines.BackgroundScreening.IN_REVIEW_to_CLEARED
    distinguishing_aspect: INITIATED -> IN_REVIEW -> CLEARED records decided_at and nulls failure_reason.
    test_recipe:
      setup:
      - Driver registered; screening INITIATED.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - *id006
      - call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
        captures:
          stt: $.data.status
          dat: $.data.decided_at
      assert:
      - captured ${stt} == "CLEARED" and ${dat} == "2026-09-01T00:00:00Z" (logical clock)
      - BackgroundScreening.${sc}.failure_reason is null
  - name: decide_from_initiated_rejected_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.BackgroundScreening
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: decide requires IN_REVIEW; calling it directly on an INITIATED screening is rejected and nothing changes.
    test_recipe:
      setup:
      - Driver registered; screening INITIATED, begin-review never called.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - response 409, captured ${err} == "ERR_INVALID_STATE"
      - BackgroundScreening.${sc}.status remains "INITIATED"
  - name: failed_decision_missing_reason_rejected
    claim_type: violation_to_error
    grounds:
    - state_machines.BackgroundScreening.IN_REVIEW_to_FAILED
    - errors[ERR_VALIDATION]
    distinguishing_aspect: decision FAILED without failure_reason is rejected 400 ERR_VALIDATION — the FAILED branch carries a mandatory payload
      field that CLEARED does not.
    test_recipe:
      setup:
      - Driver registered; screening IN_REVIEW.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id006
      trigger:
      - call: POST /screenings/${sc}/decide
        payload:
          decision: FAILED
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - response 400, captured ${err} == "ERR_VALIDATION"
      - BackgroundScreening.${sc}.status remains "IN_REVIEW"
  - name: cleared_screening_reopen_rejected_terminal
    claim_type: terminal_lockdown
    grounds:
    - state_machines.BackgroundScreening
    distinguishing_aspect: From CLEARED (terminal), begin-review/decide/reopen are all rejected with ERR_INVALID_STATE; only fresh screenings
      can be created.
    test_recipe:
      setup:
      - Driver registered; screening CLEARED.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id006
      - *id007
      trigger:
      - call: POST /screenings/${sc}/reopen
        as: Driver
        as_user_id: ${d}
        captures:
          err: $.data.error_id
      assert:
      - response 409, captured ${err} == "ERR_INVALID_STATE"
      - BackgroundScreening.${sc}.status remains "CLEARED"
  - name: checkin_too_early_rejected_upper_bound_inclusive
    claim_type: precondition_enforcement
    grounds:
    - state_machines.BlockAssignment.ASSIGNED_to_CHECKED_IN
    - errors[ERR_CHECKIN_TOO_EARLY]
    distinguishing_aspect: Check-in at starts_at - 31 minutes is rejected ERR_CHECKIN_TOO_EARLY; at starts_at + 15 minutes exactly it succeeds
      (inclusive upper bound).
    test_recipe:
      setup:
      - Driver ACTIVE; block [02:00,04:00) accepted.
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T01:29:00Z'
        as: PlatformAdmin
      - call: POST /assignments/${aw}/check-in
        as: Driver
        as_user_id: ${d}
        captures:
          err: $.data.error_id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:15:00Z'
        as: PlatformAdmin
      - call: POST /assignments/${aw}/check-in
        as: Driver
        as_user_id: ${d}
        captures:
          stt: $.data.status
      assert:
      - first check-in rejected 409 with captured ${err} == "ERR_CHECKIN_TOO_EARLY"
      - second check-in at exactly starts_at+15min succeeds with captured ${stt} == "CHECKED_IN"
      - DeliveryBlock.${bw}.status == "IN_PROGRESS" after check-in
  - name: forfeit_relists_block_published_relist_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.DeliveryBlock.ASSIGNED_to_PUBLISHED
    - state_machines.BlockAssignment.ASSIGNED_to_FORFEITED
    distinguishing_aspect: 'The DeliveryBlock relist cycle: PUBLISHED -> ASSIGNED -> PUBLISHED preserves surge_multiplier_bp and estimated_pay_cents
      while clearing assigned_driver_id — the block can be accepted again.'
    test_recipe:
      setup:
      - Driver ACTIVE; block [12:00,14:00) accepted at 08:00.
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T12:00:00Z'
          ends_at: '2026-09-01T14:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bx: $.data.id
      - call: POST /blocks/${bx}/publish
        as: StationOps
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /blocks/${bx}/accept
        payload:
          vehicle_id: ${v}
        as: Driver
        as_user_id: ${d}
        captures:
          ax: $.data.id
      trigger:
      - call: POST /assignments/${ax}/forfeit
        as: Driver
        as_user_id: ${d}
      - call: GET /blocks/${bx}
        as: StationOps
        captures:
          bst: $.data.status
          bad: $.data.assigned_driver_id
          est: $.data.estimated_pay_cents
      assert:
      - captured ${bst} == "PUBLISHED" and ${bad} is null (relisted)
      - captured ${est} == 4000 (estimated pay retained, surge unchanged at 10000 bp)
      - BlockAssignment.${ax}.forfeit_cause == "DRIVER_INITIATED"
  - name: forfeit_after_checkin_rejected_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.BlockAssignment
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Driver-initiated forfeit is legal from ASSIGNED only; after check-in (CHECKED_IN) the same call is rejected — only
      deactivation can forfeit post-check-in assignments.
    test_recipe:
      setup:
      - Driver ACTIVE; block accepted; assignment CHECKED_IN.
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      trigger:
      - call: POST /assignments/${aw}/forfeit
        as: Driver
        as_user_id: ${d}
        captures:
          err: $.data.error_id
      assert:
      - response 409, captured ${err} == "ERR_INVALID_STATE"
      - BlockAssignment.${aw}.status remains "CHECKED_IN" and reliability_score_bp stays 10000
  - name: surge_cycle_sweeps_no_show_and_relists_block
    claim_type: side_effect_execution
    grounds:
    - calculations.surge_cycle_sweeps
    - state_machines.BlockAssignment.ASSIGNED_to_NO_SHOW
    distinguishing_aspect: 'An assignment still ASSIGNED at starts_at + 15 minutes is swept to NO_SHOW by run-surge-cycle: reliability drops by
      1000 and the block relists PUBLISHED in the same cycle.'
    test_recipe:
      setup:
      - Driver ACTIVE; block [02:00,04:00) accepted at 01:00; clock advanced to 02:15 (exactly the no-show boundary).
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - *id010
      - *id011
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T01:00:00Z'
        as: PlatformAdmin
      - *id012
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:15:00Z'
        as: PlatformAdmin
      - call: POST /stations/${st}/run-surge-cycle
        payload:
          expected_station_version: ${stv}
        as: StationOps
      - call: GET /assignments/${aw}
        as: StationOps
        captures:
          ast: $.data.status
      - call: GET /drivers/${d}
        as: PlatformAdmin
        captures:
          rel: $.data.reliability_score_bp
      - call: GET /blocks/${bw}
        as: StationOps
        captures:
          bst: $.data.status
      assert:
      - captured ${ast} == "NO_SHOW" (swept at exactly starts_at + 15 min, inclusive)
      - captured ${rel} == 9000 (10000 - 1000)
      - captured ${bst} == "PUBLISHED" with assigned_driver_id null
  - name: appeal_decide_without_evidence_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'decide requires evidence_count >= 1: an appeal still SUBMITTED (no evidence) cannot be decided even by the reviewer.'
    test_recipe:
      setup:
      - Driver ACTIVE then deactivated; appeal SUBMITTED with no evidence.
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - call: POST /drivers/${d}/deactivate
        payload:
          reason: policy violation
        as: PlatformAdmin
      - call: POST /drivers/${d}/appeals
        payload:
          reason: mistaken identity
        as: Driver
        as_user_id: ${d}
        captures:
          ap: $.data.id
      trigger:
      - call: POST /appeals/${ap}/decide
        payload:
          decision: UPHELD
        as: AppealsReviewer
        captures:
          err: $.data.error_id
      assert:
      - response 409, captured ${err} == "ERR_INVALID_STATE"
      - Appeal.${ap}.status remains "SUBMITTED" with evidence_count == 0
- section: calculations
  instances:
  - name: surge_escalation_boundary_at_exactly_120_minutes
    claim_type: threshold_boundary
    grounds:
    - calculations.surge_escalation
    distinguishing_aspect: Block starting in exactly 120 minutes at cycle time escalates to 12500 bp (inclusive <=), while a block at 121 minutes
      stays 10000 bp — estimated_pay_cents recomputed accordingly.
    test_recipe:
      setup:
      - Station created (version 1). Blocks X [02:00,04:00) and Y [02:01,04:00), both base 4000, published; clock at default 00:00.
      setup_api_calls:
      - *id001
      - *id005
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:00:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bx: $.data.id
      - call: POST /blocks/${bx}/publish
        as: StationOps
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:01:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          by: $.data.id
      - call: POST /blocks/${by}/publish
        as: StationOps
      trigger:
      - call: POST /stations/${st}/run-surge-cycle
        payload:
          expected_station_version: ${stv}
        as: StationOps
      - call: GET /blocks/${bx}
        as: StationOps
        captures:
          mx: $.data.surge_multiplier_bp
          ex: $.data.estimated_pay_cents
      - call: GET /blocks/${by}
        as: StationOps
        captures:
          my: $.data.surge_multiplier_bp
          ey: $.data.estimated_pay_cents
      assert:
      - captured ${mx} == 12500 and ${ex} == 5000 (120-minute bracket inclusive)
      - captured ${my} == 10000 and ${ey} == 4000 (121 minutes -> no escalation)
  - name: completion_points_floored_at_100
    claim_type: constants_applied
    grounds:
    - calculations.completion_rating_points
    distinguishing_aspect: 'One late (500-100) + one photo-noncompliant (500-150) + one returned package (500-200) on a single assignment: 500-100-150-200
      = 50 is floored to the 100-point minimum.'
    test_recipe:
      setup:
      - Driver ACTIVE; block accepted/checked-in; packages L1 (1.0kg, promised 11:00), L2 (1.0kg, promised 11:00), L3 (1.0kg, promised 12:00);
        departed 09:46. L1 delivered late 11:05 compliant; L2 delivered 10:30 with photo but gps false; L3 reported failed.
      setup_api_calls:
      - *id001
      - *id005
      - *id002
      - *id003
      - *id006
      - *id007
      - *id004
      - *id008
      - *id009
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T10:00:00Z'
          ends_at: '2026-09-01T13:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 5000
        as: StationOps
        captures:
          bx: $.data.id
