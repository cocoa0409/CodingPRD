            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 1000 }, as: Estimator, captures: { l1: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/negotiation-rounds", payload: { dispositions: [ { estimate_line_id: "${l1}", proposed_qty: 900 } ] }, as: Adjuster, captures: { rd_id: $.data.id, rd_disputed: $.data.disputed_amount_cents } }
            - { call: "GET /v1/negotiation-rounds/${rd_id}/dispositions", payload: {}, as: Adjuster, captures: { disp_id: $.data.0.id } }
            - { call: "POST /v1/dispositions/${disp_id}/respond", payload: { outcome: "REJECT" }, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/revise", payload: {}, as: Estimator, captures: { st_rev: $.data.status } }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { est_v: $.data.version } }
            - { call: "PATCH /v1/estimates/${est_id}/lines/${l1}", payload: { expected_estimate_version: "${est_v}", qty: 950 }, as: Estimator }
