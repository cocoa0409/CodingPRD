  # ===========================================================================
  - section: validations
    instances:

      - name: missing_headers_and_role_gate_returns_401_403
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The first two rungs of the ladder, which every other instance takes for
          granted. Three distinct authentication failures (X-Role absent,
          X-User-ID absent, X-Role not one of the six declared roles) all collapse
          to ERR_UNAUTHENTICATED 401, and only a well-formed identity that lacks
          the endpoint's role reaches ERR_UNAUTHORIZED 403 — proving 401 is
          evaluated strictly before 403.
        test_recipe:
          setup:
            - "One reporting entity exists so the listing endpoint has content; no other state is needed."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
          trigger:
            - call: "GET /reporting-entities"
              payload: {}
              headers: { X-User-ID: "u-1" }
              captures: { e_no_role: $.data.error_id }
            - call: "GET /reporting-entities"
              payload: {}
              headers: { X-Role: "ProgramAdmin" }
              captures: { e_no_user: $.data.error_id }
            - call: "GET /reporting-entities"
              payload: {}
              headers: { X-Role: "Inspector", X-User-ID: "u-1" }
              captures: { e_bad_role: $.data.error_id }
            - call: "GET /reporting-entities"
              payload: {}
              as: PublicUser
              captures: { e_public: $.data.error_id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-999", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 } }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { e_reporter_plant: $.data.error_id }
          assert:
            - "${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_no_user} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_bad_role} == ERR_UNAUTHENTICATED with HTTP 401 (an unrecognised role string is an authentication failure, not a 403)"
            - "${e_public} == ERR_UNAUTHORIZED with HTTP 403 (PublicUser is a valid identity but not a reader of the reporter registry)"
            - "${e_reporter_plant} == ERR_UNAUTHORIZED with HTTP 403 and no Plant is created"
            - "Every error body carries response_type == 'error' and data == { error_id, message } only"

      - name: malformed_inputs_return_400_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Rung 3 across its four distinct sub-kinds on endpoints no other instance
          probes this way: an absent required field, an out-of-enum value, a
          violated intra-payload ordering (period_start before period_end and the
          deadline chain), and out-of-range pagination arguments (limit 0, limit
          101, negative offset) — all one error id, all before any lookup, so no
          404 is ever reached even though the entity ids in the payloads are real.
        test_recipe:
          setup:
            - "One reporting entity exists to supply a valid reporting_entity_id, so the only defect in each call is the malformed input itself."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
          trigger:
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", annual_head_history: { "2021": 1, "2022": 1, "2023": 1, "2024": 1, "2025": 1 } }
              as: ProgramAdmin
              captures: { e_missing: $.data.error_id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "GOAT", annual_head_history: { "2021": 1, "2022": 1, "2023": 1, "2024": 1, "2025": 1 } }
              as: ProgramAdmin
              captures: { e_enum: $.data.error_id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-10T00:00:00Z", period_end: "2026-08-03T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_period: $.data.error_id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-19T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-20T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_deadlines: $.data.error_id }
            - call: "GET /plants"
              payload: { limit: 0 }
              as: ProgramAdmin
              captures: { e_limit_low: $.data.error_id }
            - call: "GET /plants"
              payload: { limit: 101 }
              as: ProgramAdmin
              captures: { e_limit_high: $.data.error_id }
            - call: "GET /plants"
              payload: { offset: -1 }
              as: ProgramAdmin
              captures: { e_offset: $.data.error_id }
          assert:
            - "${e_missing} == ERR_INVALID_REQUEST with HTTP 400 (species is required)"
            - "${e_enum} == ERR_INVALID_REQUEST with HTTP 400 ('GOAT' is outside the declared species enum)"
            - "${e_period} == ERR_INVALID_REQUEST with HTTP 400 (period_start must precede period_end)"
            - "${e_deadlines} == ERR_INVALID_REQUEST with HTTP 400 (submission_deadline <= correction_deadline <= publication_release is violated)"
            - "${e_limit_low} == ${e_limit_high} == ${e_offset} == ERR_INVALID_REQUEST with HTTP 400 (limit must lie in [1,100] and offset must be >= 0)"
            - "No Plant and no ReportingWindow row is created by any of the rejected calls"

      - name: purchase_type_data_element_rules_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_39_ERR_MISSING_PURCHASE_TYPE_ELEMENT
          - validations.priority_40_ERR_FORBIDDEN_PURCHASE_TYPE_ELEMENT
          - validations.priority_30_ERR_FORWARD_DELIVERY_INTERVAL_INVALID
        distinguishing_aspect: |
          The required-data-elements matrix, exercised in both polarities on every
          purchase type that carries conditional fields: three MISSING cases
          (FORMULA without a base reference, NEGOTIATED_GRID without a grid
          adjustment, FORWARD_CONTRACT without delivery dates), two FORBIDDEN
          cases (NEGOTIATED carrying a base reference, FORMULA carrying a grid
          adjustment), the degenerate delivery interval, and finally a
          well-formed FORWARD_CONTRACT that is accepted — so the matrix is proven
          field-by-field rather than by a single rejection.
        test_recipe:
          setup:
            - "Alpha Packing with plant EST-101 (forward_commitment_cap_head 3000) holds a DRAFT filing in a CATTLE / LIVE_ANIMAL window; line items may be attached while the filing is DRAFT."
