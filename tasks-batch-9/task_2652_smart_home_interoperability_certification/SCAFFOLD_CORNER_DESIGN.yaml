            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 2, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /test-laboratories/${lab_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
