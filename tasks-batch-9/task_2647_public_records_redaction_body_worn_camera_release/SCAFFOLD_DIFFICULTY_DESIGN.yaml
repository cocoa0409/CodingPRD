        grounds:
          - state_machines.PublicRecordsRequest.INTAKE_to_SCOPING
          - state_machines.PublicRecordsRequest.SCOPING_to_EXEMPTION_REVIEW
          - state_machines.PublicRecordsRequest.EXEMPTION_REVIEW_to_REDACTION
          - state_machines.PublicRecordsRequest.NOT_ASSESSED_to_DEPOSIT_DUE
          - state_machines.PublicRecordsRequest.DEPOSIT_DUE_to_DEPOSIT_PAID
          - calculations.statutory_deadline
          - entities.PublicRecordsRequest.fields.processing_status
          - entities.PublicRecordsRequest.fields.fee_status
          - entities.PublicRecordsRequest.fields.tolled_days
          - concurrency_rules[scope-clarification-stale-request]
        distinguishing_aspect: |
          Non-linearity by PARALLEL DIMENSIONS on PublicRecordsRequest: processing_status
          walks INTAKE -> SCOPING -> EXEMPTION_REVIEW -> REDACTION while fee_status walks
          NOT_ASSESSED -> DEPOSIT_DUE -> DEPOSIT_PAID on the same row, and each dimension
