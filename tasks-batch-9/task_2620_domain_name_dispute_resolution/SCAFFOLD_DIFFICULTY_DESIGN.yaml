            - call: "POST /udrp/cases/${case_id}/appointments"
              payload: { seat: "PRESIDING", nominated_by: "PROVIDER", expected_case_version: "${cv1}", panelist_id: "${pan_pres_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { apt_pres_id: "$.data.id" }
            - call: "POST /udrp/appointments/${apt_pres_id}/conflict-screening"
              payload: { disclosed_prior_representation: false, disclosed_same_firm: false, disclosed_financial_interest: false, prior_appointments_with_complainant: 0 }
              as: Panelist
              as_user_id: "${pan_pres_id}"
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cv2: "$.data.version" }
            - call: "POST /udrp/cases/${case_id}/appointments"
              payload: { seat: "CO_PANELIST_1", nominated_by: "COMPLAINANT", expected_case_version: "${cv2}", panelist_id: "${pan_co1_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { apt_co1_id: "$.data.id" }
            - call: "POST /udrp/appointments/${apt_co1_id}/conflict-screening"
