        claim_type: Derived Field Reconciliation
        grounds: [entities.EstimateLetter.fields.is_stale, calculations.itinerary_total_estimate]
        distinguishing_aspect: "is_stale is computed as itinerary_revision_at_issue < current revision: a letter issued at revision 2 reads is_stale false; after a visit cancel bumps revision to 3 the same letter reads is_stale true."
