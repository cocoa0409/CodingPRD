  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: clinic_padded_interval_location_conflict
        grounds:
          - state_machines.OutreachClinic.PROPOSED_to_CONFIRMED
          - errors.ERR_CLINIC_LOCATION_CONFLICT
        distinguishing_aspect: |
          Interval semantics 1 (asymmetric padded-end buffer): two clinics at the same
          coordinates conflict unless other's end_date + 7 days < this start_date (or
          vice versa). An existing clinic ending 2026-10-02 blocks a new clinic
          starting 2026-10-08 (2+7 = 2026-10-09 is NOT < 2026-10-08) but ALLOWS one
          starting 2026-10-10 (2026-10-09 < 2026-10-10). The padding applies only to
          the end side — start-side adjacency gets no buffer.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5. Clinic CL1 CONFIRMED at (45.67,-118.79), 2026-10-01..2026-10-02. Clinic CL2 PROPOSED at same coords, 2026-10-08..2026-10-09. Clinic CL3 PROPOSED at same coords, 2026-10-10..2026-10-11."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton", latitude: 45.67, longitude: -118.79, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-02T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl1: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/confirm"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton-too-soon", latitude: 45.67, longitude: -118.79, start_date: "2026-10-08T00:00:00Z", end_date: "2026-10-09T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl2: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton-ok", latitude: 45.67, longitude: -118.79, start_date: "2026-10-10T00:00:00Z", end_date: "2026-10-11T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl3: $.data.id }
          trigger:
            - call: "POST /charity-care/outreach-clinics/${cl2}/confirm"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { err_cl2: $.data.error_id }
            - call: "POST /charity-care/outreach-clinics/${cl3}/confirm"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
          assert:
            - "CL2 confirm returns 409 and err_cl2 == ERR_CLINIC_LOCATION_CONFLICT   # 2026-10-02 + 7d = 2026-10-09 not < 2026-10-08"
            - "OutreachClinic.${cl2}.status == PROPOSED"
            - "CL3 confirm succeeds: OutreachClinic.${cl3}.status == CONFIRMED        # 2026-10-09 < 2026-10-10"

      - name: screening_date_inside_closed_interval_and_capacity
        grounds:
          - state_machines.OutreachScreening
          - errors.ERR_SCREENING_DATE_OUTSIDE_CLINIC
          - errors.ERR_CLINIC_CAPACITY_REACHED
        distinguishing_aspect: |
          Interval semantics 2 (closed-interval membership vs aggregate capacity —
          different resource, different arithmetic from the sibling's padded buffer):
          screening_date equal to start_date or end_date is INSIDE (closed both ends),
          one day past end_date is outside; and the third booking into a capacity-2
          clinic fails on the aggregate count even with a perfectly valid date.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5. Clinic CL1 PROPOSED at (45.67,-118.79), 2026-10-01..2026-10-02, capacity 2."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton", latitude: 45.67, longitude: -118.79, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-02T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "S Start", patient_date_of_birth: "2019-05-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-01T00:00:00Z" }
              as: OutreachPlanner
