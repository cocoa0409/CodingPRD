        claim_type: violation_to_error
        grounds:
          - "errors[ERR_VERSION_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: curriculum_version_half_open_adjacency
          rationale: "Asserted as the V3 rejection of the named difficulty instance."

