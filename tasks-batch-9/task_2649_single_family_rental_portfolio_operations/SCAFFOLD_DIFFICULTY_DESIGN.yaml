            - call: "POST /scope-templates"
              payload: { code: "PAINT_INT", name: "Interior Paint", certification_code: "PAINT", unit: "HOME", benchmark_unit_cost_cents: 285050, default_crew_size: 3, default_crew_days: 3, safety_critical: false }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_paint_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "HVAC_REPLACE", name: "HVAC System Replacement", certification_code: "HVAC", unit: "SYSTEM", benchmark_unit_cost_cents: 612450, default_crew_size: 3, default_crew_days: 3, safety_critical: true }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_hvac_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "FLOOR_LVP", name: "Luxury Vinyl Plank Flooring", certification_code: "FLOOR", unit: "SQFT", benchmark_unit_cost_cents: 475, default_crew_size: 2, default_crew_days: 2, safety_critical: false }
              as: PortfolioAdmin
