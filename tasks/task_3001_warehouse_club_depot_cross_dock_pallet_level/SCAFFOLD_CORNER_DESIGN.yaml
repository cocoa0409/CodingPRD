scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: item_create_computes_pallet_quantity_and_ignores_client_override
        claim_type: computed_field
        grounds: ["calculations.pallet_quantity_design", entities.Item.fields.pallet_qty_units, "entities.Item.fields.pallets_per_slot"]
        distinguishing_aspect: "Computed fields pallet_qty_units (24*5*4=480) and pallets_per_slot (40x40 fits 48x40 slot -> 1) are system-computed at create; the response carries them."
        test_recipe:
          setup: ["Clock default; region and vendor exist"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "R", code: "RA", avg_member_income_cents: 1000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend A", vendor_code: "V210021" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2100021", description: "Beans", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { pallet_qty: $.data.pallet_qty_units, slots: $.data.pallets_per_slot, item_status: $.data.status, ver: $.data.version }
          assert:
            - "pallet_qty == 480 (24 * 5 * 4)"
            - "slots == 1 (footprint 1600 <= 1920)"
            - "item_status == DRAFT (initial state)"
            - "ver == 1"

      - name: oversized_item_footprint_consumes_two_slots
        claim_type: computed_field
        grounds: ["calculations.pallet_quantity_design", entities.Item.fields.pallets_per_slot]
        distinguishing_aspect: "Boundary on footprint area: 48x41 = 1968 > 1920 -> pallets_per_slot 2, while exactly 48x40 = 1920 stays at 1."
        test_recipe:
          setup: ["Region and vendor exist"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "R2", code: "RB", avg_member_income_cents: 1000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend B", vendor_code: "V220022" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2200022", description: "Exact fit", case_pack_qty: 10, pallet_length_in: 48, pallet_width_in: 40, cases_per_layer: 2, max_layers: 2, item_type: "REGULAR" }
              as: CategoryManager
              captures: { exact_slots: $.data.pallets_per_slot }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2200023", description: "One inch over", case_pack_qty: 10, pallet_length_in: 48, pallet_width_in: 41, cases_per_layer: 2, max_layers: 2, item_type: "REGULAR" }
              as: CategoryManager
              captures: { over_slots: $.data.pallets_per_slot }
          assert:
            - "exact_slots == 1 (1920 <= 1920, inclusive boundary)"
            - "over_slots == 2 (1968 > 1920)"

      - name: member_default_household_size_and_status
        claim_type: default_value
        grounds: ["entities.Member.fields.household_size", entities.Member.fields.status]
        distinguishing_aspect: "Omitting household_size defaults to 1; status defaults to ACTIVE."
        test_recipe:
          setup: ["Region and club exist"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "R3", code: "RC", avg_member_income_cents: 1000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "C3", club_number: 2101, floor_slot_capacity: 10, member_base: 100 }
              as: RegionalOps
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /wcd/members"
              payload: { club_id: "${club_id}", membership_number: "M000000601", tier: "GOLD_STAR" }
              as: MembershipDesk
              captures: { hh: $.data.household_size, st: $.data.status }
          assert:
            - "hh == 1 (default applied)"
            - "st == ACTIVE (default applied)"

      - name: region_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET on a non-existent region id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB at default clock"]
          setup_api_calls: []
          trigger:
            - call: "GET /wcd/regions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"

      - name: list_pagination_envelope_defaults
        claim_type: listing
        grounds: ["response_envelope.pagination_defaults"]
        distinguishing_aspect: "GET list with no pagination params returns default limit 10 envelope fields (total_count, has_more) and data array."
        test_recipe:
          setup: ["Two regions created"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "R4", code: "RD", avg_member_income_cents: 100 }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "R5", code: "RE", avg_member_income_cents: 200 }
              as: RegionalOps
          trigger:
            - call: "GET /wcd/regions"
              payload: {}
              as: RegionalOps
              captures: { first_code: "$.data[0].code" }
          assert:
            - "response_type == array; data has 2 entries"
            - "first_code == RD (created_at ASC ordering)"

      - name: duplicate_region_code_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=12]", "errors[ERR_CONSTRAINT_VIOLATION]"]
        distinguishing_aspect: "Second region with the same code is rejected with ERR_CONSTRAINT_VIOLATION."
        test_recipe:
          setup: ["One region with code DUP exists"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "R6", code: "DUP", avg_member_income_cents: 100 }
              as: RegionalOps
          trigger:
            - call: "POST /wcd/regions"
              payload: { name: "R7", code: "DUP", avg_member_income_cents: 200 }
              as: RegionalOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONSTRAINT_VIOLATION (422)"

      - name: invalid_region_code_format_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Region code lowercase 'abc' violates ^[A-Z]{2,4}$ -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wcd/regions"
              payload: { name: "R8", code: "abc", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION (400)"

      - name: create_region_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /wcd/regions without avg_member_income_cents -> ERR_INVALID_REQUEST 400 (missing-field beats format validation)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wcd/regions"
              payload: { name: "R9", code: "RF" }
              as: RegionalOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: appointment_checkin_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Appointment.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED (terminal) appointment rejects check-in with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; appointment checked in, 1 pallet received, completed"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "RG", code: "RG", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend G", vendor_code: "V230023" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "D G", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2300023", description: "X", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
            - call: "POST /wcd/appointments/${appt_id}/complete"
              payload: {}
              as: DepotManager
          trigger:
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409); terminal state locked down"

      - name: run_commit_transitions_allocations_and_pallets
        claim_type: side_effect_execution
        grounds: ["state_machines.CrossDockRun.transitions", "state_machines.Allocation.PROPOSED_to_COMMITTED", "state_machines.Pallet.ALLOCATED_to_SHIPPED"]
        distinguishing_aspect: "Committing an OPEN run moves its PROPOSED allocation to SHIPPED and the pallet to SHIPPED, sets committed_at."
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; club capacity 40; 1 pallet allocated (PROPOSED) in an OPEN run"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "RH", code: "RH", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend H", vendor_code: "V240024" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "C H", club_number: 2401, floor_slot_capacity: 40, member_base: 100 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "D H", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2400024", description: "Y", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_id: $.data.id }
            - call: "POST /wcd/cross-dock-runs"
              payload: { depot_id: "${depot_id}", run_date: "2026-09-02", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, run_v: $.data.version }
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v}" }
              as: DepotPlanner
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/commit"
              payload: {}
              as: DepotPlanner
              captures: { run_status: $.data.status }
            - call: "GET /wcd/allocations/${alloc_id}"
              payload: {}
              as: DepotPlanner
              captures: { alloc_status: $.data.status }
            - call: "GET /wcd/pallets/${pallet_id}"
              payload: {}
              as: DepotPlanner
              captures: { pallet_status: $.data.status }
          assert:
            - "run_status == COMMITTED"
            - "alloc_status == SHIPPED (PROPOSED -> COMMITTED -> SHIPPED)"
            - "pallet_status == SHIPPED"

      - name: run_cancel_voids_proposed_allocations_and_frees_pallets
        claim_type: side_effect_execution
        grounds: ["state_machines.CrossDockRun.transitions", "state_machines.Allocation.PROPOSED_to_VOIDED"]
        distinguishing_aspect: "Cancelling an OPEN run voids its PROPOSED allocations (void_reason RUN_CANCELLED) and returns pallets to RECEIVED."
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; 1 PROPOSED allocation in an OPEN run"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "RI", code: "RI", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend I", vendor_code: "V250025" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "C I", club_number: 2501, floor_slot_capacity: 40, member_base: 100 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "D I", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2500025", description: "Z", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_id: $.data.id }
            - call: "POST /wcd/cross-dock-runs"
              payload: { depot_id: "${depot_id}", run_date: "2026-09-02", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, run_v: $.data.version }
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v}" }
              as: DepotPlanner
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/cancel"
              payload: {}
              as: DepotPlanner
              captures: { run_status: $.data.status }
            - call: "GET /wcd/allocations/${alloc_id}"
              payload: {}
              as: DepotPlanner
              captures: { alloc_status: $.data.status, void_reason: $.data.void_reason }
            - call: "GET /wcd/pallets/${pallet_id}"
              payload: {}
              as: DepotPlanner
              captures: { pallet_status: $.data.status }
          assert:
            - "run_status == CANCELLED"
            - "alloc_status == VOIDED with void_reason == RUN_CANCELLED"
            - "pallet_status == RECEIVED (freed)"

      - name: pallet_stranded_after_day_rollover_and_reconciled
        claim_type: valid_transition
        grounds: ["state_machines.Pallet.RECEIVED_to_STRANDED", state_machines.Pallet.STRANDED_to_RECONCILED]
        distinguishing_aspect: "Advancing the clock past the pallet's received_date strands it; reconcile closes it RECONCILED."
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; 1 pallet received and never allocated"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "RJ", code: "RJ", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend J", vendor_code: "V260026" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "D J", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2600026", description: "W", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_id: $.data.id }
          trigger:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:01Z" }
              as: RegionalOps
            - call: "GET /wcd/pallets/${pallet_id}"
              payload: {}
              as: DepotManager
              captures: { stranded_status: $.data.status }
            - call: "POST /wcd/pallets/${pallet_id}/reconcile"
              payload: {}
              as: DepotManager
              captures: { reconciled_status: $.data.status }
          assert:
            - "stranded_status == STRANDED (day rollover auto-transition)"
            - "reconciled_status == RECONCILED"

      - name: item_activate_from_draft_recomputes_fields
        claim_type: valid_transition
        grounds: ["state_machines.Item.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "Activating a DRAFT item moves it to ACTIVE and bumps version."
        test_recipe:
          setup: ["Region, vendor, DRAFT item exist"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "RK", code: "RK", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend K", vendor_code: "V270027" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2700027", description: "V", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
              captures: { st: $.data.status, ver: $.data.version }
          assert:
            - "st == ACTIVE"
            - "ver == 2 (version incremented by the transition)"

      - name: double_request_deletion_second_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Item.ACTIVE_to_DELETION_REVIEW", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening deletion review on an item already in DELETION_REVIEW (without decision) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Region, vendor, club, ACTIVE item; item already moved to DELETION_REVIEW"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "RL", code: "RL", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
