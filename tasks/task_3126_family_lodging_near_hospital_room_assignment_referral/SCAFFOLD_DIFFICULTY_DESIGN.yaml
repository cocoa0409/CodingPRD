            - "A checks out 2026-09-05; the checkout cascade immediately re-offers: StayRequest.${srb_id}.assignment_status == OFFERED and offered_room_id == ${room_id}  (same-day turnover allowed: half-open [check_in, check_out) intervals)"

      - name: care_space_cleaning_buffer_blocks_adjacent_booking
        grounds:
          - calculations.care_space_conflict_window
          - errors.ERR_CARE_SPACE_CONFLICT
        distinguishing_aspect: |
          Different interval semantics on a different resource (CareSpace, not
          Room): each CONFIRMED booking blocks [start, end + 30min), so a
          booking starting 15 minutes after the previous one ends CONFLICTS,
          while one starting exactly at end + 30 minutes is accepted — a
          buffer-gap rule, not plain adjacency.
        test_recipe:
          setup:
            - "Hospital H with care space CS (capacity 6). Family F with a VERIFIED referral at H. Existing CONFIRMED booking 2026-09-03 09:00-10:00 UTC."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/hospitals/${hosp_id}/care-spaces"
              payload: { space_name: "Family Room 2A", space_type: "FAMILY_ROOM", capacity: 6 }
              as: ProgramAdmin
              captures: { cs_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/care-spaces/${cs_id}/bookings"
              payload: { family_id: "${fam_id}", start_at: "2026-09-03T09:00:00Z", end_at: "2026-09-03T10:00:00Z", party_size: 3 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /api/care-spaces/${cs_id}/bookings"
              payload: { family_id: "${fam_id}", start_at: "2026-09-03T10:15:00Z", end_at: "2026-09-03T11:00:00Z", party_size: 2 }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/care-spaces/${cs_id}/bookings"
              payload: { family_id: "${fam_id}", start_at: "2026-09-03T10:30:00Z", end_at: "2026-09-03T11:30:00Z", party_size: 2 }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { bk2_id: $.data.id }
          assert:
            - "booking at 10:15 rejected: status 409 and error_id == ERR_CARE_SPACE_CONFLICT  (inside the 30-minute buffer window [09:00, 10:30))"
            - "booking at exactly 10:30 succeeds: CareSpaceBooking.${bk2_id}.status == CONFIRMED  (adjacency at the buffer end is allowed)"
            - "GET /api/care-spaces/${cs_id}/bookings returns exactly 2 CONFIRMED bookings"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: room_census_conserved_across_checkin_checkout
        grounds:
          - calculations.house_occupancy_posture
          - state_machines.Stay.CHECKED_OUT
        distinguishing_aspect: |
          Conserved quantity = room census: for the house,
          occupied_room_count + reserved_room_count + available_room_count
          equals the number of AVAILABLE-status rooms at every step, and the
          check-in then check-out pair returns the census exactly to its
          starting values (occupied 0, reserved 0, available 1, posture OPEN).
        test_recipe:
          setup:
            - "One-room house, room AVAILABLE, no stays. Census: occupied 0, reserved 0, available 1, posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
          trigger:
            - call: "GET /api/houses/${house_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
            - call: "GET /api/houses/${house_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stays/${stay_id}/check-out"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/houses/${house_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "after offer (before check-in): House.${house_id} has reserved_room_count == 1, occupied_room_count == 0, available_room_count == 0  (sum == 1 AVAILABLE-status room)"
            - "after check-in: occupied_room_count == 1, reserved_room_count == 0, available_room_count == 0, posture == FULL  (sum still 1)"
            - "after check-out: occupied_room_count == 0, reserved_room_count == 0, available_room_count == 1, posture == OPEN  (forward + compensating action restored the census exactly)"

      - name: contribution_ledger_decomposition_conserved
        grounds:
          - calculations.contribution_ledger_invariant
          - entities.ContributionRequest.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity = the money decomposition of a ContributionRequest
          (different quantity type from the room census): through a payment, a
          waive, and a checkout-forgive, requested_amount_cents always equals
          paid + waived + forgiven + outstanding, and each compensating pair
          (pay then forgive the remainder) ends with outstanding 0 and no drift.
        test_recipe:
          setup:
            - "Stay checked in 2026-09-02 with two contribution requests: CR1 rate 2500 NONE planned 4 nights (requested 10000); CR2 rate 1000 NONE planned 4 nights (requested 4000). Checkout on 2026-09-04 (2 actual nights) re-anchors CR1 to 5000, CR2 to 2000."
