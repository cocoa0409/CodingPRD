  # ===========================================================================
  - section: rbac
    instances:

      - name: referral_creator_cannot_verify_own_referral
        claim_type: segregation_of_duties
        grounds: [roles.ProgramAdmin, state_machines.Referral.PENDING_to_VERIFIED, errors.ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation of duties: when the same opaque operator id (ProgramAdmin pa-1) both created and attempts to verify a referral, verification is refused with ERR_SEGREGATION_OF_DUTIES; a different operator pa-2 can verify."
        test_recipe:
          setup:
            - "Hospital and family exist; referral created by ProgramAdmin pa-1 (PENDING)."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
              as_user_id: "pa-2"
          assert:
            - "same-operator verification rejected: status 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "second operator verification succeeds: Referral.${ref_id}.status == VERIFIED and verified_by_user_id == \"pa-2\""
            - "Referral.${ref_id}.valid_until == \"2026-10-01T00:00:00.000Z\"  (verified_at + 30 days at the default clock)"

      - name: family_contact_cannot_act_on_other_family
        claim_type: ownership_denial
        grounds: [roles.FamilyContact, errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Entity-backed identity: FamilyContact whose X-User-ID is family B cannot create a stay request naming family A — ERR_FORBIDDEN even though the payload is otherwise valid."
        test_recipe:
          setup:
            - "Hospital, house, families A and B; VERIFIED referral for family A."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fama_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Baker", primary_contact_name: "Bob Baker", home_city: "Hilltown", distance_miles: 150, child_patient_name: "Kate Baker" }
              as: ProgramAdmin
              captures: { famb_id: $.data.id, famb_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fama_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fama_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${famb_v}" }
              as: FamilyContact
              as_user_id: "${famb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN  (ownership fails before the OCC version check would even be evaluated)"

      - name: hospital_referrer_cannot_create_for_other_hospital
        claim_type: ownership_denial
        grounds: [roles.HospitalReferrer, errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Entity-backed identity on the hospital side: a HospitalReferrer whose X-User-ID is hospital H1 may not file a referral naming hospital H2."
        test_recipe:
          setup:
            - "Hospitals H1 and H2; one family."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
