# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2582 - Dependent Eligibility Verification Audit
# Sections and claim_type values come from references/claim-extraction-guide.md.
# Every numeric literal below was computed by executing the named calculations[].formula
# against its constants:. Corners already asserted by §1.8 appear as excluded_because stubs.
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_create_employee_returns_201_with_success_envelope_and_zero_dependent_count
        claim_type: creation
        grounds:
          - entities.Employee
          - endpoints[POST /employees]
          - response_envelope.success
        distinguishing_aspect: "A POST /employees carrying all five input fields returns 201 with response_type object, a meta.api_request_id, version 1 and the computed enrolled_dependent_count at 0."
        test_recipe:
          setup:
            - "The database is empty and the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "response response_type == object and response meta.api_request_id is a non-empty string"
            - "response data.full_name == Dana Reyes and response data.work_email == dana.reyes@acme.test"
            - "response data.coverage_tier == EMPLOYEE_SPOUSE and response data.employer_monthly_premium_cents == 121000"
            - "response data.enrolled_dependent_count == 0"
            - "response data.version == 1 and response data.created_at == 2026-08-01T00:00:00.000Z"

      - name: corner_get_dependent_returns_stored_row_with_system_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.Dependent
          - entities.Dependent.fields.enrolled_at
          - entities.Dependent.fields.monthly_cost_cents
          - endpoints[GET /dependents/{id}]
        distinguishing_aspect: "GET /dependents/{id} echoes the stored row: coverage_status ENROLLED, enrolled_at stamped from the clock date 2026-08-05, poe_program_id null and monthly_cost_cents 49713 from the SPOUSE constant."
        test_recipe:
          setup:
            - "Employee E1 exists and one SPOUSE dependent D1 was enrolled while the clock read 2026-08-05T00:00:00Z."
            - "No AuditProgram exists, so point-of-enrollment selection finds an empty candidate pool and the dependent is created ENROLLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
          trigger:
            - call: "GET /dependents/${dep1_id}"
              as: ProgramAdmin
          assert:
            - "HTTP status == 200"
            - "response data.id == ${dep1_id} and response data.employee_id == ${emp1_id}"
            - "response data.relationship_type == SPOUSE and response data.coverage_status == ENROLLED"
            - "response data.enrolled_at == 2026-08-05"
            - "response data.monthly_cost_cents == 49713"
            - "response data.poe_program_id == null and response data.poe_deadline_at == null"
            - "response data.accepted_proof_type_count == 0 and response data.documentation_complete == false"
            - "response data.paid_claims_total_cents == 0 and response data.recovery_revision == 0"

      - name: corner_list_audit_programs_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /audit-programs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT programs stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, limit 2 offset 2 returns 1 row with has_more false, and status=DRAFT keeps total_count at 3."
        test_recipe:
          setup:
            - "Three AuditPrograms exist for plan_year 2026 with distinct program_name values; all are still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Census Audit", plan_year: 2026 }
              as: ProgramAdmin
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 New Dependent Audit", plan_year: 2026 }
              as: ProgramAdmin
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Targeted Audit", plan_year: 2026 }
              as: ProgramAdmin
          trigger:
            - call: "GET /audit-programs"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              captures: { first_page_id: "$.data[0].id" }
            - call: "GET /audit-programs"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /audit-programs"
              payload: { status: "DRAFT", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 200, response response_type == array, len(response data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: len(response data) == 1, total_count == 3, has_more == false, offset == 2"
            - "Second call: response data[0].id != ${first_page_id}"
            - "Third call: len(response data) == 3 and total_count == 3 and has_more == false"

      - name: corner_get_audit_program_unknown_id_returns_program_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - endpoints[GET /audit-programs/{id}]
        distinguishing_aspect: "A GET against a syntactically valid UUID that names no AuditProgram returns 404 ERR_PROGRAM_NOT_FOUND in the error envelope, never an empty object with 200."
        test_recipe:
          setup:
            - "The database holds no AuditProgram rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /audit-programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response response_type == error and response data.error_id == ERR_PROGRAM_NOT_FOUND"

      - name: corner_create_employee_missing_work_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /employees]
        distinguishing_aspect: "Omitting the required input field work_email returns 400 ERR_INVALID_REQUEST and creates no Employee row, so the subsequent list read still reports total_count 0."
        test_recipe:
          setup:
            - "The database holds no Employee rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: corner_create_audit_program_omitting_optionals_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.AuditProgram.fields.amnesty_days
          - entities.AuditProgram.fields.response_days
          - entities.AuditProgram.fields.reminder_min_gap_days
          - entities.AuditProgram.fields.max_reminders
          - entities.AuditProgram.fields.poe_verification_enabled
          - endpoints[POST /audit-programs]
        distinguishing_aspect: "A program created with only program_name and plan_year stores amnesty_days 21, response_days 45, reminder_min_gap_days 7, max_reminders 3 and poe_verification_enabled true."
        test_recipe:
          setup:
            - "The database holds no AuditProgram rows and the clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Census Audit", plan_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "response data.amnesty_days == 21 and response data.response_days == 45"
            - "response data.reminder_min_gap_days == 7 and response data.max_reminders == 3"
            - "response data.poe_verification_enabled == true"
            - "response data.status == DRAFT and response data.scope_type == null"
            - "response data.announcement_at == null and response data.amnesty_end_at == null and response data.response_deadline_at == null"
            - "response data.sweep_epoch == 0 and response data.provisional_annual_savings_cents == 0 and response data.audited_annual_savings_cents == 0"

      - name: corner_dependent_monthly_cost_is_derived_from_relationship_type_not_from_the_request
        claim_type: computed_fields
        grounds:
          - entities.Dependent.fields.monthly_cost_cents
          - calculations.savings_measurement
          - endpoints[POST /employees/{id}/dependents]
        distinguishing_aspect: "A CHILD_BIOLOGICAL dependent submitted with monthly_cost_cents 999 is stored with 30500, the RELATIONSHIP_MONTHLY_COST_CENTS entry for that relationship type, so the request value is ignored."
        test_recipe:
          setup:
            - "Employee E1 exists; no AuditProgram exists, so no point-of-enrollment window applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "FAMILY", employer_monthly_premium_cents: 148000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
          trigger:
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "CHILD_BIOLOGICAL", full_name: "Ivo Reyes", date_of_birth: "2014-02-02", monthly_cost_cents: 999 }
              as: ProgramAdmin
              captures: { dep2_id: "$.data.id" }
            - call: "GET /employees/${emp1_id}"
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 201 and response data.monthly_cost_cents == 30500"
            - "First call: response data.monthly_cost_cents != 999"
            - "Second call: response data.enrolled_dependent_count == 1"

      - name: corner_create_dependent_with_unknown_relationship_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Dependent.fields.relationship_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "relationship_type NEPHEW is not one of the seven declared enum members, so the create returns 400 ERR_INVALID_REQUEST and Employee.enrolled_dependent_count stays 0."
        test_recipe:
          setup:
            - "Employee E1 exists with no dependents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "FAMILY", employer_monthly_premium_cents: 148000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
          trigger:
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "NEPHEW", full_name: "Ivo Reyes", date_of_birth: "2014-02-02", monthly_cost_cents: 30500 }
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "GET /employees/${emp1_id}"
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 400 and response data.error_id == ERR_INVALID_REQUEST"
            - "Second call: response data.enrolled_dependent_count == 0"

      - name: corner_list_dependents_with_limit_above_one_hundred_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - response_envelope.pagination_defaults
          - endpoints[GET /employees/{id}/dependents]
        distinguishing_aspect: "limit 101 sits outside the declared pagination range 1..100, so the list read returns 400 ERR_INVALID_REQUEST instead of silently clamping to 100."
        test_recipe:
          setup:
            - "Employee E1 exists with one SPOUSE dependent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
          trigger:
            - call: "GET /employees/${emp1_id}/dependents"
              payload: { limit: 101, offset: 0 }
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: corner_amnesty_removal_row_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.AmnestyRemoval
          - calculations.amnesty_coverage_end
          - endpoints[POST /amnesty-removals]
          - endpoints[GET /dependents/{id}/amnesty-removals]
        distinguishing_aspect: "AmnestyRemoval is declared common_fields false: the 201 body exposes no version and no updated_at field, §1.5 declares no update or delete endpoint for it, and its computed fields (coverage_end_date 2026-09-30, audited_savings_contribution_cents 91500) are fixed at creation."
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1 and CHILD_BIOLOGICAL dependent D2; program P is FULL_CENSUS-scoped over E1 and was announced 2026-09-01 (amnesty_end 2026-09-22)."
            - "The clock reads 2026-09-10 when D2 is voluntarily removed under amnesty, so coverage_end_date is the month end 2026-09-30 and the contribution is 30500 * (12 - 9) = 91500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "FAMILY", employer_monthly_premium_cents: 148000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "CHILD_BIOLOGICAL", full_name: "Ivo Reyes", date_of_birth: "2014-02-02", monthly_cost_cents: 30500 }
              as: ProgramAdmin
              captures: { dep2_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "CHILD_BIOLOGICAL", phase: "AUDIT", acceptable_proof_types: ["BIRTH_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "GET /audit-cases"
              payload: { program_id: "${prog_id}", employee_id: "${emp1_id}" }
              as: ProgramAdmin
              captures: { case1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /amnesty-removals"
              payload: { dependent_id: "${dep2_id}", case_id: "${case1_id}", reason_code: "AGE_LIMIT_EXCEEDED", attestation_signed: true }
              as: Employee
              as_user_id: "${emp1_id}"
            - call: "GET /dependents/${dep2_id}/amnesty-removals"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 201"
            - "First call: response data contains no version field and no updated_at field"
            - "First call: response data.recorded_at == 2026-09-10T00:00:00.000Z and response data.coverage_end_date == 2026-09-30"
            - "First call: response data.penalty_waived == true and response data.claims_recovery_waived == true"
            - "First call: response data.audited_savings_contribution_cents == 91500"
            - "Second call: total_count == 1 and response data[0].reason_code == AGE_LIMIT_EXCEEDED"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path resolves to an AmnestyRemoval"

      - name: corner_create_dependent_under_unknown_employee_returns_employee_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_EMPLOYEE_NOT_FOUND]
          - endpoints[POST /employees/{id}/dependents]
        distinguishing_aspect: "The employee path segment is resolved before the body is applied, so enrolling a dependent under an unknown Employee id returns 404 ERR_EMPLOYEE_NOT_FOUND and stores no Dependent."
        test_recipe:
          setup:
            - "The database holds no Employee rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /employees/3f9d7c11-88ab-4b0e-9c2f-6d5a1e0b47c9/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_EMPLOYEE_NOT_FOUND"

      - name: corner_proof_submission_naming_a_dependent_outside_the_addressed_case_is_rejected
        claim_type: cross_reference_integrity
        grounds:
          - entities.AuditCase.fields.in_scope_dependent_ids
          - validations[priority=11]
          - errors[ERR_DEPENDENT_STATE_INVALID]
          - endpoints[POST /proof-submissions]
        distinguishing_aspect: "Entity topology is flat, so the two body foreign keys are cross-checked: dependent D3 is PENDING_VERIFICATION in its own case C2, yet pairing it with case C1 returns 409 ERR_DEPENDENT_STATE_INVALID because D3 is absent from C1.in_scope_dependent_ids."
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1 and Employee E2 holds SPOUSE dependent D3."
            - "Program P is FULL_CENSUS-scoped over both employees and was announced 2026-09-01, so cases C1 (E1) and C2 (E2) are both NOTIFIED and both dependents are PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { full_name: "Kofi Mensah", work_email: "kofi.mensah@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2021-06-14" }
              as: ProgramAdmin
              captures: { emp2_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /employees/${emp2_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Ama Mensah", date_of_birth: "1990-11-30", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep3_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "GET /audit-cases"
              payload: { program_id: "${prog_id}", employee_id: "${emp1_id}" }
              as: ProgramAdmin
