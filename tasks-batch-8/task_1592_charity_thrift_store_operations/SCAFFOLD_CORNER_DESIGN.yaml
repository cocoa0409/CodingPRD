              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", estimated_volume_cuft: 120 }
              as: StoreManager
              captures: { st1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/publish"
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/start"
              as: StoreManager
            - call: "POST /api/pickup-stops/${st1}/depart"
              as: Driver
              as_user_id: "${w1}"
            - call: "POST /api/pickup-stops/${st1}/no-show"
              as: Driver
              as_user_id: "${w1}"
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-11", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /api/pickup-stops/${st1}/reschedule"
              payload: { target_route_id: "${r2}", window_start: "2026-08-11T09:00:00Z", window_end: "2026-08-11T10:00:00Z" }
              as: StoreManager
              captures: { st2: $.data.id }
          assert:
            - "PickupStop.${st1}.status == NO_SHOW (terminal, unchanged)"
            - "PickupStop.${st2}.status == SCHEDULED and route_id == ${r2} and donor_id == ${d1} and estimated_volume_cuft == 120"
            - "PickupRoute.${r2}.stop_count == 1 and total_volume_cuft == 120"

