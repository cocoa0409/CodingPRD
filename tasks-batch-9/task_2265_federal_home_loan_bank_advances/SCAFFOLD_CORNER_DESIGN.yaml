              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
          trigger:
            call: "GET /fhlb/member-banks/${member_id}/borrowing-capacity"
            payload: {}
            as: TreasuryOfficer
            as_user_id: "${member_id}"
          assert:
            - "HTTP 200 with data.variant == \"CERTIFIED\", data.lendable_collateral_value_cents == 0, data.capacity_base_cents == 0, data.borrowing_capacity_cents == 0"
            - "the same call with variant = PROVISIONAL reports a strictly positive lendable_collateral_value_cents derived from the UNDER_REVIEW asset's hypothetical value"
            - "data.tier_cap_bps == 10000 and data.statutory_cap_cents == 2400000000 in both variants"

      - name: safekeeping_confirm_exception_returns_asset_to_under_review
        claim_type: conditional_action
        grounds: ["endpoints.POST /fhlb/safekeeping-receipts/{safekeeping_receipt_id}/confirm (outcome = EXCEPTION branch)", "state_machines.CollateralAsset ELIGIBLE -> UNDER_REVIEW"]
