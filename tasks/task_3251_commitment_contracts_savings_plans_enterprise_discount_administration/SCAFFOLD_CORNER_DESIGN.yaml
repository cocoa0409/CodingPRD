            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${tu_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { tu_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${tu_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
