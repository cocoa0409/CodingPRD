              as: SchedulingManager
            - call: "POST /intraday-actions"
              payload: { planning_cycle_id: "${cyc_id}", kind: "VTO_OFFER", agent_id: "${ag1_id}", schedule_shift_id: "${sh1_id}", hours: 7.0, expires_at: "2026-09-08T00:00:00Z" }
              as: IntradayController
              as_user_id: "u-intraday-1"
              captures: { vto_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
