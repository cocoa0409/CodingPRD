scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cam_estimated_vs_reconciled_true_up
        grounds:
          - calculations.reconciled_cam_true_up
          - entities.Reconciliation.fields.estimated_cam_billed_cents
          - entities.Reconciliation.fields.reconciled_cam_cents
          - entities.Reconciliation.fields.true_up_cents
          - state_machines.Reconciliation.IN_REVIEW_to_POSTED
        distinguishing_aspect: |
          On the Reconciliation (CAM cost-accounting) domain: estimated CAM (12 *
          estimated_cam_cents_monthly = 180000) and reconciled CAM (pro-rata share
          of grossed pool = 250000) differ; true_up_cents == 70000, not 0.
        test_recipe:
          setup:
            - "Property total_rentable_sqft=10000, occupied 9500 (a 7000-sqft filler lease + the 2500-sqft subject lease, both active, pin occupancy so gross-up factor = 0.95/0.95 = 1.0)."
            - "Pool 2025, admin_fee_pct=0, denominator TOTAL_RENTABLE; line items RECOVERABLE variable 800000 + RECOVERABLE fixed 200000 -> total_recoverable 1000000."
            - "Subject lease leased_sqft=2500, estimated_cam_cents_monthly=15000, base_rent 0; reconciliation IN_REVIEW for 2025."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Plaza", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Anchor Co", contact_email: "a@x.com" }
              as: PropertyManager
              captures: { ten_anchor_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Subject Co", contact_email: "s@x.com" }
              as: PropertyManager
              captures: { ten_subj_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_anchor_id}", leased_sqft: 7000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_anchor_id: $.data.id }
            - call: "POST /leases/${lease_anchor_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_subj_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_subj_id: $.data.id }
            - call: "POST /leases/${lease_subj_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_id}"
              payload: {}
              as: Accountant
              captures: { recon_v: $.data.version }
          trigger:
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "acct-001"
              captures: { posted_recon_id: $.data.id }
          assert:
            - "Reconciliation.${recon_id}.estimated_cam_billed_cents == 180000"
            - "Reconciliation.${recon_id}.reconciled_cam_cents == 250000"
            - "Reconciliation.${recon_id}.true_up_cents == 70000"
            - "Reconciliation.${recon_id}.status == POSTED"

      - name: base_rent_fixed_pct_vs_cpi_escalation
        grounds:
          - calculations.base_rent_escalation
          - entities.Lease.fields.base_rent_cents_annual
          - entities.Lease.fields.escalation_type
          - state_machines.Lease.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          On the Lease (rent) domain — a different entity domain than the CAM
          instance: FIXED_PCT escalation of base 10000000 at 0.03 yields 10300000,
          while CPI escalation of the same base (collar 0.04, index 250->262.5)
          yields 10400000; same prior base, two valid escalation algorithms diverge.
        test_recipe:
          setup:
            - "Two active leases on the same property, both base_rent_cents_annual=10000000."
            - "Lease F: escalation_type=FIXED_PCT, escalation_rate=0.03. Lease C: escalation_type=CPI, escalation_rate=0.04, cpi_base_index=250.0."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Tower", total_rentable_sqft: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "F Co", contact_email: "f@x.com" }
              as: PropertyManager
              captures: { ten_f_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C Co", contact_email: "c@x.com" }
              as: PropertyManager
              captures: { ten_c_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_f_id}", leased_sqft: 1000, base_rent_cents_annual: 10000000, escalation_type: "FIXED_PCT", escalation_rate: 0.03 }
              as: PropertyManager
              captures: { lease_f_id: $.data.id }
            - call: "POST /leases/${lease_f_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_c_id}", leased_sqft: 1000, base_rent_cents_annual: 10000000, escalation_type: "CPI", escalation_rate: 0.04, cpi_base_index: 250.0 }
              as: PropertyManager
              captures: { lease_c_id: $.data.id }
            - call: "POST /leases/${lease_c_id}/activate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_f_id}/escalate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases/${lease_c_id}/escalate"
              payload: { current_cpi_index: 262.5 }
              as: PropertyManager
          assert:
            - "Lease.${lease_f_id}.base_rent_cents_annual == 10300000"
            - "Lease.${lease_c_id}.base_rent_cents_annual == 10400000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reconciled_cam_nested_min_with_branches_mode_a
        grounds:
          - calculations.reconciled_cam_true_up
          - calculations.controllable_cap
          - calculations.pro_rata_share
          - entities.Reconciliation.fields.reconciled_cam_cents
        distinguishing_aspect: |
          Mode (a): >=3 interacting inputs with non-linear min and conditional
          branches — share(0.5), capped slice min(tenant_capped_share=500000,
          cap_ceiling=420000)=420000, plus non-capped slice 200000 -> reconciled
          620000. Changing only controllable_cap_pct flips the min branch.
        test_recipe:
          setup:
            - "Property total_rentable 10000, occupied 9500 (factor 1.0), pool admin_fee_pct=0 denominator TOTAL_RENTABLE."
            - "Pool line items: CAPPED_CONTROLLABLE variable 1000000 + RECOVERABLE fixed 400000."
            - "Subject lease leased_sqft=5000 (share 0.5), controllable_cap_pct=0.05, prior_year_capped_base_cents=400000 (ceiling 420000), estimated_cam_cents_monthly=40000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Mall", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Filler Co", contact_email: "fl@x.com" }
              as: PropertyManager
              captures: { ten_fill_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Cap Co", contact_email: "cap@x.com" }
              as: PropertyManager
              captures: { ten_cap_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_fill_id}", leased_sqft: 4500, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_fill_id: $.data.id }
            - call: "POST /leases/${lease_fill_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_cap_id}", leased_sqft: 5000, base_rent_cents_annual: 0, controllable_cap_pct: 0.05, prior_year_capped_base_cents: 400000, estimated_cam_cents_monthly: 40000 }
              as: PropertyManager
              captures: { lease_cap_id: $.data.id }
            - call: "POST /leases/${lease_cap_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "SECURITY", amount_cents: 1000000, recoverability: "CAPPED_CONTROLLABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "TAXES", amount_cents: 400000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_cap_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_id}"
              payload: {}
              as: Accountant
              captures: { recon_v: $.data.version }
          trigger:
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "acct-001"
          assert:
            - "Reconciliation.${recon_id}.reconciled_cam_cents == 620000"
            - "Reconciliation.${recon_id}.true_up_cents == 140000"

      - name: gross_up_round_per_item_then_sum_mode_b
        grounds:
          - calculations.gross_up_pool
          - entities.ExpensePool.fields.total_recoverable_cents
          - entities.ExpenseLineItem.fields.is_variable
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — each variable line item is grossed
          up and rounded (round_half_up) BEFORE summing, then admin fee is rounded
          once on the sum. With factor 1.1875 over items 500008 (->593760) and
          700008 (->831260) plus a fixed 100000 item, round-per-item-then-sum gives
          total_recoverable 1525020, which differs from sum-then-round's 1525019.
        test_recipe:
          setup:
            - "Property total_rentable 10000, occupied 8000 (factor 0.95/0.8 = 1.1875), gross_up_occupancy_pct=0.95."
            - "Pool admin_fee_pct=0; two RECOVERABLE variable items 500008 and 700008; one RECOVERABLE fixed item 100000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Center", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: Accountant
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Occ Co", contact_email: "o@x.com" }
              as: Accountant
              captures: { ten_occ_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_occ_id}", leased_sqft: 8000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_occ_id: $.data.id }
            - call: "POST /leases/${lease_occ_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "LANDSCAPING", amount_cents: 500008, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "SNOW_REMOVAL", amount_cents: 700008, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "MANAGEMENT", amount_cents: 100000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
          trigger:
            - call: "GET /expense-pools/${pool_id}"
              payload: {}
              as: Accountant
              captures: { pool_total: $.data.total_recoverable_cents }
          assert:
            - "ExpensePool.${pool_id}.total_recoverable_cents == 1525020"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reconciliation_dispute_cycle_posted_disputed_posted
        grounds:
          - state_machines.Reconciliation.POSTED_to_DISPUTED
          - state_machines.Reconciliation.DISPUTED_to_POSTED
          - entities.Reconciliation.fields.status
        distinguishing_aspect: |
          Cyclic on Reconciliation: POSTED -> DISPUTED (tenant) -> POSTED
          (accountant resolve) returns to the same POSTED state, a true cycle
          rather than a forward-only pipeline.
        test_recipe:
          setup:
            - "A POSTED reconciliation for the subject tenant's own lease (true_up 70000 as in cam_estimated_vs_reconciled_true_up)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Plaza2", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Anchor2", contact_email: "a2@x.com" }
              as: PropertyManager
              captures: { ten_anchor_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Subj2", contact_email: "s2@x.com" }
              as: PropertyManager
              captures: { ten_subj_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_anchor_id}", leased_sqft: 7000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_anchor_id: $.data.id }
            - call: "POST /leases/${lease_anchor_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_subj_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_subj_id: $.data.id }
            - call: "POST /leases/${lease_subj_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_id}"
              payload: {}
              as: Accountant
              captures: { recon_v: $.data.version }
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "acct-001"
            - call: "POST /reconciliations/${recon_id}/dispute"
              payload: {}
              as: Tenant
              as_user_id: "${ten_subj_id}"
          trigger:
            - call: "POST /reconciliations/${recon_id}/resolve-dispute"
              payload: {}
              as: Accountant
              as_user_id: "acct-001"
          assert:
            - "Reconciliation.${recon_id}.status == POSTED"

      - name: estoppel_branching_issued_to_confirmed_or_disputed
        grounds:
          - state_machines.EstoppelCertificate.ISSUED_to_CONFIRMED
          - state_machines.EstoppelCertificate.ISSUED_to_DISPUTED
          - entities.EstoppelCertificate.fields.status
        distinguishing_aspect: |
          Branching fork on EstoppelCertificate (a different entity than
          Reconciliation): ISSUED forks to either CONFIRMED or DISPUTED with
          divergent side-effects (DISPUTED also stores dispute_note); this
          instance exercises the DISPUTED branch reaching a distinct terminal.
        test_recipe:
          setup:
            - "An ISSUED estoppel on the subject tenant's lease; tenant responds DISPUTED with a note (asserted balance need not match on the DISPUTED branch)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Est Plaza", total_rentable_sqft: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Est Co", contact_email: "e@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /estoppels"
              payload: { lease_id: "${lease_id}", asserted_balance_cents: 999999, asserted_base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estoppels/${est_id}/respond"
              payload: { tenant_response: "DISPUTED", dispute_note: "Balance overstated." }
              as: Tenant
              as_user_id: "${ten_id}"
          assert:
            - "EstoppelCertificate.${est_id}.status == DISPUTED"
            - "EstoppelCertificate.${est_id}.dispute_note == Balance overstated."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: post_cascade_recon_to_ledger_to_balance_depth3
        grounds:
          - state_machines.Reconciliation.IN_REVIEW_to_POSTED
          - entities.LedgerEntry.fields.amount_cents
          - entities.Lease.fields.outstanding_balance_cents
          - entities.ExpensePool.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by recon post: post mutates Reconciliation
          (true_up 70000) -> that mutation creates a CAM_TRUEUP LedgerEntry of
          +70000 -> that ledger entry forces recompute of Lease.outstanding_balance_cents
          to 70000. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Subject lease with base_rent 0 (post-activate balance 0); IN_REVIEW reconciliation for 2025 whose true_up is +70000 (Example B numbers)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Plaza3", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Anchor3", contact_email: "a3@x.com" }
              as: PropertyManager
              captures: { ten_anchor_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Subj3", contact_email: "s3@x.com" }
              as: PropertyManager
              captures: { ten_subj_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_anchor_id}", leased_sqft: 7000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_anchor_id: $.data.id }
            - call: "POST /leases/${lease_anchor_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_subj_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_subj_id: $.data.id }
            - call: "POST /leases/${lease_subj_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_id}"
              payload: {}
              as: Accountant
              captures: { recon_v: $.data.version }
          trigger:
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "acct-001"
          assert:
            - "Lease.${lease_subj_id}.outstanding_balance_cents == 70000"
            - "ExpensePool.${pool_id}.status == LOCKED"

      - name: activate_cascade_lease_to_property_occupancy_depth2
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - entities.Property.fields.occupied_sqft
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (lease activate, not recon
          post): activate mutates Lease.status -> that mutation increments
          Property.occupied_sqft by leased_sqft (2500), a second-entity hop caused
          by the activation.
        test_recipe:
          setup:
            - "A DRAFT lease of 2500 sqft on a property with occupied_sqft 0."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "OccProp", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "OccTen", contact_email: "ot@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
