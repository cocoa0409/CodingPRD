        test_recipe:
          setup: ["coordinator profile; year 2026 published once"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/annual-statistics/2026/publish", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /api/annual-statistics/1999/publish", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /api/annual-statistics/2027/amend", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /api/annual-statistics/2026/publish", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err3: $.data.error_id } }
          assert:
