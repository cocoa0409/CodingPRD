  - section: rbac
    instances:
      - name: peer_review_and_verdict_are_bound_to_identities_not_just_to_roles
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=80]
          - validations[priority=70]
          - rbac.PeerReviewer
          - rbac.ExpertReviewer
          - endpoints[POST /records-desk/analysis-runs/{id}/peer-review]
          - endpoints[POST /records-desk/review-assignments/{id}/verdict]
        distinguishing_aspect: |
          Holding the right ROLE is not sufficient on either review endpoint: a caller presenting
          X-User-Role PeerReviewer but the author's own X-User-ID is refused for segregation of duties,
          and a genuine ExpertReviewer is refused on an assignment that belongs to a different reviewer.
          The two refusals are 403s that no role table can express, and the instance also pins that an
          already-APPROVED run refuses a second review outright rather than re-approving it.
