            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_R: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
