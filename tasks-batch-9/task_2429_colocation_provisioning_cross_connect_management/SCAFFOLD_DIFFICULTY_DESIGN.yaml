  - rule_id: non_linear_state_machine
    instances:
      - name: route_revision_cycle_bounded_at_two_conserves_port_pool
        grounds:
          - state_machines.CrossConnectOrder.ROUTE_PROPOSED_to_CHANGES_REQUESTED
          - state_machines.CrossConnectOrder.CHANGES_REQUESTED_to_ROUTE_PROPOSED
          - validations.priority_17_ERR_REVISION_LIMIT_REACHED
          - calculations.provisioning_gate_thresholds.constants.MAX_ROUTE_REVISIONS
          - entities.CrossConnectOrder.fields.revision_count
          - entities.PatchPanelPort.fields.status
        distinguishing_aspect: |
          The ROUTE_PROPOSED / CHANGES_REQUESTED loop is traversed twice and the THIRD
          request-changes is refused with ERR_REVISION_LIMIT_REACHED while the order stays in
          ROUTE_PROPOSED and remains approvable — and every lap conserves the port pool exactly
          (each request-changes returns its two RESERVED ports to FREE and clears
          assigned_order_id, so after three proposals only the last pair is held).
