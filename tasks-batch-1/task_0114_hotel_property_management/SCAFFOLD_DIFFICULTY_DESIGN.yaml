      - name: block_close_empty_pending_pickups_zero_held
        grounds:
          - state_machines.GroupBlock.OPEN_to_CLOSED
          - validations[priority=7]
          - errors[ERR_BLOCK_HAS_PENDING_PICKUPS]
          - entities.GroupBlock.fields.status
        distinguishing_aspect: |
          Empty-set boundary on a DIFFERENT metric (count of HELD pickups) reached
          through a DIFFERENT endpoint (POST /pms/group-blocks/{id}/close): closing a
          block with exactly zero HELD reservations attached succeeds, whereas one HELD
