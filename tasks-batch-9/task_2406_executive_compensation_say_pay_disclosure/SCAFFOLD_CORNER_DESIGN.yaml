  # =========================================================================
  - section: cross_cutting_layers
    instances:

      - name: a_stale_expected_peer_group_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.member-add-stale-group
          - errors[ERR_STALE_PEER_GROUP_VERSION]
          - validations.priority_7_optimistic_concurrency
          - endpoints[POST /exec-comp/peer-groups/{id}/members]
        distinguishing_aspect: |
          The OCC token must be the group's current version, not the one the caller first saw: after BRVO's add
          moved the group from 1 to 2, replaying the original token is ERR_STALE_PEER_GROUP_VERSION (412) and writes
          nothing, while re-reading the version and retrying admits CHRL and moves it to 3.
        test_recipe:
          setup:
            - "ACME issuer with BRVO and CHRL peers."
            - "A DRAFT RAW_MEDIAN peer group whose create response version was captured, then BRVO added with that token so the group is now at version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { err_occ: $.data.error_id }
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v1}" }
              as: CompConsultant
              captures: { mem_c: $.data.id }
          assert:
            - "${err_occ} == 'ERR_STALE_PEER_GROUP_VERSION' with HTTP status 412"
            - "after the refused call PeerGroup.${pg_id}.accepted_member_count == 1 and version == 2"
            - "the retry with the re-read token returns 201 with PeerGroupMember.${mem_c}.status == ACCEPTED"
            - "PeerGroup.${pg_id}.accepted_member_count == 2 and version == 3"
            - "PeerGroup.${pg_id}.status is still DRAFT"

      - name: a_stale_expected_incentive_metric_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.adjustment-stale-metric
          - errors[ERR_STALE_INCENTIVE_METRIC_VERSION]
          - endpoints[POST /exec-comp/incentive-metrics/{id}/adjustments]
          - state_machines.IncentiveMetric.DRAFT_to_LOCKED
        distinguishing_aspect: |
          A cascade from another entity is exactly what makes a remembered token stale: the metric's create response
          carried version 1, but the program's approval bumped it to 2 as a side effect, so an adjustment quoting the
          creation token gets ERR_STALE_INCENTIVE_METRIC_VERSION (412) and only the freshly read token is accepted —
          leaving the metric ADJUSTED at version 3.
        test_recipe:
          setup:
            - "MINI fixture with PayProgram P1 and one ANNUAL_INCENTIVE metric ADJ_EPS (weight 100.00, curve 4/5/6) whose create-response version was captured."
            - "The chair then approved the program, which cascaded the metric to LOCKED and bumped its version."
