scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_project_returns_201_with_defaulted_counters
        claim_type: Creation
        grounds:
          - entities.Project.fields.status
          - entities.Project.fields.budget_posture
          - entities.Project.fields.open_rfi_count
          - endpoints[POST /projects]
        distinguishing_aspect: "A freshly created Project is DRAFT with labor_cost_cents 0, approved_hours 0, open_rfi_count 0, budget_posture WITHIN_BUDGET, ca_posture CLEAR and version 1."
        test_recipe:
          setup:
            - "One StaffMember exists to serve as the project manager."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { project_number: "ENT-001", name: "Entity Estate", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Project.${proj}.status == DRAFT"
            - "Project.${proj}.labor_cost_cents == 0 and Project.${proj}.approved_hours == 0"
            - "Project.${proj}.budget_posture == WITHIN_BUDGET and Project.${proj}.ca_posture == CLEAR"
            - "Project.${proj}.open_rfi_count == 0 and Project.${proj}.version == 1"

      - name: staff_member_active_defaults_to_true_when_omitted
        claim_type: Defaults
        grounds:
          - entities.StaffMember.fields.active
          - endpoints[POST /staff]
        distinguishing_aspect: "Omitting the optional `active` field on POST /staff yields active == true, the declared default."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /staff"
              payload: { full_name: "Dana Designer", title: "DESIGNER", billing_rate_cents_per_hour: 9000, cost_rate_cents_per_hour: 4000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { s: $.data.id }
          assert:
            - "StaffMember.${s}.active == true"
            - "StaffMember.${s}.version == 1"

      - name: expense_billable_cents_is_computed_and_client_supplied_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Expense.fields.billable_cents
          - entities.Expense.fields.markup_bp
          - endpoints[POST /expenses]
        distinguishing_aspect: "Expense.billable_cents is round_half_up(amount_cents * (10000 + markup_bp) / 10000): 100000 cents at 1000 bp yields exactly 110000, and a non-reimbursable expense yields 0."
        test_recipe:
          setup: ["A project and an architect exist."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "EXP-001", name: "Expense Exchange", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /expenses"
              payload: { project_id: "${proj}", staff_member_id: "${arch_id}", category: "PRINTING", amount_cents: 100000, reimbursable: true, markup_bp: 1000 }
              as: StaffArchitect
              as_user_id: "${arch_id}"
              captures: { e_yes: $.data.id }
            - call: "POST /expenses"
              payload: { project_id: "${proj}", staff_member_id: "${arch_id}", category: "TRAVEL", amount_cents: 100000, reimbursable: false }
              as: StaffArchitect
              as_user_id: "${arch_id}"
              captures: { e_no: $.data.id }
          assert:
            - "Expense.${e_yes}.billable_cents == 110000 and Expense.${e_yes}.status == SUBMITTED"
            - "Expense.${e_no}.billable_cents == 0"
            - "Expense.${e_no}.markup_bp == 1000 (the declared default is still applied even though it does not affect a non-reimbursable expense)"

      - name: field_report_is_immutable_and_carries_only_id_and_created_at
        claim_type: Immutability
        grounds:
          - entities.FieldReport.common_fields
          - endpoints[GET /field-reports/{fieldReportId}]
        distinguishing_aspect: "FieldReport declares common_fields: false, so its response carries id and created_at but no updated_at and no version, and no PATCH/PUT/DELETE endpoint exists for it in §1.5."
        test_recipe:
          setup:
            - "A project whose SD, DD and CD phases are COMPLETED, whose CD phase has an APPROVED PermitReview and whose CA phase is ACTIVE, so a field report can be filed."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "IMM-001", name: "Immutable Inn", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { dd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { cd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ca: $.data.id }
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${dd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${dd}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${cd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${cd}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /permit-reviews"
              payload: { phase_id: "${cd}", jurisdiction_name: "City of Ashford", permit_type: "BUILDING" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { pr: $.data.id }
            - call: "POST /permit-reviews/${pr}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /permit-reviews/${pr}/state"
              payload: { to_status: "APPROVED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${ca}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /field-reports"
              payload: { project_id: "${proj}", staff_member_id: "${arch_id}", visit_date: "2026-05-20T14:00:00Z", weather: "Clear", observations: "Nothing to report.", deficiency_count: 0 }
              as: StaffArchitect
              as_user_id: "${arch_id}"
              captures: { fr: $.data.id }
          trigger:
            - call: "GET /field-reports/${fr}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { fr_echo: $.data.id }
          assert:
            - "response data contains id and created_at"
            - "response data contains no `version` key and no `updated_at` key"
            - "FieldReport.${fr}.deficiency_count == 0"
            - "GET /rfis?field_report_id=${fr} returns 0 rows (deficiency_count 0 creates no RFI)"

      - name: get_project_with_unknown_uuid_returns_project_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - endpoints[GET /projects/{projectId}]
        distinguishing_aspect: "GET /projects/{projectId} with a syntactically valid but unknown UUID returns 404 ERR_PROJECT_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: phase_order_is_derived_from_phase_code_and_input_is_ignored
        claim_type: System Fields
        grounds:
          - entities.Phase.fields.phase_order
          - calculations.phase_fee_allocation
        distinguishing_aspect: "Phase.phase_order is server-derived from PHASE_ORDER = {SD:1, DD:2, CD:3, CA:4}; it is not a request field, and creating the four phases out of order still yields SD=1, DD=2, CD=3, CA=4."
        test_recipe:
          setup: ["A project exists with no phases."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "ORD-001", name: "Order Office", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ca: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
          assert:
            - "Phase.${ca}.phase_order == 4"
            - "Phase.${sd}.phase_order == 1"
            - "Phase.${sd}.status == NOT_STARTED and Phase.${sd}.percent_complete == 0 and Phase.${sd}.fee_allocation_cents == 0"

  # =========================================================================
  - section: state_machines
    instances:

      - name: contract_execution_from_terminated_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Contract.EXECUTED_to_TERMINATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "TERMINATED is terminal on Contract: a second POST /contracts/{contractId}/state with to_status TERMINATED (or EXECUTED) is refused with 409 ERR_INVALID_STATE and the contract's fields are untouched."
        test_recipe:
          setup:
            - "An executed contract with all four phases, then TERMINATED (no DRAFT invoices exist)."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "TRM-001", name: "Terminal Terrace", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "TERMINATED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
          trigger:
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Contract.${ct}.status == TERMINATED"
            - "Contract.${ct}.total_fee_cents == 10000000"

      - name: contract_execution_with_weights_not_summing_to_10000_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Contract.DRAFT_to_EXECUTED
          - errors[ERR_PHASE_WEIGHTS_INVALID]
          - validations[priority=12]
        distinguishing_aspect: "Executing a contract whose four phase weight_bp values sum to 9000 (not 10000) is refused with 409 ERR_PHASE_WEIGHTS_INVALID, and the contract stays DRAFT with base_fee_cents 0 and every Phase.fee_allocation_cents still 0."
        test_recipe:
          setup:
            - "A project with a DRAFT contract and four phases weighted 2000/2000/3000/2000 (sum 9000)."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "WGT-001", name: "Weight Works", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 3000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_PHASE_WEIGHTS_INVALID"
            - "Contract.${ct}.status == DRAFT and Contract.${ct}.base_fee_cents == 0"
            - "Phase.${sd}.fee_allocation_cents == 0"
            - "Project.${proj}.status == DRAFT (the Project ACTIVE cascade did not fire)"

      - name: rfi_third_return_for_clarification_hits_max_rounds_cap
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RFI.OPEN_to_RETURNED_FOR_CLARIFICATION
          - state_machines.RFI.RETURNED_FOR_CLARIFICATION_to_OPEN
          - errors[ERR_MAX_CLARIFICATION_ROUNDS]
          - calculations.rfi_rollup
        distinguishing_aspect: "The OPEN <-> RETURNED_FOR_CLARIFICATION cycle is bounded: after two completed loops clarification_rounds == 2 == MAX_CLARIFICATION_ROUNDS and the third return is refused with 409 ERR_MAX_CLARIFICATION_ROUNDS while the RFI stays OPEN."
        test_recipe:
          setup:
            - "A project with one OPEN RFI that has already been returned for clarification twice and re-opened twice, so clarification_rounds == 2."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "RND-002", name: "Rounds Retreat", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /rfis"
              payload: { project_id: "${proj}", subject: "Clarify slab edge detail" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { rfi: $.data.id }
            - call: "POST /rfis/${rfi}/state"
              payload: { to_status: "RETURNED_FOR_CLARIFICATION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /rfis/${rfi}/state"
              payload: { to_status: "OPEN" }
              as: StaffArchitect
              as_user_id: "${arch_id}"
            - call: "POST /rfis/${rfi}/state"
              payload: { to_status: "RETURNED_FOR_CLARIFICATION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /rfis/${rfi}/state"
              payload: { to_status: "OPEN" }
              as: StaffArchitect
              as_user_id: "${arch_id}"
          trigger:
            - call: "POST /rfis/${rfi}/state"
              payload: { to_status: "RETURNED_FOR_CLARIFICATION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_MAX_CLARIFICATION_ROUNDS"
            - "RFI.${rfi}.status == OPEN and RFI.${rfi}.clarification_rounds == 2"
            - "Project.${proj}.open_rfi_count == 1 throughout (RETURNED_FOR_CLARIFICATION still counts as open)"

      - name: permit_review_submit_before_cd_phase_completed_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PermitReview.PREPARING_to_SUBMITTED
          - errors[ERR_PERMIT_PHASE_NOT_READY]
          - validations[priority=11]
        distinguishing_aspect: "A PermitReview attached to the CD phase cannot leave PREPARING while that phase is still ACTIVE: the submit returns 409 ERR_PERMIT_PHASE_NOT_READY and submission_round stays 0."
        test_recipe:
          setup:
            - "An executed project whose SD and DD phases are COMPLETED and whose CD phase is ACTIVE (not COMPLETED)."
            - "A PermitReview in PREPARING attached to that CD phase."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "PMT-001", name: "Permit Place", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
