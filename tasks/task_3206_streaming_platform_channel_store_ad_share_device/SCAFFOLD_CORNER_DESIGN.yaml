              captures: { err: $.data.error_id }
          assert:
            - "First resplit: publisher_slots == 650 (floor(1000 * 6500/10000)) and grant version advanced to ${g_v} + 1"
            - "err == ERR_STALE_VERSION with http 412 on the second resplit"
            - "publisher_slots + platform_slots == 1000 still (INV-SLOT survives the rejected write)"

      - name: cascading_side_effects_suspend_then_reinstate_does_not_restore
        claim_type: cascade_ordering
        grounds:
          - state_machines.Channel.PUBLISHED_to_SUSPENDED
          - state_machines.Channel.SUSPENDED_to_PUBLISHED
        distinguishing_aspect: "The suspend cascade (campaign PAUSED, booking RELEASED) is not symmetric: reinstate returns the channel to PUBLISHED but the campaign stays PAUSED and the booking stays RELEASED — partial-failure-free but asymmetric cascade recovery."
        test_recipe:
          setup:
            - "Publisher P, channel C PUBLISHED, campaign K ACTIVE with CONFIRMED booking B; channel suspended (reason OPS) then reinstated."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Asym Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
