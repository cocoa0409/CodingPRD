          - entities.PriorAuthorization.expiration_date
        distinguishing_aspect: "Priority 23 selects the authorization with the greatest expiration_date when none covers the clock, flips it to EXPIRED as a side effect of the rejection, and returns ERR_AUTHORIZATION_EXPIRED — the PA is not merely reported stale, its stored status changes, and it happens before the exhaustion check even though injections remain."
        test_recipe:
          setup:
            - "the PA-required COMM prologue with an APPROVED PA for 3 injections effective 2026-08-01 (expires 2027-01-28)"
            - "the logical clock then advanced to 2027-02-01, four days past the window"
