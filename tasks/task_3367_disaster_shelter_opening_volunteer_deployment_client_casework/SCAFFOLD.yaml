    side_effects: ["status=CHECKED_IN", "the parent VolunteerDeployment moves from ARRIVED to ON_SHIFT", "staffing_sufficiency recomputed for the shelter", "increments ShiftAssignment.version by 1"]

  # --- Client / registration / shelter-service writes ---
  - method: POST
