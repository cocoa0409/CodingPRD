            - call: "POST /records-office/records-requests"
              payload: { student_id: "${student_id}", requesting_district_id: "${recv2_district_id}", responding_district_id: "${send_district_id}", includes_special_education: true, sped_consent_on_file: true, authorization_reference: "ENR-2026-9031" }
              as: ReceivingRegistrar
              as_user_id: "${recv2_district_id}"
              captures: { req_with_consent: "$.data.id" }
            - call: "POST /records-office/records-requests/${req_no_consent}/validate"
              payload: { authorization_verified: true }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/records-requests/${req_with_consent}/validate"
