# ===========================================================================
# 1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml sections
# 1.1-1.7. Depth lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; every corner this
# file would duplicate is emitted as an excluded_because stub naming the
# covering difficulty instance.
#
# Logical clock: unless an instance sets it, the clock stands at the default
# 2026-08-01T00:00:00Z and every system timestamp is stamped from it.
# ===========================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_repair_order_returns_all_declared_fields_with_intake_defaults
        claim_type: creation
        grounds:
          - endpoints.POST_/repair-orders
          - entities.RepairOrder
          - response_envelope.success
        distinguishing_aspect: >-
          A repair order created from the empty database returns 201 with every declared field
          present in one envelope: the eight input fields echoed, stage INTAKE, authorization_posture
          OPEN, consent_state NONE, checkin_at stamped from the logical clock and all twenty computed
          money and count fields at zero. A response that omits the computed block fails here.
        test_recipe:
          setup:
            - "The logical clock is pinned to 2026-08-01T00:00:00Z."
            - "One Customer and one Insurer exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { full_name: "Amy Diaz", phone: "555-1000", email: "amy@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-01", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90001", vehicle_vin: "1HGCV1F30LA090001", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
          assert:
            - "HTTP 201; the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "data.stage == INTAKE, data.authorization_posture == OPEN, data.consent_state == NONE, data.version == 1"
            - "data.checkin_at == 2026-08-01T00:00:00Z and data.delivered_at is null"
            - "data.teardown_finding_count == 0, data.refinish_hours_provisional == 0, data.refinish_hours_final == 0, data.approved_labor_hours == 0"
            - "data.labor_subtotal_cents, parts_gross_cents, parts_discount_cents, parts_subtotal_cents, betterment_cents, supplies_fee_cents, pre_tax_total_cents, insurer_authorized_cents, customer_pay_cents, parts_ordered_gross_cents, parts_committed_cents, parts_return_credit_cents, parts_restocking_loss_cents, open_parts_delay_count and qc_inspection_count are all 0"
            - "data.customer_id == ${cust_id}, data.insurer_id == ${ins_id}, data.deductible_cents == 25000, data.initial_authorized_cents == 400000"

      - name: get_repair_order_returns_the_persisted_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/repair-orders/{id}
          - entities.RepairOrder
        distinguishing_aspect: >-
          The read-back after a teardown finding must show the persisted consequences of that write -
          stage TEARDOWN, teardown_finding_count 1, version 2 - not the values the create call
          returned. An implementation that caches the create response fails.
        test_recipe:
          setup:
            - "One Customer, one Insurer and one RepairOrder at INTAKE."
            - "One teardown finding has been recorded, so the order is at TEARDOWN with count 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ben Ford", phone: "555-1001", email: "ben@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-02", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90002", vehicle_vin: "1HGCV1F30LA090002", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-QTR", severity: "SEVERE", structural: true }
              as: Estimator
              as_user_id: "est-100"
          trigger:
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "HTTP 200; data.id == ${ro_id}, data.claim_number == CLM-90002, data.vehicle_vin == 1HGCV1F30LA090002"
            - "data.stage == TEARDOWN and data.teardown_finding_count == 1"
            - "data.version == 2 - the finding bumped it once past creation"
            - "data.checkin_at is unchanged from the create response and data.blueprint_by_user_id is null"

      - name: list_repair_orders_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/repair-orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          total_count reports the whole filtered set (3) while the page holds only limit rows, and
          has_more is derived from offset + returned < total_count - true on the first page, false on
          the last. The customer_id filter narrows total_count itself, not just the page.
        test_recipe:
          setup:
            - "Two Customers; three RepairOrders for the first customer and one for the second."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara Ng", phone: "555-1002", email: "cara@example.com" }
              as: ShopAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dan Ott", phone: "555-1003", email: "dan@example.com" }
              as: ShopAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-03", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_a}", insurer_id: "${ins_id}", claim_number: "CLM-90003", vehicle_vin: "1HGCV1F30LA090003", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { ro1: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_a}", insurer_id: "${ins_id}", claim_number: "CLM-90004", vehicle_vin: "1HGCV1F30LA090004", vehicle_model_year: 2020, vehicle_make_model: "Honda Civic", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { ro2: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_a}", insurer_id: "${ins_id}", claim_number: "CLM-90005", vehicle_vin: "1HGCV1F30LA090005", vehicle_model_year: 2021, vehicle_make_model: "Honda CR-V", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { ro3: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_b}", insurer_id: "${ins_id}", claim_number: "CLM-90006", vehicle_vin: "1HGCV1F30LA090006", vehicle_model_year: 2018, vehicle_make_model: "Honda Fit", initial_authorized_cents: 400000 }
              as: ShopAdmin
          trigger:
            - call: "GET /repair-orders"
              payload: { customer_id: "${cust_a}", limit: 2, offset: 0 }
              as: ShopAdmin
          assert:
            - "HTTP 200; response_type == array, data holds exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the same call with offset 2 returns exactly 1 row with total_count 3 and has_more == false"
            - "the same call with no customer_id and no limit returns all 4 orders with total_count 4, has_more == false and the default limit 10 echoed"
            - "GET /repair-orders?stage=INTAKE returns total_count 4 - every order is still at INTAKE"

      - name: get_repair_order_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_20
          - errors.ERR_REPAIR_ORDER_NOT_FOUND
        distinguishing_aspect: >-
          A syntactically valid but unknown id is a 404 with error_id ERR_REPAIR_ORDER_NOT_FOUND in
          the error envelope, not a 200 with a null body and not a 500. The same id is refused on a
          sub-resource read, proving rule 20 covers every /repair-orders/{id}... path.
        test_recipe:
          setup:
            - "The database holds one unrelated RepairOrder so the store is not simply empty."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Eve Pak", phone: "555-1004", email: "eve@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-04", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90007", vehicle_vin: "1HGCV1F30LA090007", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
          trigger:
            - call: "GET /repair-orders/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_REPAIR_ORDER_NOT_FOUND"
            - "GET /repair-orders/00000000-0000-4000-8000-000000000404/damage-lines is refused with the identical error_id and status"
            - "GET /repair-orders/${ro_id} still returns 200, so the store was not disturbed"

      - name: create_repair_order_rejects_a_missing_claim_number
        claim_type: required_fields
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/repair-orders
        distinguishing_aspect: >-
          claim_number has source input and no default, so omitting it is ERR_INVALID_REQUEST (400)
          and nothing is persisted. The same endpoint accepts the payload once claim_number is
          supplied, which proves the refusal came from the missing field and not from the fixture.
        test_recipe:
          setup:
            - "One Customer and one Insurer exist; no RepairOrder yet."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Finn Roe", phone: "555-1005", email: "finn@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-05", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", vehicle_vin: "1HGCV1F30LA090008", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /repair-orders returns total_count 0 - the rejected create persisted nothing"
            - "the identical payload plus claim_number CLM-90008 is accepted with 201"
            - "a payload whose initial_authorized_cents is the string \"400000\" is also ERR_INVALID_REQUEST - wrong JSON type, same rule 5"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.RepairOrder.fields.deductible_cents
          - entities.PartsVendor.fields.discount_pct
          - entities.Insurer.fields.parts_price_ceiling_pct
          - entities.Stall.fields.cleanup_buffer_minutes
        distinguishing_aspect: >-
          Every `default:` in 1.1 is applied on omission, and the defaults are the scaffold's literals
          rather than zero or null: deductible 50000, vendor discount 0 with restocking 0.2 and
          max_qty 4 and status ACTIVE and both fulfillment scores 50, insurer ceiling 1.1 with
          supplement_round_limit 3, stall buffer 30 with status AVAILABLE.
        test_recipe:
          setup:
            - "Nothing pre-exists; every row below is created with the minimum required fields only."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gia Sol", phone: "555-1006", email: "gia@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-06", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /parts-vendors"
              payload: { name: "Default Parts Co", vendor_type: "OEM_DEALER", part_types_offered: ["OEM"] }
              as: PartsManager
              captures: { v_id: $.data.id }
            - call: "POST /stalls"
              payload: { name: "Body D", stall_type: "BODY" }
              as: ShopAdmin
              captures: { stall_id: $.data.id }
            - call: "POST /calibration-bays"
              payload: { name: "Bay D", supported_types: ["STATIC"] }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90009", vehicle_vin: "1HGCV1F30LA090009", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
          assert:
            - "the created RepairOrder has deductible_cents == 50000"
            - "Customer.${cust_id}.preferred_alternate_parts_ok == false"
            - "Insurer.${ins_id} has aftermarket_allowed true, recycled_allowed true, reconditioned_allowed false, alternate_parts_min_vehicle_age_years 3, parts_price_ceiling_pct 1.1, supplement_round_limit 3"
            - "PartsVendor.${v_id} has status ACTIVE, discount_pct 0, core_charge_cents 0, restocking_fee_pct 0.2, max_qty_per_line 4, order_seq_counter 0, fulfillment_score_rolling 50, fulfillment_score_lifetime 50"
            - "Stall.${stall_id} has cleanup_buffer_minutes 30, status AVAILABLE, booked_minutes 0; CalibrationBay.${bay_id} has concurrent_capacity 2 and scheduled_window_count 0"

      - name: stall_rejects_a_client_supplied_booked_minutes_value
        claim_type: computed_fields
        grounds:
          - entities.Stall.fields.booked_minutes
          - endpoints.POST_/stalls
          - validations.priority_5
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: >-
          booked_minutes has source computed and is absent from the endpoint's input list, so a client
          value is an unknown field under rule 5 rather than a value the server quietly adopts. The
          field is then produced only by the occupancy rollup - it reads 0 at creation and 240 after a
          four-hour booking that the caller never named.
        test_recipe:
          setup:
            - "A locked RepairOrder exists so a stage assignment can be booked (customer, insurer, order, one BODY 4.5 h line, blueprint, lock)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hal Tor", phone: "555-1007", email: "hal@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-07", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90010", vehicle_vin: "1HGCV1F30LA090010", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
          trigger:
            - call: "POST /stalls"
              payload: { name: "Body E", stall_type: "BODY", booked_minutes: 999 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST and no Stall is created"
            - "the same payload without booked_minutes is accepted and the created Stall has booked_minutes == 0"
            - "after POST /repair-orders/${ro_id}/stage-assignments booking that stall for REPAIR 2026-08-01T08:00:00Z - 12:00:00Z, StageAssignment.occupied_minutes == 240 and Stall.booked_minutes == 240"
            - "both values were computed from the window alone; the caller supplied neither"

      - name: repair_order_rejects_a_client_supplied_stage_and_stamps_checkin_at
        claim_type: system_fields
        grounds:
          - entities.RepairOrder.fields.stage
          - entities.RepairOrder.fields.checkin_at
          - entities.RepairOrder.fields.blueprint_by_user_id
          - validations.priority_5
        distinguishing_aspect: >-
          System fields are server-owned on both sides: supplying stage is rejected as an unknown
          field, and the fields the caller cannot set are nevertheless populated - id, created_at,
          version 1, checkin_at from the logical clock, and blueprint_by_user_id stamped later from
          the acting X-User-ID rather than from any payload.
        test_recipe:
          setup:
            - "The clock is pinned to 2026-08-02T09:30:00Z so checkin_at is distinguishable from the default."
            - "One Customer and one Insurer exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { full_name: "Ida Vu", phone: "555-1008", email: "ida@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-08", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90011", vehicle_vin: "1HGCV1F30LA090011", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, stage: "REPAIR" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST - stage is not in the endpoint's input list"
            - "the identical payload without stage is accepted with stage INTAKE, version 1, checkin_at == 2026-08-02T09:30:00Z and a server-minted id"
            - "after a teardown finding and POST /repair-orders/{id}/blueprint issued with X-User-ID est-100, blueprint_by_user_id == est-100 even though no payload field named it"

      - name: repair_order_rejects_model_year_below_1980_and_unknown_severity_enum
        claim_type: type_constraints
        grounds:
          - entities.RepairOrder.fields.vehicle_model_year
          - entities.DamageLine.fields.severity
          - validations.priority_6
          - errors.ERR_INVALID_ENUM_VALUE
        distinguishing_aspect: >-
          Numeric range and enum membership are separate rules with separate error ids: 1979 is
          ERR_INVALID_REQUEST from rule 5 while severity CRITICAL is ERR_INVALID_ENUM_VALUE from rule
          6, and an unknown value in an enum QUERY filter is refused by the same rule 6 rather than
          being treated as "matches nothing".
        test_recipe:
          setup:
            - "One Customer, one Insurer and one RepairOrder at INTAKE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Jon Wek", phone: "555-1009", email: "jon@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-09", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90012", vehicle_vin: "1HGCV1F30LA090012", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "CRITICAL" }
              as: Estimator
              as_user_id: "est-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_ENUM_VALUE; the order is still at INTAKE with teardown_finding_count 0"
            - "a POST /repair-orders payload with vehicle_model_year 1979 is refused ERR_INVALID_REQUEST (400) - a range violation, not an enum violation"
            - "GET /repair-orders?stage=WASHING is refused ERR_INVALID_ENUM_VALUE (400) rather than returning an empty page"
            - "severity SEVERE on the same finding is accepted and the order moves to TEARDOWN"

      - name: damage_line_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.DamageLine
          - entities.Customer
          - endpoints.GET_/repair-orders/{id}/damage-lines
        distinguishing_aspect: >-
          DamageLine and Customer declare common_fields false: their rows carry no version and no
          update route exists anywhere in 1.5, so the only way the log changes is by appending. The
          first finding is byte-identical after a second is appended, and its discovered_at_stage
          records TEARDOWN for both even though the order was at INTAKE when the first arrived.
        test_recipe:
          setup:
            - "One Customer, one Insurer, one RepairOrder at INTAKE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Kim Xu", phone: "555-1010", email: "kim@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-10", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
