# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2254 — In-Bond Movement & Bonded Carrier Operations
#
# Breadth walk of references/claim-extraction-guide.md against §1.1–§1.7.
# Sections and claim_type values are taken verbatim from that guide.
# Shared fixture vocabulary (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   clock default 2026-08-01T00:00:00Z; ports 4601 NE / 3901 MW / 2704 PSW /
#   3801 MW; carrier "Atlas Bonded Carriage"; CONTINUOUS bond 50000.00;
#   M1 = IT 4601 -> 3901, 1234.60 / 100.28 kg / 3 pkgs -> obligation 41.75,
#   35 transit days, deadline 2026-09-05T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: carrier_created_with_system_defaults
        claim_type: creation
        grounds:
          - entities.BondedCarrier.fields.custodial_status
          - entities.BondedCarrier.fields.sanction_points
          - endpoints[POST /in-bond/carriers]
        distinguishing_aspect: "A fresh carrier must come back ACTIVE with sanction_points 0.0, all three counters 0, suspension_reason null and version 1 — none of which the client supplies."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "BondedCarrier.${c1}.name == Atlas Bonded Carriage"
            - "BondedCarrier.${c1}.irs_number == 12-3456789"
            - "BondedCarrier.${c1}.custodial_status == ACTIVE"
            - "BondedCarrier.${c1}.sanction_points == 0.0"
            - "BondedCarrier.${c1}.overdue_movement_count == 0"
            - "BondedCarrier.${c1}.open_claim_count == 0"
            - "BondedCarrier.${c1}.suspension_reason == null"
            - "BondedCarrier.${c1}.version == 1"
            - "response meta contains api_request_id and api_request_timestamp; response_type == object"

      - name: port_go_warehouse_available_defaults_to_true
        claim_type: defaults
        grounds:
          - entities.Port.fields.go_warehouse_available
          - entities.Port.fields.open_hold_count
        distinguishing_aspect: "Omitting the optional go_warehouse_available must store true (the declared default), not null or false, because the general-order sweep reads this flag."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2 }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Port.${p_chi}.go_warehouse_available == true"
            - "Port.${p_chi}.exam_capacity_slots == 2"
            - "Port.${p_chi}.open_hold_count == 0"
            - "Port.${p_chi}.version == 1"

      - name: movement_read_back_matches_stored_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /in-bond/movements/{id}]
          - entities.InBondMovement.fields.transit_deadline_utc
        distinguishing_aspect: "GET /in-bond/movements/{id} must echo the stored computed fields (obligation 41.75, 35 days, deadline 2026-09-05T00:00:00Z) rather than recomputing them against the current clock."
        test_recipe:
          setup:
            - "Ports 4601 (NE) and 3901 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00; M1 filed at 2026-08-01T00:00:00Z."
            - "Clock then advanced to 2026-08-20T00:00:00Z so a recompute-on-read implementation would answer differently."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          trigger:
            - call: "GET /in-bond/movements/${m1}"
              as: SuretyAgent
              as_user_id: "${b1}"
          assert:
            - "HTTP status == 200"
            - "InBondMovement.${m1}.manifest_reference == MAN-0001"
            - "InBondMovement.${m1}.obligation_amount == 41.75"
            - "InBondMovement.${m1}.transit_days_allowed == 35"
            - "InBondMovement.${m1}.filed_at == 2026-08-01T00:00:00Z"
            - "InBondMovement.${m1}.deadline_anchor_utc == 2026-08-01T00:00:00Z"
            - "InBondMovement.${m1}.transit_deadline_utc == 2026-09-05T00:00:00Z"
            - "InBondMovement.${m1}.overdue_days == 0"
            - "InBondMovement.${m1}.arrival_port_id == null"
            - "InBondMovement.${m1}.seal_number == null"

      - name: movement_list_paginates_and_filters_by_transit_status
        claim_type: listing
        grounds:
          - endpoints[GET /in-bond/movements]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three FILED movements and one IN_TRANSIT, limit=2&offset=0 must return 2 rows with total_count 4 and has_more true, while transit_status=IN_TRANSIT returns exactly 1 row with has_more false."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "Four IT movements MAN-0001..MAN-0004 are filed; MAN-0001 is then departed so it is IN_TRANSIT and the other three stay FILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0002", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0003", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0004", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
          trigger:
            - call: "GET /in-bond/movements"
              payload: { carrier_id: "${c1}", limit: 2, offset: 0 }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "GET /in-bond/movements"
              payload: { carrier_id: "${c1}", transit_status: "IN_TRANSIT" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          assert:
            - "the first read returned HTTP 200 with response_type == array, 2 rows, total_count == 4, limit == 2, offset == 0, has_more == true"
            - "the second read returned exactly 1 row whose id == ${m1} and whose transit_status == IN_TRANSIT, total_count == 1, has_more == false"
            - "CustomsBond.${b1}.open_movement_count == 4"
            - "CustomsBond.${b1}.obligated_amount == 167.00"

      - name: unknown_movement_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6].ERR_MOVEMENT_NOT_FOUND
          - errors[ERR_MOVEMENT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID must return ERR_MOVEMENT_NOT_FOUND (404) on both the read and the write path, not 400 or 500."
        test_recipe:
          setup:
            - "Empty database except a registered CBP officer identity; clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "GET /in-bond/movements/00000000-0000-0000-0000-000000009999"
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/movements/00000000-0000-0000-0000-000000009999/release"
              payload: { reason_code: "ENTRY_FILED" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          assert:
            - "both calls returned HTTP 404"
            - "both responses carry error_id == ERR_MOVEMENT_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: filing_without_cargo_value_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5].ERR_INVALID_REQUEST
          - entities.InBondMovement.fields.cargo_value
        distinguishing_aspect: "cargo_value has source: input with no default, so omitting it must fail with ERR_INVALID_REQUEST (400) before any bond or port lookup happens."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; no movement exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0099", gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "CustomsBond.${b1}.obligated_amount == 0.00"
            - "GET /in-bond/movements?carrier_id=${c1} returns total_count == 0"

      - name: invalid_in_bond_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=5].ERR_INVALID_REQUEST
          - entities.InBondMovement.fields.in_bond_type
        distinguishing_aspect: "in_bond_type is constrained to IT | TE | IE, so the value \"IX\" must be refused with ERR_INVALID_REQUEST (400) — the enum check is payload shape, not a business rule, so it precedes ERR_ROUTE_TYPE_MISMATCH."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IX", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0098", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0097", cargo_value: 0, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "the IX filing returned HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the cargo_value 0 filing returned HTTP 400 with error_id == ERR_INVALID_REQUEST (cargo_value must be > 0)"
            - "CustomsBond.${b1}.obligated_amount == 0.00"

      - name: obligation_and_deadline_are_computed_server_side_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.InBondMovement.fields.obligation_amount
          - entities.InBondMovement.fields.transit_deadline_utc
          - calculations.movement_bond_obligation
        distinguishing_aspect: "Client-supplied obligation_amount 9999.99 and transit_deadline_utc 2026-12-31 must be ignored: the stored values are 41.75 and 2026-09-05T00:00:00Z, and the bond is charged 41.75."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}", obligation_amount: 9999.99, transit_deadline_utc: "2026-12-31T00:00:00Z", transit_status: "CLOSED" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "InBondMovement.${m1}.obligation_amount == 41.75"
            - "InBondMovement.${m1}.transit_deadline_utc == 2026-09-05T00:00:00Z"
            - "InBondMovement.${m1}.transit_status == FILED"
            - "InBondMovement.${m1}.custody_status == BONDED"
            - "InBondMovement.${m1}.version == 1"
            - "CustomsBond.${b1}.obligated_amount == 41.75"

      - name: ledger_entries_and_seal_events_are_immutable_records
        claim_type: immutability
        grounds:
          - entities.BondObligationLedgerEntry
          - entities.SealEvent
          - endpoints[GET /in-bond/ledger-entries]
        distinguishing_aspect: "Both entities declare common_fields: false — they expose id and created_at only (no version, no updated_at) and §1.5 offers no PATCH or DELETE for either, so history can never be rewritten."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; M1 filed then departed with seal SEAL-100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
          trigger:
            - call: "GET /in-bond/ledger-entries"
              payload: { bond_id: "${b1}" }
              as: SuretyAgent
