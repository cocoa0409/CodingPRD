# =============================================================================
# Scaffold: Self-Funded & Captive Plan TPA (Expert)
# =============================================================================
scenario: |
  1049. Self-Funded & Captive Plan TPA: plan & stop-loss, claims adjudication &
  repricing, network & PPO discount, eligibility & accumulator, fund & check-run,
  reinsurance/laser, reporting/1099, run-out

domain_name: self-funded-tpa
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_name, type: string, source: input, description: "Employer / plan-sponsor name" }
      - { name: sponsor_tax_id, type: string, source: input, description: "Plan sponsor EIN" }
      - { name: plan_year_start, type: datetime, source: input, description: "Plan year start date (ISO date)" }
      - { name: plan_year_end, type: datetime, source: input, description: "Plan year end date (ISO date)" }
      - { name: individual_deductible_cents, type: integer, source: input, description: "Per-member annual deductible" }
      - { name: oop_max_cents, type: integer, source: input, description: "Per-member annual out-of-pocket maximum" }
      - { name: plan_coinsurance_pct, type: number, source: input, description: "Plan's coinsurance share after deductible, 0..1 (e.g. 0.80 = plan pays 80%)" }
      - { name: run_out_days, type: integer, source: input, default: 90, description: "Days after termination during which incurred-before-term claims may still be adjudicated" }
      - { name: terminated_at, type: datetime, source: system, default: null, description: "Termination date, set on terminate (null while ACTIVE)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED | CLOSED", constraints: "ACTIVE|TERMINATED|CLOSED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider / facility name" }
      - { name: tax_id, type: string, source: input, description: "Provider TIN, used for 1099 aggregation" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: in_network, type: boolean, source: input, description: "True if provider participates in the PPO network" }
      - { name: ppo_discount_pct, type: number, source: input, default: 0, description: "PPO repricing discount 0..1 applied to billed charges for in-network providers" }
      - { name: ytd_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative plan_paid disbursed to this provider via released check-runs in the current tax year" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id" }
      - { name: first_name, type: string, source: input, description: "Member first name" }
      - { name: last_name, type: string, source: input, description: "Member last name" }
      - { name: coverage_effective_date, type: datetime, source: input, description: "Coverage start (ISO date)" }
      - { name: coverage_term_date, type: datetime, source: input, default: null, description: "Coverage end (ISO date); null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED", constraints: "ACTIVE|TERMINATED" }
      - { name: deductible_met_cents, type: integer, source: computed, default: 0, description: "Accumulator: deductible satisfied this plan year" }
      - { name: oop_met_cents, type: integer, source: computed, default: 0, description: "Accumulator: out-of-pocket satisfied this plan year" }
      - { name: member_plan_paid_ytd_cents, type: integer, source: computed, default: 0, description: "Cumulative plan_paid on this member's adjudicated claims this policy period (specific stop-loss basis)" }
      - { name: spec_reimbursed_cents, type: integer, source: computed, default: 0, description: "Cumulative specific stop-loss reimbursement already recognized for this member" }

  - name: StopLossPolicy
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id" }
      - { name: carrier_name, type: string, source: input, description: "Stop-loss / reinsurance carrier name" }
      - { name: contract_basis, type: enum, source: input, description: "PAID | INCURRED — governs which claims count toward aggregate settlement", constraints: "PAID|INCURRED" }
      - { name: effective_date, type: datetime, source: input, description: "Policy period start (ISO date), inclusive" }
      - { name: expiry_date, type: datetime, source: input, description: "Policy period end (ISO date), exclusive for period-overlap arithmetic" }
      - { name: specific_deductible_cents, type: integer, source: input, description: "Per-member specific (individual) attachment point" }
      - { name: aggregate_attachment_cents, type: integer, source: input, description: "Plan-wide aggregate attachment point" }
      - { name: total_specific_reimbursed_cents, type: integer, source: computed, default: 0, description: "Sum of SPECIFIC reimbursements recognized under this policy" }
      - { name: total_aggregate_reimbursed_cents, type: integer, source: computed, default: 0, description: "Sum of AGGREGATE reimbursements recognized under this policy" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SETTLED", constraints: "DRAFT|ACTIVE|SETTLED" }

  - name: Laser
    parent: null
    common_fields: true
    fields:
      - { name: stop_loss_policy_id, type: string, source: input, description: "FK -> StopLossPolicy.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: laser_deductible_cents, type: integer, source: input, description: "Raised specific deductible carved out for this member (reinsurance laser)" }
      - { name: effective_date, type: datetime, source: input, description: "Laser window start (ISO date), inclusive" }
      - { name: expiry_date, type: datetime, source: input, description: "Laser window end (ISO date), inclusive" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: service_date, type: datetime, source: input, description: "Date service was incurred (ISO date)" }
      - { name: billed_lines, type: array, source: input, description: "Line items: [{ description?, billed_cents }]" }
      - { name: billed_total_cents, type: integer, source: computed, description: "Sum of billed_cents across billed_lines" }
      - { name: ucr_amount_cents, type: integer, source: input, default: null, description: "Usual-customary-reasonable cap used for out-of-network repricing" }
      - { name: allowed_amount_cents, type: integer, source: computed, default: null, description: "Repriced allowed amount (set at adjudication)" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: null, description: "Portion of allowed applied to member deductible" }
      - { name: member_coinsurance_cents, type: integer, source: computed, default: null, description: "Member coinsurance portion" }
      - { name: member_responsibility_cents, type: integer, source: computed, default: null, description: "Total member cost-share (deductible + coinsurance, OOP-capped)" }
      - { name: plan_paid_cents, type: integer, source: computed, default: null, description: "Plan's liability = allowed - member_responsibility" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Reason captured on deny" }
      - { name: pended_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the examiner who pended this claim (segregation-of-duties)" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Clock time when a check-run released payment for this claim" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PENDED | ADJUDICATED | DENIED | PAID | REVERSED", constraints: "SUBMITTED|PENDED|ADJUDICATED|DENIED|PAID|REVERSED" }

  - name: FundAccount
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Current claims-funding balance" }
      - { name: total_deposited_cents, type: integer, source: computed, default: 0, description: "Lifetime deposits" }
      - { name: total_disbursed_cents, type: integer, source: computed, default: 0, description: "Lifetime disbursements via released check-runs (net of voids)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE", constraints: "ACTIVE" }

  - name: CheckRun
    parent: null
    common_fields: true
    fields:
      - { name: fund_account_id, type: string, source: input, description: "FK -> FundAccount.id" }
      - { name: claim_ids, type: array, source: input, description: "IDs of claims to disburse in this batch" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of plan_paid_cents over included claims" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Clock time of release" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | VOIDED", constraints: "DRAFT|RELEASED|VOIDED" }

  - name: StopLossReimbursement
    parent: null
    common_fields: true
    fields:
      - { name: stop_loss_policy_id, type: string, source: input, description: "FK -> StopLossPolicy.id" }
      - { name: claim_id, type: string, source: input, default: null, description: "FK -> Claim.id (SPECIFIC reimbursements only; null for AGGREGATE)" }
      - { name: member_id, type: string, source: system, default: null, description: "Member the SPECIFIC reimbursement pertains to (null for AGGREGATE)" }
      - { name: reimbursement_type, type: enum, source: system, description: "SPECIFIC | AGGREGATE", constraints: "SPECIFIC|AGGREGATE" }
      - { name: amount_cents, type: integer, source: computed, description: "Reimbursement amount recognized" }
      - { name: basis_note, type: string, source: system, default: null, description: "For AGGREGATE: contract basis (PAID/INCURRED) used for the settlement" }

  - name: Form1099
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: tax_year, type: integer, source: input, description: "Reporting tax year (e.g. 2026)" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of plan_paid disbursed to provider in tax_year via PAID claims" }
      - { name: reportable, type: boolean, source: computed, description: "True when total_paid_cents >= REPORTABLE_THRESHOLD_CENTS (600 USD)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plans/{id}/terminate"
        actor: TPAAdmin
        preconditions: ["Plan.status == ACTIVE"]
        side_effects: ["set Plan.terminated_at = termination_date"]
      - from: TERMINATED
        to: CLOSED
        trigger: "POST /plans/{id}/close"
        actor: TPAAdmin
        preconditions:
          - "Plan.status == TERMINATED"
          - "current_clock > Plan.terminated_at + run_out_days (run-out window elapsed); else ERR_INVALID_STATE"
        side_effects: []

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /members/{id}/terminate"
        actor: TPAAdmin
        preconditions: ["Member.status == ACTIVE"]
        side_effects: ["set Member.coverage_term_date = termination_date"]

  - entity: StopLossPolicy
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /stop-loss-policies/{id}/activate"
        actor: TPAAdmin
        preconditions:
          - "StopLossPolicy.status == DRAFT"
          - "No other StopLossPolicy on the same plan_id with status ACTIVE whose [effective_date, expiry_date) overlaps this policy's [effective_date, expiry_date); else ERR_POLICY_PERIOD_OVERLAP"
        side_effects: []
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /stop-loss-policies/{id}/settle-aggregate"
        actor: TPAAdmin
        preconditions:
          - "StopLossPolicy.status == ACTIVE; else ERR_POLICY_NOT_ACTIVE"
          - "Aggregate net plan-paid exceeds aggregate_attachment_cents; else ERR_AGGREGATE_NOT_REACHED"
        side_effects:
          - "compute aggregate reimbursement per contract_basis (calc aggregate_stop_loss)"
          - "create StopLossReimbursement(reimbursement_type=AGGREGATE)"
          - "increment StopLossPolicy.total_aggregate_reimbursed_cents by the new aggregate amount"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /claims/{id}/pend"
        actor: ClaimsExaminer
        preconditions: ["Claim.status == SUBMITTED"]
        side_effects: ["set Claim.pended_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == SUBMITTED"
          - "Member.status == ACTIVE AND service_date within eligibility window (see calc eligibility); else ERR_MEMBER_NOT_ELIGIBLE"
          - "If Plan.status == TERMINATED: service_date <= Plan.terminated_at AND current_clock <= Plan.terminated_at + run_out_days; else ERR_RUN_OUT_CLOSED"
          - "No other Claim with status IN {ADJUDICATED, PAID} sharing (member_id, provider_id, service_date, billed_total_cents); else ERR_DUPLICATE_CLAIM"
        side_effects:
          - "run calc claim_repricing -> set allowed_amount_cents"
          - "run calc member_cost_share -> set deductible_applied_cents, member_coinsurance_cents, member_responsibility_cents, plan_paid_cents"
          - "increment Member.deductible_met_cents by deductible_applied_cents"
          - "increment Member.oop_met_cents by member_responsibility_cents"
          - "increment Member.member_plan_paid_ytd_cents by plan_paid_cents"
          - "cascade: run calc specific_stop_loss; if positive, create StopLossReimbursement(SPECIFIC) and increment Member.spec_reimbursed_cents and StopLossPolicy.total_specific_reimbursed_cents"
      - from: PENDED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == PENDED"
          - "X-User-ID != Claim.pended_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
          - "same eligibility / run-out / duplicate preconditions as SUBMITTED->ADJUDICATED"
        side_effects: ["identical repricing + cost-share + accumulator + specific-stop-loss cascade as SUBMITTED->ADJUDICATED"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsExaminer
        preconditions: ["Claim.status == SUBMITTED"]
        side_effects: ["set Claim.denial_reason"]
      - from: PENDED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsExaminer
        preconditions: ["Claim.status == PENDED"]
        side_effects: ["set Claim.denial_reason"]
      - from: ADJUDICATED
        to: REVERSED
        trigger: "POST /claims/{id}/reverse"
        actor: ClaimsExaminer
        preconditions: ["Claim.status == ADJUDICATED (a PAID claim must be voided via its check-run first); else ERR_INVALID_STATE"]
        side_effects:
          - "decrement Member.deductible_met_cents by deductible_applied_cents"
          - "decrement Member.oop_met_cents by member_responsibility_cents"
          - "decrement Member.member_plan_paid_ytd_cents by plan_paid_cents"
          - "compensation: if a SPECIFIC StopLossReimbursement was created from this claim, decrement Member.spec_reimbursed_cents and StopLossPolicy.total_specific_reimbursed_cents by its amount"
      - from: REVERSED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == REVERSED"
          - "same eligibility / run-out / duplicate preconditions as SUBMITTED->ADJUDICATED"
        side_effects: ["re-run repricing + cost-share + accumulator + specific-stop-loss cascade (revision loop)"]

  - entity: CheckRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /check-runs/{id}/release"
        actor: FundManager
        preconditions:
          - "CheckRun.status == DRAFT"
          - "every included Claim.status == ADJUDICATED; else ERR_CLAIM_NOT_ADJUDICATED"
          - "expected_fund_account_version matches FundAccount.version; else ERR_STALE_VERSION"
          - "FundAccount.balance_cents >= total_amount_cents; else ERR_INSUFFICIENT_FUNDS"
        side_effects:
          - "set CheckRun.released_at = current_clock"
          - "for each included Claim: ADJUDICATED -> PAID, set Claim.paid_at = current_clock"
          - "cascade: each PAID claim increments Provider.ytd_paid_cents by that claim's plan_paid_cents"
          - "decrement FundAccount.balance_cents by total_amount_cents; increment FundAccount.total_disbursed_cents by total_amount_cents"
          - "increment FundAccount.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /check-runs/{id}/void"
        actor: FundManager
        preconditions: ["CheckRun.status == DRAFT"]
        side_effects: ["none (draft discarded; no fund movement, no claim state change)"]
      - from: RELEASED
        to: VOIDED
        trigger: "POST /check-runs/{id}/void"
        actor: FundManager
        preconditions: ["CheckRun.status == RELEASED"]
        side_effects:
          - "compensation: for each included Claim: PAID -> ADJUDICATED, clear Claim.paid_at"
          - "compensation: decrement Provider.ytd_paid_cents by each claim's plan_paid_cents"
          - "increment FundAccount.balance_cents by total_amount_cents; decrement FundAccount.total_disbursed_cents by total_amount_cents"
          - "increment FundAccount.version by 1"

# ------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ------------------------------------------------------------------
concurrency_rules:
  - rule_id: check-run-release-stale-fund
    parent_entity: FundAccount
    write_endpoint: "POST /check-runs/{id}/release"
    occ_field: "expected_fund_account_version"
    description: |
      Releasing a check-run against a FundAccount whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another check-run has already been released against the same fund
      (legitimately debiting the shared balance) or a deposit has posted, so the
      releasing client's view of the fund is stale. Resolved by an OCC check on
      the parent FundAccount.version, not by any timing assumption.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_repricing
    trigger: "Claim SUBMITTED/PENDED/REVERSED -> ADJUDICATED (POST /claims/{id}/adjudicate)"
    algorithm: tiered_pricing
    formula: |
      billed_total_cents = sum(line.billed_cents for line in billed_lines)
      if Provider.in_network:
        # round per-line THEN sum (pinned rounding order)
        allowed_amount_cents = sum( round_half_up(line.billed_cents * (1 - Provider.ppo_discount_pct))
                                    for line in billed_lines )
      else:
        # out-of-network: UCR cap
        allowed_amount_cents = min(billed_total_cents, ucr_amount_cents)
    input_set: "Single claim's billed_lines; Provider.in_network + Provider.ppo_discount_pct; claim ucr_amount_cents for OON"
    constants: {}
    precision: "integer cents; round_half_up on each per-line product before summing (order is fixed)"
    variants:
      - name: in_network_ppo
        when: "Provider.in_network == true"
        difference: "allowed = per-line round(billed*(1-ppo_discount_pct)) summed"
      - name: out_of_network_ucr
        when: "Provider.in_network == false"
        difference: "allowed = min(billed_total_cents, ucr_amount_cents) — ignores ppo_discount_pct"

  - name: member_cost_share
    trigger: "Claim -> ADJUDICATED (immediately after claim_repricing)"
    algorithm: waterfall_allocation
    formula: |
      D  = Plan.individual_deductible_cents
      OOP = Plan.oop_max_cents
      CO = Plan.plan_coinsurance_pct            # plan's share, 0..1
      ded_remaining        = max(0, D - Member.deductible_met_cents)
      deductible_applied   = min(allowed_amount_cents, ded_remaining)
      after_deductible     = allowed_amount_cents - deductible_applied
      member_coinsurance   = round_half_up(after_deductible * (1 - CO))
      resp_uncapped        = deductible_applied + member_coinsurance
      oop_remaining        = max(0, OOP - Member.oop_met_cents)
      member_responsibility_cents = min(resp_uncapped, oop_remaining)
      plan_paid_cents      = allowed_amount_cents - member_responsibility_cents
    input_set: "Single claim allowed_amount_cents; Member.deductible_met_cents & oop_met_cents accumulators (pre-claim values); Plan constants"
    constants: {}
    precision: "integer cents; round_half_up on coinsurance; deductible waterfall before coinsurance before OOP cap (order fixed)"

  - name: specific_stop_loss
    trigger: "Claim -> ADJUDICATED cascade (after member accumulators updated)"
    algorithm: threshold
    formula: |
      # select the member's governing specific deductible
      laser = the Laser with member_id == Member.id AND stop_loss_policy_id == active policy
              whose [effective_date, expiry_date] (inclusive) contains Claim.service_date;
              tie-break created_at ASC; if none -> no laser
      spec_ded = laser.laser_deductible_cents if laser else ActivePolicy.specific_deductible_cents
      eligible_excess     = max(0, Member.member_plan_paid_ytd_cents - spec_ded)
      new_reimbursement   = eligible_excess - Member.spec_reimbursed_cents
      if new_reimbursement > 0:
        create StopLossReimbursement(SPECIFIC, amount_cents=new_reimbursement, claim_id, member_id)
        Member.spec_reimbursed_cents            += new_reimbursement
        ActivePolicy.total_specific_reimbursed_cents += new_reimbursement
    input_set: "Member.member_plan_paid_ytd_cents (post cost-share); active StopLossPolicy for Member.plan_id (status ACTIVE, [effective,expiry) contains service_date, tie-break created_at ASC); optional Laser"
    constants: {}
    precision: "integer cents; excess floored at 0"

  - name: aggregate_stop_loss
    trigger: "POST /stop-loss-policies/{id}/settle-aggregate"
    algorithm: aggregation
    formula: |
      basis = StopLossPolicy.contract_basis
      if basis == INCURRED:
        qualifying = Claims where status IN {ADJUDICATED, PAID}
                     AND effective_date <= service_date <= expiry_date (inclusive, incurred window)
      else:  # PAID
        qualifying = Claims where status == PAID
                     AND effective_date <= paid_at <= expiry_date (inclusive, paid window)
      gross_plan_paid = sum(c.plan_paid_cents for c in qualifying)
      net_plan_paid   = gross_plan_paid - StopLossPolicy.total_specific_reimbursed_cents
      excess          = max(0, net_plan_paid - StopLossPolicy.aggregate_attachment_cents)
      new_aggregate   = excess - StopLossPolicy.total_aggregate_reimbursed_cents
      if new_aggregate <= 0: ERR_AGGREGATE_NOT_REACHED
      else: create StopLossReimbursement(AGGREGATE, amount_cents=new_aggregate, basis_note=basis)
    input_set: "All claims on the policy's plan; status filter per basis (INCURRED: {ADJUDICATED,PAID} by service_date; PAID: {PAID} by paid_at); window inclusive both ends"
    constants: {}
    precision: "integer cents; excess floored at 0"
    variants:
      - name: paid_basis
        when: "contract_basis == PAID"
        difference: "counts only PAID claims by paid_at inside window — run-out claims paid after expiry are excluded"
      - name: incurred_basis
        when: "contract_basis == INCURRED"
        difference: "counts ADJUDICATED+PAID claims by service_date inside window regardless of pay date"

  - name: form_1099_total
    trigger: "POST /form-1099s/generate"
    algorithm: aggregation
    formula: |
      total_paid_cents = sum( c.plan_paid_cents
                              for c in Claims
                              where c.provider_id == provider_id
                                AND c.status == PAID
                                AND year(c.paid_at) == tax_year )
      reportable = (total_paid_cents >= REPORTABLE_THRESHOLD_CENTS)
    input_set: "Claims with provider_id == target, status == PAID, paid_at calendar year == tax_year"
    constants:
      REPORTABLE_THRESHOLD_CENTS: 60000
    precision: "integer cents; reportable uses >= (600.00 USD boundary is reportable)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and valid", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Referenced Plan exists", error_id: ERR_PLAN_NOT_FOUND, http_status: 404, applies_to: "plan-scoped endpoints" }
  - { priority: 3, category: existence, check: "Referenced Provider exists", error_id: ERR_PROVIDER_NOT_FOUND, http_status: 404, applies_to: "POST /claims, POST /form-1099s/generate" }
  - { priority: 3, category: existence, check: "Referenced Member exists", error_id: ERR_MEMBER_NOT_FOUND, http_status: 404, applies_to: "POST /claims, POST /lasers, member endpoints" }
  - { priority: 3, category: existence, check: "Referenced StopLossPolicy exists", error_id: ERR_STOP_LOSS_POLICY_NOT_FOUND, http_status: 404, applies_to: "stop-loss + laser endpoints" }
  - { priority: 3, category: existence, check: "Referenced Laser exists", error_id: ERR_LASER_NOT_FOUND, http_status: 404, applies_to: "GET /lasers/{id}" }
  - { priority: 3, category: existence, check: "Referenced Claim exists", error_id: ERR_CLAIM_NOT_FOUND, http_status: 404, applies_to: "claim endpoints, check-run creation" }
  - { priority: 3, category: existence, check: "Referenced FundAccount exists", error_id: ERR_FUND_ACCOUNT_NOT_FOUND, http_status: 404, applies_to: "fund + check-run endpoints" }
  - { priority: 3, category: existence, check: "Referenced CheckRun exists", error_id: ERR_CHECK_RUN_NOT_FOUND, http_status: 404, applies_to: "check-run endpoints" }
  - { priority: 3, category: existence, check: "Referenced StopLossReimbursement exists", error_id: ERR_REIMBURSEMENT_NOT_FOUND, http_status: 404, applies_to: "GET /stop-loss-reimbursements/{id}" }
  - { priority: 3, category: existence, check: "Referenced Form1099 exists", error_id: ERR_FORM_1099_NOT_FOUND, http_status: 404, applies_to: "GET /form-1099s/{id}" }
  - { priority: 4, category: state, check: "Target entity is in a state that permits this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 4, category: state, check: "Every claim in a check-run being released is ADJUDICATED", error_id: ERR_CLAIM_NOT_ADJUDICATED, http_status: 409, applies_to: "POST /check-runs/{id}/release" }
  - { priority: 4, category: state, check: "No claim_id in the new check-run already belongs to a DRAFT or RELEASED check-run", error_id: ERR_CLAIM_ALREADY_IN_CHECK_RUN, http_status: 409, applies_to: "POST /check-runs" }
  - { priority: 4, category: state, check: "StopLossPolicy is ACTIVE for aggregate settlement", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: "POST /stop-loss-policies/{id}/settle-aggregate" }
  - { priority: 4, category: state, check: "Laser's stop-loss policy is ACTIVE (lasers cannot be carved on DRAFT/SETTLED policies)", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: "POST /lasers" }
  - { priority: 5, category: state, check: "expected_fund_account_version matches FundAccount.version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /check-runs/{id}/release" }
  - { priority: 6, category: business_safety, check: "Adjudicating examiner (X-User-ID) differs from the examiner who pended the claim", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /claims/{id}/adjudicate (from PENDED)" }
  - { priority: 6, category: business_safety, check: "No ADJUDICATED/PAID twin with same (member_id, provider_id, service_date, billed_total_cents)", error_id: ERR_DUPLICATE_CLAIM, http_status: 409, applies_to: "POST /claims/{id}/adjudicate" }
  - { priority: 7, category: business_referential, check: "Laser's member belongs to the same plan as the laser's stop-loss policy", error_id: ERR_LASER_MEMBER_MISMATCH, http_status: 422, applies_to: "POST /lasers" }
  - { priority: 8, category: business_constraint, check: "New ACTIVE stop-loss policy period does not overlap an existing ACTIVE one on the plan; adjacency (expiry==next.effective) allowed (half-open [effective,expiry))", error_id: ERR_POLICY_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /stop-loss-policies/{id}/activate" }
  - { priority: 8, category: business_constraint, check: "New laser window does not overlap an existing laser for same (policy, member); closed intervals [effective,expiry], touching endpoints REJECTED (new.effective must be > prior.expiry)", error_id: ERR_LASER_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /lasers" }
  - { priority: 9, category: business_temporal, check: "Member ACTIVE and service_date within [coverage_effective_date, coverage_term_date]", error_id: ERR_MEMBER_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /claims/{id}/adjudicate" }
  - { priority: 9, category: business_temporal, check: "If plan TERMINATED: service_date <= terminated_at AND current_clock <= terminated_at + run_out_days", error_id: ERR_RUN_OUT_CLOSED, http_status: 422, applies_to: "POST /claims/{id}/adjudicate" }
  - { priority: 10, category: business_fiscal, check: "FundAccount balance covers check-run total", error_id: ERR_INSUFFICIENT_FUNDS, http_status: 402, applies_to: "POST /check-runs/{id}/release" }
  - { priority: 10, category: business_fiscal, check: "Aggregate net plan-paid exceeds aggregate attachment", error_id: ERR_AGGREGATE_NOT_REACHED, http_status: 422, applies_to: "POST /stop-loss-policies/{id}/settle-aggregate" }
  - { priority: 4, category: business_constraint, check: "Request body well-formed (required fields present, enums/types valid, numeric >= 0)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all writes" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Plan ----
  - { method: POST, path: "/plans", description: "Create a self-funded plan (ACTIVE)", roles: [TPAAdmin], code: 201, input: [sponsor_name, sponsor_tax_id, plan_year_start, plan_year_end, individual_deductible_cents, oop_max_cents, plan_coinsurance_pct, "run_out_days?"], output: Plan, side_effects: [] }
  - { method: GET, path: "/plans/{id}", description: "Fetch a plan", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: Plan, side_effects: [] }
  - { method: POST, path: "/plans/{id}/terminate", description: "Terminate a plan, opening the run-out window", roles: [TPAAdmin], code: 200, input: [termination_date], output: Plan, side_effects: ["set terminated_at"] }
  - { method: POST, path: "/plans/{id}/close", description: "Close a plan after run-out elapses", roles: [TPAAdmin], code: 200, input: [], output: Plan, side_effects: [] }

  # ---- Provider ----
  - { method: POST, path: "/providers", description: "Register a provider", roles: [TPAAdmin], code: 201, input: [name, tax_id, npi, in_network, "ppo_discount_pct?"], output: Provider, side_effects: [] }
  - { method: GET, path: "/providers/{id}", description: "Fetch a provider (incl. ytd_paid_cents)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: Provider, side_effects: [] }

  # ---- Member ----
  - { method: POST, path: "/members", description: "Enroll a member", roles: [TPAAdmin], code: 201, input: [plan_id, first_name, last_name, coverage_effective_date, "coverage_term_date?"], output: Member, side_effects: [] }
  - { method: GET, path: "/members/{id}", description: "Fetch a member (incl. accumulators)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/members", description: "List members (filter by plan)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["plan_id?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/members/{id}/terminate", description: "Terminate member coverage", roles: [TPAAdmin], code: 200, input: [termination_date], output: Member, side_effects: ["set coverage_term_date"] }

  # ---- StopLossPolicy ----
  - { method: POST, path: "/stop-loss-policies", description: "Create a stop-loss/reinsurance policy (DRAFT)", roles: [TPAAdmin], code: 201, input: [plan_id, carrier_name, contract_basis, effective_date, expiry_date, specific_deductible_cents, aggregate_attachment_cents], output: StopLossPolicy, side_effects: [] }
  - { method: GET, path: "/stop-loss-policies/{id}", description: "Fetch a stop-loss policy", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: StopLossPolicy, side_effects: [] }
  - { method: GET, path: "/stop-loss-policies", description: "List stop-loss policies (filter by plan)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["plan_id?", "limit?", "offset?"], output: "StopLossPolicy[]", side_effects: [] }
  - { method: POST, path: "/stop-loss-policies/{id}/activate", description: "Activate a policy (enforces period non-overlap)", roles: [TPAAdmin], code: 200, input: [], output: StopLossPolicy, side_effects: ["overlap check"] }
  - { method: POST, path: "/stop-loss-policies/{id}/settle-aggregate", description: "Run aggregate settlement per contract basis", roles: [TPAAdmin, Auditor], code: 201, input: [], output: StopLossReimbursement, side_effects: ["create AGGREGATE reimbursement", "policy -> SETTLED", "increment total_aggregate_reimbursed_cents"] }

  # ---- Laser ----
  - { method: POST, path: "/lasers", description: "Carve out a member laser under a policy", roles: [TPAAdmin], code: 201, input: [stop_loss_policy_id, member_id, laser_deductible_cents, effective_date, expiry_date], output: Laser, side_effects: [] }
  - { method: GET, path: "/lasers/{id}", description: "Fetch a laser", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: Laser, side_effects: [] }
  - { method: GET, path: "/lasers", description: "List lasers (filter by policy and/or member)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["stop_loss_policy_id?", "member_id?", "limit?", "offset?"], output: "Laser[]", side_effects: [] }

  # ---- Claim ----
  - { method: POST, path: "/claims", description: "Submit a claim (SUBMITTED)", roles: [ClaimsExaminer], code: 201, input: [member_id, provider_id, service_date, billed_lines, "ucr_amount_cents?"], output: Claim, side_effects: ["compute billed_total_cents"] }
  - { method: GET, path: "/claims/{id}", description: "Fetch a claim", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/claims", description: "List claims (filter by member and/or provider)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["member_id?", "provider_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/adjudicate", description: "Adjudicate + reprice a claim", roles: [ClaimsExaminer], code: 200, input: [], output: Claim, side_effects: ["repricing", "cost-share", "accumulator update", "specific stop-loss cascade"] }
  - { method: POST, path: "/claims/{id}/pend", description: "Pend a claim for review", roles: [ClaimsExaminer], code: 200, input: [], output: Claim, side_effects: ["set pended_by_user_id"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny a claim", roles: [ClaimsExaminer], code: 200, input: [denial_reason], output: Claim, side_effects: ["set denial_reason"] }
  - { method: POST, path: "/claims/{id}/reverse", description: "Reverse an adjudicated claim (compensation)", roles: [ClaimsExaminer], code: 200, input: [], output: Claim, side_effects: ["reverse accumulators + specific reimbursement"] }

  # ---- FundAccount ----
  - { method: POST, path: "/fund-accounts", description: "Open a plan funding account", roles: [FundManager], code: 201, input: [plan_id], output: FundAccount, side_effects: [] }
  - { method: GET, path: "/fund-accounts/{id}", description: "Fetch a fund account", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: FundAccount, side_effects: [] }
  - { method: GET, path: "/fund-accounts", description: "List fund accounts (filter by plan)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["plan_id?", "limit?", "offset?"], output: "FundAccount[]", side_effects: [] }
  - { method: POST, path: "/fund-accounts/{id}/deposit", description: "Deposit employer funds", roles: [FundManager], code: 200, input: [amount_cents], output: FundAccount, side_effects: ["increment balance + total_deposited", "increment version"] }

  # ---- CheckRun ----
  - { method: POST, path: "/check-runs", description: "Draft a check-run over adjudicated claims; rejects any claim already held by a non-VOIDED check-run (ERR_CLAIM_ALREADY_IN_CHECK_RUN)", roles: [FundManager], code: 201, input: [fund_account_id, claim_ids], output: CheckRun, side_effects: ["compute total_amount_cents"] }
  - { method: GET, path: "/check-runs/{id}", description: "Fetch a check-run", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: CheckRun, side_effects: [] }
  - { method: GET, path: "/fund-accounts/{id}/check-runs", description: "List a fund account's check-runs", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["limit?", "offset?"], output: "CheckRun[]", side_effects: [] }
  - { method: POST, path: "/check-runs/{id}/release", description: "Release a check-run (OCC on fund)", roles: [FundManager], code: 200, input: [expected_fund_account_version], output: CheckRun, side_effects: ["claims -> PAID", "provider ytd cascade", "debit fund", "increment fund.version"] }
  - { method: POST, path: "/check-runs/{id}/void", description: "Void a check-run (compensation if RELEASED)", roles: [FundManager], code: 200, input: [], output: CheckRun, side_effects: ["reverse payments if RELEASED", "increment fund.version"] }

  # ---- StopLossReimbursement ----
  - { method: GET, path: "/stop-loss-reimbursements/{id}", description: "Fetch a reimbursement", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: StopLossReimbursement, side_effects: [] }
  - { method: GET, path: "/stop-loss-reimbursements", description: "List reimbursements (filter by policy and/or claim)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["stop_loss_policy_id?", "claim_id?", "limit?", "offset?"], output: "StopLossReimbursement[]", side_effects: [] }

  # ---- Form1099 ----
  - { method: POST, path: "/form-1099s/generate", description: "Generate a provider 1099 for a tax year", roles: [Auditor], code: 201, input: [provider_id, tax_year], output: Form1099, side_effects: ["compute total_paid_cents + reportable"] }
  - { method: GET, path: "/form-1099s/{id}", description: "Fetch a 1099", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: [], output: Form1099, side_effects: [] }
  - { method: GET, path: "/form-1099s", description: "List 1099s (filter by provider)", roles: [TPAAdmin, ClaimsExaminer, FundManager, Auditor], code: 200, input: ["provider_id?", "limit?", "offset?"], output: "Form1099[]", side_effects: [] }

  # ---- Clock (test-driving) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time.", roles: [TPAAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["advances logical clock used for run-out, paid_at, released_at, 1099 tax_year"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum/type, negative amount" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Plan id does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_STOP_LOSS_POLICY_NOT_FOUND, http: 404, condition: "StopLossPolicy id does not exist" }
  - { id: ERR_LASER_NOT_FOUND, http: 404, condition: "Laser id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_FUND_ACCOUNT_NOT_FOUND, http: 404, condition: "FundAccount id does not exist" }
  - { id: ERR_CHECK_RUN_NOT_FOUND, http: 404, condition: "CheckRun id does not exist" }
  - { id: ERR_REIMBURSEMENT_NOT_FOUND, http: 404, condition: "StopLossReimbursement id does not exist" }
  - { id: ERR_FORM_1099_NOT_FOUND, http: 404, condition: "Form1099 id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state permitting the requested transition" }
  - { id: ERR_CLAIM_NOT_ADJUDICATED, http: 409, condition: "Check-run release includes a non-ADJUDICATED claim" }
  - { id: ERR_CLAIM_ALREADY_IN_CHECK_RUN, http: 409, condition: "New check-run includes a claim already held by a DRAFT or RELEASED check-run" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Aggregate settlement attempted on a non-ACTIVE policy" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_fund_account_version != FundAccount.version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Examiner adjudicating a PENDED claim is the same user who pended it" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "An ADJUDICATED/PAID twin exists with same member+provider+service_date+billed_total" }
  - { id: ERR_LASER_MEMBER_MISMATCH, http: 422, condition: "Laser member's plan differs from the policy's plan" }
  - { id: ERR_POLICY_PERIOD_OVERLAP, http: 409, condition: "Activating policy period overlaps an existing ACTIVE policy on the plan (half-open)" }
  - { id: ERR_LASER_WINDOW_OVERLAP, http: 409, condition: "Laser window overlaps/touches an existing laser for same policy+member (closed)" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 422, condition: "Member terminated or service_date outside coverage window" }
  - { id: ERR_RUN_OUT_CLOSED, http: 422, condition: "Plan terminated and claim outside run-out (service after term, or clock past run-out window)" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Fund balance below check-run total at release" }
  - { id: ERR_AGGREGATE_NOT_REACHED, http: 422, condition: "Aggregate net plan-paid does not exceed the aggregate attachment" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TPAAdmin
    description: "Configures plans, providers, members, stop-loss policies, lasers, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans, /plans/{id}/terminate, /plans/{id}/close"
      - "POST /providers"
      - "POST /members, /members/{id}/terminate"
      - "POST /stop-loss-policies, /stop-loss-policies/{id}/activate"
      - "POST /lasers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /stop-loss-policies/{id}/settle-aggregate (with Auditor)"
      - "all GET reads"
  - name: ClaimsExaminer
    description: "Submits, pends, denies, adjudicates, and reverses claims; X-User-ID tracked for segregation of duties"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims, /claims/{id}/adjudicate, /claims/{id}/pend, /claims/{id}/deny, /claims/{id}/reverse"
    shared_operations:
      - "all GET reads"
  - name: FundManager
    description: "Manages plan funding accounts and check-runs"
    identity: "opaque"
    exclusive_operations:
      - "POST /fund-accounts, /fund-accounts/{id}/deposit"
      - "POST /check-runs, /check-runs/{id}/release, /check-runs/{id}/void"
    shared_operations:
      - "all GET reads"
  - name: Auditor
    description: "Read-only reporting plus 1099 generation and aggregate settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /form-1099s/generate"
    shared_operations:
      - "POST /stop-loss-policies/{id}/settle-aggregate (with TPAAdmin)"
      - "all GET reads"
