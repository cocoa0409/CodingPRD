            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V1", reason: "NO_ID" }
              as: PrecinctCaptain
              captures: { pbA: $.data.id }
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V2", reason: "NO_ID" }
              as: PrecinctCaptain
              captures: { pbB: $.data.id }
            - call: "POST /provisional-ballots/${pbA}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: PrecinctCaptain
          trigger:
            - call: "POST /provisional-ballots/${pbB}/adjudicate"
              payload: { decision: "REJECT" }
              as: PrecinctCaptain
          assert:
            - "ProvisionalBallot.${pbA}.status == ACCEPTED"
            - "ProvisionalBallot.${pbB}.status == REJECTED"
            - "PollingPlace.${pp_id}.provisional_accepted_count == 1"
            - "PollingPlace.${pp_id}.provisional_cast_count == 2"

      - name: polling_place_cyclic_open_suspend_open
        grounds:
          - state_machines.PollingPlace.OPEN_to_SUSPENDED
          - state_machines.PollingPlace.SUSPENDED_to_OPEN
          - entities.PollingPlace.fields.readiness_posture
        distinguishing_aspect: "PollingPlace cycles OPEN -> SUSPENDED -> OPEN on a different entity than ProvisionalBallot; posture returns to OPEN after resume, and version has incremented three times from the open baseline."
        test_recipe:
          setup:
            - "Place OPEN with equipment OPERATIONAL and a kit AT_PLACE, worker staffed."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
