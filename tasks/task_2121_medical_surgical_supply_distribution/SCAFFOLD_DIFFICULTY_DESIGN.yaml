  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_priority_8_beats_referential_priority_15_on_line_write
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_ORDER_NOT_DRAFT]
          - errors[ERR_ITEM_NOT_ON_FORMULARY]
        distinguishing_aspect: |
          Error-category pair STATE (priority 8, ERR_ORDER_NOT_DRAFT) versus
          BUSINESS_REFERENTIAL (priority 15, ERR_ITEM_NOT_ON_FORMULARY): one request
          violates both and must surface the state error.
        test_recipe:
          setup:
            - "One ACUTE supply room; item A APPROVED on the formulary, item B mapped but left in REQUESTED."
            - "Contract CTR-P (TIER_1, ACUTE) ACTIVE with lines for both items."
            - "An order carrying one line of item A, already SUBMITTED - so it is no longer DRAFT."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-010", room_code: "GEN-STORE-10", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
