            - "the second award returns HTTP 201 with data.winning_bid_id == ${bid_id}, obligated_cents == 0 and status == ACTIVE"
            - "UnitCostContract.${contract_id}.ceiling_cents == 20000000 copied from the solicitation and awarded_by_user_id == 'u_award'"
            - "Bid.${bid_id}.price_score == 100.00 and composite_score == 92.00 and status == AWARDED"
            - "Solicitation.${sol_id}.status == AWARDED"

      - name: a_second_reopen_is_rejected_at_the_declared_limit
        claim_type: Violation to Error
        grounds:
          - validations[priority 73].ERR_REOPEN_LIMIT_EXCEEDED
          - state_machines.Solicitation.transitions.EVALUATING_to_OPEN
        distinguishing_aspect: |
          MAX_REOPEN_ROUNDS is 1, so the cycle EVALUATING -> OPEN is legal exactly once; the second
          attempt must be refused by the counter rule rather than by the generic edge check, because
          the edge itself still exists from EVALUATING. The refused call must also leave bid_due_at
          untouched at the first reopening's value.
        test_recipe:
          setup:
            - "one Solicitation already reopened once, closed again, and sitting in EVALUATING with reopen_round 1"
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "district 10 orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "REOPEN", new_bid_due_at: "2026-08-28T00:00:00Z" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
          trigger:
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "REOPEN", new_bid_due_at: "2026-09-04T00:00:00Z" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { err: $.data.error_id }
          assert:
            - "before the trigger Solicitation.${sol_id}.status == EVALUATING, reopen_round == 1 and bid_due_at == 2026-08-28T00:00:00Z"
            - "the trigger returns HTTP 422 with error_id ERR_REOPEN_LIMIT_EXCEEDED"
            - "the error_id is NOT ERR_INVALID_STATE_TRANSITION: the EVALUATING -> OPEN edge exists, it is the counter that is exhausted"
            - "after the trigger Solicitation.${sol_id}.status == EVALUATING and reopen_round == 1"
            - "after the trigger bid_due_at is still 2026-08-28T00:00:00Z, NOT 2026-09-04T00:00:00Z"

      - name: approval_is_refused_when_the_transferee_is_one_cent_under_bonded
        claim_type: Aggregate validation
        grounds:
          - validations[priority 75].ERR_TRANSFEREE_ASSURANCE_INSUFFICIENT
          - calculations.operator_financial_assurance_requirement.formula
        distinguishing_aspect: |
          The requirement is forward-looking: both transferees hold no wells today, so their current
          requirement is 0 and only the POST-transfer figure of 250000 can refuse the approval. The
          test is strictly-less-than, so 249999 fails and 250000 passes, and the failing transferee is
          ACTIVE at the time of the call so no earlier rule can mask this one.
        test_recipe:
          setup:
            - "operator O_FROM is BLANKET with a 500000 bond and two 2500 ft wells, so it is exactly bonded"
            - "O_SHORT is INDIVIDUAL with a 249999 bond and no wells; O_EXACT is INDIVIDUAL with a 250000 bond and no wells"
            - "one PENDING transfer of W1 to O_SHORT and one PENDING transfer of W2 to O_EXACT"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_from_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-10001", operator_id: "${op_from_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-10002", operator_id: "${op_from_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
            - call: "POST /operators"
              payload: { name: "Shoshone Shell Co", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 249999 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_short_id: $.data.id }
            - call: "POST /operators"
              payload: { name: "Teton Basin Resources", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 250000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_exact_id: $.data.id }
            - call: "POST /wells/${w1_id}/transfers"
              payload: { to_operator_id: "${op_short_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { tr_short_id: $.data.id }
            - call: "POST /wells/${w2_id}/transfers"
              payload: { to_operator_id: "${op_exact_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { tr_exact_id: $.data.id }
          trigger:
            - call: "POST /well-transfers/${tr_short_id}/decision"
              payload: { action: "APPROVE", rationale: "operator change requested" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { err: $.data.error_id }
            - call: "POST /well-transfers/${tr_exact_id}/decision"
              payload: { action: "APPROVE", rationale: "operator change requested" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "before the triggers WellTransfer.${tr_short_id}.transferee_required_bond_cents == 250000 and WellTransfer.${tr_exact_id}.transferee_required_bond_cents == 250000"
            - "before the triggers Operator.${op_short_id}.required_bond_cents == 0 and status == ACTIVE, so no earlier rule applies"
            - "the first call returns HTTP 422 with error_id ERR_TRANSFEREE_ASSURANCE_INSUFFICIENT"
            - "the first call's error_id is NOT ERR_TRANSFER_TO_INSOLVENT_OPERATOR"
            - "after the rejection WellTransfer.${tr_short_id}.status == PENDING, approved_at == null and Well.${w1_id}.operator_id == ${op_from_id}"
            - "after the rejection Operator.${op_short_id}.required_bond_cents == 0 and active_well_count == 0"
            - "the second call returns HTTP 200 with data.status == APPROVED and approved_at == 2026-08-01T00:00:00Z"
            - "Well.${w2_id}.operator_id == ${op_exact_id}; Operator.${op_exact_id}.required_bond_cents == 250000, active_well_count == 1 and status == ACTIVE (250000 is not < 250000)"
            - "Operator.${op_from_id}.required_bond_cents == 250000, active_well_count == 1 and status == ACTIVE"

      - name: contract_ceiling_rejects_one_cent_over_and_accepts_exact_equality
        claim_type: Aggregate validation
        grounds:
          - validations[priority 76].ERR_CONTRACT_CEILING_EXCEEDED
          - calculations.plugging_cost_estimate.formula
        distinguishing_aspect: |
          Each job is individually far below the 20000000 ceiling; only the aggregate over the
          contract's existing jobs plus the new one can refuse the write. The refused payload
          totals 20004000 and the accepted one totals exactly 20000000, so the rule has to be
          strictly-greater-than and has to include the already-scheduled job in the sum.
        test_recipe:
          setup:
            - "two ORPHAN_CONFIRMED wells under one operator and one ACTIVE contract with rates 4000 / 800000 / 1200 / 2400000 and ceiling 20000000"
            - "one SCHEDULED job on the first well with estimate 5800000"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-11001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "GET /wells/${w1_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_v: $.data.version }
            - call: "POST /wells/${w1_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w1_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det1_id: $.data.id }
            - call: "POST /orphan-determinations/${det1_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det1_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /wells"
              payload: { api_well_number: "49-001-11002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
