          assert:
            - "Before the trigger: Associate.${la1}.accountability_score == 85.00 (100 - WRITTEN_WARNING weight 15), training_status == CERTIFIED, issued_action_count == 1"
            - "Before the trigger: LabelTask.${task_1}.print_status == PRINTED and placement_status == PLACED; Store.${store_a}.label_backlog_count == 0; compliance_posture == OPEN"
            - "Close verdict: ScannerAudit.${audit_a}.sample_size == 4, overcharge_count == 1, error_rate_pct == 25.00, outcome == FAIL (>= threshold, not >)"
