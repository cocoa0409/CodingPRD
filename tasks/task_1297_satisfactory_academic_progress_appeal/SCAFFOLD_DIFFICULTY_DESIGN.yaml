            - { call: "POST /sap/programs", payload: { code: "BS-ECON", name: "Economics", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-9101", full_name: "Ann Exact", program_id: "${prog}" }, as: Registrar, captures: { stu_a: $.data.id } }
