          rationale: "IDT cap rate threshold is the subject of the named §1.8 boundary instance."

  # =============================================================================
  # Section: consistency_model
  # =============================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_lottery_run_returns_full_state
        claim_type: immediate
        grounds:
          - state_machines.EnrollmentWindow.CLOSED_to_LOTTERY_RUN
          - state_machines.Application.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          After POST /lottery/windows/{id}/run-lottery returns 200, an immediate follow-up
          GET on each affected Application reflects the new state (ACCEPTED or WAITLISTED).
          No eventual-consistency lag.
        test_recipe:
          setup:
            - "Window CLOSED with 1 SUBMITTED app and total_seats=5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DIM", name: "Im", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dim_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dim_id}", code: "SIM", name: "Ims", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 5 }
              as: DistrictAdmin
              captures: { sim_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dim_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wim_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "im@x.com", residence_zone_code: "ZIM", residence_district_id: "${dim_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_im: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_im}", full_name: "Im", grade_for_cycle: 4 }
              as: Guardian
              as_user_id: "${fam_im}"
              captures: { stu_im: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wim_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wim_id}", student_id: "${stu_im}", school_id: "${sim_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_im}"
              captures: { app_im: $.data.id }
            - call: "POST /lottery/applications/${app_im}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_im}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wim_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${wim_id}"
              payload: {}
              as: DistrictAdmin
              captures: { wim_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${wim_id}/run-lottery"
              payload: { expected_window_version: "${wim_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications/${app_im}"
              payload: {}
              as: DistrictAdmin
              captures: { im_status: $.data.status }
          assert:
            - "Immediately after run-lottery returns, Application.${app_im}.status == ACCEPTED (no lag)."
            - "Offer for ${app_im} immediately retrievable via GET /lottery/offers?application_id=${app_im}"
