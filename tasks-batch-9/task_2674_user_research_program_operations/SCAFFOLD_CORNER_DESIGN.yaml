  - section: cross_cutting_layers
    instances:
      - name: stale_expected_study_version_on_readout_create_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[readout-create-stale-study]
          - validations[priority 29] ERR_STALE_STUDY_VERSION
          - endpoints[POST /studies/{id}/readouts]
        distinguishing_aspect: "The readout write has no state precondition that could stand in for the version check - a fresh DRAFT is always legal - so the only thing that rejects a writer working from an out-of-date view of the study is expected_study_version. The version that succeeded once is stale on the very next call, because the successful write itself advanced it."
        setup_note: "The study is taken to GUIDE_APPROVED first so that its version is already 3 at the time of the test; that makes the stale value a real prior version rather than the non-positive 0 that a v1 study would produce."
        test_recipe:
          setup:
            - "An APPROVED request with a study at GUIDE_APPROVED and one DRAFT finding under a theme"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "OCC study", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Which step confuses new admins?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
