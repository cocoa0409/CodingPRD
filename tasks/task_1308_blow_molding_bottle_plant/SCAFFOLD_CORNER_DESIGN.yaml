          assert:
            - "run1: consumption_variance_pct == 3.0 and variance_alert == false (exactly at tolerance; strictly-greater rule)"
            - "run2: consumption_variance_pct == 3.01 and variance_alert == true"
            - "lot consumed_kg == 725.16 (362.56 + 362.6), available_kg == 274.84"

      - name: waterfall_fifo_across_two_lots
        claim_type: correct_result
        grounds: [calculations.material_allocation_waterfall]
        distinguishing_aspect: "A 150 kg drawdown drains the older lot R-1 (100 kg -> DEPLETED) before touching R-2 (50 kg debited -> IN_USE); ordering is created_at ASC, never id-based."
        test_recipe:
          setup:
