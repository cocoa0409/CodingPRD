  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success body carries meta.api_request_id, meta.api_request_timestamp and response_type object|array; every error body carries response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "GET /sales-planning/territories/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SalesOpsAdmin, captures: { eid: $.data.error_id } }
