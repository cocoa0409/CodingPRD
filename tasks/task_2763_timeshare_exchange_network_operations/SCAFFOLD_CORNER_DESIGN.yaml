        grounds: ["state_machines.ExchangeRequest.status.terminal_states", "validations[priority 11]", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: >-
          CANCELLED is terminal for ExchangeRequest, so replaying the cancellation is a 409 rather
          than a silent 200 replay. The second call must also leave the already-issued refund
          untouched — a naive re-run would credit charge_refunded_cents twice and break INV_CASH.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated, member M1 on PLUS with dues paid (wallet 80100) and a
            banked ONE_BR week checking in 2027-06-15 worth 82. M1 then submits a DEPOSIT_FIRST
            exchange request for a ONE_BR at Resort A over 2027-06-01..2027-06-30, which is charged
            23060 cents leaving wallet 57040. No matching run has been triggered, so the request is
            still SUBMITTED.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
