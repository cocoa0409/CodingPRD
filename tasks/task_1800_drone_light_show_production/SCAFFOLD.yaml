# =============================================================================
# SCAFFOLD.yaml — Drone Light Show Production (task_1800)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Drone Light Show Production (drone show production company): airspace authorization & waiver application, show design & flight path simulation, geofencing & failsafe configuration, weather/wind limits & go-no-go criteria, drone fleet battery/charging logistics & swarm launch grid, ground safety perimeter & crowd distance, backup show & cancellation policy, post-flight logs & incident reporting

domain_name: drone-light-show-production
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - rate_threshold_triggers
  entity_topology: flat        # peer entities joined by foreign keys; no nested URL paths
  state_machine_shape: parallel # ShowEvent carries lifecycle_status x payment_status; other machines are cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: latitude, type: number, source: input, description: "Venue latitude in decimal degrees", constraints: "-90..90 inclusive" }
      - { name: longitude, type: number, source: input, description: "Venue longitude in decimal degrees", constraints: "-180..180 inclusive" }
      - { name: ground_length_m, type: number, source: input, description: "Usable ground length in meters (launch grid + perimeter must fit)", constraints: "> 0" }
      - { name: ground_width_m, type: number, source: input, description: "Usable ground width in meters", constraints: "> 0" }
      - { name: site_max_wind_kt, type: number, source: input, description: "Hard sustained-wind ceiling at this venue in knots", constraints: "> 0" }
      - { name: site_max_gust_kt, type: number, source: input, description: "Hard gust ceiling at this venue in knots", constraints: "> 0" }
      - { name: site_max_altitude_ft, type: number, source: input, description: "Hard altitude ceiling at this venue in feet AGL", constraints: "> 0" }

  - name: ShowEvent
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; venue hosting the show" }
      - { name: name, type: string, source: input, description: "Show display name" }
      - { name: window_start, type: datetime, source: input, description: "Planned show window start (UTC, inclusive); must be strictly after the logical clock at creation" }
      - { name: window_end, type: datetime, source: input, description: "Planned show window end (UTC, exclusive); must be after window_start" }
      - { name: drone_count_planned, type: integer, source: input, description: "Number of drones the client booked", constraints: ">= 1" }
      - { name: backup_window_start, type: datetime, source: input, description: "Optional backup window start (UTC); required iff backup_window_end present", constraints: "must be >= 24h after window_end" }
      - { name: backup_window_end, type: datetime, source: input, description: "Optional backup window end (UTC); must be after backup_window_start" }
      - { name: backup_consumed, type: boolean, source: system, default: false, description: "True once activate-backup has moved the show into the backup window" }
      - { name: lifecycle_status, type: enum, source: system, description: "PLANNING | DESIGN_LOCKED | AUTHORIZED | READY | GO_CERTIFIED | EXECUTED | POSTPONED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "DEPOSIT_DUE | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED — parallel state dimension, independent of lifecycle_status" }
      - { name: contract_value_cents, type: integer, source: computed, description: "Total contract price from calculation show_contract_pricing; fixed at creation" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(0.30 * contract_value_cents)" }
      - { name: balance_cents, type: integer, source: computed, description: "contract_value_cents - deposit_cents" }
      - { name: paid_total_cents, type: integer, source: computed, default: 0, description: "Sum of recorded payments (DEPOSIT + BALANCE); never decremented" }
      - { name: refunded_total_cents, type: integer, source: computed, default: 0, description: "Refund posted on settle; reversed to 0 on void-cancellation" }
      - { name: cancellation_status, type: enum, source: system, default: NONE, description: "NONE | FILED | SETTLED | VOIDED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock timestamp of cancellation; null until cancelled" }
      - { name: cancellation_tier, type: enum, source: system, description: "T1_FULL | T2_DEPOSIT_HALF | T3_BALANCE_ONLY | T4_HALF_ALL — refund tier at cancellation time; null until cancelled" }
      - { name: refund_due_cents, type: integer, source: computed, description: "Refund computed at cancellation time by cancellation_refund; frozen thereafter; null until cancelled" }
      - { name: pinned_design_id, type: string, source: system, description: "ShowDesign.id pinned at design lock; null until a design locks" }
      - { name: pinned_safety_config_id, type: string, source: system, description: "SafetyConfiguration.id pinned at approval; null until a config is approved" }
      - { name: pinned_authorization_id, type: string, source: system, description: "AirspaceAuthorization.id pinned at authorize; null until authorized" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "Count of LaunchGridAssignment rows with status ASSIGNED for this show" }
      - { name: readiness_posture, type: enum, source: computed, description: "NOT_READY | CLEARED | GO — derived aggregate per calculation show_readiness_posture; gates authorize/certify-go/execute" }

  - name: AirspaceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show this application serves" }
      - { name: window_start, type: datetime, source: input, description: "Requested authorization window start (UTC, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Requested authorization window end (UTC, exclusive)" }
      - { name: altitude_ceiling_ft, type: number, source: input, description: "Requested altitude ceiling in feet AGL", constraints: "> 0" }
      - { name: waiver_types, type: array, source: input, description: "Array of waiver kind strings, e.g. [NIGHT_OPS, BVLOS, OVER_PEOPLE]; may be empty" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED | WITHDRAWN" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decide call; null until decided" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding AuthorityOfficer; null until decided" }

  - name: ShowDesign
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show this design belongs to" }
      - { name: design_version_no, type: integer, source: computed, description: "Per-show monotone counter starting at 1, assigned in creation order" }
      - { name: drone_count, type: integer, source: input, description: "Drones choreographed in this design", constraints: ">= 1" }
      - { name: max_altitude_ft, type: number, source: input, description: "Highest choreographed altitude in feet AGL", constraints: "> 0" }
      - { name: duration_sec, type: integer, source: input, description: "Choreographed flight duration in seconds", constraints: ">= 60" }
      - { name: min_separation_m, type: number, source: input, description: "Minimum pairwise drone separation the choreography guarantees, in meters", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIMULATED | LOCKED | SUPERSEDED" }

  - name: SimulationRun
    parent: null
    common_fields: false
    fields:
      - { name: show_design_id, type: string, source: input, description: "FK -> ShowDesign.id; design under test" }
      - { name: min_separation_observed_m, type: number, source: input, description: "Tightest pairwise separation observed in simulation, meters", constraints: ">= 0" }
      - { name: battery_draw_pct, type: number, source: input, description: "Worst-drone simulated battery draw, percent", constraints: "0..100 inclusive" }
      - { name: max_speed_mps, type: number, source: input, description: "Fastest simulated groundspeed, m/s", constraints: ">= 0" }
      - { name: verdict, type: enum, source: computed, description: "PASS | FAIL — per calculation simulation_verdict" }

  - name: SafetyConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show this configuration serves" }
      - { name: geofence_radius_m, type: number, source: input, description: "Geofence cylinder radius around launch point, meters", constraints: "> 0" }
      - { name: altitude_hard_ceiling_ft, type: number, source: input, description: "Firmware hard ceiling in feet AGL", constraints: "> 0" }
      - { name: lost_link_action, type: enum, source: input, description: "HOVER_THEN_LAND | RETURN_TO_HOME | IMMEDIATE_LAND" }
      - { name: geofence_breach_action, type: enum, source: input, description: "RETURN_TO_HOME | IMMEDIATE_LAND" }
      - { name: battery_rtl_threshold_pct, type: integer, source: input, description: "Remaining-battery percent at which drones auto return-to-launch", constraints: "10..80 inclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties reference)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving SafetyOfficer; null until approved" }

  - name: Drone
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; globally unique", constraints: "unique across all drones" }
      - { name: model, type: string, source: input, description: "Airframe model code" }
      - { name: charge_pct, type: integer, source: input, default: 100, description: "Current battery charge percent", constraints: "0..100 inclusive" }
      - { name: battery_cycle_count, type: integer, source: input, default: 0, description: "Completed flight cycles; may be seeded at registration for used airframes; incremented by 1 on each FlightLog receipt", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHARGING | RESERVED | IN_MAINTENANCE | GROUNDED | RETIRED" }

  - name: ChargeBay
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site where this charging bay sits" }
      - { name: bay_code, type: string, source: input, description: "Operator bay identifier; unique within the site", constraints: "unique per site_id" }
      - { name: port_count, type: integer, source: input, description: "Number of drones this bay can charge at once (aggregate capacity)", constraints: ">= 1" }

  - name: ChargeSession
    parent: null
    common_fields: true
    fields:
      - { name: drone_id, type: string, source: input, description: "FK -> Drone.id; drone on the charger" }
      - { name: charge_bay_id, type: string, source: input, description: "FK -> ChargeBay.id; bay hosting the session" }
      - { name: charge_from_pct, type: integer, source: system, description: "Drone charge_pct at session start" }
      - { name: charge_to_pct, type: integer, source: input, description: "Charge percent reached at complete/interrupt; must be > charge_from_pct and <= 100" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp at session creation" }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock timestamp at complete/interrupt; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | INTERRUPTED" }

  - name: LaunchGridAssignment
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show this slot belongs to" }
      - { name: drone_id, type: string, source: input, description: "FK -> Drone.id; drone occupying the slot" }
      - { name: grid_row, type: integer, source: input, description: "Launch grid row index, 0-based", constraints: ">= 0; (grid_row + 1) * 2.0 <= site.ground_length_m" }
      - { name: grid_col, type: integer, source: input, description: "Launch grid column index, 0-based", constraints: ">= 0; (grid_col + 1) * 2.0 <= site.ground_width_m" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | VOIDED | FLOWN | RECONCILED" }

  - name: WeatherReading
    parent: null
    common_fields: false
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site where the reading was taken" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp the reading was taken (UTC); must be <= logical clock now" }
      - { name: wind_speed_kt, type: number, source: input, description: "Sustained wind speed, knots", constraints: ">= 0" }
      - { name: gust_kt, type: number, source: input, description: "Peak gust, knots", constraints: ">= 0; >= wind_speed_kt" }
      - { name: precip_mm_hr, type: number, source: input, description: "Precipitation rate, mm/hr", constraints: ">= 0" }
      - { name: temperature_c, type: number, source: input, description: "Ambient temperature, Celsius" }

  - name: GoNoGoEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show being evaluated" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical-clock timestamp at evaluation creation" }
      - { name: verdict, type: enum, source: computed, description: "GO | NO_GO — per calculation go_no_go_verdict" }
      - { name: reason_codes, type: array, source: computed, description: "Ordered list of NO_GO reason strings (NO_WEATHER_DATA, WIND_SUSTAINED_EXCEEDED, GUST_EXCEEDED, PRECIPITATION, TEMPERATURE); empty when GO" }
      - { name: effective_wind_limit_kt, type: number, source: computed, description: "Effective sustained-wind limit used, per calculation effective_wind_limit" }
      - { name: effective_gust_limit_kt, type: number, source: computed, description: "= effective_wind_limit_kt * 1.3 (1 decimal, round_half_up)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | CERTIFIED" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of certification; null until certified" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying SafetyOfficer; null until certified" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show where the incident occurred (must be EXECUTED)" }
      - { name: drone_id, type: string, source: input, description: "FK -> Drone.id; specific drone involved (required for MAJOR, optional for CRITICAL/MINOR)", constraints: "required when severity == MAJOR" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text incident narrative" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | AUTO_DEVIATION (system-filed when a FlightLog exceeds deviation threshold)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_INVESTIGATION | CLOSED_CONFIRMED | CLOSED_REJECTED" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer (or SYSTEM for AUTO_DEVIATION)" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the closer; null until closed" }

  - name: FlightLog
    parent: null
    common_fields: false
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; show flown (must be EXECUTED)" }
      - { name: drone_id, type: string, source: input, description: "FK -> Drone.id; drone this log belongs to (must hold a FLOWN assignment for the show)" }
      - { name: battery_consumed_pct, type: integer, source: input, description: "Battery percent consumed during the flight", constraints: "0..100 inclusive" }
      - { name: max_altitude_reached_ft, type: number, source: input, description: "Highest altitude actually reached, feet AGL", constraints: ">= 0" }
      - { name: max_deviation_m, type: number, source: input, description: "Maximum lateral deviation from planned path, meters", constraints: ">= 0" }
      - { name: flag_status, type: enum, source: system, description: "RECEIVED | FLAGGED — FLAGGED when max_deviation_m > 5.0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ShowEvent
    initial_state: "lifecycle_status=PLANNING, payment_status=DEPOSIT_DUE (parallel dimensions)"
    terminal_states: ["lifecycle EXECUTED", "lifecycle CANCELLED"]
    transitions:
      # --- lifecycle dimension ---
      - from: PLANNING
        to: DESIGN_LOCKED
        trigger: "POST /api/show-designs/{designId}/lock (side effect) OR system recompute after POST /api/show-events/{id}/reschedule or /activate-backup when the pinned design is still LOCKED"
        actor: ProductionPlanner | system
        preconditions:
          - "pinned_design_id references a ShowDesign with status LOCKED"
        side_effects:
          - "lifecycle_status := DESIGN_LOCKED"
          - "readiness_posture recomputed"
          - "ShowEvent.version incremented"
      - from: DESIGN_LOCKED
        to: AUTHORIZED
        trigger: "POST /api/show-events/{showEventId}/authorize"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status == DESIGN_LOCKED (else ERR_INVALID_STATE)"
          - "pinned safety configuration exists with status APPROVED (else ERR_SAFETY_CONFIG_NOT_APPROVED)"
          - "request authorization_id resolves to an AirspaceAuthorization whose show_event_id == this show (else ERR_AUTHORIZATION_NOT_FOUND) and whose status == APPROVED (else ERR_AUTHORIZATION_NOT_APPROVED)"
          - "authorization window covers [window_start, window_end], and also covers the backup window when one is set and not consumed (else ERR_AUTHORIZATION_WINDOW_INSUFFICIENT)"
          - "perimeter containment for the pinned design == VALID (calculation crowd_distance, PLANNED variant) (else ERR_PERIMETER_INSUFFICIENT)"
        side_effects:
          - "lifecycle_status := AUTHORIZED; pinned_authorization_id := authorization_id"
          - "readiness_posture recomputed"
          - "ShowEvent.version incremented"
      - from: AUTHORIZED
        to: READY
        trigger: "system (automatic when assigned_count reaches pinned design drone_count while perimeter containment is VALID)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status := READY"
          - "readiness_posture recomputed"
          - "ShowEvent.version incremented"
      - from: READY
        to: AUTHORIZED
        trigger: "system (automatic when assigned_count drops below pinned design drone_count, or a pinned reference (design/config/authorization) is invalidated)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status := AUTHORIZED"
          - "readiness_posture recomputed"
          - "ShowEvent.version incremented"
      - from: READY
        to: GO_CERTIFIED
        trigger: "POST /api/show-events/{showEventId}/certify-go"
        actor: SafetyOfficer
        preconditions:
          - "lifecycle_status == READY (else ERR_INVALID_STATE)"
          - "request evaluation_id references a GoNoGoEvaluation for this show (else ERR_EVALUATION_NOT_FOUND)"
          - "evaluation.status == CERTIFIED (else ERR_EVALUATION_NOT_CERTIFIED)"
          - "evaluation.verdict == GO (else ERR_NO_GO_IN_EFFECT)"
          - "logical clock now - evaluation.certified_at <= 240 minutes (else ERR_EVALUATION_STALE)"
        side_effects:
          - "lifecycle_status := GO_CERTIFIED"
          - "readiness_posture := GO"
          - "ShowEvent.version incremented"
      - from: GO_CERTIFIED
        to: EXECUTED
        trigger: "POST /api/show-events/{showEventId}/execute"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status == GO_CERTIFIED (else ERR_INVALID_STATE)"
          - "logical clock now within [window_start, window_end) (else ERR_OUTSIDE_SHOW_WINDOW)"
          - "a CERTIFIED GO evaluation exists with now - certified_at <= 240 minutes (else ERR_EVALUATION_STALE)"
          - "payment_status == PAID_IN_FULL (else ERR_SHOW_NOT_PAID_IN_FULL)"
        side_effects:
          - "lifecycle_status := EXECUTED"
          - "all LaunchGridAssignment rows with status ASSIGNED for this show := FLOWN"
          - "readiness_posture recomputed"
          - "ShowEvent.version incremented"
      - from: AUTHORIZED
        to: POSTPONED
        trigger: "POST /api/show-events/{showEventId}/postpone"
        actor: ProductionPlanner
        preconditions: ["lifecycle_status IN {AUTHORIZED, READY, GO_CERTIFIED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "lifecycle_status := POSTPONED"
          - "readiness_posture := NOT_READY"
          - "ShowEvent.version incremented"
      - from: READY
        to: POSTPONED
        trigger: "POST /api/show-events/{showEventId}/postpone"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "lifecycle_status := POSTPONED; readiness_posture := NOT_READY; ShowEvent.version incremented"
      - from: GO_CERTIFIED
        to: POSTPONED
        trigger: "POST /api/show-events/{showEventId}/postpone"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "lifecycle_status := POSTPONED; readiness_posture := NOT_READY; ShowEvent.version incremented"
      - from: POSTPONED
        to: PLANNING
        trigger: "POST /api/show-events/{showEventId}/reschedule"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status == POSTPONED (else ERR_INVALID_STATE)"
          - "new window_start strictly after logical clock now (else ERR_SHOW_WINDOW_IN_PAST)"
          - "site turnaround conflict check passes (calculation show_window_turnaround) (else ERR_SHOW_WINDOW_CONFLICT)"
        side_effects:
          - "window_start/window_end := request values; lifecycle_status := PLANNING"
          - "system recompute: if pinned design still LOCKED -> lifecycle_status := DESIGN_LOCKED"
          - "readiness_posture recomputed"
          - "ShowEvent.version incremented"
      - from: POSTPONED
        to: PLANNING
        trigger: "POST /api/show-events/{showEventId}/activate-backup"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status == POSTPONED (else ERR_INVALID_STATE)"
          - "backup_window_start/backup_window_end are set and backup_consumed == false (else ERR_BACKUP_WINDOW_UNAVAILABLE)"
          - "backup_window_start strictly after logical clock now (else ERR_BACKUP_WINDOW_UNAVAILABLE)"
        side_effects:
          - "window_start/window_end := backup window; backup_consumed := true; backup_window_start/backup_window_end cleared"
          - "lifecycle_status := PLANNING; then system recompute may advance to DESIGN_LOCKED (pinned design still LOCKED)"
          - "ShowEvent.version incremented"
      - from: DESIGN_LOCKED
        to: PLANNING
        trigger: "system (pinned design SUPERSEDED, pinned safety config SUPERSEDED, or pinned authorization REVOKED/EXPIRED while in DESIGN_LOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status := PLANNING; readiness_posture := NOT_READY; ShowEvent.version incremented"
      - from: AUTHORIZED
        to: PLANNING
        trigger: "system (pinned design SUPERSEDED, pinned safety config SUPERSEDED, or pinned authorization REVOKED/EXPIRED while in AUTHORIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status := PLANNING; readiness_posture := NOT_READY; ShowEvent.version incremented"
      - from: GO_CERTIFIED
        to: PLANNING
        trigger: "system (pinned reference invalidated while GO_CERTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status := PLANNING; readiness_posture := NOT_READY; ShowEvent.version incremented"
      - from: "PLANNING|DESIGN_LOCKED|AUTHORIZED|READY|GO_CERTIFIED|POSTPONED"
        to: CANCELLED
        trigger: "POST /api/show-events/{showEventId}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status NOT IN {EXECUTED, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status := CANCELLED; cancellation_status NONE -> FILED; cancelled_at := logical clock now"
          - "cancellation_tier and refund_due_cents computed (calculation cancellation_refund)"
          - "cascade: every LaunchGridAssignment with status ASSIGNED for this show -> VOIDED; each such mutation sets its Drone.status RESERVED -> AVAILABLE"
          - "readiness_posture := NOT_READY; ShowEvent.version incremented"
      # --- payment dimension (parallel; independent of lifecycle) ---
      - from: DEPOSIT_DUE
        to: DEPOSIT_PAID
        trigger: "POST /api/show-events/{showEventId}/record-payment with kind=DEPOSIT"
        actor: ProductionPlanner
        preconditions:
          - "payment_status == DEPOSIT_DUE (else ERR_INVALID_STATE)"
          - "amount_cents == deposit_cents exactly (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_total_cents += amount_cents; payment_status := DEPOSIT_PAID; ShowEvent.version incremented"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /api/show-events/{showEventId}/record-payment with kind=BALANCE"
        actor: ProductionPlanner
        preconditions:
          - "payment_status == DEPOSIT_PAID (else ERR_INVALID_STATE)"
          - "amount_cents == balance_cents exactly (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_total_cents += amount_cents; payment_status := PAID_IN_FULL; ShowEvent.version incremented"
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "POST /api/show-events/{showEventId}/settle-cancellation"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status == CANCELLED and cancellation_status == FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "refunded_total_cents := refund_due_cents; cancellation_status := SETTLED"
          - "payment_status := REFUNDED (from DEPOSIT_DUE | DEPOSIT_PAID | PAID_IN_FULL)"
          - "ShowEvent.version incremented"
      - from: REFUNDED
        to: "DEPOSIT_DUE|DEPOSIT_PAID|PAID_IN_FULL"
        trigger: "POST /api/show-events/{showEventId}/void-cancellation"
        actor: ProductionPlanner
        preconditions:
          - "lifecycle_status == CANCELLED and cancellation_status == SETTLED (else ERR_INVALID_STATE)"
        side_effects:
          - "refunded_total_cents := 0; cancellation_status := VOIDED"
          - "payment_status recomputed from paid_total_cents: 0 -> DEPOSIT_DUE; == deposit_cents -> DEPOSIT_PAID; == contract_value_cents -> PAID_IN_FULL"
          - "ShowEvent.version incremented"

  - entity: AirspaceAuthorization
    initial_state: DRAFT
    terminal_states: [DENIED, REVOKED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /api/airspace-authorizations/{authorizationId}/submit"
        actor: ProductionPlanner
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "altitude_ceiling_ft <= site.site_max_altitude_ft for the parent show's site (else ERR_ALTITUDE_CEILING_EXCEEDS_SITE)"
          - "window covers the parent show's window, and the backup window when set and not consumed (else ERR_AUTHORIZATION_WINDOW_INSUFFICIENT)"
          - "no temporal overlap with any other UNDER_REVIEW or APPROVED authorization serving a show at the same site (calculation authorization_window_overlap) (else ERR_AUTHORIZATION_WINDOW_OVERLAP)"
        side_effects: ["status := UNDER_REVIEW; version incremented"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /api/airspace-authorizations/{authorizationId}/request-info"
        actor: AuthorityOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["status := INFO_REQUESTED; version incremented"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /api/airspace-authorizations/{authorizationId}/resubmit"
        actor: ProductionPlanner
        preconditions: ["status == INFO_REQUESTED (else ERR_INVALID_STATE)"]
        side_effects: ["status := UNDER_REVIEW; version incremented"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/airspace-authorizations/{authorizationId}/decide with decision=APPROVED"
        actor: AuthorityOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "re-validation at decision time: altitude_ceiling_ft <= site.site_max_altitude_ft (else ERR_ALTITUDE_CEILING_EXCEEDS_SITE)"
          - "re-validation at decision time: window still covers show window (+ backup window when set and not consumed) (else ERR_AUTHORIZATION_WINDOW_INSUFFICIENT)"
          - "re-validation at decision time: no overlap with any OTHER APPROVED authorization serving a show at the same site (else ERR_AUTHORIZATION_WINDOW_OVERLAP)"
        side_effects:
          - "status := APPROVED; decided_at/decided_by := clock/caller; version incremented"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/airspace-authorizations/{authorizationId}/decide with decision=DENIED"
        actor: AuthorityOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["status := DENIED; decided_at/decided_by := clock/caller; version incremented"]
      - from: DENIED
        to: DRAFT
        trigger: "POST /api/airspace-authorizations/{authorizationId}/revise"
        actor: ProductionPlanner
        preconditions: ["status == DENIED (else ERR_INVALID_STATE)"]
        side_effects: ["status := DRAFT; optional new window/ceiling applied; decided_at/decided_by cleared; version incremented"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/airspace-authorizations/{authorizationId}/withdraw"
        actor: ProductionPlanner
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["status := WITHDRAWN; version incremented"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /api/airspace-authorizations/{authorizationId}/revoke, OR system cascade when a CRITICAL IncidentReport on the pinned show is CLOSED_CONFIRMED"
        actor: AuthorityOfficer | system
        preconditions: ["status == APPROVED (else ERR_INVALID_STATE)"]
        side_effects:
          - "status := REVOKED; version incremented"
          - "cascade: any ShowEvent with pinned_authorization_id == this id and lifecycle_status IN {DESIGN_LOCKED, AUTHORIZED, READY, GO_CERTIFIED} -> PLANNING, readiness_posture := NOT_READY"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (POST /api/_ops/run_sweep when logical clock now > window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "status := EXPIRED; version incremented"
          - "cascade: any ShowEvent with pinned_authorization_id == this id and lifecycle_status IN {DESIGN_LOCKED, AUTHORIZED, READY, GO_CERTIFIED} -> PLANNING, readiness_posture := NOT_READY"

  - entity: ShowDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SIMULATED
        trigger: "POST /api/simulation-runs (first SimulationRun recorded against this design)"
        actor: ProductionPlanner
        preconditions: ["design status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["status := SIMULATED; version incremented"]
      - from: SIMULATED
        to: DRAFT
        trigger: "POST /api/show-designs/{designId}/revise"
        actor: ProductionPlanner
        preconditions: ["status == SIMULATED (else ERR_INVALID_STATE)"]
        side_effects: ["status := DRAFT; version incremented"]
      - from: SIMULATED
        to: LOCKED
        trigger: "POST /api/show-designs/{designId}/lock"
        actor: ProductionPlanner
        preconditions:
          - "status == SIMULATED (else ERR_INVALID_STATE)"
          - "the most recent SimulationRun for this design (by created_at) has verdict == PASS (else ERR_SIMULATION_NOT_PASSING)"
          - "parent show lifecycle_status IN {PLANNING, DESIGN_LOCKED, AUTHORIZED, READY} (else ERR_INVALID_STATE)"
        side_effects:
          - "status := LOCKED; version incremented"
          - "any OTHER ShowDesign for the same show with status LOCKED -> SUPERSEDED (its version incremented)"
          - "parent ShowEvent: pinned_design_id := this design; lifecycle_status -> DESIGN_LOCKED from {PLANNING, AUTHORIZED, READY} (re-pin invalidates authorization readiness); readiness_posture recomputed; ShowEvent.version incremented"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (automatic when another ShowDesign for the same show transitions to LOCKED)"
        actor: system
        preconditions: []
        side_effects: ["status := SUPERSEDED; version incremented"]

  - entity: SafetyConfiguration
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/safety-configurations/{configId}/approve"
        actor: SafetyOfficer
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "parent show has a pinned design with status LOCKED (state-category gate, else ERR_DESIGN_NOT_LOCKED)"
          - "segregation of duties: caller X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "geofence_radius_m >= required_radius_m for the pinned design (calculation crowd_distance, PLANNED variant) (else ERR_GEOFENCE_BELOW_REQUIRED)"
          - "altitude_hard_ceiling_ft >= pinned design max_altitude_ft (else ERR_CEILING_BELOW_DESIGN)"
          - "altitude_hard_ceiling_ft <= site.site_max_altitude_ft (else ERR_ALTITUDE_CEILING_EXCEEDS_SITE)"
        side_effects:
          - "status := APPROVED; approved_by_user_id := caller; version incremented"
          - "any OTHER SafetyConfiguration for the same show with status APPROVED -> SUPERSEDED (its version incremented)"
          - "parent ShowEvent: pinned_safety_config_id := this config; readiness_posture recomputed; ShowEvent.version incremented"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new SafetyConfiguration is created for the same show)"
        actor: system
        preconditions: []
        side_effects: ["status := SUPERSEDED; version incremented"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a new SafetyConfiguration is created for the same show, or another config is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "status := SUPERSEDED; version incremented"
          - "if parent show pinned_safety_config_id == this config: ShowEvent lifecycle_status IN {DESIGN_LOCKED, AUTHORIZED, READY, GO_CERTIFIED} -> PLANNING; readiness_posture := NOT_READY; ShowEvent.version incremented"

  - entity: Drone
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: CHARGING
        trigger: "POST /api/charge-sessions"
        actor: FleetManager
        preconditions: []
        side_effects: ["status := CHARGING; version incremented"]
      - from: CHARGING
        to: AVAILABLE
        trigger: "POST /api/charge-sessions/{sessionId}/complete or /interrupt"
        actor: FleetManager
        preconditions: []
        side_effects: ["charge_pct := session charge_to_pct; status := AVAILABLE; version incremented"]
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /api/launch-grid-assignments"
        actor: FleetManager
        preconditions: []
        side_effects: ["status := RESERVED; version incremented"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /api/launch-grid-assignments/{assignmentId}/void, OR system cascade (show cancelled, drone grounded)"
        actor: FleetManager | system
        preconditions: []
        side_effects: ["status := AVAILABLE; version incremented"]
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /api/drones/{droneId}/maintain, OR system (battery_cycle_count >= 200 on FlightLog receipt)"
        actor: FleetManager | system
        preconditions: ["status == AVAILABLE for the manual endpoint (else ERR_INVALID_STATE)"]
        side_effects: ["status := IN_MAINTENANCE; version incremented"]
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /api/drones/{droneId}/release"
        actor: SafetyOfficer
        preconditions: ["status IN {IN_MAINTENANCE, GROUNDED} (else ERR_INVALID_STATE)"]
        side_effects: ["status := AVAILABLE; version incremented"]
      - from: GROUNDED
        to: AVAILABLE
        trigger: "POST /api/drones/{droneId}/release"
        actor: SafetyOfficer
        preconditions: ["status IN {IN_MAINTENANCE, GROUNDED} (else ERR_INVALID_STATE)"]
        side_effects: ["status := AVAILABLE; version incremented"]
      - from: AVAILABLE
        to: GROUNDED
        trigger: "POST /api/drones/{droneId}/ground, OR system cascade (CRITICAL/MAJOR incident CLOSED_CONFIRMED)"
        actor: SafetyOfficer | system
        preconditions: ["manual endpoint: status IN {AVAILABLE, RESERVED, IN_MAINTENANCE} (else ERR_INVALID_STATE)"]
        side_effects: ["status := GROUNDED; version incremented"]
      - from: RESERVED
        to: GROUNDED
        trigger: "POST /api/drones/{droneId}/ground, OR system cascade (CRITICAL/MAJOR incident CLOSED_CONFIRMED)"
        actor: SafetyOfficer | system
        preconditions: []
        side_effects:
          - "status := GROUNDED; version incremented"
          - "cascade: every LaunchGridAssignment with this drone and status ASSIGNED -> VOIDED; each such mutation decrements its ShowEvent.assigned_count; a show whose assigned_count drops below pinned design drone_count while lifecycle_status == READY -> AUTHORIZED (readiness_posture recomputed)"
      - from: IN_MAINTENANCE
        to: GROUNDED
        trigger: "POST /api/drones/{droneId}/ground"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["status := GROUNDED; version incremented"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/drones/{droneId}/retire"
        actor: FleetManager
        preconditions: ["status IN {AVAILABLE, IN_MAINTENANCE, GROUNDED} (else ERR_INVALID_STATE)"]
        side_effects: ["status := RETIRED; version incremented"]
      - from: IN_MAINTENANCE
        to: RETIRED
        trigger: "POST /api/drones/{droneId}/retire"
        actor: FleetManager
        preconditions: []
        side_effects: ["status := RETIRED; version incremented"]
      - from: GROUNDED
        to: RETIRED
        trigger: "POST /api/drones/{droneId}/retire"
        actor: FleetManager
        preconditions: []
        side_effects: ["status := RETIRED; version incremented"]

  - entity: ChargeSession
    initial_state: ACTIVE
    terminal_states: [COMPLETED, INTERRUPTED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/charge-sessions/{sessionId}/complete"
        actor: FleetManager
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
          - "charge_to_pct > charge_from_pct and <= 100 (else ERR_INVALID_CHARGE_TARGET)"
        side_effects: ["status := COMPLETED; ended_at := now; drone charge_pct := charge_to_pct; drone CHARGING -> AVAILABLE; version incremented"]
      - from: ACTIVE
        to: INTERRUPTED
        trigger: "POST /api/charge-sessions/{sessionId}/interrupt"
        actor: FleetManager
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
          - "charge_to_pct >= charge_from_pct and <= 100 (else ERR_INVALID_CHARGE_TARGET)"
        side_effects: ["status := INTERRUPTED; ended_at := now; drone charge_pct := charge_to_pct; drone CHARGING -> AVAILABLE; version incremented"]

  - entity: LaunchGridAssignment
    initial_state: ASSIGNED
    terminal_states: [VOIDED, RECONCILED]
    transitions:
      - from: ASSIGNED
        to: VOIDED
        trigger: "POST /api/launch-grid-assignments/{assignmentId}/void, OR system cascade (show cancelled; drone grounded)"
        actor: FleetManager | system
        preconditions: ["manual endpoint: status == ASSIGNED (else ERR_INVALID_STATE)"]
        side_effects:
          - "status := VOIDED; version incremented"
          - "if drone.status == RESERVED: drone -> AVAILABLE (its version incremented)"
          - "ShowEvent.assigned_count -= 1; if show lifecycle_status == READY: -> AUTHORIZED; readiness_posture recomputed; ShowEvent.version incremented"
      - from: ASSIGNED
        to: FLOWN
        trigger: "system (POST /api/show-events/{showEventId}/execute)"
        actor: system
        preconditions: []
        side_effects: ["status := FLOWN; version incremented"]
      - from: FLOWN
        to: RECONCILED
        trigger: "system (POST /api/flight-logs matching this show+drone)"
        actor: system
        preconditions: []
        side_effects: ["status := RECONCILED; version incremented"]

  - entity: GoNoGoEvaluation
    initial_state: PROVISIONAL
    terminal_states: [CERTIFIED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /api/go-no-go-evaluations/{evaluationId}/certify"
        actor: SafetyOfficer
        preconditions:
          - "status == PROVISIONAL (else ERR_INVALID_STATE)"
          - "segregation of duties: caller X-User-ID != approved_by_user_id of the show's pinned SafetyConfiguration (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status := CERTIFIED; certified_at := now; certified_by_user_id := caller; version incremented"]

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [CLOSED_CONFIRMED, CLOSED_REJECTED]
    transitions:
      - from: FILED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/incident-reports/{incidentId}/investigate"
        actor: SafetyOfficer
        preconditions: ["status == FILED (else ERR_INVALID_STATE)"]
        side_effects: ["status := UNDER_INVESTIGATION; version incremented"]
      - from: UNDER_INVESTIGATION
        to: CLOSED_CONFIRMED
        trigger: "POST /api/incident-reports/{incidentId}/close with outcome=CONFIRMED"
        actor: SafetyOfficer
        preconditions:
          - "status == UNDER_INVESTIGATION (else ERR_INVALID_STATE)"
          - "segregation of duties: caller X-User-ID != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status := CLOSED_CONFIRMED; closed_by_user_id := caller; version incremented"
          - "severity == CRITICAL: every Drone with a FlightLog for this show -> GROUNDED (each grounded drone then voids its ASSIGNED LaunchGridAssignments on other shows, decrementing those shows' assigned_count and downgrading READY shows to AUTHORIZED); the AirspaceAuthorization APPROVED for this show -> REVOKED (which itself downgrades any show pinning it)"
          - "severity == MAJOR: the report's drone_id -> GROUNDED (with the same assignment-void cascade)"
      - from: UNDER_INVESTIGATION
        to: CLOSED_REJECTED
        trigger: "POST /api/incident-reports/{incidentId}/close with outcome=REJECTED"
        actor: SafetyOfficer
        preconditions:
          - "status == UNDER_INVESTIGATION (else ERR_INVALID_STATE)"
          - "segregation of duties: caller X-User-ID != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status := CLOSED_REJECTED; closed_by_user_id := caller; version incremented; no fleet effects"]

  - entity: FlightLog
    initial_state: RECEIVED
    terminal_states: [RECEIVED, FLAGGED]
    transitions:
      - from: "(creation)"
        to: FLAGGED
        trigger: "system (on POST /api/flight-logs when max_deviation_m > 5.0)"
        actor: system
        preconditions: []
        side_effects:
          - "flag_status := FLAGGED"
          - "cascade: an IncidentReport is auto-created with source=AUTO_DEVIATION, severity=MINOR, drone_id=this drone, show_event_id=this show, status=FILED, filed_by_user_id=SYSTEM"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: safety-config-create-stale-show
    parent_entity: ShowEvent
    write_endpoint: "POST /api/safety-configurations"
    occ_field: "expected_show_event_version"
    description: |
      Creating a SafetyConfiguration supersedes the show's current
      non-SUPERSEDED configuration, so the create is rejected when the
      ShowEvent's version has advanced beyond the version the caller last
      observed. This captures the case where another writer has just created
      a configuration (legitimately superseding the prior one) and the
      current writer's view of the show is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: design-lock-stale-show
    parent_entity: ShowEvent
    write_endpoint: "POST /api/show-designs/{designId}/lock"
    occ_field: "expected_show_event_version"
    description: |
      Locking a ShowDesign re-pins the parent show and supersedes the
      previously LOCKED design, so the lock is rejected when the ShowEvent's
      version has advanced beyond the version the caller last observed.
      This captures the case where another writer has just locked a different
      design (legitimately superseding the prior lock) and the current
      writer's view of the show is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: show_contract_pricing
    trigger: "POST /api/show-events (at creation; result frozen on the ShowEvent)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED to break the circular-looking dependency
      # (surcharge tier is keyed on the pre-surcharge subtotal, NOT on the
      # final total that itself contains the surcharge):
      drone_fee_cents = 2500 * min(drone_count_planned, 100)
                      + 2200 * min(max(drone_count_planned - 100, 0), 200)
                      + 2000 * max(drone_count_planned - 300, 0)
      subtotal_pre_cents = BASE_FEE_CENTS + drone_fee_cents
      surcharge_rate = 0.08 if subtotal_pre_cents >= SURCHARGE_TIER_CENTS else 0.05
      surcharge_cents = round_half_up(subtotal_pre_cents * surcharge_rate)
      contract_value_cents = subtotal_pre_cents + surcharge_cents
      deposit_cents = round_half_up(0.30 * contract_value_cents)
      balance_cents = contract_value_cents - deposit_cents
    input_set: "drone_count_planned from the create request"
    constants:
      BASE_FEE_CENTS: 500000
      SURCHARGE_TIER_CENTS: 1000000
    precision: "integer cents; round_half_up wherever a division produces a fraction"

  - name: cancellation_refund
    trigger: "POST /api/show-events/{showEventId}/cancel (computed once at cancellation; frozen as refund_due_cents)"
    algorithm: threshold
    formula: |
      # Nested rounding order is PINNED: round each PAID component to integer
      # cents FIRST (round_half_up), THEN sum, THEN (T1 only) subtract the fee,
      # THEN floor at 0. "Sum then round" is a different, forbidden order.
      lead_hours = (window_start - cancelled_at) in hours
      deposit_paid = min(paid_total_cents, deposit_cents)
      balance_paid = paid_total_cents - deposit_paid
      if lead_hours >= 336:        tier = T1_FULL;          d_pct = 1.00; b_pct = 1.00
      else if lead_hours >= 168:   tier = T2_DEPOSIT_HALF;  d_pct = 0.50; b_pct = 1.00
      else if lead_hours >= 72:    tier = T3_BALANCE_ONLY;  d_pct = 0.00; b_pct = 1.00
      else:                        tier = T4_HALF_ALL;      d_pct = 0.50; b_pct = 0.50
      refund_due_cents = round_half_up(deposit_paid * d_pct) + round_half_up(balance_paid * b_pct)
      if tier == T1_FULL: refund_due_cents = refund_due_cents - ADMIN_FEE_CENTS
      refund_due_cents = max(0, refund_due_cents)
      cancellation_tier := tier
    input_set: "ShowEvent window_start, deposit_cents, balance_cents, paid_total_cents at cancellation time; cancelled_at from the logical clock"
    constants:
      ADMIN_FEE_CENTS: 25000
    precision: "integer cents, round_half_up per component before summing"

  - name: crowd_distance
    trigger: "GET /api/show-events/{showEventId}/perimeter-assessment; also evaluated inline by authorize (gate g4), SafetyConfiguration approve, and show_readiness_posture"
    algorithm: aggregation
    formula: |
      required_radius_m = round_half_up_1dp(CROWD_BASE_M + ALT_COEFF * altitude_ft + DRONE_COEFF * drone_count)
      containment = VALID iff required_radius_m + CROWD_BUFFER_M <= min(site.ground_length_m, site.ground_width_m) / 2
                    else INSUFFICIENT
    input_set: "variant PLANNED: altitude_ft = pinned design.max_altitude_ft, drone_count = pinned design.drone_count. variant AS_FLOWN: altitude_ft = max(FlightLog.max_altitude_reached_ft) over the show's FlightLogs, drone_count = count of the show's FlightLogs; AS_FLOWN with zero FlightLogs -> ERR_NO_FLIGHT_DATA"
    constants:
      CROWD_BASE_M: 40
      ALT_COEFF: 0.4
      DRONE_COEFF: 1.2
      CROWD_BUFFER_M: 15
    precision: "1 decimal place, round_half_up"
    variants:
      - name: PLANNED
        when: "default; any time a pinned design exists"
        difference: "uses the pinned ShowDesign's choreography parameters (max_altitude_ft, drone_count)"
      - name: AS_FLOWN
        when: "post-flight audit (show EXECUTED, >= 1 FlightLog)"
        difference: "uses actual telemetry (max altitude reached; count of flight logs), producing a different radius whenever reality deviated from the plan"

  - name: effective_wind_limit
    trigger: "POST /api/go-no-go-evaluations (verdict computation); also surfaced on the evaluation record"
    algorithm: threshold
    formula: |
      # Combinatorial: 3 inputs with nested min() and two independent tier lookups.
      alt_derate   = 1.0 if design.max_altitude_ft <= 200 else (0.9 if <= 400 else 0.8)
      fleet_derate = 1.0 if design.drone_count <= 100 else (0.9 if <= 300 else 0.8)
      effective_wind_limit_kt = round_half_up_1dp(min(site.site_max_wind_kt,
                                                      BASE_WIND_KT * alt_derate * fleet_derate))
      effective_gust_limit_kt = round_half_up_1dp(effective_wind_limit_kt * GUST_FACTOR)
    input_set: "the show's pinned ShowDesign (must be LOCKED), the show's Site"
    constants:
      BASE_WIND_KT: 18
      GUST_FACTOR: 1.3
    precision: "1 decimal place, round_half_up"

  - name: go_no_go_verdict
    trigger: "POST /api/go-no-go-evaluations"
    algorithm: threshold
    formula: |
      input_set = WeatherReading rows with site_id == show.site_id
                  and recorded_at within [evaluated_at - 60 minutes, evaluated_at] (both ends inclusive)
      reading = input_set ordered by recorded_at DESC, created_at DESC; first element
      if input_set is empty: verdict = NO_GO, reason_codes = [NO_WEATHER_DATA]
      else evaluate in pinned order, collecting all failed reasons:
        WIND_SUSTAINED_EXCEEDED  if reading.wind_speed_kt > effective_wind_limit_kt
        GUST_EXCEEDED            if reading.gust_kt > effective_gust_limit_kt
        PRECIPITATION            if reading.precip_mm_hr != 0
        TEMPERATURE              if reading.temperature_c < -10 or reading.temperature_c > 40
      verdict = GO iff reason_codes empty else NO_GO
      # Boundary: a reading exactly AT the limit passes ('>' not '>=').
      # Boundary: a reading exactly 60 minutes old is included (inclusive).
    input_set: "WeatherReadings at the show's site in the 60-minute lookback window"
    constants:
      LOOKBACK_MINUTES: 60
      TEMP_MIN_C: -10
      TEMP_MAX_C: 40
    precision: "comparisons on stored 1-decimal values"

  - name: battery_derated_charge
    trigger: "POST /api/launch-grid-assignments (eligibility gate)"
    algorithm: threshold
    formula: |
      latest = WeatherReading at show.site_id with recorded_at within [now - 120 minutes, now]
               (both ends inclusive), ordered by recorded_at DESC, created_at DESC; first element
      if latest is null: derate = 1.0        # NOMINAL variant
      else if latest.temperature_c >= 5:  derate = 1.0
      else if latest.temperature_c >= -5: derate = 0.85
      else:                                derate = 0.70
      effective_charge_pct = drone.charge_pct * derate
      eligible iff effective_charge_pct >= LAUNCH_MIN_CHARGE_PCT
    input_set: "Drone.charge_pct; latest WeatherReading at the show's site within the 120-minute recency window"
    constants:
      LAUNCH_MIN_CHARGE_PCT: 85
      RECENCY_MINUTES: 120
    precision: "2 decimal places for effective_charge_pct, round_half_up"
    variants:
      - name: NOMINAL
        when: "no recent reading, or latest temperature >= 5 C"
        difference: "eligibility decided on raw charge_pct (derate 1.0)"
      - name: COLD_DERATED
        when: "latest reading within 120 minutes reports temperature < 5 C"
        difference: "eligibility decided on derated charge; identical charge_pct can flip eligibility (e.g. 100% at 0.85 derate passes at exactly 85.00, 99% fails at 84.15)"

  - name: simulation_verdict
    trigger: "POST /api/simulation-runs"
    algorithm: threshold
    formula: |
      verdict = PASS iff min_separation_observed_m >= design.min_separation_m
                     and battery_draw_pct <= MAX_SIM_DRAW_PCT
                     and max_speed_mps <= DRONE_MAX_SPEED_MPS
                else FAIL
    input_set: "request metrics + parent ShowDesign.min_separation_m"
    constants:
      MAX_SIM_DRAW_PCT: 80
      DRONE_MAX_SPEED_MPS: 12.0
    precision: "comparisons on stored values; separation boundary is inclusive (>=)"

  - name: flight_battery_reconciliation
    trigger: "POST /api/flight-logs"
    algorithm: chronological
    formula: |
      # Order of operations is PINNED:
      # 1. assignment FLOWN -> RECONCILED
      # 2. drone RESERVED -> AVAILABLE
      # 3. drone.charge_pct = max(0, charge_pct - battery_consumed_pct)
      # 4. drone.battery_cycle_count += 1
      # 5. if battery_cycle_count >= CYCLE_LIMIT: drone -> IN_MAINTENANCE
      # 6. if max_deviation_m > DEVIATION_FLAG_M: log FLAGGED + auto MINOR incident
    input_set: "the FlightLog request; the drone's current charge_pct and battery_cycle_count"
    constants:
      CYCLE_LIMIT: 200
      DEVIATION_FLAG_M: 5.0
    precision: "integer percents"

  - name: show_readiness_posture
    trigger: "any mutation to the show, its designs, safety configs, authorizations, assignments, or evaluations"
    algorithm: aggregation
    formula: |
      g1 = pinned design exists AND status == LOCKED AND latest SimulationRun verdict == PASS
      g2 = pinned safety configuration exists AND status == APPROVED
      g3 = pinned authorization exists AND status == APPROVED AND its window covers [window_start, window_end]
           AND (backup_consumed OR no backup window set OR its window also covers the backup window)
      g4 = crowd_distance (PLANNED) containment == VALID
      g5 = assigned_count == pinned design.drone_count
      g6 = exists GoNoGoEvaluation for this show with status CERTIFIED, verdict GO,
           and now - certified_at <= GO_VALIDITY_MINUTES
      posture = GO      iff g1 AND g2 AND g3 AND g4 AND g5 AND g6
              = CLEARED iff g1 AND g2 AND g3 AND g4 AND g5
              = NOT_READY otherwise
      gates are reported in the fixed order g1..g6 by GET .../readiness
    input_set: "ShowEvent pins and counts; referenced ShowDesign/SafetyConfiguration/AirspaceAuthorization/GoNoGoEvaluation states"
    constants:
      GO_VALIDITY_MINUTES: 240
    precision: "boolean gates; no rounding"

  - name: show_window_turnaround
    trigger: "POST /api/show-events; POST /api/show-events/{showEventId}/reschedule; POST /api/show-events/{showEventId}/activate-backup (post-move check)"
    algorithm: interval_merge
    formula: |
      # Buffer semantics (NOT pure overlap): two shows at one site must keep
      # TURNAROUND_MINUTES between one show's window_end and the next start.
      conflict iff exists OTHER ShowEvent at same site_id
        with lifecycle_status NOT IN {CANCELLED, POSTPONED}
        and NOT (new_window_start >= other.window_end + TURNAROUND_MINUTES
                 OR new_window_end <= other.window_start - TURNAROUND_MINUTES)
    input_set: "all ShowEvents at the same site in a non-terminal, non-postponed lifecycle"
    constants:
      TURNAROUND_MINUTES: 120
    precision: "minute-exact comparisons on ISO timestamps"

  - name: authorization_window_overlap
    trigger: "AirspaceAuthorization submit; re-run at decide(APPROVED)"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics on a single resource (site airspace):
      # adjacency is allowed — a.window_end == b.window_start does NOT conflict.
      conflict iff exists OTHER AirspaceAuthorization with status IN {UNDER_REVIEW, APPROVED}
        serving a show at the same site
        and other.window_start < candidate.window_end
        and candidate.window_start < other.window_end
    input_set: "authorizations in UNDER_REVIEW or APPROVED status whose shows share the site"
    precision: "second-exact comparisons; strict inequalities implement half-open [start, end)"

  - name: design_version_assignment
    trigger: "POST /api/show-designs"
    algorithm: aggregation
    formula: |
      design_version_no = count(existing ShowDesign rows with show_event_id == request.show_event_id) + 1
    input_set: "all ShowDesign rows for the show, any status"
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: business_constraint
    check: "request body schema: required fields present, types valid, enum values in range, numeric constraints honored (gust_kt >= wind_speed_kt, coordinates in range, window_end > window_start, backup gap >= 24h, pagination limit within [1,100] and offset >= 0); no computed or system-managed fields accepted"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.5 roles (endpoint-level check, no entity state needed)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every id in the path and every *_id in the body resolves to an existing entity (validated left-to-right: path first, then body); body references that must belong to the path's scope resolve within that scope (e.g. authorization_id must belong to the show)"
    error_id: "ERR_SITE_NOT_FOUND | ERR_SHOW_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_DESIGN_NOT_FOUND | ERR_SIMULATION_RUN_NOT_FOUND | ERR_SAFETY_CONFIG_NOT_FOUND | ERR_DRONE_NOT_FOUND | ERR_CHARGE_BAY_NOT_FOUND | ERR_CHARGE_SESSION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_WEATHER_READING_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_FLIGHT_LOG_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 4
    category: existence
    check: "OCC: expected_show_event_version (when required by §1.2.1) equals the ShowEvent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/safety-configurations; POST /api/show-designs/{designId}/lock"
  - priority: 5
    category: state
    check: "target entity is in a from-state that permits the requested transition (incl. show not CANCELLED/EXECUTED for planning actions; payment ordering DEPOSIT before BALANCE; drone must be AVAILABLE to start a charge session — a drone already CHARGING fails here; flight log requires show EXECUTED and a FLOWN assignment for (show, drone); safety approve requires the parent show to hold a pinned design with status LOCKED)"
    error_id: "ERR_INVALID_STATE | ERR_DESIGN_NOT_LOCKED"
    http_status: 409
    applies_to: "all state-transition endpoints; POST /api/charge-sessions; POST /api/flight-logs; POST /api/safety-configurations/{configId}/approve"
  - priority: 6
    category: auth
    check: "segregation of duties (entity-bound, evaluated after existence and state): SafetyConfiguration.approve caller != created_by_user_id; GoNoGoEvaluation.certify caller != pinned config approved_by_user_id; IncidentReport.close caller != filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/safety-configurations/{configId}/approve; POST /api/go-no-go-evaluations/{evaluationId}/certify; POST /api/incident-reports/{incidentId}/close"
  - priority: 7
    category: business_safety
    check: "safety/regulatory limits: drone flyable (not GROUNDED/IN_MAINTENANCE/RETIRED/CHARGING) on assignment; derated charge >= 85; altitude ceilings vs site max; geofence radius >= required crowd distance; config ceiling >= design max altitude"
    error_id: "ERR_DRONE_NOT_FLYABLE | ERR_CHARGE_BELOW_MINIMUM | ERR_ALTITUDE_CEILING_EXCEEDS_SITE | ERR_GEOFENCE_BELOW_REQUIRED | ERR_CEILING_BELOW_DESIGN | ERR_PERIMETER_INSUFFICIENT"
    http_status: 409
    applies_to: "assignments, safety config approve, authorization submit/decide, show authorize"
  - priority: 8
    category: business_temporal
    check: "time-window rules: authorization window overlap (half-open); show window turnaround buffer; drone double-booking across overlapping show windows; weather reading not in the future; evaluation freshness at certify-go/execute; backup window availability; show window not in the past"
    error_id: "ERR_AUTHORIZATION_WINDOW_OVERLAP | ERR_SHOW_WINDOW_CONFLICT | ERR_DRONE_DOUBLE_BOOKED | ERR_READING_IN_FUTURE | ERR_EVALUATION_STALE | ERR_BACKUP_WINDOW_UNAVAILABLE | ERR_SHOW_WINDOW_IN_PAST | ERR_OUTSIDE_SHOW_WINDOW"
    http_status: 409
    applies_to: "windowed endpoints (authorizations, show create/reschedule/activate-backup, assignments, weather, certify-go, execute)"
  - priority: 9
    category: business_constraint
    check: "uniqueness/capacity: grid slot unique per show; drone assigned at most once per show; grid coordinates inside site ground; bay port capacity; charge not already full; assigned_count < pinned design drone_count; serial_number unique"
    error_id: "ERR_GRID_SLOT_OCCUPIED | ERR_DRONE_ALREADY_ASSIGNED | ERR_GRID_OUT_OF_BOUNDS | ERR_BAY_CAPACITY_EXCEEDED | ERR_CHARGE_NOT_NEEDED | ERR_ASSIGNMENT_EXCEEDS_DESIGN | ERR_DUPLICATE_SERIAL"
    http_status: 409
    applies_to: "assignments, charge sessions, drone create"
  - priority: 10
    category: business_referential
    check: "referenced-object content/state rules: authorization window covers show window (+backup); authorization APPROVED at authorize; design's latest sim PASS at lock; evaluation belongs to show, CERTIFIED, verdict GO; safety config APPROVED at authorize; MAJOR incident carries drone_id; charge_to_pct ordering vs charge_from_pct; flight telemetry exists for AS_FLOWN"
    error_id: "ERR_AUTHORIZATION_WINDOW_INSUFFICIENT | ERR_AUTHORIZATION_NOT_APPROVED | ERR_SIMULATION_NOT_PASSING | ERR_EVALUATION_NOT_CERTIFIED | ERR_NO_GO_IN_EFFECT | ERR_SAFETY_CONFIG_NOT_APPROVED | ERR_DRONE_REQUIRED | ERR_INVALID_CHARGE_TARGET | ERR_NO_FLIGHT_DATA"
    http_status: 409
    applies_to: "authorize, lock, certify-go, incident create, charge complete/interrupt, perimeter AS_FLOWN"
  - priority: 11
    category: business_fiscal
    check: "money rules: payment amount exactly equals the component due; show PAID_IN_FULL before execute"
    error_id: "ERR_PAYMENT_AMOUNT_MISMATCH | ERR_SHOW_NOT_PAID_IN_FULL"
    http_status: 409
    applies_to: "record-payment, execute"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Site ---
  - method: POST
    path: "/api/sites"
    description: "Create a venue site"
    roles: [ProductionPlanner]
    code: 201
    input: [name, latitude, longitude, ground_length_m, ground_width_m, site_max_wind_kt, site_max_gust_kt, site_max_altitude_ft]
    output: Site
    side_effects: []
  - method: GET
    path: "/api/sites/{siteId}"
    description: "Get a site"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/api/sites"
    description: "List sites (paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Site[]
    side_effects: []

  # --- ShowEvent ---
  - method: POST
    path: "/api/show-events"
    description: "Create a show. contract_value_cents/deposit_cents/balance_cents computed by show_contract_pricing; lifecycle PLANNING, payment DEPOSIT_DUE, posture NOT_READY. window_start must be strictly after the logical clock; turnaround buffer vs other shows at the site enforced."
    roles: [ProductionPlanner]
    code: 201
    input: [site_id, name, window_start, window_end, drone_count_planned, "backup_window_start?", "backup_window_end?"]
    output: ShowEvent
    side_effects: ["show_contract_pricing computed", "statuses initialized"]
  - method: GET
    path: "/api/show-events/{showEventId}"
    description: "Get a show (includes computed posture, pins, counters)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: ShowEvent
    side_effects: []
  - method: GET
    path: "/api/show-events"
    description: "List shows (paginated, filterable)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["site_id?", "lifecycle_status?", "limit?", "offset?"]
    output: ShowEvent[]
    side_effects: []
  - method: POST
    path: "/api/show-events/{showEventId}/authorize"
    description: "DESIGN_LOCKED -> AUTHORIZED; pins the given APPROVED authorization"
    roles: [ProductionPlanner]
    code: 200
    input: [authorization_id]
    output: ShowEvent
    side_effects: ["pinned_authorization_id set", "readiness_posture recomputed", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/certify-go"
    description: "READY -> GO_CERTIFIED using a fresh CERTIFIED GO evaluation"
    roles: [SafetyOfficer]
    code: 200
    input: [evaluation_id]
    output: ShowEvent
    side_effects: ["readiness_posture := GO", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/execute"
    description: "GO_CERTIFIED -> EXECUTED; requires clock inside the show window and PAID_IN_FULL"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["assignments ASSIGNED -> FLOWN", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/postpone"
    description: "AUTHORIZED|READY|GO_CERTIFIED -> POSTPONED"
    roles: [ProductionPlanner]
    code: 200
    input: ["reason?"]
    output: ShowEvent
    side_effects: ["readiness_posture := NOT_READY", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/reschedule"
    description: "POSTPONED -> PLANNING with a new window; auto-advances to DESIGN_LOCKED when the pinned design is still LOCKED"
    roles: [ProductionPlanner]
    code: 200
    input: [window_start, window_end]
    output: ShowEvent
    side_effects: ["window replaced", "possible auto-advance to DESIGN_LOCKED", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/activate-backup"
    description: "POSTPONED -> PLANNING; moves the show into its reserved backup window and consumes it"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["window := backup window; backup_consumed := true", "possible auto-advance to DESIGN_LOCKED", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/cancel"
    description: "Any non-terminal lifecycle -> CANCELLED; computes cancellation tier + refund_due_cents; voids all ASSIGNED grid slots"
    roles: [ProductionPlanner]
    code: 200
    input: ["reason?"]
    output: ShowEvent
    side_effects: ["cancellation_refund computed (tier + refund_due_cents)", "cancellation_status NONE -> FILED", "cascade: ASSIGNED assignments -> VOIDED, their drones RESERVED -> AVAILABLE", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/settle-cancellation"
    description: "Posts the frozen refund: cancellation FILED -> SETTLED"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["refunded_total_cents := refund_due_cents", "payment_status -> REFUNDED", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/void-cancellation"
    description: "Reverses a settled cancellation's refund: SETTLED -> VOIDED (show remains CANCELLED)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["refunded_total_cents := 0", "payment_status recomputed from paid_total_cents", "increments ShowEvent.version by 1"]
  - method: POST
    path: "/api/show-events/{showEventId}/record-payment"
    description: "Records the DEPOSIT then the BALANCE; amounts must match exactly"
    roles: [ProductionPlanner]
    code: 200
    input: [kind, amount_cents]
    output: ShowEvent
    side_effects: ["paid_total_cents += amount_cents", "payment_status transition", "increments ShowEvent.version by 1"]
  - method: GET
    path: "/api/show-events/{showEventId}/readiness"
    description: "Computed read: posture with per-gate breakdown g1..g6 (fixed order)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: "{ posture: string, gates: object, assigned_count: integer, required_drone_count: integer|null }"
    side_effects: []
  - method: GET
    path: "/api/show-events/{showEventId}/perimeter-assessment"
    description: "Computed read: required crowd radius + containment. variant=PLANNED (default) uses pinned design; variant=AS_FLOWN uses flight telemetry (>= 1 FlightLog else ERR_NO_FLIGHT_DATA)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, required_radius_m: number, buffer_m: number, site_min_half_dim_m: number, containment: string }"
    side_effects: []

  # --- AirspaceAuthorization ---
  - method: POST
    path: "/api/airspace-authorizations"
    description: "File an authorization/waiver application (DRAFT)"
    roles: [ProductionPlanner]
    code: 201
    input: [show_event_id, window_start, window_end, altitude_ceiling_ft, waiver_types]
    output: AirspaceAuthorization
    side_effects: []
  - method: GET
    path: "/api/airspace-authorizations/{authorizationId}"
    description: "Get an authorization"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects: []
  - method: GET
    path: "/api/airspace-authorizations"
    description: "List authorizations (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "status?", "limit?", "offset?"]
    output: AirspaceAuthorization[]
    side_effects: []
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/submit"
    description: "DRAFT -> UNDER_REVIEW; ceiling/coverage/overlap validated"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects: []
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/request-info"
    description: "UNDER_REVIEW -> INFO_REQUESTED"
    roles: [AuthorityOfficer]
    code: 200
    input: ["info_note?"]
    output: AirspaceAuthorization
    side_effects: []
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/resubmit"
    description: "INFO_REQUESTED -> UNDER_REVIEW"
    roles: [ProductionPlanner]
    code: 200
    input: ["amendment_note?"]
    output: AirspaceAuthorization
    side_effects: []
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/decide"
    description: "UNDER_REVIEW -> APPROVED|DENIED; approval re-validates ceiling, coverage, and overlap at decision time"
    roles: [AuthorityOfficer]
    code: 200
    input: [decision]
    output: AirspaceAuthorization
    side_effects: ["decided_at/decided_by set"]
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/revise"
    description: "DENIED -> DRAFT with optional amended window/ceiling"
    roles: [ProductionPlanner]
    code: 200
    input: ["window_start?", "window_end?", "altitude_ceiling_ft?"]
    output: AirspaceAuthorization
    side_effects: ["decided_at/decided_by cleared"]
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/revoke"
    description: "APPROVED -> REVOKED; downgrades shows pinning it"
    roles: [AuthorityOfficer]
    code: 200
    input: ["reason?"]
    output: AirspaceAuthorization
    side_effects: ["cascade: shows pinning this authorization -> PLANNING"]
  - method: POST
    path: "/api/airspace-authorizations/{authorizationId}/withdraw"
    description: "DRAFT -> WITHDRAWN"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects: []

  # --- ShowDesign ---
  - method: POST
    path: "/api/show-designs"
    description: "Create a design revision (DRAFT); design_version_no assigned per show"
    roles: [ProductionPlanner]
    code: 201
    input: [show_event_id, drone_count, max_altitude_ft, duration_sec, min_separation_m]
    output: ShowDesign
    side_effects: ["design_version_no computed"]
  - method: GET
    path: "/api/show-designs/{designId}"
    description: "Get a design"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: ShowDesign
    side_effects: []
  - method: GET
    path: "/api/show-designs"
    description: "List designs (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "status?", "limit?", "offset?"]
    output: ShowDesign[]
    side_effects: []
  - method: POST
    path: "/api/show-designs/{designId}/revise"
    description: "SIMULATED -> DRAFT (revision loop)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ShowDesign
    side_effects: []
  - method: POST
    path: "/api/show-designs/{designId}/lock"
    description: "SIMULATED -> LOCKED with OCC on the parent show; supersedes the previously LOCKED design and re-pins the show"
    roles: [ProductionPlanner]
    code: 200
    input: [expected_show_event_version]
    output: ShowDesign
    side_effects: ["prior LOCKED design -> SUPERSEDED", "ShowEvent.pinned_design_id := this design", "ShowEvent lifecycle -> DESIGN_LOCKED from PLANNING/AUTHORIZED/READY", "increments ShowEvent.version by 1"]

  # --- SimulationRun ---
  - method: POST
    path: "/api/simulation-runs"
    description: "Record a flight-path simulation run; verdict computed; first run moves design DRAFT -> SIMULATED"
    roles: [ProductionPlanner]
    code: 201
    input: [show_design_id, min_separation_observed_m, battery_draw_pct, max_speed_mps]
    output: SimulationRun
    side_effects: ["simulation_verdict computed", "design DRAFT -> SIMULATED on first run"]
  - method: GET
    path: "/api/simulation-runs/{simulationRunId}"
    description: "Get a simulation run"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: SimulationRun
    side_effects: []
  - method: GET
    path: "/api/simulation-runs"
    description: "List simulation runs (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_design_id?", "verdict?", "limit?", "offset?"]
    output: SimulationRun[]
    side_effects: []

  # --- SafetyConfiguration ---
  - method: POST
    path: "/api/safety-configurations"
    description: "Create a geofence/failsafe configuration (DRAFT) with OCC on the parent show; supersedes the show's current non-SUPERSEDED configuration"
    roles: [ProductionPlanner]
    code: 201
    input: [show_event_id, geofence_radius_m, altitude_hard_ceiling_ft, lost_link_action, geofence_breach_action, battery_rtl_threshold_pct, expected_show_event_version]
    output: SafetyConfiguration
    side_effects: ["prior DRAFT/APPROVED configuration for the show -> SUPERSEDED (with show downgrade when the pinned config is superseded)", "created_by_user_id := caller", "increments ShowEvent.version by 1"]
  - method: GET
    path: "/api/safety-configurations/{configId}"
    description: "Get a safety configuration"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: SafetyConfiguration
    side_effects: []
  - method: GET
    path: "/api/safety-configurations"
    description: "List safety configurations (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "status?", "limit?", "offset?"]
    output: SafetyConfiguration[]
    side_effects: []
  - method: POST
    path: "/api/safety-configurations/{configId}/approve"
    description: "DRAFT -> APPROVED; geofence must cover the required crowd radius for the pinned design; SoD vs creator"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyConfiguration
    side_effects: ["other APPROVED config for the show -> SUPERSEDED", "ShowEvent.pinned_safety_config_id := this config", "increments ShowEvent.version by 1"]

  # --- Drone ---
  - method: POST
    path: "/api/drones"
    description: "Register a drone (AVAILABLE); battery_cycle_count may be seeded for used airframes"
    roles: [FleetManager]
    code: 201
    input: [serial_number, model, "charge_pct?", "battery_cycle_count?"]
    output: Drone
    side_effects: []
  - method: GET
    path: "/api/drones/{droneId}"
    description: "Get a drone"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: Drone
    side_effects: []
  - method: GET
    path: "/api/drones"
    description: "List drones (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Drone[]
    side_effects: []
  - method: POST
    path: "/api/drones/{droneId}/ground"
    description: "AVAILABLE|RESERVED|IN_MAINTENANCE -> GROUNDED; grounding a RESERVED drone voids its assignments"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Drone
    side_effects: ["cascade: ASSIGNED assignments with this drone -> VOIDED; affected shows' assigned_count decremented; READY shows -> AUTHORIZED"]
  - method: POST
    path: "/api/drones/{droneId}/release"
    description: "GROUNDED|IN_MAINTENANCE -> AVAILABLE (post-inspection release)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Drone
    side_effects: []
  - method: POST
    path: "/api/drones/{droneId}/maintain"
    description: "AVAILABLE -> IN_MAINTENANCE"
    roles: [FleetManager]
    code: 200
    input: []
    output: Drone
    side_effects: []
  - method: POST
    path: "/api/drones/{droneId}/retire"
    description: "AVAILABLE|IN_MAINTENANCE|GROUNDED -> RETIRED"
    roles: [FleetManager]
    code: 200
    input: []
    output: Drone
    side_effects: []

  # --- ChargeBay ---
  - method: POST
    path: "/api/charge-bays"
    description: "Register a charging bay at a site"
    roles: [FleetManager]
    code: 201
    input: [site_id, bay_code, port_count]
    output: ChargeBay
    side_effects: []
  - method: GET
    path: "/api/charge-bays/{chargeBayId}"
    description: "Get a charge bay"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: ChargeBay
    side_effects: []
  - method: GET
    path: "/api/charge-bays"
    description: "List charge bays (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: ChargeBay[]
    side_effects: []

  # --- ChargeSession ---
  - method: POST
    path: "/api/charge-sessions"
    description: "Start a charging session: drone AVAILABLE -> CHARGING; one ACTIVE session per drone; bay port capacity enforced (aggregate overlap semantics)"
    roles: [FleetManager]
    code: 201
    input: [drone_id, charge_bay_id]
    output: ChargeSession
    side_effects: ["charge_from_pct := drone.charge_pct", "started_at := logical clock now", "drone -> CHARGING"]
  - method: GET
    path: "/api/charge-sessions/{chargeSessionId}"
    description: "Get a charge session"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: ChargeSession
    side_effects: []
  - method: GET
    path: "/api/charge-sessions"
    description: "List charge sessions (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["drone_id?", "charge_bay_id?", "status?", "limit?", "offset?"]
    output: ChargeSession[]
    side_effects: []
  - method: POST
    path: "/api/charge-sessions/{chargeSessionId}/complete"
    description: "ACTIVE -> COMPLETED; drone charge updated and released"
    roles: [FleetManager]
    code: 200
    input: [charge_to_pct]
    output: ChargeSession
    side_effects: ["drone charge_pct := charge_to_pct; CHARGING -> AVAILABLE", "ended_at := now"]
  - method: POST
    path: "/api/charge-sessions/{chargeSessionId}/interrupt"
    description: "ACTIVE -> INTERRUPTED; partial charge kept"
    roles: [FleetManager]
    code: 200
    input: [charge_to_pct]
    output: ChargeSession
    side_effects: ["drone charge_pct := charge_to_pct; CHARGING -> AVAILABLE", "ended_at := now"]

  # --- LaunchGridAssignment ---
  - method: POST
    path: "/api/launch-grid-assignments"
    description: "Assign a drone to a swarm grid slot. Requires show lifecycle IN {AUTHORIZED, READY}; drone AVAILABLE; derated charge >= 85; slot free; drone not booked on a window-overlapping show; slot inside site ground; assigned_count < pinned design drone_count. Completing the grid auto-advances the show to READY."
    roles: [FleetManager]
    code: 201
    input: [show_event_id, drone_id, grid_row, grid_col]
    output: LaunchGridAssignment
    side_effects: ["drone AVAILABLE -> RESERVED", "ShowEvent.assigned_count += 1", "when grid complete and perimeter VALID: show AUTHORIZED -> READY", "increments ShowEvent.version by 1"]
  - method: GET
    path: "/api/launch-grid-assignments/{assignmentId}"
    description: "Get an assignment"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: LaunchGridAssignment
    side_effects: []
  - method: GET
    path: "/api/launch-grid-assignments"
    description: "List assignments (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "drone_id?", "status?", "limit?", "offset?"]
    output: LaunchGridAssignment[]
    side_effects: []
  - method: POST
    path: "/api/launch-grid-assignments/{assignmentId}/void"
    description: "ASSIGNED -> VOIDED; releases the drone; downgrades a READY show"
    roles: [FleetManager]
    code: 200
    input: []
    output: LaunchGridAssignment
    side_effects: ["drone RESERVED -> AVAILABLE", "ShowEvent.assigned_count -= 1; READY -> AUTHORIZED when grid incomplete", "increments ShowEvent.version by 1"]

  # --- WeatherReading ---
  - method: POST
    path: "/api/weather-readings"
    description: "Record a weather observation (immutable); recorded_at must not be after the logical clock"
    roles: [SafetyOfficer]
    code: 201
    input: [site_id, recorded_at, wind_speed_kt, gust_kt, precip_mm_hr, temperature_c]
    output: WeatherReading
    side_effects: []
  - method: GET
    path: "/api/weather-readings/{weatherReadingId}"
    description: "Get a weather reading"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: WeatherReading
    side_effects: []
  - method: GET
    path: "/api/weather-readings"
    description: "List weather readings (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: WeatherReading[]
    side_effects: []

  # --- GoNoGoEvaluation ---
  - method: POST
    path: "/api/go-no-go-evaluations"
    description: "Compute a go/no-go evaluation for a show (lifecycle AUTHORIZED|READY|GO_CERTIFIED) from the latest weather within the 60-minute lookback; verdict + reason_codes + effective limits computed"
    roles: [SafetyOfficer]
    code: 201
    input: [show_event_id]
    output: GoNoGoEvaluation
    side_effects: ["effective_wind_limit + go_no_go_verdict computed"]
  - method: GET
    path: "/api/go-no-go-evaluations/{evaluationId}"
    description: "Get an evaluation"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: GoNoGoEvaluation
    side_effects: []
  - method: GET
    path: "/api/go-no-go-evaluations"
    description: "List evaluations (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "verdict?", "status?", "limit?", "offset?"]
    output: GoNoGoEvaluation[]
    side_effects: []
  - method: POST
    path: "/api/go-no-go-evaluations/{evaluationId}/certify"
    description: "PROVISIONAL -> CERTIFIED; SoD vs the pinned safety configuration's approver"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: GoNoGoEvaluation
    side_effects: ["certified_at/certified_by_user_id set"]

  # --- IncidentReport ---
  - method: POST
    path: "/api/incident-reports"
    description: "File an incident against an EXECUTED show; MAJOR requires drone_id"
    roles: [SafetyOfficer]
    code: 201
    input: [show_event_id, "drone_id?", severity, description]
    output: IncidentReport
    side_effects: ["filed_by_user_id := caller"]
  - method: GET
    path: "/api/incident-reports/{incidentId}"
    description: "Get an incident report"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/api/incident-reports"
    description: "List incident reports (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "drone_id?", "severity?", "status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: POST
    path: "/api/incident-reports/{incidentId}/investigate"
    description: "FILED -> UNDER_INVESTIGATION"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: POST
    path: "/api/incident-reports/{incidentId}/close"
    description: "UNDER_INVESTIGATION -> CLOSED_CONFIRMED|CLOSED_REJECTED; SoD vs filer; CONFIRMED triggers severity cascades (CRITICAL grounds every drone that flew the show and revokes its authorization; MAJOR grounds the report's drone)"
    roles: [SafetyOfficer]
    code: 200
    input: [outcome]
    output: IncidentReport
    side_effects: ["CRITICAL: flown drones -> GROUNDED (each voids its other ASSIGNED assignments; READY shows -> AUTHORIZED); show's APPROVED authorization -> REVOKED (show -> PLANNING)", "MAJOR: drone_id -> GROUNDED (same assignment cascade)"]

  # --- FlightLog ---
  - method: POST
    path: "/api/flight-logs"
    description: "Upload a post-flight log for an EXECUTED show; drone must hold a FLOWN assignment; reconciles battery, increments cycles, may auto-flag and auto-file a MINOR incident"
    roles: [FleetManager]
    code: 201
    input: [show_event_id, drone_id, battery_consumed_pct, max_altitude_reached_ft, max_deviation_m]
    output: FlightLog
    side_effects: ["flight_battery_reconciliation executed (assignment -> RECONCILED; drone release; charge decrement; cycle increment; >= 200 cycles -> IN_MAINTENANCE)", "deviation > 5.0m -> FLAGGED + auto MINOR IncidentReport (AUTO_DEVIATION)"]
  - method: GET
    path: "/api/flight-logs/{flightLogId}"
    description: "Get a flight log"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: []
    output: FlightLog
    side_effects: []
  - method: GET
    path: "/api/flight-logs"
    description: "List flight logs (filterable, paginated)"
    roles: [ProductionPlanner, AuthorityOfficer, SafetyOfficer, FleetManager, OpsAdmin]
    code: 200
    input: ["show_event_id?", "drone_id?", "flag_status?", "limit?", "offset?"]
    output: FlightLog[]
    side_effects: []

  # --- Test-driving (logical clock + ops sweep) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/api/_ops/run_sweep"
    description: "Ops checkpoint: APPROVED authorizations whose window_end < now -> EXPIRED (with show-downgrade cascade)"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: "{ expired_authorization_ids: array, downgraded_show_ids: array }"
    side_effects: ["authorization expiry cascade per state machine"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller is the same user as the creator/approver/filer this action must be segregated from" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, malformed value, enum out of range, numeric constraint violated (e.g. gust_kt < wind_speed_kt, latitude out of range, window_end <= window_start, backup window < 24h after window_end), a computed/system-managed field present in the request body, or pagination params outside [1..100] / offset < 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_show_event_version does not match the ShowEvent's current version (OCC)" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "site_id does not resolve" }
  - { id: ERR_SHOW_NOT_FOUND, http: 404, condition: "show_event_id / showEventId does not resolve" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "authorization id does not resolve" }
  - { id: ERR_DESIGN_NOT_FOUND, http: 404, condition: "design id does not resolve" }
  - { id: ERR_SIMULATION_RUN_NOT_FOUND, http: 404, condition: "simulation run id does not resolve" }
  - { id: ERR_SAFETY_CONFIG_NOT_FOUND, http: 404, condition: "safety configuration id does not resolve" }
  - { id: ERR_DRONE_NOT_FOUND, http: 404, condition: "drone id does not resolve" }
  - { id: ERR_CHARGE_BAY_NOT_FOUND, http: 404, condition: "charge bay id does not resolve" }
  - { id: ERR_CHARGE_SESSION_NOT_FOUND, http: 404, condition: "charge session id does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "launch grid assignment id does not resolve" }
  - { id: ERR_WEATHER_READING_NOT_FOUND, http: 404, condition: "weather reading id does not resolve" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "go/no-go evaluation id does not resolve" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "incident report id does not resolve" }
  - { id: ERR_FLIGHT_LOG_NOT_FOUND, http: 404, condition: "flight log id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a from-state that permits the requested transition" }
  - { id: ERR_DRONE_NOT_FLYABLE, http: 409, condition: "Assignment target drone is GROUNDED, IN_MAINTENANCE, RETIRED, or CHARGING" }
  - { id: ERR_CHARGE_BELOW_MINIMUM, http: 409, condition: "Drone's derated effective charge is below the 85% launch minimum" }
  - { id: ERR_ALTITUDE_CEILING_EXCEEDS_SITE, http: 409, condition: "Requested/configured altitude ceiling exceeds the site's hard maximum" }
  - { id: ERR_GEOFENCE_BELOW_REQUIRED, http: 409, condition: "Geofence radius is below the required crowd-distance radius for the pinned design" }
  - { id: ERR_CEILING_BELOW_DESIGN, http: 409, condition: "Safety configuration hard ceiling is below the pinned design's max altitude" }
  - { id: ERR_PERIMETER_INSUFFICIENT, http: 409, condition: "Site cannot contain the required crowd-distance radius plus buffer" }
  - { id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http: 409, condition: "Authorization window overlaps another UNDER_REVIEW/APPROVED authorization at the same site (half-open semantics)" }
  - { id: ERR_SHOW_WINDOW_CONFLICT, http: 409, condition: "Show window violates the 120-minute turnaround buffer against another show at the same site" }
  - { id: ERR_DRONE_DOUBLE_BOOKED, http: 409, condition: "Drone already holds an ASSIGNED slot on another show whose window overlaps (half-open)" }
  - { id: ERR_READING_IN_FUTURE, http: 409, condition: "Weather reading recorded_at is after the logical clock" }
  - { id: ERR_EVALUATION_STALE, http: 409, condition: "Certified GO evaluation is older than 240 minutes" }
  - { id: ERR_BACKUP_WINDOW_UNAVAILABLE, http: 409, condition: "No unconsumed backup window, or backup window start is not in the future" }
  - { id: ERR_SHOW_WINDOW_IN_PAST, http: 409, condition: "window_start is not strictly after the logical clock" }
  - { id: ERR_OUTSIDE_SHOW_WINDOW, http: 409, condition: "Execute attempted outside [window_start, window_end)" }
  - { id: ERR_GRID_SLOT_OCCUPIED, http: 409, condition: "Another ASSIGNED/FLOWN/RECONCILED slot already occupies (grid_row, grid_col) for this show" }
  - { id: ERR_DRONE_ALREADY_ASSIGNED, http: 409, condition: "Drone already holds an ASSIGNED slot on this show" }
  - { id: ERR_GRID_OUT_OF_BOUNDS, http: 409, condition: "Grid coordinates exceed site ground dimensions at 2.0m slot pitch" }
  - { id: ERR_BAY_CAPACITY_EXCEEDED, http: 409, condition: "Charge bay already has port_count ACTIVE sessions" }
  - { id: ERR_CHARGE_NOT_NEEDED, http: 409, condition: "Drone charge_pct is already 100" }
  - { id: ERR_ASSIGNMENT_EXCEEDS_DESIGN, http: 409, condition: "Grid already holds pinned design drone_count assignments" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already registered" }
  - { id: ERR_AUTHORIZATION_WINDOW_INSUFFICIENT, http: 409, condition: "Authorization window does not fully cover the show window (and backup window when applicable)" }
  - { id: ERR_AUTHORIZATION_NOT_APPROVED, http: 409, condition: "Referenced authorization is not APPROVED" }
  - { id: ERR_SIMULATION_NOT_PASSING, http: 409, condition: "Design's most recent simulation verdict is not PASS" }
  - { id: ERR_EVALUATION_NOT_CERTIFIED, http: 409, condition: "Referenced evaluation is not CERTIFIED" }
  - { id: ERR_NO_GO_IN_EFFECT, http: 409, condition: "Referenced evaluation verdict is NO_GO" }
  - { id: ERR_SAFETY_CONFIG_NOT_APPROVED, http: 409, condition: "No APPROVED safety configuration is pinned to the show" }
  - { id: ERR_DRONE_REQUIRED, http: 409, condition: "severity MAJOR requires drone_id" }
  - { id: ERR_INVALID_CHARGE_TARGET, http: 409, condition: "charge_to_pct outside (charge_from_pct, 100] for complete or [charge_from_pct, 100] for interrupt" }
  - { id: ERR_NO_FLIGHT_DATA, http: 409, condition: "AS_FLOWN perimeter variant requested but the show has no FlightLog rows" }
  - { id: ERR_DESIGN_NOT_LOCKED, http: 409, condition: "Safety approval requires a LOCKED pinned design on the show" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "amount_cents does not equal the exact component due (deposit_cents or balance_cents)" }
  - { id: ERR_SHOW_NOT_PAID_IN_FULL, http: 409, condition: "Execute requires payment_status == PAID_IN_FULL" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProductionPlanner
    description: "Show producer: owns sites, shows, designs, simulations, authorization applications, payments, cancellations"
    identity: opaque
    exclusive_operations:
      - "POST /api/sites"
      - "POST /api/show-events and all show action endpoints except certify-go (authorize, execute, postpone, reschedule, activate-backup, cancel, settle-cancellation, void-cancellation, record-payment)"
      - "POST /api/airspace-authorizations (+submit, resubmit, revise, withdraw)"
      - "POST /api/show-designs (+revise, lock)"
      - "POST /api/simulation-runs"
      - "POST /api/safety-configurations"
    shared_operations:
      - "All GET endpoints"
  - name: AuthorityOfficer
    description: "Aviation-authority reviewer: processes authorization applications"
    identity: opaque
    exclusive_operations:
      - "POST /api/airspace-authorizations/{id}/request-info"
      - "POST /api/airspace-authorizations/{id}/decide"
      - "POST /api/airspace-authorizations/{id}/revoke"
    shared_operations:
      - "All GET endpoints"
  - name: SafetyOfficer
    description: "Safety authority: approves safety configurations, records weather, certifies go/no-go, files and closes incidents, grounds/releases drones"
    identity: opaque
    exclusive_operations:
      - "POST /api/safety-configurations/{id}/approve"
      - "POST /api/weather-readings"
      - "POST /api/go-no-go-evaluations (+certify)"
      - "POST /api/show-events/{id}/certify-go"
      - "POST /api/incident-reports (+investigate, close)"
      - "POST /api/drones/{id}/ground and /release"
    shared_operations:
      - "All GET endpoints"
  - name: FleetManager
    description: "Fleet operator: drone registry, charge bays and sessions, launch-grid assignments, flight logs"
    identity: opaque
    exclusive_operations:
      - "POST /api/drones (+maintain, retire)"
      - "POST /api/charge-bays"
      - "POST /api/charge-sessions (+complete, interrupt)"
      - "POST /api/launch-grid-assignments (+void)"
      - "POST /api/flight-logs"
    shared_operations:
      - "All GET endpoints"
  - name: OpsAdmin
