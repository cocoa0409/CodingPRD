  - rule_id: resource_temporal_overlap
    instances:
      - name: room_occupancy_includes_turnover_buffer
        grounds:
          - calculations.room_slot_feasibility
          - validations.priority_28_ERR_SLOT_OVERLAP
          - entities.EndoscopySession.fields.turnover_minutes
          - entities.ProcedureBooking.fields.occupancy_end_utc
        distinguishing_aspect: |
          Single-resource room geometry: the occupancy interval is the slot plus the block's turnover
          minutes and it is half-open, so 13:45 (inside the 15-minute turnover tail) is refused while
          14:00 (exactly at occupancy_end_utc) is accepted. An implementation that compares raw slots
          accepts 13:45; one that treats the interval as closed refuses 14:00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "MODERATE_SEDATION block on 2026-09-15, window 13:00Z-21:00Z, turnover_minutes 15, max_procedures 8"
            - "Booking A occupies 13:00Z-13:45Z with occupancy_end_utc 14:00Z"
            - "Three eligible patients with OPEN episodes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
