            - "Review.${rev3}.sentiment == NEGATIVE"
            - "dashboard.review_count == 3"
            - "dashboard.avg_rating == 3.33"
            - "dashboard.sentiment_positive_count == 1"
            - "dashboard.sentiment_neutral_count == 1"
            - "dashboard.sentiment_negative_count == 1"
            - "dashboard.open_escalation_count == 1"
            - "dashboard.reputation_score_certified == 0.00 (never certified)"

      - name: review_request_delivery_events_advance_the_status_chain
        claim_type: action_endpoint
        grounds:
          - state_machines.ReviewRequest.SENT_to_DELIVERED
          - state_machines.ReviewRequest.DELIVERED_to_CLICKED
          - endpoints
        distinguishing_aspect: "The connector callback advances SENT -> DELIVERED -> CLICKED, and a CLICKED request that is later billed still counts once in sent_count, with billing_cost unchanged at 0.01."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with a CONNECTED GOOGLE listing."
