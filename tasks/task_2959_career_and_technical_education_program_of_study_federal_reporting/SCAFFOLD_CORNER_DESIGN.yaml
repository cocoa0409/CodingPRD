        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_CIP_CODE_DUPLICATE]
          - errors[ERR_COURSE_CODE_DUPLICATE]
          - errors[ERR_CREDENTIAL_CODE_DUPLICATE]
          - errors[ERR_STUDENT_ID_DUPLICATE]
          - errors[ERR_FISCAL_YEAR_DUPLICATE]
          - errors[ERR_INDICATOR_DUPLICATE]
          - errors[ERR_CHAIR_ALREADY_SEATED]
