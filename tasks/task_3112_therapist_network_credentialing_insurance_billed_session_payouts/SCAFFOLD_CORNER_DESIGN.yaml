        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z, then 2026-06-09T00:00:00Z; one completed and billed session whose claim is adjudicated PAID, with a closed batch period not yet locked."
