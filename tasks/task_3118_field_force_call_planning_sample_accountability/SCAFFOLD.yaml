    path: "/field-force/call-plans"
    description: "List CallPlans"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "territory_id?", "status?"]
    output: "CallPlan[]"
    side_effects: []

  - method: GET
    path: "/field-force/call-plans/{id}"
    description: "Get a CallPlan"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: CallPlan
    side_effects: []

  - method: POST
    path: "/field-force/call-plans/{id}/publish"
    description: "Publish a DRAFT plan"
    roles: [DistrictManager]
    code: 200
    input: []
    output: CallPlan
    side_effects: ["status := PUBLISHED; published_at := now; Territory.alignment_posture := PUBLISHED"]

  # --- Call visits ---
  - method: POST
    path: "/field-force/call-visits"
    description: "Schedule a CallVisit"
    roles: [FieldRep]
    code: 201
    input: [call_plan_id, target_list_entry_id, scheduled_start, scheduled_end]
    output: CallVisit
    side_effects: ["representative_id := X-User-ID; prescriber_id denormalized from entry"]

  - method: GET
    path: "/field-force/call-visits"
    description: "List CallVisits"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "representative_id?", "call_plan_id?", "prescriber_id?", "call_status?", "target_list_entry_id?"]
    output: "CallVisit[]"
    side_effects: []

  - method: GET
    path: "/field-force/call-visits/{id}"
    description: "Get a CallVisit"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: CallVisit
    side_effects: []

  - method: POST
    path: "/field-force/call-visits/{id}/complete"
    description: "Complete a visit"
    roles: [FieldRep]
    code: 200
    input: []
    output: CallVisit
    side_effects: ["per CallVisit state machine SCHEDULED->COMPLETED including plan lock cascade"]

  - method: POST
    path: "/field-force/call-visits/{id}/cancel"
    description: "Cancel a visit"
    roles: [FieldRep, DistrictManager]
    code: 200
    input: []
    output: CallVisit
    side_effects: ["PENDING_SIGNATURE disbursements -> VOIDED"]

  - method: POST
    path: "/field-force/call-visits/{id}/mark-no-show"
    description: "Mark a visit NO_SHOW"
    roles: [FieldRep]
    code: 200
    input: []
    output: CallVisit
    side_effects: []

  # --- Sample disbursements ---
  - method: POST
    path: "/field-force/sample-disbursements"
    description: "Record a sample delivery at a visit (PENDING_SIGNATURE until signature capture)"
    roles: [FieldRep]
    code: 201
    input: [call_visit_id, lot_id, quantity]
    output: SampleDisbursement
    side_effects:
      - "Validations priority 7 (eligibility), 8 (lot releasable + not expired), 12 (four-term cap)"
      - "PENDING_SIGNATURE disbursement holds its quantity inside the rep balance (released on REJECTED/VOIDED, consumed on SIGNED)"
      - "increments SampleLot.version by 1"

  - method: GET
    path: "/field-force/sample-disbursements"
    description: "List disbursements"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "representative_id?", "prescriber_id?", "lot_id?", "reconciliation_status?"]
    output: "SampleDisbursement[]"
    side_effects: []

  - method: GET
    path: "/field-force/sample-disbursements/{id}"
    description: "Get a disbursement"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: SampleDisbursement
    side_effects: []

  - method: POST
    path: "/field-force/sample-disbursements/{id}/capture-signature"
    description: "Capture prescriber signature -> SIGNED with full cascade"
    roles: [FieldRep]
    code: 200
    input: [signature_payload]
    output: SampleDisbursement
    side_effects: ["per SampleDisbursement state machine including prescriber-cap and visit-cancellation cascades"]

  - method: POST
    path: "/field-force/sample-disbursements/{id}/reject-signature"
    description: "Reject a pending signature"
    roles: [FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: SampleDisbursement
    side_effects: ["reserved quantity released"]

  - method: GET
    path: "/field-force/call-visits/{id}/sample-disbursements"
    description: "List disbursements of a visit (sub-resource reverse lookup)"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "SampleDisbursement[]"
    side_effects: []

  - method: GET
    path: "/field-force/count-lines"
    description: "Filtered list of CountLine rows (reverse lookup by session or lot)"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["session_id?", "lot_id?", "limit?", "offset?"]
    output: "CountLine[]"
    side_effects: []

  - method: GET
    path: "/field-force/count-lines/{id}"
    description: "Get one CountLine"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: CountLine
    side_effects: []

  # --- Transfers ---
  - method: POST
    path: "/field-force/sample-transfers"
    description: "Request a rep-to-rep sample transfer; OCC via expected_lot_version"
    roles: [FieldRep]
    code: 201
    input: [to_rep_id, lot_id, quantity, reason_code, documentation_note, expected_lot_version]
    output: SampleTransfer
    side_effects:
      - "from_rep_id := X-User-ID"
      - "Sender RepLotBalance.qty_in_transit_out += quantity"
      - "increments SampleLot.version by 1"

  - method: GET
    path: "/field-force/sample-transfers"
    description: "List transfers"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "from_rep_id?", "to_rep_id?", "lot_id?", "status?"]
    output: "SampleTransfer[]"
    side_effects: []

  - method: GET
    path: "/field-force/sample-transfers/{id}"
    description: "Get a transfer"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: SampleTransfer
    side_effects: []

  - method: POST
    path: "/field-force/sample-transfers/{id}/accept"
    description: "Receiver accepts"
    roles: [FieldRep]
    code: 200
    input: []
    output: SampleTransfer
    side_effects: ["per state machine; conservation invariant holds"]

  - method: POST
    path: "/field-force/sample-transfers/{id}/reject"
    description: "Receiver rejects"
    roles: [FieldRep]
    code: 200
    input: []
    output: SampleTransfer
    side_effects: ["reserve released"]

  - method: POST
    path: "/field-force/sample-transfers/{id}/cancel"
    description: "Sender cancels"
    roles: [FieldRep]
    code: 200
    input: []
    output: SampleTransfer
    side_effects: ["reserve released"]

  - method: POST
    path: "/field-force/sample-transfers/{id}/reverse"
    description: "Compliance reverses an ACCEPTED transfer"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SampleTransfer
    side_effects: ["balances restored; conservation invariant re-verified"]

  # --- Inventory counts ---
  - method: POST
    path: "/field-force/inventory-count-sessions"
    description: "Open a physical count session; snapshots expected_qty per lot from qty_available_forward"
    roles: [DistrictManager]
    code: 201
    input: [representative_id, counter_rep_id, window_start, window_end]
    output: InventoryCountSession
    side_effects: ["CountLine rows auto-created for every RepLotBalance of custodian with qty_available_forward > 0"]

  - method: GET
    path: "/field-force/inventory-count-sessions"
    description: "List count sessions"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "representative_id?", "counter_rep_id?", "status?"]
    output: "InventoryCountSession[]"
    side_effects: []

  - method: GET
    path: "/field-force/inventory-count-sessions/{id}"
    description: "Get a session"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: InventoryCountSession
    side_effects: []

  - method: GET
    path: "/field-force/inventory-count-sessions/{id}/count-lines"
    description: "List count lines of a session"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CountLine[]"
    side_effects: []

  - method: POST
    path: "/field-force/inventory-count-sessions/{id}/submit-count"
    description: "Counter submits physical counts (lines: [{lot_id, counted_qty}])"
    roles: [FieldRep]
    code: 200
    input: [lines]
    output: InventoryCountSession
    side_effects: ["status -> COUNTED; variance_qty per line"]

  - method: POST
    path: "/field-force/inventory-count-sessions/{id}/reconcile"
    description: "Custodian's manager reconciles -> variance_pct, disciplinary tier, cascades"
    roles: [DistrictManager]
    code: 200
    input: []
    output: InventoryCountSession
    side_effects: ["per state machine including SUSPENDED cascade"]

  - method: POST
    path: "/field-force/inventory-count-sessions/{id}/reopen"
    description: "Compliance reopens a reconciled session (rework loop, max 3)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InventoryCountSession
    side_effects: ["standing recomputed; counts cleared"]

  - method: POST
    path: "/field-force/inventory-count-sessions/{id}/close"
    description: "Close a reconciled session"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InventoryCountSession
    side_effects: []

  - method: POST
    path: "/field-force/inventory-count-sessions/{id}/void"
    description: "Void an open session"
    roles: [DistrictManager, ComplianceOfficer]
    code: 200
    input: []
    output: InventoryCountSession
    side_effects: []

  # --- Temperature excursions ---
  - method: POST
    path: "/field-force/temperature-excursions"
    description: "Rep reports a temperature excursion in vehicle or home office"
    roles: [FieldRep]
    code: 201
    input: [product_id, location_type, observed_temp_c, excursion_minutes]
    output: TemperatureExcursion
    side_effects: ["representative_id := X-User-ID; severity computed"]

  - method: GET
    path: "/field-force/temperature-excursions"
    description: "List excursions"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer, QualityAssurance]
    code: 200
    input: ["limit?", "offset?", "representative_id?", "product_id?", "status?", "severity?"]
    output: "TemperatureExcursion[]"
    side_effects: []

  - method: GET
    path: "/field-force/temperature-excursions/{id}"
    description: "Get an excursion"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer, QualityAssurance]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: []

  - method: POST
    path: "/field-force/temperature-excursions/{id}/assess"
    description: "QA assesses; CRITICAL triggers lot quarantine cascade"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: ["per state machine, depth-3 cascade"]

  - method: POST
    path: "/field-force/temperature-excursions/{id}/resolve"
    description: "QA resolves after quarantine cleared"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: []

  # --- Returns & destruction ---
  - method: POST
    path: "/field-force/sample-returns"
    description: "Draft a return of expired/damaged/recalled samples"
    roles: [FieldRep]
    code: 201
    input: [lot_id, quantity, return_reason, destruction_method]
    output: SampleReturn
    side_effects: ["representative_id := X-User-ID"]

  - method: GET
    path: "/field-force/sample-returns"
    description: "List returns"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "representative_id?", "lot_id?", "status?"]
    output: "SampleReturn[]"
    side_effects: []

  - method: GET
    path: "/field-force/sample-returns/{id}"
    description: "Get a return"
    roles: [PlatformAdmin, DistrictManager, FieldRep, ComplianceOfficer]
    code: 200
    input: []
    output: SampleReturn
    side_effects: []

  - method: POST
    path: "/field-force/sample-returns/{id}/submit"
    description: "Submit a draft return"
    roles: [FieldRep]
    code: 200
    input: []
    output: SampleReturn
    side_effects: ["qty_returned += quantity"]

  - method: POST
    path: "/field-force/sample-returns/{id}/confirm-destruction"
    description: "Compliance confirms destruction and mints report reference"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SampleReturn
    side_effects: ["destruction_report_ref minted; lot DESTROYED when fully accounted and expired"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing/invalid X-User-ID or X-User-Role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, quantity < 1, documentation_note < 20 chars" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current parent version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a permitted from-state for the requested trigger" }
  - { id: ERR_PRESCRIBER_NOT_ELIGIBLE, http: 422, condition: "Prescriber not ELIGIBLE, or DEA missing for controlled product" }
  - { id: ERR_LOT_NOT_RELEASABLE, http: 422, condition: "Lot not RELEASED or expiration_date <= now" }
  - { id: ERR_VISIT_SCHEDULE_OVERLAP, http: 409, condition: "New visit interval overlaps an existing non-cancelled visit of the same rep (half-open intervals; back-to-back allowed)" }
  - { id: ERR_COUNT_WINDOW_CONFLICT, http: 409, condition: "Count session window overlaps or is within 24h of another non-VOIDED session for the same custodian" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 422, condition: "Same actor on both sides of a controlled step (counter==custodian/manager, sender==receiver, confirmer==returner)" }
  - { id: ERR_QUANTITY_LIMIT_EXCEEDED, http: 422, condition: "Quantity exceeds applicable cap (per-visit min-term, transfer reserve, return balance, lot availability)" }
  - { id: ERR_TERRITORY_BUDGET_EXCEEDED, http: 422, condition: "Sum of planned units exceeds territory cycle budget" }
  - { id: ERR_TERRITORY_NOT_ACTIVE, http: 409, condition: "Territory not ACTIVE for plan publish" }
  - { id: ERR_EMPTY_TARGET_LIST, http: 409, condition: "Publish requires >= 1 ACTIVE TargetListEntry" }
  - { id: ERR_PLAN_CYCLE_OVERLAP, http: 409, condition: "Another PUBLISHED plan overlaps the territory cycle window" }
  - { id: ERR_PLAN_LOCKED, http: 409, condition: "Supersede attempted on a LOCKED plan" }
  - { id: ERR_NOT_VISIT_OWNER, http: 403, condition: "Acting rep is not the visit's representative_id" }
  - { id: ERR_TARGET_ENTRY_INACTIVE, http: 409, condition: "TargetListEntry not ACTIVE" }
  - { id: ERR_REP_SUSPENDED, http: 403, condition: "Representative compliance_standing == SUSPENDED" }
  - { id: ERR_VISIT_WINDOW_EXPIRED, http: 422, condition: "Completion attempted outside [scheduled_start, scheduled_end + 24h)" }
  - { id: ERR_VISIT_NOT_COMPLETED, http: 409, condition: "Signature capture requires parent visit COMPLETED" }
  - { id: ERR_SIGNATURE_REQUIRED, http: 400, condition: "signature_payload missing or < 32 chars" }
  - { id: ERR_VISIT_NOT_DUE, http: 422, condition: "mark-no-show before scheduled_end" }
  - { id: ERR_NOT_TRANSFER_RECEIVER, http: 403, condition: "Accept/reject attempted by non-receiver" }
  - { id: ERR_NOT_TRANSFER_SENDER, http: 403, condition: "Cancel attempted by non-sender" }
  - { id: ERR_REP_INACTIVE, http: 409, condition: "Either transfer party (or territory) not ACTIVE" }
  - { id: ERR_INSUFFICIENT_RESERVED, http: 422, condition: "Sender in-transit reserve no longer covers quantity at accept time" }
  - { id: ERR_NOT_COUNT_COUNTER, http: 403, condition: "submit-count attempted by non-counter" }
  - { id: ERR_INCOMPLETE_COUNT, http: 422, condition: "Not all CountLines have counted_qty" }
  - { id: ERR_NOT_CUSTODIAN_MANAGER, http: 403, condition: "reconcile attempted by someone other than custodian's manager" }
  - { id: ERR_REOPEN_LIMIT_EXCEEDED, http: 409, condition: "Session already reopened 3 times" }
  - { id: ERR_QUARANTINE_OPEN, http: 409, condition: "Resolve attempted while CRITICAL-quarantined lots remain uncleared" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 422, condition: "Return quantity exceeds rep available balance" }
  - { id: ERR_RETURN_REASON_MISMATCH, http: 422, condition: "EXPIRED return for a lot whose expiration_date is still in the future" }
  - { id: ERR_SELF_CONFIRM_FORBIDDEN, http: 403, condition: "Returning rep attempts to confirm own destruction" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Commercial operations administrator; seeds regions, territories, reps, prescribers, products, lots; issues samples"
    identity: "opaque"
    exclusive_operations:
      - "POST /field-force/regions"
      - "POST /field-force/regions/{id}/territories"
      - "POST /field-force/territories/{id}/representatives"
      - "POST /field-force/prescribers"
      - "POST /field-force/products"
      - "POST /field-force/products/{id}/sample-lots"
      - "POST /field-force/representatives/{id}/lot-balances"
      - "POST /field-force/_clock/set_current_utc"
    shared_operations: ["All GET list/read endpoints"]

  - name: DistrictManager
    description: "First-line manager owning territory alignment, call plans, target lists, count sessions, reconciliation"
    identity: "entity_backed:Representative"
    exclusive_operations:
      - "POST /field-force/territories/{id}/target-list-entries"
      - "POST /field-force/call-plans"
      - "POST /field-force/call-plans/{id}/publish"
      - "POST /field-force/inventory-count-sessions"
      - "POST /field-force/inventory-count-sessions/{id}/reconcile"
    shared_operations:
      - "POST /field-force/call-visits/{id}/cancel"
      - "POST /field-force/inventory-count-sessions/{id}/void"
      - "All GET list/read endpoints"

  - name: FieldRep
    description: "Territory representative; schedules/completes visits, delivers samples, requests transfers, reports excursions, drafts returns"
    identity: "entity_backed:Representative"
    exclusive_operations:
      - "POST /field-force/call-visits"
      - "POST /field-force/call-visits/{id}/complete"
      - "POST /field-force/call-visits/{id}/mark-no-show"
      - "POST /field-force/sample-disbursements"
      - "POST /field-force/sample-transfers + accept/reject/cancel"
      - "POST /field-force/inventory-count-sessions/{id}/submit-count"
      - "POST /field-force/temperature-excursions"
      - "POST /field-force/sample-returns + submit"
    shared_operations:
      - "POST /field-force/call-visits/{id}/cancel"
      - "POST /field-force/sample-disbursements/{id}/capture-signature, reject-signature"
      - "All GET list/read endpoints"

  - name: ComplianceOfficer
    description: "Sample accountability and PDMA compliance; verifies prescribers, reopens/closes counts, reverses transfers, confirms destruction"
    identity: "opaque"
    exclusive_operations:
      - "POST /field-force/prescribers/{id}/verify-eligibility"
      - "POST /field-force/sample-transfers/{id}/reverse"
      - "POST /field-force/inventory-count-sessions/{id}/reopen"
      - "POST /field-force/inventory-count-sessions/{id}/close"
      - "POST /field-force/sample-returns/{id}/confirm-destruction"
    shared_operations:
      - "POST /field-force/sample-disbursements/{id}/reject-signature"
      - "POST /field-force/inventory-count-sessions/{id}/void"
      - "All GET list/read endpoints"

  - name: QualityAssurance
    description: "Product quality; assesses and resolves temperature excursions"
    identity: "opaque"
    exclusive_operations:
      - "POST /field-force/temperature-excursions/{id}/assess"
      - "POST /field-force/temperature-excursions/{id}/resolve"
    shared_operations: ["All GET list/read endpoints"]
