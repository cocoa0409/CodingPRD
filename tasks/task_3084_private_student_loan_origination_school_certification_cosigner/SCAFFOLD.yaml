    output: Disbursement
    side_effects: []

  - method: POST
    path: "/private-student-loans/disbursements/{id}/release"
    description: "Release scheduled funds to the school; the first release moves the loan APPROVED -> IN_SCHOOL"
    roles: [Servicer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["released_date stamped from the logical clock", "Loan.disbursed_amount_cents, principal_cents and current_balance_cents recomputed", "Loan.loan_status advances APPROVED -> IN_SCHOOL on the first release", "refund_status set to REFUND_DUE when the released total exceeds the loan's certified_amount_cents", "Loan.version incremented"]

  - method: DELETE
    path: "/private-student-loans/disbursements/{id}"
    description: "Cancel a scheduled disbursement"
    roles: [Servicer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["disbursement_status set to CANCELLED", "Loan.disburse_blocked recomputed"]

  - method: POST
    path: "/private-student-loans/disbursements/{id}/reschedule"
    description: "Re-schedule a failed disbursement for a fresh date"
    roles: [Servicer]
    code: 200
    input: [scheduled_date]
    output: Disbursement
    side_effects: ["disbursement_status reset to SCHEDULED", "Loan.disburse_blocked recomputed to false once no other blocker remains"]

  - method: POST
    path: "/private-student-loans/disbursements/{id}/school-refund"
    description: "Record the school's return of an over-disbursement, crediting the remainder back against the loan"
    roles: [School]
    code: 200
    input: [remainder_credited_cents]
    output: Disbursement
    side_effects: ["refund_status set to REFUNDED and remainder_credited_cents stored", "Loan.disbursed_amount_cents recomputed net of the refund", "Loan.principal_cents, current_balance_cents and certified_amount_cents recomputed", "Loan.disburse_blocked recomputed", "Loan.version incremented"]

  - method: POST
    path: "/private-student-loans/loans/{id}/forbearances"
    description: "Request and grant private-loan deferment or forbearance relief"
    roles: [Servicer, Borrower]
    code: 201
    input: [relief_type, months_requested, interest_treatment, start_date]
    output: ForbearanceDeferment
    side_effects: ["months_granted = min(months_requested, cap - cumulative_deferment_months)", "Loan.cumulative_deferment_months increased", "Loan.loan_status set to FORBEARANCE_DEFERMENT", "Loan.version incremented"]

  - method: GET
    path: "/private-student-loans/loans/{id}/forbearances"
    description: "List a loan's relief records"
    roles: [Borrower, Servicer]
    code: 200
    input: []
    output: ForbearanceDeferment[]
    side_effects: []

  - method: GET
    path: "/private-student-loans/forbearances/{id}"
    description: "Read a relief record"
    roles: [Borrower, Servicer]
    code: 200
    input: []
    output: ForbearanceDeferment
    side_effects: []

  - method: POST
    path: "/private-student-loans/loans/{id}/forbearances/{fid}/cancel"
    description: "Cancel a granted relief that has not yet started, restoring the prior loan status"
    roles: [Servicer]
    code: 200
    input: []
    output: ForbearanceDeferment
    side_effects: ["Loan.cumulative_deferment_months reduced by months_granted", "Loan.loan_status restored to IN_SCHOOL or REPAYMENT", "Loan.version incremented"]

  - method: POST
    path: "/private-student-loans/loans/{id}/cure"
    description: "Cure a delinquent loan back to repayment once every missed period has been superseded"
    roles: [Servicer]
    code: 200
    input: []
    output: Loan
    side_effects: ["Loan.days_past_due recomputed to 0", "Loan.delinquency_stage recomputed to CURRENT", "Borrower.on_time_payment_run_count recomputed as the unbroken run ending at the most recent cleared due period", "Loan.version incremented"]

  - method: POST
    path: "/private-student-loans/loans/{id}/declare-default"
    description: "Declare the loan in default once arrears reach the product threshold; notifies the cosigner"
    roles: [Servicer]
    code: 200
    input: []
    output: Loan
    side_effects: ["Loan.notice_obligation_status set to PENDING", "Cosigner.underwriting_status set to INELIGIBLE", "every open CosignerReleaseApplication child moves to DECLINED with deficiency_reason DELINQUENT_LOAN", "Loan.disburse_blocked set to true", "Loan.effective_rate_pct reverts to margin_rate_pct", "Loan.version incremented"]

  - method: POST
    path: "/private-student-loans/loans/{id}/rehabilitate"
    description: "Rehabilitate a defaulted loan back into repayment"
    roles: [Servicer]
    code: 200
    input: [rehabilitation_amount_cents]
    output: Loan
    side_effects: ["Loan.disburse_blocked set to false", "Loan.days_past_due recomputed to 0", "Loan.delinquency_stage recomputed to CURRENT", "Loan.loan_status set to REPAYMENT", "Loan.version incremented"]

  - method: GET
    path: "/private-student-loans/loans/{id}/summary"
    description: "Computed read: balance, accrual, delinquency and release-eligibility roll-up; days_past_due uses the as_of_clock accrual variant while period_close_days_past_due uses the at_period_close variant"
    roles: [Borrower, Cosigner, Servicer, Underwriter]
    code: 200
    input: []
    output: { current_balance_cents: integer, unpaid_interest_cents: integer, days_past_due: integer, period_close_days_past_due: integer, delinquency_stage: string, effective_rate_pct: number, certified_headroom_cents: integer, release_eligible: boolean, notice_obligation_status: string }
    side_effects: []

  - method: POST
    path: "/private-student-loans/loans/{id}/cosigner-release-applications"
    description: "File a cosigner release application, freezing the borrower's on-time payment run as of submission"
    roles: [Borrower, Cosigner]
    code: 201
    input: [cosigner_id, independent_credit_score, independent_dti_ratio]
    output: CosignerReleaseApplication
    side_effects: ["payments_at_application and run_at_submission frozen from the live borrower counter", "required_min_payments frozen from the product policy", "release_status advanced SUBMITTED -> UNDER_REVIEW", "Loan.version incremented"]

  - method: GET
    path: "/private-student-loans/loans/{id}/cosigner-release-applications"
    description: "List a loan's cosigner release applications"
    roles: [Borrower, Cosigner, Underwriter, Servicer]
    code: 200
    input: []
    output: CosignerReleaseApplication[]
    side_effects: []

  - method: GET
    path: "/private-student-loans/cosigner-release-applications/{id}"
    description: "Read a cosigner release application"
    roles: [Borrower, Cosigner, Underwriter, Servicer]
    code: 200
    input: []
    output: CosignerReleaseApplication
    side_effects: []

  - method: POST
    path: "/private-student-loans/cosigner-release-applications/{id}/decision"
    description: "Decide the independent re-underwriting for a cosigner release"
    roles: [Underwriter]
    code: 200
    input: [decision]
    output: CosignerReleaseApplication
    side_effects: ["cosigner_release_eligibility_score evaluated against RELEASE_SCORE_MIN", "on APPROVE sets Cosigner.underwriting_status RELEASED and clears Loan.cosigner_id", "on DECLINE sets deficiency_reason to the first failing gate in the order INSUFFICIENT_PAYMENTS, CREDIT_SCORE, DTI, DELINQUENT_LOAN", "Loan.version incremented"]

  - method: POST
    path: "/private-student-loans/cosigner-release-applications/{id}/reapply"
    description: "Re-present a declined cosigner release application after the payment run rebuilds"
    roles: [Borrower]
    code: 200
    input: []
    output: CosignerReleaseApplication
    side_effects: ["payments_at_application and run_at_submission refreshed from the live borrower counter", "deficiency_reason cleared", "release_status reset to SUBMITTED then advanced to UNDER_REVIEW"]

  - method: POST
    path: "/private-student-loans/cosigner-release-applications/{id}/withdraw"
    description: "Withdraw a cosigner release application before decision"
    roles: [Borrower]
    code: 200
    input: []
    output: CosignerReleaseApplication
    side_effects: ["release_status set to WITHDRAWN", "Loan.cosigner_id unchanged"]

  # --- logical clock (test-driving) -----------------------------------------
  - method: POST
    path: "/private-student-loans/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads the fixed server default 2026-09-01T00:00:00Z and never falls back to wall-clock time, so every deadline, grace window and aging rule is deterministic."
    roles: [PlatformAdmin, Servicer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["the logical clock advances; MISSED-payment sweeps, EXPIRED-certification sweeps and delinquency aging that the new instant crosses are evaluated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header absent, or X-User-Role names no declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "acting role is not permitted by §1.5 for this operation, or the acting X-User-ID is not the owner the endpoint's description pins" }
  - { id: ERR_BORROWER_NOT_FOUND, http: 404, condition: "borrower_id in path or body resolves to no Borrower" }
  - { id: ERR_COSIGNER_NOT_FOUND, http: 404, condition: "cosigner_id in path or body resolves to no Cosigner, or names one already in RELEASED status" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "school_id in path or body resolves to no School" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "policy_id in path or body resolves to no LoanPolicy" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id in path resolves to no LoanApplication" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan id in path resolves to no Loan" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "certification id in path resolves to no SchoolCertification" }
  - { id: ERR_LOAN_CHILD_NOT_FOUND, http: 404, condition: "the addressed RepaymentPlan, Payment, Disbursement or CosignerReleaseApplication does not exist or belongs to a different Loan than the one in the path" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required body field is missing, or an enum-valued field carries a value outside its declared enum set" }
  - { id: ERR_INVALID_CLOCK, http: 400, condition: "to_iso8601 is not a well-formed ISO 8601 UTC instant, or precedes the server default 2026-09-01T00:00:00Z" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state from which the requested operation is a declared §1.2 transition, including any operation attempted on a resource already in a terminal_states member" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_loan_version in the request body does not equal the Loan's current version" }
  - { id: ERR_SCHOOL_CAPACITY_EXCEEDED, http: 409, condition: "certifying would push the school's per-period certified total above School.certification_capacity_per_period_cents" }
  - { id: ERR_CERTIFICATION_PERIOD_CONFLICT, http: 409, condition: "certifying a second certification whose academic_period_label already carries a CERTIFIED or PARTIAL_CERTIFIED sibling on the same application" }
  - { id: ERR_DISBURSEMENT_BLOCKED, http: 409, condition: "a disbursement is created or released while Loan.disburse_blocked is true (outstanding REFUND_DUE, or the loan is DEFAULT or FORBEARANCE_DEFERMENT)" }
  - { id: ERR_DISBURSEMENT_WINDOW_OVERLAP, http: 409, condition: "the requested academic period window overlaps an existing non-CANCELLED Disbursement on the same Loan, with zero-gap adjacency counted as an overlap" }
  - { id: ERR_FORBEARANCE_OVERLAP, http: 409, condition: "the requested relief window overlaps an existing GRANTED relief on the same Loan, with a start exactly on another grant's end boundary counted as an overlap" }
  - { id: ERR_PLAN_REQUIRED, http: 409, condition: "entering repayment on a loan that holds no RepaymentPlan child in ACTIVE status" }
  - { id: ERR_COSIGNER_REQUIRED, http: 422, condition: "the application names no cosigner and the product policy does not permit a standalone borrower file" }
  - { id: ERR_CREDIT_DECLINED, http: 422, condition: "the FINAL variant of combined_credit_underwriting yields tier DECLINED" }
  - { id: ERR_AMOUNT_OUT_OF_RANGE, http: 422, condition: "a money amount falls outside its declared range — approved_amount_cents below 100000, monthly_payment_cents below 5000, remainder_credited_cents above the disbursement amount, or rehabilitation_amount_cents below three monthly payments" }
  - { id: ERR_CERTIFICATION_LIMIT_EXCEEDED, http: 422, condition: "the certification amount, or the running certified total across the application's CERTIFIED and PARTIAL_CERTIFIED children, exceeds the application's certified_limit_cents" }
  - { id: ERR_DISBURSEMENT_OVER_CERTIFIED, http: 422, condition: "a release's amount_cents exceeds Loan.certified_amount_cents minus Loan.disbursed_amount_cents" }
  - { id: ERR_DEFERMENT_CAP_EXCEEDED, http: 422, condition: "granting the relief would push Loan.cumulative_deferment_months above the applicable product cap" }
  - { id: ERR_PRODUCT_RULE_UNSUPPORTED, http: 422, condition: "the relief_type is outside the four declared private-loan relief types, or an EXTENDED plan's term_months exceeds policy.extended_term_months" }
  - { id: ERR_RELEASE_RUN_INSUFFICIENT, http: 422, condition: "the release application's frozen run_at_submission is below its required_min_payments" }
  - { id: ERR_RELEASE_UNDERWRITING_FAILED, http: 422, condition: "cosigner_release_eligibility_score below 500, or independent_credit_score below policy.cosigner_release_min_credit_score, or independent_dti_ratio above policy.cosigner_release_max_dti_ratio" }
  - { id: ERR_COSIGNER_NOT_ELIGIBLE, http: 422, condition: "the loan carries no cosigner, or the referenced cosigner's underwriting_status is not ELIGIBLE" }
  - { id: ERR_NOTICE_OBLIGATION_PENDING, http: 409, condition: "a cosigner-release approval is attempted while Loan.notice_obligation_status is PENDING" }
  - { id: ERR_LOAN_DELINQUENT, http: 422, condition: "the loan is in DELINQUENT or DEFAULT and cannot accept a release approval, a new disbursement schedule or an automatic-debit enrolment" }
  - { id: ERR_DEFAULT_THRESHOLD_NOT_MET, http: 422, condition: "declaring default while Loan.days_past_due, under the as_of_clock variant, is below 120" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Borrower
    description: "The student obligor; owns applications, loans and release applications derived from them"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /private-student-loans/loan-applications"
      - "POST /private-student-loans/loan-applications/{id}/reconsider"
      - "POST /private-student-loans/loan-applications/{id}/cancel"
      - "POST /private-student-loans/cosigner-release-applications/{id}/reapply"
      - "POST /private-student-loans/cosigner-release-applications/{id}/withdraw"
      - "POST /private-student-loans/loans/{id}/autodebit"
    shared_operations:
      - "POST /private-student-loans/borrowers/{id}/cosigners"
      - "POST /private-student-loans/loans/{id}/payments"
      - "POST /private-student-loans/loans/{id}/repayment-plans"
      - "POST /private-student-loans/loans/{id}/forbearances"
      - "POST /private-student-loans/loans/{id}/cosigner-release-applications"
      - "POST /private-student-loans/loans/{id}/deferment-projection"

  - name: Cosigner
    description: "A creditworthy third party backing one or more loans; may re-present its own figures and request release"
    identity: "entity_backed:Cosigner"
    exclusive_operations:
      - "POST /private-student-loans/cosigners/{id}/reunderwrite"
    shared_operations:
      - "POST /private-student-loans/loans/{id}/cosigner-release-applications"

  - name: School
    description: "An eligible institution that certifies enrollment and cost of attendance and returns over-disbursements"
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /private-student-loans/loan-applications/{id}/school-certifications"
      - "POST /private-student-loans/school-certifications/{id}/certify"
      - "POST /private-student-loans/school-certifications/{id}/reject"
      - "POST /private-student-loans/school-certifications/{id}/refile"
      - "POST /private-student-loans/loans/{id}/enrollment-status"
      - "POST /private-student-loans/disbursements/{id}/school-refund"
    shared_operations: []

  - name: Underwriter
    description: "Operator who runs combined credit evaluation and the independent cosigner-release re-underwriting"
    identity: "opaque"
    exclusive_operations:
      - "POST /private-student-loans/loan-applications/{id}/decision"
      - "POST /private-student-loans/cosigner-release-applications/{id}/decision"
    shared_operations:
      - "GET /private-student-loans/loans/{id}/summary"

  - name: Servicer
    description: "Operator who schedules disbursements, books accruals, approves plans, records and reverses payments and administers relief and default"
    identity: "opaque"
    exclusive_operations:
      - "POST /private-student-loans/loans/{id}/enter-repayment"
      - "POST /private-student-loans/loans/{id}/payment-schedule"
      - "POST /private-student-loans/loans/{id}/accrual-entries"
      - "POST /private-student-loans/repayment-plans/{id}/approve"
      - "POST /private-student-loans/repayment-plans/{id}/decline"
      - "POST /private-student-loans/payments/{id}/reverse"
      - "POST /private-student-loans/loans/{id}/disbursements"
      - "POST /private-student-loans/disbursements/{id}/release"
      - "DELETE /private-student-loans/disbursements/{id}"
      - "POST /private-student-loans/disbursements/{id}/reschedule"
      - "POST /private-student-loans/loans/{id}/forbearances/{fid}/cancel"
      - "POST /private-student-loans/loans/{id}/cure"
      - "POST /private-student-loans/loans/{id}/declare-default"
      - "POST /private-student-loans/loans/{id}/rehabilitate"
    shared_operations:
      - "POST /private-student-loans/loans/{id}/forbearances"
      - "POST /private-student-loans/loans/{id}/deferment-projection"
      - "POST /private-student-loans/_clock/set_current_utc"

  - name: PlatformAdmin
    description: "Operator who maintains reference data (borrowers, schools, product policies) and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /private-student-loans/schools"
      - "POST /private-student-loans/loan-policies"
      - "GET /private-student-loans/borrowers"
      - "GET /private-student-loans/schools"
      - "GET /private-student-loans/loan-policies"
    shared_operations:
      - "POST /private-student-loans/borrowers"
      - "POST /private-student-loans/borrowers/{id}/cosigners"
      - "POST /private-student-loans/_clock/set_current_utc"