      - name: missing_x_user_id_header_returns_unauthenticated_before_any_other_check
        claim_type: identity_binding
        grounds: ["errors.ERR_UNAUTHENTICATED", "errors.ERR_ROLE_IDENTITY_MISMATCH", "validations.priority_1", "validations.priority_3", "roles.Writer.identity"]
        distinguishing_aspect: "Three failure modes of the identity headers that must stay distinct and correctly ordered: an EMPTY-STRING X-User-ID is 401 at priority 1 (before role authorisation and before body validation, so a call that is ALSO unauthorised and ALSO malformed still reports 401); a syntactically valid but unknown id under an entity-backed role is 403 ERR_ROLE_IDENTITY_MISMATCH at priority 3; an opaque role never triggers the identity check at all."
