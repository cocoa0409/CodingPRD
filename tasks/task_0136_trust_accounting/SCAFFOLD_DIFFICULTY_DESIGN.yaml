# =============================================================================
# Task 0136 — Wealth Management & Trust Accounting
# Scaffold Difficulty Design (§1.8 Test Targeting Index)
#
# Every instance below grounds exclusively in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in `assert:` was computed by hand against the
# constants in calculations[].constants of SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: grantor_vs_non_grantor_trust_taxable_income
        grounds:
          - calculations.trust_taxable_income_computation
          - entities.Trust.fields.grantor_tax_status
          - entities.TaxYear.fields.trust_taxable_income
          - state_machines.TaxYear.CLOSING_to_CLOSED
        distinguishing_aspect: |
          Same TaxYear-level inputs (DNI=10000, executed_income_distributions=3000)
          produce trust_taxable_income=7000.00 under the non_grantor_variant
          (entity domain: TaxYear of an IRREVOCABLE non-grantor Trust) and
          trust_taxable_income=0.00 under the grantor_trust_variant (entity
          domain: TaxYear of a REVOCABLE grantor Trust). The dual-variant
          structure sits on the TaxYear entity, gated by Trust.grantor_tax_status.
        test_recipe:
          setup:
            - "POST /trusts with trust_type=IRREVOCABLE, grantor_tax_status=NON_GRANTOR, has_grantor_powers=false → Trust_A (DRAFT)"
            - "POST /trusts/{Trust_A}/trustees primary trustee T_A; beneficiary B_A (TIER_1); asset $0 (irrelevant)"
            - "POST /trusts/{Trust_A}/tax-years calendar_year=2026"
            - "POST /trusts/{Trust_A}/activate"
            - "POST /trusts/{Trust_A}/transactions txn_type=INCOME_ORDINARY amount=10000 transaction_date=2026-06-01 principal_or_income=INCOME"
            - "POST /trusts/{Trust_A}/distributions amount_income=3000 amount_principal=0 beneficiary_id=B_A scheduled_date=2026-06-15 distribution_type=DISCRETIONARY"
            - "POST /trusts/{Trust_A}/distributions/{D}/approve (by a DIFFERENT trustee user_id than proposer)"
            - "POST /trusts/{Trust_A}/distributions/{D}/execute"
            - "POST /_clock/advance to 2027-01-02"
            - "POST /trusts/{Trust_A}/tax-years/{TY_A}/begin-close"
            - "POST /trusts/{Trust_A}/tax-years/{TY_A}/finalize"
            - "Repeat the entire setup for Trust_B but with trust_type=REVOCABLE, grantor_tax_status=GRANTOR"
          trigger:
            - "GET /trusts/{Trust_A}/tax-years/{TY_A}"
            - "GET /trusts/{Trust_B}/tax-years/{TY_B}"
          assert:
            - "Trust_A TaxYear.trust_taxable_income == 7000.00"
            - "Trust_A TaxYear.trust_income_tax == 1246.00  # 3100*0.10 + (7000-3100)*0.24 = 310 + 936"
            - "Trust_B TaxYear.trust_taxable_income == 0.00"
            - "Trust_B TaxYear.trust_income_tax == 0.00"

      - name: skip_vs_non_skip_distribution_gst_tax
        grounds:
          - calculations.gst_taxable_classification
          - calculations.gst_tax_computation
          - calculations.gst_skip_person_determination
          - entities.Distribution.fields.gst_tax_amount
          - entities.Beneficiary.fields.is_skip_person
          - state_machines.Distribution.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Same Distribution inputs (total amount=1,000,000 USD) produce
          gst_tax_amount=356000.00 when entity domain is a Distribution to a
          GRANDCHILD beneficiary (is_skip_person=true) on a trust with
          gst_exemption_used=13500000 (only $110k exemption left), versus
          gst_tax_amount=0.00 when the same Distribution targets a CHILD
          beneficiary (is_skip_person=false). The dual-variant axis is the
          Beneficiary entity's classification, not the Distribution arithmetic.
        test_recipe:
          setup:
            - "Trust_C (NON_GRANTOR, IRREVOCABLE) with gst_exemption_used pre-set to 13_500_000 via prior executed taxable distributions"
            - "Beneficiary B_skip (relation_class=GRANDCHILD)"
            - "Beneficiary B_nonskip (relation_class=CHILD)"
            - "Trust funded with $5,000,000 principal CASH"
            - "POST distribution D_skip amount_principal=1_000_000 amount_income=0 beneficiary_id=B_skip"
            - "POST distribution D_nonskip amount_principal=1_000_000 amount_income=0 beneficiary_id=B_nonskip"
            - "Approve and execute both, in that order, by different trustee user_ids"
          trigger:
            - "GET /trusts/{Trust_C}/distributions/{D_skip}"
            - "GET /trusts/{Trust_C}/distributions/{D_nonskip}"
          assert:
            - "D_skip.gst_taxable == true"
            - "D_skip.gst_tax_amount == 356000.00  # (1_000_000 - 110_000) * 0.40"
            - "D_nonskip.gst_taxable == false"
            - "D_nonskip.gst_tax_amount == 0.00"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (≥2)
  # Modes used: (a) nonlinear formula and (c) circular-looking evaluation order
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_trust_income_tax_brackets   # mode (a) ≥3 inputs, tiered selection
        grounds:
          - calculations.trust_income_tax_computation
          - entities.TaxYear.fields.trust_income_tax
          - entities.TaxYear.fields.trust_taxable_income
        distinguishing_aspect: |
          Mode (a): a >=3-input, non-linear tiered-rate formula. trust_income_tax
          depends on trust_taxable_income, four bracket tops, and four marginal
          rates, with nested min/max selection per band. Rounding order is pinned
          to single-rounding-at-end-of-accumulation (NOT per band), which
          distinguishes it from per-band rounding.
        test_recipe:
          setup:
            - "Trust_T (NON_GRANTOR, IRREVOCABLE), 2026 TaxYear with INCOME_ORDINARY transactions summing to 20000 and no distributions"
            - "Activate, advance clock to 2027-01-02, begin-close, finalize"
          trigger:
            - "GET /trusts/{Trust_T}/tax-years/{TY_T}"
          assert:
            - "TaxYear.trust_taxable_income == 20000.00"
            - "TaxYear.trust_income_tax == 5435.50  # 3100*0.10 + (11150-3100)*0.24 + (15200-11150)*0.35 + (20000-15200)*0.37 = 310 + 1932 + 1417.50 + 1776.00"

      - name: gst_exemption_then_tax_evaluation_order   # mode (c) circular-looking
        grounds:
          - calculations.gst_taxable_classification
          - calculations.gst_tax_computation
          - entities.Trust.fields.gst_exemption_used
          - entities.Distribution.fields.gst_tax_amount
          - state_machines.Distribution.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. taxable_portion depends on
          Trust.gst_exemption_used (pre-execute value), but executing the
          distribution then writes back to Trust.gst_exemption_used. The
          scaffold pins evaluation order: (1) exemption applied first
          (consumed up to remaining cap), (2) tax computed on residual, (3)
          balances and gst_exemption_used updated atomically. Different
          ordering (e.g., computing tax against post-execute exemption_used)
          would over-tax. This is structurally different from mode (a) above.
        test_recipe:
          setup:
            - "Trust_E (NON_GRANTOR, IRREVOCABLE) with gst_exemption_used=13_609_999.00 (1.00 of exemption remaining)"
            - "Skip-person beneficiary B_g (GRANDCHILD)"
            - "$100 principal CASH asset"
            - "Propose Distribution D amount_principal=10.00 amount_income=0 beneficiary_id=B_g"
            - "Approve D by a second trustee"
          trigger:
            - "POST /trusts/{Trust_E}/distributions/{D}/execute"
            - "GET /trusts/{Trust_E}"
            - "GET /trusts/{Trust_E}/distributions/{D}"
          assert:
            - "Trust.gst_exemption_used == 13610000.00  # exemption fully consumed (1.00 applied first)"
            - "Distribution.gst_tax_amount == 3.60  # (10.00 - 1.00) * 0.40"
            - "Distribution.gst_taxable == true"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: tax_year_amendment_cycle
        grounds:
          - state_machines.TaxYear.CLOSED_to_AMENDED
          - state_machines.TaxYear.AMENDED_to_CLOSED
          - state_machines.TaxYear.CLOSING_to_CLOSED
          - entities.TaxYear.fields.status
        distinguishing_aspect: |
          TaxYear is cyclic: CLOSED→AMENDED→CLOSED is a real round-trip cycle
          (not just two terminal branches), and the same TaxYear row may
          oscillate between CLOSED and AMENDED multiple times. This is a cycle
          on the TaxYear entity.
        test_recipe:
          setup:
            - "Trust_R (NON_GRANTOR, IRREVOCABLE), 2026 TaxYear with INCOME_ORDINARY 5000, no distributions"
            - "Activate, advance clock to 2027-01-02, begin-close, finalize → status=CLOSED"
          trigger:
            - "POST /trusts/{Trust_R}/tax-years/{TY_R}/amend"
            - "POST /trusts/{Trust_R}/tax-years/{TY_R}/finalize"
            - "POST /trusts/{Trust_R}/tax-years/{TY_R}/amend"
            - "GET /trusts/{Trust_R}/tax-years/{TY_R}"
          assert:
            - "After first amend: TaxYear.status == 'AMENDED'"
            - "After re-finalize: TaxYear.status == 'CLOSED'"
            - "After second amend: TaxYear.status == 'AMENDED'  # cycle confirmed"

      - name: k1_supersession_cycle
        grounds:
          - state_machines.K1.DRAFT_to_ISSUED
          - state_machines.K1.ISSUED_to_SUPERSEDED
          - entities.K1.fields.status
          - entities.K1.fields.snapshot_distribution_version_sum
        distinguishing_aspect: |
          K1 entity has a cyclic shape via creation of fresh DRAFTs that
          re-enter ISSUED while the previous ISSUED copies move to SUPERSEDED.
          Across one TaxYear amendment cycle, a beneficiary accumulates
          multiple K1 rows whose statuses traverse DRAFT→ISSUED→SUPERSEDED.
          Distinct entity from TaxYear (different `entity:` in state_machines).
        test_recipe:
          setup:
            - "Same Trust_R and Beneficiary B_R as above, after first finalize there is K1_v1 in ISSUED"
          trigger:
            - "POST /trusts/{Trust_R}/tax-years/{TY_R}/amend  # K1_v1 → SUPERSEDED, K1_v2 created in DRAFT"
            - "POST /trusts/{Trust_R}/tax-years/{TY_R}/finalize  # K1_v2 → ISSUED"
            - "GET /trusts/{Trust_R}/tax-years/{TY_R}/k1s?beneficiary_id={B_R}"
          assert:
            - "K1 list contains exactly 2 rows for B_R"
            - "Exactly one with status == 'ISSUED' (the new one)"
            - "Exactly one with status == 'SUPERSEDED' (the prior one)"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (≥2)
  # Each cascade must be A→B→C where each link is caused by the previous link.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: distribution_execute_chain_depth_3
        grounds:
          - state_machines.Distribution.APPROVED_to_EXECUTED
          - calculations.trust_balance_recomputation
          - calculations.k1_dni_allocation
          - entities.Trust.fields.income_balance
          - entities.K1.fields.ordinary_income_share
        distinguishing_aspect: |
          Trigger A: Distribution.execute. Link 1: Distribution status flips to
          EXECUTED. Link 2 (CAUSED BY Link 1, not the trigger): Trust.income_balance
          is debited by amount_income. Link 3 (CAUSED BY Link 2's
          balance/distribution-change, not by the original execute call):
          K1 DRAFT for this Beneficiary in this TaxYear is recomputed
          (ordinary_income_share, total_distributed). Depth = 3.
        test_recipe:
          setup:
            - "Trust_D (NON_GRANTOR, IRREVOCABLE), 2026 TaxYear, $50000 INCOME_ORDINARY booked, $50000 income_balance"
            - "Beneficiary B_D (TIER_1)"
            - "Propose Distribution amount_income=20000 (and approve by second trustee)"
          trigger:
            - "POST /trusts/{Trust_D}/distributions/{D}/execute"
            - "GET /trusts/{Trust_D}"
            - "GET /trusts/{Trust_D}/distributions/{D}"
            - "GET /trusts/{Trust_D}/tax-years/{TY_D}/k1s?beneficiary_id={B_D}"
          assert:
            - "Distribution.status == 'EXECUTED'                # link 1"
            - "Trust.income_balance == 30000.00                 # link 2: 50000 - 20000"
            - "K1 row.total_distributed == 20000.00             # link 3 (DRAFT recompute)"
            - "K1 row.ordinary_income_share == 20000.00         # because DNI=50000, tier_1_total=20000, B_share=20000"

      - name: trust_revoke_chain_depth_3
        grounds:
          - state_machines.Trust.ACTIVE_to_REVOKED
          - calculations.trust_balance_recomputation
          - entities.Asset.fields.status
          - entities.Beneficiary.fields.status
        distinguishing_aspect: |
          Different trigger from instance 1: Trust.revoke. Link 1: Trust status
          flips to REVOKED. Link 2 (CAUSED BY Link 1, the revoke effect on
          children): all FUNDED Assets transition to DISTRIBUTED. Link 3
          (CAUSED BY Link 2's asset reclassification, not by the revoke call):
          Trust.principal_balance and income_balance are recomputed to 0
          via trust_balance_recomputation. Depth = 3. Different trigger
          transition from the distribution_execute chain.
        test_recipe:
          setup:
            - "Trust_X (REVOCABLE), 2026 TaxYear, primary trustee, beneficiary B_X (ACTIVE), funded with $100k principal CASH asset, no distributions"
            - "Activate Trust_X"
          trigger:
            - "POST /trusts/{Trust_X}/revoke"
            - "GET /trusts/{Trust_X}"
            - "GET /trusts/{Trust_X}/assets/{A_X}"
            - "GET /trusts/{Trust_X}/beneficiaries/{B_X}"
          assert:
            - "Trust.status == 'REVOKED'                        # link 1"
            - "Asset.status == 'DISTRIBUTED'                    # link 2"
            - "Beneficiary.status == 'TERMINATED'               # link 2 (sibling cascade)"
            - "Trust.principal_balance == 0.00                  # link 3"
            - "Trust.income_balance == 0.00                     # link 3"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_approve
        grounds:
          - validations[priority=6]    # state: ERR_INVALID_STATE
          - validations[priority=7]    # business_referential: ERR_BENEFICIARY_TERMINATED
          - state_machines.Distribution.PROPOSED_to_APPROVED
          - state_machines.Beneficiary.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          On POST .../distributions/{id}/approve, two failures coexist:
          Distribution.status is already EXECUTED (state, priority 6) AND
          Beneficiary.status is TERMINATED (business_referential, priority 7).
          Priority 6 wins → ERR_INVALID_STATE, not ERR_BENEFICIARY_TERMINATED.
          Categories pair: state vs business_referential.
        test_recipe:
          setup:
            - "Trust_P, beneficiary B_P, propose+approve+execute a Distribution D (status=EXECUTED)"
            - "Then terminate B_P (B_P.status=TERMINATED)"
          trigger:
            - "POST /trusts/{Trust_P}/distributions/{D}/approve  # double-failure: wrong state AND beneficiary terminated"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'  # state (priority 6) wins over business_referential (priority 7)"

      - name: business_safety_vs_business_fiscal_on_approve
        grounds:
          - validations[priority=8]    # business_safety: ERR_SEGREGATION_OF_DUTIES
          - validations[priority=16]   # business_fiscal: ERR_INSUFFICIENT_INCOME
          - state_machines.Distribution.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          On approve, the proposer attempts self-approval AND the requested
          amount_income exceeds Trust.income_balance. Both fail; priority 8
          (business_safety) wins over priority 16 (business_fiscal). Different
          error-category pair from the first instance (which paired state vs
          business_referential), satisfying the differentiation clause.
        test_recipe:
          setup:
            - "Trust_Q with income_balance=100.00"
            - "Beneficiary B_Q (ACTIVE), Trustee T_Q (also acts as proposer)"
            - "Propose Distribution D amount_income=500.00 by user T_Q"
          trigger:
            - "POST /trusts/{Trust_Q}/distributions/{D}/approve with X-User-ID=T_Q  # same user → SoD; also insufficient income"
          assert:
            - "Response status == 403"
            - "data.error_id == 'ERR_SEGREGATION_OF_DUTIES'  # business_safety (priority 8) wins over business_fiscal (priority 16)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: gst_skip_person_age_boundary
        grounds:
          - calculations.gst_skip_person_determination
          - entities.Beneficiary.fields.is_skip_person
          - entities.Beneficiary.fields.birth_date
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /trusts/{id}/beneficiaries: a
          NON_LINEAL beneficiary born exactly 37.5 years after the grantor's
          inception_date (constant GST_GENERATION_GAP_YEARS=37.5) is
          is_skip_person=true (>=); 37.49 years is false. Endpoint: beneficiary
          creation. Metric: age difference in years.
        test_recipe:
          setup:
            - "Trust_G with inception_date=2026-01-01"
          trigger:
            - "POST /trusts/{Trust_G}/beneficiaries  full_name='Exact', relation_class=NON_LINEAL, birth_date=2063-07-02 (37.5 years later, age_diff_years==37.50)"
            - "POST /trusts/{Trust_G}/beneficiaries  full_name='Just under', relation_class=NON_LINEAL, birth_date=2063-07-01 (slightly less than 37.5 years, age_diff_years≈37.4986)"
          assert:
            - "First Beneficiary.is_skip_person == true   # >=37.5 is skip"
            - "Second Beneficiary.is_skip_person == false  # 37.4986 < 37.5"

      - name: empty_active_beneficiary_set_at_activation
        grounds:
          - validations[priority=13]
          - state_machines.Trust.DRAFT_to_ACTIVE
          - entities.Beneficiary.fields.status
        distinguishing_aspect: |
          Empty-set boundary on POST /trusts/{id}/activate: the precondition
          requires at-least-one ACTIVE Beneficiary. Zero ACTIVE beneficiaries
          (count == 0) is the boundary. Different metric (count of ACTIVE
          beneficiaries) AND different endpoint (activate) from the age-boundary
          instance above, satisfying the differentiation clause.
        test_recipe:
          setup:
            - "Trust_Z DRAFT with one primary trustee, ZERO beneficiaries, an OPEN 2026 TaxYear, inception_date=2026-01-01"
          trigger:
            - "POST /trusts/{Trust_Z}/activate"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_NO_BENEFICIARY'"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: distribution_approve_requires_tax_year_open
        grounds:
          - state_machines.Distribution.PROPOSED_to_APPROVED
          - state_machines.TaxYear.OPEN_to_CLOSING
          - entities.TaxYear.fields.status
          - entities.Distribution.fields.tax_year_id
        distinguishing_aspect: |
          Distribution's PROPOSED→APPROVED transition depends on the related
          TaxYear's status (TaxYear must be OPEN). Entity pair: Distribution → TaxYear.
        test_recipe:
          setup:
            - "Trust_H ACTIVE (NON_GRANTOR), beneficiary B_H, propose Distribution D in 2026 TaxYear"
            - "Advance clock to 2027-01-02; POST .../tax-years/{TY_H}/begin-close → TY_H.status=CLOSING"
          trigger:
            - "POST /trusts/{Trust_H}/distributions/{D}/approve"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_TAX_YEAR_NOT_OPEN'"

      - name: trust_terminate_requires_no_funded_assets
        grounds:
          - state_machines.Trust.ACTIVE_to_TERMINATED
          - entities.Asset.fields.status
          - validations[priority=18]
        distinguishing_aspect: |
          Trust's ACTIVE→TERMINATED transition depends on every related Asset's
          status being NOT FUNDED. Entity pair: Trust → Asset. Different pair
          from instance 1 (Distribution → TaxYear), satisfying the differentiation
          clause.
        test_recipe:
          setup:
            - "Trust_T ACTIVE with one Asset A_T status=FUNDED, principal_balance > 0"
            - "Advance clock and close TaxYear so the year-state precondition passes"
          trigger:
            - "POST /trusts/{Trust_T}/terminate"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_HAS_UNDISTRIBUTED_ASSETS'  # asset still FUNDED blocks parent termination"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: transaction_date_must_lie_inside_open_tax_year_inclusive
        grounds:
          - validations[priority=10]
          - entities.Transaction.fields.transaction_date
          - entities.TaxYear.fields.start_date
          - entities.TaxYear.fields.end_date
          - entities.TaxYear.fields.status
        distinguishing_aspect: |
          Interval semantics: transaction_date is matched against TaxYear's
          [start_date, end_date] CLOSED interval (inclusive both ends). The
          containing TaxYear must additionally be OPEN or CLOSING (status filter
          over set of years). A transaction on 2026-12-31T23:59:59.000Z lands
          in 2026; on 2027-01-01T00:00:00.000Z lands in 2027. The 2026 boundary
          end_date == 2026-12-31T23:59:59.999Z. Resource: TaxYear.
        test_recipe:
          setup:
            - "Trust_M ACTIVE, 2026 TaxYear status=CLOSED, 2027 TaxYear status=OPEN"
          trigger:
            - "POST /trusts/{Trust_M}/transactions transaction_date=2026-12-31T12:00:00.000Z txn_type=INCOME_ORDINARY amount=1.00 principal_or_income=INCOME"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_TAX_YEAR_CLOSED'  # date falls in the CLOSED 2026 year; closed-interval inclusion is what catches it"

      - name: amend_chain_no_later_closed_year
        grounds:
          - validations[priority=12]
          - state_machines.TaxYear.CLOSED_to_AMENDED
          - entities.TaxYear.fields.calendar_year
          - entities.TaxYear.fields.status
        distinguishing_aspect: |
          Different interval semantics from the transaction-date instance:
          this is an ORDINAL overlap rule across discrete year tokens, not a
          datetime interval. amend(year=N) is rejected iff any year' > N
          exists with status==CLOSED. The "overlap" is on the half-open
          ordinal interval (N, +∞) of subsequent closed years. Resource: TaxYear
          (same entity type, but different interval arithmetic — ordinal vs
          closed datetime), satisfying the differentiation clause on interval
          semantics.
        test_recipe:
          setup:
            - "Trust_N ACTIVE with 2025 TaxYear status=CLOSED and 2026 TaxYear status=CLOSED"
          trigger:
            - "POST /trusts/{Trust_N}/tax-years/{TY_2025}/amend"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_NEWER_YEAR_CLOSED'  # 2026 > 2025 is already CLOSED"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: propose_then_reject_preserves_trust_balances
        grounds:
          - state_machines.Distribution.PROPOSED_to_REJECTED
          - calculations.trust_balance_recomputation
          - entities.Trust.fields.principal_balance
          - entities.Trust.fields.income_balance
        distinguishing_aspect: |
          Conserved quantity: (Trust.principal_balance + Trust.income_balance).
          Forward action: POST /distributions (PROPOSED). Compensating action:
          POST /distributions/{id}/reject (PROPOSED→REJECTED, no balance debits
          ever happened because EXECUTED was never reached). Invariant:
          balances after reject == balances before propose. Formula pinned:
          Trust.principal_balance' + Trust.income_balance' ==
          Trust.principal_balance + Trust.income_balance.
        test_recipe:
          setup:
            - "Trust_K ACTIVE, principal_balance=10000.00, income_balance=2000.00, beneficiary B_K"
          trigger:
            - "POST /trusts/{Trust_K}/distributions amount_principal=500 amount_income=300"
            - "POST /trusts/{Trust_K}/distributions/{D}/reject"
            - "GET /trusts/{Trust_K}"
          assert:
            - "Trust.principal_balance == 10000.00  # unchanged"
            - "Trust.income_balance == 2000.00      # unchanged"
            - "Trust.principal_balance + Trust.income_balance == 12000.00  # conservation"

      - name: amend_then_refinalize_preserves_total_distributions_to_beneficiary
        grounds:
          - state_machines.TaxYear.CLOSED_to_AMENDED
          - state_machines.TaxYear.AMENDED_to_CLOSED
          - entities.K1.fields.total_distributed
          - state_machines.K1.DRAFT_to_ISSUED
          - state_machines.K1.ISSUED_to_SUPERSEDED
        distinguishing_aspect: |
          Different conserved quantity from the balance invariant:
          sum(K1.total_distributed over ISSUED K-1s for one beneficiary in
          one TaxYear) MUST be unchanged across a CLOSED→AMENDED→CLOSED cycle
          if no Distributions were added or modified between the two finalizes.
          Forward: finalize. Compensating: amend+finalize again. Invariant:
          ISSUED K1.total_distributed for B in TY (new) == ISSUED
          K1.total_distributed for B in TY (old). Quantity type: per-beneficiary
          distributed dollars, distinct from trust-level balance sum.
        test_recipe:
          setup:
            - "Trust_W (NON_GRANTOR, IRREVOCABLE), 2026 TaxYear, beneficiary B_W (TIER_1)"
            - "$10000 INCOME_ORDINARY booked, $4000 income distribution executed to B_W"
            - "Advance clock to 2027-01-02, begin-close, finalize → K1_v1 ISSUED with total_distributed=4000.00"
          trigger:
            - "POST /trusts/{Trust_W}/tax-years/{TY_W}/amend"
            - "POST /trusts/{Trust_W}/tax-years/{TY_W}/finalize  # no new distributions, no new transactions"
            - "GET /trusts/{Trust_W}/tax-years/{TY_W}/k1s?beneficiary_id={B_W}&status=ISSUED"
          assert:
            - "There is exactly one K1 in ISSUED for B_W in TY_W"
            - "K1.total_distributed == 4000.00  # unchanged across amend+refinalize cycle (compensating invariant)"
