        excluded_because:
          difficulty_instance: compensating_invariant / stock_capital_conservation_across_fund_repay_repurchase
          rationale: "The reverse leg (repay releasing collateral and pushing the activity subscription back toward redemption, restoring the conserved capital total) is asserted as a conservation identity in that §1.8 instance."

  # =========================================================================
  # SECTION 3 — CALCULATIONS
  # =========================================================================
  - section: calculations
    instances:
      - name: tier_three_cap_applied_to_lendable_collateral
        claim_type: correct_result
        grounds: ["calculations.borrowing_capacity", "calculations.lendable_collateral_value"]
        distinguishing_aspect: "A tier-3 member gets only 7500 bps of lendable collateral: 15,600,000 of lendable value yields 11,700,000 of capacity, not the full 15,600,000 a tier-1 member would get from the identical asset."
        test_recipe:
          setup: ["Cascade Mutual, COMMERCIAL_BANK, total assets 5,000,000,000, credit_rating_tier 3, BLANKET_LIEN pledge executed, one ELIGIBLE SF_MORTGAGE with upb 20,000,000 / market value 21,000,000 / ltv 7500 / appraised 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Cascade Mutual", charter_type: "COMMERCIAL_BANK", total_assets_cents: 5000000000, credit_rating_tier: 3 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
          trigger:
            call: "GET /fhlb/member-banks/${member_id}/borrowing-capacity"
            payload: { variant: "CERTIFIED" }
            as: CreditOfficer
          assert:
            - "HTTP 200 with data.variant == \"CERTIFIED\", data.lendable_collateral_value_cents == 15600000, data.tier_cap_bps == 7500"
            - "data.capacity_base_cents == 11700000, data.outstanding_advances_cents == 0, data.commitments_cents == 0, data.borrowing_capacity_cents == 11700000"
            - "data.statutory_cap_cents == 1500000000 (3000 bps of 5,000,000,000), so the tier cap is the binding constraint"
            - "the asset's own lendable_value_cents is still 15600000 — the tier cap lives on the member, not on the asset"

      - name: statutory_thirty_percent_cap_binds_below_tier_cap
        claim_type: constants_applied
        grounds: ["calculations.borrowing_capacity (STATUTORY_CAP_BPS 3000, TIER_CAP_BPS)"]
        distinguishing_aspect: "The capacity base is a min() of two caps: for a small member (total assets 100,000,000) pledging 39,000,000 of lendable collateral, the 30 percent statutory cap of 30,000,000 binds even at tier 1, where the tier cap would allow the full 39,000,000."
        test_recipe:
          setup: ["Tiny Mutual, CREDIT_UNION, total assets 100,000,000, credit_rating_tier 1, BLANKET_LIEN pledge, one ELIGIBLE SF_MORTGAGE with upb 50,000,000 / market value 52,000,000 / ltv 7000 → factor 7800 → lendable 39,000,000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Tiny Mutual", charter_type: "CREDIT_UNION", total_assets_cents: 100000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 50000000, market_value_cents: 52000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
          trigger:
            call: "GET /fhlb/member-banks/${member_id}/borrowing-capacity"
            payload: { variant: "CERTIFIED" }
            as: CreditOfficer
          assert:
            - "data.lendable_collateral_value_cents == 39000000 and data.tier_cap_bps == 10000"
            - "data.statutory_cap_cents == 30000000 and data.capacity_base_cents == 30000000 — NOT 39000000"
            - "data.borrowing_capacity_cents == 30000000"
            - "the same fixture at credit_rating_tier 4 gives capacity_base_cents == 19500000 (5000 bps of lendable), proving the min() switches sides"

      - name: ltv_exactly_at_max_stays_eligible_with_high_ltv_penalty
        claim_type: constants_applied
        grounds: ["calculations.asset_discount_factor (LTV_PENALTY_THRESHOLD_BPS 8000, LTV_PENALTY_BPS 500, LTV_MAX_BPS 9500)", "validations.ltv-within-max"]
        distinguishing_aspect: "9500 bps is the inclusive eligibility ceiling and simultaneously above the 8000 bps penalty threshold, so the asset must be approved AND penalised: factor 7800 - 500 = 7300 on a 20,000,000 basis, i.e. 14,600,000."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge and one submitted SF_MORTGAGE at ltv exactly 9500 (upb 20,000,000, market value 21,000,000, appraised 2026-06-01, documentation COMPLETE, 0 days delinquent)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 9500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
            payload: {}
            as: CreditOfficer
          assert:
            - "HTTP 200 with data.status == \"ELIGIBLE\" and data.ineligibility_reason == \"NONE\""
            - "data.discount_factor_bps == 7300 and data.lendable_value_cents == 14600000"
            - "an otherwise identical asset at ltv_bps 9501 is refused with HTTP 409 ERR_LTV_EXCEEDS_MAX and stays UNDER_REVIEW"
            - "an otherwise identical asset at ltv_bps 8000 keeps factor 7800 / lendable 15600000, proving the penalty needs a STRICT excess over 8000"

      - name: delinquency_exactly_sixty_days_forces_ineligible_while_fifty_nine_only_penalises
        claim_type: constants_applied
        grounds: ["calculations.asset_discount_factor (DELINQUENCY_PENALTY_DAYS 30, DELINQUENCY_PENALTY_BPS 1000, DELINQUENCY_INELIGIBLE_DAYS 60)", "validations.delinquency-within-max"]
        distinguishing_aspect: "Delinquency has two constants pointing in opposite directions: 59 days is a priced defect (factor 7800 - 1000 = 6800, lendable 13,600,000) while 60 days is a hard rejection, so the boundary is exclusive on eligibility and inclusive on the penalty."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge, one submitted SF_MORTGAGE at 59 days delinquent and a second identical asset at 60 days (both upb 20,000,000, market value 21,000,000, ltv 7500)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, delinquency_days: 60, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sixty: "$.data.id" }
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, delinquency_days: 59, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_fiftynine: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_fiftynine}/review-eligibility"
            payload: {}
            as: CreditOfficer
          assert:
            - "the 59-day asset is ELIGIBLE with discount_factor_bps == 6800 and lendable_value_cents == 13600000"
            - "POST /fhlb/collateral-assets/{asset_sixty}/review-eligibility returns HTTP 409 ERR_DELINQUENT_ASSET_INELIGIBLE and leaves that asset UNDER_REVIEW with lendable 0"
            - "MemberBank.lendable_collateral_value_cents == 13600000 — only the eligible asset contributes"
            - "an asset at 29 days delinquent keeps factor 7800, proving the penalty threshold is inclusive at 30"

      - name: discount_factor_clamped_at_two_thousand_bps_floor
        claim_type: correct_result
        grounds: ["calculations.asset_discount_factor (FLOOR_FACTOR_BPS 2000, additive penalties in declared order)"]
        distinguishing_aspect: "Three stacked penalties on a SMALL_BUSINESS blanket base of 4000 bps compute to 1800 bps (4000 - 500 - 1000 - 700), which the 2000 bps floor must clamp upward, so the lendable value is 2,000,000 rather than 1,800,000."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge and one submitted SMALL_BUSINESS asset: upb 10,000,000, market value 12,000,000, ltv 8500, 45 days delinquent, documentation EXCEPTION."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SMALL_BUSINESS", unpaid_principal_balance_cents: 10000000, market_value_cents: 12000000, ltv_bps: 8500, delinquency_days: 45, documentation_status: "EXCEPTION", appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sb: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_sb}/review-eligibility"
            payload: {}
            as: CreditOfficer
          assert:
            - "HTTP 200 with data.status == \"ELIGIBLE\", data.discount_factor_bps == 2000 (NOT 1800 and NOT negative)"
            - "data.collateral_basis_cents == 10000000 (min of upb and market value) and data.lendable_value_cents == 2000000"
            - "MemberBank.lendable_collateral_value_cents == 2000000 and borrowing_capacity_cents == 2000000"

      - name: stale_appraisal_penalty_applies_to_cre_but_not_sf_mortgage
        claim_type: input_set_filtering
        grounds: ["calculations.asset_discount_factor (STALE_APPRAISAL_DAYS 365, STALE_APPRAISAL_PENALTY_BPS 300, restricted to CRE and MULTIFAMILY)"]
        distinguishing_aspect: "The staleness penalty is asset-class-gated: with the clock at 2026-08-01 an appraisal dated 2024-01-15 is stale for both assets, yet only the CRE asset loses 300 bps (5500 to 5200) while the SF_MORTGAGE keeps its full 7800."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge, one SF_MORTGAGE and one CRE asset, both appraised 2024-01-15 (563 days before the clock), both ltv 7000, 0 days delinquent, documentation COMPLETE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7000, appraisal_date: "2024-01-15T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "CRE", unpaid_principal_balance_cents: 50000000, market_value_cents: 52000000, ltv_bps: 7000, appraisal_date: "2024-01-15T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_cre: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_cre}/review-eligibility"
            payload: {}
            as: CreditOfficer
          assert:
            - "the CRE asset is ELIGIBLE with discount_factor_bps == 5200 (5500 - 300) and lendable_value_cents == 26000000"
            - "GET /fhlb/collateral-assets/{asset_sf} still reports discount_factor_bps == 7800 and lendable_value_cents == 15600000 — no staleness penalty for SF_MORTGAGE"
            - "MemberBank.lendable_collateral_value_cents == 41600000"
            - "a CRE asset appraised exactly 365 days before the clock (2025-08-01) keeps 5500, proving the comparison is a strict > 365 days"

      - name: securities_basis_uses_market_value_not_unpaid_principal
        claim_type: input_set_filtering
        grounds: ["calculations.lendable_collateral_value (collateral_basis_cents branch for AGENCY_MBS and TREASURY)", "calculations.asset_discount_factor (TREASURY SPECIFIC 9500)"]
        distinguishing_aspect: "Securities are valued off market value while loans are valued off min(upb, market value): a TREASURY position with upb left at its default 0 must still produce a 10,000,000 basis and 9,500,000 of lendable value, where the loan branch would have produced 0."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a SPECIFIC_LISTING pledge (securities may not be pledged under a blanket lien) and one submitted TREASURY position of market value 10,000,000 with unpaid_principal_balance_cents omitted."]
          setup_api_calls:
