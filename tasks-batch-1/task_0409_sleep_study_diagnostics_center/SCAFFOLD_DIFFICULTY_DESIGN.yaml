# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Sleep Study & Diagnostics Center — task_0409
# Nine §0.5 rules, >= 2 instances each. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. setup_api_calls/trigger are structured, lint-clean.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ahi_divide_then_round_vs_round_then_divide
        grounds:
          - calculations.ahi_index
          - calculations.severity_band
          - entities.StudyOrder.fields.ahi
          - state_machines.StudyOrder.IN_PROGRESS_to_SCORED
        distinguishing_aspect: |
          On StudyOrder, the pinned divide-then-round order (recording_hours =
          minutes/60 exact, THEN round events/hours to 1 dp) yields ahi=12.5 for
          240 min / 50 events; a round-then-divide reading (round hours to 4h
          then divide) would give 50/4=12.5 too, so we pin a case where they
          diverge: 250 min / 50 events -> 50/(250/60)=12.0 exact vs rounding
          hours to 4 -> 12.5. We assert the divide-then-round literal 12.0.
        test_recipe:
          setup:
            - "Authorized referral (no prior auth required), an HSAT StudyOrder scheduled then started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ana Diaz", date_of_birth: "1980-02-02", insurance_payer: "Acme", baseline_epworth_score: 14 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1111111111", requested_modality: "HSAT", clinical_indication: "suspected_OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id, ref_v: $.data.version }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-1", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
          trigger:
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 250, respiratory_event_count: 50, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
              captures: { so_v_after: $.data.version }
          assert:
            - "StudyOrder.${so_id}.ahi == 12.0"
            - "StudyOrder.${so_id}.severity == MILD"
            - "StudyOrder.${so_id}.status == SCORED"

      - name: adherence_window_gate_first_vs_evaluate_all
        grounds:
          - calculations.cpap_adherence
          - entities.ComplianceRecord.fields.adherent
          - endpoints.POST./compliance-records
        distinguishing_aspect: |
          On ComplianceRecord, the window_days short-circuit variant gates FIRST:
          a 20-day window with 25 strong nights returns adherent=false purely on
          the window gate, even though the usage clauses (nights>=21, pct>=0.70,
          avg>=240) would otherwise pass. A naive evaluate-all variant that
          skips the gate would return true. Different entity domain than ahi.
        test_recipe:
          setup:
            - "A fulfilled DMEOrder whose modem reports a 20-day window with 25 strong nights."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ben Cole", date_of_birth: "1975-03-03", insurance_payer: "Acme", baseline_epworth_score: 12 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2222222222", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-2", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 120, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
              captures: { sr_dummy: $.data.version }
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
            - call: "POST /scoring-reports/${sr_id}/interpret"
              payload: { interpretation_text: "Moderate OSA, recommend CPAP", physician_recommends_cpap: true }
              as: Physician
            - call: "POST /dme-orders"
              payload: { study_order_id: "${so_id}", device_type: "CPAP", prescribed_pressure_cmh2o: 9.0 }
              as: DMECoordinator
              captures: { dme_id: $.data.id }
            - call: "POST /dme-orders/${dme_id}/submit"
              payload: {}
              as: DMECoordinator
            - call: "POST /dme-orders/${dme_id}/fulfill"
              payload: {}
              as: DMECoordinator
          trigger:
            - call: "POST /compliance-records"
              payload: { dme_order_id: "${dme_id}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-08-21T00:00:00Z", nights_used_4h_plus: 25, total_usage_minutes: 7500 }
              as: DMECoordinator
              captures: { cr_id: $.data.id }
          assert:
            - "ComplianceRecord.${cr_id}.adherent == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: adherence_three_input_nonlinear_compound_and
        grounds:
          - calculations.cpap_adherence
          - entities.ComplianceRecord.fields.adherent
          - endpoints.POST./compliance-records
        distinguishing_aspect: |
          Mode (a): cpap_adherence couples THREE inputs (window_days, nights,
          total_usage_minutes) non-linearly via compound AND of three clauses
          (nights>=21 AND pct>=0.70 AND avg>=240) gated by window_days>=30.
          A 30-day window, 22 nights, 5060 total minutes -> avg=230 < 240, so
          adherent=false even though nights and pct clauses pass.
        test_recipe:
          setup:
            - "A fulfilled DMEOrder; modem reports 30-day window, 22 strong nights, 5060 total minutes (avg 230)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cy Fox", date_of_birth: "1970-04-04", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "3333333333", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-3", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 200, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
            - call: "POST /scoring-reports/${sr_id}/interpret"
              payload: { interpretation_text: "Severe OSA, CPAP", physician_recommends_cpap: true }
              as: Physician
            - call: "POST /dme-orders"
              payload: { study_order_id: "${so_id}", device_type: "CPAP", prescribed_pressure_cmh2o: 10.0 }
              as: DMECoordinator
              captures: { dme_id: $.data.id }
            - call: "POST /dme-orders/${dme_id}/submit"
              payload: {}
              as: DMECoordinator
            - call: "POST /dme-orders/${dme_id}/fulfill"
              payload: {}
              as: DMECoordinator
          trigger:
            - call: "POST /compliance-records"
              payload: { dme_order_id: "${dme_id}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-08-31T00:00:00Z", nights_used_4h_plus: 22, total_usage_minutes: 5060 }
              as: DMECoordinator
              captures: { cr_id: $.data.id }
          assert:
            - "ComplianceRecord.${cr_id}.adherent == false"

      - name: resupply_cycle_circular_dependency_pinned_order
        grounds:
          - calculations.resupply_cycle_number
          - entities.DMEOrder.fields.resupply_cycle_number
          - entities.DMEOrder.fields.supersedes_dme_order_id
          - concurrency_rules[resupply-create-stale-dme]
        distinguishing_aspect: |
          Mode (c): a resupply's resupply_cycle_number depends on its
          predecessor's, which itself was computed identically — a circular-
          looking dependency made well-defined by the pinned acyclic order
          (each resupply points at one already-persisted predecessor). Initial
          order -> 1, first resupply -> 2, second resupply -> 3.
        test_recipe:
          setup:
            - "An interpreted CPAP-recommended study with an initial FULFILLED DMEOrder (cycle 1) and a FULFILLED first resupply (cycle 2)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Dot Ray", date_of_birth: "1965-05-05", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "4444444444", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-4", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 200, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
            - call: "POST /scoring-reports/${sr_id}/interpret"
              payload: { interpretation_text: "Severe OSA", physician_recommends_cpap: true }
              as: Physician
            - call: "POST /dme-orders"
              payload: { study_order_id: "${so_id}", device_type: "CPAP", prescribed_pressure_cmh2o: 11.0 }
              as: DMECoordinator
              captures: { dme1_id: $.data.id }
            - call: "POST /dme-orders/${dme1_id}/submit"
              payload: {}
              as: DMECoordinator
            - call: "POST /dme-orders/${dme1_id}/fulfill"
              payload: {}
              as: DMECoordinator
              captures: { dme1_v: $.data.version }
            - call: "POST /dme-orders"
              payload: { study_order_id: "${so_id}", device_type: "CPAP", prescribed_pressure_cmh2o: 11.0, supersedes_dme_order_id: "${dme1_id}", expected_supersedes_version: "${dme1_v}" }
              as: DMECoordinator
              captures: { dme2_id: $.data.id }
            - call: "POST /dme-orders/${dme2_id}/submit"
              payload: {}
              as: DMECoordinator
            - call: "POST /dme-orders/${dme2_id}/fulfill"
              payload: {}
              as: DMECoordinator
              captures: { dme2_v: $.data.version }
          trigger:
            - call: "POST /dme-orders"
              payload: { study_order_id: "${so_id}", device_type: "CPAP", prescribed_pressure_cmh2o: 11.0, supersedes_dme_order_id: "${dme2_id}", expected_supersedes_version: "${dme2_v}" }
              as: DMECoordinator
              captures: { dme3_id: $.data.id }
          assert:
            - "DMEOrder.${dme3_id}.resupply_cycle_number == 3"
            - "DMEOrder.${dme3_id}.supersedes_dme_order_id == ${dme2_id}"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: study_score_return_rescore_cycle
        grounds:
          - state_machines.StudyOrder.SCORED_to_IN_PROGRESS
          - state_machines.StudyOrder.IN_PROGRESS_to_SCORED
          - state_machines.ScoringReport.DRAFT_to_RETURNED
        distinguishing_aspect: |
          StudyOrder has a true cycle SCORED -> IN_PROGRESS -> SCORED driven by
          physician return then tech re-score; this is a non-linear revision
          loop on the StudyOrder entity (distinct entity from instance 2's
          Referral branch). After return the study is IN_PROGRESS again.
        test_recipe:
          setup:
            - "An HSAT StudyOrder scored once (SCORED) with a DRAFT ScoringReport."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Eli Vance", date_of_birth: "1982-06-06", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "5555555555", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-5", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 120, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
              captures: { so_v2: $.data.version }
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
          trigger:
            - call: "POST /scoring-reports/${sr_id}/return"
              payload: {}
              as: Physician
              captures: { sr_status: $.data.status }
          assert:
            - "ScoringReport.${sr_id}.status == RETURNED"
            - "StudyOrder.${so_id}.status == IN_PROGRESS"

      - name: referral_branch_pending_auth_to_denied
        grounds:
          - state_machines.Referral.PENDING_AUTH_to_DENIED
          - state_machines.Referral.PENDING_AUTH_to_AUTHORIZED
          - state_machines.Referral.SUBMITTED_to_PENDING_AUTH
        distinguishing_aspect: |
          Referral branches from PENDING_AUTH to either AUTHORIZED (persists
          auth fields) or DENIED (terminal, no auth fields) — a fork with
          divergent side-effect sets on a different entity than instance 1's
          StudyOrder cycle. We take the DENIED arm and assert it is terminal.
        test_recipe:
          setup:
            - "A referral requiring prior auth, moved to PENDING_AUTH."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Fay Lin", date_of_birth: "1990-07-07", insurance_payer: "StrictPayer" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "6666666666", requested_modality: "IN_LAB_PSG", clinical_indication: "OSA", prior_auth_required: true }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/request-auth"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /referrals/${ref_id}/deny-auth"
              payload: {}
              as: SchedulingCoordinator
              captures: { ref_status: $.data.status }
          assert:
            - "Referral.${ref_id}.status == DENIED"
            - "Referral.${ref_id}.prior_auth_number == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: interpret_cascade_report_to_study_to_referral
        grounds:
          - state_machines.ScoringReport.DRAFT_to_FINALIZED
          - state_machines.StudyOrder.SCORED_to_INTERPRETED
          - state_machines.Referral.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger (interpret): ScoringReport
          DRAFT->FINALIZED causes StudyOrder SCORED->INTERPRETED, which itself
          causes Referral SCHEDULED->COMPLETED. Each hop is caused by the
          previous hop, not by the original call directly.
        test_recipe:
          setup:
            - "An in-lab PSG study scheduled (referral SCHEDULED), started, scored (SCORED) with a DRAFT report."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Gus Ott", date_of_birth: "1978-08-08", insurance_payer: "Acme", baseline_epworth_score: 16 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /beds"
              payload: { bed_label: "Room-1-Bed-A", turnover_buffer_minutes: 60 }
              as: SchedulingCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "7777777777", requested_modality: "IN_LAB_PSG", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-7", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "IN_LAB_PSG", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z", bed_id: "${bed_id}" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 240, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
          trigger:
            - call: "POST /scoring-reports/${sr_id}/interpret"
              payload: { interpretation_text: "Severe OSA, CPAP recommended", physician_recommends_cpap: true }
              as: Physician
          assert:
            - "ScoringReport.${sr_id}.status == FINALIZED"
            - "StudyOrder.${so_id}.status == INTERPRETED"
            - "Referral.${ref_id}.status == COMPLETED"

      - name: referral_cancel_cascade_study_and_bed_release
        grounds:
          - state_machines.Referral.SUBMITTED_to_CANCELLED
          - state_machines.StudyOrder.ORDERED_to_CANCELLED
          - entities.SleepBed.fields.id
        distinguishing_aspect: |
          Depth-2+ cascade from a DIFFERENT trigger (referral cancel): Referral
          -> CANCELLED causes its SCHEDULED StudyOrder -> CANCELLED, which itself
          releases the held bed night so the same interval is bookable again.
          Distinct propagation pattern from the interpret cascade.
        test_recipe:
          setup:
            - "An authorized referral with one IN_LAB_PSG study SCHEDULED on a bed (bed night held)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Hal Pike", date_of_birth: "1973-09-09", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /beds"
              payload: { bed_label: "Room-2-Bed-A", turnover_buffer_minutes: 60 }
              as: SchedulingCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "8888888888", requested_modality: "IN_LAB_PSG", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-8", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "IN_LAB_PSG", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-10T22:00:00Z", night_end_utc: "2026-07-11T06:00:00Z", bed_id: "${bed_id}" }
              as: SchedulingCoordinator
          trigger:
            - call: "POST /referrals/${ref_id}/cancel"
              payload: {}
