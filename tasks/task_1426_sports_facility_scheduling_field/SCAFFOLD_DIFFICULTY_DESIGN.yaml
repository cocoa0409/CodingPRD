      - name: refund_auto_approve_threshold_boundary
        grounds:
          - calculations.deposit_disposition_waterfall
          - entities.Payment.fields.status
          - state_machines.Payment.PENDING_APPROVAL_to_CLEARED
        distinguishing_aspect: |
          Metric: refund amount in cents (different metric than hours/count). Boundary at
          REFUND_AUTO_APPROVE_MAX_CENTS=10000: amount == 10000 auto-CLEARS; amount == 10001
          starts PENDING_APPROVAL and counts toward refunded_cents only after approval.
          Reachable via POST /invoices/{id}/refunds (different endpoint than the siblings).
        test_recipe:
          setup:
            - "COMMERCIAL CORPORATE org; permit 2026-08-10 06:00-14:00 (480 min) LEAGUE_GAME no lights: field 40000 + 25% surcharge 10000 = 50000; deposit 12500; invoice PAID in full (50000)"
