  - rule_id: cross_entity_state_dependency
    instances:
      - name: coverage_window_creation_requires_active_license
        grounds:
          - validations.priority_7_ERR_LICENSE_NOT_ACTIVE
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.License.SUSPENDED_to_ACTIVE
          - calculations.seasonal_rider_fee
          - endpoints.POST_licensing_licenses_license_id_coverage_windows
        distinguishing_aspect: |
          Entity pair (CoverageWindow depends on License): whether a rider window may be attached
          is decided entirely by the parent License's coverage_status, a field of a different
          entity from the one being created. The identical POST is rejected while L1 is SUSPENDED
          and accepted once it is reinstated, so the dependency cannot be explained by anything in
          the request body.
        test_recipe:
          setup:
            - "License L1 of Venue V1 is ACTIVE with annual_fee_cents 90017 and term 2026-08-01 to 2027-08-01"
            - "L1 has been suspended with suspension_reason OPERATOR_REQUEST, so coverage_status == SUSPENDED"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/licenses/${lic1_id}/suspend"
              payload: { suspension_reason: "OPERATOR_REQUEST" }
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/licenses/${lic1_id}/coverage-windows"
              payload: { window_kind: "SEASONAL_EVENT_RIDER", window_start: "2026-12-20T00:00:00Z", window_end: "2027-01-04T00:00:00Z" }
              as: LicensingAdmin
              expect_error: ERR_LICENSE_NOT_ACTIVE
          assert:
            - "The trigger returns HTTP 409 with error_id ERR_LICENSE_NOT_ACTIVE"
            - "GET /licensing/licenses/${lic1_id}/coverage-windows still returns exactly one row, the ANNUAL_TERM window created at activation"
            - "No SEASONAL_RIDER FeeAssessment was created: Venue.${v1_id}.outstanding_balance_cents is still 90017"
            - "After POST /licensing/licenses/${lic1_id}/reinstate the identical window POST returns 201 with covered_day_count == 15 and rider_fee_cents == 4994"
            - "Venue.${v1_id}.outstanding_balance_cents is then 95011 and a SEASONAL_RIDER assessment of 4994 cents exists"

      - name: application_submit_requires_venue_without_audit_hold
        grounds:
          - validations.priority_9_ERR_AUDIT_HOLD_ACTIVE
          - state_machines.AuditCase.OPEN_to_CLOSED_NO_ACTION
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
          - entities.Venue.fields.audit_hold
        distinguishing_aspect: |
          A different entity pair (LicenseApplication depends on Venue): the DRAFT -> SUBMITTED
          transition is gated by Venue.audit_hold, a flag owned by the parent Venue and flipped by
          a third entity (AuditCase) that the application never references. No licence and no rate
          schedule participate at all, which separates this dependency from the
          CoverageWindow-on-License one.
        test_recipe:
          setup:
            - "Society BMI exists"
            - "Venue V1 exists with status OPERATING and audit_hold false"
            - "LicenseApplication A1 of V1 for BMI is DRAFT"
            - "A ComplianceAuditor then opens a ROUTINE AuditCase over V1, so V1.audit_hold becomes true"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v1_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-01-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: ComplianceAuditor
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
              expect_error: ERR_AUDIT_HOLD_ACTIVE
          assert:
            - "The trigger returns HTTP 409 with error_id ERR_AUDIT_HOLD_ACTIVE"
            - "LicenseApplication.${app1_id}.status is still DRAFT and its version is unchanged"
            - "Venue.${v1_id}.audit_hold == true purely because AuditCase.${case_id}.status == OPEN"
            - "After POST /licensing/audit-cases/${case_id}/close with closed_reason WITHIN_TOLERANCE, Venue.${v1_id}.audit_hold == false"
            - "The identical submit call then returns 200 and LicenseApplication.${app1_id}.status == SUBMITTED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_rider_windows_scoped_by_window_kind_inside_the_term
        grounds:
          - validations.priority_13_ERR_COVERAGE_WINDOW_OVERLAP
          - validations.priority_13_ERR_WINDOW_OUTSIDE_TERM
          - calculations.seasonal_rider_fee
          - entities.CoverageWindow.fields.window_kind
          - entities.CoverageWindow.fields.covered_day_count
        distinguishing_aspect: |
          Resource entity: CoverageWindow. Interval semantics: half-open [window_start, window_end)
          intervals that must be CONTAINED in the parent License's term and are checked for overlap
          only against ACTIVE windows OF THE SAME window_kind. That kind-scoping is what makes the
          ANNUAL_TERM window, which spans the entire term, harmless, while a second
          SEASONAL_EVENT_RIDER over the same days is fatal — and a FESTIVAL_RIDER over exactly
          those same days is legal again.
        test_recipe:
          setup:
            - "License L1 of Venue V1 is ACTIVE with annual_fee_cents 90017 and term 2026-08-01 to 2027-08-01, carrying its activation-created ANNUAL_TERM window over the whole term"
            - "SEASONAL_EVENT_RIDER W1 covers 2026-12-20 to 2027-01-04 with covered_day_count 15 and rider_fee_cents 4994"
            - "SEASONAL_EVENT_RIDER W2 covers 2027-01-04 to 2027-01-11, exactly abutting W1, with covered_day_count 7 and rider_fee_cents 2331"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/licenses/${lic1_id}/coverage-windows"
              payload: { window_kind: "SEASONAL_EVENT_RIDER", window_start: "2026-12-20T00:00:00Z", window_end: "2027-01-04T00:00:00Z" }
              as: LicensingAdmin
              captures: { w1_id: "$.data.id", w1_fee: "$.data.rider_fee_cents" }
            - call: "POST /licensing/licenses/${lic1_id}/coverage-windows"
              payload: { window_kind: "SEASONAL_EVENT_RIDER", window_start: "2027-01-04T00:00:00Z", window_end: "2027-01-11T00:00:00Z" }
              as: LicensingAdmin
              captures: { w2_id: "$.data.id", w2_fee: "$.data.rider_fee_cents" }
          trigger:
            - call: "POST /licensing/licenses/${lic1_id}/coverage-windows"
              payload: { window_kind: "SEASONAL_EVENT_RIDER", window_start: "2027-01-03T00:00:00Z", window_end: "2027-01-06T00:00:00Z" }
              as: LicensingAdmin
              expect_error: ERR_COVERAGE_WINDOW_OVERLAP
          assert:
            - "W1 has covered_day_count == 15 and rider_fee_cents == 4994; W2 has covered_day_count == 7 and rider_fee_cents == 2331, proving that abutting at 2027-01-04 is not an overlap"
            - "The trigger returns HTTP 409 with error_id ERR_COVERAGE_WINDOW_OVERLAP because 2027-01-03 to 2027-01-06 intersects both W1 and W2"
            - "The identical interval submitted with window_kind FESTIVAL_RIDER returns 201 with covered_day_count == 3 and rider_fee_cents == 999, because the overlap set is scoped to one window_kind"
            - "A SEASONAL_EVENT_RIDER for 2027-07-25 to 2027-08-05 returns HTTP 409 with error_id ERR_WINDOW_OUTSIDE_TERM: containment in [term_start, term_end) is checked before overlap"
            - "The ANNUAL_TERM window spanning the whole term never triggers an overlap error against any rider"
            - "After the accepted FESTIVAL_RIDER, Venue.${v1_id}.outstanding_balance_cents == 98341 (90017 + 4994 + 2331 + 999) and the ledger identity still holds"

      - name: overlap_license_terms_per_venue_and_society
        grounds:
          - validations.priority_17_ERR_DUPLICATE_ACTIVE_LICENSE
          - state_machines.LicenseApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.LicenseApplication.DRAFT_to_WITHDRAWN
          - entities.License.fields.term_start
          - entities.License.fields.term_end
        distinguishing_aspect: |
          A different resource entity (License, not CoverageWindow) with different interval
          semantics: the calendar is per (venue_id, society_id) and the candidate set is scoped by
          coverage_status in {PENDING_ACTIVATION, ACTIVE, SUSPENDED} rather than by a kind
          discriminator, and the check fires at APPROVE time, when the License row is about to be
          created, not at creation of the interval itself. Adjacency at term_end is again legal,
          which is what makes the renewal calendar workable.
