          - errors[ERR_REORDER_HOLD_NOT_FOUND]
          - errors[ERR_SCHEDULE_NOT_FOUND]
          - errors[ERR_RETURN_REQUEST_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "The same well-formed but unknown uuid produces a different 404 code per aggregate, so a single shared ERR_NOT_FOUND is wrong; every code names the entity addressed by the path."
        test_recipe:
          setup:
            - The store is empty apart from the clock, so no uuid names a stored row.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
          trigger:
            - call: GET /prescriptions/00000000-0000-0000-0000-0000000000aa
              payload: {}
              as: ComplianceOfficer
              as_user_id: co-alpha
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 404 and data.error_id is ERR_PRESCRIPTION_NOT_FOUND."
            - "GET /products/00000000-0000-0000-0000-0000000000aa as ComplianceOfficer co-alpha is 404 ERR_PRODUCT_NOT_FOUND and GET /prescribers/00000000-0000-0000-0000-0000000000aa is 404 ERR_PRESCRIBER_NOT_FOUND."
            - "GET /verification-requests/00000000-0000-0000-0000-0000000000aa is 404 ERR_VERIFICATION_REQUEST_NOT_FOUND and GET /reorder-holds/00000000-0000-0000-0000-0000000000aa is 404 ERR_REORDER_HOLD_NOT_FOUND."
            - "GET /auto-reorder-schedules/00000000-0000-0000-0000-0000000000aa is 404 ERR_SCHEDULE_NOT_FOUND and GET /return-requests/00000000-0000-0000-0000-0000000000aa is 404 ERR_RETURN_REQUEST_NOT_FOUND."
            - "GET /reimbursement-claims/00000000-0000-0000-0000-0000000000aa is 404 ERR_CLAIM_NOT_FOUND and GET /prescriber-disputes/00000000-0000-0000-0000-0000000000aa is 404 ERR_DISPUTE_NOT_FOUND."
            - "Every one of those responses carries response_type error with a message, and none of them creates a row."

