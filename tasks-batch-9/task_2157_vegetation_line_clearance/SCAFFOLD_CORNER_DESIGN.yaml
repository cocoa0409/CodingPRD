              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_CREW_VERSION"
            - "Crew.${crew1_id}.status == ASSIGNED"
            - "CrewAssignment.${ca_id}.status == ACTIVE"
            - "WorkOrder.${wo_id}.execution_status == IN_PROGRESS"
            - "StormEvent.${stm_id}.reassigned_crew_count == 0"

      - name: corner_derived_committed_cents_recomputed_on_every_line_event
        claim_type: derived_field_reconciliation
        grounds: ['calculations.work_plan_committed_cents', 'entities.WorkPlan.fields.committed_cents']
        excluded_because:
          difficulty_instance: billing_line_draft_then_void_conserves_plan_committed_cents
          rationale: "Recomputation on draft and on void is asserted by the named §1.8 instance; the dispute and resubmit recomputations are asserted by work_order_execution_and_billing_dimensions_advance_independently."
      - name: corner_rate_threshold_reliability_tier_boundary
        claim_type: rate_threshold_triggers
