        grounds:
          - calculations.indigency_fpl_percent
          - validations[priority 35]
          - errors[ERR_INDIGENCY_CEILING_EXCEEDED]
        distinguishing_aspect: "For household_size 1 the guideline is exactly FPL_BASE_CENTS, so 3016000 cents is exactly 200.00 percent and passes the inclusive ceiling, while 3016151 cents rounds to 200.01 and is refused at intake CREATION (priority 35 applies to POST /intake-screenings, not only to the screen step). The comparison uses the ROUNDED two-decimal value."
        test_recipe:
          setup:
            - "One cycle whose window contains 2026-08-03, one IntakeScreener representative, and two single-person-household clients: Alma at exactly 200.00 percent and Bruno one cent-scaled step above."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY26-H2", period_start_date: "2026-07-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 2 }
