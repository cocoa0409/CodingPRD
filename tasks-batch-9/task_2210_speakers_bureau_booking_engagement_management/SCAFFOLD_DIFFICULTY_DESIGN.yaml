            - "after the void: invoice.status == VOID, client.outstanding_balance_cents == 0 and speaker.pending_remittance_cents == 0"
            - "the sibling remittance is VOIDED with paid_at_utc null, and engagement.settlement_status == WRITTEN_OFF"
            - "engagement.final_commission_cents is still 406250 and travel_reimbursable_cents still 63750 — the void compensates ledger balances, not the computed record of the engagement"
            - "a second void of the same invoice is rejected with 409 ERR_INVOICE_NOT_PAYABLE, so the compensation cannot be applied twice"

      - name: compensating_hold_lifecycle_conserves_speaker_held_days_count
        grounds:
          - state_machines.SpeakerHold.ACTIVE_to_RELEASED
          - state_machines.SpeakerHold.ACTIVE_to_CONSUMED
          - entities.Speaker.fields.held_days_count
          - entities.SpeakerHold.fields.day_span
        distinguishing_aspect: |
          held_days_count is a conserved aggregate over ACTIVE holds only, and it must be
          decremented by exactly the hold's own day_span on BOTH exit paths — cancellation
          (RELEASED) and delivery (CONSUMED) — while an unrelated BLACKOUT hold is left alone.
          A naive implementation that recomputes from engagements, or that only decrements on
          release, drifts by the blackout's 3 days or by the consumed hold's 3 days.
