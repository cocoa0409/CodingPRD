            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch1: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch1}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk1: $.data.id } }
