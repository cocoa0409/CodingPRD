            - "StaffingPlan.${plan_id}.committed_cost_cents == 56250"
            - "StaffingPlan.${plan_id}.cost_balance_cents == 0"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_activation_gated_by_student_state
        grounds:
          - state_machines.Assignment.QUALIFICATION_VERIFIED_to_ACTIVE
          - state_machines.Student.ACTIVE_IEP_to_SERVICE_CHANGE_PENDING
          - errors[ERR_STUDENT_NOT_ASSIGNABLE]
        distinguishing_aspect: |
          Pair Assignment -> Student: activate is rejected with
          ERR_STUDENT_NOT_ASSIGNABLE while the student is SERVICE_CHANGE_PENDING,
          even though the assignment's own from-state (QUALIFICATION_VERIFIED) is
          satisfied.
        test_recipe:
          setup:
            - "Plan ACTIVE, B1, P1 (no quals needed), S1 TRANSITIONAL/NONE ACTIVE_IEP"
            - "A1 QUALIFICATION_VERIFIED (300/day Mon-Fri)"
            - "SCO filed on S1 -> S1 SERVICE_CHANGE_PENDING"
