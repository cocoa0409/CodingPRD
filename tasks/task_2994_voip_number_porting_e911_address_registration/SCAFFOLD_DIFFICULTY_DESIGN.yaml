              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415565", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1101" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000081", device_type: "SOFTPHONE", nomadic: true, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "14 NORDIC LN", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /voip/devices/${dev_id}/network-reports"
              payload: { reported_state_code: "NV", reported_postal_code: "89501" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /voip/devices/${dev_id}/calling-restrictions"
              payload: { action: "REVIEW_UNBLOCK", note: "customer says the relocation was temporary" }
              as: SecurityAnalyst
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_UNBLOCK_REVIEW_SCORE_TOO_HIGH"
            - "GET /voip/devices/${dev_id}/call-attempts returns 0 rows, so the DAILY_REVIEW score component of the refusal is 0"
            - "Device.${dev_id}.calling_status == INTL_BLOCKED, registration_status == RELOCATION_DETECTED and fraud_block_count == 0"
            - "E911Registration.${reg_id}.verification_status == STALE and superseded_at == null"
            - "Account.${acct_id}.e911_compliance_posture == AT_RISK"

  - rule_id: resource_temporal_overlap
    instances:
      - name: cutover_slot_buffer_expands_half_open_windows_and_touching_edges_are_free
        grounds:
          - calculations.cutover_slot_overlap
          - validations[priority=40]
          - errors[ERR_CUTOVER_SLOT_OVERLAP]
          - entities.Carrier.fields.porting_buffer_minutes
        distinguishing_aspect: |
          Cutover slots use HALF-OPEN intervals expanded by the carrier's 60-minute buffer on both
          sides: the incumbent [14:00Z, 18:00Z) blocks [13:00Z, 19:00Z), so a candidate at
          [18:30Z, 20:30Z) is refused even though the raw windows do not touch, while a candidate at
          [20:00Z, 22:00Z) is admitted because its expanded form [19:00Z, 23:00Z) only touches the
          incumbent's expanded end and half-open touching is not intersection.
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; carrier with porting_buffer_minutes 60 and foc_business_days 3"
            - "one OPEN slot S1 [2026-08-10T14:00Z, 2026-08-10T18:00Z), 240 minutes long"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/carriers"
              payload: { name: "Cascade Legacy", ocn: "CL05", csr_match_policy: "RELAXED", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${car_id}", window_start: "2026-08-10T14:00:00Z", window_end: "2026-08-10T18:00:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { slot1_id: $.data.id }
          trigger:
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${car_id}", window_start: "2026-08-10T18:30:00Z", window_end: "2026-08-10T20:30:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${car_id}", window_start: "2026-08-10T20:00:00Z", window_end: "2026-08-10T22:00:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { slot3_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_CUTOVER_SLOT_OVERLAP and does NOT return ERR_CUTOVER_WINDOW_LENGTH_INVALID"
            - "the second trigger call returns HTTP 201 and CutoverSlot.${slot3_id}.status == OPEN"
            - "CutoverSlot.${slot3_id}.window_start == 2026-08-10T20:00:00Z and window_end == 2026-08-10T22:00:00Z"
            - "CutoverSlot.${slot1_id}.status == OPEN and window_length_minutes == 240"
            - "CutoverSlot.${slot3_id}.window_length_minutes == 120"
            - "GET /voip/cutover-slots?carrier_id=${car_id} returns exactly 2 rows"

      - name: number_reservations_treat_touching_closed_endpoints_as_a_conflict
        grounds:
          - calculations.reservation_interval_capacity
          - validations[priority=48]
          - errors[ERR_NUMBER_RESERVATION_OVERLAP]
          - entities.NumberReservation.fields.reserved_until
        distinguishing_aspect: |
          Reservations use CLOSED, unbuffered intervals with the opposite endpoint semantics: a second
          hold on the same number starting exactly at the incumbent's reserved_until
          (2026-08-10T00:00:00Z) is refused because closed endpoints intersect, and moving the start
          one second later to 2026-08-10T00:00:01Z is admitted - the mirror image of the half-open,
          buffer-expanded cutover-slot arithmetic.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ACTIVE account and a block with max_concurrent_reservations 5 so block capacity never binds"
            - "one minted number 1201 held by R1 over the closed interval [2026-08-05T00:00:00Z, 2026-08-10T00:00:00Z]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0015", billing_name: "OSPREY LTD", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415566", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1201" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v1: $.data.version }
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-05T00:00:00Z", reserved_until: "2026-08-10T00:00:00Z", expected_number_block_version: "${blk_v1}", number_id: "${pn1_id}" }
              as: NumberingAdmin
              captures: { res1_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v2: $.data.version }
          trigger:
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-10T00:00:00Z", reserved_until: "2026-08-12T00:00:00Z", expected_number_block_version: "${blk_v2}", number_id: "${pn1_id}" }
              as: NumberingAdmin
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-10T00:00:01Z", reserved_until: "2026-08-12T00:00:00Z", expected_number_block_version: "${blk_v2}", number_id: "${pn1_id}" }
              as: NumberingAdmin
              captures: { res3_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_NUMBER_RESERVATION_OVERLAP"
            - "the first trigger call does NOT return ERR_BLOCK_RESERVATION_CAPACITY_EXCEEDED, ERR_PHONE_NUMBER_STATE_INVALID or ERR_RESERVATION_WINDOW_INVALID"
            - "the second trigger call returns HTTP 201 and NumberReservation.${res3_id}.status == HELD with number_id == '${pn1_id}'"
            - "NumberReservation.${res1_id}.status == HELD and reserved_until == 2026-08-10T00:00:00Z"
            - "PhoneNumber.${pn1_id}.status == RESERVED"
            - "NumberBlock.${blk_id}.minted_count == 1, available_count == 0, reserved_count == 1, assigned_count == 0, parked_count == 0"
            - "GET /voip/number-reservations?block_id=${blk_id}&status=HELD returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_release_restores_block_census_counts_exactly
        grounds:
          - calculations.number_inventory_census
          - state_machines.NumberReservation.HELD_to_RELEASED
          - state_machines.PhoneNumber.RESERVED_to_AVAILABLE
          - endpoints[POST /voip/number-reservations/{id}/release]
        distinguishing_aspect: |
          The conserved quantity is a set of integer inventory COUNTS: available_count + reserved_count
          + assigned_count + parked_count == minted_count must hold after every hop, and the release
          must return the block to the exact pre-reservation vector (minted 2, available 2, reserved 0)
          rather than merely decrementing reserved_count - while the RELEASED reservation row is
          retained with released_reason MANUAL, so compensation is not deletion.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ACTIVE account; block with two minted numbers 1301 and 1302 and max_concurrent_reservations 5"
            - "the pre-reservation census is minted 2, available 2, reserved 0, assigned 0, parked 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0016", billing_name: "PONDEROSA SL", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415567", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1301" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1302" }
              as: NumberingAdmin
              captures: { pn2_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v1: $.data.version }
          trigger:
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-05T00:00:00Z", reserved_until: "2026-08-10T00:00:00Z", expected_number_block_version: "${blk_v1}" }
              as: NumberingAdmin
              captures: { res_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v2: $.data.version }
            - call: "POST /voip/number-reservations/${res_id}/release"
              payload: {}
              as: NumberingAdmin
          assert:
            - "after the reservation, NumberReservation.${res_id}.status == HELD with number_id == '${pn1_id}' (the lowest line_number 1301 was selected)"
            - "after the reservation, NumberBlock.${blk_id}.minted_count == 2, available_count == 1, reserved_count == 1, assigned_count == 0, parked_count == 0 and 1 + 1 + 0 + 0 == 2"
            - "after the release, NumberBlock.${blk_id}.minted_count == 2, available_count == 2, reserved_count == 0, assigned_count == 0, parked_count == 0 and 2 + 0 + 0 + 0 == 2"
            - "after the release, PhoneNumber.${pn1_id}.status == AVAILABLE and park_cycle_count == 0"
            - "PhoneNumber.${pn2_id}.status == AVAILABLE throughout"
            - "NumberReservation.${res_id}.status == RELEASED with released_reason == MANUAL and number_id still '${pn1_id}'"
            - "GET /voip/number-reservations?block_id=${blk_id}&status=HELD returns 0 rows and GET /voip/number-reservations?block_id=${blk_id} returns exactly 1 row"

      - name: assess_then_void_restores_jurisdiction_and_account_fee_cents
        grounds:
          - calculations.fee_ledger_reconciliation
          - calculations.e911_fee_assessment
          - state_machines.FeeAssessment.ASSESSED_to_VOIDED
          - validations[priority=29]
          - endpoints[POST /voip/fee-assessments/{id}/void]
        distinguishing_aspect: |
          The conserved quantity here is MONEY IN CENTS across two different ledgers - the
          jurisdiction's pending_fee_cents and the account's fee_liability_cents - which must both fall
          from 175 back to exactly 0 while the VOIDED FeeAssessment row keeps amount_cents 175 for
          audit; and unlike the inventory instance the compensation is gated by segregation of duties,
          so it must be performed by a BillingAdmin whose X-User-ID differs from the assessor's.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; PER_LINE jurisdiction at 175 cents per month; ACTIVE account"
            - "one device holding a number with a registration VERIFIED on 2026-08-01, so its anchor day-of-month is 1"
            - "clock advanced to 2026-08-15T12:00:00Z; pre-assessment ledgers are pending_fee_cents 0 and fee_liability_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0017", billing_name: "QUARRY SPA", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415568", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1401" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000091", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "17 QUARRY RD", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { fee_id: $.data.id }
            - call: "POST /voip/fee-assessments/${fee_id}/void"
              payload: { void_note: "assessed against the wrong jurisdiction" }
              as: BillingAdmin
              as_user_id: "billing-2"
          assert:
            - "after the assessment, FeeAssessment.${fee_id}.variant == PROVISIONAL, status == ASSESSED, billable_units == 1, unit_fee_breakdown == [175] and amount_cents == 175"
            - "after the assessment, Jurisdiction.${jur_id}.pending_fee_cents == 175, remitted_fee_cents == 0 and Account.${acct_id}.fee_liability_cents == 175"
            - "after the void, FeeAssessment.${fee_id}.status == VOIDED with voided_by_user_id == 'billing-2' and assessed_by_user_id == 'billing-1'"
            - "after the void, FeeAssessment.${fee_id}.amount_cents is still 175 and unit_fee_breakdown is still [175] - the row is retained, not deleted"
            - "after the void, Jurisdiction.${jur_id}.pending_fee_cents == 0, remitted_fee_cents == 0 and Account.${acct_id}.fee_liability_cents == 0"
            - "the conserved-money identity holds: pending_fee_cents + remitted_fee_cents == 0 == the sum of amount_cents over the jurisdiction's non-VOIDED assessments"
            - "GET /voip/fee-assessments?jurisdiction_id=${jur_id}&status=VOIDED returns exactly 1 row"
