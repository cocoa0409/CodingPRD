          trigger:
            - call: "POST /tax/claims/${cl1}/resolve"
              payload: {}
              as: CaseManager
              as_user_id: "cm-B"
            - call: "POST /tax/claims/${cl1}/reopen"
              payload: {}
              as: CaseManager
          assert:
            - "OfficeEscrow.${esc1}.paid_out_cents == 0 (invariant: resolve+reopen conserves paid_out)"
            - "OfficeEscrow.${esc1}.expected_accrual_cents == 60968 (historical accrual NOT credited back)"
            - "Claim.${cl1}.status == REOPENED"
            - "Claim.${cl1}.final_liability_cents == 105425 (retained for audit)"
      - name: product_purchase_void_uniqueness_invariant
        grounds:
          - state_machines.ProtectionProduct.ACTIVE_to_VOID
          - validations[priority=13]
          - errors[ERR_DUPLICATE_PRODUCT]
        distinguishing_aspect: |
          Conserved quantity: the count of ACTIVE ProtectionProduct rows per return is
          pinned at 1 across the forward/compensating pair — a duplicate purchase is
          rejected (count stays 1), and purchase-then-void returns the count to 0,
          permitting exactly one new purchase afterwards.
        test_recipe:
          setup:
            - "Office O1; preparer P1; client C1; FILED return R1 ([1040_SIMPLE])"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "Pat Assoc", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
          trigger:
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
              captures: { prod1: $.data.id }
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "PLUS" }
              as: OfficeManager
              captures: { err: $.data.error_id }
            - call: "POST /tax/products/${prod1}/void"
              payload: {}
              as: ProgramAdmin
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "PLUS" }
              as: OfficeManager
              captures: { prod2: $.data.id, prem2: $.data.premium_cents }
          assert:
            - "err == ERR_DUPLICATE_PRODUCT (count of ACTIVE products stays 1 on duplicate attempt)"
            - "ProtectionProduct.${prod1}.status == VOID (compensating action)"
            - "ProtectionProduct.${prod2}.status == ACTIVE (exactly one ACTIVE product again)"
            - "prem2 == 9900 (protection_premium: PLUS base 9900, credits 7500 <= SIMPLE_CAP 15000 -> simple band, no multiplier)"
