  - rule_id: compensating_invariant
    instances:
      - name: witness_session_abort_restores_the_assessor_day_ledger_exactly
        conserved_quantity: "Assessor.committed_witness_days + Assessor.available_witness_days == Assessor.annual_witness_capacity_days"
        grounds:
          - state_machines.WitnessSession.SCHEDULED_to_ABORTED
          - entities.Assessor.fields.committed_witness_days
          - entities.Assessor.fields.available_witness_days
          - calculations.witness_session_day_count
        distinguishing_aspect: |
          Booking a slot moves day_count from available to committed; aborting it must move exactly the
          same day_count back, so the two-field ledger reconciles to annual_witness_capacity_days both
          before and after. The compensation must use the stored day_count (4, from a 32-hour slot at
          8 hours per assessor day) rather than recomputing from a partial duration, and must not
          release days on completion - a completed day is consumed capacity.
