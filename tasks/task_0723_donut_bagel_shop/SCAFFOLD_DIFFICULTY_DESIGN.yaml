  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: void_restores_loyalty_punch_equivalents
        grounds:
          - state_machines.RetailOrder.PAID_to_VOIDED
          - calculations.loyalty_punch
          - entities.LoyaltyAccount.fields.punch_count
          - entities.LoyaltyAccount.fields.reward_balance_cents
        distinguishing_aspect: |
          Conserved quantity = loyalty punch-equivalents (punch_count + reward_count*10). Paying order2 (1 dozen)
          drives 9->reward conversion (equiv 10); voiding it reverses the conversion, restoring punch_count 9 and
          reward_balance_cents 0 (equiv back to 9 earned baseline) with zero drift.
        test_recipe:
          setup:
            - "LoyaltyAccount at punch_count 9 (from a prior PAID 108-GLAZED order); a second PAID order2 (12 GLAZED) just converted a reward."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { phone: "555-0002", name: "Reg Two" }
              as: Cashier
              captures: { loy_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-17", delivery_cutoff_utc: "2026-03-17T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 120 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 120 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 108, marked_down: false } ], loyalty_account_id: "${loy_id}" }
              as: Cashier
              captures: { o1_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${o1_id}/pay"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 12, marked_down: false } ], loyalty_account_id: "${loy_id}" }
              as: Cashier
              captures: { o2_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${o2_id}/pay"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders/${o2_id}/void"
              payload: {}
              as: Cashier
          assert:
            - "RetailOrder.${o2_id}.status == VOIDED"
            - "LoyaltyAccount.${loy_id}.punch_count == 9"
            - "LoyaltyAccount.${loy_id}.reward_balance_cents == 0"

      - name: invoice_then_payment_restores_outstanding_balance
        grounds:
          - state_machines.WholesaleDelivery.DELIVERED_to_INVOICED
          - calculations.wholesale_outstanding_balance
          - entities.WholesaleAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = WholesaleAccount.outstanding_balance_cents. Invoicing a 3264 delivery raises it to 3264;
          recording a 3264 payment lowers it back to its pre-invoice 0 with zero drift — a different conserved
          quantity (account receivable cents) than loyalty punch-equivalents.
        test_recipe:
          setup:
            - "WholesaleAccount outstanding 0; delivery amount 3264 INVOICED (outstanding 3264)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SESAME", name: "Sesame Bagel", category: "BAGEL", unit_price_cents: 120, dozen_price_cents: 1200, bulk_threshold: 24, bulk_unit_price_cents: 95, unit_cost_cents: 40 }
              as: ShopAdmin
              captures: { sesame_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe Bleu", discount_pct: 0.15, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", delivery_dow: 3, line_items: [ { product_id: "${glazed_id}", qty: 24 }, { product_id: "${sesame_id}", qty: 12 } ] }
              as: ShopAdmin
              captures: { so_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-18", delivery_cutoff_utc: "2026-03-18T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/wholesale-deliveries"
              payload: { standing_order_id: "${so_id}", route_window_start: "2026-03-18T08:00:00Z", route_window_end: "2026-03-18T09:00:00Z" }
              as: ShopAdmin
              captures: { del_id: $.data.id }
            - call: "POST /production-days/${d_id}/wholesale-deliveries/${del_id}/pick"
              payload: {}
              as: RouteDriver
            - call: "POST /production-days/${d_id}/wholesale-deliveries/${del_id}/deliver"
              payload: {}
              as: RouteDriver
            - call: "POST /production-days/${d_id}/wholesale-deliveries/${del_id}/invoice"
              payload: {}
              as: ShopAdmin
          trigger:
            - call: "POST /wholesale-accounts/${acct_id}/payments"
              payload: { amount_cents: 3264 }
              as: ShopAdmin
          assert:
            - "WholesaleAccount.${acct_id}.outstanding_balance_cents == 0"
