        grounds: ["validations[priority=36]", calculations.affordable_payment_structure, errors.ERR_NO_AFFORDABLE_STRUCTURE, "state_machines.MortgageApplication.status.DRAFT_to_UNDERWRITING", "endpoints.POST /homeownership/mortgage-applications/{id}/submit-underwriting"]
