            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_h_id}", business_date_id: "${bd1_id}", requested_amount: 1000.00, reason_code: "RATE_ERROR", narrative: "Group rate loaded against a transient reservation for the whole stay.", supporting_document_reference: "GRP-2026-114" }
              as: FrontDeskAgent
