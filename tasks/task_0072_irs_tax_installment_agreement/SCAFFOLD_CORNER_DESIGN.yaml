  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_approve
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.agreement-approve-stale-account, "validations[priority=16]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: >
          Approving with expected_tax_account_version one behind the account's current
          version (the recompute side-effect bumped it) returns ERR_STALE_ACCOUNT_VERSION
          (412). Uses ${acct_v} - 1 to encode a deliberately stale view.
        test_recipe:
          setup: ["Account, period assessed 1000000 on 2024-01-15; clock 2024-04-15; recompute done; a PROPOSED MANUAL LONG_TERM agreement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Occ Co", tin: "200000080", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { agr: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${acct_v} - 1" }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_ACCOUNT_VERSION"

      - name: occ_correct_version_on_oic_accept_succeeds
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.oic-accept-stale-account, entities.OfferInCompromise.fields.status]
        distinguishing_aspect: >
          Accepting an OIC with expected_tax_account_version equal to the account's current
          version (captured immediately before) succeeds (status ACCEPTED). Confirms the
          OCC happy path for the accept write endpoint.
        test_recipe:
          setup: ["Account mdi 300000, period assessed 1000000 on 2024-01-15; clock 2024-04-15; offer 18500000 in EVALUATING by a different officer."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "OccOk Co", tin: "200000081", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18500000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              as_user_id: "officer-sub-81"
              captures: { offer_id: $.data.id }
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/offers/${offer_id}/accept"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: CaseReviewer
              as_user_id: "reviewer-acc-81"
          assert:
            - "OfferInCompromise.${offer_id}.status == ACCEPTED"
            - "TaxAccount.${acct}.collection_status == RESOLVED"

      - name: error_csed_day_conservation_already_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.csed_date]
        excluded_because:
          difficulty_instance: compensating_invariant / csed_day_conservation_on_suspension_close
          rationale: "csed_date day-conservation on suspension close is asserted by the named §1.8 instance."

  # =================================================================
