# =============================================================================
# Task 0990: Textile & Clothing-Recycling Pickup — seed tables (SCAFFOLD)
# =============================================================================

scenario: |
  990. Textile & Clothing-Recycling Pickup: bag/bin & schedule, brand/thrift
  partner routing, weight & diversion credit, drop-box network & fill sensor,
  charity split, contamination, reporting, sponsor

domain_name: textile-recycling-pickup
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # sponsor fund ledger + partner capacity + route-day capacity
  secondary_archetype: posture_driven_gating   # DropBox fill posture gates collections; Partner posture gates routing
  complexity_layers:
    - dual_variant_calculation                 # provisional vs certified credit projection; routing vs reporting partner score
    - cascading_side_effects                   # adjudication cascade; ticket-void cascade; strike-suspension cascade
    - rate_threshold_triggers                  # fill_pct >= 85.0; strikes >= 3; route capacity > 800
    - optimistic_concurrency                   # OCC on PickupRequest.version and ServiceZone.version
  entity_topology: flat                        # peer entities joined by foreign keys; no nested URL tree
  state_machine_shape: cyclic                  # dominant machines loop (NO_SHOW->rebook->SCHEDULED; box fill->collect->OK)
  relationship_patterns: [one_to_many, many_to_many, polymorphic, cross_aggregate]
  role_model: peer_roles                       # each role owns a distinct resource type; no role is a superset of another
  consistency_model: immediate
  difficulty_note: >
    Deliberately above the Expert band (14 entities, 66 endpoints, 31 errors,
    9 calculations, 7 state machines, 8 roles): every endpoint exists to satisfy
    state reachability or FK reverse-reachability, not volume. Difficulty lives
    in dual-variant credit math, rounding-order charity splits, threshold
    boundaries, cascade chains, and validation-priority conflicts.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Zone display name" }
      - { name: charity_splits, type: array, source: input, default: [], description: "Ordered split lines [{charity_id, pct}]; each pct integer 1..100; sum(pct) <= 100; charity_id values unique; unallocated remainder goes to the credit's beneficiary resident (or, for drop-box credits, to the largest-pct charity)", constraints: "sum(pct) <= 100 else ERR_SPLIT_SUM_INVALID" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone the resident's address belongs to" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: address, type: string, source: input, description: "Street address used for pickups" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED when strikes >= 3 (STRIKE_LIMIT)", default: ACTIVE }
      - { name: strikes, type: integer, source: system, default: 0, description: "Count of UPHELD MAJOR/SEVERE contamination findings on tickets sourced from this resident's pickups; >= 3 forces status SUSPENDED" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of resident_share_cents over this resident's SETTLED DiversionCredits" }

  - name: BagKit
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; ordering resident" }
      - { name: kit_type, type: enum, source: input, description: "BAG | BIN" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISPATCHED | DELIVERED | RETIRED", default: REQUESTED }

  - name: PickupRequest
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; requesting resident (must equal X-User-ID when role Resident)" }
      - { name: window_start, type: datetime, source: input, description: "Pickup window start (ISO8601 UTC); must be >= current logical clock" }
      - { name: window_end, type: datetime, source: input, description: "Pickup window end; duration must be in [60, 240] minutes" }
      - { name: bags_claimed, type: integer, source: input, description: "Number of bags/bins the resident will leave out; >= 1" }
      - { name: est_weight_kg, type: number, source: computed, description: "bags_claimed * 4.0 (EST_KG_PER_BAG); used for route-day capacity" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ROUTED | COLLECTED | WEIGHED | SETTLED | NO_SHOW | CANCELLED", default: SCHEDULED }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Increments on each reschedule; hard cap 3 (MAX_RESCHEDULES)" }
      - { name: rebook_count, type: integer, source: system, default: 0, description: "Increments on each rebook after NO_SHOW; hard cap 2 (MAX_REBOOKS)" }
      - { name: driver_id, type: string, source: system, default: null, description: "Opaque driver id assigned at route; mark-collected/mark-no-show require X-User-ID == driver_id" }
      - { name: service_date, type: string, source: system, default: null, description: "YYYY-MM-DD route day assigned at route; capacity is aggregated per (driver_id, service_date)" }

  - name: Partner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner display name" }
      - { name: partner_type, type: enum, source: input, description: "BRAND | THRIFT" }
      - { name: accepted_grades, type: array, source: input, description: "Non-empty subset of [RESALE, RECYCLE, FIBER]; selector eligibility filter" }
      - { name: capacity_kg, type: integer, source: input, description: "Total material capacity in whole kg; > 0" }
      - { name: committed_kg, type: number, source: computed, default: 0, description: "Sum of assigned_weight_kg over ACCEPTED RoutingAssignments" }
      - { name: completed_kg, type: number, source: computed, default: 0, description: "Sum of assigned_weight_kg over COMPLETED RoutingAssignments" }
      - { name: remaining_kg, type: number, source: computed, description: "capacity_kg - committed_kg - completed_kg" }
      - { name: routing_score, type: number, source: computed, default: 100, description: "Rolling 30-day penalty score (see partner_quality_scores, variant rolling_window); < 40 (SCORE_FLOOR) forces status SUSPENDED" }
      - { name: report_score, type: number, source: computed, default: 100, description: "Decay-weighted all-time score (variant decay_weighted); reporting only, never used for routing" }
      - { name: status, type: enum, source: system, description: "ELIGIBLE | SUSPENDED | QUARANTINED", default: ELIGIBLE }

  - name: RoutingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> WeightTicket.id; the certified load being routed (path parameter of the creating endpoint)" }
      - { name: partner_id, type: string, source: system, description: "FK -> Partner.id; chosen by the server-side selector policy (eligibility filter -> routing_score DESC -> created_at ASC)" }
      - { name: assigned_weight_kg, type: number, source: system, description: "Snapshot of ticket.certified_weight_kg at creation" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | COMPLETED", default: PENDING }
      - { name: decline_reason, type: string, source: system, default: null, description: "Free-text from decline, or SYSTEM_QUARANTINE when auto-declined by ticket quarantine" }

  - name: DropBox
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone hosting the box" }
      - { name: label, type: string, source: input, description: "Human label (e.g. 'Box-17 Maple St')" }
      - { name: location, type: string, source: input, description: "Free-text location" }
      - { name: fill_pct, type: number, source: computed, default: 0, description: "fill_pct of the latest FillReading by recorded_at (tie: latest created_at); 0 after a collection" }
      - { name: posture, type: enum, source: computed, description: "OK | FILLING | FULL_PENDING_COLLECTION — derived from fill_pct (>= 85.0 FULL_PENDING_COLLECTION, >= 50.0 FILLING, else OK)", default: OK }
      - { name: last_collected_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent collection" }

  - name: FillReading
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: dropbox_id, type: string, source: input, description: "FK -> DropBox.id; box the sensor reading belongs to (path parameter)" }
      - { name: fill_pct, type: number, source: input, description: "Sensor fill percentage; 0 <= fill_pct <= 100" }
      - { name: recorded_at, type: datetime, source: input, description: "Sensor-side timestamp (ISO8601 UTC) used for latest-reading resolution" }

  - name: WeightTicket
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: system, description: "PICKUP_REQUEST | DROPBOX — set from the creation endpoint" }
      - { name: source_id, type: string, source: system, description: "FK -> PickupRequest.id (when source_type=PICKUP_REQUEST) or FK -> DropBox.id (when source_type=DROPBOX); polymorphic source reference" }
      - { name: provisional_weight_kg, type: number, source: input, description: "Driver field-scale weight recorded at collection; > 0" }
      - { name: certified_weight_kg, type: number, source: system, default: null, description: "Facility-scale weight supplied at certify; > 0" }
      - { name: grade, type: enum, source: system, default: null, description: "RESALE | RECYCLE | FIBER — material grade assigned at certify" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | CERTIFIED | QUARANTINED | VOIDED", default: PROVISIONAL }
      - { name: projected_credit_cents, type: integer, source: computed, description: "Provisional-variant credit projection computed at creation (provisional weight, assumed RECYCLE grade, no contamination, uncapped sponsor bonus)" }
      - { name: highest_upheld_severity, type: enum, source: computed, default: NONE, description: "NONE | MINOR | MAJOR | SEVERE — max severity over UPHELD ContaminationReports on this ticket" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of certification; used by reporting-period windows" }

  - name: DiversionCredit
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> WeightTicket.id; the certified ticket backing this credit (path parameter)" }
      - { name: fund_id, type: string, source: system, default: null, description: "FK -> SponsorFund.id; the zone's ACTIVE fund selected at finalize" }
      - { name: beneficiary_resident_id, type: string, source: system, default: null, description: "Resident.id of the pickup's resident when ticket.source_type=PICKUP_REQUEST; null for DROPBOX sources" }
      - { name: projected_cents, type: integer, source: computed, description: "Uncapped projection at creation: after_contam + bulk_bonus + round_half_up(0.10 * after_contam) using certified weight, actual grade, current UPHELD severity" }
      - { name: gross_cents, type: integer, source: system, default: null, description: "Final value fixed at finalize: after_contam + bulk_bonus + sponsor_bonus where sponsor_bonus = min(uncapped, max(0, fund.available_cents - after_contam - bulk_bonus)); evaluation order pinned in diversion_credit_value" }
      - { name: applied_severity, type: enum, source: system, description: "Highest UPHELD severity snapshot used for the contamination multiplier", default: NONE }
      - { name: has_hold, type: boolean, source: system, default: false, description: "True while a sponsor-fund hold of gross_cents is outstanding (set by finalize, retained through dispute, cleared by settle or void)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | DISPUTED | SETTLED | VOIDED", default: PROVISIONAL }
      - { name: charity_allocations, type: array, source: system, default: [], description: "Frozen at settle: [{charity_id, pct, amount_cents}] per zone charity_splits, each line floored to whole cents (see charity_split_allocation)" }
      - { name: resident_share_cents, type: integer, source: system, default: null, description: "gross_cents - sum(charity line amounts) for pickup-sourced credits; null for DROPBOX-sourced credits (remainder folded into largest-pct charity line instead)" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of settlement; used by reporting-period windows" }

  - name: SponsorFund
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone whose credits this fund pays for" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor organization name" }
      - { name: initial_cents, type: integer, source: input, description: "Opening funding amount; > 0" }
      - { name: funded_total_cents, type: integer, source: system, description: "initial_cents + sum of topups; only grows" }
      - { name: held_cents, type: integer, source: computed, default: 0, description: "Sum of gross_cents over credits with has_hold=true on this fund" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of gross_cents over SETTLED credits on this fund" }
      - { name: available_cents, type: integer, source: computed, description: "funded_total_cents - held_cents - paid_cents; invariant: held + paid + available == funded_total" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED — at most one ACTIVE fund per zone", default: ACTIVE }

  - name: Charity
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Charity display name" }
      - { name: total_received_cents, type: integer, source: computed, default: 0, description: "Sum of charity line amounts over all SETTLED DiversionCredits" }

  - name: ContaminationReport
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> WeightTicket.id; inspected load (path parameter)" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | SEVERE" }
      - { name: notes, type: string, source: input, default: "", description: "Inspector notes (optional)" }
      - { name: status, type: enum, source: system, description: "OPEN | ADJUDICATED | DISMISSED", default: OPEN }
      - { name: outcome, type: enum, source: system, default: null, description: "UPHELD | OVERTURNED — set at adjudicate; null while OPEN or when DISMISSED" }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of the filing Inspector (opaque)" }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of adjudication; drives partner score windows and reporting aggregates" }

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone being reported (path parameter of the creating endpoint)" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive window start (ISO8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive window end; must be > period_start; half-open [start, end) windows of one zone must not overlap" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of close" }
      - { name: aggregates, type: object, source: computed, default: null, description: "Frozen at close: { total_certified_weight_kg, diverted_weight_kg, credits_settled_count, credits_settled_cents, charity_paid_cents, severe_reports_count, box_collections_count } — see reporting_period_aggregation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Resident
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when strikes reaches 3 = STRIKE_LIMIT after a contamination strike increment)"
        actor: system
        preconditions:
          - "strikes >= 3 after the increment"
        side_effects:
          - "Every PickupRequest of this resident in SCHEDULED auto-transitions to CANCELLED (ROUTED pickups are left for the driver to resolve)"
          - "New pickup requests, bag-kit orders, and rebooks for this resident are rejected with ERR_RESIDENT_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /residents/{id}/reactivate"
        actor: ZoneOperator
        preconditions:
          - "Resident must be SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "strikes reset to 0"

  - entity: BagKit
    initial_state: REQUESTED
    terminal_states: [RETIRED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /bag-kits/{id}/dispatch"
        actor: ZoneOperator
        preconditions: ["Kit must be REQUESTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /bag-kits/{id}/deliver"
        actor: Driver
        preconditions: ["Kit must be DISPATCHED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DELIVERED
        to: RETIRED
        trigger: "POST /bag-kits/{id}/retire OR system (all DELIVERED kits of a resident auto-retire when their pickup is mark-collected)"
        actor: "Resident (own kit) | ZoneOperator | system"
        preconditions: ["Kit must be DELIVERED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: PickupRequest
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /pickup-requests/{id}/reschedule"
        actor: "Resident (owner)"
        preconditions:
          - "Pickup must be SCHEDULED (else ERR_INVALID_STATE)"
          - "expected_pickup_version must equal current version (else ERR_STALE_VERSION)"
          - "New window: 60..240 minutes (ERR_INVALID_WINDOW), window_start >= now (ERR_WINDOW_IN_PAST), no buffered overlap with the resident's other SCHEDULED/ROUTED pickups (ERR_PICKUP_WINDOW_CONFLICT)"
          - "reschedule_count < 3 (MAX_RESCHEDULES, else ERR_RESCHEDULE_LIMIT_REACHED)"
        side_effects:
          - "reschedule_count += 1; version += 1; window replaced"
        note: "Self-loop revision cycle; OCC-guarded supersede of the schedule."
      - from: SCHEDULED
        to: ROUTED
        trigger: "POST /pickup-requests/{id}/route"
        actor: ZoneOperator
        preconditions:
          - "Pickup must be SCHEDULED (else ERR_INVALID_STATE)"
          - "Route-day capacity: sum of est_weight_kg over pickups in ROUTED with same (driver_id, service_date) + this est_weight_kg must be <= 800.0 (VEHICLE_CAPACITY_KG, else ERR_ROUTE_CAPACITY_EXCEEDED); exactly 800.0 is allowed"
        side_effects:
          - "driver_id and service_date set"
      - from: ROUTED
        to: COLLECTED
        trigger: "POST /pickup-requests/{id}/mark-collected"
        actor: "Driver (assigned: X-User-ID == driver_id)"
        preconditions:
          - "Pickup must be ROUTED (else ERR_INVALID_STATE)"
          - "Resident must have at least one BagKit in DELIVERED (else ERR_BAGS_NOT_DELIVERED)"
          - "provisional_weight_kg > 0"
        side_effects:
          - "Creates WeightTicket (source_type=PICKUP_REQUEST, source_id=pickup.id, status=PROVISIONAL) and computes its projected_credit_cents"
          - "All of the resident's BagKits in DELIVERED auto-transition to RETIRED"
      - from: COLLECTED
        to: WEIGHED
        trigger: "system (bubble-up when the pickup's WeightTicket is certified)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WEIGHED
        to: SETTLED
        trigger: "system (bubble-up when the DiversionCredit on the pickup's ticket settles)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ROUTED
        to: NO_SHOW
        trigger: "POST /pickup-requests/{id}/mark-no-show"
        actor: "Driver (assigned)"
        preconditions: ["Pickup must be ROUTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "driver_id and service_date cleared to null"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /pickup-requests/{id}/rebook"
        actor: "Resident (owner)"
        preconditions:
          - "Pickup must be NO_SHOW (else ERR_INVALID_STATE)"
          - "Resident must be ACTIVE (else ERR_RESIDENT_SUSPENDED)"
          - "rebook_count < 2 (MAX_REBOOKS, else ERR_REBOOK_LIMIT_REACHED)"
          - "New window passes shape/past/overlap checks (same as reschedule)"
        side_effects:
          - "rebook_count += 1; window replaced"
        note: "Cycle edge: SCHEDULED -> ROUTED -> NO_SHOW -> SCHEDULED."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pickup-requests/{id}/cancel OR system (resident suspension)"
        actor: "Resident (owner) | system"
        preconditions: ["Pickup must be SCHEDULED or ROUTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ROUTED
        to: CANCELLED
        trigger: "POST /pickup-requests/{id}/cancel"
        actor: "Resident (owner)"
        preconditions: ["Pickup must be SCHEDULED or ROUTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "driver_id and service_date cleared to null"

  - entity: Partner
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system (after any routing_score recompute — on report adjudication or on a routing-selector run — yields routing_score < 40 = SCORE_FLOOR)"
        actor: system
        preconditions: ["recomputed routing_score < 40"]
        side_effects:
          - "Partner excluded from the routing selector until reinstated"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "system (after a routing_score recompute yields routing_score >= 40)"
        actor: system
        preconditions: ["recomputed routing_score >= 40"]
        side_effects: []
      - from: ELIGIBLE
        to: QUARANTINED
        trigger: "system (a SEVERE ContaminationReport is adjudicated UPHELD on a ticket holding an ACCEPTED or COMPLETED assignment to this partner)"
        actor: system
        preconditions: []
        side_effects:
          - "Partner excluded from the routing selector; routing_score is still recomputed but cannot lift quarantine by itself"
      - from: SUSPENDED
        to: QUARANTINED
        trigger: "system (same rule as ELIGIBLE -> QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: SUSPENDED
        trigger: "POST /partners/{id}/remediate"
        actor: ZoneOperator
        preconditions: ["Partner must be QUARANTINED (else ERR_INVALID_STATE)"]
        side_effects:
          - "routing_score recomputed immediately; if >= 40 the partner continues to ELIGIBLE in the same request"

  - entity: RoutingAssignment
    initial_state: PENDING
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /routing-assignments/{id}/accept"
        actor: "PartnerManager (of assignment.partner_id)"
        preconditions:
          - "Assignment must be PENDING (else ERR_INVALID_STATE)"
          - "Capacity re-check: partner.committed_kg + assigned_weight_kg <= capacity_kg (else ERR_PARTNER_CAPACITY_EXCEEDED); equality allowed"
        side_effects:
          - "partner.committed_kg += assigned_weight_kg"
      - from: PENDING
        to: DECLINED
        trigger: "POST /routing-assignments/{id}/decline OR system (ticket quarantined -> decline_reason SYSTEM_QUARANTINE)"
        actor: "PartnerManager (of assignment.partner_id) | system"
        preconditions: ["Assignment must be PENDING (else ERR_INVALID_STATE)"]
        side_effects:
          - "Partner is excluded from the selector on subsequent routing attempts for this ticket"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /routing-assignments/{id}/complete"
        actor: "PartnerManager (of assignment.partner_id)"
        preconditions: ["Assignment must be ACCEPTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "partner.committed_kg -= assigned_weight_kg; partner.completed_kg += assigned_weight_kg"

  - entity: DropBox
    initial_state: OK
    terminal_states: []
    transitions:
      - from: OK
        to: FILLING
        trigger: "system (a FillReading becomes latest with 50.0 <= fill_pct < 85.0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OK
        to: FULL_PENDING_COLLECTION
        trigger: "system (a FillReading becomes latest with fill_pct >= 85.0)"
        actor: system
        preconditions: []
        side_effects:
          - "Box becomes eligible for POST /dropboxes/{id}/collections"
      - from: FILLING
        to: FULL_PENDING_COLLECTION
        trigger: "system (a FillReading becomes latest with fill_pct >= 85.0)"
        actor: system
        preconditions: []
        side_effects:
          - "Box becomes eligible for collection"
      - from: FILLING
        to: OK
        trigger: "system (a newer FillReading by recorded_at has fill_pct < 50.0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL_PENDING_COLLECTION
        to: OK
        trigger: "POST /dropboxes/{id}/collections (driver empties the box)"
        actor: Driver
        preconditions:
          - "posture must be FULL_PENDING_COLLECTION (else ERR_DROPBOX_NOT_FULL)"
          - "provisional_weight_kg > 0"
        side_effects:
          - "Creates WeightTicket (source_type=DROPBOX, source_id=dropbox.id, status=PROVISIONAL) with projected_credit_cents"
          - "fill_pct reset to 0; last_collected_at = current logical clock"
        note: "Cycle edge: OK -> FILLING -> FULL_PENDING_COLLECTION -> OK."
      - from: FULL_PENDING_COLLECTION
        to: FILLING
        trigger: "system (a newer FillReading by recorded_at has 50.0 <= fill_pct < 85.0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WeightTicket
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /weight-tickets/{id}/certify"
        actor: ZoneOperator
        preconditions:
          - "Ticket must be PROVISIONAL (else ERR_INVALID_STATE)"
          - "certified_weight_kg > 0; grade in {RESALE, RECYCLE, FIBER}"
        side_effects:
          - "certified_at = current logical clock"
          - "If source_type=PICKUP_REQUEST: source pickup COLLECTED -> WEIGHED (bubble-up)"
      - from: CERTIFIED
        to: QUARANTINED
        trigger: "system (a SEVERE ContaminationReport on this ticket is adjudicated UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "Any DiversionCredit on this ticket in PROVISIONAL, DISPUTED, or FINALIZED transitions to VOIDED; if it had has_hold=true the sponsor-fund hold is released (fund.held_cents -= gross_cents, fund.available_cents += gross_cents)"
          - "Any PENDING RoutingAssignment on this ticket transitions to DECLINED with decline_reason SYSTEM_QUARANTINE"
          - "Any partner holding an ACCEPTED or COMPLETED assignment on this ticket transitions to QUARANTINED (from ELIGIBLE or SUSPENDED)"
          - "If ticket.source_type=PICKUP_REQUEST: ticket's resident strikes += 1; if strikes reaches 3 the resident transitions ACTIVE -> SUSPENDED (with its own cascade)"
      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /weight-tickets/{id}/void"
        actor: ZoneOperator
        preconditions:
          - "Ticket must be CERTIFIED or QUARANTINED (else ERR_INVALID_STATE)"
          - "No SETTLED DiversionCredit may exist on this ticket (else ERR_INVALID_STATE)"
        side_effects:
          - "Any DiversionCredit on this ticket in PROVISIONAL, DISPUTED, or FINALIZED transitions to VOIDED; if has_hold=true the hold is released (fund.held_cents -= gross_cents, fund.available_cents += gross_cents)"
          - "Any PENDING RoutingAssignment on this ticket transitions to DECLINED with decline_reason SYSTEM_QUARANTINE"
      - from: QUARANTINED
        to: VOIDED
        trigger: "POST /weight-tickets/{id}/void"
        actor: ZoneOperator
        preconditions: ["Same as CERTIFIED -> VOIDED"]
        side_effects: ["Same as CERTIFIED -> VOIDED"]

  - entity: DiversionCredit
    initial_state: PROVISIONAL
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /diversion-credits/{id}/finalize"
        actor: ZoneOperator
        preconditions:
          - "Credit must be PROVISIONAL or DISPUTED (else ERR_INVALID_STATE)"
          - "No OPEN ContaminationReport on the ticket (else ERR_OPEN_REPORTS_REMAIN)"
          - "Zone must have an ACTIVE SponsorFund (else ERR_FUND_NOT_ACTIVE)"
          - "Recomputed gross_cents <= fund.available_cents (else ERR_FUND_INSUFFICIENT); sponsor_bonus is capped first, see diversion_credit_value"
        side_effects:
          - "gross_cents fixed at finalize (sponsor_bonus capped by fund headroom); fund_id set"
          - "If has_hold was false: fund.held_cents += gross_cents (available_cents -= gross_cents); has_hold = true. Finalize from DISPUTED with has_hold=true places no second hold."
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /diversion-credits/{id}/finalize"
        actor: ZoneOperator
        preconditions: ["Same as PROVISIONAL -> FINALIZED; if has_hold=true the hold is retained and no new hold is placed"]
        side_effects: ["Same as PROVISIONAL -> FINALIZED (hold placed only when has_hold=false)"]
      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /diversion-credits/{id}/dispute"
        actor: "Resident (beneficiary only) | ZoneOperator"
        preconditions: ["Credit must be PROVISIONAL or FINALIZED (else ERR_INVALID_STATE)"]
        side_effects: ["Hold state unchanged (has_hold retained)"]
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /diversion-credits/{id}/dispute"
        actor: "Resident (beneficiary only) | ZoneOperator"
        preconditions: ["Credit must be PROVISIONAL or FINALIZED (else ERR_INVALID_STATE)"]
        side_effects: ["Hold retained: fund.held_cents unchanged"]
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /diversion-credits/{id}/settle"
        actor: ZoneOperator
        preconditions:
          - "Credit must be FINALIZED (else ERR_CREDIT_NOT_FINAL; SETTLED/VOIDED yield ERR_INVALID_STATE)"
          - "has_hold must be true"
        side_effects:
          - "fund.held_cents -= gross_cents; fund.paid_cents += gross_cents (hold converts to payment)"
          - "charity_allocations computed per charity_split_allocation and frozen; each charity's total_received_cents += its line amount"
          - "Pickup-sourced: resident_share_cents = gross_cents - sum(charity lines); beneficiary resident.credit_balance_cents += resident_share_cents; source pickup WEIGHED -> SETTLED (bubble-up). DROPBOX-sourced: remainder folds into the largest-pct charity line (tie -> earliest charity created_at ASC)"
          - "settled_at = current logical clock"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /diversion-credits/{id}/void OR system (ticket voided or quarantined)"
        actor: "ZoneOperator | system"
        preconditions: ["Credit must be PROVISIONAL, DISPUTED, or FINALIZED (else ERR_INVALID_STATE)"]
        side_effects: ["If has_hold=true: fund.held_cents -= gross_cents, fund.available_cents += gross_cents; has_hold = false"]
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /diversion-credits/{id}/void OR system (ticket voided or quarantined)"
        actor: "ZoneOperator | system"
        preconditions: ["Same as PROVISIONAL -> VOIDED"]
        side_effects: ["Same hold-release rule as PROVISIONAL -> VOIDED"]
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /diversion-credits/{id}/void OR system (ticket voided or quarantined)"
        actor: "ZoneOperator | system"
        preconditions: ["Same as PROVISIONAL -> VOIDED"]
        side_effects: ["fund.held_cents -= gross_cents, fund.available_cents += gross_cents; has_hold = false"]

  - entity: SponsorFund
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /sponsor-funds/{id}/close"
        actor: ZoneOperator
        preconditions:
          - "Fund must be ACTIVE (else ERR_INVALID_STATE)"
          - "held_cents must be 0 (else ERR_INVALID_STATE — open holds block close)"
        side_effects:
          - "Zone may then create a new ACTIVE fund"

  - entity: ContaminationReport
    initial_state: OPEN
    terminal_states: [ADJUDICATED, DISMISSED]
    transitions:
      - from: OPEN
        to: ADJUDICATED
        trigger: "POST /contamination-reports/{id}/adjudicate"
        actor: ZoneOperator
        preconditions:
          - "Report must be OPEN (else ERR_INVALID_STATE)"
          - "outcome in {UPHELD, OVERTURNED}"
        side_effects:
          - "adjudicated_at = current logical clock"
          - "UPHELD: ticket.highest_upheld_severity recomputed (max of UPHELD severities); if severity is SEVERE the ticket CERTIFIED -> QUARANTINED cascade fires (see WeightTicket); MAJOR/SEVERE on a PICKUP_REQUEST ticket increments the resident's strikes (suspension cascade at 3)"
          - "UPHELD MAJOR or SEVERE: routing_score and report_score recomputed for every partner holding an ACCEPTED or COMPLETED assignment on this ticket; ELIGIBLE -> SUSPENDED fires if routing_score < 40"
          - "OVERTURNED: no penalties"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /contamination-reports/{id}/dismiss"
        actor: ZoneOperator
        preconditions: ["Report must be OPEN (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: ReportingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /reporting-periods/{id}/close"
        actor: ZoneOperator
        preconditions:
          - "Period must be OPEN (else ERR_PERIOD_NOT_OPEN)"
          - "No WeightTicket in PROVISIONAL whose source belongs to this zone (else ERR_OPEN_TICKETS_REMAIN)"
        side_effects:
          - "aggregates frozen per reporting_period_aggregation; closed_at = current logical clock"
          - "Frozen aggregates never change afterwards, regardless of later mutations"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: pickup-reschedule-stale-version
    parent_entity: PickupRequest
    write_endpoint: "POST /pickup-requests/{id}/reschedule"
    occ_field: expected_pickup_version
    description: |
      Rescheduling a PickupRequest whose version has advanced since the client
      last observed it is rejected. A reschedule legitimately supersedes the
      previous schedule, so a client holding a stale version would silently
      discard the newer window; the server rejects it with a stale-version
      precondition failure instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: zone-split-update-stale-version
    parent_entity: ServiceZone
    write_endpoint: "PUT /service-zones/{id}/charity-split"
    occ_field: expected_zone_version
    description: |
      Replacing a ServiceZone's charity_splits whose version has advanced since
      the client last observed it is rejected. A split update legitimately
      supersedes the previous split configuration, so a client holding a stale
      version would silently discard the newer configuration; the server
      rejects it with a stale-version precondition failure instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_pickup_weight
    trigger: "PickupRequest creation (est_weight_kg)"
    algorithm: aggregation
    formula: |
      est_weight_kg = bags_claimed * EST_KG_PER_BAG
    input_set: "the PickupRequest being created"
    constants:
      EST_KG_PER_BAG: 4.0
    precision: "1 decimal place exact (4.0 * integer)"

  - name: projected_credit_cents_rule
    trigger: "WeightTicket creation (mark-collected or drop-box collection)"
    algorithm: forward_looking
    formula: |
      base_cents      = round_half_up(provisional_weight_kg * RATE_CENTS_PER_KG[RECYCLE])
      after_contam    = base_cents                       # MULT[NONE] = 1.0
      bulk_bonus      = BULK_BONUS_CENTS if provisional_weight_kg >= BULK_THRESHOLD_KG else 0
      sponsor_bonus   = round_half_up(SPONSOR_BONUS_PCT * after_contam)   # uncapped here
      projected_credit_cents = after_contam + bulk_bonus + sponsor_bonus
    input_set: "the WeightTicket being created"
    constants:
      BULK_THRESHOLD_KG: 20.0
      BULK_BONUS_CENTS: 500
      SPONSOR_BONUS_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_variant
        when: "at ticket creation"
        difference: "uses provisional_weight_kg, assumed grade RECYCLE, severity NONE, sponsor bonus uncapped"
      - name: final_variant
        when: "at DiversionCredit creation/finalize (see diversion_credit_value)"
        difference: "uses certified_weight_kg, actual grade, actual UPHELD severity, sponsor bonus capped by fund headroom — for identical loads the two variants produce different cent values"

  - name: diversion_credit_value
    trigger: "DiversionCredit creation (projected_cents) and DiversionCredit finalize (gross_cents)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial formula, mode (a): >= 3 inputs with non-linear interaction
      # (tiered rate by grade, conditional bulk jump, contamination multiplier,
      # nested min() against fund headroom). Evaluation order pinned:
      # (1) base, (2) contamination, (3) bulk, (4) sponsor bonus capped by
      # headroom computed from (2)+(3), (5) total. The bonus depends on a value
      # that itself must be known before the bonus — the pinned order resolves it.
      base_cents      = round_half_up(certified_weight_kg * RATE_CENTS_PER_KG[grade])
      sev             = ticket.highest_upheld_severity    # NONE|MINOR|MAJOR|SEVERE
      after_contam    = round_half_up(base_cents * CONTAM_MULT[sev])
      bulk_bonus      = BULK_BONUS_CENTS if certified_weight_kg >= BULK_THRESHOLD_KG else 0
      uncapped_bonus  = round_half_up(SPONSOR_BONUS_PCT * after_contam)
      # finalize only: cap the bonus by the fund's headroom after the material cost
      headroom        = max(0, fund.available_cents - after_contam - bulk_bonus)
      sponsor_bonus   = min(uncapped_bonus, headroom)     # at creation: sponsor_bonus = uncapped_bonus (projected_cents)
      value_cents     = after_contam + bulk_bonus + sponsor_bonus
      # finalize rejects when after_contam + bulk_bonus alone exceed availability:
      #   after_contam + bulk_bonus > fund.available_cents  -> ERR_FUND_INSUFFICIENT
    input_set: "the ticket (certified weight, grade, UPHELD reports), the zone's ACTIVE SponsorFund (finalize only)"
    constants:
      RATE_CENTS_PER_KG: { RESALE: 120, RECYCLE: 45, FIBER: 20 }
      CONTAM_MULT: { NONE: 1.0, MINOR: 0.9, MAJOR: 0.5, SEVERE: 0.0 }
      BULK_THRESHOLD_KG: 20.0
      BULK_BONUS_CENTS: 500
      SPONSOR_BONUS_PCT: 0.10
    precision: "integer cents, round_half_up at each rounding step"

  - name: charity_split_allocation
    trigger: "DiversionCredit settle"
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial formula, mode (b): nested rounding — the order matters.
      # PINNED ORDER: round each charity line DOWN to whole cents FIRST, then
      # assign the remainder. ("round total then split" would give different
      # cents; that order is rejected.)
      for each line in zone.charity_splits, ordered by charity created_at ASC:
        line_cents = floor(gross_cents * line.pct / 100)
      remainder = gross_cents - sum(line_cents)
      if credit.beneficiary_resident_id is not null:
        resident_share_cents = remainder            # resident absorbs rounding remainder
      else:                                          # DROPBOX-sourced credit
        resident_share_cents = null
        remainder is added to the line with the largest pct;
        tie between lines -> the charity with earliest created_at ASC
      # charity.total_received_cents incremented by final line amounts
    input_set: "the settling credit's gross_cents and its zone's charity_splits"
    constants: {}
    precision: "integer cents; floor per line"

  - name: partner_quality_scores
    trigger: "recomputed on (a) contamination adjudication UPHELD, (b) every routing-selector run, (c) read of GET /partners/{id}; status side effects fire only on (a) and (b)"
    algorithm: decay_function
    formula: |
      # Dual-variant scoring over the same report set; the two variants differ.
      # Event set R(p) = ContaminationReports with outcome=UPHELD on tickets that
      # hold a RoutingAssignment to partner p in status ACCEPTED or COMPLETED.
      # penalty(SEVERE) = 20, penalty(MAJOR) = 15, penalty(MINOR) = 0.
      rolling_window (routing_score):
        R30 = { r in R(p) : r.adjudicated_at in [now - 30 days, now] }   # half-open on the left bound: adjudicated_at >= now-30d
        routing_score = max(0, 100 - sum(penalty(r) for r in R30))
      decay_weighted (report_score):
        report_score = round_half_up_2dp( max(0, 100 - sum( penalty(r) * 0.5^(age_days(r)/30) for r in R(p) )) )
        where age_days(r) = (now - r.adjudicated_at) in days, fractional
      # Status effects (only from trigger (a)/(b) recomputes):
      #   ELIGIBLE and routing_score < SCORE_FLOOR -> SUSPENDED
      #   SUSPENDED and routing_score >= SCORE_FLOOR -> ELIGIBLE
      #   QUARANTINED: no automatic transitions (remediate only)
    input_set: "UPHELD adjudicated reports linked via ACCEPTED/COMPLETED assignments to the partner; current logical clock"
    constants:
      SCORE_FLOOR: 40
      PENALTY_SEVERE: 20
      PENALTY_MAJOR: 15
      PENALTY_MINOR: 0
      WINDOW_DAYS: 30
      DECAY_HALF_LIFE_DAYS: 30
    precision: "routing_score: integer; report_score: 2 decimal places, round_half_up"
    variants:
      - name: rolling_window
        when: "operational routing (selector eligibility and ranking)"
        difference: "reports older than 30 days contribute 0 — a partner recovers fully once findings age out"
      - name: decay_weighted
        when: "reporting (GET /partners/{id}.report_score)"
        difference: "all findings contribute forever, halving every 30 days — for the same report set the two variants produce different numbers once any finding is older than 30 days"

  - name: dropbox_fill_posture
    trigger: "every FillReading creation and every drop-box collection"
    algorithm: threshold
    formula: |
      latest = reading with max recorded_at for the box (tie: max created_at)
      fill_pct = latest.fill_pct   # after a collection: 0
      posture = FULL_PENDING_COLLECTION if fill_pct >= 85.0
                else FILLING           if fill_pct >= 50.0
                else OK
      # Boundary is inclusive: exactly 85.0 flips to FULL_PENDING_COLLECTION; 84.99 does not.
    input_set: "all FillReadings of the DropBox"
    constants:
      FULL_THRESHOLD_PCT: 85.0
      FILLING_THRESHOLD_PCT: 50.0
    precision: "fill_pct compared at up to 2 decimal places, inclusive >="

  - name: resident_strike_accumulation
    trigger: "contamination adjudication UPHELD with severity MAJOR or SEVERE on a ticket whose source_type=PICKUP_REQUEST"
    algorithm: threshold
    formula: |
      resident.strikes += 1
      if resident.strikes >= STRIKE_LIMIT and resident.status == ACTIVE:
        resident.status = SUSPENDED
        # cascade: cancel the resident's SCHEDULED pickups
    input_set: "the ticket's source pickup's resident"
    constants:
      STRIKE_LIMIT: 3
    precision: "integer count; boundary is inclusive (exactly 3 suspends)"

  - name: sponsor_fund_ledger
    trigger: "credit finalize (hold), credit settle (commit), credit void/quarantine release, topup"
    algorithm: waterfall_allocation
    formula: |
      hold:     held_cents += gross_cents                                  # available_cents falls
      release:  held_cents -= gross_cents                                  # available_cents rises
      commit:   held_cents -= gross_cents; paid_cents += gross_cents       # available_cents unchanged
      topup:    funded_total_cents += amount_cents                         # available_cents rises
      available_cents = funded_total_cents - held_cents - paid_cents
      INVARIANT (conserved quantity, money): at all times
        held_cents + paid_cents + available_cents == funded_total_cents
      finalize + void of the same credit leave available_cents unchanged.
    input_set: "the zone's ACTIVE fund and the credit being moved"
    constants: {}
    precision: "integer cents"

  - name: reporting_period_aggregation
    trigger: "POST /reporting-periods/{id}/close"
    algorithm: chronological
    formula: |
      Window W = [period_start, period_end)  # half-open: end instant excluded
      Let T = WeightTickets whose source belongs to the period's zone
        (PICKUP_REQUEST: source pickup's resident.zone_id == zone;
         DROPBOX: source dropbox.zone_id == zone)
      aggregates = {
        total_certified_weight_kg : sum(t.certified_weight_kg for t in T
                                        where t.certified_at in W),   # regardless of later status
        diverted_weight_kg        : sum(t.certified_weight_kg for t in T
                                        where t.certified_at in W and t.status == CERTIFIED at close),
        credits_settled_count     : count(c in credits on T where c.settled_at in W and c.status == SETTLED at close),
        credits_settled_cents     : sum(c.gross_cents for the same set),
        charity_paid_cents        : sum of all charity line amounts in charity_allocations of the same set,
        severe_reports_count      : count(ContaminationReports on T with outcome=UPHELD,
                                          severity=SEVERE, adjudicated_at in W),
        box_collections_count     : count(t in T where t.source_type == DROPBOX and t.created_at in W)
      }
      Aggregates are frozen at close; later mutations never rewrite them.
    input_set: "zone-scoped tickets, credits on those tickets, reports on those tickets; half-open window [start, end)"
    constants: {}
    precision: "weights 2 decimal places; counts and cents integers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is in the endpoint's role list; entity-backed ownership: Resident X-User-ID must equal the target/owning resident id (and pickup body resident_id); PartnerManager X-User-ID must equal the assignment's partner_id; SponsorManager X-User-ID must equal the fund id; CharityAdmin X-User-ID must equal the charity id; Driver X-User-ID must equal pickup.driver_id on mark-collected/mark-no-show when driver_id is set (ROUTED); un-routed pickups pass any Driver to the state check"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Request well-formedness: required fields present; no undeclared fields; types, enums, and ranges valid (fill_pct in [0,100]; bags_claimed >= 1 integer; provisional/certified weight > 0; amount_cents > 0; outcome in {UPHELD, OVERTURNED}; kit_type/partner_type/severity/grade valid enum members; accepted_grades non-empty subset of [RESALE, RECYCLE, FIBER]; capacity_kg > 0; initial_cents > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right; body-referenced ids (resident_id, zone_id, every charity_id inside charity_splits) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 5
    category: state
    check: "Target entity state permits the operation per §1.2: generic violations -> ERR_INVALID_STATE; dedicated forms: mark-collected requires ROUTED (ERR_INVALID_STATE); routing-assignments/diversion-credit creation require ticket status in {CERTIFIED, QUARANTINED} (PROVISIONAL or VOIDED -> ERR_TICKET_NOT_CERTIFIED); collections require FULL_PENDING_COLLECTION (ERR_DROPBOX_NOT_FULL); settle requires FINALIZED (PROVISIONAL/DISPUTED -> ERR_CREDIT_NOT_FINAL; SETTLED/VOIDED -> ERR_INVALID_STATE); period close requires OPEN (ERR_PERIOD_NOT_OPEN); pickup create / bag-kit create / rebook require resident ACTIVE (ERR_RESIDENT_SUSPENDED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_pickup_version == pickup.version on reschedule; expected_zone_version == zone.version on charity-split update"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pickup-requests/{id}/reschedule, PUT /service-zones/{id}/charity-split"
  - priority: 7
    category: business_safety
    check: "Quarantine gate: routing-assignment creation and diversion-credit creation on a QUARANTINED ticket are rejected (ticket passed the p5 state gate precisely because it is QUARANTINED)"
    error_id: ERR_TICKET_QUARANTINED
    http_status: 409
    applies_to: "POST /weight-tickets/{id}/routing-assignments, POST /weight-tickets/{id}/diversion-credits"
  - priority: 8
    category: business_temporal
    check: "Window shape: window_end > window_start and duration in [60, 240] minutes (ERR_INVALID_WINDOW); window_start >= current logical clock (ERR_WINDOW_IN_PAST); reporting period: period_end > period_start (ERR_INVALID_WINDOW) and its half-open window must not overlap another period of the same zone — adjacency (end == start) is allowed (ERR_PERIOD_OVERLAP); contamination reports are fileable only while the ticket is CERTIFIED and no SETTLED credit exists on it (ERR_REPORT_WINDOW_CLOSED)"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "pickup create/reschedule/rebook; reporting-period create; contamination-report create"
  - priority: 9
    category: business_constraint
    check: "In declared sub-order: (a) buffered window overlap vs the resident's other SCHEDULED/ROUTED pickups: conflict iff new.window_start < existing.window_end + 30min AND existing.window_start < new.window_end + 30min (ERR_PICKUP_WINDOW_CONFLICT; a gap of exactly 30 minutes passes); (b) resident has fewer than 2 BagKits in {REQUESTED, DISPATCHED, DELIVERED} (ERR_KIT_LIMIT_EXCEEDED); (c) reschedule_count < 3 (ERR_RESCHEDULE_LIMIT_REACHED); (d) rebook_count < 2 (ERR_REBOOK_LIMIT_REACHED); (e) charity_splits: pcts integers in 1..100, ids unique, sum(pct) <= 100 (ERR_SPLIT_SUM_INVALID); (f) no other ACTIVE SponsorFund in the zone at fund creation (ERR_FUND_ALREADY_ACTIVE); (g) no non-VOIDED credit already exists for the ticket (ERR_CREDIT_EXISTS); (h) no OPEN ContaminationReport on the ticket at credit create or finalize (ERR_OPEN_REPORTS_REMAIN); (i) no PENDING/ACCEPTED RoutingAssignment exists for the ticket at routing-assignment creation (ERR_ASSIGNMENT_PENDING_EXISTS); (j) selector pool non-empty (ERR_NO_ELIGIBLE_PARTNER); (k) period close: no PROVISIONAL tickets in the zone (ERR_OPEN_TICKETS_REMAIN)"
    error_id: ERR_PICKUP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "domain write endpoints as listed"
  - priority: 10
    category: business_referential
    check: "mark-collected: resident owns at least one BagKit in DELIVERED (ERR_BAGS_NOT_DELIVERED); credit finalize: zone has an ACTIVE SponsorFund (ERR_FUND_NOT_ACTIVE)"
    error_id: ERR_BAGS_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /pickup-requests/{id}/mark-collected, POST /diversion-credits/{id}/finalize"
  - priority: 11
    category: business_fiscal
    check: "credit finalize: after_contam + bulk_bonus <= fund.available_cents after bonus capping (ERR_FUND_INSUFFICIENT); route: route-day est weight sum <= 800.0 (ERR_ROUTE_CAPACITY_EXCEEDED); assignment accept: committed_kg + assigned_weight_kg <= capacity_kg (ERR_PARTNER_CAPACITY_EXCEEDED)"
    error_id: ERR_FUND_INSUFFICIENT
    http_status: 409
    applies_to: "POST /diversion-credits/{id}/finalize, POST /pickup-requests/{id}/route, POST /routing-assignments/{id}/accept"

# =============================================================================
# §1.5 API Endpoint Table (66 endpoints)
# =============================================================================
endpoints:
  # --- ServiceZone ---
  - { method: POST, path: "/service-zones", description: "Create a service zone", roles: [ZoneOperator], code: 201, input: [name], output: ServiceZone, side_effects: ["charity_splits defaults to []"] }
  - { method: GET, path: "/service-zones/{id}", description: "Get a service zone", roles: [ZoneOperator, Resident, Driver, PartnerManager, Inspector, SponsorManager, CharityAdmin, SensorGateway], code: 200, input: [], output: ServiceZone, side_effects: [] }
  - method: PUT
    path: "/service-zones/{id}/charity-split"
    description: "Replace the zone's charity split configuration (OCC-guarded supersede)"
    roles: [ZoneOperator]
    code: 200
    input: [charity_splits, expected_zone_version]
    output: ServiceZone
    side_effects: ["increments ServiceZone.version by 1", "new splits apply only to credits settled after this call"]
  - { method: GET, path: "/service-zones/{id}/residents", description: "List residents of a zone", roles: [ZoneOperator], code: 200, input: ["limit?", "offset?"], output: "Resident[]", side_effects: [] }
  - { method: GET, path: "/service-zones/{id}/dropboxes", description: "List drop boxes of a zone", roles: [ZoneOperator, Driver, SensorGateway], code: 200, input: ["limit?", "offset?"], output: "DropBox[]", side_effects: [] }
  - { method: GET, path: "/service-zones/{id}/sponsor-funds", description: "List sponsor funds of a zone", roles: [ZoneOperator, SponsorManager], code: 200, input: ["limit?", "offset?"], output: "SponsorFund[]", side_effects: [] }
  - { method: GET, path: "/service-zones/{id}/reporting-periods", description: "List reporting periods of a zone", roles: [ZoneOperator, SponsorManager, CharityAdmin], code: 200, input: ["limit?", "offset?"], output: "ReportingPeriod[]", side_effects: [] }
  - { method: POST, path: "/service-zones/{id}/reporting-periods", description: "Open a reporting period for a zone", roles: [ZoneOperator], code: 201, input: [period_start, period_end], output: ReportingPeriod, side_effects: ["status=OPEN"] }

  # --- Resident ---
  - { method: POST, path: "/residents", description: "Enroll a resident", roles: [ZoneOperator], code: 201, input: [zone_id, full_name, email, address], output: Resident, side_effects: ["status=ACTIVE, strikes=0"] }
  - { method: GET, path: "/residents/{id}", description: "Get a resident (Resident role: self only)", roles: [ZoneOperator, Resident], code: 200, input: [], output: Resident, side_effects: [] }
  - { method: POST, path: "/residents/{id}/reactivate", description: "Reinstate a SUSPENDED resident and reset strikes", roles: [ZoneOperator], code: 200, input: [], output: Resident, side_effects: ["status=ACTIVE, strikes=0"] }
  - { method: GET, path: "/residents/{id}/bag-kits", description: "List a resident's bag kits", roles: [ZoneOperator, Resident], code: 200, input: ["limit?", "offset?"], output: "BagKit[]", side_effects: [] }
  - { method: POST, path: "/residents/{id}/bag-kits", description: "Resident orders a bag/bin kit (self only; resident must be ACTIVE; max 2 active kits)", roles: [Resident], code: 201, input: [kit_type], output: BagKit, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/residents/{id}/pickup-requests", description: "List a resident's pickup requests", roles: [ZoneOperator, Resident, Driver], code: 200, input: ["limit?", "offset?"], output: "PickupRequest[]", side_effects: [] }

  # --- BagKit ---
  - { method: POST, path: "/bag-kits/{id}/dispatch", description: "Mark kit dispatched to the resident", roles: [ZoneOperator], code: 200, input: [], output: BagKit, side_effects: ["status: REQUESTED->DISPATCHED"] }
  - { method: POST, path: "/bag-kits/{id}/deliver", description: "Mark kit delivered", roles: [Driver], code: 200, input: [], output: BagKit, side_effects: ["status: DISPATCHED->DELIVERED"] }
  - { method: POST, path: "/bag-kits/{id}/retire", description: "Retire a delivered kit (Resident: own kit only)", roles: [Resident, ZoneOperator], code: 200, input: [], output: BagKit, side_effects: ["status: DELIVERED->RETIRED"] }

  # --- PickupRequest ---
  - { method: POST, path: "/pickup-requests", description: "Schedule a pickup (window 60-240 min, future, buffered-overlap checked)", roles: [Resident], code: 201, input: [resident_id, window_start, window_end, bags_claimed], output: PickupRequest, side_effects: ["status=SCHEDULED; est_weight_kg = bags_claimed * 4.0"] }
  - { method: GET, path: "/pickup-requests/{id}", description: "Get a pickup request", roles: [ZoneOperator, Resident, Driver], code: 200, input: [], output: PickupRequest, side_effects: [] }
  - method: POST
    path: "/pickup-requests/{id}/reschedule"
    description: "Reschedule a SCHEDULED pickup (OCC-guarded; max 3 reschedules)"
    roles: [Resident]
    code: 200
    input: [window_start, window_end, expected_pickup_version]
    output: PickupRequest
    side_effects: ["increments PickupRequest.version by 1", "reschedule_count += 1", "window replaced"]
  - { method: POST, path: "/pickup-requests/{id}/cancel", description: "Cancel a SCHEDULED or ROUTED pickup", roles: [Resident], code: 200, input: [], output: PickupRequest, side_effects: ["status->CANCELLED; driver_id/service_date cleared"] }
  - { method: POST, path: "/pickup-requests/{id}/rebook", description: "Rebook a NO_SHOW pickup into a new window (max 2 rebooks; resident ACTIVE)", roles: [Resident], code: 200, input: [window_start, window_end], output: PickupRequest, side_effects: ["status: NO_SHOW->SCHEDULED; rebook_count += 1"] }
  - { method: POST, path: "/pickup-requests/{id}/route", description: "Assign driver and service date (route-day capacity <= 800 kg)", roles: [ZoneOperator], code: 200, input: [driver_id, service_date], output: PickupRequest, side_effects: ["status: SCHEDULED->ROUTED"] }
  - method: POST
    path: "/pickup-requests/{id}/mark-collected"
    description: "Driver records curb-side collection; creates the PROVISIONAL WeightTicket"
    roles: [Driver]
    code: 201
    input: [provisional_weight_kg]
    output: WeightTicket
    side_effects: ["pickup ROUTED->COLLECTED", "WeightTicket created with projected_credit_cents", "resident's DELIVERED BagKits -> RETIRED"]
  - { method: POST, path: "/pickup-requests/{id}/mark-no-show", description: "Driver marks the resident a no-show", roles: [Driver], code: 200, input: [], output: PickupRequest, side_effects: ["status: ROUTED->NO_SHOW; driver_id/service_date cleared"] }
  - { method: GET, path: "/pickup-requests/{id}/weight-tickets", description: "List weight tickets of a pickup (0..1)", roles: [ZoneOperator, Resident, Driver, Inspector], code: 200, input: ["limit?", "offset?"], output: "WeightTicket[]", side_effects: [] }

  # --- Partner & RoutingAssignment ---
  - { method: POST, path: "/partners", description: "Register a brand/thrift partner", roles: [ZoneOperator], code: 201, input: [name, partner_type, accepted_grades, capacity_kg], output: Partner, side_effects: ["status=ELIGIBLE, scores=100"] }
  - { method: GET, path: "/partners/{id}", description: "Get a partner (scores recomputed on read with the current logical clock; no status transitions fire on read)", roles: [ZoneOperator, PartnerManager], code: 200, input: [], output: Partner, side_effects: [] }
  - { method: POST, path: "/partners/{id}/remediate", description: "Lift quarantine: QUARANTINED -> SUSPENDED, then immediate recompute may continue to ELIGIBLE", roles: [ZoneOperator], code: 200, input: [], output: Partner, side_effects: ["status: QUARANTINED->SUSPENDED; routing_score recompute; if >= 40 then -> ELIGIBLE"] }
  - { method: GET, path: "/partners/{id}/routing-assignments", description: "List a partner's routing assignments", roles: [ZoneOperator, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "RoutingAssignment[]", side_effects: [] }
  - method: POST
    path: "/weight-tickets/{id}/routing-assignments"
    description: "Run the routing selector for a certified ticket and create a PENDING assignment"
    roles: [ZoneOperator]
    code: 201
    input: []
    output: RoutingAssignment
    side_effects:
      - "Selector: recompute routing_score for ALL partners (applying ELIGIBLE<->SUSPENDED transitions); eligible pool = partners with status ELIGIBLE, grade in accepted_grades, remaining_kg >= certified_weight_kg, and no DECLINED assignment for this ticket"
      - "Ranking: routing_score DESC; tie -> partner created_at ASC; empty pool -> ERR_NO_ELIGIBLE_PARTNER"
      - "assigned_weight_kg = ticket.certified_weight_kg"
  - { method: GET, path: "/weight-tickets/{id}/routing-assignments", description: "List routing assignments of a ticket", roles: [ZoneOperator, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "RoutingAssignment[]", side_effects: [] }
  - { method: POST, path: "/routing-assignments/{id}/accept", description: "Partner accepts an assignment (capacity re-checked)", roles: [PartnerManager], code: 200, input: [], output: RoutingAssignment, side_effects: ["status: PENDING->ACCEPTED; partner.committed_kg += assigned_weight_kg"] }
  - { method: POST, path: "/routing-assignments/{id}/decline", description: "Partner declines; partner excluded from selector retries for this ticket", roles: [PartnerManager], code: 200, input: ["reason?"], output: RoutingAssignment, side_effects: ["status: PENDING->DECLINED"] }
  - { method: POST, path: "/routing-assignments/{id}/complete", description: "Partner confirms material received", roles: [PartnerManager], code: 200, input: [], output: RoutingAssignment, side_effects: ["status: ACCEPTED->COMPLETED; committed_kg -= w; completed_kg += w"] }

  # --- DropBox & FillReading ---
  - { method: POST, path: "/dropboxes", description: "Install a drop box", roles: [ZoneOperator], code: 201, input: [zone_id, label, location], output: DropBox, side_effects: ["fill_pct=0, posture=OK"] }
  - { method: GET, path: "/dropboxes/{id}", description: "Get a drop box (fill_pct and posture)", roles: [ZoneOperator, Driver, SensorGateway], code: 200, input: [], output: DropBox, side_effects: [] }
  - method: POST
    path: "/dropboxes/{id}/fill-readings"
    description: "Sensor gateway posts a fill reading; posture recomputed from the latest reading"
    roles: [SensorGateway]
    code: 201
    input: [fill_pct, recorded_at]
    output: FillReading
    side_effects: ["append FillReading", "DropBox.fill_pct and DropBox.posture recomputed per dropbox_fill_posture"]
  - { method: GET, path: "/dropboxes/{id}/fill-readings", description: "List fill readings of a box", roles: [ZoneOperator, SensorGateway], code: 200, input: ["limit?", "offset?"], output: "FillReading[]", side_effects: [] }
  - method: POST
    path: "/dropboxes/{id}/collections"
    description: "Driver empties a full box; creates the PROVISIONAL WeightTicket"
    roles: [Driver]
    code: 201
    input: [provisional_weight_kg]
    output: WeightTicket
    side_effects: ["requires posture FULL_PENDING_COLLECTION (ERR_DROPBOX_NOT_FULL)", "WeightTicket created with projected_credit_cents", "fill_pct -> 0, posture -> OK, last_collected_at set"]
  - { method: GET, path: "/dropboxes/{id}/weight-tickets", description: "List weight tickets of a drop box", roles: [ZoneOperator, Driver], code: 200, input: ["limit?", "offset?"], output: "WeightTicket[]", side_effects: [] }

  # --- WeightTicket ---
  - { method: GET, path: "/weight-tickets/{id}", description: "Get a weight ticket", roles: [ZoneOperator, Driver, Inspector, Resident], code: 200, input: [], output: WeightTicket, side_effects: [] }
  - method: POST
    path: "/weight-tickets/{id}/certify"
    description: "Facility certification: certified weight + grade"
    roles: [ZoneOperator]
    code: 200
    input: [certified_weight_kg, grade]
    output: WeightTicket
    side_effects: ["status: PROVISIONAL->CERTIFIED", "certified_at set", "pickup-sourced: pickup COLLECTED->WEIGHED"]
  - { method: POST, path: "/weight-tickets/{id}/void", description: "Void a certified/quarantined ticket; cascades credit void + hold release + assignment decline", roles: [ZoneOperator], code: 200, input: [], output: WeightTicket, side_effects: ["status -> VOIDED", "credit on ticket (PROVISIONAL/DISPUTED/FINALIZED) -> VOIDED with hold release", "PENDING assignments -> DECLINED (SYSTEM_QUARANTINE)"] }

  # --- ContaminationReport ---
  - { method: POST, path: "/weight-tickets/{id}/contamination-reports", description: "Inspector files a contamination finding on a CERTIFIED ticket (before its credit settles)", roles: [Inspector], code: 201, input: [severity, "notes?"], output: ContaminationReport, side_effects: ["status=OPEN; at most one OPEN report per ticket (ERR_INVALID_REQUEST otherwise)"] }
  - { method: GET, path: "/weight-tickets/{id}/contamination-reports", description: "List contamination reports of a ticket", roles: [ZoneOperator, Inspector], code: 200, input: ["limit?", "offset?"], output: "ContaminationReport[]", side_effects: [] }
  - { method: POST, path: "/contamination-reports/{id}/adjudicate", description: "Operator adjudicates: UPHELD applies severity penalties and cascades; OVERTURNED applies none", roles: [ZoneOperator], code: 200, input: [outcome], output: ContaminationReport, side_effects: ["status: OPEN->ADJUDICATED; adjudicated_at set", "UPHELD SEVERE: ticket quarantine cascade (ticket->credit->fund; partner quarantine; resident strike)", "UPHELD MAJOR: resident strike + partner score recompute"] }
  - { method: POST, path: "/contamination-reports/{id}/dismiss", description: "Dismiss an open report without penalties", roles: [ZoneOperator], code: 200, input: [], output: ContaminationReport, side_effects: ["status: OPEN->DISMISSED"] }

  # --- DiversionCredit ---
  - { method: POST, path: "/weight-tickets/{id}/diversion-credits", description: "Issue the diversion credit for a certified ticket (projected_cents computed; beneficiary from pickup source)", roles: [ZoneOperator], code: 201, input: [], output: DiversionCredit, side_effects: ["status=PROVISIONAL; projected_cents per diversion_credit_value uncapped variant"] }
  - { method: GET, path: "/weight-tickets/{id}/diversion-credits", description: "List credits of a ticket (0..1 non-voided)", roles: [ZoneOperator, Resident, SponsorManager], code: 200, input: ["limit?", "offset?"], output: "DiversionCredit[]", side_effects: [] }
  - { method: GET, path: "/diversion-credits/{id}", description: "Get a diversion credit", roles: [ZoneOperator, Resident, SponsorManager], code: 200, input: [], output: DiversionCredit, side_effects: [] }
  - method: POST
    path: "/diversion-credits/{id}/finalize"
    description: "Fix gross_cents and place the sponsor-fund hold (PROVISIONAL or DISPUTED)"
    roles: [ZoneOperator]
    code: 200
    input: []
    output: DiversionCredit
    side_effects: ["status -> FINALIZED", "gross_cents fixed with fund-capped sponsor_bonus", "fund_id set to zone's ACTIVE fund", "if has_hold was false: held_cents += gross_cents; has_hold=true"]
  - { method: POST, path: "/diversion-credits/{id}/dispute", description: "Dispute a PROVISIONAL or FINALIZED credit (hold retained)", roles: [Resident, ZoneOperator], code: 200, input: [reason], output: DiversionCredit, side_effects: ["status -> DISPUTED"] }
  - { method: POST, path: "/diversion-credits/{id}/void", description: "Void a non-settled credit; releases any hold", roles: [ZoneOperator], code: 200, input: [], output: DiversionCredit, side_effects: ["status -> VOIDED; if has_hold: held_cents -= gross_cents, available_cents += gross_cents"] }
  - method: POST
    path: "/diversion-credits/{id}/settle"
    description: "Settle a FINALIZED credit: commit fund, split to charities, pay resident share"
    roles: [ZoneOperator]
    code: 200
    input: []
    output: DiversionCredit
    side_effects: ["status -> SETTLED", "held_cents -= gross; paid_cents += gross", "charity_allocations frozen per charity_split_allocation; charity totals incremented", "pickup-sourced: resident.credit_balance_cents += resident_share_cents; pickup WEIGHED->SETTLED", "settled_at set"]

  # --- SponsorFund ---
  - { method: POST, path: "/sponsor-funds", description: "Open a sponsor fund for a zone (one ACTIVE fund per zone)", roles: [ZoneOperator], code: 201, input: [zone_id, sponsor_name, initial_cents], output: SponsorFund, side_effects: ["status=ACTIVE; funded_total_cents=initial_cents"] }
  - { method: GET, path: "/sponsor-funds/{id}", description: "Get a sponsor fund (SponsorManager: own fund)", roles: [ZoneOperator, SponsorManager], code: 200, input: [], output: SponsorFund, side_effects: [] }
  - { method: POST, path: "/sponsor-funds/{id}/topups", description: "Sponsor tops up an ACTIVE fund (SponsorManager: own fund)", roles: [SponsorManager], code: 200, input: [amount_cents], output: SponsorFund, side_effects: ["funded_total_cents += amount_cents"] }
  - { method: POST, path: "/sponsor-funds/{id}/close", description: "Close a fund with no open holds", roles: [ZoneOperator], code: 200, input: [], output: SponsorFund, side_effects: ["status: ACTIVE->CLOSED (requires held_cents == 0)"] }
  - { method: GET, path: "/sponsor-funds/{id}/diversion-credits", description: "List credits holding/paid from this fund", roles: [ZoneOperator, SponsorManager], code: 200, input: ["limit?", "offset?"], output: "DiversionCredit[]", side_effects: [] }

  # --- Charity ---
  - { method: POST, path: "/charities", description: "Register a charity", roles: [ZoneOperator], code: 201, input: [name], output: Charity, side_effects: [] }
  - { method: GET, path: "/charities/{id}", description: "Get a charity", roles: [ZoneOperator, CharityAdmin], code: 200, input: [], output: Charity, side_effects: [] }
  - { method: GET, path: "/charities/{id}/allocations", description: "Computed read: this charity's allocation lines across all settled credits", roles: [ZoneOperator, CharityAdmin], code: 200, input: [], output: { charity_id: string, total_received_cents: integer, allocations: array }, side_effects: [] }

  # --- ReportingPeriod ---
  - { method: GET, path: "/reporting-periods/{id}", description: "Get a reporting period incl. frozen aggregates", roles: [ZoneOperator, SponsorManager, CharityAdmin], code: 200, input: [], output: ReportingPeriod, side_effects: [] }
  - { method: POST, path: "/reporting-periods/{id}/close", description: "Close the period; freeze aggregates (ops-run checkpoint)", roles: [ZoneOperator], code: 200, input: [], output: ReportingPeriod, side_effects: ["status: OPEN->CLOSED", "aggregates computed per reporting_period_aggregation and frozen"] }

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default before any set call is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [ZoneOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current logical clock replaced"]

# =============================================================================
# §1.6 Error Code Catalog (31 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not allowed on the endpoint, or entity-backed ownership mismatch (wrong resident/partner/fund/charity/driver)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, undeclared field, bad type/enum/range, second OPEN contamination report on one ticket" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure on the target entity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_RESIDENT_SUSPENDED, http: 403, condition: "Resident is SUSPENDED; pickup create, bag-kit order, and rebook are blocked" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Window/period shape invalid: end <= start, or pickup duration outside [60, 240] minutes" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "window_start is before the current logical clock" }
  - { id: ERR_PICKUP_WINDOW_CONFLICT, http: 409, condition: "Buffered window overlap with another SCHEDULED/ROUTED pickup of the same resident (30-minute buffer; exactly-30-minute gap passes)" }
  - { id: ERR_KIT_LIMIT_EXCEEDED, http: 409, condition: "Resident already has 2 BagKits in REQUESTED/DISPATCHED/DELIVERED" }
  - { id: ERR_RESCHEDULE_LIMIT_REACHED, http: 409, condition: "reschedule_count already 3 (MAX_RESCHEDULES)" }
  - { id: ERR_REBOOK_LIMIT_REACHED, http: 409, condition: "rebook_count already 2 (MAX_REBOOKS)" }
  - { id: ERR_BAGS_NOT_DELIVERED, http: 409, condition: "mark-collected requires at least one DELIVERED BagKit of the resident" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "Route-day est_weight sum for (driver_id, service_date) would exceed 800.0 kg (exactly 800.0 allowed)" }
  - { id: ERR_DROPBOX_NOT_FULL, http: 409, condition: "Collection requires posture FULL_PENDING_COLLECTION (latest fill_pct >= 85.0)" }
  - { id: ERR_TICKET_NOT_CERTIFIED, http: 409, condition: "Routing/credit operations require ticket status CERTIFIED (or QUARANTINED for the safety gate); PROVISIONAL/VOIDED rejected" }
  - { id: ERR_TICKET_QUARANTINED, http: 409, condition: "Safety gate: ticket is QUARANTINED; routing and credit creation blocked" }
  - { id: ERR_CREDIT_EXISTS, http: 409, condition: "A non-VOIDED DiversionCredit already exists for this ticket" }
  - { id: ERR_OPEN_REPORTS_REMAIN, http: 409, condition: "Credit create/finalize blocked while an OPEN ContaminationReport exists on the ticket" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 409, condition: "Contamination reports only while ticket CERTIFIED and no SETTLED credit exists" }
  - { id: ERR_NO_ELIGIBLE_PARTNER, http: 422, condition: "Routing selector pool empty after eligibility filters (status, grade, capacity, decline-exclusion)" }
  - { id: ERR_PARTNER_CAPACITY_EXCEEDED, http: 409, condition: "Accept would push committed_kg + assigned_weight_kg over capacity_kg" }
  - { id: ERR_ASSIGNMENT_PENDING_EXISTS, http: 409, condition: "A PENDING or ACCEPTED RoutingAssignment already exists for the ticket" }
  - { id: ERR_SPLIT_SUM_INVALID, http: 422, condition: "charity_splits: pct not integer 1..100, duplicate charity_id, or sum(pct) > 100" }
  - { id: ERR_FUND_ALREADY_ACTIVE, http: 409, condition: "Zone already has an ACTIVE SponsorFund" }
  - { id: ERR_FUND_NOT_ACTIVE, http: 409, condition: "Credit finalize requires an ACTIVE SponsorFund in the zone" }
  - { id: ERR_FUND_INSUFFICIENT, http: 409, condition: "Finalize: after_contam + bulk_bonus exceeds fund.available_cents (bonus already capped to zero)" }
  - { id: ERR_CREDIT_NOT_FINAL, http: 409, condition: "Settle requires FINALIZED; PROVISIONAL or DISPUTED rejected" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Reporting period half-open window overlaps another period of the same zone (adjacency allowed)" }
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "Close requires OPEN period" }
  - { id: ERR_OPEN_TICKETS_REMAIN, http: 409, condition: "Period close blocked while zone has PROVISIONAL WeightTickets" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ZoneOperator
    description: "Platform operations staff for a zone; runs certifications, adjudications, credits, funds, reporting"
    identity: opaque
