              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
