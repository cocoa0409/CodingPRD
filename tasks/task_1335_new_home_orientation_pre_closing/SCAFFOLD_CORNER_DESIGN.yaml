  # ============================================================ 4. VALIDATIONS
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An undeclared role header (Anonymous) is rejected with ERR_UNAUTHENTICATED (401) at priority 1, before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/homes/00000000-0000-4000-8000-bbbbbbbbbbbb", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (http 401) — auth beats even existence"

      - name: schema_validation_beats_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "classify with an invalid enum member on a NONEXISTENT item id returns ERR_VALIDATION (400), proving schema (p4) is evaluated before existence (p5)."
        test_recipe:
          setup: ["rep exists"]
          setup_api_calls:
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /api/deficiency-items/00000000-0000-4000-8000-cccccccccccc/classify", payload: { classification: "BOGUS", estimated_repair_cost_cents: 100 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (http 400), not ERR_NOT_FOUND"

      - name: poa_proxy_requires_document
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_POA_DOCUMENT_REQUIRED]", entities.Attendee.fields.poa_document_ref]
        distinguishing_aspect: "POA_PROXY attendee without poa_document_ref fails with ERR_POA_DOCUMENT_REQUIRED (422)."
        test_recipe:
          setup: ["appointment a1 CONFIRMED"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "POA_PROXY", proxy_name: "Pat Proxy" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_POA_DOCUMENT_REQUIRED (http 422)"

      - name: proxy_with_buyer_id_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ATTENDEE_IDENTITY_INVALID]", entities.Attendee.fields.buyer_id]
        distinguishing_aspect: "POA_PROXY attendee carrying a buyer_id fails with ERR_ATTENDEE_IDENTITY_INVALID (identity fields are type-exclusive)."
        test_recipe:
          setup: ["appointment a1 CONFIRMED"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
          trigger:
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "POA_PROXY", buyer_id: "${b1}", proxy_name: "Pat Proxy", poa_document_ref: "poa-doc-1" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ATTENDEE_IDENTITY_INVALID (http 422)"

      - name: ownership_enforced_for_signoff
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A different registered buyer (b2) cannot sign off items on b1's home — entity-backed ownership check fails with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["orientation completed; item d1 decided BEFORE_CLOSING, repaired, reinspected PASS -> VERIFIED; second buyer b2 registered"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Bob Baxter", email: "bob@example.com" }, as: CustomerCareManager, captures: { b2: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", title: "Trap leak" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d1: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d1}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 20000 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/decide", payload: { resolution: "COMPLETE_BEFORE_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/deficiency-items/${d1}/start-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/complete-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T10:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T10:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/reinspection-visits/${v1}/complete", payload: { results: [ { deficiency_item_id: "${d1}", outcome: "PASS" } ] }, as: CustomerCareRep, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /api/deficiency-items/${d1}/sign-off", payload: {}, as: Homebuyer, as_user_id: "${b2}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (http 403) — X-User-ID != home.primary_buyer_id"

