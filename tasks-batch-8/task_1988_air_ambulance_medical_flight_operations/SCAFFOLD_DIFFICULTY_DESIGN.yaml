  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_half_open_window_adjacency
        grounds:
          - validations[priority=19]
          - state_machines.Aircraft.AVAILABLE_to_ASSIGNED
        distinguishing_aspect: |
          Resource Aircraft with HALF-OPEN interval semantics: occupancy
          window [planned_launch_iso, planned_launch_iso + planned_duration_min)
          permits endpoint-touching adjacency — a second accept at exactly
          10:00:00Z against an 08:00+120min window succeeds, while 09:59:00Z
          overlaps and fails with ERR_AIRCRAFT_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Base with one CCT_CAPABLE rotor; three TRIAGED ALS requests (same patient); mission1 accepted with window [2026-08-05T08:00:00Z, +120 min)"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Upsilon", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N909HO", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req1_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req1_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req1_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 50, planned_launch_iso: "2026-08-05T08:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m1_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req2_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req2_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req3_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req3_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
          trigger:
            - { call: "POST /air-ambulance/mission-requests/${req2_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 50, planned_launch_iso: "2026-08-05T10:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m2_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req3_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 50, planned_launch_iso: "2026-08-05T09:59:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "Adjacent accept succeeds: Mission.${m2_id} created in PLANNING (10:00:00Z == mission1 window end; half-open semantics allow touching)"
            - "err == ERR_AIRCRAFT_SCHEDULE_CONFLICT (09:59:00Z start intersects [08:00, 10:00) by one minute)"
            - "MissionRequest.${req3_id}.status remains TRIAGED"

      - name: crew_shift_rest_buffer_semantics
        grounds:
          - validations[priority=11]
          - calculations.crew_duty_fatigue_window
        distinguishing_aspect: |
          Resource CrewShift with BUFFERED interval semantics — different
          resource AND different interval geometry from
          aircraft_half_open_window_adjacency (which allows adjacency): two
          shifts of one member must be separated by a >= 600-minute rest gap,
          so a shift starting 599 minutes after the prior close is rejected
          while exactly 600 minutes is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one PILOT with shift1 00:00-10:00 (600 min) created and closed at clock 10:00"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Phi", region: "NW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Rachel Rest", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T00:00:00Z", planned_end_iso: "2026-08-01T10:00:00Z" }, as: OpsAdmin, captures: { shift1_id: "$.data.id" } }
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: OpsAdmin }
            - { call: "PUT /air-ambulance/crew-shifts/${shift1_id}", payload: { status: "CLOSED" }, as: OpsAdmin }
          trigger:
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T19:59:00Z", planned_end_iso: "2026-08-01T21:59:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T20:00:00Z", planned_end_iso: "2026-08-01T22:00:00Z" }, as: OpsAdmin, captures: { shift2_id: "$.data.id" } }
          assert:
            - "err == ERR_INSUFFICIENT_REST (599 minutes < 600 buffer; adjacency is NOT allowed here, unlike the aircraft rule)"
            - "Second create succeeds: rest gap exactly 600 minutes passes the >= check"
            - "Duty projection for the accepted shift: 600 + 120 = 720 <= 840, so only the rest rule was at stake"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: invoice_ledger_conservation_across_posting_appeal_writeoff
        grounds:
          - calculations.member_balance_waterfall
          - state_machines.Invoice.DENIED_to_APPEALED
          - state_machines.Invoice.MEMBER_PROTECTED_to_WRITEOFF_POSTED
        distinguishing_aspect: |
          Conserved quantity: money decomposition — after EVERY posting,
          appeal-compensation, and write-off, insurer_paid_cents +
          contractual_adjustment_cents + member_writeoff_cents +
          patient_responsibility_cents == final_total_cents (1808560). The
          appeal is the compensating action that zeroes the denied posting.
        test_recipe:
          setup:
            - "Member patient (ACTIVE membership effective 2026-08-01); BLS rotor mission COMPLETED 2026-08-01; invoice FINALIZED with actual 0.5 mi (final_total_cents 1808560) and MEMBER_PROTECTED; PCR QA_APPROVED; claim SUBMITTED"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Chi", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N111LG", aircraft_class: "ROTOR_WING", medical_config: "BLS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Megan Member", date_of_birth: "1985-03-15", weight_kg: 62 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/memberships", payload: { patient_id: "${pat_id}", tier: "STANDARD", effective_from: "2026-08-01" }, as: BillingSpecialist }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "Clinic West", destination_facility: "County General", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 1, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 60 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_DESTINATION" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "COMPLETED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/invoices", payload: { mission_id: "${m_id}" }, as: BillingSpecialist, captures: { inv_id: "$.data.id" } }
            - { call: "POST /air-ambulance/invoices/${inv_id}/finalize", payload: { actual_loaded_miles: 0.5 }, as: BillingSpecialist }
            - { call: "POST /air-ambulance/patient-care-reports", payload: { mission_id: "${m_id}", author_crew_id: "${pilot_id}", vitals_summary: "stable", interventions_summary: "none", meds_summary: "none" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { pcr_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/submit", as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/qa-review", payload: { outcome: "APPROVED", deficiency_points: 0 }, as: QaReviewer, as_user_id: "qa-officer-1" }
            - { call: "POST /air-ambulance/invoices/${inv_id}/submit", as: BillingSpecialist }
          trigger:
            - { call: "POST /air-ambulance/invoices/${inv_id}/payer-response", payload: { outcome: "DENIED", paid_cents: 200000, contractual_adjustment_cents: 50000 }, as: BillingSpecialist, captures: { pr_denied: "$.data.patient_responsibility_cents" } }
            - { call: "POST /air-ambulance/invoices/${inv_id}/appeal", as: BillingSpecialist, captures: { paid_after_appeal: "$.data.insurer_paid_cents", adj_after_appeal: "$.data.contractual_adjustment_cents", pr_after_appeal: "$.data.patient_responsibility_cents" } }
            - { call: "POST /air-ambulance/invoices/${inv_id}/submit", as: BillingSpecialist, captures: { claim2: "$.data.claim_status" } }
            - { call: "POST /air-ambulance/invoices/${inv_id}/payer-response", payload: { outcome: "PAID", paid_cents: 400000, contractual_adjustment_cents: 100000 }, as: BillingSpecialist, captures: { pr_paid: "$.data.patient_responsibility_cents" } }
            - { call: "POST /air-ambulance/invoices/${inv_id}/member-writeoff", as: BillingSpecialist, captures: { wo: "$.data.member_writeoff_cents", pr_final: "$.data.patient_responsibility_cents" } }
          assert:
            - "pr_denied == 1558560 and 200000 + 50000 + 0 + 1558560 == 1808560 (invariant holds after denial posting)"
            - "paid_after_appeal == 0 and adj_after_appeal == 0 and pr_after_appeal == 1808560 (compensation zeroes the denied posting; invariant 0+0+0+1808560 == 1808560)"
            - "claim2 == RESUBMITTED"
            - "pr_paid == 1308560 and 400000 + 100000 + 0 + 1308560 == 1808560"
            - "wo == 1308560 and pr_final == 0 and 400000 + 100000 + 1308560 + 0 == 1808560 (invariant holds after write-off)"

      - name: aircraft_assignment_balance_conserved
        grounds:
          - state_machines.Aircraft.AVAILABLE_to_ASSIGNED
          - state_machines.Aircraft.ASSIGNED_to_AVAILABLE
          - state_machines.Mission.PLANNING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: fleet disposition count — a different quantity
          type from the invoice money invariant. For a base with 2 tails,
          count(AVAILABLE) + count(ASSIGNED) + count(MAINTENANCE) == 2 at
          every step, and the accept (ASSIGNED) + abort (AVAILABLE) pair
          returns each bucket to its pre-pair value.
        test_recipe:
          setup:
            - "Base with two CCT_CAPABLE rotors; TRIAGED ALS request; mission accepted on tail 1"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Psi", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N121AV", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac1_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N122AV", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac2_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac1_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 60, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id" } }
            - { call: "GET /air-ambulance/aircraft/${ac1_id}", as: Dispatcher, captures: { s_mid: "$.data.status" } }
          trigger:
            - { call: "POST /air-ambulance/missions/${m_id}/abort", payload: { reason_code: "REQUESTER" }, as: Dispatcher }
            - { call: "GET /air-ambulance/aircraft/${ac1_id}", as: Dispatcher, captures: { s_after: "$.data.status" } }
          assert:
            - "s_mid == ASSIGNED (accept debited the available pool by one: AVAILABLE 2 -> 1, ASSIGNED 0 -> 1)"
            - "s_after == AVAILABLE (compensating abort credits it back: AVAILABLE 1 -> 2, ASSIGNED 1 -> 0)"
            - "Invariant: count(AVAILABLE)+count(ASSIGNED)+count(MAINTENANCE) == 2 before the accept, after the accept, and after the abort"
            - "Mission.${m_id}.status == CANCELLED (PLANNING + abort) and Aircraft.${ac2_id}.status == AVAILABLE throughout"
