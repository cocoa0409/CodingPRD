            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: ""
          assert:
            - "HTTP 401 with error_id == 'ERR_UNAUTHENTICATED'"
            - "the header is literally the empty string — a whitespace-only value is a different fixture and must not be substituted"

      - name: undeclared_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A syntactically fine but undeclared role ('Concierge') is an authentication failure (401), not an authorization failure (403) — the role must exist in §1.7 before permissions are consulted."
        test_recipe:
          setup:
            - "One property so the target path resolves"
          setup_api_calls:
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: "Concierge"
          assert:
            - "HTTP 401 with error_id == 'ERR_UNAUTHENTICATED', not 403 ERR_UNAUTHORIZED"

      - name: close_of_an_unknown_night_returns_service_night_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_SERVICE_NIGHT_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown night id on the close action returns HTTP 404 ERR_SERVICE_NIGHT_NOT_FOUND rather than a state error, because existence is checked at priority 3 and state only at priority 8."
        test_recipe:
          setup:
            - "An empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/service-nights/00000000-0000-4000-8000-000000000901/close"
              payload: {}
              as: ValetOpsManager
          assert:
            - "HTTP 404 with error_id == 'ERR_SERVICE_NIGHT_NOT_FOUND'"

      - name: dispute_of_an_unknown_fine_returns_fine_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_FINE_NOT_FOUND]
        distinguishing_aspect: "The unknown-fine 404 is raised before the Resident ownership check at priority 4, so a Resident calling dispute on a nonexistent fine sees ERR_FINE_NOT_FOUND and not ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "An empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
