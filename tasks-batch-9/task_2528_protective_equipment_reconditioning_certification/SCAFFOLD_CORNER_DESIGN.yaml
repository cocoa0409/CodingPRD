            - "response error_id == ERR_WARRANTY_CLAIM_REQUIRED"
            - "EquipmentUnit.${u1_id}.service_age_years == 2"
            - "EquipmentUnit.${u1_id}.warranty_coverage == IN_WARRANTY"
            - "RepairOrder.${ro_id}.status == SUBMITTED"
            - "RepairOrder.${ro_id}.installed_by_user_id == null"
            - "ApprovedPart.${part_id}.on_hand_qty == 3"
            - "ApprovedPart.${part_id}.reserved_qty == 1"
            - "ApprovedPart.${part_id}.consumed_qty == 0"

      - name: verifying_a_destruction_you_witnessed_yourself_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-segregation-destruction-verify
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The second segregation rule guards the disposal chain on a different
          entity: comp-1 witnessed the crush, so comp-1 cannot also verify it —
          ERR_SEGREGATION_OF_DUTIES / 403 with the record still WITNESSED, the
          unit still PENDING_DISPOSAL and record_retention_until still null. Two
          different compliance officers are required to retire a shell.
        test_recipe:
          setup:
            - "one condemned unit whose PENDING DestructionRecord has been witnessed by comp-1"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2016-09-15T00:00:00Z", age_basis: "FIRST_SEASON" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/condemn"
              payload: { condemn_reason: "LIFE_EXPIRED" }
              as: CertifyingInspector
              as_user_id: "insp-1"
            - call: "GET /equipment-units/${u1_id}/destruction-records"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { dr_id: "$.data[0].id" }
            - call: "POST /destruction-records/${dr_id}/witness"
              payload: { method: "SHELL_CRUSH", witness_name: "M. Alvarez" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
          trigger:
            - call: "POST /destruction-records/${dr_id}/verify"
              payload: { verification_ref: "DV-2026-0009" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403"
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "DestructionRecord.${dr_id}.status == WITNESSED"
            - "DestructionRecord.${dr_id}.witnessed_by_user_id == comp-1"
            - "DestructionRecord.${dr_id}.verified_by_user_id == null"
            - "EquipmentUnit.${u1_id}.custody_status == PENDING_DISPOSAL"
            - "EquipmentUnit.${u1_id}.record_retention_until == null"

      - name: a_fifth_session_beyond_the_retest_cap_rejected
        claim_type: Aggregate validation
        grounds:
          - validations.v-retest-cap
          - errors.ERR_RETEST_LIMIT_EXCEEDED
          - entities.EquipmentUnit.fields.retest_count
        distinguishing_aspect: |
          retest_count counts sessions beyond the first, so four booked sessions
          leave it at 3 == ModelSpec.max_retest_count and the fifth booking must
          fail with ERR_RETEST_LIMIT_EXCEEDED / 409. Each individual booking is
          legal (windows are 60 minutes apart, clearing the 45-minute cooldown,
          and 4 < daily_session_quota 6) — only the accumulated count is not.
        test_recipe:
          setup:
            - "one inspected unit (summary CLEAR) and one calibrated bench with quota 6"
            - "four ShellTest sessions already booked at 09:00, 11:00, 13:00 and 15:00"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - *k_insp_ok
            - *k_bench
            - *k_cal
            - *k_test1
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T12:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t2_id: $.data.id }
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T13:00:00Z", window_end: "2026-08-01T14:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t3_id: $.data.id }
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T15:00:00Z", window_end: "2026-08-01T16:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t4_id: $.data.id }
          trigger:
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T17:00:00Z", window_end: "2026-08-01T18:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_RETEST_LIMIT_EXCEEDED"
            - "EquipmentUnit.${u1_id}.retest_count == 3"
            - "EquipmentUnit.${u1_id}.recon_status == INSPECTED"
            - "ShellTest.${t4_id}.attempt_index == 4"
            - "GET /shell-tests?equipment_unit_id=${u1_id} returns total_count 4"

      - name: a_second_session_beyond_the_bench_daily_quota_rejected
        claim_type: Aggregate validation
        grounds:
          - validations.v-bench-daily-quota
          - errors.ERR_BENCH_DAILY_QUOTA_EXCEEDED
          - entities.TestBench.fields.daily_session_quota
        distinguishing_aspect: |
          The quota is per bench per calendar day, across units: RIG-2 is created
          with daily_session_quota 1, so a second session — for a different unit,
          on a window that clears the cooldown padding entirely (11:00 vs 09:00) —
          must still fail with ERR_BENCH_DAILY_QUOTA_EXCEEDED / 409 rather than
          the window-conflict error.
        test_recipe:
          setup:
            - "one shipment with counted_unit_count 2, both units inspected CLEAR"
            - "one calibrated TestBench RIG-2 with daily_session_quota 1 and one session already booked 09:00-10:00"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
