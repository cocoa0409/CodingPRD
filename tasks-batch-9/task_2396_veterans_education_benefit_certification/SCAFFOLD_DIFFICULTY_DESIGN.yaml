      - name: catalog_effective_windows_are_half_open_touching_endpoints_are_legal
        grounds:
          - validations[priority=23]
          - errors.ERR_CATALOG_WINDOW_OVERLAP
          - entities.CatalogVersion.fields.effective_start
          - entities.CatalogVersion.fields.effective_end
        distinguishing_aspect: |
          The opposite endpoint convention on a different entity: catalog effective
          windows per program are HALF-OPEN, so a new window starting exactly on the
          incumbent's effective_end 2027-07-01 is accepted (201), while one starting a
          single day earlier on 2027-06-30 collides with 409
          ERR_CATALOG_WINDOW_OVERLAP. The overlap set here is scoped to the program and
          excludes SUPERSEDED and WITHDRAWN windows, not to a student.
        test_recipe:
          setup:
            - "Clock at 2026-08-01."
            - "Program BSN-UG exists with catalog cat1 for 2026-2027 APPROVED over the window 2026-07-01..2027-07-01."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
            - call: "POST /catalog-versions"
              payload: { program_id: "${prog1}", catalog_year: "2026-2027", effective_start: "2026-07-01", effective_end: "2027-07-01", has_published_tuition_schedule: true, has_refund_policy: true, has_program_length_disclosure: true }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { cat1: $.data.id }
            - call: "POST /catalog-versions/${cat1}/submit-to-saa"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "POST /catalog-versions/${cat1}/saa-decision"
              payload: { decision: "APPROVED" }
              as: StateApprovingAgent
          trigger:
            - call: "POST /catalog-versions"
              payload: { program_id: "${prog1}", catalog_year: "2027-2028", effective_start: "2027-07-01", effective_end: "2028-07-01", has_published_tuition_schedule: true, has_refund_policy: true, has_program_length_disclosure: true }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { catTouch: $.data.id }
            - call: "POST /catalog-versions"
              payload: { program_id: "${prog1}", catalog_year: "2027-2028", effective_start: "2027-06-30", effective_end: "2028-06-30", has_published_tuition_schedule: true, has_refund_policy: true, has_program_length_disclosure: true }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger step 1 returns HTTP 201 and CatalogVersion.${catTouch}.review_status == DRAFT with effective_start == 2027-07-01"
            - "Trigger step 2 returns HTTP 409 with error_id == ERR_CATALOG_WINDOW_OVERLAP"
            - "exactly two CatalogVersion rows exist for program_id == ${prog1}"
            - "CatalogVersion.${cat1}.review_status == APPROVED and effective_end == 2027-07-01 are unchanged"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdrawal_before_first_class_day_restores_entitlement_ledger_exactly
        grounds:
          - state_machines.EnrollmentCertification.CERTIFIED_to_AMENDMENT_PENDING
          - state_machines.EnrollmentCertification.AMENDMENT_PENDING_to_TERMINATED
          - calculations.entitlement_days_charged
          - entities.VeteranStudent.fields.entitlement_days_remaining
        distinguishing_aspect: |
          The compensation is a full reversal of a ledger, not of money: certifying
          charged 110 entitlement days against the student, and reconciling a
          COMPLETE_WITHDRAWAL whose effective_date equals term_start_certified must
          drive entitlement_days_charged back to 0 and entitlement_days_remaining back
          to exactly entitlement_days_granted (1080), with no BenefitDebt created at
          all because nothing had been paid.
        test_recipe:
          setup:
            - "Program BSN-UG APPROVED, term FA2026 2026-08-24..2026-12-11, clock starts at 2026-08-01."
            - "Student V-1001 CH33 at 100 percent with entitlement_days_granted 1080."
            - "cert1 is CERTIFIED for 12 of 12 credits over the full term, so 110 entitlement days are charged and entitlement_days_remaining is 970."
            - "No VaPayment has been recorded against cert1."
            - "The clock is then advanced to 2026-09-05 and a COMPLETE_WITHDRAWAL effective 2026-08-24 (the certified first day) is reported without mitigating circumstances."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
