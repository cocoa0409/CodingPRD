  - rule_id: non_linear_state_machine
    instances:
      - name: dispatch_plan_commit_decommit_reoptimise_cycle
        grounds:
          - state_machines.DispatchPlan.APPROVED_to_COMMITTED
          - state_machines.DispatchPlan.COMMITTED_to_DRAFT
          - state_machines.DispatchPlan.DRAFT_to_DRAFT
          - state_machines.DispatchPlan.DRAFT_to_SUBMITTED
          - state_machines.DispatchPlan.SUBMITTED_to_APPROVED
          - entities.DispatchPlan.fields.reviewed_by_user_id
        distinguishing_aspect: |
          Non-linearity on the DispatchPlan entity is a cycle: COMMITTED returns to DRAFT via
          decommit, clearing reviewed_by_user_id back to null and re-enabling the DRAFT to DRAFT
          optimize self-loop, so the same row traverses DRAFT, SUBMITTED, APPROVED, COMMITTED,
