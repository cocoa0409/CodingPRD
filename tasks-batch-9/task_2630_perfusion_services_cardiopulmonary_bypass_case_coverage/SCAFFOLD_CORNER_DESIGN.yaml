        distinguishing_aspect: |
          DRAFT -> VERIFIED carries two preconditions that are checked in a fixed order, and the only
          way to observe the *second* one is to re-arm the case: an immediate re-verify answers
          ERR_CASE_NOT_PACK_CONFIGURED (priority 28) because the first verify already advanced the
          case to SETUP_VERIFIED, whereas after a critical alarm invalidates the checklist and a
          fresh pack returns the case to PACK_CONFIGURED, the same call answers
          ERR_CHECKLIST_NOT_DRAFT (priority 29). An implementation that checks only the checklist
