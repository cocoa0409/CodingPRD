  - name: transfer_seat_pool_exactly_zero_forces_waitlist
    grounds:
    - calculations.transfer_seat_pool
    - validations[priority=73]
    - errors[ERR_NO_TRANSFER_SEATS]
    - state_machines.TransferRequest.SUBMITTED_to_WAITLISTED
    - entities.AdoptionRecord.fields.transfer_cap_pct
    distinguishing_aspect: 'A DIFFERENT metric (transfer_seat_pool, an integer seat count) at a DIFFERENT endpoint (POST /redistricting/transfer-requests/{id}/decide) sitting exactly on SEAT_POOL_APPROVE_MINIMUM - 1: the pool is exactly 0 and the rule reads ''pool < 1'', so APPROVE must fail while WAITLIST on the very same request must succeed. An off-by-one implementation that reads ''pool < 0'' or ''pool <= 0 only when negative'' would approve a 455th seat at a 454-seat cap.'
