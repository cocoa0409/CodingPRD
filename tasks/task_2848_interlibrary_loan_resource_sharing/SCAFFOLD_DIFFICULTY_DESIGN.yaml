            - "${err_capacity} == ERR_PATRON_LOAN_WINDOW_CAPACITY with HTTP 409 — a receipt at exactly 2026-08-08 would open [2026-08-08, 2026-08-15], which touches L-A's window at one instant and therefore overlaps it, making the count 1 + 1 > max_concurrent_loans 1"
