          - errors[ERR_STALE_HOUSE_VERSION]
          - endpoints[POST /co-living/tickets/{id}/schedule]
        distinguishing_aspect: "Scheduling a second, non-overlapping visit with the house version observed before the first booking is rejected with HTTP 412 ERR_STALE_HOUSE_VERSION even though the capacity rule would have allowed it, and re-reading the house lets the same booking succeed."
        test_recipe:
