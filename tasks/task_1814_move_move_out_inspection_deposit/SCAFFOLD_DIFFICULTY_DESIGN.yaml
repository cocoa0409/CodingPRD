            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten}/record_key_return", payload: { keys_returned: 2, fobs_returned: 1 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
