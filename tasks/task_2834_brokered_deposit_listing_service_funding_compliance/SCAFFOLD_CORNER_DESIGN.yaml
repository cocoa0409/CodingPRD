            - "Institution.${inst_id}.rate_cap_regime == CAPPED, which is what makes priority 13 applicable at all"

      - name: corner_reciprocal_capacity_exhausted_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RECIPROCAL_CAP_EXCEEDED]
