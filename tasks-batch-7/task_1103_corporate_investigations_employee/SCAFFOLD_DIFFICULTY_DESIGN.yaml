              as: Investigator
              captures: { e1: $.data.id }
            - call: "POST /api/collection-scopes/${scope_id}/evidence-items"
              payload: { custodian_ref: "EMP-100", hash_value: "h2", size_bytes: 1000000, captured_at: "2026-05-06T01:00:00Z" }
              as: Investigator
              captures: { e2: $.data.id }
            - { call: "POST /api/evidence-items/${e1}/transition", payload: { to_status: UNDER_REVIEW }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/evidence-items/${e1}/transition", payload: { to_status: ADMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/evidence-items/${e2}/transition", payload: { to_status: UNDER_REVIEW }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/evidence-items/${e2}/transition", payload: { to_status: ADMITTED }, as: Investigator, as_user_id: "inv-1" }
