      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails priority 1 before any other check, even for a non-existent resource id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/lawns/11111111-1111-1111-1111-111111111111"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), not a 404 — auth precedes existence"

      - name: lawn_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "endpoints[POST /api/lawns]"]
        distinguishing_aspect: "Omitting required lawn_size_sqm from the create body yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one ACTIVE customer"]
