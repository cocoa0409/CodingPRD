            - "RebateProgram.${r3}.program_state == ACTIVE"
            - "RebateProgram.${r1}.program_state == ACTIVE"
            - "GET /clm/rebate-programs?utility_code=UTIL-A returns 2 items"

  - rule_id: compensating_invariant
    instances:
      - name: claim_void_restores_part_unit_conservation_and_credit
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_VOIDED
          - calculations.part_stock_projection
          - entities.ServicePart.fields.on_hand_qty
          - entities.ServicePart.fields.reserved_qty
          - entities.Distributor.fields.warranty_credit_cents
          - state_machines.WarrantyClaim.FULFILLMENT_BLOCKED_to_SUBMITTED
        distinguishing_aspect: |
          The conserved quantity is a physical unit count: on_hand_qty + reserved_qty must equal 1 before the
          approval, after the approval and after the void, while the two components swap and swap back. The void is
          the compensating action for the approval, so it must also unwind the 42000-cent distributor credit, walk
          stock_state BACKORDERED -> LOW, and release the second claim that the shortage had blocked; a void
          implemented as a plain state flip leaves stolen stock and phantom credit behind.
        test_recipe:
          setup:
            - "Certified OPL-60-A with BuildOrder SN-0001 in ACCEPTED and Distributor D-01 AUTHORIZED"
            - "Technician T-201 certified for DIAGNOSTICS_TOOL"
            - "ServicePart BRG-2040 with reorder_point_qty 2 stocked to exactly on_hand_qty 1 (stock_state LOW)"
            - "Two claims on that part: the first APPROVED (which drove the part to BACKORDERED), the second left FULFILLMENT_BLOCKED with block_reason PART_BACKORDERED"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "DRUM-01", station_type: "DRUM_FAB", parallel_capacity: 1, changeover_buffer_minutes: 30, supported_product_lines: ["ON_PREMISES", "VENDED"] }
