# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# garden-center-nursery — Expert tier
# 9 Difficulty Rules × ≥2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loyalty_accrual_standard_vs_gold_on_account
        grounds:
          - calculations.loyalty_accrual
          - entities.Account.fields.loyalty_tier
          - entities.Account.fields.lifetime_points
          - state_machines.Order.ALLOCATED_to_FULFILLED
        distinguishing_aspect: |
          Same net_total of 3000 cents (30 eligible dollars) accrues 30 points when
          the Account is STANDARD but 60 points when GOLD (GOLD_MULTIPLIER=2) — the
          dual-variant subject is the Account loyalty domain.
        test_recipe:
          setup:
            - "Nursery with loyalty_accrual_per_dollar=1 and gold_tier_threshold_points=20."
            - "One RETAIL account; one DRY_GOOD product priced 3000 cents; one released lot of 50 units."
            - "Order #1: single line qty=1 (net 3000), confirmed/paid/allocated/fulfilled → STANDARD accrual=30 → account becomes GOLD (lifetime 30 >= 20)."
            - "Order #2: single line qty=1 (net 3000), confirmed/paid/allocated, about to fulfill while GOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6, loyalty_accrual_per_dollar: 1, gold_tier_threshold_points: 20 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-1", name: "Trellis", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 3000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 50, unit_cost_cents: 1000 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            # ---- Order #1 (STANDARD) ----
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { o1: $.data.id, o1v0: $.data.version }
            - call: "POST /orders/${o1}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${o1}/confirm"
              payload: { expected_order_version: "${o1v0}" }
              as: SalesClerk
              captures: { o1v1: $.data.version }
            - call: "POST /orders/${o1}/allocate"
              payload: { expected_order_version: "${o1v1}" }
              as: InventoryManager
              captures: { o1v2: $.data.version }
            - call: "POST /orders/${o1}/pay"
              payload: { expected_order_version: "${o1v2}" }
              as: SalesClerk
              captures: { o1v3: $.data.version }
            - call: "POST /orders/${o1}/fulfill"
              payload: { expected_order_version: "${o1v3}" }
              as: InventoryManager
            # ---- Order #2 (now GOLD), staged up to ALLOCATED+PAID ----
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { o2: $.data.id, o2v0: $.data.version }
            - call: "POST /orders/${o2}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${o2}/confirm"
              payload: { expected_order_version: "${o2v0}" }
              as: SalesClerk
              captures: { o2v1: $.data.version }
            - call: "POST /orders/${o2}/allocate"
              payload: { expected_order_version: "${o2v1}" }
              as: InventoryManager
              captures: { o2v2: $.data.version }
            - call: "POST /orders/${o2}/pay"
              payload: { expected_order_version: "${o2v2}" }
              as: SalesClerk
              captures: { o2v3: $.data.version }
          trigger:
            - call: "POST /orders/${o2}/fulfill"
              payload: { expected_order_version: "${o2v3}" }
              as: InventoryManager
          assert:
            - "Account.${aid}.loyalty_tier == GOLD after order #1 fulfill"
            - "After order #2 fulfill the new ACCRUAL LoyaltyEvent.points_delta == 60 (GOLD variant), not 30"
            - "Account.${aid}.lifetime_points == 90"

      - name: shrink_valuation_provisional_vs_final_on_lot
        grounds:
          - calculations.shrink_valuation
          - entities.InventoryLot.fields.provisional_shrink_value_cents
          - state_machines.InventoryLot.AVAILABLE_to_DEPLETED
        distinguishing_aspect: |
          On the SAME lot (received 10 @ unit_cost 250), the PROVISIONAL valuation
          after logging 2 shrink units is 500 cents, while the FINAL valuation at
          depletion (received 10 - sold 0) is 2500 cents — the dual-variant subject
          is the InventoryLot shrink domain (different from the Account loyalty domain).
        test_recipe:
          setup:
            - "Nursery + LIVE_PLANT product; one lot received_qty=10, unit_cost_cents=250, released to AVAILABLE."
            - "Two SHRINK_LOSS care entries totalling qty_lost=2 logged → provisional 500."
            - "Remaining 8 units lost via a final SHRINK_LOSS of qty_lost=8 → qty_on_hand 0, lot DEPLETED, no units ever sold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-1", name: "Hosta", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 3, hardiness_max_zone: 9, unit_price_cents: 1200, warranty_days: 30, warranty_pct: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 10, unit_cost_cents: 250 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /inventory-lots/${lot}/care-log"
              payload: { entry_type: "SHRINK_LOSS", qty_lost: 1, note: "wilt" }
              as: InventoryManager
            - call: "POST /inventory-lots/${lot}/care-log"
              payload: { entry_type: "SHRINK_LOSS", qty_lost: 1, note: "wilt" }
              as: InventoryManager
          trigger:
            - call: "POST /inventory-lots/${lot}/care-log"
              payload: { entry_type: "SHRINK_LOSS", qty_lost: 8, note: "total loss" }
              as: InventoryManager
          assert:
            - "Before trigger, InventoryLot.${lot}.provisional_shrink_value_cents == 500 (PROVISIONAL: 2 * 250)"
            - "After trigger, InventoryLot.${lot}.status == DEPLETED"
            - "After trigger, the FINAL shrink valuation == 2500 ((received 10 - sold 0) * 250), exceeding the provisional 500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_pricing_round_per_line_then_sum
        grounds:
          - calculations.line_pricing
          - calculations.order_totals
          - entities.OrderLine.fields.line_discount_cents
          - state_machines.Order.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          MODE (b) nested rounding: two LIVE_PLANT lines under a 15% promo round the
          discount PER LINE then sum (224 + 329 = 553), which differs from
          sum-then-round (floor(3695*0.15) = 554) by exactly 1 cent; the scaffold
          pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "ACTIVE 15% LIVE_PLANT promotion covering the clock instant."
            - "Order with line A (qty=3 @ 499) and line B (qty=2 @ 1099); no redemption."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-A", name: "Fern", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 1, hardiness_max_zone: 13, unit_price_cents: 499, warranty_days: 30, warranty_pct: 50 }
              as: InventoryManager
              captures: { pa: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-B", name: "Maple", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 1, hardiness_max_zone: 13, unit_price_cents: 1099, warranty_days: 30, warranty_pct: 50 }
              as: InventoryManager
              captures: { pb: $.data.id }
            - call: "POST /nurseries/${nid}/promotions"
              payload: { name: "Spring Days", category_scope: "LIVE_PLANT", discount_pct: 15, starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: SalesClerk
              captures: { promo: $.data.id }
            - call: "POST /promotions/${promo}/activate"
              payload: {}
              as: SalesClerk
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pa}", qty: 3 }
              as: SalesClerk
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pb}", qty: 2 }
              as: SalesClerk
          trigger:
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
          assert:
            - "Order.${oid}.gross_total_cents == 3695"
            - "Order.${oid}.promo_discount_cents == 553 (round-per-line 224+329, NOT sum-then-round 554)"
            - "Order.${oid}.net_total_cents == 3142"

      - name: warranty_payout_single_final_floor
        grounds:
          - calculations.warranty_payout
          - calculations.line_pricing
          - entities.WarrantyClaim.fields.payout_cents
          - state_machines.WarrantyClaim.FILED_to_APPROVED
        distinguishing_aspect: |
          MODE (a) ≥3-input non-linear formula with one pinned final floor:
          payout = floor(claim_qty * (line_net/line_qty) * warranty_pct/100). A line of
          qty=2 @ 999 under a 15% promo has line_net=1699, so the per-unit net is the
          NON-integer 849.5; with claim_qty=2 and warranty_pct=100 the correct payout is
          floor(2 * 849.5 * 1) = 1699, whereas flooring the per-unit value first
          (floor(1699/2)=849) would give 1698 — the scaffold keeps line_net/line_qty
          exact until the single final floor.
        test_recipe:
          setup:
            - "ACTIVE 15% LIVE_PLANT promotion covering the clock instant."
            - "LIVE_PLANT product price=999, warranty_days=60, warranty_pct=100. Order one line qty=2 → gross 1998, promo discount floor(1998*0.15)=299, line_net=1699."
            - "Order confirmed/paid/allocated/fulfilled; a REFUND claim filed for claim_qty=2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-W", name: "Oak", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 1, hardiness_max_zone: 13, unit_price_cents: 999, warranty_days: 60, warranty_pct: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /nurseries/${nid}/promotions"
              payload: { name: "Spring Days", category_scope: "LIVE_PLANT", discount_pct: 15, starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: SalesClerk
              captures: { promo: $.data.id }
            - call: "POST /promotions/${promo}/activate"
              payload: {}
              as: SalesClerk
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 10, unit_cost_cents: 400 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: SalesClerk
              captures: { lineid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
              captures: { ov2: $.data.version }
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov2}" }
              as: SalesClerk
              captures: { ov3: $.data.version }
            - call: "POST /orders/${oid}/fulfill"
              payload: { expected_order_version: "${ov3}" }
              as: InventoryManager
            - call: "POST /order-lines/${lineid}/warranty-claims"
              payload: { claim_qty: 2, resolution: "REFUND" }
              as: SalesClerk
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim}/approve"
              payload: {}
              as: SalesClerk
          assert:
            - "OrderLine.${lineid}.line_net_cents == 1699 (gross 1998 - promo 299)"
            - "WarrantyClaim.${claim}.status == APPROVED"
            - "WarrantyClaim.${claim}.payout_cents == 1699 (floor(2 * 1699/2 * 100/100); floor-per-unit-first would wrongly give 1698)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.CONFIRMED_to_ALLOCATED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          On one Order row, payment_status (UNPAID→PAID) advances independently of
          fulfillment_status (DRAFT→CONFIRMED→ALLOCATED): paying does not change
          fulfillment_status and allocating does not change payment_status — two
          parallel dimensions on the Order entity.
        test_recipe:
          setup:
            - "Order confirmed (fulfillment CONFIRMED, payment UNPAID) with one line; lot released."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-2", name: "Pot", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 500 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 20, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov1}" }
              as: SalesClerk
              captures: { ov2: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov2}" }
              as: InventoryManager
          assert:
            - "After pay: Order.${oid}.payment_status == PAID AND Order.${oid}.fulfillment_status == CONFIRMED (fulfillment unchanged)"
            - "After allocate: Order.${oid}.fulfillment_status == ALLOCATED AND Order.${oid}.payment_status == PAID (payment unchanged)"

      - name: inventory_lot_quarantine_cycle
        grounds:
          - state_machines.InventoryLot.QUARANTINE_to_AVAILABLE
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINE
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          The InventoryLot machine is cyclic: a lot can go QUARANTINE→AVAILABLE→
          QUARANTINE→AVAILABLE any number of times while it still has stock — a
          different entity from the parallel-dimension Order machine.
        test_recipe:
          setup:
            - "One lot received (QUARANTINE) with qty 5 and no reservations."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-Q", name: "Ivy", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 3, hardiness_max_zone: 9, unit_price_cents: 600, warranty_days: 30, warranty_pct: 50 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 5, unit_cost_cents: 200 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /inventory-lots/${lot}/quarantine"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
          assert:
            - "After release→quarantine→release the lot status cycles QUARANTINE→AVAILABLE→QUARANTINE→AVAILABLE and ends AVAILABLE"
            - "InventoryLot.${lot}.version increased by 3 across the three transitions"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_depletes_lot_and_finalizes_shrink
        grounds:
          - state_machines.Order.ALLOCATED_to_FULFILLED
          - state_machines.InventoryLot.AVAILABLE_to_DEPLETED
          - calculations.shrink_valuation
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: Order fulfill mutates the lot
          (reserved→sold); that mutation drives lot.qty_on_hand to 0 which itself
          triggers the lot's AVAILABLE→DEPLETED auto-transition; that transition
          itself triggers the FINAL shrink valuation. Each link is caused by the
          previous link, not directly by fulfill.
        test_recipe:
          setup:
            - "Lot received_qty=4, unit_cost 250, released; order line qty=4 (the whole lot), confirmed/paid/allocated (reserved 4)."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-3", name: "Bag", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 4, unit_cost_cents: 250 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 4 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
              captures: { ov2: $.data.version }
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov2}" }
              as: SalesClerk
              captures: { ov3: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: { expected_order_version: "${ov3}" }
              as: InventoryManager
          assert:
            - "InventoryLot.${lot}.sold_qty == 4 AND reserved_qty == 0 AND qty_on_hand == 0"
            - "InventoryLot.${lot}.status == DEPLETED (auto-transition, caused by qty_on_hand hitting 0)"
            - "FINAL shrink valuation == 0 ((received 4 - sold 4) * 250) — the depletion-triggered valuation ran"

      - name: cancel_allocated_releases_lot_reservation
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - entities.InventoryLot.fields.reserved_qty
          - entities.InventoryLot.fields.qty_on_hand
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (cancel, vs fulfill above): Order
          cancel sets each line RELEASED, and that line mutation itself decrements
          the chosen lot's reserved_qty which recomputes the lot's qty_on_hand back up.
        test_recipe:
          setup:
            - "Lot received_qty=6, released; order line qty=6 confirmed and allocated (reserved 6, qty_on_hand 0)."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-4", name: "Tool", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 800 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 6, unit_cost_cents: 300 }
              as: InventoryManager
