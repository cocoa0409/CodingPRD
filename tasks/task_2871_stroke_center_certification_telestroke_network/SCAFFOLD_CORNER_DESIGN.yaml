          cr_c2: $.data.id
      trigger:
      - call: GET /stroke-network/stroke-centers/${cr_ctr}
        as: ProgramCoordinator
        captures:
          cr_open1: $.data.open_case_count
          cr_eq1: $.data.equipment_readiness_posture
          cr_ems1: $.data.ems_routing_posture
          cr_v1: $.data.version
