            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Single offer", body_text: "One offer routed into the standard queue for the permission probe.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/one", display_url: "https://www.beaconlending.example/one" }
