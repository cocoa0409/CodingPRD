  # ============================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: tank_uptake_discharge_conserves_zero_balance
        grounds:
          - validations[priority=15]
          - calculations.exchange_vs_treatment_determination
        distinguishing_aspect: |
          Conserved quantity (1): per-tank chronological volume balance. The forward action (UPTAKE 500
          on T7) paired with its compensating action (DISCHARGE 500 on T7) leaves sum(UPTAKE) -
          sum(DISCHARGE) == 0 — the same invariant that forbids any further 0.001 m3 discharge (no drift,
          no negative prefix at any point of the event timeline).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9101 IN_PROGRESS"
            - "Tank T7: UPTAKE 500 @2026-07-28T06:00:00Z then DISCHARGE 500 @2026-07-29T06:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000026", vessel_name: "MV Zebra", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9101", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T7", volume_m3: 500, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T7", volume_m3: 500, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: $.data.version }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T7", volume_m3: 0.001, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w3}" }
              as: VesselMaster
              captures: { err: "$.data.error_id" }
            - call: "GET /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { tank_id: "T7" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}/determinations"
              as: VesselMaster
              captures: { d_total: "$.data[0].total_discharged_volume_m3", d_noncomp: "$.data[0].noncompliant_volume_m3" }
          assert:
            - "sum(UPTAKE T7) - sum(DISCHARGE T7) == 0 after the compensating pair (invariant conserved)"
            - "${err} == ERR_TANK_BALANCE_NEGATIVE (invariant enforced: balance may touch but never cross zero)"
            - "GET ballast-events?tank_id=T7 returns total_count == 2 (rejected overdraft not persisted)"
            - "${d_total} == 500.0 AND ${d_noncomp} == 500.0 (only the accepted discharge counted)"

      - name: determination_partition_conserved_across_recompute
        grounds:
          - calculations.exchange_vs_treatment_determination
          - entities.ComplianceDetermination.fields.is_current
        distinguishing_aspect: |
          Conserved quantity (2): the discharged-volume partition — for every determination,
          total_discharged_volume_m3 == exchange + treatment + noncompliant (500.0 == 0.0 + 300.0 + 200.0
          here), AND exactly one determination per voyage holds is_current == true: a manual recompute
          (the compensating/repeat action) preserves the partition literals and flips is_current from the
          superseded row to the new one without changing the conserved sum.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9102 IN_PROGRESS"
            - "Tank T1: UPTAKE 300, TREATMENT_COMPLETE 300, DISCHARGE 300; Tank T2: UPTAKE 200, DISCHARGE 200 (no method)"
