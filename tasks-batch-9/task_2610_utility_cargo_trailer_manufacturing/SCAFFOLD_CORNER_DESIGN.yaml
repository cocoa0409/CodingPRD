        excluded_because:
          difficulty_instance: non_linear_state_machine / warranty_info_request_loop_terminates_in_denial
          rationale: "That instance drives the loop to its third REQUEST_INFO and asserts DENIED with INFO_REQUEST_LIMIT_REACHED."
