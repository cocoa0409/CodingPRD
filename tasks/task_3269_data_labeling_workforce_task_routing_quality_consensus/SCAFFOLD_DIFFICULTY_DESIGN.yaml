            - "a concurrence attempted while the claim sits in ADJUDICATION with a PAY_REVERSAL proposal is rejected with ERR_INVALID_STATE at status 409, because the CONCURRENCE entry from ADJUDICATION only accepts QUALIFICATION_RESET"
            - "after a second ESCALATE the claim returns to PROPOSED, so the cycle PROPOSED to ADJUDICATION to PROPOSED is traversable more than once on one row"
            - "a concurrence attempted by the same reviewer whose X-User-ID equals adjudicator_id is rejected with ERR_SEGREGATION_OF_DUTIES at status 403, so the cycle only closes across two distinct reviewer identities"
            - "a claim left in ADJUDICATION past patience_seconds of 600 fires the deadlock sweep and terminates DEADLOCKED with consensus_outcome DEADLOCKED"

