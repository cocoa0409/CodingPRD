# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2926 Officiating Development & Performance Grading
#
# Every instance grounds in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Repeated setup chains are shared via YAML anchors (&c_*) and aliases (*c_*);
# an alias is byte-identical to the anchored call, including its captures.
# All numeric assertions are literals computed from the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: accuracy_index_provisional_vs_final_on_season_record
        grounds:
          - calculations.accuracy_index
          - calculations.weighted_error_points
          - entities.OfficialSeasonRecord.fields.accuracy_index
          - entities.OfficialSeasonRecord.fields.accuracy_variant
          - entities.OfficialSeasonRecord.fields.graded_play_count
          - state_machines.SeasonProgram.OPEN_to_POSTSEASON_LOCKED
          - state_machines.Game.PLAYED_to_FINALIZED
        distinguishing_aspect: |
          The PROVISIONAL variant counts POSTED and FINAL grades alike, while the
          FINAL variant counts only FINAL grades, so one umpire with three FINAL
          plays on a finalized game plus one POSTED play on a game that never
          finalized reads accuracy_index 83.10 with graded_play_count 4 before
          the postseason lock and 95.00 with graded_play_count 3 after it.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and every other threshold defaulted (accuracy_eligibility_threshold 95.00, min_graded_plays_for_eligibility 3)."
            - "Official Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE with seasons_experience 6 and tier TIER_2."
            - "Game G1 (BUF at MIA, kickoff 2026-09-13T17:00:00Z) is FINALIZED; Dan's assignment on it is COMPLETED; his three grades on G1 are FINAL: CORRECT/LOW, CORRECT/LOW and MISSED_CALL/LOW (error_points 0.00, 0.00, 0.75)."
            - "Game G2 (DAL at PHI, kickoff 2026-09-18T21:00:00Z) is PLAYED but NOT finalized; Dan's single grade on it is POSTED: MISSED_CALL/HIGH with error_points 2.63."
            - "The logical clock stands at 2026-09-19T01:30:00Z."
          setup_api_calls:
            - &c_clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OfficiatingDirector
            - &c_prog_solo
              call: "POST /season-programs"
              payload: { season_year: 2026, crew_size_required: 1 }
              as: OfficiatingDirector
              captures: { sp_id: $.data.id }
            - &c_open_prog
              call: "POST /season-programs/${sp_id}/open"
              payload: {}
              as: OfficiatingDirector
            - &c_off_ump
              call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Dan Ruiz", position: "UMPIRE", seasons_experience: 6, home_market_code: "MIA", tier: "TIER_2" }
              as: OfficiatingDirector
              captures: { ump_id: $.data.id }
            - &c_ump_exam
              call: "POST /officials/${ump_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-U1", score: 84.00 }
              as: TrainingCoordinator
            - &c_ump_phys
              call: "POST /officials/${ump_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-U1", score: 79.00 }
              as: TrainingCoordinator
            - &c_game_g1
              call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "MIA", away_team_code: "BUF", venue_market_code: "MIA", kickoff_utc: "2026-09-13T17:00:00Z" }
              as: OfficiatingDirector
              captures: { g1_id: $.data.id, g1_v0: $.data.version }
            - &c_assign_ump_g1
              call: "POST /crew-assignments"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g1_v0}" }
              as: CrewScheduler
              captures: { au1_id: $.data.id }
            - &c_confirm_ump_g1
              call: "POST /crew-assignments/${au1_id}/confirm"
              payload: {}
              as: CrewScheduler
            - &c_clock_g1_kick
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T17:00:00Z" }
              as: OfficiatingDirector
            - &c_kick_g1
              call: "POST /games/${g1_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
            - &c_clock_g1_post
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T21:30:00Z" }
              as: OfficiatingDirector
            - &c_played_g1
              call: "POST /games/${g1_id}/mark-played"
              payload: {}
              as: OfficiatingDirector
            - &c_grade_u_correct1
              call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q1-P07", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_u1: $.data.id }
            - &c_post_u_correct1
              call: "POST /play-grades/${pg_u1}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - &c_grade_u_correct2
              call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q2-P14", call_category: "FALSE_START", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_u2: $.data.id }
            - &c_post_u_correct2
              call: "POST /play-grades/${pg_u2}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - &c_grade_u_missed_low
              call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q3-P22", call_category: "HOLDING", grade_code: "MISSED_CALL", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_u3: $.data.id }
            - &c_post_u_missed_low
              call: "POST /play-grades/${pg_u3}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - &c_finalize_g1
              call: "POST /games/${g1_id}/finalize"
              payload: {}
              as: OfficiatingDirector
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "DAL", away_team_code: "PHI", venue_market_code: "DAL", kickoff_utc: "2026-09-18T21:00:00Z" }
              as: OfficiatingDirector
              captures: { g2_id: $.data.id, g2_v0: $.data.version }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g2_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g2_v0}" }
              as: CrewScheduler
              captures: { au2_id: $.data.id }
            - call: "POST /crew-assignments/${au2_id}/confirm"
              payload: {}
              as: CrewScheduler
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T21:00:00Z" }
              as: OfficiatingDirector
            - call: "POST /games/${g2_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-19T01:30:00Z" }
              as: OfficiatingDirector
            - call: "POST /games/${g2_id}/mark-played"
              payload: {}
              as: OfficiatingDirector
            - call: "POST /play-grades"
              payload: { game_id: "${g2_id}", official_id: "${ump_id}", play_ref: "Q1-P03", call_category: "PASS_INTERFERENCE", grade_code: "MISSED_CALL", impact: "HIGH" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_u4: $.data.id }
            - call: "POST /play-grades/${pg_u4}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
          trigger:
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { idx_prov: "$.data[0].accuracy_index", n_prov: "$.data[0].graded_play_count", wep_prov: "$.data[0].weighted_error_points", var_prov: "$.data[0].accuracy_variant" }
            - call: "POST /season-programs/${sp_id}/lock-postseason"
              payload: {}
              as: OfficiatingDirector
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { idx_final: "$.data[0].accuracy_index", n_final: "$.data[0].graded_play_count", wep_final: "$.data[0].weighted_error_points", var_final: "$.data[0].accuracy_variant", elig_final: "$.data[0].accuracy_eligible", ret_final: "$.data[0].retention_recommendation" }
          assert:
            - "${var_prov} == PROVISIONAL and ${n_prov} == 4 and ${wep_prov} == 3.38 and ${idx_prov} == 83.10"
            - "${var_final} == FINAL and ${n_final} == 3 and ${wep_final} == 0.75 and ${idx_final} == 95.00"
            - "${idx_final} - ${idx_prov} == 11.90 — the same four grades produce two different indices purely from the variant's inclusion set"
            - "${elig_final} == true because 95.00 >= accuracy_eligibility_threshold 95.00 and graded_play_count 3 >= min_graded_plays_for_eligibility 3"
            - "${ret_final} == RETAIN"
            - "SeasonProgram.${sp_id}.status == POSTSEASON_LOCKED and SeasonProgram.${sp_id}.eligible_official_count == 1"

      - name: crew_strength_index_projected_vs_realized_on_game
        grounds:
          - calculations.crew_strength_index
          - entities.Game.fields.crew_strength_index
          - entities.Game.fields.crew_strength_variant
          - state_machines.Game.SCHEDULED_to_IN_PROGRESS
          - state_machines.Game.PLAYED_to_FINALIZED
          - state_machines.CrewAssignment.CONFIRMED_to_VOIDED
        distinguishing_aspect: |
          The PROJECTED variant scores PROPOSED and CONFIRMED assignments while
          the REALIZED variant scores only COMPLETED ones, so a two-person crew
          that projects 8.64 at kickoff realises exactly 6.24 at finalization
          once the umpire's assignment is voided by a suspension — a different
          entity domain (Game crew composition) from the accuracy instance
          (OfficialSeasonRecord grading accuracy).
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required defaulted to 2."
            - "Official Rita Vance is an ACTIVE, preseason_cleared REFEREE, tier TIER_2, seasons_experience 14 (per-assignment points min(12,14)*0.80*1.30 = 12.48)."
            - "Official Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE, tier TIER_2, seasons_experience 6 (per-assignment points 6*0.80*1.00 = 4.80)."
            - "Game G1 (BUF at MIA, kickoff 2026-09-13T17:00:00Z) has both assignments CONFIRMED, so it is STAFFED and kicks off with crew_strength_index 8.64."
            - "A SUSPENSION discipline action against Dan while G1 is IN_PROGRESS voids his assignment; G1 is then marked PLAYED, so only Rita's assignment reaches COMPLETED."
          setup_api_calls:
            - *c_clock_aug1
            - &c_prog_crew
              call: "POST /season-programs"
              payload: { season_year: 2026 }
              as: OfficiatingDirector
              captures: { sp_id: $.data.id }
            - *c_open_prog
            - &c_off_ref
              call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Rita Vance", position: "REFEREE", seasons_experience: 14, home_market_code: "BUF", tier: "TIER_2" }
              as: OfficiatingDirector
              captures: { ref_id: $.data.id }
            - &c_ref_exam
              call: "POST /officials/${ref_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-R1", score: 91.00 }
              as: TrainingCoordinator
            - &c_ref_phys
              call: "POST /officials/${ref_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-R1", score: 88.00 }
              as: TrainingCoordinator
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - &c_assign_ref_g1
              call: "POST /crew-assignments"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", position: "REFEREE", expected_game_version: "${g1_v0}" }
              as: CrewScheduler
              captures: { ar1_id: $.data.id }
            - &c_read_g1_version
              call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { g1_v1: $.data.version }
            - &c_assign_ump_g1_v1
              call: "POST /crew-assignments"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g1_v1}" }
              as: CrewScheduler
              captures: { au1_id: $.data.id }
            - &c_confirm_ref_g1
              call: "POST /crew-assignments/${ar1_id}/confirm"
              payload: {}
              as: CrewScheduler
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - &c_kick_g1_capture
              call: "POST /games/${g1_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
              captures: { csi_projected: $.data.crew_strength_index, csv_projected: $.data.crew_strength_variant }
            - &c_read_ump_version
              call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { ump_v: $.data.version }
            - &c_suspend_ump
              call: "POST /discipline-actions"
              payload: { official_id: "${ump_id}", reason_category: "CONDUCT", severity: "SUSPENSION", suspension_games: 2, expected_official_version: "${ump_v}" }
              as: OfficiatingDirector
              captures: { da_id: $.data.id }
            - *c_clock_g1_post
            - *c_played_g1
          trigger:
            - call: "POST /games/${g1_id}/finalize"
              payload: {}
              as: OfficiatingDirector
              captures: { csi_realized: $.data.crew_strength_index, csv_realized: $.data.crew_strength_variant }
          assert:
            - "${csv_projected} == PROJECTED and ${csi_projected} == 8.64 — (12.48 + 4.80) / crew_size_required 2"
            - "${csv_realized} == REALIZED and ${csi_realized} == 6.24 — 12.48 / crew_size_required 2, the voided umpire contributing nothing"
            - "the divisor stays crew_size_required 2 in both variants, so ${csi_realized} != 12.48"
            - "CrewAssignment.${au1_id}.status == VOIDED and CrewAssignment.${ar1_id}.status == COMPLETED"
            - "Official.${ump_id}.status == SUSPENDED and Official.${ump_id}.open_assignment_count == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: error_points_round_per_play_then_sum_mode_b
        grounds:
          - calculations.play_error_points
          - calculations.weighted_error_points
          - entities.PlayGrade.fields.error_points
          - entities.OfficialSeasonRecord.fields.weighted_error_points
          - state_machines.PlayGrade.grade_status_DRAFT_to_POSTED
        distinguishing_aspect: |
          Mode (b) nested rounding: two identical MISSED_CALL/HIGH plays on an
          UMPIRE each round 1.50*1.75*1.00 = 2.625 up to 2.63 BEFORE summation, so
          weighted_error_points is exactly 5.26 and accuracy_index 47.40 — the
          sum-then-round order would yield 5.25 and 47.50.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Official Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE (POSITION_FACTOR 1.00)."
            - "Game G1 is PLAYED with Dan's assignment COMPLETED."
            - "Two grades are filed on distinct play_refs, both MISSED_CALL with impact HIGH; the first is already POSTED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q1-P11", call_category: "PASS_INTERFERENCE", grade_code: "MISSED_CALL", impact: "HIGH" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_b1: $.data.id, pg_b1_points: $.data.error_points }
            - call: "POST /play-grades/${pg_b1}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q4-P02", call_category: "ROUGHING_PASSER", grade_code: "MISSED_CALL", impact: "HIGH" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_b2: $.data.id, pg_b2_points: $.data.error_points }
          trigger:
            - call: "POST /play-grades/${pg_b2}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { wep_b: "$.data[0].weighted_error_points", idx_b: "$.data[0].accuracy_index", n_b: "$.data[0].graded_play_count" }
          assert:
            - "${pg_b1_points} == 2.63 and ${pg_b2_points} == 2.63 — each raw product 2.625 is rounded half-up per play"
            - "${n_b} == 2 and ${wep_b} == 5.26 — round-then-sum; the forbidden sum-then-round order would report 5.25"
            - "${idx_b} == 47.40 — 100.00 - (5.26 / 2) * 20.00; the wrong rounding order would report 47.50"
            - "OfficialSeasonRecord for ${ump_id} has accuracy_eligible == false because graded_play_count 2 < min_graded_plays_for_eligibility 3"

      - name: retention_penalty_band_selected_from_pre_penalty_score_mode_c
        grounds:
          - calculations.retention_score
          - calculations.training_deficiency_count
          - calculations.accuracy_index
          - entities.OfficialSeasonRecord.fields.retention_score
          - entities.OfficialSeasonRecord.fields.availability_component
          - entities.OfficialSeasonRecord.fields.retention_recommendation
          - state_machines.SeasonProgram.OPEN_to_POSTSEASON_LOCKED
        distinguishing_aspect: |
          Mode (c) circular dependency pinned by evaluation order: the penalty
          band is chosen from raw_score 81.50 (band 80.00..<90.00, rate 5.00),
          giving retention_score 76.50 and DEVELOP — re-reading the band off the
          post-penalty composite would apply rate 9.00 and yield 72.50/RELEASE.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and clinic_attendance_required 1."
            - "Official Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE with a passed PHYSICAL_TEST and RULES_EXAM but NO RULES_CLINIC record, so training_deficiency_count == 1."
            - "Game G1 is FINALIZED with Dan's assignment COMPLETED and three FINAL grades (CORRECT/LOW, CORRECT/LOW, MISSED_CALL/LOW) giving FINAL accuracy_index 95.00 over 3 plays."
            - "Game G3 (KC at NYJ, kickoff 2026-09-24T01:00:00Z) carries a WITHDRAWN assignment for Dan, so obligated assignments are 2 (1 COMPLETED + 1 WITHDRAWN) and availability_component is 50.00."
            - "No game of the program is IN_PROGRESS."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_correct1
            - *c_post_u_correct1
            - *c_grade_u_correct2
            - *c_post_u_correct2
            - *c_grade_u_missed_low
            - *c_post_u_missed_low
            - *c_finalize_g1
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "NYJ", away_team_code: "KC", venue_market_code: "NYJ", kickoff_utc: "2026-09-24T01:00:00Z" }
              as: OfficiatingDirector
              captures: { g3_id: $.data.id, g3_v0: $.data.version }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g3_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g3_v0}" }
              as: CrewScheduler
              captures: { au3_id: $.data.id }
            - call: "POST /crew-assignments/${au3_id}/withdraw"
              payload: { reason: "personal availability" }
              as: CrewScheduler
          trigger:
            - call: "POST /season-programs/${sp_id}/lock-postseason"
              payload: {}
              as: OfficiatingDirector
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { avail_c: "$.data[0].availability_component", idx_c: "$.data[0].accuracy_index", ret_c: "$.data[0].retention_score", rec_c: "$.data[0].retention_recommendation" }
          assert:
            - "${idx_c} == 95.00 with accuracy_variant FINAL"
            - "${avail_c} == 50.00 — 100.00 * 1 COMPLETED / 2 obligated"
            - "raw_score == 81.50 — 95.00 * 0.70 + 50.00 * 0.30"
            - "${ret_c} == 76.50 — band chosen from raw_score 81.50 gives rate 5.00 * 1 deficiency"
            - "${rec_c} == DEVELOP, NOT RELEASE; the band-from-composite misreading would produce 72.50"
            - "Official.${ump_id}.status == ACTIVE — no RELEASE cascade fires for a DEVELOP recommendation"

      - name: crew_strength_experience_cap_and_two_weight_tables_mode_a
        grounds:
          - calculations.crew_strength_index
          - entities.Official.fields.seasons_experience
          - entities.Official.fields.tier
          - entities.CrewAssignment.fields.position
          - state_machines.CrewAssignment.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a) non-linear interaction of four inputs: min(EXPERIENCE_CAP 12,
          seasons_experience) is nested inside a product of two independent weight
          tables and then divided by crew_size_required, so a 14-season TIER_2
          referee plus a 6-season TIER_2 umpire score exactly 8.64 — dropping the
          cap gives 9.68 and using the umpire position weight for the referee
          gives 7.20.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required defaulted to 2."
            - "Rita Vance is an ACTIVE, preseason_cleared REFEREE, TIER_2, seasons_experience 14 (above the cap of 12)."
            - "Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE, TIER_2, seasons_experience 6 (below the cap)."
            - "Game G1 holds both assignments and both are CONFIRMED, so the game is STAFFED and still SCHEDULED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_crew
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ref_g1
            - *c_read_g1_version
            - *c_assign_ump_g1_v1
            - *c_confirm_ref_g1
            - *c_confirm_ump_g1
          trigger:
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { csi_a: $.data.crew_strength_index, posture_a: $.data.crew_posture, ccc_a: $.data.confirmed_crew_count }
          assert:
            - "${csi_a} == 8.64 — (min(12,14)*0.80*1.30 = 12.48) + (6*0.80*1.00 = 4.80) = 17.28, divided by crew_size_required 2"
            - "ignoring the EXPERIENCE_CAP would give (14*0.80*1.30 = 14.56 + 4.80) / 2 = 9.68"
            - "using POSITION_WEIGHT_UMPIRE for the referee would give (9.60 + 4.80) / 2 = 7.20"
            - "${posture_a} == STAFFED and ${ccc_a} == 2"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: play_grade_status_and_appeal_state_advance_independently
        grounds:
          - state_machines.PlayGrade.grade_status_POSTED_to_FINAL
          - state_machines.PlayGrade.appeal_state_NOT_APPEALED_to_APPEAL_PENDING
          - state_machines.PlayGrade.appeal_state_APPEAL_PENDING_to_APPEAL_RESOLVED
          - state_machines.Game.PLAYED_to_FINALIZED
          - entities.PlayGrade.fields.grade_status
          - entities.PlayGrade.fields.appeal_state
        distinguishing_aspect: |
          PlayGrade carries two parallel dimensions on one row: finalizing the
          game moves the un-appealed grade DRAFT->POSTED->FINAL while the appealed
          grade is held at POSTED by the cross-dimension guard, and the later
          appeal decision moves only the appeal dimension to APPEAL_RESOLVED,
          leaving grade_status at POSTED forever.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1; the clock stands at 2026-09-13T21:30:00Z."
            - "Game G1 is PLAYED with Dan Ruiz's assignment COMPLETED."
            - "Grade A (Q1-P07, CORRECT/LOW) and Grade B (Q4-P02, MISSED_CALL/HIGH) are both POSTED, graded by user sup-grader-1."
            - "Dan has appealed Grade B, so Grade B.appeal_state == APPEAL_PENDING and his appeal_credits_remaining == 2."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_correct1
            - *c_post_u_correct1
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q4-P02", call_category: "ROUGHING_PASSER", grade_code: "MISSED_CALL", impact: "HIGH" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_par: $.data.id }
            - call: "POST /play-grades/${pg_par}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_par}", basis_note: "camera angle shows contact was legal" }
              as: Official
              as_user_id: "${ump_id}"
              captures: { ap_par: $.data.id }
          trigger:
            - call: "POST /games/${g1_id}/finalize"
              payload: {}
              as: OfficiatingDirector
            - call: "GET /play-grades/${pg_par}"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-review-2"
              captures: { pgb_status_mid: $.data.grade_status, pgb_appeal_mid: $.data.appeal_state }
            - call: "POST /grade-appeals/${ap_par}/start-review"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-review-2"
            - call: "POST /grade-appeals/${ap_par}/decide"
              payload: { outcome: "UPHELD", decision_note: "grade stands on review" }
              as: GradingSupervisor
              as_user_id: "sup-review-2"
            - call: "GET /play-grades/${pg_par}"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-review-2"
              captures: { pgb_status_end: $.data.grade_status, pgb_appeal_end: $.data.appeal_state, pgb_points_end: $.data.error_points }
            - call: "GET /play-grades/${pg_u1}"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-review-2"
              captures: { pga_status_end: $.data.grade_status, pga_appeal_end: $.data.appeal_state }
          assert:
            - "${pga_status_end} == FINAL and ${pga_appeal_end} == NOT_APPEALED — the un-appealed grade completed the grade_status dimension"
            - "${pgb_status_mid} == POSTED and ${pgb_appeal_mid} == APPEAL_PENDING — finalize skipped the appealed grade"
            - "${pgb_status_end} == POSTED and ${pgb_appeal_end} == APPEAL_RESOLVED — the appeal dimension advanced alone; the game is already FINALIZED so grade_status never reaches FINAL"
            - "${pgb_points_end} == 2.63 — an UPHELD appeal leaves grade_code and error_points untouched"
            - "Game.${g1_id}.status == FINALIZED"

      - name: advancement_application_return_loop_then_auto_denial_at_cap
        grounds:
          - state_machines.AdvancementApplication.COMMITTEE_REVIEW_to_RETURNED_FOR_TAPE
          - state_machines.AdvancementApplication.RETURNED_FOR_TAPE_to_COMMITTEE_REVIEW
          - state_machines.AdvancementApplication.COMMITTEE_REVIEW_to_DENIED
          - calculations.field_evaluation_score
          - entities.AdvancementApplication.fields.return_count
          - entities.SeasonProgram.fields.max_application_returns
        distinguishing_aspect: |
          AdvancementApplication cycles COMMITTEE_REVIEW -> RETURNED_FOR_TAPE ->
          COMMITTEE_REVIEW on a different entity from the parallel PlayGrade
          instance, and the loop terminates by converting the return that would
          exceed max_application_returns 1 into a DENIED decision with
          return_count frozen at 1 rather than rejecting the call.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with max_application_returns 1."
            - "Rita Vance is an ACTIVE, preseason_cleared REFEREE, TIER_2, seasons_experience 14, with accuracy_index 100.00 over zero graded plays."
            - "Her TIER_1 application has been SCREENED, carries two field evaluations (composites 76.10 and 81.60, average 78.85), reached COMMITTEE_REVIEW, was returned once (return_count 1), received a third evaluation (81.60, average 79.77) and was resubmitted to COMMITTEE_REVIEW."
          setup_api_calls:
            - *c_clock_aug1
            - &c_prog_returns1
              call: "POST /season-programs"
              payload: { season_year: 2026, crew_size_required: 1, max_application_returns: 1 }
              as: OfficiatingDirector
              captures: { sp_id: $.data.id }
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - call: "POST /advancement-applications"
              payload: { official_id: "${ref_id}", target_tier: "TIER_1" }
              as: Official
              as_user_id: "${ref_id}"
              captures: { app_id: $.data.id }
            - call: "POST /advancement-applications/${app_id}/screen"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
            - call: "POST /advancement-applications/${app_id}/field-evaluations"
              payload: { mechanics_score: 80.00, rules_score: 76.00, presence_score: 70.00 }
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { fe1_composite: $.data.composite_score }
            - call: "POST /advancement-applications/${app_id}/field-evaluations"
              payload: { mechanics_score: 84.00, rules_score: 80.00, presence_score: 80.00 }
              as: FieldEvaluator
              as_user_id: "eval-2"
              captures: { fe2_composite: $.data.composite_score }
            - call: "POST /advancement-applications/${app_id}/submit-to-committee"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { avg_after_two: $.data.evaluation_average }
            - call: "POST /advancement-applications/${app_id}/return-for-tape"
              payload: { note: "need two more quarters of tape" }
              as: OfficiatingDirector
              captures: { rc_after_first_return: $.data.return_count, status_after_first_return: $.data.status }
            - call: "POST /advancement-applications/${app_id}/field-evaluations"
              payload: { mechanics_score: 84.00, rules_score: 80.00, presence_score: 80.00 }
              as: FieldEvaluator
              as_user_id: "eval-3"
            - call: "POST /advancement-applications/${app_id}/submit-to-committee"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { status_after_resubmit: $.data.status, avg_after_three: $.data.evaluation_average }
          trigger:
            - call: "POST /advancement-applications/${app_id}/return-for-tape"
              payload: { note: "tape still inconclusive" }
              as: OfficiatingDirector
              captures: { status_final: $.data.status, rc_final: $.data.return_count }
          assert:
            - "${fe1_composite} == 76.10 and ${fe2_composite} == 81.60 and ${avg_after_two} == 78.85"
            - "${status_after_first_return} == RETURNED_FOR_TAPE and ${rc_after_first_return} == 1"
            - "${status_after_resubmit} == COMMITTEE_REVIEW — the loop closed back on the same state after the third report"
            - "${avg_after_three} == 79.77 — (76.10 + 81.60 + 81.60) / 3 rounded half-up"
            - "${status_final} == DENIED and ${rc_final} == 1 — the capped return terminates the loop instead of incrementing return_count to 2 or returning an error"
            - "Official.${ref_id}.tier == TIER_2 — a denial never advances the tier"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: overturned_appeal_restores_accuracy_clears_discipline_and_reinstates_official
        grounds:
          - state_machines.GradeAppeal.UNDER_REVIEW_to_OVERTURNED
          - state_machines.PlayGrade.appeal_state_APPEAL_PENDING_to_APPEAL_RESOLVED
          - state_machines.DisciplineAction.OPENED_to_CLEARED
          - state_machines.Official.PROBATION_to_ACTIVE
          - calculations.play_error_points
          - calculations.accuracy_index
          - calculations.postseason_eligibility
        distinguishing_aspect: |
          Depth-5 chain from one appeal decision: appeal->OVERTURNED (1) forces
          PlayGrade.grade_code CORRECT with error_points 0.00 (2), which forces the
          season record's weighted_error_points 1.20 -> 0.00 and accuracy_index
          92.00 -> 100.00 (3), which flips accuracy_eligible false -> true and
          therefore clears the PERFORMANCE discipline action (4), which restores
          Official.status PROBATION -> ACTIVE and postseason_eligible -> true (5);
          every hop is caused by the previous hop, not by the decide call.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1; accuracy_eligibility_threshold 95.00 and min_graded_plays_for_eligibility 3 are defaulted."
            - "Rita Vance is a preseason_cleared REFEREE (POSITION_FACTOR 1.20) whose assignment on Game G1 is COMPLETED; G1 is PLAYED."
            - "Three grades on Rita are POSTED at clock 2026-09-13T21:30:00Z: CORRECT/LOW (0.00), CORRECT/LOW (0.00) and INCORRECT_CALL/MEDIUM (1.20), giving weighted_error_points 1.20 over 3 plays and accuracy_index 92.00 with accuracy_eligible false."
            - "A PERFORMANCE / WARNING discipline action is OPENED against Rita, so Official.status == PROBATION and postseason_eligible == false."
            - "Rita has appealed the INCORRECT_CALL grade and supervisor sup-review-2 has taken the appeal UNDER_REVIEW."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_game_g1
            - *c_assign_ref_g1
            - *c_confirm_ref_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", play_ref: "Q1-P05", call_category: "FALSE_START", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_r1: $.data.id }
            - call: "POST /play-grades/${pg_r1}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", play_ref: "Q2-P18", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_r2: $.data.id }
            - call: "POST /play-grades/${pg_r2}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", play_ref: "Q3-P31", call_category: "PASS_INTERFERENCE", grade_code: "INCORRECT_CALL", impact: "MEDIUM" }
              as: GradingSupervisor
