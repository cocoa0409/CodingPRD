  # ===========================================================================
  # Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: get_anticipatory_ledger_computed_read_recomputes
        claim_type: Computed read
        grounds:
          - endpoints["GET /pharmacy-compounding/anticipatory-ledgers/{alid}"]
          - entities.AnticipatoryLimitLedger.fields.window_start_utc
        distinguishing_aspect: "GET /anticipatory-ledgers/{alid} recomputes window_start_utc/consumed_units/remaining_units against the current facility clock at read time."
        test_recipe:
          setup:
            - "An MFR exists (its ledger auto-created at MFR creation); no releases yet."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 200, anticipatory_window_days: 30 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "GET /pharmacy-compounding/anticipatory-ledgers?master_formulation_record_id=${mfr_id}"
              payload: {}
              as: CompoundingPharmacist
              captures: { ledger_id: "$.data[0].id" }
          trigger:
            - call: "GET /pharmacy-compounding/anticipatory-ledgers/${ledger_id}"
              payload: {}
              as: CompoundingPharmacist
              captures: { consumed: $.data.consumed_units, remaining: $.data.remaining_units }
          assert:
            - "AnticipatoryLimitLedger.${ledger_id}.consumed_units == 0"
            - "AnticipatoryLimitLedger.${ledger_id}.remaining_units == 200"

