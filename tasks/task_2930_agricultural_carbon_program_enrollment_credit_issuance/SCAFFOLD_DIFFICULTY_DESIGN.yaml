              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
          assert:
            - "first call: HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION (NOT ERR_SEGREGATION_OF_DUTIES, even though the acting admin also screened the enrollment)"
            - "second call: HTTP 409 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "third call: HTTP 200 and Baseline.${b8b_id}.status == APPROVED"
            - "after the two rejected calls and before the third: Baseline.${b8a_id}.status is STILL SUPERSEDED and Baseline.${b8b_id}.status is STILL PROPOSED and Enrollment.${e8_id}.status is STILL ACCEPTED (rejected calls have no side effects)"
            - "after the third call: Enrollment.${e8_id}.status == ACTIVE, Enrollment.${e8_id}.baseline_approval_admin_id == admin-baseline-01, Field.${f8_id}.status == ENROLLED"
            - "Enrollment.${e8_id}.version incremented exactly once across the three calls (only the successful one wrote)"

  - rule_id: boundary_precision_check
    instances:
      - name: additionality_ceiling_inclusive_at_20_00_and_rejected_at_20_10
        grounds:
          - calculations.additionality_screening
          - validations[priority 14 ERR_ADDITIONALITY_FAILED]
          - entities.PracticeStandard.fields.max_prior_adoption_pct
        distinguishing_aspect: |
          max_prior_adoption_pct 20.00 is an INCLUSIVE ceiling and prior_adoption_pct is rounded
          to 2 decimals BEFORE the comparison. Two fields differ by 5.00 evidence-weighted acres
          out of 5000 - exactly 20.00 pct versus 20.10 pct - so the first must be admitted with
          additionality_score 80.00 and the second must be refused with ERR_ADDITIONALITY_FAILED.
          An implementation using a strict `<` or comparing unrounded ratios flips one of them.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1 with max_prior_adoption_pct 20.00, lookback 5, min_documented_years 4, telemetry_required true."
            - "Grower G7 ACTIVE with two non-overlapping 1000.00-acre LOAM fields: F9 (0,0)-(2000,2000) and F10 (2000,0)-(4000,2000), both MAPPED."
