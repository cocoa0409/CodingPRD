              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it: $.data.id }
            - call: "POST /policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph}"
            - call: "POST /policies/${pol}/claims"
              payload: { scheduled_item_id: "${it}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1000000 }
              as: ClaimsAdjuster
              captures: { cl: $.data.id }
            - call: "POST /policies/${pol}/claims/${cl}/start_review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /policies/${pol}/cancel"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_OPEN_CLAIM_BLOCKS_CANCEL"
            - "response status == 409"

      - name: total_loss_settle_removes_item_bubbles_premium
        claim_type: Side Effect Execution
        grounds: [state_machines.Claim.APPROVED_to_SETTLED, state_machines.ScheduledItem.SUSPENDED_to_REMOVED, calculations.policy_annual_premium]
        distinguishing_aspect: "Settling an APPROVED TOTAL_LOSS claim removes the item (item_status REMOVED) and recomputes Policy total_insured_value_cents to exclude it (drops to 0 for a single-item policy)."
        test_recipe:
          setup: ["ACTIVE single-RING policy; an APPROVED TOTAL_LOSS claim (settlement 950,000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "s5@x.com", full_name: "S5", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it: $.data.id }
            - call: "POST /policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph}"
            - call: "POST /policies/${pol}/claims"
              payload: { scheduled_item_id: "${it}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1000000 }
              as: ClaimsAdjuster
              captures: { cl: $.data.id }
            - call: "POST /policies/${pol}/claims/${cl}/start_review"
              payload: {}
              as: ClaimsAdjuster
              captures: { cl_v: $.data.version }
            - call: "POST /policies/${pol}/claims/${cl}/approve"
              payload: { expected_claim_version: "${cl_v}" }
              as: ClaimsAdjuster
          trigger:
