              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop_id}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { line_id: $.data.id, qv1: $.data.version }
            - call: "DELETE /quote-lines/${line_id}"
              payload: {}
              as: ShopManager
              captures: { qv2: $.data.version }
          trigger:
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv2}" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_INCLUDED_LINES, HTTP 422"
            - "Quote.${q}.status remains DRAFT"

