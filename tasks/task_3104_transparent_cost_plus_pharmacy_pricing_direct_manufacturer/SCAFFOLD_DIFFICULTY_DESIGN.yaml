          assert:
            - "the filing with expiry exactly equal to L1's expiry returns 409 ERR_LICENSE_CONFLICT"
            - "PharmacyLicense.${l1_id}.status is still ACTIVE after that rejection"
            - "the filing with expiry one day later returns 201 and PharmacyLicense.${l3_id}.status == \"PENDING\""
