            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
          trigger:
            - *NOTICE1
          assert:
            - "HTTP 201"
            - "EnforcementNotice.${not1}.rung == WARNING"
            - "EnforcementNotice.${not1}.cumulative_points_at_issue == 3"
            - "Reseller.${res}.authorization_status == AUTHORIZED"

      - name: ladder_advances_at_most_one_rung_even_at_termination_points
        claim_type: constants_applied
        grounds: ["calculations.ladder_rung_selection"]
        distinguishing_aspect: "Cumulative 14 points is at or above termination_points_threshold 12, so points_rung is TERMINATION; but highest_issued is WARNING (ordinal 1), so max_next_rung caps the result at SUSPENSION (ordinal 2)."
        test_recipe:
          setup: ["Reseller Acme at 3 points behind one ISSUED WARNING notice; violation V2 DETECTED at 11 points."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
          trigger:
            - *NOTICE2SUSP
          assert:
            - "HTTP 201"
            - "EnforcementNotice.${not2}.rung == SUSPENSION"
            - "EnforcementNotice.${not2}.assessed_points == 11"
            - "EnforcementNotice.${not2}.cumulative_points_at_issue == 14"
            - "Reseller.${res}.authorization_status == SUSPENDED"
            - "GET /resellers/${res}/compliance-summary returns highest_issued_rung == 'SUSPENSION'"

      - name: ladder_reaches_termination_on_the_third_notice
        claim_type: correct_result
        grounds: ["calculations.ladder_rung_selection"]
        distinguishing_aspect: "Third notice: cumulative 19 points still says TERMINATION and highest_issued is now SUSPENSION, so max_next_rung is TERMINATION and the two bounds finally coincide."
        test_recipe:
          setup: ["Reseller Acme SUSPENDED at 14 points behind a WARNING and a SUSPENSION notice; violation V3 DETECTED at 5 points."]
          setup_api_calls:
