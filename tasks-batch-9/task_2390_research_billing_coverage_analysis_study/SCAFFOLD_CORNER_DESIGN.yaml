            - "trigger response 409 with error_id == \"ERR_NO_EFFECTIVE_ANALYSIS\""
            - "GET /research-billing/charges/${charge_id} still shows routing_state == \"UNROUTED\", billing_state == \"UNBILLED\", coverage_item_id == null, reviewed_by_user_id == null and version == 1"
            - "a sibling charge with service_date 2026-08-05 reviews successfully - the cutoff is the end of the service date, so equality passes"

      - name: charge_code_absent_from_the_effective_analysis_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHARGE_CODE_NOT_IN_COVERAGE_ANALYSIS]
