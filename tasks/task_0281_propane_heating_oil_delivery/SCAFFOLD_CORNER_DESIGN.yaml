        claim_type: derived_field_reconciliation
        grounds: [calculations.tank_reorder_projection, entities.Tank.fields.reorder_status, entities.Tank.fields.current_gallons]
        distinguishing_aspect: "A monitor reading that drops the level below threshold sets reorder_status to DUE; a later reading above threshold flips it back to OK."
        test_recipe:
          setup: ["Monitor tank cap 500 thr 30; clock fixed so HDD since reading is ~0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
