  - rule_id: cross_entity_state_dependency
    instances:
      - name: artist_activation_requires_establishment_permit_active
        grounds:
          - state_machines.Artist.PENDING_to_ACTIVE
          - validations[priority=23]
          - errors[ERR_ESTABLISHMENT_PERMIT_NOT_ACTIVE]
          - entities.Establishment.fields.permit_status
        distinguishing_aspect: |
          Entity pair Artist -> Establishment: the Artist PENDING -> ACTIVE transition is
          legal only while the parent Establishment.permit_status == ACTIVE, so the very
          same activate call fails at PENDING_PLAN_REVIEW and succeeds once the
          establishment reaches ACTIVE, with nothing about the artist itself changing.
        test_recipe:
          setup:
            - "One Establishment still in permit_status PENDING_PLAN_REVIEW (no plan review decided, no pre-opening inspection)."
            - "One Artist at that establishment in PENDING with unexpired bloodborne-pathogen training, so the only failing condition is the parent's permit status."
