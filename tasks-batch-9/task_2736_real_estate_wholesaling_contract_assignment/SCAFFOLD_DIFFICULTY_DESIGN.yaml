  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: contract_cancel_cascades_offer_agreement_buyer_tier
        grounds:
          - state_machines.PurchaseContract.SIGNED_to_CANCELLED
          - state_machines.AssignmentOffer.ACCEPTED_to_LAPSED
          - state_machines.AssignmentAgreement.PENDING_SETTLEMENT_to_TERMINATED_UPSTREAM
          - calculations.buyer_committed_capital
          - entities.CashBuyer.fields.buyer_tier
          - entities.EarnestMoneyDeposit.fields.refunded_to_wholesaler_cents
        distinguishing_aspect: |
          A depth-4 cascade triggered by the PurchaseContract SIGNED -> CANCELLED transition:
          level 2 lapses the ACCEPTED offer because the contract cancelled, level 3 terminates
          the PENDING_SETTLEMENT agreement because that offer lapsed, and level 4 recomputes
          the CashBuyer capital and buyer_tier because the agreement released the deposit —
          each hop caused by the previous hop, not by the cancel call itself.
