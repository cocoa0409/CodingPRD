  # ===========================================================================
  # Rule 5 — Validation priority conflicts (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_case_review_reviewer_is_director
        grounds:
          - validations.priority_5_state
          - validations.priority_6_business_safety
          - errors.ERR_INVALID_STATE
          - errors.ERR_MEDICAL_DIRECTION_CONFLICT
        distinguishing_aspect: |
          Pair (state, business_safety): when EmergencyEvent is in CASE_REVIEW
          already (so creating another review would be a state violation) AND
          the proposed reviewer is the Campus medical_director (segregation
          violation), the STATE error wins because priority 5 < priority 6.
        test_recipe:
          setup:
            - "Campus with medical_director_id=${md1}. One commissioned device; event OPEN→RESPONDING→RESOLVED→CASE_REVIEW (existing review)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M9", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
