          trigger:
            - call: "POST /orders/${o1}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:30:00Z", scheduled_end: "2026-04-01T11:30:00Z", expected_order_version: "${v_o1}" }
