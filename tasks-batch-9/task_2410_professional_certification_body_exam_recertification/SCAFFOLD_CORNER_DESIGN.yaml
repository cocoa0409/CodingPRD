        grounds:
          - calculations.scaled_score_equating
          - calculations.angoff_cut_score
          - entities.ExamForm.computed_fields.scored_item_count
          - state_machines.ExamRegistration.CHECKED_IN_to_COMPLETED
          - endpoints.POST_/exam-registrations/{id}/submit-responses
        distinguishing_aspect: |
          The transformation is piecewise-linear anchored on the cut, and the PASS decision is
          taken on the scaled score: on a four-item form whose adopted cut is 2, raw 1 maps
          through the LOWER segment to 200 + 1*300/2 = 350 and FAILS, while raw 2 sits exactly
          on the cut and maps through the UPPER segment to 500 + 0*300/2 = 500 and PASSES on the
          >= comparison. A single linear 0-800 map over the whole range would have produced 200
          and 400 and failed both candidates.
