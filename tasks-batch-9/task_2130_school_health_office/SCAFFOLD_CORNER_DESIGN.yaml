              captures: { epi_lot_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "ALBUTEROL", lot_number: "ALB-QRY-1", is_stock_protocol: true, initial_quantity: 36, expiration_date: "2027-06-30T00:00:00Z" }
