  # ===========================================================================
  - section: state_machines
    instances:
      - name: agency_onboarding_review_approve_applies_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.Agency.status.PENDING_REVIEW_to_ONBOARDED
          - endpoints[POST /neighborhood-safety/agencies/{id}/onboarding-review]
          - entities.Agency.fields.onboarding_agreement_version
          - entities.Agency.fields.reviewer_note
        distinguishing_aspect: "The APPROVE review applies all three declared side effects in one call: status becomes ONBOARDED, onboarding_agreement_version and reviewer_note are stored verbatim, and Agency.version increments from 1 to 2 — and only then does officer creation succeed."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; one agency exists in PENDING_REVIEW with version 1 and no officers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id", ag_v0: "$.data.version", ag_s0: "$.data.status" }
          trigger:
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file; CJIS attestation received.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_s1: "$.data.status", ag_v1: "$.data.version", ag_mou: "$.data.onboarding_agreement_version", ag_note: "$.data.reviewer_note" }
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_id: "$.data.id", off_role: "$.data.duty_role" }
          assert:
            - "${ag_s0} == PENDING_REVIEW and ${ag_v0} == 1"
            - "the onboarding-review response status code is 200"
            - "${ag_s1} == ONBOARDED"
            - "${ag_v1} == 2"
            - "${ag_mou} == MOU-2026.3"
            - "${ag_note} == MOU on file; CJIS attestation received."
            - "the officer creation returns 201"
            - "${off_role} == REQUESTER"
            - "Officer.${off_id}.requests_submitted_count == 0 and Officer.${off_id}.audits_completed_count == 0"

