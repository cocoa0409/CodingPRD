      - name: the_duty_toggle_is_one_endpoint_whose_payload_decides_whether_a_cascade_runs
        claim_type: conditional_action
        grounds:
          - endpoints[POST /mountain-ops/patrollers/{id}/duty]
          - state_machines.Patroller.AVAILABLE_to_OFF_DUTY
          - state_machines.Patroller.OFF_DUTY_to_AVAILABLE
          - entities.TerrainArea.fields.assigned_patroller_count
        distinguishing_aspect: |
          One endpoint, one boolean, two asymmetric outcomes: on_duty=false drops the assigned area from
          OPEN to PATROL_HOLD through the staffing floor, while on_duty=true restores the count WITHOUT
          reopening the area. An implementation that models the toggle as a symmetric recompute reopens the
          terrain on the way back and fails trigger 5. The capacity figures also prove the zero-acreage
          branch of the crowding rule: with no OPEN area, terrain_open_acres is 0.0, so density_factor
          reverts to 1.00 and guest_capacity climbs back to raw_ccc.
