            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT", "ULTRASOUND"], lab_scope: ["CBC", "CHEMISTRY", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/payer-contracts"
              payload: { payer_name: "Lone Star Health", network_status: "OUT_OF_NETWORK", qualifying_payment_amount_cents: 190000, in_network_coinsurance_rate: 0.20, in_network_deductible_remaining_cents: 50000, state_protection_regime: "FEDERAL_NSA_ONLY", effective_start_date: "2026-07-01", effective_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pc_id: $.data.id }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-2001", acuity_level: 3, presenting_service_line: "CARDIAC" }
