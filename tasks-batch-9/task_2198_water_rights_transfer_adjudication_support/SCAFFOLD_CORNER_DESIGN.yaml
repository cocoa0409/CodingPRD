      - name: sm_lease_completed_state_is_terminal_and_locked
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LeaseAssignment.terminal_states
          - errors[ERR_INVALID_STATE]
          - calculations.bank_credit_ledger
        distinguishing_aspect: >-
          COMPLETED admits no re-activation, resumption, cancellation or second
          completion — which matters because a successful cancel would return
          settlement credit and a second complete would double-debit
          deposited_credit_af; every attempt is ERR_INVALID_STATE and the ledger
          stands still.
        test_recipe:
          setup:
            - "The full-term lease walk taken to COMPLETED: bank-enrolled CERTIFIED right, AUTHORIZED headgate, 90.00 AF deposited, a 20.00 AF lease over 2026-04-01..2026-07-01 activated at the start instant and completed at the end instant (account: deposited 70.00 / available 70.00)."
