scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities
  # =========================================================================
  - section: entities
    instances:

      - name: applicant_creation_success_with_all_required_fields
        claim_type: creation
        grounds: [entities.Applicant]
        distinguishing_aspect: "POST /applicants with every input field returns 201 and the applicant with system fields (id, created_at, updated_at, version=1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Anna B", email: "anna@test.com", ssn_last4: "1010", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "response.data.full_name == 'Anna B'"
            - "response.data.version == 1"

      - name: applicant_missing_required_field_rejected
        claim_type: required_field_validation
        grounds: [entities.Applicant.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required `full_name` from POST /applicants → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { email: "missing@test.com", ssn_last4: "1111", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: loan_application_initial_state_draft
        claim_type: initial_state
        grounds: [entities.LoanApplication.fields.status, state_machines.LoanApplication.initial_state]
        distinguishing_aspect: "Newly created LoanApplication starts in status=DRAFT, prequal_decision=null, version=1."
        test_recipe:
          setup: ["Empty DB. One Applicant."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "B", email: "b1@test.com", ssn_last4: "2010", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 35000000, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 201"
            - "response.data.status == 'DRAFT'"
            - "response.data.prequal_decision == null"
            - "response.data.version == 1"

      - name: applicant_get_not_found
        claim_type: not_found
        grounds: [entities.Applicant, "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /applicants/{non-existent-uuid} → 404 ERR_APPLICATION_NOT_FOUND (path-resource missing)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /applicants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == 'ERR_APPLICATION_NOT_FOUND'"

      - name: loan_application_invalid_enum_loan_purpose
        claim_type: type_constraints
        grounds: [entities.LoanApplication.fields.loan_purpose, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "loan_purpose not in {PURCHASE, REFINANCE} → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB. One Applicant."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "C", email: "c1@test.com", ssn_last4: "3010", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "REMODEL", requested_loan_amount_cents: 30000000, property_value_cents: 35000000, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: loan_application_invalid_loan_term_months
        claim_type: type_constraints
        grounds: [entities.LoanApplication.fields.loan_term_months, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "loan_term_months not in {180, 360} → 400."
        test_recipe:
          setup: ["Empty DB. One Applicant."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "D", email: "d1@test.com", ssn_last4: "4010", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 35000000, loan_term_months: 240 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: applicant_not_found_when_creating_loan_application
        claim_type: parent_relationship
        grounds: [entities.LoanApplication.fields.applicant_id, "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "POST /loan-applications with non-existent applicant_id → 404 ERR_APPLICANT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB (no applicants)."]
          setup_api_calls: []
          trigger:
            - call: "POST /loan-applications"
              payload: { applicant_id: "00000000-0000-0000-0000-000000000000", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 35000000, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == 'ERR_APPLICANT_NOT_FOUND'"

      - name: applicant_list_with_pagination_meta
        claim_type: listing
        grounds: [entities.Applicant]
        distinguishing_aspect: "GET /applicants returns paginated list with total_count, has_more, limit, offset."
        test_recipe:
          setup: ["Empty DB. Three applicants created."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "L1", email: "l1@test.com", ssn_last4: "5010", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "L2", email: "l2@test.com", ssn_last4: "5011", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "L3", email: "l3@test.com", ssn_last4: "5012", annual_income_cents: 8000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "GET /applicants"
              payload: { limit: 2, offset: 0 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 200"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == true"
            - "response.meta.limit == 2"
            - "response.meta.offset == 0"

  # =========================================================================
  # Section 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: prequalify_from_already_prequalified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LoanApplication.DRAFT_to_PREQUALIFIED]
        distinguishing_aspect: "Second POST /prequalify on an already-PREQUALIFIED LoanApplication → 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication PREQUALIFIED."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "P", email: "p1@test.com", ssn_last4: "6010", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "LoanApplication.${app_id}.status == PREQUALIFIED"

      - name: close_from_terminal_closed_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LoanApplication.terminal_states]
        distinguishing_aspect: "POST /close on an already CLOSED LoanApplication → 409 ERR_INVALID_STATE."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / clear_to_close_requires_acknowledged_closing_disclosure_with_redisclose_false
          rationale: "Terminal-state lockdown is exercised by §1.8 cross-entity instance which observes the gate before terminal."

      - name: appraisal_complete_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Appraisal.ORDERED_to_COMPLETED]
        distinguishing_aspect: "POST /appraisals/{id}/complete on an Appraisal already in COMPLETED → 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication PREQUALIFIED. One COMPLETED Appraisal with value 31000000."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "P2", email: "p2@test.com", ssn_last4: "6020", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /appraisals"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/complete"
              payload: { appraised_value_cents: 31000000 }
              as: Appraiser
              as_user_id: "appr-001"
          trigger:
            - call: "POST /appraisals/${appr_id}/complete"
              payload: { appraised_value_cents: 32000000 }
              as: Appraiser
              as_user_id: "appr-001"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Appraisal.${appr_id}.status == COMPLETED"
            - "Appraisal.${appr_id}.appraised_value_cents == 31000000"

      - name: ratelock_supersede_when_new_lock_created
        claim_type: side_effect_execution
        grounds: [state_machines.RateLock.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Creating a new RateLock supersedes the prior ACTIVE lock — see §1.8 ratelock_create_supersede_preserves_active_lock_count."
        excluded_because:
          difficulty_instance: compensating_invariant / ratelock_create_supersede_preserves_active_lock_count
          rationale: "Supersede side-effect is asserted on three rate-lock IDs in the named §1.8 instance."

      - name: appraisal_reconsider_recomputes_ltv_ratio
        claim_type: side_effect_execution
        grounds: [state_machines.Appraisal.COMPLETED_to_RECONSIDERED, calculations.ltv_ratio]
        distinguishing_aspect: "RECONSIDER side-effect recomputes LoanApplication.ltv_ratio — covered by §1.8 cascade and invariant instances."
        excluded_because:
          difficulty_instance: transitive_cascade / appraisal_complete_ltv_denial_ratelock_cancel_depth3
          rationale: "LTV recompute is the bridge link in the cited cascade instance."

      - name: disclosure_acknowledge_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Disclosure.DRAFT_to_DELIVERED, state_machines.Disclosure.DELIVERED_to_ACKNOWLEDGED]
        distinguishing_aspect: "POST /disclosures/{id}/acknowledge on a Disclosure still in DRAFT → 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication PREQUALIFIED with ACTIVE RateLock + a DRAFT LOAN_ESTIMATE Disclosure."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "D2", email: "d2@test.com", ssn_last4: "7020", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v2: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "LOAN_ESTIMATE", expected_application_version: "${v2}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { le_id: $.data.id }
          trigger:
            - call: "POST /disclosures/${le_id}/acknowledge"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Disclosure.${le_id}.status == DRAFT"

      - name: title_search_cure_from_clear_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TitleSearch.EXCEPTIONS_FOUND_to_CURED]
        distinguishing_aspect: "POST /title-searches/{id}/cure on a TitleSearch in CLEAR → 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication PREQUALIFIED with one CLEAR TitleSearch."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "T2", email: "t2@test.com", ssn_last4: "8020", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /title-searches"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { ts_id: $.data.id }
            - call: "POST /title-searches/${ts_id}/mark-clear"
              payload: {}
              as: TitleAgent
              as_user_id: "ta-001"
          trigger:
            - call: "POST /title-searches/${ts_id}/cure"
              payload: {}
              as: TitleAgent
              as_user_id: "ta-001"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "TitleSearch.${ts_id}.status == CLEAR"

  # =========================================================================
  # Section 3 — Calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: ltv_provisional_recomputed_on_prequalify_with_stated_value
        claim_type: correct_result
        grounds: [calculations.ltv_ratio]
        distinguishing_aspect: "On prequalify, ltv_ratio = round(30000000 / 31578948, 4) = 0.95 (provisional variant)."
        test_recipe:
          setup: ["Empty DB. Applicant ($77,261.04 income) + LoanApplication DRAFT."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "L", email: "lt@test.com", ssn_last4: "9020", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 200"
            - "LoanApplication.${app_id}.ltv_ratio == 0.95"

      - name: extension_fee_30day_extension_yields_75000_cents
        claim_type: correct_result
        grounds: [calculations.rate_lock_extension_calc]
        distinguishing_aspect: "Single 30-day extension on principal 30000000 cents: fee = 30000000 * 25 / 10000 = 75000 cents (clean integer, no rounding)."
        test_recipe:
          setup: ["Empty DB. Clock 2026-06-01T00:00:00Z. Applicant + LoanApplication PREQUALIFIED. ACTIVE RateLock at 687 bps, 30-day term."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "E", email: "ext@test.com", ssn_last4: "9030", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
          trigger:
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 30 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 200"
            - "RateLock.${lock_id}.extension_count == 1"
            - "RateLock.${lock_id}.extension_fee_cents == 75000"

      - name: trid_timeline_uses_le_first_not_le_last
        claim_type: input_set_filtering
        grounds: [calculations.trid_timeline_calc]
        distinguishing_aspect: "When two LE Disclosures are delivered, earliest_consummation_at floor = LE_first.delivered_at + 7 days, NOT LE_last.delivered_at + 7 days."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / trid_max_merge_of_le_and_cd_floors_blocks_consummation
          rationale: "TRID timeline behavior is asserted via earliest_consummation_at literal in the named §1.8 instance."

      - name: dti_excludes_income_verification_values
        claim_type: input_set_filtering
        grounds: [calculations.dti_ratio]
        distinguishing_aspect: "DTI uses Applicant.annual_income_cents at prequalify; verified IncomeVerification values are NOT inputs to prequalify DTI."
        excluded_because:
          difficulty_instance: dual_variant_calc / dti_front_vs_back_end_diverge_on_loan_application
          rationale: "DTI computation is anchored on Applicant.annual_income_cents in the named §1.8 instance."

      - name: apr_provisional_independent_of_extension_fee
        claim_type: variant_selection
        grounds: [calculations.apr_calculation]
        distinguishing_aspect: "provisional variant ignores extension fees — covered by §1.8."
        excluded_because:
          difficulty_instance: dual_variant_calc / apr_provisional_vs_final_diverge_on_disclosure
          rationale: "Provisional vs final divergence asserted with literals."

      - name: cd_redisclose_first_cd_no_prior_returns_false
        claim_type: boundary_edge
        grounds: [calculations.cd_redisclose_check]
        distinguishing_aspect: "The very first CLOSING_DISCLOSURE delivered (no prior CD) → change_requires_redisclose == false regardless of APR."
        test_recipe:
          setup: ["Empty DB. Clock 2026-06-01. Applicant + LoanApplication PREQUALIFIED. ACTIVE RateLock at 625 bps. DELIVERED LE. Submit-for-review and approve flow not required to deliver CD per §1.2 Disclosure preconditions (UNDER_REVIEW or APPROVED). Submit-for-review."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "C", email: "cd@test.com", ssn_last4: "1110", annual_income_cents: 9000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
