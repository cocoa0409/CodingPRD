          - errors.ERR_CASH_LIMIT_REACHED
          - calculations.driver_cash_position
          - entities.Driver.fields.cash_on_hand_cents
          - entities.Driver.fields.cash_posture
          - entities.Store.fields.cash_limit_cents
          - endpoints.POST_driver_safe_drops
