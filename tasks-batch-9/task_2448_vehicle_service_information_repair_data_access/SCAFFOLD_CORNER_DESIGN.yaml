      - name: technician_revoke_from_unverified_returns_4XX_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Technician.SUSPENDED_to_REVOKED
          - validations[priority=30]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          REVOKED is reachable only from SUSPENDED, so revoke fired at an UNVERIFIED technician
          is refused with ERR_INVALID_STATE and the row stays UNVERIFIED — whereas the same call
          after a suspend succeeds, proving the guard is on the source state and not on the role.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Shop 'Bay Auto' exists with one UNVERIFIED technician"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
