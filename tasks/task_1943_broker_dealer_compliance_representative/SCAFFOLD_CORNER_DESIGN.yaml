  # ------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: envelope_shape_and_pagination
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Response envelope contract: success bodies carry meta.api_request_id/timestamp and response_type; list endpoints honor limit/offset with total_count and has_more."
        test_recipe:
          setup: ["One branch with two reps"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "PG Branch", region: "E" }
              as: FirmAdmin
              captures: { pg_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "940001", full_name: "PG One", branch_id: "${pg_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
            - call: "POST /representatives"
              payload: { crd_number: "940002", full_name: "PG Two", branch_id: "${pg_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
          trigger:
            - call: "GET /representatives?limit=1&offset=0"
              as: Any
              captures: { pg_page1: $.data }
            - call: "GET /representatives?limit=1&offset=1"
              as: Any
              captures: { pg_page2: $.data }
          assert:
            - "both responses include meta.api_request_id and response_type == \"array\""
            - "page 1: exactly 1 element, total_count == 2, has_more == true"
            - "page 2: exactly 1 element, has_more == false"

  # ------------------------------------------------------------------
  - section: errors
    instances:
      - name: finding_state_error_on_remediate_verified
        claim_type: violation_to_error
        grounds: ["errors[ERR_FINDING_INVALID_STATE]", state_machines.InspectionFinding]
        distinguishing_aspect: "remediate from terminal VERIFIED_CLOSED is rejected (complements adjudicate_open_finding_rejected so both finding-state errors are covered)."
        test_recipe:
          setup: ["Finding VERIFIED_CLOSED"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "FV Branch", region: "W" }
              as: FirmAdmin
              captures: { fv_br: $.data.id, fv_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${fv_br}", scheduled_date: "2026-08-10", expected_branch_version: "${fv_br_v}" }
              as: ComplianceAnalyst
              captures: { fv_i: $.data.id }
            - call: "POST /inspections/${fv_i}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${fv_i}", severity: "LOW", description: "x", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { fv_f: $.data.id }
            - call: "POST /findings/${fv_f}/remediate"
              payload: { remediation_note: "done" }
              as: ComplianceAnalyst
            - call: "POST /findings/${fv_f}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /findings/${fv_f}/remediate"
              payload: { remediation_note: "again" }
              as: ComplianceAnalyst
              captures: { fv_err: $.data.error_id }
          assert:
            - "fv_err == \"ERR_FINDING_INVALID_STATE\""

      - name: inspection_already_open_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INSPECTION_ALREADY_OPEN]"]
        distinguishing_aspect: "Aggregate uniqueness: scheduling a second inspection while the branch's first is still SCHEDULED is rejected — with the CURRENT branch version, so the constraint check (not OCC) fires."
        test_recipe:
          setup: ["Branch with one SCHEDULED inspection"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "AO Branch", region: "E" }
              as: FirmAdmin
              captures: { ao_br: $.data.id, ao_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${ao_br}", scheduled_date: "2026-09-15", expected_branch_version: "${ao_br_v}" }
              as: ComplianceAnalyst
              captures: { ao_i1: $.data.id }
            - call: "GET /branches/${ao_br}"
              as: Any
              captures: { ao_br_v2: $.data.version }
          trigger:
            - call: "POST /inspections"
              payload: { branch_id: "${ao_br}", scheduled_date: "2026-09-16", expected_branch_version: "${ao_br_v2}" }
              as: ComplianceAnalyst
              captures: { ao_err: $.data.error_id }
          assert:
            - "ao_err == \"ERR_INSPECTION_ALREADY_OPEN\""

      - name: terminate_terminated_rep_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.RegisteredRepresentative]
        distinguishing_aspect: "Terminal lockdown on the rep: terminate from TERMINATED hits the generic invalid-state error."
        test_recipe:
          setup: ["Rep already TERMINATED"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "TT Branch", region: "W" }
              as: FirmAdmin
              captures: { tt_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "980001", full_name: "TT Rep", branch_id: "${tt_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { tt_rep: $.data.id }
            - call: "POST /representatives/${tt_rep}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /representatives/${tt_rep}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { tt_err: $.data.error_id }
          assert:
            - "tt_err == \"ERR_INVALID_STATE\""

  # ------------------------------------------------------------------
  - section: rbac
    instances:
      - name: missing_user_context_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "Priority-1 auth: a request without X-User-ID/X-User-Role is rejected before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /branches"
              payload: { name: "NoAuth", region: "E" }
              as: NONE
              captures: { na_err: $.data.error_id }
          assert:
            - "na_err == \"ERR_MISSING_USER_CONTEXT\" (test harness sends no X-User-* headers for this call)"

      - name: role_forbidden_for_finding_create
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "Peer-role denial: RegisteredRep (entity-backed) cannot perform the analyst's finding-creation operation."
        test_recipe:
          setup: ["Branch, rep, IN_PROGRESS inspection"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "RB Branch", region: "N" }
              as: FirmAdmin
              captures: { rb_br: $.data.id, rb_br_v: $.data.version }
            - call: "POST /representatives"
              payload: { crd_number: "950001", full_name: "RB Rep", branch_id: "${rb_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { rb_rep: $.data.id }
            - call: "POST /inspections"
              payload: { branch_id: "${rb_br}", scheduled_date: "2026-08-10", expected_branch_version: "${rb_br_v}" }
              as: ComplianceAnalyst
              captures: { rb_i: $.data.id }
            - call: "POST /inspections/${rb_i}/start"
              as: ComplianceAnalyst
          trigger:
            - call: "POST /findings"
              payload: { inspection_id: "${rb_i}", severity: "LOW", description: "rep attempt", due_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${rb_rep}"
              captures: { rb_err: $.data.error_id }
          assert:
            - "rb_err == \"ERR_FORBIDDEN_ROLE\""

      - name: attest_wrong_rep_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_ATTESTATION_OWNER]", roles]
        distinguishing_aspect: "Entity-backed ownership: a different rep's attestation cannot be signed; the owning rep can."
        test_recipe:
          setup: ["Two reps, meeting HELD, both attestations PENDING"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "AW Branch", region: "S" }
              as: FirmAdmin
              captures: { aw_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "950002", full_name: "AW One", branch_id: "${aw_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { aw_r1: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "950003", full_name: "AW Two", branch_id: "${aw_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { aw_r2: $.data.id }
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-08-01" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { aw_mt: $.data.id }
            - call: "POST /meetings/${aw_mt}/hold"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /attestations?meeting_id=${aw_mt}"
              as: Any
              captures: { aw_a1: "$.data[0].id" }
          trigger:
            - call: "POST /attestations/${aw_a1}/attest"
              as: RegisteredRep
              as_user_id: "${aw_r2}"
              captures: { aw_err: $.data.error_id }
            - call: "POST /attestations/${aw_a1}/attest"
              as: RegisteredRep
              as_user_id: "${aw_r1}"
              captures: { aw_ok: $.data.status }
          assert:
            - "aw_err == \"ERR_NOT_ATTESTATION_OWNER\""
            - "aw_ok == \"ATTESTED\""

      - name: wsp_publish_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOD_WSP_PUBLISHER]", state_machines.WSPDocument.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "Cross-role segregation of duties on opaque ids: the publish call carrying the same operator id that drafted the document is rejected; a different operator publishes."
        test_recipe:
          setup: ["WSP drafted by analyst-7"]
          setup_api_calls:
            - call: "POST /wsp-documents"
              payload: { policy_area: "BOOKS_RECORDS", title: "Records WSP", effective_date: "2026-08-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-7"
              captures: { sod_d: $.data.id }
          trigger:
            - call: "POST /wsp-documents/${sod_d}/publish"
              as: CompliancePrincipal
              as_user_id: "analyst-7"
              captures: { sod_err: $.data.error_id }
            - call: "POST /wsp-documents/${sod_d}/publish"
              as: CompliancePrincipal
              as_user_id: "principal-9"
              captures: { sod_ok: $.data.status }
          assert:
            - "sod_err == \"ERR_SOD_WSP_PUBLISHER\""
            - "sod_ok == \"PUBLISHED\" and WSPDocument.${sod_d}.published_by == \"principal-9\""

  # ------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: exam_fulfill_late_marks_flag
        claim_type: scheduled_actions
        grounds: [state_machines.ExamDocumentRequest, entities.ExamDocumentRequest.fields.is_late]
        distinguishing_aspect: "Deadline-driven sweep + late fulfillment: the request due 2026-08-03 is swept to OVERDUE at 2026-08-05 and its later fulfillment is flagged is_late; the one due 2026-08-10 fulfilled the same day is not."
        test_recipe:
          setup: ["Two OPEN exam requests, due 2026-08-03 and 2026-08-10"]
          setup_api_calls:
            - call: "POST /exam-requests"
              payload: { regulator: "FINRA", request_ref: "R-1", document_type: "TRADE_BLOTTER", due_date: "2026-08-03" }
              as: ComplianceAnalyst
              captures: { ex_a: $.data.id }
            - call: "POST /exam-requests"
              payload: { regulator: "SEC", request_ref: "R-2", document_type: "WSP_COPY", due_date: "2026-08-10" }
              as: ComplianceAnalyst
              captures: { ex_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "GET /exam-requests/${ex_a}"
              as: Any
              captures: { ex_a_status: $.data.status }
            - call: "POST /exam-requests/${ex_a}/fulfill"
              payload: { produced_document_ref: "worm://store/r1" }
              as: ComplianceAnalyst
              captures: { ex_a_late: $.data.is_late }
            - call: "POST /exam-requests/${ex_b}/fulfill"
              payload: { produced_document_ref: "worm://store/r2" }
              as: ComplianceAnalyst
              captures: { ex_b_late: $.data.is_late }
          assert:
            - "ex_a_status == \"OVERDUE\" (sweep: 2026-08-03 < 2026-08-05)"
            - "ex_a_late == true and ex_b_late == false"

      - name: double_fulfill_exam_rejected
        claim_type: idempotency
        grounds: [state_machines.ExamDocumentRequest, "errors[ERR_EXAM_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "Terminal-state idempotency: a second fulfill on a FULFILLED request is rejected."
        test_recipe:
          setup: ["One FULFILLED exam request"]
          setup_api_calls:
            - call: "POST /exam-requests"
              payload: { regulator: "STATE", request_ref: "R-9", document_type: "COMPLAINT_FILE", due_date: "2026-08-10" }
              as: ComplianceAnalyst
              captures: { df_e: $.data.id }
            - call: "POST /exam-requests/${df_e}/fulfill"
              payload: { produced_document_ref: "worm://store/r9" }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /exam-requests/${df_e}/fulfill"
              payload: { produced_document_ref: "worm://store/r9b" }
              as: ComplianceAnalyst
              captures: { df_err: $.data.error_id }
          assert:
            - "df_err == \"ERR_EXAM_REQUEST_INVALID_STATE\""

      - name: cascade_rep_terminate_withdraws_activities
        claim_type: cascading_side_effects
        grounds: [state_machines.RegisteredRepresentative.ACTIVE_to_TERMINATED, state_machines.OutsideActivityRequest.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "Conditional cascade on termination: the SUBMITTED request is withdrawn while the APPROVED one is left as historical record (count stays 1)."
        test_recipe:
          setup: ["Rep with one SUBMITTED and one APPROVED request"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "TC Branch", region: "E" }
              as: FirmAdmin
              captures: { tc_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "960001", full_name: "TC Rep", branch_id: "${tc_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { tc_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "pending one", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${tc_rep}"
              captures: { tc_a1: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "approved one", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${tc_rep}"
              captures: { tc_a2: $.data.id }
            - call: "POST /outside-activities/${tc_a2}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /representatives/${tc_rep}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /outside-activities/${tc_a1}"
              as: Any
              captures: { tc_a1_status: $.data.status }
            - call: "GET /outside-activities/${tc_a2}"
              as: Any
              captures: { tc_a2_status: $.data.status }
            - call: "GET /representatives/${tc_rep}"
              as: Any
              captures: { tc_count: $.data.active_approved_activity_count }
          assert:
            - "tc_a1_status == \"WITHDRAWN\" (conditional cascade hit the non-terminal request)"
            - "tc_a2_status == \"APPROVED\" (terminal-approved requests are not cascaded)"
            - "tc_count == 1"

      - name: resolve_complaint_creates_award_disclosure
        claim_type: cascading_side_effects
        grounds: [state_machines.CustomerComplaint.RECEIVED_to_RESOLVED, calculations.complaint_award_disclosure_trigger]
        distinguishing_aspect: "Cross-entity create cascade at the exact threshold: resolving with damages_paid_cents == 1500000 (>= boundary) auto-creates a DRAFT CUSTOMER_AWARD disclosure linked back via source_complaint_id."
        test_recipe:
          setup: ["Complaint claiming 2000000"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "AWD Branch", region: "W" }
              as: FirmAdmin
              captures: { awd_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "960002", full_name: "AWD Rep", branch_id: "${awd_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { awd_rep: $.data.id }
            - call: "POST /complaints"
              payload: { rep_id: "${awd_rep}", allegation_type: "MISREPRESENTATION", damages_claimed_cents: "2000000", received_date: "2026-07-15" }
              as: ComplianceAnalyst
              captures: { awd_c: $.data.id }
          trigger:
            - call: "POST /complaints/${awd_c}/resolve"
              payload: { damages_paid_cents: "1500000", legal_cost_cents: "0" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { awd_final: $.data.final_reserve_cents }
            - call: "GET /disclosure-events?rep_id=${awd_rep}"
              as: Any
              captures: { awd_ds: $.data }
          assert:
            - "awd_final == 1500000 (min(1500000 + 0, round(1.25 * 2000000)))"
            - "awd_ds is a single-element list: [0].event_type == \"CUSTOMER_AWARD\", [0].status == \"DRAFT\", [0].source_complaint_id == ${awd_c}"

      - name: review_deadline_sweep_and_late_review
        claim_type: scheduled_actions
        grounds: [calculations.correspondence_review_deadline, state_machines.CorrespondenceItem.PENDING_REVIEW_to_OVERDUE]
        distinguishing_aspect: "Datetime-precision sweep: an item captured at 2026-08-01T00:00:00Z has review_deadline 2026-08-31T00:00:00Z; one second later it is OVERDUE, and a late review from OVERDUE still succeeds."
        test_recipe:
          setup: ["One item captured at the default clock"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "RD Branch", region: "N" }
              as: FirmAdmin
              captures: { rd_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "960003", full_name: "RD Rep", branch_id: "${rd_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { rd_rep: $.data.id }
            - call: "POST /correspondence-items"
              payload: { rep_id: "${rd_rep}", channel: "EMAIL", subject: "newsletter", lexicon_hits: 0 }
              as: ComplianceAnalyst
              captures: { rd_ci: $.data.id, rd_due: $.data.review_deadline }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: FirmAdmin
            - call: "GET /correspondence-items/${rd_ci}"
              as: Any
              captures: { rd_status: $.data.status }
            - call: "POST /correspondence-items/${rd_ci}/review"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { rd_final: $.data.final_risk_score }
          assert:
            - "rd_due == \"2026-08-31T00:00:00Z\" (captured_at + 30 days exactly)"
            - "rd_status == \"OVERDUE\" (deadline strictly before clock)"
            - "review from OVERDUE succeeds; rd_final == 5 (0 hits + EMAIL weight, no clamp on APPROVE)"

  # ------------------------------------------------------------------
  - section: consistency
    instances:
      - name: immediate_cascade_visibility
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.DisclosureEvent.FILED_to_ACKNOWLEDGED]
        distinguishing_aspect: "Immediate consistency: the acknowledge response and the very next GETs expose the fully-applied cascade (rep flags, branch cycle) — no read lag."
        test_recipe:
          setup: ["Rep with FILED SD disclosure"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "IC Branch", region: "S" }
              as: FirmAdmin
              captures: { ic_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "970001", full_name: "IC Rep", branch_id: "${ic_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { ic_rep: $.data.id }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${ic_rep}", event_type: "REGULATORY_BAR", event_date: "2026-08-01" }
              as: ComplianceAnalyst
              captures: { ic_d: $.data.id }
            - call: "POST /disclosure-events/${ic_d}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /disclosure-events/${ic_d}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { ic_ack_status: $.data.status }
            - call: "GET /representatives/${ic_rep}"
              as: Any
              captures: { ic_tier: $.data.supervision_tier }
            - call: "GET /branches/${ic_br}"
              as: Any
              captures: { ic_cycle: $.data.inspection_cycle_months }
          assert:
            - "ic_ack_status == \"ACKNOWLEDGED\""
            - "ic_tier == \"HEIGHTENED\" and ic_cycle == 6 (cascade visible on the immediately-following reads)"
