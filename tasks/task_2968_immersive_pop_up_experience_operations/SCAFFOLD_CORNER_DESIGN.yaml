      - name: close_decision_cascade_into_kit_decay_and_relocalisation
        claim_type: transitive_cascade
        grounds:
          - state_machines[ExperienceRun].transitions[CLOSING -> CLOSED]
          - calculations.kit_condition_decay
          - state_machines[BuildKit].transitions[DEPLOYED -> REFURB_REQUIRED]
        excluded_because:
          difficulty_instance: close_decision_cascades_into_kit_decay_refurb_and_relocalisation
          rationale: |
            The §1.8 instance already walks the whole four-hop chain — CLOSE releasing the roster and
            closing out the slots, kit_condition_decay writing the new condition_score, the
            REFURB_REQUIRED branch, refurbish, and the relocalisation discount on the next city —
            with the exact decayed figures asserted at each hop. A §1.9 duplicate would restate the
            same call sequence with the same numbers and add no independent claim.

      - name: agreement_expiry_cascade_into_run_clearance
        claim_type: cross_entity
        grounds:
          - state_machines[LicenseAgreement].transitions[ACTIVE -> EXPIRED]
          - state_machines[ExperienceRun].transitions[CLEARED -> UNCLEARED]
        excluded_because:
          difficulty_instance: agreement_expiry_cascades_through_open_submissions_into_run_clearance
          rationale: |
            §1.8 already drives expiry through the open submissions and out into the run's clearance
            dimension, including the counters on the agreement. The corner-coverage duty for this
            transition is discharged by the terminal_state_lockdown instance above, which pins what
            an EXPIRED agreement still refuses and still permits.

      - name: failed_inspection_cascade_into_the_refund_ladder
        claim_type: compensation
        grounds:
          - state_machines[TicketOrder].transitions[CONFIRMED -> REFUND_DUE]
          - calculations.refund_and_credit_settlement
        excluded_because:
          difficulty_instance: failed_accessibility_inspection_cascade_overrides_the_refund_ladder
          rationale: |
            The operator-fault cascade and its 100 percent refund override are the whole subject of
            that §1.8 instance, which asserts the four hops and the money split. The §1.9 compensation
            duty is met by the PENDING-cancel instance above, which covers the branch §1.8 never
            exercises: a cancel that must NOT run the refund ladder at all.

      - name: submission_revision_loop_and_supersede_branch
        claim_type: cyclic
        grounds:
          - state_machines[CreativeSubmission].transitions[CHANGES_REQUESTED -> SUBMITTED]
          - state_machines[CreativeSubmission].transitions[IN_REVIEW -> SUPERSEDED]
        excluded_because:
          difficulty_instance: submission_revision_loop_then_supersede_branch
          rationale: |
            §1.8 walks the revision loop to the REVISION_ROUND_CAP boundary and then takes the
            supersede branch on the same asset_code, asserting the agreement counters on every lap.
            The §1.9 cyclic duty is discharged by the permit-conditions loop, a different machine
            whose round counter and note-clearing behaviour §1.8 never touches.

  # =========================================================================
  # SECTION 3 -- CALCULATIONS
  # §1.4 declares 14 formulas. The instances below pin the ones whose
  # arithmetic §1.8 does not already own: the pricing matrix and its rounding
  # and clamp obligations, the capacity nested min, the readiness weighting,
  # the inspection branch table, the demand-index input sets and the
  # recompute-provisional reconciliation.
  # =========================================================================
  - section: calculations
    instances:
      - name: price_quote_walks_the_tier_matrix_across_the_three_lead_bands
        claim_type: correct_result
        grounds:
          - calculations.slot_dynamic_price
          - endpoints[GET /timed-entry-slots/{slotId}/price-quote]
        distinguishing_aspect: |
          Twelve cells of the pricing matrix — four pricing_tier values crossed with the three lead
          bands — read through the side-effect-free quote endpoint, so the whole formula is
          observable without creating a single order. The quote must also report the lead_days it
          used, which is the only way to distinguish a wrong multiplier from a wrong lead
          computation when a cell disagrees.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation (base_ticket_price_cents 35833) with one 40/15 room and four DRAFT slots on 2026-09-05T14:00:00Z, one per pricing tier."
