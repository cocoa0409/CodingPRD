              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/r" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 40000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/invoices/${inv}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/submit"
              payload: {}
