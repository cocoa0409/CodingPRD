            - "the incident's version is not bumped by the refused request"

      - name: incident_withdraw_is_refused_once_the_incident_is_decided
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SafetyIncident.transitions.WITHDRAWN_to_WITHDRAWN
          - state_machines.SafetyIncident.transitions.DECIDED_to_DECIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN and DECIDED are both sealed against further edits: a second withdraw is refused, and a hold cannot be placed on an incident that has already been decided."
        test_recipe:
          setup:
