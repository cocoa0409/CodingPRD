              as: ShopAdmin
              captures: { created: $.data.created_at }
          assert:
            - "Customer.created_at == 2026-05-01T00:00:00.000Z (fixed startup default, not wall clock)"

      - name: receipt_cascade_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.ComponentOrder.BACKORDERED_to_ALLOCATED]
        excluded_because:
          difficulty_instance: "transitive_cascade / stock_receipt_cascades_order_to_spec"
          rationale: "the receive -> item -> order -> spec chain is asserted hop-by-hop there."
      - name: release_cascade_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.RepairTicket.IN_PROGRESS_to_CANCELLED]
        excluded_because:
          difficulty_instance: "transitive_cascade / ticket_cancel_shaft_release_cascades_to_spec"
          rationale: "the cancel -> item -> order -> spec chain is asserted hop-by-hop there."

