          difficulty_instance: resource_temporal_overlap / sep_filing_window_closed_inclusive_boundary
          rationale: "ERR_SEP_WINDOW_CLOSED asserted as the failure path of the named §1.8 SEP-window instance."

      - name: error_sep_not_approved_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEP_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / application_submit_requires_approved_sep
          rationale: "ERR_SEP_NOT_APPROVED asserted as the failure path of the named §1.8 cross-entity instance."

  # ───────────────────────── RBAC ─────────────────────────
  - section: rbac
    instances:
      - name: applicant_cannot_run_determination
        claim_type: exclusive_op_denied
        grounds: ["roles", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /applications/{id}/determine is a MarketplaceAdmin exclusive op; an Applicant calling it gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A SUBMITTED application exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-28"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Rbac P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-28"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-28"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-28"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "c-28"
          trigger:
            - call: "POST /applications/${app_id}/determine"
              as: Applicant
              as_user_id: "c-28"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response.data.error_id == 'ERR_FORBIDDEN'"

      - name: applicant_cannot_act_on_other_household
        claim_type: peer_resource_denied
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "An Applicant (owner c-30) cannot add a member to a household owned by c-29; the non-owner gets ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Household owned by applicant c-29."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-29"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Intruder", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 100 }
              as: Applicant
              as_user_id: "c-30"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response.data.error_id == 'ERR_NOT_RESOURCE_OWNER'"

      - name: missing_auth_headers_unauthenticated
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-4000-8000-000000000000"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "response.data.error_id == 'ERR_UNAUTHENTICATED'"

      - name: navigator_bypasses_ownership_can_add_member
        claim_type: shared_op_allowed
        grounds: ["roles"]
        distinguishing_aspect: "A Navigator may add a member to a household owned by an Applicant (bypasses the ownership check); returns 201."
        test_recipe:
          setup: ["Household owned by applicant c-31."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-31"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Nav Added", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 100000 }
              as: Navigator
              as_user_id: "nav-1"
              captures: { mem_id: $.data.id }
          assert:
            - "response status == 201"
            - "Household.${hh_id}.countable_size == 1"

  # ───────────────────────── Cross-Cutting Complexity Layers ─────────────────────────
  - section: cross_cutting_complexity_layers
    instances:
      - name: enrollment_create_stale_household_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-create-stale-household]", "errors[ERR_STALE_VERSION]", "entities.Household.fields.version"]
        distinguishing_aspect: "Creating an enrollment carrying a stale expected_household_version (the version observed before a member edit bumped Household.version) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Determined household; the applicant captured Household.version, then a member edit advanced it; the enrollment create still carries the pre-edit version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-32"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Occ P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-32"
              captures: { mem_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-32"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-32"
              captures: { hh_v_submit: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v_submit}" }
              as: Applicant
              as_user_id: "c-32"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-32"
              captures: { hh_v_stale: $.data.version }
            - call: "PATCH /households/${hh_id}/members/${mem_id}"
              payload: { annual_income_cents: 3100000 }
              as: Applicant
              as_user_id: "c-32"
          trigger:
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 0, expected_household_version: "${hh_v_stale}" }
              as: Applicant
              as_user_id: "c-32"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response.data.error_id == 'ERR_STALE_VERSION'"

      - name: submit_stale_household_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-submit-stale-household]", "errors[ERR_STALE_VERSION]", "entities.Household.fields.version"]
        distinguishing_aspect: "Submitting an application carrying a stale expected_household_version (a member edit advanced Household.version after the version was observed) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["DRAFT application; applicant observed Household.version, then edited a member (advancing version); the submit still carries the pre-edit version."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-33"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Submit Occ", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-33"
              captures: { mem_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-33"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-33"
              captures: { hh_v_stale: $.data.version }
            - call: "PATCH /households/${hh_id}/members/${mem_id}"
              payload: { annual_income_cents: 3100000 }
              as: Applicant
              as_user_id: "c-33"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v_stale}" }
              as: Applicant
              as_user_id: "c-33"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response.data.error_id == 'ERR_STALE_VERSION'"

      - name: household_version_increments_on_member_add
        claim_type: derived_field_reconciliation
        grounds: ["entities.Household.fields.version", "entities.Household.fields.household_magi_cents", "calculations.household_magi"]
        distinguishing_aspect: "Adding a member to a household bumps Household.version by exactly 1 and recomputes household_magi_cents to the new sum; derived field stays consistent with source after the write."
        test_recipe:
          setup: ["Household with version 1 and no members."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-34"
              captures: { hh_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Recon P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 1234500 }
              as: Applicant
              as_user_id: "c-34"
          assert:
            - "Household.${hh_id}.version == ${v0} + 1"
            - "Household.${hh_id}.household_magi_cents == 1234500"

  # ───────────────────────── Consistency Model ─────────────────────────
  - section: consistency_model
    instances:
      - name: magi_recompute_visible_in_same_response
        claim_type: immediate
        grounds: ["entities.Household.fields.household_magi_cents", "calculations.household_magi"]
        distinguishing_aspect: "The household_magi_cents recompute is visible immediately: the POST member response's parent state and an immediate GET /households/{id} both show household_magi_cents 2000000 with no lag."
        test_recipe:
          setup: ["Household with one PRIMARY member income 2000000."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-35"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Imm P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 2000000 }
              as: Applicant
              as_user_id: "c-35"
          trigger:
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-35"
              captures: { magi: $.data.household_magi_cents }
          assert:
            - "Household.${hh_id}.household_magi_cents == 2000000"
            - "Household.${hh_id}.countable_size == 1"
