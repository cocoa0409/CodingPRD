# =============================================================================
# SCAFFOLD: sawmill-lumber-production (v1)
# Sawmill & Lumber Production — log scaling/purchase, sawing recovery, kiln
# scheduling, grade stamping/re-grade, byproduct sales, green/dry inventory,
# contract vs spot pricing, log deck rotation & degrade.
# =============================================================================

scenario: |
  Sawmill & Lumber Production (Weyerhaeuser style sawmill): log scaling & species/grade purchase, sawing pattern & lumber recovery factor, kiln schedule & moisture target, grade stamping & re-grade downfall, byproduct (chip/sawdust/bark) sales, green vs dry inventory & shrink, contract vs spot pricing by random length, log deck rotation & degrade

domain_name: sawmill-lumber-production
api_prefix: /api

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table (flat topology; FK links)
# =============================================================================
entities:
  - name: LogLoad
    parent: null
    common_fields: true
    fields:
      - { name: supplier_name, type: string, source: input, description: "Logging supplier name" }
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | PONDEROSA_PINE | HEMLOCK_FIR | CEDAR" }
      - { name: log_grade, type: enum, source: input, description: "Purchase grade: PEELER | SAWLOG_1 | SAWLOG_2 | UTILITY" }
      - { name: scaled_mbf, type: number, source: input, description: "Scaled net volume in thousand board feet; set by scale or resolve-scale" }
      - { name: price_per_mbf_cents, type: integer, source: input, description: "Agreed purchase price per MBF in cents; set by scale or resolve-scale" }
      - { name: purchase_cost_cents, type: integer, source: computed, description: "round(scaled_mbf * price_per_mbf_cents, 0); null until scaled" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SCALED | DISPUTED | DECKED | CONSUMED" }
      - { name: decked_at, type: datetime, source: system, description: "Logical-clock timestamp when the load entered the log deck; null unless DECKED" }
      - { name: days_in_deck, type: integer, source: computed, description: "floor((current_logical_utc - decked_at)/86400) while DECKED; 0 otherwise" }
      - { name: degrade_pct, type: number, source: computed, description: "Deck degrade percent 0..15 refreshed by POST /api/ops/runs; see deck_degrade_pct" }
      - { name: effective_mbf, type: number, source: computed, description: "round(scaled_mbf * (1 - degrade_pct/100), 3); null until scaled" }
      - { name: sawing_run_id, type: string, source: system, description: "FK -> SawingRun.id; set when the load is attached to a PLANNED run; null before" }

  - name: SawingRun
    parent: null
    common_fields: true
    fields:
      - { name: saw_line, type: enum, source: input, description: "LINE_A | LINE_B" }
      - { name: scheduled_date, type: string, source: input, description: "Calendar date YYYY-MM-DD the run occupies the saw line (whole-day, closed)" }
      - { name: sawing_pattern, type: enum, source: input, description: "DIMENSION_2X4 | STUD_MIX | TIMBER_4X4" }
      - { name: log_load_ids, type: array, source: input, description: "Ordered array of LogLoad ids (DECKED, unattached) to consume; attaches them at creation" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED" }
      - { name: input_mbf, type: number, source: computed, description: "Sum of effective_mbf of consumed loads at completion; null until COMPLETED" }
      - { name: output_green_mbf, type: number, source: computed, description: "Sum of green_mbf of packages produced at completion; null until COMPLETED" }
      - { name: recovery_pct_provisional, type: number, source: computed, description: "round(output_green_mbf / input_mbf * 100, 2) at completion" }
      - { name: recovery_pct_certified, type: number, source: computed, description: "round(sum(dry_mbf of this run's packages in STAMPED/ALLOCATED/SHIPPED) / input_mbf * 100, 2); null until EVERY package of the run is STAMPED, ALLOCATED or SHIPPED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }
      - { name: chip_tons, type: number, source: input, description: "Chip byproduct tons produced; recorded at completion" }
      - { name: sawdust_tons, type: number, source: input, description: "Sawdust byproduct tons produced; recorded at completion" }
      - { name: bark_tons, type: number, source: input, description: "Bark byproduct tons produced; recorded at completion" }

  - name: KilnCharge
    parent: null
    common_fields: true
    fields:
      - { name: chamber, type: enum, source: input, description: "KILN_1 | KILN_2 | KILN_3" }
      - { name: species, type: enum, source: input, description: "Single species dried in this charge: DOUGLAS_FIR | PONDEROSA_PINE | HEMLOCK_FIR | CEDAR" }
      - { name: package_ids, type: array, source: input, description: "LumberPackage ids charged; every package must be GREEN and of this species" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned charge start (ISO8601); must be >= current logical time at creation" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned charge end; must be strictly after scheduled_start" }
      - { name: target_moisture_pct, type: number, source: input, description: "Target average moisture content percent, e.g. 15.0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED" }
      - { name: actual_start, type: datetime, source: system, description: "Logical-clock timestamp when started; null until IN_PROGRESS" }
      - { name: actual_end, type: datetime, source: system, description: "Logical-clock timestamp when completed/aborted; null until terminal" }

  - name: LumberPackage
    parent: null
    common_fields: true
    fields:
      - { name: sawing_run_id, type: string, source: system, description: "FK -> SawingRun.id; the run that produced this package" }
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | PONDEROSA_PINE | HEMLOCK_FIR | CEDAR" }
      - { name: dimension, type: enum, source: input, description: "2X4 | 2X6 | 4X4" }
      - { name: length_ft, type: integer, source: input, description: "Package length in feet: 8 | 10 | 12 | 16" }
      - { name: pieces, type: integer, source: input, description: "Piece count in the package" }
      - { name: green_mbf, type: number, source: input, description: "Green tally volume in MBF measured at the saw" }
      - { name: estimated_dry_mbf, type: number, source: computed, description: "round(green_mbf * (1 - SHRINK_PCT[species]), 3); planning estimate" }
      - { name: actual_dry_mbf, type: number, source: input, description: "Measured dry tally MBF recorded per package at kiln completion; null until measured" }
      - { name: dry_mbf, type: number, source: computed, description: "actual_dry_mbf when measured, else estimated_dry_mbf (reconciles at kiln completion)" }
      - { name: kiln_charge_id, type: string, source: system, description: "FK -> KilnCharge.id; set while IN_KILN; null otherwise" }
      - { name: exit_moisture_pct, type: number, source: input, description: "Measured exit moisture percent recorded at kiln completion" }
      - { name: stamped_grade, type: enum, source: system, description: "SELECT_STRUCT | NO_2 | NO_3 | ECONOMY; null until first STAMP inspection" }
      - { name: status, type: enum, source: system, description: "GREEN | IN_KILN | DRY | STAMPED | ALLOCATED | SHIPPED" }
      - { name: stamped_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest grade stamp/restamp; null until stamped" }
      - { name: sales_order_id, type: string, source: system, description: "FK -> SalesOrder.id; set while ALLOCATED; null otherwise" }

  - name: GradeInspection
    parent: null
    common_fields: false
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> LumberPackage.id; package inspected" }
      - { name: inspector_grade, type: enum, source: input, description: "Grade observed by the grader: SELECT_STRUCT | NO_2 | NO_3 | ECONOMY" }
      - { name: action, type: enum, source: input, description: "STAMP (package must be DRY) | RESTAMP (package must be STAMPED or ALLOCATED)" }
      - { name: note, type: string, source: input, description: "Optional grader note", default: null }

  - name: SalesContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Buyer name" }
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | PONDEROSA_PINE | HEMLOCK_FIR | CEDAR" }
      - { name: grade, type: enum, source: input, description: "SELECT_STRUCT | NO_2 | NO_3 | ECONOMY" }
      - { name: committed_mbf, type: number, source: input, description: "Total contract volume commitment in MBF" }
      - { name: contract_price_per_mbf_cents, type: integer, source: input, description: "Fixed contract price per MBF in cents" }
      - { name: start_date, type: string, source: input, description: "Contract start date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Contract end date YYYY-MM-DD; must be after start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | EXPIRED" }
      - { name: reserved_mbf, type: number, source: computed, description: "Sum of volume_mbf of PLACED or ALLOCATED SalesOrders with contract_id == this contract" }
      - { name: shipped_mbf, type: number, source: computed, description: "Sum of dry_mbf of SHIPPED LumberPackages whose sales_order_id resolves to a SalesOrder with contract_id == this contract" }
      - { name: remaining_mbf, type: number, source: computed, description: "committed_mbf - reserved_mbf" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Buyer name" }
      - { name: contract_id, type: string, source: input, description: "FK -> SalesContract.id; optional — presence selects CONTRACT pricing", default: null }
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | PONDEROSA_PINE | HEMLOCK_FIR | CEDAR" }
      - { name: grade, type: enum, source: input, description: "Required stamped grade: SELECT_STRUCT | NO_2 | NO_3 | ECONOMY" }
      - { name: length_spec, type: enum, source: input, description: "RL (random length — accepts any package length) | 8 | 10 | 12 | 16 (exact package length)" }
      - { name: volume_mbf, type: number, source: input, description: "Ordered volume in MBF" }
      - { name: pricing_mode, type: enum, source: computed, description: "CONTRACT when contract_id given, else SPOT" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Pinned at placement: contract price, or spot_unit_price quote" }
      - { name: allocated_mbf, type: number, source: computed, description: "Sum of dry_mbf of LumberPackages with sales_order_id == this order and status ALLOCATED" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over allocated packages of round(package.dry_mbf * unit_price_cents, 0); 0 when nothing allocated" }
      - { name: status, type: enum, source: system, description: "PLACED | ALLOCATED | SHIPPED | CANCELLED" }

  - name: PriceList
    parent: null
    common_fields: false
    fields:
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | PONDEROSA_PINE | HEMLOCK_FIR | CEDAR" }
      - { name: grade, type: enum, source: input, description: "SELECT_STRUCT | NO_2 | NO_3 | ECONOMY" }
      - { name: base_price_per_mbf_cents, type: integer, source: input, description: "Spot base price per MBF in cents before length multiplier and volume discount" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 timestamp from which this price row is effective" }

  - name: ByproductSale
    parent: null
    common_fields: false
    fields:
      - { name: product, type: enum, source: input, description: "CHIP | SAWDUST | BARK" }
      - { name: volume_tons, type: number, source: input, description: "Tons sold" }
      - { name: price_per_ton_cents, type: integer, source: input, description: "Sale price per ton in cents" }
      - { name: buyer_name, type: string, source: input, description: "Byproduct buyer" }
      - { name: total_cents, type: integer, source: computed, description: "round(volume_tons * price_per_ton_cents, 0)" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: LogLoad
    initial_state: RECEIVED
    terminal_states: [CONSUMED]
    transitions:
      - from: RECEIVED
        to: SCALED
        trigger: "POST /api/log-loads/{id}/scale"
        actor: Scaler
        preconditions: ["load.status == RECEIVED"]
        side_effects:
          - "sets scaled_mbf and price_per_mbf_cents from input"
          - "computes purchase_cost_cents = round(scaled_mbf * price_per_mbf_cents, 0)"
          - "increments LogLoad.version by 1"
      - from: SCALED
        to: DISPUTED
        trigger: "POST /api/log-loads/{id}/dispute"
        actor: Scaler
        preconditions: ["load.status == SCALED"]
        side_effects: ["records dispute reason", "increments LogLoad.version by 1"]
      - from: DISPUTED
        to: SCALED
        trigger: "POST /api/log-loads/{id}/resolve-scale"
        actor: MillManager
        preconditions: ["load.status == DISPUTED"]
        side_effects:
          - "replaces scaled_mbf and price_per_mbf_cents with resolved values"
          - "recomputes purchase_cost_cents = round(scaled_mbf * price_per_mbf_cents, 0)"
          - "increments LogLoad.version by 1"
        note: "Scale dispute loop SCALED -> DISPUTED -> SCALED is unbounded; each resolution replaces the commercial terms."
      - from: SCALED
        to: DECKED
        trigger: "POST /api/log-loads/{id}/deck"
        actor: Scaler
        preconditions:
          - "load.status == SCALED"
          - "sum(scaled_mbf of LogLoads with status DECKED) + this scaled_mbf <= 500 (DECK_CAPACITY_MBF)"
        side_effects:
          - "sets decked_at = current logical time; degrade_pct = 0; days_in_deck starts at 0"
          - "increments LogLoad.version by 1"
      - from: DECKED
        to: SCALED
        trigger: "POST /api/log-loads/{id}/undeck"
        actor: Scaler
        preconditions: ["load.status == DECKED", "load.sawing_run_id IS NULL"]
        side_effects:
          - "clears decked_at; degrade_pct = 0; days_in_deck = 0"
          - "increments LogLoad.version by 1"
        note: "deck/undeck is the compensating pair for the deck-occupancy invariant."
      - from: DECKED
        to: CONSUMED
        trigger: "POST /api/sawing-runs/{id}/complete (cross-entity: every load attached to the run)"
        actor: Sawyer
        preconditions: ["load.status == DECKED", "load.sawing_run_id == the completing run's id"]
        side_effects:
          - "snapshots effective_mbf at current degrade_pct into the run's input_mbf sum"
          - "increments LogLoad.version by 1"

  - entity: SawingRun
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /api/sawing-runs/{id}/complete"
        actor: Sawyer
        preconditions:
          - "run.status == PLANNED"
          - "every load in log_load_ids is still DECKED and attached to this run"
        side_effects:
          - "link 1: every attached LogLoad flips DECKED -> CONSUMED and contributes effective_mbf to input_mbf"
          - "creates one LumberPackage per packages[] entry with status GREEN and sawing_run_id = this run"
          - "computes output_green_mbf = sum(packages[].green_mbf) and recovery_pct_provisional (lumber_recovery_factor, provisional variant)"
          - "records chip_tons/sawdust_tons/bark_tons, which increase byproduct_on_hand (link 2: run completion raises sellable byproduct inventory)"
          - "sets completed_at = current logical time; increments SawingRun.version by 1"

  - entity: KilnCharge
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/kiln-charges/{id}/start"
        actor: KilnOperator
        preconditions:
          - "charge.status == SCHEDULED"
          - "current logical time >= charge.scheduled_start"
        side_effects: ["sets actual_start = current logical time", "increments KilnCharge.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/kiln-charges/{id}/complete"
        actor: KilnOperator
        preconditions:
          - "charge.status == IN_PROGRESS"
          - "current logical time >= charge.scheduled_end"
          - "readings[] covers exactly the charged package set (every package_id charged, no extras)"
        side_effects:
          - "per package with exit_moisture_pct <= target_moisture_pct + 2.0: package IN_KILN -> DRY, actual_dry_mbf set from readings (dry_mbf reconciles estimate -> actual), kiln_charge_id cleared"
          - "per package with exit_moisture_pct > target_moisture_pct + 2.0: package IN_KILN -> GREEN (rework loop), kiln_charge_id cleared, actual_dry_mbf left null"
          - "sets actual_end = current logical time; increments KilnCharge.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /api/kiln-charges/{id}/abort"
        actor: KilnOperator
        preconditions: ["charge.status == SCHEDULED"]
        side_effects:
          - "every charged package flips IN_KILN -> GREEN and kiln_charge_id cleared"
          - "sets actual_end; increments KilnCharge.version by 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /api/kiln-charges/{id}/abort"
        actor: KilnOperator
        preconditions: ["charge.status == IN_PROGRESS"]
        side_effects:
          - "every charged package flips IN_KILN -> GREEN and kiln_charge_id cleared (actual_dry_mbf not set)"
          - "sets actual_end; increments KilnCharge.version by 1"

  - entity: LumberPackage
    initial_state: GREEN
    terminal_states: [SHIPPED]
    transitions:
      - from: GREEN
        to: IN_KILN
        trigger: "POST /api/kiln-charges (cross-entity: every id in package_ids)"
        actor: KilnOperator
        preconditions: ["package.status == GREEN", "package.species == charge.species"]
        side_effects: ["sets kiln_charge_id = new charge id", "increments LumberPackage.version by 1"]
      - from: IN_KILN
        to: DRY
        trigger: "POST /api/kiln-charges/{id}/complete (moisture pass)"
        actor: KilnOperator
        preconditions: ["package.kiln_charge_id == completing charge", "exit_moisture_pct <= target + 2.0"]
        side_effects:
          - "sets actual_dry_mbf from readings; dry_mbf reconciles from estimated to actual"
          - "clears kiln_charge_id; increments LumberPackage.version by 1"
      - from: IN_KILN
        to: GREEN
        trigger: "POST /api/kiln-charges/{id}/complete (moisture fail) or POST /api/kiln-charges/{id}/abort"
        actor: KilnOperator
        preconditions: ["package.kiln_charge_id == the charge"]
        side_effects: ["clears kiln_charge_id", "increments LumberPackage.version by 1"]
        note: "GREEN -> IN_KILN -> GREEN rework cycle is unbounded; a failed charge may be re-run via a new charge."
      - from: DRY
        to: STAMPED
        trigger: "POST /api/lumber-packages/{id}/grade-inspections with action=STAMP"
        actor: Grader
        preconditions: ["package.status == DRY"]
        side_effects:
          - "sets stamped_grade = inspector_grade, stamped_at = current logical time"
          - "link 1 of certification: package now counts toward its SawingRun's stamped set"
          - "link 2: when every package of the run is in {STAMPED, ALLOCATED, SHIPPED}, recompute run.recovery_pct_certified = round(sum(dry_mbf of those packages)/input_mbf*100, 2) and bump SawingRun.version"
          - "increments LumberPackage.version by 1"
      - from: STAMPED
        to: STAMPED
        trigger: "POST /api/lumber-packages/{id}/grade-inspections with action=RESTAMP"
        actor: Grader
        preconditions: ["package.status == STAMPED"]
        side_effects:
          - "replaces stamped_grade with inspector_grade; refreshes stamped_at (re-grade downfall record: each RESTAMP appends a GradeInspection row)"
          - "increments LumberPackage.version by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /api/lumber-packages/{id}/grade-inspections with action=RESTAMP and inspector_grade == the holding order's grade"
        actor: Grader
        preconditions: ["package.status == ALLOCATED", "inspector_grade == SalesOrder(package.sales_order_id).grade"]
        side_effects:
          - "no release: package stays ALLOCATED and keeps sales_order_id; the inspection row is still appended"
          - "increments LumberPackage.version by 1"
        note: "The release cascade below fires only when the re-graded value mismatches the holding order's grade."
      - from: ALLOCATED
        to: STAMPED
        trigger: "POST /api/lumber-packages/{id}/grade-inspections with action=RESTAMP and inspector_grade != order grade (release), or POST /api/sales-orders/{id}/cancel (cross-entity release)"
        actor: Grader | SalesRep
        preconditions: ["package.status == ALLOCATED"]
        side_effects:
          - "link 1 (RESTAMP): stamped_grade := inspector_grade"
          - "link 2 (release): sales_order_id cleared; the holding SalesOrder's allocated_mbf and total_cents recompute"
          - "link 3: a SalesOrder left with zero allocated packages flips ALLOCATED -> PLACED"
          - "increments LumberPackage.version by 1"
      - from: STAMPED
        to: ALLOCATED
        trigger: "POST /api/sales-orders/{id}/allocate (cross-entity: selected packages)"
        actor: SalesRep
        preconditions: ["package.status == STAMPED", "package matches order species/grade/length_spec", "package.sales_order_id IS NULL"]
        side_effects: ["sets sales_order_id = order id", "recomputes order.allocated_mbf and order.total_cents", "increments LumberPackage.version by 1"]
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/sales-orders/{id}/ship (cross-entity: every allocated package)"
        actor: SalesRep
        preconditions: ["package.sales_order_id == the shipping order"]
        side_effects:
          - "link 1: package flips ALLOCATED -> SHIPPED"
          - "link 2: each flip re-derives the order's contract shipped_mbf = sum(dry_mbf of SHIPPED packages whose sales_order_id resolves to an order with contract_id == contract)"
          - "link 3: when recomputed shipped_mbf >= committed_mbf, the SalesContract auto-transitions ACTIVE -> CLOSED"
          - "increments LumberPackage.version by 1"

  - entity: SalesOrder
    initial_state: PLACED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PLACED
        to: ALLOCATED
        trigger: "POST /api/sales-orders/{id}/allocate"
        actor: SalesRep
        preconditions:
          - "order.status == PLACED"
          - "eligible pool = LumberPackages with status STAMPED, species == order.species, stamped_grade == order.grade, sales_order_id IS NULL, and (length_spec == RL or length_ft == length_spec)"
          - "sum(dry_mbf of eligible pool) >= order.volume_mbf (else ERR_INSUFFICIENT_STAMPED_VOLUME)"
        side_effects:
          - "selector: rank eligible packages by stamped_at ASC, tie-break created_at ASC; walk the ranking adding whole packages until cumulative dry_mbf >= volume_mbf; the package that crosses the threshold is included whole (over-allocation of at most one package)"
          - "each selected package STAMPED -> ALLOCATED with sales_order_id set"
          - "computes allocated_mbf = sum(selected dry_mbf) and total_cents = sum(round(dry_mbf_i * unit_price_cents, 0)) — round per package, then sum"
          - "increments SalesOrder.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["order.status == PLACED"]
        side_effects:
          - "if contract_id: contract.reserved_mbf releases volume_mbf"
          - "increments SalesOrder.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /api/sales-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["order.status == ALLOCATED"]
        side_effects:
          - "every allocated package flips ALLOCATED -> STAMPED and sales_order_id cleared (compensating release)"
          - "allocated_mbf := 0; total_cents := 0"
          - "if contract_id: contract.reserved_mbf releases volume_mbf"
          - "increments SalesOrder.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/sales-orders/{id}/ship"
        actor: SalesRep
        preconditions: ["order.status == ALLOCATED"]
        side_effects:
          - "link 1: every allocated LumberPackage flips ALLOCATED -> SHIPPED (grade-stamped lumber only — allocation guarantees STAMPED origin)"
          - "link 2: each package flip re-derives contract.shipped_mbf (see LumberPackage ALLOCATED->SHIPPED)"
          - "link 3: contract auto-closes when shipped_mbf >= committed_mbf"
          - "if contract_id: contract.reserved_mbf releases volume_mbf (order no longer PLACED/ALLOCATED)"
          - "increments SalesOrder.version by 1"

  - entity: SalesContract
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/sales-contracts/{id}/activate"
        actor: MillManager
        preconditions: ["contract.status == DRAFT"]
        side_effects: ["increments SalesContract.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "system auto-transition when shipped_mbf >= committed_mbf (recomputed by package SHIPPED flips)"
        actor: system
        preconditions: ["contract.status == ACTIVE", "shipped_mbf >= committed_mbf"]
        side_effects: ["increments SalesContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/ops/runs (sweep: current logical date > end_date)"
        actor: MillManager
        preconditions: ["contract.status == ACTIVE", "current logical date > contract.end_date"]
        side_effects: ["contract listed in ops run expired_contract_ids", "increments SalesContract.version by 1"]
        note: "Expiry does not touch existing PLACED/ALLOCATED orders; new orders against a non-ACTIVE contract are rejected."

# =============================================================================
# §1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: contract-amend-stale-version
    parent_entity: SalesContract
    write_endpoint: "PUT /api/sales-contracts/{id}"
    occ_field: expected_contract_version
    description: |
      Amending a SalesContract whose version has advanced beyond the
      expected_contract_version the client supplies is rejected. Contract
      amendment is a legitimate, repeatable edit on a DRAFT or ACTIVE
      contract, so a client holding a stale view would otherwise silently
      overwrite terms committed by an earlier amendment; the server detects
      the stale version and refuses.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: purchase_cost
    trigger: "POST /api/log-loads/{id}/scale and POST /api/log-loads/{id}/resolve-scale"
    algorithm: aggregation
    formula: |
      purchase_cost_cents = round(scaled_mbf * price_per_mbf_cents, 0)
    input_set: "the single LogLoad being scaled or resolved"
    precision: "integer cents, round_half_up"

  - name: deck_degrade_pct
    trigger: "POST /api/ops/runs refreshes every DECKED LogLoad; also read live via days_in_deck"
    algorithm: threshold
    formula: |
      days_in_deck = floor((current_logical_utc - decked_at) / 86400)
      if days_in_deck <= FREE_DECK_DAYS: degrade_pct = 0
      else: degrade_pct = min(MAX_DEGRADE_PCT, DEGRADE_PCT_PER_WEEK * floor((days_in_deck - FREE_DECK_DAYS) / 7))
      effective_mbf = round(scaled_mbf * (1 - degrade_pct / 100), 3)
    input_set: "LogLoads with status == DECKED only; SCALED/CONSUMED loads carry degrade_pct 0"
    constants:
      FREE_DECK_DAYS: 14
      DEGRADE_PCT_PER_WEEK: 3
      MAX_DEGRADE_PCT: 15
      DECK_CAPACITY_MBF: 500
    precision: "degrade_pct integer percent; effective_mbf 3 decimal places, round_half_up"

  - name: lumber_recovery_factor
    trigger: "provisional: POST /api/sawing-runs/{id}/complete; certified: every grade-stamp or ship that changes a package of the run into/out of the stamped set"
    algorithm: aggregation
    formula: |
      input_mbf = sum(effective_mbf of attached loads at consumption)
      provisional: recovery_pct_provisional = round(output_green_mbf / input_mbf * 100, 2)
      certified:   recovery_pct_certified   = round(sum(dry_mbf of run packages in {STAMPED, ALLOCATED, SHIPPED}) / input_mbf * 100, 2)
    input_set: "provisional: all packages created by the run; certified: computed only when EVERY package of the run has status in {STAMPED, ALLOCATED, SHIPPED}, summing their current dry_mbf"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at run completion"
        difference: "uses green_mbf (green tally at the saw); available immediately"
      - name: certified
        when: "once every package of the run is STAMPED/ALLOCATED/SHIPPED"
        difference: "uses dry_mbf (post-shrink), so it is strictly lower than provisional whenever shrink > 0"

  - name: dry_volume_estimate_vs_actual
    trigger: "estimated: package creation; actual: POST /api/kiln-charges/{id}/complete per package"
    algorithm: aggregation
    formula: |
      estimated_dry_mbf = round(green_mbf * (1 - SHRINK_PCT[species]), 3)
      actual_dry_mbf    = measured tally supplied in the completion readings
      dry_mbf = actual_dry_mbf if set else estimated_dry_mbf
    input_set: "the single LumberPackage"
    constants:
      SHRINK_PCT_DOUGLAS_FIR: 0.06
      SHRINK_PCT_PONDEROSA_PINE: 0.07
      SHRINK_PCT_HEMLOCK_FIR: 0.08
      SHRINK_PCT_CEDAR: 0.05
    precision: "3 decimal places, round_half_up"
    variants:
      - name: estimated
        when: "from creation until kiln completion records a measurement"
        difference: "species constant shrink — used for planning and for DRY-pool value before measurement"
      - name: actual
        when: "kiln completion records measured_dry_mbf"
        difference: "replaces the estimate; allocation, totals and certified recovery then use the measured figure (reconciliation)"

  - name: moisture_pass_gate
    trigger: "POST /api/kiln-charges/{id}/complete, per package reading"
    algorithm: threshold
    formula: |
      pass iff exit_moisture_pct <= target_moisture_pct + MOISTURE_TOLERANCE_PCT
      pass -> package DRY with actual_dry_mbf; fail -> package GREEN (rework), actual_dry_mbf unset
    input_set: "packages charged in the completing KilnCharge"
    constants:
      MOISTURE_TOLERANCE_PCT: 2.0
    precision: "1 decimal place comparison, inclusive boundary"

  - name: spot_unit_price
    trigger: "POST /api/sales-orders when contract_id is absent (SPOT pricing)"
    algorithm: tiered_pricing
    formula: |
      base = PriceList.base_price_per_mbf_cents selected by:
        eligibility: species == order.species AND grade == order.grade AND effective_from <= current logical time
        ranking: effective_from DESC; tie-break: created_at DESC
        empty pool -> ERR_NO_PRICE_LIST
      length_mult = LENGTH_MULT[length_spec]
      discount = 0.05 if volume_mbf >= 50 else (0.02 if volume_mbf >= 10 else 0.00)
      unit_price_cents = round(round(base * length_mult, 0) * (1 - discount), 0)
    input_set: "PriceList rows for (species, grade) effective at placement; order length_spec and volume_mbf"
    constants:
      LENGTH_MULT_RL: 0.96
      LENGTH_MULT_8: 0.95
      LENGTH_MULT_10: 0.97
      LENGTH_MULT_12: 1.00
      LENGTH_MULT_16: 1.08
      VOLUME_TIER_1_MBF: 10
      VOLUME_TIER_1_DISCOUNT: 0.02
      VOLUME_TIER_2_MBF: 50
      VOLUME_TIER_2_DISCOUNT: 0.05
    precision: "integer cents; round_half_up after the length multiplier, then again after the discount (pinned two-step rounding)"

  - name: order_total_per_package_rounding
    trigger: "POST /api/sales-orders/{id}/allocate"
    algorithm: aggregation
    formula: |
      extended_i = round(package_i.dry_mbf * order.unit_price_cents, 0)   # per package FIRST
      total_cents = sum(extended_i)                                        # then sum
      # pinned order: per-package rounding THEN summation.
      # sum-then-round (round(sum(dry_mbf) * unit_price_cents, 0)) is a different, rejected reading.
    input_set: "the packages selected by the allocation walk, in ranked order"
    precision: "integer cents, round_half_up per package"

  - name: contract_drawdown
    trigger: "order placement/cancel/ship against a contract; auto-close evaluation on ship"
    algorithm: aggregation
    formula: |
      reserved_mbf = sum(volume_mbf of SalesOrders with contract_id == contract AND status in {PLACED, ALLOCATED})
      remaining_mbf = committed_mbf - reserved_mbf
      shipped_mbf  = sum(dry_mbf of LumberPackages with status == SHIPPED whose sales_order_id resolves to a SalesOrder with contract_id == contract)
      auto-close: when shipped_mbf >= committed_mbf and status == ACTIVE -> CLOSED
    input_set: "orders referencing the contract (status filter PLACED/ALLOCATED for reserved); SHIPPED packages of those orders for shipped"
    precision: "MBF at 3 decimal places"

  - name: byproduct_on_hand
    trigger: "GET /api/byproduct-inventory; validated by POST /api/byproduct-sales"
    algorithm: aggregation
    formula: |
      per product p in {CHIP, SAWDUST, BARK}:
        produced_tons = sum(p tons of SawingRuns with status == COMPLETED)
        sold_tons     = sum(volume_tons of ByproductSales with product == p)
        on_hand_tons  = produced_tons - sold_tons
    input_set: "all COMPLETED SawingRuns; all ByproductSale rows (no status filter — sales are final)"
    precision: "tons at 3 decimal places, round_half_up on totals"

  - name: allocation_selector
    trigger: "POST /api/sales-orders/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      eligible = packages with status == STAMPED AND species == order.species
                 AND stamped_grade == order.grade AND sales_order_id IS NULL
                 AND (order.length_spec == RL OR length_ft == order.length_spec)
      pre-check: sum(dry_mbf of eligible) < volume_mbf -> ERR_INSUFFICIENT_STAMPED_VOLUME
      walk: sort eligible by stamped_at ASC, tie-break created_at ASC;
            accumulate whole packages until cumulative dry_mbf >= volume_mbf;
            stop immediately after the crossing package (over-allocate at most one package)
    input_set: "STAMPED packages mill-wide matching the order spec"
    precision: "MBF at 3 decimal places"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id in the path exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "request body shape: required fields present, types/enum values valid, numeric quantities > 0, arrays non-empty where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "entity state preconditions of the invoked transition (incl. cross-entity: kiln packages GREEN, sawing loads DECKED, order PLACED/ALLOCATED, contract DRAFT-or-ACTIVE for amend, contract ACTIVE for order placement)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "contract_id references a contract with status ACTIVE when placing or allocating a contract order"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/sales-orders"
  - priority: 6
    category: business_temporal
    check: "kiln charge scheduled_start >= current logical time at creation; start endpoint not invoked before scheduled_start"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /api/kiln-charges, POST /api/kiln-charges/{id}/start"
  - priority: 6
    category: business_temporal
    check: "kiln charge scheduled_end strictly after scheduled_start"
    error_id: ERR_END_BEFORE_START
    http_status: 422
    applies_to: "POST /api/kiln-charges"
  - priority: 7
    category: business_constraint
    check: "kiln chamber occupation: new [scheduled_start, scheduled_end) must satisfy new_start >= existing_end + 4h AND new_end + 4h <= existing_start for every SCHEDULED/IN_PROGRESS charge on the same chamber (4h turnaround buffer; exactly 4h adjacency allowed)"
    error_id: ERR_KILN_OVERLAP
    http_status: 409
    applies_to: "POST /api/kiln-charges"
  - priority: 7
    category: business_constraint
    check: "saw line daily booking: no other PLANNED SawingRun with the same saw_line and scheduled_date (whole-calendar-day closed occupation; adjacent days and the other line are free)"
    error_id: ERR_SAW_LINE_BOOKED
    http_status: 409
    applies_to: "POST /api/sawing-runs"
  - priority: 7
    category: business_constraint
    check: "log deck aggregate capacity: sum(scaled_mbf of DECKED loads) + this load's scaled_mbf <= 500 (DECK_CAPACITY_MBF; at-capacity allowed)"
    error_id: ERR_DECK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/log-loads/{id}/deck"
  - priority: 7
    category: business_constraint
    check: "sawing run log set: log_load_ids contains no duplicates and no load already attached to another PLANNED run"
    error_id: ERR_DUPLICATE_LOAD_IN_RUN
    http_status: 422
    applies_to: "POST /api/sawing-runs"
  - priority: 8
    category: business_referential
    check: "species/grade linkage: every package in a kiln charge matches the charge species; a contract order's species and grade match the referenced contract"
    error_id: ERR_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /api/kiln-charges, POST /api/sales-orders"
  - priority: 9
    category: business_fiscal
    check: "contract volume: order volume_mbf <= contract.remaining_mbf at placement; amended committed_mbf >= reserved_mbf"
    error_id: ERR_CONTRACT_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /api/sales-orders, PUT /api/sales-contracts/{id}"
  - priority: 9
    category: business_fiscal
    check: "spot pricing requires an effective PriceList row for (species, grade) at placement time"
    error_id: ERR_NO_PRICE_LIST
    http_status: 422
    applies_to: "POST /api/sales-orders"
  - priority: 9
    category: business_fiscal
    check: "allocation pool: sum(dry_mbf of eligible STAMPED packages) >= order.volume_mbf"
    error_id: ERR_INSUFFICIENT_STAMPED_VOLUME
    http_status: 422
    applies_to: "POST /api/sales-orders/{id}/allocate"
  - priority: 9
    category: business_fiscal
    check: "byproduct sale volume_tons <= byproduct_on_hand(product)"
    error_id: ERR_INSUFFICIENT_BYPRODUCT
    http_status: 422
    applies_to: "POST /api/byproduct-sales"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- LogLoad ---
  - method: POST
    path: "/api/log-loads"
    description: "Receive a log load (status RECEIVED)"
    roles: [Scaler]
    code: 201
    input: [supplier_name, species, log_grade]
    output: LogLoad
    side_effects: ["status=RECEIVED; degrade_pct=0"]
  - method: GET
    path: "/api/log-loads"
    description: "List log loads with filters"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: ["status?", "species?", "sawing_run_id?", "limit?", "offset?"]
    output: LogLoad[]
    side_effects: []
  - method: GET
    path: "/api/log-loads/{id}"
    description: "Get one log load"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: LogLoad
    side_effects: []
  - method: POST
    path: "/api/log-loads/{id}/scale"
    description: "Scale a RECEIVED load (RECEIVED -> SCALED)"
    roles: [Scaler]
    code: 200
    input: [scaled_mbf, price_per_mbf_cents]
    output: LogLoad
    side_effects: ["computes purchase_cost_cents", "increments LogLoad.version by 1"]
  - method: POST
    path: "/api/log-loads/{id}/dispute"
    description: "Raise a scale dispute (SCALED -> DISPUTED)"
    roles: [Scaler]
    code: 200
    input: [reason]
    output: LogLoad
    side_effects: ["increments LogLoad.version by 1"]
  - method: POST
    path: "/api/log-loads/{id}/resolve-scale"
    description: "Resolve a scale dispute with adjusted figures (DISPUTED -> SCALED)"
    roles: [MillManager]
    code: 200
    input: [scaled_mbf, price_per_mbf_cents]
    output: LogLoad
    side_effects: ["recomputes purchase_cost_cents", "increments LogLoad.version by 1"]
  - method: POST
    path: "/api/log-loads/{id}/deck"
    description: "Move a SCALED load onto the log deck (SCALED -> DECKED)"
    roles: [Scaler]
    code: 200
    input: []
    output: LogLoad
    side_effects: ["sets decked_at; degrade_pct=0", "increments LogLoad.version by 1"]
  - method: POST
    path: "/api/log-loads/{id}/undeck"
    description: "Pull a DECKED, unattached load back to SCALED (compensates deck)"
    roles: [Scaler]
    code: 200
    input: []
    output: LogLoad
    side_effects: ["clears decked_at; degrade_pct=0", "increments LogLoad.version by 1"]

  # --- SawingRun ---
  - method: POST
    path: "/api/sawing-runs"
    description: "Plan a sawing run; attaches DECKED loads (sets their sawing_run_id)"
    roles: [Sawyer]
    code: 201
    input: [saw_line, scheduled_date, sawing_pattern, log_load_ids]
    output: SawingRun
    side_effects: ["status=PLANNED", "each listed load gets sawing_run_id = this run"]
  - method: GET
    path: "/api/sawing-runs/{id}"
    description: "Get one sawing run"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: SawingRun
    side_effects: []
  - method: POST
    path: "/api/sawing-runs/{id}/complete"
    description: "Complete a run: record produced packages and byproduct tons (PLANNED -> COMPLETED)"
    roles: [Sawyer]
    code: 200
    input: [packages, chip_tons, sawdust_tons, bark_tons]
    output: SawingRun
    side_effects:
      - "attached loads DECKED -> CONSUMED; input_mbf = sum(effective_mbf)"
      - "creates GREEN LumberPackages from packages[]"
      - "computes output_green_mbf and recovery_pct_provisional"
      - "byproduct on-hand increases by chip/sawdust/bark tons"
      - "increments SawingRun.version by 1"

  # --- KilnCharge ---
  - method: POST
    path: "/api/kiln-charges"
    description: "Schedule a kiln charge; charged packages GREEN -> IN_KILN"
    roles: [KilnOperator]
    code: 201
    input: [chamber, species, package_ids, scheduled_start, scheduled_end, target_moisture_pct]
    output: KilnCharge
    side_effects: ["status=SCHEDULED", "packages GREEN -> IN_KILN with kiln_charge_id set"]
  - method: GET
    path: "/api/kiln-charges/{id}"
    description: "Get one kiln charge"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: KilnCharge
    side_effects: []
  - method: POST
    path: "/api/kiln-charges/{id}/start"
    description: "Start a scheduled charge (SCHEDULED -> IN_PROGRESS); not before scheduled_start"
    roles: [KilnOperator]
    code: 200
    input: []
    output: KilnCharge
    side_effects: ["sets actual_start", "increments KilnCharge.version by 1"]
  - method: POST
    path: "/api/kiln-charges/{id}/complete"
    description: "Complete a charge with per-package moisture/tally readings (IN_PROGRESS -> COMPLETED)"
    roles: [KilnOperator]
    code: 200
    input: [readings]
    output: KilnCharge
    side_effects:
      - "per package: pass -> DRY with actual_dry_mbf; fail -> GREEN rework"
      - "dry_mbf reconciles estimate -> actual on passing packages"
      - "sets actual_end; increments KilnCharge.version by 1"
  - method: POST
    path: "/api/kiln-charges/{id}/abort"
    description: "Abort a charge (SCHEDULED/IN_PROGRESS -> ABORTED); packages back to GREEN"
    roles: [KilnOperator]
    code: 200
    input: []
    output: KilnCharge
    side_effects: ["packages IN_KILN -> GREEN; kiln_charge_id cleared", "increments KilnCharge.version by 1"]

  # --- LumberPackage / GradeInspection ---
  - method: GET
    path: "/api/lumber-packages"
    description: "List lumber packages with filters"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: ["status?", "species?", "grade?", "sales_order_id?", "kiln_charge_id?", "sawing_run_id?", "limit?", "offset?"]
    output: LumberPackage[]
    side_effects: []
  - method: GET
    path: "/api/lumber-packages/{id}"
    description: "Get one lumber package"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: LumberPackage
    side_effects: []
  - method: POST
    path: "/api/lumber-packages/{id}/grade-inspections"
    description: "Record a grade inspection (STAMP from DRY; RESTAMP from STAMPED/ALLOCATED)"
    roles: [Grader]
    code: 201
    input: [inspector_grade, action, "note?"]
    output: GradeInspection
    side_effects:
      - "STAMP: package DRY -> STAMPED; may trigger run.recovery_pct_certified recompute"
      - "RESTAMP: replaces stamped_grade; ALLOCATED package with mismatched new grade is released (order -> PLACED, allocated/total recompute)"
  - method: GET
    path: "/api/lumber-packages/{id}/grade-inspections"
    description: "List inspection history of a package (append-only)"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: GradeInspection[]
    side_effects: []

  # --- PriceList / SalesContract ---
  - method: POST
    path: "/api/price-lists"
    description: "Publish an immutable spot price row for (species, grade) effective from a timestamp"
    roles: [MillManager]
    code: 201
    input: [species, grade, base_price_per_mbf_cents, effective_from]
    output: PriceList
    side_effects: []
  - method: POST
    path: "/api/sales-contracts"
    description: "Create a sales contract (status DRAFT)"
    roles: [MillManager]
    code: 201
    input: [customer_name, species, grade, committed_mbf, contract_price_per_mbf_cents, start_date, end_date]
    output: SalesContract
    side_effects: ["status=DRAFT; reserved_mbf=0; shipped_mbf=0"]
  - method: GET
    path: "/api/sales-contracts/{id}"
    description: "Get one sales contract"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: SalesContract
    side_effects: []
  - method: POST
    path: "/api/sales-contracts/{id}/activate"
    description: "Activate a draft contract (DRAFT -> ACTIVE)"
    roles: [MillManager]
    code: 200
    input: []
    output: SalesContract
    side_effects: ["increments SalesContract.version by 1"]
  - method: PUT
    path: "/api/sales-contracts/{id}"
    description: "Amend a DRAFT or ACTIVE contract; OCC-guarded via expected_contract_version"
    roles: [MillManager]
    code: 200
    input: [expected_contract_version, "committed_mbf?", "contract_price_per_mbf_cents?", "end_date?"]
    output: SalesContract
    side_effects:
      - "applies provided amendments; committed_mbf must stay >= reserved_mbf"
      - "increments SalesContract.version by 1"

  # --- SalesOrder ---
  - method: POST
    path: "/api/sales-orders"
    description: "Place an order; pins pricing_mode and unit_price_cents (CONTRACT or SPOT)"
    roles: [SalesRep]
    code: 201
    input: [customer_name, species, grade, length_spec, volume_mbf, "contract_id?"]
    output: SalesOrder
    side_effects:
      - "CONTRACT: validates contract ACTIVE, species/grade match, volume <= remaining; unit_price_cents = contract price; contract.reserved_mbf += volume_mbf"
      - "SPOT: selects effective PriceList row; unit_price_cents = spot_unit_price quote"
      - "status=PLACED; allocated_mbf=0; total_cents=0"
  - method: GET
    path: "/api/sales-orders"
    description: "List sales orders with filters"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []
  - method: GET
    path: "/api/sales-orders/{id}"
    description: "Get one sales order"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: "/api/sales-orders/{id}/allocate"
    description: "Allocate stamped packages to a PLACED order (selector: FIFO by stamped_at, whole-package fill)"
    roles: [SalesRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["packages STAMPED -> ALLOCATED", "computes allocated_mbf and total_cents (per-package rounding then sum)", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/api/sales-orders/{id}/ship"
    description: "Ship an ALLOCATED order; cascades to packages and contract"
    roles: [SalesRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "packages ALLOCATED -> SHIPPED"
      - "contract.shipped_mbf re-derived from SHIPPED packages; auto-close when >= committed_mbf"
      - "contract.reserved_mbf releases volume_mbf"
      - "increments SalesOrder.version by 1"
  - method: POST
    path: "/api/sales-orders/{id}/cancel"
    description: "Cancel a PLACED or ALLOCATED order; releases allocated packages"
    roles: [SalesRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["packages ALLOCATED -> STAMPED", "allocated_mbf=0; total_cents=0", "contract.reserved_mbf releases volume_mbf", "increments SalesOrder.version by 1"]

  # --- Byproduct / Ops / Clock ---
  - method: POST
    path: "/api/byproduct-sales"
    description: "Record a byproduct (chip/sawdust/bark) sale; validates on-hand"
    roles: [SalesRep]
    code: 201
    input: [product, volume_tons, price_per_ton_cents, buyer_name]
    output: ByproductSale
    side_effects: ["computes total_cents", "reduces byproduct_on_hand(product)"]
  - method: GET
    path: "/api/byproduct-inventory"
    description: "Computed read: per-product produced/sold/on-hand tons"
    roles: [Scaler, Sawyer, KilnOperator, Grader, SalesRep, MillManager]
    code: 200
    input: []
    output: "{ items: array }"
    side_effects: []
  - method: POST
    path: "/api/ops/runs"
    description: "Ops checkpoint: expires ACTIVE contracts past end_date; refreshes degrade_pct/days_in_deck of DECKED loads"
    roles: [MillManager]
    code: 200
    input: []
    output: "{ expired_contract_ids: string[], degraded_load_ids: string[] }"
    side_effects: ["contracts ACTIVE -> EXPIRED where current date > end_date", "DECKED loads' degrade_pct recomputed from the logical clock"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time."
    roles: [MillManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all time-dependent rules (degrade, kiln windows, contract expiry, price effectiveness) read this clock"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum, non-positive quantity, or malformed array" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that allows the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version does not match the contract's current version (OCC)" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "Kiln charge scheduled_start before current logical time, or start invoked before scheduled_start" }
  - { id: ERR_END_BEFORE_START, http: 422, condition: "Kiln charge scheduled_end not strictly after scheduled_start" }
  - { id: ERR_KILN_OVERLAP, http: 409, condition: "Chamber occupation violates non-overlap or the 4h turnaround buffer against a SCHEDULED/IN_PROGRESS charge" }
  - { id: ERR_SAW_LINE_BOOKED, http: 409, condition: "Another PLANNED SawingRun occupies the same saw_line on the same calendar date" }
  - { id: ERR_DECK_CAPACITY_EXCEEDED, http: 422, condition: "Decking the load would push aggregate DECKED scaled_mbf over 500" }
  - { id: ERR_DUPLICATE_LOAD_IN_RUN, http: 422, condition: "log_load_ids contains a duplicate or a load already attached to another PLANNED run" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Order placement/allocance references a contract not in ACTIVE status" }
  - { id: ERR_CONTRACT_VOLUME_EXCEEDED, http: 422, condition: "Order volume exceeds contract remaining_mbf, or amendment would drop committed_mbf below reserved_mbf" }
  - { id: ERR_NO_PRICE_LIST, http: 422, condition: "No effective PriceList row for the order's (species, grade) at placement time" }
  - { id: ERR_INSUFFICIENT_STAMPED_VOLUME, http: 422, condition: "Eligible STAMPED pool sums below order volume_mbf" }
  - { id: ERR_INSUFFICIENT_BYPRODUCT, http: 422, condition: "Byproduct sale volume exceeds on-hand tons for the product" }
  - { id: ERR_PRODUCT_MISMATCH, http: 422, condition: "Species/grade mismatch: kiln charge vs packages, or order vs contract" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Scaler
    description: "Log yard scaler: receives, scales, disputes, decks and undecks log loads"
    identity: opaque
    exclusive_operations: ["POST /api/log-loads", "POST /api/log-loads/{id}/scale", "POST /api/log-loads/{id}/dispute", "POST /api/log-loads/{id}/deck", "POST /api/log-loads/{id}/undeck"]
    shared_operations: ["GET endpoints"]
  - name: Sawyer
    description: "Saw line operator: plans and completes sawing runs"
    identity: opaque
    exclusive_operations: ["POST /api/sawing-runs", "POST /api/sawing-runs/{id}/complete"]
    shared_operations: ["GET endpoints"]
  - name: KilnOperator
    description: "Kiln operator: schedules, starts, completes and aborts kiln charges"
    identity: opaque
    exclusive_operations: ["POST /api/kiln-charges", "POST /api/kiln-charges/{id}/start", "POST /api/kiln-charges/{id}/complete", "POST /api/kiln-charges/{id}/abort"]
    shared_operations: ["GET endpoints"]
  - name: Grader
    description: "Lumber grader: stamps and re-stamps package grades"
    identity: opaque
    exclusive_operations: ["POST /api/lumber-packages/{id}/grade-inspections"]
    shared_operations: ["GET endpoints"]
  - name: SalesRep
    description: "Sales representative: places/allocates/ships/cancels orders and sells byproducts"
    identity: opaque
    exclusive_operations: ["POST /api/sales-orders", "POST /api/sales-orders/{id}/allocate", "POST /api/sales-orders/{id}/ship", "POST /api/sales-orders/{id}/cancel", "POST /api/byproduct-sales"]
    shared_operations: ["GET endpoints"]
  - name: MillManager
    description: "Mill manager: resolves scale disputes, publishes price lists, owns contracts, runs ops checkpoints and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /api/log-loads/{id}/resolve-scale", "POST /api/price-lists", "POST /api/sales-contracts", "POST /api/sales-contracts/{id}/activate", "PUT /api/sales-contracts/{id}", "POST /api/ops/runs", "POST /api/_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
