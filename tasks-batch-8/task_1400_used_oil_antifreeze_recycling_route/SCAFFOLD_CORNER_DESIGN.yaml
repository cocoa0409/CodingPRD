            - { call: "POST /recycle-routes/routes", payload: { route_code: "OCC1", scheduled_date: "2026-08-05", driver_id: "${drv}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rid: "$.data.id", rv1: "$.data.version" } }
            # First stop: succeeds, bumps Route.version from 1 to 2
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rv1}" }, as: RoutePlanner, captures: { s1: "$.data.id" } }
          trigger:
            # Second stop using STALE expected_route_version=1 (current is 2)
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "10:00", scheduled_window_end: "11:00", sequence: 2, estimated_volume_gallons: 50, expected_route_version: "${rv1}" }, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

