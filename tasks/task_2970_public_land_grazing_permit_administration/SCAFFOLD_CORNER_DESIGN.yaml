              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p5_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Payment Cascade Ranch", contact_email: "paycascade@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m10_id: "$.data.id" }
            - call: "POST /permittees/${c_m10_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T36N R57E Sec 14 SW", carrying_capacity_aums: 250, controlled_since_date: "2010-03-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp8_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a24_id}", permittee_id: "${c_m10_id}", base_property_id: "${c_bp8_id}", requested_aums: 200, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_g5_id: "$.data.id" }
            - call: "POST /grazing-permits/${c_g5_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${c_g5_id}", grazing_year: 2026, authorized_aums: 100, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_aoi4_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${c_aoi4_id}/use-records"
              payload: { pasture_id: "${c_p5_id}", planned_entry_date: "2026-05-01", planned_exit_date: "2026-06-01", planned_head_count: 60, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_ur4_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${c_aoi4_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /pasture-use-records/${c_ur4_id}/report-actual-use"
              payload: { actual_entry_date: "2026-05-01", actual_exit_date: "2026-06-01", actual_head_count: 60 }
              as: Permittee
              as_user_id: "${c_m10_id}"
            - call: "POST /annual-operating-instructions/${c_aoi4_id}/accept-use-report"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { aoi_id: "${c_aoi4_id}", bill_type: "FINAL_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_b1_id: "$.data.items[0].id" }
          trigger:
            - call: "POST /grazing-bills/${c_b1_id}/payments"
              payload: { amount_cents: 10664 }
              as: Permittee
              as_user_id: "${c_m10_id}"
          assert:
            - "before the trigger: GrazingBill.${c_b1_id}.total_amount_cents == 10664 (62 x 172 base, admin fee 0 because 10664 < 50000) and Permittee.${c_m10_id}.outstanding_balance_cents == 10664"
            - "before the trigger: the PRELIMINARY_USE bill of the same AOI is \"VOIDED\" with superseded_bill_id set, and AnnualOperatingInstruction.${c_aoi4_id}.aoi_status == \"BILLED\""
            - "HTTP 201 and GrazingBill.${c_b1_id}.bill_status == \"PAID\" with amount_paid_cents == 10664"
            - "Permittee.${c_m10_id}.outstanding_balance_cents == 0 and permittee_status == \"IN_GOOD_STANDING\""
            - "GrazingPermit.${c_g5_id}.account_status == \"CURRENT\" and permit_status is still \"ISSUED\""
            - "AnnualOperatingInstruction.${c_aoi4_id}.aoi_status == \"CLOSED\""
            - "PastureUseRecord.${c_ur4_id}.record_status == \"ACCEPTED\" with actual_aums == 62.00"

      - name: corner_project_terminated_when_allotment_closes
        claim_type: side_effect_execution
        grounds:
          - state_machines.RangeImprovementProject.APPROVED_to_TERMINATED
          - state_machines.Allotment.OPEN_to_CLOSED
        distinguishing_aspect: "A FULL_CLOSURE order closes the allotment and, as a transitive side effect of that same request, moves every APPROVED range improvement project on it to TERMINATED — a state change on an entity the caller never named."
        test_recipe:
          setup:
            - "One allotment with an APPROVED water development project"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Project Termination Allotment", admin_unit_code: "NV-127", acres: 18500, total_permitted_aums: 680, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a25_id: "$.data.id" }
            - call: "POST /range-improvement-projects"
              payload: { allotment_id: "${c_a25_id}", project_type: "WATER_DEVELOPMENT", total_cost_cents: 400000, agency_share_pct: 0.6, permittee_share_pct: 0.4, maintenance_responsibility: "PERMITTEE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_pr1_id: "$.data.id" }
            - call: "POST /range-improvement-projects/${c_pr1_id}/approve"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          trigger:
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a25_id}", order_type: "FULL_CLOSURE", effective_start_date: "2026-08-10", effective_end_date: "2026-12-31", justification: "Allotment closed for the remainder of the year pending land health review." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co2_id: "$.data.id" }
          assert:
            - "before the trigger: RangeImprovementProject.${c_pr1_id}.project_status == \"APPROVED\" with permittee_share_cents == 160000 (400000 x 0.4) and allocated_share_cents == 0"
            - "HTTP 201 and ClosureOrder.${c_co2_id}.order_status == \"ACTIVE\" with reduction_pct == 1.0"
            - "Allotment.${c_a25_id}.allotment_status == \"CLOSED\" and stocking_adjustment_pct == 1.0000 and effective_capacity_aums == 0"
            - "RangeImprovementProject.${c_pr1_id}.project_status == \"TERMINATED\" and permittee_share_cents is still 160000 and allocated_share_cents is still 0"
            - "POST /range-improvement-projects/${c_pr1_id}/allocate-cost-share now returns HTTP 409 with data.error_id == \"ERR_PROJECT_STATE_INVALID\""

      - name: corner_clock_advance_expires_closure_order_and_restores_capacity
        claim_type: side_effect_execution
        grounds:
          - state_machines.ClosureOrder.ACTIVE_to_EXPIRED
          - endpoints.POST_/_clock/set_current_utc
          - calculations.emergency_reduction_reallocation
        distinguishing_aspect: "Advancing the logical clock past a closure order's effective_end_date expires it and re-runs the reallocation cascade with no domain call at all: stocking_adjustment_pct falls back to 0.0, effective_capacity_aums returns to 800 and the allotment posture returns from RESTRICTED to OPEN."
        test_recipe:
          setup:
            - "One 800-AUM allotment under an ACTIVE DROUGHT_REDUCTION order of 0.25 that ends 2026-08-20"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Clock Expiry Allotment", admin_unit_code: "NV-128", acres: 22500, total_permitted_aums: 800, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a26_id: "$.data.id" }
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a26_id}", order_type: "DROUGHT_REDUCTION", effective_start_date: "2026-08-05", effective_end_date: "2026-08-20", justification: "Short-duration drought reduction while forage recovers.", reduction_pct: 0.25 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co3_id: "$.data.id" }
            - call: "GET /allotments/${c_a26_id}"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a26_ver: "$.data.version" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
          assert:
            - "before the trigger: Allotment.${c_a26_id}.stocking_adjustment_pct == 0.2500, effective_capacity_aums == 600 (floor(800 x 0.75)) and allotment_status == \"RESTRICTED\""
            - "HTTP 200 (the response body is null — nothing is captured from this endpoint)"
            - "ClosureOrder.${c_co3_id}.order_status == \"EXPIRED\""
            - "Allotment.${c_a26_id}.stocking_adjustment_pct == 0.0 and effective_capacity_aums == 800 and open_aums == 800"
            - "Allotment.${c_a26_id}.allotment_status == \"OPEN\" and version == ${c_a26_ver} + 1"
            - "Allotment.${c_a26_id}.current_grazing_year == 2026"

      - name: corner_permit_two_status_dimensions_move_independently
        claim_type: state_shape_parallel
        grounds:
          - state_machines.GrazingPermit.parallel_dimensions
        excluded_because:
          difficulty_instance: permit_parallel_status_dimensions
          rationale: "The §1.8 instance permit_parallel_status_dimensions already drives permit_status and account_status apart on the same permit (a delinquent bill flips account_status to DELINQUENT while permit_status stays ISSUED, and a SUSPENSION decision flips permit_status to SUSPENDED while account_status stays CURRENT) and asserts both fields after every hop, so a separate corner test would restate it."

      - name: corner_appeal_remand_ceiling_enforced
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AppealCase.UNDER_REVIEW_to_REMANDED
          - errors.ERR_APPEAL_REMAND_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: appeal_remand_cycle_bounded_at_two
          rationale: "The §1.8 instance appeal_remand_cycle_bounded_at_two walks the full remand loop twice, asserts remand_count 1 then 2 and shows the third REMAND rejected with ERR_APPEAL_REMAND_LIMIT_EXCEEDED while an AFFIRM on the same case still succeeds; the non-linear ceiling has no residue left to probe."

      - name: corner_trespass_bill_void_returns_incident_to_detected
        claim_type: side_effect_execution
        grounds:
          - state_machines.TrespassIncident.BILLED_to_DETECTED
          - endpoints.POST_/grazing-bills/{billId}/void
        excluded_because:
          difficulty_instance: cents_conservation_on_trespass_bill_void
          rationale: "The §1.8 instance cents_conservation_on_trespass_bill_void voids the UNAUTHORIZED_USE bill and asserts the whole compensating unwind — incident_status back to DETECTED, the permittee balance back to its exact pre-bill value and billed_trespass_incident_count NOT decremented — which subsumes the plain transition claim."

      - name: corner_stayed_decision_cannot_be_made_effective
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PermitDecision.FINAL_to_EFFECTIVE
          - errors.ERR_DECISION_STAYED
        excluded_because:
          difficulty_instance: decision_effectiveness_gated_by_appeal_stay
          rationale: "The §1.8 instance decision_effectiveness_gated_by_appeal_stay already shows make-effective refused with ERR_DECISION_STAYED on a STAYED decision, the allotment untouched, and the cascade firing only once the appeal is AFFIRMED — the cross-entity state dependency is fully covered."

      - name: corner_closure_order_runs_full_reallocation_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.Allotment.OPEN_to_RESTRICTED
          - calculations.emergency_reduction_reallocation
        excluded_because:
          difficulty_instance: drought_closure_five_hop_cascade
          rationale: "The §1.8 instance drought_closure_five_hop_cascade asserts every hop of the closure cascade with author-computed literals (allotment pct and capacity, AOI re-authorization from the issue-time snapshot, REVISED_USE bill supersession, permittee balance, permit account_status); a corner restatement would duplicate it hop for hop."

      - name: corner_appeal_reversal_vacates_and_restores
        claim_type: side_effect_execution
        grounds:
          - state_machines.PermitDecision.EFFECTIVE_to_VACATED
          - state_machines.AppealCase.UNDER_REVIEW_to_REVERSED
        excluded_because:
          difficulty_instance: appeal_reversal_restoration_cascade
          rationale: "The §1.8 instance appeal_reversal_restoration_cascade drives the REVERSE outcome and asserts the reverse cascade back to pre_decision_adjustment_pct, including the restored AOI authorization and the re-superseded bills, so the transitive unwind is already pinned."

  - section: calculations
    instances:
      - name: corner_planned_aums_uses_livestock_factor_and_half_open_days
        claim_type: correct_result
        grounds:
          - calculations.use_record_aums
        distinguishing_aspect: "planned_aums = round_half_up(head_count * ANIMAL_UNIT_EQUIVALENT * days / 30, 2) with days counted on the HALF-OPEN window: 500 sheep for 2026-05-01..2026-05-31 is 30 days at 0.2 = 100.00 AUMs, and 40 horses over the same window is 50.00 AUMs at 1.25 — not 500 and 40."
        test_recipe:
