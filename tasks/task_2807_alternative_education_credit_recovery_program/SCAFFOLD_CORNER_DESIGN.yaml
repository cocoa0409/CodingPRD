            - call: "POST /support-sessions"
              payload: { support_provider_id: "${prv_a}", placement_id: "${pl_id}", start_at: "2026-08-06T13:00:00.000Z", end_at: "2026-08-06T14:00:00.000Z", service_code: "ACADEMIC_COUNSELING" }
              as: PlacementCoordinator
