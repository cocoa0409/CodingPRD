              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_b_id: $.data.id }
            - call: "POST /rmd/customers/${cust_b_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_b_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_b_id}/origination-actions"
