            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2b: "$.data.sample_case_ids" } }
