              payload: { plugfest_id: "${pf_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "After two registrations by M1, Plugfest.${pf_id}.distinct_vendor_count == 1 - it is a COUNT(DISTINCT member_id), not a participation count"
            - "The lock at that point returns 409 ERR_INSUFFICIENT_DISTINCT_VENDORS and leaves state == \"REGISTRATION_OPEN\" with locked_at null"
            - "After M2 registers, distinct_vendor_count == 2 and the same lock returns 200 with state == \"LOCKED\" and locked_at == \"2026-09-01T00:00:00Z\" - exactly min_distinct_vendors is sufficient (`<` gate)"
            - "GET /plugfest-participations?plugfest_id=${pf_id} returns total_count == 3 with data[0].id == ${pp1_id} (created_at ASC) - three participations, two vendors"

      - name: penalty_bands_are_marginal_across_the_hundred_and_thousand_breakpoints
        claim_type: correct_result
        grounds:
          - calculations.noncompliance_penalty_assessment
          - endpoints[POST /noncompliance-cases]
          - state_machines['CertificationListing#compliance_status'].transitions.REMEDIATED_to_UNDER_INVESTIGATION
        distinguishing_aspect: >
          Three cases priced on the same listing at 100, 101 and 1200 impact units. Marginal banding
          gives 50000, 50300 and 350000 cents of subtotal; an average-rate implementation that picks
          one rate for the whole quantity would give 50000, 30300 and 180000. The listing is walked
          back to REMEDIATED between cases, which is legal because the compliance axis is cyclic.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY, 20 cases); AUTHORIZED laboratory with 2 benches."
            - "Member M1 in good standing with 1000000 cents of credit; one submission carried to REVIEW_COMPLETE through a single on-time PASS session (FINAL readiness 85.00)."
            - "An UNPUBLISHED listing on that submission - opening a case needs compliance_status COMPLIANT only, not publication."
            - "Clock parked at 2026-09-02T12:00:00Z after the session completes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
