          assert:
            - "trigger[0]: HTTP 201, status == 'RECEIVED'"
            - "trigger[1]: status == 'READINESS_COLLECTION', readiness_standardized == false — the new package revoked the attestation before any scoring"
            - "trigger[2]: HTTP 409, data.error_id == 'ERR_INSTITUTION_NOT_READY'"
            - "trigger[3]: HTTP 200, status == 'REJECTED', standardization_score_bps == floor(97 * 10000 / 100) == 9700, deposit_total_variance_bps == 0, rejection_reason == 'SCORE_BELOW_FLOOR'"
            - "trigger[4]: HTTP 409, data.error_id == 'ERR_INSTITUTION_NOT_READY' — a rejected package leaves the institution exactly where it was"
            - "trigger[6]: HTTP 200, status == 'STANDARDIZED', standardization_score_bps == floor(98 * 10000 / 100) == 9800 — the floor passes on equality"
            - "trigger[7]: HTTP 200, status == 'CLOSED_IN_RECEIVERSHIP', readiness_standardized == true, failure_datetime == '2026-08-03T09:00:00Z'"
            - "trigger[8]: 3 rows, total_count == 3, statuses are STANDARDIZED / REJECTED / STANDARDIZED in creation order — terminal submissions are never rewritten"

      - name: dual_variant_layer_insured_amount_divergence
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.depositor_insurance_determination.variants
        excluded_because:
          difficulty_instance: alice_category_pooled_vs_per_account_insured_divergence
          rationale: "§1.8 already prepares the same account set under both method_variant values and asserts the divergent insured/uninsured split plus the certificate face that follows from each, which is exactly the Variant Divergence row for this calculation."

      - name: dual_variant_layer_least_cost_variant_flips_the_award
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.bid_evaluated_cost.variants
        excluded_because:
          difficulty_instance: bid_evaluation_variant_flips_least_cost_winner
          rationale: "§1.8 already evaluates the identical bid field under both test_variant values and shows the winner changing, covering both Variant Divergence and Variant Selection for the least-cost test."

      - name: cascading_side_effects_layer_certify_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /insurance-determinations/{id}/certify]
        excluded_because:
          difficulty_instance: certify_cascade_five_levels_determination_to_notice
          rationale: "§1.8 walks all five levels of the certify cascade end-to-end in one request and asserts every level, including the ordering-sensitive hold placement that depends on the freshly written insured amounts."

      - name: cascading_side_effects_layer_award_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /institutions/{id}/least-cost-test/award]
        excluded_because:
          difficulty_instance: award_cascade_four_levels_bid_to_branch_ready
          rationale: "§1.8 walks all four levels of the award cascade (bid -> institution -> accounts -> branch) in one request, including the branch's dependence on an account having transitioned in that same request."

      - name: rate_threshold_layer_smdia_cap_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.depositor_insurance_determination.constants
        excluded_because:
          difficulty_instance: smdia_cap_boundary_below_at_and_above_on_certify
          rationale: "§1.8 already certifies three depositors sitting one cent below, exactly at, and one cent above SMDIA_CENTS = 25000000 and asserts the insured/uninsured split and certificate issuance at each point."

  - section: consistency_model
    coverage_note: |
      consistency_model is `immediate`, so the single claim to prove is that no derived or
      denormalized value ever lags: both multi-level cascades must be fully observable in the
      response that caused them and in any read issued immediately afterwards by any role,
      with no re-read delay and no eventual-consistency window.
    instances:
      - name: certify_publishes_every_derived_field_in_the_same_request_with_no_read_delay
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /insurance-determinations/{id}/certify]
          - calculations.institution_aggregate_reconciliation.formula
        distinguishing_aspect: "Certify writes across five entities, and every one of those writes is visible to the very next read with no intervening request: the determination, the account's two status dimensions and held_amount_cents, the freshly issued certificate, the depositor's certified_* denormalizations and notice, and the institution's aggregates all reconcile immediately, and re-reading them a second time returns identical values (the read is not what settles them)."
        test_recipe:
          setup:
            - "Institution 61088 is CLOSED_IN_RECEIVERSHIP with depositor Cora holding one SINGLE account of 30000000, and her determination is UNDER_REVIEW under AGGREGATE_BY_CATEGORY (insured 25000000, uninsured 5000000)."
            - "nothing has been certified yet: the account is FROZEN_FOR_DETERMINATION / hold NONE, no certificate exists, notice_status is PENDING, and the institution's aggregate_insured_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61088", legal_name: "Immediate Certify Bank", charter_state: "OK", book_asset_value_cents: 40000000, estimated_liquidation_recovery_cents: 15000000 }
              as: ClosingManager
              captures: { ic_inst_id: $.data.id }
            - call: "POST /institutions/${ic_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-IC-1", legal_name: "Cora Lindqvist", depositor_type: "NATURAL_PERSON", contact_email: "cora@example.com" }
              as: ClaimsAgent
              captures: { ic_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${ic_inst_id}", primary_depositor_id: "${ic_dep_id}", account_number: "IC-0001", ownership_category: "SINGLE", balance_cents: 30000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { ic_acct_id: $.data.id }
            - call: "POST /institutions/${ic_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 30000000 }
              as: ClosingManager
              captures: { ic_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${ic_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${ic_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${ic_dep_id}"
              as: ClaimsAgent
              captures: { ic_dep_ver: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${ic_dep_id}", expected_depositor_record_version: "${ic_dep_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AE"
              captures: { ic_det_id: $.data.id }
            - call: "POST /insurance-determinations/${ic_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AE"
            - call: "POST /insurance-determinations/${ic_det_id}/submit-review"
              as: ClaimsAgent
              as_user_id: "U-AGENT-AE"
          trigger:
            - call: "POST /insurance-determinations/${ic_det_id}/certify"
              as: ClaimsCertifier
              as_user_id: "U-CERT-AE"
            - call: "GET /deposit-accounts/${ic_acct_id}"
              as: ClaimsAgent
            - call: "GET /receivership-certificates"
              payload: { depositor_record_id: "${ic_dep_id}" }
              as: ClaimsAgent
              captures: { ic_cert_id: "$.data[0].id" }
            - call: "GET /depositor-records/${ic_dep_id}"
              as: Depositor
              as_user_id: "${ic_dep_id}"
            - call: "GET /institutions/${ic_inst_id}/insurance-summary"
              as: ReceivershipTrustee
            - call: "GET /receivership-certificates/${ic_cert_id}"
              as: ClaimsCertifier
            - call: "GET /institutions/${ic_inst_id}/insurance-summary"
              as: ReceivershipTrustee
          assert:
            - "trigger[0]: HTTP 200, status == 'CERTIFIED', insured_amount_cents == 25000000, uninsured_amount_cents == 5000000, certified_by_user_id == 'U-CERT-AE', certified_at == '2026-08-03T09:00:00Z' — the response itself already carries the certified position"
            - "trigger[1]: insurance_status == 'DETERMINED', hold_status == 'HELD', held_amount_cents == 5000000, attributed_amount_cents == 30000000 — visible on the first read after certify"
            - "trigger[2]: 1 row, total_count == 1, \"$.data[0].face_amount_cents\" == 5000000, \"$.data[0].status\" == 'ISSUED', \"$.data[0].issued_at\" == '2026-08-03T09:00:00Z'"
            - "trigger[3]: certified_insured_cents == 25000000, certified_uninsured_cents == 5000000, notice_status == 'SENT', notice_template_code == 'PARTIALLY_UNINSURED', notice_sent_at == '2026-08-03T09:00:00Z'"
            - "trigger[4]: aggregate_insured_cents == 25000000, aggregate_certificate_face_cents == 5000000, uninsured_claim_count == 1, held_amount_total_cents == 5000000, conservation_delta_cents == 0, cash_conservation_delta_cents == 0"
            - "trigger[5]: cumulative_dividends_cents == 0, last_dividend_round == 0 — the certificate is issued but untouched"
            - "trigger[6]: byte-identical to trigger[4]'s payload apart from meta — repeated reads do not settle or drift the aggregates"

      - name: the_award_cascade_is_visible_to_every_role_immediately_after_the_awarding_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /institutions/{id}/least-cost-test/award]
          - state_machines.BranchReopening.PLANNED_to_READY
        distinguishing_aspect: "The award mutates four entity families at once, and each is immediately readable by the role that owns it: the ResolutionAnalyst sees the bid as WINNER, the ClosingManager sees the branch flipped to READY by the same request that transferred the account, the ClaimsAgent sees transition_status TRANSFERRED, and the ReceivershipTrustee sees least_cost_status AWARDED with resolution_method WHOLE_BANK_PA and the liquidation baseline recorded — with no read-after-write lag anywhere."
        test_recipe:
          setup:
            - "Institution 61089 (book 12000000, estimated recovery 6000000) is CLOSED_IN_RECEIVERSHIP with depositor Dmitri (SINGLE 20000000, CERTIFIED): insured 20000000, uninsured 0, hold NONE, aggregate_insured_cents 20000000."
            - "branch BR-A01 is PLANNED for [2026-08-14T09:00:00Z, 2026-08-14T17:00:00Z) with staffing_headcount 6."
            - "franchise marketing is OPEN with deadline 2026-08-12T00:00:00Z and QUALIFIED Bidder Halcyon Acquirer (62016) submitted a WHOLE_BANK_PA bid at premium 200 bps / discount 1500 bps / retention 0."
            - "the least-cost test was evaluated under EXPECTED_LOSS_SHARE: asset_bid_value round_half_up(12000000 * 8500 / 10000) = 10200000, premium round_half_up(20000000 * 200 / 10000) = 400000, evaluated_cost_cents 20000000 - 10200000 - 400000 = 9400000; the baseline is insured_share_bps floor(20000000 * 10000 / 20000000) = 10000, subrogated round_half_up(6000000 * 10000 / 10000) = 6000000, liquidation_baseline_cents 20000000 + 150000 - 6000000 = 14150000, so the bid is CONFORMING and beats the baseline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61089", legal_name: "Immediate Award Bank", charter_state: "UT", book_asset_value_cents: 12000000, estimated_liquidation_recovery_cents: 6000000 }
              as: ClosingManager
              captures: { ia_inst_id: $.data.id }
            - call: "POST /institutions/${ia_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-IA-1", legal_name: "Dmitri Kovalenko", depositor_type: "NATURAL_PERSON", contact_email: "dmitri@example.com" }
              as: ClaimsAgent
              captures: { ia_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${ia_inst_id}", primary_depositor_id: "${ia_dep_id}", account_number: "IA-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { ia_acct_id: $.data.id }
            - call: "POST /institutions/${ia_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 20000000 }
              as: ClosingManager
              captures: { ia_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${ia_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${ia_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${ia_dep_id}"
              as: ClaimsAgent
              captures: { ia_dep_ver: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${ia_dep_id}", expected_depositor_record_version: "${ia_dep_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AF"
              captures: { ia_det_id: $.data.id }
            - call: "POST /insurance-determinations/${ia_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AF"
            - call: "POST /insurance-determinations/${ia_det_id}/submit-review"
              as: ClaimsAgent
              as_user_id: "U-AGENT-AF"
            - call: "POST /insurance-determinations/${ia_det_id}/certify"
              as: ClaimsCertifier
              as_user_id: "U-CERT-AF"
            - call: "POST /institutions/${ia_inst_id}/branch-reopenings"
              payload: { branch_code: "BR-A01", reopen_window_start: "2026-08-14T09:00:00Z", reopen_window_end: "2026-08-14T17:00:00Z", staffing_headcount: 6 }
              as: ClosingManager
              captures: { ia_branch_id: $.data.id }
            - call: "POST /institutions/${ia_inst_id}/franchise-marketing"
              payload: { marketing_action: "OPEN", bid_deadline_at: "2026-08-12T00:00:00Z" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Halcyon Acquirer", cert_number: "62016", tier1_capital_ratio_bps: 2300, camels_composite: 1 }
              as: ResolutionAnalyst
              captures: { ia_bidder_id: $.data.id }
            - call: "POST /bidders/${ia_bidder_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
            - call: "POST /bids"
              payload: { institution_id: "${ia_inst_id}", bidder_id: "${ia_bidder_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 200, asset_discount_bps: 1500, asset_retention_pool_cents: 0, data_room_window_start: "2026-08-06T09:00:00Z", data_room_window_end: "2026-08-06T10:00:00Z" }
              as: Bidder
              as_user_id: "${ia_bidder_id}"
              captures: { ia_bid_id: $.data.id }
            - call: "POST /institutions/${ia_inst_id}/least-cost-test/evaluate"
              payload: { test_variant: "EXPECTED_LOSS_SHARE" }
              as: ResolutionAnalyst
          trigger:
            - call: "POST /institutions/${ia_inst_id}/least-cost-test/award"
              as: ResolutionAnalyst
            - call: "GET /bids/${ia_bid_id}"
              as: ResolutionAnalyst
            - call: "GET /branch-reopenings/${ia_branch_id}"
              as: ClosingManager
            - call: "GET /deposit-accounts/${ia_acct_id}"
              as: ClaimsAgent
            - call: "GET /institutions/${ia_inst_id}"
              as: ReceivershipTrustee
            - call: "GET /institutions/${ia_inst_id}/branch-reopenings"
              payload: { status: "READY" }
              as: Depositor
              as_user_id: "${ia_dep_id}"
            - call: "GET /institutions/${ia_inst_id}/insurance-summary"
              as: Bidder
              as_user_id: "${ia_bidder_id}"
          assert:
            - "trigger[0]: HTTP 200, status == 'RESOLUTION_COMPLETE', least_cost_status == 'AWARDED', resolution_method == 'WHOLE_BANK_PA', liquidation_baseline_cents == 14150000, conforming_bid_count == 1 — the awarding response already reflects the whole cascade"
            - "trigger[1]: status == 'WINNER', evaluated_cost_cents == 9400000, assumed_deposit_base_cents == 20000000, pre_fee_cost_cents == 9400000, loss_share_fee_cents == 0"
            - "trigger[2]: status == 'READY', reschedule_count == 0, reopened_at is null — the branch was flipped by the same request that transferred the account"
            - "trigger[3]: transition_status == 'TRANSFERRED', insurance_status == 'DETERMINED', hold_status == 'NONE'"
            - "trigger[4]: status == 'RESOLUTION_COMPLETE', least_cost_test_variant == 'EXPECTED_LOSS_SHARE'"
            - "trigger[5]: 1 row, total_count == 1, \"$.data[0].id\" == '${ia_branch_id}' — the cascade is equally visible to a role that took no part in it"
            - "trigger[6]: aggregate_insured_cents == 20000000, uninsured_claim_count == 0, held_amount_total_cents == 0, conservation_delta_cents == 0, cash_conservation_delta_cents == 0"
