            - "LoadPlan.${lp1}.envelope_ok == true (evaluated against the unreduced aft limit 28.0, because 52100.00 <= 60000)"
            - "Flight.${f1}.status == LOAD_CONTROLLED"

      - name: lmc_allowance_exact_boundary
        metric: "the cumulative last-minute-change admission test lmc_absolute_weight_delta_kg + abs(weight_delta_kg) <= lmc_allowance_kg at exact equality"
        endpoint: "POST /last-minute-changes"
        boundary: "allowance 300.00 kg (min(500, underload 300.00)) against a 300.00 kg bag addition, then against 301.00 kg"
        grounds:
          - calculations.calculate_lmc_allowance
          - validations.priority_36
          - entities.LoadSheet.fields.lmc_allowance_kg
        distinguishing_aspect: |
          A fourth metric on a fourth endpoint, and the only boundary in this
          scaffold that is a cumulative budget rather than a single comparison:
          the allowance itself is a clamped minimum of two very different numbers
          (the 500 kg hard cap and the plan's 300.00 kg underload), and the
          admission test is inclusive, so 300.00 kg is admitted and 301.00 kg is
          refused with no partial application. The refused call must leave
          lmc_absolute_weight_delta_kg at 300.00, not 601.00.
        test_recipe:
          setup:
            - "The gate-bag fixture's airframe, runway, single [30, 45) band and STANDARD program, on a flight at 30 C / 6 kt / WET -> allowed_payload_kg 13020.00."
            - "Plan: OC 60 male = 5280.00, H1 bags 4500.00, H4 general cargo 2940.00 -> base_payload_kg 12720.00, underload_kg 300.00."
