            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /skus", payload: { name: "St2 Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 4900 }, as: InventoryManager, captures: { sku_b: $.data.id } }
            - { call: "POST /skus/${sku_b}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_b}", lot_code: "LB", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_b: $.data.id, lot_b_v: $.data.version } }
            - { call: "POST /lots/${lot_b}/release", payload: { expected_lot_version: "${lot_b_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_b}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "st@x.com", full_name: "St", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id, sub_v0: $.data.version } }
            - { call: "POST /subscriptions/${sub_id}/swap", payload: { pending_swap_sku_id: "${sku_b}", expected_subscription_version: "${sub_v0}" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/swap", payload: { pending_swap_sku_id: "${sku_a}", expected_subscription_version: "${sub_v0}" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_STALE_VERSION", "http status == 412"]

      - name: occ_lot_release_excluded_difficulty
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lot-release-stale-lot]"]
        excluded_because:
          difficulty_instance: cascade_recall_sku_subscription_autopause
          rationale: "Lot.version OCC dynamics are exercised across the §1.8 cascade instances that release and recall lots; the stale-lot OCC path shares the same write_endpoint mechanics as the swap OCC corner already covered here."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_reserve_total_visible_in_same_response
        claim_type: immediate
        grounds: ["calculations.order_total", "state_machines.Order.DRAFT_to_RESERVED"]
        distinguishing_aspect: "The reserve response itself carries the computed total_cents (immediate consistency) — no second read needed."
        test_recipe:
          setup: ["A DRAFT order with one ambient line (unit 1200 qty 3 -> subtotal 3600 < 5000 tier, zone Z1)."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Imm Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1200 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "imm@x.com", full_name: "Imm", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 3 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total: $.data.total_cents } }
          assert:
            - "the reserve response data.total_cents == 4100 (3600 subtotal + 0 discount + 0 handling + 500 Z1 shipping)"
