        distinguishing_aspect: "An operator-initiated campaign pause cascades to the SERVING child with pause_reason MANUAL and stamps last_pause_at at the logical clock 2026-08-01T00:00:00Z; PAUSED remains a reserving status so reserved_cents stays 1000000."
        test_recipe:
          setup: ["Baseline chain through line item activation (Campaign DELIVERING, LineItem SERVING)."]
          setup_api_calls:
