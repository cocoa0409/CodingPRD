      - name: chair_rotation_guarded_by_the_owning_ensembles_roster_state
        claim_type: guarded_transitions
        grounds:
          - endpoints[POST /section-quotas/{quotaId}/rotate-chairs]
          - validations[priority=43]
          - errors[ERR_ENSEMBLE_NOT_SEATED]
        distinguishing_aspect: |
          rotate-chairs is not a free action on a section: the guard reads the parent
          Ensemble, and with the VIOLIN quota only BALANCED (2 of target 3) the ensemble is
          still FORMING, so the call is refused with ERR_ENSEMBLE_NOT_SEATED (409) even
          though the OCC token is fresh and the section holds two rotatable ACTIVE chairs.
          rotation_cycle_index must stay 0 and no successor seat may be minted.
        test_recipe:
          setup:
            - "Season in PLACEMENT; Philharmonic (min_total_size 3) has one VIOLIN quota with"
            - "min 1 / target 3 / max 3 and rotation_policy ROTATING (the default)."
            - "Ada Strings (years_in_org 2) and Ben Bow (years_in_org 1) both accepted offers,"
            - "so filled_count is 2 -> balance_state BALANCED, ensemble roster_state FORMING."
            - "Both auditions scored 81.80, so the chair tie is broken by years_in_org DESC:"
            - "Ada holds chair 1 (principal) and Ben chair 2."
            - "The live Ensemble.version has just been re-read into ${ens_v3}."
