      - name: deployment_and_encounter_gate_codes_are_each_reachable
        claim_type: error_triggerability
        grounds:
          - validations[priority=14]
          - validations[priority=39]
          - validations[priority=30]
          - validations[priority=16]
          - validations[priority=47]
        distinguishing_aspect: "Walks the deployment/encounter gates in the only order that exposes each one: ERR_DEPLOYMENT_NOT_ACTIVE before activation, three ERR_ENCOUNTER_OUTSIDE_WINDOW edges (before window_start, at the exclusive window_end, and after the logical clock), two ERR_DISPOSITION_NOT_SUPPORTED dispositions, then ERR_OPEN_ENCOUNTERS_REMAIN which masks the adequacy rule until the encounter is resolved."
        test_recipe:
          setup:
            - "Designated zone Z1 on line L1 with deployment D1 PLANNED for 2026-08-05T06:00:00Z..14:00:00Z, target_sample_size 5."
            - "Rider R1 and ACTIVE inspector I1 exist; the clock still reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
