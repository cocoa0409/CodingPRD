      - name: org_resume_does_not_revive_children
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Organization.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: org_suspend_cascade_depth3_to_delivery
          rationale: "The final two calls of that instance's trigger resume the org and assert the plan remains SUSPENDED — the asymmetry is pinned there."

  # ===========================================================================
  - section: calculations
    instances:

      - name: usage_accumulates_additively_across_batches
        claim_type: Correct Result
        grounds:
          - calculations.data_usage_posture
          - entities.DataPlan.fields.used_mb
        distinguishing_aspect: "used_mb is a running sum over accepted batches in the cycle: 100 MB then 150 MB yields exactly 250 MB with usage_posture NORMAL (250/20480 far below 0.80)."
        test_recipe:
          setup:
            - "Machine with PROVISIONED modem and ACTIVE STANDARD plan."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
          trigger:
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-1", start_hour_iso: "2026-09-01T00:00:00Z", hour_count: 1, payload_mb: 100 }
              as: System
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-2", start_hour_iso: "2026-09-01T01:00:00Z", hour_count: 1, payload_mb: 150 }
              as: System
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { used: $.data.used_mb, post: $.data.usage_posture }
          assert:
            - "used == 250 and post == \"NORMAL\""

      - name: uptime_window_excludes_records_older_than_720_hours
        claim_type: Input Set Filtering
        grounds:
          - calculations.uptime_prediction
          - calculations.parts_recommendation
        distinguishing_aspect: "A 100-hour batch wholly before the trailing 720-hour window contributes nothing: filled_hours 0, both scores 0.0, and parts_recommendation OVERHAUL_KIT (0.0 < 70.0)."
        test_recipe:
          setup:
            - "Connected machine; clock advanced to 2026-10-01T00:00:00Z (window starts 2026-09-01T00:00:00Z); one batch at 2026-08-15 for 100 hours."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-old", start_hour_iso: "2026-08-15T00:00:00Z", hour_count: 100, payload_mb: 10 }
              as: System
          trigger:
            - call: "GET /agdata/machines/${machine_id}/uptime-prediction"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { filled: $.data.filled_hours, cons: $.data.conservative_score, parts: $.data.parts_recommendation }
          assert:
            - "filled == 0 (the batch is entirely outside the window)"
            - "cons == 0.0 and optimistic_score == 0.0"
            - "parts == \"OVERHAUL_KIT\""

      - name: proration_downgrade_yields_signed_credit
        claim_type: Correct Result
        grounds:
          - calculations.plan_proration
        distinguishing_aspect: "The proration formula is signed: STANDARD->BASIC on a CALENDAR_DAY plan anchored 2026-10-01 and changed 2026-10-15 yields last_proration_charge_cents -15484 (round_half_up(-30000 * 16/31)), a credit, not a clamped zero."
        test_recipe:
          setup:
            - "STANDARD plan (CALENDAR_DAY) activated at clock 2026-10-01T00:00:00Z (anchor day 1), then clock advanced to 2026-10-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *k_plan_act
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/change-tier"
              payload: { new_tier: "BASIC", expected_plan_version: "${plan_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { charge: $.data.last_proration_charge_cents }
          assert:
            - "charge == -15484 (credit on downgrade)"
            - "DataPlan.${plan_id}.tier == BASIC and monthly_price_cents == 30000"

      - name: warranty_age_bracket_boundaries_24_vs_25_months
        claim_type: Constants Applied
        grounds:
          - calculations.warranty_payout_allocation
          - entities.Machine.fields.manufacture_date
        distinguishing_aspect: "The coverage bracket uses whole floored months with an inclusive upper bound: exactly 24 months still gets 0.90, 25 months drops to 0.70 — identical 1000000-cent all-parts claims pay 900000 vs 700000."
        test_recipe:
          setup:
            - "Clock 2026-09-30T00:00:00Z. Machine A manufactured 2024-09-01 (age 24 months floored); machine B manufactured 2024-08-01 (age 25 months). Both IN_SERVICE with 648-hour coverage; each has a SUBMITTED 1000000-cent claim that is entirely parts."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0002", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0002", manufacture_date: "2024-08-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { machine2_id: $.data.id }
            - call: "POST /agdata/machines/${machine2_id}/provision-modem"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - call: "POST /agdata/machines/${machine2_id}/modem-provisioning-events"
              payload: { outcome: "PROVISION_SUCCEEDED" }
              as: System
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine2_id}", tier: "STANDARD", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan2_id: $.data.id }
            - call: "POST /agdata/data-plans/${plan2_id}/activate"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/machines/${machine2_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - *k_ingest648
            - call: "POST /agdata/machines/${machine2_id}/telemetry-ingest"
              payload: { batch_id: "cov-2", start_hour_iso: "2026-08-31T00:00:00Z", hour_count: 648, payload_mb: 50 }
              as: System
            - call: "POST /agdata/warranty-claims"
              payload: { machine_id: "${machine_id}", claim_amount_cents: 1000000, parts_amount_cents: 1000000, description: "Hydraulic pump failure" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /agdata/warranty-claims"
              payload: { machine_id: "${machine2_id}", claim_amount_cents: 1000000, parts_amount_cents: 1000000, description: "Gearbox wear" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { claim2_id: $.data.id }
            - *k_claim_submit
            - call: "POST /agdata/warranty-claims/${claim2_id}/submit"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
          trigger:
            - call: "POST /agdata/warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { pay1: $.data.payout_cents, cov1: $.data.coverage_pct_applied }
            - call: "POST /agdata/warranty-claims/${claim2_id}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { pay2: $.data.payout_cents, cov2: $.data.coverage_pct_applied }
          assert:
            - "cov1 == 0.9 and pay1 == 900000 (age exactly 24 months keeps the top bracket)"
            - "cov2 == 0.7 and pay2 == 700000 (age 25 months drops a bracket)"

      - name: warranty_payout_capped_at_absolute_maximum
        claim_type: Constants Applied
        grounds:
          - calculations.warranty_payout_allocation
        distinguishing_aspect: "PAYOUT_MAX_CENTS 2000000 truncates the allocation: a 5000000-cent all-parts claim at 0.90 coverage computes 4500000 but pays exactly 2000000."
        test_recipe:
          setup:
            - "Clock 2026-09-30T00:00:00Z; IN_SERVICE machine (age 12 months) with 648-hour coverage; SUBMITTED claim of 5000000 cents, all parts."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - *k_ingest648
            - call: "POST /agdata/warranty-claims"
              payload: { machine_id: "${machine_id}", claim_amount_cents: 5000000, parts_amount_cents: 5000000, description: "Engine rebuild" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id }
            - *k_claim_submit
          trigger:
            - call: "POST /agdata/warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { payout: $.data.payout_cents }
          assert:
            - "payout == 2000000 (capped), not 4500000"

      - name: prescription_weighted_average_rounding
        claim_type: Precision
        grounds:
          - calculations.prescription_product_totals
        excluded_because:
          difficulty_instance: prescription_zone_rounding_order
          rationale: "Per-zone rounding order and the 3-decimal weighted average are both asserted there with literals 5.62 / 2.555."

      - name: uptime_variant_divergence_and_parts_keying
        claim_type: Variant Divergence
        grounds:
          - calculations.uptime_prediction
          - calculations.parts_recommendation
        excluded_because:
          difficulty_instance: uptime_prediction_optimistic_vs_conservative
          rationale: "Both variant scores (83.5 vs 83.3) and parts keying on the conservative score are asserted there."

  # ===========================================================================
  - section: validations
    instances:

      - name: unknown_role_header_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A role string that is not a declared role (SuperUser) is rejected with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before anything else is evaluated."
        test_recipe:
          setup:
            - "Empty database; clock default."
          setup_api_calls: []
          trigger:
            - call: "POST /agdata/organizations"
              payload: { name: "Ghost Org", region_code: "US-IA" }
              as: SuperUser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: role_not_on_endpoint_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "A declared role that is not in the endpoint's roles list (Agronomist creating an organization) gets 403 ERR_FORBIDDEN_FOR_ROLE at priority 2, before body validation."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /agdata/organizations"
              payload: { name: "Ghost Org", region_code: "US-IA" }
              as: Agronomist
              as_user_id: "agron-ada"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: scope_gate_denied_granted_then_suspended
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors.ERR_DATA_ACCESS_DENIED
          - entities.DataShareGrant.fields.status
        distinguishing_aspect: "The TELEMATICS gate is grant-state-sensitive: agron-ada reading a machine is 403 ERR_DATA_ACCESS_DENIED with no grant, 200 with an ACTIVE grant, and 403 again once the grant is SUSPENDED."
        test_recipe:
          setup:
            - "One organization with a machine; no grant initially."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
          trigger:
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agron-ada"
              captures: { error_id: $.data.error_id }
            - *k_grant_agr
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agron-ada"
              captures: { serial: $.data.serial_number }
            - call: "POST /agdata/data-share-grants/${grant_id}/suspend"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agron-ada"
              captures: { error_id2: $.data.error_id }
          assert:
            - "the ungranted read returns 403 and error_id == ERR_DATA_ACCESS_DENIED"
            - "the granted read returns 200 with serial == \"SN-0001\""
            - "after suspension the same read returns 403 and error_id2 == ERR_DATA_ACCESS_DENIED"

      - name: prescription_create_with_empty_zones_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - entities.Prescription.fields.zones
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "zones present but empty is a 400 ERR_INVALID_REQUEST (shape), distinct from a missing field and from any state error — it fires before field-version OCC."
        test_recipe:
          setup:
            - "One ACTIVE field (version 2)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_field
            - *k_field_act
          trigger:
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "CORN", zones: [], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /agdata/prescriptions?field_boundary_id=${field_id} returns 0 rows and the field version stays 2"

      - name: prescription_create_with_inverted_window_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "valid_from >= valid_until is a shape-level 400 ERR_INVALID_REQUEST even when both timestamps are individually well-formed."
        test_recipe:
          setup:
            - "One ACTIVE field (version 2)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_field
            - *k_field_act
          trigger:
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "CORN", zones: [{ zone_id: "z1", rate_l_per_ha: 3.00, area_ha: 10.00 }], valid_from: "2026-09-30T00:00:00Z", valid_until: "2026-09-01T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: shape_error_beats_existence_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "A request that is both malformed (out-of-enum tier) and points at unknown ids returns the priority-3 shape error 400 ERR_INVALID_REQUEST, never a 404."
        test_recipe:
          setup:
            - "Empty database (ids in the payload do not exist)."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "00000000-0000-4000-8000-000000000001", machine_id: "00000000-0000-4000-8000-000000000002", tier: "PREMIUM", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST (not 404)"

      - name: multi_zone_send_requires_section_control_license
        claim_type: Conditional validation
        grounds:
          - validations[priority=8]
          - errors.ERR_FEATURE_NOT_LICENSED
          - state_machines.Prescription.APPROVED_to_SENT
        distinguishing_aspect: "The SECTION_CONTROL gate is conditional on payload shape: the same send succeeds once the machine holds an ACTIVATED SECTION_CONTROL license, and single-zone prescriptions never hit the gate at all (covered by the happy-path sends elsewhere)."
        test_recipe:
          setup:
            - "Connected dealer-activated machine; a two-zone APPROVED prescription; no licenses on the machine."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - *k_field
            - *k_field_act
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "CORN", zones: [{ zone_id: "z1", rate_l_per_ha: 2.55, area_ha: 10.00 }, { zone_id: "z2", rate_l_per_ha: 3.10, area_ha: 5.00 }], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { rx2_id: $.data.id }
            - call: "POST /agdata/prescriptions/${rx2_id}/approve"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/prescriptions/${rx2_id}/send-to-machine"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { m_v: $.data.version }
            - call: "POST /agdata/feature-licenses"
              payload: { machine_id: "${machine_id}", feature_code: "SECTION_CONTROL", license_type: "PERPETUAL", expected_machine_version: "${m_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /agdata/feature-licenses/${lic_id}/activate"
              payload: {}
              as: System
            - call: "POST /agdata/prescriptions/${rx2_id}/send-to-machine"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { rx_status: $.data.status }
          assert:
            - "the first send returns 409 and error_id == ERR_FEATURE_NOT_LICENSED"
            - "after purchasing and activating SECTION_CONTROL the send succeeds and rx_status == SENT"
            - "FeatureLicense.${lic_id}.fee_cents == 180000 (first license on the machine, n=1, no discount)"

      - name: rtr_gate_blocks_independent_but_not_dealer
        claim_type: Conditional validation
        grounds:
          - validations[priority=7]
          - errors.ERR_RTR_NOT_ENABLED
          - entities.Organization.fields.right_to_repair_enabled
        distinguishing_aspect: "The right-to-repair flag discriminates by role: an IndependentTechnician consent request in a right_to_repair_enabled == false organization is 403 ERR_RTR_NOT_ENABLED while a DealerTechnician request for the same machine succeeds."
        test_recipe:
          setup:
            - "Default-flag organization (right_to_repair_enabled false) with one machine."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
          trigger:
            - call: "POST /agdata/consent-tickets"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", ticket_type: "REMOTE_DIAGNOSTIC", requester_ref_id: "indep-ivan" }
              as: IndependentTechnician
              as_user_id: "indep-ivan"
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/consent-tickets"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", ticket_type: "REMOTE_DIAGNOSTIC", requester_ref_id: "${dealer_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { dticket_id: $.data.id }
          assert:
            - "the independent request returns 403 and error_id == ERR_RTR_NOT_ENABLED"
            - "the dealer request returns 201 (same machine, same type, different role)"

      - name: delivery_model_mismatch_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_PACKAGE_MODEL_MISMATCH
          - endpoints.POST_/agdata/update-deliveries
        distinguishing_aspect: "A PUBLISHED package targeting model M9X cannot schedule onto an M8R machine: 409 ERR_PACKAGE_MODEL_MISMATCH and no consent ticket is minted."
        test_recipe:
          setup:
            - "Dealer-activated M8R machine; PUBLISHED package targeting M9X."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - call: "POST /agdata/software-packages"
              payload: { package_code: "FW-M9X", target_model_code: "M9X", firmware_version: "4.0.0", size_mb: 500, mandatory: false }
              as: PlatformAdmin
              captures: { pkg9_id: $.data.id }
            - call: "POST /agdata/software-packages/${pkg9_id}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine_id}", package_id: "${pkg9_id}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PACKAGE_MODEL_MISMATCH"
            - "GET /agdata/update-deliveries?machine_id=${machine_id} returns 0 rows"
            - "GET /agdata/consent-tickets?machine_id=${machine_id} returns 0 rows (no ticket minted)"

      - name: duplicate_telemetry_batch_rejected_without_double_counting
        claim_type: Idempotency
        grounds:
          - errors.ERR_DUPLICATE_TELEMETRY_BATCH
          - validations[priority=8]
        distinguishing_aspect: "batch_id is idempotent per machine: resubmitting an accepted batch fails 409 ERR_DUPLICATE_TELEMETRY_BATCH and used_mb does not move (stays 100)."
        test_recipe:
          setup:
            - "Machine with PROVISIONED modem and ACTIVE STANDARD plan; one accepted batch b-dup of 100 MB."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-dup", start_hour_iso: "2026-09-01T00:00:00Z", hour_count: 1, payload_mb: 100 }
              as: System
          trigger:
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-dup", start_hour_iso: "2026-09-01T02:00:00Z", hour_count: 1, payload_mb: 100 }
              as: System
              captures: { error_id: $.data.error_id }
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { used: $.data.used_mb }
          assert:
            - "the duplicate returns 409 and error_id == ERR_DUPLICATE_TELEMETRY_BATCH"
            - "used == 100 (the rejected duplicate added nothing)"

      - name: delivery_duplicate_pending_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_DELIVERY_ALREADY_PENDING
          - validations[priority=8]
        distinguishing_aspect: "One non-terminal delivery per (machine, package): a second create while the first is AWAITING_CONSENT fails 409 ERR_DELIVERY_ALREADY_PENDING."
        test_recipe:
          setup:
            - "Activated machine; PUBLISHED package; one delivery already AWAITING_CONSENT."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - *k_pkg
            - *k_pkg_pub
            - *k_delivery
          trigger:
            - call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine_id}", package_id: "${pkg_id}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DELIVERY_ALREADY_PENDING"
            - "GET /agdata/update-deliveries?machine_id=${machine_id} returns exactly 1 row"

      - name: license_duplicate_feature_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_LICENSE_ALREADY_EXISTS
          - validations[priority=8]
        distinguishing_aspect: "One non-REVOKED license per (machine, feature_code): purchasing AUTO_GUIDANCE twice — with a fresh machine version, so OCC passes — fails 409 ERR_LICENSE_ALREADY_EXISTS."
        test_recipe:
          setup:
            - "One machine with an AUTO_GUIDANCE license already purchased (machine version 2)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { m_v: $.data.version }
            - call: "POST /agdata/feature-licenses"
              payload: { machine_id: "${machine_id}", feature_code: "AUTO_GUIDANCE", license_type: "PERPETUAL", expected_machine_version: "${m_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { m_v2: $.data.version }
            - call: "POST /agdata/feature-licenses"
              payload: { machine_id: "${machine_id}", feature_code: "AUTO_GUIDANCE", license_type: "PERPETUAL", expected_machine_version: "${m_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_LICENSE_ALREADY_EXISTS (not a 412 — the version was fresh)"
            - "GET /agdata/feature-licenses?machine_id=${machine_id} returns exactly 1 row"

      - name: plan_resume_while_org_suspended_rejected
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_ORG_SUSPENDED
          - state_machines.DataPlan.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "The organization gate wraps plan resume: while the org is SUSPENDED a plan resume fails 409 ERR_ORG_SUSPENDED; after org resume the same call succeeds."
        test_recipe:
          setup:
            - "ACTIVE plan; organization suspended (which cascaded the plan to SUSPENDED)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
            - *k_plan_act
            - call: "POST /agdata/organizations/${org_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/resume"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/organizations/${org_id}/resume"
              payload: {}
              as: PlatformAdmin
            - call: "POST /agdata/data-plans/${plan_id}/resume"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_status: $.data.status }
          assert:
            - "the first resume returns 409 and error_id == ERR_ORG_SUSPENDED"
            - "after org resume the plan resume succeeds and plan_status == ACTIVE"

      - name: dealer_suspended_blocks_machine_activation
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_DEALER_SUSPENDED
          - state_machines.Machine.REGISTERED_to_ACTIVATED
        distinguishing_aspect: "A SUSPENDED dealer keeps its existing sessions and claims but cannot activate machines: activation by a suspended dealer fails 409 ERR_DEALER_SUSPENDED."
        test_recipe:
          setup:
            - "Machine fully ready for activation (modem PROVISIONED, plan ACTIVE); the dealer has just been suspended."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - call: "POST /agdata/dealers/${dealer_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /agdata/machines/${machine_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DEALER_SUSPENDED"
            - "Machine.${machine_id}.lifecycle_status remains REGISTERED"

      - name: provisioning_attempts_exhausted_at_limit
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_PROVISIONING_ATTEMPTS_EXHAUSTED
          - entities.Machine.fields.provisioning_attempts
        distinguishing_aspect: "PROVISIONING_MAX_ATTEMPTS 5 is a hard cap: after five begin/fail cycles (attempts == 5) the sixth begin fails 409 ERR_PROVISIONING_ATTEMPTS_EXHAUSTED and the modem stays PROVISION_FAILED."
        test_recipe:
          setup:
            - "One machine; five provisioning cycles each ending in PROVISION_FAILED."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - &k_prov_fail
              call: "POST /agdata/machines/${machine_id}/modem-provisioning-events"
              payload: { outcome: "PROVISION_FAILED" }
              as: System
            - *k_prov_begin
            - *k_prov_fail
            - *k_prov_begin
            - *k_prov_fail
            - *k_prov_begin
            - *k_prov_fail
            - *k_prov_begin
            - *k_prov_fail
          trigger:
            - call: "POST /agdata/machines/${machine_id}/provision-modem"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the sixth begin returns 409 and error_id == ERR_PROVISIONING_ATTEMPTS_EXHAUSTED"
            - "Machine.${machine_id}.provisioning_attempts == 5 and modem_status == PROVISION_FAILED"

      - name: ticket_type_mismatch_rejected_for_sessions
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_TICKET_TYPE_MISMATCH
          - validations[priority=9]
        distinguishing_aspect: "A GRANTED SOFTWARE_UPDATE ticket cannot open a diagnostic session: 409 ERR_TICKET_TYPE_MISMATCH, and the ticket is not consumed."
        test_recipe:
          setup:
            - "Connected activated machine; delivery minted a SOFTWARE_UPDATE ticket and the grower granted it."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - *k_pkg
            - *k_pkg_pub
            - *k_delivery
            - call: "POST /agdata/consent-tickets/${ticket_id}/grant"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/diagnostic-sessions"
              payload: { machine_id: "${machine_id}", consent_ticket_id: "${ticket_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TICKET_TYPE_MISMATCH"
            - "ConsentTicket.${ticket_id}.status remains GRANTED"
            - "GET /agdata/diagnostic-sessions?machine_id=${machine_id} returns 0 rows"

      - name: ticket_machine_mismatch_alone_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_TICKET_MACHINE_MISMATCH
          - validations[priority=9]
        distinguishing_aspect: "A GRANTED, unexpired REMOTE_DIAGNOSTIC ticket for machine A used against connected machine B fails 409 ERR_TICKET_MACHINE_MISMATCH — the referential error surfaces when no state error shadows it."
        test_recipe:
          setup:
            - "Connected machines A and B; ticket for A granted; no session consumed it."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0002", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0002", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { machine2_id: $.data.id }
            - call: "POST /agdata/machines/${machine2_id}/provision-modem"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - call: "POST /agdata/machines/${machine2_id}/modem-provisioning-events"
              payload: { outcome: "PROVISION_SUCCEEDED" }
              as: System
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine2_id}", tier: "STANDARD", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan2_id: $.data.id }
            - call: "POST /agdata/data-plans/${plan2_id}/activate"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - *k_diag_ticket
            - *k_ticket_grant
          trigger:
            - call: "POST /agdata/diagnostic-sessions"
              payload: { machine_id: "${machine2_id}", consent_ticket_id: "${dticket_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TICKET_MACHINE_MISMATCH"
            - "ConsentTicket.${dticket_id}.status remains GRANTED"

      - name: prescription_send_after_valid_until_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_PRESCRIPTION_EXPIRED
          - validations[priority=10]
        distinguishing_aspect: "valid_until is inclusive: sending at 2026-09-10T00:00:00Z exactly is legal, but once the clock passes it (2026-09-11) the send fails 409 ERR_PRESCRIPTION_EXPIRED and the prescription stays APPROVED."
        test_recipe:
          setup:
            - "Connected machine; ACTIVE field; APPROVED prescription with window [2026-09-01, 2026-09-10]."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_field
            - *k_field_act
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "CORN", zones: [{ zone_id: "z1", rate_l_per_ha: 3.00, area_ha: 10.00 }], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-10T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /agdata/prescriptions/${rx_id}/approve"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agdata/prescriptions/${rx_id}/send-to-machine"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PRESCRIPTION_EXPIRED"
            - "Prescription.${rx_id}.status remains APPROVED"

      - name: delivery_on_unactivated_machine_rejected
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_MACHINE_NOT_ACTIVATED
          - endpoints.POST_/agdata/update-deliveries
        distinguishing_aspect: "Delivery scheduling requires lifecycle ACTIVATED or IN_SERVICE: a machine that is merely connected (posture CONNECTED, lifecycle REGISTERED) fails 409 ERR_MACHINE_NOT_ACTIVATED — connectivity alone is not enough."
        test_recipe:
          setup:
            - "Machine with PROVISIONED modem and ACTIVE plan but no dealer activation; PUBLISHED package."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_pkg
            - *k_pkg_pub
          trigger:
            - call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine_id}", package_id: "${pkg_id}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MACHINE_NOT_ACTIVATED"
            - "GET /agdata/update-deliveries?machine_id=${machine_id} returns 0 rows"

      - name: delivery_on_draft_package_rejected
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_PACKAGE_NOT_PUBLISHED
          - endpoints.POST_/agdata/update-deliveries
        distinguishing_aspect: "Only PUBLISHED packages accept deliveries: scheduling against a DRAFT package fails 409 ERR_PACKAGE_NOT_PUBLISHED even when the machine is fully eligible."
        test_recipe:
          setup:
            - "Dealer-activated machine; package still DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - *k_pkg
          trigger:
            - call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine_id}", package_id: "${pkg_id}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PACKAGE_NOT_PUBLISHED"

      - name: activate_without_provisioning_reports_modem_first
        claim_type: Priority Ordering
        grounds:
          - errors.ERR_MODEM_NOT_PROVISIONED
          - validations[priority=6]
        distinguishing_aspect: "Inside the state category the modem check is pinned before the plan check: a machine with neither provisioning nor plan gets ERR_MODEM_NOT_PROVISIONED, not ERR_PLAN_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Fresh machine (UNPROVISIONED, no plan)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
          trigger:
            - call: "POST /agdata/machines/${machine_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MODEM_NOT_PROVISIONED"
            - "error_id != ERR_PLAN_NOT_ACTIVE although no plan exists either"

      - name: tier_change_to_same_tier_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_TIER_CHANGE_INVALID
          - endpoints.POST_/agdata/data-plans/{id}/change-tier
        distinguishing_aspect: "change-tier with new_tier equal to the current tier is a 409 ERR_TIER_CHANGE_INVALID and computes no proration charge."
        test_recipe:
          setup:
            - "One ACTIVE STANDARD plan (version 2 after activation)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
            - *k_plan_act
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/change-tier"
              payload: { new_tier: "STANDARD", expected_plan_version: "${plan_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TIER_CHANGE_INVALID"
            - "GET /agdata/data-plans/${plan_id} shows last_proration_charge_cents is null and tier == STANDARD"

      - name: partner_quota_exhausted_alone_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_PARTNER_QUOTA_EXCEEDED
          - validations[priority=11]
        distinguishing_aspect: "With a valid grant in place (no safety violation), the (calls_today == quota) pull fails 409 ERR_PARTNER_QUOTA_EXCEEDED — the fiscal gate alone, unlike the difficulty instance where safety shadows it."
        test_recipe:
          setup:
            - "CERTIFIED partner with quota 1 and an ACTIVE TELEMATICS grant from the org; one successful pull already consumed the quota."
          setup_api_calls:
            - *k_clock
            - *k_org
            - call: "POST /agdata/integration-partners"
              payload: { name: "TractorSync Lite", api_quota_calls_per_day: 1 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /agdata/integration-partners/${partner_id}/submit-for-certification"
              payload: {}
              as: PlatformAdmin
            - call: "POST /agdata/integration-partners/${partner_id}/decide"
              payload: { decision: "CERTIFY" }
              as: PlatformAdmin
            - *k_grant_partner
            - call: "POST /agdata/integration-partners/${partner_id}/data-pull"
              payload: { organization_id: "${org_id}", scope: "TELEMATICS" }
              as: PartnerApp
              as_user_id: "${partner_id}"
              captures: { remaining: $.data.calls_remaining_today }
          trigger:
            - call: "POST /agdata/integration-partners/${partner_id}/data-pull"
              payload: { organization_id: "${org_id}", scope: "TELEMATICS" }
              as: PartnerApp
              as_user_id: "${partner_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first pull returned calls_remaining_today == 0 (quota 1 consumed)"
            - "the second pull returns 409 and error_id == ERR_PARTNER_QUOTA_EXCEEDED"
            - "GET /agdata/integration-partners/${partner_id} shows calls_today == 1"

      - name: data_pull_without_covering_grant_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_DATA_SCOPE_NOT_GRANTED
          - validations[priority=7]
        distinguishing_aspect: "A CERTIFIED partner with ample quota but no grant covering the requested scope gets 403 ERR_DATA_SCOPE_NOT_GRANTED; a grant for a different scope (AGRONOMIC) does not authorize a TELEMATICS pull."
        test_recipe:
          setup:
            - "CERTIFIED partner (quota 100); org granted the partner only AGRONOMIC for 2026."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_partner
            - call: "POST /agdata/integration-partners/${partner_id}/submit-for-certification"
              payload: {}
              as: PlatformAdmin
            - call: "POST /agdata/integration-partners/${partner_id}/decide"
              payload: { decision: "CERTIFY" }
              as: PlatformAdmin
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "THIRD_PARTY_APP", grantee_ref_id: "${partner_id}", scopes: ["AGRONOMIC"], valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/integration-partners/${partner_id}/data-pull"
              payload: { organization_id: "${org_id}", scope: "TELEMATICS" }
              as: PartnerApp
              as_user_id: "${partner_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/integration-partners/${partner_id}/data-pull"
              payload: { organization_id: "${org_id}", scope: "AGRONOMIC" }
              as: PartnerApp
              as_user_id: "${partner_id}"
              captures: { rec_count: $.data.record_count }
          assert:
            - "the TELEMATICS pull returns 403 and error_id == ERR_DATA_SCOPE_NOT_GRANTED"
            - "the AGRONOMIC pull returns 200 with a numeric record_count"

  # ===========================================================================
  - section: rbac
    instances:

      - name: agronomist_cannot_approve_prescription
        claim_type: Violation -> Error
        grounds:
          - roles.GrowerManager
          - endpoints.POST_/agdata/prescriptions/{id}/approve
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "Prescription approval is grower-exclusive even though Agronomists may create, revise and send: an Agronomist holding a valid AGRONOMIC grant can create the prescription but gets 403 ERR_FORBIDDEN_FOR_ROLE on approve."
        test_recipe:
          setup:
            - "Organization with machine, ACTIVE field, and an AGRONOMIC grant to agron-ada; agronomist creates a prescription."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_field
            - *k_field_act
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "AGRONOMIST", grantee_ref_id: "agron-ada", scopes: ["AGRONOMIC"], valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "WHEAT", zones: [{ zone_id: "z1", rate_l_per_ha: 2.00, area_ha: 8.00 }], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: Agronomist
              as_user_id: "agron-ada"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /agdata/prescriptions/${rx_id}/approve"
              payload: {}
              as: Agronomist
              as_user_id: "agron-ada"
              captures: { error_id: $.data.error_id }
          assert:
            - "the agronomist's create returned 201 (grant-gated write allowed)"
            - "the approve returns 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "Prescription.${rx_id}.status remains DRAFT"

      - name: grower_cannot_read_other_orgs_machine
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors.ERR_DATA_ACCESS_DENIED
        distinguishing_aspect: "Ownership is enforced by X-User-ID == organization_id, not by role alone: the GrowerManager of org A reading a machine of org B gets 403 ERR_DATA_ACCESS_DENIED — tenant isolation between two growers."
        test_recipe:
          setup:
            - "Two organizations; machine M2 belongs to org2."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - call: "POST /agdata/organizations"
              payload: { name: "Cottonwood Creek Coop", region_code: "US-KS" }
              as: PlatformAdmin
              captures: { org2_id: $.data.id }
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org2_id}", serial_number: "SN-0002", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0002", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org2_id}"
              captures: { machine2_id: $.data.id }
          trigger:
            - call: "GET /agdata/machines/${machine2_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_DATA_ACCESS_DENIED"

      - name: dealer_cannot_close_foreign_session
        claim_type: Violation -> Error
        grounds:
          - state_machines.DiagnosticSession.OPEN_to_CLOSED
          - errors.ERR_DATA_ACCESS_DENIED
        distinguishing_aspect: "Session close is opener-only: dealer B attempting to close dealer A's OPEN session gets 403 ERR_DATA_ACCESS_DENIED, and the session stays OPEN."
        test_recipe:
          setup:
            - "Dealers A and B; connected machine; dealer A holds an OPEN session."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_diag_ticket
            - *k_ticket_grant
            - *k_session
            - call: "POST /agdata/dealers"
              payload: { dealer_code: "D-200", name: "Plains Agri Supply", region_code: "US-KS", service_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { dealer2_id: $.data.id }
          trigger:
            - call: "POST /agdata/diagnostic-sessions/${session_id}/close"
              payload: { fault_found: false }
              as: DealerTechnician
              as_user_id: "${dealer2_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_DATA_ACCESS_DENIED"
            - "DiagnosticSession.${session_id}.status remains OPEN"

      - name: partner_reads_other_partner_denied
        claim_type: Violation -> Error
        grounds:
          - endpoints.GET_/agdata/integration-partners/{id}
          - errors.ERR_DATA_ACCESS_DENIED
        distinguishing_aspect: "PartnerApp identity is entity-backed: partner B reading partner A's record (X-User-ID != path id) gets 403 ERR_DATA_ACCESS_DENIED while self-reads succeed."
        test_recipe:
          setup:
            - "Two partners registered."
          setup_api_calls:
            - *k_clock
            - *k_partner
            - call: "POST /agdata/integration-partners"
              payload: { name: "FieldOps Cloud", api_quota_calls_per_day: 50 }
              as: PlatformAdmin
              captures: { partner2_id: $.data.id }
          trigger:
            - call: "GET /agdata/integration-partners/${partner_id}"
              payload: {}
              as: PartnerApp
              as_user_id: "${partner2_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /agdata/integration-partners/${partner_id}"
              payload: {}
              as: PartnerApp
              as_user_id: "${partner_id}"
              captures: { p_name: $.data.name }
          assert:
            - "the cross-partner read returns 403 and error_id == ERR_DATA_ACCESS_DENIED"
            - "the self-read returns 200 with p_name == \"AgriSight Analytics\""

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: occ_stale_machine_version_on_license_purchase
        claim_type: OCC stale-version conflict
        grounds:
          - concurrency_rules[license-purchase-machine-occ]
          - errors.ERR_STALE_MACHINE_VERSION
        distinguishing_aspect: "OCC on Machine.version: after a first purchase bumps the version, a second purchase carrying the previously observed version fails 412 ERR_STALE_MACHINE_VERSION deterministically — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "One machine, version observed at 1; one license already purchased against that version (machine now version 2)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { m_v: $.data.version }
            - call: "POST /agdata/feature-licenses"
              payload: { machine_id: "${machine_id}", feature_code: "AUTO_GUIDANCE", license_type: "PERPETUAL", expected_machine_version: "${m_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/feature-licenses"
              payload: { machine_id: "${machine_id}", feature_code: "SECTION_CONTROL", license_type: "PERPETUAL", expected_machine_version: "${m_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_MACHINE_VERSION"
            - "Machine.${machine_id}.active_license_count == 1 (only the fresh-version purchase landed)"

      - name: occ_stale_field_version_on_prescription_create
        claim_type: OCC stale-version conflict
        grounds:
          - concurrency_rules[prescription-create-field-occ]
          - errors.ERR_STALE_FIELD_BOUNDARY_VERSION
        distinguishing_aspect: "OCC on FieldBoundary.version: a prescription create carrying the pre-first-create field version (2) after the first create bumped it to 3 fails 412 ERR_STALE_FIELD_BOUNDARY_VERSION."
        test_recipe:
          setup:
            - "ACTIVE field at version 2; one prescription already created against it (field now version 3)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_field
            - *k_field_act
            - *k_rx
          trigger:
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "SOY", zones: [{ zone_id: "z1", rate_l_per_ha: 3.10, area_ha: 10.00 }], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_FIELD_BOUNDARY_VERSION"
            - "GET /agdata/prescriptions?field_boundary_id=${field_id} returns exactly 1 row"

      - name: occ_stale_plan_version_on_change_tier
        claim_type: OCC stale-version conflict
        grounds:
          - concurrency_rules[plan-change-tier-occ]
          - errors.ERR_STALE_PLAN_VERSION
        distinguishing_aspect: "OCC on DataPlan.version: after a first change-tier succeeds (version 2 -> 3), replaying the observed version 2 against a different target tier fails 412 ERR_STALE_PLAN_VERSION."
        test_recipe:
          setup:
            - "ACTIVE STANDARD plan observed at version 2; one change-tier to BASIC already applied (version 3)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
            - *k_plan_act
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /agdata/data-plans/${plan_id}/change-tier"
              payload: { new_tier: "BASIC", expected_plan_version: "${plan_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/change-tier"
              payload: { new_tier: "UNLIMITED", expected_plan_version: "${plan_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_PLAN_VERSION"
            - "GET /agdata/data-plans/${plan_id} shows tier == BASIC (only the fresh-version change landed)"

      - name: posture_recomputed_on_tier_upgrade_from_exhausted
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.data_usage_posture
          - calculations.machine_connectivity_posture
          - endpoints.POST_/agdata/data-plans/{id}/change-tier
        distinguishing_aspect: "Derived-field reconciliation across entities: a BASIC plan at 100.00% usage (5120/5120) holds the machine at posture EXHAUSTED; change-tier to UNLIMITED (cap null) recomputes usage_posture NORMAL and the machine posture flips straight to CONNECTED in the same request."
        test_recipe:
          setup:
            - "Machine with PROVISIONED modem and ACTIVE BASIC plan; one batch of 5120 MB accepted (usage exactly at cap)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", tier: "BASIC", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_id: $.data.id }
            - *k_plan_act
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-full", start_hour_iso: "2026-09-01T00:00:00Z", hour_count: 2, payload_mb: 5120 }
              as: System
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { posture_before: $.data.connectivity_posture }
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/change-tier"
              payload: { new_tier: "UNLIMITED", expected_plan_version: "${plan_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { posture_after: $.data.connectivity_posture }
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { usage_after: $.data.usage_posture }
          assert:
            - "posture_before == \"EXHAUSTED\" (5120/5120 >= 1.00)"
            - "posture_after == \"CONNECTED\" and usage_after == \"NORMAL\" (UNLIMITED has no cap)"

      - name: mandatory_package_downloads_while_throttled_optional_blocked
        claim_type: conditional_feature_flags
        grounds:
          - state_machines.UpdateDelivery.CONSENT_GRANTED_to_DOWNLOADING
          - entities.SoftwarePackage.fields.mandatory
          - errors.ERR_MACHINE_POSTURE_BLOCKED
        distinguishing_aspect: "The package's mandatory flag is a conditional feature of the posture gate: on a THROTTLED machine an optional package's start-download fails 409 ERR_MACHINE_POSTURE_BLOCKED while a mandatory package's succeeds."
        test_recipe:
          setup:
            - "Dealer-activated machine, THROTTLED (16384 of 20480 MB used); two PUBLISHED packages (one optional, one mandatory) each with a consent-granted delivery."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
            - *k_pkg
            - *k_pkg_pub
            - call: "POST /agdata/software-packages"
              payload: { package_code: "FW-SEC", target_model_code: "M8R", firmware_version: "10.2.1", size_mb: 120, mandatory: true }
              as: PlatformAdmin
              captures: { pkg2_id: $.data.id }
            - call: "POST /agdata/software-packages/${pkg2_id}/publish"
              payload: {}
              as: PlatformAdmin
            - *k_delivery
            - call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine_id}", package_id: "${pkg2_id}" }
              as: PlatformAdmin
              captures: { delivery2_id: $.data.id, ticket2_id: $.data.consent_ticket_id }
            - call: "POST /agdata/consent-tickets/${ticket_id}/grant"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/consent-tickets/${ticket2_id}/grant"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-throttle", start_hour_iso: "2026-09-01T00:00:00Z", hour_count: 2, payload_mb: 16384 }
              as: System
          trigger:
            - call: "POST /agdata/update-deliveries/${delivery_id}/start-download"
              payload: {}
              as: System
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/update-deliveries/${delivery2_id}/start-download"
              payload: {}
              as: System
              captures: { d2_status: $.data.status }
          assert:
            - "the optional package's start-download returns 409 and error_id == ERR_MACHINE_POSTURE_BLOCKED (THROTTLED is not enough for optional)"
            - "the mandatory package's start-download returns 200 and d2_status == DOWNLOADING on the same THROTTLED machine"

      - name: clock_rollover_resets_cycle_usage
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.data_usage_posture
          - endpoints.POST_/agdata/_clock/set_current_utc
          - entities.DataPlan.fields.cycle_start_date
        distinguishing_aspect: "The billing-cycle rollover is clock-driven: a STANDARD plan anchored 2026-09-01 with 16384 MB used (THROTTLED) resets to used_mb 0 / NORMAL with cycle_start_date 2026-10-01 the moment the clock reaches the October anchor."
        test_recipe:
          setup:
            - "ACTIVE STANDARD plan (anchor day 1) with 16384 MB used, THROTTLED."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-80", start_hour_iso: "2026-09-01T00:00:00Z", hour_count: 2, payload_mb: 16384 }
              as: System
          trigger:
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { used: $.data.used_mb, post: $.data.usage_posture, csd: $.data.cycle_start_date }
          assert:
            - "used == 0 and post == \"NORMAL\" after crossing the anchor boundary"
            - "csd == \"2026-10-01\" (cycle_start_date advanced to the crossed boundary)"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: action_endpoint_response_carries_updated_entity
        claim_type: Computed read
        grounds:
          - endpoints.POST_/agdata/data-plans/{id}/suspend
          - response_envelope
        distinguishing_aspect: "Action endpoints return the full updated entity in the success envelope — the suspend response itself shows status SUSPENDED and a bumped version, so no follow-up GET is needed to observe the mutation."
        test_recipe:
          setup:
            - "One ACTIVE plan (version 2 after activation)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
            - *k_plan_act
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/suspend"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { p_status: $.data.status, p_v: $.data.version }
          assert:
            - "the response status is 200, response_type is object"
            - "p_status == SUSPENDED and p_v == 3 in the suspend response itself"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: change_tier_response_carries_proration_immediately
        claim_type: immediate
        grounds:
          - calculations.plan_proration
          - endpoints.POST_/agdata/data-plans/{id}/change-tier
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the change-tier response itself carries tier STANDARD, monthly_price_cents 60000 and last_proration_charge_cents 15484 (CALENDAR_DAY, October 15) — derived values are committed in the same request, not eventually reconciled."
        test_recipe:
          setup:
            - "ACTIVE BASIC plan (CALENDAR_DAY) anchored 2026-10-01; clock at 2026-10-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", tier: "BASIC", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *k_plan_act
            - call: "GET /agdata/data-plans/${plan_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/change-tier"
              payload: { new_tier: "STANDARD", expected_plan_version: "${plan_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { tier: $.data.tier, price: $.data.monthly_price_cents, charge: $.data.last_proration_charge_cents }
          assert:
            - "tier == \"STANDARD\" and price == 60000 and charge == 15484, all in the change-tier response"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_machine_session_active_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_MACHINE_SESSION_ACTIVE]
        excluded_because:
          difficulty_instance: diagnostic_session_exclusive_machine_lock_half_open
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_grant_window_overlap_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_GRANT_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: grant_window_closed_interval_overlap
          rationale: "Asserted twice (interior overlap and closed-interval touch) in the named §1.8 instance."

      - name: error_insufficient_data_coverage_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_INSUFFICIENT_DATA_COVERAGE]
        excluded_because:
          difficulty_instance: warranty_coverage_at_exactly_ninety_percent
          rationale: "The 647-bucket machine's submit asserts this error in the named §1.8 instance."

      - name: error_consent_expired_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_CONSENT_EXPIRED]
        excluded_because:
          difficulty_instance: consent_ticket_expires_exactly_at_ttl
          rationale: "The session create after the TTL boundary asserts this error in the named §1.8 instance."

      - name: error_consent_already_consumed_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_CONSENT_ALREADY_CONSUMED]
        excluded_because:
          difficulty_instance: session_create_consumed_ticket_beats_machine_mismatch
          rationale: "Asserted as the winning error of the state-vs-referential priority pair in the named §1.8 instance."

      - name: error_plan_not_active_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_PLAN_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: machine_activate_gated_by_plan_state
          rationale: "The PENDING-plan activation asserts this error in the named §1.8 instance."

      - name: error_posture_blocked_on_send_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_MACHINE_POSTURE_BLOCKED]
        excluded_because:
          difficulty_instance: prescription_send_gated_by_machine_posture
          rationale: "The PLAN_SUSPENDED send asserts this error in the named §1.8 instance; the EXHAUSTED-ingest and optional-download cases add their own asserts in usage_throttle_at_exactly_eighty_percent and mandatory_package_downloads_while_throttled_optional_blocked."

      - name: error_data_scope_not_granted_with_quota_pressure_covered
        claim_type: Violation -> Error
        grounds: [errors.ERR_DATA_SCOPE_NOT_GRANTED]
        excluded_because:
          difficulty_instance: data_pull_scope_safety_beats_quota_fiscal
          rationale: "Asserted there as the winner over ERR_PARTNER_QUOTA_EXCEEDED; the no-quota-pressure variant has its own corner instance data_pull_without_covering_grant_rejected."
