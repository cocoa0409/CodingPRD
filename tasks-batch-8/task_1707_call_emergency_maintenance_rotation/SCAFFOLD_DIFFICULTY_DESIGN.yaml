# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# On-Call Emergency Maintenance Rotation. 9 rules x 2 instances = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is directly executable
# from empty-DB via its setup_api_calls chain (logical clock default:
# 2026-08-01T00:00:00Z — a Saturday).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: standby_pay_rounding_order_divergence
        grounds:
          - calculations.standby_pay_provisional
          - calculations.standby_pay_final
          - entities.RotationShift.fields.provisional_shift_pay_cents
          - entities.PayStatement.fields.standby_pay_final_cents
        distinguishing_aspect: |
          Entity domain = technician COMPENSATION. The provisional variant rounds each
          shift individually (9056.25 -> 9056 x3 = 27168); the final variant accumulates
          exact rationals chronologically and rounds once (27168.75 -> 27169). Identical
          inputs, different results (1 cent), caused purely by the pinned rounding order —
          no tier split is involved (300 min < 2400 cap).
        test_recipe:
          setup:
            - "Technician T1 (rate 4725 cents/h, differential 1500bp) has three COMPLETED shifts of exactly 100 standby minutes each (2026-08-01/02/03 01:00-02:40), no callbacks"
            - "PayPeriod 2026-08-01..2026-08-08 exists; clock at 2026-08-08T00:00:00Z (period_end <= now)"
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4725, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T01:00:00Z", end_at: "2026-08-01T02:40:00Z" }, as: PropertyAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T03:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/complete", as: PropertyAdmin, captures: { prov1: $.data.provisional_shift_pay_cents, min1: $.data.standby_minutes } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-02T01:00:00Z", end_at: "2026-08-02T02:40:00Z" }, as: PropertyAdmin, captures: { s2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s2}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T03:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s2}/complete", as: PropertyAdmin, captures: { prov2: $.data.provisional_shift_pay_cents } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T01:00:00Z", end_at: "2026-08-03T02:40:00Z" }, as: PropertyAdmin, captures: { s3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s3}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T03:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s3}/complete", as: PropertyAdmin, captures: { prov3: $.data.provisional_shift_pay_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/pay-periods", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z" }, as: PropertyAdmin, captures: { pp: $.data.id } }
          trigger:
            - { call: "POST /v1/pay-periods/${pp}/close", as: PropertyAdmin }
            - { call: "GET /v1/pay-statements?pay_period_id=${pp}", as: PropertyAdmin, captures: { fin: "$.data[0].standby_pay_final_cents", tot: "$.data[0].total_pay_cents", mins: "$.data[0].standby_minutes_total" } }
          assert:
            - "RotationShift.${s1}.provisional_shift_pay_cents == 9056 (round_half_up(9056.25)) and same 9056 for s2, s3"
            - "RotationShift.${s1}.standby_minutes == 100"
            - "PayStatement.standby_minutes_total == 300"
            - "PayStatement.standby_pay_final_cents == 27169 (round_half_up(27168.75), single rounding)"
            - "standby_pay_final_cents (27169) != sum of provisionals (27168) — variants diverge on identical inputs"
            - "PayStatement.total_pay_cents == 27169 (no callbacks in period)"

      - name: relocation_estimate_vs_actual_overstay
        grounds:
          - calculations.relocation_cost_estimate
          - calculations.relocation_cost_actual
          - entities.RelocationCase.fields.est_cost_cents
          - entities.RelocationCase.fields.actual_cost_cents
        distinguishing_aspect: |
          Entity domain = resident HOUSING cost (distinct from technician compensation in
          standby_pay_rounding_order_divergence). The estimate bills 5 planned nights flat;
          the actual bills 5 normal nights + 2 overstay nights at 1.25x (per-night rounded
          25000) + the same 15000 admin fee: 115000 vs 165000 for the same case.
        test_recipe:
          setup:
            - "Unit U-101; T1 (TECHNICIAN) on ACTIVE shift 2026-08-01 00:00-08:00; S1 (SUPERVISOR)"
            - "FLOOD ticket dispatched to T1, arrived 01:00, mitigated 02:00 with unit_uninhabitable=true; its auto EMERGENCY_FOLLOWUP work order cancelled"
            - "RelocationCase RC (T1 proposed): 2026-08-03..2026-08-08 at 20000/night; APPROVED by S1; ACTIVE (clock 2026-08-03T12:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Terry Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-101", building_code: "B1" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh1: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh1}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Res Ident", caller_phone: "555-0101", category: "FLOOD", description: "Water pouring from ceiling" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Shut off main, wet-vac", unit_uninhabitable: true }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo_em: "$.data[0].id" } }
            - { call: "POST /v1/work-orders/${wo_em}/cancel", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u1}", call_ticket_id: "${tk}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-08T00:00:00Z", nightly_rate_cents: 20000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rc: $.data.id, est: $.data.est_cost_cents, nights: $.data.planned_nights } }
            - { call: "POST /v1/relocation-cases/${rc}/approve", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/relocation-cases/${rc}/activate", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
          trigger:
            - { call: "POST /v1/relocation-cases/${rc}/end", payload: { actual_end_date: "2026-08-10T00:00:00Z" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { act: $.data.actual_cost_cents } }
            - { call: "GET /v1/units/${u1}", as: PropertyAdmin, captures: { hab: $.data.habitability_status } }
          assert:
            - "RelocationCase.${rc}.planned_nights == 5"
            - "RelocationCase.${rc}.est_cost_cents == 115000 (5 x 20000 + 15000)"
            - "RelocationCase.${rc}.actual_cost_cents == 165000 (5 x 20000 + 2 x round_half_up(20000 x 1.25)=25000 + 15000)"
            - "actual_cost_cents (165000) != est_cost_cents (115000) — variants diverge on the same case"
            - "RelocationCase.${rc}.status == ENDED"
            - "Unit.${u1}.habitability_status == HABITABLE (restored by end side effect)"

  # ---------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: callback_pay_night_weekend_hazard_stacking
        grounds:
          - calculations.callback_pay
          - entities.CallTicket.fields.callback_pay_cents
          - entities.CallTicket.fields.callback_minutes
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — a nested max (120-minute
          callout floor over the true 45 minutes) times three multiplicative conditional
          branches (night 1.5 x weekend 1.25 x hazard 1.5 on a 4800-cent base = 13500/h).
          120/60 x 13500 = 27000; removing any single flag changes the result.
        test_recipe:
          setup:
            - "T1 (4800 cents/h) on ACTIVE shift 2026-08-01 18:00 - 2026-08-02 06:00; unit exists"
            - "GAS_LEAK ticket received and dispatched 2026-08-01T23:00:00Z (Saturday night), arrived 23:20, mitigated 23:45 (45 callback minutes); incident record SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T22:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-201", building_code: "B2" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T18:00:00Z", end_at: "2026-08-02T06:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller A", caller_phone: "555-0102", category: "GAS_LEAK", description: "Smell of gas" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:20:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:45:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Gas shut at meter, ventilated", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/incident-record", payload: { narrative: "Gas leak at flex line; shut and vented", estimated_damage_cents: 0 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { ir: $.data.id } }
            - { call: "POST /v1/incident-records/${ir}/submit", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:50:00Z" }, as: PropertyAdmin }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/close", as: Dispatcher, captures: { cb: $.data.callback_pay_cents, cm: $.data.callback_minutes, breach: $.data.response_breach } }
          assert:
            - "CallTicket.${tk}.callback_minutes == 45"
            - "CallTicket.${tk}.callback_pay_cents == 27000 (max(45,120)=120 min; 4800 x 1.5 x 1.25 x 1.5 = 13500/h; 2h x 13500)"
            - "CallTicket.${tk}.response_breach == false (response 20 min <= 30 target)"
            - "CallTicket.${tk}.status == CLOSED"

      - name: vendor_invoice_line_rounding_order
        grounds:
          - calculations.vendor_invoice_settlement
          - entities.VendorAuthorization.fields.invoice_subtotal_cents
          - entities.VendorAuthorization.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round per line then sum gives
          subtotal 13333 (5000 + 8333), while sum-then-round would give 13332; markup is
          computed on the ROUNDED subtotal and itself rounded (1333). Pinned total 14666;
          the unpinned order yields 14665. Distinct mode from the multiplicative-stacking
          instance (mode a).
        test_recipe:
          setup:
            - "T1 (TECHNICIAN) dispatched and mitigated a LEAK_MINOR ticket (unit_uninhabitable=false); auto EMERGENCY_FOLLOWUP work order WO exists (OPEN)"
            - "Vendor V1 (PLUMBING, per_incident_limit 500000); VendorAuthorization VA (amount 20000) proposed by T1 against WO, AUTHORIZED by S1 (supervisor) — WO now ASSIGNED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-301", building_code: "B3" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "Rapid Rooter", trade: "PLUMBING", per_incident_limit_cents: 500000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller B", caller_phone: "555-0103", category: "LEAK_MINOR", description: "Slow drip under sink" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Supply line isolated", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 20000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va: $.data.id } }
            - { call: "POST /v1/vendor-authorizations/${va}/authorize", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
          trigger:
            - { call: "POST /v1/vendor-authorizations/${va}/invoice", payload: { lines: [ { description: "labor 1.5h", quantity: 1.5, unit_cost_cents: 3333 }, { description: "labor 2.5h", quantity: 2.5, unit_cost_cents: 3333 } ], overhead_markup_bp: 1000 }, as: Vendor, as_user_id: "${v1}", captures: { sub: $.data.invoice_subtotal_cents, mk: $.data.invoice_markup_cents, tot: $.data.invoice_total_cents } }
          assert:
            - "VendorAuthorization.${va}.invoice_subtotal_cents == 13333 (round_half_up(4999.5)=5000 + round_half_up(8332.5)=8333)"
            - "VendorAuthorization.${va}.invoice_markup_cents == 1333 (round_half_up(13333 x 0.10))"
            - "VendorAuthorization.${va}.invoice_total_cents == 14666 (== 13333 + 1333; sum-then-round would yield 14665)"
            - "VendorAuthorization.${va}.status == INVOICED (14666 <= round_half_up(20000 x 1.10) == 22000)"

  # ---------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_completed_reopen_rerun_cycle
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_ASSIGNED
          - state_machines.WorkOrder.COMPLETED_to_VERIFIED
        distinguishing_aspect: |
          WorkOrder carries a rework CYCLE (COMPLETED -> REOPENED -> ASSIGNED ->
          IN_PROGRESS -> COMPLETED -> VERIFIED), not a linear pipeline; the entity must
          legally re-enter ASSIGNED after reaching COMPLETED once.
        test_recipe:
          setup:
            - "T1 (TECHNICIAN) dispatched to a LEAK_MINOR ticket and mitigated it (unit_uninhabitable=false); auto EMERGENCY_FOLLOWUP work order WO exists in OPEN"
            - "S1 (SUPERVISOR) exists"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-401", building_code: "B4" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller C", caller_phone: "555-0104", category: "LEAK_MINOR", description: "Drip at trap" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Trap tightened", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/work-orders/${wo}/assign", payload: { technician_id: "${t1}" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st1: $.data.status } }
            - { call: "POST /v1/work-orders/${wo}/begin", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/work-orders/${wo}/complete", as: OnCallTechnician, as_user_id: "${t1}", captures: { st2: $.data.status } }
            - { call: "POST /v1/work-orders/${wo}/reopen", payload: { reason: "Trap still weeping" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st3: $.data.status } }
            - { call: "POST /v1/work-orders/${wo}/assign", payload: { technician_id: "${t1}" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st4: $.data.status } }
            - { call: "POST /v1/work-orders/${wo}/begin", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/work-orders/${wo}/complete", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/work-orders/${wo}/verify", as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st5: $.data.status } }
          assert:
            - "st1 == ASSIGNED (OPEN -> ASSIGNED)"
            - "st2 == COMPLETED (first completion)"
            - "st3 == REOPENED (cycle back)"
            - "st4 == ASSIGNED (REOPENED re-enters the assignment path)"
            - "st5 == VERIFIED (terminal after rework loop)"

      - name: call_ticket_escalation_redispatch_loop
        grounds:
          - state_machines.CallTicket.DISPATCHED_to_ESCALATED
          - state_machines.CallTicket.ESCALATED_to_DISPATCHED
          - state_machines.CallTicket.ESCALATED_to_ON_SCENE
        distinguishing_aspect: |
          CallTicket carries a dispatch<->escalation CYCLE (DISPATCHED -> ESCALATED ->
          DISPATCHED again) on a different entity than the WorkOrder rework cycle;
          re-dispatch must reset escalation_level to 0 and re-stamp dispatched_at while
          preserving the ticket.
        test_recipe:
          setup:
            - "T1 and T2 (TECHNICIAN) each on ACTIVE shifts covering 2026-08-03 00:00-12:00; S1 (SUPERVISOR); unit exists"
            - "NO_POWER ticket TRIAGED, dispatched to T1 (DISPATCHED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Terry Two", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t2: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-402", building_code: "B4" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PropertyAdmin, captures: { sh1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t2}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PropertyAdmin, captures: { sh2: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh1}/start", as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${sh2}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller D", caller_phone: "555-0105", category: "NO_POWER", description: "Unit dark, breaker fine" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv1: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv1}" }, as: Dispatcher }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/escalate", as: Dispatcher, captures: { lv1: $.data.escalation_level, st_e: $.data.status } }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv2: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t2}", expected_call_ticket_version: "${tv2}" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { lv2: $.data.escalation_level, st_d: $.data.status, asg: $.data.assigned_technician_id } }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t2}", captures: { st_o: $.data.status } }
          assert:
            - "st_e == ESCALATED and lv1 == 1 (manual escalation)"
            - "st_d == DISPATCHED and lv2 == 0 (re-dispatch resets the escalation level)"
            - "asg == ${t2} (assignment superseded)"
            - "st_o == ON_SCENE (arrive is legal directly out of the re-dispatched state)"

  # ---------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: relocation_approval_three_hop_cascade
        grounds:
          - state_machines.RelocationCase.PROPOSED_to_APPROVED
          - state_machines.Unit.HABITABLE_to_UNINHABITABLE
          - state_machines.WorkOrder.OPEN_to_ON_HOLD
          - state_machines.VendorAuthorization.PROPOSED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain from the approve trigger: RelocationCase APPROVED mutates Unit
          (link 1); Unit becoming UNINHABITABLE mutates the unit's non-emergency OPEN/
          ASSIGNED WorkOrders to ON_HOLD (link 2); each held WorkOrder's own mutation voids
          its PROPOSED VendorAuthorizations (link 3). Emergency-followup work orders are
          exempt from link 2, proving the cascade is conditional, not a fan-out.
        test_recipe:
          setup:
            - "FLOOD ticket dispatched to T1 and mitigated with unit_uninhabitable=true; auto EMERGENCY_FOLLOWUP work order WO_EM exists (OPEN)"
            - "Manual STANDARD work order WO_STD exists for the same ticket (OPEN); vendor V1; VendorAuthorization VA (30000) PROPOSED by T1 against WO_STD"
            - "RelocationCase RC proposed by T1 for the unit (2026-08-03..2026-08-06, 15000/night); S1 (SUPERVISOR) approves"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-501", building_code: "B5" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "DryFast", trade: "RESTORATION", per_incident_limit_cents: 500000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller E", caller_phone: "555-0106", category: "FLOOD", description: "Standing water" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Water extracted; unit soaked", unit_uninhabitable: true }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}&status=OPEN", as: Dispatcher, captures: { wo_em: "$.data[0].id" } }
            - { call: "POST /v1/work-orders", payload: { call_ticket_id: "${tk}", title: "Baseboard replacement", description: "Replace swollen baseboards" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { wo_std: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo_std}", vendor_id: "${v1}", amount_cents: 30000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va: $.data.id } }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u1}", call_ticket_id: "${tk}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-06T00:00:00Z", nightly_rate_cents: 15000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /v1/relocation-cases/${rc}/approve", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "GET /v1/units/${u1}", as: PropertyAdmin, captures: { hab: $.data.habitability_status } }
            - { call: "GET /v1/work-orders/${wo_std}", as: Dispatcher, captures: { wstd: $.data.status } }
            - { call: "GET /v1/work-orders/${wo_em}", as: Dispatcher, captures: { wem: $.data.status } }
            - { call: "GET /v1/vendor-authorizations/${va}", as: Dispatcher, captures: { vast: $.data.status } }
          assert:
            - "RelocationCase.${rc}.status == APPROVED"
            - "Unit.${u1}.habitability_status == UNINHABITABLE (link 1)"
            - "WorkOrder.${wo_std}.status == ON_HOLD (link 2, STANDARD priority held)"
            - "VendorAuthorization.${va}.status == VOIDED (link 3, caused by the hold, not by the approve directly)"
            - "WorkOrder.${wo_em}.status == OPEN (EMERGENCY_FOLLOWUP exempt from the hold)"

      - name: ticket_close_fatigue_coverage_cascade
        grounds:
          - state_machines.CallTicket.MITIGATED_to_CLOSED
          - calculations.fatigue_accumulation
          - entities.Technician.fields.fatigue_block_until
          - entities.RotationShift.fields.needs_coverage
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (ticket close, not relocation approve):
          close mutates Technician (callback_minutes_168h 400 -> 720, crossing the 720 cap);
          that Technician mutation sets fatigue_block_until = mitigated_at + 10h AND flags
          the technician's overlapping PUBLISHED shift needs_coverage=true. The shift flag
          is caused by the fatigue mutation, not by the close directly.
        test_recipe:
          setup:
            - "T1 (TECHNICIAN) on shift A ACTIVE 2026-08-01 00:00-12:00; shift B PUBLISHED 2026-08-01 18:00 - 2026-08-02 06:00 (overlaps the impending rest window)"
            - "Ticket 1: dispatched 00:10, mitigated 06:50 (400 callback minutes), closed 07:00 -> fatigue total 400 (< 720, no block)"
            - "Ticket 2: dispatched 07:30, arrived 08:00, mitigated 12:50 (320 callback minutes), incident record SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-502", building_code: "B5" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T12:00:00Z" }, as: PropertyAdmin, captures: { shA: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T18:00:00Z", end_at: "2026-08-02T06:00:00Z" }, as: PropertyAdmin, captures: { shB: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${shA}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:10:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller F", caller_phone: "555-0107", category: "NO_POWER", description: "Breaker keeps tripping" }, as: Dispatcher, captures: { tk1: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk1}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk1}", as: Dispatcher, captures: { tv1: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk1}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv1}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:40:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk1}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:50:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk1}/mitigate", payload: { mitigation_notes: "Faulty breaker isolated", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk1}/incident-record", payload: { narrative: "Breaker swap needed", estimated_damage_cents: 0 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { ir1: $.data.id } }
            - { call: "POST /v1/incident-records/${ir1}/submit", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk1}/close", as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller G", caller_phone: "555-0108", category: "NO_POWER", description: "Second outage, burning smell" }, as: Dispatcher, captures: { tk2: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk2}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk2}", as: Dispatcher, captures: { tv2: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk2}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv2}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk2}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:50:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk2}/mitigate", payload: { mitigation_notes: "Panel made safe", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk2}/incident-record", payload: { narrative: "Panel scorched; electrician follow-up", estimated_damage_cents: 50000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { ir2: $.data.id } }
            - { call: "POST /v1/incident-records/${ir2}/submit", as: OnCallTechnician, as_user_id: "${t1}" }
