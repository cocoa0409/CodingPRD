        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]']
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers fails with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before anything else."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /meters", payload: {}, as: MeterOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "request sent WITHOUT headers: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

