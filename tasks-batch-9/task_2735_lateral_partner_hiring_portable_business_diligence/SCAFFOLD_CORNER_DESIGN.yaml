          - endpoints[GET /lateral-hiring/collection-records]
          - response_envelope.pagination_fields
          - entities.CollectionRecord.fields.status
          - entities.ClientBookEntry.fields.verified_record_count
        distinguishing_aspect: |
          The collection ledger is the one table large enough for paging to matter, and the
          two mechanisms must compose in the right order: FILTER first, then page. total_count
          must describe the filtered set rather than the table, and it must NOT change when
          limit and offset move - so a page-2 read of the same filter reports the same total
          with has_more flipped to false. The UNVERIFIED row is the discriminator: it is
          included by a status-free filter, excluded by status=VERIFIED, and must never be
