      - name: allotment_below_recorded_usage_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_ALLOTMENT_BELOW_RECORDED_USAGE]", "concurrency_rules[lease-amend-stale-version]"]
        distinguishing_aspect: "Amending allotment below already-statemented usage (13.33) rejects at 10 but succeeds at 14; OCC version comes from the activate response."
        test_recipe:
          setup:
            - "Ranch R; LEASED pasture P base 600; lease L (allotment 100, ACTUAL_USE, min 10, rate 2500, tiers 75@3000/@3750, window 2026) ACTIVE (version 2 after activation)"
            - "Group G 20 cows @1000; assignment 2026-05-01..2026-05-31 completed 2026-05-21 (usage 13.33); statement for 2026 ISSUED"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 2400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 600, min_rest_days: 45 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 100, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 75, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease}/activate", payload: {}, as: RangeManager, captures: { lease_v: $.data.version } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-05-01", planned_end_date: "2026-05-31" }, as: RangeManager, captures: { a: $.data.id } }
            - { call: "POST /api/grazing-assignments/${a}/complete", payload: { actual_end_date: "2026-05-21" }, as: RangeManager }
            - { call: "POST /api/lease-statements", payload: { lease_id: "${lease}", ranch_id: "${ranch_id}", period_year: 2026 }, as: RangeManager, as_user_id: "u-range-1", captures: { stmt: $.data.id } }
            - { call: "POST /api/lease-statements/${stmt}/issue", payload: {}, as: RangeManager, as_user_id: "u-range-1" }
          trigger:
            - { call: "PATCH /api/grazing-leases/${lease}", payload: { expected_lease_version: "${lease_v}", aum_allotment: 10 }, as: RangeManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /api/grazing-leases/${lease}", payload: { expected_lease_version: "${lease_v}", aum_allotment: 14 }, as: RangeManager }
          assert:
            - "${err} == ERR_ALLOTMENT_BELOW_RECORDED_USAGE (10 < 13.33 recorded on the ISSUED statement)"
            - "Allotment 14 >= 13.33 succeeds: aum_allotment == 14 and version == ${lease_v} + 1 (the rejected PATCH left the version untouched)"

