# =============================================================================
# Task 1218: Giving Circle & Collective Philanthropy Program — Seed Tables
# Difficulty: beyond Expert (dense cross-entity coupling, 9/9 difficulty rules
# with 2 instances each, 14 entities, 71 endpoints, 35 error codes, 9
# calculations incl. 2 dual-variant pairs, 12 state machines).
# =============================================================================

scenario: |
  1218. Giving Circle & Collective Philanthropy Program (community giving
  circle): member recruitment & contribution level, pooled fund accounting &
  grant budget, nonprofit nomination & vetting process, member voting & grant
  selection, site visit & learning sessions, grant payout & reporting
  requirement for grantees, member retention & annual cycle, host organization
  administrative support

domain_name: giving-circle
api_prefix: /api

complexity_profile:
  primary_archetype: multi-party negotiation   # nomination → vetting → member voting → award
  secondary_archetype: quota / allocation      # pooled fund budget allocation to award tranches
  complexity_layers:
    - optimistic_concurrency    # OCC on GivingCycle.advance and Ballot.recast
    - dual_variant_calculation  # provisional vs final grant budget; BALANCED vs EQUITY_FIRST vetting score
    - cascading_side_effects    # overdue report → nonprofit standing → nomination rejection
    - derived_field_reconciliation  # pooled balance / budget fields recomputed on every financial mutation
    - rate_threshold_triggers   # quorum boundary, session capacity boundary
    - scheduled_actions         # logical clock drives OVERDUE reports, NO_SHOW visits, voting window
  entity_topology: flat                        # peer entities with FK references; /api/<collection> URLs
  state_machine_shape: compound                # linear guarded cycle pipeline + cyclic loops + parallel award dims
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties            # payout requester (CircleAdmin) != approver (FinanceOfficer)
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Circle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Circle display name" }
      - { name: admin_fee_percent, type: integer, source: input, description: "Host org admin fee percent of received funds, integer 0-20" }
      - { name: quorum_percent, type: integer, source: input, description: "Percent of ACTIVE memberships that must cast ballots for a valid vote, integer 1-100" }
      - { name: standard_minimum_cents, type: integer, source: input, description: "Minimum contribution for STANDARD tier, > 0" }
      - { name: leader_minimum_cents, type: integer, source: input, description: "Minimum contribution for LEADER tier, > standard_minimum_cents" }
      - { name: operating_reserve_cents, type: integer, source: input, description: "Reserve subtracted from pooled funds before grant budgeting, >= 0" }
      - { name: vetting_profile, type: enum, source: input, description: "BALANCED | EQUITY_FIRST — selects vetting_score weight variant" }
      - { name: active_member_count, type: integer, source: computed, description: "Count of Memberships with status ACTIVE" }
      - { name: renewed_member_count, type: integer, source: computed, description: "Sum of renewal_count over memberships of this circle" }

  - name: GivingCycle
    parent: null
    common_fields: true
    fields:
      - { name: circle_id, type: string, source: input, description: "FK -> Circle.id; owning circle" }
      - { name: year_label, type: string, source: input, description: "Human label, e.g. 2026" }
      - { name: phase, type: enum, source: system, description: "DRAFT | RECRUITMENT | POOLING | NOMINATION | VETTING | VOTING | AWARD | REPORTING | CLOSED" }
      - { name: quorum_percent, type: integer, source: system, description: "Snapshot of Circle.quorum_percent at creation" }
      - { name: admin_fee_percent, type: integer, source: system, description: "Snapshot of Circle.admin_fee_percent at creation" }
      - { name: operating_reserve_cents, type: integer, source: system, description: "Snapshot of Circle.operating_reserve_cents at creation" }
      - { name: voting_opens_at, type: datetime, source: system, description: "Set when phase enters VOTING", default: null }
      - { name: voting_closes_at, type: datetime, source: system, description: "voting_opens_at + 7 days", default: null }
      - { name: active_member_snapshot, type: integer, source: system, description: "Count of ACTIVE memberships in circle at the moment VOTING opens; frozen thereafter", default: null }
      - { name: received_total_cents, type: integer, source: computed, description: "Sum of amount_cents over Contributions with status RECEIVED", default: 0 }
      - { name: pledged_outstanding_cents, type: integer, source: computed, description: "Sum of amount_cents over Contributions with status PLEDGED", default: 0 }
      - { name: refunded_total_cents, type: integer, source: computed, description: "Sum of amount_cents over Contributions with status REFUNDED", default: 0 }
      - { name: released_total_cents, type: integer, source: computed, description: "Sum of amount_cents over Payouts with status RELEASED", default: 0 }
      - { name: admin_fee_transferred_cents, type: integer, source: computed, description: "Host admin fee moved out of the pool at VOTING->AWARD lock", default: 0 }
      - { name: rollover_in_cents, type: integer, source: computed, description: "Funds carried in via EXECUTED CARRY_FORWARD rollover decisions targeting this cycle", default: 0 }
      - { name: rollover_out_cents, type: integer, source: computed, description: "Funds carried out via EXECUTED CARRY_FORWARD rollover decisions sourced from this cycle", default: 0 }
      - { name: pooled_balance_cents, type: integer, source: computed, description: "received_total - refunded_total - released_total - admin_fee_transferred + rollover_in - rollover_out", default: 0 }
      - { name: grant_budget_provisional_cents, type: integer, source: computed, description: "Provisional budget variant: base = received_total + pledged_outstanding", default: 0 }
      - { name: grant_budget_final_cents, type: integer, source: computed, description: "Final budget variant: base = received_total only; locked at VOTING->AWARD", default: 0 }
      - { name: budget_locked, type: boolean, source: system, description: "True once VOTING->AWARD advance commits the final budget", default: false }
      - { name: ballots_cast_count, type: integer, source: computed, description: "Count of Ballots in this cycle", default: 0 }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Unique email (case-insensitive); ERR_INVALID_REQUEST on duplicate" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: circle_id, type: string, source: input, description: "FK -> Circle.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: tier, type: enum, source: input, description: "STANDARD | LEADER — contribution level" }
      - { name: status, type: enum, source: system, description: "INVITED | ACTIVE | RENEWAL_DUE | LAPSED | WITHDRAWN" }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Pro-rata residual credit granted by RETURN_PRO_RATA rollover execution", default: 0 }

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> GivingCycle.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged amount; must be >= tier minimum of the membership" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | REFUND_REQUESTED | REFUNDED | VOIDED" }
      - { name: received_at, type: datetime, source: system, description: "When receipt was recorded", default: null }

  - name: Nonprofit
    parent: null
    common_fields: true
    fields:
      - { name: ein, type: string, source: input, description: "Tax id, unique; ERR_EIN_CONFLICT on duplicate" }
      - { name: legal_name, type: string, source: input, description: "Legal name" }
      - { name: mission_category, type: string, source: input, description: "Free-form category" }
      - { name: standing, type: enum, source: system, description: "GOOD | SUSPENDED — SUSPENDED when any GranteeReport is OVERDUE; restored to GOOD when no OVERDUE reports remain" }

  - name: Nomination
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> GivingCycle.id" }
      - { name: nonprofit_id, type: string, source: input, description: "FK -> Nonprofit.id" }
      - { name: nominated_by_membership_id, type: string, source: system, description: "FK -> Membership.id; resolved from X-User-ID at creation" }
      - { name: statement, type: string, source: input, description: "Nomination rationale" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VETTING | NEEDS_INFO | FINALIST | AWARDED | NOT_SELECTED | REJECTED | WITHDRAWN" }
      - { name: financial_health, type: integer, source: input, description: "Vetting score 0-100, set via PATCH", default: null }
      - { name: mission_alignment, type: integer, source: input, description: "Vetting score 0-100, set via PATCH", default: null }
      - { name: org_capacity, type: integer, source: input, description: "Vetting score 0-100, set via PATCH", default: null }
      - { name: vetting_score, type: integer, source: computed, description: "Weighted score per circle vetting_profile; round_half_up to integer", default: null }
      - { name: info_rounds_used, type: integer, source: system, description: "Count of VETTING->NEEDS_INFO transitions; max 2", default: 0 }

  - name: SiteVisit
    parent: null
    common_fields: true
    fields:
      - { name: nomination_id, type: string, source: input, description: "FK -> Nomination.id" }
      - { name: starts_at, type: datetime, source: input, description: "Visit start; must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Visit end" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: findings_note, type: string, source: input, description: "Recorded at completion", default: null }

  - name: LearningSession
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> GivingCycle.id" }
      - { name: title, type: string, source: input, description: "Session title" }
      - { name: starts_at, type: datetime, source: input, description: "Session start; must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Session end" }
      - { name: capacity, type: integer, source: input, description: "Max RSVPs, >= 1" }
      - { name: seats_taken, type: integer, source: system, description: "Count of RSVPs", default: 0 }
      - { name: rsvp_membership_ids, type: array, source: system, description: "Membership ids that have RSVPed (uniqueness enforcement)", default: [] }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> GivingCycle.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; must belong to acting member and be ACTIVE" }
      - { name: allocations, type: array, source: input, description: "Array of {nomination_id, points}; 1-5 entries, each points >= 10, sum == 100, all targets FINALIST in this cycle" }
      - { name: status, type: enum, source: system, description: "CAST (only state; recast is a self-loop)" }

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> GivingCycle.id" }
      - { name: nomination_id, type: string, source: system, description: "FK -> Nomination.id of the winning finalist" }
      - { name: nonprofit_id, type: string, source: system, description: "FK -> Nonprofit.id (denormalized from nomination)" }
      - { name: amount_cents, type: integer, source: computed, description: "Award amount from award_allocation rule" }
      - { name: winner_points, type: integer, source: computed, description: "Winning finalist total points" }
      - { name: payout_status, type: enum, source: computed, description: "UNPAID | PARTIALLY_PAID | PAID — parallel dimension derived from Payouts" }
      - { name: reporting_status, type: enum, source: computed, description: "AWAITING_REPORTS | REPORTS_COMPLETE — parallel dimension derived from GranteeReports" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id" }
      - { name: tranche, type: integer, source: system, description: "1 = upfront 70% floor, 2 = remainder" }
      - { name: amount_cents, type: integer, source: computed, description: "Tranche amount from payout_tranche_split" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | APPROVED | RELEASED | FAILED" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the CircleAdmin whose advance created this payout" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving FinanceOfficer", default: null }

  - name: GranteeReport
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id" }
      - { name: report_type, type: enum, source: system, description: "INTERIM (due award_time + 90d) | FINAL (due award_time + 365d)" }
      - { name: due_at, type: datetime, source: system, description: "Due timestamp" }
      - { name: status, type: enum, source: system, description: "DUE | OVERDUE | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: narrative, type: string, source: input, description: "Report narrative at submit", default: null }
      - { name: expenditure_cents, type: integer, source: input, description: "Reported spend at submit", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Last submit timestamp", default: null }
      - { name: reject_reason, type: string, source: input, description: "Required at reject", default: null }

  - name: RolloverDecision
    parent: null
    common_fields: true
    fields:
      - { name: source_cycle_id, type: string, source: input, description: "FK -> GivingCycle.id; must be in REPORTING phase" }
      - { name: target_cycle_id, type: string, source: input, description: "FK -> GivingCycle.id; required for CARRY_FORWARD, must be DRAFT or RECRUITMENT and belong to same circle" }
      - { name: mode, type: enum, source: input, description: "CARRY_FORWARD | RETURN_PRO_RATA" }
      - { name: amount_cents, type: integer, source: computed, description: "Residual pooled_balance_cents of source cycle captured at execution", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | EXECUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GivingCycle
    field: phase
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: RECRUITMENT
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions: ["expected_cycle_version matches current version (ERR_STALE_VERSION)"]
        side_effects: ["GivingCycle.version += 1"]
      - from: RECRUITMENT
        to: POOLING
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "At least 1 Membership of circle_id has status ACTIVE (ERR_NO_ACTIVE_MEMBERS)"
        side_effects: ["GivingCycle.version += 1"]
      - from: POOLING
        to: NOMINATION
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "received_total_cents > 0 (ERR_EMPTY_POOL)"
        side_effects: ["GivingCycle.version += 1"]
      - from: NOMINATION
        to: VETTING
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "At least 1 Nomination in this cycle has status SUBMITTED (ERR_NO_NOMINATIONS)"
        side_effects: ["GivingCycle.version += 1"]
      - from: VETTING
        to: VOTING
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "At least 1 Nomination in this cycle has status FINALIST (ERR_NO_FINALISTS)"
        side_effects:
          - "voting_opens_at = current logical clock; voting_closes_at = opens + 7 days"
          - "active_member_snapshot = count of Memberships of circle_id with status ACTIVE (frozen)"
          - "GivingCycle.version += 1"
      - from: VOTING
        to: AWARD
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "current logical clock > voting_closes_at (ERR_VOTING_STILL_OPEN)"
          - "quorum: ballots_cast_count >= ceil(active_member_snapshot * quorum_percent / 100) (ERR_QUORUM_NOT_MET)"
        side_effects:
          - "Run voting_tally; winning finalist -> GrantAward created (amount via award_allocation on grant_budget_final, winner_points set)"
          - "Winning Nomination.status -> AWARDED; all other FINALIST nominations -> NOT_SELECTED"
          - "Payouts T1 (floor(70%)) and T2 (remainder) created SCHEDULED; requested_by_user_id = acting CircleAdmin X-User-ID"
          - "GranteeReports INTERIM (due now+90d) and FINAL (due now+365d) created in status DUE"
          - "admin_fee_transferred_cents = round_half_up(received_total_cents * admin_fee_percent / 100); pooled_balance_cents recomputed"
          - "budget_locked = true; grant_budget_final_cents frozen"
          - "GivingCycle.version += 1"
      - from: AWARD
        to: REPORTING
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "At least 1 Payout of this cycle's award has status RELEASED (ERR_NO_PAYOUT_RELEASED)"
        side_effects: ["GivingCycle.version += 1"]
      - from: REPORTING
        to: CLOSED
        trigger: "POST /api/cycles/{cycle_id}/advance"
        actor: CircleAdmin
        preconditions:
          - "expected_cycle_version matches (ERR_STALE_VERSION)"
          - "All Payouts of this cycle's award have status RELEASED (ERR_INVALID_STATE otherwise)"
          - "All GranteeReports of this cycle's award have status ACCEPTED (ERR_INVALID_STATE otherwise)"
          - "pooled_balance_cents == 0 OR an EXECUTED RolloverDecision with source_cycle_id == this cycle exists (ERR_ROLLOVER_REQUIRED)"
        side_effects:
          - "Every Membership of circle_id with status ACTIVE -> RENEWAL_DUE (retention cycle)"
          - "GivingCycle.version += 1"

  - entity: Membership
    field: status
    initial_state: INVITED
    terminal_states: [LAPSED, WITHDRAWN]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /api/memberships/{membership_id}/accept"
        actor: Member
        preconditions: ["acting member's X-User-ID == membership.member_id (ERR_FORBIDDEN)"]
        side_effects: ["Circle.active_member_count recomputed"]
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system (side effect of GivingCycle REPORTING->CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /api/memberships/{membership_id}/renew"
        actor: Member
        preconditions: ["acting member owns membership (ERR_FORBIDDEN)", "status == RENEWAL_DUE (ERR_INVALID_STATE)"]
        side_effects: ["renewal_count += 1", "Circle.active_member_count and renewed_member_count recomputed"]
      - from: RENEWAL_DUE
        to: LAPSED
        trigger: "POST /api/memberships/{membership_id}/lapse"
        actor: CircleAdmin
        preconditions: ["status == RENEWAL_DUE (ERR_INVALID_STATE)"]
        side_effects: ["Circle.active_member_count recomputed"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/memberships/{membership_id}/withdraw"
        actor: Member
        preconditions: ["acting member owns membership (ERR_FORBIDDEN)"]
        side_effects:
          - "Cascade: every Contribution of this membership with status PLEDGED -> VOIDED"
          - "Each voided contribution triggers GivingCycle.pledged_outstanding_cents -= amount_cents"
          - "Each pledged_outstanding change triggers grant_budget_provisional_cents recompute"
          - "Circle.active_member_count recomputed"
      - from: RENEWAL_DUE
        to: WITHDRAWN
        trigger: "POST /api/memberships/{membership_id}/withdraw"
        actor: Member
        preconditions: ["acting member owns membership (ERR_FORBIDDEN)"]
        side_effects: ["Same pledge-voiding cascade as ACTIVE -> WITHDRAWN"]

  - entity: Contribution
    field: status
    initial_state: PLEDGED
    terminal_states: [REFUNDED, VOIDED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /api/contributions/{contribution_id}/receive"
        actor: CircleAdmin
        preconditions:
          - "status == PLEDGED (ERR_INVALID_STATE)"
          - "cycle phase == POOLING (ERR_CYCLE_PHASE)"
        side_effects:
          - "received_at = current logical clock"
          - "GivingCycle.received_total_cents += amount_cents; pledged_outstanding_cents -= amount_cents"
          - "GivingCycle.pooled_balance_cents, grant_budget_provisional_cents, grant_budget_final_cents recomputed"
      - from: PLEDGED
        to: VOIDED
        trigger: "system (membership withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: ["pledged_outstanding_cents -= amount_cents; provisional budget recomputed"]
      - from: RECEIVED
        to: REFUND_REQUESTED
        trigger: "POST /api/contributions/{contribution_id}/request-refund"
        actor: Member
        preconditions:
          - "acting member owns contribution.membership_id (ERR_FORBIDDEN)"
          - "status == RECEIVED (ERR_INVALID_STATE)"
          - "Refund window open: cycle phase in {POOLING, NOMINATION, VETTING, VOTING, AWARD} (ERR_REFUND_WINDOW_CLOSED)"
        side_effects: []
      - from: REFUND_REQUESTED
        to: REFUNDED
        trigger: "POST /api/contributions/{contribution_id}/approve-refund"
        actor: CircleAdmin
        preconditions:
          - "status == REFUND_REQUESTED (ERR_INVALID_STATE)"
          - "Underfunding guard: pooled_balance_cents - amount_cents >= sum of amount_cents over this cycle's Payouts with status in {SCHEDULED, APPROVED} (ERR_REFUND_UNDERFUNDS_AWARDS)"
        side_effects:
          - "received_total_cents -= amount_cents; refunded_total_cents += amount_cents"
          - "pooled_balance_cents, grant_budget_provisional_cents recomputed (final budget is locked once budget_locked)"
      - from: REFUND_REQUESTED
        to: RECEIVED
        trigger: "POST /api/contributions/{contribution_id}/deny-refund"
        actor: CircleAdmin
        preconditions: ["status == REFUND_REQUESTED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Nomination
    field: status
    initial_state: SUBMITTED
    terminal_states: [AWARDED, NOT_SELECTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: VETTING
        trigger: "POST /api/nominations/{nomination_id}/start-vetting"
        actor: CircleAdmin
        preconditions: ["cycle phase == VETTING (ERR_CYCLE_PHASE)", "status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VETTING
        to: NEEDS_INFO
        trigger: "POST /api/nominations/{nomination_id}/request-info"
        actor: CircleAdmin
        preconditions:
          - "status == VETTING (ERR_INVALID_STATE)"
          - "info_rounds_used < 2 (ERR_INFO_ROUND_EXHAUSTED)"
        side_effects: ["info_rounds_used += 1"]
      - from: NEEDS_INFO
        to: VETTING
        trigger: "POST /api/nominations/{nomination_id}/submit-info"
        actor: GranteeContact
        preconditions:
          - "acting GranteeContact's X-User-ID == nomination.nonprofit_id (ERR_FORBIDDEN)"
          - "status == NEEDS_INFO (ERR_INVALID_STATE)"
        side_effects: []
      - from: VETTING
        to: FINALIST
        trigger: "POST /api/nominations/{nomination_id}/advance-to-finalist"
        actor: CircleAdmin
        preconditions:
          - "cycle phase == VETTING (ERR_CYCLE_PHASE)"
          - "status == VETTING (ERR_INVALID_STATE)"
          - "Nonprofit.standing == GOOD (ERR_NONPROFIT_SUSPENDED)"
          - "vetting_score >= 70 (ERR_VETTING_SCORE_BELOW_THRESHOLD)"
          - "At least 1 SiteVisit of this nomination has status COMPLETED (ERR_SITE_VISIT_REQUIRED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/nominations/{nomination_id}/reject"
        actor: CircleAdmin
        preconditions: ["status in {SUBMITTED, VETTING, NEEDS_INFO} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VETTING
        to: REJECTED
        trigger: "POST /api/nominations/{nomination_id}/reject or system (nonprofit suspension cascade)"
        actor: CircleAdmin
        preconditions: ["status in {SUBMITTED, VETTING, NEEDS_INFO} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: NEEDS_INFO
        to: REJECTED
        trigger: "POST /api/nominations/{nomination_id}/reject or system (nonprofit suspension cascade)"
        actor: CircleAdmin
        preconditions: ["status in {SUBMITTED, VETTING, NEEDS_INFO} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/nominations/{nomination_id}/withdraw"
        actor: Member
        preconditions: ["acting member owns nomination via nominated_by_membership_id (ERR_FORBIDDEN)", "status in {SUBMITTED, VETTING, NEEDS_INFO} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VETTING
        to: WITHDRAWN
        trigger: "POST /api/nominations/{nomination_id}/withdraw"
        actor: Member
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: []
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /api/nominations/{nomination_id}/withdraw"
        actor: Member
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: []
      - from: FINALIST
        to: AWARDED
        trigger: "system (VOTING->AWARD advance; this finalist won the tally)"
        actor: system
        preconditions: []
        side_effects: ["GrantAward created referencing this nomination"]
      - from: FINALIST
        to: NOT_SELECTED
        trigger: "system (VOTING->AWARD advance; this finalist lost the tally)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SiteVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/site-visits/{visit_id}/complete"
        actor: CircleAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)", "current logical clock >= ends_at (ERR_INVALID_STATE)"]
        side_effects: ["findings_note recorded"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/site-visits/{visit_id}/cancel"
        actor: CircleAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (logical clock advances past ends_at while still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /api/site-visits/{visit_id}/reschedule"
        actor: CircleAdmin
        preconditions: ["status in {CANCELLED, NO_SHOW} (ERR_INVALID_STATE)", "new window passes the site-visit overlap rule (ERR_SITE_VISIT_OVERLAP)"]
        side_effects: ["starts_at/ends_at replaced"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /api/site-visits/{visit_id}/reschedule"
        actor: CircleAdmin
        preconditions: ["same as CANCELLED -> SCHEDULED"]
        side_effects: ["starts_at/ends_at replaced"]

  - entity: LearningSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/learning-sessions/{session_id}/complete"
        actor: CircleAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/learning-sessions/{session_id}/cancel"
        actor: CircleAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Ballot
    field: status
    initial_state: CAST
    terminal_states: []
    transitions:
      - from: CAST
        to: CAST
        trigger: "POST /api/ballots/{ballot_id}/recast"
        actor: Member
        preconditions:
          - "expected_ballot_version matches current version (ERR_STALE_VERSION)"
          - "cycle phase == VOTING and voting window open (ERR_VOTING_WINDOW_CLOSED)"
          - "membership still ACTIVE (ERR_MEMBERSHIP_NOT_ACTIVE)"
          - "new allocations pass points-budget and finalist-reference validation"
        side_effects: ["allocations replaced", "Ballot.version += 1", "cycle tally reflects new allocation immediately"]

  - entity: GrantAward
    field: payout_status
    initial_state: UNPAID
    terminal_states: [PAID]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "system (first Payout of this award -> RELEASED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (all Payouts of this award -> RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GrantAward
    field: reporting_status
    initial_state: AWAITING_REPORTS
    terminal_states: [REPORTS_COMPLETE]
    transitions:
      - from: AWAITING_REPORTS
        to: REPORTS_COMPLETE
        trigger: "system (all GranteeReports of this award -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Payout
    field: status
    initial_state: SCHEDULED
    terminal_states: [RELEASED]
    transitions:
      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /api/payouts/{payout_id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
          - "Segregation of duties: acting X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id = acting X-User-ID"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /api/payouts/{payout_id}/release"
        actor: FinanceOfficer
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
          - "cycle phase in {AWARD, REPORTING} (ERR_CYCLE_PHASE)"
          - "If tranche == 2: the award's INTERIM GranteeReport has status ACCEPTED (ERR_INTERIM_REPORT_NOT_ACCEPTED)"
        side_effects:
          - "GivingCycle.released_total_cents += amount_cents; pooled_balance_cents recomputed"
          - "GrantAward.payout_status recomputed (UNPAID -> PARTIALLY_PAID -> PAID)"
      - from: APPROVED
        to: FAILED
        trigger: "POST /api/payouts/{payout_id}/mark-failed"
        actor: FinanceOfficer
        preconditions: ["status == APPROVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /api/payouts/{payout_id}/retry"
        actor: FinanceOfficer
        preconditions: ["status == FAILED (ERR_INVALID_STATE)"]
        side_effects: ["approved_by_user_id reset to null"]

  - entity: GranteeReport
    field: status
    initial_state: DUE
    terminal_states: [ACCEPTED]
    transitions:
      - from: DUE
        to: OVERDUE
        trigger: "system (logical clock advances past due_at while DUE)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 1: Nonprofit of the award -> standing SUSPENDED"
          - "Cascade hop 2: every Nomination of that Nonprofit with status in {SUBMITTED, VETTING, NEEDS_INFO} whose cycle phase is in {NOMINATION, VETTING} -> REJECTED"
      - from: DUE
        to: SUBMITTED
        trigger: "POST /api/reports/{report_id}/submit"
        actor: GranteeContact
        preconditions: ["acting GranteeContact's X-User-ID == award.nonprofit_id (ERR_FORBIDDEN)", "status in {DUE, OVERDUE, REJECTED} (ERR_INVALID_STATE)"]
        side_effects: ["submitted_at = current logical clock"]
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /api/reports/{report_id}/submit"
        actor: GranteeContact
        preconditions: ["same as DUE -> SUBMITTED"]
        side_effects: ["submitted_at set"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/reports/{report_id}/submit"
        actor: GranteeContact
        preconditions: ["same as DUE -> SUBMITTED"]
        side_effects: ["submitted_at set; reject_reason cleared"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/reports/{report_id}/accept"
        actor: CircleAdmin
        preconditions: ["status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects:
          - "If no OVERDUE reports remain for this Nonprofit: standing -> GOOD"
          - "GrantAward.reporting_status recomputed (-> REPORTS_COMPLETE when all reports ACCEPTED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/reports/{report_id}/reject"
        actor: CircleAdmin
        preconditions: ["status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["reject_reason recorded"]

  - entity: RolloverDecision
    field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/rollover-decisions/{decision_id}/approve"
        actor: CircleAdmin
        preconditions: ["status == PROPOSED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/rollover-decisions/{decision_id}/execute"
        actor: CircleAdmin
        preconditions: ["status == APPROVED (ERR_INVALID_STATE)", "source cycle phase == REPORTING (ERR_CYCLE_PHASE)"]
        side_effects:
          - "amount_cents = source cycle pooled_balance_cents at execution"
          - "Run rollover_waterfall per mode (CARRY_FORWARD credits target cycle; RETURN_PRO_RATA credits memberships)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-advance-stale-version
    parent_entity: GivingCycle
    write_endpoint: "POST /api/cycles/{cycle_id}/advance"
    occ_field: expected_cycle_version
    description: |
      Advancing a cycle with an expected_cycle_version older than the cycle's
      current version is rejected: another write (an earlier advance, a
      contribution receipt, a payout release, or any cascaded recompute) has
      mutated the cycle since the caller last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ballot-recast-stale-version
    parent_entity: Ballot
    write_endpoint: "POST /api/ballots/{ballot_id}/recast"
    occ_field: expected_ballot_version
    description: |
      Recasting a ballot supersedes the caller's prior allocation; when the
      ballot's version has advanced since the caller last observed it, the
      recast is rejected as stale so a superseding allocation is never
      silently overwritten by an older view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: grant_budget
    trigger: "any financial mutation on the cycle (contribution receive/refund/void, payout release, rollover execution); provisional recomputed always, final frozen once budget_locked"
    algorithm: aggregation
    formula: |
      fee(base)   = round_half_up(base * admin_fee_percent / 100)   # integer cents
      provisional_base = received_total_cents + pledged_outstanding_cents
      final_base       = received_total_cents
      grant_budget_provisional_cents = provisional_base - fee(provisional_base) - operating_reserve_cents
      grant_budget_final_cents       = final_base       - fee(final_base)       - operating_reserve_cents
    input_set: "Contributions of this cycle: RECEIVED feed both bases; PLEDGED feed provisional only; REFUND_REQUESTED still count as RECEIVED (status REFUND_REQUESTED keeps funds in the pool until approved); REFUNDED and VOIDED excluded from both"
    constants: {}
    precision: "integer cents; round_half_up applied to the fee only"
    variants:
      - name: provisional
        when: "planning read before budget lock (ledger endpoint, any phase)"
        difference: "base includes PLEDGED contributions, so provisional >= final whenever pledges are outstanding"
      - name: final
        when: "authoritative at award allocation (VOTING->AWARD) and after budget_locked"
        difference: "base excludes PLEDGED; strictly received funds"

  - name: pooled_balance
    trigger: "any mutation touching received/refunded/released/admin_fee_transferred/rollover_in/rollover_out"
    algorithm: aggregation
    formula: |
      pooled_balance_cents = received_total_cents - refunded_total_cents
                             - released_total_cents - admin_fee_transferred_cents
                             + rollover_in_cents - rollover_out_cents
    input_set: "cycle-scoped totals as defined on GivingCycle fields"
    constants: {}
    precision: "integer cents; no rounding"

  - name: vetting_score
    trigger: "PATCH /api/nominations/{id} writing any of financial_health / mission_alignment / org_capacity"
    algorithm: weighted_scoring
    formula: |
      weights selected by the cycle's circle vetting_profile:
        BALANCED:     w_fin=0.40, w_align=0.30, w_cap=0.30
        EQUITY_FIRST: w_fin=0.25, w_align=0.50, w_cap=0.25
      vetting_score = round_half_up(w_fin*financial_health + w_align*mission_alignment + w_cap*org_capacity)
      (null until all three inputs are set)
    input_set: "the three vetting inputs on the nomination; profile from Circle of nomination.cycle_id"
    constants:
      PASS_THRESHOLD: 70
    precision: "integer score 0-100; round_half_up"
    variants:
      - name: balanced
        when: "circle vetting_profile == BALANCED"
        difference: "finance-weighted; identical inputs yield a lower score when alignment dominates"
      - name: equity_first
        when: "circle vetting_profile == EQUITY_FIRST"
        difference: "alignment-weighted; same inputs can flip a 69 fail into a 75 pass"

  - name: award_allocation
    trigger: "VOTING->AWARD advance, once quorum passes"
    algorithm: tiered_pricing
    formula: |
      share = winner_points / total_points_cast          # exact rational
      raw   = share * grant_budget_final_cents
      amount_cents = min(grant_budget_final_cents,
                         max(MIN_AWARD_CENTS, round_half_up(raw)))
    input_set: "winning finalist identified by voting_tally; grant_budget_final_cents locked at this transition"
    constants:
      MIN_AWARD_CENTS: 50000
    precision: "integer cents; round_half_up applied to raw before the min/max clamp"

  - name: payout_tranche_split
    trigger: "VOTING->AWARD advance, immediately after award_allocation"
    algorithm: waterfall_allocation
    formula: |
      # Rounding order is pinned: floor each non-final tranche, assign the
      # remainder to the final tranche. Never round each tranche independently.
      tranche_1 = floor(award.amount_cents * 70 / 100)        # integer floor
      tranche_2 = award.amount_cents - tranche_1              # remainder absorbs the cents
      tranche_1 + tranche_2 == award.amount_cents             # exact, always
    input_set: "the single GrantAward created by the advance"
    constants:
      UPFRONT_PERCENT: 70
    precision: "integer cents; floor for tranche 1, remainder for tranche 2"

  - name: voting_tally
    trigger: "VOTING->AWARD advance (also exposed read-only via GET /api/cycles/{id}/tally)"
    algorithm: aggregation
    formula: |
      For each FINALIST nomination in the cycle:
        total_points = sum of points over every Ballot allocation naming it
        first_choice_count = count of ballots where this finalist holds the
          strictly greatest points value on that ballot (a tie for greatest
          on a ballot gives first-choice to no one)
      Winner = order by total_points DESC,
                    then first_choice_count DESC,
                    then Nomination.created_at ASC
      total_points_cast = sum of total_points over all finalists == 100 * ballots_cast_count
    input_set: "all Ballots of the cycle (all ballots are CAST by construction); only FINALIST nominations are rankable"
    constants:
      POINTS_BUDGET_PER_BALLOT: 100
      MIN_POINTS_PER_ALLOCATION: 10
      MAX_ALLOCATIONS_PER_BALLOT: 5
    precision: "integer points; no rounding"

  - name: quorum_check
    trigger: "VOTING->AWARD advance"
    algorithm: threshold
    formula: |
      quorum_required = ceil(active_member_snapshot * quorum_percent / 100)
      quorum_met      = ballots_cast_count >= quorum_required     # >= : exact equality passes
    input_set: "active_member_snapshot frozen at VOTING entry (post-entry withdrawals do NOT change the requirement); ballots_cast_count counts all Ballots of the cycle"
    constants: {}
    precision: "integer ballot counts; ceil for the requirement"

  - name: rollover_waterfall
    trigger: "POST /api/rollover-decisions/{id}/execute"
    algorithm: waterfall_allocation
    formula: |
      residual = source.pooled_balance_cents (captured as amount_cents)
      if mode == CARRY_FORWARD:
        target.rollover_in_cents += residual
        source.rollover_out_cents += residual
      if mode == RETURN_PRO_RATA:
        eligible = Memberships of source.circle_id with status in {ACTIVE, RENEWAL_DUE},
                   ordered by created_at ASC (tie-break: created_at only; never id)
        weights  = each eligible membership's RECEIVED contribution total in the source cycle
        per membership: credit_i = floor(residual * weight_i / sum(weights))
        leftover = residual - sum(credit_i)  -> added to host admin (not credited to members)
        each membership.credit_balance_cents += credit_i
        source.rollover_out_cents += residual
      source.pooled_balance_cents recomputed (-> 0)
    input_set: "source cycle pool state; eligible memberships and their RECEIVED contributions in source cycle"
    constants: {}
    precision: "integer cents; floor per member, remainder to host"

  - name: host_admin_fee
    trigger: "VOTING->AWARD advance (single transfer)"
    algorithm: threshold
    formula: |
      admin_fee_transferred_cents = round_half_up(received_total_cents * admin_fee_percent / 100)
    input_set: "received_total_cents at budget lock"
    constants: {}
    precision: "integer cents; round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed for the endpoint", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership: Member acts only on own memberships/contributions/nominations/ballots; GranteeContact only on own nonprofit's reports/nominations", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "member- and grantee-scoped endpoints" }
  - { priority: 4, category: existence, check: "Path ids and body FK ids reference existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with ids" }
  - { priority: 5, category: state, check: "Target entity is in a valid from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/action endpoints" }
  - { priority: 6, category: state, check: "GivingCycle phase permits the operation (contribution create/receive in POOLING; nomination create in NOMINATION; vetting ops in VETTING; payout release in AWARD/REPORTING; rollover ops in REPORTING)", error_id: ERR_CYCLE_PHASE, http_status: 409, applies_to: "phase-gated endpoints" }
  - { priority: 7, category: state, check: "Membership status == ACTIVE for contribution create, nomination create, ballot create/recast, session RSVP", error_id: ERR_MEMBERSHIP_NOT_ACTIVE, http_status: 409, applies_to: "member business endpoints" }
  - { priority: 8, category: state, check: "Phase-advance guards: ERR_NO_ACTIVE_MEMBERS, ERR_EMPTY_POOL, ERR_NO_NOMINATIONS, ERR_NO_FINALISTS, ERR_QUORUM_NOT_MET, ERR_VOTING_STILL_OPEN, ERR_NO_PAYOUT_RELEASED, ERR_ROLLOVER_REQUIRED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /api/cycles/{id}/advance" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: payout approver X-User-ID != payout.requested_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/payouts/{id}/approve" }
  - { priority: 10, category: business_temporal, check: "Voting window: ballot create/recast only while phase == VOTING and voting_opens_at <= now <= voting_closes_at", error_id: ERR_VOTING_WINDOW_CLOSED, http_status: 409, applies_to: "POST /api/ballots, POST /api/ballots/{id}/recast" }
  - { priority: 11, category: business_temporal, check: "Refund window: request-refund only while cycle phase in {POOLING, NOMINATION, VETTING, VOTING, AWARD}", error_id: ERR_REFUND_WINDOW_CLOSED, http_status: 409, applies_to: "POST /api/contributions/{id}/request-refund" }
  - { priority: 12, category: business_constraint, check: "Uniqueness: Member.email unique; Nonprofit.ein unique; one Nomination per (cycle, nominating membership); one Ballot per (cycle, membership); no duplicate RSVP per (session, membership)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "create endpoints (see errors for specific ids)" }
  - { priority: 13, category: business_constraint, check: "Temporal overlap: site visits per nonprofit use half-open intervals (adjacency allowed); learning sessions per cycle require a 15-minute buffer", error_id: ERR_SITE_VISIT_OVERLAP, http_status: 409, applies_to: "POST /api/site-visits, POST /api/site-visits/{id}/reschedule, POST /api/learning-sessions (ERR_SESSION_OVERLAP_BUFFER)" }
  - { priority: 14, category: business_constraint, check: "Capacity and counters: session seats_taken < capacity for RSVP; nomination info_rounds_used < 2 for request-info", error_id: ERR_SESSION_FULL, http_status: 409, applies_to: "POST /api/learning-sessions/{id}/rsvp (ERR_SESSION_FULL), POST /api/nominations/{id}/request-info (ERR_INFO_ROUND_EXHAUSTED)" }
  - { priority: 15, category: business_referential, check: "Referenced-entity state: Nonprofit.standing == GOOD for nomination create and finalist advance; >= 1 COMPLETED SiteVisit for finalist advance; INTERIM report ACCEPTED for tranche-2 release", error_id: ERR_NONPROFIT_SUSPENDED, http_status: 409, applies_to: "nomination create/finalist advance (also ERR_SITE_VISIT_REQUIRED, ERR_INTERIM_REPORT_NOT_ACCEPTED)" }
  - { priority: 16, category: business_referential, check: "Ballot allocations reference only FINALIST nominations of this cycle", error_id: ERR_NOT_FINALIST, http_status: 409, applies_to: "POST /api/ballots, POST /api/ballots/{id}/recast" }
  - { priority: 17, category: business_referential, check: "Ballot allocations: 1-5 entries, each points >= 10, sum == 100", error_id: ERR_POINTS_BUDGET, http_status: 409, applies_to: "POST /api/ballots, POST /api/ballots/{id}/recast" }
  - { priority: 18, category: business_fiscal, check: "Contribution amount_cents >= tier minimum (STANDARD -> circle.standard_minimum_cents, LEADER -> leader_minimum_cents)", error_id: ERR_BELOW_TIER_MINIMUM, http_status: 409, applies_to: "POST /api/contributions" }
  - { priority: 19, category: business_fiscal, check: "Vetting gate: vetting_score >= 70 for finalist advance", error_id: ERR_VETTING_SCORE_BELOW_THRESHOLD, http_status: 409, applies_to: "POST /api/nominations/{id}/advance-to-finalist" }
  - { priority: 20, category: business_fiscal, check: "Refund underfunding guard: pooled_balance - refund amount >= remaining SCHEDULED/APPROVED payout obligations of the cycle", error_id: ERR_REFUND_UNDERFUNDS_AWARDS, http_status: 409, applies_to: "POST /api/contributions/{id}/approve-refund" }

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default startup time 2026-05-01T00:00:00Z) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Advance the logical clock; evaluates time-based transitions (report OVERDUE cascade, visit NO_SHOW). Before any call, the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time.", roles: [CircleAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["time-based auto-transitions evaluated"] }

  # --- Circle ---
  - { method: POST, path: "/api/circles", description: "Create a circle (host org config)", roles: [CircleAdmin], code: 201, input: [name, admin_fee_percent, quorum_percent, standard_minimum_cents, leader_minimum_cents, operating_reserve_cents, vetting_profile], output: Circle, side_effects: ["computed counters initialized to 0"] }
  - { method: GET, path: "/api/circles/{circle_id}", description: "Get a circle", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Circle, side_effects: [] }
  - { method: GET, path: "/api/circles", description: "List circles", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["limit?", "offset?"], output: "Circle[]", side_effects: [] }

  # --- GivingCycle ---
  - { method: POST, path: "/api/cycles", description: "Create a giving cycle in DRAFT; snapshots circle config", roles: [CircleAdmin], code: 201, input: [circle_id, year_label], output: GivingCycle, side_effects: ["phase=DRAFT; quorum/admin_fee/reserve snapshotted from Circle"] }
  - { method: GET, path: "/api/cycles/{cycle_id}", description: "Get a cycle", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: GivingCycle, side_effects: [] }
  - { method: GET, path: "/api/cycles", description: "List cycles", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["circle_id?", "phase?", "limit?", "offset?"], output: "GivingCycle[]", side_effects: [] }
  - { method: POST, path: "/api/cycles/{cycle_id}/advance", description: "Advance the cycle one phase (OCC-guarded); guards per hop per state machine", roles: [CircleAdmin], code: 200, input: [expected_cycle_version], output: GivingCycle, side_effects: ["phase transition side effects per §1.2", "increments GivingCycle.version by 1"] }
  - { method: GET, path: "/api/cycles/{cycle_id}/ledger", description: "Computed pooled-fund ledger read", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: { received_total_cents: integer, pledged_outstanding_cents: integer, refunded_total_cents: integer, released_total_cents: integer, admin_fee_transferred_cents: integer, rollover_in_cents: integer, rollover_out_cents: integer, pooled_balance_cents: integer, grant_budget_provisional_cents: integer, grant_budget_final_cents: integer }, side_effects: [] }
  - { method: GET, path: "/api/cycles/{cycle_id}/tally", description: "Computed voting tally read", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: { ballots_cast_count: integer, quorum_required: integer, quorum_met: boolean, finalist_points: array, total_points_cast: integer }, side_effects: [] }

  # --- Member ---
  - { method: POST, path: "/api/members", description: "Register a member record", roles: [CircleAdmin], code: 201, input: [full_name, email], output: Member, side_effects: [] }
  - { method: GET, path: "/api/members/{member_id}", description: "Get a member", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/api/members", description: "List members", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["email?", "limit?", "offset?"], output: "Member[]", side_effects: [] }

  # --- Membership ---
  - { method: POST, path: "/api/memberships", description: "Invite a member to a circle at a contribution tier", roles: [CircleAdmin], code: 201, input: [member_id, circle_id, tier], output: Membership, side_effects: ["status=INVITED"] }
  - { method: GET, path: "/api/memberships/{membership_id}", description: "Get a membership", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Membership, side_effects: [] }
  - { method: GET, path: "/api/memberships", description: "List memberships", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["circle_id?", "member_id?", "status?", "limit?", "offset?"], output: "Membership[]", side_effects: [] }
  - { method: POST, path: "/api/memberships/{membership_id}/accept", description: "Member accepts invitation", roles: [Member], code: 200, input: [], output: Membership, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/api/memberships/{membership_id}/renew", description: "Member renews after cycle close", roles: [Member], code: 200, input: [], output: Membership, side_effects: ["RENEWAL_DUE -> ACTIVE; renewal_count += 1"] }
  - { method: POST, path: "/api/memberships/{membership_id}/lapse", description: "Admin lapses a non-renewing member", roles: [CircleAdmin], code: 200, input: [], output: Membership, side_effects: ["RENEWAL_DUE -> LAPSED"] }
  - { method: POST, path: "/api/memberships/{membership_id}/withdraw", description: "Member withdraws; voids pledged contributions", roles: [Member], code: 200, input: [], output: Membership, side_effects: ["-> WITHDRAWN; PLEDGED contributions -> VOIDED; provisional budget recompute cascade"] }

  # --- Contribution ---
  - { method: POST, path: "/api/contributions", description: "Pledge a contribution into a cycle", roles: [Member], code: 201, input: [cycle_id, membership_id, amount_cents], output: Contribution, side_effects: ["status=PLEDGED; pledged_outstanding_cents += amount; provisional budget recomputed"] }
  - { method: GET, path: "/api/contributions/{contribution_id}", description: "Get a contribution", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Contribution, side_effects: [] }
  - { method: GET, path: "/api/contributions", description: "List contributions", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["cycle_id?", "membership_id?", "status?", "limit?", "offset?"], output: "Contribution[]", side_effects: [] }
  - { method: POST, path: "/api/contributions/{contribution_id}/receive", description: "Record receipt of a pledge", roles: [CircleAdmin], code: 200, input: [], output: Contribution, side_effects: ["PLEDGED -> RECEIVED; received_total/pooled/budgets recomputed"] }
  - { method: POST, path: "/api/contributions/{contribution_id}/request-refund", description: "Member requests a refund within the refund window", roles: [Member], code: 200, input: [], output: Contribution, side_effects: ["RECEIVED -> REFUND_REQUESTED"] }
  - { method: POST, path: "/api/contributions/{contribution_id}/approve-refund", description: "Approve a refund (underfunding-guarded)", roles: [CircleAdmin], code: 200, input: [], output: Contribution, side_effects: ["REFUND_REQUESTED -> REFUNDED; totals and budgets recomputed"] }
  - { method: POST, path: "/api/contributions/{contribution_id}/deny-refund", description: "Deny a refund request", roles: [CircleAdmin], code: 200, input: [], output: Contribution, side_effects: ["REFUND_REQUESTED -> RECEIVED"] }

  # --- Nonprofit ---
  - { method: POST, path: "/api/nonprofits", description: "Register a nonprofit", roles: [CircleAdmin], code: 201, input: [ein, legal_name, mission_category], output: Nonprofit, side_effects: ["standing=GOOD"] }
  - { method: GET, path: "/api/nonprofits/{nonprofit_id}", description: "Get a nonprofit", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Nonprofit, side_effects: [] }
  - { method: GET, path: "/api/nonprofits", description: "List nonprofits", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["ein?", "standing?", "limit?", "offset?"], output: "Nonprofit[]", side_effects: [] }

  # --- Nomination ---
  - { method: POST, path: "/api/nominations", description: "Member nominates a nonprofit (one per member per cycle)", roles: [Member], code: 201, input: [cycle_id, nonprofit_id, statement], output: Nomination, side_effects: ["status=SUBMITTED; nominated_by_membership_id resolved from X-User-ID"] }
  - { method: GET, path: "/api/nominations/{nomination_id}", description: "Get a nomination", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Nomination, side_effects: [] }
  - { method: GET, path: "/api/nominations", description: "List nominations", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["cycle_id?", "nonprofit_id?", "nominated_by_membership_id?", "status?", "limit?", "offset?"], output: "Nomination[]", side_effects: [] }
  - { method: PATCH, path: "/api/nominations/{nomination_id}", description: "Set vetting scores; recomputes vetting_score per circle profile", roles: [CircleAdmin], code: 200, input: ["financial_health?", "mission_alignment?", "org_capacity?"], output: Nomination, side_effects: ["vetting_score recomputed when all three inputs present"] }
  - { method: POST, path: "/api/nominations/{nomination_id}/start-vetting", description: "SUBMITTED -> VETTING", roles: [CircleAdmin], code: 200, input: [], output: Nomination, side_effects: [] }
  - { method: POST, path: "/api/nominations/{nomination_id}/request-info", description: "VETTING -> NEEDS_INFO (max 2 rounds)", roles: [CircleAdmin], code: 200, input: [], output: Nomination, side_effects: ["info_rounds_used += 1"] }
  - { method: POST, path: "/api/nominations/{nomination_id}/submit-info", description: "Grantee returns requested info; NEEDS_INFO -> VETTING", roles: [GranteeContact], code: 200, input: [], output: Nomination, side_effects: [] }
  - { method: POST, path: "/api/nominations/{nomination_id}/advance-to-finalist", description: "VETTING -> FINALIST (score, site-visit, standing gates)", roles: [CircleAdmin], code: 200, input: [], output: Nomination, side_effects: [] }
  - { method: POST, path: "/api/nominations/{nomination_id}/reject", description: "Reject a non-finalist nomination", roles: [CircleAdmin], code: 200, input: [], output: Nomination, side_effects: [] }
  - { method: POST, path: "/api/nominations/{nomination_id}/withdraw", description: "Nominating member withdraws a non-finalist nomination", roles: [Member], code: 200, input: [], output: Nomination, side_effects: [] }

  # --- SiteVisit ---
  - { method: POST, path: "/api/site-visits", description: "Schedule a site visit for a VETTING nomination; half-open overlap rule per nonprofit", roles: [CircleAdmin], code: 201, input: [nomination_id, starts_at, ends_at], output: SiteVisit, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/api/site-visits/{visit_id}", description: "Get a site visit", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: SiteVisit, side_effects: [] }
  - { method: GET, path: "/api/site-visits", description: "List site visits", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["nomination_id?", "status?", "limit?", "offset?"], output: "SiteVisit[]", side_effects: [] }
  - { method: POST, path: "/api/site-visits/{visit_id}/complete", description: "Complete a finished visit", roles: [CircleAdmin], code: 200, input: ["findings_note?"], output: SiteVisit, side_effects: ["SCHEDULED -> COMPLETED (requires clock >= ends_at)"] }
  - { method: POST, path: "/api/site-visits/{visit_id}/cancel", description: "Cancel a scheduled visit", roles: [CircleAdmin], code: 200, input: [], output: SiteVisit, side_effects: ["SCHEDULED -> CANCELLED"] }
  - { method: POST, path: "/api/site-visits/{visit_id}/reschedule", description: "Reschedule a CANCELLED/NO_SHOW visit; overlap rule re-applies", roles: [CircleAdmin], code: 200, input: [starts_at, ends_at], output: SiteVisit, side_effects: ["-> SCHEDULED with new window"] }

  # --- LearningSession ---
  - { method: POST, path: "/api/learning-sessions", description: "Schedule a learning session; 15-minute buffer overlap rule per cycle calendar", roles: [CircleAdmin], code: 201, input: [cycle_id, title, starts_at, ends_at, capacity], output: LearningSession, side_effects: ["status=SCHEDULED; seats_taken=0"] }
  - { method: GET, path: "/api/learning-sessions/{session_id}", description: "Get a session", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: LearningSession, side_effects: [] }
  - { method: GET, path: "/api/learning-sessions", description: "List sessions", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["cycle_id?", "status?", "limit?", "offset?"], output: "LearningSession[]", side_effects: [] }
  - { method: POST, path: "/api/learning-sessions/{session_id}/rsvp", description: "Active member reserves a seat (strict capacity boundary)", roles: [Member], code: 200, input: [membership_id], output: LearningSession, side_effects: ["seats_taken += 1; membership appended to rsvp_membership_ids"] }
  - { method: POST, path: "/api/learning-sessions/{session_id}/complete", description: "Complete a session", roles: [CircleAdmin], code: 200, input: [], output: LearningSession, side_effects: ["SCHEDULED -> COMPLETED"] }
  - { method: POST, path: "/api/learning-sessions/{session_id}/cancel", description: "Cancel a session", roles: [CircleAdmin], code: 200, input: [], output: LearningSession, side_effects: ["SCHEDULED -> CANCELLED"] }

  # --- Ballot ---
  - { method: POST, path: "/api/ballots", description: "Cast a ballot (created directly in CAST); one per membership per cycle", roles: [Member], code: 201, input: [cycle_id, membership_id, allocations], output: Ballot, side_effects: ["ballots_cast_count += 1; tally reflects allocation immediately"] }
  - { method: GET, path: "/api/ballots/{ballot_id}", description: "Get a ballot", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Ballot, side_effects: [] }
  - { method: GET, path: "/api/ballots", description: "List ballots", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["cycle_id?", "membership_id?", "status?", "limit?", "offset?"], output: "Ballot[]", side_effects: [] }
  - { method: POST, path: "/api/ballots/{ballot_id}/recast", description: "Replace a ballot's allocations while the window is open (OCC-guarded)", roles: [Member], code: 200, input: [allocations, expected_ballot_version], output: Ballot, side_effects: ["allocations replaced; tally updated", "increments Ballot.version by 1"] }

  # --- GrantAward (system-created at VOTING->AWARD) ---
  - { method: GET, path: "/api/awards/{award_id}", description: "Get an award", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: GrantAward, side_effects: [] }
  - { method: GET, path: "/api/awards", description: "List awards", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["cycle_id?", "nomination_id?", "nonprofit_id?", "limit?", "offset?"], output: "GrantAward[]", side_effects: [] }

  # --- Payout ---
  - { method: GET, path: "/api/payouts/{payout_id}", description: "Get a payout", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: GET, path: "/api/payouts", description: "List payouts; deterministic order: tranche ASC", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["award_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: POST, path: "/api/payouts/{payout_id}/approve", description: "Finance approves a scheduled payout (segregation of duties)", roles: [FinanceOfficer], code: 200, input: [], output: Payout, side_effects: ["SCHEDULED -> APPROVED"] }
  - { method: POST, path: "/api/payouts/{payout_id}/release", description: "Finance releases an approved payout; tranche 2 gated on INTERIM report acceptance", roles: [FinanceOfficer], code: 200, input: [], output: Payout, side_effects: ["APPROVED -> RELEASED; released_total/pooled recomputed; award payout_status recomputed"] }
  - { method: POST, path: "/api/payouts/{payout_id}/mark-failed", description: "Mark an approved payout failed", roles: [FinanceOfficer], code: 200, input: [], output: Payout, side_effects: ["APPROVED -> FAILED"] }
  - { method: POST, path: "/api/payouts/{payout_id}/retry", description: "Return a failed payout to SCHEDULED", roles: [FinanceOfficer], code: 200, input: [], output: Payout, side_effects: ["FAILED -> SCHEDULED; approved_by_user_id reset"] }

  # --- GranteeReport ---
  - { method: GET, path: "/api/reports/{report_id}", description: "Get a report", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: GranteeReport, side_effects: [] }
  - { method: GET, path: "/api/reports", description: "List reports; deterministic order: due_at ASC (INTERIM before FINAL)", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["award_id?", "status?", "limit?", "offset?"], output: "GranteeReport[]", side_effects: [] }
  - { method: POST, path: "/api/reports/{report_id}/submit", description: "Grantee submits (or resubmits after rejection) a report", roles: [GranteeContact], code: 200, input: [narrative, expenditure_cents], output: GranteeReport, side_effects: ["-> SUBMITTED; submitted_at set"] }
  - { method: POST, path: "/api/reports/{report_id}/accept", description: "Accept a submitted report; may restore nonprofit standing and complete award reporting", roles: [CircleAdmin], code: 200, input: [], output: GranteeReport, side_effects: ["SUBMITTED -> ACCEPTED; standing/award reporting_status recomputed"] }
  - { method: POST, path: "/api/reports/{report_id}/reject", description: "Reject a submitted report with reason", roles: [CircleAdmin], code: 200, input: [reject_reason], output: GranteeReport, side_effects: ["SUBMITTED -> REJECTED"] }

  # --- RolloverDecision ---
  - { method: POST, path: "/api/rollover-decisions", description: "Propose handling of a REPORTING-phase cycle's residual pool", roles: [CircleAdmin], code: 201, input: [source_cycle_id, "target_cycle_id?", mode], output: RolloverDecision, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/api/rollover-decisions/{decision_id}", description: "Get a rollover decision", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: [], output: RolloverDecision, side_effects: [] }
  - { method: GET, path: "/api/rollover-decisions", description: "List rollover decisions", roles: [CircleAdmin, FinanceOfficer, Member, GranteeContact], code: 200, input: ["source_cycle_id?", "target_cycle_id?", "status?", "limit?", "offset?"], output: "RolloverDecision[]", side_effects: [] }
  - { method: POST, path: "/api/rollover-decisions/{decision_id}/approve", description: "Approve a proposed decision", roles: [CircleAdmin], code: 200, input: [], output: RolloverDecision, side_effects: ["PROPOSED -> APPROVED"] }
  - { method: POST, path: "/api/rollover-decisions/{decision_id}/execute", description: "Execute an approved decision; runs rollover_waterfall", roles: [CircleAdmin], code: 200, input: [], output: RolloverDecision, side_effects: ["APPROVED -> EXECUTED; waterfall per mode; source pooled_balance -> 0"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum value, starts_at >= ends_at, duplicate Member.email" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership check failed (Member/GranteeContact acting on another's resources)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (incl. closing with unreleased payouts or unaccepted reports)" }
  - { id: ERR_CYCLE_PHASE, http: 409, condition: "Operation not permitted in the cycle's current phase" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Membership must be ACTIVE for contribution, nomination, ballot, or RSVP" }
  - { id: ERR_NONPROFIT_SUSPENDED, http: 409, condition: "Nonprofit standing is SUSPENDED (overdue grantee report)" }
  - { id: ERR_EIN_CONFLICT, http: 409, condition: "Nonprofit EIN already registered" }
  - { id: ERR_DUPLICATE_NOMINATION, http: 409, condition: "Membership already nominated in this cycle" }
  - { id: ERR_DUPLICATE_BALLOT, http: 409, condition: "Membership already cast a ballot in this cycle" }
  - { id: ERR_ALREADY_RSVPED, http: 409, condition: "Membership already holds a seat on this session" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "seats_taken == capacity; the boundary is strict-less-than" }
  - { id: ERR_SESSION_OVERLAP_BUFFER, http: 409, condition: "Learning session violates the 15-minute buffer against another SCHEDULED session in the same cycle" }
  - { id: ERR_SITE_VISIT_OVERLAP, http: 409, condition: "Site visit overlaps another SCHEDULED/COMPLETED visit for the same nonprofit (half-open; adjacency allowed)" }
  - { id: ERR_INFO_ROUND_EXHAUSTED, http: 409, condition: "info_rounds_used == 2; no further NEEDS_INFO rounds" }
  - { id: ERR_VETTING_SCORE_BELOW_THRESHOLD, http: 409, condition: "vetting_score < 70 at finalist advance" }
  - { id: ERR_SITE_VISIT_REQUIRED, http: 409, condition: "Finalist advance requires >= 1 COMPLETED site visit" }
  - { id: ERR_NOT_FINALIST, http: 409, condition: "Ballot allocation references a nomination that is not FINALIST in this cycle" }
  - { id: ERR_POINTS_BUDGET, http: 409, condition: "Allocations violate 1-5 entries / >=10 points each / sum == 100" }
  - { id: ERR_BELOW_TIER_MINIMUM, http: 409, condition: "Contribution amount below the membership tier minimum" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 409, condition: "Refund requested outside phases POOLING..AWARD" }
  - { id: ERR_REFUND_UNDERFUNDS_AWARDS, http: 409, condition: "Refund would drop pooled balance below remaining SCHEDULED/APPROVED payout obligations" }
  - { id: ERR_VOTING_WINDOW_CLOSED, http: 409, condition: "Ballot cast/recast outside [voting_opens_at, voting_closes_at]" }
  - { id: ERR_VOTING_STILL_OPEN, http: 409, condition: "VOTING->AWARD advance attempted before voting_closes_at has passed" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "ballots_cast_count < quorum requirement at VOTING->AWARD" }
  - { id: ERR_NO_ACTIVE_MEMBERS, http: 409, condition: "RECRUITMENT->POOLING advance with zero ACTIVE memberships" }
  - { id: ERR_EMPTY_POOL, http: 409, condition: "POOLING->NOMINATION advance with received_total_cents == 0" }
  - { id: ERR_NO_NOMINATIONS, http: 409, condition: "NOMINATION->VETTING advance with no SUBMITTED nomination" }
  - { id: ERR_NO_FINALISTS, http: 409, condition: "VETTING->VOTING advance with no FINALIST nomination" }
  - { id: ERR_NO_PAYOUT_RELEASED, http: 409, condition: "AWARD->REPORTING advance before any payout RELEASED" }
  - { id: ERR_ROLLOVER_REQUIRED, http: 409, condition: "REPORTING->CLOSED with residual pool and no EXECUTED rollover decision" }
  - { id: ERR_INTERIM_REPORT_NOT_ACCEPTED, http: 409, condition: "Tranche-2 release before INTERIM report ACCEPTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Payout approver is the same X-User-ID that requested it" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CircleAdmin
    description: "Host organization program administrator; runs cycles, vetting, sessions, refunds, rollovers, report review"
    identity: opaque
    exclusive_operations:
      - "create circles/cycles/nonprofits/members/memberships"
      - "advance cycles; record contribution receipt; approve/deny refunds"
      - "vetting operations (start-vetting, request-info, score, finalist advance, reject)"
      - "schedule/complete/cancel site visits and learning sessions"
      - "accept/reject grantee reports; propose/approve/execute rollovers; lapse memberships"
      - "set the logical clock"
    shared_operations: ["all GET endpoints"]
  - name: FinanceOfficer
    description: "Host organization finance officer; payout approval and release under segregation of duties"
    identity: opaque
    exclusive_operations: ["approve, release, mark-failed, retry payouts"]
    shared_operations: ["all GET endpoints"]
  - name: Member
    description: "Giving circle member; X-User-ID equals a Member.id"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "accept/renew/withdraw own membership"
      - "pledge contributions and request refunds on own contributions"
      - "nominate nonprofits and withdraw own nominations"
      - "cast and recast own ballots; RSVP to learning sessions"
    shared_operations: ["all GET endpoints"]
  - name: GranteeContact
    description: "Nonprofit contact; X-User-ID equals a Nonprofit.id"
    identity: "entity_backed:Nonprofit"
    exclusive_operations: ["submit vetting info for own nonprofit's nominations", "submit grantee reports for own awards"]
    shared_operations: ["all GET endpoints"]
