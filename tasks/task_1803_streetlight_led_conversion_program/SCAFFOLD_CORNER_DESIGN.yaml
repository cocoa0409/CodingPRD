scaffold_corner_design:
- section: entities
  instances:
  - name: entity_program_create_defaults_envelope
    claim_type: creation
    grounds:
    - entities.ConversionProgram
    - response_envelope
    distinguishing_aspect: Create returns 201 with success envelope (meta.api_request_id, response_type object), status DRAFT, budget_balance_cents == program_budget_cents, all rollups 0, version 1; system
      fields server-minted.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: GET /streetlights/programs
        payload: {}
        as: ProgramManager
      trigger:
      - call: POST /streetlights/programs
        payload:
          program_name: P0
          program_budget_cents: 1000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      assert:
      - HTTP 201; envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == object
      - 'ConversionProgram.${pgm}: status == DRAFT, budget_balance_cents == 1000000, current_billing_run_estimated_cents == 0, converted_pole_count == 0, pending_salvage_item_count == 0, version == 1'
      - Prior GET list returned total_count == 0, has_more == false, data == []
  - name: entity_district_zone_derived_fields
    claim_type: computed_fields
    grounds:
    - entities.ServiceDistrict.fields.cct_cap_kelvin
    - entities.ServiceDistrict.fields.full_cutoff_required
    distinguishing_aspect: 'Zone drives derived policy fields: RURAL -> cct_cap_kelvin 2200 + full_cutoff_required true; ARTERIAL -> 4000 + false.'
    test_recipe:
      setup:
      - ACTIVE program
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 1000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      trigger:
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: DR
          zone: RURAL
        as: ProgramManager
        captures:
          dr: $.data.id
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: DA
          zone: ARTERIAL
        as: ProgramManager
        captures:
          da: $.data.id
      assert:
      - ServiceDistrict.${dr}.cct_cap_kelvin == 2200 AND full_cutoff_required == true
      - ServiceDistrict.${da}.cct_cap_kelvin == 4000 AND full_cutoff_required == false
  - name: entity_pole_duplicate_number_rejected
    claim_type: type_constraints
    grounds:
    - validations[priority=17]
    - errors[ERR_DUPLICATE_POLE_NUMBER]
    distinguishing_aspect: 'pole_number is unique per program across districts: second create with the same number in a DIFFERENT district of the same program fails with ERR_DUPLICATE_POLE_NUMBER (409).'
    test_recipe:
      setup:
      - ACTIVE program with districts D1 and D2; pole M-001 in D1
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 1000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          d1: $.data.id
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D2
          zone: RURAL
        as: ProgramManager
        captures:
          d2: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${d1}
          pole_number: M-001
          ownership_type: MUNICIPAL
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      trigger:
      - call: POST /streetlights/poles
        payload:
          district_id: ${d2}
          pole_number: M-001
          ownership_type: UTILITY_OWNED
          fixture_class: FLOOD
          nameplate_wattage: 150
        as: ProgramManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DUPLICATE_POLE_NUMBER
      - GET /streetlights/poles?district_id=${d2} returns total_count == 0
  - name: entity_pole_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_POLE_NOT_FOUND]
    - validations[priority=4]
    distinguishing_aspect: GET with a well-formed but absent pole id returns 404 ERR_POLE_NOT_FOUND in the error envelope (response_type error, data.error_id).
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: GET /streetlights/programs
        payload: {}
        as: ProgramManager
      trigger:
      - call: GET /streetlights/poles/00000000-0000-0000-0000-000000000000
        payload: {}
        as: ProgramManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_POLE_NOT_FOUND AND http status 404 AND response_type == error
  - name: entity_list_pagination_and_status_filter
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints[GET /streetlights/poles]
    distinguishing_aspect: 'Pagination defaults/limits and status filter interact: 12 poles -> limit 5 page1 has_more true; offset 10 yields 2 items has_more false; status filter narrows to exactly the
      3 attested poles.'
    test_recipe:
      setup:
      - ACTIVE program, one district, 12 UTILITY_OWNED poles; 3 of them attested (AUDIT_CLEARED)
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-01
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          l1: $.data.id
      - call: POST /streetlights/poles/${l1}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-02
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          l2: $.data.id
      - call: POST /streetlights/poles/${l2}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-03
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          l3: $.data.id
      - call: POST /streetlights/poles/${l3}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-04
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-05
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-06
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-07
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-08
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-09
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-10
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-11
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: L-12
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
      trigger:
      - call: GET /streetlights/poles
        payload:
          district_id: ${dist}
          limit: 5
          offset: 0
        as: BillingAnalyst
      - call: GET /streetlights/poles
        payload:
          district_id: ${dist}
          limit: 5
          offset: 10
        as: BillingAnalyst
      - call: GET /streetlights/poles
        payload:
          district_id: ${dist}
          status: AUDIT_CLEARED
        as: BillingAnalyst
      assert:
      - 'Page 1: data length == 5, total_count == 12, has_more == true'
      - 'Page 3 (offset 10): data length == 2, has_more == false'
      - 'Status filter AUDIT_CLEARED: total_count == 3'
  - name: entity_district_invalid_enum_and_missing_required_rejected
    claim_type: required_fields
    grounds:
    - validations[priority=2]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'Shape validation precedes FK existence: bad enum zone AND a bogus program_id still surfaces ERR_INVALID_REQUEST (priority 2 beats priority 4); missing district_name likewise.'
    test_recipe:
      setup:
      - ACTIVE program
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 1000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      trigger:
      - call: POST /streetlights/districts
        payload:
          program_id: 00000000-0000-0000-0000-000000000000
          district_name: BAD
          zone: UPTOWN
        as: ProgramManager
        captures:
          err1: $.data.error_id
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          zone: RURAL
        as: ProgramManager
        captures:
          err2: $.data.error_id
      assert:
      - '${err1} == ERR_INVALID_REQUEST   # enum shape beats program_id existence'
      - '${err2} == ERR_INVALID_REQUEST   # missing required district_name'
  - name: entity_salvage_item_weight_invalid_request
    claim_type: type_constraints
    grounds:
    - validations[priority=2]
    - entities.SalvageItem.fields.weight_lbs
    distinguishing_aspect: weight_lbs with more than 1 decimal place (10.55) is rejected ERR_INVALID_REQUEST at batch-add.
    test_recipe:
      setup:
      - ACTIVE program, district, crew; one UTILITY_OWNED pole attested and converted (route 2026-08-02, completed at clock 2026-08-02T10:00:00Z); one unbatched SalvageItem; batch B ACCUMULATING
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: W-1
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
      - call: POST /streetlights/poles/${pole}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-02'
          window_end_date: '2026-08-02'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo: $.data.0.id
      - call: POST /streetlights/work-orders/${wo}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 2700
          shielding: FULL_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo}/complete
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: GET /streetlights/salvage-items
        payload:
          pole_id: ${pole}
        as: ProgramManager
        captures:
          item: $.data.0.id
      - call: POST /streetlights/salvage-batches
        payload:
          program_id: ${pgm}
          batch_label: B-W
        as: ProgramManager
        captures:
          batch: $.data.id
      trigger:
      - call: POST /streetlights/salvage-batches/${batch}/items
        payload:
          salvage_item_id: ${item}
          weight_lbs: 10.55
          mercury_flag: false
        as: ProgramManager
        captures:
          err: $.data.error_id
      assert:
      - '${err} == ERR_INVALID_REQUEST   # 2 decimal places on weight_lbs'
      - SalvageItem.${item}.batch_id == null still (rejected add leaves the pool unchanged)
- section: state_machines
  instances:
  - name: sm_pole_initial_state_gates_stop_add
    claim_type: initial_state
    grounds:
    - state_machines.Pole
    - validations[priority=9]
    - errors[ERR_POLE_NOT_AUDIT_CLEARED]
    distinguishing_aspect: A newly created pole is SURVEYED; stop-add on a SURVEYED pole fails ERR_POLE_NOT_AUDIT_CLEARED and leaves no stop behind.
    test_recipe:
      setup:
      - ACTIVE program, district, crew; pole P SURVEYED; route 2026-08-03..2026-08-03 PLANNED
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 1000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: G-1
          ownership_type: MUNICIPAL
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-03'
          window_end_date: '2026-08-03'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      trigger:
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_POLE_NOT_AUDIT_CLEARED AND Pole.${pole}.status == SURVEYED
      - GET /streetlights/route-stops?route_id=${route} returns total_count == 0
  - name: sm_audit_dispute_resubmit_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.WattageAudit
    distinguishing_aspect: 'Cyclic audit loop SUBMITTED -> DISPUTED -> SUBMITTED -> ACCEPTED: resubmit bumps revision_count to 1 and replaces audited_wattage; accept then sets pole effective_wattage to
      the REVISED 240 and clears the pole.'
    test_recipe:
      setup:
      - ACTIVE program, district, crew; MUNICIPAL pole nameplate 250 (SURVEYED)
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 1000000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: A-1
          ownership_type: MUNICIPAL
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
          pole_v: $.data.version
      - call: POST /streetlights/poles/${pole}/audits
        payload:
          audited_wattage: 260
          expected_pole_version: ${pole_v}
        as: FieldSupervisor
        as_user_id: ${crew}
        captures:
          aud: $.data.id
      - call: POST /streetlights/audits/${aud}/dispute
        payload: {}
        as: ProgramManager
      trigger:
      - call: POST /streetlights/audits/${aud}/resubmit
        payload:
          audited_wattage: 240
          auditor_notes: re-read meter
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/audits/${aud}/accept
        payload: {}
        as: ProgramManager
      assert:
      - 'After resubmit: WattageAudit.${aud}.status == SUBMITTED AND revision_count == 1 AND audited_wattage == 240'
      - 'After accept: WattageAudit.${aud}.status == ACCEPTED AND Pole.${pole}.effective_wattage == 240 AND Pole.${pole}.status == AUDIT_CLEARED AND Pole.${pole}.wattage_tier == T3'
  - name: sm_work_order_fail_auto_requeue
    claim_type: side_effect_execution
    grounds:
    - state_machines.WorkOrder.DISPATCHED_to_FAILED
    - state_machines.WorkOrder.FAILED_to_PENDING
    distinguishing_aspect: fail moves the work order DISPATCHED -> FAILED and the system immediately re-queues to PENDING; the estimate stays debited (no refund) and the linked stop stays PENDING.
    test_recipe:
      setup:
      - ACTIVE program (budget 100000), ARTERIAL district, crew; one UTILITY_OWNED pole attested; route 2026-08-03 one STANDARD stop, RELEASED; work order dispatched (est 4500 debited)
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 100000
          fy_rebate_cap_cents: 50000
          rebate_cents_per_kwh: 25
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: DA
          zone: ARTERIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: F-1
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
      - call: POST /streetlights/poles/${pole}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-03'
          window_end_date: '2026-08-03'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
        captures:
          stop: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo: $.data.0.id
      - call: POST /streetlights/work-orders/${wo}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 3000
          shielding: SEMI_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      trigger:
      - call: POST /streetlights/work-orders/${wo}/fail
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      assert:
      - 'WorkOrder.${wo}.execution_status == PENDING   # FAILED is transient; auto re-queued'
      - 'ConversionProgram.${pgm}.budget_balance_cents == 95500   # estimate NOT refunded on fail'
      - RouteStop.${stop}.status == PENDING AND Pole.${pole}.status == SCHEDULED
  - name: sm_ticket_terminal_lockdown_family
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.OutageTicket
    - errors[ERR_TICKET_NOT_OPEN]
    - errors[ERR_TICKET_NOT_DISPATCHED]
    - errors[ERR_TICKET_NOT_RESOLVED]
