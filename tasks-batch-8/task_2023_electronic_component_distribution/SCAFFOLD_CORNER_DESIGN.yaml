      - name: unknown_ids_across_resources_return_404
        claim_type: not_found
        grounds: ["errors[ERR_MANUFACTURER_LINE_NOT_FOUND]", "errors[ERR_CUSTOMER_NOT_FOUND]", "errors[ERR_ORDER_LINE_NOT_FOUND]", "errors[ERR_LOT_NOT_FOUND]", "errors[ERR_EXPOSURE_NOT_FOUND]", "errors[ERR_REGISTRATION_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]", "errors[ERR_BUYBACK_NOT_FOUND]", "errors[ERR_ALLOCATION_RUN_NOT_FOUND]", "errors[ERR_ALTERNATE_APPROVAL_NOT_FOUND]", "validations[priority=3]"]
