      - name: discount_approval_reject_revise_cycle
        grounds:
          - state_machines.DiscountApproval.PENDING_to_REJECTED
          - state_machines.DiscountApproval.REJECTED_to_PENDING
          - state_machines.DiscountApproval.PENDING_to_APPROVED
          - calculations.discount_tier_and_margin
          - calculations.discount_tier_and_margin.variants.LEVEL_FLOOR
          - entities.DiscountApproval.fields.revision_count
          - validations[priority=41]
          - endpoints[POST /discount-approvals/{id}/revise]
        distinguishing_aspect: |
          The cycle lives on DiscountApproval: REJECTED -> PENDING re-enters a state the row
          already left, and the re-entry is not a replay — the revise re-runs S1-S7 from
          scratch, so required_tier drops L2_FINANCE -> L1_PRACTICE_PARTNER and revision_count
          is what makes the loop finite and auditable.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill, no consultants and no assignments at all — so every S3 evaluation uses the LEVEL_FLOOR variant."
            - "One QUALIFIED demand: min_proficiency_level 3 (LEVEL_FLOOR cost 80.00), standard 250.00, requested 250.00."
            - "One PENDING DiscountApproval requested by user u_sales_1 at 200.00: discount_pct 20.00 -> required_tier L2_FINANCE, projected_margin_pct 60.00 so S6 does not escalate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: SalesLead
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
