              payload: {"listing_id": "${listing_id}", "customer_ref": "A2-MESA", "service_start_date": "2023-06-01", "route_day": "MON", "monthly_service_fee_cents": 15000, "avg_monthly_chemical_cents": 5000, "avg_monthly_repair_cents": 2000, "chemical_billing_method": "PASS_THROUGH", "billing_frequency": "MONTHLY"}
              as: Broker
