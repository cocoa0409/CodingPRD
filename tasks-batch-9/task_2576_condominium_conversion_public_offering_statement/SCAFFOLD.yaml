      and refusing verification for every component is how the NO_VERIFIED_COMPONENTS empty-set
      fallback is reached."
    roles: [PeerReviewEngineer]
    code: 200
    input: [verified]
    output: MajorComponent
    side_effects: ["verification_status := VERIFIED when verified == true, else UNVERIFIED",
      "EngineeringReport.verified_component_count recomputed", "version += 1"]

