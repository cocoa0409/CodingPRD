              payload: { attribution_method: "PROPORTIONAL" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /take-back-notices"
              payload: { payer_id: "${payer_med_id}", notice_number: "TB-1", total_recoup_cents: 10000, admin_fee_cents: 1000 }
              as: PayerLiaison
              as_user_id: "${payer_med_id}"
              captures: { tb1_id: "$.data.id", tb1_v: "$.data.version" }
            - call: "POST /take-back-notices/${tb1_id}/offset-applications"
              payload: { target_account_ids: ["${acct_oa1_id}", "${acct_oa2_id}", "${acct_oa3_id}"], expected_take_back_notice_version: "${tb1_v}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { off1_id: "$.data[0].id", off3_id: "$.data[2].id" }
          trigger:
            - call: "POST /offset-applications/${off3_id}/reverse"
              payload: { reason: "Line applied to the wrong account" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          assert:
            - "OffsetApplication.${off3_id}.state == REVERSED"
            - "TakeBackNotice.${tb1_id}.applied_cents == 6666"
            - "TakeBackNotice.${tb1_id}.remaining_unapplied_cents == 3334"
            - "TakeBackNotice.${tb1_id}.total_recoup_cents == 10000"
            - "TakeBackNotice.${tb1_id}.applied_cents + TakeBackNotice.${tb1_id}.remaining_unapplied_cents == 10000"
            - "TakeBackNotice.${tb1_id}.state == PARTIALLY_APPLIED"
            - "OffsetApplication.${off1_id}.state == APPLIED and OffsetApplication.${off1_id}.applied_cents == 3333"
            - "CreditBalance.${cb_oa3_id}.offset_cents == 0"
            - "CreditBalance.${cb_oa3_id}.outstanding_cents == 5000"
            - "PatientAccount.${acct_oa3_id}.balance_cents == -5000"

      - name: account_ledger_balance_conserved_across_posting_and_manual_reversal
        grounds:
          - entities.PatientAccount.fields.balance_cents
          - entities.AccountTransaction.fields.is_reversed
          - entities.AccountTransaction.fields.reversal_of_transaction_id
          - validations[priority=16]
        distinguishing_aspect: |
          A third conserved quantity of a different kind — the append-only ledger
          identity PatientAccount.balance_cents == sum(AccountTransaction.amount_cents)
          over every row on the account. A mis-posted -9000 PATIENT payment moves the
          balance from -12000 to -21000, and its REVERSAL row of +9000 restores it to
          exactly -12000 while both rows remain in the ledger and the original carries
          is_reversed true.
        test_recipe:
          setup:
            - "A COMMERCIAL payer and account LG1 charged +50000 on 2026-08-01 and paid -62000 by the PATIENT on 2026-08-05, so balance_cents is -12000 across two ledger rows."
            - "A mis-posted PATIENT payment of -9000 was recorded on 2026-08-06, taking balance_cents to -21000 across three rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-LG1", mrn: "MRN-LG1", patient_name: "Lena Gore", guarantor_state_code: "NY", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_lg1_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_lg1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_lg1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_lg1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -9000, source: "PATIENT", remark: "Posted to the wrong account" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { txn_bad_id: "$.data.id" }
          trigger:
            - call: "POST /account-transactions/${txn_bad_id}/reverse"
              payload: { remark: "Correcting a wrong-account posting" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { txn_rev_id: "$.data.id" }
          assert:
            - "AccountTransaction.${txn_rev_id}.txn_type == REVERSAL"
            - "AccountTransaction.${txn_rev_id}.amount_cents == 9000"
            - "AccountTransaction.${txn_rev_id}.reversal_of_transaction_id == ${txn_bad_id}"
            - "AccountTransaction.${txn_bad_id}.is_reversed == true"
            - "PatientAccount.${acct_lg1_id}.balance_cents == -12000"
            - "GET /account-transactions?account_id=${acct_lg1_id} returns total_count == 4 and the amount_cents values sum to -12000"
            - "a second POST /account-transactions/${txn_bad_id}/reverse returns HTTP 409 with data.error_id == ERR_TRANSACTION_ALREADY_REVERSED"
