scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_settlement_protected_state_diverges_from_protected_nsa_on_identical_lines
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.protection_variant
          - entities.PayerContract.fields.state_protection_regime
          - entities.Claim.fields.balance_bill_amount_cents
        distinguishing_aspect: |
          Money domain on Claim: two identical 282500-cent billed bundles adjudicated under two
          out-of-network contracts recognise different allowed totals (PROTECTED_NSA takes the
          190000 QPA, PROTECTED_STATE takes the 226000 state benchmark), so allowed, cost share,
          plan payment and write-off all differ on byte-identical line sets.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility 'Cedar Freestanding ED' (TX, INDEPENDENT_FREESTANDING_ED, ACTIVE) with imaging_scope [XRAY, CT, ULTRASOUND], lab_scope [CBC, CHEMISTRY, TROPONIN], pharmacy_scope_tier EMERGENCY_ONLY, observation_bed_count 4, max_concurrent_physicians 2"
            - "Template V1 (facility_fee_cents 145000) PUBLISHED and signage ATTESTED by a different operator, so compliance_posture == OPEN"
            - "Two payer contracts, both OUT_OF_NETWORK with QPA 190000, coinsurance 0.20 and deductible remaining 50000: PC-NSA under FEDERAL_NSA_ONLY and PC-STATE under STATE_PROTECTED_FSED"
            - "Two encounters, each ACKNOWLEDGED, screened, given RESULTED ancillary lines CT x2 (98000), TROPONIN x2 (31000), ANALGESIC x1 (8500) in that creation order, then DISCHARGED as STABLE - billed_total 282500 on both"
            - "One claim per encounter, one per contract, both still DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT", "ULTRASOUND"], lab_scope: ["CBC", "CHEMISTRY", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/payer-contracts"
              payload: { payer_name: "Lone Star Health", network_status: "OUT_OF_NETWORK", qualifying_payment_amount_cents: 190000, in_network_coinsurance_rate: 0.20, in_network_deductible_remaining_cents: 50000, state_protection_regime: "FEDERAL_NSA_ONLY", effective_start_date: "2026-07-01", effective_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pc_nsa_id: $.data.id }
            - call: "POST /facilities/${fac_id}/payer-contracts"
              payload: { payer_name: "Bluebonnet Mutual", network_status: "OUT_OF_NETWORK", qualifying_payment_amount_cents: 190000, in_network_coinsurance_rate: 0.20, in_network_deductible_remaining_cents: 50000, state_protection_regime: "STATE_PROTECTED_FSED", effective_start_date: "2026-07-01", effective_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pc_state_id: $.data.id }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-1001", acuity_level: 3, presenting_service_line: "CARDIAC" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc_a_id: $.data.id }
            - call: "POST /encounters/${enc_a_id}/disclosure-decision"
              payload: { decision: "ACKNOWLEDGED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
            - call: "POST /encounters/${enc_a_id}/begin-mse"
              payload: {}
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_a_id}/complete-mse"
              payload: { stabilization_status: "STABLE" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_a_id}/ancillary-orders"
              payload: { category: "IMAGING", code: "CT", quantity: 2 }
              as: EmergencyPhysician
              as_user_id: "doc-1"
              captures: { ao_a1_id: $.data.id }
            - call: "POST /encounters/${enc_a_id}/ancillary-orders"
              payload: { category: "LABORATORY", code: "TROPONIN", quantity: 2 }
              as: EmergencyPhysician
              as_user_id: "doc-1"
              captures: { ao_a2_id: $.data.id }
            - call: "POST /encounters/${enc_a_id}/ancillary-orders"
              payload: { category: "PHARMACY", code: "ANALGESIC", quantity: 1 }
              as: EmergencyPhysician
              as_user_id: "doc-1"
              captures: { ao_a3_id: $.data.id }
            - call: "POST /ancillary-orders/${ao_a1_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /ancillary-orders/${ao_a2_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /ancillary-orders/${ao_a3_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_a_id}/discharge"
              payload: { discharge_instructions_ack: true }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-1002", acuity_level: 3, presenting_service_line: "CARDIAC" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc_b_id: $.data.id }
            - call: "POST /encounters/${enc_b_id}/disclosure-decision"
              payload: { decision: "ACKNOWLEDGED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
            - call: "POST /encounters/${enc_b_id}/begin-mse"
              payload: {}
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_b_id}/complete-mse"
              payload: { stabilization_status: "STABLE" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_b_id}/ancillary-orders"
              payload: { category: "IMAGING", code: "CT", quantity: 2 }
              as: EmergencyPhysician
              as_user_id: "doc-1"
              captures: { ao_b1_id: $.data.id }
            - call: "POST /encounters/${enc_b_id}/ancillary-orders"
              payload: { category: "LABORATORY", code: "TROPONIN", quantity: 2 }
              as: EmergencyPhysician
              as_user_id: "doc-1"
              captures: { ao_b2_id: $.data.id }
            - call: "POST /encounters/${enc_b_id}/ancillary-orders"
              payload: { category: "PHARMACY", code: "ANALGESIC", quantity: 1 }
              as: EmergencyPhysician
              as_user_id: "doc-1"
              captures: { ao_b3_id: $.data.id }
            - call: "POST /ancillary-orders/${ao_b1_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /ancillary-orders/${ao_b2_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /ancillary-orders/${ao_b3_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_b_id}/discharge"
              payload: { discharge_instructions_ack: true }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_a_id}/claims"
              payload: { payer_contract_id: "${pc_nsa_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { claim_nsa_id: $.data.id, variant_nsa: $.data.protection_variant, billed_nsa: $.data.billed_total_cents }
            - call: "POST /encounters/${enc_b_id}/claims"
              payload: { payer_contract_id: "${pc_state_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { claim_state_id: $.data.id, variant_state: $.data.protection_variant, billed_state: $.data.billed_total_cents }
          trigger:
            - call: "POST /claims/${claim_nsa_id}/adjudicate"
              payload: {}
              as: PayerRepresentative
              as_user_id: "payer-1"
            - call: "POST /claims/${claim_state_id}/adjudicate"
              payload: {}
              as: PayerRepresentative
              as_user_id: "payer-1"
          assert:
            - "Claim.${claim_nsa_id}.billed_total_cents == 282500 and Claim.${claim_state_id}.billed_total_cents == 282500"
            - "Claim.${claim_nsa_id}.protection_variant == PROTECTED_NSA and Claim.${claim_state_id}.protection_variant == PROTECTED_STATE"
            - "Claim.${claim_nsa_id}.allowed_amount_cents == 190000"
            - "Claim.${claim_state_id}.allowed_amount_cents == 226000"
            - "Claim.${claim_nsa_id}.patient_responsibility_cents == 77999"
            - "Claim.${claim_state_id}.patient_responsibility_cents == 85200"
            - "Claim.${claim_nsa_id}.plan_paid_cents == 112001 and Claim.${claim_state_id}.plan_paid_cents == 140800"
            - "Claim.${claim_nsa_id}.written_off_cents == 92500 and Claim.${claim_state_id}.written_off_cents == 56500"
            - "Claim.${claim_nsa_id}.balance_bill_amount_cents == 0 and Claim.${claim_state_id}.balance_bill_amount_cents == 0"
            - "Claim.${claim_state_id}.patient_responsibility_cents - Claim.${claim_nsa_id}.patient_responsibility_cents == 7201"
      - name: physician_coverage_peak_adjusted_diverges_from_trailing_mean_on_identical_history
        grounds:
          - calculations.required_physician_coverage
          - entities.VolumeForecast.fields.method
          - entities.VolumeForecast.fields.required_physician_hours_total
          - entities.VolumeForecast.fields.forecast_daily_volume
        distinguishing_aspect: |
          Staffing domain on VolumeForecast, not money on Claim: the same 7-element arrival history
          yields forecast_daily_volume 24.14 under TRAILING_MEAN and 28.26 under PEAK_ADJUSTED,
          moving required_physician_hours_total from 113.75 to 133.00 hours - a 19.25-hour delta on
          an identical input array.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with max_concurrent_physicians 2 and no PhysicianShift rows at all, so scheduled_physician_hours is 0.00 for both forecasts"
            - "Template V1 PUBLISHED and signage ATTESTED, so compliance_posture == OPEN and no posture escalation can rewrite either forecast's method"
            - "Two forecasts created back to back for period_start_date 2026-08-01, period_days 7, historical_daily_volumes [22, 19, 26, 31, 18, 24, 29]: the first with method TRAILING_MEAN, the second with method PEAK_ADJUSTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT", "ULTRASOUND"], lab_scope: ["CBC", "CHEMISTRY", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /facilities/${fac_id}/volume-forecasts"
              payload: { period_start_date: "2026-08-01", period_days: 7, historical_daily_volumes: [22, 19, 26, 31, 18, 24, 29], method: "TRAILING_MEAN" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { vf_tm_id: $.data.id }
            - call: "POST /facilities/${fac_id}/volume-forecasts"
              payload: { period_start_date: "2026-08-01", period_days: 7, historical_daily_volumes: [22, 19, 26, 31, 18, 24, 29], method: "PEAK_ADJUSTED" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { vf_pa_id: $.data.id }
          assert:
            - "VolumeForecast.${vf_tm_id}.forecast_basis == HISTORY and VolumeForecast.${vf_pa_id}.forecast_basis == HISTORY"
            - "VolumeForecast.${vf_tm_id}.forecast_daily_volume == 24.14"
            - "VolumeForecast.${vf_pa_id}.forecast_daily_volume == 28.26"
            - "VolumeForecast.${vf_tm_id}.required_physician_hours_per_day == 16.25"
            - "VolumeForecast.${vf_pa_id}.required_physician_hours_per_day == 19.00"
            - "VolumeForecast.${vf_tm_id}.required_physician_hours_total == 113.75"
            - "VolumeForecast.${vf_pa_id}.required_physician_hours_total == 133.00"
            - "VolumeForecast.${vf_tm_id}.required_board_certified_hours_total == 85.31"
            - "VolumeForecast.${vf_pa_id}.required_board_certified_hours_total == 99.75"
            - "VolumeForecast.${vf_pa_id}.required_physician_hours_total - VolumeForecast.${vf_tm_id}.required_physician_hours_total == 19.25"
            - "VolumeForecast.${vf_tm_id}.status == SUPERSEDED and VolumeForecast.${vf_pa_id}.status == ACTIVE"
            - "VolumeForecast.${vf_tm_id}.scheduled_physician_hours == 0.00 and VolumeForecast.${vf_pa_id}.scheduled_physician_hours == 0.00"
            - "Facility.${fac_id}.coverage_deficit_flag == true"

  - rule_id: combinatorial_formula
    instances:
      - name: disclosed_estimate_tier_read_from_base_subtotal_not_from_final_total
        grounds:
          - calculations.disclosed_estimate
          - entities.Encounter.fields.disclosed_estimate_cents
          - entities.DisclosureTemplate.fields.facility_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the administrative surcharge rate is keyed on a tier
          table whose input could be read either from the pre-surcharge base subtotal or from the
          final disclosed total, and the pinned order (base subtotal only) yields 257250 while the
          wrong order yields 267050 for the very same registration.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN: license ACTIVE, template PUBLISHED, signage ATTESTED"
            - "The published template carries facility_fee_cents 115000, so an acuity-4 registration has base_subtotal 115000 + 130000 = 245000, which is in tier B (rate 0.05) even though the resulting total 257250 sits in tier C"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Pecan Grove Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 115000, observation_hourly_cents: 38000, network_status_statement: "NETWORK_VARIES_BY_PLAN", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-2001", acuity_level: 4, presenting_service_line: "CARDIAC" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc_hi_id: $.data.id, est_hi: $.data.disclosed_estimate_cents }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-2002", acuity_level: 1, presenting_service_line: "GENERAL_MEDICAL" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc_lo_id: $.data.id, est_lo: $.data.disclosed_estimate_cents }
          assert:
            - "Encounter.${enc_hi_id}.disclosed_estimate_cents == 257250"
            - "Encounter.${enc_hi_id}.disclosed_estimate_cents != 267050"
            - "Encounter.${enc_lo_id}.disclosed_estimate_cents == 136500"
            - "Encounter.${enc_hi_id}.pinned_disclosure_template_id == ${tpl_v1_id} and Encounter.${enc_lo_id}.pinned_disclosure_template_id == ${tpl_v1_id}"
      - name: claim_coinsurance_rounded_per_line_then_summed_not_summed_then_rounded
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.patient_responsibility_cents
          - entities.Claim.fields.plan_paid_cents
          - calculations.ancillary_line_charge
        distinguishing_aspect: |
          Mode (b) nested-rounding order, a different axis from the tier circularity: the four-line
          post-deductible bases 47522 / 65912 / 20850 / 5716 at coinsurance 0.20 round per line to
          9504 + 13182 + 4170 + 1143 = 27999, whereas summing first (140000 * 0.20) gives 28000, so
          patient_responsibility_cents must be 77999 and never 78000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN and a PUBLISHED template whose facility_fee_cents is 145000"
            - "PayerContract OUT_OF_NETWORK / FEDERAL_NSA_ONLY with QPA 190000, in_network_coinsurance_rate 0.20, in_network_deductible_remaining_cents 50000"
            - "One ACKNOWLEDGED, screened, DISCHARGED encounter carrying RESULTED lines CT x2 = 98000, TROPONIN x2 = 31000, ANALGESIC x1 = 8500 created in that order, so the ordered line set is [145000, 98000, 31000, 8500] and billed_total is 282500"
            - "A DRAFT claim on that encounter under the contract"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT", "ULTRASOUND"], lab_scope: ["CBC", "CHEMISTRY", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/payer-contracts"
              payload: { payer_name: "Lone Star Health", network_status: "OUT_OF_NETWORK", qualifying_payment_amount_cents: 190000, in_network_coinsurance_rate: 0.20, in_network_deductible_remaining_cents: 50000, state_protection_regime: "FEDERAL_NSA_ONLY", effective_start_date: "2026-07-01", effective_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pc_nsa_id: $.data.id }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-1001", acuity_level: 3, presenting_service_line: "CARDIAC" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/disclosure-decision"
              payload: { decision: "ACKNOWLEDGED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
            - call: "POST /encounters/${enc_id}/begin-mse"
              payload: {}
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_id}/complete-mse"
              payload: { stabilization_status: "STABLE" }
              as: EmergencyPhysician
