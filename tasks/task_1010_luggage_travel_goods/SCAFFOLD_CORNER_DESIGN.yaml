  # ---------------------------------------------------------------------
  # Section: errors  (OCC + auth)
  # ---------------------------------------------------------------------
  - section: errors
    instances:
      - name: create_claim_stale_registration_version_returns_stale
        claim_type: occ_conflict
        grounds: ["concurrency_rules[claim-create-stale-registration]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first claim create bumps WarrantyRegistration.version 1->2, a second create carrying expected_warranty_registration_version 1 (stale) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Product; Customer; registration ACTIVE at version 1; a first claim created (registration version now 2)."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-26", name: "OccA", category: "HARD_SHELL", msrp_cents: 20000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner21@x.com", full_name: "Corner TwentyOne" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SER-26", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "WHEEL", description: "first" }
              as: Associate
          trigger:
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "WHEEL", description: "second stale" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP 412"
            - "trigger response data.error_id == ERR_STALE_VERSION"

      - name: create_claim_correct_version_supersedes_and_bumps
        claim_type: occ_conflict
        grounds: ["concurrency_rules[claim-create-stale-registration]", state_machines.WarrantyClaim.SUBMITTED_to_SUPERSEDED, entities.WarrantyRegistration.fields.version]
        distinguishing_aspect: "A second claim create carrying the current registration version (2) succeeds, supersedes the first claim, and bumps registration.version to 3."
        test_recipe:
          setup: ["Product; Customer; registration ACTIVE; first claim created (registration version now 2)."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-27", name: "OccB", category: "HARD_SHELL", msrp_cents: 20000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner22@x.com", full_name: "Corner TwentyTwo" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SER-27", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver0: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver0}", defect_type: "WHEEL", description: "first" }
              as: Associate
              captures: { claim1: $.data.id }
            - call: "GET /store/warranty-registrations/${reg_id}"
              payload: {}
              as: Associate
              captures: { reg_ver1: $.data.version }
          trigger:
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver1}", defect_type: "HANDLE", description: "second current" }
              as: Associate
              captures: { claim2: $.data.id }
          assert:
            - "trigger response HTTP 201"
            - "WarrantyClaim.${claim1}.status == SUPERSEDED"
            - "WarrantyClaim.${claim2}.status == SUBMITTED"

      - name: create_trade_in_stale_customer_version_returns_stale
        claim_type: occ_conflict
        grounds: ["errors[ERR_STALE_VERSION]", entities.TradeIn.fields.expected_customer_version]
        distinguishing_aspect: "After a first trade-in bumps Customer.version 1->2, a second create carrying expected_customer_version 1 returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Customer at version 1; Product; a first trade-in created (customer version now 2)."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner23@x.com", full_name: "Corner TwentyThree" }
              as: Associate
              captures: { cust_id: $.data.id, cust_ver: $.data.version }
            - call: "POST /store/products"
              payload: { sku: "P-28", name: "OccC", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/trade-ins"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", expected_customer_version: "${cust_ver}", condition: "GOOD" }
              as: Associate
          trigger:
            - call: "POST /store/trade-ins"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", expected_customer_version: "${cust_ver}", condition: "FAIR" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP 412"
            - "trigger response data.error_id == ERR_STALE_VERSION"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /store/products"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

