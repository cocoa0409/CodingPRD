        distinguishing_aspect: "With two ACTIVE campaigns in different stacking groups whose windows both contain the clock, the pinned key (priority_rank ASC, discount_value DESC, created_at ASC) selects the rank-10 version even though the rank-30 version was created first and offers a larger discount."
