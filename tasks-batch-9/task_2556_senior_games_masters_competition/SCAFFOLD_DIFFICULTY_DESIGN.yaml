            - "THE CEILING IS PER UTC DATE, NOT PER PERSON: the identical 14:20-20:20 slot A5 on 2026-09-13 returns HTTP 201 with PersonnelAssignment.${asg_a5_id}.status == ASSIGNED and duration_minutes == 360, because 2026-09-13 carries 0 assigned minutes before this write"
