# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections. excluded_because stubs
# point to §1.8 instances by name (in SCAFFOLD_DIFFICULTY_DESIGN.yaml).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_parcel_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Parcel.fields.status
          - entities.Parcel.fields.active_crop_plan_count
        distinguishing_aspect: "POST /parcels with name/acreage/soil_type -> 201; status=AVAILABLE, active_crop_plan_count=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { name: "P1", acreage: 25.5, soil_type: "CLAY" }
              as: FarmManager
              captures: { pid: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "response code == 201"
            - "Parcel.status == AVAILABLE"
            - "Parcel.active_crop_plan_count == 0"
            - "Parcel.version == 1"

      - name: get_parcel_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /parcels/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /parcels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND (404)"

      - name: create_parcel_missing_required_field
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /parcels without acreage -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { name: "NoAcre", soil_type: "LOAM" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_parcel_nonpositive_acreage_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Parcel.fields.acreage
          - validations[priority=4]
        distinguishing_aspect: "acreage <= 0 violates '> 0' constraint -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { name: "Zero", acreage: 0, soil_type: "LOAM" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_harvest_event_moisture_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - entities.HarvestEvent.fields.moisture_pct
          - validations[priority=4]
        distinguishing_aspect: "moisture_pct > 100 violates 0..100 -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A HARVESTING plan ready to accept harvest events."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "MF", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
          trigger:
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${pl}", acres_harvested: 40, gross_quantity: 100, moisture_pct: 150 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST (400)"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.CropPlan.fields.status
          - entities.CropPlan.fields.revision_count
        distinguishing_aspect: "POST /crop-plans cannot set status/revision_count; server forces status=DRAFT, revision_count=0."
        test_recipe:
          setup: ["A parcel exists."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "SF", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 100, budget_labor_cost: 100, budget_equipment_cost: 100 }
              as: Agronomist
              captures: { st: $.data.status, rc: $.data.revision_count }
          assert:
            - "CropPlan.status == DRAFT"
            - "CropPlan.revision_count == 0"

      - name: computed_applied_cost_correct
        claim_type: Computed Fields
        grounds:
          - entities.ApplicationRecord.fields.applied_cost
          - entities.ApplicationRecord.fields.quantity_used
        distinguishing_aspect: "On log, quantity_used = 2*40 = 80 and applied_cost = 80*12.50 = 1000.00."
        test_recipe:
          setup: ["A crop plan and a CHEMICAL product (unit_cost 12.50)."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "ACF", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id }
            - call: "POST /input-products"
              payload: { name: "Chem AC", category: "CHEMICAL", unit: "GAL", unit_cost: 12.50 }
              as: FarmManager
              captures: { chem: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "A", license_no: "RU-60", certified: true }
              as: FarmManager
              captures: { aid: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /application-records"
              payload: { crop_plan_id: "${pl}", input_product_id: "${chem}", applicator_user_id: "${aid}", rate_per_acre: 2, acres_treated: 40 }
              as: Agronomist
              captures: { qu: $.data.quantity_used, ac: $.data.applied_cost }
          assert:
            - "ApplicationRecord.quantity_used == 80"
            - "ApplicationRecord.applied_cost == 1000.00"

      - name: list_parcels_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET /parcels
        distinguishing_aspect: "GET /parcels returns array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two parcels created."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "A", acreage: 10, soil_type: "LOAM" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "B", acreage: 20, soil_type: "SAND" }
              as: FarmManager
          trigger:
            - call: "GET /parcels"
              payload: { limit: 1, offset: 0 }
              as: FarmManager
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_application_from_logged_invalid_when_already_confirmed
        claim_type: Idempotency
        grounds:
          - state_machines.ApplicationRecord.LOGGED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming an already-CONFIRMED application -> ERR_INVALID_STATE (409); no second compliance record."
        test_recipe:
          setup: ["A GROWING plan with a non-restricted FERTILIZER application confirmed once."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "IDF", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /input-products"
              payload: { name: "Fert", category: "FERTILIZER", unit: "GAL", unit_cost: 5 }
              as: FarmManager
              captures: { fp: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "A", license_no: "RU-61", certified: true }
              as: FarmManager
              captures: { aid: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /application-records"
              payload: { crop_plan_id: "${pl}", input_product_id: "${fp}", applicator_user_id: "${aid}", rate_per_acre: 1, acres_treated: 10 }
              as: Agronomist
              captures: { app: $.data.id }
            - call: "POST /application-records/${app}/confirm"
              payload: {}
              as: Applicator
              as_user_id: "${aid}"
          trigger:
            - call: "POST /application-records/${app}/confirm"
              payload: {}
              as: Applicator
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"

      - name: close_plan_from_growing_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CropPlan.HARVESTING_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing a GROWING (not HARVESTING) plan -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A GROWING plan."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "CL", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
          trigger:
            - call: "POST /crop-plans/${pl}/close"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"

      - name: grade_already_graded_lot_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.HarvestLot.quality_status=UNGRADED_to_quality_status=GRADE_A
          - errors[ERR_LOT_ALREADY_GRADED]
        distinguishing_aspect: "Grading a GRADE_A lot again -> ERR_LOT_ALREADY_GRADED (409)."
        test_recipe:
          setup: ["A GRADE_A CORN lot exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "GG", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${pl}", acres_harvested: 40, gross_quantity: 500, moisture_pct: 0 }
              as: Agronomist
              captures: { he: $.data.id }
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 500 }
              as: Agronomist
              captures: { lot: $.data.id }
            - call: "POST /harvest-lots/${lot}/grade"
              payload: { grade: "GRADE_A" }
              as: Agronomist
          trigger:
            - call: "POST /harvest-lots/${lot}/grade"
              payload: { grade: "GRADE_B" }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_LOT_ALREADY_GRADED (409)"

      - name: abandoned_plan_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CropPlan.DRAFT_to_ABANDONED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An ABANDONED plan cannot be approved -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT plan abandoned."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "AB", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/abandon"
              payload: {}
              as: FarmManager
          trigger:
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"

      - name: request_revision_blocked_after_planting
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CropPlan.APPROVED_to_UNDER_REVISION
          - errors[ERR_PLAN_ALREADY_PLANTED]
        distinguishing_aspect: "request-revision on an APPROVED plan that already has a RECORDED planting -> ERR_PLAN_ALREADY_PLANTED (409)."
        test_recipe:
          setup: ["An APPROVED plan with one RECORDED PlantingEvent."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "RR", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
          trigger:
            - call: "POST /crop-plans/${pl}/request-revision"
              payload: {}
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PLAN_ALREADY_PLANTED (409)"

      - name: begin_harvest_blocked_by_active_phi
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CropPlan.GROWING_to_HARVESTING
          - errors[ERR_PREHARVEST_INTERVAL_ACTIVE]
        distinguishing_aspect: "begin-harvest before PHI elapses (clock 2026-06-15 < earliest 2026-06-17) -> ERR_PREHARVEST_INTERVAL_ACTIVE (409)."
        test_recipe:
          setup: ["GROWING plan; restricted app PHI=7d confirmed at 2026-06-10; clock at 2026-06-15 (PHI not elapsed)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "PHI", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /input-products"
              payload: { name: "RU PHI", category: "CHEMICAL", unit: "GAL", unit_cost: 10, restricted_use: true, reentry_interval_hours: 12, preharvest_interval_days: 7 }
              as: FarmManager
              captures: { chem: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "A", license_no: "RU-70", certified: true }
              as: FarmManager
              captures: { aid: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 100, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: FarmManager
            - call: "POST /application-records"
              payload: { crop_plan_id: "${pl}", input_product_id: "${chem}", applicator_user_id: "${aid}", rate_per_acre: 1, acres_treated: 50 }
              as: Agronomist
              captures: { app: $.data.id }
            - call: "POST /application-records/${app}/confirm"
              payload: {}
              as: Applicator
              as_user_id: "${aid}"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FarmManager
          trigger:
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PREHARVEST_INTERVAL_ACTIVE (409)"

      - name: ship_contract_cascades_lots_to_shipped
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SaleContract.FILLED_to_SHIPPED
          - entities.HarvestLot.fields.sale_status
        distinguishing_aspect: "Shipping a FILLED contract cascades all committed lots to sale_status SHIPPED."
        test_recipe:
          setup: ["A CORN contract contracted 1000 fully committed by one GRADE_A lot of 1000 (status FILLED)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "SHF", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
