              as_user_id: "${ctr_id}"
            - call: "POST /api/disbursement-requests/${d2}/lien-waivers"
              payload: { contractor_id: "${ctr_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 15000000 }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { w2: $.data.id }
            - call: "POST /api/lien-waivers/${w2}/verify"
              as: LandlordPM
            - call: "POST /api/disbursement-requests/${d2}/approve"
              payload: { approved_amount_cents: 15000000 }
              as: LandlordApprover
              as_user_id: "approver-1"
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { pv3: $.data.version }
            - call: "POST /api/ti-projects/${proj_id}/disbursement-requests"
              payload: { period_end_date: "2026-08-14T00:00:00Z", requested_amount_cents: 10000000, expected_ti_project_version: "${pv3}" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { d3: $.data.id }
