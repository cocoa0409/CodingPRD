          - state_machines.Permit.INTERIM_to_FINAL
          - state_machines.TmdlAssessment.DRAFT_to_PUBLIC_COMMENT
          - state_machines.TmdlAssessment.PUBLIC_COMMENT_to_APPROVED
          - validations[priority=19]
          - errors[ERR_TMDL_NOT_APPROVED]
          - calculations.permit_compliance_reconciliation
        distinguishing_aspect: |
          A different direction of dependency from the batch-listing instance: here the Permit
          is in the correct from-state INTERIM and the gate lives two hops away
          (Permit -> SourceAssessment -> TmdlAssessment.status). Interim limits can be derived
          against a still-DRAFT TMDL, but finalization cannot happen until that TMDL is
          APPROVED. When approval finally lands, the same finalize call tightens
          applicable_limit_lbs_yr from 23916.00 to 21888.00 and drags the INDEPENDENT
          compliance axis from IN_COMPLIANCE to SHORTFALL with compliance_gap_lbs 112.00 — a
          foreign entity's state change reaching across two axes of one row.
        test_recipe:
          setup:
            - "Watershed SCR PROVISIONAL (no APPROVED TMDL yet, which is fine because permit writing is not trading)."
            - "TmdlAssessment TMDL-P-2026 is in DRAFT with an ACTIVE PROVISIONAL allocation run, so SourceAssessment 'City WWTP' carries allocated_load_lbs_yr 21888.00."
            - "Permit OH0012345 links that SourceAssessment with current_annual_load_lbs 30000.00 and effective_date 2026-03-01, so derive-limits yields TIER_B with interim_limit 23916.00, final_limit 21888.00 and compliance_schedule_end_date 2029-03-01."
