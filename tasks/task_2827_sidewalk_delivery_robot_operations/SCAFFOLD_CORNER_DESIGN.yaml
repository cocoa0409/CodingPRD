      - name: create_without_required_fields_is_rejected
        claim_type: required_fields
        grounds:
          - "validations[priority=10]"
          - "errors.ERR_INVALID_REQUEST"
          - "endpoints[POST /service-zones]"
          - "endpoints[POST /sidewalk-segments]"
          - "endpoints[POST /robots]"
          - "endpoints[POST /incident-reports]"
        distinguishing_aspect: >-
          The required-fields claim, distinguished from the type-constraint instance by the shape of the
          defect: the field is absent rather than malformed, and priority 10 rejects it with 400
          ERR_INVALID_REQUEST before the enum and range checks at 11 and 12 ever look at the remaining
          values, so omitting municipality_code, length_m, max_speed_cm_s or narrative each fails
          identically.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with one Robot R1 registered, so both ids referenced below resolve"
            - "each request below omits exactly one field that its endpoint declares as required and keeps every other field well formed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
          trigger:
            - call: "POST /service-zones"
              payload: { name: "No Code", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "SY", segment_type: "WALKWAY", measured_clearance_cm: 120.0, surface_grade_pct: 2.0 }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-009", width_cm: 78.0, container_capacity_liters: 60.0 }
              as: PlatformAdmin
            - call: "POST /incident-reports"
              payload: { zone_id: "${z}", robot_id: "${r}", category: "OBSTRUCTION", severity: "MINOR" }
              as: SafetyOfficer
              as_user_id: "so-1"
          assert:
            - "the zone create without municipality_code returns 400 with error_id ERR_INVALID_REQUEST"
            - "the segment create without length_m returns 400 with error_id ERR_INVALID_REQUEST"
            - "the robot create without max_speed_cm_s returns 400 with error_id ERR_INVALID_REQUEST"
            - "the incident create without narrative returns 400 with error_id ERR_INVALID_REQUEST"
            - "GET /service-zones reports total_count == 1 and GET /robots?zone_id=${z} reports total_count == 1"
            - "GET /incident-reports?zone_id=${z} reports total_count == 0 and ServiceZone.${z}.open_incident_count == 0"
      - name: child_create_with_unknown_parent_zone_is_rejected
        claim_type: parent_relationships
        grounds:
          - "validations[priority=30]"
          - "errors.ERR_ZONE_NOT_FOUND"
          - "entities.SidewalkSegment.fields.zone_id"
          - "entities.Robot.fields.zone_id"
          - "entities.Merchant.fields.zone_id"
          - "entities.DepotBay.fields.zone_id"
        distinguishing_aspect: >-
          The parent-relationship claim for the flat topology: zone_id is a validated reference on four
          different creates, so an unknown zone_id in the body returns 404 ERR_ZONE_NOT_FOUND on the
          segment, robot, merchant and bay endpoints alike, and the check runs at priority 30 - ahead of
          every business rule, which is why the otherwise-illegal 900 cm/s robot still fails with
          ERR_ZONE_NOT_FOUND rather than ERR_ORDINANCE_SPEED_EXCEEDED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 exists but is not the zone referenced by any of the four calls"
            - "the id 11111111-1111-4111-8111-111111111111 belongs to no ServiceZone"
            - "the robot payload also violates the ordinance speed ceiling of Z1, which the referential check must pre-empt"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
