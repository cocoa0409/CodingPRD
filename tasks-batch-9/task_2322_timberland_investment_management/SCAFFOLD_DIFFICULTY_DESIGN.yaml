            - call: "POST /timberland/certification-audits/${audit_id}/findings"
              payload: { finding_code: "SFI-4.1", severity: "MAJOR", indicator_ref: "4.1.2", due_date: "2026-11-01" }
              as: CertificationAuditor
              as_user_id: "ca-1"
