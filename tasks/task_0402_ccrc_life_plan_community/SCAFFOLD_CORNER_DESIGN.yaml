# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the claim-extraction-guide sections against §1.1–§1.7.
# Same seven-point per-instance contract as §1.8; same §1.5 reachability gates.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_community_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Community.fields.name, endpoints]
        distinguishing_aspect: "POST /ccrc/communities with required fields → 201; response carries server-minted id, current_period_index==0, is_admissions_frozen==false, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ccrc/communities"
              payload: { name: "Lakeside", actuarial_discount_rate_bps: 600 }
              as: FinanceOfficer
              captures: { cid: $.data.id, per: $.data.current_period_index, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Community.current_period_index == 0"
            - "Community.is_admissions_frozen == false"
            - "Community.version == 1"

      - name: create_community_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Community.fields.actuarial_discount_rate_bps"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /ccrc/communities omitting actuarial_discount_rate_bps (required input, no default) → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ccrc/communities"
              payload: { name: "NoRate" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and code == 400"

      - name: create_plan_nonpositive_entrance_fee_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.ContractPlan.fields.entrance_fee_cents"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "entrance_fee_cents == 0 violates the >0 constraint → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A community exists."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "FeeTown", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Bad", contract_type: "TYPE_C", entrance_fee_cents: 0, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and code == 400"

      - name: create_plan_invalid_enum_contract_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.ContractPlan.fields.contract_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "contract_type == TYPE_D is not a valid enum member → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A community exists."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "EnumTown", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "BadEnum", contract_type: "TYPE_D", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and code == 400"

      - name: get_unit_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /ccrc/units/{uid} with a non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no units)."]
          setup_api_calls: []
          trigger:
            - call: "GET /ccrc/units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND and code == 404"

      - name: create_residency_unknown_plan_returns_referenced_entity_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Residency.fields.contract_plan_id"
          - "validations[priority=4]"
          - "errors[ERR_REFERENCED_ENTITY_NOT_FOUND]"
        distinguishing_aspect: "POST /ccrc/residencies with a body contract_plan_id that does not exist → ERR_REFERENCED_ENTITY_NOT_FOUND (422)."
        test_recipe:
          setup: ["A community and a resident, but the referenced plan id is bogus."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "RefTown", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ron R", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
          trigger:
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "00000000-0000-0000-0000-000000000000" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCED_ENTITY_NOT_FOUND and code == 422"

      - name: unit_default_bed_capacity_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Unit.fields.bed_capacity]
        distinguishing_aspect: "Omitting bed_capacity on unit create → defaults to 1; status defaults to AVAILABLE."
        test_recipe:
          setup: ["A community exists."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "DefTown", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "D1", care_level: "SKILLED" }
              as: AdmissionsDirector
              captures: { cap: $.data.bed_capacity, st: $.data.status }
          assert:
            - "Unit.bed_capacity == 1"
            - "Unit.status == AVAILABLE"

      - name: list_communities_paginated_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /ccrc/communities returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two communities exist."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "P1", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
            - call: "POST /ccrc/communities"
              payload: { name: "P2", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
          trigger:
            - call: "GET /ccrc/communities"
              payload: {}
              as: FinanceOfficer
          assert:
            - "response_type == array; meta has total_count >= 2 and has_more present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_from_deposit_held_returns_not_reserved
        claim_type: invalid_transition
        grounds:
          - "state_machines.Residency.RESERVED_to_ACTIVE"
          - "errors[ERR_RESIDENCY_NOT_RESERVED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / activate_frozen_beats_not_reserved_state
          rationale: "The §1.8 priority-pair instance already asserts activate on a DEPOSIT_HELD residency returns ERR_RESIDENCY_NOT_RESERVED."

      - name: terminate_from_terminal_state_returns_residency_not_active
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Residency.terminal_states"
          - "errors[ERR_RESIDENCY_NOT_ACTIVE]"
        distinguishing_aspect: "A second terminate on an already TERMINATED_VOLUNTARY residency → ERR_RESIDENCY_NOT_ACTIVE (409); no second refund created."
        test_recipe:
          setup: ["Residency terminated VOLUNTARY (terminal)."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Term", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Tp", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "T1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ty T", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
              captures: { rv2: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/terminate"
              payload: { reason: "VOLUNTARY", expected_residency_version: "${rv2}" }
              as: AdmissionsDirector
              captures: { rv3: $.data.version }
          trigger:
            - call: "POST /ccrc/residencies/${rid}/terminate"
              payload: { reason: "VOLUNTARY", expected_residency_version: "${rv3}" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESIDENCY_NOT_ACTIVE and code == 409"

      - name: assign_unit_on_reserved_returns_not_deposit_held
        claim_type: invalid_transition
        grounds:
          - "state_machines.Residency.DEPOSIT_HELD_to_RESERVED"
          - "errors[ERR_RESIDENCY_NOT_DEPOSIT_HELD]"
        distinguishing_aspect: "Assign-unit on a residency already RESERVED → ERR_RESIDENCY_NOT_DEPOSIT_HELD (409)."
        test_recipe:
          setup: ["Residency RESERVED (already assigned a unit); a second AVAILABLE unit exists."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "AsgT", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Ap", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "AA1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u1: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "AA2", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u2: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Al A", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${u1}" }
              as: AdmissionsDirector
          trigger:
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${u2}" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESIDENCY_NOT_DEPOSIT_HELD and code == 409"

      - name: assign_skilled_unit_to_independent_residency_returns_care_level_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Residency.DEPOSIT_HELD_to_RESERVED"
          - "errors[ERR_UNIT_CARE_LEVEL_MISMATCH]"
        distinguishing_aspect: "Assigning a SKILLED unit via assign-unit (which requires INDEPENDENT) → ERR_UNIT_CARE_LEVEL_MISMATCH (422)."
        test_recipe:
          setup: ["DEPOSIT_HELD residency; an AVAILABLE SKILLED unit."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "MisT", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Mp", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "MS", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Mo M", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${usk}" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_CARE_LEVEL_MISMATCH and code == 422"

      - name: activate_reserved_without_unit_is_unreachable_no_unit_assigned
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Residency.RESERVED_to_ACTIVE"
          - "errors[ERR_NO_UNIT_ASSIGNED]"
        distinguishing_aspect: "RESERVED is only reachable via assign-unit/place which always set unit_id, so ERR_NO_UNIT_ASSIGNED is a defensive guard; activating a freshly placed RESERVED residency succeeds and unit_id is non-null."
        test_recipe:
          setup: ["Residency RESERVED via assign-unit (unit_id set)."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "NoU", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Np", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "NU1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ned N", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
              captures: { st: $.data.status, uid_after: $.data.unit_id }
          assert:
            - "Residency.status == ACTIVE and unit_id == ${uid} (non-null, so ERR_NO_UNIT_ASSIGNED not triggered)"

      - name: care_transition_apply_twice_returns_not_proposed
        claim_type: Idempotency
        grounds:
          - "state_machines.CareTransition.PROPOSED_to_APPLIED"
          - "errors[ERR_CARE_TRANSITION_NOT_PROPOSED]"
        distinguishing_aspect: "Applying an already-APPLIED care transition a second time → ERR_CARE_TRANSITION_NOT_PROPOSED (409)."
        test_recipe:
          setup: ["ACTIVE residency with one APPLIED INDEPENDENT→ASSISTED transition."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Idem", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Ip", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "ID1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ida I", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { ctid: $.data.id }
            - call: "POST /ccrc/care-transitions/${ctid}/apply"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /ccrc/care-transitions/${ctid}/apply"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CARE_TRANSITION_NOT_PROPOSED and code == 409"

      - name: occupy_released_bed_returns_not_held
        claim_type: invalid_transition
        grounds:
          - "state_machines.BedReservation.HELD_to_OCCUPIED"
          - "errors[ERR_BED_RESERVATION_NOT_HELD]"
        distinguishing_aspect: "Occupying a bed reservation that is already RELEASED → ERR_BED_RESERVATION_NOT_HELD (409)."
        test_recipe:
          setup: ["ACTIVE residency; a SKILLED unit with a HELD-then-RELEASED bed reservation."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "BedR", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Bp", contract_type: "TYPE_A", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "BRI", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uind: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "BRS", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Bru B", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uind}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${rid}", unit_id: "${usk}", hold_expiry_period: 10 }
              as: CareCoordinator
              captures: { brid: $.data.id }
            - call: "POST /ccrc/bed-reservations/${brid}/release"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /ccrc/bed-reservations/${brid}/occupy"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BED_RESERVATION_NOT_HELD and code == 409"

      - name: release_already_released_bed_returns_not_releasable
        claim_type: invalid_transition
        grounds:
          - "state_machines.BedReservation.OCCUPIED_to_RELEASED"
          - "errors[ERR_BED_RESERVATION_NOT_RELEASABLE]"
        distinguishing_aspect: "Releasing a bed reservation already in RELEASED (terminal) → ERR_BED_RESERVATION_NOT_RELEASABLE (409)."
        test_recipe:
          setup: ["A HELD-then-RELEASED bed reservation."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "RelR", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Rp", contract_type: "TYPE_A", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "RRI", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uind: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "RRS", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Rae R", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uind}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
