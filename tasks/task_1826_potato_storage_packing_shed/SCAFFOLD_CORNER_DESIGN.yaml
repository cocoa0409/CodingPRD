# =============================================================================
# §1.9 Scaffold Corner Design — task_1826_potato_storage_packing_shed
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# §1.8 (those carry excluded_because stubs). Sections follow the
# claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: c_grower_create_returns_201_with_server_fields
        claim_type: creation
        grounds:
          - "endpoints[POST /potato-shed/growers]"
          - "entities.Grower"
        distinguishing_aspect: "Creating a grower returns 201 with server-minted UUID id, created_at, updated_at, and version == 1."
        test_recipe:
          setup: ["empty DB, default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower A", grower_code: "G-A" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
          trigger:
            - { call: "GET /potato-shed/growers/${g_id}", payload: {}, as: SettlementClerk, captures: { g_name: "$.data.name" } }
          assert:
            - "create response: response_type == object, data.id is a UUID, data.version == 1, data.created_at == 2026-08-01T00:00:00.000Z (logical clock)"
            - "GET round-trip: g_name == 'Grower A' and grower_code == 'G-A'"

      - name: c_lot_create_defaults_and_initial_state
        claim_type: defaults
        grounds:
          - "entities.FieldLot"
          - "state_machines.FieldLot"
        distinguishing_aspect: "A new lot starts INTAKE / CLEAR with bin_id null, available_cwt == original_weight_cwt, all ledger accumulators 0, version 1."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower B", grower_code: "G-B" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 250.50 }, as: IntakeClerk, captures: { l_status: "$.data.storage_status", l_q: "$.data.quality_status", l_avail: "$.data.available_cwt", l_res: "$.data.reserved_cwt", l_v: "$.data.version" } }
          assert:
            - "l_status == INTAKE, l_q == CLEAR, l_avail == 250.50, l_res == 0, l_v == 1"
            - "shrink_cwt == 0, packed_total_cwt == 0, cull_total_cwt == 0, condemned_cwt == 0, processing_credit_cwt == 0, inhibitor_application_count == 0, bin_id is null"

      - name: c_lot_create_missing_variety_returns_400
        claim_type: required_fields
        grounds:
          - "entities.FieldLot.fields.variety"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required variety is rejected with ERR_INVALID_REQUEST; nothing is persisted."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower C", grower_code: "G-C" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"
            - "GET /potato-shed/field-lots?grower_id=${g_id} returns an empty list (total_count 0)"

      - name: c_lot_create_invalid_variety_enum_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.FieldLot.fields.variety"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A variety outside the five-member enum (e.g. PURPLE_MAJESTY) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower D", grower_code: "G-D" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "PURPLE_MAJESTY", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: c_lot_create_computed_available_cwt_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.FieldLot.fields.available_cwt"
        distinguishing_aspect: "available_cwt is server-computed: a client-supplied value is ignored and the response carries original_weight_cwt."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower E", grower_code: "G-E" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00, available_cwt: 1.00 }, as: IntakeClerk, captures: { l_avail: "$.data.available_cwt" } }
          assert:
            - "l_avail == 100.00 (the injected available_cwt: 1.00 was ignored)"

      - name: c_assessment_append_only_immutability
        claim_type: immutability
        grounds:
          - "entities.GradeOutAssessment"
        distinguishing_aspect: "GradeOutAssessment has common_fields false: the create response carries id and created_at but no version or updated_at, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup: ["binned lot exists"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower F", grower_code: "G-F" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CA" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-01", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 5.00, expected_field_lot_version: "${l_v}" }, as: StorageManager, captures: { a_id: "$.data.id", a_frac: "$.data.packable_fraction" } }
          assert:
            - "response data contains id and created_at but no version and no updated_at keys"
            - "a_frac == 0.9 (computed (70+20)/100, not client-supplied)"
            - "GET /potato-shed/field-lots/${l_id}/assessments lists exactly 1 record with cumulative_shrink_cwt == 5.00"

      - name: c_get_missing_shed_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_SHED_NOT_FOUND]"
          - "endpoints[GET /potato-shed/sheds/{shedId}]"
        distinguishing_aspect: "Reading a random UUID shed id returns 404 ERR_SHED_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /potato-shed/sheds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ShedAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SHED_NOT_FOUND with http 404 and response_type == error"

      - name: c_not_found_left_to_right_ordering
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_GROWER_NOT_FOUND]"
          - "errors[ERR_FIELD_LOT_NOT_FOUND]"
          - "errors[ERR_BIN_NOT_FOUND]"
        distinguishing_aspect: "Existence is validated left-to-right path-then-body: bad grower -> ERR_GROWER_NOT_FOUND; bad lot -> ERR_FIELD_LOT_NOT_FOUND; valid lot + bad bin_id in body -> ERR_BIN_NOT_FOUND."
        test_recipe:
          setup: ["one grower with one INTAKE lot; one shed with one bin"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower G", grower_code: "G-G" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CB" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { err1: "$.data.error_id" } }
            - { call: "POST /potato-shed/field-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { err2: "$.data.error_id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: IntakeClerk, captures: { err3: "$.data.error_id" } }
          assert:
            - "err1 == ERR_GROWER_NOT_FOUND, err2 == ERR_FIELD_LOT_NOT_FOUND, err3 == ERR_BIN_NOT_FOUND (all 404)"

      - name: c_single_resource_gets_return_404_per_resource
        claim_type: not_found
        grounds:
          - "errors[ERR_CONTRACT_NOT_FOUND]"
          - "errors[ERR_PACK_ORDER_NOT_FOUND]"
          - "errors[ERR_PACK_RUN_NOT_FOUND]"
          - "errors[ERR_AUDIT_NOT_FOUND]"
          - "errors[ERR_SETTLEMENT_NOT_FOUND]"
        distinguishing_aspect: "Every single-resource GET returns its resource-specific 404 for a random UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /potato-shed/contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesManager, captures: { e1: "$.data.error_id" } }
            - { call: "GET /potato-shed/pack-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesManager, captures: { e2: "$.data.error_id" } }
            - { call: "GET /potato-shed/pack-runs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PackLineSupervisor, captures: { e3: "$.data.error_id" } }
            - { call: "GET /potato-shed/settlements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SettlementClerk, captures: { e4: "$.data.error_id" } }
          assert:
            - "e1 == ERR_CONTRACT_NOT_FOUND, e2 == ERR_PACK_ORDER_NOT_FOUND, e3 == ERR_PACK_RUN_NOT_FOUND, e4 == ERR_SETTLEMENT_NOT_FOUND (all http 404)"
            - "POST /potato-shed/audits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/close would likewise return ERR_AUDIT_NOT_FOUND (covered by audit close instance's existence gate)"

      - name: c_lot_draw_reverse_reachability_both_parents
        claim_type: parent_relationships
        grounds:
          - "entities.PackRunLotDraw.fields.pack_run_id"
          - "entities.PackRunLotDraw.fields.field_lot_id"
        distinguishing_aspect: "A completed draw is discoverable from BOTH parents: GET /pack-runs/{runId}/lot-draws and GET /field-lots/{lotId}/lot-draws return the same record."
        test_recipe:
          setup:
            - "lot 500.00 RUSSET_BURBANK (no assessment, default fraction 0.75); contract 300.00 @ 2000; order requested 75.00 allocated (raw reservation 100.00); fresh PASS wash; run created"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower H", grower_code: "G-H" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CC" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer P", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 75.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T06:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: PackLineSupervisor, captures: { r_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-runs/${r_id}/close", payload: { outcome: "COMPLETED", draws: [ { field_lot_id: "${l_id}", raw_drawn_cwt: 100.00, packed_cwt: 75.00, us1_cwt: 60.00, us2_cwt: 15.00, cull_cwt: 25.00, cull_channel: "WASTE" } ] }, as: PackLineSupervisor }
          trigger:
            - { call: "GET /potato-shed/pack-runs/${r_id}/lot-draws", payload: {}, as: PackLineSupervisor, captures: { d_lot: "$.data[0].field_lot_id" } }
            - { call: "GET /potato-shed/field-lots/${l_id}/lot-draws", payload: {}, as: StorageManager, captures: { d_run: "$.data[0].pack_run_id" } }
          assert:
            - "d_lot == ${l_id} and d_run == ${r_id}: the same draw is listed under both parents"
            - "the draw record carries raw_drawn_cwt 100.00, packed_cwt 75.00, us1_cwt 60.00, us2_cwt 15.00, cull_cwt 25.00, cull_channel WASTE"

  - section: state_machines
    instances:
      - name: c_lot_assign_twice_returns_lot_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.FieldLot.INTAKE_to_BINNED"
          - "errors[ERR_LOT_INVALID_STATE]"
        distinguishing_aspect: "Bin assignment is only valid from INTAKE; a second assignment on the BINNED lot returns 409 ERR_LOT_INVALID_STATE and moves nothing."
        test_recipe:
          setup: ["shed with bins B-1 and B-2; lot assigned to B-1"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower I", grower_code: "G-I" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CD" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-2", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b1_id}" }, as: IntakeClerk }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b2_id}" }, as: IntakeClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_LOT_INVALID_STATE (http 409); FieldLot.${l_id}.bin_id still == ${b1_id}"

      - name: c_run_close_twice_returns_run_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PackRun.SCHEDULED_to_ABORTED"
          - "errors[ERR_RUN_INVALID_STATE]"
        distinguishing_aspect: "An ABORTED run is terminal: a second close returns ERR_RUN_INVALID_STATE and records no draws."
        test_recipe:
          setup: ["allocated order with run R; R aborted"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower J", grower_code: "G-J" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CE" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer Q", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 75.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T06:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: PackLineSupervisor, captures: { r_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-runs/${r_id}/close", payload: { outcome: "ABORTED" }, as: PackLineSupervisor }
          trigger:
            - { call: "POST /potato-shed/pack-runs/${r_id}/close", payload: { outcome: "COMPLETED", draws: [ { field_lot_id: "${l_id}", raw_drawn_cwt: 100.00, packed_cwt: 75.00, us1_cwt: 60.00, us2_cwt: 15.00, cull_cwt: 25.00, cull_channel: "WASTE" } ] }, as: PackLineSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_RUN_INVALID_STATE; FieldLot.${l_id}.packed_total_cwt == 0 (no draw applied) and PackOrder.${o_id}.status == ALLOCATED"

      - name: c_order_cancel_shipped_returns_order_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PackOrder"
          - "errors[ERR_ORDER_INVALID_STATE]"
        distinguishing_aspect: "SHIPPED is terminal: cancel on a fully shipped order returns ERR_ORDER_INVALID_STATE; CANCELLED is also terminal (second cancel same error)."
        test_recipe:
          setup: ["order fully shipped (75.00 of 75.00)"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower K", grower_code: "G-K" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CF" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
