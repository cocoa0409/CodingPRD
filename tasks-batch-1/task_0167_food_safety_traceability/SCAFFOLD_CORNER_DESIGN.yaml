  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_hold_resolve_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hold-resolve-stale]
          - errors[ERR_STALE_VERSION]
          - state_machines.HoldOrder.ACTIVE_to_RELEASED
        distinguishing_aspect: "A second resolve carrying the pre-resolution hold version (${hold_v}, captured at create) is stale after the first resolve advanced the version -> ERR_STALE_VERSION (412), checked before the ACTIVE-state precondition."
        test_recipe:
          setup: ["Released lot under an ACTIVE hold; the hold is RELEASE-resolved once (version advances)."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-26", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lot}", reason: "OTHER" }
              as: QualityManager
              captures: { hold: $.data.id, hold_v: $.data.version }
            - call: "POST /traceability/hold-orders/${hold}/resolve"
              payload: { disposition: "RELEASE", expected_hold_order_version: "${hold_v}" }
              as: QualityManager
          trigger:
            - call: "POST /traceability/hold-orders/${hold}/resolve"
              payload: { disposition: "DISPOSE", expected_hold_order_version: "${hold_v}" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_STALE_VERSION\" (hold version advanced by the first resolve; second carries the stale value)"

      - name: occ_correct_version_finalize_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[production-finalize-stale]
          - state_machines.ProductionRun.OPEN_to_FINALIZED
        distinguishing_aspect: "Finalize carrying the current run version (captured after the last consumed-lot line) succeeds; version increments on success."
        test_recipe:
          setup: ["Released raw lot R 100, OPEN run with a 10-unit consumed line."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-27", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
