          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Depth-2 transitive chain from a different trigger (stop completion): completing the
          DeliveryStop → the linked Order moves SCHEDULED→DELIVERED → the order's line gets its
          delivered_on baseline stamped (enabling the return-window gate); the line stamp is a
          consequence of the order delivery, not the stop call directly.
