      - name: submission_revision_loop_then_supersede_branch
        grounds:
          - state_machines.CreativeSubmission.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.CreativeSubmission.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.CreativeSubmission.SUBMITTED_to_SUPERSEDED
          - state_machines.CreativeSubmission.IN_REVIEW_to_APPROVED
          - entities.CreativeSubmission.fields.revision_round
          - entities.CreativeSubmission.fields.change_note
          - entities.CreativeSubmission.fields.superseded_by_submission_id
          - entities.LicenseAgreement.fields.open_submission_count
          - entities.LicenseAgreement.fields.approved_submission_count
          - errors[ERR_SUBMISSION_INVALID_STATE]
        distinguishing_aspect: |
          CreativeSubmission - a different entity from PopupVenue - is cyclic through
          IN_REVIEW -> CHANGES_REQUESTED -> SUBMITTED with revision_round as the loop counter, and
          then forks out of the loop two ways: an approval that closes the row, or a newer row on the
          same (run_id, scope, asset_code) that drives the older row to SUPERSEDED while preserving
          its revision_round and review history. open_submission_count is unchanged by the
          supersede (one row closes as one opens) and only drops when the survivor is approved,
          which a linear reading of the machine gets wrong in both places.
        test_recipe:
          setup:
            - "One NYC venue, one READY kit and one ACTIVE licence whose approval_scopes is [CREATIVE_EXECUTION] and licensor_rep_user_id is rep-1."
            - "One PLANNED run created by producer-1; no rooms, slots or staff exist, so the run's clearance gate can never complete."
            - "REVISION_ROUND_CAP is 3; the loop is walked once so revision_round lands at 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
