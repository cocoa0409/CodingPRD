              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_j3: $.data.id }
            - call: "POST /licensing/licensees/${lic_j3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
