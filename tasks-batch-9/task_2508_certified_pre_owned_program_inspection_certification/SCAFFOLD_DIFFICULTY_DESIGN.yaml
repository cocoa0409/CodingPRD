      - name: audit_run_empty_pool_selects_zero
        grounds:
          - calculations.audit_sample_selection
          - endpoints.POST_/cpo/audit-runs
          - entities.Certification.fields.audit_sampled
        distinguishing_aspect: |
          The degenerate lower bound of the selection formula: with a pool of size 0 the clamp
          max(audit_sample_min_per_run, ceil(0.20 * 0)) would demand 1 selection, so the empty-pool
          fallback must override the minimum and still answer 201 with selected_count 0. The instance
          runs it twice — with no certifications at all and with one SUBMITTED certification that is
          ineligible — so an implementation that counts non-ACTIVE rows into the pool is caught.
