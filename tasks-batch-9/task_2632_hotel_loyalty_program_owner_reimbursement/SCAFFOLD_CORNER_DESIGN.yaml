          assert:
            - "${e_write_peer} == ${e_read_peer} == ${e_buy_peer} == ${e_read_member} == ERR_FORBIDDEN_RESOURCE_OWNER with http 403"
            - "${rpA2_code} == CORP and the row was created at property A - the same call inside the owner's own scope is fine"
            - "${pp_own_cash} == 6250 - 5 lots at the 1250-cent list price - and PointPurchase.${pp_own}.member_id == ${m1_id}"
            - "GET /loyalty/rate-plans?hotel_id=${hB_id} still returns total_count == 1, so the cross-property write left nothing"
            - "Member.${m2_id}.points_purchased_current_year == 0 and GET /loyalty/point-purchases?member_id=${m2_id} returns total_count == 0"
            - "ERR_FORBIDDEN_RESOURCE_OWNER can only appear on endpoints whose roles list includes HotelOwner or Member; on any other endpoint those roles get ERR_UNAUTHORIZED first"

      - name: releasing_approving_and_paying_a_batch_needs_three_distinct_operators
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_4_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_5_ERR_PAYER_CONFLICT
          - roles.ProgramAdministrator.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: |
          One role holds all three money steps, so the only thing separating them is X-User-ID: the
          releaser cannot approve their own batch, and the payer may match neither the releaser nor
          the approver. That makes two distinct 403s on the same endpoint family, and a third
          operator is required before any cash actually leaves the fund.
        test_recipe:
