              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 100000 }
