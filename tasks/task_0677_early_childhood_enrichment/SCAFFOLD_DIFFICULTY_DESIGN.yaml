            - "response.data.error_id == ERR_NO_CREDIT_AVAILABLE"
            - "http_status == 409"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enroll_blocked_when_session_not_scheduled_pair_enrollment_session
        grounds:
          - state_machines.Enrollment.ENROLLED_to_CANCELLED
          - validations[priority=5]
          - entities.ClassSession.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          Enrollment->ClassSession pair: a new enrollment requires session.status == SCHEDULED;
          a HELD session rejects the enroll with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A level-0 session that has been HELD (terminal), and a new child to enroll."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T10:30:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/sessions/${sess_id}/hold"
              payload: { attendance: [] }
              as: FrontDeskStaff
            - call: "POST /enrichment/families"
              payload: { account_email: "fam13@x.com", primary_contact_name: "Gi" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Late", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "GET /enrichment/sessions/${sess_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sess_v_live: $.data.version }
          trigger:
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v_live}" }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: hold_blocked_when_instructor_inactive_pair_session_instructor
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_HELD
          - validations[priority=6]
          - entities.Instructor.fields.status
          - errors[ERR_INSTRUCTOR_NOT_CERTIFIED]
        distinguishing_aspect: >
          ClassSession->Instructor pair (different from the Enrollment->ClassSession pair):
          holding a SCHEDULED session requires instructor.status == ACTIVE; an INACTIVE instructor
          blocks the hold with ERR_INSTRUCTOR_NOT_CERTIFIED.
        test_recipe:
          setup:
            - "A SCHEDULED level-0 session whose instructor is deactivated before the hold, after clock reaches start."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id }
            - call: "POST /enrichment/instructors/${inst_id}/deactivate"
              payload: {}
              as: StudioAdmin
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:30:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /enrichment/sessions/${sess_id}/hold"
              payload: { attendance: [] }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSTRUCTOR_NOT_CERTIFIED"
            - "http_status == 422"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_buffer_overlap_rejects_within_buffer_gap
        grounds:
          - validations[priority=7]
          - entities.Instructor.fields.buffer_minutes
          - errors[ERR_INSTRUCTOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: >
          Instructor interval semantics use a buffer: a second session starting only 10 minutes
          after the first ends collides because the 15-minute buffer expands the occupied interval;
          this is buffer-expanded geometry on the Instructor resource.
        test_recipe:
          setup:
            - "Instructor with buffer_minutes=15 already teaching 09:00-10:00; a new 10:10-11:00 session on the same instructor in a different room."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room B", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_b_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
          trigger:
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_b_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T10:10:00Z", end_at: "2026-05-10T11:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSTRUCTOR_SCHEDULE_CONFLICT"
            - "http_status == 409"

      - name: room_adjacency_allowed_but_strict_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.Room.fields.physical_capacity
          - errors[ERR_ROOM_SCHEDULE_CONFLICT]
        distinguishing_aspect: >
          Room interval semantics are half-open/adjacency-allowed (no buffer): a session whose
          start_at exactly equals the prior session's end_at is accepted, but a strictly overlapping
          session is rejected — different geometry from the buffered instructor rule, on the Room resource.
        test_recipe:
          setup:
            - "Room A hosting 09:00-10:00 (instructor I1) and 10:00-11:00 (instructor I2, adjacency allowed). A third strictly-overlapping 10:30-11:30 session on Room A with a third instructor."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "I1", certified_level_indices: [0], buffer_minutes: 0 }
              as: StudioAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "I2", certified_level_indices: [0], buffer_minutes: 0 }
              as: StudioAdmin
              captures: { inst2_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "I3", certified_level_indices: [0], buffer_minutes: 0 }
              as: StudioAdmin
              captures: { inst3_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst1_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst2_id}", start_at: "2026-05-10T10:00:00Z", end_at: "2026-05-10T11:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_adj_id: $.data.id, sess_adj_status: $.data.status }
          trigger:
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst3_id}", start_at: "2026-05-10T10:30:00Z", end_at: "2026-05-10T11:30:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "ClassSession.${sess_adj_id}.status == SCHEDULED"
            - "response.data.error_id == ERR_ROOM_SCHEDULE_CONFLICT"
            - "http_status == 409"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_enroll_then_cancel_restores_capacity
        grounds:
          - state_machines.Enrollment.ENROLLED_to_CANCELLED
          - entities.ClassSession.fields.enrolled_count
          - entities.ClassSession.fields.capacity
        distinguishing_aspect: >
          Conserved quantity = seats: invariant (capacity - enrolled_count) = free seats. After an
          enroll (enrolled_count 0->1) followed by its compensating cancel (1->0), enrolled_count
          returns to 0 and free seats return to capacity with zero drift.
        test_recipe:
          setup:
            - "Capacity-3 level-0 session with one ENROLLED child; that enrollment is then cancelled."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 3 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam14@x.com", primary_contact_name: "Hu" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrichment/enrollments/${enr_id}/cancel"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "ClassSession.${sess_id}.enrolled_count == 0"
            - "ClassSession.${sess_id}.capacity == 3"
            - "Enrollment.${enr_id}.status == CANCELLED"

      - name: credit_conservation_issue_then_redeem_balances_ledger
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - entities.MakeupCredit.fields.status
          - entities.Membership.fields.makeup_credit_balance
        distinguishing_aspect: >
          Conserved quantity = makeup credits (a different conserved quantity from seats):
          invariant issued_count = redeemed_count + expired_count + available_count. After issue
          (balance 0->1) then redeem (1->0), the AVAILABLE credit becomes REDEEMED and the ledger
          totals reconcile (1 issued = 1 redeemed + 0 expired + 0 available).
        test_recipe:
          setup:
            - "A cancelled level-0 session mints one credit; the credit is redeemed onto another SCHEDULED level-0 session."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
