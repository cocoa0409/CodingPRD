      - name: an_offer_needs_one_inclusive_day_of_award_overlap_and_zero_days_is_refused
        claim_type: error_triggerable
        grounds:
          - validations.priority_35_ERR_AWARD_TERM_NO_OVERLAP
          - calculations.funding_encumbrance
          - endpoints.POST /appointments/{id}/issue-offer
        distinguishing_aspect: "The rule is a strict one-inclusive-day test, not a containment test: a term starting the day after the award ends encumbers nothing and is refused with ERR_AWARD_TERM_NO_OVERLAP, while a term whose first day is the award's last day is accepted and encumbers exactly one day - base 169.86, fringe 47.56 at the sub-40000 band that the prorated base falls into, total 217.42. The refusal must not be reported as ERR_FUNDING_BUDGET_EXCEEDED even though the zero-overlap encumbrance is trivially affordable."
