scenario: |
  Carnival Midway & Amusement Ride Safety Inspection (state ride inspection program): ride inventory & manufacturer inspection requirements, state permit & inspector scheduling before opening, daily pre-opening ride checklist & operator certification, incident/injury reporting & ride shutdown criteria, capacity/queue management & rider restriction enforcement, ticket/wristband pricing & redemption reconciliation, setup/teardown crew scheduling across dates, weather/wind shutdown thresholds

domain_name: carnival-midway-ride-safety
api_prefix: /midway

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency      # OCC on StaffMember/Fair/DailyChecklist versions
    - cascading_side_effects      # cycle-threshold, incident, and weather cascades
    - dual_variant_calculation    # permit fee (estimated vs final); settlement (projected vs recognized)
    - rate_threshold_triggers     # wind limits, minor-incident count, cycle interval, attendance cap
  entity_topology: flat           # peer resources under /midway joined by FK ids in bodies/queries
  state_machine_shape: parallel   # Ride carries setup_status x license_status x daily_status; cyclic sub-machines elsewhere
  relationship_patterns:
    - one_to_many                 # Fair -> rides/days/staff/products; StaffMember -> certs/shifts
    - cross_aggregate             # Permit -> Inspector; DailyChecklist -> StaffMember x Ride x OperatingDay
  role_model: segregation_of_duties  # permit approver != conducting inspector; checklist countersigner != performer
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all collections under /midway)
# =============================================================================
entities:
  - name: Fair
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public name of the midway engagement" }
      - { name: operator_company_name, type: string, source: input, description: "Show owner company" }
      - { name: location, type: string, source: input, description: "Fairground location" }
      - { name: setup_start_date, type: string, source: input, description: "ISO date YYYY-MM-DD; first setup day; constraints: setup_start_date <= opening_date <= closing_date <= teardown_end_date (ERR_INVALID_REQUEST)" }
      - { name: opening_date, type: string, source: input, description: "First public operating date" }
      - { name: closing_date, type: string, source: input, description: "Last public operating date" }
      - { name: teardown_end_date, type: string, source: input, description: "Last teardown date" }
      - { name: midway_capacity, type: integer, source: input, description: "Max guests on midway; upper bound for OperatingDay.max_attendance; constraints: >= 1" }
      - { name: status, type: enum, source: system, description: "SETUP | PERMIT_REQUESTED | PERMITTED | TEARDOWN | ARCHIVED" }

  - name: Ride
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id; owning fair" }
      - { name: name, type: string, source: input, description: "Ride display name" }
      - { name: manufacturer, type: string, source: input, description: "Manufacturer name" }
      - { name: model, type: string, source: input, description: "Manufacturer model" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number" }
      - { name: ride_class, type: enum, source: input, description: "KIDDIE | FAMILY | THRILL | EXTREME" }
      - { name: capacity_per_cycle, type: integer, source: input, description: "Max riders per dispatched cycle; constraints: >= 1" }
      - { name: min_rider_height_in, type: integer, source: input, description: "Minimum rider height inches; constraints: 20 <= h <= 96 and min <= max" }
      - { name: max_rider_height_in, type: integer, source: input, description: "Maximum rider height inches" }
      - { name: wind_limit_mph, type: integer, source: input, description: "Manufacturer wind shutdown limit; observation >= limit holds the ride; constraints: 5..60" }
      - { name: cycle_inspection_interval, type: integer, source: input, description: "Manufacturer cycle count between required state ride audits; suspension at >= this value; constraints: >= 1" }
      - { name: annual_cert_expires_on, type: string, source: input, description: "ISO date; manufacturer annual certification expiry; must be >= fair.closing_date at verify-assembly" }
      - { name: cycles_since_inspection, type: integer, source: system, default: 0, description: "Completed cycles since last passed RIDE_AUDIT; reset to 0 on RIDE_AUDIT pass" }
      - { name: minor_incidents_today, type: integer, source: system, default: 0, description: "MINOR incidents filed on the current operating date; reset to 0 by begin-checklists" }
      - { name: setup_status, type: enum, source: system, description: "INSTALLED | SETUP_VERIFIED | DISMANTLED" }
      - { name: license_status, type: enum, source: system, description: "PENDING | LICENSED | SUSPENDED | REVOKED" }
      - { name: daily_status, type: enum, source: system, description: "CLOSED | OPEN | WEATHER_HOLD | INCIDENT_HOLD" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: license_number, type: string, source: input, description: "State inspector license; unique across all inspectors (ERR_INSPECTOR_LICENSE_EXISTS)" }
      - { name: max_daily_inspections, type: integer, source: input, default: 3, description: "Daily appointment capacity; constraints: 1..8" }
      - { name: active, type: boolean, source: system, default: true, description: "Inactive inspectors are ineligible for new assignment" }

  - name: InspectionAppointment
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id; fair under inspection" }
      - { name: inspector_id, type: string, source: system, description: "FK -> Inspector.id; server-assigned per inspector_assignment calculation" }
      - { name: ride_id, type: string, source: input, description: "FK -> Ride.id; required iff scope == RIDE_AUDIT, forbidden otherwise; must belong to fair_id" }
      - { name: scope, type: enum, source: input, description: "FAIR_WIDE | RIDE_AUDIT" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date; constraints: current date <= scheduled_date <= fair.teardown_end_date" }
      - { name: start_hour, type: integer, source: input, description: "Start hour 6..20" }
      - { name: duration_hours, type: integer, source: input, description: "Duration 1..4; end_hour must be <= 21" }
      - { name: end_hour, type: integer, source: computed, description: "start_hour + duration_hours" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED_PASS | COMPLETED_FAIL | CANCELLED" }
      - { name: findings, type: string, source: input, description: "Optional inspector findings recorded at completion" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until completed" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: system, description: "FK -> Fair.id; fair this permit belongs to" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "permit_fee estimated variant, frozen at request-permit time" }
      - { name: final_fee_cents, type: integer, source: computed, description: "permit_fee final variant at decision time; null until APPROVED" }
      - { name: billable_ride_count, type: integer, source: computed, description: "Count of qualifying rides (setup_status == SETUP_VERIFIED) at decision time; null until decided" }
      - { name: reinspection_failure_count, type: integer, source: computed, description: "Count of COMPLETED_FAIL FAIR_WIDE appointments for the fair at decision time; null until decided" }
      - { name: approved_by_inspector_id, type: string, source: system, description: "FK -> Inspector.id; set on APPROVED; null otherwise" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on DENIED; null otherwise" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of decision; null while PENDING" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id; employing fair (scopes all staff-backed roles)" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: functions, type: array, source: input, description: "Non-empty subset of [OPERATOR, CLERK, CREW, SUPERVISOR]; gates role scoping" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp of release; null while ACTIVE" }

  - name: OperatorCertification
    parent: null
    common_fields: true
    fields:
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; staff holding the certification (must carry OPERATOR function)" }
      - { name: ride_class, type: enum, source: input, description: "KIDDIE | FAMILY | THRILL | EXTREME" }
      - { name: issued_on, type: string, source: input, description: "ISO date of issuance" }
      - { name: expires_on, type: string, source: input, description: "ISO date; must be > issued_on; validity = status ACTIVE and expires_on >= current date (evaluated at enforcement time, never stored as EXPIRED)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }

  - name: OperatingDay
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: date, type: string, source: input, description: "ISO date; unique per fair (ERR_DUPLICATE_OPERATING_DAY); constraints: opening_date <= date <= closing_date and date >= current date" }
      - { name: max_attendance, type: integer, source: input, description: "Guest cap for the day; constraints: 1 <= max_attendance <= fair.midway_capacity (ERR_CAPACITY_ABOVE_MIDWAY)" }
      - { name: posture, type: enum, source: system, description: "SCHEDULED | CHECKLIST_PHASE | OPEN | WEATHER_HOLD | CLOSED | RECONCILED" }
      - { name: attendance_count, type: integer, source: system, default: 0, description: "Active guests admitted; +1 per TicketSale create, -1 per sale void" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of total_charged_cents over ALL sales of the day incl. VOIDED; set at close-gates; null before" }
      - { name: voided_cents, type: integer, source: computed, description: "Sum of total_charged_cents over VOIDED sales; set at close-gates; null before" }
      - { name: projected_revenue_cents, type: integer, source: computed, description: "daily_settlement forward_looking variant = gross_sales_cents - voided_cents; set at close-gates; null before" }
      - { name: recognized_revenue_cents, type: integer, source: computed, description: "daily_settlement chronological variant; set at reconcile; null before" }
      - { name: breakage_cents, type: integer, source: computed, description: "projected_revenue_cents - recognized_revenue_cents; set at reconcile; null before" }
      - { name: reconciliation_flagged, type: boolean, source: computed, description: "breakage_cents > 1000; set at reconcile; null before" }

  - name: DailyChecklist
    parent: null
    common_fields: true
    fields:
      - { name: ride_id, type: string, source: input, description: "FK -> Ride.id" }
      - { name: operating_day_id, type: string, source: input, description: "FK -> OperatingDay.id; must belong to same fair as ride" }
      - { name: performed_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; the RideOperator caller (X-User-ID)" }
      - { name: countersigned_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; the FairManager caller at countersign; null until COUNTERSIGNED; reset to null on reject" }
      - { name: items_total, type: integer, source: input, description: "Checklist item count; constraints: >= 1" }
      - { name: items_passed, type: integer, source: system, description: "Set at submit; must equal items_total (ERR_CHECKLIST_INCOMPLETE); null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | COUNTERSIGNED (reject loops SUBMITTED -> DRAFT)" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at reject; null otherwise" }

  - name: RideCycle
    parent: null
    common_fields: true
    fields:
      - { name: ride_id, type: string, source: input, description: "FK -> Ride.id" }
      - { name: operating_day_id, type: string, source: input, description: "FK -> OperatingDay.id; same fair as ride" }
      - { name: operator_staff_id, type: string, source: system, description: "FK -> StaffMember.id; the RideOperator caller (X-User-ID); load/dispatch/complete/abort restricted to this operator" }
      - { name: sequence_number, type: integer, source: computed, description: "Per (ride_id, operating_day_id) ordinal = max existing + 1, starting at 1" }
      - { name: status, type: enum, source: system, description: "LOADING | RUNNING | COMPLETED | ABORTED" }
      - { name: rider_count, type: integer, source: computed, default: 0, description: "Count of REDEEMED redemptions attached to this cycle; invariant maintained by load/void/abort" }

  - name: RideRedemption
    parent: null
    common_fields: true
    fields:
      - { name: wristband_id, type: string, source: input, description: "FK -> TicketSale.id; the guest instrument presented" }
      - { name: ride_id, type: string, source: input, description: "FK -> Ride.id; must be same fair as the wristband's operating day (ERR_CROSS_FAIR_REFERENCE)" }
      - { name: operating_day_id, type: string, source: system, description: "FK -> OperatingDay.id; copied from the wristband sale's operating_day_id" }
      - { name: ride_cycle_id, type: string, source: system, description: "FK -> RideCycle.id; set when boarded (REDEEMED); null while QUEUED/VOIDED/EXPIRED" }
      - { name: queue_position, type: integer, source: computed, description: "Per (ride_id, operating_day_id) ordinal = max existing + 1, starting at 1; boarding order key" }
      - { name: status, type: enum, source: system, description: "QUEUED | REDEEMED | VOIDED | EXPIRED" }

  - name: TicketProduct
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: kind, type: enum, source: input, description: "RIDE_TICKET | CREDIT_BUNDLE | WRISTBAND" }
      - { name: base_price_cents, type: integer, source: input, description: "Per-ticket price (RIDE_TICKET), per-credit base price (CREDIT_BUNDLE), or flat wristband price (WRISTBAND); constraints: >= 1" }
      - { name: active, type: boolean, source: system, default: true, description: "Inactive products cannot be sold (ERR_PRODUCT_INACTIVE)" }

  - name: TicketSale
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> TicketProduct.id; must belong to the operating day's fair" }
      - { name: operating_day_id, type: string, source: input, description: "FK -> OperatingDay.id; posture must be OPEN" }
      - { name: clerk_staff_id, type: string, source: system, description: "FK -> StaffMember.id; the TicketClerk caller (X-User-ID)" }
      - { name: holder_height_in, type: integer, source: input, description: "Guest height for rider-restriction enforcement; constraints: 20..96" }
      - { name: quantity, type: integer, source: input, description: "Credits purchased (CREDIT_BUNDLE, >= 1) or tickets (RIDE_TICKET, >= 1); must be exactly 1 for WRISTBAND" }
      - { name: is_unlimited, type: boolean, source: computed, description: "true iff product kind == WRISTBAND; unlimited sales never debit credits" }
      - { name: credits_granted, type: integer, source: computed, description: "quantity for credit-bearing kinds; null for WRISTBAND" }
      - { name: credits_remaining, type: integer, source: computed, description: "Credits not yet redeemed/forfeited; debited at boarding only; null for WRISTBAND" }
      - { name: credits_redeemed, type: integer, source: computed, default: 0, description: "Net boarded credits (boarding +1, boarding-void/abort -1); null for WRISTBAND" }
      - { name: credits_forfeited, type: integer, source: computed, default: 0, description: "Credits expired unredeemed at close-gates; null for WRISTBAND" }
      - { name: subtotal_cents, type: integer, source: computed, description: "credit_bundle_subtotal (marginal tiers, per-unit pre-rounding) or base_price_cents x quantity (RIDE_TICKET) or base_price_cents (WRISTBAND)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "max(50, round_half_up(subtotal_cents * 0.06)) — computed on the pre-fee subtotal" }
      - { name: total_charged_cents, type: integer, source: computed, description: "subtotal_cents + service_fee_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED | EXPIRED" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: operating_day_id, type: string, source: input, description: "FK -> OperatingDay.id; posture must be CHECKLIST_PHASE | OPEN | WEATHER_HOLD" }
      - { name: wind_speed_mph, type: integer, source: input, description: "Observed sustained wind; constraints: 0..200" }
      - { name: note, type: string, source: input, description: "Optional observer note" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: ride_id, type: string, source: input, description: "FK -> Ride.id" }
      - { name: operating_day_id, type: string, source: input, description: "FK -> OperatingDay.id; posture must be OPEN | WEATHER_HOLD; same fair as ride" }
      - { name: reporter_staff_id, type: string, source: system, description: "FK -> StaffMember.id; the caller (X-User-ID)" }
      - { name: severity, type: enum, source: input, description: "NEAR_MISS | MINOR | SERIOUS | FATAL" }
      - { name: injury_count, type: integer, source: input, description: "Guests injured; constraints: >= 0; SERIOUS/FATAL require >= 1" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: status, type: enum, source: system, description: "FILED | CLEARED | SHUTDOWN_ORDERED" }
      - { name: cleared_by_inspector_id, type: string, source: system, description: "FK -> Inspector.id; set on CLEARED; null otherwise" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical-clock timestamp of clearance; null otherwise" }

  - name: CrewShift
    parent: null
    common_fields: true
    fields:
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; must be ACTIVE and carry CREW function" }
      - { name: fair_id, type: string, source: system, description: "FK -> Fair.id; denormalized from StaffMember.fair_id at creation" }
      - { name: work_date, type: string, source: input, description: "ISO date; constraints: work_date >= current date and inside the shift_role season window (ERR_SHIFT_OUT_OF_SEASON)" }
      - { name: start_hour, type: integer, source: input, description: "0..23; start_hour < end_hour; half-open interval [start_hour, end_hour)" }
      - { name: end_hour, type: integer, source: input, description: "1..24; shift length <= 12 hours (ERR_INVALID_REQUEST)" }
      - { name: shift_role, type: enum, source: input, description: "SETUP | OPERATIONS | TEARDOWN; windows: SETUP = [setup_start_date, opening_date), OPERATIONS = [opening_date, closing_date], TEARDOWN = (closing_date, teardown_end_date]" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED" }
# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Fair
    initial_state: SETUP
    terminal_states: [ARCHIVED]
    transitions:
      - from: SETUP
        to: PERMIT_REQUESTED
        trigger: "POST /midway/fairs/{id}/request-permit"
        actor: FairManager
        preconditions:
          - "fair.status == SETUP (ERR_FAIR_INVALID_STATE)"
          - "at least one Ride of the fair has setup_status == SETUP_VERIFIED (ERR_NO_VERIFIED_RIDES)"
        side_effects:
          - "create Permit(status=PENDING) with estimated_fee_cents = permit_fee estimated variant over rides where setup_status == SETUP_VERIFIED, reinspection failures fixed at 0"
          - "increments Fair.version by 1"
      - from: PERMIT_REQUESTED
        to: PERMITTED
        trigger: "system (cascade of POST /midway/permits/{id}/approve)"
        actor: system
        preconditions: []
        side_effects:
          - "every Ride of the fair with setup_status == SETUP_VERIFIED: license_status PENDING -> LICENSED"
          - "increments Fair.version by 1"
      - from: PERMIT_REQUESTED
        to: SETUP
        trigger: "system (cascade of POST /midway/permits/{id}/deny)"
        actor: system
        preconditions: []
        side_effects:
          - "rides keep setup_status; license_status stays PENDING (cycle back for remediation and re-request)"
          - "increments Fair.version by 1"
      - from: PERMITTED
        to: TEARDOWN
        trigger: "POST /midway/fairs/{id}/begin-teardown"
        actor: FairManager
        preconditions:
          - "fair.status == PERMITTED (ERR_FAIR_INVALID_STATE)"
          - "current date > fair.closing_date (ERR_INVALID_REQUEST)"
          - "no OperatingDay of the fair has posture IN {CHECKLIST_PHASE, OPEN, WEATHER_HOLD, CLOSED} (ERR_DAYS_STILL_ACTIVE); SCHEDULED and RECONCILED days do not block"
        side_effects:
          - "increments Fair.version by 1"
      - from: TEARDOWN
        to: ARCHIVED
        trigger: "POST /midway/fairs/{id}/archive"
        actor: FairManager
        preconditions:
          - "fair.status == TEARDOWN (ERR_FAIR_INVALID_STATE)"
          - "every Ride of the fair has setup_status == DISMANTLED (ERR_RIDES_NOT_DISMANTLED)"
        side_effects:
          - "increments Fair.version by 1"

  - entity: Ride
    initial_state: "setup_status=INSTALLED, license_status=PENDING, daily_status=CLOSED"
    terminal_states: ["setup_status=DISMANTLED or license_status=REVOKED"]
    transitions:
      # --- dimension 1: setup_status (linear) ---
      - from: "setup_status=INSTALLED"
        to: "setup_status=SETUP_VERIFIED"
        trigger: "POST /midway/rides/{id}/verify-assembly"
        actor: CrewMember
        preconditions:
          - "ride.setup_status == INSTALLED (ERR_RIDE_INVALID_STATE)"
          - "fair.status IN {SETUP, PERMIT_REQUESTED} (ERR_FAIR_INVALID_STATE)"
          - "ride.annual_cert_expires_on >= fair.closing_date (ERR_ANNUAL_CERT_EXPIRED)"
          - "caller has a CrewShift with shift_role == SETUP, work_date == current date, status IN {SCHEDULED, CONFIRMED} (ERR_NO_COVERING_SHIFT)"
        side_effects:
          - "increments Ride.version by 1"
      - from: "setup_status=SETUP_VERIFIED"
        to: "setup_status=DISMANTLED"
        trigger: "POST /midway/rides/{id}/dismantle"
        actor: CrewMember
        preconditions:
          - "ride.setup_status == SETUP_VERIFIED (ERR_RIDE_INVALID_STATE)"
          - "fair.status == TEARDOWN (ERR_FAIR_INVALID_STATE)"
          - "ride.daily_status == CLOSED (ERR_RIDE_INVALID_STATE)"
          - "caller has a CrewShift with shift_role == TEARDOWN, work_date == current date, status IN {SCHEDULED, CONFIRMED} (ERR_NO_COVERING_SHIFT)"
        side_effects:
          - "license_status -> REVOKED if not already REVOKED (dismantled rides cannot hold a license)"
          - "increments Ride.version by 1"
      # --- dimension 2: license_status (cyclic: SUSPENDED -> LICENSED loop) ---
      - from: "license_status=PENDING"
        to: "license_status=LICENSED"
        trigger: "system (cascade of fair PERMIT_REQUESTED -> PERMITTED)"
        actor: system
        preconditions:
          - "ride.setup_status == SETUP_VERIFIED"
        side_effects: []
      - from: "license_status=LICENSED"
        to: "license_status=SUSPENDED"
        trigger: "system (POST /midway/ride-cycles/{id}/complete pushes cycles_since_inspection >= cycle_inspection_interval)"
        actor: system
        preconditions: []
        side_effects:
          - "link 2 of cycle cascade: daily_status -> CLOSED if currently OPEN or WEATHER_HOLD"
          - "link 3 of cycle cascade: today's QUEUED RideRedemptions for this ride -> VOIDED (no credit movement; QUEUED holds no credit)"
        note: "depth-3 chain: complete -> cycles_since_inspection (link 1) -> license_status SUSPENDED (link 2) -> daily_status CLOSED + queued redemptions VOIDED (link 3)"
      - from: "license_status=LICENSED"
        to: "license_status=SUSPENDED"
        trigger: "system (POST /midway/incident-reports with severity == SERIOUS)"
        actor: system
        preconditions: []
        side_effects:
          - "daily_status -> INCIDENT_HOLD if currently OPEN or WEATHER_HOLD (queued redemptions preserved)"
      - from: "license_status=SUSPENDED"
        to: "license_status=LICENSED"
        trigger: "system (POST /midway/inspection-appointments/{id}/complete with scope == RIDE_AUDIT and outcome == PASS)"
        actor: system
        preconditions:
          - "appointment.ride_id == ride.id"
        side_effects:
          - "ride.cycles_since_inspection = 0"
      - from: "license_status=PENDING"
        to: "license_status=LICENSED"
        trigger: "system (POST /midway/inspection-appointments/{id}/complete with scope == RIDE_AUDIT and outcome == PASS; requires fair PERMITTED)"
        actor: system
        preconditions:
          - "appointment.ride_id == ride.id"
        side_effects:
          - "ride.cycles_since_inspection = 0"
      - from: "license_status=LICENSED"
        to: "license_status=REVOKED"
        trigger: "system (POST /midway/incident-reports with severity == FATAL, or POST /midway/incident-reports/{id}/order-shutdown)"
        actor: system
        preconditions: []
        side_effects:
          - "daily_status -> CLOSED if currently OPEN, WEATHER_HOLD, or INCIDENT_HOLD"
          - "today's QUEUED RideRedemptions for this ride -> VOIDED"
      - from: "license_status=SUSPENDED"
        to: "license_status=REVOKED"
        trigger: "system (POST /midway/incident-reports/{id}/order-shutdown)"
        actor: system
        preconditions: []
        side_effects:
          - "daily_status -> CLOSED if currently OPEN, WEATHER_HOLD, or INCIDENT_HOLD"
          - "today's QUEUED RideRedemptions for this ride -> VOIDED"
      # --- dimension 3: daily_status (cyclic weather/incident loops) ---
      - from: "daily_status=CLOSED"
        to: "daily_status=OPEN"
        trigger: "system (POST /midway/operating-days/{id}/open-gates)"
        actor: system
        preconditions:
          - "ride.setup_status == SETUP_VERIFIED and ride.license_status == LICENSED and a COUNTERSIGNED DailyChecklist exists for (ride, day)"
        side_effects: []
      - from: "daily_status=CLOSED"
        to: "daily_status=OPEN"
        trigger: "system (POST /midway/daily-checklists/{id}/countersign while day posture == OPEN — late clearance)"
        actor: system
        preconditions:
          - "ride.license_status == LICENSED"
        side_effects: []
      - from: "daily_status=OPEN"
        to: "daily_status=WEATHER_HOLD"
        trigger: "system (POST /midway/weather-observations with wind_speed_mph >= ride.wind_limit_mph, or wind >= 45 fair-closure sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "QUEUED redemptions are preserved (riders wait out the hold)"
      - from: "daily_status=WEATHER_HOLD"
        to: "daily_status=OPEN"
        trigger: "POST /midway/rides/{id}/resume"
        actor: FairManager
        preconditions:
          - "day posture == OPEN (ERR_INVALID_DAY_POSTURE)"
          - "ride.license_status == LICENSED (ERR_RIDE_NOT_LICENSED)"
          - "latest WeatherObservation for the day (max created_at) has wind_speed_mph <= ride.wind_limit_mph - 3 (ERR_WIND_ABOVE_LIMIT)"
        side_effects:
          - "increments Ride.version by 1"
      - from: "daily_status=OPEN"
        to: "daily_status=INCIDENT_HOLD"
        trigger: "system (POST /midway/incident-reports: severity SERIOUS, or MINOR pushing minor_incidents_today >= 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "daily_status=WEATHER_HOLD"
        to: "daily_status=INCIDENT_HOLD"
        trigger: "system (POST /midway/incident-reports as above)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "daily_status=INCIDENT_HOLD"
        to: "daily_status=CLOSED"
        trigger: "system (POST /midway/incident-reports/{id}/clear when no other FILED or SHUTDOWN_ORDERED incident remains for (ride, day))"
        actor: system
        preconditions: []
        side_effects: []
      - from: "daily_status=INCIDENT_HOLD"
        to: "daily_status=OPEN"
        trigger: "POST /midway/rides/{id}/resume"
        actor: FairManager
        preconditions:
          - "day posture == OPEN (ERR_INVALID_DAY_POSTURE)"
          - "ride.license_status == LICENSED (ERR_RIDE_NOT_LICENSED)"
          - "no IncidentReport for (ride, day) in status FILED or SHUTDOWN_ORDERED (ERR_INCIDENTS_OPEN)"
        side_effects:
          - "increments Ride.version by 1"
      - from: "daily_status=OPEN"
        to: "daily_status=CLOSED"
        trigger: "system (POST /midway/operating-days/{id}/close-gates)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "daily_status=WEATHER_HOLD"
        to: "daily_status=CLOSED"
        trigger: "system (POST /midway/operating-days/{id}/close-gates)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "daily_status=INCIDENT_HOLD"
        to: "daily_status=CLOSED"
        trigger: "system (POST /midway/operating-days/{id}/close-gates)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InspectionAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /midway/inspection-appointments/{id}/complete (outcome=PASS)"
        actor: StateInspector
        preconditions:
          - "appointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "caller X-User-ID == appointment.inspector_id (ERR_FORBIDDEN)"
          - "appointment.scheduled_date <= current date (ERR_APPOINTMENT_NOT_DUE)"
          - "scope == RIDE_AUDIT requires fair.status == PERMITTED (ERR_FAIR_INVALID_STATE)"
        side_effects:
          - "completed_at = current logical clock"
          - "scope == RIDE_AUDIT: ride.cycles_since_inspection = 0; ride.license_status (PENDING|SUSPENDED) -> LICENSED"
      - from: SCHEDULED
        to: COMPLETED_FAIL
        trigger: "POST /midway/inspection-appointments/{id}/complete (outcome=FAIL)"
        actor: StateInspector
        preconditions:
          - "appointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "caller X-User-ID == appointment.inspector_id (ERR_FORBIDDEN)"
          - "appointment.scheduled_date <= current date (ERR_APPOINTMENT_NOT_DUE)"
        side_effects:
          - "completed_at = current logical clock"
          - "FAIR_WIDE failures are counted by permit_fee final variant as reinspection_failure_count"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /midway/inspection-appointments/{id}/cancel"
        actor: FairManager
        preconditions:
          - "appointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects: []

  - entity: Permit
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /midway/permits/{id}/approve"
        actor: StateInspector
        preconditions:
          - "permit.status == PENDING (ERR_PERMIT_INVALID_STATE)"
          - "OCC: expected_fair_version == fair.version (ERR_STALE_FAIR_VERSION, 412)"
          - "a FAIR_WIDE InspectionAppointment for the fair exists with status == COMPLETED_PASS and completed_at >= permit.created_at (ERR_INSPECTION_REQUIRED)"
          - "caller X-User-ID != inspector_id of the latest such COMPLETED_PASS appointment (ERR_PERMIT_APPROVER_CONFLICT)"
        side_effects:
          - "final_fee_cents, billable_ride_count, reinspection_failure_count = permit_fee final variant at decision time"
          - "approved_by_inspector_id = caller; decided_at = current logical clock"
          - "fair PERMIT_REQUESTED -> PERMITTED (cascade licenses all SETUP_VERIFIED rides; increments Fair.version)"
      - from: PENDING
        to: DENIED
        trigger: "POST /midway/permits/{id}/deny"
        actor: StateInspector
        preconditions:
          - "permit.status == PENDING (ERR_PERMIT_INVALID_STATE)"
          - "same ERR_PERMIT_APPROVER_CONFLICT rule as approve, evaluated against the latest COMPLETED_PASS FAIR_WIDE appointment when one exists"
        side_effects:
          - "denial_reason recorded; decided_at = current logical clock"
          - "fair PERMIT_REQUESTED -> SETUP (increments Fair.version)"

  - entity: StaffMember
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /midway/staff/{id}/release"
        actor: FairManager
        preconditions:
          - "staff.status == ACTIVE (ERR_STAFF_INVALID_STATE)"
        side_effects:
          - "released_at = current logical clock"
          - "compensation cascade: this staff member's CrewShifts with status IN {SCHEDULED, CONFIRMED} and work_date >= current date -> CANCELLED (past-dated shifts untouched)"

  - entity: OperatorCertification
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /midway/operator-certifications/{id}/revoke"
        actor: StateProgramAdmin | StateInspector
        preconditions:
          - "certification.status == ACTIVE (ERR_CERT_INVALID_STATE)"
        side_effects: []

  - entity: OperatingDay
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: CHECKLIST_PHASE
        trigger: "POST /midway/operating-days/{id}/begin-checklists"
        actor: FairManager
        preconditions:
          - "day.posture == SCHEDULED (ERR_INVALID_DAY_POSTURE)"
          - "day.date == current date (ERR_DAY_NOT_TODAY)"
        side_effects:
          - "every Ride of the fair: minor_incidents_today = 0"
      - from: CHECKLIST_PHASE
        to: OPEN
        trigger: "POST /midway/operating-days/{id}/open-gates"
        actor: FairManager
        preconditions:
          - "day.posture == CHECKLIST_PHASE (ERR_INVALID_DAY_POSTURE)"
          - "compound gate: every Ride of the fair with setup_status == SETUP_VERIFIED AND license_status == LICENSED has a COUNTERSIGNED DailyChecklist for this day (ERR_RIDES_NOT_CLEARED)"
        side_effects:
          - "each such ride: daily_status CLOSED -> OPEN"
      - from: OPEN
        to: WEATHER_HOLD
        trigger: "system (POST /midway/weather-observations with wind_speed_mph >= 45)"
        actor: system
        preconditions: []
        side_effects:
          - "every ride of the fair with daily_status == OPEN -> WEATHER_HOLD (regardless of per-ride wind_limit_mph)"
      - from: WEATHER_HOLD
        to: OPEN
        trigger: "POST /midway/operating-days/{id}/resume-day"
        actor: FairManager
        preconditions:
          - "day.posture == WEATHER_HOLD (ERR_INVALID_DAY_POSTURE)"
          - "latest WeatherObservation for the day (max created_at) has wind_speed_mph <= 39 (ERR_WIND_ABOVE_LIMIT)"
        side_effects:
          - "rides remain WEATHER_HOLD; each ride reopens individually via POST /midway/rides/{id}/resume"
      - from: OPEN
        to: CLOSED
        trigger: "POST /midway/operating-days/{id}/close-gates"
        actor: FairManager
        preconditions:
          - "day.posture IN {OPEN, WEATHER_HOLD} (ERR_INVALID_DAY_POSTURE)"
        side_effects:
          - "every ride with daily_status IN {OPEN, WEATHER_HOLD, INCIDENT_HOLD} -> CLOSED"
          - "every QUEUED RideRedemption of the day -> EXPIRED (no credit movement; QUEUED holds no credit)"
          - "every credit-bearing TicketSale of the day with status == ACTIVE: credits_forfeited += credits_remaining; credits_remaining = 0; status -> EXPIRED"
          - "computes gross_sales_cents, voided_cents, projected_revenue_cents (daily_settlement forward_looking variant)"
      - from: WEATHER_HOLD
        to: CLOSED
        trigger: "POST /midway/operating-days/{id}/close-gates"
        actor: FairManager
        preconditions: []
        side_effects:
          - "same cascade as OPEN -> CLOSED"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /midway/operating-days/{id}/reconcile"
        actor: FairManager
        preconditions:
          - "day.posture == CLOSED (ERR_INVALID_DAY_POSTURE)"
        side_effects:
          - "computes recognized_revenue_cents (daily_settlement chronological variant), breakage_cents, reconciliation_flagged"

  - entity: DailyChecklist
    initial_state: DRAFT
    terminal_states: [COUNTERSIGNED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /midway/daily-checklists/{id}/submit"
        actor: RideOperator
        preconditions:
          - "checklist.status == DRAFT (ERR_CHECKLIST_INVALID_STATE)"
          - "caller X-User-ID == performed_by_staff_id (ERR_FORBIDDEN)"
          - "day posture == CHECKLIST_PHASE (ERR_INVALID_DAY_POSTURE)"
          - "caller certification still valid for ride.ride_class (ERR_CERTIFICATION_MISSING)"
        side_effects:
          - "items_passed recorded (must equal items_total — ERR_CHECKLIST_INCOMPLETE, business_safety)"
          - "increments DailyChecklist.version by 1"
      - from: SUBMITTED
        to: COUNTERSIGNED
        trigger: "POST /midway/daily-checklists/{id}/countersign"
        actor: FairManager
        preconditions:
          - "checklist.status == SUBMITTED (ERR_CHECKLIST_INVALID_STATE)"
          - "OCC: expected_checklist_version == checklist.version (ERR_STALE_CHECKLIST_VERSION, 412)"
          - "caller X-User-ID != performed_by_staff_id (ERR_CHECKLIST_COUNTERSIGNER_CONFLICT)"
        side_effects:
          - "countersigned_by_staff_id = caller"
          - "if day posture == OPEN and ride.license_status == LICENSED: ride.daily_status CLOSED -> OPEN (late clearance)"
          - "increments DailyChecklist.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /midway/daily-checklists/{id}/reject"
        actor: FairManager
        preconditions:
          - "checklist.status == SUBMITTED (ERR_CHECKLIST_INVALID_STATE)"
        side_effects:
          - "items_passed = null; countersigned_by_staff_id = null; rejection_reason recorded"
          - "increments DailyChecklist.version by 1"

  - entity: RideCycle
    initial_state: LOADING
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: LOADING
        to: RUNNING
        trigger: "POST /midway/ride-cycles/{id}/dispatch"
        actor: RideOperator
        preconditions:
          - "cycle.status == LOADING (ERR_CYCLE_INVALID_STATE)"
          - "caller X-User-ID == cycle.operator_staff_id (ERR_FORBIDDEN)"
          - "cycle.rider_count >= 1 (ERR_CYCLE_EMPTY)"
          - "ride.daily_status == OPEN (ERR_RIDE_NOT_OPEN)"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /midway/ride-cycles/{id}/complete"
        actor: RideOperator
        preconditions:
          - "cycle.status == RUNNING (ERR_CYCLE_INVALID_STATE)"
          - "caller X-User-ID == cycle.operator_staff_id (ERR_FORBIDDEN)"
        side_effects:
          - "ride.cycles_since_inspection += 1"
          - "if cycles_since_inspection >= ride.cycle_inspection_interval: ride.license_status LICENSED -> SUSPENDED; ride.daily_status OPEN|WEATHER_HOLD -> CLOSED; today's QUEUED redemptions for the ride -> VOIDED"
      - from: LOADING
        to: ABORTED
        trigger: "POST /midway/ride-cycles/{id}/abort"
        actor: RideOperator
        preconditions:
          - "cycle.status IN {LOADING, RUNNING} (ERR_CYCLE_INVALID_STATE)"
          - "caller X-User-ID == cycle.operator_staff_id (ERR_FORBIDDEN)"
        side_effects:
          - "compensation: every REDEEMED redemption on this cycle -> VOIDED; credit-bearing wristband credits_redeemed -= 1 and credits_remaining += 1 each; cycle.rider_count = 0"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /midway/ride-cycles/{id}/abort"
        actor: RideOperator
        preconditions:
          - "cycle.status IN {LOADING, RUNNING} (ERR_CYCLE_INVALID_STATE)"
          - "caller X-User-ID == cycle.operator_staff_id (ERR_FORBIDDEN)"
        side_effects:
          - "same compensation as LOADING -> ABORTED"

  - entity: RideRedemption
    initial_state: QUEUED
    terminal_states: [REDEEMED, VOIDED, EXPIRED]
    transitions:
      - from: QUEUED
        to: REDEEMED
        trigger: "system (POST /midway/ride-cycles/{id}/load — queue_boarding selection)"
        actor: system
        preconditions:
          - "cycle.rider_count < ride.capacity_per_cycle at selection time"
          - "credit-bearing wristband has credits_remaining >= 1, else the redemption is VOIDED (skip) and selection continues"
        side_effects:
          - "ride_cycle_id = cycle.id; credit-bearing wristband: credits_remaining -= 1, credits_redeemed += 1; cycle.rider_count += 1"
      - from: QUEUED
        to: VOIDED
        trigger: "POST /midway/ride-redemptions/{id}/void"
        actor: RideOperator | TicketClerk
        preconditions:
          - "redemption.status == QUEUED (ERR_REDEMPTION_NOT_VOIDABLE)"
        side_effects: []
      - from: REDEEMED
        to: VOIDED
        trigger: "POST /midway/ride-redemptions/{id}/void (cycle still LOADING)"
        actor: RideOperator | TicketClerk
        preconditions:
          - "redemption.status == REDEEMED and its cycle.status == LOADING (ERR_REDEMPTION_NOT_VOIDABLE)"
        side_effects:
          - "compensation: credit-bearing wristband credits_redeemed -= 1, credits_remaining += 1; cycle.rider_count -= 1"
      - from: QUEUED
        to: EXPIRED
        trigger: "system (POST /midway/operating-days/{id}/close-gates)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: VOIDED
        trigger: "system (license REVOKED/SUSPENDED-by-threshold cascades)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TicketSale
    initial_state: ACTIVE
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /midway/ticket-sales/{id}/void"
        actor: TicketClerk
        preconditions:
          - "sale.status == ACTIVE (ERR_SALE_NOT_ACTIVE)"
          - "day posture == OPEN (ERR_INVALID_DAY_POSTURE — same-day voids only)"
          - "no RideRedemption of this wristband has status == REDEEMED (ERR_SALE_HAS_REDEMPTIONS)"
        side_effects:
          - "compensation: this sale's QUEUED redemptions -> VOIDED; day.attendance_count -= 1; voided value returns to voided_cents at close-gates"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /midway/operating-days/{id}/close-gates)"
        actor: system
        preconditions: []
        side_effects:
          - "credit-bearing: credits_forfeited += credits_remaining; credits_remaining = 0"

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [CLEARED, SHUTDOWN_ORDERED]
    transitions:
      - from: FILED
        to: CLEARED
        trigger: "POST /midway/incident-reports/{id}/clear"
        actor: StateInspector
        preconditions:
          - "incident.status == FILED (ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "cleared_by_inspector_id = caller; cleared_at = current logical clock"
          - "if no other IncidentReport for (ride, day) is FILED or SHUTDOWN_ORDERED: ride.daily_status INCIDENT_HOLD -> CLOSED"
      - from: FILED
        to: SHUTDOWN_ORDERED
        trigger: "POST /midway/incident-reports/{id}/order-shutdown"
        actor: StateInspector
        preconditions:
          - "incident.status == FILED (ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "depth-3 cascade: ride.license_status LICENSED|SUSPENDED -> REVOKED (link 1) -> ride.daily_status -> CLOSED (link 2) -> today's QUEUED redemptions for the ride -> VOIDED (link 3)"

  - entity: CrewShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /midway/crew-shifts/{id}/confirm"
        actor: CrewMember
        preconditions:
          - "shift.status == SCHEDULED (ERR_SHIFT_INVALID_STATE)"
          - "caller X-User-ID == shift.staff_id (ERR_FORBIDDEN)"
          - "shift.work_date >= current date (ERR_SHIFT_OUT_OF_SEASON)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /midway/crew-shifts/{id}/complete"
        actor: FairManager
        preconditions:
          - "shift.status == CONFIRMED (ERR_SHIFT_INVALID_STATE)"
          - "shift.work_date <= current date (ERR_SHIFT_OUT_OF_SEASON)"
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /midway/crew-shifts/{id}/no-show"
        actor: FairManager
        preconditions:
          - "shift.status IN {SCHEDULED, CONFIRMED} (ERR_SHIFT_INVALID_STATE)"
          - "shift.work_date <= current date (ERR_SHIFT_OUT_OF_SEASON)"
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /midway/crew-shifts/{id}/no-show"
        actor: FairManager
        preconditions:
          - "shift.status IN {SCHEDULED, CONFIRMED} (ERR_SHIFT_INVALID_STATE)"
          - "shift.work_date <= current date (ERR_SHIFT_OUT_OF_SEASON)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /midway/crew-shifts/{id}/cancel or staff release cascade"
        actor: FairManager | system
        preconditions:
          - "shift.status IN {SCHEDULED, CONFIRMED} (ERR_SHIFT_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /midway/crew-shifts/{id}/cancel or staff release cascade"
        actor: FairManager | system
        preconditions:
          - "shift.status IN {SCHEDULED, CONFIRMED} (ERR_SHIFT_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: crew-shift-create-stale-staff
    parent_entity: StaffMember
    write_endpoint: "POST /midway/crew-shifts"
    occ_field: "expected_staff_version"
    description: |
      Creating a CrewShift against a StaffMember whose version has advanced
      since the client last observed it is rejected. Shift creation and the
      staff-release cascade both mutate the staff row (version bump), so a
      client holding a stale copy of the staff member would otherwise book
      against an out-of-date schedule.
    error_id: ERR_STALE_STAFF_VERSION
    http_status: 412
  - rule_id: permit-approve-stale-fair
    parent_entity: Fair
    write_endpoint: "POST /midway/permits/{id}/approve"
    occ_field: "expected_fair_version"
    description: |
      Approving a Permit against a Fair whose version has advanced since the
      client last observed it is rejected. Ride creation and the
      request-permit transition bump Fair.version, so an approver working
      from a stale fair snapshot would certify an out-of-date ride inventory.
    error_id: ERR_STALE_FAIR_VERSION
    http_status: 412
  - rule_id: checklist-countersign-stale-checklist
    parent_entity: DailyChecklist
    write_endpoint: "POST /midway/daily-checklists/{id}/countersign"
    occ_field: "expected_checklist_version"
    description: |
      Countersigning a DailyChecklist whose version has advanced since the
      countersigner last observed it is rejected. Submit and reject bump the
      checklist version, so a countersigner reviewing a stale copy would
      attest items_passed values that have since been edited.
    error_id: ERR_STALE_CHECKLIST_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee
    trigger: "estimated variant at POST /midway/fairs/{id}/request-permit; final variant at POST /midway/permits/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      qualifying_rides = rides of fair with setup_status == SETUP_VERIFIED (any license_status) at evaluation time
      subtotal = BASE_FEE_CENTS + sum(CLASS_RATE_CENTS[r.ride_class] for r in qualifying_rides)
      failures = count of the fair's FAIR_WIDE InspectionAppointments with status == COMPLETED_FAIL
      fee = subtotal + REINSPECTION_SURCHARGE_CENTS * failures
      fee = min(fee, MAX_FEE_CENTS)            # cap applied LAST, after surcharges
    input_set: "rides filtered by setup_status == SETUP_VERIFIED only (INSTALLED and DISMANTLED excluded); appointments filtered by scope == FAIR_WIDE and status == COMPLETED_FAIL"
    constants:
      BASE_FEE_CENTS: 25000
      REINSPECTION_SURCHARGE_CENTS: 7500
      MAX_FEE_CENTS: 200000
      CLASS_RATE_CENTS: { KIDDIE: 5000, FAMILY: 9000, THRILL: 14000, EXTREME: 20000 }
    precision: "integer cents; no rounding"
    variants:
      - name: estimated
        when: "permit request time (fair SETUP -> PERMIT_REQUESTED)"
        difference: "evaluated over the qualifying ride set at request time with failures fixed at 0; stored in estimated_fee_cents and never recomputed"
      - name: final
        when: "permit approval time"
        difference: "re-evaluated over the qualifying ride set at approval time with the actual COMPLETED_FAIL count; stored in final_fee_cents"

  - name: credit_bundle_subtotal
    trigger: "POST /midway/ticket-sales for product kind == CREDIT_BUNDLE"
    algorithm: tiered_pricing
    formula: |
      P = product.base_price_cents; q = quantity
      tier1_count = min(q, 9)
      tier2_count = min(max(q - 9, 0), 15)
      tier3_count = max(q - 24, 0)
      tier1_unit = P
      tier2_unit = round_half_up(P * 0.90)     # per-unit price rounded BEFORE multiplying
      tier3_unit = round_half_up(P * 0.80)
      subtotal_cents = tier1_count * tier1_unit + tier2_count * tier2_unit + tier3_count * tier3_unit
    input_set: "single CREDIT_BUNDLE sale; marginal (progressive) tier allocation, NOT average-rate"
    constants:
      TIER1_MAX: 9
      TIER2_MAX: 24
      TIER2_DISCOUNT: 0.10
      TIER3_DISCOUNT: 0.20
    precision: "integer cents; round_half_up applied per discounted unit BEFORE multiplying by the tier count; tier line subtotals are then summed (never sum-then-round)"
    variants: []

  - name: sale_total_with_service_fee
    trigger: "POST /midway/ticket-sales for every product kind"
    algorithm: constraint_propagation
    formula: |
      subtotal = credit_bundle_subtotal(quantity)            # CREDIT_BUNDLE
               | product.base_price_cents * quantity          # RIDE_TICKET
               | product.base_price_cents                     # WRISTBAND (quantity pinned to 1)
      service_fee_cents = max(SERVICE_FEE_MIN_CENTS, round_half_up(subtotal * SERVICE_FEE_PCT))
      total_charged_cents = subtotal + service_fee_cents
      # evaluation order is pinned: the fee is computed on the PRE-FEE subtotal.
      # Defining the fee on the grand total would be circular; the pre-fee order is the rule.
    input_set: "single sale"
    constants:
      SERVICE_FEE_PCT: 0.06
      SERVICE_FEE_MIN_CENTS: 50
    precision: "integer cents; round_half_up"
    variants: []

  - name: daily_settlement
    trigger: "projected variant at POST /midway/operating-days/{id}/close-gates; recognized variant at POST /midway/operating-days/{id}/reconcile"
    algorithm: aggregation
    formula: |
      # forward_looking variant (at close-gates):
      gross_sales_cents       = sum(total_charged_cents) over ALL sales of the day (incl. VOIDED)
      voided_cents            = sum(total_charged_cents) over sales with status == VOIDED
      projected_revenue_cents = gross_sales_cents - voided_cents
      # chronological variant (at reconcile), sales processed in created_at ASC order:
      recognized_revenue_cents = 0
      for sale in day.sales order by created_at ASC:
        if sale.status == VOIDED: contribute 0
        elif sale.is_unlimited: contribute sale.total_charged_cents            # wristband recognized in full at sale
        else: contribute sale.service_fee_cents + round_half_up(sale.subtotal_cents * sale.credits_redeemed / sale.credits_granted)
      breakage_cents = projected_revenue_cents - recognized_revenue_cents
      reconciliation_flagged = breakage_cents > RECONCILIATION_FLAG_THRESHOLD_CENTS
    input_set: "all TicketSales with operating_day_id == day.id; VOIDED contribute 0 to both variants (their totals remain visible in gross/voided); EXPIRED sales contribute with their final credits_redeemed"
    constants:
      RECONCILIATION_FLAG_THRESHOLD_CENTS: 1000
    precision: "integer cents; per-sale pro-rata round_half_up before summing"
    variants:
      - name: projected
        when: "close-gates"
        difference: "recognizes every non-voided sale at full face value regardless of redemption progress"
      - name: recognized
        when: "reconcile"
        difference: "recognizes credit-bearing subtotal pro-rata by credits_redeemed / credits_granted (per-sale round_half_up) plus the full service fee; unredeemed/forfeited credit value surfaces as breakage_cents"

  - name: inspector_assignment
    trigger: "POST /midway/inspection-appointments"
    algorithm: weighted_scoring
    formula: |
      eligible = inspectors where active == true
        AND count(their appointments on scheduled_date with status IN {SCHEDULED, COMPLETED_PASS, COMPLETED_FAIL}) < max_daily_inspections
        AND no appointment on scheduled_date with status IN {SCHEDULED, COMPLETED_PASS, COMPLETED_FAIL}
            violates the travel buffer: conflict iff NOT (new_end + BUFFER <= ex.start_hour OR ex.end_hour + BUFFER <= new_start)
            where new_end = start_hour + duration_hours
      rank eligible by: (same-date appointment count ASC, inspector.created_at ASC)
      assign inspector_id = first of the ranked list; empty pool -> ERR_INSPECTOR_UNAVAILABLE
    input_set: "all Inspectors; same-date appointments in non-terminal-and-non-cancelled statuses {SCHEDULED, COMPLETED_PASS, COMPLETED_FAIL} (CANCELLED frees the slot)"
    constants:
      TRAVEL_BUFFER_HOURS: 2
    precision: "integer hours"
    variants: []

  - name: queue_boarding
    trigger: "POST /midway/ride-cycles/{id}/load"
    algorithm: chronological
    formula: |
      candidates = redemptions with ride_id == cycle.ride_id, operating_day_id == cycle.operating_day_id, status == QUEUED
      process in queue_position ASC order (per-(ride,day) ordinal assigned at creation; no ties possible):
        stop when cycle.rider_count >= ride.capacity_per_cycle (remaining candidates stay QUEUED)
        if wristband.is_unlimited: board without credit movement
        elif wristband.credits_remaining >= 1: board (credits_remaining -= 1, credits_redeemed += 1)
        else: redemption -> VOIDED (skipped; does not consume a seat) and continue
      boarding: redemption.status = REDEEMED, ride_cycle_id = cycle.id, cycle.rider_count += 1
      empty candidate pool is NOT an error; the call succeeds with rider_count unchanged
    input_set: "QUEUED redemptions only, exactly matching the cycle's (ride_id, operating_day_id)"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: wind_shutdown_sweep
    trigger: "POST /midway/weather-observations"
    algorithm: threshold
    formula: |
      W = observation.wind_speed_mph
      ride hold rule: every ride of the day's fair with daily_status == OPEN and W >= ride.wind_limit_mph -> WEATHER_HOLD
      fair closure rule: if W >= FAIR_WIND_CLOSURE_MPH and day posture == OPEN: day -> WEATHER_HOLD AND every OPEN ride -> WEATHER_HOLD (ignores per-ride limits)
      ride resume rule (POST /midway/rides/{id}/resume from WEATHER_HOLD): latest observation of the day (max created_at) must satisfy wind <= ride.wind_limit_mph - RIDE_RESUME_HYSTERESIS_MPH
      day resume rule (POST /midway/operating-days/{id}/resume-day): latest observation must satisfy wind <= FAIR_WIND_RESUME_MPH
      boundary pins: hold triggers at W == limit (>=); resume requires strictly below limit - 2, i.e. wind <= limit - 3 for integer mph
    input_set: "rides with daily_status == OPEN only (CLOSED/WEATHER_HOLD/INCIDENT_HOLD rides unaffected); observations scoped to the day"
    constants:
      FAIR_WIND_CLOSURE_MPH: 45
      FAIR_WIND_RESUME_MPH: 39
      RIDE_RESUME_HYSTERESIS_MPH: 3
    precision: "integer mph"
    variants: []

  - name: minor_incident_escalation
    trigger: "POST /midway/incident-reports with severity == MINOR"
    algorithm: threshold
    formula: |
      ride.minor_incidents_today += 1
      if ride.minor_incidents_today >= MINOR_INCIDENT_DAILY_THRESHOLD and ride.daily_status IN {OPEN, WEATHER_HOLD}:
        ride.daily_status -> INCIDENT_HOLD        # license untouched — resumable same day after clearance
      reset: begin-checklists sets minor_incidents_today = 0 for every ride of the fair
      severity ladder (at filing): NEAR_MISS -> counter only untouched; MINOR -> counter + conditional hold;
        SERIOUS -> license SUSPENDED + INCIDENT_HOLD; FATAL -> license REVOKED + daily CLOSED + queued redemptions VOIDED
    input_set: "the single ride the incident is filed against; counter is per current operating date"
    constants:
      MINOR_INCIDENT_DAILY_THRESHOLD: 3
    precision: "integer count; triggers at exactly == 3 (>=), so the 2nd MINOR does nothing and the 3rd holds"
    variants: []
# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed scoping: StaffMember-backed callers (FairManager=SUPERVISOR, RideOperator=OPERATOR, TicketClerk=CLERK, CrewMember=CREW) must resolve to an ACTIVE StaffMember carrying the role's function whose fair_id matches the fair of the endpoint's PRIMARY resource (the resource addressed by the path; for collection creates, the fair named by fair_id or implied by the ride/product FK); cross-resource fair consistency between two referenced resources (e.g. wristband vs ride) is NOT decided here but at the referential tier via ERR_CROSS_FAIR_REFERENCE; StateInspector callers must resolve to an active Inspector; StateProgramAdmin is opaque (no entity check)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints with entity-backed roles"
  - priority: 4
    category: existence
    check: "Path identifiers resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, types and enum membership valid, numeric ranges honored (hours, heights, quantities, capacities), fair date ordering setup_start_date <= opening_date <= closing_date <= teardown_end_date, WRISTBAND quantity == 1, ride_id present iff scope == RIDE_AUDIT, SERIOUS/FATAL injury_count >= 1, unknown or computed fields in the body rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: existence
    check: "Body foreign keys resolve (fair_id, ride_id, operating_day_id, product_id, wristband_id, staff_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK inputs"
  - priority: 7
    category: state
    check: "Target-resource state preconditions per state machine (fair status — including ride create requiring SETUP/PERMIT_REQUESTED/PERMITTED and appointment create requiring PERMIT_REQUESTED/PERMITTED — permit PENDING, day posture, ride setup/license/daily, checklist status, cycle status, sale ACTIVE, redemption QUEUED/REDEEMED, shift status, appointment SCHEDULED, incident FILED, certification ACTIVE, staff ACTIVE)"
    error_id: "ERR_FAIR_INVALID_STATE | ERR_PERMIT_INVALID_STATE | ERR_INVALID_DAY_POSTURE | ERR_RIDE_INVALID_STATE | ERR_RIDE_NOT_OPEN | ERR_RIDE_NOT_LICENSED | ERR_CHECKLIST_INVALID_STATE | ERR_CYCLE_INVALID_STATE | ERR_SALE_NOT_ACTIVE | ERR_REDEMPTION_NOT_VOIDABLE | ERR_SHIFT_INVALID_STATE | ERR_APPOINTMENT_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_CERT_INVALID_STATE | ERR_STAFF_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Safety/compliance rules: rider height within ride [min,max]; checklist items_passed == items_total; operator certification valid for ride class (ACTIVE, unexpired, staff ACTIVE); annual cert covers the season at verify-assembly; wind resume guards; permit approver != conducting inspector; checklist countersigner != performer; passed fair-wide inspection precedes approval"
    error_id: "ERR_HEIGHT_RESTRICTION | ERR_CHECKLIST_INCOMPLETE | ERR_CERTIFICATION_MISSING | ERR_ANNUAL_CERT_EXPIRED | ERR_WIND_ABOVE_LIMIT | ERR_PERMIT_APPROVER_CONFLICT | ERR_CHECKLIST_COUNTERSIGNER_CONFLICT | ERR_INSPECTION_REQUIRED"
    http_status: 422
    applies_to: "redemption create, checklist create/submit/countersign, ride verify-assembly/resume, day resume-day, permit approve/deny"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and resource conflicts: inspector license_number unique; OperatingDay unique per (fair, date); DailyChecklist unique per (ride, day); crew-shift half-open overlap per staff per date; no second LOADING/RUNNING cycle per ride"
    error_id: "ERR_INSPECTOR_LICENSE_EXISTS | ERR_DUPLICATE_OPERATING_DAY | ERR_DUPLICATE_CHECKLIST | ERR_STAFF_SHIFT_OVERLAP | ERR_CYCLE_IN_PROGRESS"
    http_status: 409
    applies_to: "inspector create, day create, checklist create, crew-shift create, cycle create"
  - priority: 10
    category: business_constraint
    check: "Remaining constraint satisfaction: at least one SETUP_VERIFIED ride before permit request; inspector buffer/daily-cap eligibility (empty pool); max_attendance <= midway_capacity; covering crew shift for assembly/teardown; product active"
    error_id: "ERR_NO_VERIFIED_RIDES | ERR_INSPECTOR_UNAVAILABLE | ERR_CAPACITY_ABOVE_MIDWAY | ERR_NO_COVERING_SHIFT | ERR_PRODUCT_INACTIVE"
    http_status: 422
    applies_to: "permit request, appointment create, day create, ride verify-assembly/dismantle, sale create"
  - priority: 11
    category: business_temporal
    check: "Clock-gated rules: begin-checklists requires day.date == current date; crew work_date >= current date and inside the shift_role season window; appointment scheduled_date inside [current date, teardown_end_date] and completion not before the scheduled date"
    error_id: "ERR_DAY_NOT_TODAY | ERR_SHIFT_OUT_OF_SEASON | ERR_APPOINTMENT_WINDOW_INVALID | ERR_APPOINTMENT_NOT_DUE"
    http_status: 422
    applies_to: "begin-checklists, crew-shift create/confirm/complete/no-show, appointment create/complete"
  - priority: 12
    category: business_fiscal
    check: "Fiscal gates, last among business rules: credit-bearing wristband credits_remaining >= 1 at redemption creation; day attendance_count < max_attendance at sale creation"
    error_id: "ERR_INSUFFICIENT_CREDITS | ERR_DAY_AT_CAPACITY"
    http_status: 422
    applies_to: "redemption create, ticket-sale create"
  - priority: 13
    category: business_referential
    check: "Cross-aggregate integrity: archive requires every ride DISMANTLED; begin-teardown requires no day in CHECKLIST_PHASE/OPEN/WEATHER_HOLD/CLOSED; sale void requires zero REDEEMED redemptions; wristband and ride must belong to the same fair; incident-held ride resume requires no FILED/SHUTDOWN_ORDERED incidents for (ride, day)"
    error_id: "ERR_RIDES_NOT_DISMANTLED | ERR_DAYS_STILL_ACTIVE | ERR_SALE_HAS_REDEMPTIONS | ERR_CROSS_FAIR_REFERENCE | ERR_INCIDENTS_OPEN"
    http_status: 422
    applies_to: "fair archive/begin-teardown, sale void, redemption create, ride resume"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Fairs ---
  - { method: POST, path: "/midway/fairs", description: "Register a midway engagement (status SETUP)", roles: [StateProgramAdmin], code: 201, input: [name, operator_company_name, location, setup_start_date, opening_date, closing_date, teardown_end_date, midway_capacity], output: Fair, side_effects: [] }
  - { method: GET, path: "/midway/fairs/{id}", description: "Read one fair", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: Fair, side_effects: [] }
  - { method: GET, path: "/midway/fairs", description: "List fairs", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["status?", "limit?", "offset?"], output: "Fair[]", side_effects: [] }
  - { method: POST, path: "/midway/fairs/{id}/request-permit", description: "Open a PENDING permit with the estimated fee; SETUP -> PERMIT_REQUESTED", roles: [FairManager], code: 201, input: [], output: Permit, side_effects: ["permit_fee estimated variant", "Fair.status -> PERMIT_REQUESTED", "increments Fair.version by 1"] }
  - { method: POST, path: "/midway/fairs/{id}/begin-teardown", description: "PERMITTED -> TEARDOWN once no day is active and the season has ended", roles: [FairManager], code: 200, input: [], output: Fair, side_effects: ["Fair.status -> TEARDOWN", "increments Fair.version by 1"] }
  - { method: POST, path: "/midway/fairs/{id}/archive", description: "TEARDOWN -> ARCHIVED once all rides are DISMANTLED", roles: [FairManager], code: 200, input: [], output: Fair, side_effects: ["Fair.status -> ARCHIVED", "increments Fair.version by 1"] }
  # --- Rides ---
  - { method: POST, path: "/midway/rides", description: "Register a ride in the fair inventory (INSTALLED/PENDING/CLOSED)", roles: [FairManager], code: 201, input: [fair_id, name, manufacturer, model, serial_number, ride_class, capacity_per_cycle, min_rider_height_in, max_rider_height_in, wind_limit_mph, cycle_inspection_interval, annual_cert_expires_on], output: Ride, side_effects: ["increments Fair.version by 1 (inventory ledger sync)"] }
  - { method: GET, path: "/midway/rides/{id}", description: "Read one ride", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: Ride, side_effects: [] }
  - { method: GET, path: "/midway/rides", description: "List/filter rides (FK reverse lookup from Fair)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["fair_id?", "setup_status?", "license_status?", "daily_status?", "limit?", "offset?"], output: "Ride[]", side_effects: [] }
  - { method: POST, path: "/midway/rides/{id}/verify-assembly", description: "Setup crew verifies assembly; INSTALLED -> SETUP_VERIFIED; requires covering SETUP shift today", roles: [CrewMember], code: 200, input: [], output: Ride, side_effects: ["Ride.setup_status -> SETUP_VERIFIED", "increments Ride.version by 1"] }
  - { method: POST, path: "/midway/rides/{id}/dismantle", description: "Teardown crew dismantles; SETUP_VERIFIED -> DISMANTLED and license REVOKED; requires covering TEARDOWN shift today", roles: [CrewMember], code: 200, input: [], output: Ride, side_effects: ["Ride.setup_status -> DISMANTLED", "license_status -> REVOKED", "increments Ride.version by 1"] }
  - { method: POST, path: "/midway/rides/{id}/resume", description: "Reopen a ride from WEATHER_HOLD or INCIDENT_HOLD with per-hold guards", roles: [FairManager], code: 200, input: [], output: Ride, side_effects: ["Ride.daily_status -> OPEN", "increments Ride.version by 1"] }
  # --- Inspectors ---
  - { method: POST, path: "/midway/inspectors", description: "Register a state inspector", roles: [StateProgramAdmin], code: 201, input: [full_name, license_number, "max_daily_inspections?"], output: Inspector, side_effects: [] }
  - { method: GET, path: "/midway/inspectors/{id}", description: "Read one inspector", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: Inspector, side_effects: [] }
  - { method: GET, path: "/midway/inspectors", description: "List/filter inspectors", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["active?", "limit?", "offset?"], output: "Inspector[]", side_effects: [] }
  - { method: POST, path: "/midway/inspectors/{id}/deactivate", description: "Deactivate an inspector (ineligible for new assignments; existing appointments unaffected)", roles: [StateProgramAdmin], code: 200, input: [], output: Inspector, side_effects: ["Inspector.active -> false"] }
  # --- Inspection appointments ---
  - { method: POST, path: "/midway/inspection-appointments", description: "Schedule an inspection; server auto-assigns an inspector per inspector_assignment (buffer + daily cap)", roles: [FairManager], code: 201, input: [fair_id, scope, "ride_id?", scheduled_date, start_hour, duration_hours], output: InspectionAppointment, side_effects: ["inspector_assignment selector sets inspector_id"] }
  - { method: GET, path: "/midway/inspection-appointments/{id}", description: "Read one appointment", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: InspectionAppointment, side_effects: [] }
  - { method: GET, path: "/midway/inspection-appointments", description: "List/filter appointments (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["fair_id?", "inspector_id?", "ride_id?", "scheduled_date?", "status?", "limit?", "offset?"], output: "InspectionAppointment[]", side_effects: [] }
  - { method: POST, path: "/midway/inspection-appointments/{id}/complete", description: "Assigned inspector records PASS/FAIL; RIDE_AUDIT PASS resets cycle counter and re-licenses", roles: [StateInspector], code: 200, input: [outcome, "findings?"], output: InspectionAppointment, side_effects: ["status -> COMPLETED_PASS|COMPLETED_FAIL", "RIDE_AUDIT PASS: ride.cycles_since_inspection = 0, license_status PENDING|SUSPENDED -> LICENSED"] }
  - { method: POST, path: "/midway/inspection-appointments/{id}/cancel", description: "Fair manager cancels a SCHEDULED appointment (frees inspector capacity)", roles: [FairManager], code: 200, input: [], output: InspectionAppointment, side_effects: ["status -> CANCELLED"] }
  # --- Permits ---
  - { method: GET, path: "/midway/permits/{id}", description: "Read one permit (estimated vs final fee fields)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: GET, path: "/midway/permits", description: "List/filter permits (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["fair_id?", "status?", "approved_by_inspector_id?", "limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/midway/permits/{id}/approve", description: "Approve a PENDING permit with SoD + OCC on Fair.version; computes final fee and licenses verified rides", roles: [StateInspector], code: 200, input: [expected_fair_version], output: Permit, side_effects: ["permit_fee final variant", "Permit.status -> APPROVED", "Fair PERMIT_REQUESTED -> PERMITTED", "all SETUP_VERIFIED rides license_status -> LICENSED", "increments Fair.version by 1"] }
  - { method: POST, path: "/midway/permits/{id}/deny", description: "Deny a PENDING permit; fair loops back to SETUP", roles: [StateInspector], code: 200, input: [reason], output: Permit, side_effects: ["Permit.status -> DENIED", "Fair PERMIT_REQUESTED -> SETUP", "increments Fair.version by 1"] }
  # --- Staff ---
  - { method: POST, path: "/midway/staff", description: "Hire a staff member into a fair (StateProgramAdmin seeds the first SUPERVISOR; FairManager hires the rest)", roles: [StateProgramAdmin, FairManager], code: 201, input: [fair_id, full_name, functions], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/midway/staff/{id}", description: "Read one staff member", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/midway/staff", description: "List/filter staff (FK reverse lookup from Fair)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["fair_id?", "status?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: POST, path: "/midway/staff/{id}/release", description: "Release staff; compensates by cancelling their future SCHEDULED/CONFIRMED shifts", roles: [FairManager], code: 200, input: [], output: StaffMember, side_effects: ["StaffMember.status -> RELEASED", "future CrewShifts -> CANCELLED"] }
  # --- Operator certifications ---
  - { method: POST, path: "/midway/operator-certifications", description: "State issues a ride-class certification to an OPERATOR staff member", roles: [StateProgramAdmin], code: 201, input: [staff_id, ride_class, issued_on, expires_on], output: OperatorCertification, side_effects: [] }
  - { method: GET, path: "/midway/operator-certifications/{id}", description: "Read one certification", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: OperatorCertification, side_effects: [] }
  - { method: GET, path: "/midway/operator-certifications", description: "List/filter certifications (FK reverse lookup from StaffMember)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["staff_id?", "ride_class?", "status?", "limit?", "offset?"], output: "OperatorCertification[]", side_effects: [] }
  - { method: POST, path: "/midway/operator-certifications/{id}/revoke", description: "Revoke a certification", roles: [StateProgramAdmin, StateInspector], code: 200, input: [], output: OperatorCertification, side_effects: ["status -> REVOKED"] }
  # --- Operating days ---
  - { method: POST, path: "/midway/operating-days", description: "Schedule an operating day (requires fair PERMITTED)", roles: [FairManager], code: 201, input: [fair_id, date, max_attendance], output: OperatingDay, side_effects: [] }
  - { method: GET, path: "/midway/operating-days/{id}", description: "Read one operating day (settlement fields)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: OperatingDay, side_effects: [] }
  - { method: GET, path: "/midway/operating-days", description: "List/filter operating days (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["fair_id?", "posture?", "date?", "limit?", "offset?"], output: "OperatingDay[]", side_effects: [] }
  - { method: POST, path: "/midway/operating-days/{id}/begin-checklists", description: "SCHEDULED -> CHECKLIST_PHASE on the day's date; resets minor-incident counters", roles: [FairManager], code: 200, input: [], output: OperatingDay, side_effects: ["posture -> CHECKLIST_PHASE", "rides' minor_incidents_today = 0"] }
  - { method: POST, path: "/midway/operating-days/{id}/open-gates", description: "CHECKLIST_PHASE -> OPEN; compound gate: every licensed verified ride needs a COUNTERSIGNED checklist", roles: [FairManager], code: 200, input: [], output: OperatingDay, side_effects: ["posture -> OPEN", "cleared rides daily_status -> OPEN"] }
  - { method: POST, path: "/midway/operating-days/{id}/resume-day", description: "WEATHER_HOLD -> OPEN when latest wind <= 39", roles: [FairManager], code: 200, input: [], output: OperatingDay, side_effects: ["posture -> OPEN"] }
  - { method: POST, path: "/midway/operating-days/{id}/close-gates", description: "OPEN|WEATHER_HOLD -> CLOSED; closes rides, expires queued redemptions and active credits, computes projected settlement", roles: [FairManager], code: 200, input: [], output: OperatingDay, side_effects: ["posture -> CLOSED", "rides daily_status -> CLOSED", "QUEUED redemptions -> EXPIRED", "ACTIVE credit sales -> EXPIRED with forfeiture", "daily_settlement projected variant"] }
  - { method: POST, path: "/midway/operating-days/{id}/reconcile", description: "CLOSED -> RECONCILED; computes recognized revenue and breakage", roles: [FairManager], code: 200, input: [], output: OperatingDay, side_effects: ["posture -> RECONCILED", "daily_settlement recognized variant", "breakage_cents", "reconciliation_flagged"] }
  # --- Daily checklists ---
  - { method: POST, path: "/midway/daily-checklists", description: "Operator opens the pre-opening checklist for a ride/day (unique per ride+day)", roles: [RideOperator], code: 201, input: [ride_id, operating_day_id, items_total], output: DailyChecklist, side_effects: [] }
  - { method: GET, path: "/midway/daily-checklists/{id}", description: "Read one checklist", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: DailyChecklist, side_effects: [] }
  - { method: GET, path: "/midway/daily-checklists", description: "List/filter checklists (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["ride_id?", "operating_day_id?", "performed_by_staff_id?", "countersigned_by_staff_id?", "status?", "limit?", "offset?"], output: "DailyChecklist[]", side_effects: [] }
  - { method: POST, path: "/midway/daily-checklists/{id}/submit", description: "Performer submits completed items (DRAFT -> SUBMITTED; all items must pass)", roles: [RideOperator], code: 200, input: [items_passed], output: DailyChecklist, side_effects: ["status -> SUBMITTED", "increments DailyChecklist.version by 1"] }
  - { method: POST, path: "/midway/daily-checklists/{id}/countersign", description: "Supervisor countersigns with OCC on checklist version; SoD vs performer; SUBMITTED -> COUNTERSIGNED", roles: [FairManager], code: 200, input: [expected_checklist_version], output: DailyChecklist, side_effects: ["status -> COUNTERSIGNED", "late clearance may open the ride if day is OPEN", "increments DailyChecklist.version by 1"] }
  - { method: POST, path: "/midway/daily-checklists/{id}/reject", description: "Supervisor rejects a submission back to DRAFT (revision loop)", roles: [FairManager], code: 200, input: [reason], output: DailyChecklist, side_effects: ["status -> DRAFT", "items_passed/countersigner reset", "increments DailyChecklist.version by 1"] }
  # --- Ride cycles ---
  - { method: POST, path: "/midway/ride-cycles", description: "Open a LOADING cycle for a ride/day (one active cycle per ride; operator must be certified for the class)", roles: [RideOperator], code: 201, input: [ride_id, operating_day_id], output: RideCycle, side_effects: ["sequence_number assigned per ride+day"] }
  - { method: GET, path: "/midway/ride-cycles/{id}", description: "Read one cycle", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: RideCycle, side_effects: [] }
  - { method: GET, path: "/midway/ride-cycles", description: "List/filter cycles (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["ride_id?", "operating_day_id?", "operator_staff_id?", "status?", "limit?", "offset?"], output: "RideCycle[]", side_effects: [] }
  - { method: POST, path: "/midway/ride-cycles/{id}/load", description: "Board QUEUED redemptions FIFO by queue_position up to capacity; insufficient-credit entries void and skip", roles: [RideOperator], code: 200, input: [], output: RideCycle, side_effects: ["queue_boarding selection", "credit debits at boarding", "rider_count updated"] }
  - { method: POST, path: "/midway/ride-cycles/{id}/dispatch", description: "LOADING -> RUNNING; requires rider_count >= 1 and ride still OPEN", roles: [RideOperator], code: 200, input: [], output: RideCycle, side_effects: ["status -> RUNNING"] }
  - { method: POST, path: "/midway/ride-cycles/{id}/complete", description: "RUNNING -> COMPLETED; increments cycle counter and may trigger the suspension cascade at the manufacturer interval", roles: [RideOperator], code: 200, input: [], output: RideCycle, side_effects: ["status -> COMPLETED", "ride.cycles_since_inspection += 1", "threshold cascade at >= cycle_inspection_interval"] }
  - { method: POST, path: "/midway/ride-cycles/{id}/abort", description: "LOADING|RUNNING -> ABORTED; refunds all boarded credits and zeroes rider_count", roles: [RideOperator], code: 200, input: [], output: RideCycle, side_effects: ["status -> ABORTED", "REDEEMED redemptions -> VOIDED with credit refund", "rider_count = 0"] }
  # --- Ride redemptions (queue + restriction enforcement) ---
  - { method: POST, path: "/midway/ride-redemptions", description: "Present a wristband at a ride: creates a QUEUED redemption after height/credit/state gates", roles: [RideOperator], code: 201, input: [wristband_id, ride_id], output: RideRedemption, side_effects: ["queue_position assigned per ride+day"] }
  - { method: GET, path: "/midway/ride-redemptions/{id}", description: "Read one redemption", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: RideRedemption, side_effects: [] }
  - { method: GET, path: "/midway/ride-redemptions", description: "List/filter redemptions (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["wristband_id?", "ride_id?", "operating_day_id?", "ride_cycle_id?", "status?", "limit?", "offset?"], output: "RideRedemption[]", side_effects: [] }
  - { method: POST, path: "/midway/ride-redemptions/{id}/void", description: "Void a QUEUED redemption, or a REDEEMED one whose cycle is still LOADING (credit refund)", roles: [RideOperator, TicketClerk], code: 200, input: [], output: RideRedemption, side_effects: ["status -> VOIDED", "compensating credit refund when REDEEMED"] }
  # --- Ticket products ---
  - { method: POST, path: "/midway/ticket-products", description: "Configure a sellable product", roles: [FairManager], code: 201, input: [fair_id, name, kind, base_price_cents], output: TicketProduct, side_effects: [] }
  - { method: GET, path: "/midway/ticket-products/{id}", description: "Read one product", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: TicketProduct, side_effects: [] }
  - { method: GET, path: "/midway/ticket-products", description: "List/filter products (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["fair_id?", "kind?", "active?", "limit?", "offset?"], output: "TicketProduct[]", side_effects: [] }
  - { method: POST, path: "/midway/ticket-products/{id}/deactivate", description: "Take a product off sale", roles: [FairManager], code: 200, input: [], output: TicketProduct, side_effects: ["active -> false"] }
  # --- Ticket sales ---
  - { method: POST, path: "/midway/ticket-sales", description: "Sell one guest instrument (ticket/credit bundle/wristband) with tiered pricing and service fee; gates on day capacity", roles: [TicketClerk], code: 201, input: [product_id, operating_day_id, quantity, holder_height_in], output: TicketSale, side_effects: ["credit_bundle_subtotal + sale_total_with_service_fee", "day.attendance_count += 1"] }
  - { method: GET, path: "/midway/ticket-sales/{id}", description: "Read one sale (credit counters and computed price fields)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: TicketSale, side_effects: [] }
  - { method: GET, path: "/midway/ticket-sales", description: "List/filter sales (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["operating_day_id?", "product_id?", "clerk_staff_id?", "status?", "limit?", "offset?"], output: "TicketSale[]", side_effects: [] }
  - { method: POST, path: "/midway/ticket-sales/{id}/void", description: "Same-day void while gates are OPEN and no boarded redemptions exist", roles: [TicketClerk], code: 200, input: [], output: TicketSale, side_effects: ["status -> VOIDED", "QUEUED redemptions -> VOIDED", "day.attendance_count -= 1"] }
  # --- Weather ---
  - { method: POST, path: "/midway/weather-observations", description: "Record a wind reading; triggers per-ride holds and the fair-wide closure sweep (append-only)", roles: [FairManager, RideOperator], code: 201, input: [operating_day_id, wind_speed_mph, "note?"], output: WeatherObservation, side_effects: ["wind_shutdown_sweep"] }
  - { method: GET, path: "/midway/weather-observations/{id}", description: "Read one observation", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: WeatherObservation, side_effects: [] }
  - { method: GET, path: "/midway/weather-observations", description: "List observations (FK reverse lookup from OperatingDay)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["operating_day_id?", "limit?", "offset?"], output: "WeatherObservation[]", side_effects: [] }
  # --- Incidents ---
  - { method: POST, path: "/midway/incident-reports", description: "File an incident; severity drives hold/suspend/revoke cascades and the 3-minor-day threshold", roles: [FairManager, RideOperator], code: 201, input: [ride_id, operating_day_id, severity, injury_count, description], output: IncidentReport, side_effects: ["minor_incident_escalation", "SERIOUS: license SUSPENDED + INCIDENT_HOLD", "FATAL: license REVOKED + daily CLOSED + queued voided"] }
  - { method: GET, path: "/midway/incident-reports/{id}", description: "Read one incident", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: IncidentReport, side_effects: [] }
  - { method: GET, path: "/midway/incident-reports", description: "List/filter incidents (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["ride_id?", "operating_day_id?", "reporter_staff_id?", "cleared_by_inspector_id?", "severity?", "status?", "limit?", "offset?"], output: "IncidentReport[]", side_effects: [] }
  - { method: POST, path: "/midway/incident-reports/{id}/clear", description: "Inspector clears a FILED incident; ride leaves INCIDENT_HOLD when no open incident remains", roles: [StateInspector], code: 200, input: [], output: IncidentReport, side_effects: ["status -> CLEARED", "conditional ride daily_status -> CLOSED"] }
  - { method: POST, path: "/midway/incident-reports/{id}/order-shutdown", description: "Inspector orders a shutdown: license REVOKED, ride closed, queued redemptions voided", roles: [StateInspector], code: 200, input: [], output: IncidentReport, side_effects: ["status -> SHUTDOWN_ORDERED", "license REVOKED cascade"] }
  # --- Crew shifts ---
  - { method: POST, path: "/midway/crew-shifts", description: "Schedule a crew shift with OCC on StaffMember.version; half-open overlap and season-window checks", roles: [FairManager], code: 201, input: [staff_id, work_date, start_hour, end_hour, shift_role, expected_staff_version], output: CrewShift, side_effects: ["increments StaffMember.version by 1"] }
  - { method: GET, path: "/midway/crew-shifts/{id}", description: "Read one crew shift", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: [], output: CrewShift, side_effects: [] }
  - { method: GET, path: "/midway/crew-shifts", description: "List/filter crew shifts (FK reverse lookup)", roles: [StateProgramAdmin, StateInspector, FairManager, RideOperator, TicketClerk, CrewMember], code: 200, input: ["staff_id?", "fair_id?", "work_date?", "shift_role?", "status?", "limit?", "offset?"], output: "CrewShift[]", side_effects: [] }
  - { method: POST, path: "/midway/crew-shifts/{id}/confirm", description: "Crew member confirms own shift", roles: [CrewMember], code: 200, input: [], output: CrewShift, side_effects: ["status -> CONFIRMED"] }
  - { method: POST, path: "/midway/crew-shifts/{id}/complete", description: "Mark a confirmed shift completed", roles: [FairManager], code: 200, input: [], output: CrewShift, side_effects: ["status -> COMPLETED"] }
  - { method: POST, path: "/midway/crew-shifts/{id}/no-show", description: "Mark a scheduled/confirmed shift as no-show", roles: [FairManager], code: 200, input: [], output: CrewShift, side_effects: ["status -> NO_SHOW"] }
  - { method: POST, path: "/midway/crew-shifts/{id}/cancel", description: "Cancel a scheduled/confirmed shift", roles: [FairManager], code: 200, input: [], output: CrewShift, side_effects: ["status -> CANCELLED"] }
  # --- Test-driving logical clock ---
  - method: POST
    path: "/midway/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every date comparison in the scaffold reads this clock."
    roles: [StateProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced (never rewound below the startup default)"]
# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or blank X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, entity-backed scope mismatch (wrong function, RELEASED staff, cross-fair access), inactive inspector, or ownership violation (performer-only submit, operator-only cycle actions, assigned-inspector-only completion, self-only shift confirm)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier (left-to-right) or body foreign key does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum member, numeric range violated, fair date ordering violated, WRISTBAND quantity != 1, ride_id present/absent contrary to scope, SERIOUS/FATAL with injury_count == 0, unknown or computed field supplied" }
  - { id: ERR_FAIR_INVALID_STATE, http: 409, condition: "Fair status does not admit the operation (ride create outside SETUP/PERMIT_REQUESTED/PERMITTED, permit request outside SETUP, verify-assembly outside SETUP/PERMIT_REQUESTED, begin-teardown outside PERMITTED, archive outside TEARDOWN, day create outside PERMITTED, appointment create outside PERMIT_REQUESTED/PERMITTED, RIDE_AUDIT outside PERMITTED)" }
  - { id: ERR_RIDE_INVALID_STATE, http: 409, condition: "Ride setup_status/daily_status does not admit the operation (verify/dismantle from wrong setup state, resume from a non-hold state)" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "Permit is not PENDING" }
  - { id: ERR_INVALID_DAY_POSTURE, http: 409, condition: "OperatingDay posture does not admit the operation (sales/redemptions/voids outside OPEN, checklist ops outside CHECKLIST_PHASE, observations outside CHECKLIST_PHASE/OPEN/WEATHER_HOLD, open/resume/close/reconcile from wrong posture)" }
  - { id: ERR_DAY_NOT_TODAY, http: 422, condition: "begin-checklists requires day.date == current logical-clock date" }
  - { id: ERR_RIDE_NOT_OPEN, http: 409, condition: "Ride daily_status != OPEN where required (cycle create, redemption create, dispatch)" }
  - { id: ERR_RIDE_NOT_LICENSED, http: 409, condition: "Ride license_status != LICENSED where required (checklist create, resume)" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "RideCycle status does not admit the operation (load/dispatch outside LOADING, complete outside RUNNING, abort outside LOADING/RUNNING)" }
  - { id: ERR_CYCLE_IN_PROGRESS, http: 409, condition: "Another cycle for the same ride is LOADING or RUNNING" }
  - { id: ERR_CYCLE_EMPTY, http: 422, condition: "Dispatch with rider_count == 0" }
  - { id: ERR_CHECKLIST_INVALID_STATE, http: 409, condition: "DailyChecklist status does not admit the operation (submit outside DRAFT, countersign/reject outside SUBMITTED)" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 422, condition: "items_passed != items_total at submit" }
  - { id: ERR_CHECKLIST_COUNTERSIGNER_CONFLICT, http: 422, condition: "Countersigner's staff id equals performed_by_staff_id (segregation of duties)" }
  - { id: ERR_DUPLICATE_CHECKLIST, http: 409, condition: "A DailyChecklist already exists for (ride_id, operating_day_id)" }
  - { id: ERR_HEIGHT_RESTRICTION, http: 422, condition: "holder_height_in outside ride [min_rider_height_in, max_rider_height_in] (inclusive bounds)" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 422, condition: "Credit-bearing wristband has credits_remaining < 1 at redemption creation" }
  - { id: ERR_DAY_AT_CAPACITY, http: 422, condition: "attendance_count >= max_attendance at sale creation (selling the seat that reaches the cap is allowed; the next one fails)" }
  - { id: ERR_CAPACITY_ABOVE_MIDWAY, http: 422, condition: "OperatingDay.max_attendance > fair.midway_capacity" }
  - { id: ERR_PRODUCT_INACTIVE, http: 422, condition: "TicketProduct.active == false at sale creation" }
  - { id: ERR_SALE_NOT_ACTIVE, http: 409, condition: "TicketSale status != ACTIVE (void of VOIDED/EXPIRED sale, redemption from VOIDED/EXPIRED sale)" }
  - { id: ERR_SALE_HAS_REDEMPTIONS, http: 422, condition: "Void requested while a REDEEMED redemption exists for the wristband" }
  - { id: ERR_WIND_ABOVE_LIMIT, http: 422, condition: "Resume guard: latest observation wind > resume threshold (ride: wind_limit_mph - 3; day: 39)" }
  - { id: ERR_CERTIFICATION_MISSING, http: 422, condition: "Caller lacks a certification for the ride's class that is status ACTIVE with expires_on >= current date (or their staff record is RELEASED)" }
  - { id: ERR_ANNUAL_CERT_EXPIRED, http: 422, condition: "annual_cert_expires_on < fair.closing_date at verify-assembly" }
  - { id: ERR_INSPECTOR_UNAVAILABLE, http: 422, condition: "Inspector selector pool empty (all inactive, at daily capacity, or in buffer conflict)" }
  - { id: ERR_INSPECTOR_LICENSE_EXISTS, http: 409, condition: "license_number already registered" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "Appointment status != SCHEDULED for complete/cancel" }
  - { id: ERR_APPOINTMENT_NOT_DUE, http: 422, condition: "Completion attempted before scheduled_date" }
  - { id: ERR_APPOINTMENT_WINDOW_INVALID, http: 422, condition: "scheduled_date outside [current date, fair.teardown_end_date]" }
  - { id: ERR_PERMIT_APPROVER_CONFLICT, http: 422, condition: "Approver is the inspector who conducted the latest COMPLETED_PASS FAIR_WIDE inspection (segregation of duties)" }
  - { id: ERR_INSPECTION_REQUIRED, http: 422, condition: "No FAIR_WIDE appointment COMPLETED_PASS with completed_at >= permit.created_at" }
  - { id: ERR_NO_VERIFIED_RIDES, http: 422, condition: "Permit requested with zero rides in setup_status == SETUP_VERIFIED" }
  - { id: ERR_STAFF_SHIFT_OVERLAP, http: 409, condition: "New shift [start_hour, end_hour) intersects an existing SCHEDULED/CONFIRMED/COMPLETED shift of the same staff on the same date (half-open: touching endpoints allowed)" }
  - { id: ERR_SHIFT_OUT_OF_SEASON, http: 422, condition: "work_date in the past or outside the shift_role season window; also used by confirm/complete/no-show date guards" }
  - { id: ERR_SHIFT_INVALID_STATE, http: 409, condition: "CrewShift status does not admit the operation" }
  - { id: ERR_STAFF_INVALID_STATE, http: 409, condition: "StaffMember already RELEASED" }
  - { id: ERR_CERT_INVALID_STATE, http: 409, condition: "OperatorCertification already REVOKED" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "IncidentReport not FILED for clear/order-shutdown" }
  - { id: ERR_INCIDENTS_OPEN, http: 422, condition: "Ride resume from INCIDENT_HOLD while a FILED or SHUTDOWN_ORDERED incident remains for (ride, day)" }
  - { id: ERR_NO_COVERING_SHIFT, http: 422, condition: "Caller lacks a CrewShift with the required shift_role on the current date in status SCHEDULED or CONFIRMED" }
  - { id: ERR_DAYS_STILL_ACTIVE, http: 422, condition: "begin-teardown while an OperatingDay is in CHECKLIST_PHASE, OPEN, WEATHER_HOLD, or CLOSED" }
  - { id: ERR_RIDES_NOT_DISMANTLED, http: 422, condition: "archive while any ride setup_status != DISMANTLED" }
  - { id: ERR_RIDES_NOT_CLEARED, http: 422, condition: "open-gates while a SETUP_VERIFIED + LICENSED ride lacks a COUNTERSIGNED checklist for the day" }
  - { id: ERR_REDEMPTION_NOT_VOIDABLE, http: 409, condition: "Redemption not QUEUED, or REDEEMED with its cycle past LOADING, or already EXPIRED/VOIDED" }
  - { id: ERR_CROSS_FAIR_REFERENCE, http: 422, condition: "Wristband's operating day belongs to a different fair than the ride" }
  - { id: ERR_DUPLICATE_OPERATING_DAY, http: 409, condition: "An OperatingDay already exists for (fair_id, date)" }
  - { id: ERR_STALE_STAFF_VERSION, http: 412, condition: "expected_staff_version != StaffMember.version at crew-shift creation" }
  - { id: ERR_STALE_FAIR_VERSION, http: 412, condition: "expected_fair_version != Fair.version at permit approval" }
  - { id: ERR_STALE_CHECKLIST_VERSION, http: 412, condition: "expected_checklist_version != DailyChecklist.version at countersign" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateProgramAdmin
    description: "State ride-safety program administrator (system owner)"
    identity: "opaque"
    exclusive_operations:
      - "POST /midway/fairs"
      - "POST /midway/inspectors, POST /midway/inspectors/{id}/deactivate"
      - "POST /midway/operator-certifications"
      - "POST /midway/_clock/set_current_utc"
    shared_operations:
      - "POST /midway/staff (seeds the first SUPERVISOR per fair; shared with FairManager)"
      - "POST /midway/operator-certifications/{id}/revoke (shared with StateInspector)"
      - "all GET endpoints"
  - name: StateInspector
    description: "Licensed state ride inspector; X-User-ID must equal an Inspector.id with active == true"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /midway/inspection-appointments/{id}/complete (assigned inspector only)"
      - "POST /midway/permits/{id}/approve, POST /midway/permits/{id}/deny (approver != conducting inspector)"
      - "POST /midway/incident-reports/{id}/clear, POST /midway/incident-reports/{id}/order-shutdown"
    shared_operations:
      - "POST /midway/operator-certifications/{id}/revoke (shared with StateProgramAdmin)"
      - "all GET endpoints"
  - name: FairManager
    description: "Show-side supervisor; X-User-ID must equal a StaffMember.id with status ACTIVE, functions containing SUPERVISOR, and fair_id matching the target resource's fair"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /midway/fairs/{id}/request-permit, begin-teardown, archive"
      - "POST /midway/rides, POST /midway/rides/{id}/resume"
      - "POST /midway/inspection-appointments, POST /midway/inspection-appointments/{id}/cancel"
      - "POST /midway/staff/{id}/release"
      - "POST /midway/operating-days and all day posture actions (begin-checklists, open-gates, resume-day, close-gates, reconcile)"
      - "POST /midway/daily-checklists/{id}/countersign, reject (countersigner != performer)"
      - "POST /midway/ticket-products, POST /midway/ticket-products/{id}/deactivate"
      - "POST /midway/crew-shifts, complete, no-show, cancel"
    shared_operations:
      - "POST /midway/staff (shared with StateProgramAdmin)"
      - "POST /midway/weather-observations (shared with RideOperator)"
      - "POST /midway/incident-reports (shared with RideOperator)"
      - "all GET endpoints"
  - name: RideOperator
    description: "Ride operator; X-User-ID must equal a StaffMember.id with status ACTIVE, functions containing OPERATOR, same fair; certification in the ride's class required for checklist and cycle operations"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /midway/daily-checklists, POST /midway/daily-checklists/{id}/submit (performer only)"
      - "POST /midway/ride-cycles and load/dispatch/complete/abort (cycle operator only)"
      - "POST /midway/ride-redemptions"
    shared_operations:
      - "POST /midway/ride-redemptions/{id}/void (shared with TicketClerk)"
      - "POST /midway/weather-observations, POST /midway/incident-reports (shared with FairManager)"
      - "all GET endpoints"
  - name: TicketClerk
    description: "Ticket seller; X-User-ID must equal a StaffMember.id with status ACTIVE, functions containing CLERK, same fair"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /midway/ticket-sales, POST /midway/ticket-sales/{id}/void"
    shared_operations:
      - "POST /midway/ride-redemptions/{id}/void (shared with RideOperator)"
      - "all GET endpoints"
  - name: CrewMember
    description: "Setup/teardown crew; X-User-ID must equal a StaffMember.id with status ACTIVE, functions containing CREW, same fair; assembly/teardown actions additionally require a covering shift on the current date"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /midway/rides/{id}/verify-assembly, POST /midway/rides/{id}/dismantle"
      - "POST /midway/crew-shifts/{id}/confirm (own shifts only)"
    shared_operations:
      - "all GET endpoints"
