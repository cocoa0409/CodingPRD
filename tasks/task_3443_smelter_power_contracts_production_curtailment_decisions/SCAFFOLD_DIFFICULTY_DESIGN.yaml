  - rule_id: boundary_precision_check
    instances:
      - name: interruptible_hours_exactly_at_cap
        grounds:
          - validations[priority=20]
          - calculations.hedge_coverage
          - entities.PowerContract.fields.interruptible_hours_used
          - errors[ERR_INTERRUPTIBLE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Cumulative-hours metric on POST /smelter-ops/interrupt-events: 300h then
          200h land exactly on the 500h cap and are accepted (boundary is
          inclusive); a further 0.5h crosses it and is rejected. Tests cumulative
          aggregation, not instantaneous rate.
        test_recipe:
          setup:
            - "Smelter with ACTIVE contract carrying an INTERRUPTIBLE 50MW component capped at 500 hours per contract year; clock at default 2026-09-01 (all event windows in the past, inside contract year [2026-01-01, 2027-01-01))."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "INTERRUPTIBLE", volume_mw: 50, interruptible_cap_hours_per_year: 500 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
          trigger:
            - call: "POST /smelter-ops/interrupt-events"
              payload: { contract_id: "${pc}", start_at: "2026-03-01T00:00:00Z", end_at: "2026-03-13T12:00:00Z", mw_reduced: 50 }
              as: EnergyManager
              captures: { ev1: $.data.id, ev1_hours: $.data.hours }
            - call: "POST /smelter-ops/interrupt-events"
              payload: { contract_id: "${pc}", start_at: "2026-05-01T00:00:00Z", end_at: "2026-05-09T08:00:00Z", mw_reduced: 50 }
              as: EnergyManager
              captures: { ev2: $.data.id, ev2_hours: $.data.hours }
            - call: "POST /smelter-ops/interrupt-events"
              payload: { contract_id: "${pc}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-01T00:30:00Z", mw_reduced: 50 }
              as: EnergyManager
              captures: { err: $.data.error_id }
            - call: "GET /smelter-ops/power-contracts/${pc}"
              as: EnergyManager
              captures: { used: $.data.interruptible_hours_used }
          assert:
            - "InterruptEvent.${ev1}.hours == 300 and InterruptEvent.${ev2}.hours == 200 both accepted (cumulative exactly 500 == cap)"
            - "third event (0.5h) rejected with error_id == ERR_INTERRUPTIBLE_CAP_EXCEEDED"
            - "PowerContract.${pc}.interruptible_hours_used == 500 after the rejection (failed event did not accrue)"

      - name: product_mix_sum_exactly_at_capacity
        grounds:
          - validations[priority=21]
          - entities.ProductionPlan.fields.total_tonnes
          - errors[ERR_PRODUCT_MIX_OVER_CAPACITY]
        distinguishing_aspect: |
          Different metric and endpoint than the interruptible-hours instance:
          summed allocation tonnes on POST /smelter-ops/production-plans against
          rated_capacity_tpd * 30 = 30000. A sum of exactly 30000 is accepted
          (<= boundary); 30000.01 is rejected.
        test_recipe:
          setup:
            - "Smelter rated 1000 tpd (monthly capacity 30000t); LME 2400 and premium 380 prints exist so product_mix_margin can freeze."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id, sv: $.data.version }
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINUM_LME", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 2400.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "REGIONAL_PREMIUM", region_code: "NA_NORTHWEST", observed_at: "2026-08-15T00:00:00Z", price_usd: 380.00 }
              as: TradingAnalyst
          trigger:
            - call: "POST /smelter-ops/production-plans"
              payload: { smelter_id: "${sm}", expected_smelter_version: "${sv}", period_month: "2026-09", allocations: [ { product_form: "BILLET", tonnes: 12000 }, { product_form: "SLAB", tonnes: 9000 }, { product_form: "VALUE_ADDED", tonnes: 9000 } ] }
              as: Controller
              captures: { plan_a: $.data.id, plan_a_total: $.data.total_tonnes, sv2: $.data.version }
            - call: "GET /smelter-ops/smelters/${sm}"
              as: Controller
              captures: { sv_fresh: $.data.version }
            - call: "POST /smelter-ops/production-plans"
              payload: { smelter_id: "${sm}", expected_smelter_version: "${sv_fresh}", period_month: "2026-10", allocations: [ { product_form: "BILLET", tonnes: 12000.01 }, { product_form: "SLAB", tonnes: 9000 }, { product_form: "VALUE_ADDED", tonnes: 9000 } ] }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "ProductionPlan.${plan_a}.total_tonnes == 30000 accepted (sum exactly == rated_capacity_tpd * 30)"
            - "second plan rejected with error_id == ERR_PRODUCT_MIX_OVER_CAPACITY (sum 30000.01 > 30000)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: restart_start_requires_active_spl_permit
