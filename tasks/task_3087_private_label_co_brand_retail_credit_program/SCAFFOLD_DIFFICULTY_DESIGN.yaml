        as: ProgramAdmin
        captures:
          risk: $.data.program_risk_score
      assert:
      - program_risk_score == 170
      - the equal-limit account scores 20 and the one-cent-over account scores 320, so the two-account average is round_half_up((20 + 320) / 2) == 170
      - the over-limit term contributes 0 at exactly the limit and 300 one cent above it
