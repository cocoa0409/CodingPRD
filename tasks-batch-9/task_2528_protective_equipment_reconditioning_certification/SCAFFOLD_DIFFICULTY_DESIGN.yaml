          sends INSTALLED back to PARTS_PENDING on attempts 1 and 2, but the
          third failure exits the cycle to CANCELLED and condemns the unit with
          condemn_reason REPAIR_UNSUCCESSFUL; verification_failure_count must
          read exactly 3 (the exhausting attempt is counted too), which a
