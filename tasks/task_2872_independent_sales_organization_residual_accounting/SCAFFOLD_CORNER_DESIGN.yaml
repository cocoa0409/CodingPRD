          - calculations.statement_net_payable (MIN_PAYOUT_CENTS)
          - state_machines.AgentStatement.UNSETTLED_to_SETTLED
        distinguishing_aspect: "Twin agents are issued at net_payable_cents 2499 and 2500 — one cent apart across MIN_PAYOUT_CENTS. The 2499 settle is refused and the statement stays UNSETTLED with paid_on null; 2500 settles, so the floor comparison is >= and not >."
        test_recipe:
          setup: ["Program P1 (NO_MINIMUM); agents A1 and A2 (split 0.50, no advances, no attrition so residual_hold is false); merchants M1 and M2 (equipment 0); one 2026-07 batch whose lines normalize to 4998 and 5000 so the DIRECT allocations are 2499 and 2500."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Below Floor", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2 At Floor", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a2}", processor_program_id: "${p1}", mid: "MID-9002", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:fl-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 10098 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 10100 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st1: "$.data[0].id" }
            - call: "GET /agent-statements"
              payload: { agent_id: "${a2}", period_month: "2026-07" }
              as: ResidualController
              captures: { st2: "$.data[0].id" }
            - call: "POST /agent-statements/${st1}/issue"
              payload: {}
              as: ResidualController
            - call: "POST /agent-statements/${st2}/issue"
              payload: {}
              as: ResidualController
          trigger:
            - call: "POST /agent-statements/${st1}/settle"
              payload: { paid_on: "2026-08-01" }
              as: ResidualController
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agent-statements/${st2}/settle"
              payload: { paid_on: "2026-08-01" }
              as: ResidualController
          assert:
            - "the two lines normalize to 4998 and 5000 (gross 10098 / 10100 minus the identical processor_cost_cents 5100)"
            - "AgentStatement.${st1}.net_payable_cents == 2499 and AgentStatement.${st2}.net_payable_cents == 2500, both lifecycle_state ISSUED and settlement_state UNSETTLED"
            - "${e1} == ERR_BELOW_MIN_PAYOUT with HTTP 409 — 2499 is one cent under MIN_PAYOUT_CENTS 2500"
            - "AgentStatement.${st1} is still settlement_state UNSETTLED with paid_on null after the refusal, and its lifecycle_state is still ISSUED"
            - "the second call returns 200: AgentStatement.${st2}.settlement_state == SETTLED and paid_on == 2026-08-01 — the floor is inclusive"
            - "the refused settle did not change carry_forward_deficit_cents on ${st1}, which stays 0: an unsettleable balance is not automatically rolled forward by the settle attempt"

      - name: transfer_target_must_be_a_different_active_agent
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 12 / ERR_TRANSFER_TARGET_INVALID]
          - validations[priority 7 / ERR_REFERENCED_AGENT_NOT_FOUND]
          - state_machines.Agent.DEPARTED_to_DEPARTED (transfer-portfolio)
        distinguishing_aspect: "The target rule has two legs beyond existence — not self, and status ACTIVE — and a non-existent target is caught earlier by the priority-7 body-reference rule, so the three refusals return two different error ids. Only the ACTIVE third agent is admitted, and the merchant's owning_agent_id moves."
        test_recipe:
          setup: ["Agent A1 is DEPARTED with one ACTIVE merchant M1 still on its book; agent A2 is ACTIVE; agent A3 is in DEPARTURE_NOTICE."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Departing", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2 Receiver", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /agents"
              payload: { name: "A3 Also Leaving", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a3: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /agents/${a3}/notice"
              payload: { departure_effective_date: "2026-08-01" }
              as: IsoAdmin
            - call: "POST /agents/${a1}/notice"
              payload: { departure_effective_date: "2026-08-01" }
              as: IsoAdmin
            - call: "POST /agents/${a1}/depart"
              payload: {}
              as: IsoAdmin
          trigger:
            - call: "POST /agents/${a1}/transfer-portfolio"
              payload: { target_agent_id: "${a1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agents/${a1}/transfer-portfolio"
              payload: { target_agent_id: "${a3}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /agents/${a1}/transfer-portfolio"
              payload: { target_agent_id: "00000000-0000-4000-8000-000000000000" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "POST /agents/${a1}/transfer-portfolio"
              payload: { target_agent_id: "${a2}" }
              as: IsoAdmin
          assert:
            - "Agent.${a1}.status == DEPARTED, Agent.${a2}.status == ACTIVE and Agent.${a3}.status == DEPARTURE_NOTICE before the triggers"
            - "${e1} == ERR_TRANSFER_TARGET_INVALID with HTTP 422 — an agent cannot transfer its portfolio to itself"
            - "${e2} == ERR_TRANSFER_TARGET_INVALID — A3 is in DEPARTURE_NOTICE, not ACTIVE"
            - "${e3} == ERR_REFERENCED_AGENT_NOT_FOUND with HTTP 404 — the priority-7 body-reference rule outranks the priority-12 target rule"
            - "Merchant.${m1}.owning_agent_id is still ${a1} after all three refusals"
            - "the fourth call returns 200: Merchant.${m1}.owning_agent_id == ${a2} and Merchant.${m1}.version was incremented"
            - "Agent.${a1}.portfolio_merchant_count == 0 and Agent.${a2}.portfolio_merchant_count == 1 after the accepted transfer"

  - section: endpoints
    instances:

      - name: program_patch_touches_only_declared_fields_and_is_never_retroactive
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH /processor-programs/{id}
          - calculations.normalize_residual_line
          - entities.ProcessorProgram.fields.normalization_mode
        distinguishing_aspect: "The PATCH input list deliberately excludes normalization_mode, so the split variant is immutable once merchants are boarded, and the amendment is not retroactive: the already-normalized June line keeps processor_cost_cents 5100 and its 20000-cent allocation while a July line normalized after the buy-rate doubles costs 9600 and allocates 17750."
        test_recipe:
          setup: ["Program P1 (buy_rate_bps 45, per_item 6, NET_REVENUE_SPLIT, NO_MINIMUM) with agent A1 and merchant M1 (equipment 0); a 2026-06 batch already normalized and posted."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-06", coverage_start: "2026-06-01", coverage_end: "2026-07-01", file_checksum: "sha256:pp-0006" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 45100 }
              as: ResidualAnalyst
              captures: { l1: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
          trigger:
            - call: "PATCH /processor-programs/${p1}"
              payload: { name: "Atlantic Net Program v2", buy_rate_bps: 90, buy_rate_per_item_cents: 6, assessment_bps: 20, minimum_billing_mode: "SHORTFALL_BILLED" }
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:pp-0007" }
              as: ResidualAnalyst
              captures: { b2: $.data.id }
            - call: "POST /residual-batches/${b2}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 45100 }
              as: ResidualAnalyst
              captures: { l2: $.data.id }
            - call: "POST /residual-batches/${b2}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b2}/post"
              payload: {}
              as: ResidualController
          assert:
            - "the PATCH returns 200 with name 'Atlantic Net Program v2', buy_rate_bps 90, assessment_bps 20, minimum_billing_mode SHORTFALL_BILLED and version 2"
            - "ProcessorProgram.${p1}.normalization_mode is still NET_REVENUE_SPLIT — the field is absent from the PATCH input list, so no request can change it"
            - "ProcessorProgram.${p1}.posted_batch_count == 2 after the second post and status is still ACTIVE"
            - "ResidualLine.${l1}.processor_cost_cents is still 5100 and normalized_net_revenue_cents still 40000 — the amendment is not retroactive"
            - "the June allocation is untouched: GET /residual-allocations?agent_id=${a1}&period_month=2026-06 returns total_count 1 with gross_allocation_cents 20000"
            - "ResidualLine.${l2}.processor_cost_cents == 9600 == round_half_up(1000000 x 90 / 10000) + 6 x 100, and normalized_net_revenue_cents == 35500"
            - "the July allocation is gross_allocation_cents 17750 == round_half_up(35500 x 0.50) with iso_retained_cents 17750 on its profitability row"
            - "AgentStatement rows for 2026-06 and 2026-07 have gross_after_trueup_cents 20000 and 17750, and Agent.${a1}.trailing_residual_cents == 37750"

      - name: portfolio_summary_derives_all_ten_fields_on_the_fly
        claim_type: Computed read
        grounds:
          - endpoints.GET /agents/{id}/portfolio-summary
          - calculations.agent_portfolio_attrition_bps
          - calculations.agent_vesting_pct
          - entities.Agent.fields.lifetime_clawback_cents
        distinguishing_aspect: "One fixture pins all ten output fields at once and separates the two counting rules: portfolio_merchant_count is 4 (PENDING included) while the attrition denominator is 3 (PENDING excluded), giving 3333 bps — round_half_up(10000/3) — and residual_hold true. vested_pct 50, trailing_residual 20000, advance_outstanding 200000 and lifetime_clawback 18800 must all be derived, not stored stale."
        test_recipe:
          setup: ["Agent A1 (vesting_start 2024-01-15) with a 200000-cent advance and four merchants: M1 left PENDING, M2 and M3 ACTIVE, M4 ATTRITED on 2026-07-01 after a 27000-cent bonus. A 2026-07 batch carrying only M2's line is posted, giving A1 a 20000-cent statement."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
