      - name: unauthenticated_student_create_rejected_before_any_other_check
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "rbac.roles"
        distinguishing_aspect: |
          Priority 1 is the top of a TOTAL ladder: with no usable X-Role header the request must
          return 401 ERR_UNAUTHENTICATED even though the body is ALSO malformed (no
          district_of_residence, and an out-of-enum disability_category). A server that validates
          the body first would answer 400 ERR_INVALID_REQUEST and leak shape information to an
          unauthenticated caller. The test harness sends X-Role with a value that is not one of
          the seven declared roles.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
