      - name: placement_admission_and_rotation_gate_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TIER_ABOVE_RECOMMENDATION]
          - errors[ERR_NO_SECTION_FOR_INSTRUMENT]
          - errors[ERR_AUDITION_NOT_ADJUDICATED]
          - errors[ERR_ROTATION_NOT_PERMITTED]
          - validations[priority 42]
          - validations[priority 63]
          - validations[priority 64]
          - validations[priority 65]
        distinguishing_aspect: |
          Four refusals that all target the same Symphony ensemble are four different ids
          ranked in a fixed order: an audition still SCHEDULED is 409
          ERR_AUDITION_NOT_ADJUDICATED at priority 42 - it outranks the musical checks, so
          the unscored violinist never even reaches the tier comparison; a PHILHARMONIC
          recommendation offered a SYMPHONY seat is 422 ERR_TIER_ABOVE_RECOMMENDATION at 63
          (upward promotion is the forbidden direction); a SYMPHONY-recommended cellist is
          422 ERR_NO_SECTION_FOR_INSTRUMENT at 64 because the ensemble owns only VIOLIN and
          VIOLA sections. Rotation adds a fifth id: once the ensemble is SEATED, the ROTATING
          violin section holding a single ACTIVE seat and the FIXED viola section holding two
          are BOTH 422 ERR_ROTATION_NOT_PERMITTED - two different clauses of priority 65,
          reached only because the roster-state gate at 43 is satisfied.
