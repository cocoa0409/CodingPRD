# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# task_0546_foundation_repair
# Every non-stub instance drives empty-DB -> precondition via §1.5 calls only.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: lead_create_returns_201_and_envelope
        claim_type: creation
        grounds: [entities.Lead, endpoints]
        distinguishing_aspect: "POST /foundation/leads with all required fields returns 201, data.id present, financing_balance_cents=0, active_visit_count=0, version=1, and a success envelope with meta.api_request_id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /foundation/leads", payload: { customer_name: "Env Owner", property_address: "1 Env St", contact_email: "env@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", v: "$.data.version" } }
          assert:
            - "response.status == 201"
            - "response.response_type == object"
            - "Lead.${lead_id}.financing_balance_cents == 0"
            - "Lead.${lead_id}.active_visit_count == 0"
            - "Lead.${lead_id}.version == 1"

      - name: lead_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Lead, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /foundation/leads/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /foundation/leads/00000000-0000-4000-8000-000000000000", payload: {}, as: SalesAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: lead_list_returns_pagination_fields
        claim_type: listing
        grounds: [entities.Lead, endpoints]
        distinguishing_aspect: "GET /foundation/leads returns an array envelope carrying total_count and has_more."
        test_recipe:
          setup: ["One lead exists."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "List Owner", property_address: "2 List St", contact_email: "list@x.com", region_code: "SOUTH" }, as: SalesAgent }
          trigger:
            - { call: "GET /foundation/leads", payload: {}, as: SalesAgent }
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 1"
            - "response.meta.has_more == false"

      - name: lead_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Lead.fields.region_code, "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /foundation/leads without region_code returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /foundation/leads", payload: { customer_name: "No Region", property_address: "3 Bad St", contact_email: "nr@x.com" }, as: SalesAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 422"

      - name: inspection_complete_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Inspection.fields.soil_class, "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Completing an inspection with soil_class='ROCKY' (not in {STABLE,EXPANSIVE,UNSTABLE}) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A SCHEDULED inspection exists."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Enum Owner", property_address: "4 Enum St", contact_email: "en@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
          trigger:
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "ROCKY", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 422"

      - name: lead_financing_balance_reflects_accepted_quote
        claim_type: computed_fields
        grounds: [entities.Lead.fields.financing_balance_cents, calculations.lead_financing_balance]
        distinguishing_aspect: "After accepting a CASH quote of total 120000, Lead.financing_balance_cents == 120000 (computed debit, no offsetting cancel)."
        test_recipe:
          setup: ["A pier_count=1 depth-10 STABLE/EASY CASH quote SENT."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Bal Owner", property_address: "5 Bal St", contact_email: "bal@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 1, anchor_count: 0, avg_pier_depth_ft: 10, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/leads/${lead_id}", payload: {}, as: SalesAgent, captures: { fb: "$.data.financing_balance_cents" } }
          assert:
            - "Lead.${lead_id}.financing_balance_cents == 120000"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: quote_accept_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Quote.SENT_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a quote still in DRAFT (never sent) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT quote on an ENGINEERED scope (send skipped)."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Dr Owner", property_address: "6 Dr St", contact_email: "dr@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
          trigger:
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: job_start_from_unscheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Job.SCHEDULED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Starting a job that is still UNSCHEDULED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An accepted quote produced an UNSCHEDULED job."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Un Owner", property_address: "7 Un St", contact_email: "un@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /foundation/jobs/${job_id}/start", payload: {}, as: OpsCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: claim_approve_from_filed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a claim still in FILED (never reviewed) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A FILED claim on an ACTIVE warranty."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Cl Owner", property_address: "8 Cl St", contact_email: "cl@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
            - { call: "POST /foundation/permits", payload: { job_id: "${job_id}", permit_type: "STANDARD" }, as: OpsCoordinator, captures: { permit_id: "$.data.id" } }
            - { call: "POST /foundation/permits/${permit_id}/decide", payload: { decision: "APPROVE" }, as: OpsCoordinator }
            - { call: "POST /foundation/crews", payload: { crew_name: "Crew N", region_code: "NORTH" }, as: Admin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /foundation/jobs/${job_id}/schedule", payload: { crew_id: "${crew_id}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/start", payload: {}, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/complete", payload: { piers_installed: 8, adjustment_inches: 1.0 }, as: OpsCoordinator }
            - { call: "GET /foundation/warranties?job_id=${job_id}", payload: {}, as: OpsCoordinator, captures: { warranty_id: "$.data[0].id" } }
            - { call: "POST /foundation/claims", payload: { warranty_id: "${warranty_id}", description: "cb", reported_settlement_inches: 1.0 }, as: Customer, as_user_id: "${lead_id}", captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /foundation/claims/${claim_id}/approve", payload: {}, as: ClaimsAdjuster, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: inspection_complete_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Inspection.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second complete on an already-COMPLETED (terminal) inspection returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COMPLETED inspection."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Tw Owner", property_address: "9 Tw St", contact_email: "tw@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
          trigger:
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: claim_needs_info_resubmit_returns_under_review
        claim_type: valid_transition
        grounds: [state_machines.Claim.UNDER_REVIEW_to_NEEDS_INFO, state_machines.Claim.NEEDS_INFO_to_UNDER_REVIEW]
        distinguishing_aspect: "The NEEDS_INFO -> UNDER_REVIEW resubmit loop works: after request-info then resubmit, Claim.status == UNDER_REVIEW."
        test_recipe:
          setup: ["A claim in NEEDS_INFO."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Ni Owner", property_address: "10 Ni St", contact_email: "ni@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
            - { call: "POST /foundation/permits", payload: { job_id: "${job_id}", permit_type: "STANDARD" }, as: OpsCoordinator, captures: { permit_id: "$.data.id" } }
            - { call: "POST /foundation/permits/${permit_id}/decide", payload: { decision: "APPROVE" }, as: OpsCoordinator }
            - { call: "POST /foundation/crews", payload: { crew_name: "Crew N", region_code: "NORTH" }, as: Admin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /foundation/jobs/${job_id}/schedule", payload: { crew_id: "${crew_id}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/start", payload: {}, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/complete", payload: { piers_installed: 8, adjustment_inches: 1.0 }, as: OpsCoordinator }
            - { call: "GET /foundation/warranties?job_id=${job_id}", payload: {}, as: OpsCoordinator, captures: { warranty_id: "$.data[0].id" } }
            - { call: "POST /foundation/claims", payload: { warranty_id: "${warranty_id}", description: "cb", reported_settlement_inches: 1.0 }, as: Customer, as_user_id: "${lead_id}", captures: { claim_id: "$.data.id" } }
            - { call: "POST /foundation/claims/${claim_id}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /foundation/claims/${claim_id}/request-info", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /foundation/claims/${claim_id}/resubmit", payload: {}, as: Customer, as_user_id: "${lead_id}" }
          assert:
            - "Claim.${claim_id}.status == UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: claim_settlement_full_variant_zero_missed
        claim_type: variant_divergence
        grounds: [calculations.claim_settlement, entities.Claim.fields.coverage_variant]
        distinguishing_aspect: "With zero MISSED visits, coverage_variant=FULL and settlement_cents == 450000 for reported_settlement_inches=1.5 (contrasts with the PRORATED §1.8 instance = 405000)."
        test_recipe:
          setup: ["ACTIVE warranty with no missed visits; a claim reported_settlement_inches=1.5 moved to UNDER_REVIEW."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Fu Owner", property_address: "11 Fu St", contact_email: "fu@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
