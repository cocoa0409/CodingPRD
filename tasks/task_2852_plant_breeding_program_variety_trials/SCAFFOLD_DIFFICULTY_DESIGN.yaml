              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 20.0, qc_status: "REJECTED" }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 13.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 14.0, qc_status: "REJECTED" }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 15.0, qc_status: "REJECTED" }
              as: TrialAgronomist
          trigger:
            - call: "POST /trial-entries/${e_a}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/finalize"
              payload: {}
              as: TrialAgronomist
          assert:
            - "entry A finalize -> 200; TrialEntry.${e_a}.status == HARVESTED, valid_rep_count == 3, plot_mean_yield_kg == 15.000, yield_kg_per_ha == 12000.00"
            - "TrialEntry.${e_a}.plot_mean_yield_kg != 16.250 (the mean the REJECTED rep would produce)"
            - "entry B finalize -> 422 with data.error_id == ERR_INSUFFICIENT_REPLICATION"
            - "TrialEntry.${e_b}.status == PLANTED, valid_rep_count == 2, plot_mean_yield_kg == null, yield_kg_per_ha == null"
            - "TrialSeries.${series_id}.status == PLANTED (the failed finalize left a PLANTED sibling, so no bubble to DATA_COMPLETE)"
            - "GET /trial-entries/${e_b}/observations returns total_count == 4 even though only 2 are valid"

      - name: site_posture_at_exact_085_and_exact_100_utilisation
        grounds:
          - calculations.site_capacity_peak_and_posture
          - entities.TrialSite.fields.capacity_posture
          - entities.TrialSite.fields.available_plot_count
          - endpoints["POST /trial-series/{id}/entries"]
        distinguishing_aspect: |
          Both posture cut-offs are >= comparisons on an exact decimal ratio, and
          all three sites are probed in one scenario: 48/60 = 0.80 stays OPEN,
          51/60 = 0.85 exactly is RESTRICTED (not OPEN), 60/60 = 1.00 exactly is
          FROZEN (not RESTRICTED). A float comparison or a strictly-greater test
          misclassifies the two exact-boundary sites while leaving 0.80 correct.
        test_recipe:
          setup:
            - "One program, one objective, three lines, one STAGE_1 series with replication_count 3 and min_locations 1."
            - "Three sites each with total_plot_capacity 60: PA1 receives an entry of 48 plots and PB1 an entry of 51 plots, both spanning the whole season."
