            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/artists/${art_id}/review", payload: {}, as: ArtistLiaison, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /piano-works/concert-loans", payload: { desired_model: MODEL_D, tour_start: "2027-10-01T00:00:00Z", tour_end: "2027-10-15T00:00:00Z" }, as: Artist, as_user_id: "${art_id}", captures: { err: $.data.error_id } }
            - { call: "GET /piano-works/concert-loans", payload: { artist_id: "${art_id}" }, as: ArtistLiaison }
          assert:
            - "review left Artist.${art_id}.status == SUSPENDED (captured ${st})"
            - "loan create captured error_id == ERR_ARTIST_NOT_ACTIVE"
            - "GET /piano-works/concert-loans?artist_id=${art_id} returns total_count == 0"

