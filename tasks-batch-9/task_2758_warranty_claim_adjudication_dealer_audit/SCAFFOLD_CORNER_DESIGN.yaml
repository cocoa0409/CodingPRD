      - name: escalated_goodwill_cannot_be_decided_by_a_claim_adjudicator
        claim_type: role_negative
        grounds:
          - errors[ERR_UNAUTHORIZED_FOR_ESCALATED_GOODWILL]
          - state_machines.GoodwillAuthorization
          - calculations.goodwill_authorization_limit
        distinguishing_aspect: |
          The authority tier is baked into the row at creation: a request of 44000 opens ESCALATED because it is
          above adjudicator_limit_cents 40000, and from that state a ClaimAdjudicator is refused with a code of
          its own - not the generic ERR_UNAUTHORIZED, since the role IS in the endpoint's roles list.
        test_recipe:
          setup:
            - "WORLD-GOODWILL: claim CL_GW has provisional_total_cents 60000, out_of_warranty_margin_pct 0.1000, adjudicator_limit_cents 40000 and manager_limit_cents 48000."
            - "adj-user-1 requested 44000, so the authorization opened ESCALATED rather than PENDING."
            - "adj-user-2 is a different user from the requester, so segregation of duties at priority 25 passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-20T00:00:00Z" }
              as: WarrantyAdmin
