scenario: "2807. Alternative Education & Credit Recovery Program (district alternative education center): referral and placement criteria including behavior, credit deficiency and re-engagement pathways, seat time versus competency-based credit award policy, course catalog with online, packet and blended options and proctoring requirements, credit recovery eligibility limited to previously failed courses with grade replacement rules, attendance, progress pacing and re-entry criteria to the home school, graduation plan tracking and cohort accountability implications, staffing ratios and support services on site, transcript coding and postsecondary acceptance concerns"
domain_name: "alternative-education-credit-recovery"
# All business resources are top-level collections (flat topology); `/` means no
# extra path prefix is prepended to the collection segments declared in §1.5.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - conditional_feature_flags

  entity_topology: flat
  # Every entity is a peer collection at the URL root; parentage is expressed
  # only through FK fields in request/response bodies, never through nesting.

  state_machine_shape: cyclic
  # Referral loops SCREENING -> INFO_REQUESTED -> SCREENING and
  # PLACEMENT_OFFERED -> SCREENING (offer withdrawal); Placement loops
  # ACTIVE -> RE_ENTRY_PENDING -> ACTIVE (re-entry denial); CourseEnrollment
  # carries two independent state axes (progress_state, integrity_state);
  # GraduationPlan.posture and Center.intake_posture are derived aggregates.

  relationship_patterns:
    - one_to_many
    - self_referential      # Referral.prior_referral_id -> Referral.id (re-referral)
    - cross_aggregate       # CreditAward -> PriorCourseRecord grade replacement

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# Every field declared `source: computed` is DERIVED ON READ: it is recomputed
# from current persisted state (and the logical clock) each time the entity is
# serialized into a response, so no computed value can go stale. Accumulator
# fields whose value is advanced by an explicit endpoint say so in their
# description.

entities:
  - name: Center
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the district alternative education center
        constraints: 1-120 chars
      - name: seat_capacity
        type: integer
        source: input
        description: total funded seats at this center
        constraints: ">= 1"
      - name: certified_teacher_fte
        type: number
        source: input
        description: certified teacher FTE assigned on site
        constraints: "> 0, 2 decimal places"
      - name: support_staff_fte
        type: number
        source: input
        description: counselor / social-worker FTE assigned on site
        constraints: ">= 0, 2 decimal places"
      - name: max_students_per_teacher
        type: integer
        source: input
        description: contractual students allowed per 1.00 certified teacher FTE
        constraints: ">= 1"
      - name: restricted_seat_margin
        type: integer
        source: computed
        description: "floor(seat_capacity * 0.10); seat cushion below which intake becomes RESTRICTED"
      - name: seats_reserved
        type: integer
        source: computed
        description: "count(Referral WHERE center_id == this.id AND status == PLACEMENT_OFFERED)"
      - name: seats_committed
        type: integer
        source: computed
        description: "active_student_count + seats_reserved"
      - name: seats_available
        type: integer
        source: computed
        description: "seat_capacity - seats_committed (may not go below 0 because every seat consumer checks intake_posture first)"
      - name: active_student_count
        type: integer
        source: computed
        description: "count(Placement WHERE center_id == this.id AND status IN {ACTIVE, RE_ENTRY_PENDING})"
      - name: student_teacher_ratio
        type: number
        source: computed
        description: "round(active_student_count / certified_teacher_fte, 2)"
      - name: staffing_headroom
        type: integer
        source: computed
        description: "floor(certified_teacher_fte * max_students_per_teacher) - active_student_count"
      - name: intake_posture
        type: enum
        source: computed
        description: "derived intake gate; see calculations.center_intake_posture"
        constraints: "OPEN | RESTRICTED | FROZEN"

  - name: HomeSchool
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: comprehensive home high school that sends referrals
        constraints: 1-120 chars
      - name: district_code
        type: string
        source: input
        description: state district/school reporting code
        constraints: 1-20 chars
      - name: accountability_cohort_year
        type: integer
        source: input
        description: four-year graduation cohort year currently under accountability review
        constraints: "2000..2100"
      - name: cohort_size
        type: integer
        source: computed
        description: "count(Student WHERE home_school_id == this.id AND cohort_year == accountability_cohort_year)"
      - name: graduates_count
        type: integer
        source: computed
        description: "count(Student WHERE home_school_id == this.id AND cohort_year == accountability_cohort_year AND status == GRADUATED)"
      - name: alt_ed_placed_count
        type: integer
        source: computed
        description: "count(distinct Student in the accountability cohort having >= 1 Placement in any status)"
      - name: adjusted_grad_rate
        type: number
        source: computed
        description: "round(graduates_count / cohort_size, 4); null when cohort_size == 0"
      - name: cohort_flag
        type: enum
        source: computed
        description: "accountability band; see calculations.cohort_accountability"
        constraints: "COMPLIANT | WATCH | PRIORITY | NOT_RATED"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: home_school_id
        type: string
        source: input
        description: "FK -> HomeSchool.id; home school of record, also the ownership scope for HomeSchoolCounselor"
      - name: state_student_id
        type: string
        source: input
        description: statewide student identifier
        constraints: "unique across Student; 1-32 chars"
      - name: full_name
        type: string
        source: input
        description: student legal name
        constraints: 1-120 chars
      - name: cohort_year
        type: integer
        source: input
        description: four-year graduation cohort year the student belongs to
        constraints: "2000..2100"
      - name: grade_level
        type: integer
        source: input
        description: current grade level; drives graduation-plan expected progress factor
        constraints: "9 | 10 | 11 | 12"
      - name: status
        type: enum
        source: computed
        description: "enrollment posture; ENROLLED_HOME at creation, PLACED_ALT on accept-offer, RE_ENTERED on approve-re-entry, EXITED_ALT on placement exit, GRADUATED on graduation-plan completion"
        default: ENROLLED_HOME
        constraints: "ENROLLED_HOME | PLACED_ALT | RE_ENTERED | EXITED_ALT | GRADUATED"
      - name: credits_earned_total
        type: number
        source: computed
        description: "round(sum(PriorCourseRecord.credits_attempted WHERE student_id == this.id AND outcome == PASSED) + sum(CreditAward.credits_awarded WHERE student_id == this.id AND status == POSTED), 2)"
      - name: alt_ed_credits
        type: number
        source: computed
        description: "round(sum(CreditAward.credits_awarded WHERE student_id == this.id AND status == POSTED), 2)"
      - name: ncaa_acceptable_credits
        type: number
        source: computed
        description: "round(sum(CreditAward.credits_awarded WHERE student_id == this.id AND status == POSTED AND ncaa_acceptable == true), 2)"
      - name: gpa
        type: number
        source: computed
        description: "transcript GPA; see calculations.transcript_gpa; null when no counted credits exist"

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: catalog course code used as the transcript course code
        constraints: "unique across Course; 2-16 chars"
      - name: title
        type: string
        source: input
        description: catalog course title
        constraints: 1-120 chars
      - name: subject_area
        type: enum
        source: input
        description: graduation-plan subject bucket
        constraints: "ELA | MATH | SCIENCE | SOCIAL_STUDIES | ELECTIVE"
      - name: credit_value
        type: number
        source: input
        description: full credit value awarded for complete mastery
        constraints: "multiple of 0.25, 0.25..2.00"
      - name: modality
        type: enum
        source: input
        description: delivery mode offered at the center
        constraints: "ONLINE | PACKET | BLENDED"
      - name: total_modules
        type: integer
        source: input
        description: number of gradable modules in the course
        constraints: ">= 1"
      - name: required_seat_hours
        type: number
        source: input
        description: seat hours required for full credit under the SEAT_TIME policy
        constraints: "> 0, 2 decimal places"
      - name: pacing_days
        type: integer
        source: input
        description: calendar days allotted to finish the course at expected pace
        constraints: ">= 1"
      - name: proctoring_required
        type: boolean
        source: input
        description: "true when a proctored exam must be COMPLETED before award submission; MUST be true for ONLINE and BLENDED modalities"
      - name: proctored_exam_weight
        type: number
        source: input
        description: weight of the proctored exam inside mastery_pct when proctoring_required is true
        default: 0.40
        constraints: "0.00..0.60, 2 decimal places"
      - name: ncaa_approved
        type: boolean
        source: input
        description: course appears on the NCAA approved-core list for the district
      - name: min_passing_percent
        type: number
        source: input
        description: minimum final percent that may be submitted for a credit award
        default: 60
        constraints: "0..100"

  - name: PriorCourseRecord
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student whose historical transcript row this is"
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; catalog course originally attempted"
      - name: term_code
        type: string
        source: input
        description: term the original attempt belongs to
        constraints: "1-16 chars, e.g. 2025-S1"
      - name: original_percent
        type: number
        source: input
        description: final percent earned on the original attempt
        constraints: "0..100, 2 decimal places"
      - name: credits_attempted
        type: number
        source: input
        description: credits the original attempt was worth
        constraints: "multiple of 0.25, 0.25..2.00"
      - name: outcome
        type: enum
        source: input
        description: outcome of the original attempt; only FAILED rows are credit-recovery eligible
        constraints: "FAILED | PASSED | INCOMPLETE"
      - name: original_grade_code
        type: enum
        source: computed
        description: "letter code from original_percent bands (>=90 A, >=80 B, >=70 C, >=60 D, else F); literal I when outcome == INCOMPLETE"
        constraints: "A | B | C | D | F | I"
      - name: replacement_status
        type: enum
        source: computed
        description: "NOT_REPLACED at creation; set to REPLACED by the award cascade when a CreditAward with grade_replacement_mode == FULL_REPLACEMENT posts against this row, and back to NOT_REPLACED when that award is voided"
        default: NOT_REPLACED
        constraints: "NOT_REPLACED | REPLACED"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student being referred to the center"
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id; receiving alternative education center"
      - name: prior_referral_id
        type: string
        source: input
        description: "FK -> Referral.id; nullable self-reference to the earlier referral this one re-opens; adds a re-referral priority bump"
        default: null
      - name: pathway
        type: enum
        source: input
        description: placement pathway claimed by the referring school; selects the priority weight set
        constraints: "BEHAVIOR | CREDIT_DEFICIENCY | RE_ENGAGEMENT"
      - name: deficiency_credits
        type: number
        source: input
        description: credits the student is behind at referral time; also the denominator of the placement credit component
        constraints: ">= 0, multiple of 0.25"
      - name: behavior_incident_count
        type: integer
        source: input
        description: office discipline referrals in the current year
        constraints: ">= 0"
      - name: days_disengaged
        type: integer
        source: input
        description: consecutive school days absent or unenrolled before this referral
        constraints: ">= 0"
      - name: narrative
        type: string
        source: input
        description: referring counselor narrative
        constraints: 1-2000 chars
      - name: priority_score
        type: number
        source: computed
        description: "pathway-weighted screening priority; see calculations.referral_priority_score"
      - name: status
        type: enum
        source: computed
        description: referral lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | SCREENING | INFO_REQUESTED | PLACEMENT_OFFERED | WAITLISTED | ACCEPTED | DENIED"
      - name: screening_note
        type: string
        source: input
        description: note recorded by the coordinator on the screen transition
        default: null
      - name: missing_items
        type: string
        source: input
        description: items the coordinator asked the home school to supply
        default: null
      - name: waitlist_reason
        type: string
        source: input
        description: reason recorded when the referral is parked on the waitlist
        default: null
      - name: denial_reason
        type: string
        source: input
        description: reason recorded on denial
        default: null
      - name: offer_expires_on
        type: string
        source: computed
        description: "informational offer expiry date (no sweep job expires it); set from the offer payload, or to clock_date + 5 days when the system promotes a WAITLISTED referral"
        default: null
      - name: promoted_from_waitlist
        type: boolean
        source: computed
        description: true when this referral reached PLACEMENT_OFFERED through the system waitlist promotion cascade rather than a coordinator offer
        default: false

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; accepted referral that produced this placement"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; placed student"
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id; center holding the seat"
      - name: credit_policy
        type: enum
        source: input
        description: "seat-time versus competency-based credit award policy chosen for this placement at accept-offer; selects the credit_award_credits variant"
        constraints: "SEAT_TIME | COMPETENCY"
      - name: start_date
        type: string
        source: input
        description: first day of attendance at the center (ISO date)
      - name: status
        type: enum
        source: computed
        description: placement lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | RE_ENTRY_PENDING | RE_ENTERED | EXITED_UNSUCCESSFUL"
      - name: days_present
        type: integer
        source: computed
        description: accumulator advanced by POST /placements/{id}/attendance (days_present_delta)
        default: 0
      - name: days_enrolled
        type: integer
        source: computed
        description: accumulator advanced by POST /placements/{id}/attendance (days_enrolled_delta)
        default: 0
      - name: attendance_rate
        type: number
        source: computed
        description: "round(days_present / days_enrolled, 4); null when days_enrolled == 0"
      - name: support_sessions_completed
        type: integer
        source: computed
        description: "count(SupportSession WHERE placement_id == this.id AND status == COMPLETED)"
      - name: attendance_component
        type: number
        source: computed
        description: "attendance_rate, or 0.0000 when attendance_rate is null"
      - name: pacing_component
        type: number
        source: computed
        description: "mean of min(1.0000, pace_index) over this placement's rated enrollments; see calculations.re_entry_readiness"
      - name: credit_component
        type: number
        source: computed
        description: "credit recovery progress against the referral deficiency; see calculations.re_entry_readiness"
      - name: readiness_base_score
        type: number
        source: computed
        description: "round(0.50*attendance_component + 0.30*pacing_component + 0.20*credit_component, 4)"
      - name: engagement_bonus
        type: number
        source: computed
        description: "support-engagement bonus whose tier is keyed on the rounded readiness_base_score; see calculations.re_entry_readiness"
      - name: readiness_score
        type: number
        source: computed
        description: "round(min(1.0000, readiness_base_score + engagement_bonus), 4)"
      - name: re_entry_eligible
        type: boolean
        source: computed
        description: "true when attendance_rate >= 0.9000 AND readiness_score >= 0.7500 AND no CourseEnrollment of this placement has integrity_state == FLAGGED AND the student's GraduationPlan (status IN {DRAFT, ACTIVE, COMPLETED}) has posture != OFF_TRACK"
      - name: re_entry_requested_by_user_id
        type: string
        source: system
        description: X-User-ID captured on request-re-entry
        default: null
      - name: target_re_entry_date
        type: string
        source: input
        description: requested home-school re-entry date (ISO date)
        default: null
      - name: actual_re_entry_date
        type: string
        source: input
        description: re-entry date confirmed by the home school (ISO date)
        default: null
      - name: re_entry_denial_reason
        type: string
        source: input
        description: reason recorded when the home school denies re-entry
        default: null
      - name: exit_reason
        type: string
        source: input
        description: reason recorded when the coordinator exits the placement without re-entry
        default: null

  - name: CourseEnrollment
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; placement the seat work is done under"
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; catalog course being taken"
      - name: prior_course_record_id
        type: string
        source: input
        description: "FK -> PriorCourseRecord.id; nullable; REQUIRED when enrollment_type == CREDIT_RECOVERY and must be a FAILED row for the same student and course"
        default: null
      - name: enrollment_type
        type: enum
        source: input
        description: credit recovery of a previously failed course versus first-time credit acquisition
        constraints: "CREDIT_RECOVERY | NEW_CREDIT"
      - name: progress_state
        type: enum
        source: computed
        description: academic award axis; independent of integrity_state
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | SUBMITTED_FOR_AWARD | AWARDED | AWARD_DENIED"
      - name: integrity_state
        type: enum
        source: computed
        description: testing-integrity axis; independent of progress_state
        default: CLEAR
        constraints: "CLEAR | FLAGGED | CLEARED | VOIDED_FOR_INTEGRITY"
      - name: enrolled_on
        type: string
        source: system
        description: logical-clock date (UTC) at creation; pacing baseline
      - name: modules_passed
        type: integer
        source: computed
        description: accumulator advanced by POST /course-enrollments/{id}/progress (modules_passed_delta); capped at Course.total_modules
        default: 0
      - name: seat_hours_logged
        type: number
        source: computed
        description: accumulator advanced by POST /course-enrollments/{id}/progress (seat_hours_delta)
        default: 0
      - name: module_avg_percent
        type: number
        source: computed
        description: latest module_avg_percent reported by the progress endpoint
        default: null
      - name: proctored_exam_percent
        type: number
        source: computed
        description: "score_percent of the latest COMPLETED ProctorSession for this enrollment ordered by created_at ASC (last one wins); null when none is COMPLETED"
        default: null
      - name: mastery_pct
        type: number
        source: computed
        description: "see calculations.enrollment_mastery_pct; null when module_avg_percent is null"
      - name: final_percent
        type: number
        source: input
        description: final course percent recorded at submit-for-award
        default: null
      - name: pace_index
        type: number
        source: computed
        description: "see calculations.enrollment_pace_index; null before any instructional day has elapsed"
      - name: pacing_flag
        type: enum
        source: computed
        description: pacing band derived from pace_index
        default: NOT_YET_RATED
        constraints: "NOT_YET_RATED | ON_PACE | BEHIND | CRITICAL"
      - name: projected_credits
        type: number
        source: computed
        description: "credit_award_credits evaluated against current progress data under the placement's credit_policy; what the award WOULD post right now"
      - name: awarded_credits
        type: number
        source: computed
        description: "credits_awarded of the POSTED CreditAward for this enrollment; null when no POSTED award exists"
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID captured at submit-for-award; segregation-of-duties comparand at award time
        default: null
      - name: integrity_incident_code
        type: string
        source: input
        description: incident code recorded when integrity is flagged
        default: null
      - name: integrity_resolution_note
        type: string
        source: input
        description: note recorded when a flag is resolved
        default: null
      - name: denial_reason
        type: string
        source: input
        description: reason recorded when the registrar denies the award
        default: null

  - name: CreditAward
    parent: null
    common_fields: true
    fields:
      - name: course_enrollment_id
        type: string
        source: input
        description: "FK -> CourseEnrollment.id; enrollment the credit was awarded for"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; denormalized from the enrollment's placement for transcript queries"
      - name: prior_course_record_id
        type: string
        source: input
        description: "FK -> PriorCourseRecord.id; nullable; historical row this award replaces or averages against"
        default: null
      - name: credits_awarded
        type: number
        source: computed
        description: "see calculations.credit_award_credits; quarter-credit granularity, floored PER AWARD"
      - name: award_basis
        type: enum
        source: computed
        description: copied from the placement's credit_policy at posting time
        constraints: "SEAT_TIME | COMPETENCY"
      - name: grade_replacement_mode
        type: enum
        source: computed
        description: "NONE when enrollment_type == NEW_CREDIT; otherwise FULL_REPLACEMENT or AVERAGED per the graduation plan's grade_replacement_policy"
        constraints: "NONE | FULL_REPLACEMENT | AVERAGED"
      - name: transcript_grade_code
        type: enum
        source: computed
        description: "letter code from CourseEnrollment.final_percent bands (>=90 A, >=80 B, >=70 C, else D; awards below min_passing_percent cannot be posted)"
        constraints: "A | B | C | D"
      - name: modality_code
        type: string
        source: computed
        description: "OL for ONLINE, PK for PACKET, BL for BLENDED"
      - name: alt_ed_flag
        type: boolean
        source: computed
        description: always true; every award posted here is alternative-education coded
      - name: transcript_code
        type: string
        source: computed
        description: "Course.code + '-' + modality_code + '-AE'"
      - name: ncaa_acceptable
        type: boolean
        source: computed
        description: "Course.ncaa_approved AND Course.proctoring_required AND a COMPLETED ProctorSession with integrity_incident == false exists for the enrollment AND credits_awarded == Course.credit_value"
      - name: status
        type: enum
        source: computed
        description: posting state
        default: POSTED
        constraints: "POSTED | VOIDED"
      - name: posted_on
        type: string
        source: system
        description: logical-clock date (UTC) at posting
      - name: void_reason
        type: string
        source: input
        description: reason recorded at void
        default: null

  - name: GraduationPlan
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; plan owner"
      - name: required_credits_total
        type: number
        source: input
        description: credits required by this student's (possibly modified) graduation plan
        constraints: "multiple of 0.25, 0.25..40.00"
      - name: grade_replacement_policy
        type: enum
        source: input
        description: "district grade-replacement flag governing credit-recovery awards on this plan; selects the transcript_gpa variant"
        constraints: "REPLACE_ON_RECOVERY | AVERAGE_ON_RECOVERY"
      - name: projected_completion_term
        type: string
        source: input
        description: term the plan projects completion in
        constraints: 1-16 chars
      - name: status
        type: enum
        source: computed
        description: "DRAFT at creation, ACTIVE after activate, COMPLETED when a posting cascade drives credits_earned >= required_credits_total; back to ACTIVE when a void drops it below"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | COMPLETED"
      - name: credits_earned
        type: number
        source: computed
        description: "Student.credits_earned_total of the plan owner"
      - name: credits_in_progress
        type: number
        source: computed
        description: "round(sum(CourseEnrollment.projected_credits WHERE the enrollment's placement.student_id == this.student_id AND progress_state IN {IN_PROGRESS, SUBMITTED_FOR_AWARD}), 2)"
      - name: credits_remaining
        type: number
        source: computed
        description: "round(max(0, required_credits_total - credits_earned), 2)"
      - name: expected_credits_by_grade
        type: number
        source: computed
        description: "round(required_credits_total * grade_progress_factor(Student.grade_level), 2) with factors 9:0.25, 10:0.50, 11:0.75, 12:1.00"
      - name: posture
        type: enum
        source: computed
        description: "cohort-accountability posture; see calculations.graduation_plan_posture"
        constraints: "ON_TRACK | AT_RISK | OFF_TRACK"

  - name: ProctorStation
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id; center the station physically sits in"
      - name: label
        type: string
        source: input
        description: room/seat label of the proctoring station
        constraints: 1-32 chars
      - name: station_type
        type: enum
        source: input
        description: station equipment type
        constraints: "COMPUTER | PAPER"
      - name: turnaround_buffer_minutes
        type: integer
        source: computed
        description: "fixed 15-minute sanitation/reset buffer appended to every booked session's end before the next booking may start"
        default: 15
      - name: scheduled_session_count
        type: integer
        source: computed
        description: "count(ProctorSession WHERE proctor_station_id == this.id AND status IN {SCHEDULED, COMPLETED})"

  - name: ProctorSession
    parent: null
    common_fields: true
    fields:
      - name: course_enrollment_id
        type: string
        source: input
        description: "FK -> CourseEnrollment.id; enrollment whose proctored exam this session delivers"
      - name: proctor_station_id
        type: string
        source: input
        description: "FK -> ProctorStation.id; station occupied by the session"
      - name: scheduled_start
        type: datetime
        source: input
        description: session start (ISO 8601 UTC, three fractional digits)
      - name: scheduled_end
        type: datetime
        source: input
        description: session end (ISO 8601 UTC); must be strictly after scheduled_start
      - name: status
        type: enum
        source: computed
        description: session lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | NO_SHOW"
      - name: score_percent
        type: number
        source: input
        description: proctored exam percent recorded at completion
        default: null
        constraints: "0..100, 2 decimal places"
      - name: integrity_incident
        type: boolean
        source: input
        description: true when the proctor observed an integrity incident; drives the integrity cascade at completion
        default: null
      - name: no_show_note
        type: string
        source: input
        description: note recorded when the student does not appear
        default: null

  - name: SupportProvider
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id; center the provider serves on site"
      - name: role_type
        type: enum
        source: input
        description: on-site support discipline
        constraints: "COUNSELOR | SOCIAL_WORKER | BEHAVIOR_SPECIALIST"
      - name: full_name
        type: string
        source: input
        description: provider name
        constraints: 1-120 chars
      - name: max_concurrent_students
        type: integer
        source: input
        description: students this provider may hold in one overlapping time band (group-session capacity)
        constraints: "1..8"
      - name: completed_session_count
        type: integer
        source: computed
        description: "count(SupportSession WHERE support_provider_id == this.id AND status == COMPLETED)"

  - name: SupportSession
    parent: null
    common_fields: true
    fields:
      - name: support_provider_id
        type: string
        source: input
        description: "FK -> SupportProvider.id; provider delivering the service"
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; placement receiving the service"
      - name: start_at
        type: datetime
        source: input
        description: session start (ISO 8601 UTC)
      - name: end_at
        type: datetime
        source: input
        description: session end (ISO 8601 UTC); must be strictly after start_at
      - name: service_code
        type: enum
        source: input
        description: support service delivered
        constraints: "ACADEMIC_COUNSELING | BEHAVIOR_COACHING | SOCIAL_WORK | RE_ENGAGEMENT_CHECKIN"
      - name: status
        type: enum
        source: computed
        description: session lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED"
      - name: minutes_delivered
        type: integer
        source: input
        description: minutes actually delivered, recorded at completion
        default: null
        constraints: "1..480"
      - name: completion_note
        type: string
        source: input
        description: note recorded at completion
        default: null

state_machines:
  - entity: Center
    initial_state: OPEN
    terminal_states: []
    note: |
      Center.intake_posture is a derived aggregate (posture_driven shape). No endpoint sets
      it directly; every transition below is a system re-derivation that runs at the end of
      any request that changes active_student_count, seats_reserved, or certified_teacher_fte,
      and again whenever the center is serialized. Evaluation order is fixed: FROZEN test
      first, then RESTRICTED, else OPEN.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system re-derivation after a seat or staffing change (offer, accept-offer, withdraw-offer, exit, approve-re-entry, PATCH /centers/{center_id}/staffing)"
        actor: system
        preconditions:
          - "NOT (seats_available <= 0 OR staffing_headroom <= 0)"
          - "seats_available <= restricted_seat_margin OR staffing_headroom <= 1"
        side_effects:
          - "intake_posture := RESTRICTED, which blocks POST /referrals/{referral_id}/offer with ERR_INTAKE_RESTRICTED but still permits POST /course-enrollments"
      - from: OPEN
        to: FROZEN
        trigger: "system re-derivation after a seat or staffing change"
        actor: system
        preconditions:
          - "seats_available <= 0 OR staffing_headroom <= 0"
        side_effects:
          - "intake_posture := FROZEN, which blocks POST /referrals/{referral_id}/offer with ERR_INTAKE_FROZEN and blocks POST /course-enrollments with ERR_INTAKE_FROZEN"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system re-derivation after a seat or staffing change"
        actor: system
        preconditions:
          - "seats_available <= 0 OR staffing_headroom <= 0"
        side_effects:
          - "intake_posture := FROZEN"
      - from: FROZEN
        to: OPEN
        trigger: "system re-derivation after a seat release (POST /placements/{placement_id}/exit, POST /placements/{placement_id}/approve-re-entry, POST /referrals/{referral_id}/withdraw-offer) or after PATCH /centers/{center_id}/staffing raises certified_teacher_fte"
        actor: system
        preconditions:
          - "seats_available > 0 AND staffing_headroom > 0"
          - "seats_available > restricted_seat_margin AND staffing_headroom > 1"
        side_effects:
          - "intake_posture := OPEN"
          - "waitlist promotion: the system then selects at most ONE Referral with status == WAITLISTED AND center_id == this.id, ranked by priority_score DESC then created_at ASC (tie-break created_at ASC), and transitions it WAITLISTED -> PLACEMENT_OFFERED with promoted_from_waitlist := true and offer_expires_on := clock_date + 5 days; when the candidate set is empty no promotion occurs and no error is raised"
          - "the promotion increments seats_reserved by 1, so intake_posture is re-derived a second time in the same request and may settle back to RESTRICTED or FROZEN"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system re-derivation after a seat release or staffing increase"
        actor: system
        preconditions:
          - "seats_available > 0 AND staffing_headroom > 0"
          - "seats_available <= restricted_seat_margin OR staffing_headroom <= 1"
        side_effects:
          - "intake_posture := RESTRICTED"
          - "no waitlist promotion occurs: promotion fires only on the transition into OPEN"
      - from: RESTRICTED
        to: OPEN
        trigger: "system re-derivation after a seat release or staffing increase"
        actor: system
        preconditions:
          - "seats_available > restricted_seat_margin AND staffing_headroom > 1"
        side_effects:
          - "intake_posture := OPEN"
          - "waitlist promotion runs with the same selector as FROZEN -> OPEN"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /referrals/{referral_id}/screen"
        actor: PlacementCoordinator
        preconditions:
          - "referral.status == SUBMITTED"
          - "X-User-ID == referral.center_id"
        side_effects:
          - "screening_note := payload.screening_note"
          - "increments Referral.version by 1"
      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /referrals/{referral_id}/request-info"
        actor: PlacementCoordinator
        preconditions:
          - "referral.status == SCREENING"
          - "X-User-ID == referral.center_id"
        side_effects:
          - "missing_items := payload.missing_items"
          - "increments Referral.version by 1"
      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /referrals/{referral_id}/resubmit"
        actor: HomeSchoolCounselor
        preconditions:
          - "referral.status == INFO_REQUESTED"
          - "X-User-ID == Student(referral.student_id).home_school_id"
        side_effects:
          - "narrative := payload.narrative; deficiency_credits / behavior_incident_count / days_disengaged are overwritten when supplied"
          - "recomputes priority_score from the updated inputs (calculations.referral_priority_score)"
          - "increments Referral.version by 1"
        note: "cycle: a referral may loop SCREENING -> INFO_REQUESTED -> SCREENING any number of times"
      - from: SCREENING
        to: PLACEMENT_OFFERED
        trigger: "POST /referrals/{referral_id}/offer"
        actor: PlacementCoordinator
        preconditions:
          - "referral.status == SCREENING"
          - "X-User-ID == referral.center_id"
          - "payload.expected_center_version == Center(referral.center_id).version"
          - "Center(referral.center_id).intake_posture == OPEN, or RESTRICTED when referral.pathway == BEHAVIOR or referral.priority_score >= 0.5000  (ERR_INTAKE_FROZEN when the posture is FROZEN, ERR_INTAKE_RESTRICTED otherwise)"
        side_effects:
          - "offer_expires_on := clock_date + payload.offer_valid_days (default 10 days); promoted_from_waitlist stays false"
          - "Center.seats_reserved increases by 1 and Center.intake_posture is re-derived"
          - "increments Center.version by 1 and Referral.version by 1"
      - from: SCREENING
        to: WAITLISTED
        trigger: "POST /referrals/{referral_id}/waitlist"
        actor: PlacementCoordinator
        preconditions:
          - "referral.status == SCREENING"
          - "X-User-ID == referral.center_id"
        side_effects:
          - "waitlist_reason := payload.waitlist_reason; no seat is reserved"
          - "increments Referral.version by 1"
      - from: SCREENING
        to: DENIED
        trigger: "POST /referrals/{referral_id}/deny"
        actor: PlacementCoordinator
        preconditions:
          - "referral.status == SCREENING"
          - "X-User-ID == referral.center_id"
        side_effects:
          - "denial_reason := payload.denial_reason"
          - "increments Referral.version by 1"
      - from: WAITLISTED
        to: PLACEMENT_OFFERED
        trigger: "system waitlist promotion fired by Center RESTRICTED|FROZEN -> OPEN re-derivation"
        actor: system
        preconditions:
          - "referral.status == WAITLISTED"
          - "this referral is the single selector winner (priority_score DESC, then created_at ASC) among WAITLISTED referrals of that center"
        side_effects:
          - "promoted_from_waitlist := true; offer_expires_on := clock_date + 5 days"
          - "Center.seats_reserved increases by 1 and Center.intake_posture is re-derived again"
          - "increments Referral.version by 1"
      - from: PLACEMENT_OFFERED
        to: SCREENING
        trigger: "POST /referrals/{referral_id}/withdraw-offer"
        actor: PlacementCoordinator
        preconditions:
          - "referral.status == PLACEMENT_OFFERED"
          - "X-User-ID == referral.center_id"
        side_effects:
          - "offer_expires_on := null; promoted_from_waitlist := false"
          - "Center.seats_reserved decreases by 1 and Center.intake_posture is re-derived; the invariant seats_available + seats_committed == seat_capacity is restored to its pre-offer value"
          - "increments Center.version by 1 and Referral.version by 1"
        note: "compensating action for SCREENING -> PLACEMENT_OFFERED"
      - from: PLACEMENT_OFFERED
        to: ACCEPTED
        trigger: "POST /referrals/{referral_id}/accept-offer"
        actor: HomeSchoolCounselor
        preconditions:
          - "referral.status == PLACEMENT_OFFERED"
          - "X-User-ID == Student(referral.student_id).home_school_id"
        side_effects:
          - "creates Placement { referral_id, student_id, center_id copied from the referral, credit_policy := payload.credit_policy, start_date := payload.start_date, status := ACTIVE }"
          - "the reserved seat converts to a committed seat: seats_reserved decreases by 1, active_student_count increases by 1, so seats_committed is unchanged and Center.intake_posture is re-derived"
          - "Student.status := PLACED_ALT"
          - "increments Center.version by 1 and Referral.version by 1"

  - entity: Placement
    initial_state: ACTIVE
    terminal_states: [RE_ENTERED, EXITED_UNSUCCESSFUL]
    transitions:
      - from: ACTIVE
        to: RE_ENTRY_PENDING
        trigger: "POST /placements/{placement_id}/request-re-entry"
        actor: PlacementCoordinator | DistrictAdmin
        preconditions:
          - "placement.status == ACTIVE"
          - "GraduationPlan(placement.student_id).posture != OFF_TRACK  (ERR_PLAN_POSTURE_BLOCKS_RE_ENTRY)"
          - "placement.attendance_rate != null AND placement.attendance_rate >= 0.9000  (ERR_ATTENDANCE_BELOW_MINIMUM)"
          - "placement.readiness_score >= 0.7500  (ERR_READINESS_BELOW_THRESHOLD)"
          - "no CourseEnrollment of this placement has integrity_state == FLAGGED  (ERR_INTEGRITY_HOLD)"
        side_effects:
          - "target_re_entry_date := payload.target_re_entry_date"
          - "re_entry_requested_by_user_id := X-User-ID"
          - "the seat is NOT released yet: status RE_ENTRY_PENDING still counts inside Center.active_student_count"
          - "increments Placement.version by 1"
      - from: RE_ENTRY_PENDING
        to: ACTIVE
        trigger: "POST /placements/{placement_id}/deny-re-entry"
        actor: DistrictAdmin
        preconditions:
          - "placement.status == RE_ENTRY_PENDING"
        side_effects:
          - "re_entry_denial_reason := payload.re_entry_denial_reason; target_re_entry_date := null; re_entry_requested_by_user_id := null"
          - "increments Placement.version by 1"
        note: "cycle: the home school may bounce a re-entry request back any number of times"
      - from: RE_ENTRY_PENDING
        to: RE_ENTERED
        trigger: "POST /placements/{placement_id}/approve-re-entry"
        actor: DistrictAdmin
        preconditions:
          - "placement.status == RE_ENTRY_PENDING"
          - "X-User-ID != placement.re_entry_requested_by_user_id  (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "actual_re_entry_date := payload.actual_re_entry_date"
          - "Student.status := RE_ENTERED"
          - "the seat is released: active_student_count decreases by 1, so Center.seats_committed decreases by 1, Center.intake_posture is re-derived, and a WAITLISTED referral may be promoted per the Center transitions"
          - "increments Center.version by 1 and Placement.version by 1"
      - from: ACTIVE
        to: EXITED_UNSUCCESSFUL
        trigger: "POST /placements/{placement_id}/exit"
        actor: PlacementCoordinator
        preconditions:
          - "placement.status == ACTIVE"
          - "X-User-ID == placement.center_id"
        side_effects:
          - "exit_reason := payload.exit_reason"
          - "Student.status := EXITED_ALT"
          - "every CourseEnrollment of this placement with progress_state IN {IN_PROGRESS, SUBMITTED_FOR_AWARD} transitions to AWARD_DENIED with denial_reason := 'PLACEMENT_EXITED' (conditional cascade: enrollments already AWARDED or AWARD_DENIED are untouched)"
          - "the seat is released: active_student_count decreases by 1, so Center.seats_committed decreases by 1 and Center.intake_posture is re-derived, which may promote one WAITLISTED referral per the Center transitions and re-derive posture again"
          - "increments Center.version by 1 and Placement.version by 1"
      - from: RE_ENTRY_PENDING
        to: EXITED_UNSUCCESSFUL
        trigger: "POST /placements/{placement_id}/exit"
        actor: PlacementCoordinator
        preconditions:
          - "placement.status == RE_ENTRY_PENDING"
          - "X-User-ID == placement.center_id"
        side_effects:
          - "same side-effect set as ACTIVE -> EXITED_UNSUCCESSFUL, including the seat release and waitlist promotion cascade"

  - entity: CourseEnrollment
    initial_state: IN_PROGRESS
    terminal_states: [AWARDED, AWARD_DENIED]
    note: |
      CourseEnrollment carries two independent state axes on the same row. progress_state moves
      IN_PROGRESS -> SUBMITTED_FOR_AWARD -> AWARDED | AWARD_DENIED. integrity_state moves
      CLEAR -> FLAGGED -> CLEARED | VOIDED_FOR_INTEGRITY. Neither axis constrains which value the
      other holds; only the award transition reads integrity_state as a precondition. The states
      listed in initial_state/terminal_states describe the progress_state axis; integrity_state
      starts at CLEAR and its terminal values are CLEARED and VOIDED_FOR_INTEGRITY.
    transitions:
      - from: IN_PROGRESS
        to: SUBMITTED_FOR_AWARD
        trigger: "POST /course-enrollments/{course_enrollment_id}/submit-for-award"
        actor: AltEdTeacher | Registrar
        preconditions:
          - "enrollment.progress_state == IN_PROGRESS"
          - "Placement(enrollment.placement_id).status == ACTIVE"
          - "Course(enrollment.course_id).proctoring_required == false OR at least one ProctorSession of this enrollment has status == COMPLETED  (ERR_PROCTORED_EXAM_MISSING)"
        side_effects:
          - "final_percent := payload.final_percent"
          - "submitted_by_user_id := X-User-ID (segregation-of-duties comparand at award time)"
          - "increments CourseEnrollment.version by 1"
      - from: SUBMITTED_FOR_AWARD
        to: AWARDED
        trigger: "POST /course-enrollments/{course_enrollment_id}/award-credit"
        actor: Registrar
        preconditions:
          - "enrollment.progress_state == SUBMITTED_FOR_AWARD"
          - "X-User-ID != enrollment.submitted_by_user_id  (ERR_SEGREGATION_OF_DUTIES)"
          - "payload.expected_graduation_plan_version == GraduationPlan(student).version"
          - "GraduationPlan(student).status == ACTIVE  (ERR_PLAN_STATE_INVALID)"
          - "enrollment.final_percent >= Course(enrollment.course_id).min_passing_percent  (ERR_FINAL_PERCENT_BELOW_PASSING)"
          - "enrollment.integrity_state IN {CLEAR, CLEARED}  (ERR_INTEGRITY_HOLD)"
          - "computed credits_awarded > 0  (ERR_MASTERY_NOT_MET when award_basis == COMPETENCY, ERR_SEAT_TIME_INSUFFICIENT when award_basis == SEAT_TIME)"
          - "when enrollment_type == CREDIT_RECOVERY, PriorCourseRecord(prior_course_record_id).replacement_status == NOT_REPLACED  (ERR_PRIOR_RECORD_ALREADY_REPLACED)"
        side_effects:
          - "hop 1: progress_state := AWARDED and a CreditAward row is created with status POSTED, credits_awarded / award_basis / transcript coding computed per calculations.credit_award_credits and calculations.transcript_coding"
          - "hop 2: the new POSTED CreditAward mutates the linked PriorCourseRecord when grade_replacement_mode == FULL_REPLACEMENT (replacement_status := REPLACED, dropping that row out of the GPA input set), which changes Student.credits_earned_total, Student.alt_ed_credits, Student.ncaa_acceptable_credits and Student.gpa"
          - "hop 3: the changed Student.credits_earned_total changes GraduationPlan.credits_earned, credits_remaining and posture; when credits_earned >= required_credits_total the plan transitions ACTIVE -> COMPLETED and Student.status := GRADUATED"
          - "hop 4: a Student.status change to GRADUATED changes HomeSchool.graduates_count, HomeSchool.adjusted_grad_rate and HomeSchool.cohort_flag"
          - "increments CourseEnrollment.version by 1 and GraduationPlan.version by 1"
      - from: SUBMITTED_FOR_AWARD
        to: AWARD_DENIED
        trigger: "POST /course-enrollments/{course_enrollment_id}/deny-award"
        actor: Registrar
        preconditions:
          - "enrollment.progress_state == SUBMITTED_FOR_AWARD"
        side_effects:
          - "denial_reason := payload.denial_reason; final_percent is retained for audit"
          - "no CreditAward is created; the linked PriorCourseRecord keeps replacement_status == NOT_REPLACED"
          - "increments CourseEnrollment.version by 1"
      - from: IN_PROGRESS
        to: AWARD_DENIED
        trigger: "system cascade from POST /placements/{placement_id}/exit"
        actor: system
        preconditions:
          - "the owning Placement transitions to EXITED_UNSUCCESSFUL"
          - "enrollment.progress_state == IN_PROGRESS"
        side_effects:
          - "denial_reason := 'PLACEMENT_EXITED'"
          - "increments CourseEnrollment.version by 1"
      - from: SUBMITTED_FOR_AWARD
        to: AWARD_DENIED
        trigger: "system cascade from POST /placements/{placement_id}/exit"
        actor: system
        preconditions:
          - "the owning Placement transitions to EXITED_UNSUCCESSFUL"
          - "enrollment.progress_state == SUBMITTED_FOR_AWARD"
        side_effects:
          - "denial_reason := 'PLACEMENT_EXITED'"
          - "increments CourseEnrollment.version by 1"
      - from: CLEAR
        to: FLAGGED
        trigger: "POST /course-enrollments/{course_enrollment_id}/flag-integrity, or system cascade when a ProctorSession completes with integrity_incident == true"
        actor: PlacementCoordinator | DistrictAdmin | system
        preconditions:
          - "enrollment.integrity_state == CLEAR"
        side_effects:
          - "integrity_incident_code := payload.integrity_incident_code (or 'PROCTOR_INCIDENT' when raised by the session cascade)"
          - "progress_state is NOT changed by this transition"
          - "Placement.re_entry_eligible becomes false while any enrollment of the placement is FLAGGED"
          - "increments CourseEnrollment.version by 1"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /course-enrollments/{course_enrollment_id}/resolve-integrity with resolution == CLEARED"
        actor: DistrictAdmin
        preconditions:
          - "enrollment.integrity_state == FLAGGED"
        side_effects:
          - "integrity_resolution_note := payload.integrity_resolution_note; the award path unblocks because CLEARED is accepted by the award precondition"
          - "increments CourseEnrollment.version by 1"
      - from: FLAGGED
        to: VOIDED_FOR_INTEGRITY
        trigger: "POST /course-enrollments/{course_enrollment_id}/resolve-integrity with resolution == VOIDED_FOR_INTEGRITY"
        actor: DistrictAdmin
        preconditions:
          - "enrollment.integrity_state == FLAGGED"
        side_effects:
          - "integrity_resolution_note := payload.integrity_resolution_note"
          - "when a POSTED CreditAward exists for this enrollment it is voided with void_reason := 'INTEGRITY_VOID', which runs the full void compensation cascade declared under CreditAward POSTED -> VOIDED"
          - "increments CourseEnrollment.version by 1"

  - entity: CreditAward
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /credit-awards/{credit_award_id}/void, or system cascade from resolve-integrity with resolution == VOIDED_FOR_INTEGRITY"
        actor: Registrar | system
        preconditions:
          - "award.status == POSTED  (ERR_AWARD_STATE_INVALID)"
        side_effects:
          - "hop 1: status := VOIDED and void_reason := payload.void_reason (or 'INTEGRITY_VOID' from the cascade); the row drops out of every POSTED aggregate"
          - "hop 2: the linked PriorCourseRecord returns to replacement_status := NOT_REPLACED when this award had grade_replacement_mode == FULL_REPLACEMENT, so that historical row re-enters the GPA input set; Student.credits_earned_total, alt_ed_credits, ncaa_acceptable_credits and gpa are restored to their pre-award values"
          - "hop 3: GraduationPlan.credits_earned / credits_remaining / posture are recomputed; a plan in COMPLETED whose credits_earned drops below required_credits_total transitions COMPLETED -> ACTIVE and Student.status is re-derived from the student's placements (RE_ENTERED if the latest placement is RE_ENTERED, PLACED_ALT if any placement is ACTIVE or RE_ENTRY_PENDING, EXITED_ALT if the latest placement is EXITED_UNSUCCESSFUL, else ENROLLED_HOME)"
          - "hop 4: the Student.status change away from GRADUATED restores HomeSchool.graduates_count, adjusted_grad_rate and cohort_flag"
          - "increments CreditAward.version by 1 and GraduationPlan.version by 1"
        note: "compensating action for the award cascade; the named conserved quantity is the credit ledger (see calculations.credit_ledger_invariant)"

  - entity: GraduationPlan
    initial_state: DRAFT
    terminal_states: []
    note: "compound shape: status COMPLETED and posture are both functions of the student's CreditAward and PriorCourseRecord children."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /graduation-plans/{graduation_plan_id}/activate"
        actor: Registrar
        preconditions:
          - "plan.status == DRAFT"
        side_effects:
          - "status := ACTIVE, which unblocks POST /course-enrollments/{course_enrollment_id}/award-credit for this student"
          - "increments GraduationPlan.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system cascade from a POSTED CreditAward (hop 3 of the award cascade)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "credits_earned >= required_credits_total"
        side_effects:
          - "status := COMPLETED; posture reads ON_TRACK for a COMPLETED plan regardless of expected_credits_by_grade"
          - "Student.status := GRADUATED, which cascades into the HomeSchool cohort aggregates"
          - "increments GraduationPlan.version by 1"
      - from: COMPLETED
        to: ACTIVE
        trigger: "system cascade from a VOIDED CreditAward (hop 3 of the void compensation)"
        actor: system
        preconditions:
          - "plan.status == COMPLETED"
          - "credits_earned < required_credits_total"
        side_effects:
          - "status := ACTIVE; Student.status is re-derived from placements and leaves GRADUATED"
          - "increments GraduationPlan.version by 1"

  - entity: ProctorSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /proctor-sessions/{proctor_session_id}/complete"
        actor: PlacementCoordinator
        preconditions:
          - "session.status == SCHEDULED  (ERR_SESSION_STATE_INVALID)"
        side_effects:
          - "score_percent := payload.score_percent; integrity_incident := payload.integrity_incident"
          - "the enrollment's proctored_exam_percent now resolves to this session's score_percent (latest COMPLETED by created_at ASC), which changes CourseEnrollment.mastery_pct and projected_credits"
          - "when payload.integrity_incident == true the enrollment transitions integrity_state CLEAR -> FLAGGED with integrity_incident_code := 'PROCTOR_INCIDENT'"
          - "increments ProctorSession.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /proctor-sessions/{proctor_session_id}/no-show"
        actor: PlacementCoordinator
        preconditions:
          - "session.status == SCHEDULED  (ERR_SESSION_STATE_INVALID)"
        side_effects:
          - "no_show_note := payload.no_show_note; the station interval is released, so it no longer blocks new bookings (only SCHEDULED and COMPLETED sessions occupy a station)"
          - "increments ProctorSession.version by 1"

  - entity: SupportSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /support-sessions/{support_session_id}/complete"
        actor: SupportProviderStaff
        preconditions:
          - "session.status == SCHEDULED  (ERR_SUPPORT_SESSION_STATE_INVALID)"
          - "X-User-ID == session.support_provider_id"
        side_effects:
          - "minutes_delivered := payload.minutes_delivered; completion_note := payload.completion_note"
          - "Placement.support_sessions_completed increases by 1, which can raise Placement.engagement_bonus and therefore readiness_score"
          - "increments SupportSession.version by 1"

concurrency_rules:
  - rule_id: enrollment-create-stale-placement
    parent_entity: Placement
    write_endpoint: "POST /course-enrollments"
    occ_field: "expected_placement_version"
    description: |
      Creating a CourseEnrollment against a Placement whose version has advanced since the
      client last read it is rejected with a stale-version error. A placement's version moves
      on attendance postings, re-entry requests and re-entry denials, and a second enrollment
      is otherwise a legitimate operation, so the stale-version check is the only guard that
      keeps a caller from adding coursework to a placement it no longer understands.
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412

  - rule_id: award-credit-stale-plan
    parent_entity: GraduationPlan
    write_endpoint: "POST /course-enrollments/{course_enrollment_id}/award-credit"
    occ_field: "expected_graduation_plan_version"
    description: |
      Posting a credit award against a GraduationPlan whose version has advanced since the
      registrar last read it is rejected with a stale-version error. Every posted award bumps
      the plan version through the credit cascade, so a registrar working from a plan snapshot
      taken before another award posted would otherwise post a second award on top of a
      transcript picture that no longer holds.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: offer-stale-center
    parent_entity: Center
    write_endpoint: "POST /referrals/{referral_id}/offer"
    occ_field: "expected_center_version"
    description: |
      Offering a seat against a Center whose version has advanced since the coordinator read
      the seat picture is rejected with a stale-version error. Offers, withdrawals, acceptances,
      exits, re-entry approvals and staffing changes all bump the center version, and a second
      offer is itself a legitimate operation whenever the posture is still OPEN, so the version
      check is what stops a coordinator from committing a seat off a stale seat count.
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412

  - rule_id: staffing-update-stale-center
    parent_entity: Center
    write_endpoint: "PATCH /centers/{center_id}/staffing"
    occ_field: "expected_center_version"
    description: |
      Updating certified or support staffing FTE against a Center whose version has advanced
      since it was read is rejected with a stale-version error. Staffing edits are otherwise
      legitimate at any time, and the derived staffing_headroom and intake_posture depend on the
      seat picture the editor believed was current, so the version check prevents a staffing edit
      computed against an outdated roster.
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412

calculations:
  - name: center_intake_posture
    trigger: "derived on every Center read and re-derived at the end of any request that changes active_student_count, seats_reserved or certified_teacher_fte (offer, withdraw-offer, accept-offer, exit, approve-re-entry, PATCH /centers/{center_id}/staffing)"
    algorithm: threshold
    formula: |
      restricted_seat_margin = floor(seat_capacity * 0.10)
      active_student_count   = count(Placement WHERE center_id == C.id AND status IN {ACTIVE, RE_ENTRY_PENDING})
      seats_reserved         = count(Referral  WHERE center_id == C.id AND status == PLACEMENT_OFFERED)
      seats_committed        = active_student_count + seats_reserved
      seats_available        = seat_capacity - seats_committed
      student_teacher_ratio  = round(active_student_count / certified_teacher_fte, 2)
      staffing_headroom      = floor(certified_teacher_fte * max_students_per_teacher) - active_student_count
      # Evaluation order is fixed and the first matching branch wins.
      if seats_available <= 0 or staffing_headroom <= 0:
          intake_posture = FROZEN
      elif seats_available <= restricted_seat_margin or staffing_headroom <= 1:
          intake_posture = RESTRICTED
      else:
          intake_posture = OPEN
    input_set: "Placements in status ACTIVE or RE_ENTRY_PENDING only (RE_ENTERED and EXITED_UNSUCCESSFUL release the seat); Referrals in status PLACEMENT_OFFERED only (WAITLISTED reserves nothing)"
    constants:
      RESTRICTED_MARGIN_FRACTION: 0.10
      STAFFING_HEADROOM_RESTRICTED_AT: 1
    precision: "ratio 2 decimal places round_half_up; margins and headroom are integers via floor"
    variants: []

  - name: cohort_accountability
    trigger: "derived on every HomeSchool read; the values move whenever a Student in the accountability cohort changes status (hop 4 of the award cascade and of the void compensation)"
    algorithm: aggregation
    formula: |
      cohort           = Students WHERE home_school_id == H.id AND cohort_year == H.accountability_cohort_year
      cohort_size      = count(cohort)
      graduates_count  = count(cohort WHERE status == GRADUATED)
      alt_ed_placed_count = count(distinct s in cohort WHERE exists Placement WHERE student_id == s.id)
      if cohort_size == 0:
          adjusted_grad_rate = null
          cohort_flag        = NOT_RATED
      else:
          adjusted_grad_rate = round(graduates_count / cohort_size, 4)
          cohort_flag = COMPLIANT if adjusted_grad_rate >= 0.8500
                        else WATCH  if adjusted_grad_rate >= 0.7000
                        else PRIORITY
    input_set: "all Students of the home school whose cohort_year equals the school's accountability_cohort_year, in any status; Placements in any status count toward alt_ed_placed_count"
    constants:
      COMPLIANT_AT: 0.8500
      WATCH_AT: 0.7000
    precision: "rate 4 decimal places round_half_up"
    variants: []

  - name: referral_priority_score
    trigger: "computed on POST /referrals and recomputed on POST /referrals/{referral_id}/resubmit"
    algorithm: weighted_scoring
    formula: |
      deficiency_component    = round(min(1.0000, deficiency_credits / 8.00), 4)
      behavior_component      = round(min(1.0000, behavior_incident_count / 5), 4)
      disengagement_component = round(min(1.0000, days_disengaged / 30), 4)
      # Weight set is selected by pathway (three inputs, non-linear interaction through
      # the min() caps and the pathway branch).
      weights = { CREDIT_DEFICIENCY: (0.60, 0.20, 0.20),
                  BEHAVIOR:          (0.20, 0.60, 0.20),
                  RE_ENGAGEMENT:     (0.20, 0.20, 0.60) }[pathway]
      base = round( round(weights[0] * deficiency_component, 4)
                  + round(weights[1] * behavior_component, 4)
                  + round(weights[2] * disengagement_component, 4), 4)
      priority_score = round(min(1.0000, base + 0.0500), 4) if prior_referral_id != null else base
    input_set: "the referral's own three intake counters plus its pathway; the re-referral bump applies whenever prior_referral_id is non-null, regardless of the prior referral's status"
    constants:
      DEFICIENCY_CAP_CREDITS: 8.00
      BEHAVIOR_CAP_INCIDENTS: 5
      DISENGAGEMENT_CAP_DAYS: 30
      RE_REFERRAL_BUMP: 0.0500
    precision: "4 decimal places round_half_up; each weighted term is rounded before summing"
    variants: []

  - name: enrollment_pace_index
    trigger: "derived on every CourseEnrollment read and after POST /course-enrollments/{course_enrollment_id}/progress"
    algorithm: threshold
    formula: |
      elapsed_days      = date_diff_days(clock_date_utc, enrolled_on)     # 0 on the enrollment day
      if elapsed_days == 0:
          pace_index  = null
          pacing_flag = NOT_YET_RATED
      else:
          expected_fraction = min(1.0000, round(elapsed_days / Course.pacing_days, 4))
          actual_fraction   = round(min(Course.total_modules, modules_passed) / Course.total_modules, 4)
          pace_index        = round(actual_fraction / expected_fraction, 3)
          pacing_flag = ON_PACE  if pace_index >= 0.900
                        else BEHIND if pace_index >= 0.700
                        else CRITICAL
    input_set: "the enrollment's own modules_passed accumulator, its course's total_modules and pacing_days, and the logical clock date"
    constants:
      ON_PACE_AT: 0.900
      BEHIND_AT: 0.700
    precision: "fractions 4 decimal places, pace_index 3 decimal places, round_half_up"
    variants: []

  - name: enrollment_mastery_pct
    trigger: "derived on every CourseEnrollment read; the value moves after POST /course-enrollments/{course_enrollment_id}/progress and after POST /proctor-sessions/{proctor_session_id}/complete"
    algorithm: weighted_scoring
    formula: |
      if module_avg_percent is null:
          mastery_pct = null
      elif Course.proctoring_required and proctored_exam_percent is not null:
          mastery_pct = round((1 - Course.proctored_exam_weight) * module_avg_percent
                              + Course.proctored_exam_weight * proctored_exam_percent, 2)
      else:
          mastery_pct = round(module_avg_percent, 2)
    input_set: "latest module_avg_percent reported by the progress endpoint and the score_percent of the latest COMPLETED ProctorSession for this enrollment ordered by created_at ASC"
    precision: "2 decimal places round_half_up"
    variants: []

  - name: credit_award_credits
    trigger: "computed at POST /course-enrollments/{course_enrollment_id}/award-credit (hop 1 of the award cascade) and continuously exposed as CourseEnrollment.projected_credits"
    algorithm: tiered_pricing
    formula: |
      # QUARTER-CREDIT FLOOR IS APPLIED PER AWARD, NEVER ON AN AGGREGATE.
      # Two 0.375-of-credit enrollments therefore post 0.25 + 0.25 = 0.50 credits, not
      # floor(0.75 * 4)/4 = 0.75. GraduationPlan.credits_earned sums the already-floored
      # per-award values; it never re-floors or floors a summed fraction.
      def floor_quarter(x): return floor(x * 4) / 4
      if Placement.credit_policy == SEAT_TIME:
          seat_fraction  = min(1.0000, round(seat_hours_logged / Course.required_seat_hours, 4))
          credits_awarded = floor_quarter(Course.credit_value * seat_fraction)
      else:  # COMPETENCY
          module_fraction = round(min(Course.total_modules, modules_passed) / Course.total_modules, 4)
          if mastery_pct >= 80.00:
              credits_awarded = Course.credit_value
          elif mastery_pct >= 70.00:
              credits_awarded = floor_quarter(Course.credit_value * module_fraction)
          else:
              credits_awarded = 0.00
    input_set: "the enrollment's own accumulators (seat_hours_logged, modules_passed), its mastery_pct, the course's credit_value / required_seat_hours / total_modules, and the credit_policy flag on the owning Placement"
    constants:
      FULL_CREDIT_MASTERY_AT: 80.00
      PARTIAL_CREDIT_MASTERY_AT: 70.00
      CREDIT_GRANULARITY: 0.25
    precision: "credits are floored to a multiple of 0.25; fractions 4 decimal places round_half_up before flooring"
    variants:
      - name: seat_time_award
        when: "Placement.credit_policy == SEAT_TIME (seat-hour accounting: the student is paid for time in the seat)"
        difference: "credits scale linearly with seat_hours_logged / required_seat_hours and ignore mastery_pct entirely; an award computing to 0.00 is refused with ERR_SEAT_TIME_INSUFFICIENT"
      - name: competency_award
        when: "Placement.credit_policy == COMPETENCY (mastery accounting: the student is paid for demonstrated mastery)"
        difference: "mastery_pct >= 80.00 pays the full credit_value regardless of seat hours or unfinished modules; 70.00..79.99 pays the module-fraction share; below 70.00 the award is refused with ERR_MASTERY_NOT_MET"

  - name: transcript_gpa
    trigger: "derived on every Student read; the value moves at hop 2 of the award cascade and hop 2 of the void compensation"
    algorithm: aggregation
    formula: |
      grade_points = { A: 4.0, B: 3.0, C: 2.0, D: 1.0, F: 0.0 }
      rows = []
      # historical transcript rows
      for p in PriorCourseRecord WHERE student_id == S.id
                                 AND replacement_status == NOT_REPLACED
                                 AND outcome IN {FAILED, PASSED}:            # INCOMPLETE never counts
          rows.append((grade_points[p.original_grade_code], p.credits_attempted))
      # alternative-education awards
      for a in CreditAward WHERE student_id == S.id AND status == POSTED AND credits_awarded > 0:
          rows.append((grade_points[a.transcript_grade_code], a.credits_awarded))
      # ROUNDING ORDER IS PINNED: per-row quality points are rounded to 3 decimals FIRST,
      # then summed; the quotient is rounded to 2 decimals last.
      quality_sum   = sum(round(gp * cr, 3) for (gp, cr) in rows)
      credits_sum   = sum(cr for (gp, cr) in rows)
      gpa = null if credits_sum == 0 else round(quality_sum / credits_sum, 2)
    input_set: "PriorCourseRecords with replacement_status == NOT_REPLACED and outcome in {FAILED, PASSED}, plus CreditAwards with status == POSTED and credits_awarded > 0; rows are unordered because addition is the only combining operation"
    constants:
      GRADE_POINTS: "A=4.0, B=3.0, C=2.0, D=1.0, F=0.0"
    precision: "per-row quality points 3 decimal places, GPA 2 decimal places, both round_half_up"
    variants:
      - name: replace_on_recovery
        when: "the student's GraduationPlan has grade_replacement_policy == REPLACE_ON_RECOVERY and a CREDIT_RECOVERY award posts (grade_replacement_mode == FULL_REPLACEMENT)"
        difference: "the failed PriorCourseRecord is stamped REPLACED and leaves the input set entirely, so only the recovery grade counts and the denominator holds the recovery credits alone"
      - name: average_on_recovery
        when: "the student's GraduationPlan has grade_replacement_policy == AVERAGE_ON_RECOVERY and a CREDIT_RECOVERY award posts (grade_replacement_mode == AVERAGED)"
        difference: "the failed PriorCourseRecord stays NOT_REPLACED and both rows count, so the original F contributes 0.000 quality points on its credits and the denominator holds both attempts — the same academic data yields a materially lower GPA"

  - name: transcript_coding
    trigger: "computed at POST /course-enrollments/{course_enrollment_id}/award-credit (hop 1 of the award cascade)"
    algorithm: constraint_propagation
    formula: |
      modality_code = { ONLINE: "OL", PACKET: "PK", BLENDED: "BL" }[Course.modality]
      transcript_code = Course.code + "-" + modality_code + "-AE"
      alt_ed_flag = true
      transcript_grade_code = A if final_percent >= 90 else B if final_percent >= 80
                              else C if final_percent >= 70 else D
      proctor_ok = exists ProctorSession WHERE course_enrollment_id == E.id
                                         AND status == COMPLETED
                                         AND integrity_incident == false
      ncaa_acceptable = Course.ncaa_approved
                        and Course.proctoring_required
                        and proctor_ok
                        and credits_awarded == Course.credit_value
      grade_replacement_mode = NONE if enrollment_type == NEW_CREDIT
                               else FULL_REPLACEMENT if GraduationPlan.grade_replacement_policy == REPLACE_ON_RECOVERY
                               else AVERAGED
    input_set: "the awarded enrollment, its course catalog row, its COMPLETED proctor sessions, and the student's graduation plan flag"
    constants:
      TRANSCRIPT_SUFFIX: "-AE"
    precision: "n/a (string and boolean derivation)"
    variants: []

  - name: graduation_plan_posture
    trigger: "derived on every GraduationPlan read; the value moves at hop 3 of the award cascade and hop 3 of the void compensation"
    algorithm: threshold
    formula: |
      factor = { 9: 0.25, 10: 0.50, 11: 0.75, 12: 1.00 }[Student.grade_level]
      expected_credits_by_grade = round(required_credits_total * factor, 2)
      credits_earned            = Student.credits_earned_total
      if status == COMPLETED:
          posture = ON_TRACK
      elif credits_earned >= round(expected_credits_by_grade * 0.95, 2):
          posture = ON_TRACK
      elif credits_earned >= round(expected_credits_by_grade * 0.80, 2):
          posture = AT_RISK
      else:
          posture = OFF_TRACK
    input_set: "the plan's required_credits_total, the owner's grade_level, and Student.credits_earned_total (PASSED prior credits plus POSTED award credits)"
    constants:
      ON_TRACK_FRACTION: 0.95
      AT_RISK_FRACTION: 0.80
    precision: "credits and thresholds 2 decimal places round_half_up; comparisons use the rounded threshold"
    variants: []

  - name: re_entry_readiness
    trigger: "derived on every Placement read and checked as a precondition of POST /placements/{placement_id}/request-re-entry"
    algorithm: weighted_scoring
    formula: |
      # Circular-looking dependency: readiness_score = base + engagement_bonus, while the
      # engagement_bonus TIER is keyed on base itself. The evaluation order below is pinned so
      # the value is well defined: components -> rounded base -> tier lookup on the ROUNDED base
      # -> readiness. The bonus is never re-tiered against readiness_score, and no fixed-point
      # iteration is performed.
      attendance_component = attendance_rate if attendance_rate is not null else 0.0000
      rated = CourseEnrollments WHERE placement_id == P.id
                                AND progress_state IN {IN_PROGRESS, SUBMITTED_FOR_AWARD, AWARDED}
      if count(rated) == 0:
          pacing_component = 0.0000
      else:
          terms = [ min(1.0000, e.pace_index) if e.pace_index is not null else 1.0000 for e in rated ]
          pacing_component = round(sum(terms) / count(rated), 4)
      placement_award_credits = sum(CreditAward.credits_awarded
                                    WHERE status == POSTED
                                    AND CourseEnrollment(course_enrollment_id).placement_id == P.id)
      credit_component = round(min(1.0000,
                                  placement_award_credits / max(0.25, Referral(P.referral_id).deficiency_credits)), 4)
      readiness_base_score = round(0.50 * attendance_component
                                 + 0.30 * pacing_component
                                 + 0.20 * credit_component, 4)
      if readiness_base_score >= 0.8000 and support_sessions_completed >= 2:
          engagement_bonus = 0.0500
      elif readiness_base_score >= 0.6500 and support_sessions_completed >= 1:
          engagement_bonus = 0.0300
      else:
          engagement_bonus = 0.0000
      readiness_score = round(min(1.0000, readiness_base_score + engagement_bonus), 4)
    input_set: "the placement's attendance accumulators, its enrollments whose progress_state is IN_PROGRESS, SUBMITTED_FOR_AWARD or AWARDED (AWARD_DENIED enrollments are excluded), POSTED CreditAwards reached through those enrollments, COMPLETED SupportSessions of this placement, and the deficiency_credits of the placement's referral"
    constants:
      ATTENDANCE_WEIGHT: 0.50
      PACING_WEIGHT: 0.30
      CREDIT_WEIGHT: 0.20
      BONUS_TIER_1_BASE_AT: 0.8000
      BONUS_TIER_1_SESSIONS_AT: 2
      BONUS_TIER_1_VALUE: 0.0500
      BONUS_TIER_2_BASE_AT: 0.6500
      BONUS_TIER_2_SESSIONS_AT: 1
      BONUS_TIER_2_VALUE: 0.0300
      READINESS_THRESHOLD: 0.7500
      MIN_ATTENDANCE_RATE: 0.9000
      CREDIT_DENOMINATOR_FLOOR: 0.25
    precision: "components, base, bonus and readiness all 4 decimal places round_half_up"
    variants: []

  - name: credit_ledger_invariant
    trigger: "asserted after every award posting and every award void (hops 1-3 of both cascades)"
    algorithm: aggregation
    formula: |
      # Named conserved quantity: the student's credit ledger.
      GraduationPlan.credits_earned
        == Student.credits_earned_total
        == round( sum(PriorCourseRecord.credits_attempted
                      WHERE student_id == S.id AND outcome == PASSED)
                + sum(CreditAward.credits_awarded
                      WHERE student_id == S.id AND status == POSTED), 2)
      # And for any award A: voiding A must return credits_earned, alt_ed_credits,
      # ncaa_acceptable_credits, gpa and PriorCourseRecord.replacement_status to exactly the
      # values they held immediately before A was posted (zero drift).
    input_set: "PASSED PriorCourseRecords and POSTED CreditAwards of one student; VOIDED awards and REPLACED historical rows contribute nothing"
    precision: "2 decimal places round_half_up"
    variants: []

  - name: center_seat_conservation_invariant
    trigger: "asserted after every seat-moving transition (offer, withdraw-offer, accept-offer, exit, approve-re-entry, waitlist promotion)"
    algorithm: aggregation
    formula: |
      # Named conserved quantity: the center's funded seats.
      Center.seats_available + Center.seats_committed == Center.seat_capacity
      Center.seats_committed == Center.active_student_count + Center.seats_reserved
      # And for any offer O on center C: withdrawing O must return seats_available,
      # seats_committed and seats_reserved to exactly the values they held immediately
      # before O was made (zero drift). Accepting O moves one unit from seats_reserved to
      # active_student_count and therefore leaves seats_committed unchanged.
    input_set: "Placements in status ACTIVE or RE_ENTRY_PENDING plus Referrals in status PLACEMENT_OFFERED for one center"
    precision: "integer seats; no rounding"
    variants: []

# §1.4 Validation Rules Table — ordered by priority. A single request that violates several
# rows returns the error of the LOWEST priority number. Within business rules the district's
# order is: safety/academic-integrity, then referential/catalog eligibility, then temporal
# resource conflicts, then academic-policy gates, then capacity/fiscal (staffing and seats last).
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id embedded in the path exists, validated left-to-right"
    error_id: "ERR_CENTER_NOT_FOUND | ERR_HOME_SCHOOL_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_PRIOR_RECORD_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_SUPPORT_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: auth
    check: "scoped roles may only act on resources inside their own scope: PlacementCoordinator's X-User-ID must equal the center_id reached through the target resource; HomeSchoolCounselor's X-User-ID must equal the home_school_id of the target student; SupportProviderStaff's X-User-ID must equal the support_provider_id of the target support session"
    error_id: "ERR_FORBIDDEN_CENTER_SCOPE | ERR_FORBIDDEN_SCHOOL_SCOPE | ERR_FORBIDDEN_PROVIDER_SCOPE"
    http_status: 403
    applies_to: "all endpoints acted on by PlacementCoordinator, HomeSchoolCounselor or SupportProviderStaff"

  - priority: 5
    category: existence
    check: "request body is well formed: required inputs present, enums within their declared domain, numerics within their declared range, dates ISO-8601, booleans boolean"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 6
    category: existence
    check: "every id supplied in the request body resolves to an existing row (student_id, center_id, course_id, prior_course_record_id, placement_id, proctor_station_id, support_provider_id, prior_referral_id)"
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_PRIOR_RECORD_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_REFERRAL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /referrals, POST /prior-course-records, POST /students, POST /graduation-plans, POST /course-enrollments, POST /proctor-sessions, POST /support-sessions, POST /proctor-stations, POST /support-providers, POST /referrals/{referral_id}/resubmit"

  - priority: 7
    category: business_constraint
    check: "an interval payload is ordered strictly: scheduled_end > scheduled_start for proctor sessions, end_at > start_at for support sessions"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /proctor-sessions, POST /support-sessions"

  - priority: 8
    category: business_safety
    check: "segregation of duties: the X-User-ID that submitted an enrollment for award may not be the X-User-ID that awards or denies it, and the X-User-ID that requested re-entry may not be the X-User-ID that approves it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /course-enrollments/{course_enrollment_id}/award-credit, POST /course-enrollments/{course_enrollment_id}/deny-award, POST /placements/{placement_id}/approve-re-entry"

  - priority: 9
    category: state
    check: "optimistic concurrency: the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_PLACEMENT_VERSION | ERR_STALE_PLAN_VERSION | ERR_STALE_CENTER_VERSION"
    http_status: 412
    applies_to: "POST /course-enrollments, POST /course-enrollments/{course_enrollment_id}/award-credit, POST /referrals/{referral_id}/offer, PATCH /centers/{center_id}/staffing"

  - priority: 10
    category: state
    check: "the target resource (and every resource whose state the action reads as a precondition) is in a state that permits the transition, per §1.2"
    error_id: "ERR_REFERRAL_STATE_INVALID | ERR_PLACEMENT_STATE_INVALID | ERR_ENROLLMENT_STATE_INVALID | ERR_AWARD_STATE_INVALID | ERR_PLAN_STATE_INVALID | ERR_SESSION_STATE_INVALID | ERR_SUPPORT_SESSION_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: business_constraint
    check: "uniqueness: Student.state_student_id is globally unique; Course.code is globally unique; a Student has at most one GraduationPlan; a Student has at most one Referral in a non-terminal status (SUBMITTED, SCREENING, INFO_REQUESTED, PLACEMENT_OFFERED, WAITLISTED); a Placement has at most one CourseEnrollment per course whose progress_state is not AWARD_DENIED; a PriorCourseRecord backs at most one in-flight CREDIT_RECOVERY enrollment (progress_state IN_PROGRESS or SUBMITTED_FOR_AWARD); once that attempt is AWARDED the record is guarded by the replacement_status rule at priority 13 instead"
    error_id: "ERR_DUPLICATE_STATE_STUDENT_ID | ERR_DUPLICATE_COURSE_CODE | ERR_DUPLICATE_PLAN | ERR_DUPLICATE_ACTIVE_REFERRAL | ERR_DUPLICATE_ENROLLMENT | ERR_PRIOR_RECORD_ALREADY_ENROLLED"
    http_status: 409
    applies_to: "POST /students, POST /courses, POST /graduation-plans, POST /referrals, POST /course-enrollments"

  - priority: 12
    category: business_safety
    check: "academic-integrity gates: an enrollment whose integrity_state is FLAGGED accepts no progress, no award submission and no award (ERR_INTEGRITY_HOLD); a course with proctoring_required cannot be submitted for award with zero COMPLETED ProctorSessions (ERR_PROCTORED_EXAM_MISSING); a ProctorSession may only be booked for an enrollment whose course has proctoring_required (ERR_PROCTORING_POLICY_VIOLATION)"
    error_id: "ERR_INTEGRITY_HOLD | ERR_PROCTORED_EXAM_MISSING | ERR_PROCTORING_POLICY_VIOLATION"
    http_status: 409
    applies_to: "POST /course-enrollments/{course_enrollment_id}/progress, POST /course-enrollments/{course_enrollment_id}/submit-for-award, POST /course-enrollments/{course_enrollment_id}/award-credit, POST /proctor-sessions"

  - priority: 13
    category: business_referential
    check: "catalog and recovery eligibility: a CREDIT_RECOVERY enrollment requires prior_course_record_id (ERR_MISSING_PRIOR_RECORD); that record's outcome must be FAILED (ERR_COURSE_NOT_PREVIOUSLY_FAILED); its student_id and course_id must match the placement's student and the requested course (ERR_PRIOR_RECORD_MISMATCH); its replacement_status must be NOT_REPLACED (ERR_PRIOR_RECORD_ALREADY_REPLACED); a ProctorSession's station must belong to the same center as the enrollment's placement (ERR_STATION_CENTER_MISMATCH); a SupportSession's provider must belong to the same center as its placement (ERR_PROVIDER_CENTER_MISMATCH)"
    error_id: "ERR_MISSING_PRIOR_RECORD | ERR_COURSE_NOT_PREVIOUSLY_FAILED | ERR_PRIOR_RECORD_MISMATCH | ERR_PRIOR_RECORD_ALREADY_REPLACED | ERR_STATION_CENTER_MISMATCH | ERR_PROVIDER_CENTER_MISMATCH"
    http_status: 409
    applies_to: "POST /course-enrollments, POST /proctor-sessions, POST /support-sessions"

  - priority: 14
    category: business_temporal
    check: "resource interval conflicts: a ProctorStation admits one session at a time under half-open comparison extended by turnaround_buffer_minutes (ERR_STATION_CONFLICT); a SupportProvider admits at most max_concurrent_students intersecting sessions under closed-interval comparison (ERR_PROVIDER_CAPACITY_EXCEEDED)"
    error_id: "ERR_STATION_CONFLICT | ERR_PROVIDER_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /proctor-sessions, POST /support-sessions"

  - priority: 15
    category: business_constraint
    check: "re-entry to the home school requires the student's GraduationPlan posture to be ON_TRACK or AT_RISK; an OFF_TRACK plan blocks the request"
    error_id: ERR_PLAN_POSTURE_BLOCKS_RE_ENTRY
    http_status: 409
    applies_to: "POST /placements/{placement_id}/request-re-entry"

  - priority: 16
    category: business_constraint
    check: "re-entry requires attendance_rate >= 0.9000 (MIN_ATTENDANCE_RATE); a null attendance_rate fails this check"
    error_id: ERR_ATTENDANCE_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /placements/{placement_id}/request-re-entry"

  - priority: 17
    category: business_constraint
    check: "re-entry requires readiness_score >= 0.7500 (READINESS_THRESHOLD)"
    error_id: ERR_READINESS_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /placements/{placement_id}/request-re-entry"

  - priority: 18
    category: business_constraint
    check: "credit-award academic gates evaluated in this order: final_percent >= Course.min_passing_percent (ERR_FINAL_PERCENT_BELOW_PASSING); then under COMPETENCY policy mastery_pct >= 70.00 (ERR_MASTERY_NOT_MET); then under SEAT_TIME policy the computed credits must exceed 0.00 (ERR_SEAT_TIME_INSUFFICIENT)"
    error_id: "ERR_FINAL_PERCENT_BELOW_PASSING | ERR_MASTERY_NOT_MET | ERR_SEAT_TIME_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /course-enrollments/{course_enrollment_id}/award-credit"

  - priority: 19
    category: business_fiscal
    check: "center capacity and staffing: a center whose intake_posture is FROZEN accepts no new offer and no new enrollment (ERR_INTAKE_FROZEN); a center whose intake_posture is RESTRICTED accepts a new offer only for a referral whose pathway is BEHAVIOR or whose priority_score >= 0.5000 (ERR_INTAKE_RESTRICTED); a staffing change that would leave staffing_headroom below zero for the center's existing ACTIVE and RE_ENTRY_PENDING placements is rejected (ERR_STAFFING_RATIO_EXCEEDED)"
    error_id: "ERR_INTAKE_FROZEN | ERR_INTAKE_RESTRICTED | ERR_STAFFING_RATIO_EXCEEDED"
    http_status: 409
    applies_to: "POST /referrals/{referral_id}/offer, POST /course-enrollments, PATCH /centers/{center_id}/staffing"

  - priority: 20
    category: business_temporal
    check: "the logical clock may only move forward: the supplied current_utc must be greater than or equal to the clock's present value"
    error_id: ERR_CLOCK_BACKWARD
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

# §1.5 API Endpoint Table
# All business resources are top-level collections (api_prefix "/"), so every child entity is
# reachable both by its own id and by a filtered list over its foreign keys.
# Scope note: for the three scoped roles (PlacementCoordinator, HomeSchoolCounselor,
# SupportProviderStaff) a collection GET returns only rows inside the caller's scope rather than
# raising a scope error; the priority-4 scope check of §1.4 applies to single-resource GETs and
# to every action endpoint.
endpoints:
  # ---------- HomeSchool ----------
  - method: POST
    path: "/home-schools"
    description: "register a home school of record with its accountability cohort year"
    roles: [DistrictAdmin]
    code: 201
    input: [name, district_code, accountability_cohort_year]
    output: HomeSchool
    side_effects: ["cohort_size, graduates_count, alt_ed_placed_count, adjusted_grad_rate and cohort_flag derive to 0, 0, 0, null and NOT_RATED on an empty cohort"]

  - method: GET
    path: "/home-schools/{home_school_id}"
    description: "read one home school with its derived cohort accountability figures"
    roles: [DistrictAdmin, HomeSchoolCounselor, PlacementCoordinator, Registrar]
    code: 200
    input: []
    output: HomeSchool
    side_effects: ["derives cohort_accountability on read"]

  - method: GET
    path: "/home-schools"
    description: "list home schools, optionally filtered by district code or accountability flag"
    roles: [DistrictAdmin, Registrar]
    code: 200
    input: ["district_code?", "cohort_flag?"]
    output: HomeSchool[]
    side_effects: []

  # ---------- Center ----------
  - method: POST
    path: "/centers"
    description: "open an alternative education center with its funded seats and staffing"
    roles: [DistrictAdmin]
    code: 201
    input: [name, seat_capacity, certified_teacher_fte, support_staff_fte, max_students_per_teacher]
    output: Center
    side_effects: ["derives restricted_seat_margin, seats_available, staffing_headroom and intake_posture from the seat and staffing inputs"]

  - method: GET
    path: "/centers/{center_id}"
    description: "read one center with its live seat, ratio and intake posture figures"
    roles: [DistrictAdmin, PlacementCoordinator, HomeSchoolCounselor, Registrar, AltEdTeacher]
    code: 200
    input: []
    output: Center
    side_effects: ["derives center_intake_posture on read"]

  - method: GET
    path: "/centers"
    description: "list centers, optionally filtered by intake posture"
    roles: [DistrictAdmin, HomeSchoolCounselor, Registrar]
    code: 200
    input: ["intake_posture?"]
    output: Center[]
    side_effects: []

  - method: PATCH
    path: "/centers/{center_id}/staffing"
    description: "revise a center's certified teacher FTE, support staff FTE or teacher load cap under optimistic concurrency"
    roles: [DistrictAdmin]
    code: 200
    input: ["certified_teacher_fte?", "support_staff_fte?", "max_students_per_teacher?", expected_center_version]
    output: Center
    side_effects:
      - "rejects the change with ERR_STAFFING_RATIO_EXCEEDED when the new staffing would drive staffing_headroom below zero for the center's existing ACTIVE and RE_ENTRY_PENDING placements"
      - "re-derives student_teacher_ratio, staffing_headroom and intake_posture"
      - "promotes at most one WAITLISTED referral when intake_posture transitions into OPEN (highest priority_score, ties broken by created_at ASC)"
      - "increments Center.version by 1"

  # ---------- Course ----------
  - method: POST
    path: "/courses"
    description: "publish a catalog course with its modality, pacing and proctoring policy"
    roles: [DistrictAdmin]
    code: 201
    input: [code, title, subject_area, credit_value, modality, total_modules, required_seat_hours, pacing_days, proctoring_required, "proctored_exam_weight?", ncaa_approved, "min_passing_percent?"]
    output: Course
    side_effects: ["applies default proctored_exam_weight 0.40 and default min_passing_percent 60.00 when omitted"]

  - method: GET
    path: "/courses/{course_id}"
    description: "read one catalog course"
    roles: [DistrictAdmin, Registrar, AltEdTeacher, PlacementCoordinator, HomeSchoolCounselor]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: GET
    path: "/courses"
    description: "list catalog courses, optionally filtered by subject area, modality or NCAA approval"
    roles: [DistrictAdmin, Registrar, AltEdTeacher, PlacementCoordinator]
    code: 200
    input: ["subject_area?", "modality?", "ncaa_approved?"]
    output: Course[]
    side_effects: []

  # ---------- Student ----------
  - method: POST
    path: "/students"
    description: "enroll a student record under a home school"
    roles: [DistrictAdmin, Registrar]
    code: 201
    input: [home_school_id, state_student_id, full_name, cohort_year, grade_level]
    output: Student
    side_effects: ["status defaults to ENROLLED_HOME; credits_earned_total, alt_ed_credits, ncaa_acceptable_credits derive to 0.00 and gpa to null"]

  - method: GET
    path: "/students/{student_id}"
    description: "read one student with derived transcript totals and GPA"
    roles: [DistrictAdmin, Registrar, HomeSchoolCounselor, PlacementCoordinator, AltEdTeacher]
    code: 200
    input: []
    output: Student
    side_effects: ["derives transcript_gpa and the credit ledger on read"]

  - method: GET
    path: "/students"
    description: "list students, optionally filtered by home school, cohort year or status"
    roles: [DistrictAdmin, Registrar, HomeSchoolCounselor]
    code: 200
    input: ["home_school_id?", "cohort_year?", "status?"]
    output: Student[]
    side_effects: []

  # ---------- PriorCourseRecord ----------
  - method: POST
    path: "/prior-course-records"
    description: "post a historical transcript row for a student and catalog course"
    roles: [Registrar]
    code: 201
    input: [student_id, course_id, term_code, original_percent, credits_attempted, outcome]
    output: PriorCourseRecord
    side_effects:
      - "derives original_grade_code from original_percent (A >= 90, B >= 80, C >= 70, D >= 60, F below 60; I when outcome == INCOMPLETE)"
      - "sets replacement_status to NOT_REPLACED"
      - "re-derives the student's credits_earned_total and gpa"

  - method: GET
    path: "/prior-course-records/{prior_course_record_id}"
    description: "read one historical transcript row"
    roles: [Registrar, DistrictAdmin, AltEdTeacher, PlacementCoordinator]
    code: 200
    input: []
    output: PriorCourseRecord
    side_effects: []

  - method: GET
    path: "/prior-course-records"
    description: "list historical transcript rows filtered by student, course, outcome or replacement status"
    roles: [Registrar, DistrictAdmin, AltEdTeacher, PlacementCoordinator]
    code: 200
    input: ["student_id?", "course_id?", "outcome?", "replacement_status?"]
    output: PriorCourseRecord[]
    side_effects: []

  # ---------- GraduationPlan ----------
  - method: POST
    path: "/graduation-plans"
    description: "open a graduation plan for a student, fixing the district's grade replacement policy"
    roles: [Registrar]
    code: 201
    input: [student_id, required_credits_total, grade_replacement_policy, "projected_completion_term?"]
    output: GraduationPlan
    side_effects: ["status starts at DRAFT; derives credits_earned, credits_in_progress, credits_remaining, expected_credits_by_grade and posture"]

  - method: GET
    path: "/graduation-plans/{graduation_plan_id}"
    description: "read one graduation plan with derived credit ledger and posture"
    roles: [Registrar, DistrictAdmin, HomeSchoolCounselor, PlacementCoordinator]
    code: 200
    input: []
    output: GraduationPlan
    side_effects: ["derives graduation_plan_posture on read"]

  - method: GET
    path: "/graduation-plans"
    description: "list graduation plans filtered by student, status or posture"
    roles: [Registrar, DistrictAdmin, HomeSchoolCounselor]
    code: 200
    input: ["student_id?", "status?", "posture?"]
    output: GraduationPlan[]
    side_effects: []

  - method: POST
    path: "/graduation-plans/{graduation_plan_id}/activate"
    description: "activate a DRAFT graduation plan so credits may be awarded against it"
    roles: [Registrar]
    code: 200
    input: ["projected_completion_term?"]
    output: GraduationPlan
    side_effects: ["status DRAFT -> ACTIVE", "increments GraduationPlan.version by 1"]

  # ---------- Referral ----------
  - method: POST
    path: "/referrals"
    description: "refer a student to an alternative education center on a behavior, credit deficiency or re-engagement pathway"
    roles: [HomeSchoolCounselor]
    code: 201
    input: [student_id, center_id, pathway, deficiency_credits, behavior_incident_count, days_disengaged, "narrative?", "prior_referral_id?"]
    output: Referral
    side_effects: ["computes referral_priority_score including the re-referral bump when prior_referral_id is supplied", "status starts at SUBMITTED"]

  - method: GET
    path: "/referrals/{referral_id}"
    description: "read one referral with its computed priority score"
    roles: [HomeSchoolCounselor, PlacementCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "list referrals filtered by student, center, status, pathway or the referral they re-open"
    roles: [HomeSchoolCounselor, PlacementCoordinator, DistrictAdmin]
    code: 200
    input: ["student_id?", "center_id?", "status?", "pathway?", "prior_referral_id?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{referral_id}/screen"
    description: "take a SUBMITTED referral into screening at the receiving center"
    roles: [PlacementCoordinator]
    code: 200
    input: ["screening_note?"]
    output: Referral
    side_effects: ["status SUBMITTED -> SCREENING"]

  - method: POST
    path: "/referrals/{referral_id}/request-info"
    description: "return a referral to the home school for missing intake documentation"
    roles: [PlacementCoordinator]
    code: 200
    input: [missing_items]
    output: Referral
    side_effects: ["status SCREENING -> INFO_REQUESTED", "records missing_items"]

  - method: POST
    path: "/referrals/{referral_id}/resubmit"
    description: "supply the missing intake data and return the referral to screening, re-scoring its priority"
    roles: [HomeSchoolCounselor]
    code: 200
    input: ["deficiency_credits?", "behavior_incident_count?", "days_disengaged?", "narrative?"]
    output: Referral
    side_effects: ["status INFO_REQUESTED -> SCREENING", "clears missing_items", "recomputes referral_priority_score from the revised counters"]

  - method: POST
    path: "/referrals/{referral_id}/offer"
    description: "offer a seat to a screened referral, reserving center capacity under optimistic concurrency"
    roles: [PlacementCoordinator]
    code: 200
    input: ["offer_valid_days?", expected_center_version]
    output: Referral
    side_effects:
      - "status SCREENING -> PLACEMENT_OFFERED"
      - "sets offer_expires_on to the logical clock date plus offer_valid_days (default 10)"
      - "increments Center.seats_reserved by 1 and decrements Center.seats_available by 1"
      - "re-derives Center.intake_posture"
      - "increments Center.version by 1"

  - method: POST
    path: "/referrals/{referral_id}/waitlist"
    description: "waitlist a screened referral the center cannot seat yet"
    roles: [PlacementCoordinator]
    code: 200
    input: [waitlist_reason]
    output: Referral
    side_effects: ["status SCREENING -> WAITLISTED", "reserves no seat"]

  - method: POST
    path: "/referrals/{referral_id}/deny"
    description: "deny a referral that does not meet placement criteria"
    roles: [PlacementCoordinator]
    code: 200
    input: [denial_reason]
    output: Referral
    side_effects: ["status SCREENING -> DENIED (terminal)"]

  - method: POST
    path: "/referrals/{referral_id}/withdraw-offer"
    description: "withdraw an outstanding seat offer and return the referral to screening, releasing the reserved seat"
    roles: [PlacementCoordinator]
    code: 200
    input: ["screening_note?"]
    output: Referral
    side_effects:
      - "status PLACEMENT_OFFERED -> SCREENING"
      - "clears offer_expires_on"
      - "decrements Center.seats_reserved by 1 and increments Center.seats_available by 1, restoring the pre-offer seat ledger exactly"
      - "re-derives Center.intake_posture"
      - "promotes at most one WAITLISTED referral when intake_posture transitions into OPEN (highest priority_score, ties broken by created_at ASC)"
      - "increments Center.version by 1"

  - method: POST
    path: "/referrals/{referral_id}/accept-offer"
    description: "accept the seat offer, creating the placement under the chosen seat-time or competency credit policy"
    roles: [HomeSchoolCounselor]
    code: 201
    input: [credit_policy, start_date]
    output: Placement
    side_effects:
      - "status PLACEMENT_OFFERED -> ACCEPTED (terminal)"
      - "creates a Placement in status ACTIVE for the referral's student and center"
      - "sets Student.status to PLACED_ALT"
      - "moves one seat from Center.seats_reserved to Center.active_student_count, leaving seats_committed unchanged"
      - "re-derives Center.student_teacher_ratio, staffing_headroom and intake_posture"
      - "increments Center.version by 1"

  # ---------- Placement ----------
  - method: GET
    path: "/placements/{placement_id}"
    description: "read one placement with derived attendance, pacing and re-entry readiness figures"
    roles: [PlacementCoordinator, DistrictAdmin, AltEdTeacher, HomeSchoolCounselor, Registrar]
    code: 200
    input: []
    output: Placement
    side_effects: ["derives re_entry_readiness on read"]

  - method: GET
    path: "/placements"
    description: "list placements filtered by student, center, referral or status"
    roles: [PlacementCoordinator, DistrictAdmin, AltEdTeacher, HomeSchoolCounselor, Registrar]
    code: 200
    input: ["student_id?", "center_id?", "referral_id?", "status?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/placements/{placement_id}/attendance"
    description: "log attendance days against an active placement"
    roles: [AltEdTeacher]
    code: 200
    input: [days_present_delta, days_enrolled_delta]
    output: Placement
    side_effects:
      - "advances days_present and days_enrolled by the supplied deltas"
      - "re-derives attendance_rate, attendance_component, readiness_base_score, engagement_bonus, readiness_score and re_entry_eligible"

  - method: POST
    path: "/placements/{placement_id}/request-re-entry"
    description: "request the student's re-entry to the home school; enforces the attendance, readiness, integrity and graduation-plan gates"
    roles: [PlacementCoordinator, DistrictAdmin]
    code: 200
    input: [target_re_entry_date]
    output: Placement
    side_effects:
      - "status ACTIVE -> RE_ENTRY_PENDING"
      - "records target_re_entry_date and captures the acting X-User-ID into re_entry_requested_by_user_id"
      - "rejects the request with ERR_PLAN_POSTURE_BLOCKS_RE_ENTRY, ERR_ATTENDANCE_BELOW_MINIMUM, ERR_READINESS_BELOW_THRESHOLD or ERR_INTEGRITY_HOLD when a gate fails"

  - method: POST
    path: "/placements/{placement_id}/approve-re-entry"
    description: "approve the pending re-entry and return the student to the home school, releasing the seat"
    roles: [DistrictAdmin]
    code: 200
    input: [actual_re_entry_date]
    output: Placement
    side_effects:
      - "status RE_ENTRY_PENDING -> RE_ENTERED (terminal)"
      - "rejects the approval with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals re_entry_requested_by_user_id"
      - "sets Student.status to RE_ENTERED"
      - "decrements Center.active_student_count by 1 and increments Center.seats_available by 1"
      - "re-derives Center.student_teacher_ratio, staffing_headroom and intake_posture"
      - "promotes at most one WAITLISTED referral when intake_posture transitions into OPEN (highest priority_score, ties broken by created_at ASC)"

  - method: POST
    path: "/placements/{placement_id}/deny-re-entry"
    description: "deny the pending re-entry and return the placement to active status"
    roles: [DistrictAdmin]
    code: 200
    input: [re_entry_denial_reason]
    output: Placement
    side_effects: ["status RE_ENTRY_PENDING -> ACTIVE", "records re_entry_denial_reason", "clears re_entry_requested_by_user_id and target_re_entry_date", "holds the seat"]

  - method: POST
    path: "/placements/{placement_id}/exit"
    description: "exit a placement without re-entry, closing out unfinished coursework"
    roles: [PlacementCoordinator]
    code: 200
    input: [exit_reason]
    output: Placement
    side_effects:
      - "status ACTIVE or RE_ENTRY_PENDING -> EXITED_UNSUCCESSFUL (terminal)"
      - "sets Student.status to EXITED_ALT"
      - "moves every CourseEnrollment of this placement whose progress_state is IN_PROGRESS or SUBMITTED_FOR_AWARD to AWARD_DENIED with denial_reason 'PLACEMENT_EXITED'; AWARDED enrollments are untouched"
      - "cancels every SCHEDULED ProctorSession and SCHEDULED SupportSession of those enrollments and of this placement, releasing their reserved intervals"
      - "decrements Center.active_student_count by 1 and increments Center.seats_available by 1"
      - "re-derives Center.intake_posture"
      - "promotes at most one WAITLISTED referral when intake_posture transitions into OPEN (highest priority_score, ties broken by created_at ASC)"

  # ---------- CourseEnrollment ----------
  - method: POST
    path: "/course-enrollments"
    description: "enroll a placed student in a catalog course as new credit or as credit recovery of a previously failed course, under optimistic concurrency on the placement"
    roles: [AltEdTeacher]
    code: 201
    input: [placement_id, course_id, enrollment_type, "prior_course_record_id?", expected_placement_version]
    output: CourseEnrollment
    side_effects:
      - "stamps enrolled_on with the logical clock date and starts progress_state at IN_PROGRESS and integrity_state at CLEAR"
      - "rejects a CREDIT_RECOVERY enrollment whose prior_course_record_id is absent, not FAILED, mismatched or already REPLACED"
      - "rejects the enrollment when the placement's center intake_posture is FROZEN"
      - "derives pace_index null and pacing_flag NOT_YET_RATED on the enrollment day"
      - "increments Placement.version by 1"

  - method: GET
    path: "/course-enrollments/{course_enrollment_id}"
    description: "read one course enrollment with derived mastery, pacing and projected credits"
    roles: [AltEdTeacher, Registrar, PlacementCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: CourseEnrollment
    side_effects: ["derives enrollment_mastery_pct, enrollment_pace_index and credit_award_credits (as projected_credits) on read"]

  - method: GET
    path: "/course-enrollments"
    description: "list course enrollments filtered by placement, course, backing prior record, progress state or integrity state"
    roles: [AltEdTeacher, Registrar, PlacementCoordinator, DistrictAdmin]
    code: 200
    input: ["placement_id?", "course_id?", "prior_course_record_id?", "progress_state?", "integrity_state?"]
    output: CourseEnrollment[]
    side_effects: []

  - method: POST
    path: "/course-enrollments/{course_enrollment_id}/progress"
    description: "report module completion, seat hours and the running module average for an in-progress enrollment"
    roles: [AltEdTeacher]
    code: 200
    input: ["modules_passed_delta?", "seat_hours_delta?", "module_avg_percent?"]
    output: CourseEnrollment
    side_effects:
      - "advances modules_passed (capped at Course.total_modules) and seat_hours_logged; replaces module_avg_percent when supplied"
      - "re-derives mastery_pct, pace_index, pacing_flag and projected_credits"
      - "re-derives the owning Placement's pacing_component, readiness_base_score, engagement_bonus and readiness_score"
      - "rejects the report with ERR_INTEGRITY_HOLD when integrity_state is FLAGGED"

  - method: POST
    path: "/course-enrollments/{course_enrollment_id}/submit-for-award"
    description: "submit a completed enrollment for credit award, recording the final course percent"
    roles: [AltEdTeacher, Registrar]
    code: 200
    input: [final_percent]
    output: CourseEnrollment
    side_effects:
      - "progress_state IN_PROGRESS -> SUBMITTED_FOR_AWARD"
      - "records final_percent and captures the acting X-User-ID into submitted_by_user_id"
      - "rejects the submission with ERR_PROCTORED_EXAM_MISSING when the course has proctoring_required and the enrollment has no COMPLETED ProctorSession"
      - "rejects the submission with ERR_INTEGRITY_HOLD when integrity_state is FLAGGED"

  - method: POST
    path: "/course-enrollments/{course_enrollment_id}/award-credit"
    description: "award credit for a submitted enrollment under the placement's seat-time or competency policy, posting the transcript row"
    roles: [Registrar]
    code: 201
    input: [expected_graduation_plan_version]
    output: CreditAward
    side_effects:
      - "progress_state SUBMITTED_FOR_AWARD -> AWARDED"
      - "rejects the award with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals submitted_by_user_id"
      - "hop 1: creates a CreditAward in status POSTED with credits_awarded from credit_award_credits, transcript_grade_code, modality_code, transcript_code, ncaa_acceptable and grade_replacement_mode from transcript_coding; sets CourseEnrollment.awarded_credits"
      - "hop 2: stamps the backing PriorCourseRecord replacement_status to REPLACED when grade_replacement_mode is FULL_REPLACEMENT, and re-derives Student.credits_earned_total, alt_ed_credits, ncaa_acceptable_credits and gpa"
      - "hop 3: re-derives the GraduationPlan credit ledger and posture, and moves status ACTIVE -> COMPLETED when credits_earned >= required_credits_total"
      - "hop 4: sets Student.status to GRADUATED on plan completion and re-derives the home school's cohort figures and cohort_flag"
      - "increments GraduationPlan.version by 1"

  - method: POST
    path: "/course-enrollments/{course_enrollment_id}/deny-award"
    description: "deny credit for a submitted enrollment"
    roles: [Registrar]
    code: 200
    input: [denial_reason]
    output: CourseEnrollment
    side_effects:
      - "progress_state SUBMITTED_FOR_AWARD -> AWARD_DENIED (terminal on the progress axis)"
      - "rejects the denial with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals submitted_by_user_id"
      - "removes the enrollment from the owning placement's pacing_component input set, re-deriving readiness_score"

  - method: POST
    path: "/course-enrollments/{course_enrollment_id}/flag-integrity"
    description: "flag an academic integrity concern on an enrollment, holding all progress and award activity"
    roles: [PlacementCoordinator, DistrictAdmin]
    code: 200
    input: [integrity_incident_code]
    output: CourseEnrollment
    side_effects: ["integrity_state CLEAR -> FLAGGED independently of progress_state", "records integrity_incident_code"]

  - method: POST
    path: "/course-enrollments/{course_enrollment_id}/resolve-integrity"
    description: "resolve a flagged integrity concern by clearing the enrollment or voiding it for integrity"
    roles: [DistrictAdmin]
    code: 200
    input: [resolution, "integrity_resolution_note?"]
    output: CourseEnrollment
    side_effects:
      - "integrity_state FLAGGED -> CLEARED when resolution is CLEARED, restoring progress and award activity on the unchanged progress_state"
      - "integrity_state FLAGGED -> VOIDED_FOR_INTEGRITY when resolution is VOIDED_FOR_INTEGRITY, which additionally voids this enrollment's POSTED CreditAward and runs the full void compensation"

  # ---------- CreditAward ----------
  - method: GET
    path: "/credit-awards/{credit_award_id}"
    description: "read one posted transcript award with its transcript coding and NCAA acceptability"
    roles: [Registrar, DistrictAdmin, HomeSchoolCounselor]
    code: 200
    input: []
    output: CreditAward
    side_effects: []

  - method: GET
    path: "/credit-awards"
    description: "list transcript awards filtered by student, enrollment, replaced prior record or status"
    roles: [Registrar, DistrictAdmin, HomeSchoolCounselor]
    code: 200
    input: ["student_id?", "course_enrollment_id?", "prior_course_record_id?", "status?"]
    output: CreditAward[]
    side_effects: []

  - method: POST
    path: "/credit-awards/{credit_award_id}/void"
    description: "void a posted award and reverse every ledger effect it produced"
    roles: [Registrar]
    code: 200
    input: [void_reason]
    output: CreditAward
    side_effects:
      - "status POSTED -> VOIDED (terminal)"
      - "hop 1: zeroes CourseEnrollment.awarded_credits and returns progress_state AWARDED -> SUBMITTED_FOR_AWARD"
      - "hop 2: returns the backing PriorCourseRecord replacement_status to NOT_REPLACED and re-derives Student.credits_earned_total, alt_ed_credits, ncaa_acceptable_credits and gpa"
      - "hop 3: re-derives the GraduationPlan credit ledger and posture, and moves status COMPLETED -> ACTIVE when credits_earned falls below required_credits_total"
      - "hop 4: returns Student.status from GRADUATED to PLACED_ALT and re-derives the home school's cohort figures and cohort_flag"

  # ---------- ProctorStation ----------
  - method: POST
    path: "/proctor-stations"
    description: "register a proctoring station at a center"
    roles: [DistrictAdmin, PlacementCoordinator]
    code: 201
    input: [center_id, label, station_type]
    output: ProctorStation
    side_effects: ["turnaround_buffer_minutes derives to 15 and scheduled_session_count to 0"]

  - method: GET
    path: "/proctor-stations/{proctor_station_id}"
    description: "read one proctoring station"
    roles: [DistrictAdmin, PlacementCoordinator, Registrar]
    code: 200
    input: []
    output: ProctorStation
    side_effects: []

  - method: GET
    path: "/proctor-stations"
    description: "list proctoring stations filtered by center or station type"
    roles: [DistrictAdmin, PlacementCoordinator, Registrar]
    code: 200
    input: ["center_id?", "station_type?"]
    output: ProctorStation[]
    side_effects: []

  # ---------- ProctorSession ----------
  - method: POST
    path: "/proctor-sessions"
    description: "book a proctored exam slot for an enrollment on a station, enforcing the station's single-occupancy interval with turnaround buffer"
    roles: [PlacementCoordinator]
    code: 201
    input: [course_enrollment_id, proctor_station_id, scheduled_start, scheduled_end]
    output: ProctorSession
    side_effects:
      - "status starts at SCHEDULED and increments ProctorStation.scheduled_session_count by 1"
      - "rejects the booking with ERR_PROCTORING_POLICY_VIOLATION when the enrollment's course has proctoring_required false"
      - "rejects the booking with ERR_STATION_CENTER_MISMATCH when the station's center differs from the enrollment's placement center"
      - "rejects the booking with ERR_STATION_CONFLICT on a half-open interval overlap against the station's SCHEDULED and COMPLETED sessions extended by turnaround_buffer_minutes"

  - method: GET
    path: "/proctor-sessions/{proctor_session_id}"
    description: "read one proctored exam session"
    roles: [PlacementCoordinator, DistrictAdmin, Registrar]
    code: 200
    input: []
    output: ProctorSession
    side_effects: []

  - method: GET
    path: "/proctor-sessions"
    description: "list proctored exam sessions filtered by enrollment, station or status"
    roles: [PlacementCoordinator, DistrictAdmin, Registrar]
    code: 200
    input: ["course_enrollment_id?", "proctor_station_id?", "status?"]
    output: ProctorSession[]
    side_effects: []

  - method: POST
    path: "/proctor-sessions/{proctor_session_id}/complete"
    description: "record the proctored exam result and any integrity incident observed"
    roles: [PlacementCoordinator]
    code: 200
    input: [score_percent, "integrity_incident?"]
    output: ProctorSession
    side_effects:
      - "status SCHEDULED -> COMPLETED (terminal)"
      - "sets the enrollment's proctored_exam_percent and re-derives mastery_pct and projected_credits"
      - "moves the enrollment's integrity_state CLEAR -> FLAGGED when integrity_incident is true"

  - method: POST
    path: "/proctor-sessions/{proctor_session_id}/no-show"
    description: "mark a scheduled proctored exam as a no-show, releasing the station interval"
    roles: [PlacementCoordinator]
    code: 200
    input: ["no_show_note?"]
    output: ProctorSession
    side_effects: ["status SCHEDULED -> NO_SHOW (terminal)", "releases the station interval so an overlapping booking succeeds", "decrements ProctorStation.scheduled_session_count by 1"]

  # ---------- SupportProvider ----------
  - method: POST
    path: "/support-providers"
    description: "assign an on-site support provider to a center with a concurrent caseload cap"
    roles: [DistrictAdmin]
    code: 201
    input: [center_id, role_type, full_name, "max_concurrent_students?"]
    output: SupportProvider
    side_effects: ["applies default max_concurrent_students 4 when omitted", "completed_session_count derives to 0"]

  - method: GET
    path: "/support-providers/{support_provider_id}"
    description: "read one on-site support provider"
    roles: [DistrictAdmin, PlacementCoordinator, SupportProviderStaff]
    code: 200
    input: []
    output: SupportProvider
    side_effects: []

  - method: GET
    path: "/support-providers"
    description: "list on-site support providers filtered by center or role type"
    roles: [DistrictAdmin, PlacementCoordinator]
    code: 200
    input: ["center_id?", "role_type?"]
    output: SupportProvider[]
    side_effects: []

  # ---------- SupportSession ----------
  - method: POST
    path: "/support-sessions"
    description: "schedule an on-site support service for a placement, enforcing the provider's concurrent caseload cap over closed intervals"
    roles: [PlacementCoordinator, SupportProviderStaff]
    code: 201
    input: [support_provider_id, placement_id, start_at, end_at, service_code]
    output: SupportSession
    side_effects:
      - "status starts at SCHEDULED"
      - "rejects the booking with ERR_PROVIDER_CENTER_MISMATCH when the provider's center differs from the placement's center"
      - "rejects the booking with ERR_PROVIDER_CAPACITY_EXCEEDED when the count of intersecting SCHEDULED and COMPLETED sessions plus this one exceeds max_concurrent_students under closed-interval comparison"

  - method: GET
    path: "/support-sessions/{support_session_id}"
    description: "read one on-site support session"
    roles: [PlacementCoordinator, SupportProviderStaff, DistrictAdmin]
    code: 200
    input: []
    output: SupportSession
    side_effects: []

  - method: GET
    path: "/support-sessions"
    description: "list on-site support sessions filtered by provider, placement or status"
    roles: [PlacementCoordinator, SupportProviderStaff, DistrictAdmin]
    code: 200
    input: ["support_provider_id?", "placement_id?", "status?"]
    output: SupportSession[]
    side_effects: []

  - method: POST
    path: "/support-sessions/{support_session_id}/complete"
    description: "record delivery of an on-site support service"
    roles: [SupportProviderStaff]
    code: 200
    input: [minutes_delivered, "completion_note?"]
    output: SupportSession
    side_effects:
      - "status SCHEDULED -> COMPLETED (terminal)"
      - "increments SupportProvider.completed_session_count by 1"
      - "increments the placement's support_sessions_completed and re-derives engagement_bonus and readiness_score"

  # ---------- Test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock, which every pacing, expiry and interval rule reads. Startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. The clock may only move forward."
    roles: [DistrictAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["advances the logical clock, changing elapsed_days for every enrollment and therefore pace_index, pacing_flag and readiness_score"]

# §1.6 Error Code Catalog
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_FORBIDDEN_CENTER_SCOPE
    http: 403
    condition: "a PlacementCoordinator acts on a resource whose center_id differs from the acting X-User-ID"
  - id: ERR_FORBIDDEN_SCHOOL_SCOPE
    http: 403
    condition: "a HomeSchoolCounselor acts on a student whose home_school_id differs from the acting X-User-ID"
  - id: ERR_FORBIDDEN_PROVIDER_SCOPE
    http: 403
    condition: "a SupportProviderStaff acts on a support session whose support_provider_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the paired upstream step: awarding or denying credit on an enrollment it submitted, or approving a re-entry it requested"

  # --- existence ---
  - id: ERR_HOME_SCHOOL_NOT_FOUND
    http: 404
    condition: "home_school_id in path or body matches no HomeSchool"
  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "center_id in path or body matches no Center"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id in path or body matches no Student"
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "course_id in path or body matches no Course"
  - id: ERR_PRIOR_RECORD_NOT_FOUND
    http: 404
    condition: "prior_course_record_id in path or body matches no PriorCourseRecord"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id or prior_referral_id matches no Referral"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id in path or body matches no Placement"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "course_enrollment_id in path or body matches no CourseEnrollment"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "credit_award_id in path matches no CreditAward"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "graduation_plan_id in path matches no GraduationPlan, or an award is attempted for a student who has no GraduationPlan"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "proctor_station_id in path or body matches no ProctorStation"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "proctor_session_id in path matches no ProctorSession"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "support_provider_id in path or body matches no SupportProvider"
  - id: ERR_SUPPORT_SESSION_NOT_FOUND
    http: 404
    condition: "support_session_id in path matches no SupportSession"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input is missing, an enum value is outside its declared domain, a numeric is outside its declared range, or a date/boolean is malformed"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "scheduled_end is not strictly after scheduled_start, or end_at is not strictly after start_at"

  # --- optimistic concurrency ---
  - id: ERR_STALE_PLACEMENT_VERSION
    http: 412
    condition: "expected_placement_version on POST /course-enrollments does not equal the placement's current version"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_graduation_plan_version on award-credit does not equal the graduation plan's current version"
  - id: ERR_STALE_CENTER_VERSION
    http: 412
    condition: "expected_center_version on offer or staffing update does not equal the center's current version"

  # --- state preconditions ---
  - id: ERR_REFERRAL_STATE_INVALID
    http: 409
    condition: "the referral is not in a status that permits the requested transition (screen, request-info, resubmit, offer, waitlist, deny, withdraw-offer, accept-offer)"
  - id: ERR_PLACEMENT_STATE_INVALID
    http: 409
    condition: "the placement is not in a status that permits the requested transition (attendance, request-re-entry, approve-re-entry, deny-re-entry, exit), including any action on a RE_ENTERED or EXITED_UNSUCCESSFUL placement"
  - id: ERR_ENROLLMENT_STATE_INVALID
    http: 409
    condition: "the enrollment's progress_state or integrity_state does not permit the requested transition (progress, submit-for-award, award-credit, deny-award, flag-integrity, resolve-integrity)"
  - id: ERR_AWARD_STATE_INVALID
    http: 409
    condition: "a void is attempted on an award whose status is already VOIDED"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "activation is attempted on a plan that is not DRAFT, or credit is awarded against a plan whose status is DRAFT"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "complete or no-show is attempted on a proctor session that is not SCHEDULED"
  - id: ERR_SUPPORT_SESSION_STATE_INVALID
    http: 409
    condition: "complete is attempted on a support session that is not SCHEDULED"

  # --- uniqueness ---
  - id: ERR_DUPLICATE_STATE_STUDENT_ID
    http: 409
    condition: "state_student_id already exists on another Student"
  - id: ERR_DUPLICATE_COURSE_CODE
    http: 409
    condition: "code already exists on another Course"
  - id: ERR_DUPLICATE_PLAN
    http: 409
    condition: "the student already has a GraduationPlan"
  - id: ERR_DUPLICATE_ACTIVE_REFERRAL
    http: 409
    condition: "the student already has a Referral in status SUBMITTED, SCREENING, INFO_REQUESTED, PLACEMENT_OFFERED or WAITLISTED"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "the placement already has a CourseEnrollment for this course whose progress_state is not AWARD_DENIED"
  - id: ERR_PRIOR_RECORD_ALREADY_ENROLLED
    http: 409
    condition: "the supplied prior_course_record_id already backs an in-flight CREDIT_RECOVERY enrollment whose progress_state is IN_PROGRESS or SUBMITTED_FOR_AWARD"

  # --- academic integrity (safety) ---
  - id: ERR_INTEGRITY_HOLD
    http: 409
    condition: "progress, award submission, award or re-entry request is attempted while an involved enrollment has integrity_state FLAGGED"
  - id: ERR_PROCTORED_EXAM_MISSING
    http: 409
    condition: "submit-for-award on a course with proctoring_required true while the enrollment has zero COMPLETED ProctorSessions"
  - id: ERR_PROCTORING_POLICY_VIOLATION
    http: 409
    condition: "a proctor session is booked for an enrollment whose course has proctoring_required false"

  # --- catalog and recovery eligibility (referential) ---
  - id: ERR_MISSING_PRIOR_RECORD
    http: 409
    condition: "enrollment_type is CREDIT_RECOVERY and prior_course_record_id is absent"
  - id: ERR_COURSE_NOT_PREVIOUSLY_FAILED
    http: 409
    condition: "the supplied prior course record's outcome is not FAILED, so the course was never failed and is ineligible for credit recovery"
  - id: ERR_PRIOR_RECORD_MISMATCH
    http: 409
    condition: "the supplied prior course record belongs to another student or another course than the enrollment being created"
  - id: ERR_PRIOR_RECORD_ALREADY_REPLACED
    http: 409
    condition: "the supplied prior course record's replacement_status is already REPLACED"
  - id: ERR_STATION_CENTER_MISMATCH
    http: 409
    condition: "the proctor station's center differs from the center of the enrollment's placement"
  - id: ERR_PROVIDER_CENTER_MISMATCH
    http: 409
    condition: "the support provider's center differs from the placement's center"

  # --- resource interval conflicts (temporal) ---
  - id: ERR_STATION_CONFLICT
    http: 409
    condition: "the requested proctor interval overlaps an existing SCHEDULED or COMPLETED session on the same station under half-open comparison extended by turnaround_buffer_minutes"
  - id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested support interval would make the provider's intersecting SCHEDULED and COMPLETED session count exceed max_concurrent_students under closed-interval comparison"

  # --- re-entry gates ---
  - id: ERR_PLAN_POSTURE_BLOCKS_RE_ENTRY
    http: 409
    condition: "re-entry is requested while the student's graduation plan posture is OFF_TRACK"
  - id: ERR_ATTENDANCE_BELOW_MINIMUM
    http: 409
    condition: "re-entry is requested while attendance_rate is below 0.9000 or null"
  - id: ERR_READINESS_BELOW_THRESHOLD
    http: 409
    condition: "re-entry is requested while readiness_score is below 0.7500"

  # --- credit award gates ---
  - id: ERR_FINAL_PERCENT_BELOW_PASSING
    http: 409
    condition: "award is attempted while final_percent is below the course's min_passing_percent"
  - id: ERR_MASTERY_NOT_MET
    http: 409
    condition: "award is attempted under COMPETENCY policy while mastery_pct is below 70.00"
  - id: ERR_SEAT_TIME_INSUFFICIENT
    http: 409
    condition: "award is attempted under SEAT_TIME policy while the seat-hour computation yields 0.00 credits"

  # --- capacity and staffing (fiscal) ---
  - id: ERR_INTAKE_FROZEN
    http: 409
    condition: "an offer or a new enrollment is attempted at a center whose intake_posture is FROZEN"
  - id: ERR_INTAKE_RESTRICTED
    http: 409
    condition: "an offer is attempted at a RESTRICTED center for a referral that is neither on the BEHAVIOR pathway nor scored at priority_score >= 0.5000"
  - id: ERR_STAFFING_RATIO_EXCEEDED
    http: 409
    condition: "a staffing update would drive staffing_headroom below zero against the center's existing ACTIVE and RE_ENTRY_PENDING placements"

  # --- logical clock ---
  - id: ERR_CLOCK_BACKWARD
    http: 409
    condition: "current_utc is earlier than the logical clock's present value"

# §1.7 RBAC Matrix — segregation of duties: the staff member who submits work may not award it,
# and the coordinator who requests a re-entry may not approve it.
roles:
  - name: DistrictAdmin
    description: "district office operator; opens centers and schools, revises staffing, adjudicates integrity findings, approves or denies re-entry to the home school, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /centers"
      - "POST /home-schools"
      - "POST /courses"
      - "PATCH /centers/{center_id}/staffing"
      - "POST /support-providers"
      - "POST /placements/{placement_id}/approve-re-entry"
      - "POST /placements/{placement_id}/deny-re-entry"
