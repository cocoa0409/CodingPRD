              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { entry_fast_northu: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "CHEAP rota", material_type: "LOAN", selection_policy: "MANUAL_RANK", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
