  # =========================================================================
  # Guide section 8 - Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_unit_version_rejects_tracer_schedule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tracer-schedule-stale-unit]
          - errors[ERR_STALE_UNIT_VERSION]
        distinguishing_aspect: "Scheduling a second, non-overlapping tracer with the version read before the first schedule returns ERR_STALE_UNIT_VERSION (412); replaying the same payload with the refreshed version succeeds, proving the rejection is concurrency and not a window conflict."
        test_recipe:
          setup:
            - "Chapter EC with one owned standard (MAPPED) and unit ICU-16; two disjoint windows more than 60 minutes apart so tracer occupancy never applies."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { y1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${y1_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { y1_s1: $.data.id }
            - call: "POST /accreditation/standards/${y1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-16", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
              captures: { y1_u: $.data.id, y1_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${y1_u}", chapter_id: "${y1_ch}", tracer_type: "PATIENT", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-20T10:00:00Z", expected_unit_version: "${y1_u_v1}" }
              as: TracerSurveyor
              captures: { y1_t1: $.data.id }
            - call: "GET /accreditation/units/${y1_u}"
              as: TracerSurveyor
              captures: { y1_u_v2: $.data.version, y1_u_sched: $.data.scheduled_tracer_count }
          trigger:
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${y1_u}", chapter_id: "${y1_ch}", tracer_type: "SYSTEM", window_start: "2026-08-21T08:00:00Z", window_end: "2026-08-21T10:00:00Z", expected_unit_version: "${y1_u_v1}" }
              as: TracerSurveyor
              captures: { y1_err: $.data.error_id }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${y1_u}", chapter_id: "${y1_ch}", tracer_type: "SYSTEM", window_start: "2026-08-21T08:00:00Z", window_end: "2026-08-21T10:00:00Z", expected_unit_version: "${y1_u_v2}" }
              as: TracerSurveyor
              captures: { y1_t2: $.data.id, y1_t2_state: $.data.state }
          assert:
            - "${y1_u_v2} is exactly one greater than ${y1_u_v1} and ${y1_u_sched} == 1"
            - "${y1_err} == ERR_STALE_UNIT_VERSION with HTTP 412 while HospitalUnit.${y1_u}.scheduled_tracer_count stays 1"
            - "${y1_t2_state} == SCHEDULED and HospitalUnit.${y1_u}.scheduled_tracer_count == 2 after the refreshed retry"

