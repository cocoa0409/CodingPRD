# =============================================================================
# Task 1973: BIT & Care Referral — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 difficulty rules x 2 instances.
# All chains start from empty DB; clock default 2026-08-01T00:00:00Z unless set.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: risk_scoring_initial_vs_reassessment_variants
        grounds:
          - calculations.triage_risk_score
          - entities.CareCase.fields.current_risk_score
          - entities.RiskScoring.fields.mode
        distinguishing_aspect: |
          Two valid scoring algorithms on CareCase risk produce different results for
          identical dimension inputs: INITIAL is a pure weighted formula, REASSESSMENT
          blends 0.6*base + 0.4*previous_score — same dimensions (25,17,2,0) yield
          60.0 under INITIAL and 48.0 under REASSESSMENT after a 30.0 prior.
        test_recipe:
          setup:
            - "staff: chair (BIT_OFFICE), cm (BIT_OFFICE), rep (FACULTY_AFFAIRS)"
            - "students s1, s2; case c1 for s1 (INTAKE), case c2 for s2 (INTAKE)"
            - "c1 scored INITIAL dims (25,17,2,0) -> 60.0 HIGH"
            - "c2 scored INITIAL dims (15,0,15,0) -> 30.0 MODERATE"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S1001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S1002", full_name: "Stu Two" }, as: SystemAdmin, captures: { s2: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "missed classes", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s2}", category: WELLBEING_GENERAL, narrative: "withdrawn", observed_at: "2026-07-31T11:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r2: $.data.id } }
            - { call: "POST /bit/concern-reports/${r2}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r2}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c2: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 25, harm_to_others: 17, academic_disruption: 2, substance_involvement: 0, rationale: "initial" }, as: BITChair, as_user_id: "${chair}", captures: { sc1: $.data.id, sc1_score: $.data.score, sc1_tier: $.data.tier } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c2}", mode: INITIAL, harm_to_self: 15, harm_to_others: 0, academic_disruption: 15, substance_involvement: 0, rationale: "initial" }, as: BITChair, as_user_id: "${chair}", captures: { sc2_score: $.data.score } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c2}", mode: REASSESSMENT, harm_to_self: 25, harm_to_others: 17, academic_disruption: 2, substance_involvement: 0, rationale: "reassess" }, as: BITChair, as_user_id: "${chair}", captures: { sc3: $.data.id, sc3_score: $.data.score, sc3_tier: $.data.tier } }
          assert:
            - "RiskScoring.${sc1}.score == 60.0 and RiskScoring.${sc1}.tier == HIGH (4*(0.35*25+0.35*17+0.15*2+0.15*0) = 60.0)"
            - "RiskScoring c2 initial score == 30.0 (4*(0.35*15+0.15*15) = 30.0)"
            - "RiskScoring.${sc3}.score == 48.0 and .tier == MODERATE (0.6*60.0 + 0.4*30.0 = 48.0)"
            - "identical dimension vector (25,17,2,0) yields 60.0 under INITIAL vs 48.0 under REASSESSMENT"

      - name: trend_report_entry_cohort_vs_active_window_variants
        grounds:
          - calculations.trend_report_metrics
          - entities.TrendReport.fields.variant
        distinguishing_aspect: |
          Two valid inclusion rules on the same CareCase population produce different
          metrics: ENTRY_COHORT (created_at in window) totals 2 cases / 50.0% closure,
          ACTIVE_IN_WINDOW (lifetime overlapping window) totals 3 cases / 66.7%
          closure — different entity domain (aggregate TrendReport) from the
          per-case risk scoring variant pair.
        test_recipe:
          setup:
            - "staff chair/cm/rep; students sb, sa, sc"
            - "caseB: created 2026-07-20, triaged LOW, plan approved, 3 STABLE check-ins, closed 2026-08-10 (21.0 days to close)"
            - "caseA: created 2026-08-05, left in INTAKE"
            - "caseC: created 2026-08-15, triaged LOW, plan approved, 3 STABLE check-ins, closed 2026-08-20 (5.0 days to close)"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            # --- caseB created 07-20 ---
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/students", payload: { external_ref: "S2001", full_name: "Stu B" }, as: SystemAdmin, captures: { sb: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${sb}", category: SELF_HARM_RISK, narrative: "nb", observed_at: "2026-07-19T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { rb: $.data.id } }
            - { call: "POST /bit/concern-reports/${rb}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${rb}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { cb: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${cb}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${cb}", as: BITChair, as_user_id: "${chair}", captures: { cbv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${cb}", expected_case_version: "${cbv}", objectives: ["weekly check-in"], success_criteria: "stable" }, as: CaseManager, as_user_id: "${cm}", captures: { pb: $.data.id } }
            - { call: "POST /bit/intervention-plans/${pb}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${pb}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${cb}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { kb1: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${kb1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${cb}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { kb2: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${kb2}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${cb}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { kb3: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${kb3}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            # --- caseA created 08-05, stays INTAKE ---
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/students", payload: { external_ref: "S2002", full_name: "Stu A" }, as: SystemAdmin, captures: { sa: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${sa}", category: ACADEMIC_DISTRESS, narrative: "na", observed_at: "2026-08-04T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { ra: $.data.id } }
            - { call: "POST /bit/concern-reports/${ra}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${ra}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { ca: $.data.care_case_id } }
            # --- caseB closed 08-10 ---
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/care-cases/${cb}/close", as: BITChair, as_user_id: "${chair}" }
            # --- caseC created 08-15, closed 08-20 ---
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/students", payload: { external_ref: "S2003", full_name: "Stu C" }, as: SystemAdmin, captures: { sc: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${sc}", category: SUBSTANCE_CONCERN, narrative: "nc", observed_at: "2026-08-14T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { rc: $.data.id } }
            - { call: "POST /bit/concern-reports/${rc}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${rc}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { cc: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${cc}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${cc}", as: BITChair, as_user_id: "${chair}", captures: { ccv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${cc}", expected_case_version: "${ccv}", objectives: ["weekly check-in"], success_criteria: "stable" }, as: CaseManager, as_user_id: "${cm}", captures: { pc: $.data.id } }
            - { call: "POST /bit/intervention-plans/${pc}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${pc}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${cc}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { kc1: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${kc1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${cc}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { kc2: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${kc2}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${cc}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { kc3: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${kc3}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/care-cases/${cc}/close", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/trend-reports", payload: { term_code: "2026-FALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T23:59:59Z", variant: ENTRY_COHORT }, as: SystemAdmin, captures: { tr_entry: $.data.id, tr_entry_total: $.data.total_cases, tr_entry_closed: $.data.closed_in_window, tr_entry_rate: $.data.closure_rate_pct, tr_entry_avg: $.data.avg_days_to_close } }
            - { call: "POST /bit/trend-reports", payload: { term_code: "2026-FALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T23:59:59Z", variant: ACTIVE_IN_WINDOW }, as: SystemAdmin, captures: { tr_active: $.data.id, tr_active_total: $.data.total_cases, tr_active_closed: $.data.closed_in_window, tr_active_rate: $.data.closure_rate_pct, tr_active_avg: $.data.avg_days_to_close } }
          assert:
            - "TrendReport.${tr_entry}: total_cases == 2 (caseA 08-05, caseC 08-15), closed_in_window == 1 (caseC), closure_rate_pct == 50.0, avg_days_to_close == 5.0"
            - "TrendReport.${tr_active}: total_cases == 3 (caseB lifetime overlaps), closed_in_window == 2 (caseB 08-10, caseC 08-20), closure_rate_pct == 66.7, avg_days_to_close == 13.0 ((21.0+5.0)/2)"
            - "same window and same underlying cases: ENTRY_COHORT and ACTIVE_IN_WINDOW diverge on every metric"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_weighted_threshold_ratchet
        grounds:
          - calculations.triage_risk_score
          - entities.CareCase.fields.current_risk_tier
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — four weighted
          dimensions feed tier thresholds AND a conditional ratchet branch on entity
          state (prior tier IMMINENT floors the new tier at HIGH), so 32.1 maps to
          HIGH instead of the threshold-derived MODERATE.
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 INTAKE"
            - "c1 INITIAL scoring dims (25,25,17,0) -> 80.2 IMMINENT"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S3001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: BEHAVIORAL_THREAT, narrative: "threatening outburst", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 25, harm_to_others: 25, academic_disruption: 17, substance_involvement: 0, rationale: "severe" }, as: BITChair, as_user_id: "${chair}", captures: { sc1: $.data.id, sc1_score: $.data.score, sc1_tier: $.data.tier } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: REASSESSMENT, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "calmer" }, as: BITChair, as_user_id: "${chair}", captures: { sc2: $.data.id, sc2_score: $.data.score, sc2_tier: $.data.tier } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_tier: $.data.current_risk_tier } }
          assert:
            - "RiskScoring.${sc1}.score == 80.2 and .tier == IMMINENT (4*(0.35*25+0.35*25+0.15*17) = 80.2)"
            - "RiskScoring.${sc2}.score == 32.1 (round_half_up(0.6*0 + 0.4*80.2, 1) = round_half_up(32.08, 1) = 32.1)"
            - "RiskScoring.${sc2}.tier == HIGH — threshold bands alone give MODERATE (32.1 < 60), but the IMMINENT ratchet floors the tier at HIGH"
            - "CareCase.${c1}.current_risk_tier == HIGH and .current_risk_score == 32.1"

      - name: trend_category_share_rounding_order
        grounds:
          - calculations.trend_category_distribution
          - entities.TrendReport.fields.category_distribution
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the first four category
          shares are rounded half-up to 0.1 individually (33.3 each) and the LAST
          enum category takes the residual 100 - 99.9 = 0.1, whereas naive
          per-category rounding would give WELLBEING_GENERAL 0.0 and a 99.9 total.
          Different mode from the weighted-threshold formula instance.
        test_recipe:
          setup:
            - "clock at 2026-08-02; staff chair/cm/rep; students s1/s2/s3"
            - "three INTAKE cases, opening report categories ACADEMIC_DISTRESS, BEHAVIORAL_THREAT, SELF_HARM_RISK"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/students", payload: { external_ref: "S4001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S4002", full_name: "Stu Two" }, as: SystemAdmin, captures: { s2: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S4003", full_name: "Stu Three" }, as: SystemAdmin, captures: { s3: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n1", observed_at: "2026-08-01T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s2}", category: BEHAVIORAL_THREAT, narrative: "n2", observed_at: "2026-08-01T11:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r2: $.data.id } }
            - { call: "POST /bit/concern-reports/${r2}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r2}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s3}", category: SELF_HARM_RISK, narrative: "n3", observed_at: "2026-08-01T12:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r3: $.data.id } }
            - { call: "POST /bit/concern-reports/${r3}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r3}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/trend-reports", payload: { term_code: "2026-FALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T23:59:59Z", variant: ENTRY_COHORT }, as: SystemAdmin, captures: { tr: $.data.id, tr_total: $.data.total_cases, tr_dist: $.data.category_distribution } }
          assert:
            - "TrendReport.${tr}.total_cases == 3, closed_in_window == 0, closure_rate_pct == 0.0, avg_days_to_close == 0.0"
            - "TrendReport.${tr}.category_distribution == {ACADEMIC_DISTRESS: 33.3, BEHAVIORAL_THREAT: 33.3, SELF_HARM_RISK: 33.3, SUBSTANCE_CONCERN: 0.0, WELLBEING_GENERAL: 0.1}"
            - "WELLBEING_GENERAL share is the residual 100 - (33.3+33.3+33.3+0.0) = 0.1, not the naive round(0/3) = 0.0 — rounding order is observable"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: care_case_escalation_retriage_cycle
        grounds:
          - state_machines.CareCase.PLAN_ACTIVE_to_TRIAGED
          - state_machines.CareCase.TRIAGED_to_TRIAGED
          - state_machines.FollowUpCheckin.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          CareCase is cyclic: PLAN_ACTIVE loops back to TRIAGED when a check-in
          completes ESCALATED (superseding the ACTIVE plan), and TRIAGED accepts
          further REASSESSMENT scorings — a live A->B->A loop, not a pipeline.
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 triaged LOW (0,0,0,0), plan approved, check-in k1 then successor k2 completed ESCALATED"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S5001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["weekly check-in"], success_criteria: "stable" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k2: "$.data[0].id" } }
          trigger:
            - { call: "POST /bit/follow-up-checkins/${k2}/complete", payload: { outcome: ESCALATED, note: "deteriorating" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status, c1_streak: $.data.consecutive_stable_checkins } }
            - { call: "GET /bit/intervention-plans/${p1}", as: BITChair, as_user_id: "${chair}", captures: { p1_status: $.data.status } }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: REASSESSMENT, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "re-triage after escalation" }, as: BITChair, as_user_id: "${chair}", captures: { sc2_score: $.data.score, sc2_tier: $.data.tier } }
          assert:
            - "CareCase.${c1}.status == TRIAGED (cycle PLAN_ACTIVE -> TRIAGED) and .consecutive_stable_checkins == 0"
            - "InterventionPlan.${p1}.status == SUPERSEDED"
            - "GET /bit/follow-up-checkins?case_id&status=SCHEDULED returns total_count == 0 (ESCALATED creates no successor)"
            - "REASSESSMENT after the loop scores 0.0 LOW (0.6*0 + 0.4*0.0), case remains TRIAGED — the cycle is re-enterable"

      - name: intervention_plan_revision_loop
        grounds:
          - state_machines.InterventionPlan.PENDING_APPROVAL_to_DRAFT
          - state_machines.InterventionPlan.DRAFT_to_PENDING_APPROVAL
        distinguishing_aspect: |
          InterventionPlan has a revision cycle DRAFT -> PENDING_APPROVAL -> DRAFT
          -> PENDING_APPROVAL -> ACTIVE on a different entity than CareCase's
          escalation loop — two distinct non-linear machines.
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 triaged LOW; plan p1 drafted"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S5002", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["tutoring"], success_criteria: "grades recover" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
          trigger:
            - { call: "POST /bit/intervention-plans/${p1}/return", payload: { revision_note: "add measurable objectives" }, as: BITChair, as_user_id: "${chair}", captures: { p1_st1: $.data.status, p1_note: $.data.revision_note } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}", captures: { p1_st2: $.data.status } }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}", captures: { p1_st3: $.data.status } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status } }
          assert:
            - "plan status sequence: PENDING_APPROVAL -> DRAFT (return) -> PENDING_APPROVAL (resubmit) -> ACTIVE (approve)"
            - "InterventionPlan.${p1}.revision_note == \"add measurable objectives\" after the return"
            - "CareCase.${c1}.status == PLAN_ACTIVE after the looped plan is finally approved"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: not_cleared_outcome_to_leave_decision_chain
        grounds:
          - state_machines.CareCase.MANDATED_ASSESSMENT_to_LEAVE_DECISION
          - state_machines.MandatedAssessment.SCHEDULED_to_COMPLETED
          - state_machines.FollowUpCheckin.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 transitive chain triggered by record-outcome NOT_CLEARED:
          assessment -> COMPLETED causes case -> LEAVE_DECISION, which creates a
          PENDING LeaveDecision, whose creation cancels every SCHEDULED
          FollowUpCheckin — each link is caused by the previous one, not fan-out.
        test_recipe:
          setup:
            - "staff chair/cm/rep/eval (COUNSELING_CENTER); student s1; case c1 PLAN_ACTIVE with one SCHEDULED check-in k1"
            - "mandated assessment a1 ordered (due 2026-08-10), case -> MANDATED_ASSESSMENT"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S6001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["safety plan"], success_criteria: "stable" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "escalating risk" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /bit/mandated-assessments/${a1}/record-outcome", payload: { outcome: NOT_CLEARED, findings_summary: "does not meet criteria to remain enrolled" }, as: CounselingEvaluator, as_user_id: "${ev}" }
            - { call: "GET /bit/mandated-assessments/${a1}", as: BITChair, as_user_id: "${chair}", captures: { a1_status: $.data.status } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status } }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld1: "$.data[0].id", ld1_status: "$.data[0].status", ld1_req: "$.data[0].requested_by" } }
            - { call: "GET /bit/follow-up-checkins/${k1}", as: BITChair, as_user_id: "${chair}", captures: { k1_status: $.data.status } }
          assert:
            - "MandatedAssessment.${a1}.status == COMPLETED (link 1)"
            - "CareCase.${c1}.status == LEAVE_DECISION (link 2, caused by link 1)"
            - "GET /bit/leave-decisions?case_id: exactly one record, status == PENDING, requested_by == ${chair} (link 3, caused by link 2)"
            - "FollowUpCheckin.${k1}.status == CANCELLED (link 4, caused by link 3's cadence suspension)"

      - name: imminent_tier_auto_disclosure_grants
        grounds:
          - state_machines.CareCase.TRIAGED_to_TRIAGED
          - calculations.triage_risk_score
          - entities.DisclosureGrant.fields.auto_approved
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /bit/risk-scorings):
          scoring creation updates CareCase.current_risk_tier, and the tier crossing
          INTO IMMINENT itself auto-creates two APPROVED SAFETY_MINIMUM
          DisclosureGrants — a privacy-override propagation, not a decision cascade.
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 INTAKE"
            - "INITIAL scoring dims (25,17,2,0) -> 60.0 HIGH (below IMMINENT; no grants)"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S6002", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: BEHAVIORAL_THREAT, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 25, harm_to_others: 17, academic_disruption: 2, substance_involvement: 0, rationale: "high" }, as: BITChair, as_user_id: "${chair}", captures: { sc1_tier: $.data.tier } }
            - { call: "GET /bit/disclosure-grants", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: REASSESSMENT, harm_to_self: 25, harm_to_others: 25, academic_disruption: 25, substance_involvement: 25, rationale: "imminent danger" }, as: BITChair, as_user_id: "${chair}", captures: { sc2_score: $.data.score, sc2_tier: $.data.tier } }
            - { call: "GET /bit/disclosure-grants", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { g1_office: "$.data[0].to_office", g1_scope: "$.data[0].scope", g1_status: "$.data[0].status", g1_auto: "$.data[0].auto_approved" } }
          assert:
            - "first scoring tier == HIGH and GET /bit/disclosure-grants?case_id returned total_count == 0 before the crossing"
            - "RiskScoring second score == 84.0 (0.6*100 + 0.4*60.0) and tier == IMMINENT — crossing INTO IMMINENT"
            - "after crossing: exactly 2 DisclosureGrants for the case, both status == APPROVED, scope == SAFETY_MINIMUM, auto_approved == true, requested_by == null"
            - "grant offices are exactly {COUNSELING_CENTER, CAMPUS_SAFETY}"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: triage_state_vs_rubric_range_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_CASE_NOT_TRIAGEABLE]
          - errors[ERR_RUBRIC_SCORE_OUT_OF_RANGE]
        distinguishing_aspect: |
          Pair state vs business_constraint: a REASSESSMENT scoring on a
          PLAN_ACTIVE case violates the state precondition AND carries an
          out-of-range dimension (30); the state error ERR_CASE_NOT_TRIAGEABLE
          (priority 5) must win over ERR_RUBRIC_SCORE_OUT_OF_RANGE (priority 9).
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 driven all the way to PLAN_ACTIVE (triaged LOW, plan approved)"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S7001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: REASSESSMENT, harm_to_self: 30, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "bad dim" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CASE_NOT_TRIAGEABLE (HTTP 409) — state precondition (priority 5) beats the out-of-range rubric dimension (priority 9) even though harm_to_self=30 also violates ERR_RUBRIC_SCORE_OUT_OF_RANGE"
            - "CareCase.${c1} unchanged: still PLAN_ACTIVE, no new RiskScoring persisted"

      - name: grant_window_shape_vs_overlap_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_DISCLOSURE_WINDOW_INVALID]
          - errors[ERR_DISCLOSURE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pair business_constraint vs business_temporal (different categories than
          the state/constraint instance): a grant request whose window is inverted
          (expires_at < effective_from) AND whose raw values overlap an existing
          APPROVED grant must fail with ERR_DISCLOSURE_WINDOW_INVALID (priority 9),
          not ERR_DISCLOSURE_WINDOW_OVERLAP (priority 10).
        test_recipe:
          setup:
            - "staff chair/cm/rep/po; student s1; case c1 INTAKE"
            - "grant g1 APPROVED for (c1, RESIDENCE_LIFE) window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Privacy One", office: PRIVACY_OFFICE }, as: SystemAdmin, captures: { po: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S7002", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: RESIDENCE_LIFE, scope: FULL_RECORD, effective_from: "2026-09-01T00:00:00Z", expires_at: "2026-10-01T00:00:00Z", purpose: "housing coordination" }, as: CaseManager, as_user_id: "${cm}", captures: { g1: $.data.id } }
            - { call: "POST /bit/disclosure-grants/${g1}/approve", as: PrivacyOfficer, as_user_id: "${po}" }
          trigger:
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: RESIDENCE_LIFE, scope: FULL_RECORD, effective_from: "2026-09-15T00:00:00Z", expires_at: "2026-09-10T00:00:00Z", purpose: "inverted and overlapping" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISCLOSURE_WINDOW_INVALID (HTTP 400) — window-shape constraint (priority 9) beats the temporal overlap check (priority 10), even though the raw interval also intersects grant ${g1}'s window"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: risk_tier_threshold_at_60
        grounds:
          - calculations.triage_risk_score
          - entities.RiskScoring.fields.tier
        distinguishing_aspect: |
          Numeric threshold precision on the risk-score metric: score exactly 60.0
          maps to HIGH (>= semantics) while 59.8 maps to MODERATE — exercised via
          POST /bit/risk-scorings.
        test_recipe:
          setup:
            - "staff chair/cm/rep; students s1, s2; cases c1 and c2 in INTAKE"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S8001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S8002", full_name: "Stu Two" }, as: SystemAdmin, captures: { s2: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s2}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r2: $.data.id } }
            - { call: "POST /bit/concern-reports/${r2}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r2}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c2: $.data.care_case_id } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 25, harm_to_others: 17, academic_disruption: 2, substance_involvement: 0, rationale: "edge" }, as: BITChair, as_user_id: "${chair}", captures: { sc_hi: $.data.id, sc_hi_score: $.data.score, sc_hi_tier: $.data.tier } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c2}", mode: INITIAL, harm_to_self: 25, harm_to_others: 16, academic_disruption: 4, substance_involvement: 0, rationale: "just below" }, as: BITChair, as_user_id: "${chair}", captures: { sc_lo: $.data.id, sc_lo_score: $.data.score, sc_lo_tier: $.data.tier } }
          assert:
            - "RiskScoring.${sc_hi}: score == 60.0 exactly (4*(8.75+5.95+0.30)) and tier == HIGH — >= 60 boundary inclusive"
            - "RiskScoring.${sc_lo}: score == 59.8 (4*(8.75+5.60+0.60)) and tier == MODERATE — just below the boundary"

      - name: closure_at_exactly_three_stable_checkins
        grounds:
          - calculations.closure_eligibility
          - state_machines.CareCase.PLAN_ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Count-based boundary on a different metric (consecutive STABLE check-ins,
          not a score) via a different endpoint (POST /bit/care-cases/{id}/close):
          2 consecutive STABLE fails, exactly 3 succeeds (>= 3 semantics).
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 PLAN_ACTIVE with tier LOW (default clock 2026-08-01T00:00:00Z)"
            - "two check-ins completed STABLE (consecutive_stable_checkins == 2)"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S8003", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k2: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k2}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
          trigger:
            - { call: "POST /bit/care-cases/${c1}/close", as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k3: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k3}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/care-cases/${c1}/close", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status, c1_closed: $.data.closed_at } }
          assert:
            - "first close attempt: error_id == ERR_CASE_NOT_CLOSABLE (HTTP 409) at consecutive_stable_checkins == 2"
            - "after the third STABLE completion consecutive_stable_checkins == 3 and the second close returns 200"
            - "CareCase.${c1}.status == CLOSED and closed_at == 2026-08-01T00:00:00Z (default clock) — exactly 3 qualifies (>= semantics)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_approve_requires_case_plan_drafting
        grounds:
          - state_machines.InterventionPlan.PENDING_APPROVAL_to_ACTIVE
          - state_machines.CareCase.PLAN_ACTIVE_to_MANDATED_ASSESSMENT
          - errors[ERR_CASE_STATE_BLOCKS_PLAN_APPROVAL]
        distinguishing_aspect: |
          InterventionPlan's approvability depends on CareCase state (pair
          InterventionPlan -> CareCase): a PENDING_APPROVAL plan cannot be approved
          once the case has moved to MANDATED_ASSESSMENT.
        test_recipe:
          setup:
            - "staff chair/cm/rep/eval; student s1; case c1 PLAN_ACTIVE (plan p1 ACTIVE)"
            - "revision plan p2 drafted while case PLAN_ACTIVE (case state unchanged), submitted"
            - "mandated assessment ordered -> case moves to MANDATED_ASSESSMENT while p2 is PENDING_APPROVAL"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S9001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o1"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv2}", objectives: ["o2"], success_criteria: "s2" }, as: CaseManager, as_user_id: "${cm}", captures: { p2: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p2}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "escalation" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /bit/intervention-plans/${p2}/approve", as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CASE_STATE_BLOCKS_PLAN_APPROVAL (HTTP 409): plan p2 is PENDING_APPROVAL but CareCase.${c1} is MANDATED_ASSESSMENT, not in {PLAN_DRAFTING, PLAN_ACTIVE}"
            - "InterventionPlan.${p2} remains PENDING_APPROVAL; InterventionPlan.${p1} remains ACTIVE (no supersede side effect fired)"

      - name: report_requires_student_enrolled
        grounds:
          - validations[priority=8]
          - errors[ERR_STUDENT_NOT_ACTIVE]
          - entities.Student.fields.enrollment_status
        distinguishing_aspect: |
          ConcernReport creation depends on Student state (pair ConcernReport ->
          Student): a report for a WITHDRAWN student is rejected — a different
          entity pair than the plan/case dependency.
        test_recipe:
          setup:
            - "staff rep; student s1 with enrollment_status patched to WITHDRAWN"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S9002", full_name: "Stu Out" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "PATCH /bit/students/${s1}", payload: { enrollment_status: WITHDRAWN }, as: SystemAdmin }
          trigger:
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "worried", observed_at: "2026-08-01T09:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { err: $.data.error_id } }
            - { call: "GET /bit/concern-reports", payload: { student_id: "${s1}" }, as: BITChair, as_user_id: "${chair}" }
          assert:
            - "error_id == ERR_STUDENT_NOT_ACTIVE (HTTP 409): Student.${s1}.enrollment_status == WITHDRAWN blocks intake"
            - "no ConcernReport persisted for ${s1} (list total_count == 0)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: disclosure_grant_half_open_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_DISCLOSURE_WINDOW_OVERLAP]
          - entities.DisclosureGrant.fields.expires_at
        distinguishing_aspect: |
          DisclosureGrant windows use HALF-OPEN [effective_from, expires_at)
          semantics per (case_id, to_office): a strictly intersecting request is
          rejected, while an adjacent request starting exactly at the existing
          grant's expires_at is allowed.
        test_recipe:
          setup:
            - "staff chair/cm/rep/po; student s1; case c1 INTAKE"
            - "grant g1 APPROVED for (c1, RESIDENCE_LIFE) covering [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Privacy One", office: PRIVACY_OFFICE }, as: SystemAdmin, captures: { po: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S1001", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: RESIDENCE_LIFE, scope: FULL_RECORD, effective_from: "2026-09-01T00:00:00Z", expires_at: "2026-10-01T00:00:00Z", purpose: "housing coordination" }, as: CaseManager, as_user_id: "${cm}", captures: { g1: $.data.id } }
            - { call: "POST /bit/disclosure-grants/${g1}/approve", as: PrivacyOfficer, as_user_id: "${po}" }
          trigger:
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: RESIDENCE_LIFE, scope: FULL_RECORD, effective_from: "2026-09-15T00:00:00Z", expires_at: "2026-11-01T00:00:00Z", purpose: "overlapping" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: RESIDENCE_LIFE, scope: SUMMARY_ONLY, effective_from: "2026-10-01T00:00:00Z", expires_at: "2026-11-01T00:00:00Z", purpose: "adjacent renewal" }, as: CaseManager, as_user_id: "${cm}", captures: { g2: $.data.id, g2_status: $.data.status } }
          assert:
            - "overlapping request rejected: error_id == ERR_DISCLOSURE_WINDOW_OVERLAP (HTTP 409) — [09-15, 11-01) intersects [09-01, 10-01)"
            - "adjacent request succeeds: DisclosureGrant.${g2} created with status == REQUESTED — new.effective_from == existing.expires_at does NOT intersect under half-open semantics"

      - name: assessment_slot_closed_interval_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_ASSESSMENT_ALREADY_PENDING]
          - state_machines.MandatedAssessment.SCHEDULED_to_EXPIRED
        distinguishing_aspect: |
          MandatedAssessment occupies the case's assessment slot as a CLOSED
          interval [ordered_at, due_at] with capacity 1, released only by
          completion or the EXPIRED sweep — different interval semantics (closed,
          capacity-bound) and different resource than the half-open disclosure
          window.
        test_recipe:
          setup:
            - "staff chair/cm/rep/eval/dean; student s1; case c1 PLAN_ACTIVE (tier HIGH)"
            - "assessment a1 ordered at default clock 2026-08-01 with due_at 2026-08-10 -> SCHEDULED"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Dean One", office: DEAN_OF_STUDENTS }, as: SystemAdmin, captures: { dean: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S1002", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "first" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-12T00:00:00Z", rationale: "second while occupied" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /bit/mandated-assessments/${a1}", as: BITChair, as_user_id: "${chair}", captures: { a1_status: $.data.status } }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld1: "$.data[0].id" } }
            - { call: "POST /bit/leave-decisions/${ld1}/decide", payload: { decision: DENY_LEAVE, rationale: "insufficient grounds" }, as: DeanOfStudents, as_user_id: "${dean}" }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-20T00:00:00Z", rationale: "third after release" }, as: BITChair, as_user_id: "${chair}", captures: { a3: $.data.id, a3_status: $.data.status } }
          assert:
            - "second order rejected: error_id == ERR_ASSESSMENT_ALREADY_PENDING (HTTP 409) — slot [2026-08-01, 2026-08-10] closed-interval occupied"
            - "after clock 2026-08-11 sweep: MandatedAssessment.${a1}.status == EXPIRED and the LEAVE_DECISION cascade produced a PENDING LeaveDecision"
            - "DENY_LEAVE by dean (requested_by ${chair} != ${dean}) returns the case to PLAN_ACTIVE"
            - "third order succeeds: MandatedAssessment.${a3}.status == SCHEDULED — expiry released the slot"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: single_active_plan_per_case
        grounds:
          - state_machines.InterventionPlan.PENDING_APPROVAL_to_ACTIVE
          - state_machines.InterventionPlan.ACTIVE_to_SUPERSEDED
          - entities.InterventionPlan.fields.supersedes_plan_id
        distinguishing_aspect: |
          Conserved quantity: count(InterventionPlan[case_id=C, status=ACTIVE]).
          The approve-new/supersede-old pair leaves it at exactly 1: approval of a
          revision plan compensates by superseding the previously ACTIVE plan,
          pinned by supersedes_plan_id.
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 PLAN_ACTIVE with plan p1 ACTIVE"
            - "revision plan p2 drafted (case stays PLAN_ACTIVE) and submitted"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S1101", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o1"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/intervention-plans", payload: { case_id: "${c1}", status: ACTIVE }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv2}", objectives: ["o2"], success_criteria: "s2" }, as: CaseManager, as_user_id: "${cm}", captures: { p2: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p2}/submit", as: CaseManager, as_user_id: "${cm}" }
          trigger:
            - { call: "POST /bit/intervention-plans/${p2}/approve", as: BITChair, as_user_id: "${chair}", captures: { p2_status: $.data.status, p2_sup: $.data.supersedes_plan_id } }
            - { call: "GET /bit/intervention-plans/${p1}", as: BITChair, as_user_id: "${chair}", captures: { p1_status: $.data.status } }
            - { call: "GET /bit/intervention-plans", payload: { case_id: "${c1}", status: ACTIVE }, as: BITChair, as_user_id: "${chair}" }
          assert:
            - "before the pair: exactly 1 ACTIVE plan for the case (p1); after: still exactly 1 (p2)"
            - "InterventionPlan.${p1}.status == SUPERSEDED and InterventionPlan.${p2}.status == ACTIVE"
            - "InterventionPlan.${p2}.supersedes_plan_id == ${p1} — forward action (approve) + compensating action (supersede) conserve count(ACTIVE plans per case) == 1"

      - name: single_scheduled_checkin_per_case
        grounds:
          - state_machines.FollowUpCheckin.SCHEDULED_to_COMPLETED
          - calculations.followup_cadence_schedule
          - entities.CareCase.fields.consecutive_stable_checkins
        distinguishing_aspect: |
          Conserved quantity: count(FollowUpCheckin[case_id=C, status=SCHEDULED])
          == 1 while the case is PLAN_ACTIVE. Completing a check-in consumes the
          slot (1->0) and the successor creation restores it (0->1) — a different
          conserved quantity than the active-plan count.
        test_recipe:
          setup:
            - "staff chair/cm/rep; student s1; case c1 PLAN_ACTIVE, tier LOW (cadence 30 days), default clock 2026-08-01T00:00:00Z"
            - "check-in k1 SCHEDULED with due_at 2026-08-31T00:00:00Z"
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S1102", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id", k1_due: "$.data[0].due_at" } }
          trigger:
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}", captures: { k1_status: $.data.status, k1_completed: $.data.completed_at } }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k2: "$.data[0].id", k2_due: "$.data[0].due_at" } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { streak: $.data.consecutive_stable_checkins } }
          assert:
            - "before completion: exactly 1 SCHEDULED check-in; after completion: still exactly 1 (successor ${k2}) — the complete+schedule pair conserves the scheduled-slot count"
            - "FollowUpCheckin.${k1}.status == COMPLETED with completed_at == 2026-08-01T00:00:00Z"
            - "k1.due_at == 2026-08-31T00:00:00Z (approval + 30 days at LOW cadence) and k2.due_at == 2026-08-31T00:00:00Z (completed_at + 30 days)"
            - "CareCase.${c1}.consecutive_stable_checkins == 1"
