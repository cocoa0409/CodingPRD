              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e18_id}", from_project_id: "${p_org_id}", to_project_id: "${p_dst_id}", lowboy_id: "${l18_id}", depart_at: "2026-08-12T08:00:00Z", arrive_at: "2026-08-12T12:00:00Z" }
