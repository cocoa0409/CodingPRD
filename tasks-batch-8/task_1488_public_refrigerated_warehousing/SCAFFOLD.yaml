# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, invalid enum, non-positive quantity, or window_end <= window_start" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or CustomerAdmin touching another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Excursion reporter attempts to confirm/clear the same excursion (segregation of duties)" }
  - { id: ERR_LOT_RECALLED, http: 409, condition: "Order submit with a lot_code override whose lot has status RECALLED" }
  - { id: ERR_DOCK_CAPACITY_EXCEEDED, http: 409, condition: "New receipt window would push overlapping SCHEDULED/ARRIVED receipts at the zone to >= dock_doors" }
  - { id: ERR_BOOKING_WINDOW_CONFLICT, http: 409, condition: "Blast booking window collides with an existing SCHEDULED/IN_PROGRESS booking on the cell, turnaround buffer included" }
  - { id: ERR_OUTSIDE_WINDOW, http: 409, condition: "Booking start attempted with now outside [window_start, window_end]" }
  - { id: ERR_TEMP_CLASS_MISMATCH, http: 409, condition: "Receipt temp_class differs from assigned zone temp_class" }
  - { id: ERR_ZONE_FULL, http: 409, condition: "Arrival attempted while zone posture == FULL (free_pallets == 0)" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "Putaway actual_pallets exceeds free capacity after reservation release" }
  - { id: ERR_CELL_CAPACITY_EXCEEDED, http: 409, condition: "Booking pallet_count exceeds cell capacity_pallets" }
  - { id: ERR_INSUFFICIENT_FREEZABLE_STOCK, http: 409, condition: "Booking start finds fewer STORED+OK pallets on the lot than pallet_count" }
  - { id: ERR_LOT_PRODUCTION_DATE_MISMATCH, http: 409, condition: "Receipt completion would merge a production_date different from the existing lot's" }
  - { id: ERR_RECALL_HAS_UNDISPOSITIONED_STOCK, http: 409, condition: "Recall completion attempted while present pallets of the lot still have quality RECALLED" }
  - { id: ERR_EXCURSION_NOT_CONFIRMED, http: 409, condition: "Claim filed against an excursion not in CONFIRMED_BREACH" }
  - { id: ERR_CLAIM_EXCEEDS_QUARANTINED_COUNT, http: 422, condition: "affected_pallet_count exceeds excursion.quarantined_pallet_count" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "New receipt/order creation or submission while customer is SUSPENDED" }
  - { id: ERR_NO_ACTIVE_RATE_CARD, http: 409, condition: "Charging event (receipt complete, order submit, booking complete, claim approve) with no ACTIVE rate card" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "outstanding_balance + estimated handling-out would exceed credit_limit_cents (strictly greater; equality passes)" }
  - { id: ERR_INVOICE_AMOUNT_MISMATCH, http: 409, condition: "Invoice settle amount_cents != total_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CustomerAdmin
    description: "Staff of the inventory-owning customer (bailor); manages own receipts, orders, claims, invoice disputes"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/inbound-receipts (own)"
