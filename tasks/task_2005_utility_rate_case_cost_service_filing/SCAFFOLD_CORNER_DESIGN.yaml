      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — before role, existence, or state checks."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/v1/rate-cases", payload: {} }
          assert:
            - "Response is the error envelope with data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP 400"

      - name: role_check_beats_existence_returns_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=5]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Priority ordering across categories: IntervenorRep calling submit-filing on a NON-EXISTENT case id still gets ERR_INSUFFICIENT_PERMISSIONS (403, role check p2) rather than ERR_RATE_CASE_NOT_FOUND (404, existence p5)."
        test_recipe:
          setup: ["Empty database (the case id in the path is bogus)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/rate-cases/11111111-1111-4111-8111-111111111111/submit-filing", payload: {}, as: IntervenorRep, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS (403), not a 404"

