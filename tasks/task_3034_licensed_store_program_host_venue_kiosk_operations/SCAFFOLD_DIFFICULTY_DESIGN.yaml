            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-1", name: "P1", category: "FOOD", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 500, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p1}", par_level: 50 }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/distributors", payload: { name: "D1", lead_time_days: 2 }, as: BrandProgramAdmin, captures: { dist_id: $.data.id } }
            - { call: "PATCH /licensing/distributors/${dist_id}", payload: { approved: true }, as: BrandProgramAdmin }
