      - name: void_final_inspection_reverts_piece
        claim_type: side_effect_execution
        grounds: ["state_machines.Inspection.PASSED_to_VOIDED"]
        distinguishing_aspect: "Voiding the PASSED final inspection of a READY_TO_SHIP piece (not yet on a load) reverts the piece to AWAITING_INSPECTION — compensation pattern."
        test_recipe:
          setup: ["piece READY_TO_SHIP via a PASSED FINAL_PIECE inspection; not on any load"]
