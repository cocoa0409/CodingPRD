      - name: projected_and_realized_store_recovery_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.store_projected_recovery_estimate.variants
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: "On identical stored data the forward-looking PROJECTED variant and the chronological REALIZED variant must produce materially different money and ratios."
        excluded_because:
          difficulty_instance: store_recovery_projected_vs_realized_diverge_on_one_store
          rationale: "That instance pins both variants on the same store with pre-computed literals and asserts the delta, which is the whole Variant Divergence claim."

      - name: settlement_basis_selects_the_inclusion_set
        claim_type: Variant Selection
        grounds:
          - calculations.engagement_settlement_split.variants
          - validations[priority=77]
        distinguishing_aspect: "PROVISIONAL must include PENDING_REVIEW days and SUBMITTED expenses while FINAL must exclude them, and only FINAL may be finalized."
        excluded_because:
          difficulty_instance: settlement_provisional_vs_final_basis_diverge_on_one_engagement
          rationale: "That instance runs both bases against one engagement with an in-review day and a submitted expense, pinning every differing money field."

      - name: fee_rate_keyed_on_original_ratio_but_charged_on_total_gross
        claim_type: Correct Result
        grounds:
          - calculations.engagement_settlement_split.formula
        distinguishing_aspect: "The tier lookup uses original-merchandise sales over original cost while the fee multiplies TOTAL gross including augmentation sales; swapping the two bases changes the fee."
        excluded_because:
          difficulty_instance: settlement_fee_tier_evaluation_order_original_ratio_then_total_gross
          rationale: "That instance is built so the two candidate orderings give different fees and asserts the correct one, covering this claim precisely."

      - name: retention_accrual_rounds_before_summing
        claim_type: Precision
        grounds:
          - calculations.retention_bonus_settlement.precision
        distinguishing_aspect: "The accrual must round each employee's prorated bonus and then sum the integers, never sum exact fractions and round once."
        excluded_because:
          difficulty_instance: retention_accrual_round_per_employee_then_sum_not_sum_then_round
          rationale: "That instance is dimensioned so round-then-sum and sum-then-round differ by exactly one cent and asserts the round-then-sum result."

      - name: escalation_band_boundary_at_zero_shortfall
        claim_type: threshold
        grounds:
          - calculations.markdown_escalation_adjustment.constants
        distinguishing_aspect: "A checkpoint that exactly meets its sell-through target must escalate by 0.0000 while one band short must escalate by one 0.05 step."
        excluded_because:
          difficulty_instance: checkpoint_shortfall_exactly_zero_versus_one_band_short
          rationale: "That instance pins both sides of the ESCALATION_BAND boundary including the successor stage's resulting discount_pct."

      - name: augmentation_cap_boundary_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.augmentation_cap_check.constants.CAP_COMPARISON
        distinguishing_aspect: "A post-receipt ratio exactly equal to max_augmentation_ratio is accepted while any excess is rejected."
        excluded_because:
          difficulty_instance: augmentation_ratio_exactly_at_cap_accepted_then_eight_ten_thousandths_over_rejected
          rationale: "That instance receives a consignment landing exactly on 0.1000 and then one landing on 0.1008, asserting acceptance and ERR_AUGMENTATION_CAP_EXCEEDED respectively."

      - name: augmentation_units_are_conserved_through_a_return
        claim_type: constraint_propagation
        grounds:
          - calculations.augmentation_unit_conservation
        distinguishing_aspect: "Returned units stay accounted for rather than disappearing, so the conserved quantity is identical before and after a return."
        excluded_because:
          difficulty_instance: return_unsold_conserves_augmentation_units_accounted
          rationale: "That instance asserts the conserved total at receipt, after a sale and after a return, plus the recomputed cost and projection."

