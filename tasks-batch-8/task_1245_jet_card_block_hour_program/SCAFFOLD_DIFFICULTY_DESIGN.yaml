# =============================================================================
# Task 1245: Jet Card & Block-Hour Program — Difficulty Design (§1.8)
# Harder-than-expert calibration: 9 rules × 2 instances each = 18 instances.
# Each instance includes structured setup_api_calls + trigger + assert.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: hour_bank_chronological_vs_forward_looking
        grounds:
          - calculations.hour_bank_reconciliation
          - entities.JetCard.fields.hours_remaining
          - entities.JetCard.fields.expires_at
        distinguishing_aspect: |
          Operates on the JetCard hour-bank ledger domain. The chronological
          variant (persisted) only counts entries with effective_at <= now,
          while the forward-looking variant (returned by /projection) counts
          entries up to expires_at. Same ledger, different totals.
        test_recipe:
          setup:
            - "Ops creates a MIDSIZE program with 25 hours, expiry_months=12"
            - "Member purchases and activates a card (grants +25 hours at t=0)"
            - "Clock advanced past expiry by 6 months; expiration sweep already ran"
            - "Ledger therefore contains PURCHASE_GRANT(+25 @t0) and EXPIRATION_DEBIT(-25 @expires_at)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "MID_25"
                aircraft_category: "MIDSIZE"
                hours_purchased: 25
                purchase_price_cents: 15000000
                swap_ratio_to_lower: 0.85
                swap_ratio_to_higher: 1.30
                expiry_months: 12
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload:
                email: "dv1@x.com"
                full_name: "DV One"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { member_id: $.data.id }
            - call: "POST /members/${member_id}/cards"
              payload: { program_id: "${prog_id}" }
              as: Ops
              captures: { card_id: $.data.id }
            - call: "POST /cards/${card_id}/activate"
              payload: {}
              as: Ops
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: Ops
            - call: "POST /ops/run"
              payload: {}
              as: Ops
          trigger:
            - call: "GET /cards/${card_id}"
              payload: {}
              as: Ops
              captures: { persisted_hours: $.data.hours_remaining }
            - call: "GET /cards/${card_id}/projection"
              payload: {}
              as: Ops
              captures: { forward_hours: $.data.hours_remaining }
          assert:
            - "persisted_hours == 0"
            - "forward_hours == 0 (post-expiry forward-looking sees the same floor after sweep)"
            - "Card.${card_id}.card_status == EXPIRED"

      - name: invoice_total_one_way_vs_round_trip
        grounds:
          - calculations.invoice_total
          - entities.TripRequest.fields.trip_kind
        distinguishing_aspect: |
          Operates on the Invoice/pricing domain (distinct from hour-bank).
          Identical distance and aircraft produce different totals because
          ROUND_TRIP applies round_trip_discount_pct on top of
          subtotal+peak_surcharge, while ONE_WAY does not.
        test_recipe:
          setup:
            - "Program: MIDSIZE 25h, $150k purchase, peak 15%, RT discount 10%"
            - "Card activated with 25 hours; clock set to off-peak date"
            - "Two ONE_WAY trips and one ROUND_TRIP trip booked over identical route"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "MID_25B"
                aircraft_category: "MIDSIZE"
                hours_purchased: 25
                purchase_price_cents: 15000000
                swap_ratio_to_lower: 0.85
                swap_ratio_to_higher: 1.30
                expiry_months: 24
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog2_id: $.data.id }
            - call: "POST /members"
              payload:
                email: "dv2@x.com"
                full_name: "DV Two"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { member2_id: $.data.id }
            - call: "POST /members/${member2_id}/cards"
              payload: { program_id: "${prog2_id}" }
              as: Ops
              captures: { card2_id: $.data.id }
            - call: "POST /cards/${card2_id}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N100MU"
                category: "MIDSIZE"
                home_base_icao: "KTEB"
                seats: 8
                reposition_rate_cents_per_nm: 100
              as: Ops
              captures: { ac_id: $.data.id }
            - call: "POST /cards/${card2_id}/trips"
              payload:
                trip_kind: "ONE_WAY"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-03-10T15:00:00Z"
                pax_count: 4
                requested_category: "MIDSIZE"
              as: Member
              as_user_id: "${member2_id}"
              captures: { trip_ow_id: $.data.id }
            - call: "POST /cards/${card2_id}/trips"
              payload:
                trip_kind: "ROUND_TRIP"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-03-10T15:00:00Z"
                requested_return_utc: "2026-03-12T15:00:00Z"
                pax_count: 4
                requested_category: "MIDSIZE"
              as: Member
              as_user_id: "${member2_id}"
              captures: { trip_rt_id: $.data.id }
            - call: "POST /trips/${trip_ow_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${member2_id}"
            - call: "POST /trips/${trip_rt_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${member2_id}"
            - call: "POST /trips/${trip_ow_id}/dispatch"
              payload: { dispatched_aircraft_id: "${ac_id}" }
              as: Ops
            - call: "POST /trips/${trip_ow_id}/depart"
              payload: {}
              as: Ops
            - call: "GET /trips/${trip_ow_id}/legs"
              payload: {}
              as: Ops
              captures: { ow_leg_id: "$.data[0].id" }
            - call: "POST /trips/${trip_ow_id}/complete"
              payload: { legs: [{ trip_leg_id: "${ow_leg_id}", actual_block_minutes: 120 }] }
              as: Ops
            - call: "POST /trips/${trip_rt_id}/dispatch"
              payload: { dispatched_aircraft_id: "${ac_id}" }
              as: Ops
            - call: "POST /trips/${trip_rt_id}/depart"
              payload: {}
              as: Ops
            - call: "GET /trips/${trip_rt_id}/legs"
              payload: {}
              as: Ops
              captures: { rt_leg1_id: "$.data[0].id", rt_leg2_id: "$.data[1].id" }
            - call: "POST /trips/${trip_rt_id}/complete"
              payload: { legs: [{ trip_leg_id: "${rt_leg1_id}", actual_block_minutes: 120 }, { trip_leg_id: "${rt_leg2_id}", actual_block_minutes: 120 }] }
              as: Ops
          trigger:
            - call: "GET /trips/${trip_ow_id}/invoice"
              payload: {}
              as: Ops
              captures: { ow_total: "$.data[0].total_cents" }
            - call: "GET /trips/${trip_rt_id}/invoice"
              payload: {}
              as: Ops
              captures: { rt_total: "$.data[0].total_cents" }
          assert:
            - "ow_total != rt_total"
            - "rt_total == round_half_up(2 * ow_total * 0.90, 0) (RT discounts on subtotal)"
            - "rt_total < 2 * ow_total"

  # ---------------------------------------------------------------------------
  # Rule 2: Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_nested_min_max_mode_a
        grounds:
          - calculations.invoice_total
          - calculations.debited_hours_per_leg
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction.
          invoice_total depends on subtotal (which depends on per-leg debited
          hours which in turn depends on swap_multiplier), peak_surcharge_pct,
          and round_trip_discount_pct, with conditional branches on
          is_peak_period and trip_kind.
        test_recipe:
          setup:
            - "Program with peak=15%, RT=10%, swap_to_higher=1.30"
            - "Peak window covers 2026-07-01..2026-07-08"
            - "Trip is ROUND_TRIP, PEAK, and dispatched SUPER_MID (upgrade swap)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "MID_PEAK"
                aircraft_category: "MIDSIZE"
                hours_purchased: 25
                purchase_price_cents: 15000000
                swap_ratio_to_lower: 0.85
                swap_ratio_to_higher: 1.30
                expiry_months: 24
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 48
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog3_id: $.data.id }
            - call: "POST /programs/${prog3_id}/peak_windows"
              payload:
                window_start_utc: "2026-07-01T00:00:00Z"
                window_end_utc: "2026-07-08T00:00:00Z"
                label: "July4"
              as: Ops
            - call: "POST /members"
              payload:
                email: "cf1@x.com"
                full_name: "CF One"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m3_id: $.data.id }
            - call: "POST /members/${m3_id}/cards"
              payload: { program_id: "${prog3_id}" }
              as: Ops
              captures: { c3_id: $.data.id }
            - call: "POST /cards/${c3_id}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N200SM"
                category: "SUPER_MID"
                home_base_icao: "KTEB"
                seats: 9
                reposition_rate_cents_per_nm: 120
              as: Ops
              captures: { sm_id: $.data.id }
            - call: "POST /cards/${c3_id}/trips"
              payload:
                trip_kind: "ROUND_TRIP"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-07-04T15:00:00Z"
                requested_return_utc: "2026-07-06T15:00:00Z"
                pax_count: 6
                requested_category: "MIDSIZE"
              as: Member
              as_user_id: "${m3_id}"
              captures: { t3_id: $.data.id }
            - call: "POST /trips/${t3_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /trips/${t3_id}/dispatch"
              payload: { dispatched_aircraft_id: "${sm_id}" }
              as: Ops
            - call: "POST /trips/${t3_id}/depart"
              payload: {}
              as: Ops
            - call: "GET /trips/${t3_id}/legs"
              payload: {}
              as: Ops
              captures: { t3_l1: "$.data[0].id", t3_l2: "$.data[1].id" }
            - call: "POST /trips/${t3_id}/complete"
              payload: { legs: [{ trip_leg_id: "${t3_l1}", actual_block_minutes: 100 }, { trip_leg_id: "${t3_l2}", actual_block_minutes: 100 }] }
              as: Ops
          trigger:
            - call: "GET /trips/${t3_id}/invoice"
              payload: {}
              as: Ops
              captures: { t3_total: "$.data[0].total_cents", t3_sub: "$.data[0].subtotal_cents", t3_peak: "$.data[0].peak_surcharge_cents", t3_rt: "$.data[0].round_trip_discount_cents" }
          assert:
            - "TripRequest.${t3_id}.is_peak_period == true"
            - "TripRequest.${t3_id}.swap_applied == true"
            - "t3_peak == round_half_up(t3_sub * 0.15, 0)"
            - "t3_rt == round_half_up((t3_sub + t3_peak) * 0.10, 0)"
            - "t3_total == t3_sub + t3_peak - t3_rt"

      - name: refund_penalty_evaluation_order_mode_c
        grounds:
          - calculations.refund_net_amount
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency where evaluation order is
          explicit. gross_refund_cents derives from hours_at_request, then
          penalty_cents derives from gross, then net = gross - penalty with a
          floor at 0. Order must be pinned or net becomes ambiguous.
        test_recipe:
          setup:
            - "Card activated 6 months ago (within early-termination window)"
            - "Refund submitted for card with 10 hours remaining"
            - "Program: 25h, $150k purchase, penalty 20%"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "REF_TEST"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog4_id: $.data.id }
            - call: "POST /members"
              payload:
                email: "cf2@x.com"
                full_name: "CF Two"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m4_id: $.data.id }
            - call: "POST /members/${m4_id}/cards"
              payload: { program_id: "${prog4_id}" }
              as: Ops
              captures: { c4_id: $.data.id, c4_version: $.data.version }
            - call: "POST /cards/${c4_id}/activate"
              payload: {}
              as: Ops
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Ops
            - call: "GET /cards/${c4_id}"
              payload: {}
              as: Ops
              captures: { c4_version_now: $.data.version }
            - call: "POST /cards/${c4_id}/refunds"
              payload: { expected_card_version: "${c4_version_now}" }
              as: Member
              as_user_id: "${m4_id}"
              captures: { r4_id: $.data.id }
          trigger:
            - call: "POST /refunds/${r4_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m4_id}"
              captures: { r4_gross: $.data.gross_refund_cents, r4_pen: $.data.penalty_cents, r4_net: $.data.net_refund_cents }
          assert:
            - "r4_gross == round_half_up((25/25) * 10000000, 0) == 10000000"
            - "r4_pen == round_half_up(10000000 * 0.20, 0) == 2000000"
            - "r4_net == 10000000 - 2000000 == 8000000"

  # ---------------------------------------------------------------------------
  # Rule 3: Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: jet_card_active_suspended_active_cycle
        grounds:
          - state_machines.JetCard.ACTIVE_to_SUSPENDED
          - state_machines.JetCard.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic loop on JetCard (ACTIVE ↔ SUSPENDED) — JetCard can be
          suspended then resumed repeatedly; each cycle increments version.
        test_recipe:
          setup:
            - "Card in ACTIVE state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "CYC1"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog5_id: $.data.id }
            - call: "POST /members"
              payload:
                email: "cyc@x.com"
                full_name: "Cyc Member"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m5_id: $.data.id }
            - call: "POST /members/${m5_id}/cards"
              payload: { program_id: "${prog5_id}" }
              as: Ops
              captures: { c5_id: $.data.id }
            - call: "POST /cards/${c5_id}/activate"
              payload: {}
              as: Ops
          trigger:
            - call: "POST /cards/${c5_id}/suspend"
              payload: {}
              as: Ops
            - call: "POST /cards/${c5_id}/resume"
              payload: {}
              as: Ops
            - call: "POST /cards/${c5_id}/suspend"
              payload: {}
              as: Ops
            - call: "GET /cards/${c5_id}"
              payload: {}
              as: Ops
              captures: { c5_status: $.data.card_status }
          assert:
            - "c5_status == SUSPENDED"
            - "Card.${c5_id}.version == 5 (create=1, activate=2, suspend=3, resume=4, suspend=5)"

      - name: invoice_issued_disputed_paid_branching
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_PAID
          - state_machines.Invoice.ISSUED_to_PAID
        distinguishing_aspect: |
          Branching fork-join on Invoice: ISSUED → {PAID directly, or ISSUED →
          DISPUTED → PAID}. Divergent paths converge on PAID; dispute path
          carries different side-effect implications (audit trail).
        test_recipe:
          setup:
            - "Trip completed; invoice auto-issued"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "INV_CYC"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog6_id: $.data.id }
            - call: "POST /members"
              payload:
                email: "inv@x.com"
                full_name: "Inv Member"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m6_id: $.data.id }
            - call: "POST /members/${m6_id}/cards"
              payload: { program_id: "${prog6_id}" }
              as: Ops
              captures: { c6_id: $.data.id }
            - call: "POST /cards/${c6_id}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N300LT"
                category: "LIGHT"
                home_base_icao: "KTEB"
                seats: 6
                reposition_rate_cents_per_nm: 80
              as: Ops
              captures: { ac6_id: $.data.id }
            - call: "POST /cards/${c6_id}/trips"
              payload:
                trip_kind: "ONE_WAY"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-01-15T15:00:00Z"
                pax_count: 4
                requested_category: "LIGHT"
              as: Member
              as_user_id: "${m6_id}"
              captures: { t6_id: $.data.id }
            - call: "POST /trips/${t6_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m6_id}"
            - call: "POST /trips/${t6_id}/dispatch"
              payload: { dispatched_aircraft_id: "${ac6_id}" }
              as: Ops
            - call: "POST /trips/${t6_id}/depart"
              payload: {}
              as: Ops
            - call: "GET /trips/${t6_id}/legs"
              payload: {}
              as: Ops
              captures: { t6_leg: "$.data[0].id" }
            - call: "POST /trips/${t6_id}/complete"
              payload: { legs: [{ trip_leg_id: "${t6_leg}", actual_block_minutes: 90 }] }
              as: Ops
            - call: "GET /trips/${t6_id}/invoice"
              payload: {}
              as: Ops
              captures: { inv6_id: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv6_id}/dispute"
              payload: {}
              as: Member
              as_user_id: "${m6_id}"
            - call: "POST /invoices/${inv6_id}/mark_paid"
              payload: {}
              as: Ops
            - call: "GET /trips/${t6_id}/invoice"
              payload: {}
              as: Ops
              captures: { inv6_status: "$.data[0].invoice_status" }
          assert:
            - "inv6_status == PAID"
            - "Invoice.${inv6_id}.version >= 3 (DRAFT->ISSUED on cascade, ISSUED->DISPUTED, DISPUTED->PAID)"

  # ---------------------------------------------------------------------------
  # Rule 4: Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: trip_complete_cascades_to_ledger_card_escrow_invoice
        grounds:
          - state_machines.TripRequest.IN_FLIGHT_to_COMPLETED
          - calculations.escrow_release_on_completion
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /trips/{id}/complete:
          TripRequest completion → TripLeg billable_hours computed →
          HourBankLedger TRIP_DEBIT inserted → Card.hours_remaining updated →
          EscrowAccount.available_cents reduced → Invoice created.
        test_recipe:
          setup:
            - "Trip in IN_FLIGHT state with 1 leg, actual_block_minutes ready"
            - "Card has 25 hours; EscrowAccount.principal_cents = 10000000"
