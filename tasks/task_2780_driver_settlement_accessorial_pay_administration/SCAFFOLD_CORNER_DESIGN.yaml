            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Terminal Probe", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_trm: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_trm}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_trm}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_trm}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Tom Terminal", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_trm: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_trm}/assign-pay-package"
              payload: { pay_package_id: "${pkg_trm}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_trm}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_trm}/status"
              payload: { new_status: "TERMINATED" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/drivers/${drv_trm}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
              captures: { err_re: $.data.error_id }
            - call: "POST /driver-pay/drivers/${drv_trm}/status"
              payload: { new_status: "SUSPENDED" }
              as: PayrollAdmin
              captures: { err_re2: $.data.error_id }
          assert:
            - "both attempts return HTTP 409 with error_id ERR_DRIVER_NOT_ACTIVE"
            - "Driver.${drv_trm}.employment_status == TERMINATED"
            - "Driver.${drv_trm}.terminated_at == 2026-08-06T12:00:00.000Z"
            - "Driver.${drv_trm}.escrow_status == NOT_REQUIRED because PKG_TRM required no escrow"
      - name: newly_created_driver_starts_onboarding_with_no_package_and_zeroed_accumulators
        claim_type: initial_state
        grounds:
          - state_machines.Driver.ONBOARDING_to_ACTIVE
          - entities.Driver.fields.employment_status
          - entities.Driver.fields.ytd_gross_pay_cents
          - entities.Driver.fields.advance_outstanding_cents
        distinguishing_aspect: |
          A driver created with no pay package must land in ONBOARDING with pay_package_id null, escrow_status
          NOT_REQUIRED, settlement_hold false and every accumulator at 0 rather than null - the accumulators are
          the base case of the wage-classification invariant and a null would break the first settlement.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "no package is assigned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Ivy Initial", driver_type: "OWNER_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_ini: $.data.id }
          assert:
            - "the create returns HTTP 201 and Driver.${drv_ini}.version == 1"
            - "Driver.${drv_ini}.employment_status == ONBOARDING"
            - "Driver.${drv_ini}.pay_package_id == null and Driver.${drv_ini}.escrow_status == NOT_REQUIRED"
            - "Driver.${drv_ini}.escrow_balance_cents == 0 and Driver.${drv_ini}.escrow_target_cents == 0"
