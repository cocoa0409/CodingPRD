            - { call: "POST /sales/${sale_id}/invoice", payload: {}, as: FinanceOfficer, as_user_id: "fin-001" }
            - { call: "POST /sales/${sale_id}/payment", payload: { amount_cents: 250000 }, as: FinanceOfficer, as_user_id: "fin-001" }
