      - name: waiver_tier_boundary_exactly_at_tier1_limit
        grounds:
          - calculations.waiver_authority_tier
          - entities.CreditWaiver.fields.authority_tier
          - errors[ERR_WAIVER_AUTHORITY_EXCEEDED]
