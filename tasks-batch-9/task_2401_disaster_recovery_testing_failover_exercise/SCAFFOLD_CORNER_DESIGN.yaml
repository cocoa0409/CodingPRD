        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_exercise_version_rejects_before_stale_runbook_readiness
          rationale: "That §1.8 instance sends a deliberately stale expected_exercise_version and asserts 412 at priority 7 ahead of the readiness gate at priority 22."

      - name: error_runbook_stale_on_scope_item
