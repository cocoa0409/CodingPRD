  - rule_id: boundary_precision_check
    instances:

      - name: preservation_at_equal_to_recovery_deadline_accepted_one_millisecond_later_rejected
        grounds:
          - calculations.donor_recovery_window
          - calculations.recovery_time_limit
          - validations[priority=31]
          - errors.ERR_PRESERVATION_WINDOW_EXCEEDED
        distinguishing_aspect: |
          Two inclusive boundaries in one instance. The cooling credit uses
          cooling_delay_minutes <= 240, so a body cooled EXACTLY 240 minutes after death still
          earns the full 240-minute credit (window 960, deadline 2026-08-03T18:00:00.000Z). The
          deadline itself is inclusive (strict `>` rejects), so preservation at exactly
          18:00:00.000Z succeeds and yields death_to_preservation_minutes 960 -> band EXCEEDED,
          while an otherwise identical donor preserved at 18:00:00.001Z — one MILLISECOND later —
          is refused with ERR_PRESERVATION_WINDOW_EXCEEDED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "two technicians, so the two recoveries never share an occupation interval"
            - "donor P: death 2026-08-03T02:00:00.000Z ASYSTOLE, body_cooled_at 2026-08-03T06:00:00.000Z (cooling_delay_minutes exactly 240), age 52 -> window 960, deadline 2026-08-03T18:00:00.000Z"
            - "donor Q: identical inputs -> the same window and deadline"
