              as_user_id: "${phy}"
          trigger:
            - call: "GET /ambient-clinical-documentation/patients/${pat}/encounters"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          assert:
            - "With query limit=2&offset=0 the response lists exactly 2 encounters with total_count == 3 and has_more == true"
            - "With limit=2&offset=2 the response lists 1 encounter with has_more == false"
            - "Without query params the default limit 10 applies and all 3 are returned"
