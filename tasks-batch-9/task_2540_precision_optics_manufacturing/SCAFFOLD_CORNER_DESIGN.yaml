      - name: tolerance_method_selects_which_computed_stack_governs_the_verdict
        claim_type: variant_selection
        grounds:
          - calculations.tolerance_stack_analysis.variants
          - entities.OpticalDesign.fields.tolerance_method
          - endpoints.POST_/optics/optical-designs/{id}/revisions
          - errors.ERR_TOLERANCE_BUDGET_EXCEEDED
          - validations.priority_25
        distinguishing_aspect: |
          Both variants are always computed; tolerance_method only selects which one is copied into
          governing_stack_waves and judged. On three identical 0.0375-wave contributors the pair is rss
          0.0650 / worst_case 0.1125, and against the same 0.0800 budget the STATISTICAL row is released
          while its WORST_CASE revision — same numbers, different selector — is refused at release with
          ERR_TOLERANCE_BUDGET_EXCEEDED (422).
        test_recipe:
          setup:
            - "A design OD-2540-A (STATISTICAL, tolerance budget 0.0800) with three ACTIVE allocations of 1.5 * 0.0250 == 0.0375 waves each; rss = round_half_up(sqrt(3) * 0.0375, 4) = round_half_up(0.0649519, 4) = 0.0650 and worst_case = 0.1125."
            - "The design was analysed (verdict PASS) and released, so its version is 3."
            - "A revision OD-2540-A-R2 was opened with tolerance_method WORST_CASE and given the same three allocations; allocations are not inherited by a revision, so they are re-created on the new row."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
              captures: { d1v: $.data.version }
            - call: "POST /optics/optical-designs/${d1}/revisions"
              payload: { expected_design_version: "${d1v}", design_code: "OD-2540-A-R2", tolerance_method: "WORST_CASE" }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d2}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d2}"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/release"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
          assert:
            - "the analysis on the revision returns HTTP 200"
            - "OpticalDesign.${d2}.tolerance_method == WORST_CASE"
            - "OpticalDesign.${d2}.rss_stack_waves == 0.0650"
            - "OpticalDesign.${d2}.worst_case_stack_waves == 0.1125"
            - "OpticalDesign.${d2}.governing_stack_waves == 0.1125 and allocated_tolerance_waves == 0.1125"
            - "OpticalDesign.${d2}.tolerance_verdict == FAIL and design_status == TOLERANCED"
            - "the release of the revision returns HTTP 422 with error_id ERR_TOLERANCE_BUDGET_EXCEEDED"
            - "OpticalDesign.${d2}.design_status == TOLERANCED after the refused release"
            - "OpticalDesign.${d1}.rss_stack_waves == 0.0650 and worst_case_stack_waves == 0.1125 (identical numbers)"
            - "OpticalDesign.${d1}.governing_stack_waves == 0.0650 and tolerance_verdict == PASS and design_status == SUPERSEDED"

      - name: strip_and_recoat_reconciles_the_three_spectral_outputs_twice
        claim_type: reconciliation
        grounds:
          - calculations.spectral_performance_verification
          - state_machines.CoatingRun.VERIFIED_FAIL_to_LOADED
          - entities.CoatingRun.fields.band_average_reflectance_pct
          - entities.CoatingRun.fields.worst_point_reflectance_pct
        distinguishing_aspect: |
          The same run carries three successive spectral states and each must be fully reconciled: the
          failing set stores 0.4400 / 1.3500 / FAIL (the average passes, the spike fails, and the pinned
          conjunction yields FAIL), the strip resets all three to null / null / PENDING with
          in_band_sample_count 0, and the clean recoat writes 0.1400 / 0.1800 / PASS — no stale value may
          survive either move.
