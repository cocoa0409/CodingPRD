# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Coffee Roaster Wholesale — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.WholesaleAccount, endpoints]
        distinguishing_aspect: "POST /accounts with all required fields -> 201, status defaults ACTIVE, outstanding_balance_cents 0, version 1."
        test_recipe:
          setup: ["A price tier exists."]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "C-T", discount_bps: 500, min_monthly_kg: 50, freshness_max_days: 21 }
              as: SalesRep
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { name: "New Cafe", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 500000 }
              as: SalesRep
              captures: { acct_id: $.data.id, acct_status: $.data.status, acct_bal: $.data.outstanding_balance_cents, acct_v: $.data.version }
          assert:
            - "WholesaleAccount.${acct_id}.status == ACTIVE"
            - "WholesaleAccount.${acct_id}.outstanding_balance_cents == 0"
            - "WholesaleAccount.${acct_id}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.WholesaleAccount, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no accounts)."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Product, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products omitting required base_price_cents_per_kg -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A roast profile exists."]
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "RF", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-RF", name: "RF Prod", roast_profile_id: "${rp_id}", freshness_window_days: 14 }
              as: RoasterStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"

      - name: product_defaults_archived_false
        claim_type: Defaults
        grounds: [entities.Product.fields.archived]
        distinguishing_aspect: "A freshly created Product has archived == false (default applied)."
        test_recipe:
          setup: ["A roast profile exists."]
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "DF", roast_level: "LIGHT", expected_shrink_bps: 1300, charge_temp_c: 195 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-DF", name: "DF Prod", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { p_archived: $.data.archived }
          assert:
            - "Product.archived == false"

      - name: green_lot_computed_inventory_on_create
        claim_type: Computed Fields
        grounds: [entities.GreenLot.fields.available_kg, calculations.green_reorder_status]
        distinguishing_aspect: "On create a GreenLot has on_hand_kg == received_kg, reserved_kg 0, available_kg == received_kg, reorder_status OK (par below received)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /green-lots"
              payload: { origin: "Ethiopia", lot_ref: "ETH-CF", received_kg: 80, par_level_kg: 20 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_onhand: $.data.on_hand_kg, gl_avail: $.data.available_kg, gl_reorder: $.data.reorder_status }
          assert:
            - "GreenLot.${gl_id}.on_hand_kg == 80.000"
            - "GreenLot.${gl_id}.available_kg == 80.000"
            - "GreenLot.${gl_id}.reorder_status == OK"

      - name: duplicate_green_lot_ref_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_DUPLICATE]", entities.GreenLot.fields.lot_ref]
        distinguishing_aspect: "Second POST /green-lots with the same lot_ref among non-depleted lots -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A green lot with lot_ref DUP-1 already exists."]
          setup_api_calls:
            - call: "POST /green-lots"
              payload: { origin: "Kenya", lot_ref: "DUP-1", received_kg: 50, par_level_kg: 10 }
              as: RoasterStaff
          trigger:
            - call: "POST /green-lots"
              payload: { origin: "Kenya 2", lot_ref: "DUP-1", received_kg: 60, par_level_kg: 10 }
              as: RoasterStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE"

      - name: payment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment is common_fields:false (append-only) — it has id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["An issued invoice exists with a payment applied."]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "PAY0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Pay Co", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "PAY", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-PAY", name: "Pay Prod", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Brazil", lot_ref: "PAY-GL", received_kg: 60, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 30, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 30 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 25 }
              as: RoasterStaff
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 10 } ] }
              as: SalesRep
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 10, expected_roasted_lot_version: "${rl_v}" }
              as: SalesRep
              captures: { ful_id: $.data.id }
            - call: "POST /fulfillments/${ful_id}/ship"
              payload: {}
              as: RoasterStaff
            - call: "POST /orders/${ord_id}/invoice"
              payload: {}
              as: SalesRep
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/payments"
              payload: { amount_cents: 5000 }
              as: SalesRep
              captures: { pay_id: $.data.id, pay_status: $.data.status }
          assert:
            - "Payment.${pay_id}.status == CLEARED"
            - "Payment response carries id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_batch_from_planned_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RoastBatch.COOLING_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a batch still in PLANNED (never started/dropped) -> ERR_INVALID_STATE; no RoastedLot created."
        test_recipe:
          setup: ["A roast batch in PLANNED."]
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "IS", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-IS", name: "IS", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Peru", lot_ref: "IS-GL", received_kg: 50, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 17 }
              as: RoasterStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "RoastBatch.${rb_id}.status == PLANNED (unchanged)"

      - name: new_batch_starts_in_planned
        claim_type: Initial State
        grounds: [state_machines.RoastBatch.initial_state, entities.RoastBatch.fields.status]
        distinguishing_aspect: "A newly created RoastBatch has status == PLANNED and planned_roasted_kg computed (12.5 green @ 1800 bps -> 10.250)."
        test_recipe:
          setup: ["Profile with expected_shrink_bps 1800, product, green lot."]
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "INI", roast_level: "DARK", expected_shrink_bps: 1800, charge_temp_c: 210 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-INI", name: "INI", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Sumatra", lot_ref: "INI-GL", received_kg: 50, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
          trigger:
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 12.5, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id, rb_status: $.data.status, rb_planned: $.data.planned_roasted_kg }
          assert:
            - "RoastBatch.${rb_id}.status == PLANNED"
            - "RoastBatch.${rb_id}.planned_roasted_kg == 10.250"

      - name: cancel_completed_batch_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RoastBatch.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED batch (terminal) -> ERR_INVALID_STATE; no green released."
        test_recipe:
          setup: ["A COMPLETED roast batch."]
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "TL", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-TL", name: "TL", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Mexico", lot_ref: "TL-GL", received_kg: 50, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 20 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 17 }
              as: RoasterStaff
          trigger:
            - call: "POST /roast-batches/${rb_id}/cancel"
              payload: {}
              as: RoasterStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "RoastBatch.${rb_id}.status == COMPLETED (unchanged)"

      - name: reroast_beyond_max_returns_invalid_state
        claim_type: cyclic
        grounds: [state_machines.RoastBatch.COOLING_to_ROASTING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A third reroast (MAX_REROASTS=2) -> ERR_INVALID_STATE; the cycle termination condition is respected."
        test_recipe:
          setup: ["A batch driven through two reroast loops (reroast_count==2), now in COOLING."]
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "MX", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-MX", name: "MX", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Guatemala", lot_ref: "MX-GL", received_kg: 50, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 20 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/reroast"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/reroast"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
          trigger:
            - call: "POST /roast-batches/${rb_id}/reroast"
              payload: {}
              as: RoasterStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (third reroast exceeds MAX_REROASTS=2)"

      - name: ship_then_bubble_up_fulfilled
        claim_type: Side Effect Execution
        grounds: [state_machines.Fulfillment.RESERVED_to_SHIPPED, state_machines.Order.OPEN_to_FULFILLED]
        distinguishing_aspect: "Shipping a fulfillment that covers the whole order in one shot bubbles Order.fulfillment_status OPEN->FULFILLED and decrements RoastedLot.on_hand_kg."
        test_recipe:
          setup: ["Order for 10 kg; roasted lot 25 kg; one fulfillment reserved for 10 kg."]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "BU0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Bubble", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "BU", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-BU", name: "BU", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Colombia", lot_ref: "BU-GL", received_kg: 60, par_level_kg: 5 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 30, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 30 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 25 }
              as: RoasterStaff
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 10 } ] }
              as: SalesRep
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 10, expected_roasted_lot_version: "${rl_v}" }
              as: SalesRep
              captures: { ful_id: $.data.id }
          trigger:
            - call: "POST /fulfillments/${ful_id}/ship"
              payload: {}
              as: RoasterStaff
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: SalesRep
              captures: { ord_ff: $.data.fulfillment_status }
            - call: "GET /roasted-lots/${rl_id}"
              payload: {}
              as: SalesRep
              captures: { rl_onhand: $.data.on_hand_kg }
          assert:
            - "Order.${ord_id}.fulfillment_status == FULFILLED (bubble-up)"
            - "RoastedLot.${rl_id}.on_hand_kg == 15.000 (25 - 10 shipped)"

      - name: sample_decline_branch_terminal
        claim_type: branching
        grounds: [state_machines.SampleRequest.REQUESTED_to_DECLINED, entities.SampleRequest.fields.status]
        distinguishing_aspect: "Review with decision DECLINE moves SampleRequest to DECLINED (terminal); a later convert -> ERR_INVALID_STATE (divergent from APPROVE branch)."
        test_recipe:
          setup: ["A REQUESTED sample request."]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "SD0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Sampler", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "SD", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SD", name: "SD", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /accounts/${acct_id}/sample-requests"
              payload: { product_id: "${prod_id}", sample_kg: 0.25 }
              as: SalesRep
              captures: { sr_id: $.data.id }
            - call: "POST /sample-requests/${sr_id}/review"
              payload: { decision: "DECLINE", cupping_score: 60 }
              as: RoasterStaff
              captures: { sr_status: $.data.status }
          trigger:
            - call: "POST /sample-requests/${sr_id}/convert"
              payload: { qty_kg: 5 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "SampleRequest.${sr_id}.status == DECLINED (terminal after DECLINE branch)"
            - "Response error_id == ERR_INVALID_STATE (cannot convert a DECLINED sample)"

      - name: sample_convert_below_score_rejected
        claim_type: guarded transitions
        grounds: [state_machines.SampleRequest.APPROVED_to_CONVERTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Converting an APPROVED sample whose cupping_score (75) < MIN_CONVERT_SCORE (80) -> ERR_INVALID_STATE; no order created."
        test_recipe:
          setup: ["An APPROVED sample request with cupping_score 75."]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "SC0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "LowScore", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "SC", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SC", name: "SC", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /accounts/${acct_id}/sample-requests"
              payload: { product_id: "${prod_id}", sample_kg: 0.25 }
              as: SalesRep
              captures: { sr_id: $.data.id }
            - call: "POST /sample-requests/${sr_id}/review"
              payload: { decision: "APPROVE", cupping_score: 75 }
              as: RoasterStaff
          trigger:
            - call: "POST /sample-requests/${sr_id}/convert"
              payload: { qty_kg: 5 }
              as: SalesRep
