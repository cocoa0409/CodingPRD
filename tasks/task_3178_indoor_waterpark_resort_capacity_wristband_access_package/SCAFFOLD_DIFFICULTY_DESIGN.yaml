            - "DayPass.${dp14_id}.day_pass_status == RESERVED"

      - name: cabana_second_hold_requires_fresh_version
        grounds:
          - validations[priority=9]
          - entities.CabanaBooking.fields.end_minute
        distinguishing_aspect: |
          A different interval arithmetic on a different resource: the cabana gate tests
          integer-minute intersection of [start_minute, end_minute) windows, so a request
          whose window abuts the standing occupation is refused on a stale version while an
          intersecting one is refused on the geometric gate (see resource_temporal_overlap).
        test_recipe:
          setup:
