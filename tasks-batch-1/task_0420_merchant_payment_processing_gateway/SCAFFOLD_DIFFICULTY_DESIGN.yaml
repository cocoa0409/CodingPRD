  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_request_then_return_conserves_available_balance
        grounds:
          - state_machines.Payout.null_to_REQUESTED
          - state_machines.Payout.REQUESTED_to_RETURNED
          - calculations.merchant_balance_recompute
        distinguishing_aspect: "Conserved quantity = Merchant.available_balance_cents. A payout request debits -amount and a return credits +amount, so available_balance_cents after request-then-return equals the pre-request value exactly (sum over PAYOUT + PAYOUT_RETURN ledger entries == 0)."
        test_recipe:
          setup:
            - "Funded LOW merchant with available_balance_cents == 9680."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
