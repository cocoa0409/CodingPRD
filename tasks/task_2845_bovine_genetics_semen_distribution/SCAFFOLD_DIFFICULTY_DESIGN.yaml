scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: sire_index_genomic_only_vs_progeny_blended
        grounds:
          - calculations.sire_genetic_index
          - entities.GenomicEvaluation.fields.evaluation_basis
          - entities.GenomicEvaluation.fields.parent_average_weight
          - entities.GenomicEvaluation.fields.composite_index
        distinguishing_aspect: |
          This dual variant lives in the SIRE GENETICS domain: two evaluations with byte-identical trait
          inputs and the same published parent produce composite_index 44.59 under GENOMIC_ONLY and
          49.95 under PROGENY_BLENDED, because the parent_average_weight flips from 0.50 to 0.300 while
          production_index (52.90) and health_index (65.62) stay identical in both rows.
        test_recipe:
          setup:
            - "Sire REG-A exists with a PUBLISHED evaluation whose composite_index is 62.37 (progeny 120, reliability 75)."
            - "Sires REG-C and REG-D both exist with sire_id == REG-A and dam_sire_id null, so both inherit parent_average_index 31.19."
            - "Neither REG-C nor REG-D has any evaluation yet; the logical clock is still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-A", breed: "HOLSTEIN", birth_date: "2020-03-01", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { a_id: "$.data.id", a_ver: "$.data.version" }
            - call: "POST /genetics/sires/${a_id}/genomic-evaluations"
              payload: { milk_kg: 900, fat_kg: 40, protein_kg: 30, somatic_cell_score: 2.85, fertility_pct: 1.5, longevity_months: 2.0, reliability_pct: 75, progeny_daughter_count: 120, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${a_ver}" }
              as: ProgramDirector
              captures: { eval_a_id: "$.data.id" }
            - call: "POST /genetics/genomic-evaluations/${eval_a_id}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-C", breed: "HOLSTEIN", birth_date: "2023-05-01", sire_id: "${a_id}", acquisition_cost_cents: 1500000 }
              as: ProgramDirector
              captures: { c_id: "$.data.id", c_ver: "$.data.version" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-D", breed: "HOLSTEIN", birth_date: "2023-05-02", sire_id: "${a_id}", acquisition_cost_cents: 1500000 }
              as: ProgramDirector
              captures: { d_id: "$.data.id", d_ver: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${c_id}/genomic-evaluations"
              payload: { milk_kg: 1100, fat_kg: 45, protein_kg: 36, somatic_cell_score: 2.90, fertility_pct: 2.0, longevity_months: 3.0, reliability_pct: 68, progeny_daughter_count: 50, effective_at: "2026-07-15T00:00:00Z", expected_sire_version: "${c_ver}" }
              as: ProgramDirector
              captures: { eval_c_id: "$.data.id" }
            - call: "POST /genetics/sires/${d_id}/genomic-evaluations"
              payload: { milk_kg: 1100, fat_kg: 45, protein_kg: 36, somatic_cell_score: 2.90, fertility_pct: 2.0, longevity_months: 3.0, reliability_pct: 68, progeny_daughter_count: 49, effective_at: "2026-07-15T00:00:00Z", expected_sire_version: "${d_ver}" }
              as: ProgramDirector
              captures: { eval_d_id: "$.data.id" }
          assert:
            - "GenomicEvaluation.${eval_a_id}.composite_index == 62.37"
            - "GenomicEvaluation.${eval_c_id}.evaluation_basis == PROGENY_BLENDED"
            - "GenomicEvaluation.${eval_c_id}.parent_average_weight == 0.300"
            - "GenomicEvaluation.${eval_c_id}.parent_average_index == 31.19"
            - "GenomicEvaluation.${eval_c_id}.composite_index == 49.95"
            - "GenomicEvaluation.${eval_d_id}.evaluation_basis == GENOMIC_ONLY"
            - "GenomicEvaluation.${eval_d_id}.parent_average_weight == 0.50"
            - "GenomicEvaluation.${eval_d_id}.composite_index == 44.59"
            - "GenomicEvaluation.${eval_c_id}.production_index == 52.90 and GenomicEvaluation.${eval_d_id}.production_index == 52.90"
            - "GenomicEvaluation.${eval_c_id}.health_index == 65.62 and GenomicEvaluation.${eval_d_id}.health_index == 65.62"
            - "Sire.${c_id}.published_composite_index == 0.00 (a DRAFT evaluation never touches the sire's published proof)"

      - name: lot_value_standard_cost_vs_market_revalued
        grounds:
          - calculations.lot_unit_book_value
          - calculations.plant_inventory_value
          - entities.StrawLot.fields.valuation_basis
          - entities.StrawLot.fields.pre_revaluation_unit_value_cents
        distinguishing_aspect: |
          This dual variant lives in the STRAW-INVENTORY MONEY domain, not in sire genetics: one physical
          StrawLot of 200 straws carries unit_book_value_cents 1250 under STANDARD_COST (250000 / 200)
          and 2248 under MARKET_REVALUED (45 * 49.95 * 1.00), moving plant_inventory_value_cents from
          250000 to 449600 without a single dose changing hands.
        test_recipe:
          setup:
            - "Facility F-IA-01 (US, housing_capacity 4, bench_capacity 1) is APPROVED."
            - "Sire REG-A has a PUBLISHED evaluation with composite_index 62.37."
            - "Sire REG-C (sire_id REG-A) is RESIDENT and ELIGIBLE at F-IA-01 with all four required tests NEGATIVE until 2027-08-01."
            - "A CONVENTIONAL StrawLot of 200 straws cut at processing_cost_cents 250000 is RELEASED with doses_available 200 and unit_book_value_cents 1250."
            - "A DRAFT evaluation for REG-C with progeny_daughter_count 50 exists, composite_index 49.95, not yet published."
            - "The logical clock stands at 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/facilities"
              payload: { code: "F-IA-01", country_code: "US", housing_capacity: 4, bench_capacity: 1, approved_export_countries: ["CA", "MX"] }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-A", breed: "HOLSTEIN", birth_date: "2020-03-01", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { a_id: "$.data.id", a_ver: "$.data.version" }
            - call: "POST /genetics/sires/${a_id}/genomic-evaluations"
              payload: { milk_kg: 900, fat_kg: 40, protein_kg: 30, somatic_cell_score: 2.85, fertility_pct: 1.5, longevity_months: 2.0, reliability_pct: 75, progeny_daughter_count: 120, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${a_ver}" }
              as: ProgramDirector
              captures: { eval_a_id: "$.data.id" }
            - call: "POST /genetics/genomic-evaluations/${eval_a_id}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-C", breed: "HOLSTEIN", birth_date: "2023-05-01", sire_id: "${a_id}", acquisition_cost_cents: 1500000 }
              as: ProgramDirector
              captures: { c_id: "$.data.id" }
            - call: "POST /genetics/sires/${c_id}/contract"
              payload: { contract_price_cents: 1500000 }
              as: ProgramDirector
            - call: "POST /genetics/sires/${c_id}/house"
              payload: { facility_id: "${fac_id}", isolation_days: 30 }
              as: FacilityManager
              as_user_id: "${fac_id}"
            - call: "POST /genetics/sires/${c_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "BLUETONGUE", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { ht_bt: "$.data.id" }
            - call: "POST /genetics/sires/${c_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "IBR", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { ht_ibr: "$.data.id" }
            - call: "POST /genetics/sires/${c_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "BVD", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { ht_bvd: "$.data.id" }
            - call: "POST /genetics/sires/${c_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "TRICHOMONIASIS", sample_date: "2026-08-01", validity_days: 365 }
