# =============================================================================
# Example: b2b-invoicing-disputes benchmark seed tables (v1)
# =============================================================================

scenario: |
  B2B invoicing and disputes platform. Manages the full billing lifecycle:
  workspaces, customers with credit limits and balances, contracts with payment
  terms and billing caps, purchase orders with three-way matching, invoices from
  draft to settlement, payments with allocation and auto-allocation, disputes
  with escalation and expiry, credit memos with goodwill caps, write-offs,
  finance charges, period-based aging, deemed acceptance, early-pay discounts,
  freeze/hold/close customer states, and idempotency controls.

domain_name: b2b-invoicing-disputes
api_prefix: /workspaces

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Workspace
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Workspace name" }
      - { name: currency, type: string, source: input, description: "Currency code (e.g., USD)" }
      - { name: period_index, type: integer, source: system, default: 0, description: "Current billing period counter, increments via advance_period" }
      - { name: books_closed_through_period_index, type: integer, source: system, default: null, description: "Most recently closed period (null = nothing closed)" }
      - { name: integrity_status, type: enum, source: computed, description: "OK | NEEDS_REVIEW" }

  - name: Customer
    parent: Workspace
    common_fields: true
    fields:
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: external_customer_ref, type: string, source: input, description: "External reference" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD | FROZEN | CLOSED" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Current amount owed" }
      - { name: unapplied_cash_cents, type: integer, source: computed, description: "Money received but not allocated" }
      - { name: available_credit_cents, type: integer, source: computed, description: "Issued credits not yet applied" }

  - name: Contract
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Associated customer ID" }
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: name, type: string, source: input, description: "Contract name" }
      - { name: payment_terms_periods, type: integer, source: input, default: 2, description: "Periods after acceptance until due (1, 2, or 3)" }
      - { name: requires_po, type: boolean, source: input, description: "Whether invoices need a PO" }
      - { name: billing_cap_cents_per_period, type: integer, source: input, description: "Safety cap per period per customer+contract" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → SUSPENDED / TERMINATED" }

  - name: PurchaseOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Associated customer ID" }
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: po_number, type: string, source: input, description: "Unique per customer while OPEN or ACKNOWLEDGED" }
      - { name: status, type: enum, source: system, description: "OPEN → ACKNOWLEDGED → CLOSED / CANCELLED" }
      - { name: lines, type: array, source: input, description: "PO lines with description, ordered_units, unit_price_cents, is_service, received_units, net_billed_units" }

  - name: Invoice
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Associated customer ID" }
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: contract_id, type: string, source: input, description: "Associated contract ID" }
      - { name: purchase_order_id, type: string, source: input, required: false, description: "Optional PO reference" }
      - { name: external_invoice_ref, type: string, source: input, required: false, description: "External reference, unique per customer on finalized non-voided invoices" }
      - { name: type, type: enum, source: system, default: "STANDARD", description: "STANDARD | FINANCE_CHARGE" }
      - { name: reference_invoice_id, type: string, source: system, required: false, description: "For FINANCE_CHARGE: points to original invoice" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Total billed (0 until finalized)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "What is still owed" }
      - { name: amount_disputed_cents, type: integer, source: computed, description: "Amount locked behind active disputes" }
      - { name: collections_stage, type: enum, source: computed, description: "CURRENT | REMINDER | FINAL_NOTICE | COLLECTIONS" }
      - { name: match_status, type: enum, source: computed, description: "NOT_APPLICABLE | MATCHED | EXCEPTION" }
      - { name: issued_period_index, type: integer, source: system, description: "Period when finalized" }
      - { name: delivered_period_index, type: integer, source: system, description: "Period when sent" }
      - { name: accepted_period_index, type: integer, source: system, description: "Period when accepted" }
      - { name: due_period_index, type: integer, source: computed, description: "= accepted_period_index + payment_terms_periods" }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED → SENT → ACCEPTED → CLOSED / VOIDED" }

  - name: InvoiceLine
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "Parent invoice ID" }
      - { name: description, type: string, source: input, description: "Line description" }
      - { name: quantity_units, type: integer, source: input, description: "Quantity billed" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price" }
      - { name: purchase_order_line_id, type: string, source: input, required: false, description: "Optional PO line reference" }

  - name: Payment
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Associated customer ID" }
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: amount_cents, type: integer, source: input, description: "Total payment amount" }
      - { name: allocations, type: array, source: input, required: false, description: "Optional list of { invoice_id, amount_cents }" }
      - { name: status, type: enum, source: system, description: "INITIATED → CLEARED / FAILED / REVERSED" }

  - name: Dispute
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "Associated invoice ID" }
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: reason, type: enum, source: input, description: "PRICE_MISMATCH | MISSING_RECEIPT | SERVICE_QUALITY | TAX_ERROR | DUPLICATE_INVOICE | FRAUD" }
      - { name: items, type: array, source: input, description: "Dispute items: { invoice_line_id, disputed_units?, disputed_amount_cents? }" }
      - { name: opened_period_index, type: integer, source: system, description: "Period when dispute was opened" }
      - { name: proposed_period_index, type: integer, source: system, required: false, description: "Period when dispute entered PROPOSED" }
      - { name: status, type: enum, source: system, description: "OPEN → IN_REVIEW → PROPOSED → ESCALATED / CLOSED / WITHDRAWN" }

  - name: CreditMemo
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Associated customer ID" }
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: invoice_id, type: string, source: input, required: false, description: "Optional associated invoice ID (omit for customer-level)" }
      - { name: reason, type: string, source: input, description: "e.g., GOODWILL" }
      - { name: type, type: enum, source: system, description: "STANDARD | EARLY_PAY_DISCOUNT" }
      - { name: items, type: array, source: input, description: "Credit items: { invoice_line_id?, quantity_units?, unit_price_cents? }" }
      - { name: total_cents, type: integer, source: computed, description: "Total credit amount" }
      - { name: status, type: enum, source: system, description: "DRAFT → ISSUED → VOIDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system (automatic when undisputed overdue > $25,000 or any ESCALATED dispute)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system (automatic when undisputed overdue < $5,000 AND no COLLECTIONS invoices AND no ESCALATED disputes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: FROZEN
        trigger: "system (automatic on payment reversal or FRAUD dispute creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CREDIT_HOLD
        to: FROZEN
        trigger: "system (automatic on payment reversal or FRAUD dispute creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FROZEN
        to: ACTIVE
        trigger: "POST .../customers/{customerId}/unfreeze OR system (automatic on advance_period)"
        actor: SellerAdmin | system
        preconditions:
          - "No active FRAUD disputes"
          - "All reversal/fraud cooling-off windows elapsed (2 period closes since event)"
          - "If conditions not met: ERR_CUSTOMER_STILL_FROZEN"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: POST .../customers/{customerId}/close
        actor: SellerAdmin
        preconditions:
          - "No open invoice balance, no unapplied cash, no available credits, no active disputes (ERR_CUSTOMER_NOT_SETTLED)"
        side_effects: []

      - from: ANY
        to: FROZEN
        trigger: POST .../customers/{customerId}/freeze
        actor: SellerAdmin
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST .../contracts/{contractId}/activate
        actor: SellerAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: POST .../contracts/{contractId}/suspend
        actor: SellerAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST .../contracts/{contractId}/activate
        actor: SellerAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: POST .../contracts/{contractId}/terminate
        actor: SellerAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: POST .../contracts/{contractId}/terminate
        actor: SellerAdmin
        preconditions: []
        side_effects: []
    note: "Transitions are not idempotent — calling activate on ACTIVE returns ERR_INVALID_STATE_TRANSITION"

  - entity: PurchaseOrder
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: POST .../purchase_orders/{poId}/acknowledge
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: POST .../purchase_orders/{poId}/close
        actor: BuyerAP | SellerAdmin
        preconditions: []
        side_effects: []

      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: POST .../purchase_orders/{poId}/close
        actor: BuyerAP | SellerAdmin
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CANCELLED
        trigger: POST .../purchase_orders/{poId}/cancel
        actor: BuyerAP
        preconditions:
          - "No finalized invoices reference this PO (ERR_PO_HAS_INVOICES)"
        side_effects: []

      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: POST .../purchase_orders/{poId}/cancel
        actor: BuyerAP
        preconditions:
          - "No finalized invoices reference this PO"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: POST .../invoices/{invoiceId}/finalize
        actor: SellerAR | SellerAdmin
        preconditions:
          - "Customer must not be CLOSED (ERR_CUSTOMER_CLOSED)"
          - "Contract must be ACTIVE or final-true-up exception applies (ERR_CONTRACT_INACTIVE)"
          - "Credit hold check (ERR_CUSTOMER_ON_HOLD) — admin override available under conditions"
          - "If contract requires PO: PO must be OPEN or ACKNOWLEDGED (ERR_PO_REQUIRED, ERR_PO_NOT_OPEN)"
          - "Billing cap check (ERR_BILLING_CAP_EXCEEDED) — admin override available"
          - "external_invoice_ref uniqueness check (ERR_DUPLICATE_EXTERNAL_REF)"
        side_effects:
          - "Lock lines, assign document number"
          - "issued_period_index = workspace.period_index"
          - "Compute invoice_total_cents, amount_due_cents"

      - from: FINALIZED
        to: SENT
        trigger: POST .../invoices/{invoiceId}/send
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects:
          - "delivered_period_index = workspace.period_index"
          - "Customer balance_due_cents increases"

      - from: SENT
        to: ACCEPTED
        trigger: POST .../invoices/{invoiceId}/accept
        actor: BuyerAP
        preconditions:
          - "Invoice in SENT status (ERR_INVALID_STATE_TRANSITION)"
          - "Match status must not be EXCEPTION unless active dispute covers exception (ERR_MATCH_EXCEPTION)"
        side_effects:
          - "accepted_period_index = workspace.period_index"
          - "due_period_index = accepted_period_index + payment_terms_periods"

      - from: SENT
        to: ACCEPTED
        trigger: "system (deemed acceptance during advance_period)"
        actor: system
        preconditions:
          - "Invoice in SENT for a full billing period (delivered_period_index <= N-1)"
          - "match_status is MATCHED"
          - "No active dispute"
        side_effects:
          - "accepted_period_index = period being closed (N)"
          - "due_period_index = N + payment_terms_periods"

      - from: DRAFT
        to: VOIDED
        trigger: POST .../invoices/{invoiceId}/void
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects: []

      - from: FINALIZED
        to: VOIDED
        trigger: POST .../invoices/{invoiceId}/void
        actor: SellerAR | SellerAdmin
        preconditions:
          - "No active disputes (ERR_INVOICE_HAS_DISPUTE)"
          - "No cleared/initiated payments (ERR_INVOICE_HAS_PAYMENTS)"
          - "Books not closed through issued_period_index (ERR_BOOKS_CLOSED) unless SellerAdmin exception"
        side_effects: []

      - from: ACCEPTED
        to: CLOSED
        trigger: "system (automatic when amount_due_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: CLOSED
        trigger: POST .../invoices/{invoiceId}/write_off
        actor: SellerAdmin | SellerAR
        preconditions:
          - "No active dispute (ERR_INVOICE_HAS_DISPUTE)"
          - "Amount due <= $200 and invoice in COLLECTIONS (ERR_WRITE_OFF_NOT_ALLOWED)"
        side_effects: ["Write off remaining amount_due_cents"]

  - entity: Payment
    initial_state: INITIATED
    terminal_states: [CLEARED, FAILED, REVERSED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: POST .../payments/{paymentId}/mark_cleared
        actor: SellerAR | System
        preconditions: []
        side_effects:
          - "Apply allocations, reduce invoice amount_due_cents"
          - "Reduce customer balance_due_cents"
          - "Remainder → unapplied_cash_cents"
          - "Early pay discount check and auto credit memo"

      - from: INITIATED
        to: FAILED
        trigger: POST .../payments/{paymentId}/mark_failed
        actor: SellerAR | System
        preconditions:
          - "Payment must be INITIATED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Release reserved allocations"

      - from: CLEARED
        to: REVERSED
        trigger: POST .../payments/{paymentId}/reverse
        actor: SellerAdmin
        preconditions: []
        side_effects:
          - "Undo cleared payment effects: invoices reopen, balances restored"
          - "If early pay discount credit was created: void it, restore original amount"
          - "Customer → FROZEN immediately"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: POST .../disputes/{disputeId}/seller_respond
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: PROPOSED
        trigger: POST .../disputes/{disputeId}/propose_resolution
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects:
          - "Create draft credit memo if included in proposal"
          - "proposed_period_index = workspace.period_index"

      - from: ESCALATED
        to: PROPOSED
        trigger: POST .../disputes/{disputeId}/propose_resolution
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: CLOSED
        trigger: POST .../disputes/{disputeId}/accept_resolution
        actor: BuyerAP
        preconditions: []
        side_effects:
          - "Issue and apply draft credit memo to invoice"
          - "Reduce amount_disputed_cents"

      - from: PROPOSED
        to: ESCALATED
        trigger: POST .../disputes/{disputeId}/reject_resolution
        actor: BuyerAP
        preconditions: []
        side_effects: []

      - from: OPEN
        to: ESCALATED
        trigger: "system (automatic during advance_period if open for full period without seller response)"
        actor: system
        preconditions:
          - "opened_period_index <= N-1 and no seller response"
        side_effects:
          - "Customer may transition to CREDIT_HOLD"

      - from: ESCALATED
        to: IN_REVIEW
        trigger: POST .../disputes/{disputeId}/seller_respond
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects: []
        note: "Stays ESCALATED but records response"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system (automatic during advance_period if proposed for 2 full periods without buyer action)"
        actor: system
        preconditions:
          - "proposed_period_index <= N-2 and no buyer action"
        side_effects:
          - "Void draft credit memo from proposal"

      - from: OPEN
        to: WITHDRAWN
        trigger: POST .../disputes/{disputeId}/withdraw
        actor: BuyerAP
        preconditions: []
        side_effects:
          - "Release disputed amount back to payable"

      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: POST .../disputes/{disputeId}/withdraw
        actor: BuyerAP
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST .../disputes/{disputeId}/withdraw
        actor: BuyerAP
        preconditions: []
        side_effects:
          - "Void draft credit memo"

      - from: ESCALATED
        to: WITHDRAWN
        trigger: POST .../disputes/{disputeId}/withdraw
        actor: BuyerAP
        preconditions: []
        side_effects: []

  - entity: CreditMemo
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST .../credit_memos/{creditMemoId}/issue
        actor: SellerAR | SellerAdmin
        preconditions:
          - "Not a dispute-proposal draft (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Customer available_credit_cents increases"

      - from: ISSUED
        to: ISSUED
        trigger: POST .../credit_memos/{creditMemoId}/apply
        actor: SellerAR | SellerAdmin
        preconditions:
          - "invoice_id required in request body (ERR_INVALID_REQUEST)"
          - "Invoice must accept credits (ERR_INVOICE_NOT_CREDITABLE)"
        side_effects:
          - "Reduce invoice amount_due_cents"
          - "May reduce amount_disputed_cents if credit overlaps disputed lines"
          - "Customer available_credit_cents decreases"
          - "Excess remains as available_credit_cents"

      - from: DRAFT
        to: VOIDED
        trigger: POST .../credit_memos/{creditMemoId}/void
        actor: SellerAR | SellerAdmin
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: VOIDED
        trigger: POST .../credit_memos/{creditMemoId}/void
        actor: SellerAR | SellerAdmin
        preconditions:
          - "Not applied (even partially): ERR_INVALID_STATE_TRANSITION"
          - "Not system EARLY_PAY_DISCOUNT: ERR_CREDIT_MEMO_LOCKED"
        side_effects: []

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: collections_stage
    trigger: "period change, payment, credit, dispute change"
    algorithm: derived
    formula: |
      periods_past_due = workspace.period_index - invoice.due_period_index
      undisputed_overdue = amount_due_cents - amount_disputed_cents (if past due)
      if not past due OR undisputed_overdue == 0:
        CURRENT
      elif periods_past_due == 1 AND undisputed_overdue > 0:
        REMINDER
      elif periods_past_due == 2 AND undisputed_overdue > 0:
        FINAL_NOTICE
      elif periods_past_due >= 3 AND undisputed_overdue > 0:
        COLLECTIONS

  - name: match_status
    trigger: "invoice finalize, receipt, credit apply"
    algorithm: three_way_match
    formula: |
      If invoice does not reference PO: NOT_APPLICABLE
      For each PO-linked line:
        Price tolerance: effective_unit_price <= PO_unit_price * 1.05
        Quantity tolerance: net_billed_units <= ordered_units * 1.02
        Receipt requirement: for non-service lines, billed <= received
      If all pass: MATCHED
      Else: EXCEPTION
    constants:
      PRICE_TOLERANCE: 0.05  # 5%
      QUANTITY_TOLERANCE: 0.02  # 2%

  - name: effective_unit_price
    trigger: "credit apply, invoice finalize"
    algorithm: net_calculation
    formula: |
      gross_line_amount_cents = quantity_units * unit_price_cents
      credited_amount_cents = sum(credit items tied to that invoice_line_id)
      net_line_amount_cents = gross_line_amount_cents - credited_amount_cents
      effective_unit_price_cents = floor(net_line_amount_cents / quantity_units)

  - name: finance_charge
    trigger: "advance_period"
    algorithm: periodic_charge
    formula: |
      For each invoice with undisputed overdue balance during the period being closed:
        If this is the first period past due: no charge yet
        Otherwise: charge = 1.5% of undisputed overdue balance
        Round down to whole cents
        Min: $25, Max: $250 per invoice per period
      Customer cap: $500 total finance charges per customer per period
      If cap exceeded: scale down proportionally, round down, apply remainder to oldest first
    constants:
      RATE: 0.015  # 1.5%
      MIN_CHARGE_CENTS: 2500  # $25
      MAX_CHARGE_CENTS: 25000  # $250
      CUSTOMER_CAP_CENTS: 50000  # $500

  - name: early_pay_discount
    trigger: "payment mark_cleared"
    algorithm: policy_check
    formula: |
      Conditions: no active disputes, no prior credits, not past due,
        single cleared payment within 1 period after acceptance
      Discount = invoice_total - payment_amount
      Max: 2% of invoice_total AND never more than $500
      If eligible: create EARLY_PAY_DISCOUNT credit memo, issue and apply automatically
    constants:
      MAX_DISCOUNT_PERCENT: 0.02  # 2%
      MAX_DISCOUNT_CENTS: 50000  # $500

  - name: auto_allocation
    trigger: "payment creation without explicit allocations"
    algorithm: sorted_allocation
    formula: |
      Sort eligible invoices by due_period_index ascending, then invoice_id ascending
      Eligible: undisputed payable > 0, not VOIDED or CLOSED
      Allocate in order until payment exhausted
      Remainder → unapplied_cash_cents

  - name: deemed_acceptance
    trigger: "advance_period"
    algorithm: period_check
    formula: |
      When closing period N (moving from N to N+1):
      For each SENT invoice with delivered_period_index <= N-1:
        If match_status == MATCHED and no active dispute:
          accepted_period_index = N
          due_period_index = N + payment_terms_periods

  - name: credit_hold_check
    trigger: "advance_period, payment, dispute change"
    algorithm: threshold
    formula: |
      Auto CREDIT_HOLD when:
        undisputed_overdue > $25,000 OR any ESCALATED dispute
      Release to ACTIVE when:
        undisputed_overdue < $5,000 AND no COLLECTIONS invoices AND no ESCALATED disputes
    constants:
      HOLD_THRESHOLD_CENTS: 2500000  # $25,000
      RELEASE_THRESHOLD_CENTS: 500000  # $5,000

  - name: freeze_check
    trigger: "payment reversal, FRAUD dispute creation"
    algorithm: event_based
    formula: |
      Auto FROZEN on: payment reversal or FRAUD dispute creation
      Unfreeze when: no active FRAUD disputes AND all reversal/fraud cooling-off windows
        elapsed (2 successful advance_period calls since event)

  - name: goodwill_credit_limits
    trigger: "credit memo issue"
    algorithm: threshold
    formula: |
      SellerAR: max $1,000 per credit memo
      Total goodwill per customer per period: max $2,500 (unless SellerAdmin)
      Credits tied to disputes are not goodwill
    constants:
      PER_MEMO_CAP_CENTS: 100000  # $1,000
      PER_CUSTOMER_PER_PERIOD_CAP_CENTS: 250000  # $2,500

  - name: dispute_auto_escalation
    trigger: "advance_period"
    algorithm: period_check
    formula: |
      When closing period N:
        OPEN dispute with opened_period_index <= N-1 and no seller response → ESCALATED

  - name: dispute_auto_withdrawal
    trigger: "advance_period"
    algorithm: period_check
    formula: |
      When closing period N:
        PROPOSED dispute with proposed_period_index <= N-2 and no buyer action → WITHDRAWN
        Void draft credit memo from proposal

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X_Actor_Id and X_Actor_Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs must exist within workspace"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: freeze
    check: "Customer FROZEN blocks buyer-initiated exposure-creating actions"
    error_id: ERR_CUSTOMER_FROZEN
    http_status: 409
    applies_to: "BuyerAP: payments, accept invoice, create PO, open disputes"

  - priority: 5
    category: state
    check: "Resource must be in correct state for operation"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "All state transition endpoints"

  - priority: 6
    category: void_priority
    check: "Void precedence: dispute > payments > books closed > state"
    error_id: "ERR_INVOICE_HAS_DISPUTE > ERR_INVOICE_HAS_PAYMENTS > ERR_BOOKS_CLOSED > ERR_INVALID_STATE_TRANSITION"
    http_status: "various"
    applies_to: "Invoice void"

  - priority: 7
    category: business_hold
    check: "Customer on CREDIT_HOLD blocks finalization unless valid admin override"
    error_id: ERR_CUSTOMER_ON_HOLD
    http_status: 409
    applies_to: "Invoice finalize"

  - priority: 8
    category: business_contract
    check: "Contract must be ACTIVE or final-true-up exception"
    error_id: ERR_CONTRACT_INACTIVE
    http_status: 409
    applies_to: "Invoice finalize"

  - priority: 9
    category: business_po
    check: "If contract requires PO, invoice must reference valid PO"
    error_id: "ERR_PO_REQUIRED / ERR_PO_NOT_OPEN"
    http_status: 409
    applies_to: "Invoice finalize"

  - priority: 10
    category: business_cap
    check: "Billing cap check per period per customer+contract"
    error_id: ERR_BILLING_CAP_EXCEEDED
    http_status: 409
    applies_to: "Invoice finalize"

  - priority: 11
    category: business_match
    check: "Match exception blocks acceptance unless disputed"
    error_id: ERR_MATCH_EXCEPTION
    http_status: 409
    applies_to: "Invoice accept"

  - priority: 12
    category: business_dispute
    check: "Dispute window and collections restrictions"
    error_id: "ERR_COLLECTIONS_RESTRICTS_DISPUTES > ERR_DISPUTE_WINDOW_CLOSED"
    http_status: 409
    applies_to: "Dispute creation"

response_envelope:
  success: |
    (no standard envelope — resource fields returned directly)
  error: |
    { "error": { "code": "ERR_XXX", "message": "..." } }
  pagination_fields: []
  pagination_defaults: {}

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Workspace ---
  - method: POST
    path: "/workspaces"
    description: "Create a Workspace"
    roles: [SellerAdmin]
    code: 201
    input: [name, currency]
    output: Workspace
    side_effects: ["period_index=0, books_closed_through_period_index=null"]

  - method: GET
    path: "/workspaces/{workspaceId}"
    description: "Get a Workspace"
    roles: [Any]
    code: 200
    input: []
    output: Workspace
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/advance_period"
    description: "Advance billing period"
    roles: [SellerAdmin, SellerAR]
    code: 200
    input: []
    output: Workspace
    side_effects:
      - "period_index += 1"
      - "Deemed acceptance for eligible SENT invoices"
      - "Finance charge generation"
      - "Dispute auto-escalation and auto-withdrawal"
      - "Customer freeze/hold status evaluation"
      - "Collections stage updates"

  - method: POST
    path: "/workspaces/{workspaceId}/close_books"
    description: "Close books for most recently completed period"
    roles: [SellerAdmin, Auditor]
    code: 200
    input: []
    output: Workspace
    side_effects:
      - "books_closed_through_period_index = period_index - 1"
      - "ERR_INVALID_STATE_TRANSITION if nothing to close"
      - "ERR_PERIOD_HAS_PENDING_PAYMENTS if initiated payments exist"

  - method: POST
    path: "/workspaces/{workspaceId}/recompute"
    description: "Recompute derived balances and statuses"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Workspace
    side_effects: ["Recompute all derived fields; ERR_LEDGER_INCONSISTENT on failure"]

  # --- Customer ---
  - method: POST
    path: "/workspaces/{workspaceId}/customers"
    description: "Create a Customer"
    roles: [SellerAdmin, SellerAR]
    code: 201
    input: [display_name, external_customer_ref, credit_limit_cents]
    output: Customer
    side_effects: ["status=ACTIVE, balances initialized to 0"]

  - method: GET
    path: "/workspaces/{workspaceId}/customers/{customerId}"
    description: "Get a Customer"
    roles: [Any]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/freeze"
    description: "Freeze a Customer"
    roles: [SellerAdmin]
    code: 200
    input: [reason]
    output: Customer
    side_effects: ["status → FROZEN"]

  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/unfreeze"
    description: "Unfreeze a Customer"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → ACTIVE (if eligible, else ERR_CUSTOMER_STILL_FROZEN)"]

  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/close"
    description: "Close a Customer"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → CLOSED"]

  # --- Contract ---
  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/contracts"
    description: "Create a Contract"
    roles: [SellerAdmin, SellerAR]
    code: 201
    input: ["name, payment_terms_periods?, requires_po, billing_cap_cents_per_period"]
    output: Contract
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/workspaces/{workspaceId}/contracts/{contractId}"
    description: "Get a Contract"
    roles: [Any]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/contracts/{contractId}/activate"
    description: "Activate a Contract"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/workspaces/{workspaceId}/contracts/{contractId}/suspend"
    description: "Suspend a Contract"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/workspaces/{workspaceId}/contracts/{contractId}/terminate"
    description: "Terminate a Contract"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status → TERMINATED"]

  # --- Purchase Order ---
  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/purchase_orders"
    description: "Create a Purchase Order"
    roles: [BuyerAP, SellerAR]
    code: 201
    input: ["po_number, lines"]
    output: PurchaseOrder
    side_effects: ["status=OPEN, ERR_DUPLICATE_PO_NUMBER if po_number in use"]

  - method: GET
    path: "/workspaces/{workspaceId}/purchase_orders/{poId}"
    description: "Get a Purchase Order"
    roles: [Any]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/purchase_orders/{poId}/acknowledge"
    description: "Acknowledge a Purchase Order"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status → ACKNOWLEDGED"]

  - method: POST
    path: "/workspaces/{workspaceId}/purchase_orders/{poId}/record_receipt"
    description: "Record receipt of goods"
    roles: [BuyerAP]
    code: 200
    input: ["items: [{ purchase_order_line_id, received_units }]"]
    output: PurchaseOrder
    side_effects:
      - "Increase received_units on PO lines"
      - "ERR_RECEIPT_EXCEEDS_TOLERANCE if > 1% over ordered_units"

  - method: POST
    path: "/workspaces/{workspaceId}/purchase_orders/{poId}/cancel"
    description: "Cancel a Purchase Order"
    roles: [BuyerAP]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status → CANCELLED"]

  - method: POST
    path: "/workspaces/{workspaceId}/purchase_orders/{poId}/close"
    description: "Close a Purchase Order"
    roles: [BuyerAP, SellerAdmin]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status → CLOSED"]

  # --- Invoice ---
  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/invoices"
    description: "Create a draft Invoice"
    roles: [SellerAR, SellerAdmin]
    code: 201
    input: ["contract_id, purchase_order_id?, external_invoice_ref?"]
    output: Invoice
    side_effects: ["status=DRAFT, invoice_total_cents=0"]

  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/lines"
    description: "Add a line to an Invoice"
    roles: [SellerAR, SellerAdmin]
    code: 201
    input: ["description, quantity_units, unit_price_cents, purchase_order_line_id?"]
    output: InvoiceLine
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/finalize"
    description: "Finalize an Invoice"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: ["override_hold?, override_billing_cap?, final_invoice?"]
    output: Invoice
    side_effects:
      - "status → FINALIZED"
      - "Compute totals, assign document number, set issued_period_index"

  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/send"
    description: "Send an Invoice"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → SENT, delivered_period_index set"]

  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/accept"
    description: "Accept an Invoice"
    roles: [BuyerAP]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → ACCEPTED, accepted_period_index and due_period_index set"]

  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/void"
    description: "Void an Invoice"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → VOIDED"]

  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/write_off"
    description: "Write off an Invoice"
    roles: [SellerAdmin, SellerAR]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → CLOSED, remaining amount written off"]

  - method: GET
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}"
    description: "Get an Invoice"
    roles: [Any]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/workspaces/{workspaceId}/invoices"
    description: "List Invoices"
    roles: [Any]
    code: 200
    input: ["customer_id?, status?, type?"]
    output: "Invoice[]"
    side_effects: []

  # --- Payment ---
  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/payments"
    description: "Create a Payment"
    roles: [BuyerAP, SellerAR]
    code: 201
    input: ["amount_cents, allocations?"]
    output: Payment
    side_effects:
      - "status=INITIATED"
      - "Allocations reserved"
      - "Auto-allocate if no explicit allocations"

  - method: POST
    path: "/workspaces/{workspaceId}/payments/{paymentId}/mark_cleared"
    description: "Mark payment as cleared"
    roles: [SellerAR, System]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "status → CLEARED"
      - "Apply allocations to invoices"
      - "Early pay discount check"

  - method: POST
    path: "/workspaces/{workspaceId}/payments/{paymentId}/mark_failed"
    description: "Mark payment as failed"
    roles: [SellerAR, System]
    code: 200
    input: []
    output: Payment
    side_effects: ["status → FAILED, release reservations"]

  - method: POST
    path: "/workspaces/{workspaceId}/payments/{paymentId}/reverse"
    description: "Reverse a cleared payment"
    roles: [SellerAdmin]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "status → REVERSED"
      - "Undo payment effects"
      - "Customer → FROZEN"

  - method: GET
    path: "/workspaces/{workspaceId}/payments/{paymentId}"
    description: "Get a Payment"
    roles: [Any]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- Dispute ---
  - method: POST
    path: "/workspaces/{workspaceId}/invoices/{invoiceId}/disputes"
    description: "Create a Dispute"
    roles: [BuyerAP]
    code: 201
    input: ["reason, items"]
    output: Dispute
    side_effects:
      - "status=OPEN"
      - "amount_disputed_cents updated on invoice"
      - "If FRAUD: customer → FROZEN"

  - method: GET
    path: "/workspaces/{workspaceId}/disputes/{disputeId}"
    description: "Get a Dispute"
    roles: [Any]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/disputes/{disputeId}/seller_respond"
    description: "Seller responds to dispute"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → IN_REVIEW (or records response if ESCALATED)"]

  - method: POST
    path: "/workspaces/{workspaceId}/disputes/{disputeId}/propose_resolution"
    description: "Propose resolution with optional credit"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: ["proposed_credit?"]
    output: Dispute
    side_effects: ["status → PROPOSED, create draft credit memo"]

  - method: POST
    path: "/workspaces/{workspaceId}/disputes/{disputeId}/accept_resolution"
    description: "Buyer accepts resolution"
    roles: [BuyerAP]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → CLOSED, issue and apply credit memo"]

  - method: POST
    path: "/workspaces/{workspaceId}/disputes/{disputeId}/reject_resolution"
    description: "Buyer rejects resolution"
    roles: [BuyerAP]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → ESCALATED"]

  - method: POST
    path: "/workspaces/{workspaceId}/disputes/{disputeId}/withdraw"
    description: "Buyer withdraws dispute"
    roles: [BuyerAP]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → WITHDRAWN, release disputed amount"]

  # --- Credit Memo ---
  - method: POST
    path: "/workspaces/{workspaceId}/customers/{customerId}/credit_memos"
    description: "Create a Credit Memo"
    roles: [SellerAR, SellerAdmin]
    code: 201
    input: ["invoice_id?, reason, items"]
    output: CreditMemo
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/workspaces/{workspaceId}/credit_memos/{creditMemoId}/issue"
    description: "Issue a Credit Memo"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["status → ISSUED, customer available_credit_cents increases"]

  - method: POST
    path: "/workspaces/{workspaceId}/credit_memos/{creditMemoId}/apply"
    description: "Apply a Credit Memo to an invoice"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: [invoice_id]
    output: CreditMemo
    side_effects:
      - "Reduce invoice amount_due_cents"
      - "May reduce amount_disputed_cents"
      - "Reduce available_credit_cents"

  - method: POST
    path: "/workspaces/{workspaceId}/credit_memos/{creditMemoId}/void"
    description: "Void a Credit Memo"
    roles: [SellerAR, SellerAdmin]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["status → VOIDED"]

  - method: GET
    path: "/workspaces/{workspaceId}/credit_memos/{creditMemoId}"
    description: "Get a Credit Memo"
    roles: [Any]
    code: 200
    input: []
    output: CreditMemo
    side_effects: []

  - method: GET
    path: "/workspaces/{workspaceId}/credit_memos"
    description: "List Credit Memos"
    roles: [Any]
    code: 200
    input: ["customer_id?, status?"]
    output: "CreditMemo[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X_Actor_Id or X_Actor_Role header is missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not allowed for this endpoint"

  # --- Resource Not Found ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource ID does not exist in the workspace"

  # --- Request Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, negative/zero amounts, mismatched IDs"

  # --- State Transitions ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Target resource is in a state where the transition is not allowed"

  # --- Customer Status ---
  - id: ERR_CUSTOMER_FROZEN
    http: 409
    condition: "Customer is FROZEN and buyer action is blocked"

  - id: ERR_CUSTOMER_STILL_FROZEN
    http: 409
    condition: "Unfreeze attempted but freeze-window conditions not met"

  - id: ERR_CUSTOMER_ON_HOLD
    http: 409
    condition: "Customer on CREDIT_HOLD blocks invoice finalization"

  - id: ERR_CUSTOMER_CLOSED
    http: 409
    condition: "Cannot create billing artifacts for CLOSED customer"

  - id: ERR_CUSTOMER_NOT_SETTLED
    http: 409
    condition: "Cannot close customer with unresolved ledger"

  # --- Contract ---
  - id: ERR_CONTRACT_INACTIVE
    http: 409
    condition: "Contract not ACTIVE and final-true-up exception not applicable"

  - id: ERR_BILLING_CAP_EXCEEDED
    http: 409
    condition: "Billing cap per period exceeded without admin override"

  # --- Purchase Order ---
  - id: ERR_PO_REQUIRED
    http: 409
    condition: "Contract requires PO but invoice has none"

  - id: ERR_PO_NOT_OPEN
    http: 409
    condition: "PO is not OPEN or ACKNOWLEDGED"

  - id: ERR_PO_HAS_INVOICES
    http: 409
    condition: "Cannot cancel PO with finalized invoices"

  - id: ERR_DUPLICATE_PO_NUMBER
    http: 409
    condition: "PO number already in use for customer (OPEN/ACKNOWLEDGED)"

  - id: ERR_RECEIPT_EXCEEDS_TOLERANCE
    http: 409
    condition: "Receipt exceeds 1% over-receipt tolerance"

  # --- Invoice ---
  - id: ERR_DUPLICATE_EXTERNAL_REF
    http: 409
    condition: "external_invoice_ref already exists for customer on finalized non-voided invoice"

  - id: ERR_MATCH_EXCEPTION
    http: 409
    condition: "Invoice has match exceptions not covered by active dispute"

  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 409
    condition: "Cannot void invoice with cleared/initiated payments"

  - id: ERR_INVOICE_HAS_DISPUTE
    http: 409
    condition: "Cannot void/write-off invoice with active dispute"

  - id: ERR_BOOKS_CLOSED
    http: 409
    condition: "Cannot void invoice in closed books period"

  - id: ERR_WRITE_OFF_NOT_ALLOWED
    http: 409
    condition: "Write-off policy constraints not satisfied"

  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "Invoice not in payable state (VOIDED/CLOSED)"

  - id: ERR_INVOICE_NOT_CREDITABLE
    http: 409
    condition: "Invoice cannot accept credits (e.g., CLOSED)"

  - id: ERR_INVOICE_NOT_DISPUTABLE
    http: 409
    condition: "Invoice not in disputable lifecycle state"

  # --- Payment ---
  - id: ERR_PAYMENT_EXCEEDS_ALLOWED
    http: 409
    condition: "Payment allocation exceeds payable/available amount"

  - id: ERR_PERIOD_HAS_PENDING_PAYMENTS
    http: 409
    condition: "Cannot close books with initiated payments in the period"

  # --- Dispute ---
  - id: ERR_DISPUTE_ALREADY_ACTIVE
    http: 409
    condition: "Active dispute already exists for this invoice"

  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "Dispute filing window has passed"

  - id: ERR_COLLECTIONS_RESTRICTS_DISPUTES
    http: 409
    condition: "Invoice in COLLECTIONS only allows FRAUD/DUPLICATE_INVOICE disputes"

  - id: ERR_DISPUTE_AMOUNT_EXCEEDS_AVAILABLE
    http: 409
    condition: "Disputed amount exceeds contestable portion"

  - id: ERR_DISPUTE_REASON_NOT_ALLOWED
    http: 409
    condition: "Dispute reason not allowed for invoice type"

  # --- Credit Memo ---
  - id: ERR_CREDIT_EXCEEDS_AUTHORITY
    http: 409
    condition: "Goodwill credit exceeds per-memo or per-customer-per-period cap"

  - id: ERR_CREDIT_MEMO_LOCKED
    http: 409
    condition: "Cannot void system EARLY_PAY_DISCOUNT credit memo"

  # --- Idempotency ---
  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "Idempotency key reused with different payload or state changed"

  # --- Ledger ---
  - id: ERR_LEDGER_INCONSISTENT
    http: 409
    condition: "Recompute could not reconcile derived balances"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: SellerAdmin
    description: "Workspace superuser: can do everything including overrides, freezes, closes, voids, write-offs"
    exclusive_operations:
      - "POST /workspaces — Create workspace"
      - "POST .../customers/{id}/freeze — Freeze customer"
      - "POST .../customers/{id}/unfreeze — Unfreeze customer"
      - "POST .../customers/{id}/close — Close customer"
      - "POST .../contracts/{id}/activate — Activate contract"
      - "POST .../contracts/{id}/suspend — Suspend contract"
      - "POST .../contracts/{id}/terminate — Terminate contract"
      - "POST .../payments/{id}/reverse — Reverse payment"

  - name: SellerAR
    description: "Accounts receivable: drafts invoices, finalizes, sends, records payments, responds to disputes, issues credits within policy"
    exclusive_operations: []
    shared_with_SellerAdmin:
      - "POST .../customers — Create customer"
      - "POST .../contracts — Create contract"
      - "POST .../invoices — Create invoice"
      - "POST .../invoices/{id}/lines — Add invoice line"
      - "POST .../invoices/{id}/finalize — Finalize invoice"
      - "POST .../invoices/{id}/send — Send invoice"
      - "POST .../invoices/{id}/void — Void invoice"
      - "POST .../invoices/{id}/write_off — Write off invoice"
      - "POST .../disputes/{id}/seller_respond — Respond to dispute"
      - "POST .../disputes/{id}/propose_resolution — Propose resolution"
      - "POST .../credit_memos — Create credit memo"
      - "POST .../credit_memos/{id}/issue — Issue credit memo"
      - "POST .../credit_memos/{id}/apply — Apply credit memo"
      - "POST .../credit_memos/{id}/void — Void credit memo"
    shared_with_System:
      - "POST .../payments/{id}/mark_cleared — Mark cleared"
      - "POST .../payments/{id}/mark_failed — Mark failed"

  - name: BuyerAP
    description: "Buyer accounts payable: creates POs, records receipts, accepts invoices, creates disputes, pays invoices"
    exclusive_operations:
      - "POST .../invoices/{id}/accept — Accept invoice"
      - "POST .../purchase_orders/{id}/record_receipt — Record receipt"
      - "POST .../purchase_orders/{id}/cancel — Cancel PO"
      - "POST .../disputes — Create dispute"
      - "POST .../disputes/{id}/accept_resolution — Accept resolution"
      - "POST .../disputes/{id}/reject_resolution — Reject resolution"
      - "POST .../disputes/{id}/withdraw — Withdraw dispute"
    shared_with_SellerAR:
      - "POST .../purchase_orders — Create PO"
      - "POST .../payments — Create payment"

  - name: Auditor
    description: "Read-only except for closing books"
    exclusive_operations: []
    shared_with_SellerAdmin:
      - "POST .../close_books — Close books"

  - name: System
    description: "Automation role for period close, system-generated credits"
    exclusive_operations: []

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /workspaces/{id} — Get workspace"
      - "GET .../customers/{id} — Get customer"
      - "GET .../contracts/{id} — Get contract"
      - "GET .../purchase_orders/{id} — Get PO"
      - "GET .../invoices/{id} — Get invoice"
      - "GET .../invoices — List invoices"
      - "GET .../payments/{id} — Get payment"
      - "GET .../disputes/{id} — Get dispute"
      - "GET .../credit_memos/{id} — Get credit memo"
      - "GET .../credit_memos — List credit memos"
