      - name: endpoint_conditional_action_finalize_is_allowed_only_for_a_compliant_acquirer
        claim_type: conditional_action
        grounds:
          - endpoints[POST /settlement-batches/{id}/finalize]
          - validations[priority=16]
        excluded_because:
          difficulty_instance: cross_entity_batch_finalize_blocked_by_acquirer_compliance_status_from_missed_window
          rationale: "The §1.8 instance exercises finalize under both conditions on the same batch — refused while the acquirer is NON_COMPLIANT, accepted once the late completion restores COMPLIANT — which is the conditional-action claim in full."

      - name: endpoint_side_effect_reverse_zeroes_the_assessment_and_adjusts_the_ledgers
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /transaction-records/{id}/reverse]
          - entities.TransactionRecord.fields.reversal_type
        excluded_because:
          difficulty_instance: compensating_invariant_assessment_ledger_zeroed_by_clearing_reversal
          rationale: "The §1.8 instance issues a CLEARING_REVERSAL and asserts every declared side effect of the endpoint — the zeroed assessment, the reduced batch total, the reduced merchant ledger and the decremented downgrade counter."

