# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# sections 1.1-1.7. Every instance either carries an executable test_recipe or
# points at the section 1.8 instance that already covers the corner.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: dealer_creation_applies_declared_defaults_and_system_fields
        claim_type: Defaults
        grounds:
          - entities.Dealer.fields.program_code
          - entities.Dealer.fields.funding_line_cents
          - entities.Dealer.fields.status
          - endpoints[POST /lending/dealers]
        distinguishing_aspect: "Creating a dealer with only legal_name and state_code yields program_code 'PS-STANDARD', funding_line_cents 50000000, status PROSPECT, compliance_hold false, version 1 and every counter at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z (never set)."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /lending/dealers"
              payload: { legal_name: "Basin Auto Group", state_code: "AZ" }
              as: PortfolioAdmin
              captures: { d_min: $.data.id, d_min_v: $.data.version }
          assert:
            - "HTTP 201"
            - "Dealer.${d_min}.program_code == 'PS-STANDARD'"
            - "Dealer.${d_min}.funding_line_cents == 50000000"
            - "Dealer.${d_min}.status == 'PROSPECT'"
            - "Dealer.${d_min}.compliance_hold == false"
            - "Dealer.${d_min}.version == 1"
            - "Dealer.${d_min}.reserve_balance_cents == 0 and outstanding_principal_cents == 0 and funded_contract_count == 0 and total_funded_ever_count == 0"
            - "Dealer.${d_min}.latest_scorecard_grade is null and suspension_reason is null"
            - "Response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"

      - name: dealer_get_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints[GET /lending/dealers/{id}]
          - entities.Dealer.fields.legal_name
        distinguishing_aspect: "GET /lending/dealers/{id} returns exactly the row created, including created_at and version, with response_type 'object'."
        test_recipe:
          setup:
            - "One Dealer created at clock 2026-08-01."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Basin Auto Group", state_code: "AZ", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d_r: $.data.id }
          trigger:
            - call: "GET /lending/dealers/${d_r}"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-001"
              captures: { d_r_name: $.data.legal_name }
          assert:
            - "HTTP 200 and response_type == 'object'"
            - "Dealer.${d_r}.legal_name == 'Basin Auto Group' and state_code == 'AZ'"
            - "Dealer.${d_r}.created_at is an ISO 8601 UTC timestamp with three fractional digits"

      - name: contracts_list_pagination_envelope_fields
        claim_type: Listing
        grounds:
          - endpoints[GET /lending/contracts]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /lending/contracts with limit 1 and offset 1 returns exactly one of the two contracts, total_count 2 and has_more false."
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01 with two contracts booked and funded."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-p1", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 180000, amount_financed_cents: 1000000, collateral_value_cents: 1000000, term_months: 60, vehicle_model_year: 2024, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap_p1: $.data.id }
            - call: "POST /lending/applications/${ap_p1}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
            - call: "POST /lending/contracts"
              payload: { application_id: "${ap_p1}", contract_apr_bps: 749, contract_date: "2026-08-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { k_p1: $.data.id }
            - call: "POST /lending/contracts/${k_p1}/documents"
              payload: { doc_type: "RETAIL_INSTALLMENT_CONTRACT", document_reference: "IMG-p1-RIC" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { doc1_p1: $.data.id }
            - call: "POST /lending/contracts/${k_p1}/documents"
              payload: { doc_type: "TITLE_APPLICATION", document_reference: "IMG-p1-TTL" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { doc2_p1: $.data.id }
            - call: "POST /lending/documents/${doc1_p1}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/documents/${doc2_p1}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/contracts/${k_p1}/fund"
              payload: { funding_date: "2026-08-01T00:00:00Z" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-p2", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 210000, amount_financed_cents: 2801000, collateral_value_cents: 2500000, term_months: 60, vehicle_model_year: 2024, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap_p2: $.data.id }
            - call: "POST /lending/applications/${ap_p2}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
            - call: "POST /lending/contracts"
              payload: { application_id: "${ap_p2}", contract_apr_bps: 749, contract_date: "2026-08-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { k_p2: $.data.id }
            - call: "POST /lending/contracts/${k_p2}/documents"
              payload: { doc_type: "RETAIL_INSTALLMENT_CONTRACT", document_reference: "IMG-p2-RIC" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { doc1_p2: $.data.id }
            - call: "POST /lending/contracts/${k_p2}/documents"
              payload: { doc_type: "TITLE_APPLICATION", document_reference: "IMG-p2-TTL" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { doc2_p2: $.data.id }
            - call: "POST /lending/documents/${doc1_p2}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/documents/${doc2_p2}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/contracts/${k_p2}/fund"
              payload: { funding_date: "2026-08-01T00:00:00Z" }
              as: FundingSpecialist
              as_user_id: "fs-001"
          trigger:
            - call: "GET /lending/contracts"
              payload: { dealer_id: "${d1}", limit: 1, offset: 1 }
              as: PortfolioAdmin
              captures: { page_id: "$.data[0].id" }
          assert:
            - "HTTP 200 and response_type == 'array'"
            - "The data array has length 1"
            - "meta or envelope pagination reports total_count == 2, limit == 1, offset == 1, has_more == false"
            - "The same request with limit 1 and offset 0 reports has_more == true"

      - name: dealer_get_unknown_id_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /lending/dealers/{id}]
          - errors[ERR_DEALER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A well-formed but unknown dealer UUID returns HTTP 404 with error_id ERR_DEALER_NOT_FOUND and response_type 'error'."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "GET /lending/dealers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PortfolioAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == 'ERR_DEALER_NOT_FOUND'"
            - "response_type == 'error' and data.message is a non-empty string"

      - name: application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /lending/applications]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting collateral_value_cents - an input field with no default - returns HTTP 400 ERR_INVALID_REQUEST and creates no CreditApplication."
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01 with an ACTIVE agreement and PUBLISHED rate sheet."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-BAD", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 180000, amount_financed_cents: 1000000, term_months: 60, vehicle_model_year: 2023, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { bad_err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "GET /lending/applications?dealer_id=${d1} returns an empty data array with total_count == 0"

      - name: application_invalid_enum_monitoring_cohort_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CreditApplication.fields.monitoring_cohort
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "monitoring_cohort accepts only CONTROL or MONITORED; the value 'OTHER' returns HTTP 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01 with an ACTIVE agreement and PUBLISHED rate sheet."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-ENUM", monitoring_cohort: "OTHER", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 180000, amount_financed_cents: 1000000, collateral_value_cents: 1000000, term_months: 60, vehicle_model_year: 2023, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { enum_err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"

      - name: contract_computed_fields_copied_from_application
        claim_type: Computed Fields
        grounds:
          - entities.RetailContract.fields.amount_financed_cents
          - entities.RetailContract.fields.markup_bps
          - entities.RetailContract.fields.required_doc_types
          - entities.RetailContract.fields.acquisition_fee_cents
          - endpoints[POST /lending/contracts]
        distinguishing_aspect: "The contract create body carries only application_id, contract_apr_bps and contract_date; amount_financed_cents 2801000, term_months 60, buy_rate_apr_bps 549, markup_bps 200, acquisition_fee_cents 15000 and required_doc_types are all derived server-side."
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01; one application APPROVED at tier T1 with amount_financed_cents 2801000, term 60, no stipulations."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-cc", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 210000, amount_financed_cents: 2801000, collateral_value_cents: 2500000, term_months: 60, vehicle_model_year: 2024, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap_cc: $.data.id }
            - call: "POST /lending/applications/${ap_cc}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
          trigger:
            - call: "POST /lending/contracts"
              payload: { application_id: "${ap_cc}", contract_apr_bps: 749, contract_date: "2026-08-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { k_cc: $.data.id, cc_markup: $.data.markup_bps }
          assert:
            - "HTTP 201"
            - "RetailContract.${k_cc}.amount_financed_cents == 2801000 and term_months == 60"
            - "RetailContract.${k_cc}.buy_rate_apr_bps == 549 and markup_bps == 200"
            - "RetailContract.${k_cc}.acquisition_fee_cents == 15000"
            - "RetailContract.${k_cc}.required_doc_types == ['RETAIL_INSTALLMENT_CONTRACT', 'TITLE_APPLICATION'] because stipulation_count is 0"
            - "RetailContract.${k_cc}.funding_status == 'PENDING_DOCS' and reserve_status == 'NONE'"
            - "CreditApplication.${ap_cc}.status == 'CONTRACTED'"

      - name: conditioned_application_adds_income_verification_to_required_docs
        claim_type: Computed Fields
        grounds:
          - entities.RetailContract.fields.required_doc_types
          - entities.CreditApplication.fields.stipulation_count
          - state_machines.CreditApplication.SUBMITTED_to_CONDITIONED
        distinguishing_aspect: "An application that passed through a CONDITION decision keeps stipulation_count 1, so its contract's required_doc_types gains INCOME_VERIFICATION and two verified documents are no longer enough to reach DOCS_VERIFIED."
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01; application CONDITIONED with stipulation_count 1, then resubmitted and APPROVED."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
