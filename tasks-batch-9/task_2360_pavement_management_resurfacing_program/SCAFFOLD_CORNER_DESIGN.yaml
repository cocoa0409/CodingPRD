        grounds: ["endpoints.POST /pavement/condition-surveys/{id}/generate-candidates", "validations.ERR_CANDIDATES_ALREADY_GENERATED", "errors.ERR_CANDIDATES_ALREADY_GENERATED"]
        distinguishing_aspect: "Generation is a one-shot action endpoint, not an idempotent projection: the second call is 409 rather than a re-emission of the same array, and crucially the survey is NOT left half-generated — the single Maple St candidate keeps its original id, RECOMMENDED status and 10,743,323-cent estimate, so no duplicate candidate can be funded twice."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One SEALED 2026 survey holds one ACCEPTED observation on Maple St (measured 69.1)."
            - "The first generate-candidates call has already produced exactly one MILL_AND_OVERLAY candidate."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
