# =============================================================================
# Donor-Advised Fund Administration — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  417. Donor-Advised Fund Administration (Fidelity Charitable style): donor account
  & irrevocable contribution, asset gift (cash/securities/crypto) & valuation, grant
  recommendation & charity vetting (501(c)(3)), investment-pool allocation,
  minimum-grant/inactivity policy, succession/legacy plan, anonymous grant, IRS
  substantiation

domain_name: donor-advised-fund
api_prefix: /daf

# Expert band: 12 entities / 31 endpoints / 28 errors / 5 state machines.
# Flat topology (prioritized by §0.3): peer collections under /daf with FK references
# in request bodies and filtered-list GETs for reverse-reachability.
complexity_profile:
  primary_archetype: compliance_audit          # irrevocability, charity vetting, IRS substantiation, audit ledger
  secondary_archetype: quota_allocation        # grantable balance + investment-pool unit allocation/redemption
  complexity_layers:
    - dual_variant_calculation                 # FMV (mean-high-low vs closing) ; grantable (settled vs projected)
    - cascading_side_effects                   # contribution settle -> cash -> ledger -> grantable ; grant pay -> redeem -> ledger
    - derived_field_reconciliation             # grantable_balance / pool unit balances kept consistent
    - optimistic_concurrency                   # OCC on DonorAccount.version for grant recommendation create

  entity_topology: flat                        # peer resources with FK references; no parent id nested in URL path
  state_machine_shape: branching               # Contribution, Grant, Charity each fork into divergent terminal sets
  relationship_patterns:
    - one_to_many                              # Sponsor -> {DonorAccount, InvestmentPool, Charity}
    - many_to_many                             # DonorAccount <-> InvestmentPool via PoolAllocation junction
    - cross_aggregate                          # GrantRecommendation references Charity; vetting state gates payout
  role_model: segregation_of_duties            # DonorAdvisor recommends; GrantOfficer approves/pays; never the same actor
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsoring charity / DAF program name" }
      - { name: ein, type: string, source: input, description: "Sponsor's own IRS Employer Identification Number" }
      - { name: minimum_grant_cents, type: integer, source: input, default: 5000, description: "Smallest permitted single grant amount in cents" }
      - { name: inactivity_quarters, type: integer, source: input, default: 8, description: "Quarters with no PAID grant before an account becomes inactivity-eligible" }
      - { name: admin_fee_bps_default, type: integer, source: input, default: 50, description: "Default annual admin-fee rate in basis points applied per quarter" }
      - { name: current_quarter_index, type: integer, source: system, default: 0, description: "Sponsor fiscal clock; advanced by close_quarter; drives inactivity & fee accrual" }

  - name: InvestmentPool
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id" }
      - { name: name, type: string, source: input, description: "Pool display name" }
      - { name: risk_tier, type: enum, source: input, description: "CONSERVATIVE | BALANCED | GROWTH", constraints: "one of CONSERVATIVE, BALANCED, GROWTH" }
      - { name: nav_per_unit_cents, type: integer, source: input, description: "Net asset value per pool unit, in cents (> 0)" }
      - { name: fee_bps, type: integer, source: input, description: "Annual admin-fee rate in basis points charged on this pool's value" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED (CLOSED pools accept no new buy allocations)", constraints: "one of OPEN, CLOSED" }

  - name: NavPeriod
    parent: null
    common_fields: true
    fields:
      - { name: investment_pool_id, type: string, source: input, description: "FK -> InvestmentPool.id" }
      - { name: from_quarter, type: integer, source: input, description: "Inclusive start quarter index of this NAV pricing window" }
      - { name: to_quarter, type: integer, source: input, description: "Exclusive end quarter index (HALF-OPEN interval [from, to): touching boundaries do NOT collide)" }
      - { name: nav_per_unit_cents, type: integer, source: input, description: "NAV per unit effective during this window, cents (> 0)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUPERSEDED", constraints: "one of ACTIVE, SUPERSEDED" }

  - name: Charity
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id" }
      - { name: legal_name, type: string, source: input, description: "Recipient organization legal name" }
      - { name: ein, type: string, source: input, description: "Recipient EIN; unique among non-REVOKED charities under the sponsor" }
      - { name: ntee_code, type: string, source: input, description: "National Taxonomy of Exempt Entities classification code" }
      - { name: is_private_foundation, type: boolean, source: input, default: false, description: "True if a private foundation (ineligible as DAF grantee)" }
      - { name: status, type: enum, source: system, default: "PENDING_VETTING", description: "PENDING_VETTING | VETTED | WATCHLISTED | REVOKED", constraints: "one of PENDING_VETTING, VETTED, WATCHLISTED, REVOKED" }
      - { name: vetting_note, type: string, source: input, default: null, description: "Reviewer note recorded on the most recent vetting decision" }

  - name: DonorAccount
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id" }
      - { name: account_name, type: string, source: input, description: "Donor-chosen account / fund name" }
      - { name: primary_advisor_user_id, type: string, source: input, description: "X-User-ID of the DonorAdvisor who owns this account" }
      - { name: cash_balance_cents, type: integer, source: computed, default: 0, description: "Uninvested cash: settled cash contributions + pool redemptions - amounts moved to pools - grants paid - fees disbursed" }
      - { name: invested_value_cents, type: integer, source: computed, default: 0, description: "Sum over ACTIVE PoolAllocation of round_half_up(units_micro/1e6 * pool.nav_per_unit_cents)" }
      - { name: committed_grants_cents, type: integer, source: computed, default: 0, description: "Sum of GrantRecommendation.amount_cents in {SUBMITTED, APPROVED, SCHEDULED}" }
      - { name: admin_fee_accrued_cents, type: integer, source: computed, default: 0, description: "Unpaid admin fee accrued by close_quarter sweeps" }
      - { name: grantable_balance_cents, type: integer, source: computed, default: 0, description: "SETTLED variant = cash_balance_cents + invested_value_cents - committed_grants_cents - admin_fee_accrued_cents" }
      - { name: last_grant_paid_quarter, type: integer, source: system, default: null, description: "Sponsor quarter index of the most recent PAID grant (null if none)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE | WIND_DOWN | CLOSED", constraints: "one of ACTIVE, INACTIVE, WIND_DOWN, CLOSED" }

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - { name: donor_account_id, type: string, source: input, description: "FK -> DonorAccount.id" }
      - { name: asset_type, type: enum, source: input, description: "CASH | SECURITIES | CRYPTO", constraints: "one of CASH, SECURITIES, CRYPTO" }
      - { name: cash_amount_cents, type: integer, source: input, default: null, description: "CASH gifts: amount in cents (> 0); null for non-cash" }
      - { name: ticker, type: string, source: input, default: null, description: "SECURITIES/CRYPTO: instrument symbol; null for cash" }
      - { name: quantity_milli, type: integer, source: input, default: null, description: "SECURITIES/CRYPTO: quantity * 1000 (integer milli-units); null for cash" }
      - { name: high_price_cents, type: integer, source: input, default: null, description: "SECURITIES gift-date high price per share, cents" }
      - { name: low_price_cents, type: integer, source: input, default: null, description: "SECURITIES gift-date low price per share, cents" }
      - { name: closing_price_cents, type: integer, source: input, default: null, description: "SECURITIES gift-date closing price per share, cents (thinly-traded variant)" }
      - { name: spot_price_cents, type: integer, source: input, default: null, description: "CRYPTO spot price per whole unit at gift time, cents" }
      - { name: thinly_traded, type: boolean, source: input, default: false, description: "SECURITIES only: use CLOSING_PRICE variant instead of MEAN_HIGH_LOW" }
      - { name: fair_market_value_cents, type: integer, source: computed, default: null, description: "FMV stamped at settlement per valuation calc; irrevocable once SETTLED" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | SETTLED | REJECTED", constraints: "one of PENDING, SETTLED, REJECTED" }

  - name: SubstantiationReceipt
    parent: null
    common_fields: false
    fields:
      - { name: contribution_id, type: string, source: system, description: "FK -> Contribution.id" }
      - { name: donor_account_id, type: string, source: system, description: "FK -> DonorAccount.id" }
      - { name: receipt_number, type: string, source: system, description: "Sponsor-minted sequential substantiation number" }
      - { name: deductible_value_cents, type: integer, source: system, description: "IRS-deductible value = Contribution.fair_market_value_cents at settlement (frozen)" }
      - { name: asset_description, type: string, source: system, description: "Human-readable description of the gifted asset for the IRS letter" }
      - { name: issued_quarter_index, type: integer, source: system, description: "Sponsor quarter index when the receipt was issued" }

  - name: PoolAllocation
    parent: null
    common_fields: true
    fields:
      - { name: donor_account_id, type: string, source: input, description: "FK -> DonorAccount.id" }
      - { name: investment_pool_id, type: string, source: input, description: "FK -> InvestmentPool.id" }
      - { name: units_micro, type: integer, source: computed, default: 0, description: "Units held * 1,000,000 (integer micro-units); floor(amount*1e6/nav) added on buy, reduced on redeem" }
      - { name: target_pct_bps, type: integer, source: input, default: 0, description: "Donor target weight in basis points; grant-redemption order = target_pct_bps DESC then created_at ASC" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | LIQUIDATED (units_micro == 0 after a full redeem)", constraints: "one of ACTIVE, LIQUIDATED" }

  - name: GrantRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: donor_account_id, type: string, source: input, description: "FK -> DonorAccount.id" }
      - { name: charity_id, type: string, source: input, description: "FK -> Charity.id" }
      - { name: amount_cents, type: integer, source: input, description: "Recommended grant amount in cents (>= Sponsor.minimum_grant_cents)" }
      - { name: is_anonymous, type: boolean, source: input, default: false, description: "If true, sponsor remits without disclosing DonorAccount identity to the charity" }
      - { name: purpose, type: string, source: input, default: null, description: "Free-text grant purpose / designation" }
      - { name: recurrence, type: enum, source: input, default: "ONE_TIME", description: "ONE_TIME | RECURRING; RECURRING occupies a fiscal-quarter window", constraints: "one of ONE_TIME, RECURRING" }
      - { name: effective_from_quarter, type: integer, source: input, default: null, description: "RECURRING only: inclusive first active quarter" }
      - { name: effective_to_quarter, type: integer, source: input, default: null, description: "RECURRING only: inclusive last active quarter (CLOSED interval [from, to]: touching boundaries DO collide)" }
      - { name: recommended_by_user_id, type: string, source: system, description: "X-User-ID of the DonorAdvisor who submitted (segregation-of-duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the GrantOfficer who approved (must differ from recommended_by_user_id)" }
      - { name: paid_quarter_index, type: integer, source: system, default: null, description: "Sponsor quarter index when status became PAID" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | SCHEDULED | PAID | REJECTED | CANCELLED", constraints: "one of SUBMITTED, APPROVED, SCHEDULED, PAID, REJECTED, CANCELLED" }

  - name: SuccessionPlan
    parent: null
    common_fields: true
    fields:
      - { name: donor_account_id, type: string, source: input, description: "FK -> DonorAccount.id" }
      - { name: plan_type, type: enum, source: input, description: "SUCCESSOR_ADVISOR | LEGACY_GRANTS", constraints: "one of SUCCESSOR_ADVISOR, LEGACY_GRANTS" }
      - { name: beneficiaries, type: array, source: input, description: "List of { charity_id, share_bps } (LEGACY_GRANTS; share_bps sum to 10000) or { successor_user_id } (SUCCESSOR_ADVISOR)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CONFIRMED | EXECUTED", constraints: "one of DRAFT, CONFIRMED, EXECUTED" }

  - name: RebalanceOrder
    parent: null
    common_fields: true
    fields:
      - { name: donor_account_id, type: string, source: input, description: "FK -> DonorAccount.id" }
      - { name: source_pool_id, type: string, source: input, default: null, description: "Pool to redeem from; null means buy from cash" }
      - { name: target_pool_id, type: string, source: input, default: null, description: "Pool to buy into; null means redeem to cash" }
      - { name: amount_cents, type: integer, source: input, description: "Cash-equivalent amount to move in cents (> 0)" }
      - { name: source_units_redeemed_micro, type: integer, source: computed, default: 0, description: "Micro-units redeemed from source_pool on execution" }
      - { name: target_units_bought_micro, type: integer, source: computed, default: 0, description: "Micro-units bought into target_pool on execution" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | EXECUTED | CANCELLED", constraints: "one of DRAFT, EXECUTED, CANCELLED" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: donor_account_id, type: string, source: system, description: "FK -> DonorAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "CONTRIBUTION_SETTLED | POOL_BUY | POOL_REDEEM | GRANT_PAID | ADMIN_FEE | LEGACY_DISBURSEMENT", constraints: "one of CONTRIBUTION_SETTLED, POOL_BUY, POOL_REDEEM, GRANT_PAID, ADMIN_FEE, LEGACY_DISBURSEMENT" }
      - { name: signed_amount_cents, type: integer, source: system, description: "Cash-balance delta this entry applied (positive = credit, negative = debit)" }
      - { name: ref_entity, type: string, source: system, description: "Source entity type, e.g. Contribution / GrantRecommendation / RebalanceOrder" }
      - { name: ref_id, type: string, source: system, description: "Id of the source entity that produced this ledger entry" }
      - { name: quarter_index, type: integer, source: system, description: "Sponsor quarter index when the entry was posted" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------- Charity vetting (branching fork + revision cycle WATCHLISTED<->VETTED) ----------
  - entity: Charity
    initial_state: PENDING_VETTING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_VETTING
        to: VETTED
        trigger: "POST /daf/charities/{charityId}/vet (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions:
          - "Charity.is_private_foundation == false (else ERR_INELIGIBLE_GRANTEE)"
          - "decision == APPROVE"
        side_effects: ["status -> VETTED", "vetting_note set from request"]
      - from: PENDING_VETTING
        to: WATCHLISTED
        trigger: "POST /daf/charities/{charityId}/vet (decision=WATCHLIST)"
        actor: ComplianceOfficer
        preconditions: ["decision == WATCHLIST"]
        side_effects: ["status -> WATCHLISTED", "vetting_note set from request"]
      - from: WATCHLISTED
        to: VETTED
        trigger: "POST /daf/charities/{charityId}/vet (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions:
          - "Charity.is_private_foundation == false (else ERR_INELIGIBLE_GRANTEE)"
          - "decision == APPROVE"
        side_effects: ["status -> VETTED"]
      - from: VETTED
        to: WATCHLISTED
        trigger: "POST /daf/charities/{charityId}/vet (decision=WATCHLIST)"
        actor: ComplianceOfficer
        preconditions: ["decision == WATCHLIST"]
        side_effects:
          - "status -> WATCHLISTED"
          - "Cross-entity: subsequent grant payout to this charity is blocked because pay re-checks Charity.status == VETTED"
      - from: VETTED
        to: REVOKED
        trigger: "POST /daf/charities/{charityId}/vet (decision=REVOKE)"
        actor: ComplianceOfficer
        preconditions: ["decision == REVOKE"]
        side_effects:
          - "status -> REVOKED"
          - "Cascade: every SCHEDULED GrantRecommendation referencing this charity transitions to CANCELLED and its committed amount is released (committed_grants_cents and grantable_balance_cents recomputed on each affected account)"
      - from: WATCHLISTED
        to: REVOKED
        trigger: "POST /daf/charities/{charityId}/vet (decision=REVOKE)"
        actor: ComplianceOfficer
        preconditions: ["decision == REVOKE"]
        side_effects:
          - "status -> REVOKED"
          - "Cascade: every SCHEDULED GrantRecommendation referencing this charity transitions to CANCELLED and its committed amount is released"
    note: "Re-vetting into the current state (e.g. APPROVE when already VETTED) returns ERR_INVALID_STATE; REVOKED is terminal."

  # ---------- Contribution valuation (branching fork: SETTLED vs REJECTED) ----------
  - entity: Contribution
    initial_state: PENDING
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /daf/contributions/{contributionId}/settle"
        actor: ContributionAdmin
        preconditions:
          - "DonorAccount.status == ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
          - "Per asset_type required pricing fields present (else ERR_VALUATION_INPUT_MISSING)"
          - "SECURITIES quantity_milli divisible by 1000 (else ERR_VALUATION_QUANTITY_INVALID)"
        side_effects:
          - "L1: fair_market_value_cents computed per contribution_fair_market_value (irrevocable)"
          - "L2: DonorAccount.cash_balance_cents += fair_market_value_cents"
          - "L3: a LedgerEntry{entry_type=CONTRIBUTION_SETTLED, signed_amount_cents=+fmv} is appended; then DonorAccount.grantable_balance_cents recomputed"
          - "A SubstantiationReceipt is minted with deductible_value_cents = fair_market_value_cents"
      - from: PENDING
        to: REJECTED
        trigger: "POST /daf/contributions/{contributionId}/reject"
        actor: ContributionAdmin
        preconditions: []
        side_effects: ["status -> REJECTED; no valuation, no ledger entry, no receipt"]
    note: "Contributions are irrevocable once SETTLED — no transition out of SETTLED; re-settle returns ERR_INVALID_STATE."

  # ---------- GrantRecommendation (branching + cross-entity guards + auto-cancel cascade) ----------
  - entity: GrantRecommendation
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /daf/grants/{grantId}/approve"
        actor: GrantOfficer
        preconditions:
          - "X-User-ID != GrantRecommendation.recommended_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "Charity.status == VETTED (else ERR_CHARITY_NOT_VETTED)"
          - "DonorAccount.status IN {ACTIVE, INACTIVE} (else ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects: ["status -> APPROVED; approved_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /daf/grants/{grantId}/reject"
        actor: GrantOfficer
        preconditions:
          - "X-User-ID != GrantRecommendation.recommended_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> REJECTED; committed_grants_cents and grantable_balance_cents recomputed (amount released)"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /daf/grants/{grantId}/cancel"
        actor: DonorAdvisor
        preconditions:
          - "X-User-ID == DonorAccount.primary_advisor_user_id (else ERR_NOT_ACCOUNT_OWNER)"
        side_effects: ["status -> CANCELLED; committed_grants_cents and grantable_balance_cents recomputed"]
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /daf/grants/{grantId}/schedule"
        actor: GrantOfficer
        preconditions:
          - "Charity.status == VETTED (else ERR_CHARITY_NOT_VETTED)"
          - "DonorAccount.cash_balance_cents + DonorAccount.invested_value_cents >= amount_cents (else ERR_INSUFFICIENT_GRANTABLE_BALANCE)"
          - "If recurrence == RECURRING: [effective_from_quarter, effective_to_quarter] must not closed-overlap an existing SCHEDULED RECURRING grant to the same charity from the same account (else ERR_RECURRING_GRANT_OVERLAP)"
        side_effects: ["status -> SCHEDULED"]
      - from: SCHEDULED
        to: PAID
        trigger: "POST /daf/grants/{grantId}/pay"
        actor: GrantOfficer
        preconditions:
          - "Charity.status == VETTED (else ERR_CHARITY_NOT_VETTED) — re-checked because a WATCHLIST/REVOKE may have intervened since scheduling"
          - "DonorAccount.cash_balance_cents + DonorAccount.invested_value_cents >= amount_cents (else ERR_INSUFFICIENT_GRANTABLE_BALANCE)"
        side_effects:
          - "L1: redeem units across PoolAllocations via grant_payout_redemption until cash_balance_cents >= amount_cents, then cash_balance_cents -= amount_cents"
          - "L2: append a LedgerEntry{entry_type=POOL_REDEEM} per redeemed pool and one LedgerEntry{entry_type=GRANT_PAID, signed_amount_cents=-amount_cents}"
          - "L3: committed_grants_cents recomputed; then grantable_balance_cents recomputed"
          - "DonorAccount.last_grant_paid_quarter = Sponsor.current_quarter_index; paid_quarter_index set"
          - "If DonorAccount.status == INACTIVE it transitions back to ACTIVE (a PAID grant clears inactivity)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /daf/grants/{grantId}/cancel"
        actor: DonorAdvisor
        preconditions:
          - "X-User-ID == DonorAccount.primary_advisor_user_id (else ERR_NOT_ACCOUNT_OWNER)"
        side_effects: ["status -> CANCELLED; committed_grants_cents and grantable_balance_cents recomputed"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (Charity REVOKED cascade) OR POST /daf/grants/{grantId}/cancel by account owner"
        actor: system | DonorAdvisor
        preconditions:
          - "For owner-triggered cancel: X-User-ID == DonorAccount.primary_advisor_user_id"
        side_effects: ["status -> CANCELLED; committed_grants_cents and grantable_balance_cents recomputed"]

  # ---------- DonorAccount lifecycle (inactivity auto-transition + wind-down + close cascade) ----------
  - entity: DonorAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "system (during POST /daf/sponsors/{sponsorId}/close_quarter)"
        actor: system
        preconditions:
          - "last_grant_paid_quarter is null OR (current_quarter_index - last_grant_paid_quarter) >= inactivity_quarters"
          - "grantable_balance_cents > 0"
        side_effects: ["status -> INACTIVE (flagged for required-distribution outreach; still accepts grant recommendations)"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "system (a GrantRecommendation referencing this account reaches PAID)"
        actor: system
        preconditions: []
        side_effects: ["status -> ACTIVE; last_grant_paid_quarter updated"]
      - from: ACTIVE
        to: WIND_DOWN
        trigger: "POST /daf/accounts/{accountId}/wind-down"
        actor: SponsorAdmin
        preconditions:
          - "A CONFIRMED LEGACY_GRANTS SuccessionPlan exists for this account (else ERR_NO_CONFIRMED_SUCCESSION)"
        side_effects: ["status -> WIND_DOWN; no new contributions accepted"]
      - from: INACTIVE
        to: WIND_DOWN
        trigger: "POST /daf/accounts/{accountId}/wind-down"
        actor: SponsorAdmin
        preconditions:
          - "A CONFIRMED LEGACY_GRANTS SuccessionPlan exists (else ERR_NO_CONFIRMED_SUCCESSION)"
        side_effects: ["status -> WIND_DOWN"]
      - from: WIND_DOWN
        to: CLOSED
        trigger: "POST /daf/accounts/{accountId}/execute-succession"
        actor: SponsorAdmin
        preconditions:
          - "DonorAccount.status == WIND_DOWN (else ERR_ACCOUNT_NOT_IN_WIND_DOWN)"
          - "No GrantRecommendation in {SUBMITTED, APPROVED, SCHEDULED} (else ERR_PENDING_GRANTS_BLOCK_CLOSE)"
          - "Every LEGACY_GRANTS beneficiary charity is VETTED (else ERR_SUCCESSION_BENEFICIARY_NOT_VETTED)"
        side_effects:
          - "All PoolAllocations liquidated to cash; residual = grantable_balance_cents"
          - "legacy_split computed (largest-remainder over beneficiary share_bps)"
          - "For each beneficiary, append LedgerEntry{entry_type=LEGACY_DISBURSEMENT, signed_amount_cents=-share}; cash_balance_cents drained to 0"
          - "SuccessionPlan.status -> EXECUTED; DonorAccount.status -> CLOSED; conserved invariant: sum of LEGACY_DISBURSEMENT == residual"

  # ---------- RebalanceOrder (draft -> execute, cash<->pool move) ----------
  - entity: RebalanceOrder
    initial_state: DRAFT
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /daf/rebalance-orders/{orderId}/execute"
        actor: DonorAdvisor
        preconditions:
          - "X-User-ID == DonorAccount.primary_advisor_user_id (else ERR_NOT_ACCOUNT_OWNER)"
          - "If target_pool_id set: that InvestmentPool.status == OPEN (else ERR_POOL_CLOSED)"
          - "If source_pool_id null (cash->pool buy): DonorAccount.cash_balance_cents >= amount_cents (else ERR_INSUFFICIENT_CASH)"
          - "If source_pool_id set (pool->cash redeem): source PoolAllocation invested value >= amount_cents (else ERR_INSUFFICIENT_POOL_UNITS)"
        side_effects:
          - "Buy: target PoolAllocation.units_micro += floor(amount_cents*1e6 / pool.nav_per_unit_cents); cash_balance_cents -= amount_cents; append LedgerEntry POOL_BUY"
          - "Redeem-to-cash: source PoolAllocation.units_micro -= ceil(amount_cents*1e6 / pool.nav_per_unit_cents); cash_balance_cents += amount_cents; append LedgerEntry POOL_REDEEM"
          - "invested_value_cents and grantable_balance_cents recomputed"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /daf/rebalance-orders/{orderId}/cancel"
        actor: DonorAdvisor
        preconditions:
          - "X-User-ID == DonorAccount.primary_advisor_user_id (else ERR_NOT_ACCOUNT_OWNER)"
        side_effects: ["status -> CANCELLED; no balance change"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: grant-create-stale-account
    parent_entity: DonorAccount
    write_endpoint: "POST /daf/grants"
    occ_field: "expected_account_version"
    description: |
      Submitting a new GrantRecommendation against a DonorAccount whose version has
      advanced since the client last observed it is rejected. A grant submission
      legitimately succeeds from identical observed state under product semantics, but
      another writer may have already submitted a grant that consumed grantable balance
      (raising committed_grants_cents and bumping the account version); the current
      writer's grantable-balance view is therefore stale, and the submission is rejected
      on the version mismatch rather than silently over-committing the fund.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 dual-variant #1 (Contribution domain): asset valuation ---
  - name: contribution_fair_market_value
    trigger: "Contribution PENDING -> SETTLED (settle endpoint)"
    algorithm: threshold
    formula: |
      if asset_type == CASH:
        fmv = cash_amount_cents
      elif asset_type == SECURITIES:
        shares = quantity_milli / 1000        # quantity_milli divisible by 1000 enforced on settle
        if thinly_traded == true:
          fmv = round_half_up(shares * closing_price_cents)            # CLOSING_PRICE variant
        else:
          fmv = round_half_up(shares * (high_price_cents + low_price_cents) / 2)  # MEAN_HIGH_LOW variant
      elif asset_type == CRYPTO:
        qty = quantity_milli / 1000
        fmv = floor(qty * spot_price_cents)   # crypto rounded DOWN to whole cents
      return fmv
    input_set: "Single Contribution being settled; pricing fields per asset_type"
    constants: {}
    precision: "whole cents; securities round_half_up, crypto floor"
    variants:
      - name: MEAN_HIGH_LOW
        when: "asset_type == SECURITIES AND thinly_traded == false"
        difference: "FMV = shares * mean(high, low), round_half_up"
      - name: CLOSING_PRICE
        when: "asset_type == SECURITIES AND thinly_traded == true"
        difference: "FMV = shares * closing_price, round_half_up — diverges from MEAN_HIGH_LOW for the same shares when high/low straddle close"

  # --- Rule 1 dual-variant #2 (DonorAccount domain): grantable balance ---
  - name: grantable_balance
    trigger: "Contribution settle, grant state change, rebalance execute, close_quarter; read via GET /daf/accounts/{id}/summary"
    algorithm: aggregation
    formula: |
      cash      = DonorAccount.cash_balance_cents
      invested  = sum over ACTIVE PoolAllocation a of round_half_up(a.units_micro / 1_000_000 * pool(a).nav_per_unit_cents)
      committed = sum of GrantRecommendation.amount_cents where status IN {SUBMITTED, APPROVED, SCHEDULED}
      fee       = DonorAccount.admin_fee_accrued_cents
      SETTLED   : grantable = cash + invested - committed - fee
      PROJECTED : grantable = cash + invested - committed - fee
                  + sum of provisional value of Contribution where status == PENDING
                    (provisional = same valuation formula applied to its current pricing inputs)
    input_set: "SETTLED counts only SETTLED contributions (folded into cash/invested); PROJECTED adds PENDING contributions at provisional value"
    constants: {}
    precision: "whole cents"
    variants:
      - name: SETTLED
        when: "default; GET summary without ?projection=PROJECTED"
        difference: "Excludes PENDING contributions entirely"
      - name: PROJECTED
        when: "GET summary with ?projection=PROJECTED"
        difference: "Adds PENDING contributions valued provisionally; diverges by the sum of pending provisional FMVs"

  # --- Rule 2 mode-a (>=3 inputs, nonlinear floor/ceil branch): pool unit arithmetic ---
  - name: pool_unit_delta
    trigger: "RebalanceOrder execute (buy/redeem) and grant payout redeem use the same unit arithmetic"
    algorithm: tiered_pricing
    formula: |
      # 3 inputs: amount_cents, pool.nav_per_unit_cents, direction (BUY | REDEEM)
      if direction == BUY:
        units_delta_micro = floor(amount_cents * 1_000_000 / pool.nav_per_unit_cents)   # never credit a fractional unit above cash
        PoolAllocation.units_micro += units_delta_micro ; cash_balance_cents -= amount_cents
      else: # REDEEM
        units_delta_micro = ceil(amount_cents * 1_000_000 / pool.nav_per_unit_cents)    # surrender enough units to fully cover cash withdrawn
        PoolAllocation.units_micro -= units_delta_micro ; cash_balance_cents += amount_cents
      # Nonlinear: the BUY branch floors and the REDEEM branch ceils, so the operation is
      # not symmetric — buying then redeeming the same amount can leave residual units.
    input_set: "Single PoolAllocation + amount + direction"
    constants: { MICRO: 1000000 }
    precision: "integer micro-units; BUY floor, REDEEM ceil"

  # --- Rule 2 mode-b (nested rounding, order PINNED): quarterly admin fee ---
  - name: quarterly_admin_fee
    trigger: "POST /daf/sponsors/{sponsorId}/close_quarter (per DonorAccount)"
    algorithm: aggregation
    formula: |
      # Order is PINNED: round per-PoolAllocation FIRST, THEN sum (NOT sum-then-round).
      per_alloc_fee(a) = round_half_up( pool(a).fee_bps * invested_value(a) / 40000 )
        where invested_value(a) = round_half_up(a.units_micro / 1_000_000 * pool(a).nav_per_unit_cents)
        and 40000 = 10000 (bps scale) * 4 (quarters)
      account_fee = sum over ACTIVE PoolAllocations of per_alloc_fee(a)
      DonorAccount.admin_fee_accrued_cents += account_fee
      append LedgerEntry{entry_type=ADMIN_FEE, signed_amount_cents=-account_fee}; grantable_balance_cents recomputed
    input_set: "All ACTIVE PoolAllocations of the account at quarter close"
    constants: { BPS_SCALE: 10000, QUARTERS: 4 }
    precision: "whole cents; round_half_up per allocation BEFORE summing"

  # --- Rule 9 conserved-quantity #1 partner: grant payout waterfall redemption ---
  - name: grant_payout_redemption
    trigger: "GrantRecommendation SCHEDULED -> PAID (pay endpoint)"
    algorithm: waterfall_allocation
    formula: |
      need_cents = amount_cents - DonorAccount.cash_balance_cents   # only redeem the shortfall
      if need_cents <= 0:
        redeem nothing
      else:
        order ACTIVE PoolAllocations with units_micro > 0 by target_pct_bps DESC, then created_at ASC   # NEVER by id
        for each allocation in order while need_cents > 0:
          alloc_value = round_half_up(units_micro / 1_000_000 * nav_per_unit_cents)
          take = min(alloc_value, need_cents)
          redeem ceil(take * 1_000_000 / nav_per_unit_cents) micro-units; cash_balance_cents += take; need_cents -= take
          if units_micro becomes 0: PoolAllocation.status -> LIQUIDATED
      then cash_balance_cents -= amount_cents
      # Conserved invariant (CASH+INVESTED): for the redeem leg only, cash credited == invested debited at
      # the per-allocation nav, so (cash_balance + invested_value) is unchanged by redemption itself; the
      # subsequent grant debit is the only net reduction and equals exactly amount_cents.
    input_set: "ACTIVE PoolAllocations with units_micro > 0, ordered by target_pct_bps desc then created_at asc"
    constants: {}
    precision: "whole cents for cash; integer micro-units for redemption (ceil)"

  # --- Rule 9 conserved-quantity #2 partner: legacy split (largest-remainder) ---
  - name: legacy_split
    trigger: "DonorAccount WIND_DOWN -> CLOSED (execute-succession)"
    algorithm: waterfall_allocation
    formula: |
      residual = DonorAccount.grantable_balance_cents at wind-down
                 (== cash_balance_cents after all PoolAllocations are liquidated to cash; no committed grants remain)
      for each beneficiary b in the CONFIRMED LEGACY_GRANTS SuccessionPlan:
        floor_share(b) = floor(residual * b.share_bps / 10000)
      remainder = residual - sum(floor_share)
      distribute the remainder extra cents one-by-one to beneficiaries ordered by
        fractional_part(residual * share_bps / 10000) DESC, tie-break the beneficiary charity row's created_at ASC
      CONSERVED INVARIANT (LEGACY_DISTRIBUTED): sum of final shares == residual (no cent created or destroyed)
    input_set: "CONFIRMED LEGACY_GRANTS plan beneficiaries; share_bps sum == 10000"
    constants: { BPS_TOTAL: 10000 }
    precision: "whole cents; largest-remainder apportionment"

  # --- Rule 8 overlap #1: NavPeriod half-open windows on InvestmentPool ---
  - name: nav_period_overlap
    trigger: "POST /daf/nav-periods (create NavPeriod)"
    algorithm: interval_merge
    formula: |
      # Windows are HALF-OPEN: [from_quarter, to_quarter).
      # New [f2, t2) collides with an existing ACTIVE [f1, t1) on the SAME pool iff
      #   f1 < t2 AND f2 < t1   (strict). Adjacency (t1 == f2 or t2 == f1) does NOT collide.
      reject with ERR_NAV_PERIOD_OVERLAP when any ACTIVE NavPeriod on the pool overlaps.
    input_set: "ACTIVE NavPeriods on the target InvestmentPool"
    constants: {}
    precision: "integer quarter indices; half-open boundary"

  # --- Rule 8 overlap #2: recurring grant windows on (account,charity), CLOSED interval ---
  - name: recurring_grant_window_overlap
    trigger: "POST /daf/grants/{grantId}/schedule for a RECURRING grant"
    algorithm: interval_merge
    formula: |
      # Windows are CLOSED: [effective_from_quarter, effective_to_quarter].
      # New [f2, t2] collides with an existing SCHEDULED RECURRING grant [f1, t1] to the SAME charity
      # from the SAME account iff f1 <= t2 AND f2 <= t1 (touching boundaries DO collide,
      # so [3,5] and [5,7] collide — the opposite adjacency rule from nav_period_overlap).
      reject with ERR_RECURRING_GRANT_OVERLAP on collision.
    input_set: "SCHEDULED RECURRING GrantRecommendations for the same (donor_account_id, charity_id)"
    constants: {}
    precision: "integer quarter indices; closed boundary"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced and FK-referenced resources exist, validated left-to-right then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Acting DonorAdvisor must be the account's primary_advisor_user_id for owner-scoped actions (cancel grant, execute/cancel rebalance, create/confirm succession)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "owner-scoped DonorAdvisor actions"

  - priority: 5
    category: state
    check: "Target resource in a state where the requested transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Account must be ACTIVE to accept a contribution settle (not INACTIVE/WIND_DOWN/CLOSED)"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "contribution settle, grant approve"

  - priority: 7
    category: business_safety
    check: "Grant approver/payer/rejecter must differ from the grant's recommender (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "grant approve, grant reject"

  - priority: 8
    category: business_safety
    check: "Charity must not be a private foundation to be VETTED"
    error_id: ERR_INELIGIBLE_GRANTEE
    http_status: 409
    applies_to: "charity vet (APPROVE)"

  - priority: 9
    category: business_safety
    check: "Charity referenced by grant approve/schedule/pay must be in status VETTED"
    error_id: ERR_CHARITY_NOT_VETTED
    http_status: 409
    applies_to: "grant approve, grant schedule, grant pay"

  - priority: 10
    category: business_constraint
    check: "Grant amount must be >= Sponsor.minimum_grant_cents"
    error_id: ERR_BELOW_MINIMUM_GRANT
    http_status: 422
    applies_to: "grant submit"

  - priority: 11
    category: business_constraint
    check: "Per asset_type valuation inputs must be present on settle (SECURITIES needs high+low, or closing when thinly_traded; CRYPTO needs spot; CASH needs amount)"
    error_id: ERR_VALUATION_INPUT_MISSING
    http_status: 422
    applies_to: "contribution settle"

  - priority: 12
    category: business_constraint
    check: "SECURITIES quantity_milli must be divisible by 1000 (whole shares) on settle"
    error_id: ERR_VALUATION_QUANTITY_INVALID
    http_status: 422
    applies_to: "contribution settle"

  - priority: 13
    category: business_constraint
    check: "Target InvestmentPool must be OPEN to receive a new buy allocation"
    error_id: ERR_POOL_CLOSED
    http_status: 409
    applies_to: "rebalance execute (buy leg)"

  - priority: 14
    category: business_constraint
    check: "LEGACY_GRANTS succession beneficiaries' share_bps must sum to exactly 10000"
    error_id: ERR_SHARE_BPS_NOT_100
    http_status: 422
    applies_to: "succession plan create (LEGACY_GRANTS)"

  - priority: 15
    category: business_temporal
    check: "New NavPeriod must not half-open-overlap any ACTIVE NavPeriod on the same pool (f1 < t2 AND f2 < t1)"
    error_id: ERR_NAV_PERIOD_OVERLAP
    http_status: 409
    applies_to: "nav-period create"

  - priority: 16
    category: business_temporal
    check: "Scheduling a RECURRING grant must not closed-overlap an existing SCHEDULED RECURRING grant to the same charity from the same account (f1 <= t2 AND f2 <= t1)"
    error_id: ERR_RECURRING_GRANT_OVERLAP
    http_status: 409
    applies_to: "grant schedule (RECURRING)"

  - priority: 17
    category: business_referential
    check: "wind-down requires a CONFIRMED LEGACY_GRANTS SuccessionPlan"
    error_id: ERR_NO_CONFIRMED_SUCCESSION
    http_status: 409
    applies_to: "account wind-down"

  - priority: 18
    category: business_referential
    check: "execute-succession requires no grants in {SUBMITTED, APPROVED, SCHEDULED}"
    error_id: ERR_PENDING_GRANTS_BLOCK_CLOSE
    http_status: 409
    applies_to: "account execute-succession"

  - priority: 19
    category: business_referential
    check: "execute-succession requires every LEGACY_GRANTS beneficiary charity to be VETTED"
    error_id: ERR_SUCCESSION_BENEFICIARY_NOT_VETTED
    http_status: 409
    applies_to: "account execute-succession"

  - priority: 20
    category: state
    check: "execute-succession is only valid on an account in WIND_DOWN"
    error_id: ERR_ACCOUNT_NOT_IN_WIND_DOWN
    http_status: 409
    applies_to: "account execute-succession"

  - priority: 21
    category: business_fiscal
    check: "On rebalance buy (cash->pool), cash_balance_cents must be >= amount_cents"
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 409
    applies_to: "rebalance execute (buy leg)"

  - priority: 22
    category: business_fiscal
    check: "On rebalance redeem, the source PoolAllocation invested value must be >= amount_cents"
    error_id: ERR_INSUFFICIENT_POOL_UNITS
    http_status: 409
    applies_to: "rebalance execute (redeem leg)"

  - priority: 23
    category: business_fiscal
    check: "Grant schedule/pay requires cash_balance_cents + invested_value_cents >= amount_cents"
    error_id: ERR_INSUFFICIENT_GRANTABLE_BALANCE
    http_status: 409
    applies_to: "grant schedule, grant pay"

  - priority: 24
    category: business_constraint
    check: "Charity EIN unique among non-REVOKED charities under the sponsor"
    error_id: ERR_DUPLICATE_CHARITY_EIN
    http_status: 409
    applies_to: "charity create"

  - priority: 25
    category: business_fiscal
    check: "OCC: expected_account_version must equal DonorAccount.version on grant submit"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "grant submit"

  - priority: 26
    category: business_constraint
    check: "Request body field-shape: required fields present, enums valid, amounts > 0, nav_per_unit_cents > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

# =============================================================================
# 1.5 API Endpoint Table (flat topology under /daf)
# =============================================================================
endpoints:
  # ---------------- Sponsor ----------------
  - method: POST
    path: "/daf/sponsors"
    description: "Create a Sponsor (DAF program)"
    roles: [SponsorAdmin]
    code: 201
    input: ["name", "ein", "minimum_grant_cents?", "inactivity_quarters?", "admin_fee_bps_default?"]
    output: Sponsor
    side_effects: ["current_quarter_index=0"]

  - method: GET
    path: "/daf/sponsors/{sponsorId}"
    description: "Get a Sponsor"
    roles: [SponsorAdmin, ComplianceOfficer, ContributionAdmin, GrantOfficer, DonorAdvisor]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: POST
    path: "/daf/sponsors/{sponsorId}/close_quarter"
    description: "Advance sponsor fiscal quarter: accrue admin fee per account (round per-allocation then sum), evaluate inactivity transitions"
    roles: [SponsorAdmin]
    code: 200
    input: []
    output: Sponsor
    side_effects:
      - "current_quarter_index += 1"
      - "quarterly_admin_fee accrued and ADMIN_FEE ledger entry appended per DonorAccount"
      - "ACTIVE accounts with no PAID grant within inactivity_quarters and grantable>0 -> INACTIVE"
      - "grantable_balance_cents recomputed per account"

  # ---------------- InvestmentPool ----------------
  - method: POST
    path: "/daf/pools"
    description: "Create an InvestmentPool"
    roles: [SponsorAdmin]
    code: 201
    input: ["sponsor_id", "name", "risk_tier", "nav_per_unit_cents", "fee_bps"]
    output: InvestmentPool
    side_effects: ["status=OPEN; ERR_POOL_NAV_INVALID if nav_per_unit_cents <= 0"]

  - method: GET
    path: "/daf/pools/{poolId}"
    description: "Get an InvestmentPool"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: []
    output: InvestmentPool
    side_effects: []

  - method: GET
    path: "/daf/pools"
    description: "List InvestmentPools (reverse-reachability for InvestmentPool.sponsor_id)"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["sponsor_id?", "status?"]
    output: "InvestmentPool[]"
    side_effects: []

  - method: POST
    path: "/daf/pools/{poolId}/close"
    description: "Close a pool to new buy allocations"
    roles: [SponsorAdmin]
    code: 200
    input: []
    output: InvestmentPool
    side_effects: ["status -> CLOSED"]

  # ---------------- NavPeriod ----------------
  - method: POST
    path: "/daf/nav-periods"
    description: "Create a NavPeriod (half-open NAV pricing window); rejects overlaps with ACTIVE periods on the same pool"
    roles: [SponsorAdmin]
    code: 201
    input: ["investment_pool_id", "from_quarter", "to_quarter", "nav_per_unit_cents"]
    output: NavPeriod
    side_effects: ["status=ACTIVE; ERR_NAV_PERIOD_OVERLAP on half-open collision"]

  - method: GET
    path: "/daf/nav-periods/{navPeriodId}"
    description: "Get a NavPeriod"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: []
    output: NavPeriod
    side_effects: []

  - method: GET
    path: "/daf/nav-periods"
    description: "List NavPeriods (reverse-reachability for NavPeriod.investment_pool_id)"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["investment_pool_id?", "status?"]
    output: "NavPeriod[]"
    side_effects: []

  # ---------------- Charity ----------------
  - method: POST
    path: "/daf/charities"
    description: "Register a recipient Charity (starts PENDING_VETTING)"
    roles: [ComplianceOfficer, SponsorAdmin]
    code: 201
    input: ["sponsor_id", "legal_name", "ein", "ntee_code", "is_private_foundation?"]
    output: Charity
    side_effects: ["status=PENDING_VETTING; ERR_DUPLICATE_CHARITY_EIN if EIN in use by a non-REVOKED charity under the sponsor"]

  - method: GET
    path: "/daf/charities/{charityId}"
    description: "Get a Charity"
    roles: [ComplianceOfficer, SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: []
    output: Charity
    side_effects: []

  - method: GET
    path: "/daf/charities"
    description: "List Charities (reverse-reachability for Charity.sponsor_id)"
    roles: [ComplianceOfficer, SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["sponsor_id?", "status?", "ein?"]
    output: "Charity[]"
    side_effects: []

  - method: POST
    path: "/daf/charities/{charityId}/vet"
    description: "Record a vetting decision (APPROVE->VETTED, WATCHLIST->WATCHLISTED, REVOKE->REVOKED)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "vetting_note?"]
    output: Charity
    side_effects:
      - "status transitions per decision"
      - "On REVOKE: SCHEDULED grants referencing this charity cascade to CANCELLED; committed_grants_cents and grantable_balance_cents recomputed"

  # ---------------- DonorAccount ----------------
  - method: POST
    path: "/daf/accounts"
    description: "Open a DonorAccount"
    roles: [SponsorAdmin, DonorAdvisor]
    code: 201
    input: ["sponsor_id", "account_name", "primary_advisor_user_id"]
    output: DonorAccount
    side_effects: ["status=ACTIVE; balances initialized to 0"]

  - method: GET
    path: "/daf/accounts/{accountId}"
    description: "Get a DonorAccount with computed balances"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer, ContributionAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: DonorAccount
    side_effects: []

  - method: GET
    path: "/daf/accounts"
    description: "List DonorAccounts (reverse-reachability for DonorAccount.sponsor_id)"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["sponsor_id?", "status?"]
    output: "DonorAccount[]"
    side_effects: []

  - method: GET
    path: "/daf/accounts/{accountId}/summary"
    description: "Computed account summary; ?projection=PROJECTED switches grantable_balance variant"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["projection?"]
    output: DonorAccount
    side_effects: []

  - method: POST
    path: "/daf/accounts/{accountId}/wind-down"
    description: "Move account to WIND_DOWN (requires a CONFIRMED LEGACY_GRANTS plan)"
    roles: [SponsorAdmin]
    code: 200
    input: []
    output: DonorAccount
    side_effects: ["status -> WIND_DOWN"]

  - method: POST
    path: "/daf/accounts/{accountId}/execute-succession"
    description: "Liquidate residual to legacy beneficiaries via largest-remainder split; close account"
    roles: [SponsorAdmin]
    code: 200
    input: []
    output: DonorAccount
    side_effects:
      - "All PoolAllocations liquidated to cash; legacy_split computed; LEGACY_DISBURSEMENT ledger entries appended"
      - "SuccessionPlan -> EXECUTED; account -> CLOSED; cash_balance_cents -> 0"

  # ---------------- Contribution ----------------
  - method: POST
    path: "/daf/contributions"
    description: "Record an irrevocable Contribution (PENDING)"
    roles: [DonorAdvisor, ContributionAdmin]
    code: 201
    input: ["donor_account_id", "asset_type", "cash_amount_cents?", "ticker?", "quantity_milli?", "high_price_cents?", "low_price_cents?", "closing_price_cents?", "spot_price_cents?", "thinly_traded?"]
    output: Contribution
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/daf/contributions/{contributionId}"
    description: "Get a Contribution"
    roles: [SponsorAdmin, DonorAdvisor, ContributionAdmin]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/daf/contributions"
    description: "List Contributions (reverse-reachability for Contribution.donor_account_id)"
    roles: [SponsorAdmin, DonorAdvisor, ContributionAdmin]
    code: 200
    input: ["donor_account_id?", "status?", "asset_type?"]
    output: "Contribution[]"
    side_effects: []

  - method: POST
    path: "/daf/contributions/{contributionId}/settle"
    description: "Settle and value a Contribution (irrevocable FMV; mints substantiation; credits cash)"
    roles: [ContributionAdmin]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "fair_market_value_cents computed; cash_balance_cents += fmv"
      - "CONTRIBUTION_SETTLED ledger entry appended; SubstantiationReceipt minted; grantable_balance_cents recomputed"

  - method: POST
    path: "/daf/contributions/{contributionId}/reject"
    description: "Reject a PENDING Contribution"
    roles: [ContributionAdmin]
    code: 200
    input: []
    output: Contribution
    side_effects: ["status -> REJECTED"]

  # ---------------- SubstantiationReceipt ----------------
  - method: GET
    path: "/daf/receipts/{receiptId}"
    description: "Get a SubstantiationReceipt"
    roles: [SponsorAdmin, DonorAdvisor, ContributionAdmin]
    code: 200
    input: []
    output: SubstantiationReceipt
    side_effects: []

  - method: GET
    path: "/daf/receipts"
    description: "List SubstantiationReceipts (reverse-reachability for contribution_id and donor_account_id)"
    roles: [SponsorAdmin, DonorAdvisor, ContributionAdmin]
    code: 200
    input: ["contribution_id?", "donor_account_id?"]
    output: "SubstantiationReceipt[]"
    side_effects: []

  # ---------------- PoolAllocation ----------------
  - method: GET
    path: "/daf/allocations/{allocationId}"
    description: "Get a PoolAllocation"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: []
    output: PoolAllocation
    side_effects: []

  - method: GET
    path: "/daf/allocations"
    description: "List PoolAllocations (reverse-reachability for donor_account_id and investment_pool_id)"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["donor_account_id?", "investment_pool_id?", "status?"]
    output: "PoolAllocation[]"
    side_effects: []

  # ---------------- RebalanceOrder ----------------
  - method: POST
    path: "/daf/rebalance-orders"
    description: "Create a DRAFT RebalanceOrder (cash<->pool move); creates target PoolAllocation lazily on execute"
    roles: [DonorAdvisor]
    code: 201
    input: ["donor_account_id", "source_pool_id?", "target_pool_id?", "amount_cents", "target_pct_bps?"]
    output: RebalanceOrder
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/daf/rebalance-orders/{orderId}"
    description: "Get a RebalanceOrder"
    roles: [SponsorAdmin, DonorAdvisor]
    code: 200
    input: []
    output: RebalanceOrder
    side_effects: []

  - method: GET
    path: "/daf/rebalance-orders"
    description: "List RebalanceOrders (reverse-reachability for RebalanceOrder.donor_account_id)"
    roles: [SponsorAdmin, DonorAdvisor]
    code: 200
    input: ["donor_account_id?", "status?"]
    output: "RebalanceOrder[]"
    side_effects: []

  - method: POST
    path: "/daf/rebalance-orders/{orderId}/execute"
    description: "Execute the rebalance: buy/redeem pool units, append ledger, recompute balances"
    roles: [DonorAdvisor]
    code: 200
    input: []
    output: RebalanceOrder
    side_effects:
      - "PoolAllocation.units_micro adjusted (BUY floor / REDEEM ceil); cash_balance_cents adjusted"
      - "POOL_BUY or POOL_REDEEM ledger entry appended; invested_value_cents & grantable_balance_cents recomputed"

  - method: POST
    path: "/daf/rebalance-orders/{orderId}/cancel"
    description: "Cancel a DRAFT RebalanceOrder"
    roles: [DonorAdvisor]
    code: 200
    input: []
    output: RebalanceOrder
    side_effects: ["status -> CANCELLED"]

  # ---------------- GrantRecommendation ----------------
  - method: POST
    path: "/daf/grants"
    description: "Submit a GrantRecommendation (OCC-guarded on account version)"
    roles: [DonorAdvisor]
    code: 201
    input: ["donor_account_id", "charity_id", "amount_cents", "is_anonymous?", "purpose?", "recurrence?", "effective_from_quarter?", "effective_to_quarter?", "expected_account_version"]
    output: GrantRecommendation
    side_effects:
      - "status=SUBMITTED; recommended_by_user_id = X-User-ID"
      - "committed_grants_cents and grantable_balance_cents recomputed; increments DonorAccount.version by 1"

  - method: GET
    path: "/daf/grants/{grantId}"
    description: "Get a GrantRecommendation"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: []

  - method: GET
    path: "/daf/grants"
    description: "List GrantRecommendations (reverse-reachability for donor_account_id and charity_id)"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer]
    code: 200
    input: ["donor_account_id?", "charity_id?", "status?"]
    output: "GrantRecommendation[]"
    side_effects: []

  - method: POST
    path: "/daf/grants/{grantId}/approve"
    description: "GrantOfficer approves (segregation of duties; charity must be VETTED)"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> APPROVED; approved_by_user_id = X-User-ID"]

  - method: POST
    path: "/daf/grants/{grantId}/reject"
    description: "GrantOfficer rejects a SUBMITTED grant"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> REJECTED; committed_grants_cents and grantable_balance_cents recomputed"]

  - method: POST
    path: "/daf/grants/{grantId}/schedule"
    description: "Schedule an APPROVED grant; for RECURRING grants enforces closed-window non-overlap with other SCHEDULED RECURRING grants to the same charity"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> SCHEDULED; ERR_RECURRING_GRANT_OVERLAP on closed-window collision"]

  - method: POST
    path: "/daf/grants/{grantId}/pay"
    description: "Pay a SCHEDULED grant: redeem pools via waterfall, debit cash, append ledger, clear inactivity"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects:
      - "grant_payout_redemption runs; GRANT_PAID and POOL_REDEEM ledger entries appended"
      - "committed_grants_cents & grantable_balance_cents recomputed; last_grant_paid_quarter set; INACTIVE->ACTIVE"

  - method: POST
    path: "/daf/grants/{grantId}/cancel"
    description: "Account owner (DonorAdvisor) cancels a non-terminal grant"
    roles: [DonorAdvisor]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> CANCELLED; committed_grants_cents and grantable_balance_cents recomputed"]

  # ---------------- SuccessionPlan ----------------
  - method: POST
    path: "/daf/succession-plans"
    description: "Create a SuccessionPlan (DRAFT); LEGACY_GRANTS share_bps must sum to 10000"
    roles: [DonorAdvisor]
    code: 201
    input: ["donor_account_id", "plan_type", "beneficiaries"]
    output: SuccessionPlan
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/daf/succession-plans/{planId}"
    description: "Get a SuccessionPlan"
    roles: [SponsorAdmin, DonorAdvisor]
    code: 200
    input: []
    output: SuccessionPlan
    side_effects: []

  - method: GET
    path: "/daf/succession-plans"
    description: "List SuccessionPlans (reverse-reachability for SuccessionPlan.donor_account_id)"
    roles: [SponsorAdmin, DonorAdvisor]
    code: 200
    input: ["donor_account_id?", "plan_type?", "status?"]
    output: "SuccessionPlan[]"
    side_effects: []

  - method: POST
    path: "/daf/succession-plans/{planId}/confirm"
    description: "Confirm a DRAFT SuccessionPlan (required before wind-down)"
    roles: [DonorAdvisor]
    code: 200
    input: []
    output: SuccessionPlan
    side_effects: ["status -> CONFIRMED"]

  # ---------------- LedgerEntry ----------------
  - method: GET
    path: "/daf/ledger-entries/{ledgerEntryId}"
    description: "Get a LedgerEntry"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/daf/ledger-entries"
    description: "List LedgerEntries (reverse-reachability for LedgerEntry.donor_account_id)"
    roles: [SponsorAdmin, DonorAdvisor, GrantOfficer, ComplianceOfficer]
    code: 200
    input: ["donor_account_id?", "entry_type?"]
    output: "LedgerEntry[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, invalid enum, missing required field, or amount <= 0" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "Acting DonorAdvisor is not the account's primary_advisor_user_id for an owner-scoped action" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state where the requested transition is not allowed" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Account not in a state that permits this operation (e.g., not ACTIVE for contribution settle)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Grant approver/payer/rejecter is the same user who recommended the grant" }
  - { id: ERR_INELIGIBLE_GRANTEE, http: 409, condition: "Charity is a private foundation and cannot be VETTED" }
  - { id: ERR_CHARITY_NOT_VETTED, http: 409, condition: "Charity referenced by grant approve/schedule/pay is not in status VETTED" }
  - { id: ERR_BELOW_MINIMUM_GRANT, http: 422, condition: "Grant amount below Sponsor.minimum_grant_cents" }
  - { id: ERR_VALUATION_INPUT_MISSING, http: 422, condition: "Required pricing inputs for the asset_type are absent on settle" }
  - { id: ERR_VALUATION_QUANTITY_INVALID, http: 422, condition: "SECURITIES quantity_milli not divisible by 1000 (fractional shares disallowed)" }
  - { id: ERR_POOL_NAV_INVALID, http: 422, condition: "nav_per_unit_cents <= 0 on pool create" }
  - { id: ERR_POOL_CLOSED, http: 409, condition: "Target pool is CLOSED and cannot receive a new buy allocation" }
  - { id: ERR_SHARE_BPS_NOT_100, http: 422, condition: "LEGACY_GRANTS beneficiaries' share_bps do not sum to exactly 10000" }
  - { id: ERR_NAV_PERIOD_OVERLAP, http: 409, condition: "New NavPeriod half-open window overlaps an existing ACTIVE NavPeriod on the same pool" }
  - { id: ERR_RECURRING_GRANT_OVERLAP, http: 409, condition: "Scheduling a RECURRING grant whose closed window overlaps an existing SCHEDULED RECURRING grant to the same charity from the same account" }
  - { id: ERR_NO_CONFIRMED_SUCCESSION, http: 409, condition: "wind-down attempted without a CONFIRMED LEGACY_GRANTS SuccessionPlan" }
  - { id: ERR_PENDING_GRANTS_BLOCK_CLOSE, http: 409, condition: "execute-succession attempted while grants exist in SUBMITTED/APPROVED/SCHEDULED" }
  - { id: ERR_SUCCESSION_BENEFICIARY_NOT_VETTED, http: 409, condition: "A LEGACY_GRANTS beneficiary charity is not VETTED at execute-succession time" }
  - { id: ERR_ACCOUNT_NOT_IN_WIND_DOWN, http: 409, condition: "execute-succession called on an account not in WIND_DOWN" }
  - { id: ERR_INSUFFICIENT_CASH, http: 409, condition: "Rebalance buy requires more cash than cash_balance_cents holds" }
  - { id: ERR_INSUFFICIENT_POOL_UNITS, http: 409, condition: "Rebalance redeem exceeds the source PoolAllocation's invested value" }
  - { id: ERR_INSUFFICIENT_GRANTABLE_BALANCE, http: 409, condition: "Grant schedule/pay requires cash_balance_cents + invested_value_cents >= amount_cents" }
  - { id: ERR_DUPLICATE_CHARITY_EIN, http: 409, condition: "Charity EIN already in use by a non-REVOKED charity under the sponsor" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version != DonorAccount.version on grant submit" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "Requested SubstantiationReceipt id does not exist" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SponsorAdmin
    description: "Sponsor program operator: creates sponsor/pools/nav-periods/accounts, advances quarter, runs wind-down/succession"
    identity: opaque
    exclusive_operations:
      - "POST /daf/sponsors — create sponsor"
      - "POST /daf/pools — create pool"
      - "POST /daf/pools/{id}/close — close pool"
      - "POST /daf/nav-periods — create nav period"
      - "POST /daf/sponsors/{id}/close_quarter — advance fiscal quarter"
      - "POST /daf/accounts/{id}/wind-down — wind down account"
      - "POST /daf/accounts/{id}/execute-succession — execute legacy split"
    shared_operations:
      - "POST /daf/accounts — open account (with DonorAdvisor)"
      - "POST /daf/charities — register charity (with ComplianceOfficer)"
      - "GET reads across DAF resources"

  - name: ComplianceOfficer
    description: "Vets charities (501(c)(3) eligibility); records APPROVE/WATCHLIST/REVOKE decisions"
    identity: opaque
    exclusive_operations:
      - "POST /daf/charities/{id}/vet — vetting decision"
    shared_operations:
      - "POST /daf/charities — register charity (with SponsorAdmin)"
      - "GET charity / account / ledger reads"

  - name: ContributionAdmin
    description: "Settles and values irrevocable contributions; mints IRS substantiation"
    identity: opaque
    exclusive_operations:
      - "POST /daf/contributions/{id}/settle — settle & value"
      - "POST /daf/contributions/{id}/reject — reject contribution"
    shared_operations:
      - "POST /daf/contributions — record contribution (with DonorAdvisor)"
      - "GET contribution / receipt reads"

  - name: DonorAdvisor
    description: "Account owner (owner-scoped via primary_advisor_user_id): records contributions, recommends grants, rebalances pools, sets succession"
    identity: opaque
    exclusive_operations:
      - "POST /daf/grants — submit grant"
      - "POST /daf/grants/{id}/cancel — cancel own grant"
      - "POST /daf/rebalance-orders — create rebalance"
      - "POST /daf/rebalance-orders/{id}/execute — execute rebalance"
      - "POST /daf/rebalance-orders/{id}/cancel — cancel rebalance"
      - "POST /daf/succession-plans — create succession plan"
      - "POST /daf/succession-plans/{id}/confirm — confirm plan"
    shared_operations:
      - "POST /daf/accounts — open account (with SponsorAdmin)"
      - "POST /daf/contributions — record contribution (with ContributionAdmin)"
      - "GET account / contribution / grant / allocation / pool reads"

  - name: GrantOfficer
    description: "Approves, schedules, rejects, and pays grants (segregation of duties — never the recommender)"
    identity: opaque
    exclusive_operations:
      - "POST /daf/grants/{id}/approve — approve grant"
      - "POST /daf/grants/{id}/reject — reject grant"
      - "POST /daf/grants/{id}/schedule — schedule grant"
      - "POST /daf/grants/{id}/pay — pay grant"
    shared_operations:
      - "GET grant / account / pool / charity reads"
