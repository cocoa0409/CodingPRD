scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: contractor_create_success_and_defaults
        claim_type: creation_defaults
        grounds: [entities.Contractor]
        distinguishing_aspect: "POST /contractors with required fields returns 201; compliance_score defaults to 1000, posture GOOD_STANDING, status ACTIVE; system fields id/created_at/updated_at/version=1 stamped."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Default Co", state_license_no: "C-9000" }
              as: FireMarshal
              captures: { con_id: $.data.id }
          assert:
            - "HTTP 201; response envelope has meta.api_request_id, response_type == object"
            - "Contractor.${con_id}.compliance_score == 1000 and posture == GOOD_STANDING and status == ACTIVE"
            - "Contractor.${con_id}.version == 1; id is a bare UUID with no type prefix"
      - name: contractor_duplicate_license_rejected
        claim_type: uniqueness_constraint
        grounds: [entities.Contractor.fields.state_license_no, "errors[ERR_DUPLICATE_CONSTRAINT]"]
        distinguishing_aspect: "Second contractor with identical state_license_no rejected with ERR_DUPLICATE_CONSTRAINT (409)."
        test_recipe:
          setup: ["One contractor with state_license_no C-9100 exists"]
          setup_api_calls:
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "First Co", state_license_no: "C-9100" }
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Copycat Co", state_license_no: "C-9100" }
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_CONSTRAINT"
            - "HTTP status == 409"
      - name: device_frequency_code_computed_from_type
        claim_type: computed_field
        grounds: [entities.Device.fields.frequency_code, calculations.frequency_code_lookup]
        distinguishing_aspect: "GAUGE_VALVE device gets frequency_code QUARTERLY and next_due_date == install_date + 3 calendar months; client-supplied frequency_code is ignored (not an input)."
        test_recipe:
          setup: ["Contractor, property, SPRINKLER system installed 2026-01-31"]
          setup_api_calls:
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Freq Co", state_license_no: "C-9200" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "1 Gauge St", occupancy_class: "STORAGE", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-31", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
          trigger:
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "GAUGE_VALVE", serial_no: "GV-9" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
          assert:
            - "Device.${dev_id}.frequency_code == QUARTERLY"
            - "Device.${dev_id}.next_due_date == 2026-04-30 (2026-01-31 + 3 months clamps to month end)"
      - name: device_duplicate_serial_within_system_rejected
        claim_type: uniqueness_constraint
        grounds: [entities.Device.fields.serial_no, "errors[ERR_DUPLICATE_CONSTRAINT]"]
        distinguishing_aspect: "Same serial_no twice in one system rejected; same serial in a DIFFERENT system accepted (scope is per-system)."
        test_recipe:
          setup: ["Contractor, property, two FIRE_ALARM systems A and B; device SD-DUP in A"]
          setup_api_calls:
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Dup Co", state_license_no: "C-9300" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "2 Dup Ln", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_a: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_b: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_a}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-DUP" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /fire-compliance/systems/${sys_a}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-DUP" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
            - call: "POST /fire-compliance/systems/${sys_b}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-DUP" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_b: $.data.id }
          assert:
            - "captured err == ERR_DUPLICATE_CONSTRAINT (HTTP 409)"
            - "captured dev_b is a persisted device id in system ${sys_b}"
      - name: device_replace_self_reference_rejected
        claim_type: referential_integrity
        grounds: [entities.Device.fields.replaced_by_device_id, state_machines.Device.IN_SERVICE_to_REPLACED]
        distinguishing_aspect: "replace with replaced_by_device_id pointing at a device in ANOTHER system fails ERR_CROSS_REFERENCE_MISMATCH; self-reference also fails."
        test_recipe:
          setup: ["Two systems S1 (FIRE_ALARM), S2 (SPRINKLER); device d1 in S1, device d2 in S2"]
          setup_api_calls:
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Repl Co", state_license_no: "C-9400" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "3 Repl Rd", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys1: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys2: $.data.id }
            - call: "POST /fire-compliance/systems/${sys1}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-R1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { d1: $.data.id }
            - call: "POST /fire-compliance/systems/${sys2}/devices"
              payload: { device_type: "SPRINKLER_HEAD", serial_no: "SH-R2" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /fire-compliance/devices/${d1}/replace"
              payload: { replaced_by_device_id: "${d2}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CROSS_REFERENCE_MISMATCH"
            - "Device.${d1}.status == IN_SERVICE (unchanged)"
      - name: device_next_due_rolls_on_event_completion
        claim_type: computed_field
        grounds: [calculations.next_due_recompute, entities.Device.fields.next_due_date]
        distinguishing_aspect: "After a COMPLETED event on 2026-08-03 covering the system, an ANNUAL device's next_due_date recomputes to 2027-08-03 (completion date, not install date)."
        test_recipe:
          setup: ["Published plan; SMOKE_DETECTOR installed 2026-01-15 (initial next_due 2027-01-15); event completed 2026-08-03"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Roll Co", state_license_no: "C-9500" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "4 Roll Ave", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-15", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-RO1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Ron Due", nicet_level: "II" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2026-01-01", expires_on: "2027-06-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /fire-compliance/inspection-events/${ev_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "Device.${dev_id}.next_due_date == 2027-08-03"
            - "InspectionEvent.${ev_id}.report_due_date == 2026-08-10"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: deficiency_invalid_transition_from_open_to_verified
        claim_type: invalid_transition
        grounds: [state_machines.Deficiency]
        distinguishing_aspect: "verify directly on an OPEN deficiency (skipping attest) rejected ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["Completed event with one OPEN NONCRITICAL deficiency"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Skip Co", state_license_no: "C-9600" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "6 Skip St", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "PULL_STATION", serial_no: "PS-S1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Sue Skip", nicet_level: "II" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/deficiencies"
              payload: { device_id: "${dev_id}", classification: "NONCRITICAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { def_id: $.data.id }
            - call: "POST /fire-compliance/inspection-events/${ev_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /fire-compliance/deficiencies/${def_id}/verify"
              payload: {}
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "Deficiency.${def_id}.status == OPEN (unchanged)"
      - name: terminal_state_lockdown_event_completed_rejects_start
        claim_type: terminal_lockdown
        grounds: [state_machines.InspectionEvent]
        distinguishing_aspect: "COMPLETED is terminal: start on a COMPLETED event fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Event driven to COMPLETED"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Lockdown Co", state_license_no: "C-9700" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "9 Lock Ln", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-L1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Lou Lock", nicet_level: "I" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "InspectionEvent.${ev_id}.status == COMPLETED (unchanged)"
      - name: license_expiry_sweep_transition
        claim_type: automatic_transition
        grounds: [state_machines.LicenseRecord.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "Setting the clock past expires_on flips ACTIVE license to EXPIRED via the daily sweep; no direct client transition exists."
        test_recipe:
          setup: ["Technician with license expires_on 2026-08-10; clock advanced to 2026-08-11"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Sweep Co", state_license_no: "C-9800" }
