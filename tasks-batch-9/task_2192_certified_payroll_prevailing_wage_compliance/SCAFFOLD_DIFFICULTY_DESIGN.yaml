scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fringe_credit_annualized_all_hours_vs_covered_hours_only
        grounds:
          - calculations.fringe_hourly_credit
          - entities.FringeBenefitPlan.fields.annualized_credit_cents
          - entities.FringeBenefitPlan.fields.claimed_credit_cents
          - entities.FringeBenefitPlan.fields.annual_total_hours
          - entities.FringeBenefitPlan.fields.annual_public_works_hours
        distinguishing_aspect: |
          The dual variant lives on the FringeBenefitPlan entity domain (benefit-plan
          annualization), not on payroll cost: one identical set of plan inputs yields
          annualized_credit_cents == 238 (divide by all 2100 hours) and
          claimed_credit_cents == 385 (divide by the 1300 public-works hours), and only
          the 238 figure is ever creditable against a wage deficiency.
        test_recipe:
          setup:
            - "One Contractor 'Acme Electric' exists with one PREPARER staff member."
            - "One FringeBenefitPlan of type BONA_FIDE_TRUST exists on that contractor with annual_contribution_cents 500000, annual_total_hours 2100.00, annual_public_works_hours 1300.00, approval_status APPROVED."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
            - call: "POST /contractors/${prime_id}/fringe-plans"
              payload: { plan_name: "IBEW Trust A", plan_type: "BONA_FIDE_TRUST", annual_contribution_cents: 500000, annual_total_hours: 2100.00, annual_public_works_hours: 1300.00 }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /fringe-plans/${plan_id}/approve"
              payload: { decision: "APPROVE" }
              as: AgencyComplianceOfficer
              as_user_id: "officer-anna"
              captures: { plan_status: $.data.approval_status }
          assert:
            - "FringeBenefitPlan.${plan_id}.annualized_credit_cents == 238"
            - "FringeBenefitPlan.${plan_id}.claimed_credit_cents == 385"
            - "FringeBenefitPlan.${plan_id}.claimed_credit_cents - FringeBenefitPlan.${plan_id}.annualized_credit_cents == 147"
            - "FringeBenefitPlan.${plan_id}.approval_status == APPROVED"

      - name: underpayment_straight_time_only_vs_full_make_whole
        grounds:
          - calculations.underpayment_restitution
          - entities.PayrollSubmission.fields.straight_time_underpayment_cents
          - entities.PayrollSubmission.fields.make_whole_underpayment_cents
          - endpoints["GET /payroll-submissions/{id}/underpayment-summary"]
        distinguishing_aspect: |
          The second dual variant sits on the PayrollSubmission entity domain (weekly
          wage restitution), a different subject from the FringeBenefitPlan instance:
          the same single payroll line yields straight_time_underpayment_cents == 28000
          under STRAIGHT_TIME_ONLY and make_whole_underpayment_cents == 34400 under
          FULL_MAKE_WHOLE, a delta of exactly 6400 cents contributed solely by the 8
          overtime hours.
          Inputs: required 5000 base + 2000 fringe; paid 4800 base, 7200 overtime,
          1500 cash fringe; 40 straight hours and 8 overtime hours.
        test_recipe:
          setup:
            - "An ACTIVE project in CA-ALAMEDA points at an ACTIVE determination whose ELEC-INSIDE-JW BASE rate is 5000 base + 2000 fringe."
            - "The prime tier is ACTIVE and one journeyworker is registered."
            - "A DRAFT payroll for week ending 2026-08-01 carries exactly one line: 40 straight hours at 4800, 8 overtime hours at 7200, 1500 cash fringe, no fringe plan."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
            - call: "POST /projects"
              payload: { project_name: "Alameda Transit Center", awarding_agency: "City of Alameda", locality_code: "CA-ALAMEDA", zone_code: "BASE", wage_determination_id: "${wd_id}", reporting_portal_id: "${portal_id}", funding_source: "FEDERAL_DAVIS_BACON", contract_award_date: "2026-02-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract-assignments"
              payload: { contractor_id: "${prime_id}", subcontract_amount_cents: 100000000 }
              as: PortalAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-assignments/${ca_id}/activate"
              payload: {}
              as: PortalAdmin
              captures: { ca_v: $.data.version }
            - call: "POST /projects/${proj_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PortalAdmin
            - call: "POST /workers"
              payload: { employer_contractor_id: "${prime_id}", worker_number: "W-001", full_name: "Jo Journey", default_classification_code: "ELEC-INSIDE-JW" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { w_jw_id: $.data.id }
            - call: "POST /payroll-submissions"
              payload: { contract_assignment_id: "${ca_id}", week_ending_date: "2026-08-01T00:00:00.000Z", prepared_by_staff_id: "${staff_prep_id}", expected_contract_assignment_version: "${ca_v}" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /payroll-submissions/${sub_id}/lines"
              payload: { worker_id: "${w_jw_id}", classification_code: "ELEC-INSIDE-JW", straight_hours: 40.00, overtime_hours: 8.00, base_rate_paid_cents: 4800, overtime_rate_paid_cents: 7200, fringe_cash_paid_cents: 1500, reported_as_apprentice: false }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /payroll-submissions/${sub_id}/finalize"
              payload: {}
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
            - call: "GET /payroll-submissions/${sub_id}/underpayment-summary"
              payload: {}
              as: AgencyComplianceOfficer
              as_user_id: "officer-anna"
          assert:
            - "PayrollLine.${line_id}.required_base_cents == 5000"
            - "PayrollLine.${line_id}.required_fringe_cents == 2000"
            - "PayrollLine.${line_id}.line_underpayment_cents == 34400"
            - "PayrollSubmission.${sub_id}.straight_time_underpayment_cents == 28000"
            - "PayrollSubmission.${sub_id}.make_whole_underpayment_cents == 34400"
            - "UnderpaymentSummary.variant_delta_cents == 6400"
            - "PayrollSubmission.${sub_id}.compliance_status == DEFICIENT"
            - "PayrollSubmission.${sub_id}.workflow_status == PENDING_CERTIFICATION"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum_beats_aggregate_then_round_by_one_cent
        grounds:
          - calculations.underpayment_restitution
          - entities.PayrollLine.fields.line_underpayment_cents
          - entities.PayrollSubmission.fields.make_whole_underpayment_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the answer. Two lines each
          carry a 125-cent hourly deficiency over 10.02 h and 20.02 h, so the exact
          products are 1252.5 and 2502.5 cents. The pinned order (round_half_up per
          line, then sum) yields make_whole_underpayment_cents == 3756; the rejected
          AGGREGATE_THEN_ROUND order (sum 3755.0 exactly, then round) yields 3755.
          The one-cent gap is the whole point of the instance.
        test_recipe:
          setup:
            - "ACTIVE project in CA-ALAMEDA on a determination whose ELEC-INSIDE-JW BASE rate is 5000 base + 2000 fringe; prime tier ACTIVE."
            - "Two journeyworkers registered under the prime contractor."
            - "A DRAFT payroll for week ending 2026-08-01 with two lines, each paid 5000 base + 1875 cash fringe (125 cents/h short of the 7000 required total), one for 10.02 h and one for 20.02 h, no overtime."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
