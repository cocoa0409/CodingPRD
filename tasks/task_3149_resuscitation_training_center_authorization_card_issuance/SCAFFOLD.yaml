# =============================================================================
# SCAFFOLD.yaml — task_3149_resuscitation_training_center_authorization_card_issuance
# Resuscitation Training Center Authorization & Card Issuance (AHA-style)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Resuscitation Training Center Authorization & Card Issuance (American Heart Association):
  training center authorization with training site alignment and faculty oversight requirements,
  instructor candidate pathway including course monitoring and teaching evaluations,
  course delivery formats across classroom, blended learning and skills sessions with equipment ratios,
  skills testing with checklists and remediation policies,
  electronic completion card issuance with verification portals and expiration dating,
  quality assurance audits of instructors, sites and card issuance patterns,
  guidelines updates cascading into course materials with transition deadlines,
  employer verification of provider status and renewal scheduling

domain_name: resuscitation-training
api_prefix: /aha

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert band
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many          # TCAlignment is the Instructor × TrainingCenter junction
    - self_referential      # CourseCompletionCard.prior_card_id (renewal chain)
    - cross_aggregate       # CourseSession references TrainingSite, Instructor, GuidelinesVersion
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: TrainingCenter
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the training center" }
      - { name: region, type: string, source: input, description: "Geographic region label" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | ACTIVE | PROBATION | SUSPENDED | REVOKED" }
      - { name: probation_started_at, type: datetime, source: system, description: "Clock timestamp when the center last entered PROBATION; null otherwise", default: null }
      - { name: last_audit_opened_at, type: datetime, source: system, description: "Clock timestamp of the most recently opened QualityAudit; null until first audit", default: null }
      - { name: cards_issued_count, type: integer, source: computed, default: 0, description: "Lifetime count of CourseCompletionCard rows issued by sessions of this center; never decremented" }
      - { name: active_card_count, type: integer, source: computed, default: 0, description: "Count of this center's cards whose status == ACTIVE" }

  - name: TrainingSite
    parent: TrainingCenter
    common_fields: true
    fields:
      - { name: training_center_id, type: string, source: system, description: "FK -> TrainingCenter.id; owning center (from path)" }
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: street_address, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: capacity_students, type: integer, source: input, description: "Maximum students the site can host per session; integer >= 1" }
      - { name: status, type: enum, source: system, default: PENDING_ALIGNMENT, description: "PENDING_ALIGNMENT | ALIGNED | SUSPENDED | DECOMMISSIONED" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor full name" }
      - { name: email, type: string, source: input, description: "Instructor email" }
      - { name: discipline, type: enum, source: input, description: "BLS | ACLS | PALS | HEARTSAVER" }
      - { name: home_training_center_id, type: string, source: input, description: "FK -> TrainingCenter.id; home center" }
      - { name: legacy_certified, type: boolean, source: input, default: false, description: "NationalAdmin bootstrap flag: when true the instructor is created directly in CERTIFIED status (legacy record import)" }
      - { name: status, type: enum, source: system, default: CANDIDATE, description: "CANDIDATE | MONITORED | CERTIFIED | SUSPENDED | EXPIRED" }
      - { name: certified_since, type: datetime, source: system, description: "Clock timestamp of first certification; null until certified", default: null }
      - { name: renewal_due_at, type: datetime, source: system, description: "Certification expiry instant; set to clock + 24 months on certify/renew; null until certified. The instructor is renewable from renewal_due_at - 90 days up to and including renewal_due_at (a 90-day early-renewal window); past renewal_due_at the clock sweep expires the instructor.", default: null }
      - { name: renewal_count, type: integer, source: computed, default: 0, description: "Number of successful renewals" }
      - { name: is_faculty, type: boolean, source: system, default: false, description: "True once NationalAdmin grants faculty status; required to monitor/evaluate candidates and to lead BLS_INSTRUCTOR courses" }
      - { name: sessions_taught_count, type: integer, source: computed, default: 0, description: "Count of COMPLETED CourseSessions where this instructor was primary_instructor_id" }

  - name: TCAlignment
    parent: TrainingCenter
    common_fields: true
    fields:
      - { name: training_center_id, type: string, source: system, description: "FK -> TrainingCenter.id; from path" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; aligned instructor" }
      - { name: as_faculty, type: boolean, source: input, default: false, description: "True when this alignment confers faculty oversight on the center" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ENDED" }

  - name: CourseMonitoring
    parent: Instructor
    common_fields: false
    fields:
      - { name: instructor_id, type: string, source: system, description: "FK -> Instructor.id; the monitored candidate (from path)" }
      - { name: monitoring_faculty_id, type: string, source: system, description: "FK -> Instructor.id; evaluating faculty, taken from X-User-ID of the TrainingFaculty caller" }
      - { name: monitored_at, type: datetime, source: input, description: "When the monitored teaching occurred" }
      - { name: course_type_observed, type: enum, source: input, description: "BLS_PROVIDER | ACLS_PROVIDER | PALS_PROVIDER | HEARTSAVER" }
      - { name: outcome, type: enum, source: input, description: "SATISFACTORY | UNSATISFACTORY" }

  - name: TeachingEvaluation
    parent: Instructor
    common_fields: false
    fields:
      - { name: instructor_id, type: string, source: system, description: "FK -> Instructor.id; the evaluated candidate (from path)" }
      - { name: evaluator_faculty_id, type: string, source: system, description: "FK -> Instructor.id; evaluating faculty, taken from X-User-ID of the TrainingFaculty caller" }
      - { name: score, type: integer, source: input, description: "Integer 1..5" }
      - { name: notes, type: string, source: input, description: "Free-text evaluation notes" }

  - name: GuidelinesVersion
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique guidelines code, e.g. G2020, G2025" }
      - { name: title, type: string, source: input, description: "Human-readable title" }
      - { name: published_at, type: datetime, source: input, description: "Publication timestamp" }
      - { name: transition_deadline_at, type: datetime, source: input, description: "Instant after which SCHEDULED sessions on the superseded version are cancelled when this version is activated" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED" }

  - name: CourseSession
    parent: TrainingCenter
    common_fields: true
    fields:
      - { name: training_center_id, type: string, source: input, description: "FK -> TrainingCenter.id; delivering center" }
      - { name: site_id, type: string, source: input, description: "FK -> TrainingSite.id; delivery site" }
      - { name: primary_instructor_id, type: string, source: input, description: "FK -> Instructor.id; instructor of record" }
      - { name: guidelines_version_id, type: string, source: input, description: "FK -> GuidelinesVersion.id; curriculum version in force for this session" }
      - { name: course_type, type: enum, source: input, description: "BLS_PROVIDER | ACLS_PROVIDER | PALS_PROVIDER | HEARTSAVER | BLS_INSTRUCTOR" }
      - { name: delivery_format, type: enum, source: input, description: "CLASSROOM | BLENDED_SKILLS_SESSION" }
      - { name: start_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (UTC); must be strictly after start_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum enrolled students; integer >= 1 and <= site capacity_students" }
      - { name: manikin_count, type: integer, source: input, description: "Manikins allocated to the session; integer >= 0" }
      - { name: aed_trainer_count, type: integer, source: input, description: "AED trainers allocated; integer >= 0" }
      - { name: assisting_instructor_count, type: integer, source: input, default: 0, description: "Assisting instructors beyond the primary; integer >= 0" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, description: "MANUAL | GUIDELINES_TRANSITION | CENTER_SUSPENDED | SITE_SUSPENDED | INSTRUCTOR_SUSPENDED; null until cancelled", default: null }
      - { name: seats_available, type: integer, source: computed, description: "= capacity - count(RosterEntry of this session with status ENROLLED)" }
      - { name: curriculum_flag, type: enum, source: computed, description: "CURRENT when the session's guidelines version status == ACTIVE, else LEGACY" }

  - name: RosterEntry
    parent: CourseSession
    common_fields: true
    fields:
      - { name: course_session_id, type: string, source: system, description: "FK -> CourseSession.id; from path" }
      - { name: student_name, type: string, source: input, description: "Student full name" }
      - { name: student_email, type: string, source: input, description: "Student email; becomes card holder_email" }
      - { name: prior_card_id, type: string, source: input, default: null, description: "FK -> CourseCompletionCard.id; the student's expiring card when this is a renewal enrollment" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | PASSED | FAILED | CANCELLED" }
      - { name: remediation_used, type: boolean, source: computed, default: false, description: "True once a first-attempt skills evaluation returned REMEDIATION_REQUIRED" }

  - name: SkillsEvaluation
    parent: RosterEntry
    common_fields: false
    fields:
      - { name: roster_entry_id, type: string, source: system, description: "FK -> RosterEntry.id; from path" }
      - { name: evaluated_by_instructor_id, type: string, source: system, description: "FK -> Instructor.id; from X-User-ID; must equal session primary_instructor_id" }
      - { name: attempt_number, type: integer, source: system, description: "1 for the initial attempt, 2 for the remediation retest" }
      - { name: is_remediation_retest, type: boolean, source: system, default: false, description: "True on attempt 2; selects the remediation scoring variant" }
      - { name: items, type: array, source: input, description: "Checklist items: array of { item_code: string, critical: boolean, passed: boolean }; must contain at least 1 item and at least 1 critical item" }
      - { name: total_items, type: integer, source: computed, description: "= len(items)" }
      - { name: passed_items, type: integer, source: computed, description: "= count(items with passed == true)" }
      - { name: score_percent, type: number, source: computed, description: "= round_half_up(passed_items * 100 / total_items, 2)" }
      - { name: outcome, type: enum, source: computed, description: "PASS | REMEDIATION_REQUIRED | FAIL per skills_evaluation_scoring" }

  - name: CourseCompletionCard
    parent: RosterEntry
    common_fields: true
    fields:
      - { name: roster_entry_id, type: string, source: system, description: "FK -> RosterEntry.id; the passed enrollment this card was issued from" }
      - { name: training_center_id, type: string, source: system, description: "FK -> TrainingCenter.id; denormalized from the session for center card counts" }
      - { name: prior_card_id, type: string, source: system, default: null, description: "FK -> CourseCompletionCard.id; copied from the roster entry for renewal issues" }
      - { name: is_renewal, type: boolean, source: system, default: false, description: "True when prior_card_id is set; selects the renewal expiry variant" }
      - { name: card_code, type: string, source: system, description: "Unique public card code, format AHA-XXXXXX-XXXXXX" }
      - { name: verification_token, type: string, source: system, description: "Secret token required for employer verification" }
      - { name: holder_email, type: string, source: system, description: "Copied from RosterEntry.student_email" }
      - { name: course_type, type: enum, source: system, description: "Copied from the session" }
      - { name: guidelines_version_code, type: string, source: system, description: "Copied from the session's guidelines version code" }
      - { name: issued_at, type: datetime, source: system, description: "Clock timestamp at issuance (session completion)" }
      - { name: expires_at, type: datetime, source: computed, description: "Per card_expiry_calculation; end-of-month snapped" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | REVOKED" }

  - name: QualityAudit
    parent: TrainingCenter
    common_fields: true
    fields:
      - { name: target_training_center_id, type: string, source: input, description: "FK -> TrainingCenter.id; the audited center" }
      - { name: opened_by, type: string, source: system, description: "X-User-ID of the QAAuditor who opened the audit" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED_CLEAN | CLOSED_CORRECTIVE" }
      - { name: compliance_score, type: number, source: computed, default: 100, description: "Per audit_compliance_score; starts at 100, decremented per finding" }
      - { name: opened_at, type: datetime, source: system, description: "Clock timestamp at creation" }
      - { name: closed_at, type: datetime, source: system, description: "Clock timestamp at close; null while OPEN", default: null }

  - name: AuditFinding
    parent: QualityAudit
    common_fields: false
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> QualityAudit.id; from path" }
      - { name: severity, type: enum, source: input, description: "OBSERVATION | MINOR | MAJOR | CRITICAL" }
      - { name: is_repeat_offense, type: boolean, source: input, default: false, description: "True when the same finding class was raised on a prior audit of this center" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: deduction_points, type: number, source: computed, description: "= round_half_up(SEVERITY_POINTS[severity] * (1.5 if is_repeat_offense else 1.0), 2)" }

  - name: CardVerification
    parent: CourseCompletionCard
    common_fields: false
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> CourseCompletionCard.id; resolved from card_code" }
      - { name: verifier_reference, type: string, source: input, description: "Employer reference (name or id) performing the verification" }
      - { name: verified_at, type: datetime, source: system, description: "Clock timestamp of the verification" }
      - { name: result, type: enum, source: computed, description: "VALID when card ACTIVE and token matches; EXPIRED or REVOKED echoing card status otherwise" }
      - { name: card_expires_at, type: datetime, source: computed, description: "Copy of the card's expires_at, surfaced so employers can schedule renewal" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: TrainingCenter
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /aha/training-centers/{id}/activate"
        actor: NationalAdmin
        preconditions:
          - "Center has at least one TrainingSite with status ALIGNED (ERR_NO_ALIGNED_SITE)"
        side_effects:
          - "TrainingCenter.version incremented"
      - from: ACTIVE
        to: PROBATION
        trigger: "system (on POST /aha/quality-audits/{id}/close with outcome CORRECTIVE_ACTION)"
        actor: system
        preconditions:
          - "The closed audit's target_training_center_id == this center"
        side_effects:
          - "probation_started_at = current clock"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /aha/training-centers/{id}/reinstate"
        actor: NationalAdmin | QAAuditor
        preconditions:
          - "No QualityAudit targeting this center has status OPEN (ERR_AUDIT_STILL_OPEN)"
        side_effects:
          - "probation_started_at = null"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /aha/training-centers/{id}/suspend OR system (on CRITICAL AuditFinding created against this center)"
        actor: QAAuditor | system
        preconditions: []
        side_effects:
          - "Every TrainingSite of this center with status ALIGNED -> SUSPENDED"
          - "That site suspension itself cascades: every CourseSession at those sites with status SCHEDULED -> CANCELLED with cancel_reason CENTER_SUSPENDED"
          - "That session cancellation itself cascades: every RosterEntry of those sessions with status ENROLLED -> CANCELLED, and seats_available recomputes to capacity"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /aha/training-centers/{id}/suspend OR system (on CRITICAL AuditFinding created against this center)"
        actor: QAAuditor | system
        preconditions: []
        side_effects:
          - "Same site -> session -> roster cascade as ACTIVE -> SUSPENDED"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /aha/training-centers/{id}/reinstate"
        actor: NationalAdmin | QAAuditor
        preconditions:
          - "No QualityAudit targeting this center has status OPEN (ERR_AUDIT_STILL_OPEN)"
        side_effects:
          - "probation_started_at = current clock"
          - "Sites remain SUSPENDED; each must be reinstated individually"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /aha/training-centers/{id}/revoke"
        actor: NationalAdmin
        preconditions: []
        side_effects:
          - "Every TrainingSite of this center not DECOMMISSIONED -> DECOMMISSIONED"
          - "Every TCAlignment of this center with status ACTIVE -> ENDED"
          - "Every remaining SCHEDULED CourseSession of this center -> CANCELLED with cancel_reason CENTER_SUSPENDED, roster ENROLLED -> CANCELLED"

  - entity: TrainingSite
    initial_state: PENDING_ALIGNMENT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PENDING_ALIGNMENT
        to: ALIGNED
        trigger: "POST /aha/training-sites/{id}/align"
        actor: TCAdmin
        preconditions:
          - "expected_training_center_version equals the owning center's current version (OCC, ERR_STALE_VERSION)"
          - "Owning center status in {PROVISIONAL, ACTIVE, PROBATION} (ERR_CENTER_SUSPENDED)"
          - "Owning center has at least one TCAlignment with status ACTIVE, as_faculty == true, whose instructor status == CERTIFIED (ERR_NO_FACULTY_OVERSIGHT)"
        side_effects:
          - "TrainingCenter.version incremented by 1"
      - from: ALIGNED
        to: SUSPENDED
        trigger: "POST /aha/training-sites/{id}/suspend OR system (center suspension cascade)"
        actor: TCAdmin | QAAuditor | system
        preconditions: []
        side_effects:
          - "Every CourseSession at this site with status SCHEDULED -> CANCELLED with cancel_reason SITE_SUSPENDED (or CENTER_SUSPENDED when reached via the center cascade)"
          - "RosterEntry ENROLLED of those sessions -> CANCELLED; seats_available recomputes"
      - from: SUSPENDED
        to: ALIGNED
        trigger: "POST /aha/training-sites/{id}/reinstate"
        actor: TCAdmin
        preconditions:
          - "Owning center status not in {SUSPENDED, REVOKED} (ERR_CENTER_SUSPENDED)"
        side_effects: []
      - from: ALIGNED
        to: DECOMMISSIONED
        trigger: "POST /aha/training-sites/{id}/decommission OR system (center revoke cascade)"
        actor: TCAdmin | system
        preconditions:
          - "Manual decommission only: no CourseSession at this site with status in {SCHEDULED, IN_PROGRESS} (ERR_SITE_HAS_SCHEDULED_SESSIONS)"
        side_effects: []

  - entity: Instructor
    initial_state: CANDIDATE
    terminal_states: []
    transitions:
      - from: CANDIDATE
        to: MONITORED
        trigger: "POST /aha/instructors/{id}/monitor with outcome SATISFACTORY"
        actor: TrainingFaculty
        preconditions:
          - "Instructor status == CANDIDATE (ERR_INSTRUCTOR_NOT_CANDIDATE)"
          - "Calling faculty (X-User-ID) has is_faculty == true (ERR_INSUFFICIENT_PERMISSIONS)"
          - "Calling faculty id != candidate id (ERR_SELF_EVALUATION_FORBIDDEN)"
          - "Calling faculty discipline == candidate discipline (ERR_FACULTY_DISCIPLINE_MISMATCH)"
        side_effects:
          - "CourseMonitoring row appended"
          - "On outcome UNSATISFACTORY the row is appended but the candidate remains CANDIDATE"
      - from: MONITORED
        to: CERTIFIED
        trigger: "POST /aha/instructors/{id}/certify"
        actor: TCAdmin
        preconditions:
          - "Instructor status == MONITORED (ERR_INSTRUCTOR_NOT_MONITORED)"
          - "Count of TeachingEvaluation rows for this instructor >= 2 (ERR_INSUFFICIENT_TEACHING_EVALUATIONS)"
          - "certification_evaluation_average >= 4.00 (ERR_EVALUATION_AVERAGE_BELOW_THRESHOLD)"
        side_effects:
          - "certified_since = current clock"
          - "renewal_due_at = current clock + 24 months"
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /aha/instructors/{id}/renew"
        actor: TCAdmin
        preconditions:
          - "Instructor status == CERTIFIED (ERR_INSTRUCTOR_NOT_CERTIFIED)"
          - "Current clock is within [renewal_due_at - 90 days, renewal_due_at] inclusive on both ends (ERR_RENEWAL_WINDOW_CLOSED when outside)"
          - "renewal_eligibility_window count of COMPLETED sessions taught >= 2 (ERR_RENEWAL_SESSION_SHORTFALL)"
        side_effects:
          - "renewal_due_at = current clock + 24 months"
          - "renewal_count += 1"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system (on POST /aha/_clock/set_current_utc when new clock > renewal_due_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: CANDIDATE
        trigger: "POST /aha/instructors/{id}/reset-candidacy"
        actor: TCAdmin
        preconditions:
          - "Instructor status == EXPIRED (ERR_INSTRUCTOR_NOT_EXPIRED)"
        side_effects:
          - "is_faculty unchanged; TCAlignment rows unchanged; prior evaluations and monitorings persist"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /aha/instructors/{id}/suspend"
        actor: QAAuditor
        preconditions: []
        side_effects:
          - "Every CourseSession with primary_instructor_id == this instructor and status SCHEDULED -> CANCELLED with cancel_reason INSTRUCTOR_SUSPENDED"
          - "RosterEntry ENROLLED of those sessions -> CANCELLED; seats_available recomputes"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /aha/instructors/{id}/reinstate"
        actor: QAAuditor | TCAdmin
        preconditions:
          - "Instructor status == SUSPENDED (ERR_INSTRUCTOR_NOT_SUSPENDED)"
        side_effects: []

  - entity: TCAlignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /aha/alignments/{id}/end OR system (center revoke cascade)"
        actor: TCAdmin | system
        preconditions:
          - "Manual end: alignment status == ACTIVE (ERR_ALIGNMENT_NOT_ACTIVE)"
        side_effects: []

  - entity: GuidelinesVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /aha/guidelines-versions/{id}/activate"
        actor: NationalAdmin
        preconditions:
          - "Version status == DRAFT (ERR_GUIDELINES_VERSION_CONFLICT when already SUPERSEDED or ACTIVE)"
        side_effects:
          - "The previously ACTIVE GuidelinesVersion (if any) -> SUPERSEDED"
          - "That supersession itself cascades: every CourseSession whose guidelines_version_id == the superseded version AND status == SCHEDULED AND start_at > this version's transition_deadline_at -> CANCELLED with cancel_reason GUIDELINES_TRANSITION"
          - "That session cancellation itself cascades: RosterEntry ENROLLED of those sessions -> CANCELLED; seats_available recomputes to capacity"
          - "Sessions on the superseded version with start_at <= transition_deadline_at remain SCHEDULED; their curriculum_flag recomputes to LEGACY"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when another GuidelinesVersion is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CourseSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /aha/course-sessions/{id}/start"
        actor: TCCoordinator | Instructor
        preconditions:
          - "Session status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "When actor is Instructor, X-User-ID must equal primary_instructor_id (ERR_INSTRUCTOR_NOT_SESSION_LEAD)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /aha/course-sessions/{id}/complete"
        actor: Instructor
        preconditions:
          - "Session status == IN_PROGRESS (ERR_SESSION_NOT_IN_PROGRESS)"
          - "X-User-ID equals primary_instructor_id (ERR_INSTRUCTOR_NOT_SESSION_LEAD)"
          - "Owning TrainingCenter status == ACTIVE (ERR_CENTER_ON_PROBATION when PROBATION; ERR_CENTER_NOT_ACTIVE otherwise)"
          - "Every RosterEntry of the session has status in {PASSED, FAILED, CANCELLED} (ERR_SESSION_HAS_UNRESOLVED_ROSTER)"
        side_effects:
          - "For each RosterEntry with status PASSED: issue one CourseCompletionCard (status ACTIVE, issued_at = clock, expires_at per card_expiry_calculation, card_code and verification_token minted)"
          - "TrainingCenter.cards_issued_count += number of cards issued; TrainingCenter.active_card_count += number of cards issued"
          - "primary instructor sessions_taught_count += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aha/course-sessions/{id}/cancel OR system (guidelines/site/center/instructor cascades)"
        actor: TCCoordinator | system
        preconditions:
          - "Manual cancel: session status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects:
          - "cancel_reason = MANUAL for manual cancels; cascade reasons otherwise"
          - "RosterEntry ENROLLED -> CANCELLED; seats_available recomputes to capacity"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /aha/course-sessions/{id}/cancel"
        actor: TCCoordinator
        preconditions: []
        side_effects:
          - "cancel_reason = MANUAL; no cards are issued for any roster entry"
          - "RosterEntry ENROLLED -> CANCELLED; seats_available recomputes to capacity"

  - entity: RosterEntry
    initial_state: ENROLLED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: ENROLLED
        to: PASSED
        trigger: "system (on POST /aha/roster-entries/{id}/skills-evaluations whose outcome == PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "remediation_used set when the passing attempt is a remediation retest"
      - from: ENROLLED
        to: FAILED
        trigger: "system (on a remediation-retest SkillsEvaluation whose outcome == FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /aha/roster-entries/{id}/cancel OR system (session cancellation cascade)"
        actor: TCCoordinator | system
        preconditions:
          - "Manual cancel: entry status == ENROLLED (ERR_ROSTER_ENTRY_NOT_ENROLLED)"
        side_effects:
          - "CourseSession.seats_available recomputed (increments by 1 for manual cancel)"

  - entity: CourseCompletionCard
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /aha/cards/{id}/revoke"
        actor: QAAuditor | NationalAdmin
        preconditions:
          - "Card status == ACTIVE (ERR_CARD_NOT_ACTIVE)"
        side_effects:
          - "TrainingCenter.active_card_count -= 1 (cards_issued_count unchanged)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (on POST /aha/_clock/set_current_utc when new clock > expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "TrainingCenter.active_card_count -= 1 (cards_issued_count unchanged)"

  - entity: QualityAudit
    initial_state: OPEN
    terminal_states: [CLOSED_CLEAN, CLOSED_CORRECTIVE]
    transitions:
      - from: OPEN
        to: CLOSED_CLEAN
        trigger: "POST /aha/quality-audits/{id}/close with outcome CLEAN"
        actor: QAAuditor
        preconditions:
          - "Audit status == OPEN (ERR_AUDIT_NOT_OPEN)"
          - "No AuditFinding of this audit has severity == CRITICAL (ERR_AUDIT_HAS_OPEN_CRITICAL_FINDINGS)"
        side_effects:
          - "closed_at = current clock"
      - from: OPEN
        to: CLOSED_CORRECTIVE
        trigger: "POST /aha/quality-audits/{id}/close with outcome CORRECTIVE_ACTION"
        actor: QAAuditor
        preconditions:
          - "Audit status == OPEN (ERR_AUDIT_NOT_OPEN)"
        side_effects:
          - "closed_at = current clock"
          - "Target TrainingCenter with status ACTIVE -> PROBATION (probation_started_at = clock); a SUSPENDED center remains SUSPENDED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: site-align-stale-center
    parent_entity: TrainingCenter
    write_endpoint: "POST /aha/training-sites/{id}/align"
    occ_field: "expected_training_center_version"
    description: |
      Aligning a site against a TrainingCenter whose version has advanced since
      the client last observed it is rejected. Another writer may have just
      aligned a different site (which legitimately advances the center's
      governance version) or opened an audit; the current writer's view of the
      center is therefore stale and must be refreshed before aligning.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: audit-open-stale-center
    parent_entity: TrainingCenter
    write_endpoint: "POST /aha/quality-audits"
    occ_field: "expected_training_center_version"
    description: |
      Opening a QualityAudit against a TrainingCenter whose version has
      advanced since the client last observed it is rejected. The audit's
      baseline must reflect the center's current governance state (status,
      aligned sites); a stale version means that baseline has moved.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: equipment_sufficiency
    trigger: "POST /aha/course-sessions (at creation)"
    algorithm: constraint_propagation
    formula: |
      required_manikins = ceil(capacity / 3) if delivery_format == CLASSROOM
                          else ceil(capacity / 6)   # BLENDED_SKILLS_SESSION
      required_aed = ceil(capacity / 6)
      if course_type in {ACLS_PROVIDER, PALS_PROVIDER}:
          required_aed = max(required_aed, ceil(capacity / 4))
      required_instructors = 1 + max(0, ceil((capacity - 6) / 6))
      valid iff manikin_count >= required_manikins
            AND aed_trainer_count >= required_aed
            AND 1 + assisting_instructor_count >= required_instructors
      On failure: ERR_EQUIPMENT_RATIO_VIOLATION (422).
    input_set: "The session being created only; no historical data"
    constants:
      MANIKIN_RATIO_CLASSROOM: 3
      MANIKIN_RATIO_BLENDED: 6
      AED_RATIO_DEFAULT: 6
      AED_RATIO_ADVANCED: 4
      STUDENTS_PER_INSTRUCTOR: 6
    precision: "integer ceilings; no rounding"

  - name: skills_evaluation_scoring
    trigger: "POST /aha/roster-entries/{id}/skills-evaluations"
    algorithm: threshold
    formula: |
      total_items = len(items); passed_items = count(passed == true)
      critical_failed = any(item.critical == true and item.passed == false)
      score_percent = round_half_up(passed_items * 100 / total_items, 2)
      Variant selection: is_remediation_retest == false -> initial_attempt;
      true -> remediation_retest.
      RosterEntry transitions: PASS -> PASSED; REMEDIATION_REQUIRED -> stays
      ENROLLED with remediation_used = true; FAIL -> FAILED.
    input_set: "The items array of the single evaluation being recorded"
    constants:
      INITIAL_PASS_THRESHOLD: 84.00
      RETEST_PASS_THRESHOLD: 90.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: initial_attempt
        when: "attempt_number == 1"
        difference: "outcome = PASS iff (not critical_failed) AND score_percent >= 84.00; otherwise REMEDIATION_REQUIRED"
      - name: remediation_retest
        when: "attempt_number == 2 (a prior attempt returned REMEDIATION_REQUIRED)"
        difference: "outcome = PASS iff (not critical_failed) AND score_percent >= 90.00; otherwise FAIL (terminal)"

  - name: card_expiry_calculation
    trigger: "CourseSession completion, per issued CourseCompletionCard"
    algorithm: threshold
    formula: |
      end_of_month(ts) = last day of ts's month at 23:59:59Z.
      Variant selection: card.is_renewal == false -> initial_issue;
      true -> renewal_reissue.
    input_set: "The card being issued; for renewals also the prior card"
    constants:
      VALIDITY_MONTHS: 24
    precision: "whole seconds; end-of-month snap at 23:59:59Z"
    variants:
      - name: initial_issue
        when: "is_renewal == false"
        difference: "expires_at = end_of_month(issued_at + 24 months)"
      - name: renewal_reissue
        when: "is_renewal == true"
        difference: "if prior_card.expires_at > issued_at: expires_at = end_of_month(prior_card.expires_at + 24 months); else expires_at = end_of_month(issued_at + 24 months)"

  - name: certification_evaluation_average
    trigger: "POST /aha/instructors/{id}/certify"
    algorithm: aggregation
    formula: |
      evaluations = all TeachingEvaluation rows for the instructor
      if count(evaluations) < 2: reject ERR_INSUFFICIENT_TEACHING_EVALUATIONS
      average = round_half_up(sum(score) / count(evaluations), 2)
      certify iff average >= 4.00; otherwise ERR_EVALUATION_AVERAGE_BELOW_THRESHOLD
    input_set: "All TeachingEvaluation rows for the instructor (no time window; rows persist across candidacy resets)"
    constants:
      MIN_EVALUATIONS: 2
      MIN_AVERAGE: 4.00
    precision: "2 decimal places, round_half_up"

  - name: audit_compliance_score
    trigger: "POST /aha/quality-audits/{id}/findings (after each finding is appended)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (round-per-finding-then-sum):
      for each finding f:
          raw = SEVERITY_POINTS[f.severity] * (REPEAT_MULTIPLIER if f.is_repeat_offense else 1.0)
          f.deduction_points = round_half_up(raw, 2)
      total_deduction = sum(f.deduction_points over all findings of the audit)
      compliance_score = max(0, 100 - total_deduction)
      Rounding each finding before summing is mandatory; sum-then-round is
      the forbidden alternative and yields different cents (1.875*2 rounds to
      3.76 per-finding vs 3.75 sum-first).
    input_set: "All AuditFinding rows of the audit"
    constants:
      SEVERITY_POINTS: { OBSERVATION: 1.25, MINOR: 4.5, MAJOR: 12.5, CRITICAL: 40 }
      REPEAT_MULTIPLIER: 1.5
    precision: "2 decimal places, round_half_up per finding"

  - name: seats_available_reconciliation
    trigger: "CourseSession creation; RosterEntry add; RosterEntry cancel; session cascade cancellation"
    algorithm: aggregation
    formula: |
      seats_available = capacity - count(RosterEntry of this session with status == ENROLLED)
      INVARIANT (seat conservation): at every observable instant,
      seats_available + count(ENROLLED entries) == capacity.
    input_set: "RosterEntry rows of the session with status ENROLLED (PASSED/FAILED/CANCELLED excluded)"
    precision: "integer"

  - name: center_card_stock_reconciliation
    trigger: "Session completion (issue), card revoke, clock sweep (expire)"
    algorithm: aggregation
    formula: |
      cards_issued_count = count of CourseCompletionCard rows with training_center_id == center (monotonic; never decremented)
      active_card_count = count of those cards with status == ACTIVE
      INVARIANT (card stock partition): at every observable instant,
      cards_issued_count == active_card_count + count(EXPIRED) + count(REVOKED).
      Issue increments both; revoke/expire move one unit out of active without
      touching cards_issued_count.
    input_set: "All CourseCompletionCard rows of the center, any status"
    precision: "integer"

  - name: renewal_eligibility_window
    trigger: "POST /aha/instructors/{id}/renew"
    algorithm: threshold
    formula: |
      window_open iff (renewal_due_at - 90 days) <= current_clock <= renewal_due_at
                    (both boundaries inclusive; a 90-day early-renewal window
                    closing exactly at the due instant)
      sessions_in_window = count(CourseSession where primary_instructor_id == instructor
                            AND status == COMPLETED
                            AND start_at >= (current_clock - 24 months)   # inclusive
                            AND start_at <= current_clock)                # inclusive
      renew allowed iff window_open AND sessions_in_window >= 2
    input_set: "COMPLETED CourseSessions of the instructor inside the trailing 24-month window; SCHEDULED/IN_PROGRESS/CANCELLED excluded"
    constants:
      EARLY_RENEWAL_DAYS: 90
      MIN_SESSIONS: 2
      WINDOW_MONTHS: 24
    precision: "whole seconds; inclusive boundaries on both ends"

  - name: guidelines_transition_sweep
    trigger: "POST /aha/guidelines-versions/{id}/activate"
    algorithm: threshold
    formula: |
      For the superseded version V_old and newly activated version V_new:
        cancel_set = { CourseSession s : s.guidelines_version_id == V_old.id
                       AND s.status == SCHEDULED
                       AND s.start_at > V_new.transition_deadline_at }   # strict >; start_at == deadline survives
        Each session in cancel_set -> CANCELLED (cancel_reason GUIDELINES_TRANSITION),
        its ENROLLED roster entries -> CANCELLED.
      New session creation requires guidelines_version.status == ACTIVE
      (ERR_GUIDELINES_VERSION_NOT_ACTIVE otherwise).
    input_set: "SCHEDULED sessions on the superseded version only; IN_PROGRESS/COMPLETED sessions are untouched"
    precision: "whole seconds; strict-greater boundary on the deadline"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.7 (including faculty-identity and session-lead ownership checks)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right; body foreign keys validated in endpoint input declaration order"
    error_id: "ERR_*_NOT_FOUND (entity-specific)"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.2
    category: existence
    check: "Required request fields present; enum members valid; integer ranges sane; end_at strictly after start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 3.5
    category: concurrency
    check: "expected_training_center_version (when the endpoint declares it) equals the center's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /aha/training-sites/{id}/align, POST /aha/quality-audits"
  - priority: 4
    category: state
    check: "Target resource in the required state for the transition (session SCHEDULED/IN_PROGRESS, roster ENROLLED, instructor CANDIDATE/MONITORED/CERTIFIED, audit OPEN, card ACTIVE, version DRAFT, etc.)"
    error_id: "ERR_* state errors (e.g. ERR_SESSION_NOT_IN_PROGRESS, ERR_INSTRUCTOR_NOT_MONITORED, ERR_AUDIT_NOT_OPEN, ERR_CARD_NOT_ACTIVE, ERR_GUIDELINES_VERSION_CONFLICT)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Regulatory gates in declared order: center status permits the operation (ERR_CENTER_NOT_ACTIVE / ERR_CENTER_ON_PROBATION / ERR_CENTER_SUSPENDED); site ALIGNED and not suspended (ERR_SITE_SUSPENDED / ERR_SITE_NOT_ALIGNED); instructor CERTIFIED and unexpired (ERR_INSTRUCTOR_NOT_CERTIFIED); faculty oversight present for site alignment (ERR_NO_FACULTY_OVERSIGHT); segregation of duties (ERR_SELF_EVALUATION_FORBIDDEN); discipline match (ERR_FACULTY_DISCIPLINE_MISMATCH / ERR_INSTRUCTOR_DISCIPLINE_MISMATCH); faculty required for BLS_INSTRUCTOR courses (ERR_FACULTY_REQUIRED_FOR_INSTRUCTOR_COURSE); center has an ALIGNED site for activation (ERR_NO_ALIGNED_SITE); renewal window open (ERR_RENEWAL_WINDOW_CLOSED)"
    error_id: "safety errors as listed"
    http_status: 409
    applies_to: "session create/complete, site align/reinstate, center activate, instructor monitor/evaluations"
  - priority: 6
    category: business_constraint
    check: "Structural constraints in declared order: capacity <= site.capacity_students (ERR_CAPACITY_EXCEEDS_SITE); equipment_sufficiency (ERR_EQUIPMENT_RATIO_VIOLATION); at most one ACTIVE TCAlignment per (training_center_id, instructor_id) (ERR_DUPLICATE_ACTIVE_ALIGNMENT); session seats_available > 0 for roster add (deferred to priority 9 as quota); renewal session-count floor (ERR_RENEWAL_SESSION_SHORTFALL); minimum evaluations (ERR_INSUFFICIENT_TEACHING_EVALUATIONS) and average floor (ERR_EVALUATION_AVERAGE_BELOW_THRESHOLD)"
    error_id: "constraint errors as listed"
    http_status: 422
    applies_to: "session create, alignment create, certify, renew"
  - priority: 7
    category: business_temporal
    check: "Temporal rules in declared order: instructor double-booking half-open overlap (ERR_SESSION_OVERLAP_INSTRUCTOR); site booking with 60-minute turnover buffer (ERR_SESSION_OVERLAP_SITE); guidelines version must be ACTIVE at session creation (ERR_GUIDELINES_VERSION_NOT_ACTIVE)"
    error_id: "temporal errors as listed"
    http_status: 409
    applies_to: "session create, renew"
  - priority: 8
    category: business_referential
    check: "Cross-entity references: site belongs to the session's training_center_id (ERR_SITE_CENTER_MISMATCH); primary instructor holds an ACTIVE TCAlignment to the center (ERR_INSTRUCTOR_NOT_ALIGNED); roster prior_card_id holder_email matches the roster student_email (ERR_PRIOR_CARD_HOLDER_MISMATCH); skills evaluation attempt cap reached (ERR_REMEDIATION_LIMIT_EXCEEDED)"
    error_id: "referential errors as listed"
    http_status: 409
    applies_to: "session create, roster create, skills-evaluations create"
  - priority: 9
    category: business_fiscal
    check: "Quota last: seats_available > 0 for roster add (ERR_SESSION_FULL)"
    error_id: ERR_SESSION_FULL
    http_status: 422
    applies_to: "roster create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving) ---
  - method: POST
    path: "/aha/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time. Setting the clock performs the expiry sweep: CERTIFIED instructors whose renewal_due_at < new clock become EXPIRED; ACTIVE cards whose expires_at < new clock become EXPIRED (with center active_card_count decremented)."
    roles: [NationalAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["instructor expiry sweep", "card expiry sweep", "center active_card_count recompute"]

  # --- Training Centers ---
  - method: POST
    path: "/aha/training-centers"
    description: "Create a training center (status PROVISIONAL)"
    roles: [NationalAdmin]
    code: 201
    input: [legal_name, region, contact_email]
    output: TrainingCenter
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}"
    description: "Get a training center"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: []
    output: TrainingCenter
    side_effects: []
  - method: POST
    path: "/aha/training-centers/{id}/activate"
    description: "PROVISIONAL -> ACTIVE; requires at least one ALIGNED site"
    roles: [NationalAdmin]
    code: 200
    input: []
    output: TrainingCenter
    side_effects: ["increments TrainingCenter.version by 1"]
  - method: POST
    path: "/aha/training-centers/{id}/reinstate"
    description: "PROBATION -> ACTIVE, or SUSPENDED -> PROBATION; requires no OPEN audits"
    roles: [NationalAdmin, QAAuditor]
    code: 200
    input: []
    output: TrainingCenter
    side_effects: ["increments TrainingCenter.version by 1"]
  - method: POST
    path: "/aha/training-centers/{id}/suspend"
    description: "ACTIVE|PROBATION -> SUSPENDED with site/session/roster cascade"
    roles: [QAAuditor]
    code: 200
    input: []
    output: TrainingCenter
    side_effects: ["site suspension cascade", "session cancellation cascade", "roster cancellation cascade", "increments TrainingCenter.version by 1"]
  - method: POST
    path: "/aha/training-centers/{id}/revoke"
    description: "SUSPENDED -> REVOKED (terminal); decommissions sites, ends alignments"
    roles: [NationalAdmin]
    code: 200
    input: []
    output: TrainingCenter
    side_effects: ["site decommission cascade", "alignment end cascade", "session cancellation cascade", "increments TrainingCenter.version by 1"]

  # --- Training Sites ---
  - method: POST
    path: "/aha/training-centers/{id}/sites"
    description: "Create a site under a center (status PENDING_ALIGNMENT)"
    roles: [TCAdmin]
    code: 201
    input: [name, street_address, city, state_code, capacity_students]
    output: TrainingSite
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}/sites"
    description: "List sites of a center"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TrainingSite[]"
    side_effects: []
  - method: GET
    path: "/aha/training-sites/{id}"
    description: "Get a site"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: []
    output: TrainingSite
    side_effects: []
  - method: POST
    path: "/aha/training-sites/{id}/align"
    description: "PENDING_ALIGNMENT -> ALIGNED; requires faculty oversight; OCC on center version"
    roles: [TCAdmin]
    code: 200
    input: [expected_training_center_version]
    output: TrainingSite
    side_effects: ["increments TrainingCenter.version by 1"]
  - method: POST
    path: "/aha/training-sites/{id}/suspend"
    description: "ALIGNED -> SUSPENDED; cancels SCHEDULED sessions at the site"
    roles: [TCAdmin, QAAuditor]
    code: 200
    input: []
    output: TrainingSite
    side_effects: ["session cancellation cascade", "roster cancellation cascade"]
  - method: POST
    path: "/aha/training-sites/{id}/reinstate"
    description: "SUSPENDED -> ALIGNED; blocked while center SUSPENDED/REVOKED"
    roles: [TCAdmin]
    code: 200
    input: []
    output: TrainingSite
    side_effects: []
  - method: POST
    path: "/aha/training-sites/{id}/decommission"
    description: "ALIGNED -> DECOMMISSIONED; requires no SCHEDULED/IN_PROGRESS sessions"
    roles: [TCAdmin]
    code: 200
    input: []
    output: TrainingSite
    side_effects: []

  # --- Instructors ---
  - method: POST
    path: "/aha/instructors"
    description: "Register an instructor (CANDIDATE; CERTIFIED when legacy_certified true)"
    roles: [NationalAdmin]
    code: 201
    input: [full_name, email, discipline, home_training_center_id, "legacy_certified?"]
    output: Instructor
    side_effects: ["legacy_certified=true sets certified_since = clock and renewal_due_at = clock + 24 months"]
  - method: GET
    path: "/aha/instructors/{id}"
    description: "Get an instructor"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}/instructors"
    description: "List instructors whose home_training_center_id is this center"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Instructor[]"
    side_effects: []
  - method: POST
    path: "/aha/instructors/{id}/grant-faculty"
    description: "Grant faculty status; instructor must be CERTIFIED"
    roles: [NationalAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: ["is_faculty = true"]
  - method: POST
    path: "/aha/instructors/{id}/monitor"
    description: "Record a course monitoring for a candidate; SATISFACTORY moves CANDIDATE -> MONITORED"
    roles: [TrainingFaculty]
    code: 201
    input: [monitored_at, course_type_observed, outcome]
    output: CourseMonitoring
    side_effects: ["candidate CANDIDATE -> MONITORED when outcome == SATISFACTORY"]
  - method: GET
    path: "/aha/instructors/{id}/monitorings"
    description: "List course monitorings for an instructor"
    roles: [NationalAdmin, TCAdmin, QAAuditor, TrainingFaculty, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CourseMonitoring[]"
    side_effects: []
  - method: POST
    path: "/aha/instructors/{id}/teaching-evaluations"
    description: "Record a teaching evaluation (score 1..5) for a candidate"
    roles: [TrainingFaculty]
    code: 201
    input: [score, notes]
    output: TeachingEvaluation
    side_effects: []
  - method: GET
    path: "/aha/instructors/{id}/teaching-evaluations"
    description: "List teaching evaluations for an instructor"
    roles: [NationalAdmin, TCAdmin, QAAuditor, TrainingFaculty, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "TeachingEvaluation[]"
    side_effects: []
  - method: POST
    path: "/aha/instructors/{id}/certify"
    description: "MONITORED -> CERTIFIED; requires >= 2 evaluations with average >= 4.00"
    roles: [TCAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: ["certified_since = clock", "renewal_due_at = clock + 24 months", "certification_evaluation_average"]
  - method: POST
    path: "/aha/instructors/{id}/renew"
    description: "CERTIFIED -> CERTIFIED with renewal_due_at extended; requires renewal window open and >= 2 completed sessions in trailing 24 months"
    roles: [TCAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: ["renewal_due_at = clock + 24 months", "renewal_count += 1"]
  - method: POST
    path: "/aha/instructors/{id}/suspend"
    description: "CERTIFIED -> SUSPENDED; cancels their SCHEDULED sessions"
    roles: [QAAuditor]
    code: 200
    input: []
    output: Instructor
    side_effects: ["session cancellation cascade", "roster cancellation cascade"]
  - method: POST
    path: "/aha/instructors/{id}/reinstate"
    description: "SUSPENDED -> CERTIFIED"
    roles: [QAAuditor, TCAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: POST
    path: "/aha/instructors/{id}/reset-candidacy"
    description: "EXPIRED -> CANDIDATE (re-entry into the candidate pathway)"
    roles: [TCAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # --- Alignments ---
  - method: POST
    path: "/aha/training-centers/{id}/alignments"
    description: "Align a CERTIFIED instructor to the center (optionally as faculty)"
    roles: [TCAdmin]
    code: 201
    input: [instructor_id, "as_faculty?"]
    output: TCAlignment
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}/alignments"
    description: "List alignments of a center"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TCAlignment[]"
    side_effects: []
  - method: GET
    path: "/aha/instructors/{id}/alignments"
    description: "List alignments of an instructor"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TCAlignment[]"
    side_effects: []
  - method: POST
    path: "/aha/alignments/{id}/end"
    description: "ACTIVE -> ENDED"
    roles: [TCAdmin]
    code: 200
    input: []
    output: TCAlignment
    side_effects: []

  # --- Guidelines Versions ---
  - method: POST
    path: "/aha/guidelines-versions"
    description: "Create a guidelines version (status DRAFT); code unique"
    roles: [NationalAdmin]
    code: 201
    input: [code, title, published_at, transition_deadline_at]
    output: GuidelinesVersion
    side_effects: []
  - method: GET
    path: "/aha/guidelines-versions"
    description: "List guidelines versions"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GuidelinesVersion[]"
    side_effects: []
  - method: GET
    path: "/aha/guidelines-versions/{id}"
    description: "Get a guidelines version"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: []
    output: GuidelinesVersion
    side_effects: []
  - method: POST
    path: "/aha/guidelines-versions/{id}/activate"
    description: "DRAFT -> ACTIVE; supersedes the current ACTIVE version and runs the guidelines transition sweep"
    roles: [NationalAdmin]
    code: 200
    input: []
    output: GuidelinesVersion
    side_effects: ["prior ACTIVE version -> SUPERSEDED", "guidelines_transition_sweep", "session cancellation cascade", "roster cancellation cascade"]
  - method: GET
    path: "/aha/guidelines-versions/{id}/course-sessions"
    description: "List sessions teaching this guidelines version"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseSession[]"
    side_effects: []

  # --- Course Sessions ---
  - method: POST
    path: "/aha/course-sessions"
    description: "Schedule a course session; enforces center/site/instructor gates, equipment ratios, capacity, overlap rules"
    roles: [TCCoordinator]
    code: 201
    input: [training_center_id, site_id, primary_instructor_id, guidelines_version_id, course_type, delivery_format, start_at, end_at, capacity, manikin_count, aed_trainer_count, "assisting_instructor_count?"]
    output: CourseSession
    side_effects: ["equipment_sufficiency check", "seats_available initialized to capacity", "curriculum_flag initialized"]
  - method: GET
    path: "/aha/course-sessions/{id}"
    description: "Get a session"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: []
    output: CourseSession
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}/course-sessions"
    description: "List sessions of a center"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseSession[]"
    side_effects: []
  - method: GET
    path: "/aha/training-sites/{id}/course-sessions"
    description: "List sessions at a site"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseSession[]"
    side_effects: []
  - method: GET
    path: "/aha/instructors/{id}/course-sessions"
    description: "List sessions whose primary_instructor_id is this instructor"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseSession[]"
    side_effects: []
  - method: POST
    path: "/aha/course-sessions/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS"
    roles: [TCCoordinator, Instructor]
    code: 200
    input: []
    output: CourseSession
    side_effects: []
  - method: POST
    path: "/aha/course-sessions/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; issues one CourseCompletionCard per PASSED roster entry"
    roles: [Instructor]
    code: 200
    input: []
    output: CourseSession
    side_effects: ["card issuance per PASSED roster entry", "center card counts update", "sessions_taught_count += 1"]
  - method: POST
    path: "/aha/course-sessions/{id}/cancel"
    description: "SCHEDULED|IN_PROGRESS -> CANCELLED (cancel_reason MANUAL); no cards issued"
    roles: [TCCoordinator]
    code: 200
    input: []
    output: CourseSession
    side_effects: ["roster cancellation cascade", "seats_available recompute"]

  # --- Roster ---
  - method: POST
    path: "/aha/course-sessions/{id}/roster"
    description: "Enroll a student into a SCHEDULED session"
    roles: [TCCoordinator]
    code: 201
    input: [student_name, student_email, "prior_card_id?"]
    output: RosterEntry
    side_effects: ["seats_available -= 1", "prior card holder match check when prior_card_id supplied"]
  - method: GET
    path: "/aha/course-sessions/{id}/roster"
    description: "List roster entries of a session"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RosterEntry[]"
    side_effects: []
  - method: GET
    path: "/aha/roster-entries/{id}"
    description: "Get a roster entry"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: []
    output: RosterEntry
    side_effects: []
  - method: POST
    path: "/aha/roster-entries/{id}/cancel"
    description: "ENROLLED -> CANCELLED; releases the seat"
    roles: [TCCoordinator]
    code: 200
    input: []
    output: RosterEntry
    side_effects: ["seats_available += 1"]

  # --- Skills Evaluations ---
  - method: POST
    path: "/aha/roster-entries/{id}/skills-evaluations"
    description: "Record a checklist skills evaluation; caller must be the session's primary instructor; at most 2 attempts (second only after REMEDIATION_REQUIRED)"
    roles: [Instructor]
    code: 201
    input: [items]
    output: SkillsEvaluation
    side_effects: ["skills_evaluation_scoring", "roster entry status transition per outcome", "remediation_used flag"]
  - method: GET
    path: "/aha/roster-entries/{id}/skills-evaluations"
    description: "List skills evaluations of a roster entry"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: ["limit?", "offset?"]
    output: "SkillsEvaluation[]"
    side_effects: []
  - method: GET
    path: "/aha/instructors/{id}/skills-evaluations"
    description: "List skills evaluations performed by an instructor"
    roles: [NationalAdmin, TCAdmin, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: ["limit?", "offset?"]
    output: "SkillsEvaluation[]"
    side_effects: []

  # --- Cards ---
  - method: GET
    path: "/aha/cards/{id}"
    description: "Get a completion card"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty, Employer]
    code: 200
    input: []
    output: CourseCompletionCard
    side_effects: []
  - method: GET
    path: "/aha/roster-entries/{id}/cards"
    description: "List cards issued from a roster entry (0 or 1)"
    roles: [NationalAdmin, TCAdmin, TCCoordinator, QAAuditor, Instructor, TrainingFaculty]
    code: 200
    input: []
    output: "CourseCompletionCard[]"
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}/cards"
    description: "List cards issued by a center"
    roles: [NationalAdmin, TCAdmin, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseCompletionCard[]"
    side_effects: []
  - method: GET
    path: "/aha/cards/{id}/renewals"
    description: "List renewal cards whose prior_card_id is this card (0 or 1)"
    roles: [NationalAdmin, TCAdmin, QAAuditor]
    code: 200
    input: []
    output: "CourseCompletionCard[]"
    side_effects: []
  - method: POST
    path: "/aha/cards/{id}/revoke"
    description: "ACTIVE -> REVOKED"
    roles: [QAAuditor, NationalAdmin]
    code: 200
    input: []
    output: CourseCompletionCard
    side_effects: ["center active_card_count -= 1"]
  - method: GET
    path: "/aha/cards/{id}/roster-entries"
    description: "List roster entries referencing this card as prior_card_id (renewal enrollments; 0 or more)"
    roles: [NationalAdmin, TCAdmin, QAAuditor]
    code: 200
    input: []
    output: "RosterEntry[]"
    side_effects: []
  - method: GET
    path: "/aha/cards/{id}/verifications"
    description: "List verification events for a card"
    roles: [NationalAdmin, TCAdmin, QAAuditor, Employer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CardVerification[]"
    side_effects: []

  # --- Employer Verification ---
  - method: POST
    path: "/aha/card-verifications"
    description: "Employer verification of provider status by card_code + verification_token; records a CardVerification event with result VALID | EXPIRED | REVOKED and surfaces card_expires_at for renewal scheduling"
    roles: [Employer, NationalAdmin, QAAuditor]
    code: 201
    input: [card_code, verification_token, verifier_reference]
    output: CardVerification
    side_effects: ["CardVerification event appended"]

  # --- Quality Audits ---
  - method: POST
    path: "/aha/quality-audits"
    description: "Open a quality audit against a training center; OCC on center version; bumps center version and stamps last_audit_opened_at"
    roles: [QAAuditor]
    code: 201
    input: [target_training_center_id, expected_training_center_version]
    output: QualityAudit
    side_effects: ["increments TrainingCenter.version by 1", "last_audit_opened_at = clock", "compliance_score initialized to 100"]
  - method: GET
    path: "/aha/quality-audits/{id}"
    description: "Get an audit"
    roles: [NationalAdmin, TCAdmin, QAAuditor]
    code: 200
    input: []
    output: QualityAudit
    side_effects: []
  - method: GET
    path: "/aha/training-centers/{id}/quality-audits"
    description: "List audits of a center"
    roles: [NationalAdmin, TCAdmin, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "QualityAudit[]"
    side_effects: []
  - method: POST
    path: "/aha/quality-audits/{id}/findings"
    description: "Append a finding to an OPEN audit; recomputes compliance_score; a CRITICAL finding immediately suspends the center with the full cascade"
    roles: [QAAuditor]
    code: 201
    input: [severity, description, "is_repeat_offense?"]
    output: AuditFinding
    side_effects: ["audit_compliance_score recompute", "on severity CRITICAL: center -> SUSPENDED with site/session/roster cascade"]
  - method: GET
    path: "/aha/quality-audits/{id}/findings"
    description: "List findings of an audit"
    roles: [NationalAdmin, TCAdmin, QAAuditor]
    code: 200
    input: ["severity?", "limit?", "offset?"]
    output: "AuditFinding[]"
    side_effects: []
  - method: POST
    path: "/aha/quality-audits/{id}/close"
    description: "OPEN -> CLOSED_CLEAN (requires no CRITICAL findings) or CLOSED_CORRECTIVE (center ACTIVE -> PROBATION)"
    roles: [QAAuditor]
    code: 200
    input: [outcome]
    output: QualityAudit
    side_effects: ["closed_at = clock", "on CORRECTIVE_ACTION: center ACTIVE -> PROBATION"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint; or faculty-identity check failed (not is_faculty / not CERTIFIED); or session-lead ownership check failed" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic fallback for an unmatched resource" }
  - { id: ERR_TRAINING_CENTER_NOT_FOUND, http: 404, condition: "Training center id not found" }
  - { id: ERR_TRAINING_SITE_NOT_FOUND, http: 404, condition: "Training site id not found" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "Instructor id not found" }
  - { id: ERR_ALIGNMENT_NOT_FOUND, http: 404, condition: "TCAlignment id not found" }
  - { id: ERR_GUIDELINES_VERSION_NOT_FOUND, http: 404, condition: "Guidelines version id not found" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "Course session id not found" }
  - { id: ERR_ROSTER_ENTRY_NOT_FOUND, http: 404, condition: "Roster entry id not found" }
  - { id: ERR_CARD_NOT_FOUND, http: 404, condition: "Card id or card_code not found" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "Quality audit id not found" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-integer where integer required, end_at not strictly after start_at, empty items array, or no critical item in a skills checklist" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_training_center_version does not match the center's current version" }
  # --- state ---
  - { id: ERR_CENTER_NOT_ACTIVE, http: 409, condition: "Center must be ACTIVE for this operation (session create/complete when not PROBATION-specific, alignment context)" }
  - { id: ERR_CENTER_ON_PROBATION, http: 409, condition: "Center is PROBATION; card issuance at session completion is blocked" }
  - { id: ERR_CENTER_SUSPENDED, http: 409, condition: "Center is SUSPENDED or REVOKED; site align/reinstate and dependent operations blocked" }
  - { id: ERR_CENTER_REVOKED, http: 409, condition: "Center is REVOKED (terminal); no further transitions" }
  - { id: ERR_SITE_NOT_ALIGNED, http: 409, condition: "Site must be ALIGNED (is PENDING_ALIGNMENT or DECOMMISSIONED)" }
  - { id: ERR_SITE_SUSPENDED, http: 409, condition: "Site is SUSPENDED" }
  - { id: ERR_SITE_HAS_SCHEDULED_SESSIONS, http: 409, condition: "Site has sessions in SCHEDULED or IN_PROGRESS and cannot be decommissioned" }
  - { id: ERR_NO_ALIGNED_SITE, http: 409, condition: "Center has no ALIGNED site at activation" }
  - { id: ERR_NO_FACULTY_OVERSIGHT, http: 409, condition: "Center has no ACTIVE as_faculty alignment whose instructor is CERTIFIED" }
  - { id: ERR_INSTRUCTOR_NOT_CANDIDATE, http: 409, condition: "Instructor must be CANDIDATE for monitoring" }
  - { id: ERR_INSTRUCTOR_NOT_MONITORED, http: 409, condition: "Instructor must be MONITORED for certification" }
  - { id: ERR_INSTRUCTOR_NOT_CERTIFIED, http: 409, condition: "Instructor must be CERTIFIED (alignment, session lead, renewal, faculty grant)" }
  - { id: ERR_INSTRUCTOR_NOT_SUSPENDED, http: 409, condition: "Instructor must be SUSPENDED to reinstate" }
  - { id: ERR_INSTRUCTOR_NOT_EXPIRED, http: 409, condition: "Instructor must be EXPIRED to reset candidacy" }
  - { id: ERR_ALIGNMENT_NOT_ACTIVE, http: 409, condition: "Alignment must be ACTIVE to end" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "Session must be SCHEDULED (start, roster add, manual cancel from SCHEDULED)" }
  - { id: ERR_SESSION_NOT_IN_PROGRESS, http: 409, condition: "Session must be IN_PROGRESS (complete, skills evaluation)" }
  - { id: ERR_SESSION_HAS_UNRESOLVED_ROSTER, http: 409, condition: "Session still has ENROLLED roster entries at completion" }
  - { id: ERR_ROSTER_ENTRY_NOT_ENROLLED, http: 409, condition: "Roster entry must be ENROLLED (cancel, skills evaluation)" }
  - { id: ERR_AUDIT_NOT_OPEN, http: 409, condition: "Audit must be OPEN (findings, close)" }
  - { id: ERR_AUDIT_HAS_OPEN_CRITICAL_FINDINGS, http: 409, condition: "Audit has CRITICAL findings and cannot close CLEAN" }
  - { id: ERR_AUDIT_STILL_OPEN, http: 409, condition: "An OPEN audit targets this center; reinstate blocked" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Card must be ACTIVE (revoke)" }
  - { id: ERR_GUIDELINES_VERSION_CONFLICT, http: 409, condition: "Guidelines version must be DRAFT to activate (already ACTIVE or SUPERSEDED)" }
  - { id: ERR_INSTRUCTOR_NOT_SESSION_LEAD, http: 403, condition: "X-User-ID does not equal the session's primary_instructor_id" }
  # --- business safety ---
  - { id: ERR_SELF_EVALUATION_FORBIDDEN, http: 403, condition: "Faculty may not monitor or evaluate themselves (segregation of duties)" }
  - { id: ERR_FACULTY_DISCIPLINE_MISMATCH, http: 409, condition: "Monitoring/evaluating faculty discipline differs from candidate discipline" }
  - { id: ERR_INSTRUCTOR_DISCIPLINE_MISMATCH, http: 409, condition: "Primary instructor discipline does not match the discipline required by course_type" }
  - { id: ERR_FACULTY_REQUIRED_FOR_INSTRUCTOR_COURSE, http: 403, condition: "BLS_INSTRUCTOR course sessions require an is_faculty primary instructor" }
  # --- business constraint ---
  - { id: ERR_CAPACITY_EXCEEDS_SITE, http: 422, condition: "Session capacity exceeds site capacity_students" }
  - { id: ERR_EQUIPMENT_RATIO_VIOLATION, http: 422, condition: "manikin/AED/instructor ratios from equipment_sufficiency not met" }
  - { id: ERR_DUPLICATE_ACTIVE_ALIGNMENT, http: 409, condition: "An ACTIVE alignment already exists for this (training_center_id, instructor_id)" }
  - { id: ERR_INSUFFICIENT_TEACHING_EVALUATIONS, http: 409, condition: "Fewer than 2 teaching evaluations recorded at certification" }
  - { id: ERR_EVALUATION_AVERAGE_BELOW_THRESHOLD, http: 409, condition: "Certification evaluation average < 4.00" }
  - { id: ERR_RENEWAL_SESSION_SHORTFALL, http: 409, condition: "Fewer than 2 COMPLETED sessions taught in the trailing 24 months at renewal" }
  # --- business temporal ---
  - { id: ERR_SESSION_OVERLAP_INSTRUCTOR, http: 409, condition: "Primary instructor already leads a SCHEDULED/IN_PROGRESS session whose [start_at, end_at) overlaps (half-open; back-to-back allowed)" }
  - { id: ERR_SESSION_OVERLAP_SITE, http: 409, condition: "Site already hosts a SCHEDULED/IN_PROGRESS session within the 60-minute turnover buffer (gap < 60 minutes rejected; exactly 60 minutes allowed)" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Current clock is outside the renewal window [renewal_due_at - 90 days, renewal_due_at]" }
  - { id: ERR_GUIDELINES_VERSION_NOT_ACTIVE, http: 409, condition: "Session creation requires the guidelines version to be ACTIVE" }
  # --- business referential ---
  - { id: ERR_SITE_CENTER_MISMATCH, http: 409, condition: "site_id does not belong to training_center_id" }
  - { id: ERR_INSTRUCTOR_NOT_ALIGNED, http: 409, condition: "Primary instructor holds no ACTIVE TCAlignment to the center" }
  - { id: ERR_PRIOR_CARD_HOLDER_MISMATCH, http: 409, condition: "prior_card_id holder_email differs from the roster entry's student_email" }
  # --- quota ---
  - { id: ERR_SESSION_FULL, http: 422, condition: "seats_available == 0 at roster add" }
  - { id: ERR_REMEDIATION_LIMIT_EXCEEDED, http: 409, condition: "A skills evaluation attempt beyond the second, or a second attempt without a prior REMEDIATION_REQUIRED" }
  # --- verification ---
  - { id: ERR_CARD_VERIFICATION_MISMATCH, http: 409, condition: "verification_token does not match the card identified by card_code" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NationalAdmin
    description: "AHA national office administrator; authorizes centers, registers instructors, manages guidelines versions, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /aha/training-centers"
      - "POST /aha/training-centers/{id}/activate"
      - "POST /aha/training-centers/{id}/revoke"
      - "POST /aha/instructors"
      - "POST /aha/instructors/{id}/grant-faculty"
      - "POST /aha/guidelines-versions"
      - "POST /aha/guidelines-versions/{id}/activate"
      - "POST /aha/_clock/set_current_utc"
    shared_operations:
      - "POST /aha/training-centers/{id}/reinstate (with QAAuditor)"
      - "POST /aha/cards/{id}/revoke (with QAAuditor)"
      - "POST /aha/card-verifications (with Employer, QAAuditor)"
      - "All GET endpoints"

  - name: TCAdmin
    description: "Training center administrator; manages sites, alignments, and the instructor pathway decisions (certify, renew, reset)"
    identity: opaque
    exclusive_operations:
      - "POST /aha/training-centers/{id}/sites"
      - "POST /aha/training-sites/{id}/align"
      - "POST /aha/training-sites/{id}/reinstate"
      - "POST /aha/training-sites/{id}/decommission"
      - "POST /aha/training-centers/{id}/alignments"
      - "POST /aha/alignments/{id}/end"
      - "POST /aha/instructors/{id}/certify"
      - "POST /aha/instructors/{id}/renew"
      - "POST /aha/instructors/{id}/reset-candidacy"
    shared_operations:
      - "POST /aha/training-sites/{id}/suspend (with QAAuditor)"
      - "POST /aha/instructors/{id}/reinstate (with QAAuditor)"
      - "Most GET endpoints"

  - name: TCCoordinator
    description: "Training center coordinator; schedules sessions and manages rosters"
    identity: opaque
    exclusive_operations:
      - "POST /aha/course-sessions"
      - "POST /aha/course-sessions/{id}/cancel"
      - "POST /aha/course-sessions/{id}/roster"
      - "POST /aha/roster-entries/{id}/cancel"
    shared_operations:
      - "POST /aha/course-sessions/{id}/start (with Instructor)"
      - "Most GET endpoints"

  - name: Instructor
    description: "Certified instructor acting as session lead; X-User-ID is the Instructor.id and must equal the session's primary_instructor_id for lead operations"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /aha/course-sessions/{id}/complete"
      - "POST /aha/roster-entries/{id}/skills-evaluations"
    shared_operations:
      - "POST /aha/course-sessions/{id}/start (with TCCoordinator)"
      - "GET endpoints for own record, sessions, roster, evaluations, cards"

  - name: TrainingFaculty
    description: "Faculty member evaluating candidates; X-User-ID is an Instructor.id with is_faculty == true and status CERTIFIED; may never evaluate self"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /aha/instructors/{id}/monitor"
      - "POST /aha/instructors/{id}/teaching-evaluations"
    shared_operations:
      - "GET endpoints for instructors, monitorings, evaluations, sessions"

  - name: QAAuditor
    description: "Quality assurance auditor; runs audits, records findings, suspends centers/sites/instructors, revokes cards"
    identity: opaque
    exclusive_operations:
      - "POST /aha/quality-audits"
      - "POST /aha/quality-audits/{id}/findings"
      - "POST /aha/quality-audits/{id}/close"
      - "POST /aha/training-centers/{id}/suspend"
      - "POST /aha/instructors/{id}/suspend"
    shared_operations:
      - "POST /aha/training-centers/{id}/reinstate (with NationalAdmin)"
      - "POST /aha/training-sites/{id}/suspend (with TCAdmin)"
      - "POST /aha/instructors/{id}/reinstate (with TCAdmin)"
      - "POST /aha/cards/{id}/revoke (with NationalAdmin)"
      - "POST /aha/card-verifications (with Employer, NationalAdmin)"
      - "Most GET endpoints"

  - name: Employer
    description: "External employer verifying provider card status and reading expiry for renewal scheduling"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /aha/card-verifications (with NationalAdmin, QAAuditor)"
      - "GET /aha/cards/{id}"
      - "GET /aha/cards/{id}/verifications"
