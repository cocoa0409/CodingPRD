              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/hearing-sessions"
              payload: { case_id: "${case_id}", room_id: "${room_a_id}", chair_id: "${chair_id}", panelist_ids: ["${pan1_id}", "${pan2_id}", "${pan3_id}"], start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T11:30:00Z" }
              as: IntegrityOfficer
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/hearing-sessions/${session_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
          trigger:
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "ABSTAIN" }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { vote_1_id: $.data.id }
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { err_quorum: $.data.error_id }
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan2_id}", verdict: "ABSTAIN" }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { vote_2_id: $.data.id }
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: PanelChair
              as_user_id: "${chair_id}"
