  - rule_id: cross_entity_state_dependency
    instances:
      - name: payable_release_gated_by_client_invoice_state
        grounds:
          - validations[priority=65]
          - state_machines.ConsultantInvoice.WITHHELD_to_RELEASED
          - entities.ConsultantSubcontract.fields.pay_when_paid
          - state_machines.Invoice.APPROVED_to_PAID
        distinguishing_aspect: |
          Whether a ConsultantInvoice may be released depends on the status of a THIRD entity —
          the client Invoice that swept it — and only when its own subcontract's pay_when_paid
          flag is set. Two payables on the same project, identical in every respect except that
          flag, therefore diverge: one releases immediately, the other is refused while its
          client invoice is DRAFT, refused again while that invoice is APPROVED, and released
          only as a side effect of the client's payment.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client with retainage_pct 0.0500; TIME_AND_MATERIALS project activated, wip_alert_threshold left at 50000.00"
            - "phase with consultant_budget 100000.00"
            - "sc_pwp: committed 20000.00, pay_when_paid true, EXECUTED; sc_free: committed 30000.00, pay_when_paid false, EXECUTED"
            - "payable ci_pwp 20000.00 approved -> markup 0.1000, billable 22000.00; payable ci_free 30000.00 approved -> markup 0.1000, billable 33000.00 (cumulative 50000.00 stays in tier 1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Lakeshore Pavilion", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts"
