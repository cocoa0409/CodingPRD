    output: TenderWave
    side_effects: []
  - method: GET
    path: /shore-excursions/tender-waves
    description: "List tender waves, filterable by port call and priority class."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, PortAgent, RiskOfficer, FinanceController, OperatorVettingOfficer]
    success_code: 200
    input:
