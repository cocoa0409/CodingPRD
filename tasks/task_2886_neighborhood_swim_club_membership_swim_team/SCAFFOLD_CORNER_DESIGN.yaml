        excluded_because:
          difficulty_instance: compensating_invariant / capital_reserve_identity_under_fund_then_cancel
          rationale: "The named §1.8 instance already asserts that cancelling returns funded_cents to the reserve while the append-only contributions counter stays put."

  # ===========================================================================
  # Calculations (guide Table 3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: correct_result_joining_on_the_open_date_bills_the_unprorated_dues
        claim_type: correct_result
        grounds:
          - calculations.seasonal_dues_assessment
          - entities.Membership.fields.assessed_dues_cents
          - endpoints[POST /swim-club/memberships]
        distinguishing_aspect: |
          The formula has three arms and the first two are easy to collapse into the third. A join on
          the open_date takes the `effective_on <= season.open_date` arm and must yield the category
          figure EXACTLY, not the ratio arm's rounded 30000 * 108 / 108. One day later the ratio arm
          fires and the answer differs, which is what makes the boundary observable: the two
          memberships differ in nothing but a single day of join_date.
        test_recipe:
          setup:
            - "One COUPLE category with seasonal_dues_cents 30000, bond 0 and initiation 0, so lines 2 and 3 of the invoice are silent and the invoice total is a clean function of line 1."
            - "One OPEN 2027 season, 2027-05-22 .. 2027-09-06, i.e. total_days 108, dues_due_date 2027-04-15 (already past, so the late-penalty line is live)."
            - "Two households, A joining exactly on the open_date and B joining one day later."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-23T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id, cat_dues: $.data.seasonal_dues_cents }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY" }
              as: BoardPresident
              captures: { s27_id: $.data.id, s27_basis: $.data.proration_basis }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
