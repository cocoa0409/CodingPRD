            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Cascade Cellular", carrier_credit_tier: "CROSSOVER", tenancy_type: "ANCHOR", monthly_rent_share_cents: 210000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t_anchor: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Bluewave Mobile", carrier_credit_tier: "SPECULATIVE", tenancy_type: "COLOCATION", monthly_rent_share_cents: 80000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t_colo: $.data.id } }
