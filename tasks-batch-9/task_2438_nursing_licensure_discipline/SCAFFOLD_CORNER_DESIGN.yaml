      - name: license_version_increments_once_per_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.renewal-create-stale-license
          - endpoints.POST /licenses/{id}/privilege-determination
          - endpoints.GET /licenses/{id}
        distinguishing_aspect: "The OCC token must be a write counter: issuance leaves version 1, each of two successive writes adds exactly 1, and the three interleaved reads add nothing — so a client that holds version 3 after two writes can still perform an OCC-guarded create."
