          assert:
            - "Trigger call 1: HTTP 409 with ${e27a} == ERR_METER_NOT_FAULTED - a REMOVED device is never repairable even though its health_status is HEALTHY"
            - "Trigger call 2: HTTP 409 with ${e27b} == ERR_METER_NOT_INSTALLED (priority 29) and no TuningInterval row is created"
            - "Trigger call 3: HTTP 409 with ${e27c} == ERR_METER_NOT_INSTALLED - priority 29 also guards the removals endpoint itself"
            - "Trigger call 4: HTTP 409 with ${e27d} == ERR_METER_NOT_SHIPPED - REMOVED cannot be walked back to INSTALLED"
            - "GET /meters/${mt27_id} still reports install_status REMOVED, health_status HEALTHY and fault_count 0"

