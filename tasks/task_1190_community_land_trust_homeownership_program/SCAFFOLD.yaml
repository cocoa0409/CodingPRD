    side_effects: ["status → ACTIVE; Unit.occupancy_status → OCCUPIED; Unit.current_lease_id set; Household.active_lease_id set; monthly_fee_cents computed; subsidy_locked_cents set; first LeaseFee created; increments Unit.version by 1"]

  - method: POST
