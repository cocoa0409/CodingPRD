# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3371_nonprofit_data_transparency_profiles_filing_data_extraction
#
# Breadth probe over the nine claim-extraction-guide sections. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:`
# stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: organization_create_returns_every_declared_field_and_starts_draft
        claim_type: Creation
        grounds:
          - entities.Organization
          - endpoints.POST_/nonprofits/organizations
        distinguishing_aspect: "An organization created with only legal_name, ein, org_type and state_code comes back 201 with profile_status DRAFT, verification_level SELF_REPORTED, version 1, former_legal_names [], every counter zero and transparency_seal_level NONE — none of which is client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - &c_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Willow Creek Collective", ein: "900100200", org_type: "501C3", state_code: "IL", ntee_code: "B82", mission_statement: "Mentoring and scholarships for first-generation students." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { o_id: "$.data.id", o_v0: "$.data.version" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Organization.${o_id}.profile_status == DRAFT and verification_level == SELF_REPORTED"
            - "Organization.${o_id}.version == 1 and former_legal_names == []"
            - "Organization.${o_id}.transparency_seal_level == NONE and seal_expires_on is null"
            - "Organization.${o_id}.total_revenue_cents == 0 and distinct_funder_count == 0 and active_license_count == 0 and open_correction_count == 0"
            - "Organization.${o_id}.last_profile_editor_user_id == \"admin-root\""
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: organization_get_returns_the_stored_profile_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Organization
          - endpoints.GET_/nonprofits/organizations/{id}
        distinguishing_aspect: "Every posted Organization field round-trips through GET exactly as supplied, including the optional display_name that was omitted and therefore reads back null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One organization created without display_name."
          setup_api_calls:
            - *c_clock
            - *c_org
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: DataConsumer
              as_user_id: "${o_id}"
          assert:
            - "the response status is 200"
            - "Organization.${o_id}.legal_name == \"Willow Creek Collective\" and ein == \"900100200\""
            - "Organization.${o_id}.org_type == 501C3 and state_code == \"IL\" and ntee_code == \"B82\""
            - "Organization.${o_id}.display_name is null"
            - "Organization.${o_id}.mission_statement == \"Mentoring and scholarships for first-generation students.\""

      - name: organization_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/nonprofits/organizations
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three organizations on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three organizations with state_code IL, IL and WI respectively."
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Prairie Food Bank", ein: "900100201", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Lakeshore Conservancy", ein: "900100202", org_type: "501C3", state_code: "WI" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "GET /nonprofits/organizations"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /nonprofits/organizations?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /nonprofits/organizations?state_code=IL returns exactly 2 rows"
            - "GET /nonprofits/organizations?profile_status=DRAFT returns 3 rows"
            - "GET /nonprofits/organizations with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: organization_get_with_an_unknown_id_returns_organization_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/nonprofits/organizations/{id}
          - errors[ERR_ORGANIZATION_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id produces the entity-specific 404 ERR_ORGANIZATION_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No organization has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /nonprofits/organizations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "the response status is 404 and err_nf == ERR_ORGANIZATION_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: organization_create_missing_ein_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Organization.fields.ein
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "ein is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 409 duplicate-ein error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "No Ein Coalition", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "the response status is 400 and err_missing == ERR_INVALID_REQUEST"
            - "err_missing != ERR_EIN_ALREADY_REGISTERED"
            - "GET /nonprofits/organizations returns 0 rows and no Organization was persisted"

      - name: program_disclosure_level_defaults_to_restricted_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Program.fields.disclosure_level
          - entities.Program.fields.status
          - endpoints.POST_/nonprofits/organizations/{id}/programs
        distinguishing_aspect: "Omitting disclosure_level applies the declared default RESTRICTED rather than PUBLIC, so the program does not contribute to Organization.disclosure_pct even though it counts for completeness."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT organization."
          setup_api_calls:
            - *c_clock
            - *c_org
          trigger:
            - call: "POST /nonprofits/organizations/${o_id}/programs"
              payload: { program_name: "Quiet Mentoring", fiscal_year: 2025, subject_code: "B82" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { prog_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Program.${prog_id}.disclosure_level == RESTRICTED"
            - "Program.${prog_id}.status == ACTIVE and is_verified == false"
            - "Organization.${o_id}.disclosure_pct == 0.0000 — the RESTRICTED program contributes 0.5 of the 0.15 PROGRAMS weight and every other dimension is empty"
            - "GET /nonprofits/organizations/${o_id}/programs returns exactly 1 row"

      - name: organization_create_extra_field_profile_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Organization.fields.profile_status
          - entities.Organization.fields.version
          - endpoints.POST_/nonprofits/organizations
        distinguishing_aspect: "profile_status and version are source: system; a client that supplies profile_status ACTIVE and version 99 gets a DRAFT row at version 1, because neither field is in the endpoint's input list."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Uppity Alliance", ein: "900100299", org_type: "501C3", state_code: "IL", profile_status: "ACTIVE", version: 99, transparency_seal_level: "PLATINUM" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { up_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Organization.${up_id}.profile_status == DRAFT"
            - "Organization.${up_id}.version == 1"
            - "Organization.${up_id}.transparency_seal_level == NONE"

      - name: leadership_member_service_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.LeadershipMember.fields.service_start
          - entities.LeadershipMember.fields.service_end
          - validations[priority=4]
        distinguishing_aspect: "The closed service interval must be well formed: service_end earlier than service_start is a 400 ERR_INVALID_REQUEST, distinct from the 409 ERR_LEADERSHIP_TERM_OVERLAP that a well-formed but colliding interval produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT organization."
          setup_api_calls:
            - *c_clock
            - *c_org
          trigger:
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Backwards Betty", office_title: "Board Chair", service_start: "2025-06-01T00:00:00Z", service_end: "2025-01-01T00:00:00Z" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_backwards: "$.data.error_id" }
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Forward Fran", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", service_end: "2025-01-01T00:00:00Z" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { chair_id: "$.data.id" }
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Touching Tom", office_title: "Board Chair", service_start: "2025-01-01T00:00:00Z", service_end: "2025-06-01T00:00:00Z" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_touch: "$.data.error_id" }
          assert:
            - "the first trigger returns 400 and err_backwards == ERR_INVALID_REQUEST"
            - "the second trigger returns 201 and LeadershipMember.${chair_id}.status == ACTIVE"
            - "the third trigger returns 409 and err_touch == ERR_LEADERSHIP_TERM_OVERLAP — closed intervals treat a shared endpoint day as an overlap"
            - "GET /nonprofits/organizations/${o_id}/leadership-members returns exactly 1 row"

      - name: filing_create_checks_body_foreign_keys_before_form_version_membership
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_ORGANIZATION_NOT_FOUND]
          - errors[ERR_UNSUPPORTED_FORM_VERSION]
          - endpoints.POST_/nonprofits/filings
        distinguishing_aspect: "The flat topology puts organization_id in the body, and priority 4 existence runs before priority 9 reference-data membership: an unknown organization_id with an out-of-range form_version_year reports ERR_ORGANIZATION_NOT_FOUND, not ERR_UNSUPPORTED_FORM_VERSION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT organization."
          setup_api_calls:
            - *c_clock
            - *c_org
          trigger:
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "00000000-0000-4000-8000-000000000009", form_type: "FORM_990", form_version_year: 1999, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v0}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_fk: "$.data.error_id" }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 1999, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v0}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_version: "$.data.error_id" }
          assert:
            - "the first trigger returns 404 and err_fk == ERR_ORGANIZATION_NOT_FOUND"
            - "the second trigger returns 422 and err_version == ERR_UNSUPPORTED_FORM_VERSION"
            - "GET /nonprofits/organizations/${o_id}/filings returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: filing_normalize_from_received_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Filing.RECEIVED_to_EXTRACTED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "normalize is declared only from EXTRACTED and DISPUTED, so calling it on a RECEIVED filing is a 409 ERR_INVALID_STATE and no field is normalized."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one filing still in RECEIVED and no extracted fields."
          setup_api_calls:
            - *c_clock
            - *c_org
            - &c_prog
              call: "POST /nonprofits/organizations/${o_id}/programs"
              payload: { program_name: "Mentoring Core", fiscal_year: 2025, subject_code: "B82", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
            - &c_l1
              call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Ada Reyes", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
            - &c_l2
              call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Ben Osei", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
            - &c_l3
              call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Cleo Marsh", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
            - &c_verify
              call: "POST /nonprofits/organizations/${o_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { o_v1: "$.data.version" }
            - &c_filing
              call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v1}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_id: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_state: "$.data.error_id" }
          assert:
            - "the trigger returns 409 and err_state == ERR_INVALID_STATE"
            - "Filing.${f_id}.status is still RECEIVED and total_revenue_cents == 0"
            - "GET /nonprofits/filings/${f_id}/extracted-fields returns 0 rows"

      - name: filing_starts_in_received_with_zeroed_computed_fields
        claim_type: Initial State
        grounds:
          - state_machines.Filing.initial_state
          - entities.Filing.fields.extracted_field_count
          - endpoints.POST_/nonprofits/filings
        distinguishing_aspect: "A newly created filing is RECEIVED at revision_number 1 with extracted_field_count 0, total_revenue_cents 0, superseded_by_revision_number null and pre_supersede_status null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT organization, no prior filings."
          setup_api_calls:
            - *c_clock
            - *c_org
          trigger:
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v0}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_new: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Filing.${f_new}.status == RECEIVED and revision_number == 1"
            - "Filing.${f_new}.extracted_field_count == 0 and total_revenue_cents == 0"
            - "Filing.${f_new}.superseded_by_revision_number is null and pre_supersede_status is null"
            - "Filing.${f_new}.is_verified == false"

      - name: voided_filing_is_terminal_and_cannot_be_voided_twice
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Filing.terminal_states
          - state_machines.Filing.NORMALIZED_to_VOIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VOIDED is the filing's only terminal state, so a second void is a 409 ERR_INVALID_STATE rather than an idempotent success."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one NORMALIZED filing."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - &c_extract
              call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - &c_normalize
              call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${f_id}/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { err_double_void: "$.data.error_id" }
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "5000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_after_void: "$.data.error_id" }
          assert:
            - "the first trigger returns 409 and err_double_void == ERR_INVALID_STATE"
            - "the second trigger returns 409 and err_after_void == ERR_INVALID_STATE"
            - "Filing.${f_id}.status == VOIDED"
            - "Organization.${o_id}.total_revenue_cents == 0 after the void"

      - name: lapsed_seal_is_terminal_and_cannot_be_renewed
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TransparencySeal.terminal_states
          - state_machines.TransparencySeal.ACTIVE_to_LAPSED
          - errors[ERR_SEAL_LAPSED]
        distinguishing_aspect: "Renewing 91 days late is refused and drives the seal to the terminal LAPSED state; every later renewal is also refused because ACTIVE -> ACTIVE is the only renewal transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization holding a SILVER seal that expires 2027-09-01T00:00:00Z."
            - "The clock is then advanced to 2027-12-01T00:00:00Z, which is 91 days past expires_on."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations/${o_id}/seals"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { seal_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-12-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /nonprofits/seals/${seal_id}/renew"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_lapsed: "$.data.error_id" }
            - call: "POST /nonprofits/seals/${seal_id}/renew"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_lapsed2: "$.data.error_id" }
          assert:
            - "the first trigger returns 409 and err_lapsed == ERR_SEAL_LAPSED"
            - "TransparencySeal.${seal_id}.status == LAPSED and renewal_attempt_count == 1"
            - "Organization.${o_id}.transparency_seal_level == NONE and seal_expires_on is null"
            - "the second trigger returns 409 and err_lapsed2 == ERR_INVALID_STATE — LAPSED is terminal, so the renewal transition is not declared from it"

      - name: claiming_a_correction_request_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.CorrectionRequest.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The same CLAIM decision twice is not idempotent: the second claim observes UNDER_REVIEW and is rejected because SUBMITTED -> UNDER_REVIEW is the only declared claim transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with a NORMALIZED filing, one correction request already CLAIMed into UNDER_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - *c_normalize
            - call: "GET /nonprofits/filings/${f_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { ef_id: "$.data[0].id", ef_v: "$.data[0].version" }
            - call: "POST /nonprofits/extracted-fields/${ef_id}/correction-requests"
              payload: { requested_value: "2000.00", evidence_url: "https://evidence.example.org/willow-2025.pdf", justification: "Audited statement shows 2000.00.", expected_extracted_field_version: "${ef_v}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /nonprofits/correction-requests/${cr_id}/decide"
              payload: { decision: "CLAIM" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "POST /nonprofits/correction-requests/${cr_id}/decide"
              payload: { decision: "CLAIM" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_reclaim: "$.data.error_id" }
          assert:
            - "the trigger returns 409 and err_reclaim == ERR_INVALID_STATE"
            - "CorrectionRequest.${cr_id}.status == UNDER_REVIEW"
            - "ExtractedField.${ef_id}.normalized_value_cents == 100000 and normalization_status == NORMALIZED"

      - name: third_open_correction_request_suspends_the_organization_and_revokes_its_seal
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - entities.Organization.fields.open_correction_count
          - calculations.organization_derived_counters
        distinguishing_aspect: "Filing the third open correction request pushes open_correction_count from 2 to 3 and bubbles up: the organization flips ACTIVE -> SUSPENDED and its ACTIVE seal is revoked inside that same request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with a SILVER seal and a NORMALIZED filing carrying three revenue lines; two correction requests against two of those lines are already SUBMITTED, so open_correction_count is 2."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations/${o_id}/seals"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { seal_id: "$.data.id" }
            - *c_filing
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1000.00", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "2000.00", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "CONTRIB", raw_value: "3000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - *c_normalize
            - call: "GET /nonprofits/filings/${f_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { ef0: "$.data[0].id", ef0v: "$.data[0].version", ef1: "$.data[1].id", ef1v: "$.data[1].version", ef2: "$.data[2].id", ef2v: "$.data[2].version" }
            - call: "POST /nonprofits/extracted-fields/${ef0}/correction-requests"
              payload: { requested_value: "1500.00", evidence_url: "https://evidence.example.org/a.pdf", justification: "Line A corrected.", expected_extracted_field_version: "${ef0v}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { cr0: "$.data.id" }
            - call: "POST /nonprofits/extracted-fields/${ef1}/correction-requests"
              payload: { requested_value: "2500.00", evidence_url: "https://evidence.example.org/b.pdf", justification: "Line B corrected.", expected_extracted_field_version: "${ef1v}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { cr1: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/extracted-fields/${ef2}/correction-requests"
              payload: { requested_value: "3500.00", evidence_url: "https://evidence.example.org/c.pdf", justification: "Line C corrected.", expected_extracted_field_version: "${ef2v}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { cr2: "$.data.id" }
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "the third correction request returns 201 and CorrectionRequest.${cr2}.status == SUBMITTED"
            - "Organization.${o_id}.open_correction_count == 3"
            - "Organization.${o_id}.profile_status == SUSPENDED — the count crossing 3 suspends the profile"
            - "TransparencySeal.${seal_id}.status == REVOKED"
            - "Organization.${o_id}.transparency_seal_level == NONE and seal_expires_on is null"
            - "GET /nonprofits/organizations/${o_id}/correction-requests?status=SUBMITTED returns exactly 3 rows"

      - name: duplicate_line_code_normalizes_to_conflict_and_leaves_revenue_unchanged
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ExtractedField.PENDING_to_CONFLICT
          - state_machines.Filing.EXTRACTED_to_NORMALIZED
          - calculations.filing_total_revenue_normalized_cents
        distinguishing_aspect: "Two extracted lines sharing a line_code cannot both normalize: both go to CONFLICT, both are excluded from the revenue sum, and Filing.is_verified stays false because a CONFLICT exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with a filing carrying two TOTREV lines."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1000.00", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "TOTREV", raw_value: "2000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "Filing.${f_id}.status == NORMALIZED but is_verified == false"
            - "Filing.${f_id}.total_revenue_cents == 0 — both CONFLICT lines are excluded"
            - "GET /nonprofits/filings/${f_id}/extracted-fields?normalization_status=CONFLICT returns exactly 2 rows"
            - "GET /nonprofits/filings/${f_id}/extracted-fields?normalization_status=NORMALIZED returns 0 rows"

      - name: license_expires_automatically_when_the_logical_clock_passes_term_end
        claim_type: Valid Transition
        grounds:
          - state_machines.DataLicense.ACTIVE_to_EXPIRED
          - entities.Organization.fields.active_license_count
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Advancing the logical clock to term_end flips the ACTIVE license to the terminal EXPIRED state and drops the licensee's active_license_count to 0, without any client write."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization holding one ACTIVE RESEARCHER license for [2026-09-01, 2027-09-01)."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
