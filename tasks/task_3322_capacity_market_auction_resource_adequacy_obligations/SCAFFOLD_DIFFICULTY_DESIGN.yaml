          - validations[priority=12]
          - errors[ERR_FORECAST_SHARES_INVALID]
        distinguishing_aspect: |
          Aggregate-exactness metric (different from the ratio threshold): three
          top-level zones' shares must sum to exactly 1.000 after 3-decimal
          rounding — 0.334+0.333+0.333 == 1.000 passes, while
          0.335+0.333+0.333 == 1.001 is rejected with ERR_FORECAST_SHARES_INVALID
          via the forecast-create endpoint.
        test_recipe:
          setup:
            - "DY DRAFT with three top-level zones A, B, C (no nesting)"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "A" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "B" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "C" }
              as: MarketAdmin
          trigger:
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { A: 0.335, B: 0.333, C: 0.333 } }
              as: MarketAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { A: 0.334, B: 0.333, C: 0.333 } }
              as: MarketAdmin
              captures: { fc_id: "$.data.id" }
          assert:
            - "First trigger call: error_id == ERR_FORECAST_SHARES_INVALID, HTTP 422"
            - "Second trigger call: HTTP 201, LoadForecast.${fc_id}.status == DRAFT and revision == 1"
  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: auction_open_requires_delivery_year_forecast_locked
        grounds:
          - state_machines.AuctionRun.DRAFT_to_OPEN
          - state_machines.DeliveryYear.DRAFT_to_FORECAST_LOCKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          AuctionRun (child) -> DeliveryYear (parent) pair: opening a run is
          rejected with ERR_INVALID_STATE while the delivery year is still DRAFT
          (forecast not locked), and succeeds only after lock-forecast advances
          the parent to FORECAST_LOCKED.
        test_recipe:
          setup:
            - "DY in DRAFT (no forecast locked); AuctionRun RUN created (DRAFT)"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "AuctionRun.${run_id}.status == DRAFT (unchanged)"
      - name: emergency_assessment_requires_delivery_year_cleared
        grounds:
          - state_machines.EmergencyEvent.DECLARED_to_ASSESSING
          - state_machines.DeliveryYear.AUCTION_OPEN_to_CLEARED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          EmergencyEvent -> DeliveryYear pair (different pair than
          AuctionRun->DeliveryYear): begin-assessment on a DECLARED event is
          rejected while the delivery year is merely FORECAST_LOCKED (auction
          never cleared), proving the gate keys on the parent's CLEARED state.
        test_recipe:
          setup:
            - "DY FORECAST_LOCKED (forecast locked, no auction run cleared); event EV DECLARED inside the delivery year window"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/emergency-events"
              payload: { delivery_year_id: "${dy_id}", event_start: "2029-06-10T13:00:00Z", event_end: "2029-06-10T15:00:00Z", event_type: "EMERGENCY_ACTION" }
              as: MarketAdmin
              captures: { ev_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/emergency-events/${ev_id}/begin-assessment"
              payload: {}
              as: MarketAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "EmergencyEvent.${ev_id}.status == DECLARED (unchanged)"
            - "No PerformanceAssessment rows exist for event ${ev_id}"
  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: emergency_pai_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_EVENT_OVERLAP]
          - state_machines.EmergencyEvent.DECLARED_to_ASSESSING
        distinguishing_aspect: |
          Half-open interval semantics on EmergencyEvent: [13:00,15:00) and
