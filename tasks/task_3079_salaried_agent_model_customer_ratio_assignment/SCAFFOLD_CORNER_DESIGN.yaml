# ===========================================================================
  - section: validations
    instances:

      - name: client_create_with_a_duplicate_email_returns_client_email_duplicate
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - validations[priority=3a]
          - errors.ERR_CLIENT_EMAIL_DUPLICATE
          - entities.Client.fields.email
        distinguishing_aspect: "email is unique system-wide, not per region: a second client with the same email but a different service area code in a different region is still refused with ERR_CLIENT_EMAIL_DUPLICATE at priority 7."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two regions, one client registered in the first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_a: $.data.id }
            - call: "POST /regions"
              payload: { name: "Portland", service_area_codes: ["97201"], traditional_commission_pct: 0.024, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_b: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Dana Dup", email: "dana@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_1: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Dana Dup Again", email: "dana@x.com", service_area_code: "97201", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id == ERR_CLIENT_EMAIL_DUPLICATE"
            - "GET /clients?region_id=${region_b} returns 0 rows"
            - "Client.${client_1}.email == \"dana@x.com\" and its own record is untouched"

      - name: listing_agreement_for_a_buy_client_returns_listing_client_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_LISTING_CLIENT_MISMATCH
          - entities.ListingAgreement.fields.client_id
        distinguishing_aspect: "A listing is refused for a client whose need_kind is BUY with ERR_LISTING_CLIENT_MISMATCH at priority 7 — a business_constraint failure that never reaches the priority 8 fee-ceiling checks."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, one BUY client assigned to that agent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Buyer Only", email: "buyer@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${region_id}"
              payload: {}
              as: PlatformAdmin
              captures: { region_v: $.data.version }
          trigger:
            - call: "POST /listing-agreements"
              payload: { client_id: "${client_id}", list_price_cents: 60000000, list_fee_rate_pct: 0.0125, service_tier: "FULL_SERVICE", expected_region_version: "${region_v}" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id == ERR_LISTING_CLIENT_MISMATCH"
            - "error_id != ERR_LIST_FEE_RATE_EXCEEDED"
            - "GET /listing-agreements?client_id=${client_id} returns 0 rows"

      - name: listing_agreement_above_the_flat_fee_ceiling_returns_list_fee_rate_exceeded
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_LIST_FEE_RATE_EXCEEDED
          - entities.ListingAgreement.fields.list_fee_rate_pct
        distinguishing_aspect: "The flat listing fee rate is capped at 0.015: 0.015 is admitted and 0.016 is refused with ERR_LIST_FEE_RATE_EXCEEDED, so the ceiling itself is the boundary rather than a value near it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, two assigned SELL clients."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 4.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sara Seller", email: "sara@x.com", service_area_code: "98101", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_ok: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tina Seller", email: "tina@x.com", service_area_code: "98102", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_bad: $.data.id }
            - call: "POST /clients/${seller_ok}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${seller_bad}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${region_id}"
              payload: {}
              as: PlatformAdmin
              captures: { region_v: $.data.version }
          trigger:
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_ok}", list_price_cents: 60000000, list_fee_rate_pct: 0.015, service_tier: "FULL_SERVICE", expected_region_version: "${region_v}" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { agreement_ok: $.data.id }
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_bad}", list_price_cents: 60000000, list_fee_rate_pct: 0.016, service_tier: "FULL_SERVICE", expected_region_version: "${region_v}" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the 0.015 request returns 201 with ListingAgreement.${agreement_ok}.gross_listing_fee_cents == 900000"
            - "the 0.016 request returns 409 with error_id == ERR_LIST_FEE_RATE_EXCEEDED"
            - "GET /listing-agreements?region_id=${region_id} returns exactly 1 row"

      - name: listing_agreement_below_the_price_floor_returns_list_price_out_of_band
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_LIST_PRICE_OUT_OF_BAND
          - entities.ListingAgreement.fields.list_price_cents
        distinguishing_aspect: "list_price_cents has a declared floor of 10000000; 10000000 is admitted and 9999999 is refused with ERR_LIST_PRICE_OUT_OF_BAND, a lower-band failure rather than an upper one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, two assigned SELL clients."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
