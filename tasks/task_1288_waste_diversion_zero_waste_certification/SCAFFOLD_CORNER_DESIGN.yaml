  # ============================================================== Errors
  - section: errors
    instances:
      - name: contract_overlap_error_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_STREAM_OVERLAP"]
        excluded_because:
          difficulty_instance: contract_window_closed_interval_touch
          rationale: "Closed-interval touch overlap and disjoint acceptance asserted in the named §1.8 instance."

      - name: goal_overlap_error_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_GOAL_WINDOW_OVERLAP"]
        excluded_because:
          difficulty_instance: goal_window_half_open_adjacency
          rationale: "Half-open adjacency allowed vs one-day-early rejection asserted in the named §1.8 instance."

      - name: period_not_closed_error_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_NOT_CLOSED"]
        excluded_because:
          difficulty_instance: submit_requires_reporting_period_closed
          rationale: "ERR_PERIOD_NOT_CLOSED on submit asserted in the named §1.8 instance."

      - name: vendor_not_active_error_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_NOT_ACTIVE"]
        excluded_because:
          difficulty_instance: contract_activate_requires_vendor_active
          rationale: "ERR_VENDOR_NOT_ACTIVE on contract activate asserted in the named §1.8 instance."

  # ============================================================== RBAC
  - section: rbac
    instances:
      - name: ticket_validate_forbidden_for_vendor_user
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN"]
        distinguishing_aspect: "VendorUser is locked out of the validation tier (segregation: ticket creators never validate): validate as VendorUser returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Site; vendor; contract ACTIVE; T1 PENDING"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site F1", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
