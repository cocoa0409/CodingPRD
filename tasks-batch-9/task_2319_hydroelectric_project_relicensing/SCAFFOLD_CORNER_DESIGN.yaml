        distinguishing_aspect: "The single fieldwork endpoint carries four actions over one dimension: RESUME before START and COMPLETE from SUSPENDED are both rejected, and the loop PLANNED -> IN_PROGRESS -> SUSPENDED -> IN_PROGRESS -> COMPLETED leaves review_status at NOT_SUBMITTED throughout."
        test_recipe:
          setup:
            - "Project P-9046 with one study on a submitted plan (status UNDER_AGENCY_REVIEW) and fieldwork_status PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9046", project_name: "Fieldwork Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
