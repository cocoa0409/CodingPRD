          - entities.SubstantiationDossier.fields.study_count
        distinguishing_aspect: "Each append must re-run the screening variant on the whole evidence list: a strong RCT gives 30.00, and a dose-mismatched animal study adds only 8 * 0.60 = 4.80 for a running 34.80 with peer review ignored."
