          assert:
            - "L1: AmendedReturn.${ar_id}.status == ACCEPTED"
            - "L1: AmendedReturn.${ar_id}.wage_delta_cents == 250000 and tax_delta_cents == 250000 and deposit_shortfall_cents == 250000"
            - "L1: AmendedReturn.${ar_id}.days_late == 365 and interest_cents == 20000 and penalty_cents == 65625"
            - "L2: Discrepancy.${d1_id}.status == RESOLVED and resolved_amended_return_id == ${ar_id}"
            - "L2: Discrepancy.${d2_id}.status == RESOLVED"
            - "L2: Discrepancy.${d3_id}.status == RESOLVED"
            - "L2: GET /discrepancies?correction_case_id=${case_id}&status=RESOLVED returns total_count == 3"
            - "L2 (sibling side effect): FiledReturn.${fr_id}.status == AMENDED"
            - "L3: CorrectionCase.${case_id}.filing_status == FILING_COMPLETE"
            - "L3: CorrectionCase.${case_id}.statement_status == STMT_NOT_REQUIRED (untouched by the cascade)"
            - "L4: CorrectionCase.${case_id}.status == REMEDIATION_PENDING"
            - "L4: GET /control-remediations?correction_case_id=${case_id} returns total_count == 1 with status == OPEN and root_cause_code == RATE_TABLE_STALE"
            - "L4: CorrectionCase.${case_id}.total_exposure_cents == 335625"
            - "L5: Employer.${emp_id}.open_remediation_count == 1"
            - "L5: Employer.${emp_id}.open_exposure_cents == 0 (the accepted amendment is no longer open exposure)"

