  # =======================================================================
  # Rule 8 — resource occupation conflicts with DIFFERENT interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: appointment_slot_aggregate_capacity_at_one_instant
        grounds:
          - validations[priority=19]
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
          - entities.AppointmentSlot.fields.capacity
          - entities.AppointmentSlot.fields.booked_count
          - state_machines.AppointmentSlot.OPEN_to_FULL
        distinguishing_aspect: |
          AppointmentSlot uses AGGREGATE-CAPACITY interval semantics: many
          occupations may share the identical instant up to capacity, and only
          the capacity-plus-one occupation collides. With capacity 1 the second
          booking on the same slot is refused with ERR_SLOT_CAPACITY_EXCEEDED
          while booked_count stays 1.
        test_recipe:
          setup:
            - "A consulate covering CA with one slot at 2026-06-05T10:00:00Z and capacity 1."
            - "Two applicants on one order, the first already booked into that slot."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: true }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/consulates"
              payload:
                name: "IN Consulate West"
                destination_country: "IN"
                jurisdiction_region_codes: ["CA", "NV"]
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /expediting/consulates/${cons_id}/slots"
              payload: { starts_at: "2026-06-05T10:00:00Z", capacity: 1 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD", consulate_id: "${cons_id}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Slot One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap1_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Slot Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap2_id: $.data.id }
            - call: "GET /expediting/slots/${slot_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { slot_v0: $.data.version }
            - call: "POST /expediting/appointments"
              payload: { applicant_id: "${ap1_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { appt1_id: $.data.id }
            - call: "GET /expediting/slots/${slot_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { slot_v1: $.data.version }
          trigger:
            - call: "POST /expediting/appointments"
              payload: { applicant_id: "${ap2_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v1}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { cap_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_SLOT_CAPACITY_EXCEEDED"
            - "AppointmentSlot.${slot_id}.booked_count == 1"
            - "AppointmentSlot.${slot_id}.status == FULL"
            - "Appointment.${appt1_id}.booking_status == BOOKED"
            - "GET /expediting/appointments with slot_id filter returns exactly 1 row"

      - name: custody_interval_single_occupancy_rejects_out_of_position_dispatch
        grounds:
          - validations[priority=14]
          - errors[ERR_CUSTODY_MISMATCH]
          - calculations.custody_exclusivity_invariant
          - entities.CustodyEvent.fields.released_at
          - state_machines.CourierLeg.CREATED_to_DISPATCHED
        distinguishing_aspect: |
          The passport book uses STRICT SINGLE-OCCUPANCY half-open interval
          semantics on a different resource entity (Order/CustodyEvent) — exactly
          one CustodyEvent may have released_at null at any instant, so a
          dispatch whose from_holder is AGENCY while the open interval is held by
          SERVICE would create a second overlapping occupation and is refused
          with ERR_CUSTODY_MISMATCH, unlike the slot's aggregate-capacity rule.
        test_recipe:
          setup:
            - "A STANDARD single-applicant order whose passport has been couriered APPLICANT -> SERVICE, so custody_holder is SERVICE with exactly one open CustodyEvent."
            - "A second CourierLeg declared with from_holder AGENCY and to_holder SERVICE, still CREATED."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Custody Excl", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 1, from_holder: "APPLICANT", to_holder: "SERVICE", scheduled_date: "2026-06-01" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg1_id: $.data.id }
            - call: "POST /expediting/courier-legs/${leg1_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/courier-legs/${leg1_id}/complete"
              payload: { outcome: "DELIVERED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 2, from_holder: "AGENCY", to_holder: "SERVICE", scheduled_date: "2026-06-02" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg2_id: $.data.id }
          trigger:
            - call: "POST /expediting/courier-legs/${leg2_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
              captures: { custody_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_CUSTODY_MISMATCH"
            - "CourierLeg.${leg2_id}.leg_status == CREATED"
            - "CourierLeg.${leg2_id}.attempt_count == 0"
            - "Order.${ord_id}.custody_holder == SERVICE"
            - "GET /expediting/orders/${ord_id}/custody-events returns 3 rows and exactly 1 has released_at null"

  # =======================================================================
  # Rule 9 — compensating-action invariants on DIFFERENT conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:

      - name: pre_tender_cancellation_preserves_two_stream_money_conservation
        grounds:
          - calculations.money_conservation_invariant
          - calculations.refund_adjudication
          - calculations.payment_stream_allocation
          - state_machines.Order.INTAKE_to_CANCELLED
          - entities.Order.fields.outstanding_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: after the compensating cancellation
          the identity collected_cents == government_tendered_cents +
          service_earned_cents + refunded_cents + outstanding_cents still holds
          exactly at 68250 == 0 + 0 + 63188 + 5062, with the GOVERNMENT stream
          fully returned because nothing was tendered.
        test_recipe:
          setup:
            - "A STANDARD three-applicant order quoted at 68250 cents (48000 government + 20250 service), fully collected in one payment, accepted so furthest_stage_reached is INTAKE."
            - "Nothing has been tendered, so government_tendered_cents is 0."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Money One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Money Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Money Three", date_of_birth: "1992-05-06", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/payments"
              payload: { amount_cents: 68250 }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/accept-quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_id}/cancel"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          assert:
            - "Order.${ord_id}.workflow_status == CANCELLED"
            - "Order.${ord_id}.collected_cents == 68250"
            - "Order.${ord_id}.collected_government_cents == 48000"
            - "Order.${ord_id}.collected_service_cents == 20250"
            - "Order.${ord_id}.refunded_cents == 63188"
            - "Order.${ord_id}.government_tendered_cents == 0"
            - "Order.${ord_id}.service_earned_cents == 0"
            - "Order.${ord_id}.outstanding_cents == 5062"
            - "Order.${ord_id}.payment_status == PARTIALLY_REFUNDED"
            - "GET /expediting/orders/${ord_id}/summary reports conservation_ok == true"

      - name: failed_courier_leg_preserves_single_custody_occupancy
        grounds:
          - calculations.custody_exclusivity_invariant
          - state_machines.CourierLeg.DISPATCHED_to_FAILED
          - state_machines.CourierLeg.FAILED_to_DISPATCHED
          - entities.CustodyEvent.fields.holder_type
          - entities.CourierLeg.fields.attempt_count
        distinguishing_aspect: |
          The conserved quantity is CARDINALITY, not money: the compensating
          FAILED completion hands the book back to the leg's from_holder, so the
          count of CustodyEvent rows with released_at null is exactly 1 before,
          during and after the round trip, and the book is never held twice nor
          lost.
        test_recipe:
          setup:
            - "A STANDARD single-applicant order with CourierLeg 1 (APPLICANT -> SERVICE) DISPATCHED, so custody_holder is COURIER."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Custody Conserve", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 1, from_holder: "APPLICANT", to_holder: "SERVICE", scheduled_date: "2026-06-01" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg1_id: $.data.id }
            - call: "POST /expediting/courier-legs/${leg1_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
          trigger:
            - call: "POST /expediting/courier-legs/${leg1_id}/complete"
              payload: { outcome: "FAILED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/courier-legs/${leg1_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/courier-legs/${leg1_id}/complete"
              payload: { outcome: "DELIVERED" }
              as: CourierOps
              as_user_id: "co-1"
          assert:
            - "after the FAILED completion Order.${ord_id}.custody_holder == APPLICANT"
            - "CourierLeg.${leg1_id}.attempt_count == 2"
            - "CourierLeg.${leg1_id}.leg_status == DELIVERED"
            - "Order.${ord_id}.custody_holder == SERVICE"
            - "GET /expediting/orders/${ord_id}/custody-events returns 5 rows and exactly 1 has released_at null"
            - "GET /expediting/orders/${ord_id}/summary reports open_custody_count == 1 and open_custody_holder == SERVICE"
