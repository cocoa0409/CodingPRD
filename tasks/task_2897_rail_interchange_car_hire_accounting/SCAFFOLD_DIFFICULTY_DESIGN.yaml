          assert:
            - "L1: CarHireMovement.${bad_mv_id} == (chargeable_hours 50.00, chargeable_days 3, time_component_cents 7800, mileage_component_cents 0, gross_hire_cents 7800)"
            - "L2: Car.${bad_car_id}.routing_status == OBLIGATION_VIOLATED"
            - "L3: CarHireMovement.${bad_mv_id}.reverse_route_penalty_cents == 1950 and net_hire_cents == 9750"
