  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: field_reapplication_symmetric_twenty_one_day_buffer
        grounds:
          - validations[priority=31]
          - errors.ERR_REAPPLICATION_INTERVAL_CONFLICT
          - entities.Field.fields.last_application_on
          - calculations.application_event_nutrient_load
        distinguishing_aspect: |
          The contended resource is one Field and the interval is a symmetric 21-day buffer around an
          existing application: 20 days after is rejected, 15 days BEFORE (a back-dated record) is
          rejected by the same rule, and exactly 21 days after is accepted.
        test_recipe:
          setup:
            - "Canonical Willow Creek Dairy operation with a COVERED permit, an APPROVED 2026 plan and one ACTIVE budget of 414396 allowable gallons"
            - "One lagoon holding 1000000 gallons"
            - "One RECORDED application event of 300000 gallons on field North 40 on 2026-07-05, so last_application_on is 2026-07-05"
            - "Logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 42, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { soil_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_v: $.data.version }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION", "INCORPORATED_24H"], winter_application_allowed: false, expected_operation_version: "${op_v}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
            - call: "POST /cafo/field-budgets"
              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
