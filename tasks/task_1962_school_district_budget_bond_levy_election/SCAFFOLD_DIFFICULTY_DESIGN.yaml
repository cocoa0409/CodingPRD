  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (two different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: budget_adoption_gated_by_hearing_held
        grounds:
          - state_machines.BudgetVersion.HEARING_HELD_to_ADOPTED
          - state_machines.PublicHearing.NOTICE_PUBLISHED_to_HELD
          - errors[ERR_BUDGET_VERSION_NOT_HEARING_HELD]
        distinguishing_aspect: |
          Entity pair BudgetVersion x PublicHearing: adopt is reachable only from
          HEARING_HELD, a state the budget version can reach ONLY via a PublicHearing
          transitioning to HELD — adopting while the hearing is merely scheduled fails,
          and succeeds after the hearing is held (plus the 7-day delay).
        test_recipe:
          setup:
            - "FY2028 OPEN; budget version with one 1,000 line and a revenue estimate; PROPOSED with a hearing NOTICE_PUBLISHED for 2027-03-20"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 1000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
            - call: "POST /district/budget-versions/${bv}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: BoardClerk
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h1}/hold"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-27T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: BoardClerk
              captures: { st: $.data.status }
          assert:
            - "First adopt (hearing only NOTICE_PUBLISHED) rejected: ${err} == ERR_BUDGET_VERSION_NOT_HEARING_HELD"
            - "Hearing hold flips the budget version PROPOSED -> HEARING_HELD (cross-entity side effect)"
            - "Second adopt succeeds: status == ADOPTED — the BudgetVersion transition was gated on the PublicHearing entity's state"

      - name: bond_sale_gated_by_proposal_passed
        grounds:
          - state_machines.BondProposal
          - errors[ERR_INVALID_STATE]
          - concurrency_rules[bond-sale-create-stale-proposal]
        distinguishing_aspect: |
          Entity pair BondSale x BondProposal (different pair than BudgetVersion x
          PublicHearing): sale creation against a merely BOARD_APPROVED proposal fails with
          ERR_INVALID_STATE even with a correct OCC version; after the proposal passes at
          canvass, the same sale payload with the refreshed version succeeds.
        test_recipe:
          setup:
            - "FY2028 OPEN; bond proposal 18,000,000 BOARD_APPROVED with one project; election 2027-11-02 with a certified measure"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Capital improvements", total_amount: 18000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof Replacement", site_code: "HS-01", estimated_cost: 6000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "GET /district/bond-proposals/${bp}"
              as: DistrictTreasurer
              captures: { bp_v1: $.data.version }
          trigger:
            - call: "POST /district/bond-proposals/${bp}/bond-sales"
              payload: { series_label: "2027-A", par_amount: 10000000, premium: 150000, issuance_costs: 80000, sale_date: "2027-12-01", expected_bond_proposal_version: "${bp_v1}" }
              as: DistrictTreasurer
              captures: { err: $.data.error_id }
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for capital improvements" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/ballot-measures/${bm}/certify"
              as: BoardClerk
              as_user_id: "clerk-certifier-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-03T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/elections/${el}/canvass"
              payload: { results: [ { ballot_measure_id: "${bm}", yes_votes: 5200, no_votes: 4800 } ] }
              as: BoardClerk
            - call: "GET /district/bond-proposals/${bp}"
              as: DistrictTreasurer
              captures: { bp_v2: $.data.version }
            - call: "POST /district/bond-proposals/${bp}/bond-sales"
              payload: { series_label: "2027-A", par_amount: 10000000, premium: 150000, issuance_costs: 80000, sale_date: "2027-12-01", expected_bond_proposal_version: "${bp_v2}" }
              as: DistrictTreasurer
              captures: { sale: $.data.id, sale_st: $.data.status }
          assert:
            - "First sale attempt (proposal BOARD_APPROVED, OCC version correct) rejected: ${err} == ERR_INVALID_STATE — the cross-entity state gate, not a concurrency failure"
            - "After canvass PASSED, the identical sale succeeds: BondSale.${sale} status == PLANNED with net_proceeds == 10070000.00"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (two different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_venue_date_day_equality_conflict
        grounds:
          - calculations.hearing_adoption_calendar
          - errors[ERR_HEARING_VENUE_DATE_CONFLICT]
        distinguishing_aspect: |
          Day-equality semantics on the (venue, hearing_date) resource: two non-cancelled
          hearings collide iff venue AND calendar date match exactly — no buffer, no
          half-open arithmetic; a cancelled hearing releases its slot. Different semantics
          than the construction-window half-open-plus-buffer rule.
        test_recipe:
          setup:
            - "FY2028 OPEN; budget versions v1 and v2, both PROPOSED; clock at 2027-03-01"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv1: $.data.id }
            - call: "GET /district/fiscal-years/${fy}"
              as: BudgetAnalyst
              captures: { fy_v2: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v2}" }
              as: BudgetAnalyst
              captures: { bv2: $.data.id }
            - call: "POST /district/budget-versions/${bv1}/propose"
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv2}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv1}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv2}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { err_dup: $.data.error_id }
            - call: "POST /district/budget-versions/${bv2}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-21" }
              as: BoardClerk
              captures: { h_next: $.data.id }
            - call: "POST /district/budget-versions/${bv2}/hearings"
              payload: { venue: "GYMNASIUM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h_other_venue: $.data.id }
            - call: "POST /district/public-hearings/${h1}/cancel"
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv1}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h5: $.data.id }
          assert:
            - "Same venue + same date rejected: ${err_dup} == ERR_HEARING_VENUE_DATE_CONFLICT"
            - "Same venue + next day accepted (day granularity, no buffer): hearing ${h_next} created"
            - "Different venue + same date accepted: hearing ${h_other_venue} created"
            - "After cancelling h1, the freed (BOARD_ROOM, 2027-03-20) slot accepts a new hearing ${h5} (CANCELLED hearings leave the conflict set)"

      - name: site_window_half_open_overlap_with_fourteen_day_buffer
        grounds:
          - calculations.site_window_conflict
          - errors[ERR_SITE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open [start, end) window arithmetic PLUS a 14-day buffer on the site_code
          resource — different interval semantics than the hearing rule's plain day equality:
          windows touching at a boundary (gap 0) conflict because of the buffer, a gap of
          exactly 14 days is allowed, and true overlap (start < other.end) conflicts
          regardless of buffer.
        test_recipe:
          setup:
            - "FY2028 OPEN; bond proposal 18,000,000 DRAFT; project P1 at site HS-01 with window [2028-06-01, 2028-08-15)"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Capital improvements", total_amount: 18000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof Replacement", site_code: "HS-01", estimated_cost: 6000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Early Start", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-08-20", construction_end: "2028-09-30", priority_rank: 2 }
              as: BoardClerk
              captures: { err_gap5: $.data.error_id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Overlapping", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-08-10", construction_end: "2028-09-30", priority_rank: 3 }
              as: BoardClerk
              captures: { err_overlap: $.data.error_id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Touching", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-08-15", construction_end: "2028-09-15", priority_rank: 4 }
              as: BoardClerk
              captures: { err_touch: $.data.error_id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Exact Buffer", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-08-29", construction_end: "2028-10-15", priority_rank: 5 }
              as: BoardClerk
              captures: { p_ok: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Other Site Same Window", site_code: "ES-02", estimated_cost: 1000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 6 }
              as: BoardClerk
              captures: { p_site2: $.data.id }
          assert:
            - "Gap of 5 days (< 14) rejected: ${err_gap5} == ERR_SITE_WINDOW_CONFLICT"
            - "True overlap (2028-08-10 < 2028-08-15) rejected: ${err_overlap} == ERR_SITE_WINDOW_CONFLICT"
            - "Touching windows ([start == other.end], gap 0) rejected: ${err_touch} == ERR_SITE_WINDOW_CONFLICT — buffer dominates half-open adjacency"
            - "Gap of exactly 14 days (2028-08-15 -> 2028-08-29) ALLOWED: project ${p_ok} created (inclusive buffer boundary)"
            - "Identical window on a DIFFERENT site allowed: project ${p_site2} created (conflict set is per site_code)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (two different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_transfer_conserves_total_appropriations
        grounds:
          - calculations.total_revenue_and_balance
          - entities.BudgetVersion.fields.total_appropriations
        distinguishing_aspect: |
          Conserved quantity = the budget version's total appropriations: a 250,000 transfer
          between two lines leaves total_appropriations == 1,500,000.00 unchanged, and the
          compensating reverse transfer of 250,000 restores both lines to their original
          amounts exactly (1,000,000.00 / 500,000.00) — zero drift across the round trip.
        test_recipe:
          setup:
            - "FY2028 OPEN; budget version with lines L1 EDUCATION 1,000,000 and L2 OPERATIONS 500,000"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 1000000 }
              as: BudgetAnalyst
              captures: { l1: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "OPERATIONS", function_code: "2500", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 500000 }
              as: BudgetAnalyst
              captures: { l2: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/transfers"
              payload: { from_line_id: "${l1}", to_line_id: "${l2}", amount: 250000 }
              as: BudgetAnalyst
              captures: { t1_from: $.data.from_line_appropriation, t1_to: $.data.to_line_appropriation }
            - call: "POST /district/budget-versions/${bv}/transfers"
              payload: { from_line_id: "${l2}", to_line_id: "${l1}", amount: 250000 }
              as: BudgetAnalyst
              captures: { t2_from: $.data.from_line_appropriation, t2_to: $.data.to_line_appropriation }
            - call: "POST /district/budget-versions/${bv}/transfers"
              payload: { from_line_id: "${l1}", to_line_id: "${l2}", amount: 2000000 }
              as: BudgetAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /district/budget-versions/${bv}"
              as: Auditor
              captures: { total: $.data.total_appropriations }
          assert:
            - "Forward transfer: L1 == 750000.00, L2 == 750000.00; total_appropriations == 1500000.00 (invariant holds under the forward action)"
            - "Compensating reverse transfer: L1 == 1000000.00, L2 == 500000.00 restored exactly; total still == 1500000.00 (no drift)"
            - "Over-transfer rejected: ${err} == ERR_TRANSFER_EXCEEDS_LINE and the failed attempt leaves both lines unchanged"
            - "Final GET confirms BudgetVersion.${bv}.total_appropriations == 1500000.00"

      - name: expenditure_post_and_void_conserves_available_proceeds
        grounds:
          - calculations.bond_sale_proceeds
          - calculations.project_available_budget
          - entities.BondProposal.fields.available_proceeds
        distinguishing_aspect: |
          Conserved quantity = the proposal's available bond proceeds (different conserved
          quantity than budget appropriations): posting a 1,000,000 expenditure debits the
          pool to 9,070,000.00 and voiding it restores exactly 10,070,000.00 ==
          sum(CLOSED net proceeds) - sum(active expenditures) == 10,070,000.00 - 0 — the
          forward/compensating pair leaves the named global quantity unchanged.
        test_recipe:
          setup:
            - "FY2028 OPEN; bond proposal 18,000,000 PASSED with project P1 (6,000,000, HS-01) IN_PROGRESS; sale 2027-A CLOSED with net proceeds 10,070,000.00"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Capital improvements", total_amount: 18000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof Replacement", site_code: "HS-01", estimated_cost: 6000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
              captures: { prj: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for capital improvements" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/ballot-measures/${bm}/certify"
              as: BoardClerk
              as_user_id: "clerk-certifier-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-03T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/elections/${el}/canvass"
              payload: { results: [ { ballot_measure_id: "${bm}", yes_votes: 5200, no_votes: 4800 } ] }
              as: BoardClerk
            - call: "GET /district/bond-proposals/${bp}"
              as: DistrictTreasurer
              captures: { bp_v: $.data.version }
            - call: "POST /district/bond-proposals/${bp}/bond-sales"
              payload: { series_label: "2027-A", par_amount: 10000000, premium: 150000, issuance_costs: 80000, sale_date: "2027-12-01", expected_bond_proposal_version: "${bp_v}" }
              as: DistrictTreasurer
              captures: { sale: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T12:00:00Z" }
              as: DistrictTreasurer
            - call: "POST /district/bond-sales/${sale}/close"
              as: DistrictTreasurer
            - call: "POST /district/bond-projects/${prj}/activate"
              as: Superintendent
            - call: "GET /district/bond-proposals/${bp}"
              as: Auditor
              captures: { pool_before: $.data.available_proceeds }
          trigger:
            - call: "POST /district/bond-projects/${prj}/expenditures"
              payload: { vendor_name: "Roofing Co", amount: 1000000, description: "roof tear-off" }
              as: DistrictTreasurer
              captures: { ex: $.data.id }
            - call: "GET /district/bond-proposals/${bp}"
              as: Auditor
              captures: { pool_after_post: $.data.available_proceeds }
            - call: "GET /district/bond-projects/${prj}"
              as: Auditor
              captures: { spent_post: $.data.spent_amount }
            - call: "POST /district/project-expenditures/${ex}/void"
              as: DistrictTreasurer
            - call: "GET /district/bond-proposals/${bp}"
              as: Auditor
              captures: { pool_after_void: $.data.available_proceeds }
            - call: "GET /district/bond-projects/${prj}"
              as: Auditor
              captures: { spent_void: $.data.spent_amount }
          assert:
            - "Baseline: available_proceeds == 10070000.00 (one CLOSED sale, no expenditures)"
            - "Forward action: posting the 1,000,000 expenditure debits the pool to 9070000.00 and project spent_amount == 1000000.00"
            - "Compensating action: void restores available_proceeds == 10070000.00 exactly and spent_amount == 0.00"
            - "Invariant: available_proceeds == sum(net_proceeds of CLOSED sales) - sum(amount of expenditures with payment_status != VOIDED) at every step (10070000.00 - 0.00)"
