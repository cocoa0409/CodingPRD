              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/projects/${proj_id}/array-circuits"
              payload: { circuit_label: "S1", module_count: 2, dc_kw: 0.82 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/storage-bins"
              payload: { bin_label: "BIN-A", capacity_slots: 1, climate_controlled: true }
              as: ProjectCoordinator
              captures: { bin_a: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0002", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u2: $.data.id }
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/storage"
              payload: { storage_bin_id: "${bin_a}" }
