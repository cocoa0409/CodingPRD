  - rule_id: boundary_precision_check
    instances:
      - name: hall_turnaround_buffer_allows_exactly_48h_gap_and_rejects_47h
        grounds:
          - calculations.hall_occupation_conflict
          - entities.CenterHall.fields.turnaround_hours
          - entities.SpaceHold.fields.hold_rank
          - endpoints[POST /space-holds]
        distinguishing_aspect: |
          The conflict test is a STRICT single-sided buffered comparison, so a candidate whose move_in_start is
          exactly existing.move_out_end + turnaround_hours (2028-04-13T00:00:00Z + 48h = 2028-04-15T00:00:00Z)
          does NOT conflict and is ranked FIRST, while a candidate one hour earlier (2028-04-14T23:00:00Z) DOES
          conflict and is ranked SECOND. One hour of instant arithmetic flips hold_rank; an implementation
          using <= at the buffer edge mis-ranks the exact-gap hold as SECOND.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; two identical halls Grand Hall A and Grand Hall B, each with turnaround_hours 48, exhibit_sqft 250000, capacity_persons 12000"
            - "hall A holds an incumbent HELD FIRST hold for opportunity A over 2028-04-08T00:00:00Z -> 2028-04-13T00:00:00Z; hall B holds an identical incumbent for opportunity B"
            - "two further QUALIFIED opportunities exist to carry the boundary probes, so no window ever accumulates more than two conflicting holds"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_a_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall B", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_b_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Incumbent Hall A", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 800, total_room_nights_requested: 1400, attendance_estimate: 6000, exhibit_sqft_requested: 150000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { inc_a_id: $.data.id }
            - call: "POST /opportunities/${inc_a_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${inc_a_id}", center_hall_id: "${hall_a_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { inc_hold_a_id: $.data.id, inc_rank_a: $.data.hold_rank }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Incumbent Hall B", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 800, total_room_nights_requested: 1400, attendance_estimate: 6000, exhibit_sqft_requested: 150000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { inc_b_id: $.data.id }
            - call: "POST /opportunities/${inc_b_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${inc_b_id}", center_hall_id: "${hall_b_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { inc_hold_b_id: $.data.id, inc_rank_b: $.data.hold_rank }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Exact Gap Probe", arrival_date: "2028-04-17", departure_date: "2028-04-19", peak_rooms_requested: 300, total_room_nights_requested: 500, attendance_estimate: 2000, exhibit_sqft_requested: 60000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { probe_exact_id: $.data.id }
            - call: "POST /opportunities/${probe_exact_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "One Hour Short Probe", arrival_date: "2028-04-17", departure_date: "2028-04-19", peak_rooms_requested: 300, total_room_nights_requested: 500, attendance_estimate: 2000, exhibit_sqft_requested: 60000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { probe_short_id: $.data.id }
            - call: "POST /opportunities/${probe_short_id}/qualify"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /space-holds"
              payload: { opportunity_id: "${probe_exact_id}", center_hall_id: "${hall_a_id}", move_in_start: "2028-04-15T00:00:00Z", move_out_end: "2028-04-20T00:00:00Z" }
              as: CenterScheduler
              captures: { exact_hold_id: $.data.id, exact_rank: $.data.hold_rank, exact_status: $.data.status }
            - call: "POST /space-holds"
              payload: { opportunity_id: "${probe_short_id}", center_hall_id: "${hall_b_id}", move_in_start: "2028-04-14T23:00:00Z", move_out_end: "2028-04-20T00:00:00Z" }
              as: CenterScheduler
              captures: { short_hold_id: $.data.id, short_rank: $.data.hold_rank, short_status: $.data.status }
            - call: "GET /opportunities/${probe_exact_id}"
              payload: {}
              as: SalesManager
              captures: { exact_posture: $.data.hold_posture }
            - call: "GET /opportunities/${probe_short_id}"
              payload: {}
              as: SalesManager
              captures: { short_posture: $.data.hold_posture }
          assert:
            - "${inc_rank_a} == FIRST and ${inc_rank_b} == FIRST"
            - "${exact_rank} == FIRST and ${exact_status} == HELD - a gap of exactly 48h clears the strict buffer"
            - "${short_rank} == SECOND and ${short_status} == HELD - 47h does not clear it"
            - "${exact_posture} == TENTATIVE (a FIRST hold) while ${short_posture} == NONE (a SECOND hold never moves hold_posture)"
            - "${exact_hold_id} != ${short_hold_id}"
            - "GET /space-holds?center_hall_id=${hall_a_id}&hold_rank=SECOND returns 0 rows"
            - "GET /space-holds?center_hall_id=${hall_b_id}&hold_rank=SECOND returns 1 row"

      - name: fund_posture_holds_open_at_exactly_ten_percent_and_flips_one_charge_later
        grounds:
          - state_machines.IncentiveFund.OPEN_to_CONSTRAINED
          - entities.IncentiveFund.fields.uncommitted_amount
          - calculations.incentive_cap
          - calculations.fund_charge_composition
          - global_constants.FUND_CONSTRAINED_PCT
        distinguishing_aspect: |
          The CONSTRAINED precondition is a strict inequality (uncommitted < budget * 10.00 / 100), so a fund
          left with EXACTLY 1050.00 of a 10500.00 budget is still OPEN; a single further charge of 105.00
          drops it to 945.00 and flips it to CONSTRAINED. The same test pins the residual clamp inside
          calculations.incentive_cap: the second bid's cap is 1050.00 (the fund residual), not the 1125.00 the
          band/yield/coverage arithmetic alone would produce.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; planner CDA with legacy 2 / 6000, so tier TIER_B and tier_rate 0.25"
            - "incentive fund FY2028 with budget_amount 10500.00, so the CONSTRAINED threshold is exactly 1050.00"
            - "opportunity ONE: 1800 requested room nights at ceiling 219.00, attendance 8000, exhibit 200000, no committed block, so coverage_factor 0.75 and incentive_cap_amount 11086.88"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
