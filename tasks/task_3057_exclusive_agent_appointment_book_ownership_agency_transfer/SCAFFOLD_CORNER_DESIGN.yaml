      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Deny
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P19
          product_line: AUTO
          annual_premium_cents: 600000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p}
          claim_amount_cents: 20000
        as: ClaimsAdjuster
        captures:
          cl: $.data.id
      trigger:
      - call: POST /agency-network/claims/${cl}/deny
        payload: {}
        as: ClaimsAdjuster
      - call: GET /agency-network/agencies/${cali_id}
        payload: {}
        as: AppointingExecutive
      assert:
      - after deny Claim.${cl}.policy_paid_cents == 0.00
      - Agency.${cali_id}.agency_paid_claims_cents == 0.00 and loss_ratio == 0.00 after the cascade
  - name: agreement_transcribe_stale_agent_covered_by_difficulty
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[agreement-transcribe-stale-agent]
    excluded_because:
      difficulty_instance: application_value_tier_score_boundary_at_eighty
      rationale: The stale-agent-version OCC refusal is registered in §1.2.1 and exercised alongside the transcribe boundary instance.
