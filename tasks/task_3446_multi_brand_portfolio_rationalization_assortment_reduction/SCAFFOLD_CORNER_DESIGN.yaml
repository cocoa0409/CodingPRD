        claim_type: listing_pagination
        grounds:
          - response_envelope
          - endpoints[GET /portfolio/plants]
        distinguishing_aspect: "With 12 plants, limit=10 returns 10 rows with has_more true and total_count 12; offset=10 returns the remaining 2 with has_more false."
        test_recipe:
          setup: ["12 plants created (PL-PG-01 .. PL-PG-12)"]
          setup_api_calls:
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-01", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-02", quarterly_capacity_units: 1000 }, as: PortfolioManager }
            - { call: "POST /portfolio/plants", payload: { name: "PL-PG-03", quarterly_capacity_units: 1000 }, as: PortfolioManager }
