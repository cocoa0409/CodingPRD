      - name: close_period_increments_period_and_books_flow
        claim_type: action_endpoint
        grounds: ["endpoints: POST /agencies/{agencyId}/close-period", "endpoints: POST /agencies/{agencyId}/close-books"]
        distinguishing_aspect: "close-period moves period_index 0 -> 1 -> 2; close-books then sets books_closed_through_period_index to 1; a close-books at period 0 fails ERR_INVALID_STATE (nothing to close)."
        test_recipe:
          setup: ["agency at period 0"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency EP", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /agencies/${ag}/close-books", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { err0: $.data.error_id } }
            - { call: "POST /agencies/${ag}/close-period", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { p1: $.data.period_index } }
            - { call: "POST /agencies/${ag}/close-period", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { p2: $.data.period_index } }
            - { call: "POST /agencies/${ag}/close-books", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { bc: $.data.books_closed_through_period_index } }
          assert:
            - "${err0} == ERR_INVALID_STATE   # 409: period 0 has no completed period to close"
            - "${p1} == 1 and ${p2} == 2"
            - "${bc} == 1   # period_index - 1"

