      - name: certified_index_exactly_eighty_five_certifies_one_hundredth_below_holds
        grounds:
          - state_machines.ProductionRun.PROVISIONAL_to_CERTIFIED
          - state_machines.ProductionRun.PROVISIONAL_to_HELD
          - calculations.run_quality_index_certified
          - entities.ProductionRun.fields.certified_quality_index
          - entities.ProductionRun.fields.off_spec_reel_count
        distinguishing_aspect: |
          Metric: the certified_quality_index >= 85.00 certification gate, probed on
          POST /paper-machines/{machine_id}/runs/{run_id}/certify. Run A's reels sit at 145.25
          gsm, a basis-weight deviation of exactly 3.75% that scores exactly 85.00 and must
          CERTIFY on the inclusive comparison; run B's reels sit 0.01 gsm higher at 145.26, which
          scores 84.97 and must instead be accepted by /hold, whose precondition is the strict
          complement — both runs have off_spec_reel_count 0, so the index comparison is the only
          discriminator.
