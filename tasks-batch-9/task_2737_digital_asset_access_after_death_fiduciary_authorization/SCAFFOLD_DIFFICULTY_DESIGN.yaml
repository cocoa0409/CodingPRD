          Revoking the FIRST fiduciary's letters stops at hop 1 — the grant stays ACTIVE, both assets
          stay CATALOG_DISCLOSED and the phase stays DISCLOSURE, because a second fiduciary still
          holds ISSUED letters — while revoking the SECOND fiduciary's letters runs the identical
