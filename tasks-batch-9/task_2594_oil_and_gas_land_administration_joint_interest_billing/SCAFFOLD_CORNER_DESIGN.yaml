      - name: a_third_rebuttal_exhausts_the_dispute_round_cap
        claim_type: triggerability
        grounds:
          - "validations[priority=60, error_id=ERR_MAX_DISPUTE_ROUNDS_EXCEEDED]"
          - errors.ERR_MAX_DISPUTE_ROUNDS_EXCEEDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispute_exchange_cycle_two_rounds_then_round_cap
          rationale: |
            Triggering this error requires driving the OPEN -> OPERATOR_RESPONDED -> OPEN cycle twice
            and then attempting a third rebuttal. The §1.8 non_linear_state_machine instance walks
            exactly that loop, asserts round_count 1 then 2, and asserts the third rebuttal returns
            ERR_MAX_DISPUTE_ROUNDS_EXCEEDED.

      - name: a_preferential_election_after_the_notice_window_is_refused
        claim_type: triggerability
        grounds:
          - "validations[priority=60, error_id=ERR_PPR_WINDOW_EXPIRED]"
          - errors.ERR_PPR_WINDOW_EXPIRED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / transfer_state_check_beats_expired_ppr_window
          rationale: |
            The §1.8 priority_pair_validation_conflict instance already contains the single-violation
            control case for this error - a preferential-right election filed after ppr_deadline_date
            on a still-NOTICED transfer returning ERR_PPR_WINDOW_EXPIRED - alongside the combined
            violation, so the triggerability requirement is met there.

