    code: 200
    input: []
    output: Carrier
    side_effects: []

  # ---- Inventory lots ------------------------------------------------------
  - method: POST
    path: "/distribution/inventory-lots"
    description: "Receive a lot into a warehouse. condition_state and state_of_charge_pct are derived immediately from manufactured_on and the logical clock."
    roles: [PlatformAdmin, WarehouseOperator]
    code: 201
    input: [battery_model_id, warehouse_id, manufactured_on, quantity_on_hand]
    output: InventoryLot
    side_effects: ["runs calculations lot_state_of_charge and lot_condition_posture", "quantity_reserved initialised to 0"]

  - method: GET
    path: "/distribution/inventory-lots/{inventoryLotId}"
    description: "Read one lot with its posture re-derived against the current logical clock."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["re-derives state_of_charge_pct, quantity_available and condition_state on read"]

  - method: GET
    path: "/distribution/inventory-lots"
    description: "List lots with FK and posture filters."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer]
    code: 200
    input: ["battery_model_id?", "warehouse_id?", "scrap_manifest_id?", "condition_state?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  - method: POST
    path: "/distribution/inventory-lots/{inventoryLotId}/refresh-charge"
    description: "Apply a maintenance refresh charge, resetting the state-of-charge baseline to the current logical clock."
    roles: [WarehouseOperator]
    code: 200
    input: [measured_open_circuit_voltage]
    output: InventoryLot
    side_effects: ["sets last_refresh_charged_at = current_utc, increments refresh_charge_count, writes last_measured_open_circuit_voltage", "re-derives state_of_charge_pct to 100.0 and condition_state to SELLABLE"]

  - method: POST
    path: "/distribution/inventory-lots/{inventoryLotId}/scrap"
    description: "Write a dead lot onto a DRAFT disposal manifest."
    roles: [WarehouseOperator, ComplianceOfficer]
    code: 200
    input: [disposal_manifest_id]
    output: InventoryLot
    side_effects: ["sets scrap_manifest_id, forcing condition_state to SCRAPPED", "increments DisposalManifest.scrapped_lot_count and re-derives its lot_lead_kg and total_lead_kg via manifest_lead_totals"]

  # ---- Orders --------------------------------------------------------------
  - method: POST
    path: "/distribution/orders"
    description: "Open a DRAFT order. A non-null storm_event_id marks it as an emergency draw."
    roles: [SalesRep, Customer]
    code: 201
    input: [account_id, warehouse_id, requested_ship_date, "storm_event_id?"]
    output: Order
    side_effects: ["fulfillment_status DRAFT, credit_status PENDING, all money fields 0"]

  - method: GET
    path: "/distribution/orders/{orderId}"
    description: "Read one order including both state dimensions and its money fields."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/distribution/orders"
    description: "List orders with FK and both state-dimension filters."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["account_id?", "warehouse_id?", "storm_event_id?", "fulfillment_status?", "credit_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/distribution/orders/{orderId}/lines"
    description: "Add a line to a DRAFT order."
    roles: [SalesRep, Customer]
    code: 201
    input: [battery_model_id, quantity, "core_expected_count?"]
    output: OrderLine
    side_effects: ["increments Order.line_count", "money fields stay 0 until submit"]

  - method: GET
    path: "/distribution/order-lines/{orderLineId}"
    description: "Read one order line including its allocation fields."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/distribution/order-lines"
    description: "List order lines with FK filters."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["order_id?", "battery_model_id?", "allocated_lot_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/distribution/orders/{orderId}/submit"
    description: "Price and commit a DRAFT order."
    roles: [SalesRep, Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["runs order_line_pricing then order_total_assembly", "fulfillment_status DRAFT -> SUBMITTED and credit_status PENDING -> CLEARED", "Account.open_receivable_cents += Order.total_cents"]

  - method: POST
    path: "/distribution/orders/{orderId}/allocate"
    description: "Reserve stock for every line using the lot_allocation_selector, honouring the storm carve-out and the storm pool gate."
    roles: [WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["runs allocation_priority_score and lot_allocation_selector", "fulfillment_status SUBMITTED -> ALLOCATED", "increments InventoryLot.quantity_reserved per line", "for a storm order, increments StormEvent.allocated_units and re-derives remaining_pool_units"]

  - method: POST
    path: "/distribution/orders/{orderId}/cancel"
    description: "Cancel an order from DRAFT, SUBMITTED or ALLOCATED, unwinding every booking made so far."
    roles: [SalesRep, PlatformAdmin, Customer]
    code: 200
    input: [cancellation_reason]
    output: Order
    side_effects: ["compensations listed on the matching §1.2 Order transition: receivable, lot reservations, storm pool, shipments to VOIDED, contracts to CANCELLED", "credit_status -> CLOSED"]

  # ---- Shipments -----------------------------------------------------------
  - method: POST
    path: "/distribution/shipments"
    description: "Pack an ALLOCATED order onto a carrier for a dock pickup window."
    roles: [WarehouseOperator]
    code: 201
    input: [order_id, carrier_id, pickup_window_start, pickup_window_end, expected_order_version]
    output: Shipment
    side_effects: ["computes hazmat_class_code, total_weight_kg, total_lead_kg and package_count", "records packed_by_user_id from X-User-ID", "increments Order.version by 1"]

  - method: GET
    path: "/distribution/shipments/{shipmentId}"
    description: "Read one shipment."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/distribution/shipments"
    description: "List shipments with FK and status filters."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer]
    code: 200
    input: ["order_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/distribution/shipments/{shipmentId}/certify"
    description: "Hazmat certification fork: APPROVE moves the shipment to CERTIFIED and re-prices the order, REJECT moves it to HAZMAT_REJECTED and blacklists the carrier for that order."
    roles: [HazmatCertifier]
    code: 200
    input: [certification_decision, "rejection_reason?"]
    output: Shipment
    side_effects: ["APPROVE: hazmat_surcharge variant shipment_actual, then Order.hazmat_fee_cents / Order.total_cents / Account.open_receivable_cents cascade", "REJECT: Order.hazmat_hold = true and carrier_id appended to Order.rejected_carrier_ids"]

  - method: POST
    path: "/distribution/shipments/{shipmentId}/dispatch"
    description: "Tender a CERTIFIED shipment during its pickup window."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["writes dispatched_at", "Order.fulfillment_status ALLOCATED -> SHIPPED"]

  - method: POST
    path: "/distribution/shipments/{shipmentId}/deliver"
    description: "Confirm delivery; drives the five-hop delivery cascade."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["writes delivered_at", "Order -> DELIVERED, lines stamped with core_due_by, lots depleted, ServiceContract -> ACTIVE", "Account.core_deposit_balance_cents += promised core deposits", "Account may enter CREDIT_HOLD, which flips sibling orders' credit_status to HELD"]

  # ---- Core returns --------------------------------------------------------
  - method: POST
    path: "/distribution/core-returns"
    description: "Declare a batch of returned cores against a delivered order."
    roles: [SalesRep, Customer]
    code: 201
    input: [account_id, order_id, battery_model_id, declared_core_count]
    output: CoreReturn
    side_effects: ["computes late_return and provisional_credit_cents (variant declared_provisional)", "status initialised to SUBMITTED, inspection_round 0"]

  - method: GET
    path: "/distribution/core-returns/{coreReturnId}"
    description: "Read one core return."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: CoreReturn
    side_effects: []

  - method: GET
    path: "/distribution/core-returns"
    description: "List core returns with FK and status filters."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["account_id?", "order_id?", "battery_model_id?", "disposal_manifest_id?", "status?", "limit?", "offset?"]
    output: CoreReturn[]
    side_effects: []

  - method: POST
    path: "/distribution/core-returns/{coreReturnId}/inspect"
    description: "Record an inspection round; accepted_core_count == 0 rejects the whole return."
    roles: [WarehouseOperator]
    code: 200
    input: [accepted_core_count]
    output: CoreReturn
    side_effects: ["increments inspection_round", "runs core_lead_recovery writing lead_recovered_kg and scrap_value_cents", "status -> INSPECTED or REJECTED"]

  - method: POST
    path: "/distribution/core-returns/{coreReturnId}/dispute"
    description: "Contest the latest inspection and send the return back for another round."
    roles: [Customer, SalesRep]
    code: 200
    input: [dispute_reason]
    output: CoreReturn
    side_effects: ["status INSPECTED -> DISPUTED", "refused with ERR_DISPUTE_ROUNDS_EXHAUSTED once inspection_round reaches MAX_INSPECTION_ROUNDS"]

  - method: POST
    path: "/distribution/core-returns/{coreReturnId}/credit"
    description: "Issue the final core credit; drives the four-hop core-credit cascade."
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: CoreReturn
    side_effects: ["runs core_exchange_credit variant assayed_final writing final_credit_cents", "Account.core_deposit_balance_cents -= final_credit_cents and lifetime_lead_recovered_kg += lead_recovered_kg", "Account may leave CREDIT_HOLD, which flips HELD orders back to CLEARED"]

  # ---- Warranty claims -----------------------------------------------------
