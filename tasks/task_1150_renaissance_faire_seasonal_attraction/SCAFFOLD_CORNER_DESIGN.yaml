            - call: "POST /seasons"
              payload: { name: "Settle Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Tack & Tatter", category: "ARTISAN" }, as: VendorCoordinator, captures: { va: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Felt & Feather", category: "ARTISAN" }, as: VendorCoordinator, captures: { vb: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${va}", captures: { aa: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${vb}", captures: { ab: $.data.id } }
            - { call: "POST /vendor-applications/${aa}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${ab}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${aa}", booth_site: "S-01", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-21T00:00:00Z" }, as: VendorCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /booth-assignments", payload: { application_id: "${ab}", booth_site: "S-02", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-21T00:00:00Z" }, as: VendorCoordinator, captures: { b2: $.data.id } }
            - { call: "POST /booth-assignments/${b1}/confirm", payload: {}, as: Vendor, as_user_id: "${va}" }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /booth-assignments/${b1}/settle", payload: {}, as: VendorCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /booth-assignments/${b1}/release", payload: {}, as: VendorCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T07:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-gates", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/complete", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/begin-strike", payload: {}, as: FaireOperator }
            - { call: "POST /booth-assignments/${b1}/settle", payload: {}, as: VendorCoordinator, captures: { b1_fin: $.data.final_fee_cents, b1_delta: $.data.settlement_delta_cents, b1_st: $.data.status } }
            - { call: "POST /booth-assignments/${b2}/settle", payload: {}, as: VendorCoordinator, captures: { err3: $.data.error_id } }
          assert:
            - "settle while season OPEN: ERR_SEASON_INVALID_STATE (409)"
            - "release while CONFIRMED: ERR_BOOTH_NOT_RELEASEABLE (409)"
            - "after STRIKE: settle succeeds — final_fee_cents == 6400 (64 sqft * 50 * 2 weeks), settlement_delta_cents == 0, status SETTLED"
            - "settle on RESERVED booth during STRIKE: ERR_BOOTH_NOT_SETTLEABLE (409)"

      - name: cast_contracts_filtered_by_performer
        claim_type: retrieval
        grounds: [entities.CastContract.fields.performer_id]
        distinguishing_aspect: "GET /cast-contracts?performer_id=<id> returns exactly that performer's contracts (FK reverse-reachability via filtered list)."
        test_recipe:
