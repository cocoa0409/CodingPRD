          assert:
            - "success: response_type == \"object\", meta.api_request_id present and non-empty, meta.api_request_timestamp present, data.code == \"REG-ENV\""
            - "error: response_type == \"error\", err == \"ERR_NOT_FOUND\", data.message present"

      - name: default_clock_is_2026_08_01_without_clock_set
        claim_type: defaults
        grounds:
          - "endpoints[POST /compliance/_clock/set_current_utc]"
          - "entities.TrainingAssignment.fields.assigned_at"
        distinguishing_aspect: "Without any clock call the logical clock is pinned at 2026-08-01T00:00:00Z: the NEW_HIRE assignment's assigned_at and derived base_due_at prove the deterministic default."
