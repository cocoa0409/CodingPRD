              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
              captures: { prog_v_stale: $.data.version }
            - call: "POST /programs/${prog_id}/treaties"
              payload: { treaty_name: "T-CC1", ceded_percentage: 25, attachment_point_cents: 0, treaty_limit_cents: 1000000 }
              as: ProgramManager
              captures: { treaty_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-reporting-epoch"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /programs/${prog_id}/treaties/${treaty_id}/bind-treaty"
              payload: { expected_program_version: "${prog_v_stale}" }
              as: ProgramManager
              captures: { occ_err: $.data.error_id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { prog_v_fresh: $.data.version }
