              payload: { pod_id: "${pod_tight_id}", vin: "VIN3158M1", model: "Yaris", capacity_seats: 5, next_service_miles: 12000 }
              as: FleetAdmin
              captures: { veh_m1_id: $.data.id, veh_m1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/shift-bundles"
              payload: { source_pod_id: "${pod_empty_id}", dest_pod_id: "${pod_tight_id}", scheduled_start: "2026-09-12T02:00:00Z", scheduled_end: "2026-09-12T06:00:00Z", monthly_pods: [], expected_pod_version_profile: "${pod_tight_ver}" }
              as: PodOperator
              captures: { bundle_m_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_tight_id}", vin: "VIN3158M2", model: "Yaris", capacity_seats: 5 }
              as: FleetAdmin
              captures: { err_m1: $.data.error_id }
          assert:
            - "PodShiftBundle.${bundle_m_id}.bundle_fee_cents == 19600"
            - "Pod.${pod_tight_id}.available_bays == 0"
            - "${err_m1} == \"ERR_POD_CAPACITY_EXCEEDED\""

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2 instances, different pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_gated_by_member_application_and_membership
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Member.SCREENING_to_APPROVED
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - validations[priority=9]
          - validations[priority=11]
          - calculations.pod_utilization
        distinguishing_aspect: "Reservation -> Membership cross-entity pair: a SUSPENDED membership leaves the owner non-bookable even though the member is still APPROVED, and the hold is also refused while the application is still SCREENING."
