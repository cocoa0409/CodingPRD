        distinguishing_aspect: "Superseding an incumbent assignment is legal, so only the OCC field stops the second write: the same body with the pre-assignment version returns 412 and with the re-read version returns 201, releasing PR1's encumbrance and posting PR2's."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; Student S1 ELIGIBLE; PLANNING program P1 with federal allocation F1 of 25000000; Providers PR1 and PR2; commitment C1 captured at version ${c1_v}, then assignment A1 created for PR1 (which advances the commitment to ASSIGNED and bumps its version past ${c1_v})."
