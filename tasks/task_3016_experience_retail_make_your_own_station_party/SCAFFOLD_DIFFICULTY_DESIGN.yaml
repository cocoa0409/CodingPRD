              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store18}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store18}", station_type: "SOUND", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store18}", station_type: "BATHE", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store18}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /gift-cards"
              payload: { code: "GC-EXACT", initial_balance_cents: 4000 }
              as: StoreManager
              captures: { gc18: $.data.id }
            - call: "POST /workshops"
              payload: { store_id: "${store18}", customer_id: "${cust18}", plush_model_id: "${model18}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { w18: $.data.id }
            - call: "POST /workshops/${w18}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w18}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w18}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w18}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w18}/advance-step"
              payload: {}
              as: WorkshopAssociate
          trigger:
            - call: "POST /workshops/${w18}/payment"
              payload: { payment_amount_cents: 4000, pay_tender: "GIFT_CARD", gift_card_id: "${gc18}" }
              as: Customer
              as_user_id: "${cust18}"
            - call: "GET /gift-cards/${gc18}"
              payload: {}
              as: Customer
              as_user_id: "${cust18}"
              captures: { gc18_after: $.data }
          assert:
