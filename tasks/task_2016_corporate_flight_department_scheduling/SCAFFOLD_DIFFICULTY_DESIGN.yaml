      - name: pass_seats_and_wallet_invariant_analogous_via_duty_minutes
        grounds:
          - calculations.duty_time_check
          - entities.CrewMember.fields.duty_minutes_used
        distinguishing_aspect: |
          Conserved quantity: CrewMember.duty_minutes_used within a duty window.
          Dispatch adds sum(block_minutes) to duty_minutes_used; trip-cancel
          after dispatch (compensating action) leaves duty_minutes_used unchanged
          because the dispatch has already happened — cancellation does not
          reclaim duty time. Different conserved quantity from instance 1
          (crew duty minutes vs BU allocated cents).
        test_recipe:
          setup:
            - "PIC has duty_minutes_used=0 at duty-window start"
            - "Trip with 2 legs (120 min + 180 min) dispatched; PIC duty_minutes_used = 300"
            - "Trip cancelled post-dispatch is rejected (already dispatched; cancel only valid from UNASSIGNED/ASSIGNED)"
            - "PIC duty_minutes_used remains 300 (dispatch duty is non-refundable once flown)"
