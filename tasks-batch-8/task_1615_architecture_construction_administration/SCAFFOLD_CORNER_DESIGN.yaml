  # ---------------------------------------------------------------------------
  # Section: cross_cutting_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_clarification_drawing_stale_rfi_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[clarification-revision-stale-rfi]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the RFI version: a second drawing create carrying the pre-first-drawing version (2 after the RFI advanced to 3) is rejected with 412 ERR_STALE_VERSION; retrying with the fresh version succeeds, takes revision_number 2, and supersedes drawing 1."
        test_recipe:
          setup: ["ACTIVE project; RFI created (version 1) and answered with requires_clarification_drawing=true (version 2, CLARIFICATION_PENDING); RFI version captured (2)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CL1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm beam pocket depth", cost_impact_flag: true }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
            - call: "POST /ca/rfis/${rfi_id}/answer"
              payload: { answer_text: "See forthcoming sketch", requires_clarification_drawing: true }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "GET /ca/rfis/${rfi_id}"
              as: ArchitectCA
              captures: { rfi_v: $.data.version }
          trigger:
            - call: "POST /ca/clarification-drawings"
              payload: { rfi_id: "${rfi_id}", drawing_ref: "SK-12", expected_rfi_version: "${rfi_v}" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { cd1_id: $.data.id }
            - call: "POST /ca/clarification-drawings"
              payload: { rfi_id: "${rfi_id}", drawing_ref: "SK-12R1", expected_rfi_version: "${rfi_v}" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { err_id: $.data.error_id }
            - call: "GET /ca/rfis/${rfi_id}"
              as: ArchitectCA
              captures: { rfi_v2: $.data.version }
            - call: "POST /ca/clarification-drawings"
              payload: { rfi_id: "${rfi_id}", drawing_ref: "SK-12R1", expected_rfi_version: "${rfi_v2}" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { cd2_id: $.data.id }
            - call: "GET /ca/clarification-drawings/${cd1_id}"
              as: ArchitectCA
              captures: { cd1_status: $.data.status }
          assert:
            - "second create with the stale version: http 412 and ${err_id} == ERR_STALE_VERSION"
            - "retry with the fresh version: http 201; ClarificationDrawing.${cd2_id}.revision_number == 2 and status == ISSUED"
            - "supersession: ${cd1_status} == SUPERSEDED"
            - "Rfi.${rfi_id}.status == ANSWERED"

      - name: occ_incorporate_stale_project_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[incorporate-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the project version: incorporating change order 2 with the project version captured before change order 1's incorporation is rejected with 412; project financials reflect only change order 1."
        test_recipe:
          setup: ["ACTIVE project; change orders CO1 (net 1000000) and CO2 (net 2000000) both OWNER_ACCEPTED; project version captured after the acceptances."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CL2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "CO1", net_cost_change_cents: 1000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co1_id: $.data.id }
            - call: "POST /ca/change-orders/${co1_id}/recommend"
              payload: { recommendation: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders/${co1_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "CO2", net_cost_change_cents: 2000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co2_id: $.data.id }
            - call: "POST /ca/change-orders/${co2_id}/recommend"
              payload: { recommendation: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders/${co2_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/projects/${p_id}"
              as: FirmAdmin
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /ca/change-orders/${co1_id}/incorporate"
              payload: { expected_project_version: "${p_v}" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "POST /ca/change-orders/${co2_id}/incorporate"
              payload: { expected_project_version: "${p_v}" }
              as: Owner
              as_user_id: "user-owner-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "CO1 incorporation: http 200; CaProject.${p_id}.adjusted_contract_sum_cents == 11100000"
            - "CO2 incorporation with the stale version: http 412 and ${err_id} == ERR_STALE_VERSION"
            - "ChangeOrder.${co2_id}.status == OWNER_ACCEPTED (unchanged)"
            - "CaProject.${p_id}.adjusted_contract_sum_cents == 11100000 (CO2 not applied)"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[incorporate-stale-project]"]
        distinguishing_aspect: "Version discipline: CaProject.version is 1 at creation and increments to 2 on activate; Submittal.version is 1 at creation and 2 after review — every mutation bumps the version by exactly one."
        test_recipe:
          setup: ["Project and submittal created at the default clock; both versions captured at 1."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CL3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id, s_v0: $.data.version }
          trigger:
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
              captures: { p_v1: $.data.version }
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "APPROVED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { s_v1: $.data.version }
          assert:
            - "${p_v0} == 1 and ${p_v1} == 2 (activate bumped project version by exactly 1)"
            - "${s_v0} == 1 and ${s_v1} == 2 (review bumped submittal version by exactly 1)"

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: certify_then_project_read_reflects_totals_immediately
        claim_type: immediate_consistency
        grounds: ["calculations.contract_position", "entities.CaProject.fields.certified_to_date_cents"]
        distinguishing_aspect: "Immediate consistency: the GET of the project issued right after certification already reflects certified_to_date_cents 1800000 and retainage_held_cents 200000 — no lag, no recompute endpoint."
        test_recipe:
          setup: ["ACTIVE TIERED_MARGINAL project; verification visit REPORT_ISSUED; application submitted (line A work 2000000)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CM1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 2000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "GET /ca/projects/${p_id}"
              as: FirmAdmin
              captures: { ctd: $.data.certified_to_date_cents, rh: $.data.retainage_held_cents }
          assert:
            - "${ctd} == 1800000 and ${rh} == 200000 (visible on the immediate next read)"
