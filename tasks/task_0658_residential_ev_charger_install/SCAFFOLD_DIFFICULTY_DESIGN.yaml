scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: panel_load_standard_vs_load_study_diverge
        grounds:
          - calculations.panel_load_existing_demand
          - calculations.panel_spare_capacity
          - entities.SiteAssessment.fields.charger_fits
        distinguishing_aspect: |
          On the SAME Property (100A/240V, 1800 sqft, 16000 VA declared appliances) scoping CHG40
          (9600 VA continuous), STANDARD_220_83 yields existing_demand_va=15160 / spare=8840 /
          charger_fits=false, while LOAD_STUDY_220_87 (max_measured 7200 VA) yields
          existing_demand_va=9000 / spare=15000 / charger_fits=true — divergent fit on identical hardware.
        test_recipe:
          setup:
            - "Property P: state CA, 100A main, 240V, 1800 sqft, utility territory PGE"
            - "ChargerProduct CHG40: rated 32A, required circuit 40A"
            - "InstallJob J scoping CHG40 on P (CREATED)"
            - "Two DRAFT assessments on J: one STANDARD_220_83 (declared 16000), one LOAD_STUDY_220_87 (max_measured 7200)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h1@x.com", full_name: "H One", state_code: "CA" }
              as: Anonymous
              captures: {ho1: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40", name: "Charger 40", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho1}", address_line: "1 A St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 100, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop1: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop1}", charger_product_sku: "CHG40" }
              as: Coordinator
              captures: {job1: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop1}", install_job_id: "${job1}", assessment_method: "STANDARD_220_83", declared_fixed_appliance_va: 16000 }
              as: Coordinator
              captures: {sa_std: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop1}", install_job_id: "${job1}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sa_ls: $.data.id}
          trigger:
            - call: "GET /site-assessments/${sa_std}"
              as: Coordinator
              captures: {std_fits: $.data.charger_fits, std_spare: $.data.spare_capacity_va}
            - call: "GET /site-assessments/${sa_ls}"
              as: Coordinator
              captures: {ls_fits: $.data.charger_fits, ls_spare: $.data.spare_capacity_va}
          assert:
            - "SiteAssessment.${sa_std}.existing_demand_va == 15160"
            - "SiteAssessment.${sa_std}.spare_capacity_va == 8840"
            - "SiteAssessment.${sa_std}.charger_fits == false"
            - "SiteAssessment.${sa_ls}.existing_demand_va == 9000"
            - "SiteAssessment.${sa_ls}.spare_capacity_va == 15000"
            - "SiteAssessment.${sa_ls}.charger_fits == true"

      - name: incentive_federal_vs_utility_diverge
        grounds:
          - calculations.incentive_award
          - entities.IncentiveClaim.fields.award_cents
          - entities.IncentiveClaim.fields.program_kind
        distinguishing_aspect: |
          On the same activated InstallJob with eligible_cost_cents=195750, a FEDERAL_45W claim awards
          min(0.30*195750, 100000)=58725, while a UTILITY_REBATE claim (PREMIUM + panel-upgrade adder,
          no federal sibling) awards 80000 — two different algorithms, different awards, on IncentiveClaim
          (a different entity domain than the SiteAssessment panel calc).
        test_recipe:
          setup:
            - "InstallJob J reached ACTIVATED (full happy path; no incentive claims yet)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h2@x.com", full_name: "H Two", state_code: "CA" }
              as: Anonymous
              captures: {ho2: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40B", name: "Charger 40B", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho2}", address_line: "2 B St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop2: $.data.id}
            - call: "POST /electricians"
              payload: { full_name: "Elec One", license_state_code: "CA" }
              as: Coordinator
              captures: {el2: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop2}", charger_product_sku: "CHG40B" }
              as: Coordinator
              captures: {job2: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop2}", install_job_id: "${job2}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sa2: $.data.id}
            - call: "POST /site-assessments/${sa2}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${job2}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {q2: $.data.id}
            - call: "POST /quotes/${q2}/send"
              as: Coordinator
            - call: "GET /install-jobs/${job2}"
              as: Coordinator
              captures: {jv2: $.data.version}
            - call: "POST /quotes/${q2}/accept"
              payload: { expected_install_job_version: "${jv2}" }
              as: Homeowner
              as_user_id: "${ho2}"
            - call: "POST /permit-applications"
              payload: { install_job_id: "${job2}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {perm2: $.data.id}
            - call: "POST /permit-applications/${perm2}/approve"
              as: Coordinator
            - call: "POST /interconnection-requests"
              payload: { install_job_id: "${job2}", utility_territory_code: "PGE", requested_load_amps: 32 }
              as: Coordinator
              captures: {ic2: $.data.id}
            - call: "POST /interconnection-requests/${ic2}/start-review"
              as: UtilityReviewer
            - call: "POST /interconnection-requests/${ic2}/approve"
              as: UtilityReviewer
            - call: "POST /dispatch-assignments"
              payload: { install_job_id: "${job2}", electrician_id: "${el2}", window_date: "2026-05-01T00:00:00Z", window_start_minute: 540, window_end_minute: 720 }
              as: Coordinator
              captures: {da2: $.data.id}
            - call: "POST /dispatch-assignments/${da2}/depart"
              as: Electrician
              as_user_id: "${el2}"
            - call: "POST /dispatch-assignments/${da2}/complete"
              as: Electrician
              as_user_id: "${el2}"
            - call: "GET /install-jobs/${job2}"
              as: Coordinator
              captures: {pair2: $.data.activation_pairing_code}
            - call: "POST /install-jobs/${job2}/activate"
              payload: { pairing_code: "${pair2}" }
              as: Homeowner
              as_user_id: "${ho2}"
          trigger:
            - call: "POST /incentive-claims"
              payload: { install_job_id: "${job2}", program_kind: "FEDERAL_45W", eligible_cost_cents: 195750 }
              as: Coordinator
              captures: {fed_claim: $.data.id, fed_award: $.data.award_cents}
            - call: "POST /incentive-claims"
              payload: { install_job_id: "${job2}", program_kind: "UTILITY_REBATE", eligible_cost_cents: 195750, utility_program_tier: "PREMIUM", includes_panel_upgrade: true }
              as: Coordinator
              captures: {util_claim: $.data.id, util_award: $.data.award_cents}
          assert:
            - "IncentiveClaim.${fed_claim}.award_cents == 58725"
            - "IncentiveClaim.${util_claim}.award_cents == 80000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  #   instance 1 = mode (c) circular dependency; instance 2 = mode (b) rounding order
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_total_circular_permit_on_net   # mode (c)
        grounds:
          - calculations.quote_total
          - entities.Quote.fields.quote_total_cents
          - entities.Quote.fields.permit_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: quote_total depends on permit_fee, permit_fee is keyed
          on net_after_discount, net depends on discount, discount keyed on base_subtotal. With labor
          120000 + parts [60000,5000] (base 185000), pinned order yields discount 9250, net 175750,
          permit 20000 (net>=150000), tax 5363, total 201113.
        test_recipe:
          setup:
            - "InstallJob J3 in ASSESSED state (assessment accepted)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h3@x.com", full_name: "H Three", state_code: "CA" }
              as: Anonymous
              captures: {ho3: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40C", name: "Charger 40C", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho3}", address_line: "3 C St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop3: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop3}", charger_product_sku: "CHG40C" }
              as: Coordinator
              captures: {job3: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop3}", install_job_id: "${job3}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sa3: $.data.id}
            - call: "POST /site-assessments/${sa3}/accept"
              as: Coordinator
          trigger:
            - call: "POST /quotes"
              payload: { install_job_id: "${job3}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {q3: $.data.id}
          assert:
            - "Quote.${q3}.base_subtotal_cents == 185000"
            - "Quote.${q3}.discount_cents == 9250"
            - "Quote.${q3}.permit_fee_cents == 20000"
            - "Quote.${q3}.tax_cents == 5363"
            - "Quote.${q3}.quote_total_cents == 201113"

      - name: quote_tax_per_line_rounding_order   # mode (b)
        grounds:
          - calculations.quote_tax
          - entities.Quote.fields.tax_cents
        distinguishing_aspect: |
          Mode (b) rounding order pinned: parts [5050,5050,5050] at 8.25% give round-per-line-then-sum
          = 417*3 = 1251, whereas sum-then-round would give 1250. Scaffold pins per-line; tax_cents must
          equal 1251.
        test_recipe:
          setup:
            - "InstallJob J4 in ASSESSED state"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h4@x.com", full_name: "H Four", state_code: "CA" }
              as: Anonymous
              captures: {ho4: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40D", name: "Charger 40D", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho4}", address_line: "4 D St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop4: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop4}", charger_product_sku: "CHG40D" }
              as: Coordinator
              captures: {job4: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop4}", install_job_id: "${job4}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sa4: $.data.id}
            - call: "POST /site-assessments/${sa4}/accept"
              as: Coordinator
          trigger:
            - call: "POST /quotes"
              payload: { install_job_id: "${job4}", labor_cents: 10000, parts_line_cents: [5050, 5050, 5050] }
              as: Coordinator
              captures: {q4: $.data.id}
          assert:
            - "Quote.${q4}.tax_cents == 1251"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  #   instance 1 = WarrantyTicket cycle; instance 2 = InstallJob parallel dimensions
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_ticket_diagnose_awaiting_cycle
        grounds:
          - state_machines.WarrantyTicket.DIAGNOSING_to_AWAITING_PARTS
          - state_machines.WarrantyTicket.AWAITING_PARTS_to_DIAGNOSING
          - entities.WarrantyTicket.fields.status
        distinguishing_aspect: |
          WarrantyTicket cycles DIAGNOSING->AWAITING_PARTS->DIAGNOSING (a true A->B->A loop) and the
          ticket ends back in DIAGNOSING after parts-received — a cyclic shape, not a linear pipeline.
        test_recipe:
          setup:
            - "Activated InstallJob J5 with an OPEN WarrantyTicket"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h5@x.com", full_name: "H Five", state_code: "CA" }
              as: Anonymous
              captures: {ho5: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40E", name: "Charger 40E", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho5}", address_line: "5 E St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop5: $.data.id}
            - call: "POST /electricians"
              payload: { full_name: "Elec Five", license_state_code: "CA" }
              as: Coordinator
              captures: {el5: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop5}", charger_product_sku: "CHG40E" }
              as: Coordinator
              captures: {job5: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop5}", install_job_id: "${job5}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sa5: $.data.id}
            - call: "POST /site-assessments/${sa5}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${job5}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {q5: $.data.id}
            - call: "POST /quotes/${q5}/send"
              as: Coordinator
            - call: "GET /install-jobs/${job5}"
              as: Coordinator
              captures: {jv5: $.data.version}
            - call: "POST /quotes/${q5}/accept"
              payload: { expected_install_job_version: "${jv5}" }
              as: Homeowner
              as_user_id: "${ho5}"
            - call: "POST /permit-applications"
              payload: { install_job_id: "${job5}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {perm5: $.data.id}
            - call: "POST /permit-applications/${perm5}/approve"
              as: Coordinator
            - call: "POST /interconnection-requests"
              payload: { install_job_id: "${job5}", utility_territory_code: "PGE", requested_load_amps: 32 }
              as: Coordinator
              captures: {ic5: $.data.id}
            - call: "POST /interconnection-requests/${ic5}/start-review"
              as: UtilityReviewer
            - call: "POST /interconnection-requests/${ic5}/approve"
              as: UtilityReviewer
            - call: "POST /dispatch-assignments"
              payload: { install_job_id: "${job5}", electrician_id: "${el5}", window_date: "2026-05-02T00:00:00Z", window_start_minute: 540, window_end_minute: 720 }
              as: Coordinator
              captures: {da5: $.data.id}
            - call: "POST /dispatch-assignments/${da5}/depart"
              as: Electrician
              as_user_id: "${el5}"
            - call: "POST /dispatch-assignments/${da5}/complete"
              as: Electrician
              as_user_id: "${el5}"
            - call: "GET /install-jobs/${job5}"
              as: Coordinator
              captures: {pair5: $.data.activation_pairing_code}
            - call: "POST /install-jobs/${job5}/activate"
              payload: { pairing_code: "${pair5}" }
              as: Homeowner
              as_user_id: "${ho5}"
            - call: "POST /warranty-tickets"
              payload: { install_job_id: "${job5}", summary: "no charge" }
              as: Homeowner
              as_user_id: "${ho5}"
              captures: {wt5: $.data.id}
            - call: "POST /warranty-tickets/${wt5}/diagnose"
              as: Electrician
              as_user_id: "${el5}"
            - call: "POST /warranty-tickets/${wt5}/order-parts"
              as: Electrician
              as_user_id: "${el5}"
          trigger:
            - call: "POST /warranty-tickets/${wt5}/parts-received"
              as: Electrician
              as_user_id: "${el5}"
              captures: {wt_status: $.data.status}
          assert:
            - "WarrantyTicket.${wt5}.status == DIAGNOSING"

      - name: install_job_parallel_workflow_compliance_dimensions
        grounds:
          - state_machines.InstallJob.PENDING_REVIEW_to_PERMIT_PENDING
          - state_machines.InstallJob.PERMIT_PENDING_to_CLEARED
          - entities.InstallJob.fields.workflow_status
          - entities.InstallJob.fields.compliance_status
        distinguishing_aspect: |
          InstallJob carries two independent dimensions: while workflow_status advances CREATED->ASSESSED
          ->QUOTED, the compliance_status dimension advances PENDING_REVIEW->PERMIT_PENDING->CLEARED on its
          own triggers. After permit+interconnection approval the job reads workflow_status=QUOTED AND
          compliance_status=CLEARED simultaneously — two axes evolving independently on one row.
        test_recipe:
          setup:
            - "InstallJob J6 reached QUOTED on the workflow axis"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h6@x.com", full_name: "H Six", state_code: "CA" }
              as: Anonymous
              captures: {ho6: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40F", name: "Charger 40F", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho6}", address_line: "6 F St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop6: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop6}", charger_product_sku: "CHG40F" }
              as: Coordinator
              captures: {job6: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop6}", install_job_id: "${job6}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sa6: $.data.id}
            - call: "POST /site-assessments/${sa6}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${job6}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {q6: $.data.id}
            - call: "POST /quotes/${q6}/send"
              as: Coordinator
            - call: "GET /install-jobs/${job6}"
              as: Coordinator
              captures: {jv6: $.data.version}
            - call: "POST /quotes/${q6}/accept"
              payload: { expected_install_job_version: "${jv6}" }
              as: Homeowner
              as_user_id: "${ho6}"
            - call: "POST /permit-applications"
              payload: { install_job_id: "${job6}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {perm6: $.data.id}
            - call: "POST /permit-applications/${perm6}/approve"
              as: Coordinator
            - call: "POST /interconnection-requests"
              payload: { install_job_id: "${job6}", utility_territory_code: "PGE", requested_load_amps: 32 }
              as: Coordinator
              captures: {ic6: $.data.id}
            - call: "POST /interconnection-requests/${ic6}/start-review"
              as: UtilityReviewer
          trigger:
            - call: "POST /interconnection-requests/${ic6}/approve"
              as: UtilityReviewer
            - call: "GET /install-jobs/${job6}"
              as: Coordinator
              captures: {wf6: $.data.workflow_status, cs6: $.data.compliance_status}
          assert:
            - "InstallJob.${job6}.workflow_status == QUOTED"
            - "InstallJob.${job6}.compliance_status == CLEARED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  #   instance 1 = depth>=3 (assessment accept -> referral create -> compliance BLOCKED)
  #   instance 2 = depth>=2 (panel-upgrade complete -> property upgrade + compliance PENDING_REVIEW)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: assessment_accept_cascades_referral_then_blocks_compliance   # depth 3
        grounds:
          - state_machines.SiteAssessment.DRAFT_to_ACCEPTED
          - state_machines.InstallJob.CREATED_to_ASSESSED
          - state_machines.InstallJob.PENDING_REVIEW_to_BLOCKED
          - entities.PanelUpgradeReferral.fields.status
        distinguishing_aspect: |
          Accepting a STANDARD assessment with charger_fits=false (A) sets InstallJob.requires_panel_upgrade
          (B); that flag causes a PanelUpgradeReferral to be created (C); the referral creation itself drives
          InstallJob.compliance_status PENDING_REVIEW->BLOCKED (D) — each link caused by the previous, depth 3+.
        test_recipe:
          setup:
            - "InstallJob J7 (CREATED) on a 100A property with a DRAFT STANDARD assessment whose charger_fits=false (declared 16000)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h7@x.com", full_name: "H Seven", state_code: "CA" }
              as: Anonymous
              captures: {ho7: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CHG40G", name: "Charger 40G", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${ho7}", address_line: "7 G St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 100, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {prop7: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${prop7}", charger_product_sku: "CHG40G" }
              as: Coordinator
              captures: {job7: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${prop7}", install_job_id: "${job7}", assessment_method: "STANDARD_220_83", declared_fixed_appliance_va: 16000 }
              as: Coordinator
              captures: {sa7: $.data.id}
          trigger:
            - call: "POST /site-assessments/${sa7}/accept"
              as: Coordinator
            - call: "GET /install-jobs/${job7}"
              as: Coordinator
              captures: {rpu7: $.data.requires_panel_upgrade, cs7: $.data.compliance_status}
            - call: "GET /panel-upgrade-referrals?install_job_id=${job7}"
              as: Coordinator
              captures: {ref7: "$.data[0].id"}
          assert:
            - "InstallJob.${job7}.requires_panel_upgrade == true"
            - "InstallJob.${job7}.compliance_status == BLOCKED"
            - "PanelUpgradeReferral.${ref7}.status == OPEN"

      - name: panel_upgrade_complete_cascades_property_then_unblocks   # depth 2
