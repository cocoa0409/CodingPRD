      - name: peer_roles_share_reads_but_exclusive_writes_are_rejected
        claim_type: peer_roles
        grounds:
          - roles.RiskAnalyst
          - roles.CanvassCoordinator
          - roles.GrantOfficer
          - roles.ProgramAdmin.shared_operations
        distinguishing_aspect: "The six roles are peers, not a hierarchy: GET /crr/zones/{id} is listed for all six and must answer 200 for each, while every exclusive write is refused across the peer boundary - the coordinator cannot create a grant, the grant officer cannot intake a household, and even ProgramAdmin (the broadest reader) cannot assess a zone."
        test_recipe:
          setup:
            - "One assessed zone and one partner so every read has a target."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id }
            - call: "GET /crr/zones/${z_id}"
              as: RiskAnalyst
              captures: { z_v: $.data.version }
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "grants@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /crr/zones/${z_id}"
              as: CanvassCoordinator
            - call: "GET /crr/zones/${z_id}"
              as: GrantOfficer
            - call: "GET /crr/zones/${z_id}"
              as: PartnerLiaison
              as_user_id: "${p_id}"
            - call: "POST /crr/grants"
              payload: { partner_id: "${p_id}", grant_code: "G-PEER-1", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: CanvassCoordinator
              captures: { e_grant: $.data.error_id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "12 Birch Row", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: GrantOfficer
              captures: { e_household: $.data.error_id }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v}" }
              as: ProgramAdmin
              captures: { e_assess: $.data.error_id }
          assert:
            - "the three reads all return 200 with the same zone payload (shared_operations really are shared)"
            - "${e_grant} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "${e_household} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "${e_assess} == ERR_ROLE_NOT_PERMITTED with status 403 - the widest reader still has no write authority"
            - "GET /crr/grants as GrantOfficer returns total_count 0 and GET /crr/households as CanvassCoordinator returns total_count 0"
            - "RiskZone.${z_id}.assessment_status == UNASSESSED and RiskZone.${z_id}.version == ${z_v}"

  # =========================================================================
  # 8. From Cross-Cutting Complexity Layers
  #    declared layers: optimistic_concurrency, cascading_side_effects,
  #                     dual_variant_calculation, selector_policy
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_zone_version_from_an_unrelated_cascade_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[zone-assessment-supersede-stale-zone]
          - errors.ERR_STALE_ZONE_VERSION
          - validations[priority 8 - concurrency]
        distinguishing_aspect: "The OCC guard is armed by writes the client never made: after a household intake bumps RiskZone.household_count (and therefore its version), a previously valid expected_zone_version is stale and the assessment is refused 412 - so the version counter has to cover cascaded counter updates, not just direct zone writes. A re-read then succeeds."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
            - call: "GET /crr/zones/${z_id}"
              as: RiskAnalyst
              captures: { z_v1: $.data.version }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "12 Birch Row", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
          trigger:
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
              captures: { e_first: $.data.error_id }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v1}" }
              as: RiskAnalyst
              captures: { e_cascade: $.data.error_id }
            - call: "GET /crr/zones/${z_id}"
              as: RiskAnalyst
              captures: { z_v2: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v2}" }
              as: RiskAnalyst
              captures: { a3_id: $.data.id }
          assert:
            - "${z_v1} == ${z_v0} + 1 (the first assessment bumped the zone)"
            - "first response.status == 412 and ${e_first} == ERR_STALE_ZONE_VERSION"
            - "second response.status == 412 and ${e_cascade} == ERR_STALE_ZONE_VERSION - the household intake, not the analyst, invalidated ${z_v1}"
            - "${z_v2} == ${z_v1} + 1 and both refusals left it unchanged (a rejected write must not bump version)"
            - "fourth response.status == 201"
            - "RiskZone.${z_id}.current_assessment_id == ${a3_id}"
            - "RiskZone.${z_id}.version == ${z_v2} + 1"
            - "GET /crr/zones/${z_id}/assessments returns total_count 2 (only the two accepted creates persisted)"

