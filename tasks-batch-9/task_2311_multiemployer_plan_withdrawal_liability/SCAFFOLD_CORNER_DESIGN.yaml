      - name: arbitrating_on_another_assessments_decided_review_request_is_rejected
        claim_type: Cross-reference link
        grounds:
          - "endpoints[POST /arbitrations]"
          - "validations[priority=12]"
          - "errors[ERR_EMPLOYER_PLAN_MISMATCH]"
        distinguishing_aspect: |
          Both body ids exist and both pass their own tier: the assessment is the caller's
          own and the request really is DECIDED, so the 404 tier at priority 5, the
          ownership tier at priority 6 and the referential tier at priority 10 are all
          satisfied. Only the pairing is wrong. Without the priority-12 cross-check, an
          employer whose own review window lapsed could borrow a sibling employer's decided
          request as a gateway to arbitration.
