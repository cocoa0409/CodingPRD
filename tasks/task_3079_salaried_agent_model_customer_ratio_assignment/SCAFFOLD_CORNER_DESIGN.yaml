              as: OperationsCoordinator
              captures: { client_a: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cancels", email: "cancels@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_b: $.data.id }
            - call: "POST /clients/${client_a}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_b}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_a}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_a: $.data.id }
            - call: "POST /transactions/${tx_a}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 75000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx_a}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /clients/${client_b}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_b: $.data.id }
          trigger:
