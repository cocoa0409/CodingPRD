            - { call: "POST /wt/assets/${c6a_asset}/commission", payload: {}, as: WaterChemist }
            - call: "POST /wt/test-routes"
              payload: { account_id: "${c6a_acct}", route_name: "BND-R" }
              as: WaterChemist
              captures: { c6a_rt: $.data.id }
            - call: "POST /wt/test-routes/${c6a_rt}/stops"
              payload: { asset_id: "${c6a_asset}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", sequence_index: 1 }
              as: WaterChemist
              captures: { c6a_st1: $.data.id }
            - call: "POST /wt/test-routes/${c6a_rt}/stops"
              payload: { asset_id: "${c6a_asset}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T12:00:00Z", sequence_index: 2 }
              as: WaterChemist
              captures: { c6a_st2: $.data.id }
            - { call: "POST /wt/test-routes/${c6a_rt}/publish", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${c6a_st1}/arrive", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${c6a_st2}/arrive", payload: {}, as: WaterChemist }
