  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: golfer_calendar_halfopen_overlap_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_GOLFER_TIME_CONFLICT]
          - entities.TeeTime.fields.start_utc
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN occupancy [start, start+12min) on the golfer's calendar
          (resource = TeeTime slots a single golfer holds). A second slot starting exactly 12 minutes
          after the first (back-to-back adjacency) is ALLOWED; a slot starting 6 minutes after collides.
          Distinct from the buffered tee-sheet rule.
        test_recipe:
          setup:
            - "Course; GA CONFIRMED on slot at 09:00. A second slot at 09:06 (overlaps the 12-min window) should be rejected for GA; a third at 09:12 (adjacent) is allowed."
            - "Clock 2026-06-01T00:00:00Z. Slots are TEE_INTERVAL_MINUTES(8)-spaced? No — use SEPARATE courses to avoid tee-sheet spacing interfering; the conflict is on the golfer, not the course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "CalCourseA", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_a: $.data.id }
            - call: "POST /golf/courses"
              payload: { name: "CalCourseB", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_b: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_a}", start_utc: "2026-06-12T09:00:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt1: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_b}", start_utc: "2026-06-12T09:06:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt2: $.data.id, v2: $.data.version }
            - call: "POST /golf/tee-times/${tt1}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /golf/tee-times/${tt2}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v2}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_GOLFER_TIME_CONFLICT"

      - name: course_teesheet_buffer_spacing_conflict
        grounds:
          - validations[priority=14]
          - errors[ERR_TEE_INTERVAL_CONFLICT]
          - entities.TeeTime.fields.start_utc
        distinguishing_aspect: |
          Interval semantics: symmetric BUFFER/gap of TEE_INTERVAL_MINUTES(8) between TeeTimes on the
          SAME course (resource = Course tee sheet). A new slot strictly closer than 8 minutes to an
          existing slot is rejected; exactly 8 apart is allowed. Geometrically a gap test, not a
          half-open occupancy overlap, on a different resource entity (Course) than the golfer calendar.
        test_recipe:
          setup:
            - "Course with one TeeTime at 10:00. A second slot at 10:05 (5 < 8 min) on the same course must be rejected."
            - "Clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "SheetCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-13T10:00:00Z", local_hour: 10, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt1: $.data.id }
          trigger:
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-13T10:05:00Z", local_hour: 10, group_type: "FOURSOME" }
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TEE_INTERVAL_CONFLICT"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_then_promote_conserves_confirmed_seat_count
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.STANDBY_to_CONFIRMED
          - entities.TeeTime.fields.confirmed_count
          - entities.TeeTime.fields.capacity
        distinguishing_aspect: |
          Conserved quantity = slot seat occupancy: confirmed_count == count(Bookings with status==CONFIRMED)
          AND confirmed_count <= capacity at all times. A CONFIRMED cancel (forward) paired with the
          STANDBY promotion (compensating) leaves confirmed_count unchanged at 2 (capacity) with zero drift.
        test_recipe:
          setup:
            - "TWOSOME slot GA+GB CONFIRMED (confirmed_count=2=capacity); GC STANDBY. Cancel GA promotes GC."
            - "Clock 2026-06-01T00:00:00Z; PUBLIC golfers; OFF_PEAK local_hour=18 offpeak_fee_cents=5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "ConsCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GC", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gc: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-14T18:00:00Z", local_hour: 18, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { bk_b: $.data.id, v2: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gc}", expected_tee_time_version: "${v2}", join_standby: true }
              as: Golfer
              as_user_id: "${gc}"
              captures: { bk_c: $.data.id }
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
            - call: "GET /golf/tee-times/${tt_id}"
              payload: {}
              as: ProShop
          assert:
            - "TeeTime.${tt_id}.confirmed_count == 2"
            - "Booking.${bk_a}.status == CANCELLED"
            - "Booking.${bk_c}.status == CONFIRMED"

      - name: void_then_repost_conserves_provisional_index_value
        grounds:
          - state_machines.Score.POSTED_to_VOID
          - calculations.provisional_handicap_index
          - entities.Golfer.fields.provisional_handicap_index
        distinguishing_aspect: |
          Conserved quantity = the provisional Handicap Index over POSTED scores (a numeric invariant,
          different from seat count): voiding a score then re-posting an identical score (same AGS,
          course, played_on) restores provisional_handicap_index to its exact prior value with zero drift.
        test_recipe:
          setup:
            - "Course slope=113, rating=70.0. Golfer posts 3 scores AGS 80,82,84 -> diffs 10,12,14; provisional (n=3,k=1,adj=-2.0) = 10.0-2.0 = 8.0."
            - "Void the AGS-82 score (n=2 -> NULL), then re-post an identical AGS-82 score -> back to n=3, provisional 8.0."
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "InvCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 10000, offpeak_fee_cents: 6000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "Inv Golfer", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-05-01", adjusted_gross_score: 80 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-05-08", adjusted_gross_score: 82 }
              as: ProShop
              captures: { s_mid: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-05-15", adjusted_gross_score: 84 }
              as: ProShop
            - call: "POST /golf/scores/${s_mid}/void"
              payload: {}
              as: ProShop
          trigger:
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-05-08", adjusted_gross_score: 82 }
              as: ProShop
            - call: "GET /golf/golfers/${g_id}"
              payload: {}
              as: ProShop
          assert:
            - "Golfer.${g_id}.provisional_handicap_index == 8.0"
