            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "PP", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
          trigger:
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-04-30T09:00:00Z", window_end: "2026-04-30T11:00:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_PICKUP_WINDOW_PAST"]

      - name: error_pickup_too_early_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_PICKUP_TOO_EARLY]"]
        distinguishing_aspect: "Starting a courier run before window_start - 1h fails with ERR_PICKUP_TOO_EARLY."
        test_recipe:
          setup: ["HOME_PICKUP order; appointment with window 2026-05-02T09:00-11:00 (clock still 2026-05-01T00:00)"]
