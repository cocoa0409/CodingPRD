        distinguishing_aspect: "After recording a PASS data-wipe cert, the very next payout request on the same wipe-required ACCEPTED trade-in succeeds in the same flow (immediate consistency)."
        test_recipe:
          setup: ["SMARTPHONE (wipe-required) trade-in ACCEPTED at 60000; PASS data-wipe cert recorded; then ACH payout."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: ["SMARTPHONE"], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cm1@x.com", full_name: "CM1" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "FLAWLESS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FLAWLESS", verified_defects: [], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/data-wipe"
              payload: { method: "NIST_PURGE", result: "PASS" }
              as: GradingAgent
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/payouts"
              payload: { method: "ACH" }
              as: FinanceOperator
              captures: { payout_id: $.data.id }
          assert:
            - "TradeIn.${ti_id}.status == PAID"
            - "GET /trade-ins/${ti_id}/payouts -> Payout.amount_cents == 60000 and Payout.status == PAID"
