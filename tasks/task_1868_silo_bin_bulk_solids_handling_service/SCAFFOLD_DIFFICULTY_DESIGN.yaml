              as: ServiceManager
              captures: { err10a: $.data.error_id }
            - call: "POST /service-tickets/${tb}/schedule"
              payload: { technician_id: "${tt6}", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }
              as: ServiceManager
              captures: { err10b: $.data.error_id }
          assert:
            - "Overlapping window on held site: error_id == ERR_TECHNICIAN_DOUBLE_BOOKED (temporal priority 8 beats fiscal priority 9)"
            - "Non-overlapping window on held site: error_id == ERR_CREDIT_HOLD"
            - "Ticket ${tb} remains APPROVED after both rejections"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: reorder_point_inclusive_trigger_boundary
        grounds:
          - calculations.reorder_quantity
          - entities.Vessel.fields.reorder_point_pct
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /level-readings: level_pct exactly
          equal to reorder_point_pct (30.0) triggers an order (<= semantics)
          with quantity 60.0 t, while 30.1 triggers none.
        test_recipe:
          setup:
            - "Site S10. Vessels VM and VN, both capacity 100, reorder_point_pct 30, target_fill_pct 90, TARGET_FILL."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Ten", state_code: "NE" }
              as: ServiceManager
              captures: { s10: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s10}", name: "SILO-M", vessel_kind: "SILO", capacity_tons: 100, material_name: "wheat", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vm: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s10}", name: "SILO-N", vessel_kind: "SILO", capacity_tons: 100, material_name: "wheat", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vn: $.data.id }
          trigger:
            - call: "POST /level-readings"
              payload: { vessel_id: "${vm}", measured_at: "2026-08-02T00:00:00Z", level_pct: 30.0 }
              as: PlantOperator
              as_user_id: "${s10}"
            - call: "POST /level-readings"
              payload: { vessel_id: "${vn}", measured_at: "2026-08-02T00:00:00Z", level_pct: 30.1 }
              as: PlantOperator
              as_user_id: "${s10}"
          assert:
            - "GET /replenishment-orders?vessel_id=${vm} returns total_count == 1, order_quantity_tons == 60.0 (90 - 30.0)"
            - "GET /replenishment-orders?vessel_id=${vn} returns total_count == 0 (30.1 > 30 does not trigger)"

      - name: calibration_tolerance_inclusive_pass_boundary
        grounds:
          - calculations.calibration_error_pct
          - entities.ScaleCalibration.fields.tolerance_pct
        distinguishing_aspect: |
          Numeric boundary on a DIFFERENT metric (scale error pct vs inventory
          level pct) reachable through a DIFFERENT endpoint (POST
          /scale-calibrations): |error_pct| exactly equal to tolerance 0.25
          passes (<= semantics); 0.255 fails.
        test_recipe:
          setup:
            - "Site S11. Vessel VO error_basis OF_READING, scale IN_TOLERANCE."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Eleven", state_code: "NE" }
              as: ServiceManager
              captures: { s11: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s11}", name: "SILO-O", vessel_kind: "SILO", capacity_tons: 100, material_name: "oats", reorder_point_pct: 30, error_basis: "OF_READING" }
              as: ServiceManager
              captures: { vo: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Cal Two", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttd: $.data.id }
          trigger:
            - call: "POST /scale-calibrations"
              payload: { vessel_id: "${vo}", tested_at: "2026-08-02T00:00:00Z", test_weight_tons: 20.0, indicated_tons: 20.05 }
              as: Technician
              as_user_id: "${ttd}"
              captures: { e11a: $.data.error_pct, r11a: $.data.result }
            - call: "POST /scale-calibrations"
              payload: { vessel_id: "${vo}", tested_at: "2026-08-03T00:00:00Z", test_weight_tons: 20.0, indicated_tons: 20.051 }
              as: Technician
              as_user_id: "${ttd}"
              captures: { e11b: $.data.error_pct, r11b: $.data.result }
          assert:
            - "First calibration error_pct == 0.250 and result == PASS (0.05/20.0 x 100 = 0.250 <= 0.25 inclusive)"
            - "Second calibration error_pct == 0.255 and result == FAIL (0.051/20.0 x 100 = 0.255 > 0.25)"
            - "GET /vessels/${vo} shows scale_status == OUT_OF_TOLERANCE after the second calibration"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_issue_blocked_by_dispatched_inbound_order
        grounds:
          - state_machines.EntryPermit.DRAFT_to_ISSUED
          - entities.ReplenishmentOrder.fields.status
          - errors[ERR_INBOUND_DELIVERY_PENDING]
        distinguishing_aspect: |
          Entity pair EntryPermit -> ReplenishmentOrder: a permit cannot be
          issued while any DISPATCHED order targets the same vessel (engulfment
          control), even though every permit-local precondition passes.
        test_recipe:
          setup:
            - "Site S12. Vessel VP capacity 100 reorder 30 target 90 TARGET_FILL. Reading 25.0 auto-created an order; order DISPATCHED. Entry-requiring ticket APPROVED; permit P12 in DRAFT."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Twelve", state_code: "NE" }
              as: ServiceManager
              captures: { s12: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s12}", name: "SILO-P", vessel_kind: "SILO", capacity_tons: 100, material_name: "wheat", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vp: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Seven", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt7: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vp}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${s12}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vp}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { o12: "$.data[0].id" }
            - call: "POST /replenishment-orders/${o12}/dispatch"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets"
              payload: { site_id: "${s12}", vessel_id: "${vp}", job_type: "CLEANOUT", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { t12: $.data.id }
            - call: "POST /service-tickets/${t12}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t12}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s12}"
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vp}", ticket_id: "${t12}", entrant_technician_id: "${tt7}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: SafetyOfficer
              captures: { p12: $.data.id }
          trigger:
            - call: "POST /entry-permits/${p12}/issue"
