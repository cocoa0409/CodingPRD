            - call: "POST /gift-cards/${gc}/top-up"
              payload: { amount_cents: 1000, expected_gift_card_version: "${gc_v}" }
              as: VenueManager
              captures: { gc_v_now: $.data.version }
          trigger:
            - call: "POST /gift-cards/${gc}/top-up"
              payload: { amount_cents: 1000, expected_gift_card_version: "${gc_v_now} - 1" }
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"

