  - section: cross_cutting_layers
    instances:
      - name: amend_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[merger-amend-stale-version]
        distinguishing_aspect: "OCC on MergerApplication.version: a first amend carrying the observed version succeeds and bumps version to 2; a second amend still carrying the stale observed version is refused ERR_STALE_VERSION (412) — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "Carriers CSXT, NSOR; merger M1 (scores 80,70,60) in COMMENT_PERIOD, version 1 observed at creation."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c_csxt: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "NSOR", legal_name: "Northern & Southern Railway", carrier_class: "II", base_route_miles: 640 }
              as: PlatformAdmin
              captures: { c_nsor: $.data.id }
            - call: "POST /stb/merger-applications"
              payload: { acquiring_carrier_id: "${c_csxt}", target_carrier_id: "${c_nsor}", transaction_value_cents: 900000000, competition_preservation_score: 80, service_reliability_score: 70, shipper_impact_score: 60 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { m1: $.data.id, m1_v: $.data.version }
          trigger:
            - call: "POST /stb/merger-applications/${m1}/amend"
              payload: { expected_merger_application_version: "${m1_v}", shipper_impact_score: 62 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { m1_v2: $.data.version }
            - call: "POST /stb/merger-applications/${m1}/amend"
              payload: { expected_merger_application_version: "${m1_v}", shipper_impact_score: 64 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { err: $.data.error_id }
          assert:
            - "first amend: http 200, MergerApplication.${m1}.version == 2, public_interest_score == 71.60"
            - "second amend (stale observed version): err == ERR_STALE_VERSION and http status 412"
            - "MergerApplication.${m1}.shipper_impact_score == 62 (the failed amend wrote nothing)"

