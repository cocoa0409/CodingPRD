      - name: settle_effects_are_visible_in_the_same_request_chain
        claim_type: immediate
        grounds:
          - state_machines.Settlement.transitions.APPROVED_to_SETTLED
          - entities.CapacityOwner.fields.maintenance_balance_cents
          - complexity_profile.consistency_model
        distinguishing_aspect: "The consistency model is immediate, so the settle's effects are readable without any delay: the load is SETTLED, the BCO's maintenance balance has moved and the settlement row reports SETTLED, all on reads issued right after the settle returns."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent and one QUALIFIED_CLEAR non-enrolled BCO with a COMPLETED trip and an approved FINAL settlement."
