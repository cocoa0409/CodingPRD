            - "BudgetLedgerEntry.${led_co}.reversed == true"
            - "BudgetLedgerEntry.${led_co}.amount_cents == 200000000"
            - "AttractionProject.${proj}.committed_cost_cents == 3080000000"
            - "AttractionProject.${proj}.forecast_cost_cents == 3080000000"
            - "AttractionProject.${proj}.readiness_posture == OPEN"
