              as: Intruder
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 AND response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_unit_version_on_agreement_activate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-activate-stale-unit]", "errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bed_single_occupancy_overlap_capacity_one
          rationale: "The bed-overlap §1.8 instance already drives a stale-unit-version activate path; this OCC corner is its mechanism."

      - name: occ_stale_resident_version_on_finalize
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assessment-finalize-stale-resident]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Finalizing an assessment with an expected_resident_version one behind the resident's actual version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A resident with two DRAFT assessments; the first finalize bumps Resident.version, so the second finalize carrying the pre-bump version is stale."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "OccF", state_code: "CA", license_number: "CA-600", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Occ Otto", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt1_id: $.data.id }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 3, adl_dressing: 3, adl_toileting: 3, adl_transferring: 3, adl_eating: 3, cognition_score: 1, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt2_id: $.data.id }
            - call: "POST /assessments/${asmt1_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
          trigger:
            - call: "POST /assessments/${asmt2_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412 AND response.data.error_id == ERR_STALE_VERSION"
            - "Assessment.${asmt2_id}.status == DRAFT (unchanged)"

      - name: occ_version_increments_on_facility_license_action
        claim_type: optimistic_concurrency
        grounds: [entities.Facility.fields.version, state_machines.Facility.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "A successful license-action with the correct expected_facility_version succeeds and increments Facility.version from 1 to 2."
        test_recipe:
          setup: ["A fresh ACTIVE facility (version 1)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "VerF", state_code: "CA", license_number: "CA-601", care_point_rate_cents: 2000 }
              as: ComplianceOfficer
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
          trigger:
            - call: "POST /facilities/${fac_id}/license-action"
              payload: { action: "SUSPEND", expected_facility_version: "${fac_v0}" }
              as: ComplianceOfficer
          assert:
            - "Facility.${fac_id}.license_status == SUSPENDED AND version == 2"

      - name: license_suspended_blocks_admission
        claim_type: derived_field_reconciliation
        grounds: ["validations[priority=13]", "errors[ERR_LICENSE_SUSPENDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / admit_state_vs_license_safety_conflict
          rationale: "The license-suspended admission block is the lower-priority leg of the named §1.8 priority-conflict instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: occupancy_recompute_visible_same_request
        claim_type: immediate
        grounds: [calculations.facility_occupancy, entities.Facility.fields.occupancy_rate_bps]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / admit_depends_on_unit_reserved_and_facility_active
          rationale: "Immediate visibility of occupancy_rate_bps == 10000 after admit is already asserted in the named §1.8 instance."
