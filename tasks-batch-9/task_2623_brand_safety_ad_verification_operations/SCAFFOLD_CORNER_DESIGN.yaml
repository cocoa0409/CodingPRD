            - "REJECTED branch: MeasurementBatch.${batch_b}.settlement_status == CLOSED_NO_CREDIT and ${batch_a} is still CREDITED"
            - "REJECTED branch leaves the ledgers at 1487 / 1487 and settled_claim_count at 1"
            - "Campaign.${camp_id}.open_claim_count == 0 after both forks (decremented once per fork, not recomputed)"

      # ---- corners already covered in depth by §1.8 --------------------------
      - name: quarantine_threshold_cascade_stales_lists_and_segments
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: third_quarantine_restricts_publisher_stales_list_and_segment
          rationale: |
            The certify -> Publisher RESTRICTED -> InventoryList STALE ->
            PreBidSegment STALE cascade, including the boundary at exactly the
            third quarantine and the requirement that only ALLOW/PUBLISHER
            entries stale their list, is exercised end to end by that §1.8
            instance.

      - name: methodology_suspension_decertifies_pinned_batches
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: methodology_suspension_decertifies_batch_remediates_campaign_stales_segment
          rationale: |
            The audit-conclusion SUSPENDED hop and its cross-entity reach into
            every pinned MeasurementBatch, the campaign's coverage_status and
            the dependent segment are covered there, including the
            recomputation of campaign coverage after decertification.

      - name: ivt_retraction_reverses_every_confirm_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: ivt_retract_restores_impression_conservation_with_no_drift
          rationale: |
            Retraction as the exact inverse of confirmation - ivt_impressions,
            ivt_rate, sophistication_flag and net_billable_impressions all
            restored with no rounding drift - is the whole subject of that
            §1.8 instance.

      - name: claim_reversal_restores_the_two_credit_ledgers
        claim_type: compensation
        excluded_because:
          difficulty_instance: claim_reversal_unwinds_both_credit_ledgers_symmetrically
          rationale: |
            REVERSED unwinding both ledgers by the same amount, restoring
            settled_claim_count and returning cited batches to UNBILLED while
            retaining the frozen money fields as an audit record, is covered
            there.

      - name: parallel_scoring_and_settlement_dimensions_are_independent
        claim_type: parallel
        excluded_because:
          difficulty_instance: batch_scoring_and_settlement_dimensions_advance_independently
          rationale: |
            The two-dimension MeasurementBatch machine - scoring_status and
            settlement_status advancing on unrelated triggers and combining
            into legal pairs like QUARANTINED/CREDITED - is that §1.8
            instance's subject.

      - name: appeal_round_cycle_terminates_at_three_rounds
        claim_type: cyclic
        excluded_because:
          difficulty_instance: appeal_negotiation_cycle_returns_to_filed_and_caps_at_three_rounds
          rationale: |
            The FILED -> MORE_EVIDENCE_REQUIRED -> FILED loop, round_no
            increments and the ERR_APPEAL_ROUNDS_EXHAUSTED termination boundary
            are exhaustively covered there.

  # =========================================================================
  # From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:

      - name: viewability_rejects_the_whole_in_view_claim_below_the_time_threshold
        claim_type: constants_applied
        grounds:
          - calculations.viewability_and_coverage
          - entities.MethodologyVersion.display_in_view_seconds
        distinguishing_aspect: |
          The in-view claim is accepted or rejected WHOLESALE against the
          pinned methodology's thresholds: 0.9 seconds against a 1.0-second
          requirement zeroes all 6000 in-view impressions rather than
          pro-rating them, and 1.0 exactly (>= , not >) accepts all 6000. Both
          batches must still satisfy INVARIANT_IMPRESSION_CONSERVATION, which
          forces non_viewable_impressions to absorb the rejected claim.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; VIEWABILITY methodology with display_in_view_seconds 1.0 and display_pixel_pct 0.5; DISPLAY campaign."
            - "Two batches on two different pages, identical except for avg_in_view_seconds: both measured 10000, measurable 8000, in_view 6000, avg_in_view_pixel_pct 0.6; batch LOW has avg_in_view_seconds 0.9, batch EXACT has 1.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
