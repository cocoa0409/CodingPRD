scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_tire_model_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.TireModel, endpoints]
        distinguishing_aspect: "POST /tire-models with all required fields returns 201 and echoes brand/size_token/unit_price_cents; stock_qty defaults from input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 14999, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 12 }
              as: InventoryManager
              captures: { tm_id: $.data.id, sq: $.data.stock_qty }
          assert:
            - "response.status == 201"
            - "TireModel.${tm_id}.stock_qty == 12"
            - "TireModel.${tm_id}.status == ACTIVE"

      - name: get_work_order_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.WorkOrder", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /work-orders/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: tire_model_default_mileage_warranty_zero_when_omitted
        claim_type: Defaults
        grounds: [entities.TireModel.fields.mileage_warranty_miles]
        distinguishing_aspect: "Omitting mileage_warranty_miles on POST /tire-models yields default 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tire-models"
              payload: { brand: "GENERIC", model_name: "BASIC", size_token: "195/65R15", load_index: 88, speed_rating: "T", unit_price_cents: 6000, original_tread_32nds: 9 }
              as: InventoryManager
              captures: { tm_id: $.data.id, mw: $.data.mileage_warranty_miles }
          assert:
            - "TireModel.${tm_id}.mileage_warranty_miles == 0"
            - "TireModel.${tm_id}.stock_qty == 0"

      - name: work_order_computed_money_fields_default_zero_on_create
        claim_type: Computed Fields
        grounds: [entities.WorkOrder.fields.total_due_cents, entities.WorkOrder.fields.fulfillment_status]
        distinguishing_aspect: "A freshly created DRAFT WorkOrder has total_due_cents==0, fulfillment_status==DRAFT, payment_status==UNPAID before approval runs pricing."
        test_recipe:
          setup: ["A Customer and a Vehicle they own."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E One", phone: "555-1001" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.fulfillment_status == DRAFT"
            - "WorkOrder.${wo_id}.payment_status == UNPAID"
            - "WorkOrder.${wo_id}.total_due_cents == 0"

      - name: system_fields_generated_on_customer_create
        claim_type: System Fields
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers returns server-minted id, created_at, version==1; client cannot set version."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "e2@x.com", full_name: "E Two", phone: "555-1002" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id, v: $.data.version }
          assert:
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.store_credit_cents == 0"

      - name: tire_model_invalid_speed_rating_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.TireModel.fields.speed_rating", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tire-models with speed_rating outside {S,T,H,V,W,Y} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tire-models"
              payload: { brand: "X", model_name: "Y", size_token: "235/45R18", load_index: 94, speed_rating: "Z", unit_price_cents: 10000, original_tread_32nds: 10 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: fitment_immutable_entity_only_id_created_at
        claim_type: Immutability
        grounds: [entities.FitmentRule]
        distinguishing_aspect: "FitmentRule has common_fields:false — its create response exposes id and created_at but no version field; there is no update endpoint."
        test_recipe:
          setup: ["A Vehicle and a TireModel."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e3@x.com", full_name: "E Three", phone: "555-1003" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "HONDA", model: "ACCORD", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 14999, original_tread_32nds: 10, stock_qty: 4 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
          trigger:
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
              captures: { fr_id: $.data.id }
          assert:
            - "response.status == 201"
            - "FitmentRule.${fr_id}.fitment_grade == OE_EXACT"

      - name: work_order_reference_vehicle_not_found_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.WorkOrder.fields.vehicle_id", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /work-orders citing a non-existent vehicle_id returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A Customer with no vehicles."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e4@x.com", full_name: "E Four", phone: "555-1004" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "00000000-0000-4000-8000-000000000001" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_work_orders_pagination_envelope
        claim_type: Listing
        grounds: [entities.WorkOrder, endpoints]
        distinguishing_aspect: "GET /work-orders returns a paginated array with total_count and has_more in the envelope."
        test_recipe:
          setup: ["A Customer with one DRAFT work order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e5@x.com", full_name: "E Five", phone: "555-1005" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "FORD", model: "FOCUS", model_year: 2019, oe_tire_size: "215/55R16", rim_diameter_in: 16, tpms_type: "INDIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
          trigger:
            - call: "GET /work-orders"
              payload: { customer_id: "${cust_id}", limit: 10, offset: 0 }
              as: ServiceAdvisor
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 1"
            - "response.data is an array of length 1"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: approve_from_already_approved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.WorkOrder.DRAFT_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second approve on an already-APPROVED order is rejected with ERR_INVALID_STATE (409); no double stock debit."
        test_recipe:
          setup: ["An APPROVED WorkOrder with one in-stock TIRE line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e6@x.com", full_name: "E Six", phone: "555-1006" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 14999, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 10 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TireModel.${tm_id}.stock_qty == 6"

      - name: cancel_from_terminal_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.WorkOrder.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED order returns ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["A CANCELLED (from DRAFT) WorkOrder."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e7@x.com", full_name: "E Seven", phone: "555-1007" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "MAZDA", model: "MX5", model_year: 2020, oe_tire_size: "205/45R17", rim_diameter_in: 17, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: add_line_to_approved_order_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.WorkOrderLine.PENDING_to_COMMITTED", "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adding a WorkOrderLine to an APPROVED (non-DRAFT) order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An APPROVED WorkOrder."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e8@x.com", full_name: "E Eight", phone: "555-1008" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 14999, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 10 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "ROTATION", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: special_order_receive_restocks_tire_model
        claim_type: Side Effect Execution
        grounds: [state_machines.SpecialOrder.ORDERED_to_RECEIVED, entities.TireModel.fields.stock_qty]
        distinguishing_aspect: "POST /special-orders/{id}/receive increments TireModel.stock_qty by requested_quantity (0 -> 4)."
        test_recipe:
          setup: ["A SpecialOrder ORDERED for a tire at stock 0, requested_quantity 4, against a DRAFT line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e9@x.com", full_name: "E Nine", phone: "555-1009" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "AUDI", model: "A6", model_year: 2022, oe_tire_size: "255/40R19", rim_diameter_in: 19, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "PIRELLI", model_name: "PZERO", size_token: "255/40R19", load_index: 100, speed_rating: "Y", unit_price_cents: 20000, mileage_warranty_miles: 30000, original_tread_32nds: 9, stock_qty: 0 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { line_id: $.data.id }
            - call: "POST /special-orders"
              payload: { work_order_line_id: "${line_id}", tire_model_id: "${tm_id}", requested_quantity: 4 }
              as: ServiceAdvisor
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_id}/receive"
              payload: {}
              as: InventoryManager
              captures: { st: $.data.status }
          assert:
            - "SpecialOrder.${so_id}.status == RECEIVED"
            - "TireModel.${tm_id}.stock_qty == 4"

      - name: special_order_branch_cancel_backorder_voids_draft_line
        claim_type: Side Effect Execution
        grounds: [state_machines.SpecialOrder.ORDERED_to_BACKORDER_CANCELLED, state_machines.WorkOrderLine.PENDING_to_VOID]
        distinguishing_aspect: "The fork branch cancel-backorder VOIDs the linked WorkOrderLine while its parent order is still DRAFT, and the deposit remains forfeited."
        test_recipe:
          setup: ["A SpecialOrder ORDERED against a DRAFT order's TIRE line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e10@x.com", full_name: "E Ten", phone: "555-1010" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "BMW", model: "X5", model_year: 2022, oe_tire_size: "275/45R20", rim_diameter_in: 20, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "LATITUDE", size_token: "275/45R20", load_index: 110, speed_rating: "Y", unit_price_cents: 25000, mileage_warranty_miles: 30000, original_tread_32nds: 10, stock_qty: 0 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { line_id: $.data.id }
            - call: "POST /special-orders"
              payload: { work_order_line_id: "${line_id}", tire_model_id: "${tm_id}", requested_quantity: 4 }
              as: ServiceAdvisor
              captures: { so_id: $.data.id, dep: $.data.deposit_cents }
          trigger:
            - call: "POST /special-orders/${so_id}/cancel-backorder"
              payload: {}
              as: InventoryManager
              captures: { st: $.data.status }
          assert:
            - "SpecialOrder.${so_id}.status == BACKORDER_CANCELLED"
            - "WorkOrderLine.${line_id}.line_status == VOID"

      - name: mileage_claim_reject_terminal
        claim_type: Valid Transition
        grounds: [state_machines.MileageWarrantyClaim.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "POST /mileage-claims/{id}/reject moves a SUBMITTED claim to terminal REJECTED with no payout."
        test_recipe:
          setup: ["A SUBMITTED MileageWarrantyClaim."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e11@x.com", full_name: "E Eleven", phone: "555-1011" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "PRIUS", model_year: 2021, oe_tire_size: "195/65R15", rim_diameter_in: 15, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "GENERIC", model_name: "ECO", size_token: "195/65R15", load_index: 88, speed_rating: "T", unit_price_cents: 7000, mileage_warranty_miles: 50000, original_tread_32nds: 10, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { line_id: $.data.id, wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
            - call: "POST /mileage-claims"
              payload: { work_order_line_id: "${line_id}", tire_model_id: "${tm_id}", measured_tread_32nds: 5, miles_driven: 10000, payout_method: "REFUND", claim_quantity: 4 }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /mileage-claims/${claim_id}/reject"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "MileageWarrantyClaim.${claim_id}.status == REJECTED"

      - name: approve_cancel_voids_active_road_hazard
        claim_type: Compensation
        grounds: [state_machines.RoadHazardWarranty.ACTIVE_to_VOID]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_approved_order_cascade_depth3
          rationale: "Road-hazard ACTIVE->VOID on order cancel is asserted within the depth-3 cascade §1.8 instance."

  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: special_order_deposit_pct_branch
        claim_type: Correct Result
        grounds: [calculations.special_order_deposit, entities.SpecialOrder.fields.deposit_cents]
