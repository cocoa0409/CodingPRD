      - name: metadata_completeness_precision_and_rounding_order
        claim_type: precision
        grounds:
          - calculations.metadata_completeness_score
        excluded_because:
          difficulty_instance: combinatorial_formula / metadata_completeness_round_each_contribution_then_sum_lands_at_8499
          rationale: "That instance pins the round-each-then-sum order and the 84.99 vs 85.00 difference, which is the only observable rounding claim this calculation makes."

      - name: priority_score_weighted_scoring_rounding_does_not_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.dataset_priority_score
        excluded_because:
          difficulty_instance: boundary_precision_check / priority_score_half_up_at_third_decimal
          rationale: "That instance asserts the half-up outcome of the exact weighted sum 48.8550, covering the weighted-scoring rounding claim."

      - name: settlement_tier_boundaries_each_tested
        claim_type: tiered_pricing
        grounds:
          - calculations.pipeline_run_settlement
        excluded_because:
          difficulty_instance: boundary_precision_check / settlement_discount_tier_boundary_at_subtotal_twenty
          rationale: "Tier B's inclusive lower edge (subtotal 20) and the no-discount band below it are both asserted there, and tier A's edge is asserted by combinatorial_formula / settlement_tier_keyed_on_pre_discount_subtotal."

      - name: credit_waterfall_fills_escrow_bucket_before_balance
        claim_type: waterfall_allocation
        grounds:
          - calculations.pipeline_run_settlement
          - calculations.pipeline_credit_escrow
        excluded_because:
          difficulty_instance: compensating_invariant / settlement_waterfall_conserves_department_credit_buckets
          rationale: "That instance asserts the 2.00 escrow draw followed by the 17.00 balance draw plus the three-bucket conservation."

      - name: priority_variant_divergence_delta
        claim_type: variant_divergence
        grounds:
          - calculations.dataset_priority_score
        excluded_because:
          difficulty_instance: dual_variant_calc / priority_score_declared_vs_observed_divergence_after_publish
          rationale: "That instance asserts both variants on the same row and their 26.50 delta."

      - name: reidentification_variant_switch_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.reidentification_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / reidentification_screening_vs_clearance_flips_aggregation_requirement
          rationale: "That instance asserts the SCREENING -> CLEARANCE switch and the resulting aggregation_required / min_aggregation_geography reconciliation."

      - name: currency_grace_thresholds_at_each_edge
        claim_type: threshold
        grounds:
          - calculations.dataset_currency_status
        excluded_because:
          difficulty_instance: boundary_precision_check / currency_aging_stale_breached_grace_boundaries
          rationale: "That instance walks days_overdue at grace, grace+1 and 2*grace+1 for the same dataset, which is the whole threshold ladder of this calculation."

      - name: issue_breach_flags_are_stamped_by_the_sweep_before_any_transition
        claim_type: chronological
        grounds:
          - calculations.quality_issue_sla_clock
          - entities.QualityIssue.fields.triage_breached
          - endpoints.POST /open-data/ops-run
        distinguishing_aspect: "Breach detection is a pure clock comparison against the anchor, independent of the workflow transitions: the sweep stamps triage_breached on a still-SUBMITTED issue, and the later triage neither clears the flag nor starts the correction clock, which stays null until acceptance."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Dataset 'weekly-traffic-counts' PUBLISHED under department DOT"
            - "One registered member files a MEDIUM / ACCURACY issue at 2026-08-01T00:00:00Z, so triage_due_at is created_at + TRIAGE_SLA_HOURS[MEDIUM] 72h = 2026-08-04T00:00:00Z"
            - "The clock is moved to 2026-08-05T00:00:00Z — one day past the triage deadline — and one sweep is run while the issue is still SUBMITTED"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
