            - call: "POST /membership/product-offerings"
              payload: { product_code: "AUTO_LOAN_P", product_line: "BANKING", product_name: "Auto Loan", allowed_categories: ["ENLISTED_ACTIVE", "VETERAN_HONORABLE"] }
              as: ProductAdministrator
              captures: { off_auto: $.data.id }
            - call: "POST /membership/members/${mo}/entitlements"
              payload: { product_offering_id: "${off_auto}", exposure_cents: 100 }
