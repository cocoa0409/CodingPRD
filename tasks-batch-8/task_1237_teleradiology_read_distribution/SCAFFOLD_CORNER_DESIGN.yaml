            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-SD", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "SD" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad1}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg1: $.data.id } }
