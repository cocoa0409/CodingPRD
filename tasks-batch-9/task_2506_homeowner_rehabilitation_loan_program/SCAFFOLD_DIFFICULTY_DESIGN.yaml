            - call: "POST /rehab/bid-solicitations/${sol_c_id}/award"
              payload: { bid_id: "${bid_c_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "award B: HTTP 409 with error_id ERR_CONTRACTOR_CAPACITY_CONFLICT (buffered windows 2026-09-02..2026-11-02 and 2026-11-02..2026-11-28 touch on 2026-11-02)"
            - "award B leaves BidSolicitation.${sol_b_id}.status == TABULATED, award_bid_id == null and RehabApplication.${app_b_id}.workflow_state == BID_OPEN"
            - "award C: HTTP 200 with BidSolicitation.${sol_c_id}.status == AWARDED and award_bid_id == ${bid_c_id}"
            - "Contractor.${c1_id}.active_award_count == 2 after award C (A and C do not overlap once buffered)"
            - "Bid.${bid_a_id}.status == AWARDED and Bid.${bid_b_id}.status == RESPONSIVE and Bid.${bid_c_id}.status == AWARDED"
            - "RehabApplication.${app_c_id}.awarded_contractor_id == ${c1_id}"

  - rule_id: compensating_invariant
    instances:
      - name: program_year_money_triad_is_conserved_across_lien_draws_and_close_out_release
        grounds:
          - calculations.program_year_budget_rollup
          - calculations.draw_payment_and_retainage
          - entities.ProgramYear.fields.committed_amount_cents
          - entities.ProgramYear.fields.disbursed_amount_cents
          - entities.ProgramYear.fields.uncommitted_amount_cents
          - state_machines.RehabLoan.DISBURSING_to_SERVICING
          - entities.RehabLoan.fields.retainage_held_cents
        distinguishing_aspect: |
          The conserved quantity is money in cents: allocation_budget_cents + program_income_balance_cents
          must equal uncommitted + committed + disbursed at every checkpoint, and the compensating leg
          is the close-out release of the 200,000 unspent commitment (principal 3,225,000 against
          disbursed 3,025,000), which also rewrites the loan's principal and recomputes the amortizing
          payment from 31,141 to 29,210. Retainage moves inside the loan without ever leaving the
          triad unbalanced.
        test_recipe:
          setup:
            - "ProgramYear 2026 with allocation_budget_cents 50,000,000 and program_income_balance_cents 0"
            - "one CLEAR RehabApplication (built 1995, not historic) whose approved write-up holds a 2,800,000 HEALTH_SAFETY line and a 200,000 CODE line, so base 3,000,000, contingency 300,000 and total_estimate_cents 3,300,000"
            - "contractor c1's 3,200,000 bid is inside the responsive window 2,475,000 to 3,630,000 and has been awarded"
            - "the loan is AMORTIZING at 300 bps over 120 months: approved_project_cost_cents 3,200,000, lien_recording_fee_cents 25,000, principal_cents 3,225,000, monthly_payment_cents 31,141"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/contractors"
              payload: { legal_name: "Acme Rehab LLC", license_number: "LIC-1001", insurance_expires_on: "2029-06-30", lead_safe_certified: true, historic_qualified: true }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 2, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "60 Millrace Rd", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 18000000, senior_lien_balance_cents: 11000000, historic_district: false, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id }
            - call: "POST /rehab/applications/${app_id}/verify-ownership"
              payload: { deed_recorded_date: "2015-04-12", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp1_id: $.data.id }
            - call: "POST /rehab/inspections/${insp1_id}/record-result"
              payload: { result: "FAIL", deficiency_count: 4, xrf_reading_mg_cm2: 0.1 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /rehab/applications/${app_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { app_v: $.data.version }
            - call: "POST /rehab/write-ups"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: RehabSpecialist
