      - Store.${s2}.version advanced on the archive mutation
  - name: epoch_advance_resets_only_aged_stores
    claim_type: rate_threshold_triggers
    grounds:
    - complexity_profile.complexity_layers
    - endpoints.POST_/commercial/_epoch/advance
    - entities.Store.fields.capacity_epoch_at
    distinguishing_aspect: The daily roll resets only stores whose epoch is at least 24 hours old, so stores already inside the current day keep their committed count.
    test_recipe:
      setup:
      - Logical clock set; two stores created at the default epoch of 2026-09-01T00:00:00Z, then committed against differently.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T12:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Epoch One
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s1: $.data.id
      - call: POST /commercial/stores
        payload:
          store_code: S200
          name: Epoch Two
          store_type: SATELLITE
          delivery_radius_miles: 6.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s2: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-N
          description: Part N
          line_code: IGN
          list_price_cents: 1000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_n: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s1}
          part_id: ${p_n}
          on_hand_units: 10
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Epoch Garage
          tax_id: TX-C021
          billing_address: 1 Epoch St
          home_store_id: ${s1}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: STORE_PICKUP
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_n}
            quantity: 3
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
          acct_v1: $.data.version
      - call: POST /commercial/part-orders/${ord}/confirm
        payload:
          expected_order_version: ${ord_v}
          expected_account_version: ${acct_v1}
        as: CommercialSalesRep
      trigger:
      - call: POST /commercial/_epoch/advance
        payload:
          to_iso8601: '2026-09-03T00:00:00Z'
        as: PlatformAdmin
      assert:
      - Store.${s1} and Store.${s2} were both created after the clock moved, so both carry an epoch of 2026-09-02T12:00:00Z rather than the 2026-09-01 startup default
      - the advance to 2026-09-03T00:00:00Z is only 12 hours after the creation epoch, so neither store is reset and committed_units_today stays 3 at Store.${s1}
      - Store.${s2}.committed_units_today stays 0 because nothing was ever committed there
      - a further advance to 2026-09-04T00:00:00Z is more than 24 hours after 2026-09-02T12:00:00Z, so both stores reset and Store.${s1}.committed_units_today becomes 0 with capacity_epoch_at 2026-09-04T00:00:00Z
  - name: order_create_occ_rejects_a_stale_account_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[order-create-stale-account]
    - errors[ERR_STALE_ACCOUNT_VERSION]
    distinguishing_aspect: 'Two strictly sequential creates against the same account: the second one carrying the first request''s version is rejected with 412, and re-reading the account makes the retry succeed.'
    test_recipe:
      setup:
      - Logical clock set; satellite stocks p_o; account A exists.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Occ Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-O
          description: Part O
