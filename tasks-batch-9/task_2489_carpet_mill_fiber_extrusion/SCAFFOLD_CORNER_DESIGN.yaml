            - "the allocate returns HTTP 200 with CutOrder.${co}.allocated_yards == 100.0"
            - "the cut returns HTTP 200 with CutOrder.${co}.status == CUT and RollGood.${rg}.inventory_status == DEPLETED"
            - "no remnant child roll was minted (the residual is exactly 0.0)"
            - "the SCRAP disposition returns HTTP 409 with error.error_id == ERR_ROLL_ALREADY_DEPLETED and RollGood.${rg}.qa_status == PASSED"
            - "the second reclamation create returns HTTP 201 with ReclamationBatch.${rb}.status == RECEIVED and source_roll_good_id == ${rg}"

  # ===========================================================================
  # SECTION 7 — RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_operations
        claim_type: role_allowed
        grounds:
          - roles.MillPlanner
          - roles.ExtrusionOperator
          - roles.DyeHouseOperator
          - roles.PlantAdmin
        distinguishing_aspect: |
          The allow-lists are exercised positively in one fixture: the planner curates the catalogue
          and registers a tufter, the extrusion operator receives polymer and spins it, the dye-house
          operator registers a vessel, and only PlantAdmin moves the logical clock. Every call returns
          a success code, so later denial tests cannot be passing for the wrong reason.
        test_recipe:
          setup:
            - "Empty database at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-PD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-01", vessel_type: "BECK", capacity_kg: 2000.0 }
              as: DyeHouseOperator
              captures: { dv: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
