              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "7 Alley Ct", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 140 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "NOT_SERVICEABLE", not_serviceable_reason: "NO_ROW_ACCESS" }
              as: ProgramManager
              captures: { reason: $.data.not_serviceable_reason, determined_at: $.data.serviceability_determined_at }
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "GIGABIT_1000", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_ADDRESS_NOT_SERVICEABLE"
            - "${reason} == NO_ROW_ACCESS and ${determined_at} == 2026-08-01T00:00:00Z"
            - "BuildZone.${z1}.provisional_qualifying_count == 0 and prereg_rate_pct == 0.00"
            - "Account.${acct1}.deposit_held_cents == 0"

      - name: extension_beyond_the_campaign_limit_is_refused_and_the_grant_is_policy_driven
        claim_type: Violation → Error
        grounds:
          - validations[priority 27 ERR_EXTENSION_LIMIT_REACHED]
          - entities.Campaign.fields.extension_grant_days
          - endpoints["POST /build-zones/{id}/extend-deadline"]
        distinguishing_aspect: "The client supplies no date at all: the first extension adds exactly the campaign's 30 grant days to 2026-09-30T23:59:00Z, and with max_deadline_extensions 1 the second call is refused with the deadline, extension_count and cumulative_extension_days all frozen at their post-first-extension values."
        test_recipe:
          setup:
            - "One campaign with max_deadline_extensions 1 and extension_grant_days 30, closing 2026-09-30T23:59:00Z."
            - "One zone inheriting that deadline, still inside its window at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000, max_deadline_extensions: 1, extension_grant_days: 30 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
          trigger:
            - call: "POST /build-zones/${z1}/extend-deadline"
              payload: {}
              as: ProgramManager
              captures: { deadline_1: $.data.prereg_deadline_at, count_1: $.data.extension_count, cumulative_1: $.data.cumulative_extension_days, status_1: $.data.campaign_status }
            - call: "POST /build-zones/${z1}/extend-deadline"
              payload: {}
              as: ProgramManager
          assert:
            - "${deadline_1} == 2026-10-30T23:59:00Z, ${count_1} == 1, ${cumulative_1} == 30, ${status_1} == PREREG_EXTENDED"
            - "the second call is HTTP 409 with data.error_id == ERR_EXTENSION_LIMIT_REACHED"
            - "BuildZone.${z1}.prereg_deadline_at is still 2026-10-30T23:59:00Z with extension_count 1 and cumulative_extension_days 30"

      - name: window_closed_outranks_the_duplicate_check
