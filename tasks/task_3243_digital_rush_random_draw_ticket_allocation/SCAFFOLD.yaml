# =============================================================================
# PRD Benchmark Scaffold — task_3243_digital_rush_random_draw_ticket_allocation
# Domain: digital rush / random-draw ticket allocation for a theatre ticketing
# platform (production partnerships, daily rush quantities, draw entry windows,
# winner purchase deadlines, in-person concierge handoff, box-office
# reconciliation, dynamic pricing on non-discount inventory).
# =============================================================================

scenario: |
  Digital Rush & Random Draw Ticket Allocation (TodayTix): production partnerships
  allocating discounted rush and draw inventory with daily quantities, draw entry
  windows with one-entry-per-person controls and winner notification with short
  purchase deadlines, rush inventory release timing with queue management during
  demand spikes, mobile ticket delivery and in-person concierge handoff models by
  market, inventory reconciliation with the box office to prevent double-selling of
  held seats, dynamic pricing on non-discount inventory alongside promotional
  allocations, refund and exchange policy differing by production and ticket type,
  demand data shared with producers to shape future allocations.

domain_name: digital-rush-draw-allocation
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - ops_run_checkpoint
    - idempotency
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga
  difficulty_target: expert
  entity_count: 12
  state_machine_count: 11
  calculation_count: 12
  validation_count: 20
  endpoint_count: 40
  error_code_count: 30
  role_count: 10

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Production title"
      - name: producer_org
        type: string
        source: input
        description: "Producing organisation name"
      - name: status
        type: enum
        source: system
        description: "DRAFT | ACTIVE | SUSPENDED | CLOSED"
        constraints: "enum {DRAFT, ACTIVE, SUSPENDED, CLOSED}; initial DRAFT"
      - name: refund_window_hours
        type: integer
        source: input
        description: "Hours before performance start within which a RUSH ticket is still refundable"
        constraints: ">= 0; default 0 means non-refundable"
      - name: exchange_fee_cents
        type: integer
        source: input
        description: "Flat fee charged on an approved ticket exchange"
        constraints: ">= 0"
      - name: exchange_allowed
        type: boolean
        source: input
        description: "Whether ticket exchange is offered at all for this production"
        default: false
      - name: version
        type: integer
        source: system
        description: "OCC version on the partnership agreement; guards allocation release and reconciliation"

  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: market_code
        type: string
        source: input
        description: "Market identifier, e.g. NYC, LDN, CHI"
        constraints: "globally unique"
      - name: city
        type: string
        source: input
        description: "City name for display"
      - name: handoff_model
        type: enum
        source: input
        description: "MOBILE_PUSH | CONCIERGE_DESK | HYBRID"
        constraints: "enum {MOBILE_PUSH, CONCIERGE_DESK, HYBRID}; immutable after creation"

  - name: Performance
    parent: Production
    common_fields: true
    fields:
      - name: market_code
        type: string
        source: input
        description: "Market this performance is sold in, e.g. NYC; matched against Market.market_code to resolve the handoff model"
        constraints: "must equal the market_code of a declared Market"
      - name: venue_name
        type: string
        source: input
        description: "Venue display name"
      - name: starts_at
        type: datetime
        source: input
        description: "Performance start, ISO 8601 UTC, three fractional digits"
      - name: face_value_cents
        type: integer
        source: input
        description: "Non-discount list price for a standard seat, in cents"
        constraints: "> 0"
      - name: total_seat_capacity
        type: integer
        source: input
        description: "All seats the venue makes available to the platform for this performance"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | ONSALE | CLOSED | CANCELLED"
        constraints: "enum {SCHEDULED, ONSALE, CLOSED, CANCELLED}; initial SCHEDULED"
      - name: version
        type: integer
        source: system
        description: "OCC version; guards rush release, draw activation and reconciliation"

  - name: RushAllocation
    parent: Performance
    common_fields: true
    fields:
      - name: ticket_type
        type: enum
        source: input
        description: "Ticket class this allocation dispenses"
        constraints: "enum {RUSH, RUSH_PREMIUM, DRAW, STANDARD}"
      - name: daily_quantity
        type: integer
        source: input
        description: "Seats the producer grants the platform each release day"
        constraints: "> 0; immutable once the allocation leaves DRAFT"
      - name: discount_pct
        type: number
        source: input
        description: "Discount off face_value_cents applied to this allocation's tickets"
        constraints: "0 <= discount_pct <= 1; STANDARD tickets require exactly 0"
      - name: release_time_local
        type: string
        source: input
        description: "HH:MM local release time used to derive release_at on each epoch date"
        constraints: "HH:MM, 00:00 <= value <= 23:59 in the Performance market timezone"
      - name: refundable
        type: boolean
        source: input
        description: "Whether tickets from this allocation may be refunded at all"
      - name: quantity_released_today
        type: integer
        source: computed
        description: "Seats released in the current release epoch"
      - name: quantity_sold_today
        type: integer
        source: computed
        description: "Seats from this allocation sold in the current release epoch"
      - name: quantity_carried_forward
        type: integer
        source: computed
        description: "Unsold remainder from the previous release epoch"
      - name: daily_release_cap
        type: integer
        source: computed
        description: "Computed release ceiling: smallest of daily_quantity, remaining committed stock and the market share cap"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the allocation grant"
        constraints: "enum {DRAFT, SCHEDULED, RELEASED, EXHAUSTED, SUSPENDED, CLOSED}; initial DRAFT"
      - name: qa_checked_by
        type: string
        source: system
        description: "X-User-ID of the AllocationsCoordinator who attested quantities; must differ from released_by"
      - name: released_by
        type: string
        source: system
        description: "X-User-ID of the OpsManager who authorised release; must differ from qa_checked_by"
      - name: reconcile_deadline_at
        type: datetime
        source: system
        description: "Instant the box office must have supplied its seat figure by; stamped when the allocation is released"
      - name: reconciliation_status
        type: enum
        source: system
        description: "Box-office reconciliation posture for the current period"
        constraints: "enum {NOT_SUBMITTED, RECONCILED, MISMATCH}; initial NOT_SUBMITTED"
      - name: reconciliation_variance_count
        type: integer
        source: computed
        description: "seat_count_claimed minus the platform's count of non-terminal ALLOCATION holds, recomputed on every submission"
      - name: reconciliation_variance_seats
        type: array
        source: computed
        description: "Seat labels present on exactly one side of the comparison, sorted lexicographically ascending"
      - name: version
        type: integer
        source: system
        description: "OCC version; guards allocation amendment and release"

  - name: DrawEntry
    parent: Performance
    common_fields: true
    fields:
      - name: performance_id
        type: string
        source: input
        description: "FK -> Performance.id; the performance whose draw is being entered"
      - name: allocation_id
        type: string
        source: input
        description: "Draw allocation entered — RushAllocation.id; must be a DRAW allocation of the same performance"
      - name: patron_id
        type: string
        source: input
        description: "Entering patron — Patron.id; must equal the X-User-ID header"
      - name: status
        type: enum
        source: system
        description: "Draw entry lifecycle"
        constraints: "enum {ENTERED, WINNER, WAITLISTED, LOSER, PURCHASED, FORFEITED, CANCELLED}; initial ENTERED"
      - name: entered_at
        type: datetime
        source: system
        description: "Server instant the entry was accepted; also the draw ranking key"
      - name: rank_position
        type: integer
        source: computed
        description: "1-based position in the allocation's draw order, sorted by entered_at ascending with created_at ASC tie-break"
      - name: notified_at
        type: datetime
        source: system
        description: "Instant the winner notification was issued; null until the draw is executed"
      - name: claim_deadline_at
        type: datetime
        source: system
        description: "notified_at plus the allocation's claim window; after this instant a WINNER forfeits deterministically"
      - name: purchase_id
        type: string
        source: system
        description: "Order that consumed this winning entry — TicketPurchase.id; null while unclaimed"
      - name: reinstatement_count
        type: integer
        source: system
        description: "Instantiations issued so far; a second reinstatement of the same forfeit is refused"
        constraints: "0 or 1"
      - name: version
        type: integer
        source: system
        description: "OCC version; guards claim and forfeiture"

  - name: TicketPurchase
    parent: Patron
    common_fields: true
    fields:
      - name: performance_id
        type: string
        source: input
        description: "FK -> Performance.id; the performance being bought"
      - name: allocation_id
        type: string
        source: input
        description: "Allocation grant the seats are drawn from — RushAllocation.id"
      - name: patron_id
        type: string
        source: input
        description: "Purchasing patron — Patron.id; must equal the X-User-ID header"
      - name: quantity
        type: integer
        source: input
        description: "Number of seats requested in this order"
        constraints: "1 <= quantity <= allocation.per_order_limit"
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied key; a repeat of the same key and payload replays the original response"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Price per seat after the base allocation discount, before the demand surge"
      - name: surge_multiplier_bp
        type: integer
        source: computed
        description: "Demand surge in basis points (10000 = 1.00x) applied to non-discount ticket types"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Per-seat rounded line amount multiplied by quantity; charged to the patron"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Demand-projection quote for the same order; never charged, used only for producer reporting"
      - name: payment_status
        type: enum
        source: system
        description: "Payment state dimension, evolves independently of logistics_status and handoff_status"
        constraints: "enum {PENDING, AUTHORIZED, SETTLED, REFUNDED, PARTIALLY_REFUNDED, VOIDED}; initial PENDING"
      - name: logistics_status
        type: enum
        source: system
        description: "Fulfilment state dimension, evolves independently of payment_status"
        constraints: "enum {AWAITING_HANDOFF, DELIVERED, COLLECTED, REVOKED}; initial AWAITING_HANDOFF"
      - name: handoff_status
        type: enum
        source: system
        description: "Identity-verification state dimension, driven by the market handoff model"
        constraints: "enum {NOT_REQUIRED, PENDING_CONCIERGE, VERIFIED, FAILED}; initial derived from market handoff_model"
      - name: handoff_token
        type: string
        source: system
        description: "Server-issued concierge handoff code; null when handoff_status is NOT_REQUIRED"
      - name: handoff_verified_at
        type: datetime
        source: system
        description: "Instant the desk accepted the token; null until verification succeeds"
      - name: handoff_failed_at
        type: datetime
        source: system
        description: "Instant of the single permitted failed handoff attempt; once set the purchase can never be verified"
      - name: seat_labels
        type: array
        source: computed
        description: "The contiguous seat run this order occupies on the performance; the run is what the block-overlap rule compares"
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cumulative refunded amount across refund and exchange compensations"
      - name: version
        type: integer
        source: system
        description: "OCC version; guards refund and exchange writes"

  - name: SeatHold
    parent: Performance
    common_fields: true
    fields:
      - name: seat_label
        type: string
        source: input
        description: "Venue seat identifier, e.g. ORCH-A-12"
      - name: hold_kind
        type: enum
        source: input
        description: "Why the seat is unavailable to the platform pool"
        constraints: "enum {BOX_OFFICE, HOUSE, COMP, ALLOCATION}; exactly one non-terminal ALLOCATION hold per seat_label"
      - name: origin_ref
        type: string
        source: input
        description: "External reference from the producer or box office for non-ALLOCATION holds; null for ALLOCATION holds"
      - name: status
        type: enum
        source: system
        description: "Hold lifecycle; a set of non-terminal holds occupies a seat"
        constraints: "enum {HELD, RELEASED, CONSUMED, ORPHANED, EXPIRED}; initial HELD"
      - name: effective_from
        type: datetime
        source: system
        description: "Interval start, inclusive; stamped by the server on creation"
      - name: effective_to
        type: datetime
        source: system
        description: "Interval end, exclusive; null means the hold runs to the scheduled reconciliation checkpoint"
      - name: version
        type: integer
        source: system
        description: "OCC version; guards hold release and consumption"

  - name: QueuePosition
    parent: Performance
    common_fields: true
    fields:
      - name: patron_id
        type: string
        source: input
        description: "Patron holding this position — Patron.id"
      - name: status
        type: enum
        source: system
        description: "Queue entry lifecycle; an active position is any non-terminal status"
        constraints: "enum {WAITING, ADMITTED, PURCHASED, EXPIRED, ABANDONED}; initial WAITING"
      - name: joined_at
        type: datetime
        source: system
        description: "Server instant the patron joined; the sole ranking key for queue order"
      - name: admit_at
        type: datetime
        source: system
        description: "Instant the patron was admitted from the waitlist; null while WAITING"
      - name: admit_expires_at
        type: datetime
        source: system
        description: "admit_at plus the admission window; expiry is irreversible"
      - name: version
        type: integer
        source: system
        description: "OCC version; guards admission and expiry"

  - name: ConciergeDesk
    parent: Market
    common_fields: true
    fields:
      - name: market_code
        type: string
        source: input
        description: "Market this desk serves, e.g. NYC; matched against Performance.market_code when dispatching a handoff"
        constraints: "must equal the market_code of a declared Market"
      - name: desk_code
        type: string
        source: input
        description: "Desk short code, e.g. NYC-W47"
        constraints: "unique within market"
      - name: daily_capacity
        type: integer
        source: input
        description: "Handoffs the desk can process in one operational epoch"
        constraints: "> 0"
      - name: handoffs_today
        type: integer
        source: computed
        description: "Handoffs verified in the current operational epoch; reset by the nightly ops run"
      - name: status
        type: enum
        source: system
        description: "Desk availability"
        constraints: "enum {OPEN, SATURATED, CLOSED}; initial OPEN"



  - name: RefundRequest
    parent: TicketPurchase
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: input
        description: "Order being refunded — TicketPurchase.id"
      - name: patron_id
        type: string
        source: input
        description: "Requesting patron — Patron.id; must equal the purchasing patron id"
      - name: reason_code
        type: enum
        source: input
        description: "Why the refund is requested; determines which validation chain runs"
        constraints: "enum {PATRON_REQUEST, PERFORMANCE_CANCELLED, PLATFORM_FAULT, DESK_FAILURE}"
      - name: status
        type: enum
        source: system
        description: "Refund state dimension, owned by CustomerService after request"
        constraints: "enum {REQUESTED, PROCESSING, SETTLED, REJECTED, COMPENSATED}; initial REQUESTED"
      - name: approved_by
        type: string
        source: system
        description: "X-User-ID of the CustomerService user who settled or rejected; must differ from requested_by"
      - name: requested_by
        type: string
        source: system
        description: "X-User-ID of the requesting patron; segregation-of-duties bans overlap with approved_by"
      - name: refunded_amount_cents
        type: integer
        source: computed
        description: "Amount to return under the base refund variant"

  - name: ExchangeRequest
    parent: TicketPurchase
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: input
        description: "Order being exchanged — TicketPurchase.id"
      - name: patron_id
        type: string
        source: input
        description: "Requesting patron — Patron.id; must equal the purchasing patron id"
      - name: original_amount_cents
        type: integer
        source: input
        description: "amount_paid_cents as observed by the patron when the exchange was started"
      - name: target_allocation_id
        type: string
        source: input
        description: "Allocation the patron wants instead — RushAllocation.id; must belong to the same performance"
      - name: status
        type: enum
        source: system
        description: "Exchange state dimension, owned by CustomerService after request"
        constraints: "enum {REQUESTED, QUOTED, APPROVED, APPLIED, REJECTED, COMPENSATED}; initial REQUESTED"
      - name: fee_cents
        type: integer
        source: computed
        description: "Cost charged to the patron under the base exchange variant"
      - name: value_returned_cents
        type: integer
        source: computed
        description: "Value returned to the patron under the base exchange variant"
      - name: approved_by
        type: string
        source: system
        description: "X-User-ID of the approving CustomerService user; must differ from requested_by"
      - name: requested_by
        type: string
        source: system
        description: "X-User-ID of the requesting patron"

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login identity; globally unique"
        constraints: "globally unique, case-folded"
      - name: display_name
        type: string
        source: input
        description: "Display name"
      - name: market_code
        type: string
        source: input
        description: "Home market code, e.g. NYC; matched against Performance.market_code for market-scoped filters"
        constraints: "must be a market code the platform recognises"
      - name: draw_violation_count
        type: integer
        source: computed
        description: "Count of entries that ended FORFEITED or CANCELLED and were not reclaimed by a reinstatement or a compensation; one recorded violation is enough to block a patron"
      - name: status
        type: enum
        source: system
        description: "Patron standing; a BLOCKED patron cannot join any queue or enter any draw"
        constraints: "enum {ACTIVE, BLOCKED}; initial ACTIVE"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Production
    field: status
    initial_state: DRAFT
    terminal_states: []
    shape: cyclic
    note: "ACTIVE and SUSPENDED form a revision cycle — a suspended partnership can be resumed any number of times before closure."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /productions/{production_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "production.status == DRAFT"
          - "refund_window_hours >= 0 and exchange_fee_cents >= 0"
        side_effects:
          - "Performance rows under this production remain SCHEDULED and become schedulable for allocation release"
          - "increments Production.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /productions/{production_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "production.status == ACTIVE"
          - "suspension_reason is one of {PRODUCER_HOLD, RECONCILIATION_BLOCK, COMPLIANCE}"
        side_effects:
          - "Every RushAllocation of this production currently in RELEASED moves to SUSPENDED and stops dispensing seats"
          - "Every QueuePosition of this production currently in WAITING moves to ABANDONED"
          - "increments Production.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /productions/{production_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "production.status == SUSPENDED"
          - "no RushAllocation of this production sits in SUSPENDED with reconciliation_status == MISMATCH"
        side_effects:
          - "Every RushAllocation of this production in SUSPENDED returns to SCHEDULED"
          - "increments Production.version by 1"

      - from: [DRAFT, ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /productions/{production_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "no RushAllocation of this production holds a status in {RELEASED, SUSPENDED}"
        side_effects:
          - "Every Performance of this production in ONSALE moves to CLOSED"
          - "Every RushAllocation of this production in {DRAFT, SCHEDULED} moves to CLOSED"
          - "increments Production.version by 1"

  - entity: Performance
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ONSALE
        trigger: "POST /performances/{performance_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "performance.status == SCHEDULED"
          - "Production.status of production_id == ACTIVE"
        side_effects:
          - "Rush allocations of this performance become eligible for release"
          - "increments Performance.version by 1"

      - from: ONSALE
        to: CLOSED
        trigger: "POST /performances/{performance_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "performance.status == ONSALE"
        side_effects:
          - "Every QueuePosition of this performance in WAITING moves to ABANDONED"
          - "Every RushAllocation of this performance in {SCHEDULED, RELEASED} moves to CLOSED"
          - "increments Performance.version by 1"

      - from: [SCHEDULED, ONSALE]
        to: CANCELLED
        trigger: "POST /performances/{performance_id}/status-transitions"
        actor: OpsManager
        preconditions:
          - "performance.status IN {SCHEDULED, ONSALE}"
        side_effects:
          - "Every RushAllocation of this performance in {DRAFT, SCHEDULED, RELEASED, EXHAUSTED} moves to CLOSED"
          - "Every DrawEntry of this performance in {ENTERED, WINNER, WAITLISTED} moves to CANCELLED"
          - "Every QueuePosition of this performance in {WAITING, ADMITTED} moves to ABANDONED"
          - "increments Performance.version by 1"
        note: "Cancelling a performance already CANCELLED is rejected with ERR_INVALID_STATE — no side effects fire a second time."

  - entity: RushAllocation
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: branching
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /allocations/{allocation_id}/scheduling"
        actor: AllocationsCoordinator
        preconditions:
          - "allocation.status == DRAFT"
          - "Performance.status of performance_id IN {SCHEDULED, ONSALE}"
          - "ticket_type == STANDARD implies discount_pct == 0"
          - "ticket_type IN {RUSH, RUSH_PREMIUM, DRAW} implies discount_pct > 0"
          - "ticket_type == DRAW implies claim_window_minutes >= 1"
        side_effects:
          - "quantity_released_today = 0 and quantity_sold_today = 0"
          - "increments RushAllocation.version by 1"

      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /allocations/{allocation_id}/releases/{release_epoch}"
        actor: OpsManager
        preconditions:
          - "allocation.status == SCHEDULED"
          - "release_epoch == the allocation's next unsettled release epoch date"
          - "Performance.status of performance_id == ONSALE"
          - "Production.status of the performance's production == ACTIVE"
          - "OCC: expected_production_version equals Production.version"
          - "OCC: expected_performance_version equals Performance.version"
        side_effects:
          - "quantity_released_today = daily_release_cap"
          - "quantity_carried_forward = previous epoch's (quantity_released_today - quantity_sold_today), floored at 0"
          - "increments Production.version by 1"
          - "increments Performance.version by 1"
          - "increments RushAllocation.version by 1"

      - from: RELEASED
        to: EXHAUSTED
        trigger: "POST /purchases (side effect) or POST /draw-entries/{id}/claims (side effect) — fires when quantity_sold_today reaches daily_release_cap"
        actor: system
        preconditions:
          - "allocation.status == RELEASED"
          - "quantity_sold_today >= daily_release_cap"
        side_effects:
          - "Every DrawEntry of this allocation in WAITLISTED moves to LOSER"
          - "Every QueuePosition of this performance in WAITING moves to ABANDONED"
          - "Every SeatHold of this performance with hold_kind == ALLOCATION and status == HELD and effective_to > now releases to RELEASED"
          - "increments RushAllocation.version by 1"
        note: "Exhaustion is reachable from SCHEDULED via a release epoch in which daily_release_cap == 0 is impossible, so this transition always originates in RELEASED."

      - from: EXHAUSTED
        to: RELEASED
        trigger: "POST /refunds/{refund_id}/settlement (side effect) — fires when a settled refund returns seats below daily_release_cap"
        actor: system
        preconditions:
          - "allocation.status == EXHAUSTED"
          - "quantity_sold_today < daily_release_cap"
        side_effects:
          - "allocation becomes dispensable again for the remainder of the current release epoch"
          - "increments RushAllocation.version by 1"

      - from: RELEASED
        to: SUSPENDED
        trigger: "POST /productions/{production_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "allocation.status == RELEASED"
          - "Production.status of this allocation's performance's production == SUSPENDED"
        side_effects:
          - "Seats of this allocation stop being dispensable"
          - "every SeatHold of this allocation's performance with hold_kind == ALLOCATION and status == HELD moves to ORPHANED, because a suspended partnership cannot keep inventory reserved"
          - "increments RushAllocation.version by 1"

      - from: SUSPENDED
        to: SCHEDULED
        trigger: "POST /productions/{production_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "allocation.status == SUSPENDED"
          - "Production.status of this allocation's performance's production == ACTIVE"
        side_effects:
          - "increments RushAllocation.version by 1"

      - from: [DRAFT, SCHEDULED, RELEASED, EXHAUSTED]
        to: CLOSED
        trigger: "POST /performances/{performance_id}/status-transitions or POST /performances/{performance_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "Performance.status of performance_id IN {CLOSED, CANCELLED}"
        side_effects:
          - "Every SeatHold of this allocation's performance with hold_kind == ALLOCATION and status == HELD moves to ORPHANED"
          - "increments RushAllocation.version by 1"

  - entity: DrawEntry
    field: status
    initial_state: ENTERED
    terminal_states: [PURCHASED, LOSER, CANCELLED]
    shape: cyclic
    note: "WAITLISTED → WINNER → FORFEITED → WAITLISTED is the promotion cycle that lets a draw keep selling after a winner forfeits."
    transitions:
      - from: ENTERED
        to: WINNER
        trigger: "POST /allocations/{allocation_id}/draw-executions"
        actor: OpsManager
        preconditions:
          - "entry.status == ENTERED"
          - "entry appears at rank_position <= the allocation's winner_count"
          - "Patron.status of patron_id == ACTIVE"
        side_effects:
          - "notified_at = the ops-run epoch instant"
          - "claim_deadline_at = notified_at + claim_window_minutes"
          - "increments DrawEntry.version by 1"

      - from: ENTERED
        to: WAITLISTED
        trigger: "POST /allocations/{allocation_id}/draw-executions"
        actor: OpsManager
        preconditions:
          - "entry.status == ENTERED"
          - "entry appears at rank_position > the allocation's winner_count"
          - "entry appears at rank_position <= the allocation's waitlist_count"
        side_effects:
          - "increments DrawEntry.version by 1"

      - from: ENTERED
        to: LOSER
        trigger: "POST /allocations/{allocation_id}/draw-executions"
        actor: OpsManager
        preconditions:
          - "entry.status == ENTERED"
          - "entry appears at rank_position > the allocation's waitlist_count"
        side_effects:
          - "increments DrawEntry.version by 1"

      - from: WINNER
        to: PURCHASED
        trigger: "POST /draw-entries/{entry_id}/claims"
        actor: Patron
        preconditions:
          - "entry.status == WINNER"
          - "patron_id equals the X-User-ID header"
          - "now <= claim_deadline_at"
          - "the claim's declaration is accepted into the draw by the plausibility evaluation"
        side_effects:
          - "creates a TicketPurchase in PENDING with subtotal_cents == quantity * unit_price_cents"
          - "purchase_id = the minted TicketPurchase.id"
          - "increments DrawEntry.version by 1"

      - from: WINNER
        to: FORFEITED
        trigger: "POST /ops-runs"
        actor: system
        preconditions:
          - "entry.status == WINNER"
          - "now > claim_deadline_at"
        side_effects:
          - "Patron.draw_violation_count of patron_id increments by 1"
          - "increments DrawEntry.version by 1"

      - from: WAITLISTED
        to: WINNER
        trigger: "POST /ops-runs (side effect) — fired by a WINNER → FORFEITED transition on the same allocation"
        actor: system
        preconditions:
          - "entry.status == WAITLISTED"
          - "the allocation has an available seat because a WINNER forfeited"
          - "entry is the lowest rank_position among non-terminal WAITLISTED entries of the allocation"
        side_effects:
          - "notified_at = the ops-run epoch instant"
          - "claim_deadline_at = notified_at + claim_window_minutes"
          - "Patron.draw_violation_count of this entry's patron_id is decremented by 1, floored at 0"
          - "increments DrawEntry.version by 1"

      - from: FORFEITED
        to: WINNER
        trigger: "POST /patrons/{patron_id}/draw-reinstatements"
        actor: CustomerService
        preconditions:
          - "entry.status == FORFEITED"
          - "entry has not previously been reinstated"
          - "Patron.status of patron_id == ACTIVE"
        side_effects:
          - "Patron.draw_violation_count of patron_id is decremented by 1, floored at 0"
          - "claim_deadline_at is recomputed as the reinstatement instant plus claim_window_minutes"
          - "increments DrawEntry.version by 1"

      - from: [ENTERED, WINNER, WAITLISTED]
        to: CANCELLED
        trigger: "POST /performances/{performance_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "Performance.status of performance_id == CANCELLED"
        side_effects:
          - "Patron.draw_violation_count of patron_id is decremented by 1, floored at 0"
          - "increments DrawEntry.version by 1"

  - entity: TicketPurchase
    field: "payment_status × logistics_status × handoff_status"
    initial_state: "PENDING × AWAITING_HANDOFF × (market-derived)"
    terminal_states: [REFUNDED, VOIDED]
    shape: parallel
    note: "Three independent state dimensions on one row: payment_status, logistics_status and handoff_status advance on separate triggers. Canvas: handoff_status starts NOT_REQUIRED for MOBILE_PUSH markets, PENDING_CONCIERGE for CONCIERGE_DESK and HYBRID markets."
    transitions:
      - from: "payment_status: PENDING"
        to: "payment_status: AUTHORIZED"
        trigger: "POST /purchases/{purchase_id}/settlements"
        actor: FinancialOps
        preconditions:
          - "purchase.payment_status == PENDING"
          - "purchase.logistics_status IN {AWAITING_HANDOFF, REVOKED}"
          - "the purchase's seat holds remain HELD at authorisation time"
        side_effects:
          - "increments TicketPurchase.version by 1"

      - from: "payment_status: AUTHORIZED"
        to: "payment_status: SETTLED"
        trigger: "POST /purchases/{id}/settlements"
        actor: FinancialOps
        preconditions:
          - "purchase.payment_status == AUTHORIZED"
          - "OCC: expected_purchase_version equals TicketPurchase.version"
        side_effects:
          - "Every SeatHold of this purchase's performance matching a purchased seat_label with hold_kind == ALLOCATION moves to CONSUMED"
          - "every RefundRequest of this purchase in PROCESSING moves to SETTLED"
          - "increments TicketPurchase.version by 1"

      - from: "payment_status: SETTLED"
        to: "payment_status: REFUNDED"
        trigger: "POST /refunds/{refund_id}/settlement (side effect)"
        actor: system
        preconditions:
          - "purchase.payment_status == SETTLED"
          - "the RefundRequest of this purchase reaches SETTLED"
        side_effects:
          - "refunded_cents = refunded_amount_cents + compensated_amount_cents"
          - "increments TicketPurchase.version by 1"

      - from: "payment_status: SETTLED"
        to: "payment_status: PARTIALLY_REFUNDED"
        trigger: "POST /exchanges/{exchange_id}/application (side effect)"
        actor: system
        preconditions:
          - "purchase.payment_status IN {SETTLED, PARTIALLY_REFUNDED}"
          - "the applied exchange has value_returned_cents > 0 and fee_cents > 0"
        side_effects:
          - "refunded_cents = fee_cents + (original_amount_cents - value_returned_cents); PARTIALLY_REFUNDED applies when refunded_cents < amount_paid_cents"
          - "increments TicketPurchase.version by 1"

      - from: "payment_status: PENDING"
        to: "payment_status: VOIDED"
        trigger: "POST /draw-entries/{entry_id}/claims (side effect) or POST /ops-runs (side effect)"
        actor: system
        preconditions:
          - "purchase.payment_status == PENDING"
          - "the purchase's claim window elapsed without authorisation, or its draw entry forfeited"
        side_effects:
          - "Every SeatHold of this purchase's performance matching a purchased seat_label with hold_kind == ALLOCATION moves to RELEASED"
          - "increments TicketPurchase.version by 1"

      - from: "logistics_status: AWAITING_HANDOFF"
        to: "logistics_status: DELIVERED"
        trigger: "POST /handoffs"
        actor: DemandAnalyst
        preconditions:
          - "purchase.logistics_status == AWAITING_HANDOFF"
          - "purchase.payment_status IN {AUTHORIZED, SETTLED}"
          - "Market.handoff_model of the performance's market == MOBILE_PUSH"
        side_effects:
          - "handoff_status stays NOT_REQUIRED for MOBILE_PUSH markets"
          - "increments TicketPurchase.version by 1"

      - from: "logistics_status: AWAITING_HANDOFF"
        to: "logistics_status: COLLECTED"
        trigger: "POST /handoffs (side effect)"
        actor: system
        preconditions:
          - "purchase.logistics_status == AWAITING_HANDOFF"
          - "purchase.handoff_status == VERIFIED"
        side_effects:
          - "increments TicketPurchase.version by 1"

      - from: "logistics_status: [DELIVERED, COLLECTED]"
        to: "logistics_status: REVOKED"
        trigger: "POST /performances/{performance_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "Performance.status of performance_id == CANCELLED"
        side_effects:
          - "Every RefundRequest of this purchase in {REQUESTED, PROCESSING} with reason_code PERFORMANCE_CANCELLED moves to PROCESSING"
          - "increments TicketPurchase.version by 1"

      - from: "handoff_status: PENDING_CONCIERGE"
        to: "handoff_status: VERIFIED"
        trigger: "POST /handoffs"
        actor: ConciergeDeskStaff
        preconditions:
          - "purchase.handoff_status == PENDING_CONCIERGE"
          - "the submitted redemption_code equals purchase.handoff_token"
          - "ConciergeDesk.status of desk_id == OPEN"
          - "ConciergeDesk.handoffs_today of desk_id < daily_capacity"
          - "the purchase has not already recorded a failed handoff attempt"
        side_effects:
          - "stamps handoff_verified_at on the purchase"
          - "purchase.logistics_status moves to COLLECTED"
          - "ConciergeDesk.handoffs_today of desk_id increments by 1"
          - "increments TicketPurchase.version by 1"

      - from: "handoff_status: PENDING_CONCIERGE"
        to: "handoff_status: FAILED"
        trigger: "POST /handoffs"
        actor: ConciergeDeskStaff
        preconditions:
          - "purchase.handoff_status == PENDING_CONCIERGE"
          - "the submitted redemption_code does not equal purchase.handoff_token"
        side_effects:
          - "stamps handoff_failed_at on the purchase"
          - "increments TicketPurchase.version by 1"
          - "no seat hold is released and no queue admission is issued"

  - entity: QueuePosition
    field: status
    initial_state: WAITING
    terminal_states: [PURCHASED, EXPIRED, ABANDONED]
    shape: cyclic
    note: "ADMITTED → WAITING is the re-queue loop used when an admitted patron's window lapses but the queue head has moved on."
    transitions:
      - from: null
        to: WAITING
        trigger: "POST /performances/{id}/queue-positions"
        actor: Patron
        preconditions:
          - "patron_id equals the X-User-ID header"
          - "Patron.status of patron_id == ACTIVE"
          - "the patron holds no QueuePosition for this performance with status IN {WAITING, ADMITTED}"
          - "release_at for the performance's next rush release epoch has been reached"
          - "Performance.status of performance_id == ONSALE"
        side_effects:
          - "joined_at = the ops-run epoch instant"
          - "increments QueuePosition.version by 1"

      - from: WAITING
        to: ADMITTED
        trigger: "POST /ops-runs (side effect) — admit up to quota"
        actor: system
        preconditions:
          - "position.status == WAITING"
          - "position appears at rank_position <= the release's admit quota, ranked by joined_at ascending with created_at ASC tie-break"
          - "the rush allocation for this performance has status == RELEASED"
        side_effects:
          - "admit_at = the ops-run epoch instant"
          - "admit_expires_at = admit_at + admission_window_minutes"
          - "increments QueuePosition.version by 1"

      - from: ADMITTED
        to: PURCHASED
        trigger: "POST /purchases (side effect)"
        actor: system
        preconditions:
          - "position.status == ADMITTED"
          - "now <= admit_expires_at"
          - "the created purchase's patron_id == position.patron_id"
        side_effects:
          - "increments QueuePosition.version by 1"

      - from: ADMITTED
        to: EXPIRED
        trigger: "POST /ops-runs (side effect) — lapse an admission window"
        actor: system
        preconditions:
          - "position.status == ADMITTED"
          - "now > admit_expires_at"
        side_effects:
          - "increments QueuePosition.version by 1"

      - from: [WAITING, ADMITTED]
        to: ABANDONED
        trigger: "POST /productions/{production_id}/status-transitions, POST /performances/{performance_id}/status-transitions or POST /performances/{performance_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "Production.status of the performance's production == SUSPENDED, or Performance.status of performance_id IN {CLOSED, CANCELLED}"
        side_effects:
          - "increments QueuePosition.version by 1"


  - entity: SeatHold
    field: status
    initial_state: HELD
    terminal_states: [RELEASED, CONSUMED, EXPIRED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /purchases/{id}/settlements (side effect)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "hold.hold_kind == ALLOCATION"
          - "hold.seat_label appears in the settled purchase's seat_labels"
        side_effects:
          - "hold.effective_to is stamped with the settlement instant (the state change makes the interval closed)"
          - "increments SeatHold.version by 1"

      - from: HELD
        to: RELEASED
        trigger: ""
        actor: AllocationsCoordinator
        preconditions:
          - "hold.status == HELD"
          - "no TicketPurchase of this performance in {PENDING, AUTHORIZED} references hold.seat_label"
        side_effects:
          - "hold.effective_to is stamped with the release instant"
          - "increments SeatHold.version by 1"

      - from: [HELD, ORPHANED]
        to: EXPIRED
        trigger: "POST /ops-runs (side effect) — hold interval end passes"
        actor: system
        preconditions:
          - "hold.status IN {HELD, ORPHANED}"
          - "hold.effective_to is non-null and now > hold.effective_to"
        side_effects:
          - "increments SeatHold.version by 1"

      - from: HELD
        to: ORPHANED
        trigger: "POST /allocations/{allocation_id}/reconciliations (side effect) or POST /performances/{performance_id}/status-transitions (side effect)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "hold.hold_kind == ALLOCATION"
          - "the reconciliation is blocking, or the performance status is CANCELLED"
        side_effects:
          - "increments SeatHold.version by 1"

      - from: ORPHANED
        to: HELD
        trigger: "POST /allocations/{allocation_id}/reconciliations (side effect)"
        actor: system
        preconditions:
          - "hold.status == ORPHANED"
          - "the seat_label appears in seat_labels_claimed of a superseding non-blocking reconciliation"
        side_effects:
          - "increments SeatHold.version by 1"


  - entity: RefundRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [SETTLED, REJECTED, COMPENSATED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /purchases/{id}/refund-requests"
        actor: Patron
        preconditions:
          - "Patron.status of purchase patron == ACTIVE or the reason_code == PERFORMANCE_CANCELLED"
          - "purchase.payment_status IN {AUTHORIZED, SETTLED, PARTIALLY_REFUNDED}"
          - "refund_deadline_at of the purchase has not passed, or reason_code == PERFORMANCE_CANCELLED"
        side_effects:
          - "refunded_amount_cents = refund_amount(purchase, refund postures) under the base variant"
          - "increments TicketPurchase.version by 1"

      - from: REQUESTED
        to: PROCESSING
        trigger: "POST /performances/{performance_id}/status-transitions (side effect) or POST /refunds/{refund_id}/approvals"
        actor: CustomerService
        preconditions:
          - "refund.status == REQUESTED"
          - "PROCESSING via approval requires expected_purchase_version to equal TicketPurchase.version"
        side_effects:
          - "increments TicketPurchase.version by 1"

      - from: PROCESSING
        to: SETTLED
        trigger: "POST /purchases/{id}/settlements (side effect, for PENDING purchases) or POST /refunds/{refund_id}/settlement"
        actor: FinancialOps
        preconditions:
          - "refund.status == PROCESSING"
          - "OCC: expected_purchase_version equals TicketPurchase.version"
        side_effects:
          - "purchase.refunded_cents = purchase.refunded_cents + refund.refunded_amount_cents"
          - "allocation.quantity_sold_today decrements by the number of tickets on the purchase"
          - "pressures ReversalEvent emission for the purchase"
          - "increments TicketPurchase.version by 1"

      - from: PROCESSING
        to: COMPENSATED
        trigger: "POST /ops-runs (side effect) — reverse a settlement whose refund epoch has not closed"
        actor: system
        preconditions:
          - "refund.status == PROCESSING"
          - "the purchase's settlement epoch equals the current not-yet-closed ops-run epoch"
        side_effects:
          - "a compensating reversal restores purchase.status back to SETTLED and refund.status to COMPENSATED"
          - "purchase.refunded_cents returns to its pre-settlement value"
          - "allocation.quantity_sold_today increments back by the number of tickets on the purchase"
          - "increments TicketPurchase.version by 1"

      - from: [REQUESTED, PROCESSING]
        to: REJECTED
        trigger: "POST /refunds/{refund_id}/approvals"
        actor: CustomerService
        preconditions:
          - "refund.status IN {REQUESTED, PROCESSING}"
          - "the refund postures evaluation rejects the request"
        side_effects:
          - "no purchase field changes; the rejection is the compensating no-op"
          - "increments TicketPurchase.version by 1"

  - entity: ExchangeRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [APPLIED, REJECTED, COMPENSATED]
    shape: cyclic
    note: "QUOTED → REQUESTED lets a patron re-quote after the quote itself was issued against a stale amount, without reopening the purchase."
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /purchases/{id}/exchange-requests"
        actor: Patron
        preconditions:
          - "Production.exchange_allowed of the purchase's production == true"
          - "purchase.payment_status IN {SETTLED, PARTIALLY_REFUNDED}"
          - "target_allocation_id belongs to the same performance as the purchase"
          - "target_allocation_id differs from the purchase's allocation_id"
          - "patron_id equals the X-User-ID header"
        side_effects:
          - "original_amount_cents is stored from the request body verbatim"
          - "increments TicketPurchase.version by 1"

      - from: REQUESTED
        to: QUOTED
        trigger: "POST /exchanges/{exchange_id}/quotations"
        actor: CustomerService
        preconditions:
          - "exchange.status == REQUESTED"
          - "exchange.original_amount_cents equals purchase.amount_paid_cents at quote time"
        side_effects:
          - "fee_cents = exchange_cost(purchase, target allocation, exchange postures) under the base variant"
          - "value_returned_cents = purchase.amount_paid_cents - fee_cents"
          - "increments TicketPurchase.version by 1"


      - from: QUOTED
        to: APPROVED
        trigger: "POST /exchanges/{exchange_id}/application"
        actor: CustomerService
        preconditions:
          - "exchange.status == QUOTED"
          - "approved_by differs from requested_by"
          - "OCC: expected_purchase_version equals TicketPurchase.version"
        side_effects:
          - "increments TicketPurchase.version by 1"

      - from: APPROVED
        to: APPLIED
        trigger: "POST /exchanges/{exchange_id}/application"
        actor: CustomerService
        preconditions:
          - "exchange.status == APPROVED"
          - "the target allocation has status == RELEASED"
          - "the target allocation's remaining dispensable seats >= the number of tickets on the purchase"
          - "OCC: expected_performance_version equals Performance.version"
          - "OCC: expected_purchase_version equals TicketPurchase.version"
        side_effects:
          - "purchase.refunded_cents = fee_cents + (original_amount_cents - value_returned_cents)"
          - "the source SeatHold of the purchase moves to RELEASED; a target SeatHold on the target allocation is created HELD"
          - "pressures issuance of a fresh handoff_token when the market handoff model is not MOBILE_PUSH"
          - "increments Performance.version by 1"
          - "increments TicketPurchase.version by 1"

      - from: [REQUESTED, QUOTED]
        to: REJECTED
        trigger: "POST /exchanges/{exchange_id}/application"
        actor: CustomerService
        preconditions:
          - "exchange.status IN {REQUESTED, QUOTED}"
          - "the exchange postures evaluation rejects the request"
        side_effects:
          - "no purchase field changes"
          - "increments TicketPurchase.version by 1"

      - from: APPLIED
        to: COMPENSATED
        trigger: "POST /ops-runs (side effect) — subtract the fee and value-returned from the reporting remainder"
        actor: system
        preconditions:
          - "exchange.status == APPLIED"
          - "the application epoch equals the current not-yet-closed ops-run epoch"
        side_effects:
          - "purchase.refunded_cents is restored to its pre-application value"
          - "the target SeatHold moves to RELEASED and the source SeatHold returns to HELD"
          - "allocation.quantity_sold_today returns to its pre-application value for both allocations"
          - "increments TicketPurchase.version by 1"

  - entity: ConciergeDesk
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SATURATED
        trigger: "POST /handoffs (side effect)"
        actor: system
        preconditions:
          - "desk.status == OPEN"
          - "desk.handoffs_today >= desk.daily_capacity"
        side_effects:
          - "further handoffs at this desk are rejected for the remainder of the current operational epoch"
          - "increments ConciergeDesk.version by 1"

      - from: SATURATED
        to: OPEN
        trigger: "POST /ops-runs (side effect) — nightly reset"
        actor: system
        preconditions:
          - "desk.status == SATURATED"
          - "the ops run opened a new operational epoch"
        side_effects:
          - "handoffs_today is reset to 0"
          - "increments ConciergeDesk.version by 1"


  - entity: Patron
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /patrons/{patron_id}/status-transitions"
        actor: CustomerService
        preconditions:
          - "patron.status == ACTIVE"
          - "patron.draw_violation_count >= 1"
        side_effects:
          - "every QueuePosition of this patron in {WAITING, ADMITTED} moves to ABANDONED"
          - "every DrawEntry of this patron in {ENTERED, WINNER, WAITLISTED} moves to CANCELLED; the CANCELLED branch of the cancel cascade draws draw_violation_count down by 1, floored at 0"
          - "increments Patron.version by 1"

      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /patrons/{patron_id}/status-transitions"
        actor: CustomerService
        preconditions:
          - "patron.status == BLOCKED"
        side_effects:
          - "no queue positions or draw entries are reinstated by this transition"
          - "increments Patron.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true write-write races only; OCC on parent version)
# =============================================================================
concurrency_rules:

  - rule_id: release-stale-production
    parent_entity: Production
    write_endpoint: "POST /allocations/{allocation_id}/releases/{release_epoch}"
    occ_field: "expected_production_version"
    description: |
      Authorising a rush release against a Production whose version has advanced
      since the client last observed it is rejected. The version advances on any
      §1.2 transition that touches the production (activation, suspension,
      resumption), so a stale view means the caller is releasing against a
      partnership state they have not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settle-stale-purchase
    parent_entity: TicketPurchase
    write_endpoint: "POST /purchases/{purchase_id}/settlements"
    occ_field: "expected_purchase_version"
    description: |
      Settling a TicketPurchase whose version has advanced since the client last
      observed it is rejected. A settled refund, a voided pending payment or an
      applied exchange all legitimately bump the purchase version, so the second
      settle request carries a stale view of what has already been paid.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: exchange-stale-purchase
    parent_entity: TicketPurchase
    write_endpoint: "POST /exchanges/{exchange_id}/application"
    occ_field: "expected_purchase_version"
    description: |
      Applying an ExchangeRequest against a TicketPurchase whose version has
      advanced since the client last observed it is rejected. The exchange's own
      quotation step advances the purchase version, so an approval bound to an
      older version must be re-quoted before it can be applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reconcile-stale-allocation
    parent_entity: RushAllocation
    write_endpoint: "POST /allocations/{allocation_id}/reconciliations"
    occ_field: "expected_allocation_version"
    description: |
      Recording a box-office reconciliation against a RushAllocation whose
      version has advanced since the client last observed it is rejected. Drawing
      a production's winners and releasing seat holds both advance the allocation
      version, so a stale reconciliation would compare against a stock position
      that no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-stale-draw-entry
    parent_entity: DrawEntry
    write_endpoint: "POST /draw-entries/{entry_id}/claims"
    occ_field: "expected_draw_entry_version"
    description: |
      Claiming a draw win against a DrawEntry whose version has advanced since
      the patron last observed it is rejected. A nightly ops run can have
      promoted, forfeited or waitlisted the entry in the meantime, so the claim is
      refused rather than silently applied to a superseded notification.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: authorised-purchase-version
    parent_entity: TicketPurchase
    write_endpoint: "POST /purchases/{id}/refund-requests"
    occ_field: "expected_purchase_version"
    description: |
      Opening a RefundRequest against a TicketPurchase whose version has advanced
      since the client last observed it is rejected. An applied exchange already
      moved money on this purchase, so computing a fresh refund base from a stale
      amount_paid_cents would return the wrong figure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: rush_daily_release_cap
    trigger: "POST /allocations/{allocation_id}/releases/{release_epoch}"
    subject: RushAllocation
    algorithm: waterfall_allocation
    inputs: [RushAllocation.daily_quantity, RushAllocation.quantity_carried_forward, Performance.total_seat_capacity]
    formula: |
      c_requested = daily_quantity
      c_forward   = daily_quantity - quantity_carried_forward        # floored at 0
      c_market    = floor( MARKET_RUSH_SHARE_CAP_BP * Performance.total_seat_capacity / 10000 )
                    - (sum of a.quantity_released_today over every allocation a of the same
                       Performance whose ticket_type <> 'STANDARD' and status IN {RELEASED, EXHAUSTED})
                    # floored at 0; the allocation being capped is excluded from the sum
      daily_release_cap = min(c_requested, c_forward, c_market)
      # waterfall order is requested -> forward -> market; ties are impossible because min is
      # order-independent over a fixed set. The market scope is the Performance's single
      # market_code, so "per market per day" reduces to the allocation set of that Performance.
    constants:
      MARKET_RUSH_SHARE_CAP_BP: 4000
    precision: "integer seats; floor on the market cap, no rounding elsewhere"
    variants:
      - name: base_cent
        when: "default; c_market uses floor(bp * capacity / 10000)"
        difference: "c_market truncates any fractional seat downward"
      - name: market_cap_rounded
        when: "when Performance.total_seat_capacity * MARKET_RUSH_SHARE_CAP_BP is not an exact multiple of 10000"
        difference: "c_market uses round_half_up instead of floor, so a market cap of 2.8 seats becomes 3 rather than 2; with capacity 7 the two variants return caps 2 and 3 for identical inputs"

  - name: demand_surge_bp
    trigger: "POST /purchases valuation, POST /allocations/{allocation_id}/releases/{release_epoch}, POST /ops-runs"
    subject: Performance
    algorithm: threshold
    inputs: [RushAllocation.ticket_type, TicketPurchase.payment_status, RushAllocation.quantity_released_today, RushAllocation.quantity_carried_forward, RushAllocation.quantity_sold_today]
    formula: |
      release_at_effective = release_at
      released_effective   = quantity_released_today + quantity_carried_forward
      fill_fraction        = quantity_sold_today / released_effective      # 0 when released_effective == 0
      released_off_fraction= (released_effective - quantity_sold_today) / released_effective  # 0 when released_effective == 0
      active_order_count   = count of TicketPurchase of this Performance
                             with payment_status IN {PENDING, AUTHORIZED}

      surge_bp = 0 when ticket_type IN {'RUSH', 'DRAW'}
      otherwise (ticket_type IN {'RUSH_PREMIUM', 'STANDARD'}):
        surge_bp = min( SURGE_CAP_BP,
                        ( 2500 if active_order_count  >  12  else 0 )
                      + ( 1500 if released_off_fraction > 0.90 else 0 )
                      + ( 1000 if fill_fraction        > 0.80 else 0 ) )
      Each of the three tests uses strict '>' — a fill fraction of exactly 0.80 adds 0 bp.
    constants:
      SURGE_CAP_BP: 5000
      SURGE_A_BP: 2500
      SURGE_B_BP: 1500
      SURGE_C_BP: 1000
      SURGE_A_MIN_ACTIVE_ORDERS: 12
      SURGE_B_MIN_RELEASED_OFF: 0.90
      SURGE_C_MIN_FILL: 0.80
    precision: "integer basis points; ratios carried at full float precision before comparison"

  - name: per_seat_price
    trigger: "POST /purchases"
    subject: RushAllocation
    algorithm: tiered_pricing
    inputs: [Performance.face_value_cents, RushAllocation.discount_pct, RushAllocation.ticket_type]
    formula: |
      base_price_cents = round_half_up( Performance.face_value_cents * (1 - discount_pct) )
      surge_bp         = demand_surge_bp(allocation, performance)     # 0 for non-STANDARD
      unit_price_cents = round_half_up( base_price_cents * (10000 + surge_bp) / 10000 )
      Pinned evaluation order: discount applied and rounded FIRST, surge applied and
      rounded SECOND. Rounding once over the fused product is a different rule.
    constants:
      SURGE_BASE_BP: 10000
    precision: "integer cents, round_half_up at both steps"
    variants:
      - name: round_per_step
        when: "default"
        difference: "two roundings; face 19990, discount 0.15, surge 2500 bp gives unit_price_cents 21240"
      - name: round_once_at_end
        when: "used only by the producer audit report, never for a charged amount"
        difference: "one rounding over the fused product face * (1-discount) * (10000+surge)/10000; this variant reads Performance.face_value_cents and RushAllocation.discount_pct directly and never reads the rounded base_price_cents, so with face 19990, discount 0.15 and surge 2500 bp it returns 21239 while round_per_step returns 21240 for the same allocation"

  - name: purchase_line_subtotal
    trigger: "POST /purchases"
    subject: TicketPurchase
    algorithm: aggregation
    inputs: [RushAllocation.per_seat_derived unit_price_cents, TicketPurchase.quantity]
    formula: |
      group_discount_bp = 1000 when quantity >= 4, else 0
      subtotal_cents = round_half_up( unit_price_cents * quantity * (10000 - group_discount_bp) / 10000 )
      Pinned evaluation order:
        step 1: unit_price_cents is already rounded to a whole cent by per_seat_price
        step 2: multiply by quantity
        step 3: apply the group discount to that product
        step 4: round once at the end
      The group discount is keyed on quantity, which is a pre-discount integer, so the
      subtotal never feeds back into its own discount tier.
    constants:
      GROUP_MIN_QUANTITY: 4
      GROUP_DISCOUNT_BP: 1000
    precision: "integer cents, round_half_up once at step 4"
    variants:
      - name: discount_after_quantity
        when: "default"
        difference: "discount applied to the quantity-extended product; unit 8385 with quantity 4 gives subtotal 30186"
      - name: discount_before_quantity
        when: "never charged; retained only to detect implementations that reorder the steps"
        difference: "discount applied to the unit price and rounded before extension; the same inputs give 7547 * 4 = 30188, two cents above the charged subtotal"

  - name: redemption_lifecycle_cost
    trigger: "POST /patrons/{patron_id}/draw-reinstatements and POST /ops-runs"
    subject: Patron
    algorithm: chronological
    inputs: [DrawEntry.status, DrawEntry.claim_deadline_at, TicketPurchase.status, DrawEntry.entered_at]
    formula: |
      Walk every DrawEntry reachable from the patron, oldest-first by entered_at
      ascending with created_at ASC as the tie-break (id is never a key).
      For each entry, add exactly one of:

        entry.status in {ENTERED, WAITLISTED, LOSER}          -> 0
        entry.status == WINNER   and today <  claim_deadline_at -> 0
        entry.status == WINNER   and today >= claim_deadline_at -> 1   # strictly-at-deadline is a forfeit
        entry.status == FORFEITED                                -> 1
        entry.status == CANCELLED and not reclaimed_by_exchange  -> 1
        entry.status == PURCHASED                                -> 0.25

      A DrawEntry that is FORFEITED and later moved back to WINNER by a
      draw-reinstatement returns to the 0 branch, so the walk is re-run from
      scratch after every reinstatement rather than incremented.
    constants:
      COST_FORFEIT: 1
      COST_PURCHASE: 0.25
      VIOLATION_CEILING: 2
    precision: "exact quarter units; no rounding, values are {0, 0.25, 1} sums"

  - name: refund_amount
    trigger: "POST /purchases/{id}/refund-requests"
    subject: TicketPurchase
    algorithm: aggregation
    inputs: [TicketPurchase.subtotal_cents, Production.refund_window_hours, Performance.starts_at, RefundRequest.reason_code, RefundRequest.status]
    formula: |
      hours_before_start = ( Performance.starts_at - today ) / 1 hour
      elapsed_hours      = ( today - purchase.created_at ) / 1 hour

      base = subtotal_cents
      if RushAllocation.refundable == false and hours_before_start < Production.refund_window_hours:
          base = 0                                             # non-refundable, window closed
      elif hours_before_start >= Production.refund_window_hours:
          base = subtotal_cents                                # full value while the window is open
      else:
          base = round_half_up( subtotal_cents * 0.50 )        # half value once inside the window

      REFUND_PROCESSING_FEE_CENTS = 200
      branch = 1 when status IN {SETTLED, COMPENSATED}; else 0
      refunded_amount_cents = max( 0, base - REFUND_PROCESSING_FEE_CENTS * branch )
      The fee is charged only on the terminal SETTLED and COMPENSATED branches, so a
      REQUESTED or PROCESSING refund reports the un-fee'd figure.
    constants:
      REFUND_PROCESSING_FEE_CENTS: 200
      HALF_VALUE_NUMERATOR: 1
      HALF_VALUE_DENOMINATOR: 2
    precision: "integer cents, round_half_up on the half-value step, max() applied last"
    variants:
      - name: per_purchase
        when: "default; the whole subtotal is priced as one unit"
        difference: "one half-value rounding for the entire purchase"
      - name: per_ticket
        when: "used when the purchase carries more than one ticket type in its seat_labels"
        difference: "round_half_up is applied to the per-ticket share (subtotal_cents / quantity) and then multiplied back; subtotal 8385 with quantity 4 gives per_purchase 4193 but per_ticket 4196 — a 3 cent gap on identical inputs"

  - name: exchange_cost
    trigger: "POST /exchanges/{exchange_id}/quotations"
    subject: ExchangeRequest
    algorithm: tiered_pricing
    inputs: [TicketPurchase.subtotal_cents, RushAllocation.discount_pct of the target, Production.exchange_fee_cents, Performance.starts_at, ExchangeRequest.status]
    formula: |
      target_face_cents    = Performance.face_value_cents
      target_price_cents   = round_half_up( target_face_cents * (1 - target_discount_pct) )
      price_difference     = target_price_cents - ( subtotal_cents / quantity )
      hours_before_start   = ( Performance.starts_at - today ) / 1 hour

      base_fee = 0
      if hours_before_start >= 24:  base_fee = 0
      elif hours_before_start >= 2: base_fee = Production.exchange_fee_cents
      else:                         base_fee = Production.exchange_fee_cents * 2

      if price_difference <= 0: fee_cents = min(500, base_fee)
      else:                     fee_cents = base_fee + price_difference

      value = subtotal_cents
      applied_branch = (status == APPLIED)
      value_returned_cents = 0 if applied_branch else max(0, value - fee_cents)
      On the APPLICATION transition, value_returned_cents is 0 because the 50%
      remainder is conserved in TicketPurchase.refunded_cents as
      fee_cents + (original_amount_cents - value_returned_cents).
    constants:
      EXCHANGE_FEE_CAP_CENTS: 500
      FREE_EXCHANGE_HOURS_BEFORE_START: 24
      DOUBLED_FEE_HOURS_BEFORE_START: 2
      DOUBLE_FEE_MULTIPLIER: 2
    precision: "integer cents, round_half_up once on target_price_cents, min() applied before the difference term"

  - name: reconciliation_variance
    trigger: "POST /allocations/{allocation_id}/reconciliations"
    subject: RushAllocation
    algorithm: aggregation
    inputs: [RushAllocation.reconciliation_variance_count, RushAllocation.reconciliation_variance_seats, SeatHold.seat_label, TicketPurchase.status]
    formula: |
      platform_set = { h.seat_label : SeatHold of Performance(performance_id)
                       where h.hold_kind == 'ALLOCATION' and h.status IN {HELD, ORPHANED} }
      claimed_set  = set( seat_labels_claimed )

      variance_count = count(claimed_set) - count(platform_set)
      variance_seats = sorted_ascending_lexicographic( claimed_set XOR platform_set )

      blocking = any( s in variance_seats for s in double_sell_seats )
      double_sell_seats = { p.seat_label : TicketPurchase p of Performance(performance_id)
                            where p.status IN {PENDING, AUTHORIZED} and p.refunded_cents == 0 }
    constants:
      VARIANCE_TOLERANCE_COUNT: 0
    precision: "integer counts; label comparison is exact and case-sensitive"

  - name: producer_quote
    trigger: "POST /purchases"
    subject: TicketPurchase
    algorithm: forward_looking
    inputs: [RushAllocation.ticket_type, TicketPurchase.payment_status, TicketPurchase.quantity, RushAllocation.per_seat_derived unit_price_cents]
    formula: |
      A quote is observable for a TicketPurchase only while
      payment_status IN {PENDING, AUTHORIZED}; once the purchase reaches
      SETTLED, REFUNDED, PARTIALLY_REFUNDED or VOIDED the quote is null.

      quote_surge_bp = SURGE_CAP_BP      # 5000, a fixed constant, never recomputed
      quoted_total_cents = round_half_up( unit_price_cents * (10000 + quote_surge_bp) / 10000 ) * quantity
      Pinned evaluation order: per-seat surge rounding first, then multiply by quantity —
      the reverse order is a different value.
    constants:
      SURGE_CAP_BP: 5000
      QUOTE_BASE_BP: 10000
    precision: "integer cents, round_half_up on the per-seat step, integer multiply thereafter"
    variants:
      - name: paid_only
        when: "default; the inclusion set is PAYMENT_STATUS IN {PENDING, AUTHORIZED}"
        difference: "a SETTLED purchase contributes null and is excluded from any producer total"
      - name: confirmed_and_settled
        when: "never reported; retained to detect implementations that widen the inclusion set"
        difference: "the same purchase would contribute a non-null quote after settlement, shifting a producer total by exactly one quoted_total_cents"

  - name: winner_selection
    trigger: "POST /allocations/{allocation_id}/draw-executions"
    subject: RushAllocation
    algorithm: weighted_scoring
    inputs: [DrawEntry.entered_at, DrawEntry.created_at, Patron.status]
    formula: |
      eligible = [ e : DrawEntry of allocation_id where e.status == 'ENTERED'
                   and Patron(e.patron_id).status == 'ACTIVE' ]
      ordered  = eligible sorted by ( entered_at ASC, created_at ASC )
                 # created_at ASC is the one and only tie-break; entry ids never break ties
      winners   = ordered[0 : winner_count]
      waitlisted= ordered[winner_count : winner_count + waitlist_count]
      losers    = ordered[winner_count + waitlist_count : ]

      rank_position = 1-based index of the entry inside `ordered`
      winner_count  = daily_release_cap            # seats actually dispensable this epoch
      waitlist_count= WAITLIST_MULTIPLIER * daily_release_cap
      When `eligible` is empty the execution returns ERR_DRAW_NO_ELIGIBLE_ENTRIES;
      the winner set is never resolved by a random draw.
    constants:
      WAITLIST_MULTIPLIER: 2
    precision: "integer rank positions and counts"

  - name: queue_rank
    trigger: "POST /ops-runs"
    subject: QueuePosition
    algorithm: chronological
    inputs: [QueuePosition.joined_at, QueuePosition.created_at]
    formula: |
      active = [ q : QueuePosition of performance where q.status == 'WAITING' ]
      ordered = active sorted by ( joined_at ASC, created_at ASC )
                 # joined_at is rewritten by a rejoin, which moves the patron to the back
      admit_quota = ADMIT_BP_of(admitted_so_far, daily_release_cap)
      admitted    = ordered[0 : admit_quota]
      ADMIT_BP_of(s, c) = ( QUOTA_FLOOR_SLOTS if c < QUOTA_FLOOR_MIN_CAP
                            else ceil( c * QUOTA_NUMERATOR / QUOTA_DENOMINATOR ) )
      QUOTA_FLOOR_SLOTS = min(s, 1)   # one slot when any admission has already happened, else 0
      Admission ceases entirely when the performance's rush allocation is not RELEASED.
    constants:
      QUOTA_NUMERATOR: 1
      QUOTA_DENOMINATOR: 2
      QUOTA_FLOOR_MIN_CAP: 2
      ADMISSION_WINDOW_MINUTES: 20
    precision: "integer slots; ceil on the proportional term, min() on the floor term"

  - name: market_handoff_dispatch
    trigger: "POST /purchases (valuation), POST /handoffs"
    subject: Performance
    algorithm: constraint_propagation
    inputs: [Market.handoff_model, Market.market_code, ConciergeDesk.daily_capacity, ConciergeDesk.handoffs_today]
    formula: |
      candidates = [ d : ConciergeDesk where d.market_code == performance.market_code
                     and d.status == 'OPEN'
                     and d.handoffs_today < d.daily_capacity ]
      ordered    = candidates sorted by ( (d.daily_capacity - d.handoffs_today) DESC,
                                          d.desk_code ASC )
                   # tie-break is desk_code ASC; desk ids never decide the destination
      if ordered is empty:
          assign_by = null
          handoff_status = 'PENDING_CONCIERGE'      # the purchase waits for a desk to open
      else:
          assign_by = ordered[0].desk_code
          handoff_status = 'PENDING_CONCIERGE'
      Handoff is required only when Market.handoff_model IN {CONCIERGE_DESK, HYBRID}.
      For handoff_model == MOBILE_PUSH the evaluation is skipped entirely, handoff_token
      stays null and handoff_status stays NOT_REQUIRED.
    constants:
      DEFAULT_HANDOFF_MODEL: MOBILE_PUSH
    precision: "no numeric rounding; ordering is integer DESC then lexicographic ASC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
#
# Ordering doctrine for this domain. Identity before permission; path existence
# before body references. Priority 5 is a single band carrying three checks that
# MUST be evaluated in this listed order — OCC first (a stale version makes every
# downstream comparison meaningless), then transition-state, then terminal-state.
# Windows follow at priorities 7-14, also evaluated in listed order, because
# "this entry is already forfeited" is a stronger statement than "your window
# lapsed". Constraint checks follow at priorities 15-21 in listed order: the
# market share cap binds before per-order limits, per-order limits bind before
# we are willing to price the order, and referential reconciliation sits inside
# priority 21's group because it reports on state other systems produced.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /patrons/registrations"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "every resource named in a path segment exists, validated left to right"
    error_id: ERR_PRODUCTION_NOT_FOUND | ERR_PERFORMANCE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_PURCHASE_NOT_FOUND | ERR_DRAW_ENTRY_NOT_FOUND | ERR_HOLD_NOT_FOUND | ERR_QUEUE_POSITION_NOT_FOUND | ERR_DESK_NOT_FOUND | ERR_HANDOFF_NOT_FOUND | ERR_REFUND_NOT_FOUND | ERR_EXCHANGE_NOT_FOUND | ERR_PATRON_NOT_FOUND | ERR_MARKET_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path segments

  - priority: 4
    category: existence
    check: "every entity reference supplied in a request body resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /performances, POST /performances/{id}/allocations, POST /performances/{id}/queue-positions, POST /purchases, POST /purchases/{id}/refund-requests, POST /purchases/{id}/exchange-requests, POST /performances/{id}/seat-holds, POST /handoffs"

  - priority: 5
    category: state
    check: "ordered triple, evaluated in this listed order — (5a) OCC: the submitted expected_*_version equals the parent row's current version; (5b) transition state: the target resource is in a state that permits the requested transition; (5c) terminal state: the target resource has not already reached a terminal state"
    error_id: ERR_STALE_VERSION | ERR_INVALID_STATE | ERR_ALREADY_TERMINAL
    http_status: 412 | 409 | 409
    applies_to: "every state-transition endpoint and every OCC-guarded write endpoint"

  - priority: 6
    category: business_temporal
    check: "the draw entry window is open: now >= entered window open and now < entries_close_at on the DRAW allocation"
    error_id: ERR_DRAW_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /performances/{id}/draw-entries"

  - priority: 7
    category: business_temporal
    check: "the patron holds no non-CANCELLED DrawEntry for the same allocation — one entry per person per draw"
    error_id: ERR_DUPLICATE_DRAW_ENTRY
    http_status: 409
    applies_to: "POST /performances/{id}/draw-entries"

  - priority: 8
    category: business_temporal
    check: "now < claim_deadline_at on the entry being claimed"
    error_id: ERR_CLAIM_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /draw-entries/{entry_id}/claims"

  - priority: 9
    category: business_temporal
    check: "now >= the allocation's release_at for the current release epoch; a rush seat cannot be bought before its release"
    error_id: ERR_RUSH_NOT_RELEASED
    http_status: 409
    applies_to: "POST /purchases, POST /performances/{id}/queue-positions"

  - priority: 10
    category: business_temporal
    check: "now <= admit_expires_at on the queue position being consumed"
    error_id: ERR_QUEUE_ADMISSION_EXPIRED
    http_status: 409
    applies_to: "POST /purchases"

  - priority: 11
    category: business_temporal
    check: "no non-terminal SeatHold of this performance carries the same seat_label — intervals are half-open [effective_from, effective_to) and an ALLOCATION hold collides with a BOX_OFFICE hold on its first instant"
    error_id: ERR_SEAT_ALREADY_HELD
    http_status: 409
    applies_to: "POST /performances/{id}/seat-holds"

  - priority: 12
    category: business_temporal
    check: "the order's seat run does not overlap an existing order block: an order of N seats occupies N consecutive seat_labels, and two runs whose label sets intersect are rejected while adjacent runs (next.start follows prior.end) are permitted"
    error_id: ERR_ORDER_BLOCK_CAPACITY
    http_status: 409
    applies_to: "POST /purchases"

  - priority: 13
    category: business_temporal
    check: "(Performance.starts_at - now) >= Production.refund_window_hours, or the allocation is refundable and the window still permits a partial return"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /purchases/{id}/refund-requests"

  - priority: 14
    category: business_constraint
    check: "releasing this allocation keeps the sum of quantity_released_today across all non-STANDARD allocations of the performance at or below MARKET_RUSH_SHARE_CAP_BP of total_seat_capacity"
    error_id: ERR_MARKET_SHARE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /allocations/{allocation_id}/releases/{release_epoch}"

  - priority: 15
    category: business_constraint
    check: "the requested quantity plus quantity_sold_today does not exceed daily_release_cap, and no DrawEntry claim consumes more than one seat"
    error_id: ERR_ALLOCATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /purchases"

  - priority: 16
    category: business_constraint
    check: "quantity <= the allocation's per_order_limit"
    error_id: ERR_PER_ORDER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /purchases, POST /draw-entries/{entry_id}/claims"

  - priority: 17
    category: business_constraint
    check: "the patron holds no QueuePosition for this performance with status in {WAITING, ADMITTED}"
    error_id: ERR_QUEUE_POSITION_EXISTS
    http_status: 409
    applies_to: "POST /performances/{id}/queue-positions"

  - priority: 18
    category: business_constraint
    check: "Production.status of the allocation's production is ACTIVE — a suspended partnership dispenses no seats"
    error_id: ERR_PRODUCTION_SUSPENDED
    http_status: 409
    applies_to: "POST /purchases, POST /draw-entries/{entry_id}/claims, POST /allocations/{allocation_id}/releases/{release_epoch}"

  - priority: 19
    category: business_constraint
    check: "the acting operator differs from the operator who recorded the prior step of the same workflow (qa_checked_by vs released_by, requested_by vs approved_by)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /allocations/{allocation_id}/releases/{release_epoch}, POST /refunds/{refund_id}/approvals, POST /exchanges/{exchange_id}/application"

  - priority: 20
    category: business_constraint
    check: "the submitted redemption_code equals the purchase handoff_token, and the assigned desk has handoffs_today < daily_capacity"
    error_id: ERR_HANDOFF_TOKEN_INVALID | ERR_DESK_CAPACITY_REACHED
    http_status: 422
    applies_to: "POST /handoffs, POST /handoffs"

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================

endpoints:

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
#
# REACHABILITY CONTRACT. Every path parameter with no owning parent is resolved
# through the GET below it, and every child collection is reachable from its
# parent's sub-resource GET. The full lookup surface is:
#   GET /productions/{id}                     resolves a production_id
#   GET /markets/{id}                         resolves a market_id
#   GET /patrons/{id}                         resolves a patron_id
#   GET /performances/{id}                    resolves a performance_id
#     GET /performances/{id}/allocations      resolves an allocation_id
#     GET /performances/{id}/draw-entries     resolves a draw_entry_id
#     GET /performances/{id}/queue-positions  resolves a queue_position_id
#     GET /performances/{id}/seat-holds       resolves a hold_id
#   GET /purchases/{id}                       resolves a purchase_id
#     GET /purchases/{id}/refund-requests     resolves a refund_id
#     GET /purchases/{id}/exchange-requests   resolves an exchange_id
# =============================================================================
endpoints:

  # --- System / operator surface ---

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and the clock MUST NOT fall back to real wall-clock time, so an unset clock is a fixed earliest instant rather than today's drifting date."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances; no business rows mutate"]

  - method: POST
    path: "/ops-runs"
    description: "Advance the system to an operational epoch and settle every time-driven consequence in a fixed order: expire stale holds, admit the rush queue, draw winners, forfeit unclaimed wins, promote the waitlist, lapse admissions and reset desk counters."
    roles: [PlatformAdmin]
    code: 200
    input: [as_of_iso8601]
    output: { opened_epoch_iso8601: string, winners_notified_count: integer, waitlisted_promoted_count: integer, forfeited_count: integer, admissions_issued_count: integer, admissions_expired_count: integer, holds_expired_count: integer, desks_reset_count: integer }
    side_effects: ["runs the time-driven §1.2 transitions in the fixed order: hold expiry, queue admission, draw execution, claim forfeiture and waitlist promotion, admission lapse, desk reset"]

# --- Partnership and market configuration ---

  - method: POST
    path: "/productions"
    description: "Register a production partnership"
    roles: [OpsManager]
    code: 201
    input: [title, producer_org, refund_window_hours, exchange_fee_cents, "exchange_allowed?"]
    output: Production
    side_effects: ["Production.status=DRAFT", "version starts at 1"]

  - method: POST
    path: "/performances/{id}/draw-entries"
    description: "Enter an open draw, and re-enter one whose earlier entry was cancelled by a wider lifecycle event. One entry per patron per allocation; a winner may not re-enter."
    roles: [Patron]
    code: 201
    input: [allocation_id, declaration_text]
    output: DrawEntry
    side_effects: ["DrawEntry.status=ENTERED", "entered_at stamps the ranking instant; a re-entry restamps it and moves the patron to the back of the draw order", "re-entering after a CANCELLED entry settles the declaration plausibility cost"]


  - method: POST
    path: "/productions/{production_id}/status-transitions"
    description: "Move a production between partnership postures: activate, suspend, resume or close. The body selects the target posture and carries the OCC version of the partnership agreement."
    roles: [OpsManager]
    code: 200
    input: [to_status, "suspension_reason?", expected_production_version]
    output: Production
    side_effects: ["applies the §1.2 Production transition for to_status, including its RushAllocation and QueuePosition cascades", "increments Production.version by 1"]

  - method: POST
    path: "/markets"
    description: "Declare a market and, when it is not MOBILE_PUSH, its first concierge desk. The handoff_model decides whether tickets are pushed to the patron's phone or collected at a desk."
    roles: [OpsManager, PlatformAdmin]
    code: 201
    input: [market_code, city, handoff_model, "desk_code?", "daily_capacity?"]
    output: Market
    side_effects: ["creates the market", "creates one ConciergeDesk when desk_code and daily_capacity are supplied and handoff_model is not MOBILE_PUSH"]

  - method: GET
    path: "/markets/{market_id}"
    description: "Read a market and its handoff model"
    roles: [OpsManager, AllocationsCoordinator, ConciergeDeskStaff, CustomerService, DemandAnalyst]
    code: 200
    input: []
    output: Market
    side_effects: []

  # --- Performances ---

  - method: POST
    path: "/performances"
    description: "Schedule a dated performance under a production"
    roles: [OpsManager]
    code: 201
    input: [production_id, market_code, venue_name, starts_at, face_value_cents, total_seat_capacity]
    output: Performance
    side_effects: ["Performance.status=SCHEDULED", "market_code is resolved against a declared Market and is rejected with ERR_REFERENCE_NOT_FOUND when unknown"]

  - method: GET
    path: "/performances/{performance_id}"
    description: "Read a performance"
    roles: [OpsManager, AllocationsCoordinator, ProducerAnalyst, DemandAnalyst, CustomerService, ConciergeDeskStaff, Patron]
    code: 200
    input: []
    output: Performance
    side_effects: []

  - method: POST
    path: "/performances/{performance_id}/status-transitions"
    description: "Move a performance between SCHEDULED, ONSALE, CLOSED and CANCELLED"
    roles: [OpsManager]
    code: 200
    input: [to_status, expected_performance_version]
    output: Performance
    side_effects: ["applies the §1.2 Performance transition for to_status, including its allocation, draw-entry and queue cascades", "increments Performance.version by 1"]

# --- Allocations and release ---

  - method: POST
    path: "/performances/{id}/allocations"
    description: "Create a rush, premium or draw allocation grant under a performance"
    roles: [AllocationsCoordinator]
    code: 201
    input: [ticket_type, daily_quantity, discount_pct, release_time_local, refundable, "claim_window_minutes?", "winner_basis_points?", "waitlist_multiplier?", per_order_limit]
    output: RushAllocation
    side_effects: ["RushAllocation.status=DRAFT", "quantity_released_today=0, quantity_sold_today=0, quantity_carried_forward=0, daily_release_cap=0, reconciliation_status=NOT_SUBMITTED"]

  - method: GET
    path: "/performances/{id}/allocations"
    description: "List the allocations of a performance"
    roles: [OpsManager, AllocationsCoordinator, ProducerAnalyst, DemandAnalyst, CustomerService, ConciergeDeskStaff]
    code: 200
    input: ["ticket_type?", "status?", "limit?", "offset?"]
    output: RushAllocation[]
    side_effects: []

  - method: POST
    path: "/allocations/{allocation_id}/scheduling"
    description: "Approve an allocation grant so it may be released on its release epochs"
    roles: [AllocationsCoordinator]
    code: 200
    input: [expected_allocation_version]
    output: RushAllocation
    side_effects: ["RushAllocation.status → SCHEDULED", "increments RushAllocation.version by 1"]

  - method: POST
    path: "/allocations/{allocation_id}/releases/{release_epoch}"
    description: "Release the day's rush quantity for a release epoch. The epoch path segment is the release date in YYYY-MM-DD form; only the allocation's next unsettled epoch is accepted."
    roles: [OpsManager]
    code: 200
    input: [expected_production_version, expected_performance_version, expected_allocation_version]
    output: RushAllocation
    side_effects: ["computes rush_daily_release_cap and stamps quantity_released_today", "carries the prior epoch's unsold remainder into quantity_carried_forward", "RushAllocation.status → RELEASED", "increments Production.version, Performance.version and RushAllocation.version by 1"]

  - method: POST
    path: "/allocations/{allocation_id}/draw-executions"
    description: "Draw the winners of a DRAW allocation for the current release epoch, ranking entries by the instant they were entered and using created_at only to separate identical instants."
    roles: [OpsManager]
    code: 200
    input: [expected_allocation_version]
    output: { allocation_id: string, winner_count: integer, waitlisted_count: integer, loser_count: integer, winner_entry_ids: string, waitlisted_entry_ids: string }
    side_effects: ["each ENTERED entry moves to WINNER, WAITLISTED or LOSER per winner_selection", "WINNER rows receive notified_at and claim_deadline_at", "increments RushAllocation.version by 1"]



# --- Patron surface ---

  - method: POST
    path: "/patrons/registrations"
    description: "Register a patron. This is the only endpoint that does not require identity headers."
    roles: [Anonymous]
    code: 201
    input: [email, display_name, market_code]
    output: Patron
    side_effects: ["Patron.status=ACTIVE", "Patron.draw_violation_count=0"]

  - method: GET
    path: "/patrons/{patron_id}"
    description: "Read a patron, including current draw standing"
    roles: [Patron, CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: Patron
    side_effects: []

  - method: POST
    path: "/patrons/{patron_id}/status-transitions"
    description: "Block or unblock a patron. Blocking a patron carrying one or more recorded draw violations also abandons their queue positions and cancels their open draw entries."
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: [to_status, expected_patron_version]
    output: Patron
    side_effects: ["applies the §1.2 Patron transition, including the queue-abandon and entry-cancel cascades on block", "increments Patron.version by 1"]

  - method: POST
    path: "/patrons/{patron_id}/draw-reinstatements"
    description: "Reinstate one forfeited draw win, once. Draws down the patron's violation count and restarts the claim window from the reinstatement instant."
    roles: [CustomerService]
    code: 200
    input: [draw_entry_id, expected_draw_entry_version]
    output: DrawEntry
    side_effects: ["DrawEntry.status FORFEITED → WINNER", "recomputes claim_deadline_at from the reinstatement instant", "decrements Patron.draw_violation_count by 1, floored at 0", "increments DrawEntry.version by 1"]

# --- Draw entry and queueing ---

  - method: POST
    path: "/exchanges/{exchange_id}/approvals"
    description: "Approve or reject a quoted exchange. The approving operator must differ from the requesting operator."
    roles: [CustomerService]
    code: 200
    input: [decision, expected_purchase_version]
    output: ExchangeRequest
    side_effects: ["ExchangeRequest.status → APPROVED or REJECTED", "increments TicketPurchase.version by 1"]

  - method: GET
    path: "/performances/{id}/draw-entries"
    description: "List the draw entries filed against a performance"
    roles: [OpsManager, CustomerService, ProducerAnalyst, DemandAnalyst, Patron]
    code: 200
    input: ["allocation_id?", "patron_id?", "status?", "limit?", "offset?"]
    output: DrawEntry[]
    side_effects: []


  - method: POST
    path: "/draw-entries/{entry_id}/claims"
    description: "Claim a winning draw entry inside its notification window and open the purchase for the won seats"
    roles: [Patron]
    code: 201
    input: [quantity, expected_draw_entry_version]
    output: TicketPurchase
    side_effects: ["DrawEntry.status WINNER → PURCHASED and purchase_id is stamped", "creates a TicketPurchase priced by per_seat_price and purchase_line_subtotal", "the claim's seat hold is created ALLOCATION/HELD and the sold counter advances", "can push the allocation to EXHAUSTED", "increments DrawEntry.version and RushAllocation.version by 1"]

  - method: POST
    path: "/performances/{id}/queue-positions"
    description: "Join the rush queue for a performance once its release time has passed. One active position per patron per performance."
    roles: [Patron]
    code: 201
    input: [allocation_id]
    output: QueuePosition
    side_effects: ["QueuePosition.status=WAITING", "joined_at stamps the ranking instant"]

  - method: GET
    path: "/performances/{id}/queue-positions"
    description: "List the rush queue of a performance, in rank order"
    roles: [OpsManager, AllocationsCoordinator, CustomerService, Patron, ConciergeDeskStaff]
    code: 200
    input: ["patron_id?", "status?", "limit?", "offset?"]
    output: QueuePosition[]
    side_effects: []

# --- Purchases ---

  - method: POST
    path: "/purchases"
    description: "Buy rush seats. The patron must hold an admitted queue position inside its window, or the order must be a draw claim's seat."
    roles: [Patron]
    code: 201
    input: [performance_id, allocation_id, quantity, idempotency_key]
    output: TicketPurchase
    side_effects: ["creates a TicketPurchase with payment_status=PENDING, logistics_status=AWAITING_HANDOFF and handoff_status derived from the market handoff model", "prices the order with per_seat_price and purchase_line_subtotal", "creates this purchase's ALLOCATION seat holds", "a matching queue position moves to PURCHASED", "advances quantity_sold_today and can push the allocation to EXHAUSTED", "increments RushAllocation.version by 1"]

  - method: GET
    path: "/purchases"
    description: "List purchases, narrowed by patron, performance, allocation or any of the three status dimensions"
    roles: [OpsManager, CustomerService, FinancialOps, ConciergeDeskStaff, Patron, ProducerAnalyst, DemandAnalyst]
    code: 200
    input: ["patron_id?", "performance_id?", "allocation_id?", "payment_status?", "logistics_status?", "handoff_status?", "limit?", "offset?"]
    output: TicketPurchase[]
    side_effects: []

  - method: GET
    path: "/purchases/{purchase_id}"
    description: "Read a purchase, including its three status dimensions"
    roles: [OpsManager, CustomerService, FinancialOps, ConciergeDeskStaff, Patron, ProducerAnalyst, DemandAnalyst]
    code: 200
    input: []
    output: TicketPurchase
    side_effects: []

  - method: POST
    path: "/purchases/{purchase_id}/settlements"
    description: "Authorize and settle a pending purchase, consuming its seat holds and settling every refund already processing against it"
    roles: [FinancialOps]
    code: 200
    input: [expected_purchase_version]
    output: TicketPurchase
    side_effects: ["TicketPurchase.payment_status PENDING → AUTHORIZED → SETTLED", "every matching ALLOCATION SeatHold moves to CONSUMED", "every RefundRequest of this purchase in PROCESSING moves to SETTLED", "increments TicketPurchase.version by 1"]

  - method: POST
    path: "/purchases/{purchase_id}/deliveries"
    description: "Push the ticket to the patron's phone. Only valid in markets whose handoff model is MOBILE_PUSH."
    roles: [DemandAnalyst, CustomerService]
    code: 200
    input: [expected_purchase_version]
    output: TicketPurchase
    side_effects: ["TicketPurchase.logistics_status AWAITING_HANDOFF → DELIVERED", "increments TicketPurchase.version by 1"]

  - method: POST
    path: "/refunds/{refund_id}/approvals"
    description: "Approve or reject a refund request. The approving operator must differ from the operator who opened the request."
    roles: [CustomerService]
    code: 200
    input: [decision, expected_purchase_version]
    output: RefundRequest
    side_effects: ["RefundRequest.status REQUESTED → PROCESSING or REJECTED", "increments TicketPurchase.version by 1"]

  - method: POST
    path: "/handoffs"
    description: "Desk handoff. Presenting the purchase's token at an open desk with capacity left verifies the patron and marks the seats collected; presenting a wrong token records exactly one permanently failed attempt, and a purchase that has already failed can never be verified."
    roles: [ConciergeDeskStaff]
    code: 201
    input: [purchase_id, desk_code, redemption_code, idempotency_key]
    output: TicketPurchase
    side_effects: ["on a matching token: handoff_status → VERIFIED, logistics_status → COLLECTED, handoffs_today increments by 1", "on a non-matching token: handoff_status → FAILED", "ConciergeDesk.status → SATURATED when handoffs_today reaches daily_capacity", "increments TicketPurchase.version and ConciergeDesk.version by 1"]

# --- Seat holds ---

  - method: POST
    path: "/performances/{id}/seat-holds"
    description: "Place a seat hold on a performance. An ALLOCATION hold belongs to a rush allocation; a BOX_OFFICE or HOUSE hold records inventory the box office has taken off the platform's hands."
    roles: [AllocationsCoordinator]
    code: 201
    input: [allocation_id, seat_label, hold_kind, "origin_ref?"]
    output: SeatHold
    side_effects: ["SeatHold.status=HELD on the half-open interval [effective_from, effective_to)", "effective_from stamps the interval start; effective_to is left null for ALLOCATION holds", "an overlap with any non-terminal hold on the same seat label is rejected with ERR_SEAT_ALREADY_HELD"]

  - method: GET
    path: "/performances/{id}/seat-holds"
    description: "List seat holds for a performance, filtered by allocation, hold kind or status"
    roles: [OpsManager, AllocationsCoordinator, ProducerAnalyst, DemandAnalyst, ConciergeDeskStaff]
    code: 200
    input: ["allocation_id?", "hold_kind?", "status?", "limit?", "offset?"]
    output: SeatHold[]
    side_effects: []

# --- Refunds and exchanges ---

  - method: POST
    path: "/purchases/{id}/refund-requests"
    description: "Open a refund against a settled or authorized purchase. The refundable amount is priced by the refund_amount rule, which reads the production's refund window and the allocation's refundable flag."
    roles: [Patron, CustomerService]
    code: 201
    input: [reason_code, expected_purchase_version]
    output: RefundRequest
    side_effects: ["RefundRequest.status=REQUESTED", "stamps refunded_amount_cents from refund_amount", "increments TicketPurchase.version by 1"]


  - method: POST
    path: "/allocations/{allocation_id}/reconciliations"
    description: "Submit a box-office-held seat figure for the allocation's period and compare it against the platform's own held seats. A clean count stamps the allocation reconciled; an overdue non-zero variance orphans the held seats and suspends the allocation."
    roles: [AllocationsCoordinator]
    code: 200
    input: [seat_count_claimed, seat_labels_claimed, expected_allocation_version]
    output: RushAllocation
    side_effects: ["stamps reconciliation_status, reconciliation_variance_count and reconciliation_variance_seats on the allocation", "a zero variance sets reconciliation_status=RECONCILED and returns ORPHANED ALLOCATION holds to HELD", "a non-zero variance past reconcile_deadline_at sets reconciliation_status=MISMATCH, moves HELD ALLOCATION holds to ORPHANED and moves the allocation to SUSPENDED", "increments RushAllocation.version by 1"]

  - method: POST
    path: "/refunds/{refund_id}/settlement"
    description: "Settle a processing refund: return the money, return the seats to the allocation's sold counter and lift the allocation back out of EXHAUSTED when the returned seats reopen it."
    roles: [FinancialOps]
    code: 200
    input: [expected_purchase_version]
    output: RefundRequest
    side_effects: ["RefundRequest.status → SETTLED", "TicketPurchase.refunded_cents increases by refunded_amount_cents and payment_status moves to REFUNDED", "RushAllocation.quantity_sold_today decreases by the purchased quantity", "RushAllocation.status EXHAUSTED → RELEASED when the returned seats reopen the epoch", "increments TicketPurchase.version and RushAllocation.version by 1"]

  - method: POST
    path: "/purchases/{id}/exchange-requests"
    description: "Open an exchange for a settled purchase onto a different allocation of the same performance. The patron's recalled amount is captured verbatim so a stale recall can be detected at quotation."
    roles: [Patron, CustomerService]
    code: 201
    input: [target_allocation_id, original_amount_cents, expected_purchase_version]
    output: ExchangeRequest
    side_effects: ["ExchangeRequest.status=REQUESTED", "increments TicketPurchase.version by 1"]

  - method: GET
    path: "/purchases/{id}/exchange-requests"
    description: "List the exchange requests opened against a purchase"
    roles: [CustomerService, FinancialOps, PlatformAdmin, Patron]
    code: 200
    input: []
    output: ExchangeRequest[]
    side_effects: []

  - method: POST
    path: "/exchanges/{exchange_id}/quotations"
    description: "Quote the exchange fee and the value returned, under the base exchange_cost variant"
    roles: [CustomerService]
    code: 200
    input: [expected_purchase_version]
    output: ExchangeRequest
    side_effects: ["ExchangeRequest.status → QUOTED", "stamps fee_cents and value_returned_cents", "increments TicketPurchase.version by 1"]


  - method: POST
    path: "/exchanges/{exchange_id}/application"
    description: "Apply an approved exchange: move the seats, recompute what the purchase shows as refunded, and issue a fresh handoff token when the market needs one"
    roles: [CustomerService]
    code: 200
    input: [expected_purchase_version, expected_performance_version]
    output: ExchangeRequest
    side_effects: ["ExchangeRequest.status → APPLIED", "TicketPurchase.refunded_cents = fee_cents + (original_amount_cents - value_returned_cents)", "the source SeatHold moves to RELEASED and a target SeatHold is created HELD on the target allocation", "a fresh handoff_token is issued for non-MOBILE_PUSH markets", "increments Performance.version and TicketPurchase.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (30 codes)
# =============================================================================
errors:

  # --- Identity and permission ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or the role value is not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "The acting operator equals the operator recorded on the prior step of the same two-step workflow"

  # --- Optimistic concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "A submitted expected_*_version no longer equals the parent row's current version"

  # --- Path existence (validated left to right) ---
  - id: ERR_PRODUCTION_NOT_FOUND
    http: 404
    condition: "The production_id path segment does not resolve"
  - id: ERR_PERFORMANCE_NOT_FOUND
    http: 404
    condition: "The performance_id path segment does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "The allocation_id path segment does not resolve"
  - id: ERR_PURCHASE_NOT_FOUND
    http: 404
    condition: "The purchase_id path segment does not resolve"
  - id: ERR_DRAW_ENTRY_NOT_FOUND
    http: 404
    condition: "The entry_id path segment does not resolve"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "The hold_id path segment does not resolve"
  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "The refund_id path segment does not resolve"
  - id: ERR_EXCHANGE_NOT_FOUND
    http: 404
    condition: "The exchange_id path segment does not resolve"
  - id: ERR_PATRON_NOT_FOUND
    http: 404
    condition: "The patron_id path segment does not resolve"

  # --- Body reference existence ---
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "An entity id in the request body — production_id, market_code, allocation_id, desk_code or target_allocation_id — does not resolve"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a state that permits the requested transition, or is already terminal"
  - id: ERR_PRODUCTION_SUSPENDED
    http: 409
    condition: "The production of the allocation or performance is SUSPENDED, so no seats may be dispensed"

  # --- Draw windows and deadlines ---
  - id: ERR_DRAW_WINDOW_CLOSED
    http: 409
    condition: "The draw's entry window has not opened yet or has already closed"
  - id: ERR_DUPLICATE_DRAW_ENTRY
    http: 409
    condition: "The patron already holds a DrawEntry for this allocation that is not CANCELLED"
  - id: ERR_DRAW_NO_ELIGIBLE_ENTRIES
    http: 409
    condition: "The draw execution found no ENTERED entry whose patron is ACTIVE"
  - id: ERR_CLAIM_DEADLINE_PASSED
    http: 409
    condition: "The claim is attempted after claim_deadline_at on a WINNER entry"

  # --- Rush timing and queueing ---
  - id: ERR_RUSH_NOT_RELEASED
    http: 409
    condition: "The action precedes the allocation's release_at for the current epoch, or the allocation is not RELEASED"
  - id: ERR_QUEUE_ADMISSION_EXPIRED
    http: 409
    condition: "The purchase relies on a queue admission whose admit_expires_at has already passed"
  - id: ERR_QUEUE_POSITION_EXISTS
    http: 409
    condition: "The patron already holds a WAITING or ADMITTED queue position for this performance"

  # --- Inventory and holds ---
  - id: ERR_SEAT_ALREADY_HELD
    http: 409
    condition: "The seat label overlaps a non-terminal hold on the same performance, or an order's contiguous seat run collides with an existing run"
  - id: ERR_MARKET_SHARE_CAP_EXCEEDED
    http: 409
    condition: "A release would push the performance's discounted inventory above MARKET_RUSH_SHARE_CAP_BP of total_seat_capacity"
  - id: ERR_ALLOCATION_EXHAUSTED
    http: 409
    condition: "The order or claim would take quantity_sold_today past daily_release_cap, or a claim would consume more than one seat"

  # --- Pricing and money ---
  - id: ERR_PER_ORDER_LIMIT_EXCEEDED
    http: 409
    condition: "The requested quantity exceeds the allocation's per_order_limit"
  - id: ERR_REFUND_WINDOW_CLOSED
    http: 409
    condition: "The production's refund window has closed and the allocation is not refundable"

  # --- Concierge handoff ---
  - id: ERR_HANDOFF_TOKEN_INVALID
    http: 422
    condition: "The submitted redemption_code does not equal the purchase handoff_token, or the purchase has already recorded a failed handoff"
  - id: ERR_DESK_CAPACITY_REACHED
    http: 409
    condition: "The assigned desk is SATURATED or its handoffs_today has reached daily_capacity"

# =============================================================================
# §1.7 RBAC Matrix (10 roles)
# =============================================================================
roles:

  - name: Anonymous
    description: "An unauthenticated visitor; may only register a patron account"
    identity: opaque
    exclusive_operations: ["POST /patrons/registrations"]
    shared_operations: []

  - name: Patron
    description: "A ticket buyer who enters draws, joins queues and buys rush seats"
    identity: entity_backed:Patron
    exclusive_operations:
      - "POST /performances/{id}/draw-entries"
      - "POST /draw-entries/{entry_id}/claims"
      - "POST /performances/{id}/queue-positions"
      - "POST /purchases"
    shared_operations:
      - "GET /patrons/{patron_id}"
      - "GET /performances/{id}/draw-entries"
      - "GET /performances/{id}/queue-positions"
      - "GET /purchases"
      - "POST /purchases/{id}/refund-requests"
      - "POST /purchases/{id}/exchange-requests"
      - "GET /purchases/{id}/refund-requests"

  - name: OpsManager
    description: "Runs the partnership: activates productions, schedules performances, releases daily rush quantity and moves lifecycle state"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{production_id}/status-transitions"
      - "POST /performances"
      - "POST /performances/{performance_id}/status-transitions"
      - "POST /allocations/{allocation_id}/reconciliations"
      - "POST /allocations/{allocation_id}/releases/{release_epoch}"
      - "POST /allocations/{allocation_id}/draw-executions"
    shared_operations:
      - "POST /productions"
      - "POST /markets"
      - "GET /performances/{id}/allocations"
      - "GET /allocations/{allocation_id}/reconciliations"
      - "GET /purchases"
      - "GET /performances/{id}/seat-holds"

  - name: AllocationsCoordinator
    description: "Attests allocation quantities and reconciles held inventory against the box office; may not authorise the release it attested"
    identity: opaque
    exclusive_operations:
      - "POST /performances/{id}/allocations"
      - "POST /allocations/{allocation_id}/scheduling"
      - "POST /allocations/{allocation_id}/reconciliations"
      - ""
      - "POST /performances/{id}/seat-holds"
    shared_operations:
      - "GET /performances/{id}/allocations"
      - "GET /performances/{id}/seat-holds"

  - name: CustomerService
    description: "Handles patron-facing remedies: reinstatements, refunds, exchanges and patron standing"
    identity: opaque
    exclusive_operations:
      - "POST /patrons/{patron_id}/draw-reinstatements"
      - "POST /exchanges/{exchange_id}/quotations"
      - "POST /exchanges/{exchange_id}/application"
    shared_operations:
      - "POST /patrons/{patron_id}/status-transitions"
      - "POST /purchases/{id}/refund-requests"
      - "POST /purchases/{id}/exchange-requests"
      - "POST /handoffs"
      - "GET /performances/{id}/draw-entries"
      - "GET /purchases/{id}/refund-requests"
      - "POST /performances/{id}/draw-entries"

  - name: FinancialOps
    description: "Settles money movements: authorises and settles purchases, settles refunds"
    identity: opaque
    exclusive_operations:
      - "POST /purchases/{purchase_id}/settlements"
      - "POST /refunds/{refund_id}/settlement"
    shared_operations:
      - "GET /purchases"
      - "GET /purchases/{id}/refund-requests"

  - name: ConciergeDeskStaff
    description: "Verifies patron identity at a physical desk and records the handoff"
    identity: opaque
    exclusive_operations:
      - "POST /handoffs"
    shared_operations:
      - "GET /purchases"
      - "GET /performances/{id}/queue-positions"
      - "GET /performances/{id}/seat-holds"

  - name: ProducerAnalyst
    description: "Read-only counterparty role that consumes the demand data shared with producers"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /allocations/{allocation_id}/reconciliations"
      - "GET /performances/{id}/allocations"

  - name: DemandAnalyst
    description: "Read-only internal role that consumes the same demand data for pricing and allocation planning"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /purchases"
      - "GET /performances/{id}/draw-entries"
      - "GET /performances/{id}/seat-holds"
      - "GET /allocations/{allocation_id}/reconciliations"

  - name: PlatformAdmin
    description: "Holds the logical clock and the operational epoch control surface; not a business role"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ops-runs"
      - "POST /markets"
    shared_operations:
      - "GET /patrons/{patron_id}"
      - "POST /patrons/{patron_id}/status-transitions"
