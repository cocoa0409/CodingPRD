            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Incident Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-I", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
