scaffold_corner_design:
  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_participant_returns_201_with_fields
        claim_type: Creation
        grounds:
          - "entities.Participant"
          - "endpoints"
        distinguishing_aspect: "POST /participants with all required fields returns 201 and echoes email, full_name, employee_id, default is_five_percent_owner=false, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { email: "new@x.com", full_name: "New P", employee_id: "ENEW" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { np_id: $.data.id, np_status: $.data.status, np_owner: $.data.is_five_percent_owner }
          assert:
            - "response status == 201"
            - "Participant.${np_id}.status == ACTIVE"
            - "Participant.${np_id}.is_five_percent_owner == false"

      - name: get_participant_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - "entities.Participant"
        distinguishing_aspect: "GET /participants/{id} returns the same entity that was created, with matching email."
        test_recipe:
          setup: ["A participant exists"]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "ret@x.com", full_name: "Ret P", employee_id: "ERET" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { rp_id: $.data.id }
          trigger:
            - call: "GET /participants/${rp_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { rp_email: $.data.email }
          assert:
            - "Participant.${rp_id}.email == ret@x.com"

      - name: list_offering_periods_paginated
        claim_type: Listing
        grounds:
          - "endpoints"
          - "entities.OfferingPeriod"
        distinguishing_aspect: "GET /plans/{id}/offering-periods returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["A plan with one offering period"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "ListCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { lp_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${lp_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
          trigger:
            - call: "GET /plans/${lp_id}/offering-periods"
              payload: { limit: 10, offset: 0 }
              as: PlanAdministrator
              as_user_id: admin1
          assert:
            - "response_type == array"
            - "meta/pagination total_count == 1 and has_more == false"

      - name: get_participant_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /participants/{nonexistent-uuid} returns ERR_NOT_FOUND with 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /participants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { nf_err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_offering_missing_grant_fmv_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.OfferingPeriod.fields.grant_date_fmv_cents"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /offering-periods omitting required grant_date_fmv_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A plan exists"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "MissCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { mc_id: $.data.id }
          trigger:
            - call: "POST /offering-periods"
              payload: { plan_id: "${mc_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { miss_err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: plan_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - "entities.Plan.fields.max_contribution_rate_pct"
          - "entities.Plan.fields.discount_pct"
          - "entities.Plan.fields.annual_purchase_limit_usd"
        distinguishing_aspect: "POST /plans omitting optional fields applies defaults: max_contribution_rate_pct=15, discount_pct=15, lookback_enabled=true, annual_purchase_limit_usd=25000."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { company_name: "DefCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { dc_id: $.data.id, dc_rate: $.data.max_contribution_rate_pct, dc_disc: $.data.discount_pct, dc_lim: $.data.annual_purchase_limit_usd }
          assert:
            - "Plan.${dc_id}.max_contribution_rate_pct == 15"
            - "Plan.${dc_id}.discount_pct == 15"
            - "Plan.${dc_id}.annual_purchase_limit_usd == 25000"

      - name: offering_end_date_computed_from_duration
        claim_type: Computed Fields
        grounds:
          - "entities.OfferingPeriod.fields.end_date"
        distinguishing_aspect: "end_date is computed = grant_date + duration_months; for grant 2024-01-01 + 12 months it is 2025-01-01, ignoring any client-supplied end_date."
        test_recipe:
          setup: ["A plan exists"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "EndCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { ec_id: $.data.id }
          trigger:
            - call: "POST /offering-periods"
              payload: { plan_id: "${ec_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { eo_id: $.data.id, eo_end: $.data.end_date }
          assert:
            - "OfferingPeriod.${eo_id}.end_date == 2025-01-01T00:00:00.000Z"

      - name: participant_system_fields_generated
        claim_type: System Fields
        grounds:
          - "entities.Participant.fields.status"
        distinguishing_aspect: "Server mints id, created_at, version=1 and sets status=ACTIVE; any client-supplied id/status is ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { email: "sys@x.com", full_name: "Sys P", employee_id: "ESYS" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { sp_id: $.data.id, sp_ver: $.data.version }
          assert:
            - "Participant.${sp_id}.version == 1"
            - "Participant.${sp_id}.created_at is a valid ISO8601 timestamp"

      - name: offering_duration_out_of_range_type_constraint
        claim_type: Type Constraints
        grounds:
          - "entities.OfferingPeriod.fields.duration_months"
          - "validations[priority=10]"
        excluded_because:
          difficulty_instance: boundary_precision_check / offering_duration_lower_bound_six_months_inclusive
          rationale: "The duration boundary metric is exercised by the named §1.8 boundary instance (6 accepted; the rejection side is the same validation)."

      - name: contribution_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.Contribution"
        distinguishing_aspect: "Contribution has common_fields:false, so its read carries only id and created_at (no version field) and there is no update endpoint."
        test_recipe:
          setup: ["A POSTED contribution exists"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "ImmCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "imm@x.com", full_name: "Imm P", employee_id: "EIMM" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${im_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im_off: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${im_p}", offering_period_id: "${im_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${im_p}"
              captures: { im_enr: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${im_enr}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 500000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im_contr_amt: $.data.amount_cents }
          trigger:
            - call: "GET /contributions"
              payload: { enrollment_id: "${im_enr}" }
              as: PlanAdministrator
              as_user_id: admin1
          assert:
            - "Contribution amount_cents == 50000"
            - "Contribution read carries no version field"

      - name: offering_requires_existing_plan_parent
        claim_type: Parent Relationships
        grounds:
          - "entities.OfferingPeriod.fields.plan_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /offering-periods with a non-existent plan_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offering-periods"
              payload: { plan_id: "00000000-0000-0000-0000-000000000000", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: enrollment_initial_state_is_enrolled
        claim_type: Initial State
        grounds:
          - "state_machines.Enrollment"
        distinguishing_aspect: "A newly created Enrollment starts in status ENROLLED with version 1."
        test_recipe:
          setup: ["An OPEN offering exists"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "InitCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { in_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "init@x.com", full_name: "Init P", employee_id: "EINIT" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { in_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${in_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { in_off: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { participant_id: "${in_p}", offering_period_id: "${in_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${in_p}"
              captures: { in_enr: $.data.id, in_status: $.data.status }
          assert:
            - "Enrollment.${in_enr}.status == ENROLLED"
            - "Enrollment.${in_enr}.version == 1"

      - name: resume_from_enrolled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Enrollment.SUSPENDED_to_ENROLLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /enrollments/{id}/resume on an ENROLLED (not SUSPENDED) enrollment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ENROLLED enrollment"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "ResCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { rs_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "res@x.com", full_name: "Res P", employee_id: "ERES" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { rs_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${rs_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { rs_off: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${rs_p}", offering_period_id: "${rs_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${rs_p}"
              captures: { rs_enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${rs_enr}/resume"
              payload: {}
              as: Participant
              as_user_id: "${rs_p}"
              captures: { rs_err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminal_withdrawn_enrollment_locks_down
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Enrollment"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "After WITHDRAWN (terminal), a second withdraw returns ERR_INVALID_STATE; no further transitions possible."
        test_recipe:
          setup: ["A WITHDRAWN enrollment"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "TermCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { tm_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "term@x.com", full_name: "Term P", employee_id: "ETERM" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { tm_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${tm_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { tm_off: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${tm_p}", offering_period_id: "${tm_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${tm_p}"
              captures: { tm_enr: $.data.id }
            - call: "POST /enrollments/${tm_enr}/withdraw"
              payload: {}
              as: Participant
              as_user_id: "${tm_p}"
          trigger:
            - call: "POST /enrollments/${tm_enr}/withdraw"
              payload: {}
              as: Participant
              as_user_id: "${tm_p}"
              captures: { tm_err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: suspend_then_suspend_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.Enrollment.ENROLLED_to_SUSPENDED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling suspend twice: the second suspend on an already-SUSPENDED enrollment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SUSPENDED enrollment"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "IdemCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { id_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "idem@x.com", full_name: "Idem P", employee_id: "EIDEM" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { id_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${id_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { id_off: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${id_p}", offering_period_id: "${id_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${id_p}"
              captures: { id_enr: $.data.id }
            - call: "POST /enrollments/${id_enr}/suspend"
              payload: {}
              as: Participant
              as_user_id: "${id_p}"
          trigger:
            - call: "POST /enrollments/${id_enr}/suspend"
              payload: {}
              as: Participant
              as_user_id: "${id_p}"
              captures: { id_err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: sequence_gate_open_second_batch_before_first_terminal
        claim_type: guarded transitions
        grounds:
          - "state_machines.PurchasePeriod.PENDING_to_OPEN"
          - "validations[priority=9]"
          - "errors[ERR_SEQUENCE_NOT_READY]"
        distinguishing_aspect: "Opening sequence_index=2 while sequence_index=1 is still PENDING returns ERR_SEQUENCE_NOT_READY (409)."
        test_recipe:
          setup: ["An ENROLLMENT_CLOSED offering with two PENDING purchase periods, sequence 1 and 2"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "SeqCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { sq_plan: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${sq_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { sq_off: $.data.id }
            - call: "POST /offering-periods/${sq_off}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${sq_off}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-04-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { sq_pp1: $.data.id }
            - call: "POST /offering-periods/${sq_off}/purchase-periods"
              payload: { sequence_index: 2, purchase_date: "2024-08-31T00:00:00.000Z", purchase_date_fmv_cents: 1300 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { sq_pp2: $.data.id }
          trigger:
            - call: "POST /purchase-periods/${sq_pp2}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { sq_err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SEQUENCE_NOT_READY"

      - name: cancel_offering_cascade_down_to_children
        claim_type: Cascade down
        grounds:
          - "state_machines.OfferingPeriod.OPEN_to_CANCELLED"
          - "state_machines.Enrollment.ENROLLED_to_WITHDRAWN"
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_offering_withdraws_enrollment_refunds_contributions_depth3
          rationale: "Cancel-offering cascade-down to enrollments/contributions is the depth-3 §1.8 cascade instance."

      - name: run_purchase_last_batch_bubbles_offering_closed
        claim_type: Bubble up
        grounds:
          - "state_machines.OfferingPeriod.ACTIVE_to_CLOSED"
        excluded_because:
          difficulty_instance: transitive_cascade / run_purchase_charges_ledger_closes_offering_completes_enrollment_depth3
          rationale: "Last-batch bubble-up close is the second depth-3 §1.8 cascade instance."

      - name: disposition_full_sale_cross_entity_sharelot_disposed
        claim_type: Cross-entity
        grounds:
          - "state_machines.ShareLot.OPEN_to_FULLY_DISPOSED"
        excluded_because:
          difficulty_instance: non_linear_state_machine / disposition_branching_qualifying_vs_disqualifying_sideeffects
          rationale: "Disposition->ShareLot FULLY_DISPOSED cross-entity cascade asserted in the branching §1.8 instance."

      - name: run_purchase_ledger_sync_accrual_charged
        claim_type: Ledger sync
        grounds:
          - "state_machines.PurchasePeriod.CERTIFIED_to_PURCHASED"
          - "entities.AccrualLedger.fields.accrued_grant_value_cents"
        excluded_because:
          difficulty_instance: transitive_cascade / run_purchase_charges_ledger_closes_offering_completes_enrollment_depth3
          rationale: "AccrualLedger debit on run-purchase asserted in that §1.8 cascade instance."

      - name: withdraw_compensation_reverses_contributions
        claim_type: Compensation
        grounds:
          - "state_machines.Enrollment.ENROLLED_to_WITHDRAWN"
        excluded_because:
          difficulty_instance: compensating_invariant / withdraw_conserves_contribution_cash
          rationale: "Withdraw refund compensation/no-drift is the §1.8 cash-conservation invariant."

      - name: partial_disposition_keeps_sharelot_open
        claim_type: Conditional cascade
        grounds:
          - "state_machines.ShareLot.OPEN_to_FULLY_DISPOSED"
          - "entities.ShareLot.fields.shares_remaining"
        distinguishing_aspect: "A partial disposition (sell 50 of 117) decrements shares_remaining to 67 and leaves ShareLot status OPEN (FULLY_DISPOSED cascade fires only when remaining hits 0)."
        test_recipe:
          setup: ["A purchased ShareLot of 117 shares (100000c at price 850c)"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "PartCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pt_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "part@x.com", full_name: "Part P", employee_id: "EPART" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pt_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${pt_plan}", grant_date: "2022-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pt_off: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pt_p}", offering_period_id: "${pt_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pt_p}"
              captures: { pt_enr: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${pt_enr}", pay_date: "2022-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${pt_off}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${pt_off}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2022-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pt_pp: $.data.id }
            - call: "POST /purchase-periods/${pt_pp}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pt_pp}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pt_v: $.data.version }
