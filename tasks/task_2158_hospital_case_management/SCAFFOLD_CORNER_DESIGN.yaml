  - section: rbac
    instances:

      - name: missing_x_user_headers_returns_unauthenticated
        claim_type: role_denied
        grounds:
          - "validations[priority=1]"
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that carries neither X-User-Role nor X-User-ID is rejected with ERR_UNAUTHENTICATED 401 at priority 1, before any role, existence or body check runs, so the unknown episode id in the path never produces a 404."
        test_recipe:
          setup: ["Empty database apart from the pinned logical clock"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /episodes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with BOTH the X-User-Role and X-User-ID headers omitted"
            - "HTTP status == 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "data.error_id != ERR_EPISODE_NOT_FOUND (priority 1 precedes priority 4)"

      - name: platform_admin_cannot_create_episode_returns_forbidden_role
        claim_type: role_denied
        grounds:
          - "validations[priority=2]"
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.PlatformAdmin
        distinguishing_aspect: "POST /episodes lists only CaseManager, so an authenticated PlatformAdmin is refused with ERR_FORBIDDEN_ROLE 403 even though it may create the patient the body references."
        test_recipe:
          setup: ["One payer and one patient, both created by the PlatformAdmin"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
