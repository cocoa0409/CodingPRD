          assert:
            - "${err} == ERR_STOCK_ALREADY_ASSIGNED"
      - name: rain_check_email_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_RAIN_CHECK_INVALID]"]
        distinguishing_aspect: "A rain-check is redeemable only by the same customer_email: confirming another customer's booking with it fails with ERR_RAIN_CHECK_INVALID and the rain-check stays ISSUED."
        test_recipe:
          setup: ["Excursion A (2026-10-15) published; sam@x.com booking confirmed (6000) then excursion A weather-cancelled -> RC1 ISSUED for sam@x.com; excursion B (2026-10-16) published"]
          setup_api_calls:
