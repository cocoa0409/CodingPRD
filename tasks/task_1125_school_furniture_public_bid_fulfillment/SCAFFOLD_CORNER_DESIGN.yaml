            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id, lv_stale: $.data.version } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/po-lines/${l1}/declare-backorder", payload: { initial_eta_date: "2026-07-20" }, as: FulfillmentCoordinator, captures: { lv_fresh: $.data.version } }
          trigger:
            - { call: "POST /v1/po-lines/${l1}/backorder-notices", payload: { initial_eta_date: "2026-07-25", expected_po_line_version: "${lv_stale}" }, as: FulfillmentCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /v1/po-lines/${l1}/backorder-notices", payload: { initial_eta_date: "2026-07-25", expected_po_line_version: "${lv_fresh}" }, as: FulfillmentCoordinator, captures: { n2: $.data.id, n2_status: $.data.status, n2_rev: $.data.revision_count } }
            - { call: "GET /v1/backorder-notices", payload: { po_line_id: "${l1}" }, as: FulfillmentCoordinator, captures: { n1_status : "$.data[0].status" } }
          assert:
            - "err == ERR_STALE_VERSION (http 412; expected_po_line_version ${lv_stale} was invalidated by declare-backorder)"
            - "n2_status == OPEN and n2_rev == 0 (fresh notice installed with fresh version ${lv_fresh})"
            - "n1_status == SUPERSEDED (prior OPEN notice superseded by the successful create)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_poline_totals_visible_on_po_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.PurchaseOrder.fields.total_cents]
        distinguishing_aspect: "Consistency is immediate: the line-creation response itself carries computed totals, and a PO read issued right after reflects total_cents == 77000 with no reconciliation delay."
        test_recipe:
          setup: ["District D1; flat award (11000) accepted; PO created (RECEIVED, total_cents 0)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id, total0: $.data.total_cents } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 7 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id, l1_total: $.data.line_total_cents } }
            - { call: "GET /v1/purchase-orders/${po1}", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { total1: $.data.total_cents } }
          assert:
            - "total0 == 0 at creation"
            - "l1_total == 77000 in the creation response itself (7 x 11000)"
            - "total1 == 77000 on the immediately-following read (no eventual-consistency lag)"
