      - name: extension_at_the_ceiling_extends_and_eleven_days_is_invalid_request
        claim_type: Constants Applied
        grounds:
          - calculations.statutory_deadline
          - entities.PublicRecordsRequest.fields.extension_days_granted
          - validations.priority_3
          - errors.ERR_VALIDATION
        distinguishing_aspect: |
          extension_days_granted is range-constrained to [0, 10] rather than silently
          clamped, so 10 pushes the deadline from 2026-08-21T00:00:00Z to
          2026-08-31T00:00:00Z while 11 is rejected as ERR_VALIDATION and leaves both the
          deadline and scope_clarification_count untouched.
        test_recipe:
          setup:
            - "One request received 2026-08-01T00:00:00Z with no extension, so its intake deadline is received_at + STANDARD_RESPONSE_DAYS == 2026-08-21T00:00:00Z."
            - "No responsive record is attached, so the anchor stays received_at throughout."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0628", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-31T00:00:00Z", scope_narrative: "Every BWC recording for July" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version, intake_deadline: $.data.statutory_deadline_at } }
          trigger:
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Narrowed to the first week of July", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-07T23:59:59Z", expected_request_version: "${req_v1}", extension_days_granted: 10 }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_v2: $.data.version, extended_deadline: $.data.statutory_deadline_at } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Narrowed again", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-03T23:59:59Z", expected_request_version: "${req_v2}", extension_days_granted: 11 }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_range: $.data.error_id } }
          assert:
            - "${intake_deadline} == 2026-08-21T00:00:00Z"
            - "first clarification: HTTP 200, ${extended_deadline} == 2026-08-31T00:00:00Z (20 + 10 whole days from received_at) and extension_days_granted == 10"
            - "second clarification: HTTP 400 and ${e_range} == ERR_VALIDATION (11 is outside the declared [0, 10] range; the range check at priority 3 runs before the OCC check at priority 7 even though the supplied version is correct)"
            - "PublicRecordsRequest.${req_id}.statutory_deadline_at == 2026-08-31T00:00:00Z and extension_days_granted == 10 and scope_clarification_count == 1"
            - "PublicRecordsRequest.${req_id}.version == ${req_v2} (the rejected call incremented nothing) and processing_status == SCOPING"
      - name: record_with_only_cancelled_tasks_is_not_releasable
