# =============================================================================
# task_0641_permanent_makeup_microblading — §1.9 Scaffold Corner Design
# Breadth probe over claim-extraction-guide sections. Every grounds[] resolves
# into SCAFFOLD.yaml §1.1-§1.7. Logical clock default = 2026-01-01T00:00:00Z.
# excluded_because stubs cite §1.8 instance names from SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_studio_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.Studio, endpoints]
        distinguishing_aspect: "POST /studios with name, state_code, sterile_kit_total returns 201 with id, compliance_posture FROZEN (no tech yet), sterile_kit_consumed 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id, posture: $.data.compliance_posture, consumed: $.data.sterile_kit_consumed, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Studio.${sid}.compliance_posture == FROZEN"
            - "Studio.${sid}.sterile_kit_consumed == 0"
            - "Studio.${sid}.sterile_kit_available == 5"
            - "Studio.${sid}.version == 1"

      - name: entity_min_client_age_default_18
        claim_type: Defaults
        grounds: [entities.Studio.fields.min_client_age]
        distinguishing_aspect: "Omitting min_client_age applies default 18."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id, mca: $.data.min_client_age }
          assert:
            - "Studio.${sid}.min_client_age == 18"

      - name: entity_client_not_found_404
        claim_type: Not Found
        grounds:
          - "entities.Client"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /clients/{non-existent UUID} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: entity_client_missing_required_dob
        claim_type: Required Fields
        grounds:
          - "entities.Client.fields.date_of_birth"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /clients omitting date_of_birth returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A studio exists."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "No DOB" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: entity_client_computed_risk_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Client.fields.risk_score, calculations.client_risk_score]
        distinguishing_aspect: "risk_score is server-computed (8*medical + 12*adverse + 5*self_sens); any client-supplied value is ignored. medical=1,adverse=0,self=0 -> risk_score 8 regardless of input."
        test_recipe:
          setup: ["A studio exists."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "Calc", date_of_birth: "1990-01-01T00:00:00Z", medical_flag_count: 1, prior_adverse_reactions: 0, skin_sensitivity_self: 0 }
              as: FrontDesk
              captures: { cid: $.data.id, score: $.data.risk_score }
          assert:
            - "Client.${cid}.risk_score == 8"
            - "Client.${cid}.risk_band == STANDARD"

      - name: entity_color_formula_invalid_enum_procedure_type
        claim_type: Type Constraints
        grounds:
          - "entities.ColorFormula.fields.procedure_type"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Invalid procedure_type enum (e.g. NOSE) on POST /color-formulas returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A studio exists."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /color-formulas"
              payload: { studio_id: "${sid}", name: "Bad", procedure_type: "NOSE", pigment_count: 1 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: entity_consent_record_immutable_no_version
        claim_type: Immutability
        grounds: [entities.ConsentRecord]
        distinguishing_aspect: "ConsentRecord has common_fields:false — only id and created_at; no version field and no update/PUT endpoint exists for it."
        test_recipe:
          setup: ["A studio + client exist."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /consent-records"
              payload: { client_id: "${cid}", consent_type: "PHOTO_RELEASE", age_verified: true, signed_by_name: "C" }
              as: FrontDesk
              captures: { consent_id: $.data.id }
          assert:
            - "ConsentRecord.${consent_id}.id is present"
            - "ConsentRecord.${consent_id} has no version field"

      - name: entity_studio_kit_total_negative_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Studio.fields.sterile_kit_total"
          - "validations[priority=4]"
          - "errors[ERR_VALIDATION_RANGE]"
        distinguishing_aspect: "Negative sterile_kit_total violates the >=0 constraint and returns ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: -1 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_RANGE"
            - "HTTP status == 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_appointment_initial_state_booked
        claim_type: Initial State
        grounds: [state_machines.Appointment.BOOKED_to_IN_PROCEDURE, entities.Appointment.fields.lifecycle_status, entities.Appointment.fields.payment_status]
        distinguishing_aspect: "A freshly booked appointment starts lifecycle_status BOOKED (the initial_state of the Appointment lifecycle machine) and payment_status AWAITING_DEPOSIT."
        test_recipe:
          setup: ["Studio + tech + formula + consented client + READ/PASS patch test."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${sid}", full_name: "T", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tid: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${sid}", name: "WT", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cfid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${cid}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "C" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${cid}" }
              as: Technician
              captures: { ptid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
          trigger:
            - call: "POST /appointments"
              payload: { client_id: "${cid}", technician_id: "${tid}", color_formula_id: "${cfid}", patch_test_id: "${ptid}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { aid: $.data.id, ls: $.data.lifecycle_status, ps: $.data.payment_status }
          assert:
            - "Appointment.${aid}.lifecycle_status == BOOKED"
            - "Appointment.${aid}.payment_status == AWAITING_DEPOSIT"

      - name: sm_appointment_start_from_booked_without_deposit_invalid
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Appointment.BOOKED_to_IN_PROCEDURE"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Starting a BOOKED appointment still in AWAITING_DEPOSIT (no deposit) fails ERR_INVALID_STATE — payment precondition not met."
        test_recipe:
          setup: ["A BOOKED appointment in AWAITING_DEPOSIT with READ/PASS patch test."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${sid}", full_name: "T", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tid: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${sid}", name: "WT", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cfid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${cid}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "C" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${cid}" }
              as: Technician
              captures: { ptid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${cid}", technician_id: "${tid}", color_formula_id: "${cfid}", patch_test_id: "${ptid}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /appointments/${aid}/start"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: sm_patchtest_read_twice_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.PatchTest.APPLIED_to_READ"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reading an already-READ patch test (terminal READ) a second time returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A patch test already READ."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
            - call: "POST /patch-tests"
              payload: { client_id: "${cid}" }
              as: Technician
              captures: { ptid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
          trigger:
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: sm_patchtest_read_before_48h_invalid
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.PatchTest.APPLIED_to_READ"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reading a patch test before applied_at+48h fails ERR_INVALID_STATE (read precondition: clock >= applied_at + 48h)."
        test_recipe:
          setup: ["Patch applied at 2026-01-01; read attempted at 2026-01-02 (only 24h)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
            - call: "POST /patch-tests"
              payload: { client_id: "${cid}" }
              as: Technician
              captures: { ptid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: sm_appointment_complete_terminal_then_cancel_invalid
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Appointment.HEALING_to_COMPLETED"
          - "state_machines.Appointment.BOOKED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a COMPLETED appointment (cancel only valid from BOOKED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED appointment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${sid}", full_name: "T", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tid: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${sid}", name: "WT", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cfid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${cid}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "C" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${cid}" }
              as: Technician
              captures: { ptid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${cid}", technician_id: "${tid}", color_formula_id: "${cfid}", patch_test_id: "${ptid}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { aid: $.data.id }
            - call: "POST /appointments/${aid}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${aid}/start"
              payload: {}
              as: Technician
            - call: "POST /appointments/${aid}/finish-procedure"
              payload: {}
              as: Technician
            - call: "POST /appointments/${aid}/pay-balance"
              payload: { amount_cents: 52000 }
              as: FrontDesk
            - call: "POST /healing-logs"
              payload: { appointment_id: "${aid}", day_offset: 14, outcome_flag: "GOOD" }
              as: Technician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /appointments/${aid}/complete"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /appointments/${aid}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: sm_cancel_early_full_refund
        claim_type: Side Effect Execution
        grounds: [state_machines.Appointment.BOOKED_to_CANCELLED, entities.DepositTransaction.fields.txn_type]
        distinguishing_aspect: "Cancelling >=48h before scheduled_start emits a REFUND and sets payment_status REFUNDED (full refund branch)."
        test_recipe:
          setup: ["A BOOKED DEPOSIT_PAID appointment with scheduled_start 2026-01-06; cancel at 2026-01-02 (>48h before)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${sid}", full_name: "T", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tid: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${sid}", name: "WT", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cfid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { cid: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${cid}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "C" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${cid}" }
              as: Technician
              captures: { ptid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${ptid}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${cid}", technician_id: "${tid}", color_formula_id: "${cfid}", patch_test_id: "${ptid}", procedure_type: "BROWS", scheduled_start: "2026-01-10T10:00:00Z" }
              as: FrontDesk
              captures: { aid: $.data.id }
            - call: "POST /appointments/${aid}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${aid}/cancel"
              payload: {}
              as: FrontDesk
              captures: { ps: $.data.payment_status, paid: $.data.deposit_paid_cents }
          assert:
            - "Appointment.${aid}.lifecycle_status == CANCELLED"
            - "Appointment.${aid}.payment_status == REFUNDED"
            - "Appointment.${aid}.deposit_paid_cents == 0"

      - name: sm_cancel_late_forfeit
        claim_type: Conditional cascade
        grounds: [state_machines.Appointment.BOOKED_to_CANCELLED, entities.DepositTransaction.fields.txn_type]
        distinguishing_aspect: "Cancelling <48h before scheduled_start emits a FORFEIT, deposit_paid_cents stays 13000 and payment_status remains DEPOSIT_PAID (forfeit branch — deposit kept)."
        test_recipe:
          setup: ["A BOOKED DEPOSIT_PAID appointment with scheduled_start 2026-01-06; cancel at 2026-01-05 (<48h before)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${sid}", full_name: "T", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tid: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${sid}", name: "WT", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cfid: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${sid}", full_name: "C", date_of_birth: "1990-01-01T00:00:00Z" }
