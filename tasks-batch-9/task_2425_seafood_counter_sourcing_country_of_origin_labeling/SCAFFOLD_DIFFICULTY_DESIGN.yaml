scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shrink_dual_variant_provisional_vs_final_diverge
        grounds:
          - calculations.shrink_valuation
          - entities.ShrinkEvent.fields.provisional_value_cents
          - entities.ShrinkEvent.fields.final_value_cents
          - entities.ShrinkEvent.fields.recovery_credit_cents
          - state_machines.ShrinkEvent.CONVERSION_APPROVED_to_CONVERTED
        distinguishing_aspect: |
          Both shrink_valuation variants are stored side by side on one ShrinkEvent in the
          money domain, and they must hold different integers: PROVISIONAL_AT_COST keeps
          15285 frozen at creation while FINAL_NET_OF_RECOVERY writes 6192 after the
          cook-and-sell credit of 9093, so an implementation that recomputes one variant
          from the other's inputs cannot satisfy both fields at once.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter with 6 case slots, posture OPEN"
            - "Species Atlantic Cod, not covered by the import monitoring program, not high-risk"
            - "SupplierLot of 30.000 kg at 1700 cents/kg landed cost, 2600 cents/kg cooked retail, previously_frozen false, fresh_claim true, intake_status CASED in slot 1"
            - "ShrinkEvent for that lot, reason UNSOLD_FRESH, shrink_weight_kg 8.375, conversion_requested_kg 6.000, status CONVERSION_APPROVED"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 30.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 8.375, conversion_requested_kg: 6.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_id: $.data.id }
            - call: "POST /seafood-ops/shrink-events/${se_id}/approve-conversion"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
          trigger:
            - call: "POST /seafood-ops/shrink-events/${se_id}/convert"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
          assert:
            - "ShrinkEvent.${se_id}.provisional_value_cents == 15285"
            - "ShrinkEvent.${se_id}.recovery_credit_cents == 9093"
            - "ShrinkEvent.${se_id}.final_value_cents == 6192"
            - "ShrinkEvent.${se_id}.provisional_value_cents == ShrinkEvent.${se_id}.final_value_cents + ShrinkEvent.${se_id}.recovery_credit_cents"
            - "ShrinkEvent.${se_id}.status == CONVERTED"
            - "Counter.${counter_id}.shrink_gross_cents == 0"
            - "Counter.${counter_id}.shrink_net_cents == 0"
            - "SupplierLot.${lot_id}.remaining_weight_kg == 30.000"

      - name: supplier_risk_index_rolling_vs_lifetime_diverge
        grounds:
          - calculations.substitution_risk_index
          - calculations.verification_sampling_plan
          - entities.Supplier.fields.substitution_risk_index_rolling
          - entities.Supplier.fields.substitution_risk_index_lifetime
          - entities.Supplier.fields.status
        distinguishing_aspect: |
          This dual variant lives in the supplier-standing domain rather than the money
          domain: one verification cycle after a single mismatch out of two samples, the
          ROLLING_CYCLE variant has decayed to 20.00 while the LIFETIME variant still
          reads 50.00, and only the LIFETIME variant may drive Supplier.status to
          PROBATION.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z, Counter at verification_cycle_index 0"
            - "one Supplier with two lots on the counter, both CASED"
            - "lot A (Atlantic Cod) sampled and resolved MATCH; lot B (Tilapia) sampled and resolved MISMATCH against Atlantic Cod, both samples drawn at cycle_index 0"
            - "neither species is on the high-risk substitution watchlist, so no HIGH_RISK_BONUS applies"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Tilapia", scientific_name: "Oreochromis niloticus", acceptable_market_names: ["Tilapia"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { tilapia_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 12.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_a: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_a}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", lot_code: "TIL-0801-B", harvest_method: "AQUACULTURE_POND", production_method: "FARMED", origin_country_code: "EC", previously_frozen: false, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 900, retail_price_cents_per_kg: 1600, cooked_retail_price_cents_per_kg: 1800 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_b: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_b}/case"
              payload: { case_slot: 2 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_a}", sampled_weight_g: 120 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_a: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_a}/send-to-lab"
              payload: { lab_reference: "LAB-A-0001" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples/${sample_a}/result"
              payload: { observed_species_id: "${cod_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_b}", sampled_weight_g: 120 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_b: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_b}/send-to-lab"
              payload: { lab_reference: "LAB-B-0001" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples/${sample_b}/result"
              payload: { observed_species_id: "${cod_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { counter_v: $.data.version }
          trigger:
            - call: "POST /seafood-ops/counters/${counter_id}/close-verification-cycle"
              payload: { expected_counter_version: "${counter_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          assert:
            - "Counter.${counter_id}.verification_cycle_index == 1"
            - "Supplier.${supplier_id}.substitution_risk_index_rolling == 20.00"
            - "Supplier.${supplier_id}.substitution_risk_index_lifetime == 50.00"
            - "Supplier.${supplier_id}.substitution_risk_index_rolling != Supplier.${supplier_id}.substitution_risk_index_lifetime"
            - "Supplier.${supplier_id}.lifetime_sample_count == 2"
            - "Supplier.${supplier_id}.lifetime_mismatch_count == 1"
            - "Supplier.${supplier_id}.status == PROBATION"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cook_conversion_recovery_four_input_interaction
        grounds:
          - calculations.cook_conversion_recovery
          - entities.ShrinkEvent.fields.allowance_kg
          - entities.ShrinkEvent.fields.approved_conversion_kg
          - entities.ShrinkEvent.fields.cook_yield_kg
          - state_machines.ShrinkEvent.VALUED_to_CONVERSION_APPROVED
        distinguishing_aspect: |
          Mode (a) instance: recovery_credit_cents is a non-linear function of five
          independent inputs (received_weight_kg via MAX_CONVERSION_SHARE, shrink_weight_kg,
          conversion_requested_kg, the fresh_claim penalty, and cooked_retail_price_cents_per_kg)
          clamped twice - once by min(conversion_requested_kg, allowance_kg) and once by
          min(provisional_value_cents, ...) - so no input can be varied independently of the
          others.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of 30.000 kg (so MAX_CONVERSION_SHARE caps diversion at 18.000 kg, which does not bind), fresh_claim true (0.05 penalty), previously_frozen false (no 0.15 penalty), cooked retail 2600 cents/kg"
            - "ShrinkEvent reason UNSOLD_FRESH, shrink_weight_kg 8.375 (the binding allowance term), conversion_requested_kg 6.000, status VALUED with provisional_value_cents 15285"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 30.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 8.375, conversion_requested_kg: 6.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_id: $.data.id }
          trigger:
            - call: "POST /seafood-ops/shrink-events/${se_id}/approve-conversion"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events/${se_id}/convert"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
          assert:
            - "ShrinkEvent.${se_id}.allowance_kg == 8.375"
            - "ShrinkEvent.${se_id}.approved_conversion_kg == 6.000"
            - "ShrinkEvent.${se_id}.cook_yield_kg == 3.705"
            - "ShrinkEvent.${se_id}.recovery_credit_cents == 9093"
            - "ShrinkEvent.${se_id}.final_value_cents == 6192"
            - "ShrinkEvent.${se_id}.status == CONVERTED"

      - name: shrink_valuation_per_line_rounding_order
        grounds:
          - calculations.shrink_valuation
          - entities.ShrinkEvent.fields.provisional_value_cents
          - state_machines.ShrinkEvent.initial_state
        distinguishing_aspect: |
          Mode (b) instance: the same three products are rounded in a pinned order - each of
          line_cost_cents, line_handling_cents and line_disposal_cents is rounded to whole
          cents before summation - and the fixture 8.375 kg at 1700 cents/kg makes the order
          observable, yielding 15285 where sum-then-round-once yields 15284.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot at 1700 cents/kg landed cost, intake_status CASED"
            - "no ShrinkEvent yet exists for the lot"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 30.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
          trigger:
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 8.375, conversion_requested_kg: 0.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_id: $.data.id }
          assert:
            - "ShrinkEvent.${se_id}.provisional_value_cents == 15285"
            - "ShrinkEvent.${se_id}.provisional_value_cents != 15284"
            - "ShrinkEvent.${se_id}.status == VALUED"
            - "ShrinkEvent.${se_id}.recovery_credit_cents == 0"
            - "SupplierLot.${lot_id}.remaining_weight_kg == 30.000"

      - name: supplier_chargeback_goodwill_tier_pinned_order
        grounds:
          - calculations.supplier_chargeback_assessment
          - state_machines.SupplierLot.chargeback_status.NONE_to_ASSESSED
          - entities.SupplierLot.fields.chargeback_assessed_cents
          - entities.Supplier.fields.chargeback_outstanding_cents
        distinguishing_aspect: |
          Mode (c) instance: the goodwill credit lowers the bill while the goodwill tier is
          keyed on the bill, a circular-looking dependency resolved by the pinned five-step
          order - tier is selected on pre_credit_subtotal_cents (52000, tier 2 at 0.08),
          giving 47840, whereas selecting the tier from the post-credit net is
          self-consistent at 44200 and therefore silently wrong.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Tilapia, 10.000 kg remaining, retail 2300 cents/kg, intake_status CASED in slot 1, with a PUBLISHED CaseLabel"
            - "Supplier in GOOD_STANDING with zero prior samples, so PROBATION_MULTIPLIER does not apply"
            - "VerificationSample on that lot in status IN_LAB"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Tilapia", scientific_name: "Oreochromis niloticus", acceptable_market_names: ["Tilapia"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { tilapia_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", lot_code: "TIL-0801-B", harvest_method: "AQUACULTURE_POND", production_method: "FARMED", origin_country_code: "EC", previously_frozen: false, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2300, cooked_retail_price_cents_per_kg: 2500 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v: $.data.version }
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { label_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_id}/send-to-lab"
              payload: { lab_reference: "LAB-B-0001" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          trigger:
            - call: "POST /seafood-ops/verification-samples/${sample_id}/result"
              payload: { observed_species_id: "${cod_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          assert:
            - "SupplierLot.${lot_id}.chargeback_status == ASSESSED"
            - "SupplierLot.${lot_id}.chargeback_assessed_cents == 47840"
            - "SupplierLot.${lot_id}.chargeback_assessed_cents != 44200"
            - "Supplier.${supplier_id}.chargeback_assessed_total_cents == 47840"
            - "Supplier.${supplier_id}.chargeback_outstanding_cents == 47840"
            - "Supplier.${supplier_id}.status == GOOD_STANDING"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: supplier_lot_three_parallel_dimensions_independent
        grounds:
          - state_machines.SupplierLot.intake_status.RECEIVED_to_CASED
          - state_machines.SupplierLot.label_status.MISMATCHED_to_RELABELED
          - state_machines.SupplierLot.chargeback_status.ASSESSED_to_SETTLED
          - entities.SupplierLot.fields.intake_status
          - entities.SupplierLot.fields.label_status
          - entities.SupplierLot.fields.chargeback_status
        distinguishing_aspect: |
          SupplierLot runs three parallel dimensions that never share a state name: after the
          relabel and the settlement the same row reads intake_status CASED, label_status
          RELABELED and chargeback_status SETTLED, each advanced by a different actor
          (SeafoodManager, SeafoodManager, SupplierRep), so a single-status implementation
          cannot represent the row.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Tilapia, 10.000 kg, retail 2300 cents/kg, CASED in slot 1, with a PUBLISHED CaseLabel"
            - "verification sample resolved MISMATCH against Atlantic Cod, so label_status is MISMATCHED and chargeback_status is ASSESSED at 47840 cents"
            - "Counter posture RESTRICTED from the single 6-point SPECIES_SUBSTITUTION violation"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
