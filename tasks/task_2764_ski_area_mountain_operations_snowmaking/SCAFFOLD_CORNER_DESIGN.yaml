  - section: errors
    instances:
      - name: every_typed_not_found_error_id_is_reachable_from_a_bogus_path_segment
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_LIFT_NOT_FOUND]
          - errors[ERR_TERRAIN_AREA_NOT_FOUND]
          - errors[ERR_PUMP_HOUSE_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_GROOMING_TASK_NOT_FOUND]
          - errors[ERR_STAFF_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_PATROLLER_NOT_FOUND]
          - errors[ERR_MISSION_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_DAY_PLAN_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_RECORD_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          Priority 3 declares TWELVE distinct not-found ids plus a generic umbrella, and the natural
          implementation shortcut is to raise one shared 404 everywhere. Each id is therefore driven from
          the cheapest possible request - a bogus id in the path of the family's own read endpoint - on a
          system where nothing at all exists, so nothing but the path resolution can decide the outcome.
          The last two triggers add the cases a family-lookup table misses: a templated segment on a
          DERIVED read (snow-accounting) is resolved exactly like a plain read, and a templated segment on
          a POST action resolves before the action's own workflow rules.
        test_recipe:
          setup:
            - "An empty system with only the logical clock set; no seasons, lifts, areas, pump houses, sessions, tasks, assignments, patrollers, missions, incidents, day plans or reservations exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
          trigger:
            - call: "GET /mountain-ops/seasons/00000000-0000-0000-0000-0000000000ff"
              payload: {  }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/lifts/00000000-0000-0000-0000-0000000000ff"
              payload: {  }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/terrain-areas/00000000-0000-0000-0000-0000000000ff"
              payload: {  }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
