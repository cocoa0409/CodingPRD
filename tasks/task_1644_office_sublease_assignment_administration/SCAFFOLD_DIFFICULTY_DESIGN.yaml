            - call: "GET /sublease-admin/transfer-requests/${tr_id}/consent-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { cr_id: "$.data[0].id", cr_v0: "$.data[0].version" }
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/credit-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { kr_id: "$.data[0].id" }
            - call: "POST /sublease-admin/credit-reviews/${kr_id}/attest"
              payload: { reviewed_credit_rating_bps: 7000 }
              as: TenantRepBroker
              as_user_id: "broker-2"
            - call: "POST /sublease-admin/consent-reviews/${cr_id}/decide"
              payload: { decision: "GRANTED", expected_consent_review_version: "${cr_v0}" }
              as: Landlord
              as_user_id: "${pl_id}"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/document"
              payload: { executed_rent_per_rsf_annual_cents: 6400 }
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/recognition-agreement"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { ra_id: "$.data[0].id" }
            - call: "POST /sublease-admin/recognition-agreements/${ra_id}/sign"
              payload: { signatory: "LANDLORD" }
              as: Landlord
              as_user_id: "${pl_id}"
            - call: "POST /sublease-admin/recognition-agreements/${ra_id}/sign"
              payload: { signatory: "COUNTERPARTY" }
              as: Subtenant
              as_user_id: "${ps_id}"
            - call: "POST /sublease-admin/settlements"
              payload: { lease_id: "${lease_id}", transfer_request_id: "${tr_id}", period_start: "2026-10-01T00:00:00.000Z", period_end: "2026-11-01T00:00:00.000Z", subrent_collected_cents: 6000000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /sublease-admin/settlements/${st_id}/void"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "POST /sublease-admin/settlements/${st_id}/finalize"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { err: $.data.error_id }
          assert:
            - "Settlement.${st_id}.status == VOID"
            - "finalize-after-void returns error_id ERR_INVALID_STATE"
            - "Lease.${lease_id}.cumulative_profit_share_cents == 0 (void of a DRAFT settlement conserves the ledger)"
