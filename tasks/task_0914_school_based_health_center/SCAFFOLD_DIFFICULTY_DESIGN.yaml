  - rule_id: compensating_invariant
    instances:

      - name: visit_charge_bucket_residual_stays_zero_across_complete_and_reverse
        grounds:
          - calculations.visit_charge_bucket_totals
          - calculations.encounter_nominal_fee_floor
          - state_machines.BillableCharge.PENDING_to_REVERSED
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - entities.Visit.fields.gross_charge_total_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: visit_charge_bucket_residual =
          gross_charge_total_cents - (payer_billed + patient_responsibility +
          write_off + no_charge) must equal 0 both after the forward action
          (visit completion, buckets 15000 = 11500 + 500 + 0 + 3000) and after the
          compensating action (reversing the ACUTE charge, buckets 3000 = 0 + 0 + 0
          + 3000), with the encounter floor re-derived rather than left stranded on
          the reversed row.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school, one MEDICAL clinician, one TIER_A SELF_PAY student with an ACTIVE enrollment and an ACTIVE GENERAL_TREATMENT consent."
            - "One completed ACUTE visit carrying two charges: an ACUTE_OFFICE_VISIT charge of 12000 in PENDING with floor_adjustment_cents 500, and an IMMUNIZATION_ADMIN charge of 3000 in NO_CHARGE."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
