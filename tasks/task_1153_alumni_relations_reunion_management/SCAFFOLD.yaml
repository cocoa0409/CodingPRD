scenario: |
  1153. Alumni Relations & Reunion Management (university alumni association): alumni record & lost-alumni research, class-year reunion committee & volunteer coordination, event registration & ticket tiers, affinity group & regional chapter programming, engagement scoring & giving propensity, email/mail preference & suppression, milestone reunion gift campaign, memorabilia & class notes publication

domain_name: alumni-relations
api_prefix: /alumni

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AlumniRecord
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Alumnus full legal name" }
      - { name: primary_email, type: string, source: input, description: "Primary email address; unique across non-DECEASED records" }
      - { name: class_year, type: integer, source: input, description: "Four-digit graduation year of primary degree" }
      - { name: degree_code, type: string, source: input, description: "Degree code, e.g. BA, BS, MBA" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LOST | DECEASED | DO_NOT_CONTACT", default: "ACTIVE" }
      - { name: engagement_score, type: number, source: computed, description: "Rolling engagement score, 0.00-100.00, recomputed by engagement_score_calc" }
      - { name: engagement_tier, type: enum, source: computed, description: "HIGH | MEDIUM | LOW — threshold band of engagement_score per engagement_tier_thresholds" }
      - { name: giving_propensity, type: number, source: computed, description: "Propensity 0.00-1.00 from giving_propensity_calc; depends on engagement_score evaluation order pinned in that calc" }
      - { name: lifetime_giving_cents, type: integer, source: computed, default: 0, description: "Sum of fulfilled GiftPledge.amount_cents for this alumnus (status FULFILLED only)" }
      - { name: lost_since, type: datetime, source: system, description: "Set when status transitions to LOST; cleared on reunion", default: null }

  - name: LostAlumniResearchCase
    parent: AlumniRecord
    common_fields: true
    fields:
      - { name: alumni_id, type: string, source: input, description: "FK -> AlumniRecord.id; the LOST alumnus under research" }
      - { name: lead_source, type: enum, source: input, description: "SOCIAL_MEDIA | PUBLIC_RECORDS | PEER_TIP | PROFESSIONAL_DATABASE" }
      - { name: lead_detail, type: string, source: input, description: "Free-text description of the lead" }
      - { name: lead_confidence, type: integer, source: input, description: "Analyst confidence 1-100" }
      - { name: status, type: enum, source: system, description: "OPEN -> LEAD_LOGGED -> VERIFIED -> REUNITED | DEAD_END; VERIFIED -> OPEN allowed (bad lead reopen cycle)", default: "OPEN" }
      - { name: reopened_count, type: integer, source: system, default: 0, description: "Number of times the case has cycled VERIFIED -> OPEN" }
      - { name: resolved_at, type: datetime, source: system, description: "Set on REUNITED or DEAD_END", default: null }

  - name: ReunionEvent
    parent: null
    common_fields: true
    fields:
      - { name: class_year, type: integer, source: input, description: "Class year this reunion celebrates" }
      - { name: title, type: string, source: input, description: "Event title, e.g. 'Class of 2001 25th Reunion'" }
      - { name: event_date, type: datetime, source: input, description: "Scheduled date/time of the reunion" }
      - { name: milestone_year, type: integer, source: computed, description: "= current_year - class_year at scheduling; must be > 0 and divisible by 5 for milestone campaigns" }
      - { name: status, type: enum, source: system, description: "PLANNING -> COMMITTEE_FORMED -> OPEN_FOR_REGISTRATION -> HELD -> RECONCILED | CANCELLED", default: "PLANNING" }
      - { name: posture, type: enum, source: computed, description: "DERIVED: GATED | OPEN | SOLD_OUT | CLOSED — gates registration; derived by reunion_posture_calc" }
      - { name: committee_count, type: integer, source: computed, default: 0, description: "Count of CommitteeMembership rows with status ACTIVE on this event's committee" }
      - { name: committee_quorum_required, type: integer, source: input, default: 3, description: "Minimum ACTIVE committee members before registration may open" }
      - { name: total_revenue_cents, type: integer, source: computed, default: 0, description: "Sum over CONFIRMED/CHECKED_IN EventRegistration.final_price_cents minus refunded cents" }

  - name: ReunionCommittee
    parent: ReunionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ReunionEvent.id" }
      - { name: name, type: string, source: input, description: "Committee display name" }
      - { name: chair_membership_id, type: string, source: system, description: "CommitteeMembership.id of current chair; null until a CHAIR membership is ACTIVE", default: null }
      - { name: locked, type: boolean, source: system, default: false, description: "Locked once event reaches OPEN_FOR_REGISTRATION; membership changes rejected while locked" }

  - name: CommitteeMembership
    parent: ReunionCommittee
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: input, description: "FK -> ReunionCommittee.id" }
      - { name: alumni_id, type: string, source: input, description: "FK -> AlumniRecord.id; the volunteer" }
      - { name: role, type: enum, source: input, description: "CHAIR | TREASURER | LOGISTICS | OUTREACH | MEMBER" }
      - { name: status, type: enum, source: system, description: "INVITED -> ACTIVE -> ENDED | DECLINED; ACTIVE -> ENDED only", default: "INVITED" }
      - { name: invited_at, type: datetime, source: system, description: "Server timestamp of invitation" }
      - { name: ended_reason, type: enum, source: system, description: "RESIGNED | REMOVED | EVENT_CANCELLED | ALUMNUS_DECEASED", default: null }

  - name: TicketTier
    parent: ReunionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ReunionEvent.id" }
      - { name: name, type: string, source: input, description: "Tier name, e.g. 'Early Bird', 'Standard', 'Patron'" }
      - { name: base_price_cents, type: integer, source: input, description: "List price in cents before adjustments" }
      - { name: capacity, type: integer, source: input, description: "Seat cap; capacity == 0 means UNLIMITED (never sold out); capacity > 0 sold out when sold_count == capacity" }
      - { name: sold_count, type: integer, source: computed, default: 0, description: "Count of EventRegistration rows on this tier with payment_status CONFIRMED or CHECKED_IN (not CANCELLED/REFUNDED)" }
      - { name: sales_start, type: datetime, source: input, description: "Sales window start; half-open interval [sales_start, sales_end)" }
      - { name: sales_end, type: datetime, source: input, description: "Sales window end, exclusive" }
      - { name: early_bird_discount_pct, type: integer, source: input, default: 0, description: "Whole-percent discount 0-90 applied only when registration occurs before event_early_bird_cutoff" }

  - name: EventRegistration
    parent: ReunionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ReunionEvent.id" }
      - { name: tier_id, type: string, source: input, description: "FK -> TicketTier.id" }
      - { name: alumni_id, type: string, source: input, description: "FK -> AlumniRecord.id; the registrant" }
      - { name: payment_status, type: enum, source: system, description: "PARALLEL DIM 1: PENDING_PAYMENT -> CONFIRMED -> REFUNDED; PENDING_PAYMENT -> CANCELLED", default: "PENDING_PAYMENT" }
      - { name: attendance_status, type: enum, source: system, description: "PARALLEL DIM 2: NOT_CHECKED_IN -> CHECKED_IN; independent of payment_status but CHECKED_IN requires payment_status == CONFIRMED", default: "NOT_CHECKED_IN" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Forward-looking estimate at registration creation via ticket_price_calc variant ESTIMATE" }
      - { name: final_price_cents, type: integer, source: computed, description: "Chronological checkout price via ticket_price_calc variant FINAL; set on payment confirmation" }
      - { name: cancelled_reason, type: enum, source: system, description: "REGISTRANT | EVENT_CANCELLED | ALUMNUS_DECEASED | PAYMENT_TIMEOUT", default: null }

  - name: AffinityGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Group or regional chapter name" }
      - { name: kind, type: enum, source: input, description: "AFFINITY | REGIONAL_CHAPTER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DISSOLVED", default: "ACTIVE" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Annual programming budget in cents" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "Sum of allocated ChapterProgram.budget_allocated_cents for programs in APPROVED or PUBLISHED state" }
      - { name: budget_spent_cents, type: integer, source: computed, default: 0, description: "Sum of actual_spend_cents on COMPLETED programs" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "= annual_budget_cents - budget_committed_cents - budget_spent_cents; must never go negative" }

  - name: ChapterProgram
    parent: AffinityGroup
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> AffinityGroup.id" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: venue_slot_start, type: datetime, source: input, description: "Program start; closed interval with 60-minute post-event buffer for overlap checks" }
      - { name: venue_slot_end, type: datetime, source: input, description: "Program end (inclusive); effective occupancy is [start, end + 60min]" }
      - { name: budget_allocated_cents, type: integer, source: input, description: "Budget reserved from the group's annual budget at approval time" }
      - { name: actual_spend_cents, type: integer, source: input, description: "Final spend, set at completion" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> APPROVED -> PUBLISHED -> COMPLETED | CANCELLED; PROPOSED -> DRAFT revert allowed", default: "DRAFT" }
      - { name: leader_id, type: string, source: input, description: "FK -> AlumniRecord.id; must be an AlumniRecord with status ACTIVE" }

  - name: CommunicationPreference
    parent: AlumniRecord
    common_fields: true
    fields:
      - { name: alumni_id, type: string, source: input, description: "FK -> AlumniRecord.id" }
      - { name: channel, type: enum, source: input, description: "EMAIL | MAIL | PHONE" }
      - { name: opt_in, type: boolean, source: input, default: true, description: "Channel-level opt-in flag" }
      - { name: suppressed, type: boolean, source: computed, default: false, description: "Effective suppression: true if global suppression list contains this alumnus+channel OR AlumniRecord.status == DO_NOT_CONTACT" }
      - { name: suppression_reason, type: enum, source: system, description: "NONE | GLOBAL_LIST | DO_NOT_CONTACT_RECORD | HARD_BOUNCE", default: "NONE" }

  - name: GiftCampaign
    parent: ReunionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ReunionEvent.id; milestone reunion this campaign is tied to" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal" }
      - { name: matching_multiplier_bps, type: integer, source: input, default: 0, description: "Employer-match credit in basis points (10000 = 1.0x match), applied per pledge then rounded per campaign_matching_credit" }
      - { name: pledged_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over pledges in PLEDGED or FULFILLED" }
      - { name: fulfilled_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over FULFILLED pledges only" }
      - { name: matched_credit_cents, type: integer, source: computed, default: 0, description: "Sum of per-pledge rounded matching credits over FULFILLED pledges" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED | ABANDONED", default: "DRAFT" }

  - name: GiftPledge
    parent: GiftCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> GiftCampaign.id" }
      - { name: alumni_id, type: string, source: input, description: "FK -> AlumniRecord.id" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged amount in cents, >= 100" }
      - { name: pledge_date, type: datetime, source: system, description: "Server timestamp of pledge creation" }
      - { name: matched_credit_cents, type: integer, source: computed, default: 0, description: "Per-pledge matching credit = round_half_up(amount_cents * matching_multiplier_bps / 10000), computed at fulfillment" }
      - { name: status, type: enum, source: system, description: "PLEDGED -> FULFILLED | LAPSED | WRITTEN_OFF; FULFILLED is terminal", default: "PLEDGED" }

  - name: MemorabiliaPublication
    parent: ReunionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ReunionEvent.id" }
      - { name: title, type: string, source: input, description: "Publication title, e.g. 'Class of 2001 Memory Book'" }
      - { name: class_notes_body, type: string, source: input, description: "Compiled class notes text" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Increments on every IN_REVIEW -> DRAFT revert" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_REVIEW -> APPROVED -> PUBLISHED; IN_REVIEW -> DRAFT revert loop; APPROVED -> IN_REVIEW re-review on material change", default: "DRAFT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AlumniRecord
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: LOST
        trigger: "POST /alumni/records/{id}/mark-lost"
        actor: AlumniRelationsStaff
        preconditions:
          - "No EventRegistration for this alumnus with payment_status CONFIRMED on a ReunionEvent whose status is OPEN_FOR_REGISTRATION"
        side_effects:
          - "lost_since = current logical clock"
          - "All CommunicationPreference rows for this alumnus: recompute suppressed flag"
      - from: LOST
        to: ACTIVE
        trigger: "system (automatic when a LostAlumniResearchCase for this alumnus reaches REUNITED)"
        actor: system
        preconditions: []
        side_effects:
          - "lost_since = null"
          - "Recompute engagement_score via engagement_score_calc"
      - from: ACTIVE
        to: DO_NOT_CONTACT
        trigger: "POST /alumni/records/{id}/set-do-not-contact"
        actor: AlumniRelationsStaff
        preconditions: []
        side_effects:
          - "All CommunicationPreference rows: suppressed = true, suppression_reason = DO_NOT_CONTACT_RECORD"
      - from: DO_NOT_CONTACT
        to: ACTIVE
        trigger: "POST /alumni/records/{id}/clear-do-not-contact"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects:
          - "All CommunicationPreference rows: recompute suppressed (global list may still suppress)"
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /alumni/records/{id}/mark-deceased"
        actor: AlumniRelationsStaff
        preconditions: []
        side_effects:
          - "All CommitteeMembership rows with status ACTIVE or INVITED: status -> ENDED, ended_reason = ALUMNUS_DECEASED (this itself decrements ReunionEvent.committee_count and may flip posture GATED)"
          - "All EventRegistration rows with payment_status in {PENDING_PAYMENT, CONFIRMED}: payment_status -> CANCELLED, cancelled_reason = ALUMNUS_DECEASED (this itself decrements TicketTier.sold_count and event.total_revenue_cents)"
          - "All GiftPledge rows with status PLEDGED: status -> LAPSED (this itself decrements GiftCampaign.pledged_total_cents)"
          - "All CommunicationPreference rows: suppressed = true, suppression_reason = DO_NOT_CONTACT_RECORD"

  - entity: LostAlumniResearchCase
    initial_state: OPEN
    terminal_states: [REUNITED, DEAD_END]
    transitions:
      - from: OPEN
        to: LEAD_LOGGED
        trigger: "POST /alumni/research-cases/{id}/log-lead"
        actor: AlumniRelationsStaff
        preconditions:
          - "Linked AlumniRecord.status == LOST (ERR_ALUMNUS_NOT_LOST)"
        side_effects: []
      - from: LEAD_LOGGED
        to: VERIFIED
        trigger: "POST /alumni/research-cases/{id}/verify"
        actor: AlumniRelationsStaff
        preconditions:
          - "lead_confidence >= 60 (ERR_LEAD_CONFIDENCE_TOO_LOW)"
        side_effects: []
      - from: VERIFIED
        to: OPEN
        trigger: "POST /alumni/research-cases/{id}/reopen"
        actor: AlumniRelationsStaff
        preconditions:
          - "reopened_count < 3 (ERR_CASE_REOPEN_LIMIT)"
        side_effects:
          - "reopened_count += 1"
      - from: VERIFIED
        to: REUNITED
        trigger: "POST /alumni/research-cases/{id}/reunite"
        actor: AlumniRelationsStaff
        preconditions:
          - "Linked AlumniRecord.status == LOST"
        side_effects:
          - "resolved_at = current logical clock"
          - "AlumniRecord.status: LOST -> ACTIVE (triggers its own side effects)"
      - from: LEAD_LOGGED
        to: DEAD_END
        trigger: "POST /alumni/research-cases/{id}/dead-end"
        actor: AlumniRelationsStaff
        preconditions: []
        side_effects:
          - "resolved_at = current logical clock"

  - entity: ReunionEvent
    initial_state: PLANNING
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: PLANNING
        to: COMMITTEE_FORMED
        trigger: "POST /alumni/events/{id}/form-committee"
        actor: AlumniRelationsStaff
        preconditions:
          - "A ReunionCommittee exists for this event"
          - "committee_count >= 1"
        side_effects: []
      - from: COMMITTEE_FORMED
        to: OPEN_FOR_REGISTRATION
        trigger: "POST /alumni/events/{id}/open-registration"
        actor: AlumniRelationsStaff
        preconditions:
          - "committee_count >= committee_quorum_required (ERR_QUORUM_NOT_MET)"
          - "At least one TicketTier exists with sales window covering the current logical clock (ERR_NO_ACTIVE_TIER)"
        side_effects:
          - "ReunionCommittee.locked = true"
      - from: OPEN_FOR_REGISTRATION
        to: HELD
        trigger: "POST /alumni/events/{id}/mark-held"
        actor: AlumniRelationsStaff
        preconditions:
          - "Current logical clock >= event_date"
        side_effects: []
      - from: HELD
        to: RECONCILED
        trigger: "POST /alumni/events/{id}/reconcile"
        actor: AlumniRelationsStaff
        preconditions:
          - "No EventRegistration with payment_status == PENDING_PAYMENT"
        side_effects:
          - "Pledges on linked GiftCampaign remain; campaign may still be ACTIVE"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /alumni/events/{id}/cancel"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects:
          - "All CommitteeMembership ACTIVE/INVITED: status -> ENDED, ended_reason = EVENT_CANCELLED"
      - from: COMMITTEE_FORMED
        to: CANCELLED
        trigger: "POST /alumni/events/{id}/cancel"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects:
          - "All CommitteeMembership ACTIVE/INVITED: status -> ENDED, ended_reason = EVENT_CANCELLED"
      - from: OPEN_FOR_REGISTRATION
        to: CANCELLED
        trigger: "POST /alumni/events/{id}/cancel"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects:
          - "All EventRegistration with payment_status in {PENDING_PAYMENT, CONFIRMED}: payment_status -> CANCELLED, cancelled_reason = EVENT_CANCELLED (each cancellation itself decrements TicketTier.sold_count and event.total_revenue_cents)"
          - "Linked GiftCampaign in ACTIVE: each PLEDGED pledge -> LAPSED (each lapse itself decrements campaign.pledged_total_cents and triggers giving_propensity recompute on the pledgor's AlumniRecord)"
          - "All CommitteeMembership ACTIVE/INVITED: status -> ENDED, ended_reason = EVENT_CANCELLED (each end decrements committee_count)"
          - "MemorabiliaPublication rows in DRAFT/IN_REVIEW/APPROVED: no auto-transition (retained for archive)"

  - entity: CommitteeMembership
    initial_state: INVITED
    terminal_states: [ENDED, DECLINED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /alumni/memberships/{id}/accept"
        actor: CommitteeVolunteer
        preconditions:
          - "Acting user's AlumniRecord.id == membership.alumni_id (ownership)"
          - "Parent ReunionCommittee.locked == false (ERR_COMMITTEE_LOCKED)"
          - "AlumniRecord.status == ACTIVE (ERR_ALUMNUS_NOT_ACTIVE)"
        side_effects:
          - "ReunionEvent.committee_count += 1; posture re-derived"
          - "If role == CHAIR: ReunionCommittee.chair_membership_id = this membership id (only one ACTIVE CHAIR allowed; ERR_CHAIR_EXISTS)"
      - from: INVITED
        to: DECLINED
        trigger: "POST /alumni/memberships/{id}/decline"
        actor: CommitteeVolunteer
        preconditions:
          - "Acting user's AlumniRecord.id == membership.alumni_id"
        side_effects: []
      - from: ACTIVE
        to: ENDED
        trigger: "POST /alumni/memberships/{id}/end"
        actor: ReunionChair
        preconditions:
          - "Acting user is the ACTIVE CHAIR of the parent committee OR AlumniRelationsStaff (staff override via same endpoint)"
          - "Parent ReunionCommittee.locked == false (ERR_COMMITTEE_LOCKED)"
        side_effects:
          - "ReunionEvent.committee_count -= 1; posture re-derived"
          - "If membership was CHAIR: chair_membership_id = null"

  - entity: EventRegistration
    initial_state: PENDING_PAYMENT
    terminal_states: [REFUNDED, CANCELLED, CHECKED_IN]
    transitions:
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "POST /alumni/registrations/{id}/confirm-payment"
        actor: Alumni
        preconditions:
          - "Acting user's AlumniRecord.id == registration.alumni_id"
          - "Parent ReunionEvent.status == OPEN_FOR_REGISTRATION (ERR_EVENT_NOT_OPEN)"
          - "TicketTier not sold out at confirm time: tier.capacity == 0 OR tier.sold_count < tier.capacity (ERR_TIER_SOLD_OUT)"
        side_effects:
          - "final_price_cents = ticket_price_calc(FINAL variant)"
          - "TicketTier.sold_count += 1"
          - "ReunionEvent.total_revenue_cents += final_price_cents; posture re-derived"
          - "AlumniRecord.engagement_score recomputed via engagement_score_calc"
      - from: CONFIRMED
        to: REFUNDED
        trigger: "POST /alumni/registrations/{id}/refund"
        actor: AlumniRelationsStaff
        preconditions:
          - "Parent ReunionEvent.status != HELD (ERR_EVENT_ALREADY_HELD)"
        side_effects:
          - "TicketTier.sold_count -= 1"
          - "ReunionEvent.total_revenue_cents -= final_price_cents; posture re-derived"
          - "attendance_status stays NOT_CHECKED_IN"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /alumni/registrations/{id}/check-in"
        actor: AlumniRelationsStaff
        preconditions:
          - "Parent ReunionEvent.status in {OPEN_FOR_REGISTRATION, HELD}"
          - "payment_status == CONFIRMED (parallel-dimension gate)"
        side_effects:
          - "attendance_status = CHECKED_IN; registration row considered terminal once CHECKED_IN"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /alumni/registrations/{id}/cancel"
        actor: Alumni
        preconditions:
          - "Acting user's AlumniRecord.id == registration.alumni_id"
        side_effects:
          - "cancelled_reason = REGISTRANT"

  - entity: ChapterProgram
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /alumni/programs/{id}/propose"
        actor: AffinityGroupLeader
        preconditions:
          - "Acting user's AlumniRecord.id == program.leader_id"
          - "Parent AffinityGroup.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
        side_effects: []
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /alumni/programs/{id}/withdraw"
        actor: AffinityGroupLeader
        preconditions:
          - "Acting user's AlumniRecord.id == program.leader_id"
        side_effects: []
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /alumni/programs/{id}/approve"
        actor: AlumniRelationsStaff
        preconditions:
          - "Parent AffinityGroup.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
          - "budget_allocated_cents <= group.budget_remaining_cents (ERR_BUDGET_EXCEEDED)"
          - "No venue conflict: no other ChapterProgram of the same group in APPROVED/PUBLISHED/COMPLETED whose closed interval [start, end+60min] overlaps this program's [start, end+60min] (ERR_VENUE_CONFLICT)"
        side_effects:
          - "AffinityGroup.budget_committed_cents += budget_allocated_cents; budget_remaining_cents re-derived"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /alumni/programs/{id}/publish"
        actor: AffinityGroupLeader
        preconditions:
          - "Acting user's AlumniRecord.id == program.leader_id"
        side_effects: []
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /alumni/programs/{id}/complete"
        actor: AffinityGroupLeader
        preconditions:
          - "Acting user's AlumniRecord.id == program.leader_id"
          - "actual_spend_cents must be provided and >= 0"
          - "actual_spend_cents <= budget_allocated_cents (ERR_SPEND_OVERRUN)"
        side_effects:
          - "AffinityGroup.budget_committed_cents -= budget_allocated_cents"
          - "AffinityGroup.budget_spent_cents += actual_spend_cents; budget_remaining_cents re-derived"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /alumni/programs/{id}/cancel"
        actor: AlumniRelationsStaff
        preconditions: []
        side_effects:
          - "AffinityGroup.budget_committed_cents -= budget_allocated_cents; budget_remaining_cents re-derived (compensating release)"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /alumni/programs/{id}/cancel"
        actor: AlumniRelationsStaff
        preconditions: []
        side_effects:
          - "AffinityGroup.budget_committed_cents -= budget_allocated_cents; budget_remaining_cents re-derived (compensating release)"

  - entity: GiftCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /alumni/campaigns/{id}/activate"
        actor: AlumniRelationsStaff
        preconditions:
          - "Linked ReunionEvent.milestone_year > 0 and milestone_year % 5 == 0 (ERR_NOT_MILESTONE_YEAR)"
          - "goal_cents > 0"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /alumni/campaigns/{id}/close"
        actor: AlumniRelationsStaff
        preconditions:
          - "No GiftPledge with status PLEDGED on this campaign (ERR_PLEDGES_OUTSTANDING)"
        side_effects: []
      - from: ACTIVE
        to: ABANDONED
        trigger: "system (linked ReunionEvent -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "All PLEDGED pledges -> LAPSED with their own total-decrement side effects"

  - entity: GiftPledge
    initial_state: PLEDGED
    terminal_states: [FULFILLED, LAPSED, WRITTEN_OFF]
    transitions:
      - from: PLEDGED
        to: FULFILLED
        trigger: "POST /alumni/pledges/{id}/fulfill"
        actor: AlumniRelationsStaff
        preconditions:
          - "Parent GiftCampaign.status == ACTIVE (ERR_CAMPAIGN_NOT_ACTIVE)"
          - "AlumniRecord.status != DECEASED"
        side_effects:
          - "matched_credit_cents = campaign_matching_credit(amount_cents, campaign.matching_multiplier_bps)"
          - "GiftCampaign.fulfilled_total_cents += amount_cents"
          - "GiftCampaign.matched_credit_cents += matched_credit_cents"
          - "AlumniRecord.lifetime_giving_cents += amount_cents"
          - "AlumniRecord.engagement_score and giving_propensity recomputed (giving_propensity AFTER engagement_score per pinned evaluation order)"
      - from: PLEDGED
        to: LAPSED
        trigger: "POST /alumni/pledges/{id}/lapse  OR system (event cancelled / alumnus deceased)"
        actor: AlumniRelationsStaff
        preconditions: []
        side_effects:
          - "GiftCampaign.pledged_total_cents -= amount_cents"
          - "AlumniRecord.giving_propensity recomputed"
      - from: PLEDGED
        to: WRITTEN_OFF
        trigger: "POST /alumni/pledges/{id}/write-off"
        actor: AlumniRelationsDirector
        preconditions:
          - "Parent GiftCampaign.status == CLOSED (ERR_CAMPAIGN_NOT_CLOSED)"
        side_effects:
          - "GiftCampaign.pledged_total_cents -= amount_cents"

  - entity: MemorabiliaPublication
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /alumni/publications/{id}/submit-review"
        actor: AlumniRelationsStaff
        preconditions:
          - "class_notes_body length >= 1"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /alumni/publications/{id}/return-for-edits"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects:
          - "review_round += 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /alumni/publications/{id}/approve"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_REVIEW
        trigger: "POST /alumni/publications/{id}/request-re-review"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /alumni/publications/{id}/publish"
        actor: AlumniRelationsDirector
        preconditions:
          - "Linked ReunionEvent.status in {OPEN_FOR_REGISTRATION, HELD, RECONCILED} (ERR_EVENT_NOT_PUBLISHABLE)"
        side_effects:
          - "AlumniRecord.engagement_score recompute scheduled for all registrants of the linked event"

  - entity: AffinityGroup
    initial_state: ACTIVE
    terminal_states: [DISSOLVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /alumni/groups/{id}/suspend"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects:
          - "ChapterPrograms in DRAFT/PROPOSED for this group remain but cannot be proposed/approved while group SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /alumni/groups/{id}/reactivate"
        actor: AlumniRelationsDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /alumni/groups/{id}/dissolve"
        actor: AlumniRelationsDirector
        preconditions:
          - "No ChapterProgram in APPROVED or PUBLISHED state (ERR_PROGRAMS_OUTSTANDING)"
        side_effects:
          - "budget_committed_cents must be 0 at dissolve time (guaranteed by precondition)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: record-update-stale-version
    parent_entity: AlumniRecord
    write_endpoint: "PUT /alumni/records/{id}"
    occ_field: "expected_record_version"
    description: |
      Updating an AlumniRecord whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has just
      updated contact details or a cascade (e.g., reunite) mutated the record,
      and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: tier-create-stale-event
    parent_entity: ReunionEvent
    write_endpoint: "POST /alumni/events/{id}/ticket-tiers"
    occ_field: "expected_event_version"
    description: |
      Creating a TicketTier against a ReunionEvent whose version has advanced
      since the client last observed it is rejected. A prior tier creation or a
      posture-affecting mutation may have advanced the event version, making
      this writer's assumptions (e.g., window layout) stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engagement_score_calc
    trigger: "event registration confirm, gift pledge fulfill, publication publish, record reunite, and explicit recompute endpoint"
    algorithm: weighted_scoring
    formula: |
      score = min(100.00,
                  0.50 * event_points
                + 0.30 * giving_points
                + 0.20 * service_points)
      event_points  = min(100, 25 * count(EventRegistration with payment_status in {CONFIRMED, CHECKED_IN} and attendance counted) )
      giving_points = min(100, lifetime_giving_cents / 100000 * 100)   # $1000 -> 100 points
      service_points= min(100, 20 * count(CommitteeMembership status in {ACTIVE, ENDED} with ended_reason != ALUMNUS_DECEASED))
      Round score to 2 decimals, round_half_up.
    input_set: "AlumniRecord under recompute; registrations exclude CANCELLED/REFUNDED; pledges FULFILLED only; memberships exclude ended_reason == ALUMNUS_DECEASED"
    constants:
      EVENT_WEIGHT: 0.50
      GIVING_WEIGHT: 0.30
      SERVICE_WEIGHT: 0.20
      EVENT_POINTS_PER: 25
      SERVICE_POINTS_PER: 20
      GIVING_POINT_DOLLARS: 1000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Computed on-the-fly at registration creation and pledge creation (pre-fulfillment) for display"
        difference: "Includes PLEDGED pledges in giving_points at 50% weight of their amount; produces a higher or equal score than FINAL for identical data"
      - name: FINAL
        when: "Persisted to AlumniRecord.engagement_score on any mutating trigger"
        difference: "Only FULFILLED pledges and non-cancelled registrations count; this is the stored variant"

  - name: engagement_tier_thresholds
    trigger: "after engagement_score_calc persists a new score"
    algorithm: threshold
    formula: |
      if engagement_score >= 70.00: tier = HIGH
      else if engagement_score >= 30.00: tier = MEDIUM
      else: tier = LOW
      Boundary is inclusive (>=): exactly 70.00 is HIGH; exactly 30.00 is MEDIUM.
    input_set: "single AlumniRecord"
    constants:
      HIGH_THRESHOLD: 70.00
      MEDIUM_THRESHOLD: 30.00
    precision: "threshold compare at 2-decimal precision"

  - name: giving_propensity_calc
    trigger: "after engagement_score_calc FINAL persists (evaluation order pinned: engagement_score first, then propensity reads the NEW score)"
    algorithm: weighted_scoring
    formula: |
      base = engagement_score / 100.0                       # uses the just-persisted score
      recency_bonus = 0.15 if any FULFILLED pledge within last 365 days of logical clock else 0.0
      capacity_factor = min(0.25, lifetime_giving_cents / 1000000 * 0.25)
      giving_propensity = round_half_up(min(1.00, base * 0.7 + recency_bonus + capacity_factor), 2)
    input_set: "single AlumniRecord; pledges FULFILLED only; window is logical-clock-relative [now-365d, now]"
    constants:
      SCORE_WEIGHT: 0.7
      RECENCY_BONUS: 0.15
      CAPACITY_CAP: 0.25
      RECENCY_WINDOW_DAYS: 365
    precision: "2 decimal places, round_half_up"

  - name: ticket_price_calc
    trigger: "registration creation (ESTIMATE) and payment confirmation (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order pinned: (1) early-bird discount, (2) committee-comp, (3) late fee, (4) round.
      price = tier.base_price_cents
      if current_logical_clock < event_early_bird_cutoff(event):      # cutoff = event_date - 60 days
          price = price * (100 - tier.early_bird_discount_pct) / 100
      if registrant_has_active_committee_membership(event):
          price = price * 0.75                                        # 25% committee discount
      if current_logical_clock > event_date - 7 days:
          price = price + 1500                                        # $15 late fee in cents
      final = round_half_up(price, 0)                                 # integer cents
    input_set: "TicketTier row, ReunionEvent row, registrant AlumniRecord + its CommitteeMemberships with status ACTIVE on the event's committee"
    constants:
      COMMITTEE_DISCOUNT_FACTOR: 0.75
      LATE_FEE_CENTS: 1500
      LATE_FEE_WINDOW_DAYS: 7
      EARLY_BIRD_CUTOFF_DAYS: 60
    precision: "integer cents, round_half_up at final step only"
    variants:
      - name: ESTIMATE
        when: "At registration creation; produces quoted_price_cents"
        difference: "Forward-looking: assumes early-bird window applies if the clock is currently before cutoff, ignores late fee entirely (registration is never 'late' at creation in this variant)"
      - name: FINAL
        when: "At confirm-payment; produces final_price_cents"
        difference: "Chronological: evaluates all four steps against the logical clock at confirm time, INCLUDING the late fee. For identical tier data a registration created early but confirmed within 7 days of the event yields FINAL > ESTIMATE."

  - name: campaign_matching_credit
    trigger: "GiftPledge PLEDGED -> FULFILLED"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round PER PLEDGE, then sum into campaign.matched_credit_cents.
      # (sum-then-round would produce different cents and is explicitly NOT used.)
      pledge_credit = round_half_up(amount_cents * matching_multiplier_bps / 10000, 0)
      campaign.matched_credit_cents = sum(pledge_credit over FULFILLED pledges)
    input_set: "single pledge at fulfillment; campaign aggregate over FULFILLED pledges only"
    constants: {}
    precision: "integer cents, round_half_up per pledge"

  - name: reunion_posture_calc
    trigger: "any change to committee_count, any TicketTier.sold_count, or event status change"
    algorithm: constraint_propagation
    formula: |
      if event.status != OPEN_FOR_REGISTRATION:
          posture = CLOSED if event.status in {HELD, RECONCILED, CANCELLED} else GATED
      else:
          if committee_count < committee_quorum_required: posture = GATED
          else:
              tiers = all TicketTier of event
              bookable = [t for t in tiers if t.capacity == 0 or t.sold_count < t.capacity]
              if len(bookable) == 0: posture = SOLD_OUT
              else: posture = OPEN
    input_set: "single ReunionEvent + its TicketTier rows + committee_count"
    constants: {}
    precision: "n/a (enum derivation)"

  - name: suppression_recompute
    trigger: "AlumniRecord status change, CommunicationPreference create/update, global suppression list mutation"
    algorithm: constraint_propagation
    formula: |
      suppressed = (record.status == DO_NOT_CONTACT) or (record.status == DECEASED) \
                   or ((record.id, channel) in global_suppression_list) \
                   or (channel == EMAIL and record.hard_bounce_flag)
      # global_suppression_list is an operator-maintained set manipulated via /alumni/suppression-list endpoints
      if suppressed: suppression_reason = first matching of [DO_NOT_CONTACT_RECORD, GLOBAL_LIST, HARD_BOUNCE] in that order
      else: suppression_reason = NONE
    input_set: "all CommunicationPreference rows of the affected AlumniRecord"
    constants: {}
    precision: "n/a (boolean derivation)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; scoped children must belong to the parent in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "OCC expected_*_version present when required and matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /alumni/records/{id}, POST /alumni/events/{id}/ticket-tiers"

  - priority: 5
    category: state
    check: "Target resource in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_referential
    check: "Referenced entities exist and are linkable: tier belongs to event, alumnus not DECEASED, leader is ACTIVE alumnus"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "creation endpoints with FK payloads"

  - priority: 7
    category: business_temporal
    check: "Sales-window and venue-window temporal rules: tier windows half-open non-overlapping per event; program venue closed+60min-buffer non-overlapping per group"
    error_id: "ERR_WINDOW_OVERLAP | ERR_VENUE_CONFLICT | ERR_SALES_WINDOW_CLOSED"
    http_status: 422
    applies_to: "ticket-tier create, program approve, registration create"

  - priority: 8
    category: business_constraint
    check: "Uniqueness/structural constraints: one ACTIVE CHAIR per committee, one committee per event, one campaign per event, pledge amount >= 100 cents"
    error_id: "ERR_CHAIR_EXISTS | ERR_DUPLICATE_CHILD | ERR_AMOUNT_TOO_SMALL"
    http_status: 422
    applies_to: "membership accept, committee create, campaign create, pledge create"

  - priority: 9
    category: business_safety
    check: "Suppression/compliance: no communication-targeting operation may address a suppressed channel; deceased records are read-only except status corrections"
    error_id: ERR_CHANNEL_SUPPRESSED
    http_status: 422
    applies_to: "preference update, any outreach-triggering endpoint"

  - priority: 10
    category: business_fiscal
    check: "Fiscal checks: quorum before opening registration, tier not sold out, budget remaining sufficient, spend within allocation"
    error_id: "ERR_QUORUM_NOT_MET | ERR_TIER_SOLD_OUT | ERR_BUDGET_EXCEEDED | ERR_SPEND_OVERRUN"
    http_status: 422
    applies_to: "open-registration, confirm-payment, program approve, program complete"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- AlumniRecord ---
  - method: POST
    path: "/alumni/records"
    description: "Create an AlumniRecord"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 201
    input: [full_name, primary_email, class_year, degree_code]
    output: AlumniRecord
    side_effects: ["status=ACTIVE, engagement_score=0.00, engagement_tier=LOW, giving_propensity=0.00"]

  - method: GET
    path: "/alumni/records/{id}"
    description: "Get an AlumniRecord"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector, ReunionChair, CommitteeVolunteer, AffinityGroupLeader, Alumni]
    code: 200
    input: []
    output: AlumniRecord
    side_effects: []

  - method: GET
    path: "/alumni/records"
    description: "List AlumniRecords with optional filters"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: ["status?", "class_year?", "engagement_tier?", "limit?", "offset?"]
    output: AlumniRecord[]
    side_effects: []

  - method: PUT
    path: "/alumni/records/{id}"
    description: "Update mutable AlumniRecord fields; OCC via expected_record_version"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: ["full_name?", "primary_email?", "degree_code?", expected_record_version]
    output: AlumniRecord
    side_effects: ["increments AlumniRecord.version by 1"]

  - method: POST
    path: "/alumni/records/{id}/mark-lost"
    description: "Transition AlumniRecord ACTIVE -> LOST"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: AlumniRecord
    side_effects: ["lost_since set", "suppression_recompute on all preferences", "increments version"]

  - method: POST
    path: "/alumni/records/{id}/set-do-not-contact"
    description: "Transition AlumniRecord -> DO_NOT_CONTACT"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: AlumniRecord
    side_effects: ["suppression_recompute (all channels suppressed, reason DO_NOT_CONTACT_RECORD)"]

  - method: POST
    path: "/alumni/records/{id}/clear-do-not-contact"
    description: "Transition AlumniRecord DO_NOT_CONTACT -> ACTIVE"
    roles: [AlumniRelationsDirector]
    code: 200
    input: []
    output: AlumniRecord
    side_effects: ["suppression_recompute"]

  - method: POST
    path: "/alumni/records/{id}/mark-deceased"
    description: "Transition AlumniRecord -> DECEASED with full cascade"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: AlumniRecord
    side_effects: ["membership end cascade", "registration cancel cascade", "pledge lapse cascade", "suppression cascade"]

  # --- LostAlumniResearchCase ---
  - method: POST
    path: "/alumni/research-cases"
    description: "Open a research case for a LOST alumnus"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 201
    input: [alumni_id, lead_source, lead_detail, lead_confidence]
    output: LostAlumniResearchCase
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/alumni/research-cases/{id}"
    description: "Get a research case"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: LostAlumniResearchCase
    side_effects: []

  - method: GET
    path: "/alumni/research-cases"
    description: "List research cases; alumni_id filter supported"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: ["alumni_id?", "status?", "limit?", "offset?"]
    output: LostAlumniResearchCase[]
    side_effects: []

  - method: POST
    path: "/alumni/research-cases/{id}/log-lead"
    description: "OPEN -> LEAD_LOGGED"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: [lead_source, lead_detail, lead_confidence]
    output: LostAlumniResearchCase
    side_effects: []

  - method: POST
    path: "/alumni/research-cases/{id}/verify"
    description: "LEAD_LOGGED -> VERIFIED"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: LostAlumniResearchCase
    side_effects: []

  - method: POST
    path: "/alumni/research-cases/{id}/reopen"
    description: "VERIFIED -> OPEN (cyclic); reopened_count += 1"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: LostAlumniResearchCase
    side_effects: ["reopened_count += 1"]

  - method: POST
    path: "/alumni/research-cases/{id}/reunite"
    description: "VERIFIED -> REUNITED; AlumniRecord LOST -> ACTIVE"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: LostAlumniResearchCase
    side_effects: ["resolved_at set", "AlumniRecord.status -> ACTIVE", "engagement_score recompute"]

  - method: POST
    path: "/alumni/research-cases/{id}/dead-end"
    description: "LEAD_LOGGED -> DEAD_END"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: LostAlumniResearchCase
    side_effects: ["resolved_at set"]

  # --- ReunionEvent ---
  - method: POST
    path: "/alumni/events"
    description: "Create a ReunionEvent"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 201
    input: [class_year, title, event_date, "committee_quorum_required?"]
    output: ReunionEvent
    side_effects: ["status=PLANNING, posture=GATED, committee_count=0"]

  - method: GET
    path: "/alumni/events/{id}"
    description: "Get a ReunionEvent"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector, ReunionChair, CommitteeVolunteer, AffinityGroupLeader, Alumni]
    code: 200
    input: []
    output: ReunionEvent
    side_effects: []

  - method: GET
    path: "/alumni/events"
    description: "List ReunionEvents"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector, ReunionChair, CommitteeVolunteer, AffinityGroupLeader, Alumni]
    code: 200
    input: ["status?", "posture?", "class_year?", "limit?", "offset?"]
    output: ReunionEvent[]
    side_effects: []

  - method: POST
    path: "/alumni/events/{id}/form-committee"
    description: "PLANNING -> COMMITTEE_FORMED"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: ReunionEvent
    side_effects: []

  - method: POST
    path: "/alumni/events/{id}/open-registration"
    description: "COMMITTEE_FORMED -> OPEN_FOR_REGISTRATION; locks committee"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: ReunionEvent
    side_effects: ["ReunionCommittee.locked = true", "posture re-derived"]

  - method: POST
    path: "/alumni/events/{id}/mark-held"
    description: "OPEN_FOR_REGISTRATION -> HELD"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: ReunionEvent
    side_effects: ["posture -> CLOSED"]

  - method: POST
    path: "/alumni/events/{id}/reconcile"
    description: "HELD -> RECONCILED"
    roles: [AlumniRelationsStaff, AlumniRelationsDirector]
    code: 200
    input: []
    output: ReunionEvent
    side_effects: []

  - method: POST
    path: "/alumni/events/{id}/cancel"
    description: "PLANNING/COMMITTEE_FORMED/OPEN_FOR_REGISTRATION -> CANCELLED with cascade"
    roles: [AlumniRelationsDirector]
