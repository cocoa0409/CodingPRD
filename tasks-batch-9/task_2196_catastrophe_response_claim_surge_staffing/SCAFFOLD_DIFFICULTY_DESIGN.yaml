              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id }
            - call: "POST /housing-blocks/${hb}/open"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /adjusters"
              payload: { full_name: "Night A", employment_type: "STAFF", home_state: "LA", licensed_states: ["LA"], license_expiry_utc: "2027-08-31T00:00:00.000Z", max_open_claims: 10, daily_rate: 450, per_diem_rate: 60, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
