  - section: state_machines
    instances:
      - name: strategy_and_window_are_born_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.DeRiskingStrategy.initial_state
          - state_machines.LumpSumWindow.initial_state
        distinguishing_aspect: |
          Two machines are checked at birth in one recipe: a strategy is DRAFT with
          revision_count 0 and no submitter recorded, and a window is PLANNED with
          notice_count 0 — even though the plan is still ONGOING and therefore could
          never open that window. Creation must never pre-advance a machine on the
          strength of its parent's state.
        test_recipe:
          setup:
            - "one PensionPlan in ONGOING; no amendment adopted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Actuary
              as_user_id: "actuary-01"
