      - name: release_strength_at_exactly_required_psi_passes
        grounds:
          - calculations.cylinder_set_qualified_strength
          - calculations.cylinder_break_strength_psi
          - errors[ERR_RELEASE_STRENGTH_NOT_MET]
          - state_machines.CylinderSet.TESTING_to_RELEASE_MET
        distinguishing_aspect: |
          Boundary metric 1: the psi threshold, reached through POST /cylinder-sets/{id}/breaks.
          A 2-specimen set averaging exactly 3500 psi against a required_release_psi of 3500 is
          RELEASE_MET because the comparison is >=; an otherwise identical set averaging 3499 psi
          is RELEASE_NOT_MET.
