  - rule_id: priority_pair_validation_conflict
    instances:
      - name: decide_state_vs_preference_safety_priority
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_APPLICATION_INVALID_STATE]
          - errors[ERR_DOMESTIC_PREFERENCE_VIOLATION]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): a decide call that is
          BOTH a state violation (application already HIRED) AND a safety
          violation (REJECT of QUALIFIED applicant inside the preference
          window) must return the state error ERR_APPLICATION_INVALID_STATE,
          because priority 5 runs before priority 6.
        test_recipe:
          setup:
            - "J1 RECRUITING; clock 2026-09-01 (inside preference window: cutoff 2026-09-25)"
            - "DomesticApplication APP1 applied_on 2026-09-01, already decided HIRED (qualification QUALIFIED)"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/begin-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/domestic-applications", payload: { applicant_name: "Dom Worker", contact_phone: "555-0100" }, as: ContractorAdmin, captures: { app1: $.data.id } }
            - { call: "POST /h2a/domestic-applications/${app1}/decide", payload: { decision: "HIRE", qualification: "QUALIFIED" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /h2a/domestic-applications/${app1}/decide", payload: { decision: "REJECT", qualification: "QUALIFIED" }, as: ContractorAdmin, captures: { decide_err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_APPLICATION_INVALID_STATE — NOT ERR_DOMESTIC_PREFERENCE_VIOLATION, even though the REJECT of a QUALIFIED in-window applicant also violates the preference rule (state priority 5 < safety priority 6)"
            - "DomesticApplication.${app1}.status remains HIRED (no partial mutation)"

      - name: housing_referential_vs_capacity_priority
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_GROWER_MISMATCH]
          - errors[ERR_HOUSING_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_constraint):
          a move-in that violates BOTH grower coherence (unit belongs to G1,
          assignment belongs to G2's order) AND capacity (unit already at
          capacity 1) must return ERR_GROWER_MISMATCH because referential
          priority 8 runs before constraint priority 9. Different pair than
          the decide instance (state vs business_safety).
        test_recipe:
          setup:
            - "G1's J1 ACTIVE with W_A WORKING; G1 unit U1 (capacity 1) CERTIFIED with W_A OCCUPIED (unit full)"
            - "G2's J2 (2026-09-15..2026-11-03) ACTIVE with W_C WORKING; clock 2026-09-15"
          setup_api_calls:
