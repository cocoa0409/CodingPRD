            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
            - { call: "POST /trainees", payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", full_name: "Tara Nolan", email: "tara@riverside.example", deployment_hold: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { t1_id: $.data.id } }
          trigger:
            - { call: "GET /cohorts/${coh_id}", payload: {}, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { seats0: $.data.seats_confirmed } }
            - { call: "POST /trainees/${t1_id}/enrollment", payload: { action: "ENROLL" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "GET /cohorts/${coh_id}", payload: {}, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { seats1: $.data.seats_confirmed } }
            - { call: "POST /trainees/${t1_id}/enrollment", payload: { action: "WITHDRAW" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "GET /cohorts/${coh_id}", payload: {}, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { seats2: $.data.seats_confirmed } }
            - { call: "GET /programs/${prog_id}", payload: {}, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { members2: $.data.active_member_count } }
          assert:
            - "Before enrollment Cohort.${coh_id}.seats_confirmed == 0 and Program.${prog_id}.active_member_count == 0"
            - "After enrollment Cohort.${coh_id}.seats_confirmed == 1 and Program.${prog_id}.active_member_count == 1"
            - "After the compensating withdrawal Cohort.${coh_id}.seats_confirmed == 0 - no drift"
            - "After the compensating withdrawal Program.${prog_id}.active_member_count == 0 - no drift"
