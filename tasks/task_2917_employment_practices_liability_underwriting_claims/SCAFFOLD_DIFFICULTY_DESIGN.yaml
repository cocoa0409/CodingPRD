          assert:
            - "the first trigger call returns error_id == ERR_INVOICE_PERIOD_OVERLAP with http_status 409 — period_start 2026-08-31T00:00:00.000Z equals the existing invoice's inclusive period_end, and closed intervals that touch do overlap"
            - "DefenseInvoice.${inv_a_id}.billed_fees_cents == 1020000 AND rate_cap_excess_cents == 120000 AND allowed_amount_cents == 900000 (20.0 associate hours at 51000 capped to 45000, no expenses)"
            - "GET /epli/defense-invoices filtered by defense_assignment_id ${asg_id} returns total_count == 1 immediately after the refusal"
            - "the second trigger call returns http_status 201 with DefenseInvoice.${inv_c_id}.status == SUBMITTED — period_start one day past the incumbent's period_end is disjoint"
            - "DefenseInvoice.${inv_c_id}.billed_fees_cents == 510000 AND rate_cap_excess_cents == 60000 AND allowed_amount_cents == 450000 AND disallowed_amount_cents == 60000"
            - "GET /epli/defense-invoices filtered by defense_assignment_id ${asg_id} returns total_count == 2"
            - "DefenseAssignment.${asg_id}.budget_spent_cents == 0 — submission alone does not consume the matter budget"

      - name: risk_service_half_open_window_with_thirty_day_buffer
        grounds:
          - validations[priority=18]
          - errors.ERR_SERVICE_WINDOW_CONFLICT
          - entities.RiskManagementService.fields.effective_to
          - entities.RiskManagementService.fields.effective_from
          - endpoints["POST /epli/applicants/{applicant_id}/risk-management-services"]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) EXTENDED by
          SERVICE_GAP_BUFFER_DAYS 30 on the incumbent's tail, scoped per
          (Applicant, service_type). This is the opposite convention from the closed
          billing-period rule and the resource is the Applicant rather than a
          DefenseAssignment: a new HOTLINE_SUBSCRIPTION starting exactly at the
          incumbent's effective_to would NOT collide under bare half-open comparison,
          but the 30-day buffer pushes the incumbent's effective tail to
          2026-10-31T00:00:00.000Z and the request is refused; starting exactly at the
          buffered tail succeeds, and a different service_type in the very window that
          was just refused also succeeds.
        test_recipe:
          setup:
            - "Jurisdiction CA (T4) is registered and applicant 'Northgate Retail Group' exists with total_headcount 400 allocated entirely to CA. No rate plan, assessment or policy is needed — the conflict rule is scoped to the Applicant."
            - "The logical clock stands at the default 2026-08-01T00:00:00.000Z."
            - "One HOTLINE_SUBSCRIPTION service already covers the half-open window [2026-07-01, 2026-10-01) at credit_pct 0.08."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Northgate Retail Group", total_headcount: 400, prior_year_separations: 96, jurisdiction_headcounts: [{ code: "CA", headcount: 400 }], primary_jurisdiction_code: "CA" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id }
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HOTLINE_SUBSCRIPTION", credit_pct: 0.08, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-10-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { svc1_id: $.data.id }
          trigger:
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HOTLINE_SUBSCRIPTION", credit_pct: 0.08, effective_from: "2026-10-01T00:00:00.000Z", effective_to: "2027-10-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err: $.data.error_id }
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HOTLINE_SUBSCRIPTION", credit_pct: 0.08, effective_from: "2026-10-31T00:00:00.000Z", effective_to: "2027-10-31T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { svc3_id: $.data.id }
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HANDBOOK_REVIEW", credit_pct: 0.05, effective_from: "2026-10-01T00:00:00.000Z", effective_to: "2027-10-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { svc4_id: $.data.id }
          assert:
            - "the first trigger call returns error_id == ERR_SERVICE_WINDOW_CONFLICT with http_status 409 — the incumbent's effective_to 2026-10-01T00:00:00.000Z plus SERVICE_GAP_BUFFER_DAYS 30 reaches 2026-10-31T00:00:00.000Z, so a window opening on 2026-10-01 falls inside the buffered tail even though bare half-open intervals would merely touch"
            - "RiskManagementService.${svc1_id}.status == ACTIVE (the clock 2026-08-01T00:00:00.000Z sits inside [2026-07-01, 2026-10-01)) AND credit_pct == 0.08"
            - "the second trigger call returns http_status 201 with RiskManagementService.${svc3_id}.status == PENDING AND effective_from == 2026-10-31T00:00:00.000Z — a window opening exactly at the buffered tail is accepted, because the buffered comparison is also half-open"
