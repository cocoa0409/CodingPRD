      - name: corner_sm_cycle_posture_cycles_back_through_reopened
        claim_type: Cyclic loop
        excluded_because:
          difficulty_instance: cycle_posture_loops_frozen_reopened_census_locked_frozen_again
          rationale: |
            The cyclic shape of ReportingCycle.snapshot_posture — FROZEN -> REOPENED ->
            CENSUS_LOCKED -> FROZEN with reopen_count 1 and a re-registered extract — is walked
            end to end by that §1.8 instance, including the loop's effect on active_record_count
            and on the voided edit checks. A corner duplicate would assert the same postures.

      - name: corner_sm_prep_status_and_edit_status_are_independent_dimensions
        claim_type: Parallel dimensions
        excluded_because:
          difficulty_instance: component_prep_status_and_edit_status_advance_as_independent_dimensions
          rationale: |
            The parallel-dimension claim (edit_status moving OPEN_EDITS -> EXPLAINED -> OPEN_EDITS
            -> CLEARED while prep_status stays PREPARED, with explanation_round climbing) is the
            entire subject of that §1.8 instance.

      - name: corner_sm_decertification_cascades_down_to_restatements
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: cycle_reopen_cascades_component_then_publications_then_restatement
          rationale: |
            The four-level cascade-down side effect (cycle reopen -> component decertified ->
            publications RESTATEMENT_PENDING -> SUBMITTED restatements VOIDED), including the
            conditional skip of WITHDRAWN publications, is asserted level by level in that §1.8
            instance; no additional corner coverage is available for the same edges.

  - section: calculations
    instances:
      - name: corner_calc_half_covered_mapping_raises_the_component_level_fatal_check
        claim_type: Correct Result
        grounds:
          - calculations.mapping_coverage_pct
          - calculations.edit_check_generation
          - entities.SurveyComponent.fields.mapping_coverage_pct
          - entities.SurveyComponent.fields.fatal_open_count
          - state_machines.DataElementMapping.PROPOSED_to_VALIDATED
        distinguishing_aspect: |
          Two required ENROLLMENT definitions with exactly one VALIDATED mapping give
          mapping_coverage_pct 50.0, which appends the component-level UNMAPPED_ELEMENTS FATAL
          check (metric_key "ALL") after the metric checks — a PROPOSED mapping does not count
          as coverage.
        test_recipe:
          setup:
            - "Definitions ENR_LEVEL and ENR_STATUS are both required for ENROLLMENT under effective_cycle_code IPEDS-2027."
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED; one mapping for ENR_LEVEL is VALIDATED, ENR_STATUS has none."
          setup_api_calls:
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_LEVEL", survey_component: "ENROLLMENT", value_domain: ["UNDERGRAD", "GRADUATE"], required: true, unit_of_measure: "code", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { def1: $.data.id }
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_STATUS", survey_component: "ENROLLMENT", value_domain: ["FULL_TIME", "PART_TIME"], required: true, unit_of_measure: "code", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { def2: $.data.id }
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60129", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${def1}", local_system_code: "SIS", local_field_path: "sis.student.level", transform_expression: "upper(level_code)", value_map: { "UG": "UNDERGRAD", "GR": "GRADUATE" } }
              as: IRAnalyst
              captures: { map1: $.data.id }
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "APPROVE" }
              as: DataSteward
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${def2}", local_system_code: "SIS", local_field_path: "sis.student.load", transform_expression: "upper(load_code)", value_map: { "FT": "FULL_TIME" } }
              as: IRAnalyst
              captures: { map2: $.data.id }
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
          trigger:
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "GET /ir/edit-checks?component_id=${comp}"
              payload: {}
              as: IRAnalyst
              captures: { ec1: "$.data[0].id" }
          assert:
            - "DataElementMapping.${map1}.status == VALIDATED and DataElementMapping.${map2}.status == PROPOSED"
            - "SurveyComponent.${comp}.mapping_coverage_pct == 50.0"
            - "GET /ir/edit-checks?component_id=${comp} -> total_count == 1"
            - "EditCheck.${ec1}.check_code == \"UNMAPPED_ELEMENTS\" and severity == FATAL and metric_key == \"ALL\" and sequence_no == 1 and variance_pct is null"
            - "SurveyComponent.${comp}.fatal_open_count == 1 and edit_status == OPEN_EDITS"
            - "SurveyComponent.${comp}.prep_status == PREPARED and prepared_by_user_id == \"analyst-1\""

      - name: corner_calc_mapping_coverage_required_set_is_filtered_by_component_and_cycle
        claim_type: Input Set Filtering
        grounds:
          - calculations.mapping_coverage_pct
          - entities.FederalDefinition.fields.required
          - entities.FederalDefinition.fields.survey_component
          - entities.FederalDefinition.fields.effective_cycle_code
        distinguishing_aspect: |
          Three definitions exist but none qualifies for the ENROLLMENT component of IPEDS-2027
          (one is COMPLETIONS, one has required false, one is effective for IPEDS-2028), so the
