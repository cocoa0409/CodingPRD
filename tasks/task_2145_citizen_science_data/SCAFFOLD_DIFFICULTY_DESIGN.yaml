          Cyclic shape on the Observation entity: SUBMITTED -> UNDER_REVIEW -> NEEDS_REVISION ->
          SUBMITTED is a genuine loop that increments revision_round to 1 and re-opens voting in a
          new round, which no linear pipeline can express.
