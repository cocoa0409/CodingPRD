  - rule_id: transitive_cascade
    instances:
      - name: go_live_retro_cascade
        grounds:
          - state_machines.Contract.READY_FOR_GO_LIVE_to_ACTIVE
          - state_machines.ContractVersion.VALIDATED_to_EFFECTIVE
          - state_machines.ContractVersion.EFFECTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 cascade from the approve-go-live trigger: the request mutates
          Contract (READY_FOR_GO_LIVE -> ACTIVE); that mutation drives v2
          VALIDATED -> EFFECTIVE and v1 EFFECTIVE -> SUPERSEDED; v2 becoming
          EFFECTIVE with retro_effective_date 2026-08-01 < effective_date
          2026-09-01 itself creates a RetroAdjustmentRun in CREATED with window
          [2026-08-01, 2026-09-01). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Contract ACTIVE with v1 EFFECTIVE (entry 99213 pct 10000, benchmark 10000 PUBLISHED)"
            - "Two OPEN paid claims: service 2026-08-10 paid 10000; service 2026-08-20 paid 15000"
            - "Amendment v2 (version_number 2, effective 2026-09-01, retro 2026-08-01) VALIDATED with entry 99213 pct 12000; contract walked ACTIVE -> IN_CONFIGURATION -> IN_TESTING -> READY_FOR_GO_LIVE with a PASSED batch on v2"
