        grounds:
          - state_machines.StorageTank.status.ONLINE_to_ALARM
          - state_machines.CordBloodUnit.availability_status.LISTED_to_QUARANTINED
          - state_machines.RegistryListing.listing_status.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.status.PENDING_CONFIRMATORY_to_CANCELLED
          - endpoints[POST /cbb/storage-tanks/{id}/temperature-readings]
        distinguishing_aspect: |
          Depth-4 cascade fired by a single temperature reading: reading > ALARM_THRESHOLD_C -> tank ALARM
          and a new TemperatureExcursion (level 1) -> unit QUARANTINED (level 2) -> registry listing
          SUSPENDED (level 3) -> pending reservation CANCELLED (level 4). Trigger is a sensor reading on
          StorageTank; nothing about billing or the clock participates.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-12T00:00:00Z."
            - "One ONLINE STANDARD tank holding one PUBLIC_DONATION unit that is CRYOPRESERVED, ELIGIBLE and LISTED."
            - "That unit has an ACTIVE RegistryListing and exactly one PENDING_CONFIRMATORY reservation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-E", tank_class: "STANDARD", capacity_slots: 5 }
              as: FacilitiesEngineer
