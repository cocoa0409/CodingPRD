  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: panelist_calendar_buffered_strict_overlap
        grounds:
          - validations[priority=72]
          - calculations.room_slot_overlap
          - entities.AuditionSlot.fields.panelist_ids
          - entities.Panelist.fields.available_for_panels
          - errors.ERR_PANELIST_UNAVAILABLE
        distinguishing_aspect: |
          Resource entity: Panelist. Interval semantics: the SAME 15-minute
          turnover buffer that guards rooms is applied to each adjudicator's own
          calendar with strict comparison, so a panelist cannot be booked 10
          minutes after their previous slot ends but can be booked exactly 15
          minutes after. Every candidate slot here sits in a room that is empty
          for the whole day, which proves the panelist - not the room - is the
          contended resource.
        test_recipe:
          setup:
            - "One season advanced to AUDITIONS_OPEN with six available VIOLIN panelists."
            - "One slot S1 in room R1 from 2026-08-12T10:00:00Z to 11:00:00Z staffed by p1, p2, p3."
            - "Rooms R2 and R3 hold no slots at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 2", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 3", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p3_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 4", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p4_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 5", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p5_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 6", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p6_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T11:00:00Z", panelist_ids: ["${p1_id}", "${p2_id}", "${p3_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R2", start_at: "2026-08-12T11:10:00Z", end_at: "2026-08-12T11:40:00Z", panelist_ids: ["${p1_id}", "${p2_id}", "${p3_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R2", start_at: "2026-08-12T11:15:00Z", end_at: "2026-08-12T11:45:00Z", panelist_ids: ["${p1_id}", "${p2_id}", "${p3_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
              captures: { s2_id: "$.data.id" }
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R3", start_at: "2026-08-12T11:10:00Z", end_at: "2026-08-12T11:40:00Z", panelist_ids: ["${p4_id}", "${p5_id}", "${p6_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
              captures: { s3_id: "$.data.id" }
          assert:
            - "Trigger call 1 (p1-p3 again at 11:10, only 10 minutes after S1 ends at 11:00, in the empty room R2) fails with 409 and error_id == ERR_PANELIST_UNAVAILABLE"
            - "Trigger call 2 (the same three panelists at 11:15, exactly 15 minutes after S1 ends) succeeds with 201 and status == OPEN"
            - "Trigger call 3 (11:10-11:40, the interval that was just refused, staffed by the untouched p4-p6 in the empty room R3) succeeds with 201"
            - "GET /audition-slots?season_id=${season_id} returns total_count == 3"
            - "GET /audition-slots?season_id=${season_id}&room_code=R2 returns total_count == 1"

      - name: member_calendar_plain_half_open_overlap
        grounds:
          - validations[priority=71]
          - calculations.member_event_overlap
          - entities.EventParticipation.fields.member_id
          - entities.EnsembleEvent.fields.start_at
          - entities.EnsembleEvent.fields.participation_count
          - errors.ERR_MEMBER_EVENT_CONFLICT
        distinguishing_aspect: |
          A DIFFERENT resource entity (Member) under DIFFERENT interval semantics:
          a musician's own calendar uses plain half-open [start_at, end_at)
          comparison with NO buffer, so two events that touch at 21:00:00Z are
          both bookable - the exact opposite of the buffered panelist rule above -
          while a one-minute true overlap at 20:59 is refused. The refused
          interval is then accepted for a second member, proving the conflict is
          per-member and not per-event.
