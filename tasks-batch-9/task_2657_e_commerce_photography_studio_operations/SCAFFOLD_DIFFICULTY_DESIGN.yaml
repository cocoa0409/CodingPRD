  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_buffer_extends_occupation_past_the_scheduled_end
        grounds:
          - validations[priority=40].ERR_STATION_OVERLAP
          - entities.Station.fields.buffer_minutes
          - endpoints[POST /studio/shoot-sessions]
        distinguishing_aspect: |
          Station exclusivity is buffer-extended and half-open: with buffer_minutes 30 the
          09:00-13:00 session occupies [09:00, 13:30), so a 13:15 start collides even though the
          raw intervals are disjoint, while a 13:30 start - exactly at the reset instant - is
          admitted. The collision is created by a field on the Station, not by the candidate.
        test_recipe:
          setup:
            - "Station MODEL-1: buffer_minutes 30, daily_capacity_minutes 1440, max_concurrent_sessions 1, calibrated to 2026-12-31. Clock 2026-08-03T08:00:00Z."
            - "One session already occupies 2026-08-03 09:00-13:00, i.e. [09:00, 13:30) after the buffer."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 30, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses1_id: $.data.id }
          trigger:
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T13:15:00Z", scheduled_end: "2026-08-03T14:15:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T13:30:00Z", scheduled_end: "2026-08-03T14:30:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses3_id: $.data.id }
          assert:
            - "first candidate (13:15): status == 409 and error_id == \"ERR_STATION_OVERLAP\""
            - "second candidate (13:30): status == 201"
            - "ShootSession.${ses3_id}.session_state == \"BOOKED\""
            - "ShootSession.${ses3_id}.planned_minutes == 60"
            - "Station.${st_id}.committed_minutes_today == 300"

      - name: talent_exclusivity_has_no_buffer_and_permits_exact_adjacency
        grounds:
          - validations[priority=41].ERR_TALENT_OVERLAP
          - entities.TalentBooking.fields.call_time
          - entities.TalentBooking.fields.wrap_time
          - endpoints[POST /studio/talent-bookings]
        distinguishing_aspect: |
          The talent window uses the opposite geometry to the station window: no buffer at all and
          plain half-open comparison, so a candidate starting 12:59 - one minute before the
          incumbent wraps - is rejected, while one starting exactly at 13:00 is accepted. Both
          candidates are filed against the same session, so only the talent axis differs.
        test_recipe:
          setup:
            - "Photographer Pia Ren (hourly 12000, day rate 80000, minimum_call_hours 4, max_daily_minutes 480) is CONFIRMED on session S1 (MODEL-1) for 09:00-13:00."
            - "Session S2 on MODEL-2 spans 12:59-17:00, so both candidate windows satisfy the in-session interval rule."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
