              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-3001", full_name: "Barbara Liskov", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS700-01", shell_type: "OFFICIAL", base_seat_cap: 25 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { shell_state: $.data.provisioning_state }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Term project", due_at: "2026-11-20T23:59:00Z", points_possible: 200.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-4001", full_name: "Student One", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-4002", full_name: "Student Two", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s2: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT", requested_state: "ACTIVE" }
