            - "Link 1: PartnerInstitution.${inst_id}.certification_status == DECERTIFIED"
            - "Link 2: AccountOpeningEvent.${ev_id}.status == CANCELLED and booked_count == 0"
            - "Link 3: Referral.${ref_id}.status == DOCS_COMPLETE and booked_event_id == null"
            - "Link 4: Participant.${p_id}.pipeline_stage == DOCS_READY (docs_complete still true, no BOOKED referral remains)"

