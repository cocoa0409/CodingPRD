            - *k_ev_ebt
            - *k_conclude_traffick
            - *k_case_t
            - *k_charge_t
            - *k_clock_0811
            - *k_det_pdq
            - *k_clock_0821
            - *k_finalize_t
          trigger:
            - call: "POST /sanction-cases/${case_t_id}/enforce"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { early_enforce_error_id: $.data.error_id }
