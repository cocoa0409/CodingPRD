        distinguishing_aspect: "quote_expires_at == created_at + 48h exactly; at now == quote_expires_at (2026-09-03T00:00:00Z) the QUOTED request flips to EXPIRED (>= semantics), before any pay attempt."
        test_recipe:
          setup:
