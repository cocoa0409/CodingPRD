# =============================================================================
# PRD Benchmark Seed Tables — Rail Siding & Industrial Track Agreement
# Generated per prd-bench-scaffold-generator SKILL.md (§1.0–§1.7 only;
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Rail Siding & Industrial Track Agreement (rail-served industrial shipper): track construction cost sharing & spec approval, maintenance responsibility & inspection cadence, switching service frequency & demurrage rules, clearance/safety compliance & derail installation, agreement term & renewal, liability & indemnification allocation, car storage on private track, abandonment & removal obligation

domain_name: rail-siding-track-agreements
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: flat            # peer entities joined by FK references; filtered-list GETs
  state_machine_shape: cyclic      # spec reject/resubmit loop, claim dispute loop, renewal loop, device compliance loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles           # railroad-side vs shipper-side roles own different operations;
                                   # amendment respond enforces segregation-of-duties (responder != proposer)
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# common_fields: true expands to id (server-minted UUID, no type prefix),
# created_at / updated_at (ISO 8601 UTC, 3 fractional digits), version (int, starts 1,
# +1 on every mutation including cascaded side effects).
# =============================================================================
entities:
  - name: TrackAgreement
    parent: null
    common_fields: true
    fields:
      - { name: shipper_name, type: string, source: input, description: "Legal name of the industrial shipper" }
      - { name: shipper_user_id, type: string, source: input, description: "Opaque X-User-ID of the shipper-side party; party checks compare this to the caller's X-User-ID" }
      - { name: facility_name, type: string, source: input, description: "Name of the rail-served facility" }
      - { name: term_start_date, type: string, source: input, description: "ISO date the agreement term begins" }
      - { name: term_end_date, type: string, source: input, description: "ISO date the agreement term ends; must be > term_start_date" }
      - { name: renewal_notice_days, type: integer, source: input, description: "Renewal offer/accept window closes this many days before term_end_date; >= 0" }
      - { name: renewal_term_months, type: integer, source: input, description: "Months added to term_end_date when a renewal is accepted; >= 1" }
      - { name: shipper_cost_share_pct, type: number, source: input, description: "Default shipper percentage of track construction cost; 0-100" }
      - { name: liability_cap_cents, type: integer, source: input, description: "Aggregate cap on shipper liability across ACCEPTED claims; >= 0" }
      - { name: shipper_indemnity_default_pct, type: number, source: input, description: "Default shipper fault percentage used when apportion omits shipper_fault_pct; 0-100" }
      - { name: free_time_hours, type: integer, source: input, description: "Free dwell hours before demurrage accrues (RAILROAD cars); >= 0" }
      - { name: demurrage_base_rate_cents, type: integer, source: input, description: "Demurrage per chargeable day, days 1-2; >= 0" }
      - { name: demurrage_escalated_rate_cents, type: integer, source: input, description: "Demurrage per chargeable day, days 3+; >= 0" }
      - { name: storage_rate_per_car_month_cents, type: integer, source: input, description: "Monthly storage fee per car on private track; >= 0" }
      - { name: inspection_cadence_days, type: integer, source: input, description: "Days between completed inspection and auto-scheduled next inspection; >= 1" }
      - { name: removal_period_days, type: integer, source: input, description: "Days after abandonment notice by which track removal must be verified; >= 1" }
      - { name: removal_penalty_per_day_cents, type: integer, source: input, description: "Penalty per day removal verification is late; >= 0" }
      - { name: service_days_of_week, type: array, source: input, description: "Non-empty subset of MON,TUE,WED,THU,FRI,SAT,SUN on which SWITCHING service orders may be scheduled" }
      - { name: max_switches_per_day, type: integer, source: input, description: "Max non-CANCELLED SWITCHING orders per segment per service_date; >= 1" }
      - { name: abandonment_notice_date, type: string, source: system, description: "ISO date set by file-abandonment-notice; null until filed" }
      - { name: removal_deadline_date, type: string, source: computed, description: "= abandonment_notice_date + removal_period_days; null until notice filed" }
      - { name: removal_penalty_cents, type: integer, source: computed, default: 0, description: "= max(0, removal_verified_date - removal_deadline_date in days) * removal_penalty_per_day_cents, set at verify-removal" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_COUNTERSIGN | ACTIVE | RENEWAL_OFFERED | EXPIRED | TERMINATED | ABANDONMENT_IN_PROGRESS | CLOSED" }

  - name: Amendment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> TrackAgreement.id; taken from the create path" }
      - { name: amendment_type, type: enum, source: input, description: "COST_SHARE | LIABILITY_CAP | STORAGE_RATE | DEMURRAGE_RATES | TERM; determines which new_* field(s) must be present" }
      - { name: new_shipper_cost_share_pct, type: number, source: input, description: "Required iff amendment_type=COST_SHARE; null otherwise" }
      - { name: new_liability_cap_cents, type: integer, source: input, description: "Required iff amendment_type=LIABILITY_CAP; null otherwise" }
      - { name: new_storage_rate_per_car_month_cents, type: integer, source: input, description: "Required iff amendment_type=STORAGE_RATE; null otherwise" }
      - { name: new_demurrage_base_rate_cents, type: integer, source: input, description: "Required iff amendment_type=DEMURRAGE_RATES (both demurrage fields required together); null otherwise" }
      - { name: new_demurrage_escalated_rate_cents, type: integer, source: input, description: "Required iff amendment_type=DEMURRAGE_RATES; null otherwise" }
      - { name: new_term_end_date, type: string, source: input, description: "Required iff amendment_type=TERM; null otherwise" }
      - { name: proposed_by_role, type: string, source: system, description: "Copied from caller's X-User-Role at creation" }
      - { name: proposed_by_user_id, type: string, source: system, description: "Copied from caller's X-User-ID at creation" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: ConstructionProject
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackAgreement.id" }
      - { name: project_name, type: string, source: input, description: "Project name" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated total construction cost; >= 0" }
      - { name: shipper_share_pct, type: number, source: input, description: "Shipper cost-share percentage for this project; defaults to agreement.shipper_cost_share_pct when omitted; 0-100" }
      - { name: rail_weight_lb_per_yard, type: number, source: input, description: "Spec: rail weight; set via submit-spec" }
      - { name: tie_material, type: enum, source: input, description: "Spec: WOOD | CONCRETE | STEEL; set via submit-spec" }
      - { name: ballast_depth_inches, type: number, source: input, description: "Spec: ballast depth; set via submit-spec" }
      - { name: spec_revision_no, type: integer, source: system, description: "0 at creation; +1 on every submit-spec (the spec version pinned by approve-spec)" }
      - { name: shipper_estimated_share_cents, type: integer, source: computed, description: "Set at approve-spec = round(estimated_cost_cents * shipper_share_pct / 100, 0); null until first approval" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual total cost, reported via complete; null until completion" }
      - { name: shipper_final_share_cents, type: integer, source: computed, description: "Set at complete = round(actual_cost_cents * shipper_share_pct / 100, 0); null until completion" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of all settle payment_cents (negative payments are refunds)" }
      - { name: outstanding_share_cents, type: integer, source: computed, default: 0, description: "= shipper_final_share_cents - amount_paid_cents; invariant amount_paid_cents + outstanding_share_cents == shipper_final_share_cents after completion" }
      - { name: status, type: enum, source: system, description: "DRAFT | SPEC_SUBMITTED | SPEC_REJECTED | SPEC_APPROVED | COMPLETED | SETTLED" }

  - name: TrackSegment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackAgreement.id" }
      - { name: segment_name, type: string, source: input, description: "Segment identifier within the facility" }
      - { name: length_feet, type: integer, source: input, description: "Track length; > 0" }
      - { name: storage_capacity_cars, type: integer, source: input, description: "Max STORED placements allowed on this segment; >= 0" }
      - { name: stored_car_count, type: integer, source: computed, default: 0, description: "= count of this segment's StoragePlacement rows with status STORED; invariant: place(+1) then release(-1) restores prior value" }
      - { name: accrued_storage_cents, type: integer, source: computed, default: 0, description: "= sum of final_storage_charge_cents over this segment's placements with status IN {RELEASED, FORCE_RELEASED}" }
      - { name: safety_suspended, type: boolean, source: computed, default: false, description: "true while any of this segment's DerailDevice rows has status NON_COMPLIANT" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE | REMOVED" }

  - name: SafetyInspection
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackAgreement.id" }
      - { name: segment_id, type: string, source: input, description: "FK -> TrackSegment.id; segment must belong to agreement_id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the inspection is scheduled for" }
      - { name: due_date, type: string, source: computed, description: "= scheduled_date; inspection is overdue when current logical date > due_date and status == SCHEDULED" }
      - { name: result, type: enum, source: system, description: "PASS | FAIL; null until record-result" }
      - { name: completed_date, type: string, source: system, description: "ISO date recorded by record-result; null until then" }
      - { name: cited_device_ids, type: array, source: system, description: "DerailDevice ids cited by record-result; empty array until then" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OVERDUE | COMPLETED_PASS | COMPLETED_FAIL" }

  - name: DerailDevice
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> TrackSegment.id" }
      - { name: device_type, type: enum, source: input, description: "DERAIL | WHEEL_STOP | BUMPING_POST" }
      - { name: location_description, type: string, source: input, description: "Where on the segment the device sits" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | INSTALLED | NON_COMPLIANT" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackAgreement.id" }
      - { name: segment_id, type: string, source: input, description: "FK -> TrackSegment.id; segment must belong to agreement_id" }
      - { name: order_type, type: enum, source: input, description: "SWITCHING | MAINTENANCE_POSSESSION" }
      - { name: service_date, type: string, source: input, description: "ISO date of the service window" }
      - { name: start_hour, type: integer, source: input, description: "Window start hour 0-23; half-open [start_hour, end_hour)" }
      - { name: end_hour, type: integer, source: input, description: "Window end hour 1-24; must be > start_hour" }
      - { name: cars_spotted, type: integer, source: input, description: "Cars delivered, recorded at complete; null until then; >= 0" }
      - { name: cars_pulled, type: integer, source: input, description: "Cars removed, recorded at complete; null until then; >= 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | COMPLETED | CANCELLED" }

  - name: CarDwell
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackAgreement.id" }
      - { name: car_mark, type: string, source: input, description: "Car initial + number, e.g. RBOX1001; at most one SPOTTED dwell per (agreement_id, car_mark)" }
      - { name: car_ownership, type: enum, source: input, description: "RAILROAD | PRIVATE; PRIVATE cars receive 2x free_time_hours" }
      - { name: placed_at, type: string, source: input, description: "ISO 8601 UTC datetime the car was placed" }
      - { name: released_at, type: string, source: input, description: "ISO 8601 UTC datetime recorded at release; must be > placed_at; null until released" }
      - { name: dwell_minutes, type: integer, source: computed, description: "SPOTTED: logical-clock now - placed_at in minutes; RELEASED: released_at - placed_at in minutes" }
      - { name: chargeable_days, type: integer, source: computed, description: "Per demurrage_charge calculation" }
      - { name: accrued_demurrage_cents, type: integer, source: computed, default: 0, description: "Provisional variant of demurrage_charge as of logical clock; recomputed on every read while SPOTTED; frozen at release" }
      - { name: final_demurrage_cents, type: integer, source: computed, description: "Final variant of demurrage_charge at release; null until released" }
      - { name: status, type: enum, source: system, description: "SPOTTED | RELEASED" }

  - name: StoragePlacement
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> TrackSegment.id" }
      - { name: car_mark, type: string, source: input, description: "Car initial + number" }
      - { name: placed_date, type: string, source: input, description: "ISO date storage began" }
      - { name: released_date, type: string, source: input, description: "ISO date recorded at release; >= placed_date; null while STORED" }
      - { name: accrued_storage_charge_cents, type: integer, source: computed, default: 0, description: "Provisional per-car storage charge as of current logical date while STORED; recomputed on read" }
      - { name: days_charged, type: integer, source: computed, description: "= max(1, released_date - placed_date in days); null until released" }
      - { name: final_storage_charge_cents, type: integer, source: computed, description: "Per-car rounded charge per storage_charge calculation; null until released" }
      - { name: status, type: enum, source: system, description: "STORED | RELEASED | FORCE_RELEASED" }

  - name: LiabilityClaim
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackAgreement.id" }
      - { name: claimant_name, type: string, source: input, description: "Name of the claimant" }
      - { name: incident_date, type: string, source: input, description: "ISO date of the incident" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Total claimed amount; > 0" }
      - { name: shipper_fault_pct, type: number, source: input, description: "Set at apportion; defaults to agreement.shipper_indemnity_default_pct when omitted; 0-100" }
      - { name: shipper_liability_cents, type: integer, source: computed, description: "Per liability_allocation calculation; recomputed on each apportion; null until first apportion" }
      - { name: railroad_liability_cents, type: integer, source: computed, description: "= claim_amount_cents - shipper_liability_cents; null until first apportion" }
      - { name: status, type: enum, source: system, description: "FILED | APPORTIONED | DISPUTED | ACCEPTED" }

# =============================================================================
# Table 2: State Machine Table
# "current logical date" below = UTC date of the logical clock
# (POST /_clock/set_current_utc; default 2026-08-01T00:00:00Z at startup).
# Every mutation of an entity increments that entity's version by 1 and refreshes
# updated_at, including mutations caused by cascaded side effects.
# =============================================================================
state_machines:
  - entity: TrackAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PENDING_COUNTERSIGN
        trigger: "POST /agreements/{agreementId}/submit"
        actor: RailroadContractsManager
        preconditions:
          - "Agreement status == DRAFT (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "TrackAgreement.version += 1"
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /agreements/{agreementId}/countersign"
        actor: ShipperFacilityManager
        preconditions:
          - "Agreement status == PENDING_COUNTERSIGN (else ERR_AGREEMENT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "TrackAgreement.version += 1"
      - from: ACTIVE
        to: RENEWAL_OFFERED
        trigger: "POST /agreements/{agreementId}/renewal-offer"
        actor: RailroadContractsManager
        preconditions:
          - "Agreement status == ACTIVE (else ERR_AGREEMENT_INVALID_STATE)"
          - "No LiabilityClaim of this agreement has status IN {FILED, APPORTIONED, DISPUTED} (else ERR_OPEN_CLAIMS_BLOCK_RENEWAL)"
          - "current logical date <= term_end_date - renewal_notice_days (else ERR_RENEWAL_WINDOW_CLOSED)"
        side_effects:
          - "TrackAgreement.version += 1"
      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /agreements/{agreementId}/accept-renewal"
        actor: ShipperFacilityManager
        preconditions:
          - "Agreement status == RENEWAL_OFFERED (else ERR_AGREEMENT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
          - "current logical date <= term_end_date - renewal_notice_days (else ERR_RENEWAL_WINDOW_CLOSED)"
        side_effects:
          - "term_end_date := term_end_date + renewal_term_months (same day-of-month, N months later)"
          - "TrackAgreement.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep, evaluated on every read of the agreement and on every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical date > term_end_date"
        side_effects:
          - "TrackAgreement.version += 1"
      - from: RENEWAL_OFFERED
        to: EXPIRED
        trigger: "system sweep, evaluated on every read of the agreement and on every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical date > term_end_date (pending offer lapses unaccepted)"
        side_effects:
          - "TrackAgreement.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agreements/{agreementId}/terminate"
        actor: RailroadContractsManager
        preconditions:
          - "Agreement status == ACTIVE (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "Cascade link 1 (direct): every ServiceOrder of this agreement with status == REQUESTED -> CANCELLED"
          - "Cascade link 1 (direct): every Amendment of this agreement with status == PENDING -> SUPERSEDED"
          - "TrackAgreement.version += 1"
      - from: TERMINATED
        to: ABANDONMENT_IN_PROGRESS
        trigger: "POST /agreements/{agreementId}/file-abandonment-notice"
        actor: ShipperFacilityManager
        preconditions:
          - "Agreement status IN {TERMINATED, EXPIRED} (else ERR_AGREEMENT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "abandonment_notice_date := request notice_date; removal_deadline_date := notice_date + removal_period_days"
          - "Cascade link 1: every TrackSegment of this agreement with status == IN_SERVICE -> OUT_OF_SERVICE"
          - "Cascade link 2 (caused by each segment's OUT_OF_SERVICE transition): every StoragePlacement on that segment with status == STORED -> FORCE_RELEASED; released_date := notice_date; days_charged and final_storage_charge_cents computed per storage_charge"
          - "Cascade link 2 (also caused by the segment transition): every ServiceOrder on that segment with status == REQUESTED -> CANCELLED"
          - "Cascade link 3 (caused by each placement's FORCE_RELEASED transition): the placement's segment recomputes accrued_storage_cents = sum of final_storage_charge_cents over placements with status IN {RELEASED, FORCE_RELEASED}, and stored_car_count = count of placements with status STORED"
          - "TrackAgreement.version += 1"
      - from: EXPIRED
        to: ABANDONMENT_IN_PROGRESS
        trigger: "POST /agreements/{agreementId}/file-abandonment-notice"
        actor: ShipperFacilityManager
        preconditions:
          - "Agreement status IN {TERMINATED, EXPIRED} (else ERR_AGREEMENT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "Same cascade chain as TERMINATED -> ABANDONMENT_IN_PROGRESS"
      - from: ABANDONMENT_IN_PROGRESS
        to: CLOSED
        trigger: "POST /agreements/{agreementId}/verify-removal"
        actor: RailroadEngineer
        preconditions:
          - "Agreement status == ABANDONMENT_IN_PROGRESS (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "removal_penalty_cents := max(0, (removal_verified_date - removal_deadline_date) in days) * removal_penalty_per_day_cents (removal_penalty calculation)"
          - "Every TrackSegment of this agreement with status == OUT_OF_SERVICE -> REMOVED"
          - "TrackAgreement.version += 1"

  - entity: Amendment
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /amendments/{amendmentId}/respond with decision=ACCEPT"
        actor: "RailroadContractsManager or ShipperFacilityManager (counter-party only)"
        preconditions:
          - "Amendment status == PENDING (else ERR_AMENDMENT_INVALID_STATE)"
          - "Caller's X-User-Role != amendment.proposed_by_role (else ERR_SAME_PARTY_RESPONSE)"
          - "When caller role is ShipperFacilityManager: caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
          - "Parent agreement status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Apply the amendment's new_* field(s) to the parent agreement (field set pinned by amendment_type)"
          - "TrackAgreement.version += 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /amendments/{amendmentId}/respond with decision=REJECT"
        actor: "RailroadContractsManager or ShipperFacilityManager (counter-party only)"
        preconditions:
          - "Amendment status == PENDING (else ERR_AMENDMENT_INVALID_STATE)"
          - "Caller's X-User-Role != amendment.proposed_by_role (else ERR_SAME_PARTY_RESPONSE)"
          - "When caller role is ShipperFacilityManager: caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects: []
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a new Amendment is created on the same agreement, or the agreement is terminated)"
        actor: system
        preconditions: []
        side_effects: []
      # NOTE on creation: POST /agreements/{agreementId}/amendments creates a PENDING
      # amendment, supersedes any existing PENDING amendment on that agreement, and
      # increments TrackAgreement.version by 1. Guarded by OCC — see concurrency_rules.

  - entity: ConstructionProject
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: SPEC_SUBMITTED
        trigger: "POST /construction-projects/{projectId}/submit-spec"
        actor: ShipperFacilityManager
        preconditions:
          - "Project status IN {DRAFT, SPEC_REJECTED} (else ERR_PROJECT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "spec_revision_no += 1; rail_weight_lb_per_yard / tie_material / ballast_depth_inches overwritten by this submission"
      - from: SPEC_REJECTED
        to: SPEC_SUBMITTED
        trigger: "POST /construction-projects/{projectId}/submit-spec (revision loop)"
        actor: ShipperFacilityManager
        preconditions:
          - "Project status IN {DRAFT, SPEC_REJECTED} (else ERR_PROJECT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "spec_revision_no += 1; spec fields overwritten"
      - from: SPEC_SUBMITTED
        to: SPEC_APPROVED
        trigger: "POST /construction-projects/{projectId}/approve-spec"
        actor: RailroadEngineer
        preconditions:
          - "Project status == SPEC_SUBMITTED (else ERR_PROJECT_INVALID_STATE)"
        side_effects:
          - "shipper_estimated_share_cents := round(estimated_cost_cents * shipper_share_pct / 100, 0) — estimated variant of construction_cost_share, pinned to the current spec_revision_no (version-pinning on approval)"
      - from: SPEC_SUBMITTED
        to: SPEC_REJECTED
        trigger: "POST /construction-projects/{projectId}/reject-spec"
        actor: RailroadEngineer
        preconditions:
          - "Project status == SPEC_SUBMITTED (else ERR_PROJECT_INVALID_STATE)"
        side_effects: []
      - from: SPEC_APPROVED
        to: COMPLETED
        trigger: "POST /construction-projects/{projectId}/complete"
        actor: ShipperFacilityManager
        preconditions:
          - "Project status == SPEC_APPROVED (else ERR_PROJECT_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "actual_cost_cents := request actual_cost_cents"
          - "shipper_final_share_cents := round(actual_cost_cents * shipper_share_pct / 100, 0) — final variant of construction_cost_share"
          - "outstanding_share_cents := shipper_final_share_cents - amount_paid_cents"
      - from: COMPLETED
        to: SETTLED
        trigger: "system (automatic within POST /construction-projects/{projectId}/settle when the payment drives outstanding_share_cents to exactly 0)"
        actor: system
        preconditions:
          - "outstanding_share_cents == 0 after applying the payment"
        side_effects: []

  - entity: TrackSegment
    initial_state: IN_SERVICE
    terminal_states: [REMOVED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /segments/{segmentId}/take-out-of-service (manual maintenance possession of the whole segment)"
        actor: RailroadEngineer
        preconditions:
          - "Segment status == IN_SERVICE (else ERR_SEGMENT_INVALID_STATE)"
          - "Parent agreement status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /segments/{segmentId}/return-to-service"
        actor: RailroadEngineer
        preconditions:
          - "Segment status == OUT_OF_SERVICE (else ERR_SEGMENT_INVALID_STATE)"
          - "Parent agreement status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "safety_suspended == false (else ERR_SEGMENT_SAFETY_SUSPENDED)"
        side_effects: []
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (cascade link 1 of file-abandonment-notice on the parent agreement)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: this segment's StoragePlacement rows with status == STORED -> FORCE_RELEASED (final charge computed as of notice_date)"
          - "Cascade link 2: this segment's ServiceOrder rows with status == REQUESTED -> CANCELLED"
      - from: OUT_OF_SERVICE
        to: REMOVED
        trigger: "system (cascade of verify-removal on the parent agreement)"
        actor: system
        preconditions: []
        side_effects: []
      # safety_suspended is an independent boolean dimension on this entity, flipped by
      # SafetyInspection record-result cascades (see DerailDevice transitions); it does
      # not alter status — parallel-dimension behavior.

  - entity: SafetyInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL]
    transitions:
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system sweep, evaluated on every read of the inspection and on every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical date > due_date"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /inspections/{inspectionId}/record-result with result=PASS"
        actor: SafetyInspector
        preconditions:
          - "Inspection status IN {SCHEDULED, OVERDUE} (else ERR_INSPECTION_INVALID_STATE)"
          - "Every id in cited_device_ids resolves to a DerailDevice whose segment_id == inspection.segment_id (else ERR_CROSS_REFERENCE_MISMATCH)"
        side_effects:
          - "completed_date := request completed_date; result := PASS; cited_device_ids := request list (or [])"
          - "Cascade link 1: every cited DerailDevice with status == NON_COMPLIANT -> INSTALLED (compliance restored)"
          - "Cascade link 2: if no DerailDevice of inspection.segment_id remains NON_COMPLIANT, that segment's safety_suspended := false"
          - "Auto-schedule: create a new SafetyInspection (agreement_id, segment_id copied) with scheduled_date := completed_date + agreement.inspection_cadence_days, status SCHEDULED (inspection_cadence_scheduling calculation)"
      - from: OVERDUE
        to: COMPLETED_PASS
        trigger: "POST /inspections/{inspectionId}/record-result with result=PASS"
        actor: SafetyInspector
        preconditions:
          - "Inspection status IN {SCHEDULED, OVERDUE} (else ERR_INSPECTION_INVALID_STATE)"
          - "cited device referential check as above"
        side_effects:
          - "Same side effects as SCHEDULED -> COMPLETED_PASS"
      - from: SCHEDULED
        to: COMPLETED_FAIL
        trigger: "POST /inspections/{inspectionId}/record-result with result=FAIL"
        actor: SafetyInspector
        preconditions:
          - "Inspection status IN {SCHEDULED, OVERDUE} (else ERR_INSPECTION_INVALID_STATE)"
          - "cited device referential check as above"
        side_effects:
          - "completed_date := request completed_date; result := FAIL; cited_device_ids := request list (or [])"
          - "Cascade link 1: every cited DerailDevice with status == INSTALLED -> NON_COMPLIANT"
          - "Cascade link 2 (caused by link 1): if any DerailDevice of inspection.segment_id is now NON_COMPLIANT, that segment's safety_suspended := true — which gates POST /service-orders and POST /storage-placements on that segment (ERR_SEGMENT_SAFETY_SUSPENDED)"
          - "Auto-schedule: create the next SafetyInspection at completed_date + agreement.inspection_cadence_days"
      - from: OVERDUE
        to: COMPLETED_FAIL
        trigger: "POST /inspections/{inspectionId}/record-result with result=FAIL"
        actor: SafetyInspector
        preconditions:
          - "Inspection status IN {SCHEDULED, OVERDUE} (else ERR_INSPECTION_INVALID_STATE)"
          - "cited device referential check as above"
        side_effects:
          - "Same side effects as SCHEDULED -> COMPLETED_FAIL"

  - entity: DerailDevice
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /derail-devices/{deviceId}/approve"
        actor: RailroadEngineer
        preconditions:
          - "Device status == PROPOSED (else ERR_DEVICE_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: INSTALLED
        trigger: "POST /derail-devices/{deviceId}/mark-installed"
        actor: ShipperFacilityManager
        preconditions:
          - "Device status == APPROVED (else ERR_DEVICE_INVALID_STATE)"
          - "Caller's X-User-ID == the segment's agreement's shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects: []
      - from: INSTALLED
        to: NON_COMPLIANT
        trigger: "system (cascade link 1 of a FAIL record-result citing this device)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: if any DerailDevice of this segment is now NON_COMPLIANT, segment.safety_suspended := true"
      - from: NON_COMPLIANT
        to: INSTALLED
        trigger: "system (cascade link 1 of a PASS record-result citing this device)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: if no DerailDevice of this segment remains NON_COMPLIANT, segment.safety_suspended := false"

  - entity: ServiceOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /service-orders/{orderId}/complete"
        actor: RailroadServiceManager
        preconditions:
          - "Order status == REQUESTED (else ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "cars_spotted / cars_pulled := request values"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (cascade of terminate, or cascade link 2 of file-abandonment-notice via the segment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CarDwell
    initial_state: SPOTTED
    terminal_states: [RELEASED]
    transitions:
      - from: SPOTTED
        to: RELEASED
        trigger: "POST /car-dwells/{dwellId}/release"
        actor: RailroadServiceManager
        preconditions:
          - "Dwell status == SPOTTED (else ERR_DWELL_INVALID_STATE)"
          - "released_at > placed_at (else ERR_INVALID_RELEASE_TIME)"
        side_effects:
          - "released_at := request released_at; final variant of demurrage_charge computed; dwell_minutes, chargeable_days, final_demurrage_cents set; accrued_demurrage_cents frozen"

  - entity: StoragePlacement
    initial_state: STORED
    terminal_states: [RELEASED, FORCE_RELEASED]
    transitions:
      - from: STORED
        to: RELEASED
        trigger: "POST /storage-placements/{placementId}/release"
        actor: ShipperFacilityManager
        preconditions:
          - "Placement status == STORED (else ERR_PLACEMENT_INVALID_STATE)"
          - "Caller's X-User-ID == the segment's agreement's shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
          - "released_date >= placed_date (else ERR_INVALID_REQUEST)"
        side_effects:
          - "released_date / days_charged / final_storage_charge_cents set per storage_charge"
          - "Segment.stored_car_count -= 1 (invariant: equals count of STORED placements)"
          - "Segment.accrued_storage_cents recomputed = sum of final_storage_charge_cents over placements with status IN {RELEASED, FORCE_RELEASED}"
      - from: STORED
        to: FORCE_RELEASED
        trigger: "system (cascade link 2 of file-abandonment-notice, caused by the segment's OUT_OF_SERVICE transition)"
        actor: system
        preconditions: []
        side_effects:
          - "released_date := agreement.abandonment_notice_date; days_charged / final_storage_charge_cents computed per storage_charge"
          - "Cascade link 3: segment.stored_car_count and segment.accrued_storage_cents recomputed"

  - entity: LiabilityClaim
    initial_state: FILED
    terminal_states: [ACCEPTED]
    transitions:
      - from: FILED
        to: APPORTIONED
        trigger: "POST /liability-claims/{claimId}/apportion"
        actor: RailroadContractsManager
        preconditions:
          - "Claim status IN {FILED, DISPUTED} (else ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "shipper_fault_pct := request value, or agreement.shipper_indemnity_default_pct when omitted"
          - "shipper_liability_cents / railroad_liability_cents recomputed per liability_allocation"
      - from: DISPUTED
        to: APPORTIONED
        trigger: "POST /liability-claims/{claimId}/apportion (re-apportionment loop)"
        actor: RailroadContractsManager
        preconditions:
          - "Claim status IN {FILED, DISPUTED} (else ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "Same recompute as FILED -> APPORTIONED"
      - from: APPORTIONED
        to: ACCEPTED
        trigger: "POST /liability-claims/{claimId}/accept"
        actor: ShipperFacilityManager
        preconditions:
          - "Claim status == APPORTIONED (else ERR_CLAIM_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects:
          - "shipper_liability_cents locked (counts toward the agreement's liability cap aggregate from now on)"
      - from: APPORTIONED
        to: DISPUTED
        trigger: "POST /liability-claims/{claimId}/dispute"
        actor: ShipperFacilityManager
        preconditions:
          - "Claim status == APPORTIONED (else ERR_CLAIM_INVALID_STATE)"
          - "Caller's X-User-ID == agreement.shipper_user_id (else ERR_NOT_AGREEMENT_PARTY)"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — only true CREATE-with-supersede races, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-agreement
    parent_entity: TrackAgreement
    write_endpoint: "POST /agreements/{agreementId}/amendments"
    occ_field: expected_agreement_version
    description: |
      Creating an Amendment against a TrackAgreement whose version has advanced
      since the caller last observed it is rejected. This captures the case where
      another writer has just created an amendment (which legitimately supersedes
      the prior PENDING amendment) and the current writer's view of the agreement
      is therefore stale. Stated in OCC terms: expected_agreement_version must
      equal the agreement's current version at write time.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: demurrage_charge
    trigger: "Provisional variant: on every read (GET /car-dwells, GET /car-dwells/{id}) of a CarDwell with status SPOTTED, evaluated against the logical clock. Final variant: on POST /car-dwells/{dwellId}/release, evaluated against released_at."
    algorithm: tiered_pricing
    formula: |
      effective_to = (variant == FINAL) ? released_at : current logical clock timestamp
      total_minutes = floor((effective_to - placed_at) in seconds / 60)
      free_minutes = agreement.free_time_hours * 60
      if car_ownership == PRIVATE: free_minutes = free_minutes * 2
      chargeable_minutes = total_minutes - free_minutes
      if chargeable_minutes <= 0: chargeable_days = 0; amount = 0        # exactly at free time -> 0 (<=, not <)
      else:
        chargeable_days = ceil(chargeable_minutes / 1440)                 # any partial day bills a full day
        tier1_days = min(chargeable_days, TIER1_MAX_DAYS)
        tier2_days = chargeable_days - tier1_days
        amount = tier1_days * agreement.demurrage_base_rate_cents
               + tier2_days * agreement.demurrage_escalated_rate_cents
      # PROVISIONAL writes accrued_demurrage_cents; FINAL writes chargeable_days,
      # dwell_minutes and final_demurrage_cents and freezes accrued_demurrage_cents.
    input_set: "The single CarDwell being read or released, plus its parent TrackAgreement rate/free-time fields. Only status == SPOTTED dwells accrue provisionally; RELEASED dwells return frozen final values."
    constants:
      TIER1_MAX_DAYS: 2
      MINUTES_PER_DAY: 1440
      PRIVATE_CAR_FREE_TIME_MULTIPLIER: 2
    precision: "integer cents; the only division (minutes/1440) is ceilinged to whole days before any multiplication — no fractional-cent rounding occurs"
    variants:
      - name: PROVISIONAL
        when: "CarDwell status == SPOTTED; evaluated on read against the logical clock"
        difference: "Uses the logical clock as the assumed release instant; identical inputs therefore yield a different amount than FINAL whenever the clock is earlier than the actual released_at"
      - name: FINAL
        when: "POST /car-dwells/{dwellId}/release"
        difference: "Uses the actual released_at; supersedes and freezes the provisional accrual"

  - name: storage_charge
    trigger: "Provisional: on read of a StoragePlacement with status STORED (accrued_storage_charge_cents, as of current logical date). Final: on release or force-release (final_storage_charge_cents, days_charged), and then into TrackSegment.accrued_storage_cents."
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round per placement first, THEN sum across placements.
      daily_rate_cents = round_half_up(agreement.storage_rate_per_car_month_cents / 30, 2)
      days_charged = max(1, (effective_release_date - placed_date) in whole days)
      per_car_charge_cents = round_half_up(daily_rate_cents * days_charged, 0)
      # Segment aggregate (derived field on TrackSegment):
      segment.accrued_storage_cents = SUM(per_car_charge_cents) over this segment's
        StoragePlacement rows with status IN {RELEASED, FORCE_RELEASED}
      # The alternative order (sum unrounded per-car amounts, then round once) is
      # NOT permitted: it produces different totals (e.g. rate 10012, 3 days,
      # 5 cars -> pinned order 5005 vs sum-then-round 5006).
    input_set: "Per placement: its own dates and the parent agreement's storage rate. Segment aggregate: placements with status IN {RELEASED, FORCE_RELEASED} only; STORED placements are excluded from the aggregate (their provisional accrual is visible only on the placement itself)."
    constants:
      DAYS_PER_MONTH_DIVISOR: 30
      MINIMUM_DAYS_CHARGED: 1
    precision: "daily rate: 2 decimal places, round_half_up; per-car charge: 0 decimal places, round_half_up; aggregate: integer sum of already-rounded per-car charges"
    variants: []

  - name: construction_cost_share
    trigger: "Estimated variant: on POST /construction-projects/{projectId}/approve-spec. Final variant: on POST /construction-projects/{projectId}/complete. Settlement: on POST /construction-projects/{projectId}/settle."
    algorithm: aggregation
    formula: |
      ESTIMATED (at approve-spec):
        shipper_estimated_share_cents = round_half_up(estimated_cost_cents * shipper_share_pct / 100, 0)
        — pinned to the approved spec_revision_no; resubmission (SPEC_REJECTED loop) leaves the
          previously approved estimate untouched until a NEW approval overwrites it.
      FINAL (at complete):
        shipper_final_share_cents = round_half_up(actual_cost_cents * shipper_share_pct / 100, 0)
        outstanding_share_cents = shipper_final_share_cents - amount_paid_cents
      SETTLE (each call):
        amount_paid_cents += payment_cents            # negative payment_cents = refund correction
        outstanding_share_cents = shipper_final_share_cents - amount_paid_cents
        INVARIANT: amount_paid_cents + outstanding_share_cents == shipper_final_share_cents
        when outstanding_share_cents == 0 exactly: status COMPLETED -> SETTLED (automatic)
    input_set: "The ConstructionProject row and (for the percentage default) the parent TrackAgreement.shipper_cost_share_pct captured at project creation."
    constants: {}
    precision: "0 decimal places, round_half_up at the share computation; settle arithmetic is exact integer cents"
    variants:
      - name: ESTIMATED
        when: "At spec approval; basis is estimated_cost_cents"
        difference: "Identical project yields a different shipper share than FINAL whenever actual_cost_cents != estimated_cost_cents (e.g. 500000 estimate vs 450000 actual at 40% -> 200000 vs 180000)"
      - name: FINAL
        when: "At completion; basis is actual_cost_cents"
        difference: "Supersedes the estimate; the delta (final - estimated) is exactly what remains to reconcile via settle"

  - name: liability_allocation
    trigger: "On POST /liability-claims/{claimId}/apportion (including re-apportionment from DISPUTED)."
    algorithm: threshold
    formula: |
      shipper_fault_pct = request shipper_fault_pct if present else agreement.shipper_indemnity_default_pct
      raw_shipper_share = round_half_up(claim_amount_cents * shipper_fault_pct / 100, 0)
      cap_remaining_cents = agreement.liability_cap_cents
        - SUM(shipper_liability_cents) over this agreement's LiabilityClaim rows
          with status == ACCEPTED                      # FILED / APPORTIONED / DISPUTED rows are EXCLUDED
      shipper_liability_cents = min(raw_shipper_share, cap_remaining_cents)
      railroad_liability_cents = claim_amount_cents - shipper_liability_cents
    input_set: "The claim being apportioned; the parent agreement's liability_cap_cents; the sum over the agreement's ACCEPTED claims only (a claim's own prior APPORTIONED amount is excluded because its status is not ACCEPTED)."
    constants: {}
    precision: "0 decimal places, round_half_up on the raw share before the min() with cap_remaining_cents"
    variants: []

  - name: inspection_cadence_scheduling
    trigger: "On POST /inspections/{inspectionId}/record-result (any result)."
    algorithm: chronological
    formula: |
      next_inspection.scheduled_date = completed_date + agreement.inspection_cadence_days
      next_inspection.due_date       = next_inspection.scheduled_date
      next_inspection.status         = SCHEDULED
      Overdue sweep (separate, system): any inspection with status == SCHEDULED and
      current logical date > due_date transitions to OVERDUE; OVERDUE inspections remain
      completable via record-result.
    input_set: "The just-completed inspection's completed_date and the parent agreement's inspection_cadence_days."
    constants: {}
    precision: "whole ISO days; no time-of-day component"
    variants: []

  - name: removal_penalty
    trigger: "On POST /agreements/{agreementId}/verify-removal."
    algorithm: threshold
    formula: |
      days_late = max(0, (removal_verified_date - removal_deadline_date) in whole days)
      removal_penalty_cents = days_late * agreement.removal_penalty_per_day_cents
      # exactly on the deadline -> 0 (boundary: only strictly-later dates accrue)
    input_set: "The agreement's removal_deadline_date (set at file-abandonment-notice = notice_date + removal_period_days), the request's removal_verified_date, and removal_penalty_per_day_cents."
    constants: {}
    precision: "integer cents; whole days"
    variants: []

  - name: renewal_extension
    trigger: "On POST /agreements/{agreementId}/accept-renewal."
    algorithm: chronological
    formula: |
      term_end_date := term_end_date + renewal_term_months months
      (same day-of-month; e.g. 2027-07-31 with renewal_term_months 12 -> 2028-07-31)
    input_set: "The agreement's current term_end_date and renewal_term_months."
    constants: {}
    precision: "whole ISO dates"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — first matching error wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the five declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Party/ownership and segregation: (a) shipper-side actions require X-User-ID == agreement.shipper_user_id; (b) amendment respond requires X-User-Role != amendment.proposed_by_role"
    error_id: "ERR_NOT_AGREEMENT_PARTY (a) | ERR_SAME_PARTY_RESPONSE (b)"
    http_status: 403
    applies_to: "countersign, accept-renewal, file-abandonment-notice, construction-projects create/submit-spec/complete, derail-devices create/mark-installed, service-orders create, storage-placements create/release, liability-claims accept/dispute, amendments create (shipper role), amendments respond"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK targets (agreement_id, segment_id) exist"
    error_id: "ERR_AGREEMENT_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_SERVICE_ORDER_NOT_FOUND | ERR_CAR_DWELL_NOT_FOUND | ERR_STORAGE_PLACEMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 5
    category: business_constraint
    check: "Request body shape and field-level validity: required fields present; enum members valid; term_end_date > term_start_date; end_hour > start_hour; released_date >= placed_date; percentages within 0-100; non-negative money; amendment new_* field(s) exactly match amendment_type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "Target resource's own status permits the operation (per §1.2 preconditions)"
    error_id: "ERR_AGREEMENT_INVALID_STATE | ERR_AMENDMENT_INVALID_STATE | ERR_PROJECT_INVALID_STATE | ERR_INSPECTION_INVALID_STATE | ERR_DEVICE_INVALID_STATE | ERR_ORDER_INVALID_STATE | ERR_DWELL_INVALID_STATE | ERR_PLACEMENT_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_SEGMENT_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state gates: child creation requires parent agreement status == ACTIVE; amendment respond requires agreement ACTIVE; renewal-offer requires no LiabilityClaim with status IN {FILED, APPORTIONED, DISPUTED}"
    error_id: "ERR_AGREEMENT_NOT_ACTIVE | ERR_OPEN_CLAIMS_BLOCK_RENEWAL"
    http_status: 409
    applies_to: "POST /segments, /construction-projects, /inspections, /derail-devices, /service-orders, /car-dwells, /storage-placements, /liability-claims, /amendments create+respond, /agreements/{id}/renewal-offer"
  - priority: 8
    category: business_safety
    check: "Segment safety gates, checked in this order: (1) segment.status == IN_SERVICE for service-order/storage-placement creation; (2) segment.safety_suspended == false for service-order/storage-placement creation and for return-to-service"
    error_id: "ERR_SEGMENT_OUT_OF_SERVICE | ERR_SEGMENT_SAFETY_SUSPENDED"
    http_status: 409
    applies_to: "POST /service-orders, POST /storage-placements, POST /segments/{id}/return-to-service"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: renewal window (current date <= term_end_date - renewal_notice_days); SWITCHING orders only on days in agreement.service_days_of_week (day-of-week derived from service_date in UTC)"
    error_id: "ERR_RENEWAL_WINDOW_CLOSED | ERR_NOT_A_SERVICE_DAY"
    http_status: 409
    applies_to: "POST /agreements/{id}/renewal-offer, /accept-renewal; POST /service-orders"
  - priority: 10
    category: business_constraint
    check: "Uniqueness / overlap / frequency: one SPOTTED CarDwell per (agreement_id, car_mark); MAINTENANCE_POSSESSION half-open overlap on same segment+service_date; SWITCHING orders vs possessions with 1-hour buffer both directions; per-segment per-date switch count < max_switches_per_day; STORED placements count < storage_capacity_cars"
    error_id: "ERR_CAR_ALREADY_SPOTTED | ERR_POSSESSION_OVERLAP | ERR_POSSESSION_BUFFER_CONFLICT | ERR_SWITCH_LIMIT_EXCEEDED | ERR_STORAGE_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /car-dwells, POST /service-orders, POST /storage-placements"
  - priority: 11
    category: business_referential
    check: "Cross-FK consistency: service-order/inspection segment_id belongs to the body's agreement_id; record-result cited_device_ids all belong to the inspection's segment_id"
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /service-orders, POST /inspections, POST /inspections/{id}/record-result"
  - priority: 12
    category: business_fiscal
    check: "Money checks: settle payment_cents > 0 must not exceed outstanding_share_cents; refund (payment_cents < 0) magnitude must not exceed amount_paid_cents; payment_cents == 0 rejected; claim_amount_cents > 0"
    error_id: "ERR_OVERPAYMENT | ERR_REFUND_EXCEEDS_PAID | ERR_INVALID_REQUEST"
    http_status: 402
    applies_to: "POST /construction-projects/{id}/settle, POST /liability-claims"
  - priority: 13
    category: state
    check: "OCC: amendment create requires expected_agreement_version == agreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /agreements/{agreementId}/amendments"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- TrackAgreement ---
  - method: POST
    path: "/agreements"
    description: "Create a track agreement in DRAFT"
    roles: [RailroadContractsManager]
    code: 201
    input: [shipper_name, shipper_user_id, facility_name, term_start_date, term_end_date, renewal_notice_days, renewal_term_months, shipper_cost_share_pct, liability_cap_cents, shipper_indemnity_default_pct, free_time_hours, demurrage_base_rate_cents, demurrage_escalated_rate_cents, storage_rate_per_car_month_cents, inspection_cadence_days, removal_period_days, removal_penalty_per_day_cents, service_days_of_week, max_switches_per_day]
    output: TrackAgreement
    side_effects: ["status = DRAFT", "removal_penalty_cents = 0"]
  - method: GET
    path: "/agreements"
    description: "List agreements (expiry sweep applied to each returned row)"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrackAgreement[]"
    side_effects: ["system expiry sweep may transition ACTIVE/RENEWAL_OFFERED -> EXPIRED"]
  - method: GET
    path: "/agreements/{agreementId}"
    description: "Get one agreement (expiry sweep applied)"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: TrackAgreement
    side_effects: ["system expiry sweep may transition ACTIVE/RENEWAL_OFFERED -> EXPIRED"]
  - method: POST
    path: "/agreements/{agreementId}/submit"
    description: "Submit draft for countersignature (DRAFT -> PENDING_COUNTERSIGN)"
    roles: [RailroadContractsManager]
    code: 200
    input: []
    output: TrackAgreement
    side_effects: ["increments TrackAgreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/countersign"
    description: "Shipper countersigns (PENDING_COUNTERSIGN -> ACTIVE); caller must be the agreement's shipper party"
    roles: [ShipperFacilityManager]
    code: 200
    input: []
    output: TrackAgreement
    side_effects: ["increments TrackAgreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/renewal-offer"
    description: "Railroad offers renewal (ACTIVE -> RENEWAL_OFFERED); blocked by open claims or a closed renewal window"
    roles: [RailroadContractsManager]
    code: 200
    input: []
    output: TrackAgreement
    side_effects: ["increments TrackAgreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/accept-renewal"
    description: "Shipper accepts renewal (RENEWAL_OFFERED -> ACTIVE, term extended by renewal_term_months)"
    roles: [ShipperFacilityManager]
    code: 200
    input: []
    output: TrackAgreement
    side_effects: ["term_end_date extended per renewal_extension", "increments TrackAgreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/terminate"
    description: "Railroad terminates for cause (ACTIVE -> TERMINATED)"
    roles: [RailroadContractsManager]
    code: 200
    input: ["reason?"]
    output: TrackAgreement
    side_effects: ["REQUESTED ServiceOrders -> CANCELLED", "PENDING Amendments -> SUPERSEDED", "increments TrackAgreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/file-abandonment-notice"
    description: "Shipper files abandonment notice (TERMINATED/EXPIRED -> ABANDONMENT_IN_PROGRESS); fires the 3-link segment/placement/ledger cascade"
    roles: [ShipperFacilityManager]
    code: 200
    input: [notice_date]
    output: TrackAgreement
    side_effects: ["sets abandonment_notice_date and removal_deadline_date", "segments IN_SERVICE -> OUT_OF_SERVICE", "STORED placements -> FORCE_RELEASED with final charge", "REQUESTED orders -> CANCELLED", "segment ledgers recomputed", "increments TrackAgreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/verify-removal"
    description: "Railroad engineer verifies track removal (ABANDONMENT_IN_PROGRESS -> CLOSED); accrues late-removal penalty"
    roles: [RailroadEngineer]
    code: 200
    input: [removal_verified_date]
    output: TrackAgreement
    side_effects: ["removal_penalty_cents computed per removal_penalty", "segments OUT_OF_SERVICE -> REMOVED", "increments TrackAgreement.version by 1"]

  # --- Amendment ---
  - method: POST
    path: "/agreements/{agreementId}/amendments"
    description: "Propose an amendment (OCC-guarded; supersedes any PENDING amendment on this agreement)"
    roles: [RailroadContractsManager, ShipperFacilityManager]
    code: 201
    input: [amendment_type, expected_agreement_version, "new_shipper_cost_share_pct?", "new_liability_cap_cents?", "new_storage_rate_per_car_month_cents?", "new_demurrage_base_rate_cents?", "new_demurrage_escalated_rate_cents?", "new_term_end_date?"]
    output: Amendment
    side_effects: ["existing PENDING Amendment on this agreement -> SUPERSEDED", "increments TrackAgreement.version by 1", "records proposed_by_role / proposed_by_user_id from headers"]
  - method: GET
    path: "/amendments"
    description: "List amendments, optionally by agreement"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: "Amendment[]"
    side_effects: []
  - method: GET
    path: "/amendments/{amendmentId}"
    description: "Get one amendment"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: Amendment
    side_effects: []
  - method: POST
    path: "/amendments/{amendmentId}/respond"
    description: "Counter-party accepts or rejects a PENDING amendment (segregation: responder role != proposer role)"
    roles: [RailroadContractsManager, ShipperFacilityManager]
    code: 200
    input: [decision]
    output: Amendment
    side_effects: ["ACCEPT applies new_* fields to the agreement and increments TrackAgreement.version by 1"]

  # --- ConstructionProject ---
  - method: POST
    path: "/construction-projects"
    description: "Create a construction project in DRAFT"
    roles: [ShipperFacilityManager]
    code: 201
    input: [agreement_id, project_name, estimated_cost_cents, "shipper_share_pct?"]
    output: ConstructionProject
    side_effects: ["shipper_share_pct defaults to agreement.shipper_cost_share_pct", "spec_revision_no = 0", "status = DRAFT"]
  - method: GET
    path: "/construction-projects"
    description: "List construction projects, optionally by agreement"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: "ConstructionProject[]"
    side_effects: []
  - method: GET
    path: "/construction-projects/{projectId}"
    description: "Get one construction project"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: []
  - method: POST
    path: "/construction-projects/{projectId}/submit-spec"
    description: "Submit or resubmit track spec (DRAFT/SPEC_REJECTED -> SPEC_SUBMITTED); bumps spec_revision_no"
    roles: [ShipperFacilityManager]
    code: 200
    input: [rail_weight_lb_per_yard, tie_material, ballast_depth_inches]
    output: ConstructionProject
    side_effects: ["spec_revision_no += 1", "spec fields overwritten"]
  - method: POST
    path: "/construction-projects/{projectId}/approve-spec"
    description: "Railroad engineer approves the pinned spec revision (SPEC_SUBMITTED -> SPEC_APPROVED); computes estimated cost share"
    roles: [RailroadEngineer]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: ["shipper_estimated_share_cents computed per construction_cost_share ESTIMATED variant"]
  - method: POST
    path: "/construction-projects/{projectId}/reject-spec"
    description: "Railroad engineer rejects the spec (SPEC_SUBMITTED -> SPEC_REJECTED)"
    roles: [RailroadEngineer]
    code: 200
    input: [rejection_reason]
    output: ConstructionProject
    side_effects: []
  - method: POST
    path: "/construction-projects/{projectId}/complete"
    description: "Shipper reports completion with actual cost (SPEC_APPROVED -> COMPLETED); computes final cost share"
    roles: [ShipperFacilityManager]
    code: 200
    input: [actual_cost_cents]
    output: ConstructionProject
    side_effects: ["shipper_final_share_cents computed per construction_cost_share FINAL variant", "outstanding_share_cents = final - paid"]
  - method: POST
    path: "/construction-projects/{projectId}/settle"
    description: "Record a cost-share payment (positive) or refund correction (negative); auto-transitions to SETTLED when outstanding hits exactly 0"
    roles: [RailroadContractsManager]
    code: 200
    input: [payment_cents]
    output: ConstructionProject
    side_effects: ["amount_paid_cents += payment_cents", "outstanding_share_cents recomputed", "auto SETTLED when outstanding_share_cents == 0"]

  # --- TrackSegment ---
  - method: POST
    path: "/segments"
    description: "Define a track segment under an ACTIVE agreement"
    roles: [RailroadEngineer]
    code: 201
    input: [agreement_id, segment_name, length_feet, storage_capacity_cars]
    output: TrackSegment
    side_effects: ["status = IN_SERVICE", "stored_car_count = 0", "accrued_storage_cents = 0", "safety_suspended = false"]
  - method: GET
    path: "/segments"
    description: "List segments, optionally by agreement"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: "TrackSegment[]"
    side_effects: []
  - method: GET
    path: "/segments/{segmentId}"
    description: "Get one segment"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: TrackSegment
    side_effects: []
  - method: POST
    path: "/segments/{segmentId}/take-out-of-service"
    description: "Railroad engineer takes a segment out of service for maintenance (IN_SERVICE -> OUT_OF_SERVICE); does not cancel orders or release placements"
    roles: [RailroadEngineer]
    code: 200
    input: []
    output: TrackSegment
    side_effects: []
  - method: POST
    path: "/segments/{segmentId}/return-to-service"
    description: "Railroad engineer returns a segment to service (OUT_OF_SERVICE -> IN_SERVICE); blocked while safety_suspended"
    roles: [RailroadEngineer]
    code: 200
    input: []
    output: TrackSegment
    side_effects: []

  # --- SafetyInspection ---
  - method: POST
    path: "/inspections"
    description: "Schedule a safety inspection on a segment of an ACTIVE agreement"
    roles: [SafetyInspector]
    code: 201
    input: [agreement_id, segment_id, scheduled_date]
    output: SafetyInspection
    side_effects: ["due_date = scheduled_date", "status = SCHEDULED"]
  - method: GET
    path: "/inspections"
    description: "List inspections, optionally by agreement and/or segment (overdue sweep applied)"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "segment_id?", "limit?", "offset?"]
    output: "SafetyInspection[]"
    side_effects: ["system overdue sweep may transition SCHEDULED -> OVERDUE"]
  - method: GET
    path: "/inspections/{inspectionId}"
    description: "Get one inspection (overdue sweep applied)"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: SafetyInspection
    side_effects: ["system overdue sweep may transition SCHEDULED -> OVERDUE"]
  - method: POST
    path: "/inspections/{inspectionId}/record-result"
    description: "Record PASS/FAIL; FAIL citing devices cascades to device NON_COMPLIANT and segment safety_suspended; auto-schedules the next inspection"
    roles: [SafetyInspector]
    code: 200
    input: [result, completed_date, "cited_device_ids?"]
    output: SafetyInspection
    side_effects: ["cited devices INSTALLED <-> NON_COMPLIANT per result", "segment.safety_suspended recomputed", "next SafetyInspection auto-created at completed_date + inspection_cadence_days"]

  # --- DerailDevice ---
  - method: POST
    path: "/derail-devices"
    description: "Propose a derail/safety device on a segment (PROPOSED)"
    roles: [ShipperFacilityManager]
    code: 201
    input: [segment_id, device_type, location_description]
    output: DerailDevice
    side_effects: ["status = PROPOSED"]
  - method: GET
    path: "/derail-devices"
    description: "List derail devices, optionally by segment"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["segment_id?", "limit?", "offset?"]
    output: "DerailDevice[]"
    side_effects: []
  - method: GET
    path: "/derail-devices/{deviceId}"
    description: "Get one derail device"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: DerailDevice
    side_effects: []
  - method: POST
    path: "/derail-devices/{deviceId}/approve"
    description: "Railroad engineer approves installation (PROPOSED -> APPROVED)"
    roles: [RailroadEngineer]
    code: 200
    input: []
    output: DerailDevice
    side_effects: []
  - method: POST
    path: "/derail-devices/{deviceId}/mark-installed"
    description: "Shipper marks device installed (APPROVED -> INSTALLED)"
    roles: [ShipperFacilityManager]
    code: 200
    input: ["installed_date?"]
    output: DerailDevice
    side_effects: []

  # --- ServiceOrder ---
  - method: POST
    path: "/service-orders"
    description: "Request a switching service or maintenance possession window; enforces service days, frequency cap, possession overlap, and buffer rules"
    roles: [ShipperFacilityManager]
    code: 201
    input: [agreement_id, segment_id, order_type, service_date, start_hour, end_hour]
    output: ServiceOrder
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/service-orders"
    description: "List service orders, optionally by agreement, segment, service_date"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "segment_id?", "service_date?", "limit?", "offset?"]
    output: "ServiceOrder[]"
    side_effects: []
  - method: GET
    path: "/service-orders/{orderId}"
    description: "Get one service order"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []
  - method: POST
    path: "/service-orders/{orderId}/complete"
    description: "Railroad service manager records execution (REQUESTED -> COMPLETED)"
    roles: [RailroadServiceManager]
    code: 200
    input: [cars_spotted, cars_pulled]
    output: ServiceOrder
    side_effects: []

  # --- CarDwell ---
  - method: POST
    path: "/car-dwells"
    description: "Record a car placement (SPOTTED); at most one SPOTTED dwell per (agreement, car_mark)"
    roles: [RailroadServiceManager]
    code: 201
    input: [agreement_id, car_mark, car_ownership, placed_at]
    output: CarDwell
    side_effects: ["status = SPOTTED", "accrued_demurrage_cents initialized to 0"]
  - method: GET
    path: "/car-dwells"
    description: "List car dwells, optionally by agreement and/or status; provisional demurrage recomputed for SPOTTED rows"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "CarDwell[]"
    side_effects: ["provisional demurrage recomputed against the logical clock for SPOTTED rows"]
  - method: GET
    path: "/car-dwells/{dwellId}"
    description: "Get one car dwell; provisional demurrage recomputed while SPOTTED"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: CarDwell
    side_effects: ["provisional demurrage recomputed against the logical clock while SPOTTED"]
  - method: POST
    path: "/car-dwells/{dwellId}/release"
    description: "Release a spotted car (SPOTTED -> RELEASED); computes final demurrage"
    roles: [RailroadServiceManager]
    code: 200
    input: [released_at]
    output: CarDwell
    side_effects: ["final demurrage_charge computed", "accrued_demurrage_cents frozen"]

  # --- StoragePlacement ---
  - method: POST
    path: "/storage-placements"
    description: "Place a car into private-track storage (STORED); enforces segment capacity"
    roles: [ShipperFacilityManager]
    code: 201
    input: [segment_id, car_mark, placed_date]
    output: StoragePlacement
    side_effects: ["segment.stored_car_count += 1"]
  - method: GET
    path: "/storage-placements"
    description: "List storage placements, optionally by segment and/or status"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["segment_id?", "status?", "limit?", "offset?"]
    output: "StoragePlacement[]"
    side_effects: ["provisional storage charge recomputed against the logical clock for STORED rows"]
  - method: GET
    path: "/storage-placements/{placementId}"
    description: "Get one storage placement; provisional charge recomputed while STORED"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: StoragePlacement
    side_effects: ["provisional storage charge recomputed against the logical clock while STORED"]
  - method: POST
    path: "/storage-placements/{placementId}/release"
    description: "Release a stored car (STORED -> RELEASED); computes final per-car charge and updates segment ledger"
    roles: [ShipperFacilityManager]
    code: 200
    input: [released_date]
    output: StoragePlacement
    side_effects: ["days_charged and final_storage_charge_cents computed per storage_charge", "segment.stored_car_count -= 1", "segment.accrued_storage_cents recomputed"]

  # --- LiabilityClaim ---
  - method: POST
    path: "/liability-claims"
    description: "File a liability claim against an ACTIVE agreement (FILED)"
    roles: [RailroadContractsManager]
    code: 201
    input: [agreement_id, claimant_name, incident_date, claim_amount_cents]
    output: LiabilityClaim
    side_effects: ["status = FILED"]
  - method: GET
    path: "/liability-claims"
    description: "List liability claims, optionally by agreement and/or status"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "LiabilityClaim[]"
    side_effects: []
  - method: GET
    path: "/liability-claims/{claimId}"
    description: "Get one liability claim"
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: []
  - method: POST
    path: "/liability-claims/{claimId}/apportion"
    description: "Railroad apportions fault (FILED/DISPUTED -> APPORTIONED); pct defaults to agreement.shipper_indemnity_default_pct"
    roles: [RailroadContractsManager]
    code: 200
    input: ["shipper_fault_pct?"]
    output: LiabilityClaim
    side_effects: ["liability_allocation computed (cap = liability_cap_cents minus ACCEPTED-claims sum)"]
  - method: POST
    path: "/liability-claims/{claimId}/accept"
    description: "Shipper accepts the apportionment (APPORTIONED -> ACCEPTED); locks the allocation into the cap aggregate"
    roles: [ShipperFacilityManager]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["shipper_liability_cents now counts toward the agreement's ACCEPTED-claims cap sum"]
  - method: POST
    path: "/liability-claims/{claimId}/dispute"
    description: "Shipper disputes the apportionment (APPORTIONED -> DISPUTED); re-apportionment loops back"
    roles: [ShipperFacilityManager]
    code: 200
    input: ["dispute_reason?"]
    output: LiabilityClaim
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Startup default before any set call is exactly 2026-08-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time. Triggers expiry and overdue sweeps."
    roles: [RailroadContractsManager, ShipperFacilityManager, RailroadEngineer, SafetyInspector, RailroadServiceManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["expiry sweep on agreements", "overdue sweep on inspections"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the five declared roles" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_AGREEMENT_PARTY, http: 403, condition: "Shipper-side action with X-User-ID != agreement.shipper_user_id" }
  - { id: ERR_SAME_PARTY_RESPONSE, http: 403, condition: "Amendment respond attempted by the same role that proposed it" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "No TrackAgreement with the given id" }
  - { id: ERR_AMENDMENT_NOT_FOUND, http: 404, condition: "No Amendment with the given id" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "No ConstructionProject with the given id" }
  - { id: ERR_SEGMENT_NOT_FOUND, http: 404, condition: "No TrackSegment with the given id" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "No SafetyInspection with the given id" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "No DerailDevice with the given id" }
  - { id: ERR_SERVICE_ORDER_NOT_FOUND, http: 404, condition: "No ServiceOrder with the given id" }
  - { id: ERR_CAR_DWELL_NOT_FOUND, http: 404, condition: "No CarDwell with the given id" }
  - { id: ERR_STORAGE_PLACEMENT_NOT_FOUND, http: 404, condition: "No StoragePlacement with the given id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No LiabilityClaim with the given id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, malformed date/datetime, term_end_date <= term_start_date, end_hour <= start_hour, released_date < placed_date, percentage outside 0-100, negative money, or amendment new_* fields not matching amendment_type" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement's own status does not permit the transition" }
  - { id: ERR_AMENDMENT_INVALID_STATE, http: 409, condition: "Amendment not PENDING for respond" }
  - { id: ERR_PROJECT_INVALID_STATE, http: 409, condition: "Project's own status does not permit the transition" }
  - { id: ERR_INSPECTION_INVALID_STATE, http: 409, condition: "Inspection not in SCHEDULED/OVERDUE for record-result" }
  - { id: ERR_DEVICE_INVALID_STATE, http: 409, condition: "Device's own status does not permit the transition" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Service order not REQUESTED for complete" }
  - { id: ERR_DWELL_INVALID_STATE, http: 409, condition: "Car dwell not SPOTTED for release" }
  - { id: ERR_PLACEMENT_INVALID_STATE, http: 409, condition: "Storage placement not STORED for release" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim's own status does not permit the transition" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Child creation or amendment respond requires parent agreement status == ACTIVE" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_RENEWAL, http: 409, condition: "Renewal offer while any claim of the agreement has status IN {FILED, APPORTIONED, DISPUTED}" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Current logical date > term_end_date - renewal_notice_days for renewal-offer or accept-renewal" }
  - { id: ERR_SEGMENT_INVALID_STATE, http: 409, condition: "Segment's own status does not permit the transition (e.g. take-out-of-service from OUT_OF_SERVICE)" }
  - { id: ERR_SEGMENT_OUT_OF_SERVICE, http: 409, condition: "Segment status != IN_SERVICE for service-order or storage-placement creation" }
  - { id: ERR_SEGMENT_SAFETY_SUSPENDED, http: 409, condition: "Segment safety_suspended == true (a cited derail device is NON_COMPLIANT)" }
  - { id: ERR_CAR_ALREADY_SPOTTED, http: 409, condition: "A SPOTTED CarDwell already exists for this (agreement_id, car_mark)" }
  - { id: ERR_NOT_A_SERVICE_DAY, http: 409, condition: "SWITCHING order's service_date day-of-week not in agreement.service_days_of_week" }
  - { id: ERR_SWITCH_LIMIT_EXCEEDED, http: 409, condition: "Non-CANCELLED SWITCHING orders on this segment+service_date already == max_switches_per_day" }
  - { id: ERR_POSSESSION_OVERLAP, http: 409, condition: "MAINTENANCE_POSSESSION window overlaps another possession on same segment+date (half-open [start_hour, end_hour); touching endpoints allowed)" }
  - { id: ERR_POSSESSION_BUFFER_CONFLICT, http: 409, condition: "SWITCHING window intersects a possession expanded by a 1-hour buffer both directions (and vice versa for possession creation vs existing switching orders)" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 409, condition: "STORED placements on segment already == storage_capacity_cars" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "segment_id does not belong to the given agreement_id, or a cited device does not belong to the inspection's segment" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "settle payment_cents > 0 exceeds outstanding_share_cents; or payment_cents == 0" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 402, condition: "settle refund magnitude exceeds amount_paid_cents" }
  - { id: ERR_INVALID_RELEASE_TIME, http: 400, condition: "car-dwell release released_at <= placed_at" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version != agreement.version on amendment create (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: RailroadContractsManager
    description: "Railroad-side contracts officer: owns agreement lifecycle, amendments, claims administration, cost-share settlement"
    identity: opaque
    exclusive_operations:
      - "POST /agreements"
      - "POST /agreements/{id}/submit"
      - "POST /agreements/{id}/renewal-offer"
      - "POST /agreements/{id}/terminate"
      - "POST /liability-claims"
      - "POST /liability-claims/{id}/apportion"
      - "POST /construction-projects/{id}/settle"
    shared_operations:
      - "POST /agreements/{id}/amendments (shared with ShipperFacilityManager)"
      - "POST /amendments/{id}/respond (shared with ShipperFacilityManager, counter-party only)"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "All GET endpoints (shared with all roles)"
  - name: ShipperFacilityManager
    description: "Shipper-side facility manager: countersigns, requests construction/service/storage, installs devices, accepts or disputes claim apportionments; party-bound via agreement.shipper_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /agreements/{id}/countersign"
      - "POST /agreements/{id}/accept-renewal"
      - "POST /agreements/{id}/file-abandonment-notice"
      - "POST /construction-projects"
      - "POST /construction-projects/{id}/submit-spec"
      - "POST /construction-projects/{id}/complete"
      - "POST /derail-devices"
      - "POST /derail-devices/{id}/mark-installed"
      - "POST /service-orders"
      - "POST /storage-placements"
      - "POST /storage-placements/{id}/release"
      - "POST /liability-claims/{id}/accept"
      - "POST /liability-claims/{id}/dispute"
    shared_operations:
      - "POST /agreements/{id}/amendments (shared with RailroadContractsManager)"
      - "POST /amendments/{id}/respond (shared with RailroadContractsManager, counter-party only)"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "All GET endpoints (shared with all roles)"
  - name: RailroadEngineer
    description: "Railroad engineering authority: defines segments, approves/rejects specs, approves derail devices, verifies track removal"
    identity: opaque
    exclusive_operations:
      - "POST /segments"
      - "POST /segments/{id}/take-out-of-service"
      - "POST /segments/{id}/return-to-service"
      - "POST /construction-projects/{id}/approve-spec"
      - "POST /construction-projects/{id}/reject-spec"
      - "POST /derail-devices/{id}/approve"
      - "POST /agreements/{id}/verify-removal"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "All GET endpoints (shared with all roles)"
  - name: SafetyInspector
    description: "Independent safety inspector: schedules inspections and records results"
    identity: opaque
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/record-result"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "All GET endpoints (shared with all roles)"
  - name: RailroadServiceManager
    description: "Railroad operating-side service manager: completes switching orders, records car placements and releases"
    identity: opaque
    exclusive_operations:
      - "POST /service-orders/{id}/complete"
      - "POST /car-dwells"
      - "POST /car-dwells/{id}/release"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "All GET endpoints (shared with all roles)"
