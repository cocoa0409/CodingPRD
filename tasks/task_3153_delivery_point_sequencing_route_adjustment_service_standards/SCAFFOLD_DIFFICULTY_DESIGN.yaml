  - rule_id: boundary_precision_check
    instances:

      - name: vacancy_89_vs_90_days_discontinue_and_deliverability
        grounds:
          - calculations.vacancy_days_and_flip
          - entities.DeliveryPoint.fields.is_deliverable
          - errors.ERR_OVERRUN_BELOW_THRESHOLD
        distinguishing_aspect: |
          Boundary on the vacancy-day metric with split inclusivity:
          vacancy_days == 89 keeps is_deliverable true and rejects discontinue
          (422 ERR_OVERRUN_BELOW_THRESHOLD); exactly one more day,
          vacancy_days == 90, flips is_deliverable to false (>= 90 excludes)
          AND permits discontinue (== 90 qualifies) — the same integer
          threshold is exclusive on one field and inclusive on the other.
