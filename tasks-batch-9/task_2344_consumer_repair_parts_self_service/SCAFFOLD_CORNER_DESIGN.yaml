      - name: rental_kit_publish_without_a_capacity_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PartCatalogItem.transitions[DRAFT -> PUBLISHED].preconditions
          - errors.ERR_INVALID_RANGE
          - endpoints[POST /repair-program/part-catalog-items/{part_id}/publish]
        distinguishing_aspect: |
          A RENTAL_KIT row whose concurrent_rental_capacity was left at its null
          default cannot be published — the guard lives on the transition, not on
          the create, so the DRAFT row exists but never becomes orderable.
        test_recipe:
          setup:
            - "One RENTAL_KIT catalog row created without concurrent_rental_capacity (default null)."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-S201-KIT", part_class: "RENTAL_KIT", safety_class: "UNRESTRICTED", list_price_cents: 0, core_return_required: false, rental_deposit_cents: 5000 }
