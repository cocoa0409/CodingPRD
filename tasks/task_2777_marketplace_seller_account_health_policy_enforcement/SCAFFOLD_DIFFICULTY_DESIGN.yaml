            - "${odr_a} == 0.0100 and ${tier_a} == BREACHING   # exactly AT the threshold breaches because the comparison is >="
            - "${odr_b} == 0.0100 and ${tier_b} == BREACHING   # 20/2010 = 0.0099502 rounds up to the threshold BEFORE the comparison"
            - "${odr_c} == 0.0099 and ${tier_c} == AT_RISK     # 20/2020 = 0.0099010 rounds to just below; only late_shipment_rate is breached"
            - "HealthEvaluation.${ev_a}.breached_metrics == [ORDER_DEFECT_RATE, LATE_SHIPMENT_RATE]"
            - "HealthEvaluation.${ev_c}.breached_metrics == [LATE_SHIPMENT_RATE]"
            - "HealthEvaluation.${ev_a}.late_shipment_rate == 0.0400 and it IS in breached_metrics   # >= threshold"
            - "HealthEvaluation.${ev_a}.valid_tracking_rate == 0.9500 and VALID_TRACKING_RATE is NOT in breached_metrics   # < floor is strict"
            - "HealthEvaluation.${ev_a}.health_score == 100.00 and HealthEvaluation.${ev_b}.health_score == 100.00 and HealthEvaluation.${ev_c}.health_score == 100.00"
            - "HealthEvaluation.${ev_a}.odr_provisional == 0.0100 and HealthEvaluation.${ev_b}.odr_provisional == 0.0095   # 20/2100"
            - "HealthEvaluation.${ev_b}.odr_variant_delta == -0.0005"
            - "HealthEvaluation.${ev_a}.auto_violation_id == null and Seller.${sa_id}.disbursement_state == NORMAL   # empty rule pool, so no cascade noise"
            - "Seller.${sa_id}.metric_tier == BREACHING and Seller.${sc_id}.metric_tier == AT_RISK"

      - name: post_balance_exactly_at_suspend_threshold_suspends
        grounds:
          - "calculations.enforcement_ladder_rung (precision note)"
          - "calculations.severity_points_balance"
          - "calculations.enforcement_state_target"
        distinguishing_aspect: |
          A different metric on a different endpoint: the LADDER_SUSPEND_POINTS boundary on
          POST /enforcement-actions. Two sellers walk identical first actions (8.00) and then
          differ by one cent of severity weight: 8.00 + 4.00 = exactly 12.00 suspends (>=), while
          8.00 + 3.99 = 11.99 stops at LISTING_REMOVAL. The whole downstream posture pair
          (enforcement_state, disbursement_state) flips on that 0.01.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-800 (LISTING_ACCURACY, 8.00, ACCOUNT, requires_poa false), RM-400 (REVIEW_MANIPULATION, 4.00, ACCOUNT, requires_poa false), RM-399 (REVIEW_MANIPULATION, 3.99, ACCOUNT, requires_poa false)."
            - "Sellers A and B, no listings, no snapshots (metric_tier null so no 1.25 multiplier), no credits."
            - "Each seller already carries one action under LA-800: applied 8.00, rung LISTING_REMOVAL, enforcement_state RESTRICTED, disbursement_state RESERVE_HELD."
            - "A second SUBSTANTIATED violation is ready for each seller: A cites RM-400, B cites RM-399. Both are the seller's first REVIEW_MANIPULATION action, so repeat_factor is 1.00."
