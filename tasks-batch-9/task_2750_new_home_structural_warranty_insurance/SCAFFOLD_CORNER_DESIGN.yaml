      - name: the_two_settlement_variants_disagree_on_the_same_claim_row
        claim_type: "Variant Divergence"
        grounds:
          - calculations.claim_net_payable.variants
        distinguishing_aspect: "builder_obligation_settlement and insurer_backed_settlement applied to identical inputs must differ by exactly the deductible the builder arm waives."
        excluded_because:
          difficulty_instance: "claim_net_payable_builder_arm_waives_deductible_insurer_arm_charges_it"
          rationale: "The difficulty instance runs both variants over one identical gross figure and pins the delta to the deductible cent for cent, which is the whole content of the Variant Divergence claim."

      - name: the_class_c_floor_is_inclusive_at_a_risk_score_of_exactly_forty_five
        claim_type: "threshold"
        grounds:
          - calculations.builder_risk_score.formula.banding
        distinguishing_aspect: "A raw score landing exactly on the CLASS_C_FLOOR must be assigned CLASS_C rather than CLASS_B, and the neighbouring score one hundredth below must be CLASS_B."
        excluded_because:
          difficulty_instance: "risk_score_exactly_at_class_c_floor_lands_in_class_c"
          rationale: "That instance already constructs declared inputs that produce exactly 45.00 and its 44.99 neighbour, and follows the band through to the premium base rate; an isolated boundary test asserts a subset."

      - name: per_component_premium_rounding_is_pinned_before_the_sum
        claim_type: "Precision"
        grounds:
          - calculations.policy_premium.rounding
        distinguishing_aspect: "Rounding half-up on each of the three coverage components before the integer sum is not the same as rounding the total, and the declared order must be observable."
        excluded_because:
          difficulty_instance: "policy_premium_per_component_rounding_order_is_pinned"
          rationale: "The difficulty instance selects a purchase price and risk class where the two orders differ by a cent and asserts the per-component figures, so it proves the precision rule at the only price where it is falsifiable."

      - name: the_betterment_tier_is_selected_before_betterment_is_subtracted
        claim_type: "tiered_pricing"
        grounds:
          - calculations.claim_net_payable.formula.betterment
        distinguishing_aspect: "The betterment tier must be chosen from the provisional figure computed before betterment, not from the post-betterment amount, which would otherwise drop the claim into the lower tier."
        excluded_because:
          difficulty_instance: "claim_betterment_tier_selected_before_betterment_is_subtracted"
          rationale: "That instance pins a claim sitting just above the upper betterment floor where the two readings give different tiers and therefore different net payables, which is the tiered-pricing claim in its sharpest form."

