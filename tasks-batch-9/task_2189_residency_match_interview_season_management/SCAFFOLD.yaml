  - name: Applicant
    description: >
      The candidate. Answers invitations, books slots, accepts or declines SOAP offers, signs the
      contract and submits credential documents. Every applicant action is scoped to the
      Applicant row whose id the X-User-ID header carries.
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /interview-invitations/{id}/accept"
      - "POST /interview-invitations/{id}/decline"
      - "POST /interview-invitations/{id}/reschedule"
      - "POST /soap-offers/{id}/accept"
