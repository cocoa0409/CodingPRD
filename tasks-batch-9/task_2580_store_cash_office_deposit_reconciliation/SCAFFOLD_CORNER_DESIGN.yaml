      - name: duplicate_journal_for_the_same_business_date_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=58]
          - state_machines.SalesJournal.null_to_OPEN
          - errors[ERR_DUPLICATE_BUSINESS_DATE]
        distinguishing_aspect: >
          (store_id, business_date) is unique: a second journal for 2026-08-03 at the same store returns
          409 ERR_DUPLICATE_BUSINESS_DATE, while the same date at a different store is accepted.
        test_recipe:
          setup:
            - "Stores S-1941 and S-1942; S-1941 already has a journal for 2026-08-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1941", name: "Store 1941", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_a_id: $.data.id }
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1942", name: "Store 1942", region_code: "EAST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_b_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_a_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_a_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_a_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err: $.data.error_id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_b_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
          assert:
            - "the first call returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_BUSINESS_DATE\""
            - "the second call returns HTTP 201 — uniqueness is scoped to the store, not global"
            - "GET /cash-ops/sales-journals?store_id=${store_a_id}&business_date=2026-08-03 returns total_count == 1"

      - name: post_tenders_twice_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=40]
          - state_machines.SalesJournal.OPEN_to_TENDERS_POSTED
          - errors[ERR_TENDERS_ALREADY_POSTED]
        distinguishing_aspect: >
          POS tender totals are posted once: the second post-tenders call returns 409
          ERR_TENDERS_ALREADY_POSTED and the stored journal_cash_sales_cents stays at the first call's
          100000 rather than being overwritten with 999999.
        test_recipe:
          setup:
            - "Store S-1943 with journal 2026-08-03 whose tenders are already posted at 100000 / 50000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1943", name: "Store 1943", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
