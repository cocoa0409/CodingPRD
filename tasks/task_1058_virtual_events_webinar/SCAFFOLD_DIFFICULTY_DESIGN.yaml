              payload: { name: "Summit I", timezone: "UTC", starts_at: "2026-09-18T09:00:00Z", ends_at: "2026-09-18T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
              as: Organizer
