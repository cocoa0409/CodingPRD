      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Quality Officer One
          staff_role: QUALITY_OFFICER
          npi: '1000000005'
        as: ProgramAdmin
        captures:
          qo_id: $.data.id
      - call: GET /programs/${prog_id}/staff-members
        payload:
          limit: 2
          offset: 0
        as: ProgramAdmin
      - call: GET /programs/${prog_id}/staff-members
        payload:
          limit: 2
          offset: 4
        as: ProgramAdmin
      trigger:
        call: GET /programs/${prog_id}/staff-members
        payload:
          staff_role: EVALUATION_REVIEWER
          limit: 1
          offset: 0
        as: ProgramAdmin
      assert:
      - HTTP 200 with total_count == 2, has_more == true, limit == 1, offset == 0 and exactly 1 element
        in data
      - data[0].staff_role == EVALUATION_REVIEWER
      - the unfiltered read at limit 2 offset 0 returned total_count == 5 with has_more == true and 2
        elements
      - the unfiltered read at limit 2 offset 4 returned total_count == 5 with has_more == false and 1
        element
  - name: chain_segment_junction_reverse_lookups_filter_correctly
    claim_type: graph
    grounds:
    - entities.ChainSegment.fields.donor_candidate_id
    - entities.ChainSegment.fields.recipient_candidate_id
    - entities.ChainSegment.fields.predecessor_segment_id
    - endpoints[GET /chain-segments]
    - complexity_profile.entity_topology
    distinguishing_aspect: ChainSegment is the many-to-many junction between donors and recipients; the
      assertion proves all three of its FK filters (donor, recipient and the SELF-referential predecessor)
      resolve independently on the same two rows.
    test_recipe:
      setup:
      - 'A VALIDATED 2-segment PAIRED_LOOP exists: seg1 is D-001 -> R-002 at position 1 with no predecessor,
        seg2 is D-002 -> R-001 at position 2 with predecessor seg1.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
