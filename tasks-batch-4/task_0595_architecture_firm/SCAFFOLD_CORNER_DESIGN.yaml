              as_user_id: "${pm_id}"
            - call: "PATCH /phases/${sd}"
              payload: { percent_complete: 30 }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /contracts/${ct}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { v2: $.data.version }
          assert:
            - "Contract.${ct}.version == 1 at creation"
            - "Contract.${ct}.version == 2 immediately after DRAFT -> EXECUTED"
            - "Contract.${ct}.version == 3 after the percent_complete PATCH cascade (the phase ACTIVE transition alone does not touch the ledger)"
            - "Contract.${ct}.earned_to_date_cents == 600000 and wip_balance_cents == 600000"

