            - "Job.${job_l}.status == BUILD at approval time"
            - "SubstitutionRequest.${sub_e}.lead_time_delta_days == 27"
            - "SubstitutionRequest.${sub_l}.lead_time_delta_days == 0"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: change_order_pricing_circular_tier_pin_mode_c
        grounds:
          - calculations.change_order_pricing
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Mode (c): the discount tier is keyed on the PRE-discount price_delta_cents
          (pinned evaluation order breaks the would-be circular dependency). An order
          with price_delta_cents == 200000 (T1 tier, floor 0.05) and discount_pct 0.02
          computes computed_delta_cents == 190000 because the 0.05 tier floor overrides
          the smaller requested discount — a post-discount tier lookup (190000 still
          T1) versus a naive effective-rate lookup on the discounted value would agree
          here, but the pinned order is what makes 190000 well-defined; the credit
          case (price_delta -50000 with discount 0.30) passes through undiscounted at
          -50000, proving the clamp branch.
        test_recipe:
          setup:
            - "Job in DESIGN for customer with quoted_price_cents 1000000"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Gamma Metals", site_state_code: "OH" }
              as: ProjectManager
              captures: { cust3_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust3_id}", job_number: "J-3001", quoted_price_cents: 1000000 }
              as: ProjectManager
              captures: { job3_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job3_id}/change-orders"
              payload: { description: "add remote I/O rack", price_delta_cents: 200000, discount_pct: 0.02 }
              as: ProjectManager
              captures: { co_a: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job3_id}/change-orders"
              payload: { description: "de-scope spare pilot devices", price_delta_cents: -50000, discount_pct: 0.30 }
              as: ProjectManager
              captures: { co_b: "$.data.id" }
          trigger:
            - call: "GET /panel-shop/change-orders/${co_a}"
              payload: {}
              as: ProjectManager
            - call: "GET /panel-shop/change-orders/${co_b}"
              payload: {}
              as: ProjectManager
          assert:
            - "ChangeOrder.${co_a}.computed_delta_cents == 190000"
            - "ChangeOrder.${co_b}.computed_delta_cents == -50000"

      - name: startup_labor_waterfall_nested_rounding_mode_b
        grounds:
          - calculations.startup_labor_billing
          - state_machines.StartupSession.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — the OT hourly rate is rounded
          FIRST (round_half_up(18533 * 1.5) == 27800) then multiplied by OT hours.
          A 10-hour weekday completion yields billable_cents == 203864
          (8*18533 + 2*27800); the alternate hour-first order yields 203863 — the
          one-cent divergence proves the pinned order. Weekend multiplier applies to
          the post-waterfall raw amount: the same 10 hours starting Saturday yields
          round_half_up(203864 * 1.25) == 254830.
        test_recipe:
          setup:
            - "Two SHIPPED panels on two jobs, each with a RELEASED site-backed-up program, each with a startup session whose window covers the logical clock"
            - "Session A scheduled_start 2026-10-05T08:00:00Z (Monday); session B scheduled_start 2026-10-10T08:00:00Z (Saturday)"
