              payload: { window_date: "2026-09-02", opens_at: "2026-09-02T00:00:00Z", closes_at: "2026-09-03T00:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"

      - name: segregation_submit_approve_same_user_denied
        claim_type: segregation_of_duties
        grounds:
          - roles
          - validations[priority=6]
          - state_machines.RemediationPlan.SUBMITTED_to_APPROVED
        distinguishing_aspect: "The same FraudAnalyst X-User-ID that submitted a remediation plan cannot approve it: ERR_SEGREGATION_OF_DUTIES; a different analyst approves successfully."
        test_recipe:
          setup: ["Acquirer A ACTIVE; merchant Mc flagged in cycle C (fraud 10000 vs volume 10000000); plan RP created by evaluation; RP submitted by fa-1"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 10000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/fraud-cases"
              payload: { merchant_id: "${mc}", reported_by_member_id: "${m_i}", fraud_amount_cents: 10000 }
              as: FraudAnalyst
              captures: { fc: $.data.id }
            - call: "POST /network/fraud-cases/${fc}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "POST /network/fraud-program-cycles"
              payload: { cycle_label: "CS", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-16T00:00:00Z" }
              as: FraudAnalyst
              captures: { cs: $.data.id }
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/fraud-program-cycles/${cs}/evaluate"
              payload: {}
              as: FraudAnalyst
            - call: "GET /network/fraud-program-cycles/${cs}/remediation-plans"
              payload: {}
              as: FraudAnalyst
              captures:
                rp: "$.data[0].id"
            - call: "POST /network/remediation-plans/${rp}/submit"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          trigger:
            - call: "POST /network/remediation-plans/${rp}/approve"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { err: $.data.error_id }
            - call: "POST /network/remediation-plans/${rp}/approve"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-2"
              captures: { rp_st: $.data.status }
          assert:
            - "Same-user approve -> ERR_SEGREGATION_OF_DUTIES (422)"
            - "Different-user approve succeeds: RemediationPlan.${rp}.status == APPROVED"

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_rule_supersede_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rule-publish-stale-rule]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a superseding rule with expected_rule_version read BEFORE another publication bumped the target rule's version is rejected 412; re-reading and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Rule RA published (v2 after publish); client captured RA version at v1 (right after create, before publish bumped it)"]
          setup_api_calls:
            - call: "POST /network/rules"
              payload:
                rule_code: "R-O1"
                title: "A"
                body: "a"
                region_scope: "GLOBAL"
                effective_from: "2026-09-01T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 100 } ]
              as: RulesAdministrator
              captures: { ra: $.data.id, ra_v_stale: $.data.version }
            - call: "POST /network/rules/${ra}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "GET /network/rules/${ra}"
              payload: {}
              as: RulesAdministrator
              captures: { ra_v_fresh: $.data.version }
          trigger:
            - call: "POST /network/rules"
              payload:
                rule_code: "R-O1"
                title: "B"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-10-01T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 200 } ]
                supersedes_rule_id: "${ra}"
                expected_rule_version: "${ra_v_stale}"
              as: RulesAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /network/rules"
              payload:
                rule_code: "R-O1"
                title: "B"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-10-01T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 200 } ]
                supersedes_rule_id: "${ra}"
                expected_rule_version: "${ra_v_fresh}"
              as: RulesAdministrator
              captures: { rb: $.data.id }
          assert:
            - "Stale expected_rule_version -> ERR_STALE_VERSION (412)"
            - "Retry with fresh version succeeds: NetworkRule.${rb} created in DRAFT"

      - name: occ_program_approve_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[program-approve-stale-program]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Program approval carrying the version captured before the certification-test submission bumped it is rejected 412; the same approval with the post-submission version succeeds."
        test_recipe:
          setup: ["Member M ACTIVE; program G created (v1 captured), test submitted (bumps to v2), test passed"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/programs"
              payload: { name: "G", program_type: "CARD_PRODUCT", product_code: "CC", owner_member_id: "${m1}" }
              as: CertificationEngineer
              captures: { g1: $.data.id, g1_v_stale: $.data.version }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "NEW_PRODUCT" }
              as: CertificationEngineer
              captures: { ct: $.data.id }
            - call: "POST /network/certification-tests/${ct}/pass"
              payload: {}
              as: CertificationEngineer
            - call: "GET /network/programs/${g1}"
              payload: {}
              as: CertificationEngineer
              captures: { g1_v_fresh: $.data.version }
          trigger:
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v_stale}" }
              as: CertificationEngineer
              captures: { err: $.data.error_id }
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v_fresh}" }
              as: CertificationEngineer
              captures: { g_st: $.data.status }
          assert:
            - "Stale expected_program_version -> ERR_STALE_VERSION (412)"
            - "Fresh version approves: Program.${g1}.status == APPROVED"

      - name: duplicate_rule_registration_rejected
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Registering two non-RETIRED rules with identical (rule_code, region_scope, effective_from) is rejected ERR_DUPLICATE (409); changing effective_from makes it acceptable."
        test_recipe:
          setup: ["Rule R1 (R-D1, GLOBAL, 2026-09-10) created"]
          setup_api_calls:
            - call: "POST /network/rules"
              payload:
                rule_code: "R-D1"
                title: "A"
                body: "a"
                region_scope: "GLOBAL"
                effective_from: "2026-09-10T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 100 } ]
              as: RulesAdministrator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /network/rules"
              payload:
                rule_code: "R-D1"
                title: "B"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-09-10T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 200 } ]
              as: RulesAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE (409)"

