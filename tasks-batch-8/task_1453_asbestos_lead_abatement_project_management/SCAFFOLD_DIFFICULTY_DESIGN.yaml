  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_abatement_state_gate_beats_waiting_period
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NOTIFICATION_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the project IS
          ASSESSED but has NO containment (state gate fails: containment must
          be VERIFIED) AND its notification is only FILED (temporal ack gate
          fails); priority 6 must win over priority 8, so the response is
          ERR_INVALID_STATE, not ERR_NOTIFICATION_NOT_ACKNOWLEDGED.
        test_recipe:
          setup:
            - "Project P ASSESSED; notification INITIAL filed (not acknowledged) at default clock 2026-08-01T00:00:00Z; NO containment; clock advanced to 2026-08-11T00:00:00Z (waiting period fully elapsed)"
