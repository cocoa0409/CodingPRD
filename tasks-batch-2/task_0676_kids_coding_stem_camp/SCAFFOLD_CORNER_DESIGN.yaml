scaffold_corner_design:

  # =====================================================================
  # Entities — creation, required fields, defaults, computed/system,
  # type constraints, FK integrity, self-referential
  # =====================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "POST /programs with all required fields returns 201 and a Program whose id, created_at, version=1 are server-minted and whose code/min_age/max_age/drop_in_fee_cents echo the input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Create Coding", code: "CRE10", min_age: 6, max_age: 14, drop_in_fee_cents: 4500 }
              as: CenterAdmin
              captures: { p: $.data.id }
          assert:
            - "response.status == 201"
            - "Program.${p}.version == 1"
            - "Program.${p}.min_age == 6"
            - "Program.${p}.drop_in_fee_cents == 4500"

      - name: create_member_malformed_birth_date_returns_invalid_field
        claim_type: Required Fields
        grounds: [entities.Member.fields.birth_date, "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "POST /members with all required fields present but a malformed birth_date ('not-a-date', not parseable as ISO 8601) returns ERR_INVALID_FIELD (422); no Member row is created."
        test_recipe:
          setup: ["A program with a rank-1 belt and a guardian."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", code: "RF1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M", birth_date: "not-a-date" }
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "response.data.error_id == ERR_INVALID_FIELD"
            - "response.status == 422"

      - name: create_member_defaults_current_belt_to_rank1_computed
        claim_type: Computed Fields
        grounds: [entities.Member.fields.current_belt_level_id, entities.Member.fields.active_badge_count]
        distinguishing_aspect: "On POST /members, current_belt_level_id is auto-set to the program's rank-1 belt (not client-supplied) and active_badge_count initializes to 0."
        test_recipe:
          setup: ["Program with rank-1 belt 'White'; a guardian."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", code: "CF1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 2 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
          assert:
            - "Member.${m1}.current_belt_level_id == ${belt1}"
            - "Member.${m1}.active_badge_count == 0"

      - name: create_program_duplicate_code_returns_invalid_field
        claim_type: Type Constraints
        grounds: [entities.Program.fields.code, "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "Program.code is unique; creating a second Program with an existing code returns ERR_INVALID_FIELD (422)."
        test_recipe:
          setup: ["One program with code DUP1 already exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P1", code: "DUP1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "P2", code: "DUP1", min_age: 4, max_age: 18, drop_in_fee_cents: 5000 }
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_FIELD"
            - "response.status == 422"

      - name: create_session_camp_week_count_one_returns_invalid_field
        claim_type: Type Constraints
        grounds: [entities.Session.fields.week_count, entities.Session.fields.format, "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "week_count must equal 1 unless format==CAMP; creating an AFTER_SCHOOL session with week_count 3 returns ERR_INVALID_FIELD (422)."
        test_recipe:
          setup: ["Center and program exist."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "WC1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 3, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 2 }
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_FIELD"
            - "response.status == 422"

      - name: create_session_ends_before_starts_returns_invalid_field
        claim_type: Type Constraints
        grounds: [entities.Session.fields.starts_at, entities.Session.fields.ends_at, "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "ends_at must be strictly after starts_at; an inverted session interval returns ERR_INVALID_FIELD (422)."
        test_recipe:
          setup: ["Center and program exist."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "EB1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T18:00:00Z", ends_at: "2026-05-01T16:00:00Z", device_seats_requested: 1, assigned_instructor_count: 2 }
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_FIELD"
            - "response.status == 422"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a random non-existent UUID returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "response.status == 404"

      - name: create_belt_level_bad_program_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.BeltLevel.fields.program_id, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /belt-levels with a program_id FK that resolves to no Program returns ERR_RESOURCE_NOT_FOUND (404) — FK integrity on a flat reference."
        test_recipe:
          setup: ["Empty DB (no programs)."]
          setup_api_calls: []
          trigger:
            - call: "POST /belt-levels"
              payload: { program_id: "00000000-0000-4000-8000-000000000001", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "response.status == 404"

      - name: list_members_paginated_envelope
        claim_type: Listing
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "GET /members returns a paginated array envelope with total_count and has_more; with two members and limit=1 the first page has_more==true and total_count==2."
        test_recipe:
          setup: ["One guardian, one program, two members."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", code: "LP1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M2", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
          trigger:
            - call: "GET /members"
              payload: { guardian_id: "${g1}", limit: 1, offset: 0 }
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "response.meta has total_count == 2 and has_more == true"
            - "response.data length == 1"

      - name: belt_level_self_referential_prereq_filter
        claim_type: Parent Relationships
        grounds: [entities.BeltLevel.fields.prereq_belt_level_id]
        distinguishing_aspect: "BeltLevel.prereq_belt_level_id is self-referential: GET /belt-levels?prereq_belt_level_id={belt1} returns the rank-2 belt whose prereq is belt1 (length 1)."
        test_recipe:
          setup: ["Program with rank-1 belt White (no prereq) and rank-2 belt Yellow (prereq White)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", code: "SR1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 1 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "Yellow", rank: 2, prereq_belt_level_id: "${belt1}", required_badge_count: 1 }
              as: CenterAdmin
              captures: { belt2: $.data.id }
          trigger:
            - call: "GET /belt-levels"
              payload: { prereq_belt_level_id: "${belt1}" }
              as: CenterAdmin
          assert:
            - "response.data length == 1"
            - "response.data[0].id == ${belt2}"

  # =====================================================================
  # State Machines — invalid transitions, terminal lockdown, initial,
  # idempotency, compound posture, bubble-up, deadline sweep
  # =====================================================================
  - section: state_machines
    instances:
      - name: open_already_open_session_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Session.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening a session already OPEN returns ERR_INVALID_STATE (409); version does not advance again."
        test_recipe:
          setup: ["Center, program; one OPEN session."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "OO1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 2 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: complete_session_before_end_returns_session_not_ended
        claim_type: precondition_violation
        grounds: [state_machines.Session.OPEN_to_COMPLETED, "errors[ERR_SESSION_NOT_ENDED]"]
        distinguishing_aspect: "Completing a session before the clock reaches ends_at returns ERR_SESSION_NOT_ENDED (409)."
        test_recipe:
          setup: ["OPEN session ending 2026-05-01T18:00:00Z; clock at default 2026-04-01."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "CB1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 2 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_SESSION_NOT_ENDED"
            - "response.status == 409"

      - name: complete_session_marks_reserved_no_show_and_checked_in_attended
        claim_type: side_effect_execution
        grounds: [state_machines.Session.OPEN_to_COMPLETED, state_machines.Enrollment.CHECKED_IN_to_ATTENDED, state_machines.Enrollment.RESERVED_to_NO_SHOW]
        distinguishing_aspect: "On complete after ends_at, a CHECKED_IN enrollment becomes ATTENDED and a still-RESERVED enrollment becomes NO_SHOW with billing_status FORFEITED (was CHARGED)."
        test_recipe:
          setup: ["OPEN session [16:00,18:00); two DROP_IN enrollments; member A checked in after start, member B left RESERVED; clock advanced past ends_at."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "CS1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "A", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mA: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "B", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mB: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { v0: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${mA}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${v0}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { eA: $.data.id }
            - call: "GET /sessions/${s1}"
              payload: {}
              as: CenterAdmin
              captures: { v1: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${mB}", coverage: "DROP_IN", sibling_index: 2, expected_session_version: "${v1}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { eB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:30:00Z" }
              as: CenterAdmin
            - call: "POST /enrollments/${eA}/check-in"
              payload: {}
              as: Instructor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T18:30:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: CenterAdmin
          assert:
            - "Enrollment.${eA}.attendance_status == ATTENDED"
            - "Enrollment.${eB}.attendance_status == NO_SHOW"
            - "Enrollment.${eB}.billing_status == FORFEITED"

      - name: terminal_cancelled_session_cannot_complete
        claim_type: terminal_lockdown
        grounds: [state_machines.Session.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED session is terminal; POST /sessions/{id}/complete on it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT session cancelled (terminal)."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "TC1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 2 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/cancel"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: post_results_with_unscored_accepted_returns_error
        claim_type: precondition_violation
        grounds: [state_machines.Showcase.JUDGING_to_COMPLETED, "errors[ERR_UNSCORED_ENTRIES_REMAIN]"]
        distinguishing_aspect: "post-results while an ACCEPTED entry has not been SCORED returns ERR_UNSCORED_ENTRIES_REMAIN (409)."
        test_recipe:
          setup: ["Showcase OPEN with one ACCEPTED entry; advance past deadline; close-entries -> JUDGING; entry remains ACCEPTED (unscored)."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "PR1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /showcases"
              payload: { center_id: "${c1}", program_id: "${prog}", min_belt_rank: 1, capacity: 5, starts_at: "2026-05-11T09:00:00Z", entry_deadline_at: "2026-05-10T12:00:00Z" }
              as: CenterAdmin
              captures: { sh1: $.data.id }
            - call: "POST /showcases/${sh1}/open"
              payload: {}
              as: CenterAdmin
              captures: { shv0: $.data.version }
            - call: "POST /showcase-entries"
              payload: { showcase_id: "${sh1}", member_id: "${m1}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { entry1: $.data.id }
            - call: "POST /showcase-entries/${entry1}/accept"
              payload: { expected_showcase_version: "${shv0}" }
              as: CenterAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T12:00:01Z" }
              as: CenterAdmin
            - call: "GET /showcases/${sh1}"
              payload: {}
              as: CenterAdmin
              captures: { shv1: $.data.version }
            - call: "POST /showcases/${sh1}/close-entries"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /showcases/${sh1}/post-results"
              payload: {}
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_UNSCORED_ENTRIES_REMAIN"
            - "response.status == 409"

      - name: close_entries_before_deadline_returns_error
        claim_type: precondition_violation
        grounds: [state_machines.Showcase.OPEN_to_JUDGING, "errors[ERR_DEADLINE_NOT_REACHED]"]
        distinguishing_aspect: "close-entries before the clock passes entry_deadline_at returns ERR_DEADLINE_NOT_REACHED (409)."
        test_recipe:
          setup: ["OPEN showcase with entry_deadline_at 2026-05-10T12:00:00Z; clock at default 2026-04-01."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "CD1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /showcases"
              payload: { center_id: "${c1}", program_id: "${prog}", min_belt_rank: 1, capacity: 5, starts_at: "2026-05-11T09:00:00Z", entry_deadline_at: "2026-05-10T12:00:00Z" }
              as: CenterAdmin
              captures: { sh1: $.data.id }
            - call: "POST /showcases/${sh1}/open"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /showcases/${sh1}/close-entries"
