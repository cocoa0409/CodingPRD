              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o1}", crew_id: "${cr_id}", window_start: "2026-06-02T10:00:00Z", window_end: "2026-06-02T12:00:00Z" }
              as: ServiceCoordinator
              captures: { j1: $.data.id }
          trigger:
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o2}", crew_id: "${cr_id}", window_start: "2026-06-02T12:00:00Z", window_end: "2026-06-02T14:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o2}", crew_id: "${cr_id}", window_start: "2026-06-02T12:30:00Z", window_end: "2026-06-02T14:30:00Z" }
              as: ServiceCoordinator
              captures: { j2: $.data.id }
          assert:
            - "First trigger (start == prior end 12:00): error_id == ERR_CREW_WINDOW_CONFLICT (buffer occupation until 12:30)"
            - "Second trigger (start == prior end + 30min == 12:30): succeeds, DeliveryJob.${j2}.status == SCHEDULED"
            - "SalesOrder.${o2}.fulfillment_status == DELIVERY_SCHEDULED"

      - name: technician_closed_interval_shared_endpoint_conflicts
        grounds:
          - validations[priority=8]
          - errors[ERR_TECHNICIAN_WINDOW_CONFLICT]
          - entities.ServiceVisit.fields.window_start
        distinguishing_aspect: |
          Interval semantics B on Technician (different resource): CLOSED intervals — a visit
          10:00-11:00 and a successor starting at 11:00 SHARE the endpoint and therefore conflict
          (whereas delivery half-open+buffer would allow 12:30 and events allow exact adjacency).
          A clean 11:00:01-free design instead uses 11:30 as the safe successor.
        test_recipe:
          setup:
            - "INSTALLED order with STANDARD plan (4 visits); technician Tim; visit1 BOOKED 09:00-10:00"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Cesar Closed", email: "cesar@x.com", customer_type: "INDIVIDUAL" }
