# =============================================================================
# Task 1858 — Supplier Code of Conduct & Social Compliance Audit
# PRD Benchmark scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  1858. Supplier Code of Conduct & Social Compliance Audit (responsible sourcing program): code acknowledgment & risk-based facility scoping, audit scheduling (announced/semi-announced) & auditor assignment, finding classification (zero-tolerance/major/minor) & corrective action plan, remediation verification & re-audit, worker interview & grievance channel, forced labor & recruitment fee review, supplier scorecard & business consequence, industry program mutual recognition

domain_name: supplier-code-conduct-social-compliance
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency      # OCC on Supplier.version for code acknowledgment supersede
    - cascading_side_effects      # ZT finding -> audit fail -> scorecard -> supplier status
    - dual_variant_calculation    # facility risk (baseline vs history) + scorecard (provisional vs verified)
    - rate_threshold_triggers     # consequence tier + risk tier threshold crossings
  entity_topology: flat           # all resources root-level, FK-linked; no nested ownership tree
  state_machine_shape: cyclic     # Audit return-for-correction loop; CAP reject/resubmit + verify-fail loops; Supplier ACTIVE<->PROBATION
  relationship_patterns:
    - one_to_many                 # Supplier->Facility, Facility->Audit (via FK), Audit->Finding
    - self_referential            # CodeAcknowledgment.supersedes_acknowledgment_id
    - cross_aggregate             # CAP -> Finding -> Audit -> Facility -> Supplier ownership chain
  role_model: segregation_of_duties  # verifying auditor must differ from audit auditor; officer reviews vs auditor records
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CodeVersion
    parent: null
    common_fields: true
    fields:
      - { name: version_label, type: string, source: input, description: "Human label, e.g. 'CoC v3.2'" }
      - { name: effective_from, type: datetime, source: input, description: "ISO date the version takes effect" }
      - { name: zero_tolerance_categories, type: array, source: input, description: "Finding category values treated as zero-tolerance under this code version" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | RETIRED", constraints: "enum closure: DRAFT initial; PUBLISHED via transition; RETIRED via transition" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name" }
      - { name: country_code, type: string, source: input, description: "ISO-2 country of headquarters" }
      - { name: sector, type: enum, source: input, description: "APPAREL | ELECTRONICS | FOOD | HARDLINES" }
      - { name: status, type: enum, source: system, default: ONBOARDING, description: "ONBOARDING | ACTIVE | PROBATION | TERMINATED; ONBOARDING->ACTIVE on first acknowledgment; ACTIVE<->PROBATION automatic via scorecard/ZT gating; ->TERMINATED via /terminate" }
      - { name: current_code_version_id, type: string, source: system, description: "FK -> CodeVersion.id; set to the latest acknowledged code version" }
      - { name: provisional_score, type: integer, source: computed, default: 100, description: "Scorecard provisional variant: counts every non-VOIDED finding (closure gives no credit)" }
      - { name: verified_score, type: integer, source: computed, default: 100, description: "Scorecard verified variant: counts only OPEN findings (VERIFIED_CLOSED restores points)" }
      - { name: consequence_tier, type: enum, source: computed, default: PREFERRED, description: "PREFERRED | QUALIFIED | PROBATION_WATCH | SOURCING_EXIT; derived from verified_score" }
      - { name: escalation_penalty_points, type: integer, source: system, default: 0, description: "Sticky penalty accumulated from repeated CAP verification failures (+5 per failure at escalation_count >= 2)" }

  - name: CodeAcknowledgment
    parent: null
    common_fields: false
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; acknowledging supplier (must equal X-User-ID)" }
      - { name: code_version_id, type: string, source: input, description: "FK -> CodeVersion.id; must be PUBLISHED" }
      - { name: signer_name, type: string, source: input, description: "Authorized signatory name" }
      - { name: signer_title, type: string, source: input, description: "Authorized signatory title" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Server logical clock timestamp at creation" }
      - { name: supersedes_acknowledgment_id, type: string, source: system, description: "FK -> CodeAcknowledgment.id; the previously latest acknowledgment of the same supplier (null on first); latest = max acknowledged_at, tie-break max created_at" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; owning supplier (must not be TERMINATED)" }
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: country_code, type: string, source: input, description: "ISO-2 country of the site" }
      - { name: worker_count, type: integer, source: input, description: "Workers on site; drives interview minimum sample", constraints: ">= 1" }
      - { name: processes, type: array, source: input, description: "Production processes on site (free-form strings)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXITED; EXITED via /exit or supplier termination cascade" }
      - { name: risk_score_baseline, type: number, source: computed, description: "Baseline variant of facility_risk_score (country x sector + worker factor), 1 decimal" }
      - { name: risk_score_history, type: number, source: computed, description: "History-adjusted variant of facility_risk_score; null until the facility's first terminal (COMPLETED or FAILED_ZT) audit" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH from the applicable score (history variant once available, else baseline); >= 70 HIGH, >= 40 MEDIUM, else LOW" }
      - { name: next_audit_interval_months, type: integer, source: computed, description: "See next_audit_interval calculation; clamped to [3, 36]" }
      - { name: next_audit_due_date, type: datetime, source: computed, description: "latest terminal audit's scheduled_end + next_audit_interval_months; null when no terminal audit exists" }

  - name: Auditor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Auditor name" }
      - { name: firm_name, type: string, source: input, description: "Audit firm" }
      - { name: certifications, type: array, source: input, description: "Certification labels, e.g. SA8000, SMETA" }
      - { name: country_codes_covered, type: array, source: input, description: "ISO-2 countries the auditor may be assigned to" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; INACTIVE via /deactivate (blocked while open audits assigned)" }

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; audited site" }
      - { name: auditor_id, type: string, source: input, description: "FK -> Auditor.id; assigned lead auditor" }
      - { name: audit_type, type: enum, source: input, description: "INITIAL | ANNUAL | RE_AUDIT | FOLLOW_UP" }
      - { name: announcement, type: enum, source: input, description: "ANNOUNCED (exact dates, span 1-10 days) | SEMI_ANNOUNCED (window, span 14-60 days)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open window start [scheduled_start, scheduled_end); must be >= current logical clock at creation" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open window end (exclusive)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> IN_PROGRESS -> REPORT_SUBMITTED -> COMPLETED; REPORT_SUBMITTED -> IN_PROGRESS (return for correction); IN_PROGRESS -> FAILED_ZT (auto on zero-tolerance finding); SCHEDULED -> CANCELLED; terminal: COMPLETED | FAILED_ZT | CANCELLED" }
      - { name: zt_count, type: integer, source: computed, default: 0, description: "Count of findings on this audit with classification ZERO_TOLERANCE and status != VOIDED" }
      - { name: major_count, type: integer, source: computed, default: 0, description: "Count of non-VOIDED MAJOR findings on this audit" }
      - { name: minor_count, type: integer, source: computed, default: 0, description: "Count of non-VOIDED MINOR findings on this audit" }
      - { name: cancel_reason, type: string, source: input, required: false, description: "Reason captured on cancel" }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> Audit.id; the audit during which the finding was recorded (path parameter)" }
      - { name: classification, type: enum, source: input, description: "ZERO_TOLERANCE | MAJOR | MINOR" }
      - { name: category, type: enum, source: input, description: "FORCED_LABOR | CHILD_LABOR | WORKING_HOURS | WAGES | HEALTH_SAFETY | ENVIRONMENT | HARASSMENT | RECRUITMENT_FEES" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> VERIFIED_CLOSED (auto when its CAP reaches VERIFIED_PASSED) | VOIDED (via /void); terminal: VERIFIED_CLOSED, VOIDED" }
      - { name: remediation_due_date, type: datetime, source: computed, description: "created_at + 30 days (ZERO_TOLERANCE) | + 90 days (MAJOR) | + 180 days (MINOR)" }
      - { name: void_justification, type: string, source: input, required: false, description: "Required (>= 10 chars) when voiding" }

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> Finding.id; finding under remediation (must be OPEN, supplier chain must match caller)" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; derived from finding -> audit -> facility -> supplier" }
      - { name: actions, type: array, source: input, description: "Remediation items [{description, owner, due_date}]; at least one item" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED | REJECTED (review); REJECTED -> SUBMITTED (resubmit); APPROVED -> VERIFICATION_REQUESTED; VERIFICATION_REQUESTED -> VERIFIED_PASSED | VERIFICATION_FAILED (verify); VERIFICATION_FAILED -> VERIFICATION_REQUESTED; terminal: VERIFIED_PASSED" }
      - { name: rejection_reason, type: string, source: system, description: "Captured from review payload when decision == REJECT" }
      - { name: escalation_count, type: integer, source: system, default: 0, description: "Increments on every verify outcome == FAIL" }
      - { name: verified_by_auditor_id, type: string, source: system, description: "Auditor.id from X-User-ID of the successful/last verify call; must differ from the audit's auditor_id (segregation of duties)" }

  - name: Grievance
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; site the grievance concerns" }
      - { name: channel, type: enum, source: input, description: "HOTLINE | WORKER_COMMITTEE | AUDIT_INTERVIEW" }
      - { name: category, type: enum, source: input, description: "WAGES | HARASSMENT | FORCED_LABOR | SAFETY | RECRUITMENT_FEES | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Grievance narrative (stored without reporter identity)" }
      - { name: is_anonymized, type: boolean, source: system, default: true, description: "Always true; reporter identity is never persisted" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> UNDER_REVIEW (triage START_REVIEW); UNDER_REVIEW -> ESCALATED (triage ESCALATE); UNDER_REVIEW | ESCALATED -> RESOLVED (triage RESOLVE); terminal: RESOLVED" }
      - { name: resolution_note, type: string, source: system, description: "Captured from triage payload on RESOLVE" }

  - name: WorkerInterviewRecord
    parent: null
    common_fields: false
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> Audit.id; the audit the interviews belong to (path parameter); exactly one record per audit" }
      - { name: interview_count, type: integer, source: input, description: "Number of workers interviewed; must be >= ceil(sqrt(facility.worker_count))" }
      - { name: forced_labor_indicators, type: boolean, source: input, description: "Whether interviews surfaced forced-labor indicators" }
      - { name: recruitment_fee_indicators, type: boolean, source: input, description: "Whether interviews surfaced recruitment-fee indicators" }
      - { name: notes, type: string, source: input, required: false, description: "Anonymized interviewer notes" }

  - name: RecruitmentFeeReview
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> Audit.id; the audit the review belongs to (path parameter); exactly one review per audit" }
      - { name: workers_assessed, type: integer, source: input, description: "Migrant workers assessed", constraints: ">= 1" }
      - { name: fee_items, type: array, source: input, description: "[{worker_ref, amount_minor_units, currency}]; empty array => no fees found => status CLEARED" }
      - { name: linked_grievance_id, type: string, source: input, required: false, description: "FK -> Grievance.id; optional grievance that triggered the review" }
      - { name: total_reimbursement_cents, type: integer, source: computed, description: "Per-item FX conversion rounded per item then summed (see recruitment_fee_reimbursement_total)" }
      - { name: reimbursed_cents, type: integer, source: computed, default: 0, description: "Sum of Reimbursement.amount_cents with status RECORDED" }
      - { name: outstanding_reimbursement_cents, type: integer, source: computed, description: "= total_reimbursement_cents - reimbursed_cents" }
      - { name: status, type: enum, source: system, description: "PENDING_CONFIRMATION -> VIOLATION_CONFIRMED (confirm-violation) -> REIMBURSED (auto when outstanding == 0); REIMBURSED -> VIOLATION_CONFIRMED (auto when a reimbursement is reversed); CLEARED (auto on create with empty fee_items); terminal: CLEARED | REIMBURSED" }

  - name: Reimbursement
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> RecruitmentFeeReview.id; the review this payment settles (path parameter)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; > 0 and <= outstanding_reimbursement_cents" }
      - { name: worker_ref, type: string, source: input, required: false, description: "Worker reference the payment settles" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED -> REVERSED (via /reverse); terminal: REVERSED" }

  - name: MutualRecognitionClaim
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility covered by the external audit" }
      - { name: program_name, type: enum, source: input, description: "BSCI | SMETA | RBA | WRAP" }
      - { name: external_audit_ref, type: string, source: input, description: "External audit report reference" }
      - { name: external_audit_date, type: datetime, source: input, description: "Date of the external audit; must be within 12 months of the logical clock at decision time" }
      - { name: external_score, type: number, source: input, description: "External audit score; must be >= program minimum at acceptance" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> ACCEPTED | REJECTED (decide); terminal: ACCEPTED | REJECTED" }
      - { name: decision_reason, type: string, source: system, required: false, description: "Captured from decide payload" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CodeVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /code-versions/{id}/transition {to_status: PUBLISHED}"
        actor: SourcingProgramAdmin
        preconditions:
          - "CodeVersion.status == DRAFT (ERR_CODE_VERSION_INVALID_STATE)"
        side_effects: []
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /code-versions/{id}/transition {to_status: RETIRED}"
        actor: SourcingProgramAdmin
        preconditions:
          - "CodeVersion.status == PUBLISHED (ERR_CODE_VERSION_INVALID_STATE)"
        side_effects:
          - "Suppliers already acknowledged keep current_code_version_id unchanged (retirement is not retroactive)"

  - entity: Supplier
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system (automatic on first CodeAcknowledgment creation)"
        actor: system
        preconditions:
          - "Acknowledgment references a PUBLISHED CodeVersion"
        side_effects:
          - "Supplier.current_code_version_id := acknowledged code version"
      - from: ACTIVE
        to: PROBATION
        trigger: "system (automatic on scorecard recompute)"
        actor: system
        preconditions:
          - "verified_score < 60 after recompute, OR any finding with classification ZERO_TOLERANCE and status OPEN exists across the supplier's facilities"
        side_effects: []
      - from: PROBATION
        to: ACTIVE
        trigger: "system (automatic on scorecard recompute)"
        actor: system
        preconditions:
          - "verified_score >= 60 AND no ZERO_TOLERANCE finding with status OPEN exists across the supplier's facilities"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /suppliers/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier.status in {ACTIVE, PROBATION} (ERR_SUPPLIER_ALREADY_TERMINATED)"
        side_effects:
          - "Every Facility of the supplier with status ACTIVE -> EXITED"
          - "Every Audit of those facilities with status in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} -> CANCELLED (conditional cascade: terminal audits untouched)"
          - "Scorecard fields freeze at their last computed values (no further recompute while TERMINATED)"
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /suppliers/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier.status in {ACTIVE, PROBATION} (ERR_SUPPLIER_ALREADY_TERMINATED)"
        side_effects:
          - "Every Facility of the supplier with status ACTIVE -> EXITED"
          - "Every Audit of those facilities with status in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} -> CANCELLED"
          - "Scorecard fields freeze at their last computed values"

  - entity: Facility
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: EXITED
        trigger: "POST /facilities/{id}/exit"
        actor: SourcingProgramAdmin
        preconditions:
          - "No Audit at this facility with status in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} (ERR_AUDIT_ALREADY_OPEN)"
          - "No RecruitmentFeeReview at this facility's audits with status VIOLATION_CONFIRMED and outstanding_reimbursement_cents > 0 (ERR_OUTSTANDING_REIMBURSEMENT)"
        side_effects: []
      - from: ACTIVE
        to: EXITED
        trigger: "system (cascade from Supplier terminate)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Auditor
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /auditors/{id}/deactivate"
        actor: AuditCoordinator
        preconditions:
          - "No Audit with auditor_id == this auditor and status in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} (ERR_AUDITOR_HAS_OPEN_AUDITS)"
        side_effects: []

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED_ZT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audits/{id}/start"
        actor: Auditor
        preconditions:
          - "Audit.status == SCHEDULED (ERR_AUDIT_INVALID_STATE)"
          - "X-User-ID == audit.auditor_id (ERR_OWNERSHIP_VIOLATION)"
          - "current logical clock >= audit.scheduled_start (ERR_AUDIT_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: IN_PROGRESS
        to: REPORT_SUBMITTED
        trigger: "POST /audits/{id}/submit-report"
        actor: Auditor
        preconditions:
          - "Audit.status == IN_PROGRESS (ERR_AUDIT_INVALID_STATE)"
          - "X-User-ID == audit.auditor_id (ERR_OWNERSHIP_VIOLATION)"
          - "Exactly one WorkerInterviewRecord exists for this audit (ERR_INTERVIEW_RECORD_MISSING)"
        side_effects:
          - "Supplier scorecard recompute (provisional + verified variants)"
      - from: REPORT_SUBMITTED
        to: COMPLETED
        trigger: "POST /audits/{id}/decide {decision: COMPLETE}"
        actor: ComplianceOfficer
        preconditions:
          - "Audit.status == REPORT_SUBMITTED (ERR_AUDIT_INVALID_STATE)"
          - "No Grievance at the audit's facility with severity CRITICAL and status in {SUBMITTED, UNDER_REVIEW, ESCALATED} (ERR_CRITICAL_GRIEVANCE_UNRESOLVED)"
        side_effects:
          - "Facility risk: history-adjusted variant activates (first terminal audit) and risk fields recompute"
          - "next_audit_interval_months and next_audit_due_date recompute"
          - "Supplier scorecard recompute"
      - from: REPORT_SUBMITTED
        to: IN_PROGRESS
        trigger: "POST /audits/{id}/decide {decision: RETURN_FOR_CORRECTION}"
        actor: ComplianceOfficer
        preconditions:
          - "Audit.status == REPORT_SUBMITTED (ERR_AUDIT_INVALID_STATE)"
        side_effects:
          - "Report cycle reopens; the existing WorkerInterviewRecord is retained"
        note: "Cyclic loop: IN_PROGRESS -> REPORT_SUBMITTED -> IN_PROGRESS is allowed repeatedly"
      - from: IN_PROGRESS
        to: FAILED_ZT
        trigger: "system (automatic when a Finding with classification ZERO_TOLERANCE is recorded)"
        actor: system
        preconditions:
          - "Finding created with classification ZERO_TOLERANCE while audit IN_PROGRESS"
        side_effects:
          - "Hop 1: Audit.zt_count += 1 (tally recompute)"
          - "Hop 2: Audit.status -> FAILED_ZT (any zero-tolerance finding fails the audit)"
          - "Hop 3: Supplier scorecard recompute (provisional and verified both drop by 40 for the new OPEN ZT finding)"
          - "Hop 4: Supplier.status -> PROBATION if currently ACTIVE (open ZT rule)"
          - "Facility risk fields recompute (FAILED_ZT is a terminal audit, so the history variant activates)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /audits/{id}/cancel"
        actor: AuditCoordinator
        preconditions:
          - "Audit.status == SCHEDULED (ERR_AUDIT_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Supplier terminate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade from Supplier terminate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPORT_SUBMITTED
        to: CANCELLED
        trigger: "system (cascade from Supplier terminate)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Finding
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: VERIFIED_CLOSED
        trigger: "system (automatic when the finding's CorrectiveActionPlan reaches VERIFIED_PASSED)"
        actor: system
        preconditions:
          - "CAP verify outcome == PASS"
        side_effects:
          - "Supplier scorecard recompute (verified variant restores this finding's deduction)"
          - "Supplier PROBATION -> ACTIVE recovery check"
      - from: OPEN
        to: VOIDED
        trigger: "POST /findings/{id}/void"
        actor: Auditor
        preconditions:
          - "Finding.status == OPEN (ERR_FINDING_NOT_OPEN)"
          - "Parent Audit.status in {IN_PROGRESS, REPORT_SUBMITTED, FAILED_ZT} (ERR_AUDIT_INVALID_STATE)"
          - "X-User-ID == audit.auditor_id (ERR_OWNERSHIP_VIOLATION)"
          - "void_justification present with >= 10 characters (ERR_INVALID_REQUEST)"
        side_effects:
          - "Audit tallies recompute (this finding excluded)"
          - "Supplier scorecard recompute (both variants restore the deduction)"
          - "Supplier PROBATION -> ACTIVE recovery check"
          - "Facility risk recompute if parent audit is terminal"

  - entity: CorrectiveActionPlan
    initial_state: SUBMITTED
    terminal_states: [VERIFIED_PASSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /corrective-action-plans/{id}/review {decision: APPROVE}"
        actor: ComplianceOfficer
        preconditions:
          - "CAP.status == SUBMITTED (ERR_CAP_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-action-plans/{id}/review {decision: REJECT}"
        actor: ComplianceOfficer
        preconditions:
          - "CAP.status == SUBMITTED (ERR_CAP_INVALID_STATE)"
          - "rejection_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "CAP.rejection_reason := payload rejection_reason"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/resubmit"
        actor: SupplierContact
        preconditions:
          - "CAP.status == REJECTED (ERR_CAP_INVALID_STATE)"
          - "X-User-ID == cap.supplier_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "CAP.actions := revised payload actions"
        note: "Reject/resubmit cycle may repeat"
      - from: APPROVED
        to: VERIFICATION_REQUESTED
        trigger: "POST /corrective-action-plans/{id}/request-verification"
        actor: SupplierContact
        preconditions:
          - "CAP.status in {APPROVED, VERIFICATION_FAILED} (ERR_CAP_INVALID_STATE)"
          - "X-User-ID == cap.supplier_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: VERIFICATION_FAILED
        to: VERIFICATION_REQUESTED
        trigger: "POST /corrective-action-plans/{id}/request-verification"
        actor: SupplierContact
        preconditions:
          - "CAP.status in {APPROVED, VERIFICATION_FAILED} (ERR_CAP_INVALID_STATE)"
          - "X-User-ID == cap.supplier_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: VERIFICATION_REQUESTED
        to: VERIFIED_PASSED
        trigger: "POST /corrective-action-plans/{id}/verify {outcome: PASS}"
        actor: Auditor
        preconditions:
          - "CAP.status == VERIFICATION_REQUESTED (ERR_CAP_INVALID_STATE)"
          - "X-User-ID identifies an ACTIVE Auditor different from the audit's auditor_id (ERR_VERIFICATION_AUDITOR_CONFLICT)"
        side_effects:
          - "Hop 1: Finding -> VERIFIED_CLOSED"
          - "Hop 2: Supplier scorecard recompute (verified variant restores the finding's deduction)"
          - "Hop 3: Supplier PROBATION -> ACTIVE recovery check"
          - "CAP.verified_by_auditor_id := X-User-ID"
      - from: VERIFICATION_REQUESTED
        to: VERIFICATION_FAILED
        trigger: "POST /corrective-action-plans/{id}/verify {outcome: FAIL}"
        actor: Auditor
        preconditions:
          - "CAP.status == VERIFICATION_REQUESTED (ERR_CAP_INVALID_STATE)"
          - "X-User-ID identifies an ACTIVE Auditor different from the audit's auditor_id (ERR_VERIFICATION_AUDITOR_CONFLICT)"
        side_effects:
          - "Hop 1: CAP.escalation_count += 1"
          - "Hop 2: if escalation_count >= 2 then Supplier.escalation_penalty_points += 5"
          - "Hop 3: Supplier scorecard recompute (penalty flows into both variants)"
          - "Hop 4: Supplier ACTIVE -> PROBATION if verified_score < 60"
          - "CAP.verified_by_auditor_id := X-User-ID"

  - entity: Grievance
    initial_state: SUBMITTED
    terminal_states: [RESOLVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /grievances/{id}/triage {action: START_REVIEW}"
        actor: ComplianceOfficer
        preconditions:
          - "Grievance.status == SUBMITTED (ERR_GRIEVANCE_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /grievances/{id}/triage {action: ESCALATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Grievance.status == UNDER_REVIEW (ERR_GRIEVANCE_INVALID_STATE)"
        side_effects:
          - "Supplier scorecard recompute (an unresolved CRITICAL grievance deducts 5 whether SUBMITTED, UNDER_REVIEW or ESCALATED)"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /grievances/{id}/triage {action: RESOLVE}"
        actor: ComplianceOfficer
        preconditions:
          - "Grievance.status in {UNDER_REVIEW, ESCALATED} (ERR_GRIEVANCE_INVALID_STATE)"
          - "resolution_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "Supplier scorecard recompute (grievance deduction removed)"
          - "Supplier PROBATION -> ACTIVE recovery check"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /grievances/{id}/triage {action: RESOLVE}"
        actor: ComplianceOfficer
        preconditions:
          - "Grievance.status in {UNDER_REVIEW, ESCALATED} (ERR_GRIEVANCE_INVALID_STATE)"
          - "resolution_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "Supplier scorecard recompute (grievance deduction removed)"
          - "Supplier PROBATION -> ACTIVE recovery check"

  - entity: RecruitmentFeeReview
    initial_state: PENDING_CONFIRMATION
    terminal_states: [CLEARED, REIMBURSED]
    transitions:
      - from: PENDING_CONFIRMATION
        to: VIOLATION_CONFIRMED
        trigger: "POST /recruitment-fee-reviews/{id}/confirm-violation"
        actor: ComplianceOfficer
        preconditions:
          - "Review.status == PENDING_CONFIRMATION (ERR_REVIEW_INVALID_STATE)"
          - "If linked_grievance_id is set: that Grievance.status == RESOLVED (ERR_LINKED_GRIEVANCE_UNRESOLVED)"
          - "If linked_grievance_id is set: that grievance's facility_id == review's audit's facility_id (ERR_GRIEVANCE_FACILITY_MISMATCH)"
        side_effects:
          - "outstanding_reimbursement_cents := total_reimbursement_cents"
      - from: VIOLATION_CONFIRMED
        to: REIMBURSED
        trigger: "system (automatic when a recorded reimbursement brings outstanding_reimbursement_cents to 0)"
        actor: system
        preconditions:
          - "outstanding_reimbursement_cents == 0 after the payment"
        side_effects: []
      - from: REIMBURSED
        to: VIOLATION_CONFIRMED
        trigger: "system (automatic when a reimbursement is reversed, raising outstanding above 0)"
        actor: system
        preconditions:
          - "A Reimbursement on this review flips RECORDED -> REVERSED"
        side_effects: []
      - from: PENDING_CONFIRMATION
        to: CLEARED
        trigger: "system (never taken at runtime; CLEARED is assigned at creation when fee_items is empty)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Documented for enum closure: creation with empty fee_items lands directly in CLEARED"

  - entity: Reimbursement
    initial_state: RECORDED
    terminal_states: [REVERSED]
    transitions:
      - from: RECORDED
        to: REVERSED
        trigger: "POST /reimbursements/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "Reimbursement.status == RECORDED (ERR_REIMBURSEMENT_INVALID_STATE)"
        side_effects:
          - "Review.reimbursed_cents -= amount_cents; Review.outstanding_reimbursement_cents += amount_cents"
          - "If Review.status == REIMBURSED: Review -> VIOLATION_CONFIRMED"

  - entity: MutualRecognitionClaim
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mutual-recognition-claims/{id}/decide {decision: ACCEPT}"
        actor: ComplianceOfficer
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
          - "No Finding with classification ZERO_TOLERANCE and status OPEN at the claim's facility (ERR_OPEN_ZT_FINDINGS_EXIST)"
          - "external_score >= PROGRAM_MIN_SCORE[program_name] (ERR_EXTERNAL_SCORE_TOO_LOW)"
          - "external_audit_date within 12 months of the current logical clock (ERR_EXTERNAL_AUDIT_STALE)"
        side_effects:
          - "Facility next_audit_interval_months and next_audit_due_date recompute (validity extension applies)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mutual-recognition-claims/{id}/decide {decision: REJECT}"
        actor: ComplianceOfficer
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "Claim.decision_reason := payload decision_reason"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: acknowledgment-create-stale-supplier
    parent_entity: Supplier
    write_endpoint: "POST /code-acknowledgments"
    occ_field: expected_supplier_version
    description: |
      Creating a CodeAcknowledgment against a Supplier whose version has
      advanced since the client last observed it is rejected. A successful
      acknowledgment legitimately supersedes the supplier's current code
      version (and bumps Supplier.version), so a writer holding a stale
      supplier version must re-read before acknowledging.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: facility_risk_score
    trigger: "facility creation; any audit of the facility reaching a terminal state (COMPLETED or FAILED_ZT); finding voided on a terminal audit"
    algorithm: weighted_scoring
    formula: |
      baseline = COUNTRY_RISK[facility.country_code] * SECTOR_MULT[supplier.sector]
                 + WORKER_FACTOR(facility.worker_count)
      history_component = min(100, 10*zt + 4*major + 1*minor)
          where zt/major/minor count Findings with status != VOIDED on Audits of this
          facility with status in {COMPLETED, FAILED_ZT}
      history = round_half_up(0.5*baseline + 0.5*history_component, 1 decimal)
      risk_score_history is null until the facility's first terminal audit.
      Applicable score = history when risk_score_history is not null, else baseline.
      risk_tier: applicable >= 70 -> HIGH; >= 40 -> MEDIUM; else LOW  (>= semantics).
    input_set: "Facility + owning Supplier.sector; Findings (status != VOIDED) on terminal Audits of the facility"
    constants:
      COUNTRY_RISK: { BD: 60, IN: 55, VN: 50, CN: 40, TR: 35, US: 10 }
      SECTOR_MULT: { APPAREL: 1.2, ELECTRONICS: 1.1, FOOD: 1.0, HARDLINES: 0.9 }
      WORKER_FACTOR_T1_MIN: 1000   # worker_count >= 1000 -> +15
      WORKER_FACTOR_T1: 15
      WORKER_FACTOR_T2_MIN: 300    # 300 <= worker_count < 1000 -> +8
      WORKER_FACTOR_T2: 8
      WORKER_FACTOR_T3: 3          # worker_count < 300 -> +3
      TIER_HIGH_MIN: 70
      TIER_MEDIUM_MIN: 40
    precision: "1 decimal place, round_half_up"
    variants:
      - name: baseline
        when: "No terminal audit exists yet for the facility"
        difference: "Pure country/sector/worker exposure; ignores the facility's own finding history"
      - name: history_adjusted
        when: "At least one audit of the facility is COMPLETED or FAILED_ZT"
        difference: "Blends 50% baseline with 50% finding-history component; identical facility inputs yield a different score than baseline"

  - name: supplier_scorecard_scores
    trigger: "finding created; finding voided; CAP verify PASS or FAIL; grievance created/triaged; audit report submitted; audit completed"
    algorithm: aggregation
    formula: |
      Let findings range over all Findings on all Audits of all Facilities of the supplier.
      open_zt    = count(classification ZERO_TOLERANCE, status OPEN)
      open_major = count(classification MAJOR, status OPEN)
      open_minor = count(classification MINOR, status OPEN)
      live_zt    = count(classification ZERO_TOLERANCE, status != VOIDED)
      live_major = count(classification MAJOR, status != VOIDED)
      live_minor = count(classification MINOR, status != VOIDED)
      open_crit_grievances = count(Grievance at any of the supplier's facilities with
          severity CRITICAL and status in {SUBMITTED, UNDER_REVIEW, ESCALATED})
      provisional_score = max(0, 100 - 40*live_zt - 10*live_major - 3*live_minor
                                 - 5*open_crit_grievances - supplier.escalation_penalty_points)
      verified_score    = max(0, 100 - 40*open_zt - 10*open_major - 3*open_minor
                                 - 5*open_crit_grievances - supplier.escalation_penalty_points)
    input_set: "Findings on non-CANCELLED audits of the supplier's facilities; grievances at those facilities; supplier.escalation_penalty_points"
    precision: "integer points, floor 0"
    variants:
      - name: provisional
        when: "Always computed; the worst-case view shown at report submission time"
        difference: "Counts every non-VOIDED finding regardless of remediation closure — a VERIFIED_CLOSED finding still deducts"
      - name: verified
        when: "Always computed; drives consequence_tier and supplier status gating"
        difference: "Counts only OPEN findings — verification of a CAP restores the finding's points, so identical raw data yields a higher score than provisional once remediation is verified"

  - name: consequence_tier_mapping
    trigger: "every verified_score recompute"
    algorithm: threshold
    formula: |
      verified_score >= 80 -> PREFERRED
      60 <= verified_score <= 79 -> QUALIFIED
      40 <= verified_score <= 59 -> PROBATION_WATCH
      verified_score < 40 -> SOURCING_EXIT
      Boundary semantics are >= on the lower bound of each band.
      Supplier status gating (separate from the tier label):
        ACTIVE -> PROBATION when verified_score < 60 OR any OPEN zero-tolerance finding exists;
        PROBATION -> ACTIVE when verified_score >= 60 AND no OPEN zero-tolerance finding exists.
    input_set: "supplier.verified_score"
    precision: "integer comparison"
    constants:
      TIER_PREFERRED_MIN: 80
      TIER_QUALIFIED_MIN: 60
      TIER_PROBATION_WATCH_MIN: 40

  - name: recruitment_fee_reimbursement_total
    trigger: "RecruitmentFeeReview creation"
    algorithm: aggregation
    formula: |
      For each fee_items[i]:
        converted_cents[i] = round_half_up(amount_minor_units[i] * FX_USD_CENTS_PER_MINOR[currency[i]], 0 decimals)
      total_reimbursement_cents = sum(converted_cents[i])
      PINNED ROUNDING ORDER: round EACH line item to integer USD cents FIRST, then sum.
      (Sum-then-round is the rejected alternative; the two orders diverge, e.g.
       3 items of 300 BDT minor units at 0.0115 -> per-item 3+3+3 = 9, sum-then-round 10.)
      outstanding_reimbursement_cents = total_reimbursement_cents - reimbursed_cents.
    input_set: "fee_items of the review"
    constants:
      FX_USD_CENTS_PER_MINOR: { USD: 1.0, EUR: 1.08, INR: 0.012, BDT: 0.0115 }
    precision: "integer cents; per-item round_half_up to 0 decimals before summation"

  - name: next_audit_interval
    trigger: "facility creation; audit reaches terminal state; mutual recognition claim accepted; clock advance can change claim validity"
    algorithm: tiered_pricing
    formula: |
      interval = TIER_BASE_MONTHS[risk_tier]
      if latest_terminal_audit.status == FAILED_ZT: interval = min(interval, FAILED_ZT_CAP_MONTHS)
      if a MutualRecognitionClaim for the facility has status ACCEPTED and
         external_audit_date >= current_clock - PROGRAM_VALIDITY_MONTHS[program_name] months:
           interval = interval + PROGRAM_VALIDITY_MONTHS[program_name of the valid claim]
           (if several claims are valid, use the one with max external_audit_date, tie-break max created_at)
      interval = clamp(interval, MIN_INTERVAL_MONTHS, MAX_INTERVAL_MONTHS)
      next_audit_due_date = latest_terminal_audit.scheduled_end + interval months
          (null when no terminal audit exists)
      latest_terminal_audit = the audit of this facility with status in {COMPLETED, FAILED_ZT}
          having max scheduled_end; tie-break max created_at.
    input_set: "facility risk_tier; terminal audits of the facility; ACCEPTED claims of the facility within validity"
    constants:
      TIER_BASE_MONTHS: { HIGH: 6, MEDIUM: 12, LOW: 24 }
      FAILED_ZT_CAP_MONTHS: 3
      PROGRAM_VALIDITY_MONTHS: { BSCI: 24, SMETA: 12, RBA: 24, WRAP: 12 }
      PROGRAM_MIN_SCORE: { BSCI: 85, SMETA: 75, RBA: 80, WRAP: 80 }
      MIN_INTERVAL_MONTHS: 3
      MAX_INTERVAL_MONTHS: 36
    precision: "integer months; nested min/clamp evaluation order pinned as written (tier base -> FAILED_ZT cap -> validity extension -> clamp)"

  - name: worker_interview_min_sample
    trigger: "WorkerInterviewRecord creation"
    algorithm: threshold
    formula: |
      min_sample = ceil(sqrt(facility.worker_count))
      interview_count >= min_sample required (ERR_INTERVIEW_SAMPLE_TOO_SMALL otherwise).
      Boundary: worker_count 100 -> exactly 10; 99 and 101 -> 10 and 11 respectively
      (ceil(sqrt(99)) = 10, ceil(sqrt(101)) = 11).
    input_set: "facility.worker_count"
    precision: "integer, ceiling"

  - name: audit_finding_tallies
    trigger: "finding created on the audit; finding voided"
    algorithm: aggregation
    formula: |
      zt_count    = count(Findings of the audit with classification ZERO_TOLERANCE, status != VOIDED)
      major_count = count(Findings of the audit with classification MAJOR, status != VOIDED)
      minor_count = count(Findings of the audit with classification MINOR, status != VOIDED)
      CONSERVED QUANTITY: zt_count + major_count + minor_count ==
        count(Findings of the audit with status != VOIDED) at all times;
        recording a finding and voiding it are the compensating pair.
    input_set: "Findings of the audit with status != VOIDED"
    precision: "integer counts"

  - name: reimbursement_balance
    trigger: "reimbursement recorded; reimbursement reversed; review confirmation"
    algorithm: aggregation
    formula: |
      reimbursed_cents = sum(Reimbursement.amount_cents where review_id == review.id and status == RECORDED)
      outstanding_reimbursement_cents = total_reimbursement_cents - reimbursed_cents
      CONSERVED QUANTITY: total_reimbursement_cents ==
        reimbursed_cents + outstanding_reimbursement_cents at all times;
        recording a payment and reversing it restore the same balance (compensating pair).
    input_set: "Reimbursements of the review with status RECORDED"
    precision: "integer cents"

  - name: remediation_due_date
    trigger: "finding creation"
    algorithm: threshold
    formula: |
      remediation_due_date = finding.created_at + DUE_DAYS[classification] days
      DUE_DAYS: ZERO_TOLERANCE 30, MAJOR 90, MINOR 180.
      Example with default clock 2026-08-01T00:00:00Z: ZT -> 2026-08-31, MAJOR -> 2026-10-30, MINOR -> 2027-01-28.
    input_set: "finding.classification, finding.created_at"
    constants:
      DUE_DAYS: { ZERO_TOLERANCE: 30, MAJOR: 90, MINOR: 180 }
    precision: "day-granularity datetime addition"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request schema: required fields present, types valid, enum values in range, array minimums honored (CAP actions >= 1 item; void_justification >= 10 chars; resolution_note / rejection_reason present when required)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids and body-referenced ids (facility_id, auditor_id, finding_id, code_version_id, linked_grievance_id) must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: auth
    check: "Ownership: SupplierContact X-User-ID must equal the supplier of the target chain (code-acknowledgments, CAP create/resubmit/request-verification, mutual-recognition-claims); Auditor X-User-ID must equal the audit's auditor_id for start/submit-report/findings/worker-interviews/recruitment-fee-reviews/void"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "ownership-scoped mutation endpoints"
  - priority: 6
    category: concurrency
    check: "expected_supplier_version must equal the Supplier's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /code-acknowledgments"
  - priority: 7
    category: state
    check: "State preconditions: code-version transition from-state; acknowledgment requires a PUBLISHED code version (ERR_CODE_VERSION_NOT_PUBLISHED); audit creation requires Supplier.status in {ACTIVE, PROBATION} (ERR_SUPPLIER_NOT_AUDITABLE) and Facility.status == ACTIVE (ERR_FACILITY_NOT_ACTIVE) and Auditor.status == ACTIVE (ERR_AUDITOR_NOT_ACTIVE); supplier terminate requires status in {ACTIVE, PROBATION} (ERR_SUPPLIER_ALREADY_TERMINATED); audit action from-states (ERR_AUDIT_INVALID_STATE); finding OPEN for CAP create/void (ERR_FINDING_NOT_OPEN); CAP from-states (ERR_CAP_INVALID_STATE); grievance from-states (ERR_GRIEVANCE_INVALID_STATE); review from-states (ERR_REVIEW_INVALID_STATE); reimbursement RECORDED for reverse (ERR_REIMBURSEMENT_INVALID_STATE); claim SUBMITTED for decide (ERR_CLAIM_INVALID_STATE)"
    error_id: "ERR_*_INVALID_STATE / ERR_CODE_VERSION_NOT_PUBLISHED / ERR_SUPPLIER_NOT_AUDITABLE / ERR_FACILITY_NOT_ACTIVE / ERR_AUDITOR_NOT_ACTIVE / ERR_SUPPLIER_ALREADY_TERMINATED / ERR_FINDING_NOT_OPEN"
    http_status: 409
    applies_to: "stateful mutation endpoints; within state checks, parent-chain state is evaluated before the target entity's own state (supplier before facility before audit)"
  - priority: 8
    category: business_safety
    check: "Zero-tolerance classification requires category in the supplier's current code version zero_tolerance_categories (ERR_ZT_CATEGORY_NOT_RECOGNIZED); verify auditor must differ from the audit's auditor_id (ERR_VERIFICATION_AUDITOR_CONFLICT); audit completion blocked while a CRITICAL grievance is unresolved at the facility (ERR_CRITICAL_GRIEVANCE_UNRESOLVED); confirm-violation blocked while a linked grievance is not RESOLVED (ERR_LINKED_GRIEVANCE_UNRESOLVED); claim acceptance blocked while an OPEN zero-tolerance finding exists at the facility (ERR_OPEN_ZT_FINDINGS_EXIST)"
    error_id: "ERR_ZT_CATEGORY_NOT_RECOGNIZED / ERR_VERIFICATION_AUDITOR_CONFLICT / ERR_CRITICAL_GRIEVANCE_UNRESOLVED / ERR_LINKED_GRIEVANCE_UNRESOLVED / ERR_OPEN_ZT_FINDINGS_EXIST"
    http_status: 409
    applies_to: "POST /audits/{id}/findings; POST /corrective-action-plans/{id}/verify; POST /audits/{id}/decide; POST /recruitment-fee-reviews/{id}/confirm-violation; POST /mutual-recognition-claims/{id}/decide"
  - priority: 9
    category: business_constraint
    check: "Uniqueness/exclusivity: at most one open Audit per facility (status in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED}) (ERR_AUDIT_ALREADY_OPEN); ANNUAL audit creation blocked while a valid ACCEPTED mutual-recognition claim covers the facility (ERR_COVERED_BY_MUTUAL_RECOGNITION); facility.country_code must be in auditor.country_codes_covered (ERR_AUDITOR_COUNTRY_NOT_COVERED); auditor deactivate blocked while open audits are assigned (ERR_AUDITOR_HAS_OPEN_AUDITS); one WorkerInterviewRecord per audit (ERR_RECORD_ALREADY_EXISTS); one RecruitmentFeeReview per audit (ERR_RECORD_ALREADY_EXISTS); one open CAP per finding (open = status in {SUBMITTED, APPROVED, REJECTED, VERIFICATION_REQUESTED, VERIFICATION_FAILED}) (ERR_CAP_ALREADY_OPEN); claim acceptance requires external_score >= PROGRAM_MIN_SCORE[program_name] (ERR_EXTERNAL_SCORE_TOO_LOW); interview_count >= ceil(sqrt(worker_count)) (ERR_INTERVIEW_SAMPLE_TOO_SMALL); submit-report requires the audit's WorkerInterviewRecord to exist (ERR_INTERVIEW_RECORD_MISSING)"
    error_id: "ERR_AUDIT_ALREADY_OPEN / ERR_COVERED_BY_MUTUAL_RECOGNITION / ERR_AUDITOR_COUNTRY_NOT_COVERED / ERR_AUDITOR_HAS_OPEN_AUDITS / ERR_RECORD_ALREADY_EXISTS / ERR_CAP_ALREADY_OPEN / ERR_EXTERNAL_SCORE_TOO_LOW / ERR_INTERVIEW_SAMPLE_TOO_SMALL / ERR_INTERVIEW_RECORD_MISSING"
    http_status: 409
    applies_to: "creation and lifecycle endpoints listed in the check"
  - priority: 10
    category: business_temporal
    check: "Interval rules: auditor double-booking — new audit's half-open [scheduled_start, scheduled_end) must not intersect any non-CANCELLED audit of the same auditor (conflict iff new.start < existing.end AND new.end > existing.start; touching endpoints allowed) (ERR_AUDITOR_BOOKING_CONFLICT); facility spacing — new audit's scheduled_start must be >= 30 days after the scheduled_end of every non-CANCELLED audit at the same facility (>= allowed at exactly 30 days) (ERR_FACILITY_AUDIT_GAP_VIOLATION); window shape — ANNOUNCED span 1..10 days, SEMI_ANNOUNCED span 14..60 days, scheduled_start >= current clock (ERR_INVALID_AUDIT_WINDOW); audit start requires clock >= scheduled_start (ERR_AUDIT_WINDOW_NOT_OPEN); claim acceptance requires external_audit_date within 12 months of the clock (ERR_EXTERNAL_AUDIT_STALE)"
    error_id: "ERR_AUDITOR_BOOKING_CONFLICT / ERR_FACILITY_AUDIT_GAP_VIOLATION / ERR_INVALID_AUDIT_WINDOW / ERR_AUDIT_WINDOW_NOT_OPEN / ERR_EXTERNAL_AUDIT_STALE"
    http_status: 409
    applies_to: "POST /audits; POST /audits/{id}/start; POST /mutual-recognition-claims/{id}/decide"
  - priority: 11
    category: business_referential
    check: "Cross-entity link consistency evaluated only after safety: a review's linked grievance must belong to the same facility as the review's audit (ERR_GRIEVANCE_FACILITY_MISMATCH)"
    error_id: ERR_GRIEVANCE_FACILITY_MISMATCH
    http_status: 400
    applies_to: "POST /recruitment-fee-reviews/{id}/confirm-violation"
  - priority: 12
    category: business_fiscal
    check: "Reimbursement amount_cents must be > 0 (ERR_INVALID_REQUEST) and <= outstanding_reimbursement_cents (ERR_REIMBURSEMENT_EXCEEDS_OUTSTANDING); facility exit blocked while any VIOLATION_CONFIRMED review at its audits has outstanding_reimbursement_cents > 0 (ERR_OUTSTANDING_REIMBURSEMENT)"
    error_id: "ERR_REIMBURSEMENT_EXCEEDS_OUTSTANDING / ERR_OUTSTANDING_REIMBURSEMENT"
    http_status: 422
    applies_to: "POST /recruitment-fee-reviews/{id}/reimbursements; POST /facilities/{id}/exit"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SourcingProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current_utc := to_iso8601; time-dependent computed reads (claim validity, staleness) evaluate against this clock"]

  # --- Code versions ---
  - method: POST
    path: "/code-versions"
    description: "Create a Code of Conduct version (starts DRAFT)"
    roles: [SourcingProgramAdmin]
    code: 201
    input: [version_label, effective_from, zero_tolerance_categories]
    output: CodeVersion
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/code-versions/{id}"
    description: "Get a code version"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: CodeVersion
    side_effects: []
  - method: POST
    path: "/code-versions/{id}/transition"
    description: "Publish (DRAFT->PUBLISHED) or retire (PUBLISHED->RETIRED) a code version"
    roles: [SourcingProgramAdmin]
    code: 200
    input: [to_status]
    output: CodeVersion
    side_effects: ["state transition per CodeVersion state machine"]

  # --- Suppliers ---
  - method: POST
    path: "/suppliers"
    description: "Register a supplier (starts ONBOARDING, scores 100, tier PREFERRED)"
    roles: [SourcingProgramAdmin]
    code: 201
    input: [legal_name, country_code, sector]
    output: Supplier
    side_effects: ["status = ONBOARDING; provisional_score = verified_score = 100; consequence_tier = PREFERRED; escalation_penalty_points = 0"]
  - method: GET
    path: "/suppliers"
    description: "List suppliers with filters and pagination"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["status?", "consequence_tier?", "current_code_version_id?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []
  - method: GET
    path: "/suppliers/{id}"
    description: "Get a supplier"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: POST
    path: "/suppliers/{id}/terminate"
    description: "Terminate a supplier (sourcing exit); cascades facilities to EXITED and open audits to CANCELLED"
    roles: [ComplianceOfficer]
    code: 200
    input: ["termination_reason?"]
    output: Supplier
    side_effects: ["Supplier -> TERMINATED", "facilities ACTIVE -> EXITED", "audits in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} -> CANCELLED", "scorecard frozen"]
  - method: GET
    path: "/suppliers/{id}/scorecard"
    description: "Computed scorecard read: both score variants, tier, and the live counts feeding them"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: { supplier_id: string, provisional_score: integer, verified_score: integer, consequence_tier: string, escalation_penalty_points: integer, open_zt_count: integer, open_major_count: integer, open_minor_count: integer, unresolved_critical_grievance_count: integer }
    side_effects: []

  # --- Code acknowledgments (OCC on Supplier.version) ---
  - method: POST
    path: "/code-acknowledgments"
    description: "Supplier acknowledges a PUBLISHED code version; supersedes the supplier's previous latest acknowledgment"
    roles: [SupplierContact]
    code: 201
    input: [supplier_id, code_version_id, signer_name, signer_title, expected_supplier_version]
    output: CodeAcknowledgment
    side_effects:
      - "increments Supplier.version by 1"
      - "Supplier.current_code_version_id := code_version_id"
      - "Supplier ONBOARDING -> ACTIVE on first acknowledgment"
      - "supersedes_acknowledgment_id := prior latest acknowledgment of the supplier (max acknowledged_at, tie-break max created_at), null on first"
      - "acknowledged_at := current logical clock"
  - method: GET
    path: "/code-acknowledgments"
    description: "List acknowledgments with filters (FK reverse-reachability for supplier_id, code_version_id, supersedes_acknowledgment_id)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["supplier_id?", "code_version_id?", "supersedes_acknowledgment_id?", "limit?", "offset?"]
    output: "CodeAcknowledgment[]"
    side_effects: []
  - method: GET
    path: "/code-acknowledgments/{id}"
    description: "Get an acknowledgment"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: CodeAcknowledgment
    side_effects: []

  # --- Facilities ---
  - method: POST
    path: "/facilities"
    description: "Register a facility; risk fields computed at creation (baseline variant)"
    roles: [SourcingProgramAdmin]
    code: 201
    input: [supplier_id, name, country_code, worker_count, processes]
    output: Facility
    side_effects: ["risk_score_baseline computed; risk_tier from baseline; next_audit_interval_months = TIER_BASE_MONTHS[risk_tier]; status = ACTIVE", "supplier must not be TERMINATED (ERR_SUPPLIER_ALREADY_TERMINATED)"]
  - method: GET
    path: "/facilities"
    description: "List facilities with filters"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["supplier_id?", "status?", "risk_tier?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []
  - method: GET
    path: "/facilities/{id}"
    description: "Get a facility"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/facilities/{id}/exit"
    description: "Exit a facility from the program"
    roles: [SourcingProgramAdmin]
    code: 200
    input: ["exit_reason?"]
    output: Facility
    side_effects: ["Facility ACTIVE -> EXITED (blocked by open audit or outstanding reimbursement)"]
  - method: GET
    path: "/facilities/{id}/scoping"
    description: "Computed scoping read: risk variant scores, tier, interval, next due date"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # --- Auditors ---
  - method: POST
    path: "/auditors"
    description: "Register an auditor (starts ACTIVE)"
    roles: [AuditCoordinator]
    code: 201
    input: [full_name, firm_name, certifications, country_codes_covered]
    output: Auditor
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/auditors/{id}"
    description: "Get an auditor"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: Auditor
    side_effects: []
  - method: POST
    path: "/auditors/{id}/deactivate"
    description: "Deactivate an auditor (blocked while open audits are assigned)"
    roles: [AuditCoordinator]
    code: 200
    input: []
    output: Auditor
    side_effects: ["Auditor ACTIVE -> INACTIVE"]

  # --- Audits ---
  - method: POST
    path: "/audits"
    description: "Schedule an audit and assign its lead auditor"
    roles: [AuditCoordinator]
    code: 201
    input: [facility_id, auditor_id, audit_type, announcement, scheduled_start, scheduled_end]
    output: Audit
    side_effects: ["status = SCHEDULED; tallies zeroed"]
  - method: GET
    path: "/audits"
    description: "List audits with filters (FK reverse-reachability for facility_id, auditor_id)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["facility_id?", "auditor_id?", "status?", "audit_type?", "limit?", "offset?"]
    output: "Audit[]"
    side_effects: []
  - method: GET
    path: "/audits/{id}"
    description: "Get an audit"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: "/audits/{id}/start"
    description: "Assigned auditor starts the audit (not before scheduled_start)"
    roles: [Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/audits/{id}/submit-report"
    description: "Assigned auditor submits the audit report (requires the worker interview record)"
    roles: [Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["IN_PROGRESS -> REPORT_SUBMITTED", "supplier scorecard recompute"]
  - method: POST
    path: "/audits/{id}/decide"
    description: "Compliance officer accepts the report (COMPLETE) or returns it for correction (RETURN_FOR_CORRECTION reopens IN_PROGRESS)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "correction_note?"]
    output: Audit
    side_effects: ["REPORT_SUBMITTED -> COMPLETED or -> IN_PROGRESS", "on COMPLETED: facility risk history variant activates; interval recompute; scorecard recompute"]
  - method: POST
    path: "/audits/{id}/cancel"
    description: "Cancel a SCHEDULED audit"
    roles: [AuditCoordinator]
    code: 200
    input: ["reason?"]
    output: Audit
    side_effects: ["SCHEDULED -> CANCELLED"]

  # --- Findings ---
  - method: POST
    path: "/audits/{id}/findings"
    description: "Record a finding during an IN_PROGRESS audit; a ZERO_TOLERANCE finding auto-fails the audit"
    roles: [Auditor]
    code: 201
    input: [classification, category, description]
    output: Finding
    side_effects: ["Finding OPEN; remediation_due_date computed", "audit tallies recompute", "on ZERO_TOLERANCE: audit -> FAILED_ZT cascade (tally -> audit fail -> scorecard recompute -> supplier PROBATION; facility risk recompute)", "supplier scorecard recompute"]
  - method: GET
    path: "/audits/{id}/findings"
    description: "List findings of an audit (FK reverse-reachability for Finding.audit_id)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["classification?", "status?", "limit?", "offset?"]
    output: "Finding[]"
    side_effects: []
  - method: GET
    path: "/findings/{id}"
    description: "Get a finding"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: POST
    path: "/findings/{id}/void"
    description: "Assigned auditor voids an erroneous finding (compensating action for tallies and scores)"
    roles: [Auditor]
    code: 200
    input: [void_justification]
    output: Finding
    side_effects: ["Finding OPEN -> VOIDED", "audit tallies recompute", "scorecard recompute", "supplier recovery check", "facility risk recompute if parent audit terminal"]

  # --- Corrective action plans ---
  - method: POST
    path: "/corrective-action-plans"
    description: "Supplier submits a CAP for an OPEN finding"
    roles: [SupplierContact]
    code: 201
    input: [finding_id, actions]
    output: CorrectiveActionPlan
    side_effects: ["status = SUBMITTED; supplier_id derived from finding chain; escalation_count = 0"]
  - method: GET
    path: "/corrective-action-plans"
    description: "List CAPs with filters (FK reverse-reachability for finding_id, supplier_id)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["finding_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    side_effects: []
  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Get a CAP"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: POST
    path: "/corrective-action-plans/{id}/review"
    description: "Compliance officer approves or rejects a SUBMITTED CAP"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: CorrectiveActionPlan
    side_effects: ["SUBMITTED -> APPROVED | REJECTED"]
  - method: POST
    path: "/corrective-action-plans/{id}/resubmit"
    description: "Supplier resubmits a REJECTED CAP with revised actions"
    roles: [SupplierContact]
    code: 200
    input: [actions]
    output: CorrectiveActionPlan
    side_effects: ["REJECTED -> SUBMITTED; actions replaced"]
  - method: POST
    path: "/corrective-action-plans/{id}/request-verification"
    description: "Supplier declares remediation complete and requests verification"
    roles: [SupplierContact]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["APPROVED | VERIFICATION_FAILED -> VERIFICATION_REQUESTED"]
  - method: POST
    path: "/corrective-action-plans/{id}/verify"
    description: "A different auditor (not the audit's lead) verifies remediation; FAIL escalates"
    roles: [Auditor]
    code: 200
    input: [outcome, verification_note]
    output: CorrectiveActionPlan
    side_effects: ["PASS: -> VERIFIED_PASSED, finding -> VERIFIED_CLOSED, scorecard recompute, supplier recovery check", "FAIL: -> VERIFICATION_FAILED, escalation_count += 1, at >= 2 supplier escalation_penalty_points += 5, scorecard recompute, supplier status check"]

  # --- Grievances ---
  - method: POST
    path: "/grievances"
    description: "File an anonymized grievance through the worker hotline channel"
    roles: [WorkerHotline]
    code: 201
    input: [facility_id, channel, category, severity, description]
    output: Grievance
    side_effects: ["status = SUBMITTED; is_anonymized = true", "if severity CRITICAL: supplier scorecard recompute (-5 while unresolved)"]
  - method: GET
    path: "/grievances"
    description: "List grievances (confidential: program staff only)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "status?", "severity?", "category?", "limit?", "offset?"]
    output: "Grievance[]"
    side_effects: []
  - method: GET
    path: "/grievances/{id}"
    description: "Get a grievance (confidential: program staff only)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Grievance
    side_effects: []
  - method: POST
    path: "/grievances/{id}/triage"
    description: "Triage a grievance: START_REVIEW | ESCALATE | RESOLVE"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "resolution_note?"]
    output: Grievance
    side_effects: ["state transition per Grievance machine", "on RESOLVE of a CRITICAL grievance: scorecard recompute (+5 restored)"]
  - method: GET
    path: "/grievances/{id}/recruitment-fee-reviews"
    description: "List recruitment fee reviews linked to this grievance (FK reverse-reachability for RecruitmentFeeReview.linked_grievance_id; 0 or 1 entries)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: "RecruitmentFeeReview[]"
    side_effects: []

  # --- Worker interviews ---
  - method: POST
    path: "/audits/{id}/worker-interviews"
    description: "Record the audit's worker interview sample (exactly one per audit)"
    roles: [Auditor]
    code: 201
    input: [interview_count, forced_labor_indicators, recruitment_fee_indicators, "notes?"]
    output: WorkerInterviewRecord
    side_effects: []
  - method: GET
    path: "/audits/{id}/worker-interviews"
    description: "List the audit's interview record (0 or 1 entries)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: "WorkerInterviewRecord[]"
    side_effects: []

  # --- Recruitment fee reviews & reimbursements ---
  - method: POST
    path: "/audits/{id}/recruitment-fee-reviews"
    description: "Record the forced-labor / recruitment-fee review for an audit (exactly one per audit)"
    roles: [Auditor]
    code: 201
    input: [workers_assessed, fee_items, "linked_grievance_id?"]
    output: RecruitmentFeeReview
    side_effects: ["total_reimbursement_cents computed (per-item rounding then sum)", "status = CLEARED if fee_items empty else PENDING_CONFIRMATION", "outstanding_reimbursement_cents := total_reimbursement_cents"]
  - method: GET
    path: "/audits/{id}/recruitment-fee-reviews"
    description: "List the audit's recruitment fee review (0 or 1 entries)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: "RecruitmentFeeReview[]"
    side_effects: []
  - method: GET
    path: "/recruitment-fee-reviews/{id}"
    description: "Get a recruitment fee review"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: RecruitmentFeeReview
    side_effects: []
  - method: POST
    path: "/recruitment-fee-reviews/{id}/confirm-violation"
    description: "Compliance officer confirms the fee-charging violation (safety gate on linked grievance)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecruitmentFeeReview
    side_effects: ["PENDING_CONFIRMATION -> VIOLATION_CONFIRMED"]
  - method: POST
    path: "/recruitment-fee-reviews/{id}/reimbursements"
    description: "Record a reimbursement payment against a confirmed review"
    roles: [ComplianceOfficer]
    code: 201
    input: [amount_cents, "worker_ref?"]
    output: Reimbursement
    side_effects: ["Reimbursement RECORDED", "review reimbursed/outstanding recompute", "auto REIMBURSED when outstanding hits 0"]
  - method: GET
    path: "/recruitment-fee-reviews/{id}/reimbursements"
    description: "List reimbursements of a review (FK reverse-reachability for Reimbursement.review_id)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Reimbursement[]"
    side_effects: []
  - method: POST
    path: "/reimbursements/{id}/reverse"
    description: "Reverse a recorded reimbursement (compensating action)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Reimbursement
    side_effects: ["RECORDED -> REVERSED", "review reimbursed/outstanding recompute", "review REIMBURSED -> VIOLATION_CONFIRMED if outstanding > 0"]

  # --- Mutual recognition ---
  - method: POST
    path: "/mutual-recognition-claims"
    description: "Supplier submits an industry-program audit for mutual recognition"
    roles: [SupplierContact]
    code: 201
    input: [facility_id, program_name, external_audit_ref, external_audit_date, external_score]
    output: MutualRecognitionClaim
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/mutual-recognition-claims"
    description: "List mutual recognition claims with filters (FK reverse-reachability for facility_id)"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: ["facility_id?", "program_name?", "status?", "limit?", "offset?"]
    output: "MutualRecognitionClaim[]"
    side_effects: []
  - method: GET
    path: "/mutual-recognition-claims/{id}"
    description: "Get a claim"
    roles: [SourcingProgramAdmin, AuditCoordinator, ComplianceOfficer, Auditor, SupplierContact]
    code: 200
    input: []
    output: MutualRecognitionClaim
    side_effects: []
  - method: POST
    path: "/mutual-recognition-claims/{id}/decide"
    description: "Compliance officer accepts or rejects a claim; acceptance extends the facility's audit interval"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_reason?"]
    output: MutualRecognitionClaim
    side_effects: ["SUBMITTED -> ACCEPTED | REJECTED", "on ACCEPTED: facility interval/due-date recompute with program validity extension"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed caller does not own the target chain (supplier mismatch, or auditor not the audit's lead)" }
  # --- Request / existence / concurrency ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum, array minimum violated, or required conditional field absent" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_supplier_version does not match the Supplier's current version (OCC)" }
  # --- Code version / supplier / facility / auditor state ---
  - { id: ERR_CODE_VERSION_INVALID_STATE, http: 409, condition: "Code version transition attempted from a state that does not allow it (publish non-DRAFT, retire non-PUBLISHED)" }
  - { id: ERR_CODE_VERSION_NOT_PUBLISHED, http: 409, condition: "Acknowledgment references a code version that is not PUBLISHED" }
  - { id: ERR_SUPPLIER_NOT_AUDITABLE, http: 409, condition: "Audit creation requires Supplier.status in {ACTIVE, PROBATION}" }
  - { id: ERR_SUPPLIER_ALREADY_TERMINATED, http: 409, condition: "Operation requires a non-TERMINATED supplier (terminate, facility create)" }
  - { id: ERR_FACILITY_NOT_ACTIVE, http: 409, condition: "Audit creation requires Facility.status == ACTIVE" }
  - { id: ERR_AUDITOR_NOT_ACTIVE, http: 409, condition: "Audit assignment requires Auditor.status == ACTIVE" }
  - { id: ERR_AUDITOR_HAS_OPEN_AUDITS, http: 409, condition: "Auditor cannot be deactivated while audits in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} are assigned" }
  # --- Audit scheduling constraints & temporal ---
  - { id: ERR_AUDIT_ALREADY_OPEN, http: 409, condition: "An audit with status in {SCHEDULED, IN_PROGRESS, REPORT_SUBMITTED} already exists at the facility (creation), or facility exit attempted while an open audit exists" }
  - { id: ERR_COVERED_BY_MUTUAL_RECOGNITION, http: 409, condition: "ANNUAL audit blocked: a valid ACCEPTED mutual-recognition claim covers the facility" }
  - { id: ERR_AUDITOR_COUNTRY_NOT_COVERED, http: 422, condition: "facility.country_code is not in the assigned auditor's country_codes_covered" }
  - { id: ERR_AUDITOR_BOOKING_CONFLICT, http: 409, condition: "Half-open [scheduled_start, scheduled_end) intersects another non-CANCELLED audit of the same auditor (touching endpoints allowed)" }
  - { id: ERR_FACILITY_AUDIT_GAP_VIOLATION, http: 409, condition: "New audit starts less than 30 days after the scheduled_end of a non-CANCELLED audit at the same facility" }
  - { id: ERR_INVALID_AUDIT_WINDOW, http: 422, condition: "Window shape invalid: ANNOUNCED span must be 1-10 days, SEMI_ANNOUNCED 14-60 days, scheduled_start >= current clock" }
  - { id: ERR_AUDIT_WINDOW_NOT_OPEN, http: 409, condition: "Audit start attempted before scheduled_start (per the logical clock)" }
  # --- Audit / finding / CAP state ---
  - { id: ERR_AUDIT_INVALID_STATE, http: 409, condition: "Audit action attempted from a non-applicable status (start/submit/decide/cancel/finding-record/interview/review-create)" }
  - { id: ERR_INTERVIEW_RECORD_MISSING, http: 409, condition: "submit-report requires the audit's WorkerInterviewRecord" }
  - { id: ERR_INTERVIEW_SAMPLE_TOO_SMALL, http: 422, condition: "interview_count < ceil(sqrt(facility.worker_count))" }
  - { id: ERR_ZT_CATEGORY_NOT_RECOGNIZED, http: 422, condition: "ZERO_TOLERANCE classification with a category not in the supplier's current code version zero_tolerance_categories" }
  - { id: ERR_CRITICAL_GRIEVANCE_UNRESOLVED, http: 409, condition: "Audit completion blocked by a CRITICAL grievance in {SUBMITTED, UNDER_REVIEW, ESCALATED} at the facility" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "CAP creation or void requires Finding.status == OPEN" }
  - { id: ERR_CAP_ALREADY_OPEN, http: 409, condition: "An open CAP (SUBMITTED, APPROVED, REJECTED, VERIFICATION_REQUESTED, VERIFICATION_FAILED) already exists for the finding" }
  - { id: ERR_CAP_INVALID_STATE, http: 409, condition: "CAP action attempted from a non-applicable status" }
  - { id: ERR_VERIFICATION_AUDITOR_CONFLICT, http: 403, condition: "Verifying auditor must differ from the audit's lead auditor (segregation of duties)" }
  # --- Grievance / review / reimbursement ---
  - { id: ERR_GRIEVANCE_INVALID_STATE, http: 409, condition: "Grievance triage action attempted from a non-applicable status" }
  - { id: ERR_RECORD_ALREADY_EXISTS, http: 409, condition: "The audit already has a WorkerInterviewRecord / RecruitmentFeeReview" }
  - { id: ERR_REVIEW_INVALID_STATE, http: 409, condition: "confirm-violation requires PENDING_CONFIRMATION; reimbursement requires VIOLATION_CONFIRMED" }
  - { id: ERR_LINKED_GRIEVANCE_UNRESOLVED, http: 409, condition: "confirm-violation blocked: linked grievance is not RESOLVED (safety check, outranks facility-match check)" }
  - { id: ERR_GRIEVANCE_FACILITY_MISMATCH, http: 400, condition: "Linked grievance belongs to a different facility than the review's audit" }
  - { id: ERR_OUTSTANDING_REIMBURSEMENT, http: 409, condition: "Facility exit blocked by a VIOLATION_CONFIRMED review with outstanding_reimbursement_cents > 0" }
  - { id: ERR_REIMBURSEMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "amount_cents > outstanding_reimbursement_cents" }
  - { id: ERR_REIMBURSEMENT_INVALID_STATE, http: 409, condition: "Reverse requires Reimbursement.status == RECORDED" }
  # --- Mutual recognition ---
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "decide requires Claim.status == SUBMITTED" }
  - { id: ERR_EXTERNAL_AUDIT_STALE, http: 422, condition: "external_audit_date older than 12 months relative to the logical clock at decision time" }
  - { id: ERR_EXTERNAL_SCORE_TOO_LOW, http: 422, condition: "external_score < PROGRAM_MIN_SCORE[program_name]" }
  - { id: ERR_OPEN_ZT_FINDINGS_EXIST, http: 409, condition: "Claim acceptance blocked by an OPEN zero-tolerance finding at the facility" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SourcingProgramAdmin
    description: "Runs the responsible-sourcing program: code versions, supplier/facility registry, facility exits, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /code-versions; POST /code-versions/{id}/transition"
      - "POST /suppliers; POST /facilities; POST /facilities/{id}/exit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads (all business resources, including grievances)"

  - name: AuditCoordinator
    description: "Schedules audits and manages the auditor pool"
    identity: opaque
    exclusive_operations:
      - "POST /auditors; POST /auditors/{id}/deactivate"
      - "POST /audits; POST /audits/{id}/cancel"
    shared_operations:
      - "GET reads (all business resources, including grievances)"

  - name: Auditor
    description: "Conducts assigned audits: start, findings, interviews, fee review, report; verifies CAPs of audits led by other auditors"
    identity: "entity_backed:Auditor"
    exclusive_operations:
      - "POST /audits/{id}/start; POST /audits/{id}/submit-report"
      - "POST /audits/{id}/findings; POST /findings/{id}/void"
      - "POST /audits/{id}/worker-interviews; POST /audits/{id}/recruitment-fee-reviews"
      - "POST /corrective-action-plans/{id}/verify"
    shared_operations:
      - "GET reads (except grievances)"

  - name: SupplierContact
    description: "Supplier-side contact: acknowledges code versions, submits CAPs, files mutual-recognition claims"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /code-acknowledgments"
      - "POST /corrective-action-plans; POST /corrective-action-plans/{id}/resubmit; POST /corrective-action-plans/{id}/request-verification"
      - "POST /mutual-recognition-claims"
    shared_operations:
      - "GET reads (except grievances)"

  - name: ComplianceOfficer
    description: "Independent compliance authority: audit report decisions, CAP review, grievance triage, violation confirmation, reimbursements, claim decisions, supplier termination"
    identity: opaque
    exclusive_operations:
      - "POST /suppliers/{id}/terminate"
      - "POST /audits/{id}/decide"
      - "POST /corrective-action-plans/{id}/review"
      - "POST /grievances/{id}/triage"
      - "POST /recruitment-fee-reviews/{id}/confirm-violation; POST /recruitment-fee-reviews/{id}/reimbursements; POST /reimbursements/{id}/reverse"
      - "POST /mutual-recognition-claims/{id}/decide"
    shared_operations:
      - "GET reads (all business resources, including grievances)"

  - name: WorkerHotline
    description: "Anonymous worker grievance channel intake; may only file grievances, cannot read anything"
    identity: opaque
    exclusive_operations:
      - "POST /grievances"
    shared_operations: []
