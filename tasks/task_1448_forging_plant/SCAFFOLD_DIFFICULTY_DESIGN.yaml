            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T11:00:00Z", planned_end: "2026-08-03T12:30:00Z", planned_qty: 10, expected_work_order_version: "${wo_v2}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_b: "$.data.id" } }
