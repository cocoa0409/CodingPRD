            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-Y-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id }
          trigger:
