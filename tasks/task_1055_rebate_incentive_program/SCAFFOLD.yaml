    identity: opaque
    exclusive_operations:
      - "POST /api/programs"
      - "POST /api/programs/{id}/activate"
      - "POST /api/programs/{id}/close"
      - "POST /api/programs/{id}/budget-adjustments"
      - "POST /api/programs/{id}/escheat-sweep"
      - "POST /api/offers"
      - "POST /api/offers/{id}/publish"
      - "POST /api/offers/{id}/suspend"
      - "POST /api/offers/{id}/close"
      - "POST /api/claimants"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /api/programs/{id}"
      - "GET /api/programs"
      - "GET /api/programs/{id}/report"
      - "GET /api/offers/{id}"
      - "GET /api/offers"
      - "GET /api/claimants/{id}"
      - "GET /api/claimants"
      - "GET /api/claims/{id}"
      - "GET /api/claims"
      - "GET /api/claims/{id}/receipts"
      - "GET /api/receipts/{id}"
      - "GET /api/payouts/{id}"
      - "GET /api/payouts"
      - "GET /api/virtual-cards/{id}"
      - "GET /api/virtual-cards"
      - "GET /api/escheat-records/{id}"
      - "GET /api/escheat-records"
      - "GET /api/budget-entries/{id}"
      - "GET /api/budget-entries"
      - "GET /api/fraud-cases/{id}"
      - "GET /api/fraud-cases"

  - name: ClaimsProcessor
    description: "Adjudicates claims: validates receipts, reviews, approves and denies"
    identity: opaque
    exclusive_operations:
      - "POST /api/receipts/{id}/validate"
      - "POST /api/claims/{id}/review"
      - "POST /api/claims/{id}/approve"
      - "POST /api/claims/{id}/deny"
    shared_operations:
      - "GET /api/programs/{id}"
      - "GET /api/programs"
      - "GET /api/programs/{id}/report"
      - "GET /api/offers/{id}"
      - "GET /api/offers"
      - "GET /api/claimants/{id}"
      - "GET /api/claimants"
      - "GET /api/claims/{id}"
      - "GET /api/claims"
      - "GET /api/claims/{id}/receipts"
      - "GET /api/receipts/{id}"
      - "GET /api/payouts/{id}"
      - "GET /api/payouts"
      - "GET /api/budget-entries/{id}"
      - "GET /api/budget-entries"
      - "GET /api/fraud-cases"

  - name: FinanceOfficer
    description: "Disburses approved claims; segregated from the processor that approved them"
    identity: opaque
    exclusive_operations:
      - "POST /api/claims/{id}/payouts"
      - "POST /api/payouts/{id}/release"
      - "POST /api/payouts/{id}/clear"
      - "POST /api/payouts/{id}/void"
      - "POST /api/payouts/{id}/reissue"
    shared_operations:
      - "GET /api/programs/{id}"
      - "GET /api/programs"
      - "GET /api/offers/{id}"
      - "GET /api/offers"
      - "GET /api/claimants/{id}"
      - "GET /api/claims/{id}"
      - "GET /api/claims"
      - "GET /api/claims/{id}/receipts"
      - "GET /api/payouts/{id}"
      - "GET /api/payouts"
      - "GET /api/virtual-cards/{id}"
      - "GET /api/virtual-cards"
      - "GET /api/escheat-records/{id}"
      - "GET /api/escheat-records"
      - "GET /api/budget-entries/{id}"
      - "GET /api/budget-entries"

  - name: FraudAnalyst
    description: "Opens and drives fraud cases and reinstates cleared claimants"
    identity: opaque
    exclusive_operations:
      - "POST /api/fraud-cases"
      - "POST /api/fraud-cases/{id}/transition"
      - "POST /api/claimants/{id}/reinstate"
    shared_operations:
      - "GET /api/programs/{id}"
      - "GET /api/programs"
      - "GET /api/offers/{id}"
      - "GET /api/offers"
      - "GET /api/claimants/{id}"
      - "GET /api/claimants"
      - "GET /api/claims/{id}"
