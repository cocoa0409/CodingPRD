  - section: calculations
    instances:

      - name: coverage_clause_order_names_the_first_failing_clause
        claim_type: Correct Result
        grounds:
          - calculations.container_coverage_and_deposit
          - errors[ERR_PRODUCT_NOT_COVERED]
        distinguishing_aspect: "The pinned clause order shows up in coverage_reason: a 500 ml aluminium WINE fails at the type clause (EXCLUDED_BEVERAGE_TYPE) even though its material and volume are fine, while a 500 ml POUCH of WATER fails at the material clause; a NOT_COVERED label cannot be approved."
        test_recipe:
          setup:
            - "One ACTIVE Distributor with two DRAFT labels: 500 ml ALUMINUM WINE and 500 ml POUCH WATER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Vintage", beverage_type: "WINE", container_material: "ALUMINUM", fill_volume_ml: 500, upc: "011110000010", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { wine_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Pouch Water", beverage_type: "WATER", container_material: "POUCH", fill_volume_ml: 500, upc: "011110000011", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { pouch_id: $.data.id }
          trigger:
            - call: "POST /beverage-products/${wine_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${pouch_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${wine_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
              captures: { err_approve: $.data.error_id }
          assert:
            - "BeverageProduct.${wine_id}.coverage_status == NOT_COVERED, coverage_reason == EXCLUDED_BEVERAGE_TYPE, deposit_cents == 0"
            - "BeverageProduct.${pouch_id}.coverage_status == NOT_COVERED, coverage_reason == EXCLUDED_MATERIAL, deposit_cents == 0"
