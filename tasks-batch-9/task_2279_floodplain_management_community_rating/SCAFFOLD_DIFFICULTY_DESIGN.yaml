      - name: appeal_decision_state_precondition_outranks_segregation_of_duties
        grounds:
          - validations[priority=40]
          - validations[priority=70]
          - errors[ERR_APPEAL_NOT_PENDING]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair state (priority 40) vs business_constraint (priority 70): a case still
          in DETERMINED, decided by the very user who determined it, returns
          ERR_APPEAL_NOT_PENDING with HTTP 409 rather than ERR_SEGREGATION_OF_DUTIES with
          HTTP 403.
        test_recipe:
          setup:
            - "A structure with one counted IMPROVEMENT record of 120000.00 against market 200000.00."
            - "A CUMULATIVE DeterminationCase in DETERMINED, determined_by_user_id fpa-01, with no appeal filed."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0101", mapped_area_code: "RLA-1", owner_name: "M Owner", owner_email: "m@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: true, construction_year: 1962, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-05-01T00:00:00Z", cost_usd: 120000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
