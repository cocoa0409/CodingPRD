        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/srts/_clock/set_current_utc
          - state_machines.PostAssignment.SCHEDULED_to_ACTIVE
          - state_machines.PostAssignment.ACTIVE_to_ENDED
        distinguishing_aspect: |
          The clock endpoint's response body is itself an assertion surface: one sweep can
          both start and finish assignments, and the two counters must be reported
          independently. Moving to 2026-09-10 activates exactly 1 and ends 0; moving to
          2026-09-19 ends Rita's window (end_date 2026-09-18 < the new clock date) AND
          activates Sam's (start_date 2026-09-19 <= the new clock date) in the SAME call,
          so the response must read activated_assignment_count 1 and
          ended_assignment_count 1 — not 2/0, not 0/2, and not 1/0 with the end deferred to
          the next call.
