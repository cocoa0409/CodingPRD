# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Nine rule_id blocks, two instances each (18 instances total). Every numeric value in
# every `assert:` line below was produced by executing the corresponding
# `calculations[].formula` from SCAFFOLD.yaml against the pinned literals in `setup:`.
#
# Shared literal conventions used by the setup chains (fresh empty DB per instance):
#   jurisdiction US-NY : dry_status WET,  utc_offset_minutes -240
#   ALCOHOL policy AUG : min_age 21, window [600, 1320), unit_scale_factor 1.15,
#                        max_units_per_order 6.97, rolling_window_days 30,
#                        max_units_per_window 40.00, requires_scan true,
#                        effective 2026-08-01 .. 2026-08-31
#   products           : WINE-A 1.50 units / 6800c, BEER-B 0.75 units / 3200c,
#                        SELTZ-C 0.05 units / 900c
#   customer           : attested_dob 2000-03-15 (age 26 on 2026-08-20)
#   partner            : contract_tier STANDARD, license_reference NY-DEL-0001

scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_exposure_provisional_versus_final_policy_epoch
        grounds:
          - calculations.order_restricted_unit_exposure
          - entities.Order.fields.provisional_restricted_units
          - entities.Order.fields.final_restricted_units
          - entities.OrderLine.fields.line_restricted_units
          - entities.RestrictionPolicy.fields.unit_scale_factor
          - state_machines.Order.fulfillment_state.OUT_FOR_DELIVERY_to_DELIVERED
        distinguishing_aspect: |
          This instance is dual-variant logic on the ORDER / regulatory-quantity domain: the
          same three order lines yield provisional_restricted_units 6.97 at submit (policy
          effective on the promised date, unit_scale_factor 1.15) and final_restricted_units
          7.87 at handover (policy effective on the actual doorstep date, unit_scale_factor
          1.30), a divergence of 0.90 units produced purely by which policy epoch the
          evaluation instant lands in.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY with two non-overlapping ALCOHOL policies: August at unit_scale_factor 1.15 and September-December at unit_scale_factor 1.30"
            - "customer attested and MATCH-pre-verified; partner OPEN; courier CERTIFIED for ALCOHOL"
            - "order scheduled 2026-08-20T16:00:00Z (local minute 720) with lines 3xWINE-A, 2xBEER-B, 1xSELTZ-C, submitted to PREVERIFIED and dispatched"
            - "the delivery attempt starts on 2026-09-02T16:00:00Z, which falls in the September policy epoch"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_aug: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.30, max_units_per_order: 20.00, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-09-01", effective_to: "2026-12-31" }
              as: PlatformAdmin
              captures: { pol_sep: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { sku: "BEER-B", name: "Pale Ale 6-pack", restriction_type: "ALCOHOL", restricted_units_per_item: 0.75, list_price_cents: 3200 }
              as: PlatformAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /products"
              payload: { sku: "SELTZ-C", name: "Hard Seltzer Can", restriction_type: "ALCOHOL", restricted_units_per_item: 0.05, list_price_cents: 900 }
              as: PlatformAdmin
              captures: { prod_c: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_a: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_b}", quantity: 2 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_b: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_c}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_c: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${order}/dispatch"
              payload: {}
              as: PartnerManager
              as_user_id: "${partner}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-attempts"
              payload: { order_id: "${order}", courier_id: "${courier}", started_at: "2026-09-02T16:00:00Z" }
              as: Courier
              as_user_id: "${courier}"
              captures: { att: $.data.id }
            - call: "POST /delivery-attempts/${att}/id-check"
              payload: { document_type: "DRIVERS_LICENSE", document_expires_on: "2030-03-15", scan_performed: true, scanned_dob: "2000-03-15", recipient_name: "Ada Lin" }
              as: Courier
              as_user_id: "${courier}"
            - call: "POST /delivery-attempts/${att}/captures"
              payload: { kind: "SIGNATURE", content_hash: "1111111111111111111111111111111111111111111111111111111111111111", captured_at: "2026-09-02T16:05:00Z" }
              as: Courier
              as_user_id: "${courier}"
            - call: "POST /delivery-attempts/${att}/captures"
              payload: { kind: "PHOTO_ID", content_hash: "2222222222222222222222222222222222222222222222222222222222222222", captured_at: "2026-09-02T16:06:00Z" }
              as: Courier
              as_user_id: "${courier}"
            - call: "POST /delivery-attempts/${att}/captures"
              payload: { kind: "PHOTO_HANDOFF", content_hash: "3333333333333333333333333333333333333333333333333333333333333333", captured_at: "2026-09-02T16:07:00Z" }
              as: Courier
              as_user_id: "${courier}"
          trigger:
            - call: "POST /delivery-attempts/${att}/handover"
              payload: { recipient_name: "Ada Lin" }
              as: Courier
              as_user_id: "${courier}"
          assert:
            - "Order.${order}.provisional_restricted_units == 6.97"
            - "Order.${order}.final_restricted_units == 7.87"
            - "Order.${order}.final_restricted_units - Order.${order}.provisional_restricted_units == 0.90"
            - "Order.${order}.applied_policy_ids == [\"${pol_aug}\"]"
            - "OrderLine.${line_a}.line_restricted_units == 5.85"
            - "OrderLine.${line_b}.line_restricted_units == 1.95"
            - "OrderLine.${line_c}.line_restricted_units == 0.07"
            - "Order.${order}.fulfillment_state == DELIVERED"
            - "Order.${order}.compliance_state == PREVERIFIED"

      - name: partner_risk_rolling_versus_lifetime_weighted
        grounds:
          - calculations.partner_license_risk_score
          - entities.DeliveryPartner.fields.license_risk_score
          - entities.DeliveryPartner.fields.lifetime_risk_score
          - entities.DeliveryPartner.fields.contract_tier
          - entities.ViolationCase.fields.assessed_severity
        distinguishing_aspect: |
          This instance is dual-variant logic on a completely different entity domain —
          DELIVERY-PARTNER licence risk, not order quantity: the same three substantiated
          cases yield license_risk_score 55.00 under ROLLING_90D (the 121-day-old MINOR case
          is dropped entirely) and lifetime_risk_score 59.50 under LIFETIME_WEIGHTED (that
          same case survives at decay weight 0.90, contributing 4.50).
        test_recipe:
          setup:
            - "partner with contract_tier STANDARD (tier_multiplier 1.00)"
            - "three violation cases substantiated at three different clock positions: MINOR on 2026-08-02, CRITICAL on 2026-11-03, MAJOR on 2026-11-08"
            - "logical clock finally advanced to 2026-12-01T00:00:00Z, making the case ages 121, 28 and 23 days; the logical clock never moves backwards, so every setup instant is at or after the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Decoy Buyer", email: "decoy@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-07-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-03T16:00:00Z", delivery_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { decoy1: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${decoy1}", scenario_type: "NO_ID_PRESENTED", scheduled_at: "2026-08-02T12:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst1: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst1}", severity: "MINOR", summary: "Signage lapse observed during the August audit" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case_minor: $.data.id }
            - call: "POST /violation-cases/${case_minor}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case_minor}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "MINOR", notes: "Substantiated at the August audit" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-11-04T16:00:00Z", delivery_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { decoy2: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${decoy2}", scenario_type: "UNDERAGE_PRESENTER", scheduled_at: "2026-11-03T12:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst2: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst2}", severity: "CRITICAL", summary: "Handover to an underage presenter" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case_crit: $.data.id }
            - call: "POST /violation-cases/${case_crit}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case_crit}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "CRITICAL", notes: "Substantiated on 2026-11-03" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-11-09T16:00:00Z", delivery_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { decoy3: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${decoy3}", scenario_type: "EXPIRED_DOCUMENT", scheduled_at: "2026-11-08T12:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst3: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst3}", severity: "MAJOR", summary: "Expired document accepted at the door" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case_major: $.data.id }
            - call: "POST /violation-cases/${case_major}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case_major}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "MAJOR", notes: "Substantiated on 2026-11-08" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /delivery-partners/${partner}/risk-assessment"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_b"
          assert:
            - "response.data.rolling_90d_score == 55.00"
            - "response.data.lifetime_weighted_score == 59.50"
            - "response.data.tier_multiplier == 1.00"
            - "DeliveryPartner.${partner}.license_risk_score == 55.00"
            - "DeliveryPartner.${partner}.lifetime_risk_score == 59.50"
            - "ViolationCase.${case_minor}.risk_contribution == 0.00"
            - "ViolationCase.${case_crit}.risk_contribution == 40.00"
            - "ViolationCase.${case_major}.risk_contribution == 15.00"
            - "DeliveryPartner.${partner}.posture == RESTRICTED"

  # =========================================================================
  # Rule 2 — combinatorial_formula  (instance 1 = mode (b), instance 2 = mode (c))
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: exposure_per_line_rounding_order_decides_quota_verdict
        grounds:
          - calculations.order_restricted_unit_exposure
          - entities.OrderLine.fields.line_restricted_units
          - entities.RestrictionPolicy.fields.max_units_per_order
          - validations[priority=70]
        distinguishing_aspect: |
          MODE (b) — nested rounding where the order matters. The scaffold pins
          round-per-line-then-sum (5.18 + 1.73 + 0.06 = 6.97); the sum-then-round reading
          gives 6.96. Against a policy whose max_units_per_order is 6.96 the pinned order
          REJECTS the submit with ERR_ORDER_UNIT_LIMIT_EXCEEDED while the forbidden order
          would accept it, so the two readings are separated by an HTTP status, not a
          rounding cent.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY ALCOHOL policy with max_units_per_order 6.97 and unit_scale_factor 1.15"
            - "jurisdiction US-VT ALCOHOL policy identical except max_units_per_order 6.96"
            - "customer attested and MATCH-pre-verified"
            - "two structurally identical CREATED orders, one delivering into US-NY and one into US-VT, each carrying lines 3xWINE-A, 2xBEER-B, 1xSELTZ-C"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "US-VT", name: "Vermont", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_vt: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_vt}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.15, max_units_per_order: 6.96, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_vt: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { sku: "BEER-B", name: "Pale Ale 6-pack", restriction_type: "ALCOHOL", restricted_units_per_item: 0.75, list_price_cents: 3200 }
              as: PlatformAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /products"
              payload: { sku: "SELTZ-C", name: "Hard Seltzer Can", restriction_type: "ALCOHOL", restricted_units_per_item: 0.05, list_price_cents: 900 }
              as: PlatformAdmin
              captures: { prod_c: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_ny: $.data.id }
            - call: "POST /orders/${order_ny}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
              captures: { ny_line_a: $.data.id }
            - call: "POST /orders/${order_ny}/lines"
              payload: { product_id: "${prod_b}", quantity: 2 }
              as: Customer
              as_user_id: "${cust}"
              captures: { ny_line_b: $.data.id }
            - call: "POST /orders/${order_ny}/lines"
              payload: { product_id: "${prod_c}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
              captures: { ny_line_c: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_vt}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T17:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_vt: $.data.id }
            - call: "POST /orders/${order_vt}/lines"
