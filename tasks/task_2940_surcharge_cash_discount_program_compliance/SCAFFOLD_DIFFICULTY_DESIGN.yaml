              as: TerminalAgent
              as_user_id: "${term_id}"
              captures: { txn_id: $.data.id }
            - call: "POST /complaint-cases"
              payload: { program_id: "${prog_id}", source: "CARDHOLDER", allegation_type: "UNDISCLOSED_SURCHARGE", narrative: "Cardholder says the surcharge was not disclosed before checkout." }
              as: NetworkAuditor
