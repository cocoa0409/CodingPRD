scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cast_commit_estimate_offer_vs_sign_on_role_entity
        grounds:
          - calculations.cast_commit_estimate
          - state_machines.Role.OFFERED_to_SIGNED
          - entities.Role.fields.signed_actor_id
          - entities.Scene.fields.status
        distinguishing_aspect: |
          Variant at_offer_time includes all Scenes referencing the role regardless of status,
          while at_sign_time excludes Scenes whose status is SHOT or OMITTED, so identical Role
          and Scene rows produce different committed_cents deltas. This dual-variant calc lives
          on the Role entity domain (casting), distinct from the wrap-time variant on
          CrewAssignment.
        test_recipe:
          setup:
            - "Production P1 created (status=PLANNING) with total_budget_cents=20000000, reserve_fund_cents=2000000."
            - "BudgetCategory(CAST) created with planned_cents=10000000."
            - "Role R1 created on P1 with union_tier=SUPPORTING, day_rate_cents=200000."
            - "Three Scenes S1, S2, S3 created, each with planned_duration_minutes=480 and required_actor_role_ids=[R1]."
            - "S1 advanced through SCHEDULED→SHOT (linked LocationReservation FULFILLED). S2 and S3 remain BREAKDOWN."
            - "Actor A1 created; Audition A1→R1 with outcome=PASS recorded; Role R1 walked OPEN→AUDITIONING→SHORTLISTED→OFFERED."
          trigger:
            - "GET /productions/P1 (read at_offer_time forecast posture for cast committed_cents)"
            - "POST /productions/P1/roles/R1/sign  (persists at_sign_time variant into BudgetCategory(CAST).committed_cents)"
          assert:
            - "Forecast read of cast committed delta at_offer_time == 600000 (3 scenes * 1 day * 200000)"
            - "After sign, BudgetCategory(CAST).committed_cents == 400000 (2 BREAKDOWN scenes * 1 day * 200000) — at_sign_time excludes SHOT scenes"
            - "BudgetCategory(CAST).committed_cents != 600000"

      - name: crew_payroll_per_component_vs_total_then_round_on_crewassignment_entity
        grounds:
          - calculations.crew_payroll_calc
          - state_machines.CrewAssignment.RELEASED_to_SETTLED
          - state_machines.Production.WRAP_PENDING_to_WRAPPED
          - entities.CrewAssignment.fields.payroll_cents
        distinguishing_aspect: |
          Variant per_component_rounding rounds each overtime component to integer cents before
          summation; total_then_round forecasts a single round_half_up at the very end. With
          day_rate_cents=33333 and overtime split 5+1, the two variants disagree by exactly 1
          cent. This lives on the CrewAssignment entity domain (wrap settlement), structurally
          different from the cast_commit forecast variant on Role.
        test_recipe:
          setup:
            - "Production P2 walked through PLANNING→IN_PRODUCTION→WRAP_PENDING (all scenes SHOT/OMITTED, all reservations FULFILLED, no Equipment CHECKED_OUT)."
            - "CrewAssignment C1 created on P2 with day_rate_cents=33333, scheduled_days=5; transitions BOOKED→ACTIVE on baseline lock; PATCH actual_days=11."
          trigger:
            - "GET /productions/P2/wrap-preview (returns total_then_round forecast variant)"
            - "POST /productions/P2/close-account (executes per_component_rounding; persists CrewAssignment.payroll_cents)"
          assert:
            - "wrap-preview projected payroll for C1 == 474995"
            - "After close-account, CrewAssignment C1.payroll_cents == 474996"
            - "Authoritative payroll != forecast payroll (delta == 1 cent)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cast_commit_min_cap_with_state_filtered_sum
        grounds:
          - calculations.cast_commit_estimate
          - entities.Role.fields.union_tier
          - entities.Scene.fields.status
          - entities.Scene.fields.planned_duration_minutes
        distinguishing_aspect: |
          Mode (a): formula combines >=3 inputs (Role.day_rate_cents, Role.union_tier→CAP_BY_TIER,
          Scene.planned_duration_minutes via ceil/MINUTES_PER_SHOOT_DAY) with non-linear
          interaction — the min(cap, sum) clamps to a tier-keyed cap, AND the sum itself depends
          on a state filter over Scene.status. Different inputs do not compose linearly.
        test_recipe:
          setup:
            - "Production P3 with BudgetCategory(CAST) planned_cents=20000000."
            - "Role R3 with union_tier=FEATURED_BACKGROUND (cap=10), day_rate_cents=100000."
            - "Twelve Scenes each 720 minutes, all BREAKDOWN, all referencing R3."
            - "Actor A3 created; PASS audition recorded; Role walked to OFFERED."
          trigger:
            - "POST /productions/P3/roles/R3/sign"
          assert:
            - "Each scene contributes ceil(720/480) == 2 days; sum == 24 days"
            - "Capped to 10 (FEATURED_BACKGROUND); commit = 10 * 100000 == 1000000"
            - "BudgetCategory(CAST).committed_cents == 1000000 (NOT 2400000)"

      - name: payroll_per_component_round_order_pinned
        grounds:
          - calculations.crew_payroll_calc
          - entities.CrewAssignment.fields.payroll_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round each overtime component to cents
          before summation, vs sum first then round. Scaffold pins per_component_then_sum as the
          authoritative ROUND_ORDER. With day_rate_cents=33333, ot=5+1, the two orders give
          474996 vs 474995 — the scaffold's ROUND_ORDER constant fixes the answer.
        test_recipe:
          setup:
            - "Same as instance crew_payroll_per_component_vs_total_then_round_on_crewassignment_entity setup."
          trigger:
            - "POST /productions/P2/close-account"
          assert:
            - "CrewAssignment C1.payroll_cents == 474996 (per_component_then_sum)"
            - "CrewAssignment C1.payroll_cents != 474995"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: role_audition_shortlist_cycle
        grounds:
          - state_machines.Role.AUDITIONING_to_SHORTLISTED
          - state_machines.Role.SHORTLISTED_to_AUDITIONING
          - state_machines.Role.SIGNED_to_RECAST
        distinguishing_aspect: |
          Role state machine has a cycle SHORTLISTED→AUDITIONING (reopen-auditions) plus a
          branch from SIGNED→RECAST that spawns a replacement Role and SIGNs it in-line. Cycle
          + branching make this non-linear; resides on the Role entity.
        test_recipe:
          setup:
            - "Production P4; Role R4; Actor A4 with PASS audition."
          trigger:
            - "POST /productions/P4/roles/R4/auditions (R4 OPEN→AUDITIONING)"
            - "POST /productions/P4/roles/R4/shortlist (R4→SHORTLISTED)"
            - "POST /productions/P4/roles/R4/reopen-auditions (R4→AUDITIONING) — this is the cycle"
            - "POST /productions/P4/roles/R4/shortlist (R4→SHORTLISTED again)"
          assert:
            - "Role R4.casting_status == SHORTLISTED after second shortlist"
            - "AuditLog contains two SCHEDULE_CHANGE entries for R4 referencing the cycle"

      - name: location_reservation_reschedule_branch
        grounds:
          - state_machines.LocationReservation.CONFIRMED_to_RESCHEDULING
          - state_machines.LocationReservation.RESCHEDULING_to_RELEASED
          - state_machines.Scene.SCHEDULED_to_RESCHEDULING
          - state_machines.Scene.RESCHEDULING_to_SCHEDULED
        distinguishing_aspect: |
          LocationReservation has a branching/revert shape: CONFIRMED→RESCHEDULING (cascaded by
          weather block) →RELEASED on substitution; alternative path CONFIRMED→FULFILLED on
          shoot. The state machine forks based on weather_status. Resides on a different entity
          (LocationReservation) than the Role cycle.
        test_recipe:
          setup:
            - "Scene S5 weather_dependent=true scheduled to LocationReservation LR5 in CONFIRMED with weather_status=ACCEPTABLE."
          trigger:
            - "PATCH /location-reservations/LR5/weather-status {weather_status: BLOCKED}"
            - "POST /productions/P5/scenes/S5/mark-weather-blocked  (Scene→RESCHEDULING; cascade LR5→RESCHEDULING)"
            - "POST /location-reservations/LR6 created and confirmed (HELD→CONFIRMED with weather_status=ACCEPTABLE)"
            - "POST /productions/P5/scenes/S5/reschedule {new_reservation_id: LR6}"
          assert:
            - "LR5.status == RELEASED (cascaded RESCHEDULING→RELEASED)"
            - "LR6.status == CONFIRMED"
            - "Scene S5.status == SCHEDULED (returned to SCHEDULED via the branch)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: role_sign_to_budget_to_alert_to_posture_depth_three
        grounds:
          - state_machines.Role.OFFERED_to_SIGNED
          - calculations.cast_commit_estimate
          - calculations.category_alert_state
          - calculations.evaluate_production_posture
          - entities.BudgetCategory.fields.alert_state
          - entities.Production.fields.posture
        distinguishing_aspect: |
          Cascade depth ≥ 3 caused-by hops, originating from Role.OFFERED→SIGNED:
          (hop 1) SIGN causes BudgetCategory(CAST).committed_cents += cast_commit_estimate;
          (hop 2) the committed_cents mutation itself causes BudgetCategory.alert_state to flip
          (because category_alert_state recomputes off committed_cents); (hop 3) the alert_state
          flip itself causes Production.posture to re-evaluate to RED. Each hop is caused by the
          previous hop's mutation, not by the original SIGN — this is a transitive chain, not a
          fan-out. Trigger is Role.OFFERED→SIGNED.
        test_recipe:
          setup:
            - "Production P6 with BudgetCategory(CAST) planned_cents=500000 and existing actual_cents=0, committed_cents=0."
            - "Role R6 with day_rate_cents=200000, union_tier=SUPPORTING, walked to OFFERED; 3 BREAKDOWN scenes (1 day each) reference R6."
          trigger:
            - "POST /productions/P6/roles/R6/sign"
          assert:
            - "Hop 1 (caused by SIGN): BudgetCategory(CAST).committed_cents == 600000 (3*200000)"
            - "Hop 2 (caused by hop 1, NOT by SIGN directly): BudgetCategory(CAST).alert_state == OVER (utilization 600000/500000 = 1.20 > 1.00)"
            - "Hop 3 (caused by hop 2): Production.posture == RED (any category alert OVER)"

      - name: equipment_loss_to_invoice_deduction_to_category_actual
        grounds:
          - state_machines.Equipment.CHECKED_OUT_to_LOST
          - state_machines.Equipment.LOST_to_RETURNED
          - state_machines.VendorInvoice.SUBMITTED_to_RECONCILED
          - calculations.category_alert_state
        distinguishing_aspect: |
          Cascade depth ≥ 2 from a different trigger (RETURN_VERIFIED on previously LOST item):
          RETURN_VERIFIED → VendorInvoice.deduction_cents increased; the DEDUCTION mutation on
          the invoice itself causes BudgetCategory(EQUIPMENT).committed_cents -= damage_charge;
          the BUDGET mutation itself causes BudgetCategory(EQUIPMENT).alert_state recomputation.
          Originating transition (RETURN_VERIFIED) is different from the production-cancel
          trigger above, so the scaffold captures more than one propagation pattern.
        test_recipe:
          setup:
            - "Production P7 with BudgetCategory(EQUIPMENT) planned_cents=1000000, committed_cents=200000 (from a CHECKED_OUT damage charge), actual_cents=0."
            - "Equipment E7 in LOST status with vendor_id=V7, last EquipmentEvent damage_charge_cents=200000."
            - "VendorInvoice INV7 SUBMITTED for vendor V7 with category_code=EQUIPMENT, gross_cents=200000."
          trigger:
            - "POST /equipment/E7/events {event_type: RETURN_VERIFIED}"
          assert:
            - "Hop 1: VendorInvoice INV7.deduction_cents == 200000 (caused by RETURN_VERIFIED)"
            - "Hop 2 (caused by hop 1's mutation): BudgetCategory(EQUIPMENT).committed_cents == 0"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_change_order_approve
        grounds:
          - validations[priority=5]
          - validations[priority=19]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RESERVE_INSUFFICIENT]
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_fiscal (priority 19,
          ERR_RESERVE_INSUFFICIENT). When approving a ChangeOrder that is already APPROVED AND
          whose RESERVE_DRAW exceeds remaining reserve, ERR_INVALID_STATE wins because state
          checks (priority 5) precede fiscal checks (priority 19).
        test_recipe:
          setup:
            - "Production P8 with reserve_fund_cents=100000."
            - "ChangeOrder CO8 source=RESERVE_DRAW, delta_cents=500000 (greatly exceeds reserve), approved by FC1 → status=APPROVED."
          trigger:
            - "POST /change-orders/CO8/approve (a second time, different FC2)"
          assert:
            - "Response error_id == ERR_INVALID_STATE (NOT ERR_RESERVE_INSUFFICIENT)"
            - "Response http_status == 409"

      - name: business_safety_vs_business_fiscal_on_change_order_approve
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_RESERVE_INSUFFICIENT]
        distinguishing_aspect: |
          Pair: business_safety (priority 7, ERR_SEGREGATION_OF_DUTIES) vs business_fiscal
          (priority 19, ERR_RESERVE_INSUFFICIENT). When the same FinanceController who submitted
          the change-order tries to approve it, AND the reserve draw would also be insufficient,
          segregation-of-duties (priority 7) wins.
        test_recipe:
          setup:
            - "Production P9 with reserve_fund_cents=100000."
            - "ChangeOrder CO9 created by user FC9 (source=RESERVE_DRAW, delta_cents=500000), still PENDING."
          trigger:
            - "POST /change-orders/CO9/approve as user FC9 (same X-User-ID as requested_by)"
          assert:
            - "Response error_id == ERR_SEGREGATION_OF_DUTIES (NOT ERR_RESERVE_INSUFFICIENT)"
            - "Response http_status == 403"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: category_alert_state_warn_at_exact_ninety_percent
        grounds:
          - calculations.category_alert_state
          - entities.BudgetCategory.fields.alert_state
          - validations[priority=18]
        distinguishing_aspect: |
          Numeric threshold boundary on utilization metric: WARN triggers at >= 0.90, OVER
          triggers at > 1.00 (1.00 itself stays WARN). Reachable through
          POST /change-orders/{id}/approve. Distinct from the empty-set boundary instance below.
        test_recipe:
          setup:
            - "Production P10; BudgetCategory(LOCATION) planned_cents=100000."
            - "VendorInvoice paid for category=LOCATION, net_cents=89999 (utilization 0.89999 < 0.90 → OK)."
          trigger:
            - "POST /vendor-invoices (additional vendor invoice for category=LOCATION, gross_cents=1) → reconcile → pay (utilization moves to 90000/100000 = 0.90 exactly)"
          assert:
            - "BudgetCategory(LOCATION).alert_state == WARN (>= 0.90 boundary inclusive)"
            - "BudgetCategory(LOCATION).alert_state != OVER"

      - name: location_capacity_unit_exhaustion_zero_slot_boundary
        grounds:
          - validations[priority=11]
          - entities.Location.fields.max_parallel_units
          - errors[ERR_LOCATION_OVER_CAPACITY]
        distinguishing_aspect: |
          Empty-pool boundary on a different metric: count of overlapping reservations vs
          max_parallel_units. With max_parallel_units=2 and exactly 2 overlapping reservations
          already HELD, the third overlapping reservation MUST be rejected — the candidate slot
          set is empty. Reachable through POST /location-reservations (different endpoint than
          the WARN check).
        test_recipe:
          setup:
            - "Location L11 with max_parallel_units=2."
            - "LocationReservation LR11A (unit_label=MAIN) and LR11B (unit_label=B_UNIT) both HELD with intervals [09:00, 17:00) on day D."
          trigger:
            - "POST /location-reservations (third reservation LR11C with interval [10:00, 12:00) on day D, unit_label=THIRD_UNIT)"
          assert:
            - "Response error_id == ERR_LOCATION_OVER_CAPACITY"
            - "Response http_status == 409"
            - "No new LocationReservation is persisted"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: scene_schedule_depends_on_locationreservation_state
        grounds:
          - state_machines.Scene.BREAKDOWN_to_SCHEDULED
          - state_machines.LocationReservation.HELD_to_CONFIRMED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair: Scene depends on LocationReservation. Scene cannot transition
          BREAKDOWN→SCHEDULED unless the linked LocationReservation is in {HELD, CONFIRMED} AND,
          if Location.requires_permit, the reservation's permit_status == APPROVED. Distinct
          entity pair from the Role→Production dependency below.
        test_recipe:
          setup:
            - "Location L12 with requires_permit=true; LocationReservation LR12 created HELD with permit_status=PENDING."
            - "Scene S12 in BREAKDOWN."
          trigger:
            - "POST /location-reservations/LR12/confirm  (should fail because permit not APPROVED)"
            - "PATCH /location-reservations/LR12/permit-status {permit_status: APPROVED}"
            - "POST /location-reservations/LR12/confirm (now succeeds)"
            - "POST /productions/{pid}/scenes/S12/schedule {reservation_id: LR12}"
          assert:
            - "First confirm returns error_id == ERR_PERMIT_REQUIRED"
            - "After permit APPROVED then confirm, LR12.status == CONFIRMED"
            - "Scene S12.status == SCHEDULED"

      - name: role_sign_depends_on_production_status
        grounds:
          - state_machines.Role.OFFERED_to_SIGNED
          - state_machines.Production.PLANNING_to_IN_PRODUCTION
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair: Role depends on Production posture. Role can only be SIGNED when
          Production.posture != FROZEN (i.e., not WRAP_PENDING). This is a different entity pair
          (Role↔Production) than the Scene↔LocationReservation pair above.
        test_recipe:
          setup:
            - "Production P13 walked to WRAP_PENDING (posture=FROZEN)."
            - "Role R13 in OFFERED with PASS audition for Actor A13."
          trigger:
            - "POST /productions/P13/roles/R13/sign"
          assert:
            - "Response error_id == ERR_POSTURE_BLOCKED"
            - "Role R13.casting_status == OFFERED (unchanged)"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: location_overlap_half_open_interval_arithmetic
        grounds:
          - validations[priority=11]
          - entities.LocationReservation.fields.start_at
          - entities.LocationReservation.fields.end_at
          - entities.Location.fields.max_parallel_units
        distinguishing_aspect: |
          Interval semantic: half-open intervals [start_at, end_at) on Location resource.
          Adjacent intervals (one ends exactly when the next begins) do NOT collide; aggregate
          capacity allows up to max_parallel_units overlapping reservations. Resource = Location.
        test_recipe:
          setup:
            - "Location L14 max_parallel_units=1."
            - "LocationReservation LR14A: [10:00, 12:00) HELD."
          trigger:
            - "POST /location-reservations (LR14B: [12:00, 14:00))  → adjacent, expect SUCCESS"
            - "POST /location-reservations (LR14C: [11:30, 13:00))  → overlaps, expect FAILURE"
          assert:
            - "LR14B persisted with status=HELD (adjacency OK on half-open interval)"
            - "LR14C response error_id == ERR_LOCATION_OVER_CAPACITY"

      - name: actor_callsheet_travel_buffer_zone_dependent
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - calculations.travel_buffer_minutes
          - entities.Actor.fields.travel_origin_zone
          - entities.Location.fields.zone
        distinguishing_aspect: |
          Different interval semantic: zone-dependent buffer arithmetic on Actor resource.
          Two reservations are NOT considered overlapping by the geometric [start, end) test,
          but ARE rejected because the gap is shorter than required_buffer_minutes (60 same
          zone, 240 cross zone). The buffer rule lives on Actor (call-sheet) — a different
          resource entity than Location — and uses a strict-less-than comparison.
        test_recipe:
          setup:
            - "Actor A15 signed to Role R15 (Production P15)."
            - "Scene S15A scheduled to LocationReservation LR15A at Location LZONE-X with end_at=10:00."
            - "LocationReservation LR15B at a Location LZONE-Y (different zone) with start_at=13:30 (gap=210 minutes)."
          trigger:
            - "POST /productions/P15/scenes/S15B/schedule {reservation_id: LR15B}"
          assert:
            - "Response error_id == ERR_ACTOR_CALLSHEET_CONFLICT"
            - "Reason: required cross-zone buffer = 240 minutes; gap=210 minutes; 13:30 < 10:00 + 240 minutes (= 14:00) ⇒ conflict"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: substitute_role_preserves_total_cast_committed
        grounds:
          - state_machines.Role.SIGNED_to_RECAST
          - calculations.cast_commit_estimate
          - entities.BudgetCategory.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity: BudgetCategory(CAST).committed_cents must remain equal to
          sum_over_signed_roles(cast_commit_estimate at_sign_time) at all times. Forward
          action (SIGN replacement Role) plus compensating action (decrement old Role's
          committed_cents) MUST leave the named global quantity equal to the sum invariant.
          A forward action without the compensating decrement leaves drift; the scaffold
          requires both legs.
        test_recipe:
          setup:
            - "Production P16; BudgetCategory(CAST) committed_cents=400000 from prior signed Role R16 (2 BREAKDOWN scenes * 1 day * 200000)."
            - "All other categories committed_cents=0."
            - "Replacement actor A16r has no schedule conflicts; replacement Role R16r will use day_rate_cents=300000 with same 2 BREAKDOWN scenes."
          trigger:
            - "POST /productions/P16/roles/R16/substitute {replacement_actor_id: A16r, replacement_role_name: 'R16-sub', replacement_day_rate_cents: 300000}"
          assert:
            - "Old Role R16.casting_status == RECAST"
            - "Replacement Role R16r.casting_status == SIGNED"
            - "BudgetCategory(CAST).committed_cents == 600000 (= 0 from R16 decrement + 600000 from R16r increment, NO drift)"
            - "Invariant holds: BudgetCategory(CAST).committed_cents == sum(cast_commit_estimate at_sign_time over signed Roles) == 600000"

      - name: equipment_return_preserves_equipment_committed_minus_invoice_deduction
        grounds:
          - state_machines.Equipment.LOST_to_RETURNED
          - state_machines.Equipment.DAMAGED_to_RETURNED
          - state_machines.VendorInvoice.SUBMITTED_to_RECONCILED
          - entities.VendorInvoice.fields.deduction_cents
          - entities.BudgetCategory.fields.committed_cents
        distinguishing_aspect: |
          Different conserved quantity: total cash exposure on equipment vendor =
          BudgetCategory(EQUIPMENT).committed_cents + paid VendorInvoice.net_cents — i.e., the
          sum of money the production owes plus already paid must equal the total of original
          gross invoices for that vendor. The forward leg (RETURN_VERIFIED moves DAMAGED/LOST→
          RETURNED) and the compensating leg (deduction_cents on the invoice) must balance.
          Distinct from the cast-commit invariant (different conserved quantity, different
          entities).
        test_recipe:
          setup:
            - "Production P17; Equipment E17 in DAMAGED status, last damage_charge_cents=80000."
            - "VendorInvoice INV17 SUBMITTED for the same vendor with category_code=EQUIPMENT, gross_cents=300000."
            - "Pre-state: BudgetCategory(EQUIPMENT).committed_cents == 80000 (from damage charge accrual)."
          trigger:
            - "POST /equipment/E17/events {event_type: RETURN_VERIFIED}"
            - "POST /vendor-invoices/INV17/reconcile"
            - "POST /vendor-invoices/INV17/pay"
          assert:
            - "After RETURN_VERIFIED: VendorInvoice INV17.deduction_cents == 80000; BudgetCategory(EQUIPMENT).committed_cents == 0 (decrement leg)"
            - "After reconcile: INV17.net_cents == 220000 (gross - deduction); BudgetCategory(EQUIPMENT).committed_cents == 220000 (gross stage commit moved here on submission, then this stage)"
            - "After pay: BudgetCategory(EQUIPMENT).committed_cents == 0; BudgetCategory(EQUIPMENT).actual_cents == 220000"
            - "Conserved invariant: actual_cents (220000) + committed_cents (0) + invoice deduction (80000) == original gross (300000)"
