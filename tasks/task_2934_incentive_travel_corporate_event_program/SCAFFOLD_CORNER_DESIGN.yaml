      - POST /supplier-contracts/${c1_id}/execute as ContractApprover with X-User-ID ca-03.
      assert:
      - 'Executing as ca-01 returns ERR_SEGREGATION_OF_DUTIES with HTTP 422: ca-01 equals last_countered_by_user_id.'
      - 'Executing as sm-01 while carrying the ContractApprover role also returns ERR_SEGREGATION_OF_DUTIES
        with HTTP 422: sm-01 equals last_proposed_by_user_id, so the check reads the user id and ignores
        the fact that the role is the permitted one.'
      - Executing as SourcingManager ca-02 returns ERR_ROLE_NOT_PERMITTED with HTTP 403, not 422 — priority
