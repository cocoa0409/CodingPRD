  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: h70_session_blocked_by_restricted_station_while_h35_still_allowed
        grounds:
          - validations.priority_100_ERR_POSTURE_RESTRICTS_H70
          - calculations.station_safety_posture
          - state_machines.Station.OPEN_to_RESTRICTED
          - entities.Station.fields.compressor_status
          - entities.DispenseSession.fields.target_pressure_class
          - endpoints.POST_/dispense-sessions
        distinguishing_aspect: |
          Entity pair is (DispenseSession, Station): whether a DispenseSession may be created depends
          on the parent Station's computed safety_posture, not on anything about the session row.
          The dependency is partial rather than absolute — a RESTRICTED posture blocks only
          target_pressure_class H70; the very next H35 request against the same RESTRICTED station
          succeeds, which distinguishes a real posture-plus-class guard from a blanket lockout.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Station STN-M, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70 so priority 235 cannot fire; vessels HIGH 600 L at 950.00 bar, MEDIUM 1000 L at 700.00 bar, LOW 5000 L at 300.00 bar; onsite_inventory_kg 221.600, high_bank_deliverable_kg 36.000."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "A MAJOR COMPRESSOR_FAULT SafetyEvent is opened, so compressor_status becomes OFFLINE and safety_posture recomputes OPEN -> RESTRICTED (leak_detection_status and ventilation_status stay NORMAL, so the posture is RESTRICTED and not FROZEN)."
            - "Station.version is re-read after the event so the priority-70 OCC check passes on both attempts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-M-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-M", name: "Posture Yard M", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
