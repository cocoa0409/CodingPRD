          - errors[ERR_SERVICE_NOT_COMPLETABLE]
          - calculations.risk_credit_pct
          - calculations.exposure_score
        distinguishing_aspect: "The PENDING -> ACTIVE transition carries two preconditions; with status PENDING satisfied but the logical clock at 2026-08-01 sitting before effective_from 2026-09-01, completion is refused with ERR_SERVICE_NOT_COMPLETABLE, and the same call succeeds once the clock reaches 2026-09-01, moving risk_credit_pct from 0.00 to 0.08."
        test_recipe:
          setup:
            - "Jurisdiction TX and applicant Bayline Foods LLC (40 headcount, TX 40, 4 separations) exist; exposure_score is 28.00."
            - "RiskManagementService ${svc_id} HOTLINE_SUBSCRIPTION credit_pct 0.08 with window [2026-09-01, 2027-09-01) is PENDING."
