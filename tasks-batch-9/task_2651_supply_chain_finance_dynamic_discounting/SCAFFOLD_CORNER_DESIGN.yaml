          assert:
            - "before the trigger: offer_b_status == COUNTERED and DiscountOffer.${offer_a}.status == NAMED"
            - "err_supplier_on_named == ERR_UNAUTHORIZED with HTTP 403 (not ERR_INVALID_STATE)"
            - "err_admin_on_countered == ERR_UNAUTHORIZED with HTTP 403"
            - "accepted_status == ACCEPTED with accepted_apr_bps == 700 and Invoice.${invoice_b}.status == AWARDED"
            - "DiscountOffer.${offer_a}.status is still NAMED and Invoice.${invoice_a}.status is still OFFERED"

      - name: buyer_admin_cannot_reserve_an_early_payment_segregation_of_duties
