          UPHELD is the one resolution that does NOT return the payable to the discounting programme:
          status becomes MATURED while dispute_suppressed deliberately stays true, and because
          SUPPRESSED invoices were never in the adoption denominator the recompute leaves
          eligible_invoice_count at 1 (the non-suppressed sibling) rather than dropping it to 0.
        test_recipe:
          setup:
            - "One Buyer, one OPEN programme, one Supplier"
            - "One payable file of two rows where the second carries suppression_flag true, so that invoice is SUPPRESSED with an auto-raised BUYER_FILE_SUPPRESSION dispute"
          setup_api_calls:
