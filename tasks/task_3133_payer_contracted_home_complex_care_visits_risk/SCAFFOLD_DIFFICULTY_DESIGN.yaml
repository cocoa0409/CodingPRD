              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 (state), not 403 (business_safety)"
            - "error_id == ERR_VISIT_NOT_SCHEDULED"
            - "error_id != ERR_NOT_ASSIGNED_CLINICIAN"

      - name: business_temporal_sla_check_beats_business_referential_occ_check
        grounds:
          - validations.priority_11_business_temporal
          - validations.priority_13_business_referential
          - errors.ERR_SLA_ALREADY_LAPSED
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          Error-category pair (business_temporal) vs (business_referential).
          Different from the (state) vs (business_safety) pairing above.
          Setup: an UrgentResponseEpisode E in TRIGGERED whose sla_deadline
          has passed. The client attempts POST /urgent-episodes/{id}/dispatch.
          The temporal check fires first → 409 ERR_SLA_ALREADY_LAPSED.
          Companion trigger on the OCC side: a stale expected_member_version
          on POST /members/{id}/enrollments → 412 ERR_STALE_VERSION. The two
          endpoints sit at different priority levels and exercise distinct
          error categories.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment."
            - "Urgent episode EP created at T0 = 2026-09-01T00:00:00Z; sla_deadline = T0 + 24h = 2026-09-02T00:00:00Z."
            - "Clock advanced to 2026-09-03T00:00:00Z (past sla_deadline; episode auto-LAPSED via sweep)."
            - "For the OCC trigger, member M with version N; another writer creates an enrollment, bumping version to N+1."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
