scaffold_corner_design:
- section: entities
  instances:
  - name: account_create_derives_sla_and_starts_active
    claim_type: Creation
    grounds:
    - entities.Account
    - calculations.support_sla_by_plan
    distinguishing_aspect: A BUSINESS account comes back 201 with status ACTIVE, version 1, and support_response_sla_hours == 8 — the SLA derives from the pinned plan matrix, never from input.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - Account.${acc}.status == ACTIVE and version == 1
      - Account.${acc}.support_response_sla_hours == 8 (derived, not from input)
      - meta.api_request_id and meta.api_request_timestamp are present
  - name: zone_create_defaults_and_pending_initial_state
    claim_type: Defaults
    grounds:
    - entities.Zone.fields.status
    - entities.Zone.fields.dos_sensitivity
    - entities.Zone.fields.bot_fight_mode
    distinguishing_aspect: A zone created without optional fields defaults bot_fight_mode=false, dos_sensitivity=DEFAULT, origin_shield_pop_code=null, edge_ttl_seconds=3600 and starts PENDING with empty
      embedded arrays.
    test_recipe:
      setup:
      - PRO account exists.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      trigger:
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: defaults.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      assert:
      - Zone.${zone}.status == PENDING
      - Zone.${zone}.bot_fight_mode == false and dos_sensitivity == DEFAULT
      - Zone.${zone}.origin_shield_pop_code is null, edge_ttl_seconds == 3600, dos_mitigation_active == false
      - dns_records, traffic_rules, ruleset_subscriptions, bot_action_bands, honeypot_paths, bot_classifications are all empty arrays
  - name: zone_get_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - errors.ERR_NOT_FOUND
    - validations[priority=3]
    distinguishing_aspect: A syntactically valid but unallocated zone id on the path yields ERR_NOT_FOUND (404), not a generic 400.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /api/zones/00000000-0000-0000-0000-000000000000
        payload: {}
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404
      - error_id == ERR_NOT_FOUND
  - name: dns_record_txt_proxied_true_rejected
    claim_type: Type Constraints
    grounds:
    - validations[priority=9]
    - errors.ERR_PROXY_STATUS_INVALID
    distinguishing_aspect: Seeding a TXT record with proxied=true at zone creation is rejected with ERR_PROXY_STATUS_INVALID (422); the same flag on an A record passes.
    test_recipe:
      setup:
      - PRO account exists.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      trigger:
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: txt.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: _dmarc
            record_type: TXT
            content: v=DMARC1; p=reject
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_PROXY_STATUS_INVALID (422)
      - no zone named txt.example.com is created
  - name: ipblock_missing_reason_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - validations[priority=5]
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: Omitting the required reason field on ip-block creation returns ERR_INVALID_REQUEST (400) before any state or business rule runs.
    test_recipe:
      setup:
      - PRO account with ACTIVE zone.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: req.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.1
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/ip-blocks
        payload:
          zone_id: ${zone}
          ip: 198.51.100.1
          ip_version: V4
        as: TrustSafetyAnalyst
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (400)
  - name: bot_classification_computed_fields_from_fingerprint
    claim_type: Computed Fields
    grounds:
    - entities.Zone.fields.bot_classifications
    - calculations.bot_classification
    distinguishing_aspect: classification and bot_score are computed by the server; the fingerprint 'fp-m9' deterministically hashes to bot_score 30 and classification HUMAN on a feature-on zone with no
      honeypot hit.
    test_recipe:
      setup:
      - PRO account with ACTIVE zone (bot_classification feature on, no honeypot hits for the ip).
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: computed.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.2
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/zones/${zone}/bot-classifications
        payload:
          request_fingerprint: fp-m9
          verified_crawler: false
          client_ip: 203.0.113.50
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          score: $.data.bot_score
          cls: $.data.classification
          act: $.data.action_taken
      assert:
      - bot_score == 30 (1 + (sum of ASCII bytes of 'fp-m9' mod 99))
      - classification == HUMAN (bot_score == 30 exactly)
      - action_taken == "ALLOW" (no bands, fight mode off)
  - name: zone_creation_requires_existing_account
    claim_type: Parent Relationships
    grounds:
    - entities.Zone.fields.account_id
    - validations[priority=4]
    distinguishing_aspect: Creating a zone with an unallocated account_id returns ERR_NOT_FOUND (404) from FK resolution, not a 201.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /api/zones
        payload:
          account_id: 00000000-0000-0000-0000-000000000000
          domain_name: orphan.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
        as: ZoneAdmin
        as_user_id: 00000000-0000-0000-0000-000000000000
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404
      - error_id == ERR_NOT_FOUND
- section: state_machines
  instances:
  - name: zone_newly_created_starts_pending
    claim_type: initial_state
    grounds:
    - state_machines.Zone
    distinguishing_aspect: A freshly created zone is PENDING; a traffic-hit against it fails with ERR_INVALID_STATE until verify.
    test_recipe:
      setup:
      - PRO account with one PENDING zone (record seeded, not yet verified).
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: initial.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.3
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      trigger:
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T00:00:00Z'
          client_ip: 198.51.100.1
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      assert:
      - Zone.${zone}.status == PENDING at creation
      - traffic-hit on the PENDING zone fails with error_id == ERR_INVALID_STATE
  - name: zone_deleted_is_terminal_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Zone
    - errors.ERR_ALREADY_TERMINAL
    distinguishing_aspect: After DELETE, every further mutation attempt (PATCH cache config) on the DELETED zone fails with ERR_ALREADY_TERMINAL.
    test_recipe:
      setup:
      - PRO account with an ACTIVE zone that is then deleted.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: terminal.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.4
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: DELETE /api/zones/${zone}
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          edge_ttl_seconds: 7200
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ALREADY_TERMINAL (409)
      - Zone.${zone}.status remains DELETED
  - name: ddos_event_double_end_rejected
    claim_type: Idempotency
    grounds:
    - state_machines.DdosEvent.ACTIVATED_to_ENDED
    - errors.ERR_ALREADY_TERMINAL
    distinguishing_aspect: An ACTIVATED DdosEvent ends automatically when the clock reaches expires_at; after that, the zone's dos_mitigation_active is false and a second clock advance changes nothing (terminal
      ENDED is stable).
    test_recipe:
      setup:
      - PRO account, ACTIVE zone with an ACTIVATED DdosEvent (observed 5000, baseline 100, DEFAULT sensitivity -> threshold 2000) created at 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: ddos.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.5
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones/${zone}/ddos-events
        payload:
          observed_rps: 5000
          baseline_rps: 100
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          evt: $.data.id
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T04:00:00Z'
        as: PlatformAdmin
      - call: GET /api/ddos-events
        payload:
          zone_id: ${zone}
        as: PlatformAdmin
        captures:
          st: $.data[0].status
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T05:00:00Z'
        as: PlatformAdmin
      - call: GET /api/ddos-events
        payload:
          zone_id: ${zone}
        as: PlatformAdmin
        captures:
          st2: $.data[0].status
      assert:
      - after the 04:00 advance the event status == ENDED and zone dos_mitigation_active == false
      - a further advance to 05:00 leaves the event ENDED and version unchanged (terminal lockdown; no end endpoint exists)
  - name: drift_cascade_disables_rules_and_bands
    claim_type: cascade_down
    grounds:
    - state_machines.Zone.ACTIVE_to_MOVED
    distinguishing_aspect: The DNS-drift cascade flips every ACTIVE traffic rule and bot band to DISABLED and ends ACTIVATED DDoS events — a single cascade visible on the next zone read.
    test_recipe:
      setup:
      - PRO account, ACTIVE zone with one ACTIVE firewall rule and one ACTIVE bot band.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: casc2.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.6
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: r1
            rule_kind: FIREWALL_FILTER
            expression: (e1)
            action: BLOCK
          bot_action_bands:
          - name: b1
            action: CHALLENGE
            min_score: 30
            max_score: 60
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.6
            proxied: false
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:01:00Z'
        as: PlatformAdmin
      - call: GET /api/zones/${zone}
        payload: {}
        as: PlatformAdmin
        captures:
          st: $.data.status
          rules: $.data.traffic_rules
          bands: $.data.bot_action_bands
      assert:
      - Zone status == MOVED after the drift
      - traffic_rules[0].status == DISABLED and bot_action_bands[0].status == DISABLED
  - name: ipblock_provisional_expiry_without_confirmation
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.IpBlock.PROVISIONAL_to_EXPIRED
    - calculations.block_expiry
    distinguishing_aspect: A PROVISIONAL block not confirmed within its 900-second window auto-expires when the clock advances past expires_at; a later confirm attempt fails with ERR_ALREADY_TERMINAL.
    test_recipe:
      setup:
      - ACTIVE zone; PROVISIONAL block created at 12:00 (expires_at 12:15).
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T12:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: expiry.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.7
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/ip-blocks
        payload:
          zone_id: ${zone}
          ip: 198.51.100.77
          ip_version: V4
          reason: scraping
        as: TrustSafetyAnalyst
        captures:
          blk: $.data.id
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T12:16:00Z'
        as: PlatformAdmin
      - call: POST /api/ip-blocks/${blk}/confirm
        payload: {}
        as: TrustSafetyAnalyst
        captures:
          err: $.data.error_id
      assert:
      - IpBlock.${blk}.status == EXPIRED after the clock advance past 12:15
      - confirm fails with error_id == ERR_ALREADY_TERMINAL (409)
- section: calculations
  instances:
  - name: abuse_trust_priority_category_base_plus_trust
    claim_type: Correct Result
    grounds:
    - calculations.abuse_trust_priority
    distinguishing_aspect: PHISHING with trust 45 scores 845 (800 + 45) and CSAM with trust 72 scores 1072 (1000 + 72) — exact integer addition with the category base table.
    test_recipe:
      setup:
      - PRO account with ACTIVE zone.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: prio.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.8
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/abuse-reports
        payload:
          zone_id: ${zone}
          reporter_email: r1@example.org
          category: PHISHING
          description: d1
          target_url: https://prio.example.com/a
          reporter_trust_score: 45
        as: Anonymous
        captures:
          s1: $.data.priority_score
      - call: POST /api/abuse-reports
        payload:
          zone_id: ${zone}
          reporter_email: r2@example.org
          category: CSAM
          description: d2
          target_url: https://prio.example.com/b
          reporter_trust_score: 72
        as: Anonymous
        captures:
          s2: $.data.priority_score
      assert:
      - first report priority_score == 845
      - second report priority_score == 1072
  - name: managed_ruleset_fp_rate_excludes_disabled_inputs
    claim_type: Input Set Filtering
    grounds:
    - calculations.managed_ruleset_false_positive_rate
    distinguishing_aspect: With 2 DISABLE overrides, 6 ACTIVE traffic rules and 1 DISABLED traffic rule, the rate is 25 (the DISABLED rule is excluded); a replace that reverts one override drops the rate
      to round_half_up(100*1/7) == 14.
    test_recipe:
      setup:
      - BUSINESS account, ACTIVE zone with 2 DISABLE overrides on an ACTIVE subscription, 6 ACTIVE firewall rules and 1 DISABLED firewall rule.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: fprate.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.9
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: t1
            rule_kind: FIREWALL_FILTER
            expression: (e1)
            action: BLOCK
          - name: t2
            rule_kind: FIREWALL_FILTER
            expression: (e2)
            action: BLOCK
          - name: t3
            rule_kind: FIREWALL_FILTER
            expression: (e3)
            action: ALLOW
          - name: t4
            rule_kind: FIREWALL_FILTER
            expression: (e4)
            action: ALLOW
          - name: t5
            rule_kind: FIREWALL_FILTER
            expression: (e5)
            action: BLOCK
          - name: t6
            rule_kind: FIREWALL_FILTER
            expression: (e6)
            action: BLOCK
          - name: t7
            rule_kind: FIREWALL_FILTER
            expression: (e7)
            action: BLOCK
            status: DISABLED
          ruleset_subscriptions:
          - slug: managed-xss
            sensitivity: MEDIUM
            overrides:
            - managed_rule_id: xss-001
              override_action: DISABLE
            - managed_rule_id: xss-002
              override_action: DISABLE
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: GET /api/zones/${zone}
        payload: {}
        as: PlatformAdmin
        captures:
          rate1: $.data.false_positive_rate_pct
      - call: PATCH /api/zones/${zone}
        payload:
          ruleset_subscriptions:
          - slug: managed-xss
            sensitivity: MEDIUM
            overrides:
            - managed_rule_id: xss-001
              override_action: DISABLE
              status: REVERTED
            - managed_rule_id: xss-002
              override_action: DISABLE
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: GET /api/zones/${zone}
        payload: {}
        as: PlatformAdmin
        captures:
          rate2: $.data.false_positive_rate_pct
      assert:
      - rate1 == 25 (2 DISABLE overrides / (2 + 6 ACTIVE rules); the DISABLED rule t7 is excluded)
      - rate2 == 14 (round_half_up(100 * 1 / 7) after reverting one override)
- section: validations
  instances:
  - name: plan_feature_gate_blocks_rate_limit_on_free
    claim_type: Violation → Error
    grounds:
    - validations[priority=11]
    - errors.ERR_PLAN_FEATURE_UNAVAILABLE
    distinguishing_aspect: A FREE account (rate_limiting feature off) adding a RATE_LIMIT rule to its ACTIVE zone fails with ERR_PLAN_FEATURE_UNAVAILABLE (402); the same patch on a PRO account succeeds.
    test_recipe:
      setup:
