          unit_number: TR-9001
          driver_name: D. Okafor
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          equipment_id: $.data.id
      - call: POST /v1/carriers/${carrier_id}/verify-authority
        payload: {}
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/attest-insurance
        payload:
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
