              payload: { common_name: "Cod", code: "COD", target_market_weight_g: 4000, base_daily_growth_g: 4.0, default_processing_yield_pct: 0.55, min_water_temp_c: 0, max_water_temp_c: 12 }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
