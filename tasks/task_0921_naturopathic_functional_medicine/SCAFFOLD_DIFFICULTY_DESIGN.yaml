      - name: dispense_reversal_restores_lot_units_with_no_drift
        grounds:
          - state_machines.Dispense.DISPENSED_to_REVERSED
          - conservation_invariants.dispensary_lot_units
          - calculations.fefo_lot_selection_and_stock
          - entities.ProductLot.fields.quantity_initial
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL LOT UNITS, a different kind of quantity from
          entitlement visits. After dispensing 3 of 20 units and reversing that dispense,
          quantity_initial == quantity_on_hand + sum of DISPENSED quantities holds as
          20 == 20 + 0, and the money side mirrors it with charged 13488 and refunded 13488.
        test_recipe:
          setup:
            - "A CORE member patient with four attested sections and an ACTIVE protocol carrying one item"
            - "A single lot of 20 units expiring 2026-12-31 for a product priced 4995 retail"
            - "One dispense of 3 units already recorded at the MEMBER price (unit 4496, total 13488), leaving 17 on hand"
