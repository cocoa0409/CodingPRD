            - "ModelAgreement.${ma}.status is still ACTIVE, activated_at == 2026-08-05T00:00:00Z and activated_by_user_id == co-1"

      - name: booking_two_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Booking.AUTHORIZED_to_CAPTURED
          - state_machines.Booking.RESERVED_to_CONFIRMED
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_payment_and_fulfillment_dimensions_advance_independently
          rationale: "The named §1.8 instance walks both dimensions and asserts the combined state after each single-dimension write."

      - name: offer_publish_guarded_by_supplier_certification_state
        claim_type: guarded_transitions
        grounds:
