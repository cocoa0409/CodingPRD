  # excluded_because stubs — already exercised by §1.8
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: corner_error_member_suspended_stub
        claim_type: Violation to Error
        grounds: ["errors[ERR_MEMBER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_state_beats_fiscal_on_reservation_create
          rationale: "ERR_MEMBER_SUSPENDED is asserted as the winning error of the state-vs-fiscal §1.8 conflict (and again in cesd)."

      - name: corner_error_outside_window_stub
        claim_type: Violation to Error
        grounds: ["errors[ERR_OUTSIDE_BOOKING_WINDOW]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_temporal_beats_constraint_on_reservation_create
          rationale: "Triggered as the temporal winner; boundary side covered by bpc_booking_window_inclusive_boundary."

      - name: corner_error_no_inventory_stub
        claim_type: Violation to Error
        grounds: ["errors[ERR_NO_INVENTORY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_unittype_aggregate_capacity_overlap
          rationale: "ERR_NO_INVENTORY is the asserted outcome of the UnitType aggregate-capacity overlap instance."

      - name: corner_error_member_date_overlap_stub
        claim_type: Violation to Error
        grounds: ["errors[ERR_MEMBER_DATE_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_member_calendar_single_occupancy_overlap
          rationale: "ERR_MEMBER_DATE_OVERLAP is the asserted outcome of the member single-occupancy overlap instance."

  - section: calculations
    instances:
      - name: corner_reservation_point_cost_stub
        claim_type: Correct Result
        grounds: [calculations.reservation_point_cost]
        excluded_because:
          difficulty_instance: combinatorial_formula / cf_reservation_point_chart_mode_a
          rationale: "Seasonal/day-class point-chart correctness is the §1.8 mode-(a) instance."

      - name: corner_statement_total_stub
        claim_type: Correct Result
        grounds: [calculations.maintenance_statement_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / cf_statement_total_nested_rounding_mode_b
          rationale: "Per-line rounding total is the §1.8 mode-(b) instance."
