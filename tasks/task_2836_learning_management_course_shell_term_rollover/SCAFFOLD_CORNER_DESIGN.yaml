          assert:
            - "${life0} == PLANNING, ${post0} == NORMAL and ${v0} == 1"
            - "${err_early} == ERR_INVALID_STATE_TRANSITION at 409 — NORMAL -> ELEVATED needs lifecycle IN {IN_SESSION, FINALS, GRADING}; the two dimensions are independent but not unguarded"
            - "${v_after_reject} == 1 and ${post_after_reject} == NORMAL — a rejected dimension change is a no-op on the shared version counter"
            - "${v1} == 2 and ${v2} == 3 with ${post_mid} == NORMAL — lifecycle moves left the posture alone"
            - "${post1} == ELEVATED with ${life_mid} == IN_SESSION and ${v3} == 4"
            - "${life1} == FINALS with ${post2} == ELEVATED and ${v4} == 5 — lifecycle advanced while the posture stayed ELEVATED"
            - "${post3} == NORMAL with ${life2} == FINALS and ${v5} == 6 — the posture returned home without rewinding the lifecycle"
            - "${life3} == GRADING with ${post4} == NORMAL and ${v6} == 7 — one counter, two dimensions, seven writes"

