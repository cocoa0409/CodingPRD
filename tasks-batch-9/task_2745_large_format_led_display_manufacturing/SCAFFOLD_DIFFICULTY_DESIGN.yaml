            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 120.00, wind_load_kph: 110, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev2: $.data.id }
            - call: "POST /drawing-revisions/${rev2}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv1: $.data.version }
          trigger:
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${cabv1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 130.00, wind_load_kph: 120, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
          assert:
            - "DrawingRevision.${rev1}.revision_number == 1 and DrawingRevision.${rev1}.revision_state == REJECTED and DrawingRevision.${rev1}.rejection_reason == 'Cable tray clashes with the ceiling grid'"
            - "DrawingRevision.${rev2}.revision_number == 2 and DrawingRevision.${rev2}.revision_state == APPROVED"
            - "DisplayProject.${pj}.approved_revision_number == 2"
            - "after trigger call 1: DisplayProject.${pj}.production_state == IN_ASSEMBLY and DisplayProject.${pj}.engineering_state == APPROVED"
            - "after trigger call 1: Cabinet.${cab}.cabinet_state == POPULATED   # 1 module per cabinet fills the last slot in the same call"
            - "trigger call 2 -> 409 ERR_ENGINEERING_ALREADY_APPROVED"
            - "after trigger call 2: DisplayProject.${pj}.production_state == IN_ASSEMBLY and DisplayProject.${pj}.approved_revision_number == 2   # the rejected write moved neither dimension"

      - name: service_case_fork_approve_vs_deny_divergent_side_effects
        grounds:
          - state_machines.ServiceCase.RESPONDED_to_APPROVED
          - state_machines.ServiceCase.RESPONDED_to_DENIED
          - entities.ServiceCase.fields.denial_reason
          - entities.ServiceCase.fields.resolved_faulty_module_id
          - calculations.faulty_module_selector
        distinguishing_aspect: |
          A branching fork out of one state where the two edges write disjoint
          field sets: APPROVE computes credit_cents, pins assessment_basis and
          resolves a faulty module, while DENY writes denial_reason and leaves
          all three null with credit_cents 0. Both target states are terminal or
          near-terminal, so re-issuing the same trigger is rejected. Different
          entity again from Module (self-loop) and DisplayProject (parallel).
